version: 2

# Dependabot scope:
#  - npm (root) — wrangler + a few legacy deps
#  - npm (frontend) — React/Vite/Tailwind SPA
#  - npm (cloudflare-worker) — Hono + Workers types (PRODUCTION dep tree)
#  - npm (cloudflare-worker-tail) — wrangler tail consumer (dev/deploy tooling)
#  - pip (root) — FastAPI dev backend
#  - github-actions — keep CI actions current
#
# Strategy: weekly cadence (low PR noise), grouped by ecosystem so security
# patches don't get drowned out by minor bumps. Production deps (frontend +
# worker) get higher PR limits than dev-only.
#
# Cooldown: every ecosystem waits 7 days after a release is published before
# opening a bump PR, so freshly-cut (and occasionally yanked/broken) releases
# have time to settle before they hit CI.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    labels: ['deps', 'ci']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      root-npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['deps']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router-dom']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      build:
        patterns: ['vite', '@vitejs/*', 'autoprefixer']
      runtime:
        patterns: ['*']
        exclude-patterns: ['react*', 'tailwindcss*', '@tailwindcss/*', 'vite*', '@vitejs/*']
        update-types: ['minor', 'patch']
    labels: ['deps', 'frontend']

  - package-ecosystem: npm
    directory: /cloudflare-worker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      worker:
        patterns: ['hono', '@hono/*', '@cloudflare/*', 'wrangler']
      runtime:
        patterns: ['*']
        exclude-patterns: ['hono', '@hono/*', '@cloudflare/*', 'wrangler']
        update-types: ['minor', 'patch']
    labels: ['deps', 'worker', 'production']

  - package-ecosystem: npm
    directory: /cloudflare-worker-tail
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tail-worker:
        patterns: ['*']
    labels: ['deps', 'worker']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # pydantic-core is not an independently choosable dependency: every
      # pydantic release pins the ABI-matched core build with `==` (2.13.4
      # requires exactly 2.46.4). requirements.txt is a flat `uv export`, so
      # dependabot sees the transitive pin as its own top-level line and bumps
      # it alone — which makes the file unresolvable and takes out both python
      # CI jobs (`pip install -r` and `pip-audit -r` each die with
      # ResolutionImpossible). That has now happened twice: fixed in #255, then
      # reintroduced verbatim three days later by the python group in #284.
      # Leave it to follow pydantic; re-export with uv when pydantic moves.
      - dependency-name: pydantic-core
    labels: ['deps', 'dev-backend']
