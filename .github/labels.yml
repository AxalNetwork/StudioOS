# The labels the agents' task protocol runs on (AGENTS.md; DECISIONS.md D503).
# It also holds Dependabot's labels (.github/dependabot.yml), and the
# support-ticket triage labels (AGENTS.md, "Support-ticket triage"; D543).
#
# .github/workflows/labels-sync.yml creates each label below, or updates its
# colour and description, on a push to main that changes this file. It never
# deletes a label: taking an entry out of this file leaves that label on
# GitHub as it was, on every issue that carries it.
#
# One flat entry per label: name, color (six hex digits, no '#') and
# description. Quote every value — unquoted, 5319E7 is a number in YAML.

- name: "state:ready"
  color: "0E8A16"
  description: "Ready for its slot to claim"
- name: "state:in-progress"
  color: "FBCA04"
  description: "Claimed; work under way"
- name: "state:blocked"
  color: "B60205"
  description: "Blocked; the STATUS comment says on what"
- name: "state:review"
  color: "1D76DB"
  description: "Draft PR open; CI and review"
- name: "needs-decision"
  color: "D93F0B"
  description: "Waiting on the owner's call"
- name: "needs-design"
  color: "C5DEF5"
  description: "Waiting on a Claude Design canvas for a screen"
