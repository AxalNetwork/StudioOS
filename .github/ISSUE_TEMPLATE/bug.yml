name: Bug
description: Something does not work as it should. Not for security vulnerabilities.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security vulnerability does not go here. Report it privately through a security advisory: https://github.com/AxalNetwork/StudioOS/security/advisories/new

        This repository is public. Remove secrets, tokens and personal data from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as …
        2. Open …
        3. …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, route, file or workflow run.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, screenshots or the failing test. Remove secrets, tokens and personal data first.
