name: "Axal StudioOS CodeQL config"

# Exclude generated/pasted trees from analysis. These are NOT hand-written
# source and produce the large majority of code-scanning noise:
#   - docs/**          : committed Vite/Rollup build output (minified bundles),
#                        the studioos Worker's [assets] directory on axal.vc and
#                        app.axal.vc (nothing else serves it: GitHub Pages and
#                        the Cloudflare Pages mirror are both retired).
#                        Regenerated by `npm run build`.
#   - attached_assets/**: pasted attachments (Pasted-*.txt, decks, docs) —
#                        meta/prompt text and example values, not live code.
#
# Real hand-written source (frontend/**, cloudflare-worker/**, backend/**)
# and all test directories remain fully in scope.
paths-ignore:
  - docs
  - attached_assets
  # Generated dc-runtime bundle + imported .dc.html document pages and their
  # uploads. NOT hand-written source (support.js header: "GENERATED ... do
  # not edit"); fixes belong in dc-runtime/src, not the bundle.
  - spin-out-lab-pipeline
  # Claude Design canvases (design/canvases/). The same
  # dc-runtime export as the tree above — its support.js carries a
  # byte-identical "GENERATED from dc-runtime/src/*.ts — do not edit"
  # header — 110 .dc.html pages plus the bundle, ~83k lines. Nothing
  # references this tree: not wrangler.toml, vite.config.js,
  # build-frontend.mjs or package.json, and none of it reaches docs/. It
  # is never built, bundled or served. Canvases are ported INTO
  # frontend/src/ by hand, and that ported code is scanned like any other
  # source. Quoted because the directory name contains spaces.
  - "design/canvases"
  # The intake queue the same exports land in before triage
  # (design/incoming/README.md). Identical material to the tree above and
  # under the same rule — never built, bundled or served, ported into
  # frontend/src/ by hand and scanned there — but it holds the .dc.html pages
  # WITHOUT a copy of the bundle, so the parity guard's bundle-header test
  # could not see it until it learned to read the .dc.html extension too.
  - "design/incoming"
