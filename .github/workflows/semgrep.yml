name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["main"]
  schedule:
    - cron: '31 0 * * 4'

permissions:
  contents: read
  security-events: write
  actions: read

# Match CodeQL's main/schedule coalescing and cancel superseded PR scans.
concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Static-analysis scan using the official Semgrep CLI with public OSS rule
# packs. We deliberately do NOT use `semgrep ci` (which requires a paid
# Semgrep AppSec Platform token via SEMGREP_APP_TOKEN). The previous
# workflow used the long-deprecated `returntocorp/semgrep-action` and
# required SEMGREP_APP_TOKEN + SEMGREP_DEPLOYMENT_ID secrets which were
# never set on this repo — that's why every run was red.
#
# Findings go to the Security tab by SARIF upload where code scanning takes
# one, and are always listed in this job's summary page. D672 stopped the
# upload while the repository was private and code scanning needed GitHub
# Code Security; D718 restored it once the repository was public, where code
# scanning is free. The `visibility` job now decides on every run (D721). The
# summary stays because the agents that fix findings cannot read the
# code-scanning API. To stop running Semgrep entirely, delete this file — no
# other workflow depends on it.
#
# WHAT THIS JOB'S RED/GREEN MEANS, because it used to mean nothing.
# Findings do NOT fail it: there are ~40 standing ones and the summary is
# how they are reported, not the exit code. A SCANNER THAT COULD NOT RUN
# does fail it, and then nothing is reported. See the two comments below.
jobs:
  scope:
    name: security scan scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      scan: ${{ steps.scope.outputs.scan }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Verify prior-run artifact read permission
        run: node scripts/scan-scope.mjs verify-artifact-read
      - name: Select scan scope
        id: scope
        run: node scripts/scan-scope.mjs scope

  # D721: ask, do not assume, whether code scanning takes an upload. It is
  # free on a public repository and needs GitHub Code Security on a private
  # one, which this repository does not have. The repository has been both
  # (private under D672, public under D718, private again on 2026-10-18), and
  # an upload it refuses turns this check red on every PR. The same job is in
  # codeql.yml and semgrep.yml; code_scanning_visibility_d721.test.mjs keeps
  # the two identical and runs its step.
  visibility:
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    name: code scanning takes uploads?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upload: ${{ steps.ask.outputs.upload }}
    steps:
      - name: Ask the repository API
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # code_security reads "unknown" when this token cannot see it.
          answer="$(gh api "repos/$GITHUB_REPOSITORY" --jq '[.private, (.security_and_analysis.code_security.status // "unknown")] | map(tostring) | join(" ")')"
          case "$answer" in
            "false "*|"true enabled")
              echo "upload=always" >> "$GITHUB_OUTPUT"
              ;;
            "true "*)
              echo "upload=never" >> "$GITHUB_OUTPUT"
              echo "::notice::This repository is private and code scanning is off, so the findings are in the job summary only (D721)."
              ;;
            *)
              echo "::error::The repository API answered '$answer' for private and code_security."
              exit 1
              ;;
          esac

  scan:
    name: Scan
    needs: [scope, visibility]
    if: needs.scope.outputs.scan == 'true'
    runs-on: ubuntu-latest
    # The scan itself takes ~4m40s on this repo and the rule packs grow. A
    # timeout is a cancellation, and a cancelled job used to still reach the
    # upload below (`always()` runs on cancel) — so the cap was one of the
    # paths that could wipe the alert history. Headroom is free; keep it.
    timeout-minutes: 20
    container:
      # PINNED BY DIGEST, like every `uses:` in this directory. `:latest`
      # moved the scanner under us twice — GOTCHAS.md records both as finding
      # counts changing with no repo change at all.
      #
      # THE PIN IS HALF THE STORY. The three `--config p/...` packs below are
      # still fetched from semgrep.dev at run time, so this narrows ruleset
      # drift to the engine and does not close it. Closing it needs the packs
      # vendored into the repo, which is its own decision.
      #
      # PULLED FROM mirror.gcr.io, NOT DOCKER HUB. From 2026-10-09 ~20:50Z
      # every run died at "Initialize containers": Docker Hub answered the
      # shared runners with `toomanyrequests` (the unauthenticated pull
      # limit), then auth.docker.io timed out. The job never reached the
      # scan, so main and every PR went red with no repo change. Google's
      # Docker Hub mirror serves the same image under the same digest, and
      # a digest pins the bytes, not the registry: what runs is identical.
      # If the mirror ever misses this digest, drop the `mirror.gcr.io/`
      # prefix and keep the digest.
      image: mirror.gcr.io/semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823  # 1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Run semgrep (public OSS rules)
        # Path exclusions for generated/pasted trees live in the ROOT-ANCHORED
        # .semgrepignore (/docs/, /attached_assets/, and three more) which
        # semgrep reads from the working directory. We deliberately avoid
        # `--exclude docs` here: bare `--exclude` matches by basename
        # project-wide and would also strip real source dirs
        # (frontend/src/pages/docs, .../lib/docs).
        #
        # NO `--error`, AND THAT IS THE POINT. With it semgrep exits 1 on any
        # finding, so this step ended EVERY run with
        # `##[error]Process completed with exit code 1` — including the runs
        # where it had just printed "Scan completed successfully". A crash and
        # the steady state printed the same line, so the exit code carried no
        # information. Measured on semgrep 1.176.1 without it: findings -> 0,
        # no findings -> 0, fatal/bad config -> 7, unreachable registry -> 2.
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif
      # Semgrep's console output and its SARIF output disagree about inline
      # suppressions. The run above prints e.g. "40 findings" (suppressed ones
      # dropped), but the SARIF it wrote still contains every `# nosemgrep:`
      # finding, tagged `"suppressions": [{"kind": "inSource"}]`. GitHub code
      # scanning opens an alert for those anyway — which is why annotated lines
      # like backend/app/models/migrations.py:2793 came back as open "Error"
      # alerts with the silencing comment visible in the reported snippet.
      #
      # Strip them so the report matches the finding count semgrep printed.
      # (sarif-summary.py skips suppressed results too; this step keeps the
      # SARIF itself honest for anyone who reads it.)
      - name: Drop nosemgrep-suppressed results from SARIF
        run: |
          # `semgrep` is itself a Python console script, so this image ships an
          # interpreter. Resolve it rather than hardcoding `python3`, since the
          # image layout is not ours to depend on.
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/strip-suppressed-sarif.py semgrep.sarif
      # NO `if: always()` ON ANY OF THESE THREE STEPS.
      #
      # A fatally-failed semgrep still writes a SARIF — measured on 1.176.1, a
      # bad config exits 7 having written a structurally VALID file,
      # `runs[0].tool.driver.name` = "Semgrep OSS", with zero results. That
      # payload is indistinguishable from a legitimate clean scan, so no
      # amount of inspecting the file can tell them apart: ONLY THE EXIT CODE
      # CAN. A report built from it would read "0 findings" after a scan that
      # never ran.
      #
      # So all three take the default `if: success()`. A scan that failed,
      # was cancelled, or timed out stops here and the job goes red. The
      # upload matters most: a SARIF upload REPLACES the tool's alert set for
      # the ref, so a resultless payload would close every open alert as
      # "fixed".
      - name: Upload SARIF
        # No status function, so the default success() still applies (D721):
        # this only adds "and code scanning takes uploads".
        if: needs.visibility.outputs.upload == 'always'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        # No `category`, as before D672, so this upload replaces the alert set
        # the old uploads left open instead of starting a second one.
        with:
          sarif_file: semgrep.sarif
      - name: Report findings
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/sarif-summary.py "Semgrep" semgrep.sarif
      - name: Save opaque finding fingerprints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/scan-scope.mjs snapshot semgrep semgrep.sarif .scan-fingerprints/semgrep.json
      - name: Upload finding fingerprints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-fingerprints-semgrep
          path: .scan-fingerprints/semgrep.json
          if-no-files-found: error
          retention-days: 90

  findings:
    name: main scan findings
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    # Both scanners update the same incident; never race its creation/closure.
    concurrency:
      group: scan-main-findings
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-fingerprints-semgrep*
          path: .scan-input
          merge-multiple: true
      - name: Compare with the previous completed main scan
        run: node scripts/scan-scope.mjs prepare semgrep .scan-input .scan-state
      - name: Retain the scan baseline and outstanding fingerprints
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-state-semgrep
          path: .scan-state/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Reconcile one main scan alert
        env:
          SCAN_FACTS_FILE: .scan-state/facts.json
        run: node scripts/github-alerts.mjs scan
