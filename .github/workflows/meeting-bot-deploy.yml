name: Meeting bot deploy

on:
  push:
    branches: [main]
    paths:
      - 'meeting-bot/**'
      - 'wrangler.meeting-bot.toml'
      - '.github/workflows/meeting-bot-deploy.yml'
      - 'cloudflare-worker/src/services/meetingBotRuntime.ts'
      - 'cloudflare-worker/src/util/doNamespace.ts'
      - 'cloudflare-worker/src/types.ts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: meeting-bot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Owner enables this only after the isolated first-deploy steps in PRODUCTION.md.
    if: github.repository == 'AxalNetwork/StudioOS' && github.ref == 'refs/heads/main' && vars.MEETING_BOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Verify the exact main candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-production-candidate.mjs "$GITHUB_SHA" --wait
      - run: npm ci --prefix cloudflare-worker
      - name: Build and verify image before any deployment
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-meeting-bot-image.mjs
      - name: Recheck the candidate before publishing the bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-production-candidate.mjs "$GITHUB_SHA" --once
      - name: Validate owner-approved preview configuration before deployment
        env:
          MEETING_BOT_PREVIEW_SECRET: ${{ secrets.MEETING_BOT_PREVIEW_SECRET }}
          MEETING_BOT_PREVIEW_ORIGIN: ${{ vars.MEETING_BOT_PREVIEW_ORIGIN }}
          MEETING_BOT_PREVIEW_ROUTE_VERIFIED: ${{ vars.MEETING_BOT_PREVIEW_ROUTE_VERIFIED }}
        run: node --experimental-strip-types --no-warnings scripts/verify-meeting-bot-preview.mjs --preflight
      - name: Deploy preview bot host only
        env:
          MEETING_BOT_PREVIEW_ORIGIN: ${{ vars.MEETING_BOT_PREVIEW_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MEETING_BOT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cloudflare-worker/node_modules/.bin/wrangler deploy --config wrangler.meeting-bot.toml --env preview --var "MEETING_BOT_VERSION:${GITHUB_SHA}" --var "PREVIEW_CANARY_ENABLED:on" --var "PREVIEW_CANARY_ORIGIN:${MEETING_BOT_PREVIEW_ORIGIN}"
      - name: Verify deployed preview callback before normal promotion
        env:
          MEETING_BOT_PREVIEW_SECRET: ${{ secrets.MEETING_BOT_PREVIEW_SECRET }}
          MEETING_BOT_PREVIEW_ORIGIN: ${{ vars.MEETING_BOT_PREVIEW_ORIGIN }}
          MEETING_BOT_PREVIEW_ROUTE_VERIFIED: ${{ vars.MEETING_BOT_PREVIEW_ROUTE_VERIFIED }}
        run: node --experimental-strip-types --no-warnings scripts/verify-meeting-bot-preview.mjs
      - name: Recheck the candidate after preview verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-production-candidate.mjs "$GITHUB_SHA" --once
      - name: Promote verified revision to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MEETING_BOT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: cloudflare-worker/node_modules/.bin/wrangler deploy --config wrangler.meeting-bot.toml --env "" --var "MEETING_BOT_VERSION:${GITHUB_SHA}"
      - name: Retain sanitized deployed preview result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeting-bot-preview-result
          path: /tmp/meeting-bot-preview-receipt.json
          if-no-files-found: warn
          retention-days: 7
