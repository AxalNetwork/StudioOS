# D7886 (#7886): staged trusted reusable Worker executor. No caller cutover or live authority is enabled here.
name: Trusted Worker executor
run-name: "Worker executor | ${{ inputs.request_id }} | ${{ inputs.part }} | generation ${{ inputs.generation }}"

on:
  workflow_call:
    inputs:
      request_id:
        type: string
        required: true
      generation:
        type: string
        required: true
      part:
        type: string
        required: true
      profile:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque durable coordinator request (not authority)
        type: string
        required: true
      generation:
        description: Exact current lease generation
        type: string
        required: true
      part:
        description: Existing logical Worker shard
        type: string
        required: true
      profile:
        description: Reviewed capability profile
        type: choice
        options: [hosted, linux-x64, macos-arm64]
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write # Reserved for the reviewed #7887 OIDC receipt exchange; no App/provider credentials.

concurrency:
  group: runner-executor-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit immutable Worker execution
    # Stage one: only a main definition can dispatch. No branch-local workflow caller is enabled.
    if: >-
      github.repository == 'AxalNetwork/StudioOS' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RUNNER_EXECUTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.admission.outputs.allowed }}
      target: ${{ steps.admission.outputs.target }}
      job_timeout: ${{ steps.admission.outputs.job_timeout }}
      test_timeout: ${{ steps.admission.outputs.test_timeout }}
      node_version: ${{ steps.admission.outputs.node_version }}
      python_version: ${{ steps.admission.outputs.python_version }}
      executor_sha: ${{ steps.identity.outputs.executor_sha }}
      child_workflow_sha: ${{ steps.identity.outputs.child_workflow_sha }}
      child_workflow_path: ${{ steps.identity.outputs.child_workflow_path }}
    steps:
      - name: Verify signed GitHub executor identity
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              const crypto = require('node:crypto');
              const token = await core.getIDToken('studioos-runner-executor-v1');
              core.setSecret(token);
              const pieces = token.split('.');
              if (pieces.length !== 3 || pieces.some(p => !/^[A-Za-z0-9_-]+$/.test(p)) || token.length > 20000) throw Error();
              const header = JSON.parse(Buffer.from(pieces[0], 'base64url'));
              const claims = JSON.parse(Buffer.from(pieces[1], 'base64url'));
              if (header.alg !== 'RS256' || typeof header.kid !== 'string') throw Error();
              const response = await fetch('https://token.actions.githubusercontent.com/.well-known/jwks', { redirect: 'error', signal: AbortSignal.timeout(10000) });
              if (!response.ok) throw Error();
              const keys = (await response.json()).keys.filter(k => k.kid === header.kid && k.kty === 'RSA' && k.use === 'sig');
              if (keys.length !== 1 || !crypto.verify('RSA-SHA256', Buffer.from(pieces[0] + '.' + pieces[1]), crypto.createPublicKey({ key: keys[0], format: 'jwk' }), Buffer.from(pieces[2], 'base64url'))) throw Error();
              const now = Math.floor(Date.now() / 1000);
              if (claims.iss !== 'https://token.actions.githubusercontent.com' || claims.aud !== 'studioos-runner-executor-v1' || !Number.isSafeInteger(claims.exp) || claims.exp <= now || claims.exp > now + 600 || !Number.isSafeInteger(claims.nbf) || claims.nbf > now + 30) throw Error();
              if (claims.repository !== 'AxalNetwork/StudioOS' || String(claims.run_id) !== process.env.GITHUB_RUN_ID || String(claims.run_attempt) !== process.env.GITHUB_RUN_ATTEMPT || claims.event_name !== 'workflow_dispatch' || claims.ref !== 'refs/heads/main') throw Error();
              const own = 'AxalNetwork/StudioOS/.github/workflows/runner-executor.yml@refs/heads/main';
              const wrapper = 'AxalNetwork/StudioOS/.github/workflows/runner-dispatch.yml@refs/heads/main';
              if (![own, wrapper].includes(claims.workflow_ref) || !/^[a-f0-9]{40}$/.test(claims.workflow_sha)) throw Error();
              let executor = claims.workflow_sha;
              if (claims.job_workflow_ref) {
                const match = /^AxalNetwork\/StudioOS\/\.github\/workflows\/runner-executor\.yml@([a-f0-9]{40})$/.exec(claims.job_workflow_ref);
                if (!match || (claims.job_workflow_sha && claims.job_workflow_sha !== match[1])) throw Error();
                executor = match[1];
              } else if (claims.workflow_ref !== own) throw Error();
              core.setOutput('executor_sha', executor);
              core.setOutput('child_workflow_sha', claims.workflow_sha);
              core.setOutput('child_workflow_path', claims.workflow_ref === own ? '.github/workflows/runner-executor.yml' : '.github/workflows/runner-dispatch.yml');
            } catch {
              core.setFailed('Untrusted executor workflow identity');
            }
      - name: Check out trusted executor definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AxalNetwork/StudioOS
          ref: ${{ steps.identity.outputs.executor_sha }}
          path: studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}-control
          persist-credentials: false
      - name: Set up admission Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve the durable receipt and validated profile
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_SHA: ${{ steps.identity.outputs.executor_sha }}
          CHILD_WORKFLOW_SHA: ${{ steps.identity.outputs.child_workflow_sha }}
          CHILD_WORKFLOW_PATH: ${{ steps.identity.outputs.child_workflow_path }}
          REQUEST_ID: ${{ inputs.request_id }}
          LEASE_GENERATION: ${{ inputs.generation }}
          PART: ${{ inputs.part }}
          PROFILE: ${{ inputs.profile }}
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-admission.mjs"
      - name: Remove this admission checkout
        if: always()
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          rm -rf -- "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control"

  worker:
    name: Admitted Worker shard
    needs: admit
    if: needs.admit.outputs.allowed == 'true'
    # The trusted catalog adapter emits one fixed hosted string OR one organization group with AND labels.
    runs-on: ${{ fromJSON(needs.admit.outputs.target || '"ubuntu-latest"') }}
    timeout-minutes: ${{ fromJSON(needs.admit.outputs.job_timeout || '35') }}
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
    steps:
      - name: Check out trusted admission code before any candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AxalNetwork/StudioOS
          ref: ${{ needs.admit.outputs.executor_sha }}
          path: studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}-control
          persist-credentials: false
      - name: Select reviewed native Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ needs.admit.outputs.node_version }}
          package-manager-cache: false
      - name: Select reviewed native Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.admit.outputs.python_version }}
      - name: Prepare only this run's directories
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-execution.mjs" prepare
      - name: Independently admit this exact child before checkout
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_SHA: ${{ needs.admit.outputs.executor_sha }}
          CHILD_WORKFLOW_SHA: ${{ needs.admit.outputs.child_workflow_sha }}
          CHILD_WORKFLOW_PATH: ${{ needs.admit.outputs.child_workflow_path }}
          REQUEST_ID: ${{ inputs.request_id }}
          LEASE_GENERATION: ${{ inputs.generation }}
          PART: ${{ inputs.part }}
          PROFILE: ${{ inputs.profile }}
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-admission.mjs"
      - name: Check out only the admitted immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AxalNetwork/StudioOS
          ref: ${{ steps.admission.outputs.source_sha }}
          path: studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}-source
          persist-credentials: false
      - name: Download the authenticated parent's exact plan
        if: steps.admission.outputs.plan_mode == 'parent-artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.admission.outputs.plan_artifact_id }}
          run-id: ${{ steps.admission.outputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}/parent-plan
          merge-multiple: true
      - name: Verify runtime and exact plan before candidate dependency scripts
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_SHA: ${{ needs.admit.outputs.executor_sha }}
          CHILD_WORKFLOW_SHA: ${{ needs.admit.outputs.child_workflow_sha }}
          CHILD_WORKFLOW_PATH: ${{ needs.admit.outputs.child_workflow_path }}
          ADMITTED_JSON: ${{ steps.admission.outputs.admitted_json }}
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-execution.mjs" verify-plan
      - name: Install admitted Worker dependencies
        working-directory: studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}-source/cloudflare-worker
        run: npm ci
      - name: Install admitted root dependencies
        working-directory: studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}-source
        run: npm ci
      - name: Run admitted Worker shard
        id: tests
        timeout-minutes: ${{ fromJSON(needs.admit.outputs.test_timeout || '26') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTOR_SHA: ${{ needs.admit.outputs.executor_sha }}
          CHILD_WORKFLOW_SHA: ${{ needs.admit.outputs.child_workflow_sha }}
          CHILD_WORKFLOW_PATH: ${{ needs.admit.outputs.child_workflow_path }}
          ADMITTED_JSON: ${{ steps.admission.outputs.admitted_json }}
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-execution.mjs" run
      - name: Upload test traces
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-executor-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studioos-executor-${{ github.run_id }}-${{ github.run_attempt }}/test-traces
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove only this child's files
        if: always()
        run: node "$GITHUB_WORKSPACE/studioos-executor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-control/scripts/ci/runner-execution.mjs" cleanup
