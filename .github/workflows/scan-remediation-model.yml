name: Remediate a code scanning alert with a model

# D6935-p2: the Claude/Codex fallback for one code scanning alert no Autofix
# can fix (every Semgrep alert, and CodeQL alerts without a usable
# suggestion). Started by scan-remediation.yml's sweep, within a daily cap.
#   plan     read-only: the alert is open on main, its file is not protected,
#            no branch holds work for it; builds the model runner's task.
#   resolve  the landing bot's model runner (#6473): primary Claude, Claude 2,
#            Claude 3, then Codex; keys in the `repair` environment only.
#   apply    no model key: re-checks the patch with main's code, commits it to
#            alert-fix-<n> and opens a draft PR into main (or records a
#            compare link when PR creation is not allowed). The owner submits
#            every model-edited PR to the merge queue.
# Lands after #7089: the model runner's workflow and patch checker come from it.

run-name: Model fix for code scanning alert ${{ inputs.alert }}

on:
  workflow_dispatch:
    inputs:
      alert:
        description: One code scanning alert number
        required: true
        type: string

permissions: {}

concurrency:
  group: studioos-scan-remediation-model-${{ inputs.alert }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the fix
    if: github.repository == 'AxalNetwork/StudioOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      task: ${{ steps.plan.outputs.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/scan-remediation
            scripts/landing-bot
            scripts/lib
            scripts/merge-policy.mjs
            merge-control/src/lib
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_ALERT: ${{ inputs.alert }}
        run: node scripts/scan-remediation/model.mjs plan

  resolve:
    name: Ask the model runner
    needs: plan
    if: needs.plan.outputs.decision == 'resolve'
    # The round's edit job asks for these two; a called workflow cannot raise what its caller grants.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/landing-bot-model.yml
    with:
      ref: main
      task: ${{ needs.plan.outputs.task }}

  apply:
    name: Check the patch and open a draft PR
    needs: [plan, resolve]
    if: needs.resolve.outputs.outcome == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: scan-remediation
      deployment: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/scan-remediation
            scripts/landing-bot
            scripts/lib
            scripts/merge-policy.mjs
            merge-control/src/lib
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing-bot-model-patch
          path: ${{ runner.temp }}/patch
      - name: Select GitHub credential
        id: credential
        env:
          APP_ID_CONFIGURED: ${{ secrets.SCAN_REMEDIATION_APP_ID != '' }}
          APP_KEY_CONFIGURED: ${{ secrets.SCAN_REMEDIATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$APP_ID_CONFIGURED" != "$APP_KEY_CONFIGURED" ]]; then
            echo "::error::Configure both scan-remediation App secrets or remove both to use the workflow token."
            exit 1
          fi
          echo "app=$APP_ID_CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Get repository installation token
        if: steps.credential.outputs.app == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.SCAN_REMEDIATION_APP_ID }}
          private-key: ${{ secrets.SCAN_REMEDIATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-security-events: read
      - name: Apply the checked patch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SCAN_ALERT: ${{ inputs.alert }}
          MODEL_TASK: ${{ needs.plan.outputs.task }}
          PATCH_DIR: ${{ runner.temp }}/patch
          SCAN_REMEDIATION_BOT_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
        run: node scripts/scan-remediation/model.mjs apply
