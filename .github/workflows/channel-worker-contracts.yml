name: Channel Worker contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/services/channels/**'
      - 'cloudflare-worker/src/routes/channels.ts'
      - 'cloudflare-worker/src/util/deadline.ts'
      - 'cloudflare-worker/sql/migrations/*channel*'
      - 'cloudflare-worker/test/channels_messaging_d684.test.ts'
      - '.github/workflows/channel-worker-contracts.yml'

permissions:
  contents: read

concurrency:
  group: channel-worker-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Channel messaging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare-worker
      - name: Foundation contracts
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/channels_foundation_d684.test.ts
      - name: Messaging and deadline contracts
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/channels_messaging_d684.test.ts
