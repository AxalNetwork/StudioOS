name: Daily D1 Backup → R2

# Task #5 (IE) — Daily backup cron.
# Exports the production D1 database via `wrangler d1 export`, uploads
# the resulting .sql file to R2 bucket `studioos-backups` under key
# `d1/<database>/backup-YYYY-MM-DD.sql` (flat `d1/backup-…` before
# 2026-09-15; both shapes are read by scripts/dr-drill.sh), and writes a
# heartbeat marker so
# /api/admin/backup-status can show "last successful backup at …".
#
# Schedule: 02:10 UTC daily. RPO commitment: 24 hours.
#
# Object lifecycle (configured one-time in the Cloudflare dashboard,
# NOT here):
#   - Object lock: compliance mode, 365-day retention.
#   - Lifecycle: transition to Standard-IA after 30 days.
#   - Delete after 365 days.
# See documentation/operations/INCIDENT_RESPONSE.md § Backups for the dashboard checklist.
#
# D4558 — EACH BACKUP HAS A MANIFEST, KEPT BESIDE IT, NOT IN IT:
# `d1/<database>/backup-YYYY-MM-DD.manifest.json` (scripts/d1-backup-manifest.mjs):
# sha256, size, the export's start time (the recovery point), the Time Travel
# bookmark taken just before, every table's row count and the last applied
# migration. The upload is read back and its sha256 compared before the
# manifest and the heartbeat are written, so a truncated upload never becomes
# "the latest backup". scripts/dr-drill.sh refuses a backup its manifest does
# not vouch for.

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      target_db:
        description: 'D1 database name (default: studioos-db)'
        required: false
        default: 'studioos-db'

permissions:
  contents: read

# Non-secret config only. Cloudflare creds are scoped to the individual
# wrangler steps that consume them (Export / Upload / heartbeat) so they
# aren't exposed to every step in the job.
env:
  TARGET_DB: ${{ github.event.inputs.target_db || 'studioos-db' }}
  BACKUP_BUCKET: studioos-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # D4558: a step's `if:` cannot see its own `env:` (the defect D263 fixed
      # in dr-drill.yml), so the pager step reads this job-level flag.
      PAGER_CONFIGURED: ${{ secrets.PAGER_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight — assert required secrets are set
        # Runs BEFORE wrangler install so failures are instant and actionable.
        # Secrets are scoped to this step's env: (not hoisted to job level).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=()
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            MISSING+=("CLOUDFLARE_API_TOKEN")
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            MISSING+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Required repo secret(s) are missing or empty: ${MISSING[*]}"
            echo ""
            echo "These must be set as REPOSITORY secrets (not environment-scoped):"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "Required token scopes: D1 export/read + R2 object write."
            echo "See .github/workflows/README.md for the full triage guide."
            exit 1
          fi
          # Non-blocking sanity check: account ID should be 32 lowercase hex chars.
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID does not look like a 32-char hex string ('${CLOUDFLARE_ACCOUNT_ID:0:6}…'). Wrangler may reject it. Verify the value in repo Settings → Secrets."
          fi
          echo "Preflight OK — both secrets are present."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm i -g wrangler@latest

      - name: Compute backup filename
        id: name
        run: |
          DATE=$(date -u +%F)
          echo "filename=backup-${DATE}.sql" >> "$GITHUB_OUTPUT"
          # KEYED BY DATABASE. `target_db` has been an input since this
          # workflow was written, but the key was not: running it for a
          # second database wrote over the first one's backup for that
          # day, and the heartbeat would still read "last successful
          # backup at …". One prefix per database keeps them apart.
          echo "key=d1/${TARGET_DB}/backup-${DATE}.sql" >> "$GITHUB_OUTPUT"

      - name: Record the Time Travel bookmark before the export
        id: bookmark
        # Read-only. The bookmark names the database's state just before the
        # export started; D1 Time Travel can restore to it for 30 days. A
        # bookmark that cannot be read is recorded as null, never invented.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          BOOKMARK=$(wrangler d1 time-travel info "${TARGET_DB}" --json 2>/dev/null | jq -r '.bookmark // empty' 2>/dev/null || true)
          if [[ ! "${BOOKMARK}" =~ ^[0-9a-f-]{8,128}$ ]]; then
            echo "::warning::The Time Travel bookmark could not be read; the manifest records none."
            BOOKMARK=""
          fi
          echo "bookmark=${BOOKMARK}" >> "$GITHUB_OUTPUT"

      - name: Export D1 → SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pass step outputs via env (never interpolate ${{ … }} straight into
          # the run: shell — keeps these blocks injection-safe and consistent).
          BACKUP_FILENAME: ${{ steps.name.outputs.filename }}
        run: |
          wrangler d1 export "${TARGET_DB}" \
            --remote \
            --output "${BACKUP_FILENAME}"
          ls -lh "${BACKUP_FILENAME}"

      - name: Build the backup's manifest
        env:
          BACKUP_KEY: ${{ steps.name.outputs.key }}
          BACKUP_FILENAME: ${{ steps.name.outputs.filename }}
          EXPORT_STARTED_AT: ${{ steps.bookmark.outputs.started_at }}
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          ARGS=(build "${BACKUP_FILENAME}" manifest.json --key "${BACKUP_KEY}" --db "${TARGET_DB}" --exported-at "${EXPORT_STARTED_AT}")
          [[ -n "${BOOKMARK}" ]] && ARGS+=(--bookmark "${BOOKMARK}")
          node scripts/d1-backup-manifest.mjs "${ARGS[@]}"

      - name: Upload to R2 (studioos-backups)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_KEY: ${{ steps.name.outputs.key }}
          BACKUP_FILENAME: ${{ steps.name.outputs.filename }}
        run: |
          wrangler r2 object put \
            "${BACKUP_BUCKET}/${BACKUP_KEY}" \
            --file "${BACKUP_FILENAME}" \
            --content-type 'application/sql' \
            --remote

      - name: Read the upload back and check it, then upload the manifest
        # The manifest is written only for an object whose bytes match it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_KEY: ${{ steps.name.outputs.key }}
        run: |
          wrangler r2 object get "${BACKUP_BUCKET}/${BACKUP_KEY}" --file readback.sql --remote
          WANT=$(jq -r '.sha256' manifest.json)
          GOT=$(sha256sum readback.sql | cut -d' ' -f1)
          if [[ "${WANT}" != "${GOT}" ]]; then
            echo "::error::The uploaded backup does not match the export (sha256 differs); no manifest or heartbeat is written."
            exit 1
          fi
          rm -f readback.sql
          wrangler r2 object put \
            "${BACKUP_BUCKET}/${BACKUP_KEY%.sql}.manifest.json" \
            --file manifest.json \
            --content-type 'application/json' \
            --remote

      - name: Write D1 heartbeat marker
        # Distinct key (`heartbeat-d1.json`) so the worker's KV
        # heartbeat at `heartbeat-kv.json` can't mask a stale D1 backup
        # and vice-versa. Only written AFTER the R2 put succeeds.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_KEY: ${{ steps.name.outputs.key }}
          BACKUP_FILENAME: ${{ steps.name.outputs.filename }}
        run: |
          cat > heartbeat-d1.json <<EOF
          {
            "at": "$(date -u +%FT%TZ)",
            "source": "gha",
            "kind": "d1",
            "key": "${BACKUP_KEY}",
            "size_bytes": $(stat -c%s "${BACKUP_FILENAME}"),
            "sha256": "$(jq -r '.sha256' manifest.json)",
            "manifest_key": "${BACKUP_KEY%.sql}.manifest.json",
            "exported_at": "$(jq -r '.exported_at' manifest.json)"
          }
          EOF
          wrangler r2 object put \
            "${BACKUP_BUCKET}/heartbeat-d1.json" \
            --file heartbeat-d1.json \
            --content-type 'application/json' \
            --remote

      - name: Notify on failure
        if: failure() && env.PAGER_CONFIGURED == 'true'
        env:
          PAGER_WEBHOOK_URL: ${{ secrets.PAGER_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"⚠️ D1 backup FAILED on ${TARGET_DB} ($(date -u +%FT%TZ))\"}" \
            "${PAGER_WEBHOOK_URL}" || true
