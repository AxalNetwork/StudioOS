name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:42 UTC — catches advisories that land between PRs
    # without bursting CI minutes.
    - cron: '42 3 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

# Analyses both the worker (TS) and the FastAPI dev backend (Python) even
# though FastAPI is not deployed — Python supply-chain issues still hit
# Replit dev sessions.
#
# UPLOADS TO CODE SCANNING AGAIN (D718, reversing D672's upload half). D672
# stopped the upload while the repository was private and code scanning
# needed GitHub Code Security, which was off. The repository is public now,
# where code scanning is free, so the alerts go back to the Security tab.
# That is also the only place Copilot Autofix can propose a fix for them.
# The SARIF is still written to codeql-results/, and the report step still
# lists the findings in the job summary, because the agents that fix them
# cannot read the code-scanning API (it answers 403 to their token).
# Findings never fail the job.
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
      - name: Report findings
        run: python3 scripts/sarif-summary.py "CodeQL (${{ matrix.language }})" codeql-results
