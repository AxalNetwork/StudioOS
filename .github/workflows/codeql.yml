name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:42 UTC — catches advisories that land between PRs
    # without bursting CI minutes.
    - cron: '42 3 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

# Analyses both the worker (TS) and the FastAPI dev backend (Python) even
# though FastAPI is not deployed — Python supply-chain issues still hit
# Replit dev sessions.
#
# NO UPLOAD TO CODE SCANNING (D672). The repository is private, and code
# scanning on a private repository needs GitHub Code Security, which is not
# on: since 2026-10-10 every upload was refused ("Code Security must be
# enabled for this repository to use code scanning") and this job went red
# on every PR. The analysis still runs; its SARIF stays in the workspace and
# scripts/sarif-summary.py lists the findings in the job summary. Findings
# never fail the job, as before. To go back to the Security tab, turn Code
# Security on and delete `upload: never` and the report step.
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          output: codeql-results
      - name: Report findings
        run: python3 scripts/sarif-summary.py "CodeQL (${{ matrix.language }})" codeql-results
