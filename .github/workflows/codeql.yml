name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:42 UTC — catches advisories that land between PRs
    # without bursting CI minutes.
    - cron: '42 3 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

# Requires GitHub Advanced Security on the repo (confirmed enabled by repo
# owner). Analyses both the worker (TS) and the FastAPI dev backend (Python)
# even though FastAPI is not deployed — Python supply-chain issues still hit
# Replit dev sessions.
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          category: '/language:${{ matrix.language }}'
