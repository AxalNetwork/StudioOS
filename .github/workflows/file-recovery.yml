name: Approved file recovery snapshot
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-file-recovery
  cancel-in-progress: false
jobs:
  snapshot:
    # #6650/counsel approval and destination-prefix lock precede activation.
    if: vars.FILE_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Synthetic restore drill
        run: python3 scripts/file-recovery-drill.py
      - name: Snapshot approved record classes and verify every copy
        env:
          FILE_RECOVERY_REGISTRY: ${{ vars.FILE_RECOVERY_REGISTRY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FILE_RECOVERY_SOURCE_ACCESS_KEY_ID: ${{ secrets.FILE_RECOVERY_SOURCE_ACCESS_KEY_ID }}
          FILE_RECOVERY_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.FILE_RECOVERY_SOURCE_SECRET_ACCESS_KEY }}
          FILE_RECOVERY_DESTINATION_ACCESS_KEY_ID: ${{ secrets.FILE_RECOVERY_DESTINATION_ACCESS_KEY_ID }}
          FILE_RECOVERY_DESTINATION_SECRET_ACCESS_KEY: ${{ secrets.FILE_RECOVERY_DESTINATION_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_PAGER: ''
        run: |
          test -n "$FILE_RECOVERY_REGISTRY"
          aws --version
          python3 scripts/file-recovery.py --registry "$FILE_RECOVERY_REGISTRY"
