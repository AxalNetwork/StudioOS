name: Agent Stage A (hosted lifecycle, stubbed inference)

# #4594 (audit R2-11), D4594 parts 2 and 3. Owner-approved 2026-11-12:
# decision 1 = A (a throwaway, dispatch-only run) and 2 = A (the ceilings).
#
# One real agent lifecycle on a throwaway Worker, `studioos-s4594-<run>` on
# workers.dev, over its own D1, KV, queues and DLQs, Workflow, R2 buckets and
# Durable Object namespaces:
#
#   create → provision (migrate-d1 --rehearsal) → seed the #4566 fixtures →
#   deploy the derived, route-free config → the #4566 preflight must answer
#   `isolated` → the Workflow path and the manual sponsor run, each accepted
#   by the synthetic sponsor → reconcile holds, usage and proposals → check
#   the ceilings → delete everything, pass or fail.
#   D4594 part 4: before reconciling, S1's #4555 pass runs a pinned skill three
#   times on the manual path: legacy, then AGENT_SKILL_RUNTIME = cloudflare_sdk
#   (a redeploy that changes only that line), then legacy again.
#
# NEVER PRODUCTION. The config is flat (no [env.*], so the top-level axal.vc
# routes cannot be inherited), has no route, cron, browser or service, and
# `checkFlat` refuses it if it names any production identity. Inference is
# the D4594 part 2 stub (`AGENT_INFERENCE_STUB = "deterministic"`, honoured
# only by a preview Worker). Production stays AGENT_ENGINE=off and
# AGENT_AUTONOMY=manual; nothing here changes either.
#
# CEILINGS (owner decision 2 = A): one lifecycle per path, $0 model spend,
# 60 minutes, at most 1,000 rows added by the agent phase. A ceiling that
# cannot be read stops the run.
#
# DISPATCH ONLY. No schedule and no push trigger: each run creates and
# deletes account resources, so each is a decision.
#
# Its result is HOSTED PLATFORM WITH STUB. It is not provider readiness
# (#4556) and not a production observation.
#
# D8507 (#8507): the run writes a RECEIPT, one line per resource as it is
# created, kept as an artifact even when the job fails. A second job, `sweep`,
# runs `if: always()` (after a pass, a failure, a cancellation or a timeout),
# lists the account's resources and deletes only this run's Stage A names
# (`scripts/lib/stageASweep.mjs`), then fails the workflow unless zero are
# left. A dispatch with `sweep_run_id` set runs the sweep alone, for an
# earlier run. Both jobs check out `github.sha` and the summaries name it.
#
# ENVIRONMENT. Both jobs still name `production-ops`: the preview environment
# and its scoped token are console work under #8063/#8064 that has not been
# done. When the owner has created it, the switch is the two `environment:`
# lines below and nothing else.

on:
  workflow_dispatch:
    inputs:
      sweep_run_id:
        description: 'Sweep only: the GitHub run id of an earlier Stage A run (digits). Empty runs Stage A, then sweeps it.'
        required: false
        default: ''

concurrency:
  group: agent-stage-a
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-a:
    if: ${{ inputs.sweep_run_id == '' }}
    environment: production-ops
    name: one hosted lifecycle per path, then teardown
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare-worker

      # Secrets are scoped to this one step. The script deletes everything it
      # created from its own `finally`, so a failed step still cleans up.
      - name: Stage A
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/agent-stage-a.mjs --run "a${GITHUB_RUN_ID}" --summary "$RUNNER_TEMP/agent-stage-a.json" --receipt "$RUNNER_TEMP/agent-stage-a-receipt.jsonl"

      - name: Summary (counts, states and timings only)
        if: always()
        run: |
          f="$RUNNER_TEMP/agent-stage-a.json"
          if [ -f "$f" ]; then
            { echo '## Agent Stage A (#4594) — HOSTED PLATFORM WITH STUB'; echo; echo "Harness: \`${GITHUB_SHA}\`"; echo; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary was written; the script failed before it could write one.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-stage-a-summary
          path: ${{ runner.temp }}/agent-stage-a.json
          if-no-files-found: warn
          retention-days: 90

      # D8507: the receipt is kept whatever happened, for this run's sweep and for a later one.
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-stage-a-receipt
          path: ${{ runner.temp }}/agent-stage-a-receipt.jsonl
          if-no-files-found: warn
          retention-days: 90

  sweep:
    needs: stage-a
    if: ${{ always() }}
    environment: production-ops
    name: sweep this run's Stage A resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare-worker

      - name: Which run
        id: which
        env:
          SWEEP_RUN_ID: ${{ inputs.sweep_run_id }}
        run: |
          id="${SWEEP_RUN_ID:-$GITHUB_RUN_ID}"
          case "$id" in ''|*[!0-9]*) echo "sweep_run_id must be digits" >&2; exit 1;; esac
          echo "github_run_id=$id" >> "$GITHUB_OUTPUT"

      # The receipt may be absent (the job died before writing one); the listing still decides.
      - name: Fetch the receipt
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-stage-a-receipt
          path: ${{ runner.temp }}/receipt
          run-id: ${{ steps.which.outputs.github_run_id }}
          github-token: ${{ github.token }}

      - name: Sweep
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_ID: ${{ steps.which.outputs.github_run_id }}
        run: node scripts/agent-stage-a-sweep.mjs --run "a${RUN_ID}" --receipt "$RUNNER_TEMP/receipt/agent-stage-a-receipt.jsonl" --summary "$RUNNER_TEMP/agent-stage-a-sweep.json"

      - name: Summary (names and counts only)
        if: always()
        run: |
          f="$RUNNER_TEMP/agent-stage-a-sweep.json"
          {
            echo '## Agent Stage A sweep (#8507)'; echo; echo "Harness: \`${GITHUB_SHA}\`"; echo
            if [ -f "$f" ]; then echo '```json'; cat "$f"; echo '```'; echo; echo "Resources left: $(node -e 'const s=require(process.argv[1]);console.log(s.left ?? "unknown")' "$f")"
            else echo 'No sweep summary was written. Resources left: unknown.'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the sweep summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-stage-a-sweep
          path: ${{ runner.temp }}/agent-stage-a-sweep.json
          if-no-files-found: warn
          retention-days: 90
