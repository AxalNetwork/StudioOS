name: Meeting Worker contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/services/channels/zoom.ts'
      - 'cloudflare-worker/src/services/channels/googleMeet.ts'
      - 'cloudflare-worker/src/services/channels/meetings.ts'
      - 'cloudflare-worker/src/routes/founder_validate_meetings.ts'
      - 'cloudflare-worker/src/integrations/registry.ts'
      - 'cloudflare-worker/test/*meeting*.test.ts'
      - '.github/workflows/meeting-worker-contracts.yml'
permissions:
  contents: read
concurrency:
  group: meeting-worker-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Meeting reliability contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --prefix cloudflare-worker
      - name: Reliability and mutation contracts
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/meeting_reliability_d684.test.ts
      - name: Existing meeting and attach contracts
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/channels_meetings_d684.test.ts cloudflare-worker/test/channels_meeting_attach_d685.test.ts
