name: PR preview

# One Worker per pull request — `studioos-pr-<number>` on workers.dev — built
# from the PR's frontend and served from wrangler.pr-preview.toml, which
# declares NO bindings: a preview can never touch production data, and
# `/api/*` is a 404 there, exactly as it was on the retired Cloudflare Pages
# mirror. D4130 (#4130): drafts get no preview — agents push to a draft many
# times, and each push built and deployed a Worker nobody opened. The first
# build is when the PR is marked ready for review (`ready_for_review`), then
# every push after; a PR that goes back to draft keeps its last preview until
# it closes. Same-repository PRs only, and never for Dependabot.
#
# D7146 (#7146): this workflow runs the pull request's own code, so it holds
# NO secret and no Cloudflare credential. It builds `docs/` and uploads it as
# the `pr-preview-docs` artifact. `.github/workflows/pr-preview-deploy.yml`,
# a `workflow_run` workflow whose file GitHub always reads from `main`, takes
# that artifact as untrusted data (scripts/check-preview-artifact.mjs: static
# files only, capped, no symlink or path traversal), deploys it with main's
# wrangler.pr-preview.toml from the `pr-preview` environment, keeps the sticky
# `<!-- pr-preview -->` comment and deletes the Worker when the PR closes.
#
# The `login-e2e` job runs frontend/tests/e2e/google_popup_signin.spec.js
# (D722) and frontend/tests/e2e/integrations.spec.js (D753, #1992) in
# Playwright's Chromium against this build, served by `wrangler dev` from the
# same wrangler.pr-preview.toml and preview script the deployed Worker runs.
# It cannot wait for the deploy: that starts only after this run completes.
# Both specs stub every /api/* call they make; the job has a read-only token.
#
# Why not Workers preview URLs or Workers Builds: Cloudflare generates none
# for a Worker that implements a Durable Object, and `studioos` implements
# two (documentation/architecture/DECISIONS.md D36). Production is untouched:
# wrangler.toml is never read here, and the apex guards pin that.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  delete-merged-branch:
    name: Delete the merged PR branch
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.draft == false &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Use only the merged workflow and the built-in token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { repository, pull_request: pr } = context.payload;
            const branch = pr.head.ref;
            const mergedHead = pr.head.sha;
            if (branch === 'main' || branch === repository.default_branch ||
                branch.startsWith('claim/') || branch.startsWith('gh-readonly-queue/')) {
              return core.info('Keeping a reserved branch.');
            }

            const { owner, repo } = context.repo;
            const currentBranch = async () => {
              try {
                const response = await github.rest.repos.getBranch({ owner, repo, branch });
                return response.data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const current = await currentBranch();
            if (!current || current.name !== branch || current.commit.sha !== mergedHead) {
              return core.info('Branch already removed, renamed, or updated since merge.');
            }
            if (current.protected !== false) return core.info('Keeping a protected branch.');

            const open = { owner, repo, state: 'open', per_page: 1 };
            const [asHead, asBase] = await Promise.all([
              github.rest.pulls.list({ ...open, head: owner + ':' + branch }),
              github.rest.pulls.list({ ...open, base: branch }),
            ]);
            if (asHead.data.length || asBase.data.length) return core.info('An open PR uses this branch.');

            // GitHub compares the original PR head with the ref inside the deletion itself.
            // This also works when squash or queue merges give main a different SHA.
            try {
              await github.graphql(`
                mutation($input: UpdateRefsInput!) {
                  updateRefs(input: $input) { clientMutationId }
                }`, {
                input: { repositoryId: repository.node_id, refUpdates: [{
                  name: 'refs/heads/' + branch, beforeOid: mergedHead, afterOid: '0'.repeat(40),
                }] },
              });
            } catch (error) {
              const latest = await currentBranch();
              if (latest && latest.name === branch && latest.commit.sha === mergedHead) throw error;
              return core.info('Branch already removed, renamed, or updated during cleanup.');
            }
            core.info('Deleted the merged PR branch.');

  build:
    name: build the preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # The same root build the production deploy runs (Vite + hashed-asset
      # retention + OG prerender), so the preview is the PR's own bytes.
      # docs/ is not committed (D529); this is the only copy there is.
      - name: Build the SPA
        run: npm run build

      # The trusted deploy refuses configuration files and build bookkeeping
      # (scripts/lib/previewArtifact.mjs), so they are left out here; it adds
      # main's own `_headers`.
      - name: Upload docs/ for the trusted deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview-docs
          path: |
            docs/
            !docs/_headers
            !docs/.assetsignore
            !docs/.asset-retention.json
            !docs/.build-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # D722 — the browser half of "Continue with Google" on /login, run in a real
  # Chromium against this pull request's build. The spec serves a stand-in for
  # Google's gsi/client and stubs every /api/auth/google/* route (the preview
  # has no API), so it needs no secret and reaches nothing but the local
  # preview. `wrangler dev` runs the deployed preview's own config and script
  # with no Cloudflare account: no credential is read or needed.
  login-e2e:
    name: /login Google window (Playwright)
    needs: build
    runs-on: ubuntu-latest
    # Use the same preinstalled Chromium and system libraries as the editor
    # visual suite so the preview tests can start without Ubuntu mirrors.
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a # v1.56.1-noble
      options: --user 1001
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      PW_CHROMIUM_PATH: /ms-playwright/chromium-1194/chrome-linux/chrome
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify the pinned Chromium
        run: test -x "$PW_CHROMIUM_PATH" && "$PW_CHROMIUM_PATH" --version | grep -F '141.0.7390.37'

      - name: Build the generated modules (D5612)
        run: node scripts/build-generated.mjs

      - name: Download this run's preview build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-preview-docs
          path: docs

      # The upload leaves `_headers` out; this is the PR's own copy, which Vite
      # copies unchanged from frontend/public/.
      - name: Restore the static headers
        run: cp frontend/public/_headers docs/_headers

      # One step: the local preview lives only as long as the shell that
      # started it. A slow first start (wrangler and workerd download) is
      # waited for, not failed on.
      - name: Run the D722 and D753 specs against the local preview
        run: |
          npx --yes wrangler@4.125.0 dev --config wrangler.pr-preview.toml --ip 127.0.0.1 --port 8787 > wrangler-dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          if ! curl -fsS -o /dev/null --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused "$PLAYWRIGHT_BASE_URL/login"; then
            cat wrangler-dev.log
            echo "::error::the local preview never answered /login"
            exit 1
          fi
          cd frontend
          npx --no-install playwright test tests/e2e/google_popup_signin.spec.js --retries=0
          # D753 (#1992): the Connectors hub, its filter menu, one connector's
          # page and the 390px check. Every /api/* call is stubbed in the spec.
          npx --no-install playwright test tests/e2e/integrations.spec.js --retries=0
