name: Build Worker contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker/src/routes/cycle_build.ts'
      - 'cloudflare-worker/src/routes/integrations.ts'
      - 'cloudflare-worker/src/routes/calendar.ts'
      - 'cloudflare-worker/src/routes/linkedin.ts'
      - 'cloudflare-worker/src/integrations/**'
      - 'cloudflare-worker/sql/migrations/*core_systems*'
      - 'cloudflare-worker/sql/migrations/*integrations_last_error_at*'
      - 'cloudflare-worker/test/build_*_d686.test.ts'
      - '.github/workflows/build-worker-contracts.yml'

permissions:
  contents: read

concurrency:
  group: build-worker-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Build connector and mapping contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare-worker
      # Separate output keeps these contracts readable through the GitHub
      # connector; the full drift job's log exceeds its returned log size.
      # This supplements, and does not replace, the root build and full suite.
      - name: Connector contract
        if: hashFiles('cloudflare-worker/test/build_connectors_d686.test.ts') != ''
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/build_connectors_d686.test.ts
      - name: Mapping and local D1 contract
        if: hashFiles('cloudflare-worker/test/build_systems_d686.test.ts') != ''
        run: node --experimental-strip-types --no-warnings --import ./cloudflare-worker/test/_ts-loader.mjs --test cloudflare-worker/test/build_systems_d686.test.ts

  production-aggregate:
    name: Read-only core-system migration aggregate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/codex/1593-build-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare-worker --no-audit --no-fund
      - name: Read the one required production aggregate
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production D1 credentials are unavailable"
            exit 1
          fi
          if ! npx --no-install wrangler d1 execute studioos-db --config ../wrangler.toml --env production --remote --command "SELECT COUNT(*) AS count FROM project_core_systems WHERE kind = 'product_analytics'" --json > "$RUNNER_TEMP/build-system-aggregate.json" 2> "$RUNNER_TEMP/build-system-aggregate.stderr"; then
            echo "::error::Read-only production D1 aggregate failed"
            exit 1
          fi
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          try {
            const blocks = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/build-system-aggregate.json', 'utf8'));
            const rows = blocks.flatMap(block => block.results || []);
            const count = Number(rows[0]?.count);
            if (rows.length !== 1 || !Number.isSafeInteger(count) || count < 0) throw new Error('invalid aggregate');
            console.log('production_product_analytics_count=' + count);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Production product_analytics mappings: **' + count + '**.\n');
          } catch {
            console.error('Production aggregate response could not be verified.');
            process.exit(1);
          }
          NODE
