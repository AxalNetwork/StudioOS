# D7881 (#7881): one trusted native Mac Worker shard, delegated by CI.
name: MacBook Worker
run-name: "MacBook worker | ${{ inputs.parent_run_id }} | ${{ inputs.parent_run_attempt }} | ${{ inputs.source_sha }} | ${{ inputs.part }}"

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Existing CI run requesting the shard
        type: string
        required: true
      parent_run_attempt:
        description: Exact active attempt of that CI run
        type: string
        required: true
      source_sha:
        description: Exact source commit tested by the parent
        type: string
        required: true
      part:
        description: Existing Worker part
        type: string
        required: true
      queue_base_sha:
        description: Parent merge-group base, empty for a main push
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

# One registered runner executes one job. A racing dispatch may wait briefly;
# its parent cancels it and takes the hosted path after the startup deadline.
concurrency:
  group: studioos-macbook-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Worker shard on MacBook
    if: >-
      github.repository == 'AxalNetwork/StudioOS' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.MACBOOK_WORKER_ENABLED == 'true'
    runs-on:
      group: StudioOS MacBook
      labels: [self-hosted, macOS, ARM64, studioos-macbook]
    timeout-minutes: 28
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
    steps:
      - name: Prepare private Mac directories
        run: |
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          job_temp="$RUNNER_TEMP/macbook-worker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$job_temp/tmp"
          {
            printf 'MACBOOK_TEMP=%s\n' "$job_temp"
            printf 'npm_config_cache=%s/npm\n' "$job_temp"
            printf 'UV_PYTHON_INSTALL_DIR=%s/python\n' "$job_temp"
            printf 'UV_CACHE_DIR=%s/uv\n' "$job_temp"
          } >> "$GITHUB_ENV"

      - name: Set up portable Python installer
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          enable-cache: false
          cache-python: false

      - name: Install temporary Python 3.11
        run: |
          uv python install --no-bin --no-config 3.11
          python_path=$(uv python find --managed-python --no-config 3.11)
          "$python_path" -c 'import platform, sqlite3, sys; assert sys.version_info[:2] == (3, 11); assert platform.machine() == "arm64"; print("Python:", sys.version.split()[0])'
          printf '%s\n' "$(dirname "$python_path")" >> "$GITHUB_PATH"

      # setup-uv can add the user's bin directory to PATH. Select Node last.
      - name: Set up native Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify native runtime and SQLite
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { availableParallelism } from "node:os";
            import { DatabaseSync } from "node:sqlite";
            console.log("Node runtime:", process.version, process.platform, process.arch, process.execPath);
            assert.equal(process.platform, "darwin");
            assert.equal(process.arch, "arm64");
            assert.equal(process.versions.node.split(".")[0], "22");
            const db = new DatabaseSync(":memory:");
            assert.equal(Number(db.prepare("SELECT 1 AS ok").get().ok), 1);
            db.close();
            console.log("Available parallelism:", availableParallelism());
          '
          python3 -c 'import sqlite3, sys; assert sys.version_info[:2] == (3, 11); print("Python SQLite:", sqlite3.sqlite_version)'

      - name: Check out trusted admission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: macbook-control-${{ github.run_id }}-${{ github.run_attempt }}
          sparse-checkout: scripts/ci
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the exact parent and source
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PART: ${{ inputs.part }}
          QUEUE_BASE_SHA: ${{ inputs.queue_base_sha }}
        run: node "$GITHUB_WORKSPACE/macbook-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/ci/macbook-admission.mjs"

      - name: Check out the admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.admission.outputs.source_sha }}
          path: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the parent's exact shard plan
        if: steps.admission.outputs.plan_mode == 'parent-artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.admission.outputs.plan_artifact_id }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true

      - name: Generate the same merge-queue plan
        if: steps.admission.outputs.plan_mode == 'equal-weights'
        working-directory: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/test-drift-parts.mjs --plan --equal-weights

      - name: Install Worker dependencies
        working-directory: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}/cloudflare-worker
        run: npm ci

      - name: Install root dependencies
        working-directory: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm ci

      - name: Confirm the parent still needs this shard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PART: ${{ inputs.part }}
          QUEUE_BASE_SHA: ${{ inputs.queue_base_sha }}
        run: node "$GITHUB_WORKSPACE/macbook-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/scripts/ci/macbook-admission.mjs"

      - name: Run delegated Worker shard
        id: tests
        working-directory: macbook-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          SOURCE_SHA: ${{ steps.admission.outputs.source_sha }}
          SOURCE_REF: ${{ steps.admission.outputs.source_ref }}
          PARENT_EVENT: ${{ steps.admission.outputs.parent_event }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          PART: ${{ inputs.part }}
          QUEUE_BASE_SHA: ${{ steps.admission.outputs.queue_base_sha }}
          TEST_TRACE_DIR: ${{ env.MACBOOK_TEMP }}/test-traces
          TMPDIR: ${{ env.MACBOOK_TEMP }}/tmp
        run: |
          test "$(/usr/bin/git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const event = process.env.PARENT_EVENT === "merge_group"
              ? { merge_group: { base_sha: process.env.QUEUE_BASE_SHA, head_sha: process.env.SOURCE_SHA } } : {};
            writeFileSync(process.env.MACBOOK_TEMP + "/parent-event.json", JSON.stringify(event));
          '
          {
            printf '## Delegated Worker shard\n\nSource: %s\n\nPart: %s\n\n' "$SOURCE_SHA" "$PART"
            printf 'Parent CI run: %s, attempt %s\n\nRunner: %s\n' "$PARENT_RUN_ID" "$PARENT_RUN_ATTEMPT" "$RUNNER_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
          GITHUB_EVENT_NAME="$PARENT_EVENT" \
          GITHUB_EVENT_PATH="$MACBOOK_TEMP/parent-event.json" \
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF="$SOURCE_REF" \
          GITHUB_RUN_ID="$PARENT_RUN_ID" GITHUB_RUN_ATTEMPT="$PARENT_RUN_ATTEMPT" \
            node scripts/test-drift-parts.mjs "$PART" --plan-file suite-plan.json

      - name: Upload Mac test traces
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macbook-worker-traces
          path: ${{ env.MACBOOK_TEMP }}/test-traces
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove this job's files
        if: always()
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          rm -rf -- "$GITHUB_WORKSPACE/macbook-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$GITHUB_WORKSPACE/macbook-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$RUNNER_TEMP/macbook-worker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

