name: Remediate code scanning alerts

# D8074: also Dependabot and secret-scanning alerts (read only through the App credential), the 7-day SLA
# pass, and a weekly counts-only digest. The hourly sweep files a task within an hour of a new alert.
on:
  schedule:
    - cron: '23 * * * *'
    # The weekly digest. scripts/scan-remediation/sla.mjs DIGEST_CRON carries the same string.
    - cron: '41 8 * * 1'
  workflow_dispatch:
    inputs:
      alert:
        description: 'One Code Scanning alert number (leave empty for a backlog sweep)'
        required: false
        type: string
      digest:
        description: 'Send the weekly security digest now instead of reconciling'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  reconcile:
    if: github.repository == 'AxalNetwork/StudioOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: studioos-code-scanning-remediation
      cancel-in-progress: false
    environment:
      name: scan-remediation
      deployment: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Select GitHub credential
        id: credential
        env:
          APP_ID_CONFIGURED: ${{ secrets.SCAN_REMEDIATION_APP_ID != '' }}
          APP_KEY_CONFIGURED: ${{ secrets.SCAN_REMEDIATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$APP_ID_CONFIGURED" != "$APP_KEY_CONFIGURED" ]]; then
            echo "::error::Configure both scan-remediation App secrets or remove both to use the workflow token."
            exit 1
          fi
          echo "app=$APP_ID_CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Get repository installation token
        if: steps.credential.outputs.app == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.SCAN_REMEDIATION_APP_ID }}
          private-key: ${{ secrets.SCAN_REMEDIATION_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-security-events: read
          permission-vulnerability-alerts: read
          permission-secret-scanning-alerts: read
      - name: Reconcile security alerts
        env:
          SCAN_ALERT: ${{ inputs.alert }}
          SCAN_DIGEST: ${{ inputs.digest }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
          # Only the digest run receives the webhook; the hourly sweep never holds it.
          SLACK_GITHUB_WEBHOOK_URL: ${{ (inputs.digest || github.event.schedule == '41 8 * * 1') && secrets.SLACK_GITHUB_WEBHOOK_URL || '' }}
          SCAN_REMEDIATION_BOT_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: node scripts/scan-remediation/run.mjs
