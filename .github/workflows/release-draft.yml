name: Release draft

# Keeps ONE draft GitHub release ready for the owner to publish: the next tag
# (v0.1.0-alpha first, then a minor bump per release at the current stage,
# frontend/src/lib/release.js) and GitHub's generated notes since the last
# published release. Publishing stays the owner's; release-published.yml then
# redeploys so the version beside the logo follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One writer at a time; a newer push supersedes a queued one.
concurrency:
  group: release-draft
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    name: update the release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Test the release rules
        run: node --test scripts/lib/releaseDraft.test.mjs
      - name: Create or update the draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs
