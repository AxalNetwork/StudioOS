name: Cloudflare Pages deploy

# This feeds the `studioos` Cloudflare Pages project (studioos-2p8.pages.dev),
# which serves NO production hostname: since 2026-09-01 (1d320dda9) both
# `axal.vc` and `app.axal.vc` are custom domains of the `studioos` Worker,
# shipped by cloudflare-worker-deploy.yml. This job Direct-Uploads a fresh
# docs/ build to that mirror on every push to main so it stays a copy of what
# the Worker deploy built from the same commit — but a green run here, or a
# "Production" deployment in the Pages dashboard, says nothing about whether
# the Worker shipped. The Pages Git connection is retained for previews only.
# Whether to retire the mirror and this workflow is
# documentation/architecture/UNRESOLVED_ITEMS.md U9.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account containing `studioos`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy studioos Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production SPA
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy docs --project-name studioos --branch main