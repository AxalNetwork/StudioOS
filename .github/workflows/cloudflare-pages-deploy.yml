name: Cloudflare Pages deploy

# The Pages Git connection is retained for previews, but production publishing
# is driven explicitly from GitHub Actions so every push to main has a visible,
# deterministic deploy step and does not depend on a stale Pages webhook.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account containing `studioos`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy studioos Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production SPA
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy docs --project-name studioos --branch main