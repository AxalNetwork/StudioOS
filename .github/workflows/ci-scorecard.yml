name: Daily CI scorecard

on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - run: node scripts/ci-scorecard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SCORECARD_ROWS: ${{ runner.temp }}/ci-scorecard-candidates.json
      # D5973: one row per merge-group head SHA with its classified outcome.
      - name: Keep the candidate rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-scorecard-candidates
          path: ${{ runner.temp }}/ci-scorecard-candidates.json
          if-no-files-found: warn
          retention-days: 30
