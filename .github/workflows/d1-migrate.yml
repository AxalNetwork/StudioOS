name: D1 migrations

# Operator workflow for the production D1 ledger — the same runner
# (`scripts/migrate-d1.mjs`) that `npm run deploy`'s predeploy hook uses, run
# from CI so it does not depend on whose workstation holds wrangler
# credentials. Every mode prints a read-only plan first and again afterwards.
#
#   dry-run             read the live ledger, print the plan, write nothing
#   adopt-and-baseline  a `schema_migrations` of the wrong shape is renamed to
#                       `schema_migrations_legacy` (rows kept), then the
#                       one-time baseline runs. Read the "marked" list it
#                       prints, then run verify-marked.
#   verify-marked       un-mark baselined files whose tables/columns are absent
#                       from the live schema, so `apply` runs them for real
#   apply               apply every pending file, in order, recording each
#
# WHICH DATABASE. Empty `branch` means production (`studioos-db`), which is
# what every mode above was written for. A branch code migrates that
# subsidiary's database instead: the runner's `--branch <code>` target, whose
# config this workflow generates first because it is gitignored build output.
# `adopt-and-baseline` is refused for a branch — a branch database is built by
# `branch-provision.yml` from the baseline, so there is no legacy ledger to
# adopt and nothing to baseline.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — D1:Edit (plus Workers Scripts:Edit for the deploy
#                           workflow, which now runs this same step first)
#   CLOUDFLARE_ACCOUNT_ID — the account holding `studioos-db`

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run | adopt-and-baseline | verify-marked | apply'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - adopt-and-baseline
          - verify-marked
          - apply
      branch:
        description: 'Branch code to migrate instead of production (e.g. fr). Leave empty for production.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One migration run at a time. The deploy workflow's own migration step is in
# its own group; do not dispatch this while a deploy is in flight.
concurrency:
  group: d1-migrate-${{ inputs.branch || 'production' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }} against ${{ inputs.branch && format('studioos-{0}', inputs.branch) || 'studioos-db' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # THE BRANCH CODE IS UNTRUSTED INPUT AND NEVER REACHES A `run:` SCRIPT AS
      # TEXT. `${{ }}` in a run block is substituted before the shell parses the
      # line, so a dispatched value carrying `;` would run as a command with
      # this job's Cloudflare credentials in scope. An env var is data: the
      # shell reads it after parsing, and the step below validates its charset
      # before anything is done with it. (This is the fix for the Semgrep
      # `run-shell-injection` finding on the first version of this job.)
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Preflight — required secrets are set
        run: |
          MISSING=()
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then MISSING+=("CLOUDFLARE_API_TOKEN"); fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then MISSING+=("CLOUDFLARE_ACCOUNT_ID"); fi
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Required repo secret(s) are missing or empty: ${MISSING[*]}"
            exit 1
          fi

      # The runner shells out to `npx wrangler` from cloudflare-worker/, so the
      # worker's own pinned wrangler is the one that runs.
      - name: Install Worker dependencies
        run: npm ci --prefix cloudflare-worker

      # One place decides which database every later step touches, so a branch
      # run cannot migrate production because one step was left un-edited.
      - name: Validate the branch code and pick the target
        run: |
          if [[ -z "$BRANCH" ]]; then
            echo "TARGET_ARGS=--remote" >> "$GITHUB_ENV"
            echo "Target: production (studioos-db)"
            exit 0
          fi
          # The same shape scripts/lib/migrationTargets.mjs enforces. Checking
          # it here as well is not redundant: it is what lets the value be used
          # in a shell at all, and it fails the run before any credential is
          # handed to a command built from it.
          if [[ ! "$BRANCH" =~ ^[a-z][a-z0-9-]{1,15}$ ]]; then
            echo "::error::branch must match ^[a-z][a-z0-9-]{1,15}\$ — got '$BRANCH'"
            exit 1
          fi
          echo "TARGET_ARGS=--branch $BRANCH" >> "$GITHUB_ENV"
          echo "Target: branch $BRANCH (studioos-$BRANCH)"

      # Gitignored build output, so it is never in the checkout. The runner
      # refuses --branch without it rather than falling back to HQ's config.
      - name: Generate the branch Worker config
        if: inputs.branch != ''
        run: node scripts/gen-branch-wrangler.mjs "$BRANCH"

      - name: A branch database is never baselined
        if: inputs.branch != '' && inputs.mode == 'adopt-and-baseline'
        run: |
          echo "::error::adopt-and-baseline is production-only. A branch database is built from"
          echo "::error::the baseline by branch-provision.yml; it has no legacy ledger to adopt."
          exit 1

      - name: Plan before (read-only)
        run: node scripts/migrate-d1.mjs $TARGET_ARGS --dry-run

      - name: Adopt the legacy ledger and baseline
        if: inputs.mode == 'adopt-and-baseline'
        run: node scripts/migrate-d1.mjs $TARGET_ARGS --adopt-legacy-ledger --baseline

      - name: Verify marked rows against the live schema
        if: inputs.mode == 'verify-marked'
        run: node scripts/migrate-d1.mjs $TARGET_ARGS --verify-marked

      - name: Apply pending migrations
        if: inputs.mode == 'apply'
        run: node scripts/migrate-d1.mjs $TARGET_ARGS

      - name: Plan after (read-only)
        if: inputs.mode != 'dry-run'
        run: node scripts/migrate-d1.mjs $TARGET_ARGS --dry-run
