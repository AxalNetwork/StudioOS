name: Archive observer deploy
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-archive-observer/**'
      - 'cloudflare-worker-tail/**'
      - '.github/workflows/archive-observer-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-observer-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ARCHIVE_OBSERVER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare-worker
      - name: Type-check the archive observer
        run: cloudflare-worker/node_modules/.bin/tsc --noEmit -p cloudflare-archive-observer/tsconfig.json
      - name: Package the archive observer
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: cloudflare-worker/node_modules/.bin/wrangler deploy --dry-run --config cloudflare-archive-observer/wrangler.jsonc
      - name: Deploy the archive observer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARCHIVE_OBSERVER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: cloudflare-worker/node_modules/.bin/wrangler deploy --config cloudflare-archive-observer/wrangler.jsonc
