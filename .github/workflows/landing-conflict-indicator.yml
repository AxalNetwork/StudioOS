name: Landing conflict indicator

# #6476 owner addition (D6476-p5): show a confirmed merge conflict in the PR list
# with the existing `conflict` label, whether checks are green or pending, and
# clear it only when GitHub says the current head merges with the current main.
# Metadata only: it never merges main, runs a model, enqueues, re-runs CI or uses
# the landing App. Its own switch, LANDING_CONFLICT_LABELS, is separate from
# LANDING_BOT_ENABLED, so the indicator works with every repair bot off. Runs on
# each push to main (a green PR can start conflicting without a push of its own)
# and every 15 minutes. No pull_request or workflow_run trigger (#4571 WF-4).

on:
  push:
    branches: [main]
  schedule:
    - cron: '11-59/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: studioos-landing-conflict-indicator
  cancel-in-progress: false

jobs:
  indicate:
    name: Label confirmed conflicts
    if: github.repository == 'AxalNetwork/StudioOS' && github.ref == 'refs/heads/main' && vars.LANDING_CONFLICT_LABELS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/landing-bot
            scripts/lib
            merge-control/src/lib
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Label and clear
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/landing-bot/conflict-indicator.mjs
