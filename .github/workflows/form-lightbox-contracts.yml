name: Form lightbox contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'frontend/src/pages/cycles/FormLightbox.jsx'
      - 'frontend/src/ui/Lightbox.jsx'
      - 'frontend/test/*d695*'
      - '.github/workflows/form-lightbox-contracts.yml'

permissions:
  contents: read

concurrency:
  group: form-lightbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: D695 form and page contracts
    # #6461: not a required check, so a draft skips it (no runner); marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # D5612: keep this job to form contracts (#6461: the guards and SPA build are ci.yml's).
    # ci.yml's required test:drift (full suite) runs every test in shards.
    # Repeating the unsharded suite here exceeded 90 minutes after contracts passed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix cloudflare-worker --no-audit --no-fund
      - name: Build the generated modules (D5612)
        run: node scripts/build-generated.mjs
      - name: Form, page, modal and mutation contracts
        run: node --import ./frontend/test/_deck-loader.mjs --test frontend/test/add_lightbox_d695.test.mjs frontend/test/lightbox_d685.test.mjs
      # #6461: the folder, decision and dark-mode guards and the root SPA build
      # were dropped here: `ci.yml`'s suite (rest) runs `test:guards` (which
      # includes check-folder-docs and check-decision-ids) and check-dark-mode,
      # and every suite part runs `npm run build`, on every pull request.
