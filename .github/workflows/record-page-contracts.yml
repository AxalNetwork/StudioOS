name: Record page contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'frontend/src/pages/cycles/RecordView.jsx'
      - 'frontend/src/pages/cycles/recordModel.js'
      - 'frontend/src/lib/persona*.js'
      - 'frontend/test/*d696*'
      - '.github/workflows/record-page-contracts.yml'

permissions:
  contents: read

concurrency:
  group: record-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: D696 record and persona contracts
    # #6461: not a required check, so a draft skips it (no runner); marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # D5612: retain focused record/persona contracts (#6461: the guards and SPA build are ci.yml's).
    # ci.yml's required test:drift (full suite) owns complete sharded coverage.
    # The duplicate unsharded suite exceeded this job's former 90-minute limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          # #9056: cache the npm store for the three installs below.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix cloudflare-worker --no-audit --no-fund
      - name: Build the generated modules (D5612)
        run: node scripts/build-generated.mjs
      - name: Record and persona contracts with mutation restoration
        run: node --import ./frontend/test/_deck-loader.mjs --test frontend/test/record_page_d696.test.mjs frontend/test/persona_pdf_d696.test.mjs
      # #6461: the folder, decision and dark-mode guards and the root SPA build
      # were dropped here: `ci.yml`'s suite (rest) runs `test:guards` (which
      # includes check-folder-docs and check-decision-ids) and check-dark-mode,
      # and every suite part runs `npm run build`, on every pull request.
