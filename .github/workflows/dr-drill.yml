name: Monthly DR Drill

# Task #5 (IE) — Monthly disaster-recovery drill.
# Provisions a throwaway D1 database, restores the latest nightly
# backup into it, runs the smoke-test suite, and pages on-call on
# failure. Validates RTO (4h) and RPO (24h) commitments end-to-end.
#
# Schedule: 1st of the month at 06:00 UTC. Also runnable on demand.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BACKUP_BUCKET: studioos-backups
  PAGER_WEBHOOK_URL: ${{ secrets.PAGER_WEBHOOK_URL }}
  # Enables 4d in scripts/dr-drill.sh: deploy a fresh preview worker
  # bound to the restored throwaway D1 and HTTP-smoke /api/health.
  DR_DRILL_PREVIEW: '1'

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install wrangler + jq
        run: |
          npm i -g wrangler@latest
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run DR drill
        run: bash scripts/dr-drill.sh

      - name: Notify on failure
        if: failure() && env.PAGER_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 DR DRILL FAILED — investigate immediately. See run #${{ github.run_id }}.\"}" \
            "${PAGER_WEBHOOK_URL}" || true
