name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # #4107: the merge queue tests each entry on a `gh-readonly-queue/main/…`
  # branch through this event, and waits for main's required checks there.
  # Four of them are this file's: `frontend (build)`, `worker (typecheck)`,
  # `test:drift (full suite)` and `api ↔ worker drift`. They run on every
  # entry. The other jobs here are not required, already ran on the pull
  # request, and would only hold runners the queue needs, so each is skipped
  # under `merge_group` (`if: github.event_name != 'merge_group'`).
  # frontend/test/merge_queue_ci_4107.test.mjs keeps both lists honest.
  merge_group:
    types: [checks_requested]

# A pull request's run is cancelled by its next push: only its head matters.
# A push to main is NEVER cancelled, and each push is its own group (D1279).
# With one group per ref, every merge cancelled the run before it, so main's
# full suite had not finished once on 2026-10-26: #3165 and #3236 crossed and
# left a README naming a deleted file, main went red unseen for an hour, and
# every PR that merged main failed on it and wrote its own fix to the same
# line, which then conflicted. A finished run per main commit names the merge
# that broke it. Same rule as migration-immutability.yml.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck + build. The build is the contract — if Vite can't
  # produce docs/, the deploy is broken regardless of unit tests.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # -------------------------------------------------------------------------
  # Worker: typecheck the production worker so a broken worker tree blocks
  # merge before it ever reaches `wrangler deploy`.
  # -------------------------------------------------------------------------
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: TypeScript check
        # --no-install: fail loudly if `npm ci` didn't install the local
        # typescript, instead of silently fetching the unrelated `tsc` package.
        run: npx --no-install tsc --noEmit

  # -------------------------------------------------------------------------
  # The full gate: every frontend + worker test, then the static guards and the
  # worker typecheck. `npm run test:drift` globs its test files rather than
  # naming them, so a new test file is covered the moment it lands — 29 of 89
  # worker test files used to be omitted from the hand-maintained list, and one
  # of them had been failing unnoticed.
  #
  # This gate is why the suite exists. Without it the gate only ran on whichever
  # developer remembered, which is how a ReferenceError that `test:drift` catches
  # in seconds reached main (PR #218).
  #
  # D4130 (#4130): the suite runs in PARTS, in parallel. As one job it took 74
  # minutes on one runner (main at c8c362cd17), on every push to every PR. The
  # `suite` matrix runs one part each (scripts/test-drift-parts.mjs: the
  # frontend and worker suites cut by node's own --test-shard, plus `rest`, the
  # other steps of test:drift in order); the parts are derived from
  # package.json's test:drift, and ci_suite_parts_4130.test.mjs proves their
  # union is exactly the suite and that this matrix lists exactly them. The
  # required check is still the job named `test:drift (full suite)`, below.
  # It always runs and passes only when every part passed.
  #
  # On a push to main, `verified` looks for a successful merge-queue run of
  # this workflow on the SAME commit. The queue merges the very commit it
  # tested, so a second full run would test identical code. Only then are the
  # parts skipped; when the queue is off, when nothing is found, or when the
  # lookup fails, the full suite runs (D1279: main still finishes a run for
  # every commit, and that run names the queue run it relies on).
  # -------------------------------------------------------------------------
  verified:
    name: already verified in the merge queue
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.lookup.outputs.run }}
    steps:
      - name: A successful merge_group run of ci.yml on this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The queue merges as soon as its required checks pass, so the queue
        # run can still be closing when this push starts: look four times,
        # 20 seconds apart. A miss, or a failed call, means the suite runs.
        run: |
          run=''
          for attempt in 1 2 3 4; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success&per_page=1" \
              --jq '.workflow_runs[0] | select(.head_sha == env.SHA and .event == "merge_group" and .conclusion == "success") | .html_url' || true)
            [ -n "$run" ] && break
            [ "$attempt" -lt 4 ] && sleep 20
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "The merge queue already passed the full suite on $SHA: $run"
          else
            echo "No merge-queue run passed on $SHA, so the full suite runs."
          fi

  suite:
    name: suite (${{ matrix.part }})
    needs: verified
    # Runs whenever `verified` found nothing (always on a PR and in the queue,
    # where `verified` is skipped, and when its lookup failed).
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    runs-on: ubuntu-latest
    # #3911 gave the single job 90 minutes. One part is a fraction of it; a
    # real hang still stops here.
    timeout-minutes: 40
    strategy:
      # Every part reports, so one red part does not hide another.
      fail-fast: false
      matrix:
        part:
          - frontend-1-of-2
          - frontend-2-of-2
          - worker-1-of-6
          - worker-2-of-6
          - worker-3-of-6
          - worker-4-of-6
          - worker-5-of-6
          - worker-6-of-6
          - rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
            package-lock.json
      # The suite imports React deck templates and the worker's TypeScript, so
      # it needs both workspaces' dependencies installed.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci || npm install --no-audit --no-fund
      # docs/ is not committed (D529), and part of the suite reads the built
      # SPA (check-docs-assets-closure, the tests that open docs/), so build
      # it first — the same root build the deploy runs.
      - name: Build the SPA
        run: npm run build
      - run: node scripts/test-drift-parts.mjs ${{ matrix.part }}

  gate:
    name: test:drift (full suite)
    needs: [verified, suite]
    # Always, never skipped: a skipped required check reports as passed. This
    # job decides, and it passes only when every part passed — or, on a push
    # to main only, when the merge queue already passed this exact commit.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of test:drift passed
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_RUN: ${{ needs.verified.outputs.run }}
          SUITE: ${{ needs.suite.result }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$VERIFIED_RUN" ] && [ "$SUITE" = "skipped" ]; then
            echo "The merge queue passed the full suite on this commit: $VERIFIED_RUN"
            exit 0
          fi
          if [ "$SUITE" = "success" ]; then
            echo "Every part of test:drift passed."
            exit 0
          fi
          echo "::error::test:drift did not pass: the suite parts ended '$SUITE'."
          exit 1

  # -------------------------------------------------------------------------
  # D1511 (#3762): the Pitch deck editor's visual regression and axe suites
  # (frontend/tests/visual/). The fake AI binding, the contract schemas and
  # the property tests run inside `test:drift` above; these need a browser.
  #
  # PINNED CONTAINER. The baselines under tests/visual/__screenshots__/ were
  # drawn by Chromium build 1194 (141.0.7390.37) on Ubuntu 24.04, the browser
  # the Playwright 1.56.1 image ships, so the job runs in that image and points
  # the runner (@playwright/test from frontend/package-lock.json) at that
  # browser. Fonts are the suite's own files (tests/visual/fonts/), served in
  # place of Google Fonts; every other request off 127.0.0.1 is aborted. To
  # redraw a baseline, run the same command with --update-snapshots in this
  # image and review every PNG in the PR.
  # -------------------------------------------------------------------------
  visual:
    name: editor visual regression and axe
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    env:
      PW_CHROMIUM_PATH: /ms-playwright/chromium-1194/chrome-linux/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: The pinned browser is the one the baselines were drawn with
        run: test -x "$PW_CHROMIUM_PATH" && "$PW_CHROMIUM_PATH" --version | grep -F '141.0.7390.37'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci
      - name: Build the SPA
        run: npm run build
      - name: Visual regression and axe on the editor
        working-directory: frontend
        run: npx --no-install playwright test -c tests/visual/playwright.config.mjs
      - name: Keep the report and the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-visual-report
          path: |
            frontend/tests/visual/playwright-report
            frontend/tests/visual/test-results
          retention-days: 14

  # -------------------------------------------------------------------------
  # API ↔ Worker drift smoke test (T1). Static analysis: every /api/* path
  # called from frontend/src/lib/api.js MUST be mounted on the production
  # worker, OR be allowlisted with a tracking task id.
  # -------------------------------------------------------------------------
  drift:
    name: api ↔ worker drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Run drift checker
        run: node scripts/check-api-drift.mjs

  # -------------------------------------------------------------------------
  # D4103 (#4103): the route map's two projections, PROFILE_ROUTING.md and
  # PAGE_INVENTORY.md, are not committed: every routing change rewrote them
  # and parallel branches conflicted on them. This job builds them from the
  # route map and the sidebar (node only, no install) and keeps them as the
  # run's `routing-docs` artifact, so they can still be read without cloning.
  # Their invariants are checked by `--check` in test:guards (the gate job).
  # -------------------------------------------------------------------------
  routing-docs:
    name: routing docs (artifact)
    # Not a required check, and the queue entry's PR already built the
    # artifact; skipped there like the other optional jobs (#4107).
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Check the projection
        run: node scripts/build-profile-routing.mjs --check
      - name: Build the routing docs
        run: node scripts/build-profile-routing.mjs
      - name: Keep the routing docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-docs
          path: |
            documentation/architecture/PROFILE_ROUTING.md
            documentation/architecture/PAGE_INVENTORY.md
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Open Graph / social-preview gate.
  #
  # Guards the "every axal.vc link previews with the same wrong image" class of
  # regression. docs/ is not committed (D529), so this job builds it from the
  # PR's source with the same root build the deploy runs, then checks those
  # bytes: a route that stopped being prerendered, an og:image pointing at a
  # file that does not exist, a relative image URL, or a card that is not
  # 1200x630. Checking the PR's own build is what the old freshness step only
  # approximated.
  # -------------------------------------------------------------------------
  og-tags:
    name: open graph metadata
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Build the SPA
        run: npm run build
      - name: Prerendered routes are current
        run: node scripts/prerender-og.mjs --check
      - name: Card images are current
        # ubuntu-latest ships Google Chrome; the script skips loudly (and says
        # what is no longer covered) if no browser is present.
        run: node scripts/generate-og-images.mjs --check
      - name: Validate tags in built output
        run: node scripts/validate-og-tags.mjs

  # -------------------------------------------------------------------------
  # LFS size gate — only fires on files added / modified in the PR.
  # Uses --against so grandfathered pre-audit blobs do NOT block CI.
  # -------------------------------------------------------------------------
  lfs-gate:
    name: lfs size gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Full history (fetch-depth: 0 below) so `git diff base...HEAD` has a
    # merge base. That checkout has exceeded this job's old 5-minute limit
    # before the gate ran (#3514, 2026-10-27), so the job allows 15.
    #
    # BLOBLESS (`filter: blob:none`, 2026-11-03). The full clone of every
    # blob still ran past 15 minutes on a busy day, and a cancelled gate is a
    # red check on every open PR. The gate needs the commits and trees for the
    # merge base and the name-only diff, and the bytes of the files HEAD
    # checks out (which the checkout fetches); it never reads an old blob.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - name: Run LFS size gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/lfs-size-gate.mjs --against="origin/$GITHUB_BASE_REF"

  # -------------------------------------------------------------------------
  # FastAPI dev backend: import + smoke. Catches obvious Python breakage in
  # the dev environment so Replit sessions don't start broken. We do NOT
  # treat dev failure as a deploy gate (FastAPI is not deployed) but we DO
  # want to know early.
  # -------------------------------------------------------------------------
  dev-backend:
    name: dev backend (import smoke)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          # Dev-only requirements pinned in repo. Ignore failures here only
          # if the project hasn't published a requirements file yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Import smoke
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import importlib; importlib.import_module('backend.app.main'); print('ok')"

  # -------------------------------------------------------------------------
  # Epic 11 — supply-chain audits. Both run with `|| true` semantics
  # downgraded to a hard fail on HIGH/CRITICAL only, so dev-dependency
  # advisories don't block merge while real prod-dep CVEs do.
  # -------------------------------------------------------------------------
  audit-frontend:
    name: audit (frontend npm)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # 10, not 5. Both npm audit jobs were CANCELLED — not failed — on two
    # consecutive runs of PR #429, a diff with no dependency change on either
    # side, and each time the orphaned process named at cancellation was a
    # registry call: `npm ci` on one run, `npm audit` on the next. That is a
    # registry stall on the runner rather than a slow step, so the fix is room
    # for one to clear, matching what `audit (python pip-audit)` already has.
    # A cancelled job is worse than a failing one: it reads as a red square
    # with no cause, and it says nothing about the dependencies it exists to
    # check.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # `--no-audit --no-fund`: npm ci runs its own audit and funding lookup on
      # install, so this job paid for two registry round-trips to answer one
      # question — and the install's audit decides nothing, because the
      # deliberate `npm audit` below is what passes or fails the job. The same
      # flags are already on the install fallback further up this file.
      - run: npm ci --no-audit --no-fund
      # Through the gate rather than `npm audit` directly, because that command
      # exits 1 for BOTH "you have a critical CVE" and "the registry did not
      # answer" — and this job spent seven minutes on a 503 from the advisory
      # endpoint before going red exactly like a real finding. The gate retries
      # a transport failure, bounds each attempt, names the advisories on a real
      # one, and still FAILS when the database is unreachable: it just says which
      # of the two happened. See scripts/npm-audit-gate.mjs.
      #
      # Threshold is `critical`, not `high`. Remaining highs (if any) print
      # on every run — do not hard-code a tolerated list here. The previous
      # pair was `image-size` (ICNS/JXL/HEIF DoS) and `pptxgenjs`, which
      # reached it; both lockfiles now override `image-size` to the patched
      # `image-size-next@1.2.2` fork (Dependabot #161).
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical

  audit-worker:
    name: audit (worker npm)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # 10, not 5. Both npm audit jobs were CANCELLED — not failed — on two
    # consecutive runs of PR #429, a diff with no dependency change on either
    # side, and each time the orphaned process named at cancellation was a
    # registry call: `npm ci` on one run, `npm audit` on the next. That is a
    # registry stall on the runner rather than a slow step, so the fix is room
    # for one to clear, matching what `audit (python pip-audit)` already has.
    # A cancelled job is worse than a failing one: it reads as a red square
    # with no cause, and it says nothing about the dependencies it exists to
    # check.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      # `--no-audit --no-fund`: npm ci runs its own audit and funding lookup on
      # install, so this job paid for two registry round-trips to answer one
      # question — and the install's audit decides nothing, because the
      # deliberate `npm audit` below is what passes or fails the job. The same
      # flags are already on the install fallback further up this file.
      - run: npm ci --no-audit --no-fund
      # Same gate as the frontend job above, and for the same reason: a registry
      # outage must not be reported as a vulnerability. The worker's production
      # tree currently carries nothing at any severity.
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical

  audit-python:
    name: audit (python pip-audit)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit (audit requirements.txt only)
        # Audit the pinned requirements file directly instead of the full
        # environment. This avoids `setuptools (X.Y.Z.post0)` style errors
        # from environment-injected post-release builds that aren't on PyPI.
        run: |
          if [ -f requirements.txt ]; then
            pip-audit --strict --ignore-vuln PYSEC-2022-42969 -r requirements.txt
          else
            echo "no requirements.txt found, skipping"
          fi
