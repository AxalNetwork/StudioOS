name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # #4107: the merge queue tests each entry on a `gh-readonly-queue/main/…`
  # branch through this event, and waits for main's required checks there.
  # Four of them are this file's: `frontend (build)`, `worker (typecheck)`,
  # `test:drift (full suite)` and `api ↔ worker drift`. They run on every
  # entry. The other jobs here are not required, already ran on the pull
  # request, and would only hold runners the queue needs, so each is skipped
  # under `merge_group` (`if: github.event_name != 'merge_group'`).
  # frontend/test/merge_queue_ci_4107.test.mjs keeps both lists honest.
  merge_group:
    types: [checks_requested]

# A pull request's run is cancelled by its next push: only its head matters.
# A push to main is NEVER cancelled, and each push is its own group (D1279).
# With one group per ref, every merge cancelled the run before it, so main's
# full suite had not finished once on 2026-10-26: #3165 and #3236 crossed and
# left a README naming a deleted file, main went red unseen for an hour, and
# every PR that merged main failed on it and wrote its own fix to the same
# line, which then conflicted. A finished run per main commit names the merge
# that broke it. Same rule as migration-immutability.yml.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck + build. The build is the contract — if Vite can't
  # produce docs/, the deploy is broken regardless of unit tests.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # -------------------------------------------------------------------------
  # Worker: typecheck the production worker so a broken worker tree blocks
  # merge before it ever reaches `wrangler deploy`.
  # -------------------------------------------------------------------------
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: TypeScript check
        # --no-install: fail loudly if `npm ci` didn't install the local
        # typescript, instead of silently fetching the unrelated `tsc` package.
        run: npx --no-install tsc --noEmit

  # -------------------------------------------------------------------------
  # The full gate: every frontend + worker test, then the static guards and the
  # worker typecheck. `npm run test:drift` globs its test files rather than
  # naming them, so a new test file is covered the moment it lands — 29 of 89
  # worker test files used to be omitted from the hand-maintained list, and one
  # of them had been failing unnoticed.
  #
  # This gate is why the suite exists. Without it the gate only ran on whichever
  # developer remembered, which is how a ReferenceError that `test:drift` catches
  # in seconds reached main (PR #218).
  #
  # D4130 (#4130): the suite runs in PARTS, in parallel. As one job it took 74
  # minutes on one runner (main at c8c362cd17), on every push to every PR. The
  # `suite` matrix runs one part each (scripts/test-drift-parts.mjs: the
  # frontend and worker suites packed by measured duration, plus `rest`, the
  # other steps of test:drift in order); the parts are derived from
  # package.json's test:drift, and ci_suite_parts_4130.test.mjs proves their
  # union is exactly the suite and that this matrix lists exactly them. The
  # required check is still the job named `test:drift (full suite)`, below.
  # It always runs and passes only when every part passed.
  #
  # On a push to main, `verified` looks for a successful merge-queue run of
  # this workflow on the SAME commit. The queue merges the very commit it
  # tested, so a second full run would test identical code. Only then are the
  # parts skipped; when the queue is off, when nothing is found, or when the
  # lookup fails, the full suite runs (D1279: main still finishes a run for
  # every commit, and that run names the queue run it relies on).
  # -------------------------------------------------------------------------
  verified:
    name: already verified in the merge queue
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.lookup.outputs.run }}
    steps:
      - name: A successful merge_group run of ci.yml on this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The queue merges as soon as its required checks pass, so the queue
        # run can still be closing when this push starts: look four times,
        # 20 seconds apart. A miss, or a failed call, means the suite runs.
        run: |
          run=''
          for attempt in 1 2 3 4; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success&per_page=1" \
              --jq '.workflow_runs[0] | select(.head_sha == env.SHA and .event == "merge_group" and .conclusion == "success") | .html_url' || true)
            [ -n "$run" ] && break
            [ "$attempt" -lt 4 ] && sleep 20
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "The merge queue already passed the full suite on $SHA: $run"
          else
            echo "No merge-queue run passed on $SHA, so the full suite runs."
          fi

  plan:
    name: suite plan
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Newest main timing artifact, or equal weights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          artifact=''
          if gh api "repos/$REPO/commits?sha=main&per_page=100" > "$RUNNER_TEMP/main-commits.json" && gh api "repos/$REPO/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"; then
            artifact=$(node scripts/test-drift-parts.mjs --main-artifact "$RUNNER_TEMP/artifacts.json" "$RUNNER_TEMP/main-commits.json" || true)
          fi
          if [ -n "$artifact" ]; then
            if gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/timings.zip"; then
              unzip -j "$RUNNER_TEMP/timings.zip" test-timings.json -d . || true
            fi
          fi
          if [ ! -f test-timings.json ]; then
            echo "::notice::No main timings artifact available; using equal weights."
          fi
      - name: Generate the exact-once plan
        id: plan
        run: |
          parts=$(node scripts/test-drift-parts.mjs --plan test-timings.json)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-plan
          path: suite-plan.json
          if-no-files-found: error
          retention-days: 3

  suite:
    name: suite (${{ matrix.part }})
    needs: [verified, plan]
    # Runs whenever `verified` found nothing (always on a PR and in the queue,
    # where `verified` is skipped, and when its lookup failed).
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    runs-on: ubuntu-latest
    # #3911 gave the single job 90 minutes. One part is a fraction of it; a
    # real hang still stops here.
    timeout-minutes: 40
    strategy:
      # Queue entries cannot land after a failure. PRs and pushes report every part.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
            package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suite-plan
      # The suite imports React deck templates and the worker's TypeScript, so
      # it needs both workspaces' dependencies installed.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci || npm install --no-audit --no-fund
      # D5398: D4558's independent-recovery tests require the real age CLI.
      # The Ubuntu 26 security.ubuntu.com mirror has intermittently failed DNS
      # across unrelated PRs; pin a release SHA256 rather than apt-fetching it.
      # The script installs locally to RUNNER_TEMP and adds only age to PATH.
      - name: Install age
        if: startsWith(matrix.part, 'frontend')
        run: bash scripts/ci/install-age-linux.sh
      # docs/ is not committed (D529), and part of the suite reads the built
      # SPA (check-docs-assets-closure, the tests that open docs/), so build
      # it first — the same root build the deploy runs.
      - name: Build the SPA
        run: npm run build
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - run: node scripts/test-drift-parts.mjs ${{ matrix.part }} --plan-file suite-plan.json

  # D5606: shadow the replacement for the existing required checks.
  fast:
    name: ci / fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      required: ${{ steps.verdict.outputs.required }}
      advisory: ${{ steps.verdict.outputs.advisory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
        id: checkout
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
        id: node
        if: ${{ !cancelled() }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --connect-timeout 10 --max-time 120 -o /tmp/gitleaks.tar.gz "$URL"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not download gitleaks ${GITLEAKS_VERSION} after 5 attempts — this is a network failure, not a secret finding."
              exit 1
            fi
            echo "gitleaks download attempt ${attempt} failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
        id: install_scanner
        if: ${{ !cancelled() }}
      - name: Determine scan range
        id: range
        run: |
          # Scan only the commits introduced by this push / PR rather than the
          # entire public history. A new secret is still caught on the commit
          # that introduces it, but CI no longer fails forever on historical
          # leaks that cannot be rewritten without breaking every fork, open
          # Dependabot PR and the backup mirror (see the `commits` allowlist in
          # .gitleaks.toml for the running list of those unchangeable findings).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "logopts=--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # #4107: the queue entry is main (base_sha) plus the queued PRs, so
            # the range is every commit the queue would merge.
            echo "logopts=--log-opts=${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "logopts=--log-opts=-1" >> "$GITHUB_OUTPUT"
            else
              echo "logopts=--log-opts=${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
        if: ${{ !cancelled() }}
      - name: Run gitleaks
        run: |
          # Uses the project-specific config which extends the upstream default
          # ruleset and adds project allowlists. Commit range scoped above.
          gitleaks detect \
            --config=.gitleaks.toml \
            --source=. \
            ${{ steps.range.outputs.logopts }} \
            --redact \
            --verbose \
            --no-banner \
            --exit-code=1
        id: scan
        if: ${{ !cancelled() }}
      - name: Load static checkers from the trusted base
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "$EVENT" == push && "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA="$GITHUB_SHA"
          fi
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          trusted="$RUNNER_TEMP/fast-guards"
          mkdir -p "$trusted"
          guards=(scripts/migration-immutability-gate.mjs scripts/lib/migrationImmutability.mjs
            scripts/lfs-size-gate.mjs scripts/check-api-drift.mjs scripts/lib/apiModules.mjs scripts/lib/routeRegistry.mjs)
          git archive "$BASE_SHA" "${guards[@]}" | tar -x -C "$trusted"
          ln -s "$GITHUB_WORKSPACE/frontend" "$trusted/frontend"
          ln -s "$GITHUB_WORKSPACE/cloudflare-worker" "$trusted/cloudflare-worker"
          ln -s "$GITHUB_WORKSPACE/scripts/api-drift-baseline.json" "$trusted/scripts/api-drift-baseline.json"
        id: trusted
        if: ${{ !cancelled() }}
      - name: No migration on the base was edited, deleted or renamed
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MIGRATION_GATE_BEFORE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: node "$RUNNER_TEMP/fast-guards/scripts/migration-immutability-gate.mjs"
        id: migrations
        if: ${{ !cancelled() }}
      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
        id: lfs_base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - name: Run LFS size gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/fast-guards/scripts/lfs-size-gate.mjs" --against="origin/$GITHUB_BASE_REF"
        id: lfs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - name: Run drift checker
        run: node "$RUNNER_TEMP/fast-guards/scripts/check-api-drift.mjs"
        id: drift
        if: ${{ !cancelled() }}
      - run: npm ci
        working-directory: cloudflare-worker
        id: worker_install
        if: ${{ !cancelled() }}
      - name: TypeScript check
        run: npx --no-install tsc --noEmit
        working-directory: cloudflare-worker
        id: worker_typecheck
        if: ${{ !cancelled() }}
      - run: npm ci
        working-directory: frontend
        id: frontend_install
        if: ${{ !cancelled() }}
      - run: npm run build
        working-directory: frontend
        id: frontend_build
        if: ${{ !cancelled() }}
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical
        id: frontend_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        working-directory: frontend
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical
        id: worker_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        working-directory: cloudflare-worker
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
        id: python
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
        id: pip_install
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: pip-audit (audit requirements.txt only)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit --strict --ignore-vuln PYSEC-2022-42969 -r requirements.txt
          else
            echo "no requirements.txt found, skipping"
          fi
        id: pip_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Check the projection
        run: node scripts/build-profile-routing.mjs --check
        id: routing_check
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Build the routing docs
        run: node scripts/build-profile-routing.mjs
        id: routing
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Build the authorization inventory
        run: node scripts/build-auth-inventory.mjs
        id: auth
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Keep the routing docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: routing-docs
          path: |
            documentation/architecture/PROFILE_ROUTING.md
            documentation/architecture/PAGE_INVENTORY.md
            documentation/architecture/AUTH_INVENTORY.json
          if-no-files-found: error
          retention-days: 30
        id: routing_upload
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Report required and advisory results
        id: verdict
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL_SCANNER: ${{ steps.install_scanner.outcome }}
          RANGE: ${{ steps.range.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          TRUSTED: ${{ steps.trusted.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
          WORKER_INSTALL: ${{ steps.worker_install.outcome }}
          WORKER_TYPECHECK: ${{ steps.worker_typecheck.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          LFS_BASE: ${{ steps.lfs_base.outcome }}
          LFS: ${{ steps.lfs.outcome }}
          FRONTEND_AUDIT: ${{ steps.frontend_audit.outcome }}
          WORKER_AUDIT: ${{ steps.worker_audit.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          PIP_INSTALL: ${{ steps.pip_install.outcome }}
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          ROUTING_CHECK: ${{ steps.routing_check.outcome }}
          ROUTING: ${{ steps.routing.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          ROUTING_UPLOAD: ${{ steps.routing_upload.outcome }}
        run: |
          required=pass
          for outcome in "$CHECKOUT" "$NODE" "$INSTALL_SCANNER" "$RANGE" "$SCAN" "$TRUSTED" \
                         "$MIGRATIONS" "$DRIFT" "$WORKER_INSTALL" "$WORKER_TYPECHECK" \
                         "$FRONTEND_INSTALL" "$FRONTEND_BUILD"; do
            if [[ "$outcome" != success ]]; then required=fail; fi
          done
          advisory=pass
          if [[ "$EVENT" == pull_request && ( "$LFS_BASE" != success || "$LFS" != success ) ]]; then
            advisory=fail
          fi
          if [[ "$EVENT" != merge_group ]]; then
            for outcome in "$FRONTEND_AUDIT" "$WORKER_AUDIT" "$PYTHON" "$PIP_INSTALL" "$PIP_AUDIT" \
                           "$ROUTING_CHECK" "$ROUTING" "$AUTH" "$ROUTING_UPLOAD"; do
              if [[ "$outcome" != success ]]; then advisory=fail; fi
            done
          fi
          printf 'required=%s\nadvisory=%s\n' "$required" "$advisory" >> "$GITHUB_OUTPUT"

  landing:
    name: landing gate
    needs: [verified, fast, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required fast checks and full suite passed
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_RUN: ${{ needs.verified.outputs.run }}
          SUITE: ${{ needs.suite.result }}
          REQUIRED: ${{ needs.fast.outputs.required }}
        run: |
          if [ "$REQUIRED" != pass ]; then
            echo "::error::Required fast checks did not pass."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ -n "$VERIFIED_RUN" ] && [ "$SUITE" = "skipped" ]; then
            echo "The merge queue passed the full suite on this commit: $VERIFIED_RUN"
            exit 0
          fi
          if [ "$SUITE" = "success" ]; then
            echo "Every part of test:drift passed."
            exit 0
          fi
          echo "::error::test:drift did not pass: the suite parts ended '$SUITE'."
          exit 1

  gate:
    name: test:drift (full suite)
    needs: [verified, plan, suite]
    # Always, never skipped: a skipped required check reports as passed. This
    # job decides, and it passes only when every part passed — or, on a push
    # to main only, when the merge queue already passed this exact commit.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of test:drift passed
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_RUN: ${{ needs.verified.outputs.run }}
          SUITE: ${{ needs.suite.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$VERIFIED_RUN" ] && [ "$SUITE" = "skipped" ]; then
            echo "The merge queue passed the full suite on this commit: $VERIFIED_RUN"
            exit 0
          fi
          if [ "$PLAN" = "success" ] && [ "$SUITE" = "success" ]; then
            echo "Every part of test:drift passed."
            exit 0
          fi
          echo "::error::test:drift did not pass: the suite parts ended '$SUITE'."
          exit 1


  # -------------------------------------------------------------------------
  # D5398 (#5398): when a PR's suite fails, say whether its red parts are its
  # own or inherited from a red main, so one repair goes to main and nobody
  # ports it, merges main or re-runs for it. Its own job, not a required check
  # and not part of the gate: it labels the failure and never changes it. It
  # reads this run's jobs, main's latest CI run and the red-main alert, and
  # cannot fail (continue-on-error; the script exits 0).
  # -------------------------------------------------------------------------
  selection-shadow:
    name: selection (shadow)
    needs: suite
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Read newest main dependency trace
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/commits?sha=main&per_page=100" > "$RUNNER_TEMP/main-commits.json"
          gh api "repos/$REPO/actions/artifacts?per_page=100" > "$RUNNER_TEMP/trace-candidates.json"
          node scripts/select-tests.mjs --main-artifact "$RUNNER_TEMP/trace-candidates.json" "$RUNNER_TEMP/main-commits.json" > "$RUNNER_TEMP/trace-artifact.json"
          artifact=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/trace-artifact.json')).id || ''")
          if [ -n "$artifact" ]; then
            gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/deps.zip"
            unzip -j "$RUNNER_TEMP/deps.zip" test-deps.json -d .
            created=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/trace-artifact.json')).created_at || ''")
            echo "TRACE_CREATED_AT=$created" >> "$GITHUB_ENV"
          fi
      - name: Read machine-readable CI failures
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-failures-*
          path: ci-failures
      - name: Record the shadow decision
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/select-tests.mjs || true
          if [ ! -s selection-shadow.json ]; then
            echo '{"kind":"selection-shadow","version":1,"mode":"full","reason":"shadow-setup-failed","scoring":"unscored","misses":null,"failing":null}' > selection-shadow.json
          fi
          exit 0
      - name: Keep one shadow record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-shadow-${{ github.run_id }}
          path: selection-shadow.json
          if-no-files-found: error
          retention-days: 30

  classify:
    name: why CI failed (D5398)
    needs: suite
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      - name: Is this failure the PR's own, or main's?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/ci-classify.mjs

  # -------------------------------------------------------------------------
  # D1511 (#3762): the Pitch deck editor's visual regression and axe suites
  # (frontend/tests/visual/). The fake AI binding, the contract schemas and
  # the property tests run inside `test:drift` above; these need a browser.
  #
  # PINNED CONTAINER. The baselines under tests/visual/__screenshots__/ were
  # drawn by Chromium build 1194 (141.0.7390.37) on Ubuntu 24.04, the browser
  # the Playwright 1.56.1 image ships, so the job runs in that image and points
  # the runner (@playwright/test from frontend/package-lock.json) at that
  # browser. Fonts are the suite's own files (tests/visual/fonts/), served in
  # place of Google Fonts; every other request off 127.0.0.1 is aborted. To
  # redraw a baseline, run the same command with --update-snapshots in this
  # image and review every PNG in the PR.
  # -------------------------------------------------------------------------
  visual:
    name: editor visual regression and axe
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a # v1.56.1-noble
      options: --user 1001
    env:
      PW_CHROMIUM_PATH: /ms-playwright/chromium-1194/chrome-linux/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: The pinned browser is the one the baselines were drawn with
        run: test -x "$PW_CHROMIUM_PATH" && "$PW_CHROMIUM_PATH" --version | grep -F '141.0.7390.37'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci
      - name: Build the SPA
        run: npm run build
      - name: Visual regression and axe on the editor
        working-directory: frontend
        run: npx --no-install playwright test -c tests/visual/playwright.config.mjs
      - name: Keep the report and the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-visual-report
          path: |
            frontend/tests/visual/playwright-report
            frontend/tests/visual/test-results
          retention-days: 14

  # -------------------------------------------------------------------------
  # API ↔ Worker drift smoke test (T1). Static analysis: every /api/* path
  # called from frontend/src/lib/api.js MUST be mounted on the production
  # worker, OR be allowlisted with a tracking task id.
  # -------------------------------------------------------------------------
  drift:
    name: api ↔ worker drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Run drift checker
        run: node scripts/check-api-drift.mjs

  # -------------------------------------------------------------------------
  # Open Graph / social-preview gate.
  #
  # Guards the "every axal.vc link previews with the same wrong image" class of
  # regression. docs/ is not committed (D529), so this job builds it from the
  # PR's source with the same root build the deploy runs, then checks those
  # bytes: a route that stopped being prerendered, an og:image pointing at a
  # file that does not exist, a relative image URL, or a card that is not
  # 1200x630. Checking the PR's own build is what the old freshness step only
  # approximated.
  # -------------------------------------------------------------------------
  og-tags:
    name: open graph metadata
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Build the SPA
        run: npm run build
      - name: Prerendered routes are current
        run: node scripts/prerender-og.mjs --check
      - name: Card images are current
        # ubuntu-latest ships Google Chrome; the script skips loudly (and says
        # what is no longer covered) if no browser is present.
        run: node scripts/generate-og-images.mjs --check
      - name: Validate tags in built output
        run: node scripts/validate-og-tags.mjs

  # -------------------------------------------------------------------------
  # FastAPI dev backend: import + smoke. Catches obvious Python breakage in
  # the dev environment so Replit sessions don't start broken. We do NOT
  # treat dev failure as a deploy gate (FastAPI is not deployed) but we DO
  # want to know early.
  # -------------------------------------------------------------------------
  dev-backend:
    name: dev backend (import smoke)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          # Dev-only requirements pinned in repo. Ignore failures here only
          # if the project hasn't published a requirements file yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Import smoke
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import importlib; importlib.import_module('backend.app.main'); print('ok')"
      - name: Company API contract tests
        env:
          DATABASE_URL: sqlite:///./ci-company-tests.db
        run: |
          python3 -m unittest backend/tests/test_company_fields_d4962.py
          python3 -m unittest backend/tests/test_company_routes_d5367.py

  digest:
    name: CI failure digest (#5619)
    needs: [frontend, worker, suite, drift]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: '22'
      - name: Publish from the base commit, when installed there
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/ci-digest.mjs ]; then
            node scripts/ci-digest.mjs
          else
            echo 'CI digest starts after #5619 merges onto the base branch.'
          fi
