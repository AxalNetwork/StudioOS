name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on a branch when a new commit arrives. Saves CI
# minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck + build. The build is the contract — if Vite can't
  # produce docs/, the deploy is broken regardless of unit tests.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # -------------------------------------------------------------------------
  # Worker: typecheck the production worker so a broken worker tree blocks
  # merge before it ever reaches `wrangler deploy`.
  # -------------------------------------------------------------------------
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: TypeScript check
        # --no-install: fail loudly if `npm ci` didn't install the local
        # typescript, instead of silently fetching the unrelated `tsc` package.
        run: npx --no-install tsc --noEmit

  # -------------------------------------------------------------------------
  # API ↔ Worker drift smoke test (T1). Static analysis: every /api/* path
  # called from frontend/src/lib/api.js MUST be mounted on the production
  # worker, OR be allowlisted with a tracking task id.
  # -------------------------------------------------------------------------
  drift:
    name: api ↔ worker drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Run drift checker
        run: node scripts/check-api-drift.mjs

  # -------------------------------------------------------------------------
  # LFS size gate — only fires on files added / modified in the PR.
  # Uses --against so grandfathered pre-audit blobs do NOT block CI.
  # -------------------------------------------------------------------------
  lfs-gate:
    name: lfs size gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - name: Run LFS size gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/lfs-size-gate.mjs --against="origin/$GITHUB_BASE_REF"

  # -------------------------------------------------------------------------
  # FastAPI dev backend: import + smoke. Catches obvious Python breakage in
  # the dev environment so Replit sessions don't start broken. We do NOT
  # treat dev failure as a deploy gate (FastAPI is not deployed) but we DO
  # want to know early.
  # -------------------------------------------------------------------------
  dev-backend:
    name: dev backend (import smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          # Dev-only requirements pinned in repo. Ignore failures here only
          # if the project hasn't published a requirements file yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Import smoke
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import importlib; importlib.import_module('backend.app.main'); print('ok')"

  # -------------------------------------------------------------------------
  # Epic 11 — supply-chain audits. Both run with `|| true` semantics
  # downgraded to a hard fail on HIGH/CRITICAL only, so dev-dependency
  # advisories don't block merge while real prod-dep CVEs do.
  # -------------------------------------------------------------------------
  audit-frontend:
    name: audit (frontend npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (prod deps, critical fail)
        # Threshold is `critical` (not `high`) because recharts → lodash@4.17.23
        # has two high-severity advisories (`_.template`, `_.unset`) for which
        # no patched lodash release exists. lodash is used internally by
        # recharts for chart math only; not for any security-sensitive code
        # path. Re-evaluate when recharts publishes a lodash-free major.
        run: npm audit --omit=dev --audit-level=critical

  audit-worker:
    name: audit (worker npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: npm audit (prod deps, critical fail)
        run: npm audit --omit=dev --audit-level=critical

  audit-python:
    name: audit (python pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit (audit requirements.txt only)
        # Audit the pinned requirements file directly instead of the full
        # environment. This avoids `setuptools (X.Y.Z.post0)` style errors
        # from environment-injected post-release builds that aren't on PyPI.
        run: |
          if [ -f requirements.txt ]; then
            pip-audit --strict --ignore-vuln PYSEC-2022-42969 -r requirements.txt
          else
            echo "no requirements.txt found, skipping"
          fi
