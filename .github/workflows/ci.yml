name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on a branch when a new commit arrives. Saves CI
# minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck + build. The build is the contract — if Vite can't
  # produce docs/, the deploy is broken regardless of unit tests.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # -------------------------------------------------------------------------
  # Worker: typecheck the production worker so a broken worker tree blocks
  # merge before it ever reaches `wrangler deploy`.
  # -------------------------------------------------------------------------
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: TypeScript check
        # --no-install: fail loudly if `npm ci` didn't install the local
        # typescript, instead of silently fetching the unrelated `tsc` package.
        run: npx --no-install tsc --noEmit

  # -------------------------------------------------------------------------
  # The full gate: every frontend + worker test, then the static guards and the
  # worker typecheck. `npm run test:drift` globs its test files rather than
  # naming them, so a new test file is covered the moment it lands — 29 of 89
  # worker test files used to be omitted from the hand-maintained list, and one
  # of them had been failing unnoticed.
  #
  # This job is why the suite exists. Without it the gate only ran on whichever
  # developer remembered, which is how a ReferenceError that `test:drift` catches
  # in seconds reached main (PR #218).
  # -------------------------------------------------------------------------
  gate:
    name: test:drift (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      # The suite imports React deck templates and the worker's TypeScript, so
      # it needs both workspaces' dependencies installed.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci || npm install --no-audit --no-fund
      - run: npm run test:drift

  # -------------------------------------------------------------------------
  # API ↔ Worker drift smoke test (T1). Static analysis: every /api/* path
  # called from frontend/src/lib/api.js MUST be mounted on the production
  # worker, OR be allowlisted with a tracking task id.
  # -------------------------------------------------------------------------
  drift:
    name: api ↔ worker drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Run drift checker
        run: node scripts/check-api-drift.mjs

  # -------------------------------------------------------------------------
  # Open Graph / social-preview gate.
  #
  # Guards the "every axal.vc link previews with the same wrong image" class of
  # regression. Validates the committed docs/ build. Those are the bytes a
  # reviewer reads, not by themselves the bytes a crawler actually receives:
  # both production hosts are served by the `studioos` Worker's [assets] copy of
  # docs/, which cloudflare-worker-deploy.yml rebuilds from source at deploy
  # time. The freshness step below is what makes the committed build and the
  # shipped one the same build; given that, these checks catch a route that
  # stopped being prerendered, an og:image pointing at a file that does not
  # exist, a relative image URL, or a card that is not 1200x630.
  # -------------------------------------------------------------------------
  og-tags:
    name: open graph metadata
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # REQUIRED, not an optimisation. check-docs-fresh compares the newest
          # commit touching frontend/src against the newest touching docs/, and
          # the default depth-1 clone has exactly one commit — both resolve to
          # it, the comparison is trivially true, and the step below passed on
          # every run for as long as it has existed. `lfs-gate` sets the same
          # flag for the same class of reason.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      # The three checks below all read the COMMITTED docs/ bytes, which are
      # what a crawler receives only when they match the source the deploy
      # rebuilds from. If docs/ is behind frontend/src they are
      # validating an old build and passing, so assert freshness first. Strict
      # here (unlike the local warning) because this job can rebuild from the
      # lockfile if it needs to.
      - name: Committed docs/ build is current
        run: node scripts/check-docs-fresh.mjs --strict
      - name: Prerendered routes are current
        run: node scripts/prerender-og.mjs --check
      - name: Card images are current
        # ubuntu-latest ships Google Chrome; the script skips loudly (and says
        # what is no longer covered) if no browser is present.
        run: node scripts/generate-og-images.mjs --check
      - name: Validate tags in built output
        run: node scripts/validate-og-tags.mjs

  # -------------------------------------------------------------------------
  # LFS size gate — only fires on files added / modified in the PR.
  # Uses --against so grandfathered pre-audit blobs do NOT block CI.
  # -------------------------------------------------------------------------
  lfs-gate:
    name: lfs size gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - name: Run LFS size gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/lfs-size-gate.mjs --against="origin/$GITHUB_BASE_REF"

  # -------------------------------------------------------------------------
  # FastAPI dev backend: import + smoke. Catches obvious Python breakage in
  # the dev environment so Replit sessions don't start broken. We do NOT
  # treat dev failure as a deploy gate (FastAPI is not deployed) but we DO
  # want to know early.
  # -------------------------------------------------------------------------
  dev-backend:
    name: dev backend (import smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          # Dev-only requirements pinned in repo. Ignore failures here only
          # if the project hasn't published a requirements file yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Import smoke
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import importlib; importlib.import_module('backend.app.main'); print('ok')"

  # -------------------------------------------------------------------------
  # Epic 11 — supply-chain audits. Both run with `|| true` semantics
  # downgraded to a hard fail on HIGH/CRITICAL only, so dev-dependency
  # advisories don't block merge while real prod-dep CVEs do.
  # -------------------------------------------------------------------------
  audit-frontend:
    name: audit (frontend npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (prod deps, critical fail)
        # Threshold is `critical` (not `high`) because recharts → lodash@4.17.23
        # has two high-severity advisories (`_.template`, `_.unset`) for which
        # no patched lodash release exists. lodash is used internally by
        # recharts for chart math only; not for any security-sensitive code
        # path. Re-evaluate when recharts publishes a lodash-free major.
        run: npm audit --omit=dev --audit-level=critical

  audit-worker:
    name: audit (worker npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: npm audit (prod deps, critical fail)
        run: npm audit --omit=dev --audit-level=critical

  audit-python:
    name: audit (python pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit (audit requirements.txt only)
        # Audit the pinned requirements file directly instead of the full
        # environment. This avoids `setuptools (X.Y.Z.post0)` style errors
        # from environment-injected post-release builds that aren't on PyPI.
        run: |
          if [ -f requirements.txt ]; then
            pip-audit --strict --ignore-vuln PYSEC-2022-42969 -r requirements.txt
          else
            echo "no requirements.txt found, skipping"
          fi
