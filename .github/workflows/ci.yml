name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # #4107: the merge queue tests each entry on a `gh-readonly-queue/main/…`
  # branch through this event, and waits for main's required checks there.
  # Four of them are this file's: `frontend (build)`, `worker (typecheck)`,
  # `test:drift (full suite)` and `api ↔ worker drift`. They run on every
  # entry, with `suite`, which the full-suite check needs; `plan` is skipped
  # in the queue, where each suite part plans for itself (D7108 part 2). Three
  # jobs that are not required also run in the queue: `ci / fast` and
  # `landing gate` (D5606's shadow checks) and `test deps` (D5608, which
  # records the traces a pull request's `plan` reads). In the queue, fast runs only the checks
  # it alone makes, the migration and drift checkers loaded from the trusted
  # base; its gitleaks, typecheck and build steps are skipped there because
  # the required `scan`, `worker (typecheck)` and `frontend (build)` run the
  # same commands on the same candidate (D7108). Every other job here is not
  # required, already ran on the pull request, and would only hold runners
  # the queue needs, so each is skipped under `merge_group`
  # (`if: github.event_name != 'merge_group'`).
  # frontend/test/merge_queue_ci_4107.test.mjs keeps both lists honest.
  merge_group:
    types: [checks_requested]

# A pull request's run is cancelled by its next push: only its head matters.
# A push to main is NEVER cancelled, and each push is its own group (D1279).
# With one group per ref, every merge cancelled the run before it, so main's
# full suite had not finished once on 2026-10-26: #3165 and #3236 crossed and
# left a README naming a deleted file, main went red unseen for an hour, and
# every PR that merged main failed on it and wrote its own fix to the same
# line, which then conflicted. A finished run per main commit names the merge
# that broke it. Same rule as migration-immutability.yml.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Frontend: typecheck + build. The build is the contract — if Vite can't
  # produce docs/, the deploy is broken regardless of unit tests.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # -------------------------------------------------------------------------
  # Worker: typecheck the production worker so a broken worker tree blocks
  # merge before it ever reaches `wrangler deploy`.
  # -------------------------------------------------------------------------
  worker:
    name: worker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: Build the generated modules (D5612)
        run: node ../scripts/build-generated.mjs
      - name: TypeScript check
        # --no-install: fail loudly if `npm ci` didn't install the local
        # typescript, instead of silently fetching the unrelated `tsc` package.
        run: npx --no-install tsc --noEmit

  # -------------------------------------------------------------------------
  # The full gate: every frontend + worker test, then the static guards and the
  # worker typecheck. `npm run test:drift` globs its test files rather than
  # naming them, so a new test file is covered the moment it lands — 29 of 89
  # worker test files used to be omitted from the hand-maintained list, and one
  # of them had been failing unnoticed.
  #
  # This gate is why the suite exists. Without it the gate only ran on whichever
  # developer remembered, which is how a ReferenceError that `test:drift` catches
  # in seconds reached main (PR #218).
  #
  # D4130 (#4130): the suite runs in PARTS, in parallel. As one job it took 74
  # minutes on one runner (main at c8c362cd17), on every push to every PR. The
  # `suite` matrix runs one part each (scripts/test-drift-parts.mjs: the
  # frontend and worker suites packed by measured duration, plus `rest`, the
  # other steps of test:drift in order); the parts are derived from
  # package.json's test:drift, and ci_suite_parts_4130.test.mjs proves their
  # union is exactly the suite and that this matrix lists exactly them. The
  # required check is still the job named `test:drift (full suite)`, below.
  # It always runs and passes only when every part passed.
  #
  # On a push to main, `verified` looks for a successful merge-queue run of
  # this workflow on the SAME commit. The queue merges the very commit it
  # tested, so a second full run would test identical code. Only then are the
  # parts skipped; when the queue is off, when nothing is found, or when the
  # lookup fails, the full suite runs (D1279: main still finishes a run for
  # every commit, and that run names the queue run it relies on).
  # -------------------------------------------------------------------------
  verified:
    name: already verified in the merge queue
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.lookup.outputs.run }}
    steps:
      - name: A successful merge_group run of ci.yml on this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The queue merges as soon as its required checks pass, so the queue
        # run can still be closing when this push starts: look four times,
        # 20 seconds apart. A miss, or a failed call, means the suite runs.
        run: |
          run=''
          for attempt in 1 2 3 4; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success&per_page=1" \
              --jq '.workflow_runs[0] | select(.head_sha == env.SHA and .event == "merge_group" and .conclusion == "success") | .html_url' || true)
            [ -n "$run" ] && break
            [ "$attempt" -lt 4 ] && sleep 20
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "The merge queue already passed the full suite on $SHA: $run"
          else
            echo "No merge-queue run passed on $SHA, so the full suite runs."
          fi

  # D7108 part 2 (#7108): never in the merge queue. There the part list is
  # always the full nine (prTier), so `suite` lists it literally and each part
  # computes the same equal-weight plan from its own checkout: no runner hop
  # before the matrix. On a pull request and a push this job is unchanged.
  plan:
    name: suite plan
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.run == '' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      capacity_submission: ${{ steps.capacity.outputs.capacity_submission }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Newest main timing artifact, or equal weights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/download-test-timings.sh
      - name: Generate the exact-once plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          full_parts=$(node scripts/test-drift-parts.mjs --plan test-timings.json)
          parts=$(node --input-type=module -e '
            import { tierFor } from "./scripts/lib/prTier.mjs";
            const tier = tierFor({ event: process.env.EVENT, draft: process.env.DRAFT === "true" });
            console.log(tier.parts === null ? process.argv[1] : JSON.stringify(tier.parts));
          ' "$full_parts")
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: plan_artifact
        with:
          name: suite-plan
          path: suite-plan.json
          if-no-files-found: error
          retention-days: 3
      # D7909: optional metadata only; no OIDC and no waiting. Failure cannot stop ordinary hosted CI.
      - name: Prepare capacity pilot submission
        id: capacity
        if: github.repository == 'AxalNetwork/StudioOS' && github.event_name == 'push' && vars.CI_CAPACITY_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CAPACITY_ENABLED: ${{ vars.CI_CAPACITY_ENABLED }}
          CI_CAPACITY_EXECUTOR_SHA: ${{ vars.CI_CAPACITY_EXECUTOR_SHA }}
          CI_CAPACITY_CHILD_WORKFLOW_SHA: ${{ vars.CI_CAPACITY_CHILD_WORKFLOW_SHA }}
          CAPACITY_PLAN_ARTIFACT_ID: ${{ steps.plan_artifact.outputs['artifact-id'] }}
          CAPACITY_PLAN_FILE: ${{ github.workspace }}/suite-plan.json
        run: node scripts/ci/capacity-submission.mjs

  # D7909: default-off, main-push pilot only. No ordinary job depends on this submission.
  capacity-submit:
    name: capacity pilot submission
    needs: plan
    if: ${{ !cancelled() && github.event_name != 'merge_group' && github.event_name == 'push' && github.repository == 'AxalNetwork/StudioOS' && vars.CI_CAPACITY_ENABLED == 'true' && needs.plan.outputs.capacity_submission != '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    # Exact local preparation pin; publication and activation remain held under #5719.
    # D8335: the pin must be a commit on main. 3d41671dfe is #8658's merge commit and carries the reviewed D8626
    # planner (blob 40b0b0fa) byte for byte. The previous pin, cb63d3997d (#8234, blob 4f7dfaca), submitted on main
    # pushes only. The first pin, 19927c89, became unreachable when its branch was deleted.
    uses: AxalNetwork/StudioOS/.github/workflows/capacity-planner.yml@3d41671dfe12dee4d5872e8909fe920041069a88
    with:
      submission: ${{ needs.plan.outputs.capacity_submission }}
      executor_sha: ${{ vars.CI_CAPACITY_EXECUTOR_SHA }}
      child_workflow_sha: ${{ vars.CI_CAPACITY_CHILD_WORKFLOW_SHA }}

  # D8626 (#8626): merge-queue routing, off unless vars.CI_CAPACITY_QUEUE_ROUTING is 'true' as well as
  # CI_CAPACITY_ENABLED. That variable is switched on only in the same change that makes main's ruleset require the
  # coordinator's App-owned `ci-capacity/full-suite` (S39's consumer cutover, #7909), and capacity-submission.mjs
  # refuses to prepare a submission until the live ruleset does. When it is off (every pull request, every push,
  # and the queue today) both jobs are skipped before they start and `suite` runs exactly as before.
  route:
    name: capacity route submission
    if: ${{ github.event_name == 'merge_group' && github.repository == 'AxalNetwork/StudioOS' && vars.CI_CAPACITY_ENABLED == 'true' && vars.CI_CAPACITY_QUEUE_ROUTING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      capacity_submission: ${{ steps.capacity.outputs.capacity_submission }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      # Metadata only: no OIDC, no waiting. A refusal or an error leaves the output empty and the queue hosted.
      - name: Prepare the merge-queue capacity submission
        id: capacity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CAPACITY_ENABLED: ${{ vars.CI_CAPACITY_ENABLED }}
          CI_CAPACITY_QUEUE_ROUTING: ${{ vars.CI_CAPACITY_QUEUE_ROUTING }}
          CI_CAPACITY_EXECUTOR_SHA: ${{ vars.CI_CAPACITY_EXECUTOR_SHA }}
          CI_CAPACITY_CHILD_WORKFLOW_SHA: ${{ vars.CI_CAPACITY_CHILD_WORKFLOW_SHA }}
          CI_CAPACITY_FULL_SUITE_APP_ID: ${{ vars.CI_CAPACITY_FULL_SUITE_APP_ID }}
          MACBOOK_WORKER_ENABLED: ${{ vars.MACBOOK_WORKER_ENABLED }}
          CAPACITY_SOURCE_ROOT: ${{ github.workspace }}
        run: node scripts/ci/capacity-submission.mjs

  # D8626: the trusted planner, at the same reviewed pin as `capacity-submit` (D8335: a main commit). Its
  # `accepted` output is the only thing that lets a Worker part skip its tests. The planner revision pinned today
  # submits on main pushes only, so until a later PR moves both pins this job ends with `accepted` unset.
  capacity-route:
    name: capacity route
    needs: route
    if: ${{ !cancelled() && github.event_name == 'merge_group' && github.repository == 'AxalNetwork/StudioOS' && vars.CI_CAPACITY_ENABLED == 'true' && vars.CI_CAPACITY_QUEUE_ROUTING == 'true' && needs.route.outputs.capacity_submission != '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: AxalNetwork/StudioOS/.github/workflows/capacity-planner.yml@3d41671dfe12dee4d5872e8909fe920041069a88
    with:
      submission: ${{ needs.route.outputs.capacity_submission }}
      executor_sha: ${{ vars.CI_CAPACITY_EXECUTOR_SHA }}
      child_workflow_sha: ${{ vars.CI_CAPACITY_CHILD_WORKFLOW_SHA }}

  suite:
    name: suite (${{ matrix.part }})
    # D8435: no `plan` here. On a pull request the parts used to wait for the plan
    # job to find a runner and finish before they were even created.
    # D8626: `capacity-route` is skipped before it starts unless queue routing is on, so
    # only a routed queue candidate waits for it, and then all nine parts do (one job).
    needs: [verified, capacity-route]
    # Runs whenever `verified` found nothing (always on a PR and in the queue,
    # where `verified` is skipped, and when its lookup failed).
    if: ${{ !cancelled() && needs.verified.outputs.run == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      checks: read
    # D8626: a Worker part the coordinator accepted runs there, not here, and reports through the App-owned
    # `ci-capacity/full-suite`. Only that exact `accepted` output routes a part; anything else runs it hosted. The
    # steps are unchanged (runner-benchmark.yml mirrors them, D5611): test-drift-parts.mjs reads these two values
    # and, for a routed Worker part only, says where it runs instead of running it.
    env:
      CAPACITY_ROUTED: ${{ github.event_name == 'merge_group' && needs.capacity-route.outputs.accepted == 'true' && startsWith(matrix.part, 'worker-') }}
      CAPACITY_REQUEST_ID: ${{ needs.capacity-route.outputs.request_id }}
    # D7881: only the optional Mac part reserves time for its bounded handoff
    # and a complete hosted fallback. The queue's existing bound is 90 minutes.
    timeout-minutes: ${{ matrix.part == 'worker-1-of-6' && vars.MACBOOK_WORKER_ENABLED == 'true' && github.event_name != 'pull_request' && 83 || 50 }}
    strategy:
      # Queue entries cannot land after a failure. PRs and pushes report every part.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      # D7108 part 2, D8435: the parts are a literal on every event, so no job
      # runs before this one. A draft pull request runs the fast tier, `rest`
      # (ci_pr_plan_8435 pins that to prTier.mjs); everything else runs the full
      # tier in partsOf order (ci_suite_parts_4130 pins this list to SHARDS).
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["rest"]' || '["frontend-1-of-2","frontend-2-of-2","worker-1-of-6","worker-2-of-6","worker-3-of-6","worker-4-of-6","worker-5-of-6","worker-6-of-6","rest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
            package-lock.json
      # D7108 part 2, D8435: no job plans for this one, on any event. Each part
      # writes the exact-once plan itself from this commit with equal weights (no
      # timings file, no API, no artifact), so every part of a run writes the same
      # bytes. It fails this part, never drops one, when this part is not in the
      # plan, or when the matrix is not the plan's parts a whole number of times
      # (once in CI; once a lane in the runner benchmark, which shares these
      # steps). A draft tier must be exactly one part.
      - name: Exact-once plan from this commit
        env:
          PART: ${{ matrix.part }}
          TOTAL: ${{ strategy.job-total }}
          DRAFT_TIER: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          names=$(node scripts/test-drift-parts.mjs --plan --equal-weights)
          node --input-type=module -e '
            const names = JSON.parse(process.argv[1]);
            const { PART, TOTAL, DRAFT_TIER } = process.env;
            const total = Number(TOTAL);
            const whole = DRAFT_TIER === "true" ? total === 1 : total >= names.length && total % names.length === 0;
            if (!whole || !names.includes(PART)) {
              console.error(`::error::The suite matrix (${TOTAL} parts, this one "${PART}") does not match the plan: ${names.join(", ")}.`);
              process.exit(1);
            }
            console.log(`Equal-weight plan, ${names.length} parts; this part is ${PART}.`);
          ' "$names"
      # Every part installs the worker's and the root dependencies. Only the
      # frontend-* parts and rest install frontend's: they import React deck
      # templates through the vite loader and run the root SPA build, which
      # needs vite. The worker-* parts run test:worker alone, which reads
      # neither frontend/node_modules nor docs/ (D7108,
      # frontend/test/ci_worker_parts_7108.test.mjs).
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
        if: ${{ !startsWith(matrix.part, 'worker') }}
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci
      # D5398: D4558's independent-recovery tests require the real age CLI.
      # The Ubuntu 26 security.ubuntu.com mirror has intermittently failed DNS
      # across unrelated PRs; pin a release SHA256 rather than apt-fetching it.
      # The script installs locally to RUNNER_TEMP and adds only age to PATH.
      - name: Install age
        if: startsWith(matrix.part, 'frontend')
        run: bash scripts/ci/install-age-linux.sh
      # docs/ is not committed (D529), and part of the suite reads the built
      # SPA (check-docs-assets-closure, the tests that open docs/), so build
      # it first — the same root build the deploy runs. Those tests are all in
      # test:frontend and rest; the worker-* parts read no docs/ (D7108).
      - name: Build the SPA
        run: npm run build
        if: ${{ !startsWith(matrix.part, 'worker') }}
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      # D7881: the controller only delegates the selected Worker part. It
      # preserves a real test failure and returns to hosted on unavailability.
      - name: Try the MacBook for one Worker shard
        id: macbook
        if: vars.MACBOOK_WORKER_ENABLED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.part }}
          MACBOOK_WORKER_ENABLED: ${{ vars.MACBOOK_WORKER_ENABLED }}
        run: node scripts/ci/macbook-worker.mjs
      # D5608: trace what each test file reads and how long it takes, on the
      # queue and on main only (never a PR run, never a benchmark branch). An
      # empty value leaves the tracer inert, so the run line is the same for
      # every event.
      - run: node scripts/test-drift-parts.mjs ${{ matrix.part }} --plan-file suite-plan.json
        env:
          CI_FAILURE_DIR: ${{ runner.temp }}/ci-failures
          CI_FAILURE_PART: ${{ matrix.part }}
          CI_FAILURE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          TEST_TRACE_DIR: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/main') && format('{0}/test-traces', runner.temp) || '' }}
        if: steps.macbook.outputs.delegated != 'true'
      - name: Upload bounded failure evidence (D5502)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-failures/failures.json
          if-no-files-found: ignore
          retention-days: 3
      # D7124: the test files this pull request adds or edits, run again with
      # the clock 7 days and 9 days 11 hours ahead under libfaketime (as the
      # nightly does, D5398), so a date-bound test fails here and not on main
      # (#7108: 6 h 25 min with nothing merged). Non-draft PRs only, in the
      # `rest` part, which has every install and the built SPA; never under
      # merge_group. No changed test file: nothing is installed.
      - name: Changed tests with the clock moved ahead (D7124)
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && matrix.part == 'rest'
        env:
          FUTURE_CLOCK_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(node scripts/future-clock-changed.mjs --list)
          if [ -z "$files" ]; then exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq faketime
          node scripts/future-clock-changed.mjs
      - name: Collect the delegated Mac test traces
        if: always() && steps.macbook.outputs.delegated == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macbook-worker-traces
          run-id: ${{ steps.macbook.outputs.child_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/test-traces
      - name: Upload this part's test traces
        if: always() && (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-traces-${{ matrix.part }}
          path: ${{ runner.temp }}/test-traces
          if-no-files-found: ignore
          retention-days: 3
      - name: Cancel the owned Mac run when CI is cancelled
        if: cancelled() && steps.macbook.outputs.child_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.part }}
          MACBOOK_WORKER_ENABLED: ${{ vars.MACBOOK_WORKER_ENABLED }}
          CHILD_RUN_ID: ${{ steps.macbook.outputs.child_run_id }}
        run: node scripts/ci/macbook-worker.mjs --cancel-owned

  # D5608: one dependency and timing artifact per commit, merged from the
  # parts' traces. Advisory: neither `landing` nor `gate` needs it, so its
  # failure never blocks a merge. It runs in the queue on purpose, because a
  # push that `verified` skips has no traces of its own: the queue run on the
  # same SHA carries them (a pull request's `plan` job reads its
  # test-timings.json; the queue plans with equal weights, D7108 part 2).
  test-deps:
    name: test deps
    needs: suite
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.suite.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-traces-*
          path: ${{ runner.temp }}/test-traces
      - name: Merge the parts' traces
        run: |
          mkdir -p "$RUNNER_TEMP/test-traces"
          node scripts/ci/merge-test-deps.mjs "$RUNNER_TEMP/test-traces" "$RUNNER_TEMP/test-deps" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-deps-${{ github.sha }}
          path: |
            ${{ runner.temp }}/test-deps/test-deps.json
            ${{ runner.temp }}/test-deps/test-timings.json
          if-no-files-found: error
          retention-days: 30

  # D5606: shadow the replacement for the existing required checks.
  fast:
    name: ci / fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      required: ${{ steps.verdict.outputs.required }}
      advisory: ${{ steps.verdict.outputs.advisory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
        id: checkout
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare-worker/package-lock.json
        id: node
        if: ${{ !cancelled() }}
      - name: Load trusted scanner installer
        id: scanner_pins
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MAIN_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) trusted="$PR_BASE" ;;
            merge_group) trusted="$GROUP_BASE" ;;
            push|schedule)
              [[ "$REF" == refs/heads/main ]] || exit 1
              trusted="$MAIN_SHA" ;;
            *) echo "Unsupported scanner acquisition event" >&2; exit 1 ;;
          esac
          [[ "$trusted" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing trusted scanner base" >&2; exit 1; }
          git cat-file -e "$trusted^{commit}" || git fetch --no-tags origin "$trusted" --depth=1
          installer="$RUNNER_TEMP/trusted-scanner-installer"
          mkdir -p "$installer"
          for source in install-scanner.mjs scanner-acquisition.mjs scanner-tools.json; do
            git show "$trusted:scripts/ci/$source" > "$installer/$source"
          done
          echo "installer=$installer/install-scanner.mjs" >> "$GITHUB_OUTPUT"
          node "$installer/install-scanner.mjs" gitleaks --metadata
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Restore pinned gitleaks archive
        id: scanner_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.scanner_pins.outputs.cache-file }}
          key: ${{ steps.scanner_pins.outputs.key }}
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.scanner_pins.outcome == 'success' }}
      - name: Install gitleaks
        id: install_scanner
        run: node "${{ steps.scanner_pins.outputs.installer }}" gitleaks
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.scanner_pins.outcome == 'success' }}
      - name: Save verified gitleaks archive on main only
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.install_scanner.outcome == 'success' && steps.scanner_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.scanner_pins.outputs.cache-file }}
          key: ${{ steps.scanner_pins.outputs.key }}
      - name: Determine scan range
        id: range
        run: |
          # Scan only the commits introduced by this push / PR rather than the
          # entire public history. A new secret is still caught on the commit
          # that introduces it, but CI no longer fails forever on historical
          # leaks that cannot be rewritten without breaking every fork, open
          # Dependabot PR and the backup mirror (see the `commits` allowlist in
          # .gitleaks.toml for the running list of those unchangeable findings).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "logopts=--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # #4107: the queue entry is main (base_sha) plus the queued PRs, so
            # the range is every commit the queue would merge.
            echo "logopts=--log-opts=${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "logopts=--log-opts=-1" >> "$GITHUB_OUTPUT"
            else
              echo "logopts=--log-opts=${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
        if: ${{ !cancelled() }}
      - name: Run gitleaks
        run: |
          # Uses the project-specific config which extends the upstream default
          # ruleset and adds project allowlists. Commit range scoped above.
          gitleaks detect \
            --config=.gitleaks.toml \
            --source=. \
            ${{ steps.range.outputs.logopts }} \
            --redact \
            --verbose \
            --no-banner \
            --exit-code=1
        id: scan
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.install_scanner.outcome == 'success' && steps.range.outcome == 'success' }}
      - name: Load static checkers from the trusted base
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "$EVENT" == push && "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA="$GITHUB_SHA"
          fi
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          trusted="$RUNNER_TEMP/fast-guards"
          mkdir -p "$trusted"
          guards=(scripts/migration-immutability-gate.mjs scripts/lib/migrationImmutability.mjs
            scripts/lfs-size-gate.mjs scripts/check-api-drift.mjs scripts/lib/apiModules.mjs scripts/lib/routeRegistry.mjs)
          # D5612 adds a dependency to the archived drift checker. Older bases
          # still use the standalone checkers and have no helper to archive.
          if git cat-file -e "$BASE_SHA:scripts/lib/generatedOutput.mjs" 2>/dev/null; then
            guards+=(scripts/lib/generatedOutput.mjs)
          fi
          git archive "$BASE_SHA" "${guards[@]}" | tar -x -C "$trusted"
          ln -s "$GITHUB_WORKSPACE/frontend" "$trusted/frontend"
          ln -s "$GITHUB_WORKSPACE/cloudflare-worker" "$trusted/cloudflare-worker"
          ln -s "$GITHUB_WORKSPACE/scripts/api-drift-baseline.json" "$trusted/scripts/api-drift-baseline.json"
        id: trusted
        if: ${{ !cancelled() }}
      - name: No migration on the base was edited, deleted or renamed
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MIGRATION_GATE_BEFORE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: node "$RUNNER_TEMP/fast-guards/scripts/migration-immutability-gate.mjs"
        id: migrations
        if: ${{ !cancelled() }}
      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
        id: lfs_base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      - name: Run LFS size gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/fast-guards/scripts/lfs-size-gate.mjs" --against="origin/$GITHUB_BASE_REF"
        id: lfs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      # D5612: the API index and route registry are built, not committed. The
      # base's drift checker re-renders them from the folders and compares.
      - name: Build the generated modules (D5612)
        run: node scripts/build-generated.mjs
        id: generated
        if: ${{ !cancelled() }}
      - name: Run drift checker
        run: node "$RUNNER_TEMP/fast-guards/scripts/check-api-drift.mjs"
        id: drift
        if: ${{ !cancelled() }}
      - run: npm ci
        working-directory: cloudflare-worker
        id: worker_install
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: TypeScript check
        run: npx --no-install tsc --noEmit
        working-directory: cloudflare-worker
        id: worker_typecheck
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - run: npm ci
        working-directory: frontend
        id: frontend_install
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - run: npm run build
        working-directory: frontend
        id: frontend_build
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical
        id: frontend_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        working-directory: frontend
      - name: npm audit (prod deps, critical fail)
        run: node ../scripts/npm-audit-gate.mjs --level=critical
        id: worker_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        working-directory: cloudflare-worker
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
        id: python
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Test the PyPI retry policy
        run: python -m unittest discover -s scripts -p test_pip_audit_gate.py
        id: pip_test
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
        id: pip_install
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: pip-audit (audit requirements.txt only)
        run: python scripts/pip_audit_gate.py
        id: pip_audit
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Check the projection
        run: node scripts/build-profile-routing.mjs --check
        id: routing_check
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Build the routing docs
        run: node scripts/build-profile-routing.mjs
        id: routing
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Build the authorization inventory
        run: node scripts/build-auth-inventory.mjs
        id: auth
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Keep the routing docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: routing-docs
          path: |
            documentation/architecture/PROFILE_ROUTING.md
            documentation/architecture/PAGE_INVENTORY.md
            documentation/architecture/AUTH_INVENTORY.json
          if-no-files-found: error
          retention-days: 30
        id: routing_upload
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
      - name: Report required and advisory results
        id: verdict
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL_SCANNER: ${{ steps.install_scanner.outcome }}
          RANGE: ${{ steps.range.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          TRUSTED: ${{ steps.trusted.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
          WORKER_INSTALL: ${{ steps.worker_install.outcome }}
          WORKER_TYPECHECK: ${{ steps.worker_typecheck.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          LFS_BASE: ${{ steps.lfs_base.outcome }}
          LFS: ${{ steps.lfs.outcome }}
          FRONTEND_AUDIT: ${{ steps.frontend_audit.outcome }}
          WORKER_AUDIT: ${{ steps.worker_audit.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          PIP_TEST: ${{ steps.pip_test.outcome }}
          PIP_INSTALL: ${{ steps.pip_install.outcome }}
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          ROUTING_CHECK: ${{ steps.routing_check.outcome }}
          ROUTING: ${{ steps.routing.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          ROUTING_UPLOAD: ${{ steps.routing_upload.outcome }}
        run: |
          required=pass
          # Run on every event, so each must succeed.
          for outcome in "$CHECKOUT" "$NODE" "$RANGE" "$TRUSTED" "$MIGRATIONS" "$DRIFT"; do
            if [[ "$outcome" != success ]]; then required=fail; fi
          done
          # D7108: skipped in the merge queue only, where the required `scan`,
          # `worker (typecheck)` and `frontend (build)` jobs run the same
          # commands on the same candidate. Skipped anywhere else is a fail.
          for outcome in "$INSTALL_SCANNER" "$SCAN" "$WORKER_INSTALL" "$WORKER_TYPECHECK" \
                         "$FRONTEND_INSTALL" "$FRONTEND_BUILD"; do
            if [[ "$outcome" == success ]]; then continue; fi
            if [[ "$EVENT" == merge_group && "$outcome" == skipped ]]; then continue; fi
            required=fail
          done
          advisory=pass
          if [[ "$EVENT" == pull_request && ( "$LFS_BASE" != success || "$LFS" != success ) ]]; then
            advisory=fail
          fi
          if [[ "$EVENT" != merge_group ]]; then
            for outcome in "$FRONTEND_AUDIT" "$WORKER_AUDIT" "$PYTHON" "$PIP_TEST" "$PIP_INSTALL" "$PIP_AUDIT" \
                           "$ROUTING_CHECK" "$ROUTING" "$AUTH" "$ROUTING_UPLOAD"; do
              if [[ "$outcome" != success ]]; then advisory=fail; fi
            done
          fi
          printf 'required=%s\nadvisory=%s\n' "$required" "$advisory" >> "$GITHUB_OUTPUT"

  landing:
    name: landing gate
    needs: [verified, fast, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required fast checks and full suite passed
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          VERIFIED_RUN: ${{ needs.verified.outputs.run }}
          SUITE: ${{ needs.suite.result }}
          REQUIRED: ${{ needs.fast.outputs.required }}
        run: |
          if [ "$REQUIRED" != pass ]; then
            echo "::error::Required fast checks did not pass."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ -n "$VERIFIED_RUN" ] && [ "$SUITE" = "skipped" ]; then
            echo "The merge queue passed the full suite on this commit: $VERIFIED_RUN"
            exit 0
          fi
          if [ "$SUITE" = "success" ]; then
            if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
              echo "The draft fast tier passed."
            else
              echo "Every part of test:drift passed."
            fi
            exit 0
          fi
          echo "::error::test:drift did not pass: the suite parts ended '$SUITE'."
          exit 1

  gate:
    # A skipped required check would count as passed. The draft run must
    # publish a different context so the full-suite context stays pending.
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'test:drift (draft fast tier)' || 'test:drift (full suite)' }}"
    needs: [verified, plan, capacity-route, suite]
    # Always, never skipped: a skipped required check reports as passed. This
    # job decides, and it passes only when every part passed — or, on a push
    # to main only, when the merge queue already passed this exact commit.
    # `plan` must have succeeded, except in the merge queue, where it must
    # have been skipped: there each part plans for itself (D7108 part 2).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of test:drift passed
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          VERIFIED_RUN: ${{ needs.verified.outputs.run }}
          SUITE: ${{ needs.suite.result }}
          PLAN: ${{ needs.plan.result }}
          ROUTED: ${{ needs.capacity-route.outputs.accepted }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # D8626: a routed candidate's Worker parts ran in the coordinator, so `suite` passing here proves only
          # the hosted parts. This context may pass for it only while main's live rules require the App-owned
          # ci-capacity/full-suite, which carries the Worker result. Read again here: the rules can change after
          # the route job read them, and a submission alone must never be what lets a candidate land.
          if [ "$EVENT" = "merge_group" ] && [ "$ROUTED" = "true" ]; then
            required=$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.context == "ci-capacity/full-suite" and ((.integration_id // 0) > 0))] | length' || echo 0)
            if [ "${required:-0}" -lt 1 ]; then
              echo "::error::The Worker parts were routed to the capacity coordinator, but main does not require ci-capacity/full-suite from its App."
              exit 1
            fi
            echo "The Worker parts were routed; main requires ci-capacity/full-suite, which carries their result."
          fi
          if [ "$EVENT" = "push" ] && [ -n "$VERIFIED_RUN" ] && [ "$SUITE" = "skipped" ]; then
            echo "The merge queue passed the full suite on this commit: $VERIFIED_RUN"
            exit 0
          fi
          if { { [ "$PLAN" = "success" ] && [ "$EVENT" != "merge_group" ]; } || { [ "$PLAN" = "skipped" ] && [ "$EVENT" = "merge_group" ]; }; } && [ "$SUITE" = "success" ]; then
            if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
              echo "The draft fast tier passed."
            else
              echo "Every part of test:drift passed."
            fi
            exit 0
          fi
          echo "::error::test:drift did not pass: the suite parts ended '$SUITE'."
          exit 1


  # -------------------------------------------------------------------------
  # D5398 (#5398): when a PR's suite fails, say whether its red parts are its
  # own or inherited from a red main, so one repair goes to main and nobody
  # ports it, merges main or re-runs for it. Its own job, not a required check
  # and not part of the gate: it labels the failure and never changes it. It
  # reads this run's jobs, main's latest CI run and the red-main alert, and
  # cannot fail (continue-on-error; the script exits 0).
  # -------------------------------------------------------------------------
  selection-shadow:
    name: selection (shadow)
    needs: suite
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Read newest main dependency trace
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/commits?sha=main&per_page=100" > "$RUNNER_TEMP/main-commits.json"
          gh api "repos/$REPO/actions/artifacts?per_page=100" > "$RUNNER_TEMP/trace-candidates.json"
          node scripts/select-tests.mjs --main-artifact "$RUNNER_TEMP/trace-candidates.json" "$RUNNER_TEMP/main-commits.json" > "$RUNNER_TEMP/trace-artifact.json"
          artifact=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/trace-artifact.json')).id || ''")
          if [ -n "$artifact" ]; then
            gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/deps.zip"
            unzip -j "$RUNNER_TEMP/deps.zip" test-deps.json -d .
            created=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/trace-artifact.json')).created_at || ''")
            echo "TRACE_CREATED_AT=$created" >> "$GITHUB_ENV"
          fi
      - name: Read machine-readable CI failures
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-failures-*
          path: ci-failures
      - name: Record the shadow decision
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/select-tests.mjs || true
          if [ ! -s selection-shadow.json ]; then
            echo '{"kind":"selection-shadow","version":1,"mode":"full","reason":"shadow-setup-failed","scoring":"unscored","misses":null,"failing":null}' > selection-shadow.json
          fi
          exit 0
      - name: Keep one shadow record
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-shadow-${{ github.run_id }}
          path: selection-shadow.json
          if-no-files-found: error
          retention-days: 30

  classify:
    name: why CI failed (D5398)
    needs: [frontend, worker, verified, plan, suite, fast, landing, visual, drift, og-tags, dev-backend]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      - name: Is this failure the PR's own, or main's?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          CI_FAILURE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/ci-classify.mjs
      - name: Upload classified evidence (D5502)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures-classified-attempt-${{ github.run_attempt }}
          path: ci-failures-classified.json
          if-no-files-found: ignore
          retention-days: 3

  # -------------------------------------------------------------------------
  # D1511 (#3762): the Pitch deck editor's visual regression and axe suites
  # (frontend/tests/visual/). The fake AI binding, the contract schemas and
  # the property tests run inside `test:drift` above; these need a browser.
  #
  # PINNED CONTAINER. The baselines under tests/visual/__screenshots__/ were
  # drawn by Chromium build 1194 (141.0.7390.37) on Ubuntu 24.04, the browser
  # the Playwright 1.56.1 image ships, so the job runs in that image and points
  # the runner (@playwright/test from frontend/package-lock.json) at that
  # browser. Fonts are the suite's own files (tests/visual/fonts/), served in
  # place of Google Fonts; every other request off 127.0.0.1 is aborted. To
  # redraw a baseline, run the same command with --update-snapshots in this
  # image and review every PNG in the PR.
  # -------------------------------------------------------------------------
  visual:
    name: editor visual regression and axe
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a # v1.56.1-noble
      options: --user 1001
    env:
      PW_CHROMIUM_PATH: /ms-playwright/chromium-1194/chrome-linux/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: The pinned browser is the one the baselines were drawn with
        run: test -x "$PW_CHROMIUM_PATH" && "$PW_CHROMIUM_PATH" --version | grep -F '141.0.7390.37'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install worker deps
        working-directory: cloudflare-worker
        run: npm ci
      - name: Install root deps
        run: npm ci
      - name: Build the SPA
        run: npm run build
      - name: Visual regression and axe on the editor
        working-directory: frontend
        run: npx --no-install playwright test -c tests/visual/playwright.config.mjs
      # #5933 (D4819-p5933): the Licences console at 390px and 1280px. The spec
      # serves the docs/ built above itself and answers every /api/* call with
      # invented fixtures, so it needs no preview and no account.
      - name: Licences console in the browser (fixtures, no preview)
        working-directory: frontend
        run: npx --no-install playwright test -c playwright.config.js tests/e2e/licences_console_5933.spec.js --retries=0
      # #7517 (D7517): Advisor › Expertise, its Overview and five zones, at 390,
      # 768 and 1440 in light and dark: no WCAG 2.2 AA axe violation in its
      # column, the phone section row, More and 44px targets. Same docs/ and
      # fixtures pattern as the step above; no trace is recorded.
      - name: Expertise axe and phone navigation (fixtures, no preview)
        working-directory: frontend
        run: npx --no-install playwright test -c playwright.config.js tests/e2e/expertise_axe_7517.spec.js --retries=0 --trace off
      # #7808 (D7808): the company switcher's accessible name (D7661) with no company, a failed read and a company,
      # and an axe scan of the Worker rail with its Not recorded line (D7662), light and dark. Same docs/ and
      # fixtures pattern as the step above; no axe rule is disabled and no trace is recorded.
      - name: Switcher name and rail absent colour (fixtures, no preview)
        working-directory: frontend
        run: npx --no-install playwright test -c playwright.config.js tests/e2e/switcher_rail_7808.spec.js --retries=0 --trace off
      # #8537 (D8537): the public journey at 1440 and 390 — Pricing to sign-up and back to the plan's checkout, a Grow
      # action through sign-in and back, a session that ended back in by the email link. The local Worker in
      # tests/e2e/_helpers.js serves the docs/ built above and keeps the sign-in links in an outbox; no email, no account.
      - name: Public journey (local Worker, fixtures, no preview)
        working-directory: frontend
        run: npx --no-install playwright test -c playwright.config.js tests/e2e/public_journey.spec.js --retries=0 --trace off
      - name: Keep the report and the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-visual-report
          path: |
            frontend/tests/visual/playwright-report
            frontend/tests/visual/test-results
            frontend/test-results
          retention-days: 14

  # -------------------------------------------------------------------------
  # API ↔ Worker drift smoke test (T1). Static analysis: every /api/* path
  # called from frontend/src/lib/api.js MUST be mounted on the production
  # worker, OR be allowlisted with a tracking task id.
  # -------------------------------------------------------------------------
  drift:
    name: api ↔ worker drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check merge queue ref still exists
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/queue-ref-alive.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Build the generated modules (D5612)
        run: node scripts/build-generated.mjs
      - name: Run drift checker
        run: node scripts/check-api-drift.mjs

  # -------------------------------------------------------------------------
  # Open Graph / social-preview gate.
  #
  # Guards the "every axal.vc link previews with the same wrong image" class of
  # regression. docs/ is not committed (D529), so this job builds it from the
  # PR's source with the same root build the deploy runs, then checks those
  # bytes: a route that stopped being prerendered, an og:image pointing at a
  # file that does not exist, a relative image URL, or a card that is not
  # 1200x630. Checking the PR's own build is what the old freshness step only
  # approximated.
  # -------------------------------------------------------------------------
  og-tags:
    name: open graph metadata
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Build the SPA
        run: npm run build
      - name: Prerendered routes are current
        run: node scripts/prerender-og.mjs --check
      - name: Card images are current
        # ubuntu-latest ships Google Chrome; the script skips loudly (and says
        # what is no longer covered) if no browser is present.
        run: node scripts/generate-og-images.mjs --check
      - name: Validate tags in built output
        run: node scripts/validate-og-tags.mjs

  # -------------------------------------------------------------------------
  # FastAPI dev backend: import + smoke. Catches obvious Python breakage in
  # the dev environment so Replit sessions don't start broken. We do NOT
  # treat dev failure as a deploy gate (FastAPI is not deployed) but we DO
  # want to know early.
  # -------------------------------------------------------------------------
  dev-backend:
    name: dev backend (import smoke)
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum runtime
        run: |
          python -m pip install --upgrade pip
          # Dev-only requirements pinned in repo. Ignore failures here only
          # if the project hasn't published a requirements file yet.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Import smoke
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import importlib; importlib.import_module('backend.app.main'); print('ok')"
      - name: Company API contract tests
        env:
          DATABASE_URL: sqlite:///./ci-company-tests.db
        run: |
          python3 -m unittest backend/tests/test_company_fields_d4962.py
          python3 -m unittest backend/tests/test_company_routes_d5367.py

  digest:
    name: CI failure digest (#5619)
    needs: [frontend, worker, suite, drift]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: '22'
      - name: Publish from the base commit, when installed there
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          CI_FAILURE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/ci-digest.mjs ]; then
            node scripts/ci-digest.mjs
          else
            echo 'CI digest starts after #5619 merges onto the base branch.'
          fi
