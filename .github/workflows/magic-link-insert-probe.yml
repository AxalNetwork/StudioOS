name: magic-link insert probe

# The production HQ Worker requests one link for the configured test mailbox
# at 03:45 UTC and every four hours afterwards. A scheduled Actions run reads
# the receipt and checks the two row IDs captured during that same request.
# Retrying the scheduled Actions job only rereads D1. A manual public-edge
# dispatch sends a new request through the normal public sign-in endpoint.
#
# FOUR VERDICTS:
#   start_latency       The application answered within its latency budget.
#   endpoint_accepted   The response to the request was HTTP 202.
#   token_row_written   A matching magic_link_tokens row was recorded.
#   mail_send_recorded  The associated email_send_log row reached sent.
#
# Free Bot Fight Mode challenged the public runner in incident #1008. The
# private scheduled check exercises the Worker, its rate limits, D1 and mail
# queue. The separate magic-link-probe.yml checks inbox arrival and sign-in.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Check the public endpoint or read the latest Worker application check
        type: choice
        required: true
        default: public-edge
        options:
          - public-edge
          - scheduled-canary
  schedule:
    # The Worker requests the link 15 minutes earlier. This job only reads its D1 evidence.
    # Manual public-edge runs still send; the shared concurrency group below covers them.
    - cron: '0 */4 * * *'

# Both probes send a single-use link to the same test mailbox.
concurrency:
  group: production-magic-link-mailbox
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  probe:
    name: magic-link insert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Observe the scheduled application check
        if: github.event_name == 'schedule' || inputs.probe == 'scheduled-canary'
        env:
          MAGIC_PROBE_EMAIL: ${{ secrets.MAGIC_PROBE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-magic-link-canary.mjs

      # `continue-on-error` lets the report step below run and re-decide, and
      # nothing more; the exit CODE is captured because 1 and 2 differ.
      - name: Ask for a link, then look for its row and its send
        id: probe
        if: github.event_name == 'workflow_dispatch' && inputs.probe != 'scheduled-canary'
        continue-on-error: true
        env:
          MAGIC_PROBE_EMAIL: ${{ secrets.MAGIC_PROBE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/check-magic-link-insert.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # ONLY exit 0 IS GREEN, per D78. Exit 2 here has a second meaning worth
      # keeping distinct: the API token may lack D1 read, and reporting that as
      # "no row was written" would send someone hunting a production auth bug
      # that is really a permission.
      - name: Report the outcome
        if: github.event_name == 'workflow_dispatch' && inputs.probe != 'scheduled-canary'
        env:
          PROBE_CODE: ${{ steps.probe.outputs.code }}
          PROBE_OUTCOME: ${{ steps.probe.outputs.outcome }}
          PROBE_START_STATUS: ${{ steps.probe.outputs.start_status }}
          PROBE_FAILED_CHECKS: ${{ steps.probe.outputs.failed_checks }}
        run: |
          annotation=error
          exit_status=1
          case "$PROBE_CODE:$PROBE_OUTCOME" in
            0:ACCEPTED_NOT_VERIFIED)
              annotation=notice
              exit_status=0
              title="ACCEPTED_NOT_VERIFIED"
              detail='The endpoint returned 202 within budget, a fresh token row appeared, and the send log reached `status=sent`. The mailbox probe checks arrival and sign-in (`magic-link-probe.yml`).'
              ;;
            1:EDGE_CHALLENGED)
              title="EDGE_CHALLENGED"
              detail='The edge challenged the request. Use the cf-ray in the step log to find the Cloudflare event. Token insertion and mail handoff were NOT CHECKED.'
              ;;
            1:APPLICATION_REFUSED|1:REFUSED_UNATTRIBUTED)
              title="$PROBE_OUTCOME"
              detail='The endpoint did not accept the request. Read the HTTP response in the probe step. Token insertion and mail handoff were NOT CHECKED.'
              ;;
            1:APPLICATION_FAILED)
              title="APPLICATION_FAILED"
              if [ "$PROBE_START_STATUS" = 202 ]; then
                detail="The endpoint accepted the request. Failed checks: $PROBE_FAILED_CHECKS. The probe step records the measurements and send-log state."
              else
                detail='The probe received no HTTP response. Token insertion and mail handoff were NOT CHECKED.'
              fi
              ;;
            2:*)
              title="COULD NOT RUN"
              if [ "$PROBE_START_STATUS" = 202 ]; then
                detail='The endpoint accepted the request (HTTP 202). A D1 read failed before the probe could verify all four checks. See the probe step for the read error.'
              else
                detail='The probe could not start its checks. See the probe step for the missing configuration or D1 read error.'
              fi
              ;;
            *)
              title="INCOMPLETE PROBE RESULT"
              detail='The probe stopped without a recognized result. See the probe step for the execution error.'
              ;;
          esac
          printf '::%s title=Magic-link insert probe %s::%s\n' "$annotation" "$title" "$detail"
          printf '### Magic-link insert probe\n\n**%s**\n\n%s\n' "$title" "$detail" >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_status"
