name: magic-link insert probe

# Task #168, the half that needs no mailbox. `magic-link-probe.yml` is still the
# only probe that reads an inbox, follows the link and asserts a sign-in, and it
# cannot run until a Gmail OAuth app exists. This one asks for a link and then
# looks in production D1 — and D1 turns out to hold more than the token row.
#
# THREE VERDICTS:
#   start_latency       /magic/start answered under budget. The reported symptom.
#   token_row_written   a `magic_link_tokens` row appeared. Exactly where the
#                       outage died: D74's diagnosis found four rows, newest
#                       2026-08-03, and the failing attempt wrote none, so the
#                       request never reached the INSERT that is the endpoint's
#                       first act.
#   mail_send_recorded  the mail was handed to Gmail and ACCEPTED. `routes/auth.ts`
#                       sends through `services/email/send.ts`, which writes an
#                       `email_send_log` row (`status='queued'`) before enqueueing;
#                       the queue consumer marks it `sent` only when the Gmail API
#                       took it, and `failed` with a `last_error` otherwise.
#
# WHY THE THIRD ONE EXISTS. Without it this probe would pass on a login that sends
# no email at all: D74 moved the send to `waitUntil`, so the token row commits and
# the mail is a separate errand that can die in silence. That silence is legible in
# `email_send_log` — a row stuck at `queued`, or `failed` with a named cause.
#
# IT STILL DOES NOT PROVE THE MAIL ARRIVED. Gmail accepting a message is not an
# inbox (a bounce, a spam file or a wrong address all follow acceptance), and
# nothing here follows the link or asserts a session. `magic-link-probe.yml` does
# both and stays the only check that can close #168.
#
# SECRETS: two of the three already exist.
#   MAGIC_PROBE_EMAIL      the one to add. A real email is sent to it on every
#                          run, so it must be an inbox you own; a `+alias` of
#                          the sending account is the cheapest. It is the same
#                          secret the mailbox probe will want.
#   CLOUDFLARE_API_TOKEN   already a repository secret, documented with D1 scope
#   CLOUDFLARE_ACCOUNT_ID  already a repository secret
#
# SIDE EFFECTS PER RUN, both real: one row in production `magic_link_tokens`
# (expires in 15 minutes, never used) and one real email.

on:
  workflow_dispatch:
  schedule:
    # THE OFFSET FROM magic-link-probe.yml (`30 */4 * * *`) IS A CORRECTNESS
    # REQUIREMENT, NOT TIDINESS. Both probes request a link for the same address,
    # and the mailbox probe accepts any message whose `internalDate` post-dates
    # its own request. If this probe fired inside that polling window, the
    # mailbox probe would take THIS probe's email as its own, follow a perfectly
    # valid link, and pass without ever proving its own mail arrived — a false
    # pass on the one check whose entire value is being believed.
    #
    # Thirty minutes beats the sum of this probe's own budgets (15s for the token
    # row, 180s for the send) with minutes to spare, so the overlap is
    # impossible. `frontend/test/magic_link_insert_probe.test.mjs` asserts the gap
    # by parsing both crons and every budget out of source, so none can drift
    # alone.
    #
    # The union of both schedules is also two requests per 4h for one address,
    # far inside `magic-start-email`'s 3 per 900s.
    - cron: '0 */4 * * *'

permissions:
  contents: read

jobs:
  probe:
    name: magic-link insert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # `continue-on-error` lets the report step below run and re-decide, and
      # nothing more; the exit CODE is captured because 1 and 2 differ.
      - name: Ask for a link, then look for its row and its send
        id: probe
        continue-on-error: true
        env:
          MAGIC_PROBE_EMAIL: ${{ secrets.MAGIC_PROBE_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/check-magic-link-insert.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # ONLY exit 0 IS GREEN, per D78. Exit 2 here has a second meaning worth
      # keeping distinct: the API token may lack D1 read, and reporting that as
      # "no row was written" would send someone hunting a production auth bug
      # that is really a permission.
      - name: Report the outcome
        env:
          PROBE_CODE: ${{ steps.probe.outputs.code }}
        run: |
          case "$PROBE_CODE" in
            0)
              echo "::notice title=Magic-link INSERT and send both reached::/magic/start answered under budget, committed its token row, and Gmail accepted the mail. This does not prove it arrived."
              {
                echo '### Magic-link insert probe: PASS'
                echo
                echo '`/magic/start` answered under budget, a new `magic_link_tokens` row appeared, and the'
                echo '`email_send_log` row for it reached `status=sent` — so Gmail accepted the message.'
                echo 'That is the original #168 symptom confirmed gone, and the `waitUntil` send confirmed'
                echo 'to have actually run.'
                echo
                echo '**Arrival is NOT covered here.** Acceptance by Gmail is not an inbox — a bounce, a spam'
                echo 'file or a wrong address all follow it — and nothing here follows the link or asserts a'
                echo 'session. `magic-link-probe.yml` remains the only check that can close #168.'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::error title=Insert probe COULD NOT RUN::Either MAGIC_PROBE_EMAIL is unset or the Cloudflare token cannot read D1. Nothing was verified."
              {
                echo '### Magic-link insert probe: COULD NOT RUN'
                echo
                echo 'Nothing was verified — this is **not** a finding about the sign-in flow. Either:'
                echo
                echo '- `MAGIC_PROBE_EMAIL` is unset. It is the only secret this probe needs that does not'
                echo '  already exist; a `+alias` of the sending account works, and a real email is sent to it'
                echo '  on every run.'
                echo '- or `CLOUDFLARE_API_TOKEN` cannot read D1 on this account. The step log says which.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error title=Magic-link flow broken::The endpoint was slow, committed no token row, or the mail was never sent — the step log names which."
              {
                echo '### Magic-link insert probe: FAILED'
                echo
                echo 'The step log names which verdict failed:'
                echo
                echo '- `start_latency` — the endpoint is slow again; the reported #168 symptom.'
                echo '- `token_row_written` — **the request did not reach its INSERT.** This is exactly how the'
                echo '  outage presented: `magic_link_tokens` stopped gaining rows while the browser waited 30s.'
                echo '  Read the gates ahead of the INSERT in `cloudflare-worker/src/routes/auth.ts`.'
                echo '- `mail_send_recorded` — **the token row exists but no mail was sent.** A login that looks'
                echo '  healthy and delivers nothing. The detail says which of the three shapes it is:'
                echo '  no `email_send_log` row at all (the `waitUntil` errand never reached its own INSERT),'
                echo '  a row stuck at `queued` (enqueued, never delivered — check the `studioos-job-queue`'
                echo '  consumer and its DLQ), or `failed`/`dlq`, where `last_error` names the cause.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
