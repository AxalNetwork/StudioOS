#:schema node_modules/wrangler/config-schema.json
# ---------------------------------------------------------------------------
# Axal StudioOS – Cloudflare Worker configuration (root, canonical)
# ---------------------------------------------------------------------------
# This is the production-ready Wrangler config for the StudioOS API Worker.
#
# NOTE on architecture:
#   * The Cloudflare Worker is a TypeScript Hono app at
#     `cloudflare-worker/src/index.ts`. That is the live API at axal.vc.
#   * The Python FastAPI in `backend/` is a Replit-only dev backend used for
#     local iteration; it is NOT deployed to Cloudflare (Workers do not run
#     FastAPI). Do not change `main` to a Python file.
#
# Deploy:
#   npx wrangler deploy                       # production
#   npx wrangler deploy --env preview         # preview / staging
#
# Secrets are managed via `wrangler secret put <NAME>` (see .env.example).
# ---------------------------------------------------------------------------

name = "studioos"
main = "cloudflare-worker/src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
# Task #36 — workers.dev subdomain disabled. The worker is reachable
# only through its Workers Custom Domain `app.axal.vc` (see [[routes]]
# below). Re-enabling this also requires removing `app.axal.vc` from
# the OAuth-callback workers.dev guard in cloudflare-worker/src/index.ts.
workers_dev = false

# Epic 11 — minified production bundle. Wrangler runs esbuild with
# `minify: true`, which strips comments, mangles identifiers, and (most
# importantly here) drops dead-code branches so leftover console.log
# statements that we want kept for dev observability don't bloat the
# production bundle. It also reduces the worker startup latency on cold
# isolates by ~10-15% on a deploy this size.
# (Must live ABOVE any [[routes]]/[table] section — TOML doesn't end a
# table on blank lines, so a top-level key placed below `[[routes]]` is
# parsed as a member of that route entry and rejected by Wrangler 4.x.)
minify = true

# ---------- Worker Custom Domain ----------
# Task #36 — `app.axal.vc` is bound to this worker as a Workers Custom
# Domain (the entire hostname, not a path-scoped zone route). The worker
# serves BOTH the SPA (via [assets] below) and the `/api/*` routes.
#
# `custom_domain = true` makes Wrangler manage the binding through the
# Workers domains API on deploy, including automatic DNS record creation
# on the proxied zone. Do NOT use a path-scoped zone route here — that
# would conflict with the assets binding and break the SPA fallback for
# unmatched paths.
[[routes]]
pattern        = "app.axal.vc"
custom_domain  = true

# ---------- Apex routing ----------
# Keep the apex route table deliberately narrow. Cloudflare Pages retains the
# root, SPA fallback, and static assets; the Worker owns only API requests and
# the two dynamic content namespaces below. Do not add axal.vc/* or an assets
# route while Pages remains the apex origin.
[[routes]]
pattern    = "axal.vc/api/*"
zone_name  = "axal.vc"
[[routes]]
pattern    = "axal.vc/landing/*"
zone_name  = "axal.vc"
[[routes]]
pattern    = "axal.vc/p/*"
zone_name  = "axal.vc"

# ---------- Static Assets (SPA) ----------
# Task #36 — Worker Static Assets binding. The worker serves the
# Vite-built SPA from `frontend/dist`. With `not_found_handling =
# "single-page-application"`, any request the worker's fetch handler
# doesn't match (i.e. anything NOT under `/api/*`, `/landing/:slug`,
# or the few other handlers in `cloudflare-worker/src/index.ts`)
# falls through to assets, which serves `index.html` for unknown
# paths so the SPA's client-side router can take over.
#
# `run_worker_first = false` (the default) means assets are checked
# BEFORE the worker fetch handler — so static files (.js/.css/.png)
# are served directly from the edge without invoking the worker.
# Only requests for paths not present in `dist/` reach the worker.
#
# `run_worker_first` lists path patterns where the worker MUST run
# before any asset lookup. Without this, the SPA fallback in
# `not_found_handling = "single-page-application"` would intercept
# `/api/*` and `/landing/*` and serve `index.html` instead of
# invoking the Hono router. Patterns use the same syntax as Workers
# routes (`*` wildcards, not regex).
#
# Vite is configured (frontend/vite.config.js) to build into the
# repo-root `./docs/` directory (legacy GitHub-Pages output path,
# preserved so the in-repo deploy artifact stays in one place).
#
# Build before deploy:
#   cd frontend && npm run build      # writes to ./docs/
#   npx wrangler deploy --env production

[assets]
directory = "./docs"
binding   = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/landing/*", "/p/*", "/assets/*"]

# ---------- Module Rules ----------
# Task #9 (AO) — register `.md` files (and the Vite-style `?raw` suffix)
# as text modules so legalTemplates.ts and friends can `import nda from
# '../templates/legal/foo.md?raw'` to inline contract markdown into the
# bundle. Without this, esbuild fails with "No loader is configured for
# .md files" on `wrangler deploy`. fallthrough=true keeps esbuild's
# defaults for everything else.
[[rules]]
type    = "Text"
# Scope the markdown text loader to the legal-template directory only so
# a stray transitive `import readme from 'some-pkg/README.md'` can't
# accidentally inline third-party markdown into the production bundle.
# Wrangler module rule globs match against the absolute filesystem path
# esbuild resolves to, so we anchor on the trailing path segments rather
# than a project-relative prefix.
# Wrangler module-rule globs are matched by Cloudflare's `glob-to-regexp`
# helper, which (a) compares against the path esbuild resolved to —
# query suffix `?raw` and all — and (b) handles `**` at the START of the
# pattern unreliably for this anchor. The pragmatic, narrow form is to
# anchor with a leading `**/legal/` wildcard and a trailing `*md*` so
# both `foo.md` and `foo.md?raw` are covered without enabling text
# loading for arbitrary `.md` files anywhere in node_modules. The
# `legal/` segment ensures only the bundled-contract directory matches.
globs   = ["**/legal/*md*"]
fallthrough = true

# ---------- Public (non-secret) variables ----------
[vars]
# Task #5 — canonical-host flip complete. APP_URL / PUBLIC_BASE_URL
# now point at axal.vc (the canonical host). All post-login redirects
# and user-facing links (email verification, magic links, etc.) will
# use axal.vc.
#
# OAUTH_CALLBACK_BASE_URL pins OAuth redirect_uri registrations at
# app.axal.vc until every provider dashboard is updated. Integration
# providers (Calendar, LinkedIn, HubSpot, Salesforce, DocuSign, Carta,
# Slack, Stripe, Calendly) read OAUTH_CALLBACK_BASE_URL via callbackBase()
# in cloudflare-worker/src/util/url.ts. Once all provider registrations
# are updated to axal.vc, delete OAUTH_CALLBACK_BASE_URL and the
# callbackBase() fallback converges to APP_URL automatically.
APP_URL = "https://axal.vc"
PUBLIC_BASE_URL = "https://axal.vc"
OAUTH_CALLBACK_BASE_URL = "https://app.axal.vc"
PUBLIC_MARKETING_URL = "https://axal.vc"
GITHUB_REPO_OWNER = "AxalNetwork"
GITHUB_REPO_NAME  = "StudioOS"
ENVIRONMENT       = "production"
# Feature flag for the Queues migration. While "true" the worker enqueues
# new jobs onto the native CF Queue (`JOB_QUEUE`); the legacy D1
# `queue_jobs` cron drain stays alive in parallel so any in-flight legacy
# jobs finish. Flip to "false" to roll back to D1-only.
USE_CF_QUEUE      = "true"
# Task #4 (CG) — Personal Advisor AI Gateway slug. The advisor calls
# `env.AI.run(model, payload, { gateway: { id: CF_AI_GATEWAY_SLUG_ADVISOR } })`
# so its analytics, cache, and rate limits are tracked independently of
# the onboarding chatbot. The gateway must be created in the Cloudflare
# dashboard (slug `advisor-ongoing`, cache TTL 5m / 0, RL 60-rpm/user
# 200-rpm/account) before deploy; when the slug is missing or unknown
# Cloudflare silently treats the call as un-gatewayed (no breakage).
CF_AI_GATEWAY_SLUG_ADVISOR = "advisor-ongoing"
# Task #4 (CG) — daily turn cap per user for the advisor. Soft-warn at
# 80%, hard-block at 100%. Counted in KV under
# `ai_spend:advisor:{user_id}:{yyyy-mm-dd}`. The "USD_DAY" suffix is a
# misnomer in the spec — the value is a TURN count, not dollars.
WORKERS_AI_ADVISOR_BUDGET_USD_DAY = "100"

# ---------- Cloudflare Turnstile (bot protection) ----------
# The Worker only needs the SECRET (set via `wrangler secret put TURNSTILE_SECRET_KEY`);
# it's read in cloudflare-worker/src/services/turnstile.ts.
# When the secret is unset, verifyTurnstile() fails-open with a console warning so
# local dev / preview deploys aren't blocked. The frontend reads the public site
# key from the build-time env var VITE_TURNSTILE_SITE_KEY (see frontend/.env.example).

# ---------- D1 Database ----------
[[d1_databases]]
binding       = "DB"
database_name = "studioos-db"
database_id   = "16a23acd-c82e-4ff1-a6c0-408e3eb014c8"

# ---------- KV Namespaces ----------
# TOKENS      – session / refresh tokens, short-lived caches
# RATE_LIMITS – sliding-window rate-limit counters
[[kv_namespaces]]
binding = "TOKENS"
id      = "8dc26ed83d154d0ebbfcbc51f592d67c"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id      = "be811f14b6f342be961b8daa4513fb5b"

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- Optional: dedicated KV namespace for AI router spend / cache ----------
# Task #1 (AX) — When present, services/aiRouter.ts uses this namespace
# for per-user $/day + $/month spend buckets, content-hash cache, and
# the org-wide kill switch. When absent the router falls back to the
# existing TOKENS namespace with `ai_spend:` / `ai_cache:` / `ai_killswitch:`
# key prefixes — so this binding is *optional* and the router is
# deployable without provisioning a new namespace. To attach a real
# namespace later:
#   npx wrangler kv namespace create AI_SPEND --env production
# then uncomment + paste the returned id below.
# [[kv_namespaces]]
# binding = "AI_SPEND"
# id      = "<paste-id-here>"

# ---------- Queues (job queue) ----------
# Native Cloudflare Queues replace the D1-polling job queue for true async
# processing with retry + dead-letter semantics. The D1 `queue_jobs` table
# and its cron drain remain in place during the migration window so
# in-flight legacy jobs continue to drain (controlled by the USE_CF_QUEUE
# feature flag — see [vars] above).
#
# Queues created on the account:
#   studioos-job-queue       (main)
#   studioos-job-queue-dlq   (dead letter)

[[queues.producers]]
binding = "JOB_QUEUE"
queue   = "studioos-job-queue"

[[queues.consumers]]
queue              = "studioos-job-queue"
max_batch_size     = 25
max_batch_timeout  = 10
# Task #9 (AO) — cap retries at 3 then route to DLQ for forensic review.
# Higher retry counts mask poison messages; 3 attempts is enough to ride
# out transient D1/upstream blips while still surfacing real failures.
max_retries        = 3
dead_letter_queue  = "studioos-job-queue-dlq"

# Task #7 (IE) — DLQ consumer mirrors exhausted CF Queue messages to D1
# so the admin panel can inspect and retry them.
[[queues.consumers]]
queue              = "studioos-job-queue-dlq"
max_batch_size     = 10
max_batch_timeout  = 5
max_retries        = 3

# ---------- Durable Objects (real-time fan-out) ----------
# PIPELINE_ROOM   – one DO instance per pipeline deal_id; broadcasts stage /
#                   metric / AI-recommendation events to every connected
#                   admin/partner WebSocket viewer.
# ONBOARDING_CHAT – one DO instance per founder user_id; broadcasts new
#                   /api/profiling/chat messages so admins watching the
#                   ProfileReviewModal see the transcript update live.
#
# Both classes use Hibernatable WebSockets so idle connections incur no
# duration billing. Class registrations live in
# `cloudflare-worker/src/durable-objects/`; index.ts re-exports them so the
# Workers runtime can find them at the bound class names.
[[durable_objects.bindings]]
name       = "PIPELINE_ROOM"
class_name = "PipelineRoom"

[[durable_objects.bindings]]
name       = "ONBOARDING_CHAT"
class_name = "OnboardingChat"

[[migrations]]
tag                = "v1-realtime"
# Cloudflare requires `new_sqlite_classes` for all newly created Durable
# Object namespaces (the legacy `new_classes` is no longer accepted).
# SQLite-backed storage is the default and only supported mode going forward.
new_sqlite_classes = ["PipelineRoom", "OnboardingChat"]

# ---------- Vectorize (semantic search) ----------
# Index `axal-search` (768-dim, cosine) backs the global search bar on the
# Dashboard. Embeddings are produced by Workers AI `@cf/baai/bge-base-en-v1.5`.
# Vector IDs follow `{type}:{id}` so we can scope deletes by entity.
[[vectorize]]
binding    = "VECTORIZE"
index_name = "axal-search"

# ---------- R2 (object storage) ----------
# Stores KYC documents (passport / ID images) under key prefix `kyc/{user_id}/`.
# Bucket is private — access is gated by Worker routes that re-check auth on
# every read. We deliberately do NOT use S3-compat presigned URLs (which would
# require separate R2 access keys + introduce a leak vector).
[[r2_buckets]]
binding     = "FILES"
bucket_name = "studioos-files"

# Task #2 (AU) — Admin Publication Exports. Holds rendered PDF/CSV/PNG
# artifacts under key prefix `publications/<id>/<isoTs>-<rand>.<ext>`.
# Bucket is private — downloads are gated through the Worker via 24h
# HMAC-signed URLs (no S3-compat presigning, no public R2 access).
# Provision: `npx wrangler r2 bucket create studioos-publications`.
[[r2_buckets]]
binding     = "PUBLICATIONS"
bucket_name = "studioos-publications"

# Task #5 (IE) — Backup + DR. Holds daily D1 SQL exports under
# `d1/backup-YYYY-MM-DD.sql` (written by .github/workflows/backup-d1.yml)
# and daily KV JSONL snapshots under `kv/<namespace>/YYYY-MM-DD.jsonl`
# (written by services/backup.ts at 02:00 UTC). The bucket is private;
# object-lock (compliance mode, 365-day retention) and lifecycle to
# Standard-IA after 30 days are configured one-time in the dashboard —
# see documentation/operations/INCIDENT_RESPONSE.md § Backups for the checklist. The binding is
# OPTIONAL at runtime: services/backup.ts logs and no-ops when missing
# so dev/preview deploys without the bucket created still boot cleanly.
[[r2_buckets]]
binding     = "BACKUPS"
bucket_name = "studioos-backups"

# ---------- Workers Analytics Engine ----------
# Task #13 — write a data point per HTTP request from the observability
# middleware (cloudflare-worker/src/middleware/observability.ts) so the
# Admin Analytics Technical sub-tab can read true edge-level traffic and
# latency, independent of D1's `system_metrics` table (which we still
# write as a fallback for the historical period this dataset doesn't
# cover yet). Reads via Cloudflare's GraphQL/SQL API are gated by
# CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_AE_API_TOKEN secrets — when either
# is missing, loadTechnical() falls back to D1.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "studioos_metrics"

# ---------- Browser Rendering ----------
# Powers true PDF generation for Admin Analytics exports
# (cloudflare-worker/src/routes/monitoring_analytics.ts). Without this binding
# the /export endpoint returns 503 for format=pdf and the audit row records
# `pdf_unavailable` — see Task #9.
[browser]
binding = "BROWSER"

# ---------- Cron Triggers ----------
# The cron handler in cloudflare-worker/src/index.ts uses a per-minute
# RATE_LIMITS lease so concurrent firings (e.g. when the every-minute
# trigger and a once-daily trigger collide on the same wall-clock minute)
# dedupe to a single execution. Internal time gating (now.getUTCHours/
# Minutes) inside the handler routes per-cadence work, so adding additional
# cron lines here is for dashboard observability + Cloudflare's "next run"
# UI rather than for new behaviour. Task #9 (AO) declares the canonical
# set so operators can see all cadences at a glance.
[triggers]
crons = [
  "* * * * *",     # queue drain + sub-minute internal dispatch
  "0 3 * * *",     # daily cleanup (legacy)
  "0 */6 * * *",   # market-intel free connectors refresh
  "0 4 * * *",     # market-intel composite + daily snapshot window
  "0 9 * * *",     # daily digest emails
  "0 9 * * 1",     # weekly digest emails (Monday)
]

# ---------- Market-Intelligence free connectors ----------
# Each registered source runs its deterministic stub by default and only
# calls its real provider when flipped LIVE via `MI_FLAG_<KEY>=live` (see
# registry.ts::isLive). Set these as plain vars or via `wrangler secret put`.
# P0 (merged): MI_FLAG_OPENALEX, MI_FLAG_PATENT_USPTO, MI_FLAG_PATENT_EPO,
#   MI_FLAG_NEWS_GDELT, MI_FLAG_PAPERSWITHCODE, MI_FLAG_STACK_EXCHANGE, …
# P1 (this task — macro/research free sources):
#   MI_FLAG_WORLD_BANK=live   # World Bank gross-capital-formation (keyless)
#   MI_FLAG_OECD=live         # OECD MSTI GERD % GDP (keyless)
#   MI_FLAG_EUROSTAT=live     # Eurostat EU27 GERD % GDP (keyless)
#   MI_FLAG_CROSSREF=live     # Crossref publication velocity (keyless, send mailto)
#   MI_FLAG_ARXIV=live        # arXiv preprint counts (keyless)
#   MI_FLAG_BLS=live          # US BLS unemployment — needs BLS_API_KEY
#   MI_FLAG_FRED=live         # FRED fed-funds rate — needs FRED_API_KEY
# Optional: MI_CONTACT_EMAIL (polite-pool mailto/UA; defaults market-intel@axal.vc).
# Key secrets (free keys; Worker secrets only — never .replit):
#   wrangler secret put BLS_API_KEY  --env production
#   wrangler secret put FRED_API_KEY --env production
# When a key-required source is flipped live but its key is unset, it stays on
# its stub (does NOT throw) — same graceful-degrade contract as the rest.

# ---------- Observability ----------
[observability]
enabled            = true
head_sampling_rate = 1

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true

[observability.traces]
enabled            = true
persist            = true
head_sampling_rate = 1

# ---------- Tail consumer (top-level / default deploy target) ----------
# `npx wrangler deploy` (no --env flag) deploys this top-level config as
# the production `studioos` worker (see header comment). The tail
# consumer must therefore be declared here too — env tables don't
# inherit. Mirror under [[env.production.tail_consumers]] below for the
# `--env production` deploy path.
[[tail_consumers]]
service = "studioos-tail"

# ===========================================================================
# Environment: production
# ---------------------------------------------------------------------------
# IMPORTANT — Wrangler v2+ does NOT inherit binding tables (d1_databases,
# kv_namespaces, ai, queues, durable_objects, vectorize, r2_buckets,
# migrations, triggers) from the top-level config into a named environment.
# Every binding must be re-declared under `[env.production.*]` or the
# `--env production` deploy will produce a worker with NO bindings — which
# breaks every DB-touching route (login, /me, etc.) and is exactly why
# 2026-05-05 login outage happened. Keep this block in sync with the
# top-level binding tables above when adding new bindings.
#
# Top-level keys (compatibility_date, compatibility_flags, main, minify,
# workers_dev, observability) DO inherit and don't need duplicating.
#
# Secrets set via `wrangler secret put NAME --env production` are scoped
# to this environment (LINKEDIN_CLIENT_ID / SECRET / REDIRECT_URI live here).
# ===========================================================================
[env.production]
name = "studioos"

# Mirror the top-level route table. Wrangler environments do not inherit
# routes, so both deploy paths explicitly bind the app custom domain and the
# same three narrow apex paths. Cloudflare Pages remains the apex origin.
[[env.production.routes]]
pattern        = "app.axal.vc"
custom_domain  = true
[[env.production.routes]]
pattern    = "axal.vc/api/*"
zone_name  = "axal.vc"
[[env.production.routes]]
pattern    = "axal.vc/landing/*"
zone_name  = "axal.vc"
[[env.production.routes]]
pattern    = "axal.vc/p/*"
zone_name  = "axal.vc"

[env.production.vars]
# Task #5 — canonical-host flip. APP_URL/PUBLIC_BASE_URL now point at
# axal.vc. OAUTH_CALLBACK_BASE_URL keeps OAuth redirect_uri registrations
# pinned to app.axal.vc until all provider dashboards are updated.
APP_URL              = "https://axal.vc"
PUBLIC_BASE_URL      = "https://axal.vc"
OAUTH_CALLBACK_BASE_URL = "https://app.axal.vc"
PUBLIC_MARKETING_URL = "https://axal.vc"
GITHUB_REPO_OWNER = "AxalNetwork"
GITHUB_REPO_NAME  = "StudioOS"
ENVIRONMENT       = "production"
USE_CF_QUEUE      = "true"
# Task #4 (CG) — see top-level [vars] for the rationale. Mirrored here
# because Wrangler env tables don't inherit from the top-level [vars].
CF_AI_GATEWAY_SLUG_ADVISOR     = "advisor-ongoing"
WORKERS_AI_ADVISOR_BUDGET_USD_DAY = "100"
# T22.4 — leave EXTRA_DEV_ORIGINS UNSET in production. The CORS allowlist
# in cloudflare-worker/src/index.ts only adds origins from this var when
# present; an empty value here ensures the workers.dev sandbox URL never
# leaks into the prod allowlist. Set it on the preview env instead.
EXTRA_DEV_ORIGINS = ""

[[env.production.d1_databases]]
binding       = "DB"
database_name = "studioos-db"
database_id   = "16a23acd-c82e-4ff1-a6c0-408e3eb014c8"

[[env.production.kv_namespaces]]
binding = "TOKENS"
id      = "8dc26ed83d154d0ebbfcbc51f592d67c"

[[env.production.kv_namespaces]]
binding = "RATE_LIMITS"
id      = "be811f14b6f342be961b8daa4513fb5b"

[env.production.ai]
binding = "AI"

[[env.production.queues.producers]]
binding = "JOB_QUEUE"
queue   = "studioos-job-queue"

[[env.production.queues.consumers]]
queue              = "studioos-job-queue"
max_batch_size     = 25
max_batch_timeout  = 10
# Mirror of the top-level consumer block (Wrangler env tables don't inherit).
max_retries        = 3
dead_letter_queue  = "studioos-job-queue-dlq"

# Task #7 (IE) — production DLQ consumer
[[env.production.queues.consumers]]
queue              = "studioos-job-queue-dlq"
max_batch_size     = 10
max_batch_timeout  = 5
max_retries        = 3

[[env.production.durable_objects.bindings]]
name       = "PIPELINE_ROOM"
class_name = "PipelineRoom"

[[env.production.durable_objects.bindings]]
name       = "ONBOARDING_CHAT"
class_name = "OnboardingChat"

[[env.production.migrations]]
tag                = "v1-realtime"
new_sqlite_classes = ["PipelineRoom", "OnboardingChat"]

[[env.production.vectorize]]
binding    = "VECTORIZE"
index_name = "axal-search"

[[env.production.r2_buckets]]
binding     = "FILES"
bucket_name = "studioos-files"

[[env.production.r2_buckets]]
binding     = "PUBLICATIONS"
bucket_name = "studioos-publications"

# Task #5 (IE) — mirror of the top-level BACKUPS R2 binding. See the
# top-level [[r2_buckets]] block for rationale + operator setup.
[[env.production.r2_buckets]]
binding     = "BACKUPS"
bucket_name = "studioos-backups"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "studioos_metrics"

[env.production.browser]
binding = "BROWSER"

# Task #36 — Mirror of the top-level [assets] binding. Env tables
# don't inherit, so the `--env production` deploy path needs its own.
[env.production.assets]
directory = "./docs"
binding   = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/landing/*", "/p/*", "/assets/*"]

# Task #9 (AO) — wire the studioos-tail consumer worker
# (cloudflare-worker-tail/) so all production worker tail events get
# forwarded to R2 (`studioos-logs`) for 7-year retention. The consumer
# worker MUST be deployed at least once before this binding goes live;
# until then `wrangler deploy` will warn "tail consumer service does not
# exist". The dry-run validation in CI does NOT make this network call,
# so the binding is safe to declare ahead of the first consumer deploy.
[[env.production.tail_consumers]]
service = "studioos-tail"

[env.production.triggers]
# Mirror of top-level [triggers] — Wrangler envs do not inherit cron tables.
crons = [
  "* * * * *",
  "0 3 * * *",
  "0 */6 * * *",
  "0 4 * * *",
  "0 9 * * *",
  "0 9 * * 1",
]

# ===========================================================================
# Environment: preview / staging
# ---------------------------------------------------------------------------
# Task #9 (AO) — preview env declared so the GitHub Action's PR preview
# deploy can run. Operator must provision the preview D1 + KV namespaces
# and replace the REPLACE_WITH_PREVIEW_* placeholders below before the
# `wrangler deploy --env preview` step in CI will succeed:
#
#   npx wrangler d1 create studioos-db-preview
#   npx wrangler kv namespace create TOKENS-PREVIEW
#   npx wrangler kv namespace create RATE_LIMITS-PREVIEW
#
# Until placeholders are replaced, the CI preview-deploy job is gated on
# the CLOUDFLARE_PREVIEW_READY repo variable; absence skips the job
# without failing the build. See .github/workflows/ci.yml.
# ===========================================================================
[env.preview]
name = "studioos-preview"
workers_dev = true

[env.preview.vars]
APP_URL           = "https://studioos-preview.workers.dev"
ENVIRONMENT       = "preview"
USE_CF_QUEUE      = "true"
# Task #4 (CG) — preview env can use a separate gateway slug (e.g.
# `advisor-ongoing-preview`) created in the dashboard. Defaults to the
# prod slug so the binding still works before a preview gateway exists.
CF_AI_GATEWAY_SLUG_ADVISOR     = "advisor-ongoing"
WORKERS_AI_ADVISOR_BUDGET_USD_DAY = "100"
# Preview is allowed to widen CORS so PR review deploys can talk to
# localhost SPAs and the workers.dev sandbox URL.
EXTRA_DEV_ORIGINS = "https://studioos-preview.workers.dev,http://localhost:5000,http://localhost:5173"

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "studioos-db-preview"
database_id   = "REPLACE_WITH_PREVIEW_D1_ID"

[[env.preview.kv_namespaces]]
binding = "TOKENS"
id      = "REPLACE_WITH_PREVIEW_KV_TOKENS_ID"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMITS"
id      = "REPLACE_WITH_PREVIEW_KV_RATE_LIMITS_ID"

[env.preview.ai]
binding = "AI"

[[env.preview.queues.producers]]
binding = "JOB_QUEUE"
queue   = "studioos-job-queue-preview"

[[env.preview.queues.consumers]]
queue              = "studioos-job-queue-preview"
max_batch_size     = 25
max_batch_timeout  = 10
max_retries        = 3
dead_letter_queue  = "studioos-job-queue-preview-dlq"

# Task #7 (IE) — preview DLQ consumer
[[env.preview.queues.consumers]]
queue              = "studioos-job-queue-preview-dlq"
max_batch_size     = 10
max_batch_timeout  = 5
max_retries        = 3

[[env.preview.durable_objects.bindings]]
name       = "PIPELINE_ROOM"
class_name = "PipelineRoom"

[[env.preview.durable_objects.bindings]]
name       = "ONBOARDING_CHAT"
class_name = "OnboardingChat"

[[env.preview.migrations]]
tag                = "v1-realtime"
new_sqlite_classes = ["PipelineRoom", "OnboardingChat"]

[[env.preview.r2_buckets]]
binding     = "FILES"
bucket_name = "studioos-files-preview"

[[env.preview.r2_buckets]]
binding     = "PUBLICATIONS"
bucket_name = "studioos-publications-preview"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "studioos_metrics_preview"

[env.preview.browser]
binding = "BROWSER"

[env.preview.triggers]
# Preview env keeps only the every-minute drain + market-intel cadences
# so PR review deploys exercise the cron path. Daily 09:00 digests are
# omitted to avoid sending real emails from preview workers.
crons = ["* * * * *", "0 */6 * * *", "0 4 * * *"]
