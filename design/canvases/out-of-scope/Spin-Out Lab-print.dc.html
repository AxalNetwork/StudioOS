<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{animation-delay:-99s!important;animation-duration:.001s!important;animation-iteration-count:1!important;animation-fill-mode:both!important;animation-play-state:running!important;transition-duration:0s!important}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#18181b}
  .tnum{font-variant-numeric:tabular-nums}
  doc-page:not(:defined){visibility:hidden}
  .sb-page{break-inside:avoid}
  .sb-cover{break-after:page}
</style>
</helmet>
<x-import component-from-global-scope="doc-page" from="./doc-page.js" size="letter" orientation="landscape" margin="0.5in" hint-size="100%,700px">

  <div class="sb-page sb-cover" style="border-radius:16px;background:radial-gradient(1000px 400px at 15% -10%,rgba(139,92,246,.5),transparent 60%),linear-gradient(120deg,#1e1b3a,#3b1d6e);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;min-height:6.7in;overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:auto">
      <div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff" dangerouslySetInnerHTML="{{ flaskIcon }}"></div>
      <span style="font-weight:700;font-size:15px">Meridian · Spin-Out Lab</span>
    </div>
    <div class="tnum" style="font-size:64px;font-weight:900;letter-spacing:-.04em;line-height:.95;background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent">Program Brief</div>
    <p style="margin:14px 0 0;font-size:18px;color:#cbc4e8;font-weight:500">From idea to Delaware C-Corp, funded in 30 days.</p>
    <div style="margin-top:auto;display:flex;gap:9px;flex-wrap:wrap">
      <sc-for list="{{ outcomeBadges }}" as="b" hint-placeholder-count="4">
        <span style="padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:600;color:#ede9fe">{{ b }}</span>
      </sc-for>
    </div>
  </div>

  <div class="sb-page" style="border-radius:16px;background:#fff;border:1px solid #ececf1;padding:36px;break-after:page">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#a1a1aa;margin-bottom:6px">The program</div>
    <h2 style="margin:0 0 22px;font-size:26px;font-weight:800;letter-spacing:-.02em">The 30-day pipeline</h2>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
      <sc-for list="{{ phases }}" as="p" hint-placeholder-count="5">
        <div style="border-radius:12px;background:{{ p.bg }};border:1px solid {{ p.border }};padding:14px;break-inside:avoid">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <div style="width:24px;height:24px;flex:none;border-radius:7px;background:{{ p.chip }};color:{{ p.ink }};font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center">{{ p.num }}</div>
            <div style="font-size:13.5px;font-weight:800;color:#27272a">{{ p.name }}</div>
          </div>
          <span class="tnum" style="white-space:nowrap;font-size:10.5px;font-weight:700;color:{{ p.ink }};background:{{ p.chip }};border-radius:6px;padding:2px 7px">{{ p.days }}</span>
          <ul style="margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px">
            <sc-for list="{{ p.items }}" as="d" hint-placeholder-count="4">
              <li style="display:flex;gap:6px;font-size:11px;line-height:1.3;color:#52525b"><span style="color:{{ p.ink }};font-weight:700">·</span><span>{{ d }}</span></li>
            </sc-for>
          </ul>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="sb-page" style="border-radius:16px;background:#fff;border:1px solid #ececf1;padding:36px;break-after:page">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#a1a1aa;margin-bottom:6px">Deliverables</div>
    
</x-dc>
</body>
</html>
