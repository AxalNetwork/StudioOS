<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#eeecf1;font-family:Inter,system-ui,sans-serif;color:#18181b;-webkit-font-smoothing:antialiased}a{color:#6d28d9}a:hover{color:#7c3aed}</style>
</helmet>
<section style="padding:44px 48px 40px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span style="font:800 18px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.015em">Studio · mobile</span><span style="font:400 12.5px/1.5 Inter,system-ui,sans-serif;color:rgba(24,24,27,.55)">Studio is Eadwyn. The arrow at the top right opens a menu with Open a ticket, Conversations, Tasks, My tickets and your profile. Opened from the Studio icon beside the bell.</span></div>
  <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
    <sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
      <div id="{{ b.id }}" style="display:flex;flex-direction:column;gap:12px;flex:none">
        <div style="display:flex;align-items:center;gap:10px"><span style="font:700 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#18181b;color:#fff;border-radius:5px">{{ b.id }}</span><span style="font-weight:600;font-size:14px">{{ b.title }}</span><span style="font:400 11px ui-monospace,Menlo,monospace;color:rgba(24,24,27,.55)">{{ b.route }}</span></div>
        <div style="width:390px;height:844px;flex:none;border:10px solid #18181b;border-radius:40px;overflow:hidden;background:#fff"><dc-import name="Studio Mobile Page" tab="{{ b.tab }}" ticket="{{ b.ticket }}" drawer="{{ b.drawer }}" page="{{ b.page }}" hint-size="370px,824px"></dc-import></div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  renderVals() {
    return { boards: [
      { id: 'S1m', title: 'Conversations', route: '/studio', tab: 'chat', ticket: false, drawer: false, page: '' },
      { id: 'S2m', title: 'Tasks', route: '/studio?tab=tasks', tab: 'tasks', ticket: false, drawer: false, page: '' },
      { id: 'S3m', title: 'My tickets', route: '/studio?tab=tickets', tab: 'tickets', ticket: false, drawer: false, page: '' },
      { id: 'S4m', title: 'Open a ticket', route: '/studio', tab: 'chat', ticket: true, drawer: false, page: '' },
      { id: 'S5m', title: 'Eadwyn menu', route: '/studio', tab: 'chat', ticket: false, drawer: true, page: '' },
      { id: 'S6m', title: 'You', route: '/profile', tab: 'chat', ticket: false, drawer: false, page: 'you' },
      { id: 'S7m', title: 'Your venture', route: '/profile/venture', tab: 'chat', ticket: false, drawer: false, page: 'venture' },
      { id: 'S8m', title: 'Archetype card', route: '/studio/archetype', tab: 'chat', ticket: false, drawer: false, page: 'archetype' },
      { id: 'S9m', title: 'What others see', route: '/profile/preview', tab: 'chat', ticket: false, drawer: false, page: 'preview' },
      { id: 'S10m', title: 'Visibility', route: '/profile/visibility', tab: 'chat', ticket: false, drawer: false, page: 'visibility' },
    ] };
  }
}
</script>
</body></html>
