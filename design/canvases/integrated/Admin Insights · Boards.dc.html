<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#eeedf2;font-family:'Space Grotesk',system-ui,sans-serif;color:#18181b}a{color:#7c3aed}a:hover{color:#6d28d9}</style>
</helmet>
<div style="display:flex;flex-direction:column">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="11">
    <section id="{{ r.id }}" style="padding:44px 48px 40px;border-bottom:1px solid rgba(24,24,27,.08);display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font:700 10px 'Roboto Mono',monospace;padding:4px 8px;background:#18181b;color:#fff;border-radius:5px;letter-spacing:.05em">{{ r.badge }}</span><span style="font-weight:800;font-size:18px;letter-spacing:-.02em">{{ r.title }}</span><span style="font:500 11.5px 'Roboto Mono',monospace;color:#6b6577">{{ r.route }}</span></div>
      <div style="font-size:13px;line-height:1.55;color:#4a4553;max-width:1100px">{{ r.note }}</div>
      <div style="display:flex;gap:40px;align-items:flex-start">
        <sc-for list="{{ r.frames }}" as="f" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:8px;flex:none">
            <sc-if value="{{ f.cap }}" hint-placeholder-val="{{ false }}"><span style="font:500 11.5px 'Roboto Mono',monospace;color:#6b6577">{{ f.cap }}</span></sc-if>
            <div style="{{ f.frame }}">
              <dc-import name="Admin Insights Page" board="{{ f.board }}" role="{{ f.role }}" dark="{{ f.dark }}" phone="{{ f.phone }}" compare="{{ f.compare }}" drawer="{{ f.drawer }}" dialog="{{ f.dialog }}" toast="{{ f.toast }}" scope-open="{{ f.scopeOpen }}" scope-picked="{{ f.scopePicked }}" sheet="{{ f.sheet }}" notice="{{ f.notice }}" hint-size="100%,2300px"></dc-import>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  renderVals() {
    const F = (o) => Object.assign({ cap: '', board: 'overview', role: 'admin', dark: false, phone: false, compare: false, drawer: false, dialog: 'none', toast: false, scopeOpen: false, scopePicked: false, sheet: false, notice: false }, o || {});
    const fr = (f) => Object.assign(f, { frame: f.phone ? 'width:390px;height:844px;border:10px solid #18181b;border-radius:40px;overflow:hidden;background:#f4f3f7;box-sizing:content-box' : 'width:1440px;border:1px solid rgba(24,24,27,.12);border-radius:12px;overflow:hidden;background:#f4f3f7;box-shadow:0 2px 14px rgba(24,24,27,.08)' });
    const R = (id, title, route, note, frames) => ({ id: id.toLowerCase(), badge: id, title, route, note, frames: frames.map(f => fr(F(f))) });
    return { rows: [
      R('INS1', 'Insights overview · Admin · light', '/admin/insights', 'KPI row, who your accounts are, plan, growth, activity (previous period on), activation, still active, where they are, account health, support and AI use. The moved notice shows once under the title. Any bar, slice or point opens the group lightbox (INS3); every block title opens "How is this counted?" (INS4).', [{ compare: true, notice: true }]),
      R('INS2', 'Insights overview · Super Admin', '/admin/insights?scope=hq', 'The HQ badge and the Scope select. Left: the select open, with the note that only HQ-held accounts exist today. Right: a subsidiary picked, so the scope chip reads "[Branch North] · counts read from its own database". The link to HQ Analytics sits at the right of the filter bar.', [{ cap: 'Scope select open', role: 'super', scopeOpen: true }, { cap: 'A subsidiary picked', role: 'super', scopePicked: true }]),
      R('INS3', 'Group lightbox', '/admin/insights?group=founders', 'Opened by clicking the Founders bar, as a centred lightbox over the page; no side panel slides in. Close with × or Esc. Counts only; the primary button opens the same 512 accounts in Accounts, with the same filters.', [{ drawer: true }]),
      R('INS4', '"How is this counted?"', '/admin/insights', 'The definition dialog for Active accounts, with the source, the as-of time, and two more definitions.', [{ dialog: 'count' }]),
      R('INS5', 'Export', '/admin/insights', 'What, format and the read-only range; counts only and logged. After export, the toast with Download.', [{ dialog: 'export', toast: true }]),
      R('INS6', 'Insights overview · Admin · dark', '/admin/insights', 'INS1 in dark colours. Only violet changes (#a78bfa); sky, amber, emerald and muted keep their values on #111827. The rail is collapsed to its spine.', [{ dark: true, compare: true }]),
      R('INS7', 'Empty', '/admin/insights', 'A new studio: measured zeros in the KPI tiles, one card in place of the charts, and the activation card.', [{ board: 'empty' }]),
      R('INS8', 'Loading', '/admin/insights', 'The filter bar is ready; tiles read "Reading…" and chart areas show hairline skeletons. The rail is docked.', [{ board: 'loading' }]),
      R('INS9', 'Error and partial', '/admin/insights', 'Activity could not be read, Plan is not recorded for this scope, and Where they are notes the accounts without a country. Every other block answers. The inset at the foot: the whole page failed, with the sidebar and rail kept.', [{ board: 'error' }]),
      R('INS10', 'No permission', '/admin/insights?scope=[Branch North]', 'An Admin opens a link meant for HQ. One card replaces the page; in the filter bar, where Super Admin has the Scope select, the Admin sees one sentence.', [{ board: 'noperm' }]),
      R('INS11', 'Insights · phone', '/admin/insights', 'Filters open a bottom sheet; tiles sit 2 by 2; each chart runs full width with View as table; the group opens as its own full-screen page; the rail becomes Ask Eadwyn. Tap targets are at least 44 px.', [{ cap: 'Page', phone: true }, { cap: 'Filters sheet', phone: true, sheet: true }, { cap: 'Group page', phone: true, drawer: true }]),
    ] };
  }
}
</script>


</body></html>
