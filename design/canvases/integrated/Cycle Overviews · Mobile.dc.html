<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#eeecf1;font-family:Inter,system-ui,sans-serif;color:#18181b;-webkit-font-smoothing:antialiased}a{color:#6d28d9}a:hover{color:#7c3aed}</style>
</helmet>
<div style="display:flex;flex-direction:column">
  <section style="padding:44px 48px 40px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span style="font:800 18px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.015em">Cycle overviews · mobile</span><span style="font:400 12.5px/1.5 Inter,system-ui,sans-serif;color:rgba(24,24,27,.55)">In the One Next Thing pattern: each cycle as a root screen (one next thing, then everything else in the cycle), plus Validate for a new venture. Each button opens a page, never a lightbox.</span></div>
    <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap">
      <sc-for list="{{ boards }}" as="b" hint-placeholder-count="5">
        <div id="{{ b.id }}" style="display:flex;flex-direction:column;gap:12px;flex:none">
          <div style="display:flex;align-items:center;gap:10px"><span style="font:700 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#18181b;color:#fff;border-radius:5px">{{ b.id }}</span><span style="font-weight:600;font-size:14px">{{ b.title }}</span><span style="font:400 11px ui-monospace,Menlo,monospace;color:rgba(24,24,27,.55)">{{ b.route }}</span></div>
          <div style="display:flex;gap:20px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:390px;height:844px;flex:none;border:10px solid #18181b;border-radius:40px;overflow:hidden;background:#fff"><dc-import name="Cycle Overview" mobile="{{ true }}" cycle="{{ b.cycle }}" sheet="{{ b.sheet }}" rail="{{ b.rail }}" rec-open="{{ b.recOpen }}" variant="{{ b.variant }}" hint-size="370px,844px"></dc-import></div><span style="font-size:11.5px;color:rgba(24,24,27,.55)">Overview</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:390px;height:844px;flex:none;border:10px solid #18181b;border-radius:40px;overflow:hidden;background:#fff"><dc-import name="Cycle Overview" mobile="{{ true }}" cycle="{{ b.cycle }}" variant="{{ b.variant }}" form="cta" hint-size="370px,844px"></dc-import></div><span style="font-size:11.5px;color:rgba(24,24,27,.55)">The page its button opens</span></div></div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  renderVals() {
    const B = (id, title, cycle, variant, sheet, rail, recOpen) => ({ id, title, cycle, variant: variant || 'full', sheet: sheet || '', rail: !!rail, recOpen: !!recOpen, route: '/' + cycle.toLowerCase() });
    return { boards: [B('O1m', 'Validate', 'Validate'), B('O2m', 'Build', 'Build'), B('O3m', 'Raise', 'Raise'), B('O4m', 'Grow', 'Grow'), B('O1nm', 'Validate · new venture', 'Validate', 'new'), B('O6m', 'Switch company (sheet)', 'Validate', 'full', 'company'), B('O7m', 'Account (sheet)', 'Validate', 'full', 'account'), B('O8m', 'Eadwyn for this page (right panel)', 'Validate', 'full', '', true), B('O9m', 'Recording view (full screen)', 'Validate', 'full', '', false, true)] };
  }
}
</script>
</body></html>
