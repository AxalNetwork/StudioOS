    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const ia = () => dk('<h1>Audit, IA and route mapping</h1><p>From the 7 Nov authenticated review of <code>/grow?project_id=12</code> (Super Admin previewing the founder shell; reads only) and <code>origin/main</code> on 7 Nov 2026.</p>'
      + tbl(['Severity', 'Finding', 'Change'], [['P1', 'Overview is module-first: 4 figures then 7 cards; a sparse venture reads as a wall of “Not recorded”', 'Focus → Needs your attention → snapshot → what is happening; setup block while the baseline is missing'], ['P1', 'Two vocabularies: cycle cards (Product improvement … Durable company-building) vs zones (Focus, Talent, Customers, Partnerships, Brand, Launch); “Enter a KPI” jumps to /grow/focus', 'One taxonomy over today’s routes'], ['P1', 'Share an update is primary even with nothing recorded', 'State-aware primary action'], ['P1', 'Empty states are passive', 'Eight diagnostic KPI states with an action each'], ['P2', 'Eadwyn rail describes other modules; model, token and top-up detail dominate', 'Recommendation → proposals → recent work → Ask; settings behind a link'], ['P2', 'Figures lack visible source, period and freshness', 'Source line on every figure'], ['P2', '“Also in Grow” → Perks only', 'Task-based contextual links'], ['P3', 'Generic page title', '“Grow — Axal VC StudioOS”, “Distribution — Grow — Axal VC StudioOS”']])
      + '<h2>Route mapping (no route breaks)</h2>' + tbl(['Proposed label', 'Today’s route(s)', 'Today’s name', 'Note'], [['Overview', '<code>/grow</code>', 'Grow overview', 'Same route, new hierarchy'], ['Focus', '<code>/grow/focus</code>, <code>/grow/revenue-and-traction</code>', 'Focus zone; Revenue and traction card', 'Focus owns metric, target and KPIs'], ['Customers', '<code>/grow/customers</code>, <code>/grow/product-improvement</code>, <code>/grow/distribution/prospects</code>', 'Customers zone; Product improvement card', 'Feedback is a Customers tab: it is what customers say'], ['Distribution', '<code>/grow/distribution</code> and its 9 sub-routes, <code>/grow/launch</code>', 'Distribution card; Launch zone', 'Owned by #3722 / #4496 / #4741; label only'], ['Talent', '<code>/grow/talent</code>, <code>/grow/team-expansion</code>', 'Talent zone; Team expansion card', '—'], ['Partnerships', '<code>/grow/partnerships</code>, <code>/grow/partner-network</code>', 'Partnerships zone; Partner network card', '—'], ['Markets', '<code>/grow/market-expansion</code>', 'Market expansion card', '—'], ['Company', '<code>/grow/durable-company-building</code>, <code>/grow/brand</code>', 'Durable company-building card; Brand zone', 'Brand is a company asset'], ['Reporting (utility)', '<code>/grow/reporting</code>, <code>/grow/update</code>', 'Reporting; Share an update', 'Not a domain']])
      + '<p>Old labels keep working as redirects or aliases; <code>GROW_MODULES</code> slugs and <code>cycle_adapters_d661</code> stay unchanged.</p>');
    const handoff = () => dk('<h1>Implementation handoff, accessibility and validation</h1>'
      + tbl(['Part', 'Backed today by', 'Status'], [['Figures (MRR, NRR, Customers, Headcount)', '<code>GET /api/cycles/grow/overview</code> → <code>figures</code>: value, <code>delta_30d</code>, spark, source, as_of, state (unreadable per figure)', 'Frontend: source line, stale rule, change only when valid'], ['Diagnostic empty states', 'Figure <code>reason</code> is free text (“Not recorded: …”)', 'Backend: a typed reason code (no_record · not_connected · unavailable · restricted) so the UI never parses prose'], ['Focus metric and target', '<code>/api/progress/metrics/:projectId/targets</code> (<code>metric_targets.is_focus</code>)', 'Frontend only'], ['Needs your attention', 'Overview cards + targets + Mercury/Google proposals', 'Frontend ranking rules (GR13); trend rules backend required'], ['Growth setup', 'Same reads', 'Frontend only; disappears when all six facts are true'], ['What changed', 'No change feed', 'Backend required'], ['From your tools', 'Stripe import, PostHog (D1609), Mercury and Google feeds', 'Frontend: connection state per source; PostHog retention payload consistency (#4583) backend'], ['Proposal review', '<code>/mercury/partner-proposals/:id/accept|dismiss</code>, <code>/google/proposals/:id/…</code>', 'Destination and undo on accept: backend (#4583)'], ['Eadwyn rail', 'AI rail proposals', 'Overview recommendation prompt: backend; model/usage moves behind AI settings (frontend)'], ['Prospects, campaigns', '<code>/grow/prospects</code>, campaigns', 'Pagination, list query performance, campaign periods: backend (#4583)'], ['Page titles', 'Generic', 'Frontend (#4582)']])
      + '<h2>Components</h2><p><code>pages/cycles/CycleOverview.jsx</code> gains GrowFocus, GrowSnapshot (KpiCard with SourceLine), NeedsAttention, GrowSetup, DomainSummary, ToolsStatus; <code>adapters/grow.js</code> keeps its rules. Founder Grow zone pages (<code>FounderGrowFocus</code>, <code>…Customers</code>, <code>…Talent</code>, <code>…Partnerships</code>, <code>…Launch</code>) keep their routes. Issues: #4862 (nav + attention), #4864 (KPI and empty states), #4865 (Eadwyn), #4866 (Reporting and context links), #4867 (responsive and a11y).</p>'
      + '<h2>Accessibility (WCAG 2.2 AA target; not claimed until tested)</h2><p>One h1 per page; sections labelled by their h2. Focus progress is a progressbar with a text equivalent. Figures read as one sentence (value, change, source, freshness). States are words plus shapes, never colour alone. Primary actions 44–48px on mobile. Sheets trap focus and return it. Status changes (sync, accept) announce politely; failures as alerts. Still to test: screen-reader order of the snapshot, 200% zoom of the domain grid, keyboard reach of the rail.</p>'
      + '<h2>Validation checklist</h2><p>☐ A sparse venture sees one next action within the first viewport · ☐ an active venture’s headline numbers match their workspaces · ☐ no figure shows a change across mixed periods · ☐ every empty figure names why and offers an action · ☐ accepting a proposal lands in its destination and can be undone · ☐ old Grow URLs still open · ☐ mobile keeps the same order.</p>');
    const flows = () => crop('<span class="eye">Prototype flows · each step is a board on this canvas</span>' + J([
      ['1 · First open, little data', ['Overview (sparse) · GR01', 'Needs your attention #1', 'Set focus metric · GR05']],
      ['2–3 · Primary metric and target', ['Focus · choose MRR', 'Set $20,000 for November', 'Overview focus bar · GR02']],
      ['4 · First KPI source', ['KPI “Not connected” · GR12', 'Connect Stripe or Enter manually', 'Figure Current with source line']],
      ['5 · First acquisition channel', ['Needs your attention #4', 'Distribution · Add channel · GR07', 'Domain card updates']],
      ['6 · Stalled customers', ['Attention: 3 stalled > 14 days', 'Customers · stalled table · GR06', 'Log touch']],
      ['7 · Accept an Eadwyn proposal', ['Rail · pending proposal · GR14', 'Review dialog · GR11', 'Accepted → Partnerships, Undo']],
      ['8 · Recover from failed refresh', ['Refresh failed state · GR15', 'Sync now', 'Figure back to Current']],
      ['9 · Reporting without losing context', ['Overview → For this job → Reporting · GR10', 'Readiness list', 'Back keeps venture and period']],
      ['10 · Same on mobile', ['GR16a', 'GR16c target sheet', 'GR16b active overview']]
    ].map(f => '<div style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:center"><b style="font-size:13px">' + f[0] + '</b><div class="flow3">' + f[1].map(s => '<div>' + s + '</div>').join('<span aria-hidden="true">→</span>') + '</div></div>')), 1300);
    const before = () => crop('<span class="eye">Before / after · same sparse venture</span><div class="ba"><section><b>Before (live, 7 Nov)</b><div class="wall">' + J([['MRR', 'Not recorded'], ['NRR', 'Not recorded'], ['Customers', 'Not recorded'], ['Headcount', 'Not recorded'], ['Product improvement', 'No feedback yet'], ['Distribution', 'No channels yet'], ['Revenue and traction', 'No KPIs yet'], ['Team expansion', 'No roles yet'], ['Partner network', 'No partners yet'], ['Market expansion', 'No markets yet'], ['Durable company-building', 'No obligations yet'], ['Primary action', 'Share an update']].map(w => '<div><b>' + w[0] + '</b>' + w[1] + '</div>')) + '</div></section><section><b>After</b>' + focus(false) + nya(NYA_SPARSE.slice(0, 3)) + '<p class="raw">Snapshot, setup and domains follow below, compact, each with a reason and an action.</p></section></div>', 1300);

    /* ---------- route ---------- */
    let html = '';
    if (B === 'GR01') html = page(overviewSparse(), { h: 1750, cur: 'Overview' });
    else if (B === 'GR02' || B === 'GR17') html = page(overviewActive(), { h: 1700, cur: 'Overview', rail: 'active' });
    else if (B === 'GR03') html = concepts();
    else if (B === 'GR04') html = ia();
    else if (B === 'GR05') html = page(focusWs(), { h: 1000, cur: 'Focus', rail: false });
    else if (B === 'GR06') html = page(customers(), { h: 820, cur: 'Customers', rail: false });
    else if (B === 'GR07') html = page(distribution(), { h: 820, cur: 'Distribution', rail: false });
    else if (B === 'GR08') html = page(talent(), { h: 760, cur: 'Talent', rail: false });
    else if (B === 'GR09') html = page(partners(), { h: 760, cur: 'Partnerships', rail: false });
    else if (B === 'GR10') html = page(reporting(), { h: 820, cur: 'Reporting', rail: false });
    else if (B === 'GR11') html = proposal();
    else if (B === 'GR12') html = kpiSys();
    else if (B === 'GR13') html = nyaSys();
    else if (B === 'GR14') html = railStates();
    else if (B === 'GR15') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'GR18') html = before();
    else if (B === 'GR19') html = handoff();
    else if (B === 'GR20') html = flows();
    else html = page(overviewSparse(), { h: 1750 });
    return { html: { __html: html } };
  }
}

</script>
