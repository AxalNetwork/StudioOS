    /* ===== NPD-10 · access matrix ===== */
    else if (B === 'NPD10') html = crop(1400, `<section class="cd"><div class="ch"><h2>Scope and access · what each viewer gets for [Rhea Mercer]</h2></div>
      <table class="npd-mx"><thead><tr><th scope="col">Specimen</th><th scope="col">Lena (saved her)</th><th scope="col">Iris (did not)</th><th scope="col">[Dev] (teammate who shares)</th><th scope="col">HQ steward</th><th scope="col">Support session</th></tr></thead><tbody>

    /* ===== NPD-11 · deep links ===== */
    else if (B === 'NPD11') html = crop(1400, `<div class="npd-flow">
      <div class="npd-cell"><span class="npd-st">1 · Notification</span><p>“[Dev Varma] accepted your introduction request to [Rhea Mercer].”</p><p class="mo" style="font-size:11px">/network/people/per_7Q2M?from=irq_51C</p></div>

    /* ===== NPD-12 · tablet 768 ===== */
    else if (B === 'NPD12' || B === 'NPD12B') html = `<div class="${CV} tab" style="min-height:1120px">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ tab: 'People', h1: 'People', sub: 'One shared directory. Opening someone never makes them your relationship.' })}

      <div class="dim" aria-hidden="true"></div>${PSHEET({ w: 520 })}</div>`;

    /* ===== NPD-13 · phone 390 ===== */
    else if (B === 'NPD13A' || B === 'NPD13F') html = phone('Network', PHLIST, '', {});
    else if (B === 'NPD13B') html = phone('Filters', `<h1 style="font-size:20px;font-weight:800">Filters</h1>
      <div class="sec" style="border-top:0"><h3>Role</h3><label class="dd" style="min-height:44px"><input type="checkbox" checked style="accent-color:#7c3aed"> Investor</label><label class="dd" style="min-height:44px"><input type="checkbox" style="accent-color:#7c3aed"> Advisor</label></div>
      <div class="sec"><h3>Focus</h3><label class="dd" style="min-height:44px"><input type="checkbox" checked style="accent-color:#7c3aed"> Climate</label></div>
      <div class="sec"><h3>Geography</h3><label class="dd" style="min-height:44px"><input type="checkbox" checked style="accent-color:#7c3aed"> Europe</label><p class="foot">${N_NOGEO} people with geography not recorded are listed in their own group.</p></div>
      <div class="sec"><h3>Profile source</h3><span class="foot">Any</span></div>`, `<button type="button" class="btn">Clear</button><button type="button" class="btn p">Show ${N_MATCH} people</button>`, { back: 1 });
    else if (B === 'NPD13C' || B === 'NPD13G') html = phone('Person', `<span class="eye">Person · shared directory</span><h1 style="font-size:22px;font-weight:800" tabindex="-1">[Rhea Mercer]</h1><p class="sub">Partner, [Fernhill Ventures] · Venture Partner, [Saltmarsh Fund]</p><span style="display:flex;gap:6px;flex-wrap:wrap">${EXT}<span class="pl v">✓ In my relationships</span></span>
      <div class="npd-zone"><div class="npd-zh"><h3>Shared profile</h3></div><p class="foot">A sourced profile: not a verified identity, consent or endorsement.</p>
      <dl class="nrf-dl"><dt>Current</dt><dd>Partner, [Fernhill Ventures]<br>Venture Partner, [Saltmarsh Fund]</dd><dt>Former</dt><dd>Principal, [Old Quay Capital]</dd><dt>Geography</dt><dd>London, UK</dd><dt>Focus</dt><dd>Climate, Energy · Seed, Series A</dd><dt>Biography</dt><dd>${NR}</dd><dt>Sources</dt><dd>3 · <a href="#">1 conflict</a></dd></dl></div>`,
      `<button type="button" class="btn" aria-label="More actions">⋯</button><button type="button" class="btn p">Request introduction</button>`, { back: 1 });
    else if (B === 'NPD13D') html = phone('Person', `<div class="npd-zone npd-priv"><div class="npd-zh"><h3>Your relationship</h3><span class="npd-lock">Private to you</span></div>
      <dl class="nrf-dl"><dt>In your book</dt><dd>Since 2026-09-14</dd><dt>Last interaction</dt><dd>2026-10-28 · note</dd><dt>Strength</dt><dd>${NR}</dd><dt>Follow-up</dt><dd>Send Q4 update · due 2026-11-25</dd><dt>Notes</dt><dd>2 · <a href="#">Open</a></dd></dl>
      <div class="sec"><h3>Who on your team knows her</h3>${TEAMPATH.replace('class="btn t"', 'class="btn t" style="min-height:44px"')}</div></div>
      <div class="sec"><h3>More actions</h3><div class="nrf-col"><button type="button" class="btn">Suggest a correction</button><button type="button" class="btn">Copy link</button></div></div>`,
      `<button type="button" class="btn" aria-label="More actions">⋯</button><button type="button" class="btn p">Request introduction</button>`, { back: 1 });
    else if (B === 'NPD13E') html = phone('People', `<h1 style="font-size:20px;font-weight:800">People</h1><p role="status" style="font-weight:700">${N_MATCH} people match</p>
      <div>${J(RES.slice(0, 3).map((r) => `<a href="#" class="npd-ph-row"><b>${r.n}</b><small>${r.r}, ${r.o}</small></a>`))}</div>
      <div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>More people could not be read.</b> The people already shown stay. <button type="button" class="btn" style="min-height:44px">Try again</button></div></div>
      <div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>This person is not available to you.</b> Opened from an old link.</div></div>`, '', { back: 1 });

    /* ===== NPD-14 · dark desktop ===== */
    else if (B === 'NPD14') html = shell(PEOPLE({}), { h: 1180, overlay: PSHEET({}) });
    else if (B === 'NPD14B') html = crop(1400, `<div class="npd-grid npd-g4">
      <div class="npd-cell"><span class="npd-st">Stale</span><p>${STALE('Airtable · 156 days')}</p></div>
      <div class="npd-cell npd-bad"><span class="npd-st">Unavailable</span><p>${UNAV('Page 2 could not be read')}</p></div>
      <div class="npd-cell"><span class="npd-st">Membership</span><p>${MEM} ${EXT}</p><p>${PROV}</p><p>${LINKR}</p></div>
      <div class="npd-cell"><span class="npd-st">Missing and none</span><p>Biography ${NR}</p><p>${NONE('No private record')}</p><p><span class="s">⊘ Refused</span></p></div></div>`);

    /* ===== NPD-15 · accessibility ===== */
    else if (B === 'NPD15') html = `<div class="${CV} doc"><div><span class="eye">Network People · #7676 · NPD-15 · accessibility</span><h2 style="font-size:22px;margin-top:4px">Keyboard order, focus, announcements and wrapping</h2></div>
      <div class="cols">
      <div><h3>Keyboard order (People)</h3><ol style="list-style:decimal;padding-left:18px"><li>Network links (People is current).</li><li>Add a missing person.</li><li>Scope buttons: Discoverable, My relationships, Team relationships (<code>aria-pressed</code>).</li><li>Search, Sort.</li><li>Filter chips; each ✕ is its own button labelled “Remove Role: Investor”.</li><li>Result rows: the name link opens the sheet.</li><li>Pagination, then the “not recorded” group button.</li></ol></div>
      <div><h3>Sheet focus trap and return</h3><ul><li>Opening moves focus to the person’s name (h2). Tab stays in the sheet: copy link, close, shared links, private area controls, Ask, Suggest a correction, Request introduction.</li><li>Esc or ✕ closes and returns focus to the row that opened it, with query, filters, page, open group and scroll unchanged.</li><li>Phone: the sheet is full height; Back returns to the same scroll position.</li></ul></div>
      <div><h3>Announcements (polite unless noted)</h3><ul><li>Results: “137 people match. 41 more with geography not recorded.” after each filter change.</li><li>Scope: “Team relationships, 212 people from 2 teammates.”</li><li>Saved: “Saved [Selma Dahl] to your relationships. Nobody was contacted.”</li><li>Errors (assertive, once): “Page 2 could not be read. 50 people are still shown.” Field errors are tied with <code>aria-describedby</code>.</li></ul></div>
      <div><h3>Semantics and wrapping</h3><ul><li>Results are a table with a caption giving the filters and count; on phone, a list with an h2 per person name.</li><li>Shared profile and Your relationship are regions with headings; “Private to you” is in text, not colour alone.</li><li>Long names and organizations wrap (<code>overflow-wrap:anywhere</code>); no horizontal page scroll at 390.</li><li>Every phone target is at least 44 px. States carry a glyph and a word: ○ None, — Not recorded, ? Unavailable, ⊘ Refused, ◷ Stale, ◑ Partial, ◌ Provisional.</li></ul></div></div></div>`;

    /* ===== NPD-16 · board notes ===== */
    else if (B === 'NPD16') html = `<div class="${CV} doc"><div><span class="eye">Network People · #7676 · NPD-16 · board notes</span><h2 style="font-size:22px;margin-top:4px">For each board: who is looking, what they can see, how they get there and back, and what recovers a failure</h2></div>
      <table class="npd-mx"><thead><tr><th scope="col">Board</th><th scope="col">Viewer role</th><th scope="col">Data scope</th><th scope="col">Entry and return</th><th scope="col">Existing source or new dependency</th><th scope="col">Next action</th><th scope="col">Failure recovery</th></tr></thead><tbody><tr><td>NPD-01 People</td><td>Lena · founder</td><td>Discoverable, in her scope</td><td>Network › People; returns to the same row</td><td>New: #7674 search</td><td>Open a person</td><td>Page 2 retry keeps page 1 (NPD-09)</td></tr><tr><td>NPD-01B Scopes</td><td>Lena</td><td>Her book; teammates who share</td><td>Scope buttons</td><td>Book on main; team on main; person link #7674</td><td>Open a person</td><td>Each scope fails alone: Partial</td></tr><tr><td>NPD-02 Person Sheet</td><td>Lena</td><td>Shared profile + her private record</td><td>Row, deep link; Esc returns</td><td>Book, notes, who-knows on main; profile #7672/#7674</td><td>Request introduction</td><td>Unreadable source: others still show</td></tr><tr><td>NPD-03B Other viewer</td><td>Iris · investor</td><td>Shared profile only</td><td>Same link</td><td>#7674</td><td>Add to my relationships</td><td>None, not Unavailable, when no team path</td></tr><tr><td>NPD-04 Conflicts</td><td>Any member</td><td>Shared facts and sources</td><td>Sheet › Sources and 1 conflict</td><td>#7674 corrections</td><td>Suggest a correction</td><td>Not sent: text kept, Try again</td></tr><tr><td>NPD-05 Actions</td><td>Lena</td><td>Her book; requests</td><td>Sheet footer and private area</td><td>Save on main (no person link); invite on main; rest ◇</td><td>One action, effect stated first</td><td>Pending, failed (kept), already saved</td></tr><tr><td>NPD-06 Missing person</td><td>Lena</td><td>Private provisional target</td><td>No result, Add a missing person</td><td>#7674 provisional people</td><td>Save as a provisional target</td><td>Failed save keeps entries; duplicate offers the person</td></tr><tr><td>NPD-07 Directory review</td><td>HQ steward</td><td>Both records, counts of private references</td><td>Admin › Network › Directory review</td><td>#7674 merge and redirect</td><td>Review merge… (Scope → Review → Result)</td><td>Decide later; Undo within 30 days</td></tr><tr><td>NPD-08 Claim</td><td>[Ada Okafor] · member</td><td>Her own profile</td><td>“Is this you?” on an exact match</td><td>#7674 claim verification</td><td>This is me · request link</td><td>Refused: both stay separate</td></tr><tr><td>NPD-11 Deep link</td><td>Signed-out member</td><td>Exact person after sign-in</td><td>Notification</td><td>#7674 person read, redirects</td><td>Open the sheet</td><td>Not available to you, same words for every reason</td></tr></tbody></table>
      <p class="foot">Every board uses the fictional cast: [Lena Sato] at [Kelp Bio], [Iris Chen] at [Harbor Lane Capital], teammates [Dev Varma], [Theo Grant], [Sara Holm], and the external investor [Rhea Mercer].</p></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NPDH') html = `<div class="${CV} doc"><div><span class="eye">Network People · #7676 · handoff</span><h2 style="font-size:22px;margin-top:4px">What main has, what the directory needs, and what is open</h2></div>
      <div class="cols">
      <div><h3>Checked on main (a2677f7615)</h3><ul>
      <li>No shared person registry: no person ID independent of an account, no affiliation or source-fact table. Network people are rows in each member’s own <code>network_connections</code> book.</li>
      <li><code>services/linkedinCsvImport.ts</code> <code>bookOf</code>: 50 a page by page number, a true <code>total</code>, search by name or company, filters source and open follow-up.</li>
      <li><code>services/typedContactBook.ts</code>: writes only the caller’s book, answers <code>contacted: false</code>; a review only against the caller’s own rows by profile URL or email.</li>
      <li><code>services/relationships.ts</code>: who-knows needs a profile URL or email (400 <code>person_unmatchable</code> for a name); a team request takes the teammate’s shared row (<code>ref</code>), not a person ID. <code>relationshipsModel.js</code> TEAM_SEES and NEVER_SHARED are the words reused here.</li>
      <li><code>services/networkTieCandidates.ts</code>: names from shared deals and data rooms only, “never an account directory”.</li>
      <li><code>routes/admin_network_profiles.ts</code> (migrations 075, 551): an HQ roster of mentors and partners with an optional member link. Not searchable by members.</li>
      <li><code>routes/networkfx.ts</code> <code>GET /marketplace/search</code>: returns <code>u.email</code> with each profile and stops at 50 with no total. The directory must not reuse it.</li>
      <li>Research Funds manager records with stable UIDs and redirects (D7325): the target for a person’s firm link. There is no person → firm link.</li>
      <li>Network links on main: Overview, Relationships, Introductions, Organizations (<code>FounderNetworkDesk.jsx</code>).</li></ul></div>
      <div><h3>Requires engineering (◇)</h3><ul>
      <li>#7672: person, account link, affiliation (current, former, unknown; concurrent) and source-record schema; list memberships as source facts.</li>
      <li>#7674: search with cursor and true totals in the viewer’s scope, facets, person read with field-level visibility, provisional people, corrections, merge with redirects, claim and link, book ↔ person reference, fact precedence.</li>
      <li>#7679 / #7681: source import and publication states (extracted, reconciled, published counted apart); NFX Signal lists.</li>
      <li>#7678: introduction requests by person ID. #7680: organization records and affiliation layouts; a firm such as [Fernhill Ventures] links to its Research › Funds manager record, never to a fund vehicle. #7677: requester readiness (not needed to browse).</li></ul>
      <h3 style="margin-top:12px">Pending the owner (⚑, A drawn)</h3><ul><li>Q1 People as a fifth Network link. Q2 Unknown values in their own group. Q3 HQ stewards only.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>The scope buttons, chips, “not recorded” group, keeping state across open and close, the sheet’s two zones, the four actions and their result lines, phone, tablet, dark and the accessibility notes. All behind the ◇ reads; nothing here works on main today.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>Shell, header, links and state words from #4799 and #6256; Add person (#7058) and the team warm path (#7060). Older ids: NW2, NW2.1, NW2.3, W1.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => (x.indexOf('npd-') === 0 || x.indexOf('nrf-') === 0) ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
