/* PRX · Pricing outcome examples (#5957). Tokens are pricing.css's (.axp), set inline per board. */
.prx{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;padding-bottom:48px}
.prx *,.prx *::before,.prx *::after{box-sizing:border-box}
.prx a{color:inherit;text-decoration:none}
.prx button{font-family:inherit}
.prx ul,.prx ol{margin:0;padding:0;list-style:none}
.prx-mono,.prx-m{font-family:'Roboto Mono',monospace;font-size:12.5px}
.prx-ic{flex:none;display:inline-block;vertical-align:-2px}
.prx-crop{padding-bottom:24px}
.prx-pad{padding:0 34px;max-width:1180px;margin:0 auto}
.prx-col{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.prx-cap{margin:0 0 6px;padding:14px 34px;font:600 12.5px/1.5 'Roboto Mono',monospace;color:var(--mu);border-bottom:1px dashed var(--line3)}
.prx-small{font-size:12.5px;line-height:1.5;color:var(--mu)}
.prx-p{margin:0;font-size:14.5px;line-height:1.6;color:var(--body)}
.prx-kick{font:700 10.5px 'Roboto Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--vi)}
.prx-h2{margin:6px 0 18px;font:700 32px/1.14 'Space Grotesk',sans-serif;letter-spacing:-.03em;color:var(--ink)}
.prx-h2.sm{font-size:22px;margin:0}
.prx-h3{margin:0 0 10px;font:700 18px/1.25 'Space Grotesk',sans-serif;letter-spacing:-.015em;color:var(--ink)}
/* annotations, not product copy */
.prx-tag{display:inline-flex;align-items:center;gap:4px;font:700 11px 'Roboto Mono',monospace;color:#6d28d9;background:#f4f0fe;border:1.5px dashed #7c3aed;border-radius:6px;padding:3px 8px;white-space:nowrap}
.prx-flag{display:inline-flex;align-items:center;gap:4px;font:700 11px 'Roboto Mono',monospace;color:#92400e;background:#fffbeb;border:1.5px solid #f59e0b;border-radius:6px;padding:3px 8px;white-space:nowrap}
.prx-ann{font:500 12px/1.5 'Roboto Mono',monospace;color:#5b21b6;background:#faf7ff;border:1px dashed #a78bfa;border-radius:8px;padding:8px 12px;margin:10px 0}
.prx-dark .prx-ann{color:#ddd6fe;background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.5)}
.prx-annrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
/* site frame */
.prx-sh{border-bottom:1px solid var(--line2);background:var(--card)}
.prx-sh-in{max-width:1280px;margin:0 auto;padding:0 34px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.prx-logo{display:flex;align-items:center;gap:10px;font:700 15px 'Space Grotesk',sans-serif;letter-spacing:-.02em}
.prx-logo i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:block}
.prx-logo.inv i{background:#fff}
.prx-sh-nav{display:flex;gap:24px;font-size:13.5px;font-weight:500;color:var(--body)}
.prx-sh-r{display:flex;align-items:center;gap:9px}
.prx-login{padding:8px 15px;border-radius:9px;border:1px solid var(--line3);font-size:12.5px;font-weight:600;color:var(--ink2)}
.prx-apply{padding:9px 17px;border-radius:9px;background:#6d28d9;color:#fff!important;font-size:12.5px;font-weight:700}
.prx-burger{width:44px;height:44px;border-radius:10px;border:1px solid var(--line3);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
/* hero */
.prx-hero{padding:64px 34px 8px;text-align:center;background:var(--hero);border-bottom:1px solid var(--line2)}
.prx-h1{margin:0;font:700 60px/1.02 'Space Grotesk',sans-serif;letter-spacing:-.035em;color:var(--ink)}
.prx-hero-p{margin:16px auto 0;max-width:640px;font-size:16.5px;line-height:1.6;color:var(--body)}
.prx-tabwrap{display:flex;justify-content:center;margin-top:28px}
.prx-tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);flex-wrap:wrap;justify-content:center}
.prx-tab{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--body);background:transparent;white-space:nowrap;min-height:44px}

.prx-cn{display:flex;justify-content:space-between;align-items:center;gap:8px}

.prx-yours{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--vi);background:var(--viS);border:1px solid var(--viL);border-radius:99px;padding:3px 9px;white-space:nowrap}

.prx-ctag{font-size:14px;line-height:1.5;color:var(--body);margin-top:6px}

.prx-pu{font-size:14px;color:var(--mu);font-weight:500}
.prx-pnote{font:400 12.5px/18px 'Roboto Mono',monospace;color:var(--mu);min-height:18px;margin-top:6px}
.prx-noff{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.prx-noffp{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mu);background:var(--wash2);border:1px dashed var(--line3);border-radius:99px;padding:4px 10px}

.prx-cbtn.dis{background:var(--wash2);color:var(--mu);border-color:var(--line)}
.prx-rule{border-top:1px solid var(--line2);margin:20px 0 14px}
.prx-lead{font-size:13.5px;font-weight:700;margin-bottom:10px}
.prx-feats{display:flex;flex-direction:column;gap:10px}

.prx-skc i{display:block;height:11px;border-radius:6px;background:var(--skel);margin-bottom:14px}
.prx-unav{border:1px solid var(--errL);background:var(--errBg);border-radius:15px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

.prx-unav-s{font-size:14px;color:var(--err);margin-top:6px}
.prx-unav-b{font-size:14px;font-weight:700;color:var(--err);background:var(--card);border:1px solid var(--errL);border-radius:10px;padding:11px 16px;min-height:44px}
.prx-lp{margin-top:20px;border:1px solid var(--line);border-radius:15px;background:var(--wash);padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px 32px}
.prx-lp-main{display:flex;flex-direction:column;gap:8px}
.prx-lp-head{display:flex;align-items:baseline;gap:12px}

.prx-new{display:inline-flex;font:700 10.5px 'Space Grotesk',sans-serif;letter-spacing:0;text-transform:none;border-radius:99px;padding:2px 8px;color:var(--vi);background:var(--viS);border:1px solid var(--viL);margin-left:8px;vertical-align:middle}

.prx-cell.wd{font:400 13px/1.45 'Space Grotesk',sans-serif;color:var(--mu)}
.prx-nr{display:inline-flex;align-items:center;gap:5px;font:500 12.5px 'Space Grotesk',sans-serif;color:var(--mu);border:1px dashed var(--line3);border-radius:6px;padding:2px 7px;white-space:nowrap}
/* compare phone (PR-C) */

.prx-chip.fv{outline:2px solid var(--vi);outline-offset:3px}
.prx-chipy{font-weight:600;opacity:.9}
.prx-pt{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}
.prx-pth{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 16px;background:var(--wash);border-bottom:1px solid var(--line);font:700 10.5px 'Roboto Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.prx-ptc{display:flex;flex-direction:column;align-items:flex-end;gap:2px;width:132px;flex:none;text-align:right}
.prx-ptc b{font:700 14px 'Space Grotesk',sans-serif;letter-spacing:0;text-transform:none;color:var(--ink)}
.prx-colsub{display:inline-flex;align-items:center;gap:4px;font:600 11.5px 'Space Grotesk',sans-serif;letter-spacing:0;text-transform:none;color:var(--mu)}
.prx-pt .prx-grp{padding:10px 16px}
.prx-prow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.4}
.prx-prow .prx-rl{flex:1;min-width:0}
.prx-ptv{width:132px;flex:none;display:flex;justify-content:flex-end;text-align:right}
.prx-pv1{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink)}
.prx-pv1.tk{color:var(--vi)}.prx-pv1.ds{color:var(--mu);font-weight:500}
.prx-pv1.mono{font:500 13px 'Roboto Mono',monospace}
.prx-pv1.wd{font-weight:400;color:var(--mu);font-size:13px;line-height:1.4}
.prx-w320 .prx-ptc,.prx-w320 .prx-ptv{width:108px;min-width:96px}
/* outcome examples */
.prx-exsec{padding-top:56px}
.prx-exnote{display:flex;align-items:center;gap:7px;margin:-8px 0 20px;font-size:13px;color:var(--mu)}
.prx-exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.prx-ex{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:22px;display:flex;flex-direction:column;gap:12px}
.prx-exh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prx-demo{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink2);border:1.5px dotted var(--mu);border-radius:6px;padding:2px 8px}
.prx-realc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#047857;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:6px;padding:2px 8px}
.prx-realsrc{font:500 12px 'Roboto Mono',monospace;color:var(--mu)}
.prx-planc{display:inline-flex;font-size:11.5px;font-weight:700;color:var(--vi);background:var(--viS);border:1px solid var(--viL);border-radius:99px;padding:3px 9px}
.prx-inp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.prx-inp.yes{color:var(--vi)}.prx-inp.no{color:var(--mu)}
.prx-inp .prx-ic{width:12px;height:12px}
.prx-ext{margin:2px 0 0;font:700 20px/1.2 'Space Grotesk',sans-serif;letter-spacing:-.015em}
.prx-exs{margin:-4px 0 0;font-size:14px;line-height:1.5;color:var(--body)}
.prx-bx{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--wash)}
.prx-bx.gen{background:var(--card);border-color:var(--viL)}
.prx-bx.lim{background:var(--card);border-style:dashed}
.prx-bh{display:flex;align-items:center;gap:8px;font:700 10.5px 'Roboto Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.prx-genm{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:700 11px 'Space Grotesk',sans-serif;letter-spacing:0;text-transform:none;color:var(--vi)}
.prx-genm i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--vi);display:inline-flex;align-items:center;justify-content:center;font:700 9px 'Space Grotesk',sans-serif;font-style:normal}
.prx-bx ul{display:flex;flex-direction:column;gap:7px}
.prx-bx li{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.prx-bx p{margin:0;font-size:13px;line-height:1.5;color:var(--body)}
.prx-k{font-weight:700;color:var(--ink);margin-right:4px}
.prx-who{display:block;font:500 11.5px 'Roboto Mono',monospace;color:var(--mu)}
.prx-bx q{font-style:italic}
.prx-cite{display:inline-flex;font:500 11px 'Roboto Mono',monospace;color:var(--vi);border:1px solid var(--viL);border-radius:5px;padding:0 5px;margin-left:4px}
.prx-exa{display:flex;align-items:center;gap:8px;margin-top:auto}
.prx-see{width:auto;margin:0;color:var(--vi);border-color:var(--viL)}
.prx-flowb{margin-top:28px}
.prx-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:f}
.prx-flow li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);position:relative}
.prx-flow li div{display:flex;flex-direction:column;gap:3px}
.prx-flow b{font-size:14.5px}
.prx-flow span{font-size:12.5px;color:var(--mu)}
.prx-fn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--viS);color:var(--vi)!important;border:1px solid var(--viL);display:flex;align-items:center;justify-content:center;font:700 12px 'Roboto Mono',monospace!important}
.prx-after{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;background:var(--wash)}

.prx-after .prx-ic{color:var(--vi);margin-top:2px}
/* faq, closing, footer */
.prx-faq{max-width:860px;padding-top:56px}
.prx-faql{border-top:1px solid var(--line)}
.prx-fq{border-bottom:1px solid var(--line)}

.prx-close-a{display:flex;gap:10px;flex-wrap:wrap}
.prx-wbtn{font-size:14px;font-weight:700;color:#141118!important;background:#fff;border-radius:10px;padding:12px 18px}

.prx-foot{margin-top:56px;margin-bottom:-48px;background:#1a1328;color:#fff;padding:48px 34px 28px}
.prx-foot-in{max-width:1212px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px}

.prx-foot-l{max-width:1212px;margin:28px auto 0;padding-top:18px;border-top:1px solid rgba(196,181,253,.2);font-size:13px;color:rgba(255,255,255,.7)}

.prx-app{display:grid;grid-template-columns:232px minmax(0,1fr) 56px;min-height:100%;background:var(--page)}
.prx-side{background:var(--side);border-right:1px solid var(--hair);padding:18px 14px;display:flex;flex-direction:column;gap:14px;color:var(--sideT)}

.prx-co{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:8px 10px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--sideT);font-size:13px;font-weight:600;text-align:left}

.prx-srch{display:flex;gap:8px;align-items:center;width:320px;padding:8px 12px;border-radius:9px;border:1px solid var(--hair);font-size:13px;color:var(--mu)}

        + sec('Frontend only', ['New static copy (pricingExamples.js or sitePricing.js): two Founder examples, the four-step strip, After the raise.', 'Section between the AI band and Compare plans on the Founder tab only; omitted on Investor, Advisors, Operating Partners and Models.', 'In-plan lines from heldCard: growth includes Validate + Build; studio includes both; null marks nothing.', '“See [plan name]” scrolls to the plan card (or the Unavailable box) and focuses it (tabindex −1, the page’s focus ring).', 'Phone: chips wrap (no overflow scroll), a check on the selected chip, one radio group; phone cells add “Included” / “Not included”; “Not recorded” gets its glyph; value column ≥ 96px at 320.', 'Tablet: examples one per row, the strip two by two.'])
        + sec('Requires engineering ◇', [NEW('#5957') + ' “Real, authorized evidence” variant: nothing records which customer evidence Axal VC may show. Not built.', NEW('#3701') + ' Traceable investor research example: held until Research v2. The build shows nothing in its place.', 'Arrow, Home and End keys on the chips and tabs: #4655.'])
        + sec('Pending the owner ⚑', [FLAG('Q1') + ' A: between the AI band and Compare plans (drawn).', FLAG('Q2') + ' A: Models shows no example (drawn).', FLAG('Q3') + ' A: chips wrap (drawn).', FLAG('Q4') + ' A: demonstrations only (drawn).', FLAG('Brief vs main') + ' the brief names Advisory Firm and Partner Firm; main sells two plans on each of those tabs, and the paid one is “Operating Partner Pro”. Drawn as main.', FLAG('Institutional') + ' Best suited for reads the catalogue’s “Best suited for is negotiated with the plan.”, not “Negotiated”. Drawn as main; shorten only by changing the catalogue.'])
        + sec('Accessibility', ['One h1 (Pricing); the section is an h2, each example an h3 with article labelled by it; bands are headed.', 'Label chip, plan chip, Generated mark and in-plan lines are words with shapes, never colour alone.', 'Focus ring 2px violet, offset 3px, distinct from the selected fill on light and dark.', 'Targets 44px on phone; nothing wider than 320.', 'Not recorded, Not included, Not offered yet and Unavailable each have their own glyph and words.'])

        + '</div><p class="prx-small">Sample now: Sat 14 Nov 2026. [Sample venture “Harbourline”], interviewees, [Investor A], [Customer name] and every bracketed figure are fictional. Design only.</p></div>', 1200);
