<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#eeecf1;font-family:'Space Grotesk',system-ui,sans-serif;color:#18181b;-webkit-font-smoothing:antialiased}a{color:#6d28d9}a:hover{color:#7c3aed}</style>
</helmet>
<div style="display:flex;flex-direction:column">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="27">
    <section id="{{ b.id }}" style="padding:40px 48px 34px;border-bottom:1px solid rgba(24,24,27,.08);display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font:700 10px 'Roboto Mono',monospace;padding:4px 8px;background:#18181b;color:#fff;border-radius:5px;letter-spacing:.05em">{{ b.id }}</span><span style="font:800 16px/1.2 'Space Grotesk',sans-serif;letter-spacing:-.015em">{{ b.t }}</span><span style="font:500 11px 'Roboto Mono',monospace;color:rgba(24,24,27,.55)">{{ b.r }}</span></div>
      <div style="font-size:12.5px;line-height:1.5;color:rgba(24,24,27,.6);max-width:1100px">{{ b.d }}</div>
      <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
        <sc-for list="{{ b.frames }}" as="f" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:6px">
            <sc-if value="{{ f.cap }}" hint-placeholder-val="{{ false }}"><span style="font:500 11px 'Roboto Mono',monospace;color:rgba(24,24,27,.55)">{{ f.cap }}</span></sc-if>
            <div style="{{ f.wrap }}"><dc-import name="Pitch Deck Studio Page" view="{{ f.view }}" theme="{{ f.theme }}" shell="{{ f.shell }}" panel="{{ f.panel }}" dialog="{{ f.dialog }}" tab="{{ f.tab }}" step="{{ f.step }}" frame="{{ f.frame }}" variant="{{ f.variant }}" img-use="{{ f.imgUse }}" overlay="{{ f.overlay }}" rail="{{ f.rail }}" options="{{ f.options }}" hint-size="{{ f.hint }}"></dc-import></div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  renderVals() {
    const F = (view, o, cap) => Object.assign({ view, theme: 'light', shell: 'founder', panel: 'sources', dialog: 'none', tab: 'decks', step: 1, frame: 1, variant: '', imgUse: 'content', overlay: 'light', rail: 'closed', options: 'closed', cap: cap || '', wrap: 'width:1440px;flex:none;border:1px solid rgba(24,24,27,.12);border-radius:12px;overflow:hidden;background:#f4f3f7;box-shadow:0 2px 14px rgba(24,24,27,.08)', hint: '1440px,900px' }, o || {});
    const PH = (frame, cap) => F('phone', { frame, wrap: 'width:390px;height:844px;flex:none;border:10px solid #18181b;border-radius:40px;overflow:auto;background:#f4f3f7', hint: '370px,844px' }, cap);
    const ED = (o, cap) => F('editor', o, cap);
    const boards = [
      { id: 'PD1', t: 'Editor · Founder · light', r: '/raise/pitch/edit', d: 'Card 5, Traction, on [Northwind Labs]\u2019s brand kit: the MRR chart bound to Stripe with its chip, three metric tiles (one Stated with a Mismatch pill) and the churn tile reading Not recorded on StudioOS. The card rail on the left with the stale dot on card 5, the AI bar collapsed above the card, speaker notes below, and the Sources panel open on the right. The Eadwyn rail is collapsed to a spine.', frames: [ED()] },
      { id: 'PD1b', t: 'Editor · first run', r: '/raise/pitch/edit', d: 'The editor the first time a founder opens it: three callouts above the card, shown once and dismissed with Got it. Figures come from your records; every figure shows its source; Eadwyn drafts, you keep or discard. The AI bar now carries Rewrite, Shorten and one + Add button.', frames: [ED({ variant: 'first' })] },
      { id: 'PD2', t: 'Studio home · Decks', r: '/raise/pitch', d: 'The current deck with its coverage meter and checks; Build a standard deck now, the fast path that skips source curation; the versions table; New in your data since v4 with Refresh the deck; and views by week, most read card and NDA signed on the right. The moved notice for the old ?mode=workspace address is shown once, dismissible.', frames: [F('home', { tab: 'decks', variant: 'moved' })] },
      { id: 'PD3', t: 'New deck · step 1 · Audience and round', r: '/raise/pitch/new', d: 'Audience cards with Seed fund selected, the active round with its Reviewed chip, the three lengths, the optional prompt, and Start from: blank, a past version, or one of 13 templates, four behind a plan lock.', frames: [F('new', { step: 1 })] },
      { id: 'PD4', t: 'New deck · step 2 · Sources and coverage', r: '/raise/pitch/new', d: 'Every record StudioOS can fill from, by area, each with its value and chip; each area shows its first two and Show [n] more. Scoring rows are off by default. On the right, the coverage meter by grade and what is missing, each with its module link.', frames: [F('new', { step: 2 })] },
      { id: 'PD5', t: 'New deck · step 3 · Outline', r: '/raise/pitch/new', d: 'Eadwyn\u2019s proposed outline on lavender: twelve rows with the source chips each will use, drag to reorder, delete, add, regenerate at [$0.0011]. Build deck with the estimate against the founder\u2019s own average.', frames: [F('new', { step: 3 })] },
      { id: 'PD6', t: 'Building, then the proposal', r: '/raise/pitch/new', d: 'A: progress per card, Filled from records then Eadwyn is writing, each with what it cost in AI tokens (charged, held, or estimated), and a total: used so far, held, and estimated for the deck. B: the deck on lavender with Keep and Discard per card and Keep all; card 9 shows churn Not recorded on StudioOS.', frames: [F('gen')] },
      { id: 'PD7', t: 'Card AI bar · three crops', r: '/raise/pitch/edit', d: 'A text selection with Rewrite, Shorten, Expand, Change tone, Translate, Ask and the cost; the Add menu, the one way to add anything to a card (Text, Chart, Image, Background, From a connector, Layout), which replaces the separate entry points in the rail, the bar and the panels; and a result as a proposal with the before struck through, plus the refusal on a bound figure. The card menu also offers Set a background.', frames: [F('aibar', { hint: '1440px,520px' })] },
      { id: 'PD8', t: 'Layouts, background and themes', r: '/raise/pitch/edit', d: 'The Design tab: twelve one-click layouts; a Background section for this card, where Generate opens the image lightbox set to Card background; the theme from the venture\u2019s brand kit with a Deck background row; two neutral themes; Apply to all cards.', frames: [ED({ panel: 'design' })] },
      { id: 'PD8b', t: 'The slide grid', r: '/raise/pitch/edit', d: 'Every slide is a 12 × 6 grid. A block\u2019s size is the range it covers, columns by rows, and each block is labelled with it: a 6 × 1 text block, a 6 × 5 chart, two 3 × 2 figures, a 6 × 2 image, a 3 × 2 YouTube video at 16:9, a 3 × 1 audio clip, and a 3 × 1 empty range reading Drop here. Every row adds up to the twelve columns. The twelve layouts are presets of this grid.', frames: [ED({ variant: 'grid' })] },
      { id: 'PD8c', t: 'Add a block', r: '/raise/pitch/edit', d: 'The Add menu\u2019s picker as a lightbox: the element (Text, Chart, Graphic, Image, Video link, Audio link, Link button), its settings, and its size: drag a range across the grid, or set the columns and rows, and pick a standard size from the element\u2019s own format (16:9 and 9:16 for video, the file\u2019s ratio for an image, 1 × 1 and 2 × 2 for a graphic). Video link shown: paste a YouTube or Vimeo link, the poster is fetched and the link checked; it plays in present mode, HTML and shared links, and PDF and PowerPoint get the poster with the link.', frames: [ED({ variant: 'grid', dialog: 'blocks' })] },
      { id: 'PD9', t: 'Bound chart · popover', r: '/raise/pitch/edit', d: 'The Data popover on the MRR chart: series, range, previous period, as of 30 Sep · Measured, Changed since [12 Oct] with Refresh and Keep as of, and the Typed second series with Stripe counts.', frames: [ED({ dialog: 'data' })] },
      { id: 'PD9b', t: 'Chart library', r: '/raise/pitch/edit', d: 'Opened from Chart in the AI bar, the card menu, or Open the full library on a selected chart (PD9c), as a centred lightbox. Twelve chart types, each with a preview and how many of your bound series fit it; a type with nothing to draw (the cohort heatmap, without churn) is greyed with the reason. Charts already in this deck can be reused. On the right: the bound series to plot, each with its chip, the range, previous period dotted, the last value labelled, the source chip always on, a preview on the brand kit, and Insert chart.', frames: [ED({ dialog: 'charts' })] },
      { id: 'PD9c', t: 'Chart selected · change its type in place', r: '/raise/pitch/edit', d: 'Selecting the chart on card 5 swaps the AI bar for a chart toolbar: Change type, Series, Range, Data, Labels, Remove. Change type opens a popover on the chart itself with the twelve types as thumbnails, Line selected; types the series cannot fill are greyed, and the source chip stays under whichever type is picked. Open the full library goes to PD9b.', frames: [ED({ variant: 'chart' })] },
      { id: 'PD9d', t: 'From a connector', r: '/raise/pitch/edit', d: 'Opened from From a connector in the card rail, the card menu, or the Sources panel, as a centred lightbox. Left: your connectors with their state and last sync; HubSpot needs attention and Crunchbase is not connected, with the way to fix each. Middle: what the chosen connector offers, with Not recorded rows and their reason, and one Options row (what to make, the layout, the data as of the last sync) that opens on demand. Right: the card on the brand kit, every figure chipped to Stripe, the headline proposed by Eadwyn, and the cost: figures cost nothing, the wording about [$0.0004]. The card stays bound and marks itself stale when Stripe changes.', frames: [ED({ dialog: 'connector' })] },
      { id: 'PD10', t: 'Sources panel and the scorecard dialog', r: '/raise/pitch/edit', d: 'Sources grouped by area with search, grade filter and Stale only, each group showing its first two items and Show [n] more (Grow keeps its stale, mismatched and missing rows in view); the churn row dashed with its module link; the Scorecard band and Product-market fit rows off, their toggle opening the dialog that says what investors would see and never the number.', frames: [ED({ dialog: 'scorecard' })] },
      { id: 'PD10b', t: 'How sources and grades work', r: '/raise/pitch/edit', d: 'A one-page lightbox opened from the Sources and Check panels: the five sources and the five grades, one line each, and the note that investors see the same chips. Every chip on a card also explains itself on hover.', frames: [ED({ dialog: 'legend' })] },
      { id: 'PD11', t: 'Data coverage meter · component sheet at 2x', r: '', d: 'The 100% bar split by grade on the violet ramp, dashed for Not recorded; S, M and L; full, partial, empty, loading and error; light and dark.', frames: [F('meter', { hint: '1440px,620px' })] },
      { id: 'PD12', t: 'Image lightbox · content image', r: '/raise/pitch/edit', d: 'Opens on the essentials only: Use as, the description, style, palette, aspect, count, the cost line and Generate; one Options row names the model, data points and references. PD12e opens Options: data points from the platform\u2019s modules, grouped by Validate, Build, Grow and Raise: text points (a pain theme, an allowed quote, the product description) shape the description, and image points (the product screen, the logo, a team photo from the data room) go in as references; figures never go into an image, and a photo of people needs their agreement. The model list is the Eadwyn rail\u2019s image models with each one\u2019s price per image, FLUX.2 Klein 9B by default; models that cannot take references are greyed while image points are selected; the cost line names the model and checks the AI token balance before the run; two proposals with Keep and Discard; the refusal for real people.', frames: [ED({ dialog: 'image' })] },
      { id: 'PD12b', t: 'Image lightbox · card background', r: '/raise/pitch/edit', d: 'Use as Card background on card 1: a preview of the title card with the image behind it, the brand-ink overlay set to Light, and the contrast check reading Readable. Proposals are tagged Illustration · Background, with Keep as background.', frames: [ED({ dialog: 'image', imgUse: 'card' })] },
      { id: 'PD12c', t: 'Image lightbox · deck background, overlay off', r: '/raise/pitch/edit', d: 'Use as Deck background with the overlay off: the text falls below 4.5:1, so Keep as background waits until an overlay is chosen.', frames: [ED({ dialog: 'image', imgUse: 'deck', overlay: 'none' })] },
      { id: 'PD12d', t: 'Content image on a card', r: '/raise/pitch/edit', d: 'The kept image placed on card 4, Solution, in the Image + text layout: tagged Illustration, selected with crop handles, and an image toolbar in place of the AI bar (Replace, Upload, Regenerate with its cost, Crop, Fit, Alt text, Remove). Under the card: the model, date and cost, and the alt text Eadwyn proposed, which travels with every export. The Design tab lists every image in the deck, generated or uploaded.', frames: [ED({ panel: 'design', variant: 'img' })] },
      { id: 'PD12e', t: 'Image lightbox · Options open', r: '/raise/pitch/edit', d: 'The same lightbox with Options open: the data points column and the model column beside the essentials.', frames: [ED({ dialog: 'image', options: 'open' })] },
      { id: 'PD13', t: 'Check panel', r: '/raise/pitch/edit', d: '12 figures: 9 Backed, 1 Founder\u2019s figure, 1 Mismatch, 1 Not backed, 1 Stale. The Mismatch row offers Use Stripe\u2019s figure or Keep mine, with a note. Open Evidence links out to its own canvas.', frames: [ED({ panel: 'check' })] },
      { id: 'PD14', t: 'Reviewer pass', r: '/raise/pitch/review', d: 'The review of v4: a score only because the review returned one, strengths, weaknesses, red flags and fixes each pointing to a card, the cost of the run, and the history per version with Score not returned where none came back.', frames: [F('home', { tab: 'review' })] },
      { id: 'PD15', t: 'Versions and compare', r: '/raise/pitch', d: 'v3 beside v4 with the four changed cards outlined, and the Restore v3 dialog saying what changes and what stays.', frames: [F('compare', { dialog: 'restore' })] },
      { id: 'PD16', t: 'Present mode', r: '/raise/pitch/present', d: 'A: the presenter view with the current card, next card, notes, timer, count and Esc to exit. B: the audience view, full-bleed, chips off, progress dots.', frames: [F('present')] },
      { id: 'PD17', t: 'Export dialog', r: '/raise/pitch/edit', d: 'PDF, PowerPoint, Google Slides and HTML; the version; speaker notes and the Sources appendix; the Google not-connected notice and the line shown after it is created.', frames: [ED({ dialog: 'export' })] },
      { id: 'PD18', t: 'Share dialog', r: '/raise/pitch/edit', d: 'Investor, expiry, view limit, Download and Forwarding off, the NDA required; What is included, with the data frozen at v4; the link shown once with Copy.', frames: [ED({ dialog: 'share' })] },
      { id: 'PD19', t: 'Share & analytics', r: '/raise/pitch', d: 'Views, unique viewers, median time and NDA signed; seconds per card against the previous version; the funnel from opened to the ask; the table by investor with Withdraw.', frames: [F('home', { tab: 'analytics' })] },
      { id: 'PD20', t: 'Investor · shared deck', r: '/d/[token]', d: 'A: the NDA gate with the text, a name field and Accept and open. B: the viewer with small source chips under each figure, keyboard arrows, Save as PDF only when allowed, and the note that the deal page shows this viewer as a slot, frozen at v4.', frames: [F('investor')] },
      { id: 'PD21', t: 'Admin and Super Admin · read only', r: '/raise/pitch/edit', d: 'The editor in the Admin shell with the [Studio Lisbon] badge: no AI bar, no Share, the Read only banner and the Notes thread. The Super Admin frame adds Default template by sector and stage.', frames: [ED({ shell: 'admin', panel: 'notes' }, 'Admin · [Studio Lisbon]'), ED({ shell: 'hq', panel: 'notes' }, 'Super Admin · HQ')] },
      { id: 'PD22', t: 'No permission', r: '/raise/pitch', d: 'Advisor, Operating Partner and Explorer opening the studio; an investor opening an expired link. Nothing from the deck is shown.', frames: [F('noperm', { hint: '1440px,360px' })] },
      { id: 'PD23', t: 'Empty', r: '/raise/pitch', d: 'No deck yet; no sources, with the coverage meter empty; no views.', frames: [F('empty', { hint: '1440px,420px' })] },
      { id: 'PD24', t: 'Loading', r: '/raise/pitch/edit', d: 'Header at once; thumbnails, meter and card as grey skeletons.', frames: [F('loading')] },
      { id: 'PD25', t: 'Errors and limits', r: '/raise/pitch/edit', d: 'Mercury unreadable; AI off on this page; out of AI tokens at the hold; export failed.', frames: [F('errors', { hint: '1440px,520px' })] },
      { id: 'PD26', t: 'Phone · 390', r: '/raise/pitch', d: 'Home with the deck and its meter; the viewer swiping cards; the share sheet; notes and reorder. No layout editing on the phone.', frames: [PH(1, 'Home'), PH(2, 'Viewer'), PH(3, 'Share sheet'), PH(4, 'Notes and order')] },
      { id: 'PD27', t: 'Editor · dark', r: '/raise/pitch/edit', d: 'PD1 in the dark colours with the Check panel open. Violet text becomes #a78bfa; the slide keeps the venture\u2019s own kit.', frames: [ED({ theme: 'dark', panel: 'check' })] },
      { id: 'PD28', t: 'Eadwyn rail open · Pitch deck studio', r: '/raise/pitch', d: 'The rail docked open on the studio. Its suggested models for this page are a writing model, two image models and a reading model, each with its price; Show all lists every image model. The image lightbox starts on the image model picked here.', frames: [F('home', { tab: 'review', rail: 'open' })] },
    ];
    return { boards };
  }
}
</script>
</body></html>
