    const nrCrop = () => crop('<span class="eye">Not recorded · each missing value says so, never blank or €0</span>'
      + '<div class="har-blk"><div class="har-bh"><div><h3>Open row with no amount, currency or Stripe payment</h3></div></div>' + openTable([OPEN[2]]) + '</div>'
      + '<div class="har-blk"><div class="har-bh"><div><h3>Resolved row with no resolved-by name</h3><p>The operator’s user row is gone or has no name. The reason is always present on a resolved row.</p></div></div><div class="rvx-pane"><table class="rvx-tb har-tb har-res"><thead><tr><th>Booking</th><th>Why</th><th>Stripe payment</th><th class="n">Amount</th><th>Recorded on</th><th>Resolved on · UTC</th><th>Resolved by</th><th>Reason</th></tr></thead><tbody>' + resRow(RES[2]) + '</tbody></table></div></div>'
      + '<div class="har-key"><div>' + kpi('Advisory refunds due', '0', PIT + ' Zero · none open') + '<p>Zero: read, and none is open.</p></div><div>' + kpi('Amount', 'Not recorded', 'This row has none', 'xnr') + '<p>Not recorded: the row holds no value.</p></div><div>' + kpi('Advisory refunds due', 'Unavailable', PIT + ' read failed', 'xun') + '<p>Unavailable: the read failed. Never 0 owed.</p></div></div>', 1300);
    const refusedCrop = () => crop('<span class="eye">Refused · who sees what</span><div class="har-key2">'
      + '<div class="har-pcard"><span class="raw">Admin, not a Super Admin</span>' + tiles('x', true) + '<p>The advisory block and its tile are not drawn at all; nothing says “none owed”. Disputes and HQ refunds follow their own rules.</p></div>'
      + '<div class="har-pcard"><span class="raw">Super Admin, no recent step-up</span><p>Mark refunded… opens the sheet as usual and asks for the authenticator code at Step-up (RV17c). This is a prompt, not an error.</p></div>'
      + '<div class="har-pcard"><span class="raw">Super Admin, signed in without an authenticator</span><p>SMS, recovery code, magic link or Google sessions cannot pass step-up. The sheet ends with “Sign in again with your authenticator to record this. Nothing was changed.” (RV17h). The list stays readable.</p></div></div>', 1300);

    /* ---------- phone ---------- */
    const mrow = (r) => '<div class="rvx-rc"><div class="t">' + mono(r.bk) + WHY[r.why] + '</div><dl><dt>Amount</dt><dd>' + (r.amt || NR()) + '</dd><dt>Stripe payment</dt><dd>' + (r.pi || NR()) + '</dd><dt>Recorded on</dt><dd>' + r.rec + '</dd></dl><button type="button" class="btn" style="min-height:44px;width:100%">Mark refunded…</button></div>';
    const mres = (r) => '<div class="rvx-rc"><div class="t">' + mono(r.bk) + bdg('ok', '✓ Resolved') + '</div><dl><dt>Amount</dt><dd>' + (r.amt || NR()) + '</dd><dt>Resolved on</dt><dd>' + r.on + '</dd><dt>Resolved by</dt><dd style="font-family:var(--sg)">' + (r.by || NR()) + '</dd></dl><p class="har-mrs">' + r.rs + '</p></div>';
    const mTile = '<div class="rvx-m" style="border:1px solid var(--hair);border-radius:12px;background:var(--card)"><span class="l">Advisory refunds due</span><span class="v" style="font-size:22px">3</span><span class="c">' + PIT + ' open · oldest 2026-11-08</span></div>';
    const bsheet = (h, title, n, body) => '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + h + '"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="' + h + '" style="font-size:17px;font-weight:800">' + title + '</h2>' + steps(HSTEPS, n).replace('rvx-steps"', 'rvx-steps" style="font-size:9px"') + body + '</div></div>';
    const MOB = {
      HAR20A: () => phone('Billing exceptions', mTile + '<h3 class="har-mh">Advisory refunds due</h3><p class="har-mp">Refund in Stripe, then mark it here. Marking moves no money.</p>' + J(OPEN.map(mrow))),
      HAR20B: () => phone('Billing exceptions', '<button type="button" class="har-disc" aria-expanded="true" style="min-height:44px"><span aria-hidden="true">▾</span><b>Resolved</b><span class="mu">· 4 shown</span></button>' + J(RES.slice(0, 3).map(mres))),
      HAR20C: () => phone('Billing exceptions', mTile, bsheet('m2', 'Say how it was refunded', 2, '<p class="har-rl">' + mono('bk_7Q2X…') + ' · Cancelled · ' + mono('€150.00') + '</p><div class="fld"><label for="mrr">Reason</label><div class="ta" id="mrr" style="min-height:120px;font-size:14px">' + REASON + '</div><div class="har-cnt"><span>130 / 500 · at least 12</span></div></div><span class="har-chip"><i aria-hidden="true">E</i>Draft from Eadwyn · blanks filled by you</span><button type="button" class="btn p" style="min-height:48px">Continue</button><button type="button" class="btn" style="min-height:48px">Back</button>')),
      HAR20D: () => phone('Billing exceptions', mTile, bsheet('m3', 'Verify it’s you', 3, '<p style="font-size:13.5px">Marking ' + mono('bk_7Q2X…') + ' refunded. This moves no money.</p><div class="fld"><label for="mrc">Authenticator code</label><div class="ta" id="mrc" style="min-height:52px;font-family:var(--mo);font-size:20px;letter-spacing:.3em;text-align:center">••• •••</div></div><button type="button" class="btn p" style="min-height:48px">Verify and mark refunded</button><button type="button" class="btn" style="min-height:48px">Back</button>')),
      HAR20E: () => phone('Billing exceptions', mTile.replace('>3<', '>2<').replace(' · oldest 2026-11-08', ' · oldest 2026-11-08'), bsheet('m4', 'Marked refunded', 4, '<p role="status" class="har-ok"><span aria-hidden="true">✓</span>By Operator A at <span class="har-id">2026-11-14 10:42 UTC</span></p><ul class="har-ul"><li>✓ Kept in the audit log</li><li>⊘ No money moved</li><li>The advisor’s money report now counts it as refunded, not owed.</li></ul><button type="button" class="btn p" style="min-height:48px">Done</button>'))
    };

    /* ---------- handoff ---------- */
    const handoff = () => dk('<h1>HQ Advisory Refunds · handoff (#5305)</h1><p>Continues Revenue v2 (D5039): these boards are RV16 to RV21 there, drawn here as HAR16 to HAR21, with this handoff as HAR22. Checked on main <code>6d7712c6d1</code>, Sat 14 Nov 2026. The brief was written against <code>45e7c55fa6</code>; nothing it relies on changed.</p>'
      + '<h2>Checked on main</h2>' + tbl(['File', 'What it shows'], [
        ['<code>routes/admin_platform.ts</code> GET <code>/advisory-refunds-due</code>', 'Super Admin. 200 rows max, open first, then <code>created_at DESC</code> (resolved rows are ordered by recorded date, not resolved date). <code>open</code> counts unresolved rows in that read. Joins <code>users.name</code> as <code>resolved_by_name</code>. 503 <code>store_unavailable</code>, never an empty list.'],
        ['<code>routes/admin_platform.ts</code> POST <code>/:id/resolve</code>', 'Write bar (<code>requireSuperAdminWriteBar</code>: TOTP factor, recent step-up, Super Admin). Reason trimmed, 12–500, else 400 <code>reason_required</code>. 404 <code>not_found</code>; 409 <code>already_resolved</code> (also when a concurrent resolve wins); 503 when the row and its audit row cannot be written together. Audit action <code>advisory_refund_due_resolved</code>. Returns <code>moves_money: false</code>, <code>resolved_by</code> as an id.'],
        ['<code>sql/migrations/202611070915_advisory_refunds_due.sql</code>, <code>202611100930_…_resolution_reason.sql</code>', 'One row per booking; amount, currency and payment intent nullable; reason column from 10 Nov, so no resolved row predates it.'],
        ['<code>routes/advisors_money.ts</code>', '<code>refunds_owed</code> and <code>refunded</code> split on <code>resolved_at</code>; both null when unreadable, never 0.'],
        ['<code>frontend/src/lib/api/adminAdvisoryRefundsDue.js</code>', '<code>list()</code> and <code>resolve(id, reason)</code> exist; no page imports them.'],
        ['<code>frontend/src/pages/hq/revenue/BillingExceptions.jsx</code>', 'Disputes and HQ refunds only. No advisory row, resolve step or resolved list.']])
      + '<h2>Frontend only (all of it)</h2><p>The tile, the open table, the collapsed Resolved list with full reason on focus, the four-step sheet (Scope, Review, Step-up, Result) reusing RefundReviewFlow’s step-up, the failure ends, the Needs attention line, phone cards and bottom sheet, dark tokens, and the Eadwyn draft from the row’s own values. The Result names the signed-in operator and the server’s <code>resolved_at</code>. Backend required: none.</p>'
      + '<h2>Open questions</h2><ul><li>“Most recent first” for Resolved follows <code>created_at</code>, as the route sorts. Sorting by resolved date would be a one-line route change.</li><li><code>advisors_money.ts</code> adds a row with no amount as 0 cents to <code>refunds_owed.amount_cents</code>; its session count is right, its sum understates. Not drawn here.</li><li>Owner picks from the brief: list placement A (own block) and Stripe id as copyable text, no link (A). Both drawn as A.</li></ul>'
      + '<h2>Accessibility</h2><p>Each status has a glyph and a word. Tables have captions and scoped headers; the reason cell is focusable and its tooltip carries the full text. The counter is tied to the field with <code>aria-describedby</code>; the 400 message is <code>role=alert</code>. Phone targets are 44px or more. The saving button is disabled with <code>aria-busy</code>.</p>');

    /* ---------- route ---------- */
    const pg = (body, h, o) => page(body, Object.assign({ h: h }, o || {}));
    let html;
    if (B === 'HAR16') html = pg(hd() + attention2(ATT2) + exSection(), 1260);
    else if (B === 'HAR16B') html = pg(hd() + exSection({ sel: 0 }), 1100, { rail: railDraft });
    else if (B === 'HAR16R') html = crop(advBlock({ resOpen: true, focus: 0 }), 1300);
    else if (B === 'HAR17A') html = crop(sheet('A'), 720);
    else if (B === 'HAR17B') html = crop(sheet('B'), 720);
    else if (B === 'HAR17B2') html = crop(sheet('B2'), 720);
    else if (B === 'HAR17C') html = crop(sheet('C'), 720);
    else if (B === 'HAR17D') html = crop(sheet('D'), 720);
    else if (B === 'HAR17E') html = crop(sheet('E'), 720);
    else if (B === 'HAR17F') html = crop(sheet('F'), 720);
    else if (B === 'HAR17G') html = crop(sheet('G'), 720);
    else if (B === 'HAR17H') html = crop(sheet('H'), 720);
    else if (B === 'HAR18') html = pg(hd() + exSection({ tile: 'zero', block: emptyBlock(true) }), 900);
    else if (B === 'HAR18B') html = pg(hd() + exSection({ tile: 'zero', block: emptyBlock(false) }), 900);
    else if (B === 'HAR19A') html = crop(tiles('load') + loadBlock, 1300);
    else if (B === 'HAR19B') html = nrCrop();
    else if (B === 'HAR19C') html = pg(hd() + exSection({ tile: 'un', block: unBlock }), 900);
    else if (B === 'HAR19D') html = refusedCrop();
    else if (B === 'HAR19E') html = crop(sheet('S'), 720);
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'HAR21') html = pg(hd() + attention2(ATT2) + exSection(), 1260);
    else if (B === 'HAR21B') html = crop(sheet('C'), 720);
    else if (B === 'HAR22') html = handoff();
    else html = pg(hd() + attention2(ATT2) + exSection(), 1260);
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
