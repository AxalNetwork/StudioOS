        + '<span style="font-size:12.5px;font-weight:700">' + a.area + ' · ' + a.skills.length + ' skill' + (a.skills.length === 1 ? '' : 's') + '</span><div class="tmm-row" style="gap:6px">' + (a === AG.ves ? PAUSED('Paused · cap reached') : a === AG.kad ? NOSK() : READY()) + '</div><span class="tmm-row" style="gap:6px;font-size:12px">' + pav(a.spi, 20) + a.sp + ' · ' + mo(a.spend + ' of ' + a.cap) + '</span></div>';
      html = phone('Team', '<span class="tmm-row" style="gap:6px">' + N(1) + '<b style="font-size:20px">Team</b><span style="margin-left:auto">' + btn('Add to team', 'p sm') + '</span></span><div class="tmm-row" style="gap:14px;border-bottom:1px solid var(--hair);font-size:13px;flex-wrap:nowrap;overflow:hidden"><a href="#" aria-current="page" style="color:var(--ink)!important;font-weight:700;border-bottom:2px solid var(--vi);padding:8px 0">People and agents</a><a href="#" style="color:var(--mu)!important;padding:8px 0">Skills</a><a href="#" style="color:var(--mu)!important;padding:8px 0">Roles</a></div><h2 style="font-size:15px;font-weight:800">AI agents · 3</h2>' + card(AG.tes) + card(AG.ves) + card(AG.kad), null, { backLabel: 'Back to ' + CO });
    }

    else if (B === 'TMM10B') {
      html = phone('Tessaly', '<span class="tmm-row" style="gap:8px">' + N(2) + av('TE', 40) + '<span class="tmm-col" style="gap:2px"><b style="font-size:17px">Tessaly</b>' + arch('Systems Builder') + '</span></span><div class="tmm-row" style="gap:6px">' + READY() + sm('2 ready · 1 runs with limits') + '</div>'
        + '<dl class="tmm-kv" style="grid-template-columns:96px minmax(0,1fr)"><dt>Does</dt><dd>Finance · Works in Finance, Raise</dd><dt>Model</dt><dd>' + mo('gpt-oss-120b') + '</dd></dl>'
        + '<h3 class="tmm-h3">Skills · 3</h3><div class="tmm-box"><div class="tmm-li"><span class="g"><b>Cash runway snapshot</b>' + sm('Makes a brief') + '</span>' + READY('Ready') + '</div><div class="tmm-li"><span class="g"><b>Monthly investor update</b>' + sm('Revenue for Oct not recorded') + '</span>' + LIM('With limits') + '</div><div class="tmm-li"><span class="g"><b>Board meeting brief</b>' + sm('Makes a brief') + '</span>' + READY('Ready') + '</div></div>'
        + '<h3 class="tmm-h3">Sponsor and cap</h3><span class="tmm-row" style="gap:6px;font-size:12.5px">' + pav('MR', 22) + MR + '</span>' + mo('$3.84 of $25 · resets Tue 1 Dec') + bar(15) + '<span class="tmm-row" style="gap:6px">' + EST('≈ $0.17–$0.21 per 100 runs') + '</span>'
        + '<button type="button" class="tmm-disc" aria-expanded="false" style="min-height:44px">' + I.chev + 'About Tessaly: story and values</button>', btn('Pause Tessaly') + btn('Edit cap', 'p'), { barH: 96 }).replace('class="tmm-pbar"', 'class="tmm-pbar" style="flex-direction:row"');
    }

    else if (B === 'TMM10C') {
      html = phone('Add an AI agent', '<span class="tmm-row" style="gap:6px">' + N(3) + mo('Step 1 of 3 · Who') + '</span>' + whoBody(true), btn('Next: skills', 'p'), { close: true, backLabel: 'Close Add an AI agent', barH: 90 });
    }

    else if (B === 'TMM10D') {
      html = phone('Add an AI agent', '<span class="tmm-row" style="gap:6px">' + N(4) + mo('Step 2 of 3 · Skills') + '</span>' + skillsBody(false, true), '<div class="tmm-row" style="flex-wrap:nowrap">' + btn('Back') + btn('Next: model and cap', 'p') + '</div>', { close: true, backLabel: 'Close Add an AI agent', barH: 90 });
    }

    else if (B === 'TMM10E') {
      html = phone('Add an AI agent', '<span class="tmm-row" style="gap:6px">' + N(5) + mo('Step 3 of 3 · Model and cap') + '</span>' + modelList({ short: true }).replace('<div class="tmm-row">', '<div class="tmm-row" style="min-height:44px">') + '<label class="tmm-col" style="gap:4px"><span style="font-weight:700;font-size:12.5px">Monthly cap</span><span class="tmm-field" style="width:140px;min-height:44px">$ <span style="margin-left:6px">20</span></span></label>',
        '<span class="tmm-sm" role="status" style="color:var(--ink)"><b class="tmm-mo">gpt-oss-120b</b> · ≈ $0.20 per 100 runs · cap $20 ≈ 10,100 runs</span><div class="tmm-row" style="flex-wrap:nowrap">' + btn('Back') + btn('Add Ryssa', 'p', ' aria-label="Add Ryssa to ' + CO + '"') + '</div>', { close: true, backLabel: 'Close Add an AI agent', barH: 120 });
    }

    else if (B === 'TMM10F') {
      const over = '<div class="tmm-dim" aria-hidden="true"></div><section role="dialog" aria-modal="true" aria-labelledby="tp" style="position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px 26px;display:flex;flex-direction:column;gap:10px"><div class="tmm-row"><h2 id="tp" style="font-size:16px;font-weight:800">' + N(6) + ' Token prices</h2><span style="margin-left:auto">' + btn(I.x, 'ic', ' aria-label="Close token prices" style="width:44px;height:44px"') + '</span></div>' + sm('Suited to research · what you pay per 1M tokens')
        + J([M.gpt, M.kim, M.nem, M.dsf].map(m => '<div class="tmm-li" style="padding:8px 0"><span class="g"><b class="tmm-mo">' + m.id + '</b><span class="tmm-mo tmm-mu" style="font-size:11.5px">In ' + m.inp + ' · Out ' + m.out + '</span></span><span class="tmm-sm">' + (m.per100 ? m.per100.replace(' per 100 runs', ' /100') : m === M.nem ? 'Unavailable' : 'Not allowed') + '</span></div>')) + sm('Estimates are worked out as on the Model step; How the estimate is worked out sits under the list.') + '</section>';
      html = phone('Add an AI agent', mo('Step 3 of 3 · Model and cap') + modelList({ short: true }), null, { close: true, over: over });
    }

    else if (B === 'TMM10G') {
      html = phone('Team', '<span class="tmm-row" style="gap:6px">' + N(7) + '<b style="font-size:15px">Team coverage</b></span>' + '<div class="tmm-pcard" aria-busy="true"><b style="font-size:13px">Loading</b><p class="tmm-sm" role="status">Reading team coverage…</p>' + sk('100%', 16) + sk('100%', 16) + sk('80%', 16) + '</div>'
        + '<div class="tmm-pcard"><b style="font-size:13px">No category is mapped yet.</b>' + sm('Nobody on this team, person or agent, has a recorded level in any of the eight categories. People get levels from their /studio assessment; agents from their skills.') + btn('Add skills to an agent', 'sm') + btn('Show the eight categories ' + I.down, 't sm', ' aria-expanded="false"') + '</div>'
        + '<div class="tmm-pcard"><b style="font-size:13px">With a people gap</b>' + sm('2 people gaps: Finance / Ops and Legal / Compliance are covered only by an agent.') + J(['Finance / Ops', 'Legal / Compliance'].map(x => '<div class="tmm-row" style="font-size:12.5px;border-top:1px solid var(--hair);padding-top:6px"><b style="flex:1">' + x + '</b>' + sm('Agent · Working') + '</div>')) + '</div>', null, { backLabel: 'Back to ' + CO });
    }

    else html = crop('<p>Unknown board ' + B + '</p>');

    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
