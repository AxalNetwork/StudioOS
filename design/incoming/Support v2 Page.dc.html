.sux-quote{border-left:3px solid var(--hair2);padding:8px 12px;font-size:13.5px;line-height:1.55;background:var(--raised);border-radius:0 8px 8px 0}
.sux-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sux-opt{border:1px solid var(--hair);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sux-opt.on{border:2px solid #7c3aed;background:var(--lav)}
.sux-opt small{display:block;color:var(--mu);font-size:12px}
.sux-res{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;border:1px solid var(--hair);background:var(--card)}
.sux-res .sux-rr{display:flex;align-items:center;gap:8px;font-size:13px}
.sux-mob .sux-esc{grid-template-columns:minmax(0,1fr);gap:8px}
.sux-mob .sux-act{grid-template-columns:repeat(2,minmax(0,1fr))}
.sux-mob .sux-act>div:nth-child(2){border-right:0}
.sux-mob .sux-act>div:nth-child(-n+2){border-bottom:1px solid var(--hair)}
.sux-mob .sux-nav{overflow:hidden}
.sux-mob .sux-nav a{padding:12px 10px;min-height:44px}
.sux-st4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sux-tk td{color:var(--ink)}
.sux-mob .pbd>*{flex:none}
</style>
