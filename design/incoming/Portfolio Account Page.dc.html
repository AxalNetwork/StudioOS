<!DOCTYPE html>
<html><head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

body{margin:0}

</helmet>
<div style="{{ rootSt }}"><div dangerouslySetInnerHTML="{{ body }}"></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;v&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pf1&quot;,&quot;pf1m&quot;,&quot;pf2&quot;,&quot;pf3a&quot;,&quot;pf3b&quot;,&quot;pf4a&quot;,&quot;pf4b&quot;,&quot;pf4c&quot;,&quot;pf5&quot;,&quot;pf6a&quot;,&quot;pf6b&quot;,&quot;pf6c&quot;,&quot;pf6d&quot;,&quot;pf6f1&quot;,&quot;pf6f2&quot;,&quot;pf7a&quot;,&quot;pf7b&quot;,&quot;pf7c&quot;,&quot;pf7c2&quot;,&quot;pf7d&quot;,&quot;pf7e&quot;,&quot;pf8a&quot;,&quot;pf8b&quot;,&quot;pf1-d&quot;,&quot;pf2-d&quot;],&quot;default&quot;:&quot;pf1&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const raw = String(this.props.v || 'pf1');
    const dark = /-d$/.test(raw);
    const v = raw.replace(/-d$/, '');
    const M = "font-family:'Roboto Mono',ui-monospace,monospace";
    const F = "font-family:'Space Grotesk',system-ui,sans-serif";
    const LIGHT = '--bg:#f4f3f7;--card:#ffffff;--raised:#faf9fc;--ink:#18181b;--body:#3f3a47;--mut:#6b6577;--line:#ececf1;--line2:#e2dfe8;--vtx:#6d28d9;--lav:#f4f0fe;--lavE:#ddd0fb;--chip:#f4f3f7;--pos:#047857;--posT:rgba(4,120,87,.09);--neg:#b91c1c;--negT:#fef2f2;--negE:#fecaca;--scrim:rgba(24,24,27,.32);--skel:#ececf1';
    const DARK = '--bg:#0b1220;--card:#111827;--raised:#1f2937;--ink:#e5e7eb;--body:#d1d5db;--mut:#9ca3af;--line:#374151;--line2:#4b5563;--vtx:#a78bfa;--lav:rgba(167,139,250,.14);--lavE:rgba(167,139,250,.38);--chip:#1f2937;--pos:#34d399;--posT:rgba(52,211,153,.12);--neg:#f87171;--negT:rgba(248,113,113,.12);--negE:rgba(248,113,113,.38);--scrim:rgba(0,0,0,.55);--skel:#1f2937';
    const EY = (t, c) => `<span style="${M};font-size:11px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:${c || 'var(--mut)'}">${t}</span>`;
    const NR = '<span style="font-style:italic;color:var(--mut)">Not recorded</span>';
    const PK = { pos: 'background:var(--posT);color:var(--pos)', amb: 'background:#fcd34d;color:#92400e', neu: 'background:var(--chip);color:var(--body);border:1px solid var(--line2)', lav: 'background:var(--lav);color:var(--vtx);border:1px solid var(--lavE)' };
    const pill = (t, k) => `<span style="display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;box-sizing:border-box;${PK[k || 'neu']}">${t}</span>`;
    const TB = t => pill(t, t === 'Company' ? 'lav' : 'neu');
    const SLUG = t => `<span style="${M};display:inline-flex;align-items:center;min-height:22px;padding:1px 8px;border-radius:7px;background:var(--chip);border:1px solid var(--line2);font-size:11.5px;color:var(--body);white-space:nowrap">${t}</span>`;
    const BT = `display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:9px;${F};font-size:13.5px;font-weight:600;cursor:pointer;box-sizing:border-box;white-space:nowrap;text-decoration:none;`;
    const bP = (t, x) => `<button type="button"${x || ''} style="${BT}border:1px solid #7c3aed;background:#7c3aed;color:#fff">${t}</button>`;
    const bS = t => `<button type="button" style="${BT}border:1px solid var(--line2);background:var(--card);color:var(--ink)">${t}</button>`;
    const bD = t => `<button type="button" style="${BT}border:1px solid var(--negE);background:var(--card);color:var(--neg)">${t}</button>`;
    const bT = t => `<button type="button" style="${BT}min-height:32px;padding:0 8px;border:1px solid transparent;background:transparent;color:var(--vtx)">${t}</button>`;
    const lnk = t => `<a href="#" style="font-size:13px;font-weight:600;color:var(--vtx);text-decoration:none">${t}</a>`;
    const card = (title, inner, right, ex) => `<section style="flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;min-width:0;${ex || ''}"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px"><h3 style="margin:0;font-size:15px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px">${title}</h3>${right || ''}</div>${inner}</section>`;
    const DL = rows => `<dl style="margin:0;flex:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden">${rows.map(([k, val], i) => `<div style="display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 12px;${i ? 'border-top:1px solid var(--line)' : ''}"><dt style="${M};font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${k}</dt><dd style="margin:0;font-size:13px;line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${val}</dd></div>`).join('')}</dl>`;
    const REQ = '<span aria-hidden="true" style="color:var(--neg);font-weight:800">*</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">required</span>';
    const FLD = (label, inner, help, req) => `<div style="flex:none;display:flex;flex-direction:column;gap:6px"><span style="font-size:12.5px;font-weight:700;display:flex;gap:4px;position:relative">${label}${req ? REQ : ''}</span>${inner}${help ? `<span style="font-size:12px;line-height:1.45;color:var(--mut)">${help}</span>` : ''}</div>`;
    const INP = (val, ph, ex) => `<div role="textbox" style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13.5px;color:${val ? 'var(--ink)' : '#a1a1aa'};${ex || ''}">${val || ph}</div>`;
    const SEL = val => `<div role="combobox" aria-expanded="false" tabindex="0" style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13.5px;font-weight:600">${val}<span aria-hidden="true" style="color:var(--mut)">▾</span></div>`;
    const SK = (n, h) => Array.from({ length: n }, () => `<div style="height:${h || 44}px;border-radius:9px;background:var(--skel)"></div>`).join('');
    const NOTE = (t, k) => `<div style="flex:none;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;${k === 'lav' ? 'background:var(--lav);border:1px solid var(--lavE);color:var(--ink)' : 'background:var(--raised);border:1px solid var(--line);color:var(--body)'}">${t}</div>`;
    const AV = (ini, s) => { s = s || 32; return `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:none;border-radius:999px;background:var(--chip);border:1px solid var(--line2);display:grid;place-items:center;font-size:${Math.round(s * 0.34)}px;font-weight:800;color:var(--body);box-sizing:border-box">${ini}</span>`; };
    const CM = (ini, s) => { s = s || 32; return `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:none;border-radius:${Math.round(s * 0.24)}px;background:var(--lav);border:1px solid var(--lavE);display:grid;place-items:center;font-size:${Math.round(s * 0.34)}px;font-weight:800;color:var(--vtx);box-sizing:border-box">${ini}</span>`; };
    const PM = (ini, s) => { s = s || 32; return `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:none;border-radius:${Math.round(s * 0.24)}px;background:var(--card);border:1.5px dashed var(--line2);display:grid;place-items:center;font-size:${Math.round(s * 0.34)}px;font-weight:800;color:var(--body);box-sizing:border-box">${ini}</span>`; };
    const ERR = t => `<div role="alert" style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:10px;border:1px dashed var(--line2)"><span style="font-size:13px;line-height:1.5;color:var(--body)">${t} could not be read. That is not the same as having none.</span>${bS('Try again')}</div>`;

    const COS = [
      { id: 'nl', ini: 'NL', n: '[Northwind Labs Inc.]', slug: '/c/northwind-labs', jur: 'Delaware, United States', type: 'C-Corporation', st: ['Active', 'pos'], team: '[8]', loc: '[Lisbon, Portugal]', pr: [['AP', '[Atlas Pilot]', '/c/northwind-labs/p/atlas-pilot', 'Build', '[4]'], ['OR', '[Orbit]', '/c/northwind-labs/p/orbit', 'Validate', '[2]']] },
      { id: 'bh', ini: 'BH', n: '[Bluefern Health Lda]', slug: '/c/bluefern-health', jur: 'Portugal', type: 'Private limited company (Lda)', st: ['Active', 'pos'], team: '[4]', loc: '[Porto, Portugal]', pr: [['CA', '[Clinic App]', '/c/bluefern-health/p/clinic-app', 'Raise', '[3]']] },
      { id: 'hr', ini: 'HR', n: '[Harbor Robotics GmbH]', slug: '/c/harbor-robotics', jur: 'Germany', type: 'GmbH', st: ['In formation', 'amb'], team: '[3]', loc: '[Berlin, Germany]', pr: [] }
    ];
    const SOLO = [['LA', '[Lantern]', '/p/lantern', 'Validate', '[2]'], ['FN', '[Fieldnote]', '/p/fieldnote', 'Build', '[1]']];
    const FACT = (k, val) => `<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="${M};font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${k}</span><span style="font-size:13px;font-weight:600">${val}</span></span>`;
    const prRow = ([ini, n, slug, stage, team]) => `<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)">${PM(ini, 28)}<span style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><a href="#" style="font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none">${n}</a>${TB('Project')}${SLUG(slug)}</span><span style="font-size:12.5px;color:var(--body)">${stage}</span><span style="${M};font-size:12px;color:var(--mut);width:84px;text-align:right">Team ${team}</span>${lnk('Open')}</div>`;
    const coCard = (c, o) => `<article style="flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:flex-start;gap:12px;padding:16px 18px"><span>${CM(c.ini, 40)}</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><a href="#" style="font-size:16px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);text-decoration:none">${c.n}</a>${TB('Company')}${pill(c.st[0], c.st[1])}${SLUG(c.slug)}</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">${FACT('Jurisdiction', c.jur)}${FACT('Entity type', c.type)}${FACT('Team', c.team + ' people')}${FACT('Location', c.loc)}</div></div><div style="display:flex;gap:6px;flex:none">${bT('Settings')}${bS('Open company')}</div></div><div style="background:var(--raised);border-top:1px solid var(--line);padding:4px 8px 6px"><div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px">${EY('Projects in this company · [' + c.pr.length + ']')}${bT('+ Add project')}</div>${o && o.err ? `<div style="padding:0 10px 10px">${ERR('Its projects')}</div>` : c.pr.length ? c.pr.map(prRow).join('') : '<p style="margin:0;padding:6px 10px 10px;font-size:13px;color:var(--mut)">No projects yet.</p>'}</div></article>`;
    const soloCard = ([ini, n, slug, stage, team]) => `<article style="flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px">${PM(ini, 36)}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><a href="#" style="font-size:14.5px;font-weight:800;color:var(--ink);text-decoration:none">${n}</a>${TB('Project')}</div>${SLUG(slug)}</div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--body)"><span>${stage}</span><span style="${M};color:var(--mut)">Team ${team}</span>${pill('Not a company yet', 'neu')}</div><div style="display:flex;gap:6px">${bS('Open project')}${bT('Make it a company')}</div></article>`;

    const SIDE = ['Studio', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'];
    const SELS = { nl: ['NL', '[Northwind Labs Inc.]', 'Company', 'Company'], ap: ['AP', '[Atlas Pilot]', 'Project', 'in [Northwind Labs Inc.]'], la: ['LA', '[Lantern]', 'Project', 'Standalone'] };
    const ACCT = [['Profile and identity'], ['Portfolio', 1], ['Notifications'], ['Sign-in and security'], ['Billing and orders'], ['Usage'], ['Connectors'], ['Following'], ['Builder']];
    const shell = o => {
      const W = o.w || 1440, sel = o.sel || 'nl', S = SELS[sel];
      const mk = S[2] === 'Company' ? CM(S[0], 30) : PM(S[0], 30);
      const sw = `<button type="button" aria-haspopup="listbox" aria-expanded="${o.swOpen ? 'true' : 'false'}" aria-label="Switch company or project. Current: ${S[1]}, ${S[2]}" style="width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid ${o.swOpen ? 'var(--lavE)' : 'var(--line)'};background:${o.swOpen ? 'var(--lav)' : 'var(--raised)'};color:var(--ink);${F};text-align:left;cursor:pointer;box-sizing:border-box">${mk}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:13.5px;font-weight:700;line-height:1.2">${S[1]}</span><span style="display:flex;align-items:center;gap:5px">${TB(S[2])}<span style="font-size:11px;color:var(--mut)">${S[2] === 'Company' ? '' : S[3]}</span></span></span><span aria-hidden="true" style="color:var(--mut)">▾</span></button>`;
      const row = (t, on, lvl) => `<a href="#"${on ? ' aria-current="page"' : ''} style="display:flex;align-items:center;min-height:${lvl ? 32 : 36}px;padding:0 12px 0 ${12 + (lvl || 0) * 14}px;border-radius:9px;font-size:${lvl ? 13 : 13.5}px;text-decoration:none;${on ? 'background:var(--lav);color:var(--vtx);font-weight:700' : 'color:var(--body);font-weight:500'}">${t}</a>`;
      const ss = o.setSel || '';
      const prow = (t, act) => row(t, false, 1).replace('color:var(--body);font-weight:500', act ? 'color:var(--ink);font-weight:800' : 'color:var(--body);font-weight:500');
      const BILL = `<a href="#" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:32px;padding:4px 12px;margin-top:4px;font-size:12px;line-height:1.35;color:var(--mut);text-decoration:none">Billing is in Account › Billing ↗<span style="display:inline-flex;align-items:center;min-height:18px;padding:1px 7px;border-radius:999px;border:1px dashed var(--line2);font-size:10.5px">pending owner</span></a>`;
      const coS = ss === 'general' || ss === 'legal', prS = ss === 'projects' || ss === 'p';
      const block = sel === 'la' ? `${EY('Project settings')}${row('Team', ss === 'team', 1)}${prow('Project settings', ss === 'gen')}${ss === 'gen' ? row('General', true, 2) : ''}${BILL}` : `${EY('Company settings')}${row('Team', ss === 'team', 1)}${prow('Company settings', coS)}${coS ? row('General', ss === 'general', 2) + row('Legal', ss === 'legal', 2) : ''}${ss === 'projects' ? row('Projects', true, 1) : prow('Projects', prS)}${prS ? row('[Atlas Pilot]', ss === 'p', 2) + row('[Orbit]', false, 2) : ''}${BILL}`;
      const side = `<nav aria-label="Main" style="width:232px;flex:none;box-sizing:border-box;background:var(--card);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:2px">${sw}<div style="height:10px"></div>${SIDE.map(t => row(t, false)).join('')}<div style="height:1px;background:var(--line);margin:10px 0"></div><div style="display:flex;flex-direction:column;gap:2px;padding-left:0"><span style="padding:4px 12px 2px;display:block"></span>${block}</div></nav>`;
      const top = `<header style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;gap:9px;width:214px;flex:none"><img src="/axal-mark.png" alt="" style="width:28px;height:28px;display:block;border-radius:7px;object-fit:contain"><span style="font-size:15px;font-weight:800;letter-spacing:-0.02em">Axal VC</span></div><div style="width:340px;min-height:36px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--mut);font-size:13px">Search Axal VC</div><div style="flex:1"></div><span role="button" tabindex="0" aria-label="Account menu" style="width:34px;height:34px;border-radius:999px;background:var(--lav);border:1px solid var(--lavE);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--vtx);box-sizing:border-box">AS</span></header>`;
      const acct = `<div style="display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em">Account</h1><p style="margin:0;font-size:13.5px;color:var(--mut)">Who you are on the platform, how it reaches you, how you sign in, what you pay for and who you follow.</p></div><div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start"><nav aria-label="Account sections" style="display:flex;flex-direction:column;gap:2px">${ACCT.map(([t, on]) => `<a href="#"${on ? ' aria-current="page"' : ''} style="display:flex;align-items:center;min-height:34px;padding:0 10px;border-radius:7px;font-size:13.5px;text-decoration:none;${on ? 'background:var(--lav);color:var(--vtx);font-weight:700' : 'color:var(--body);font-weight:500'}">${t}</a>`).join('')}<span style="${M};font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);padding:14px 10px 4px">More</span>${['Onboarding', 'Appearance', 'Activity Log'].map(t => `<a href="#" style="display:flex;align-items:center;min-height:32px;padding:0 10px;font-size:13px;color:var(--body);text-decoration:none">${t}</a>`).join('')}</nav><section aria-label="Portfolio" style="display:flex;flex-direction:column;gap:14px;min-width:0">${o.body}</section></div>`;
      const main = `<main style="flex:1;min-width:0;box-sizing:border-box;padding:24px 28px 32px;display:flex;flex-direction:column;gap:18px">${o.acct ? acct : o.body}</main>`;
      const sh = o.sheet ? `<div aria-hidden="true" style="position:absolute;inset:0;background:var(--scrim);z-index:5"></div><aside role="dialog" aria-modal="true" aria-label="${o.sheet.t}" style="position:absolute;top:0;bottom:0;right:0;width:${o.sheet.w || 520}px;z-index:6;box-sizing:border-box;background:var(--card);border-left:1px solid var(--line);border-radius:16px 0 0 16px;box-shadow:-16px 0 48px rgba(24,24,27,.18);display:flex;flex-direction:column;overflow:hidden">${o.sheet.html}</aside>` : '';
      return `<div style="position:relative;width:${W}px;min-height:${o.h || 1100}px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden">${top}<div style="flex:1;display:flex;min-height:0;position:relative">${side}${main}${sh}${o.pop || ''}</div></div>`;
    };

    const pCo = c => `<article style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:10px">${CM(c.ini, 36)}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:14.5px;font-weight:800">${c.n}</span><span style="display:flex;gap:5px;flex-wrap:wrap">${TB('Company')}${pill(c.st[0], c.st[1])}</span></div><span aria-hidden="true" style="color:var(--mut);font-size:18px">›</span></div><span style="font-size:12.5px;color:var(--body)">${c.type} · ${c.jur} · Team ${c.team}</span>${c.pr.length ? `<div style="display:flex;flex-direction:column;border-top:1px solid var(--line)">${c.pr.map(([i, n, s]) => `<a href="#" style="display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--ink)">${PM(i, 22)}<span style="flex:1;font-size:13px;font-weight:600">${n}</span>${TB('Project')}</a>`).join('')}</div>` : ''}</article>`;

    const FR = {};
    FR.pf1 = () => shell({ acct: true, h: 1500, body: overview({ moved: true }) });
    FR.pf1m = () => shell({ acct: true, h: 1500, body: overview({ open: true }), pop: NEWMENU });
    FR.pf2 = () => shell({ acct: true, h: 1240, body: coPage() });
    FR.pf3a = () => shell({ acct: true, sel: 'ap', h: 1000, body: projPage(false) });
    FR.pf3b = () => shell({ acct: true, sel: 'la', h: 1000, body: projPage(true) });
    FR.pf4a = () => shell({ acct: true, h: 1340, body: overview(), sheet: newCo });
    FR.pf4b = () => shell({ acct: true, h: 1100, body: overview(), sheet: newPr });
    FR.pf5 = () => shell({ acct: true, sel: 'ap', swOpen: true, h: 1000, body: projPage(false), pop: SWM });
    FR.pf6a = () => shell({ sel: 'nl', setSel: 'general', h: 820, body: setCo('General') + genCo + NOTE('A company is a legal entity and governs every project under it. Its settings sit at the bottom of the sidebar: Team, Company settings (General, Legal) and Projects. Billing is in Account › Billing.') });
    FR.pf6b = () => shell({ sel: 'la', setSel: 'gen', h: 820, body: setSolo });
    FR.pf6c = () => shell({ sel: 'ap', setSel: 'p', h: 900, body: setCo('Projects') + projSet });
    FR.pf7a = () => shell({ acct: true, h: 760, body: paneHead() + `<div style="flex:none;border:1px dashed var(--line2);border-radius:12px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--card)"><div style="display:flex;gap:10px">${CM('+', 40)}${PM('+', 40)}</div><h3 style="margin:0;font-size:16px;font-weight:800">No company or project yet</h3><p style="margin:0;max-width:520px;font-size:13.5px;line-height:1.55;color:var(--body)">Create a company for a legal entity, or a project to start working before you incorporate. You can move a project into a company later.</p><div style="display:flex;gap:8px">${bS('New project')}${bP('New company')}</div></div>` });
    FR.pf7b = () => shell({ acct: true, h: 900, body: paneHead() + EY('Companies') + `<div aria-busy="true" style="display:flex;flex-direction:column;gap:12px">${SK(2, 150)}</div>` + EY('Standalone projects') + `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">${SK(2, 120)}</div><span style="font-size:12.5px;color:var(--mut)">Reading…</span>` });
    FR.pf7c = () => shell({ acct: true, h: 1240, body: coPage({ err: true }) });
    FR.pf7c2 = () => shell({ acct: true, h: 1500, body: overview({ err: true }) });
    FR.pf7d = () => phone('Portfolio', `<h1 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em">Portfolio</h1><p style="margin:0;font-size:13px;line-height:1.5;color:var(--mut)">Your companies and projects.</p><button type="button" aria-haspopup="menu" style="${BT}width:100%;min-height:48px;border:1px solid #7c3aed;background:#7c3aed;color:#fff">New ▾</button>${EY('Companies · [3]')}${COS.slice(0, 2).map(pCo).join('')}${EY('Standalone projects · [2]')}${SOLO.map(([i, n, s]) => `<a href="#" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)">${PM(i, 30)}<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:13.5px;font-weight:700">${n}</span><span style="${M};font-size:11px;color:var(--mut)">${s}</span></span>${pill('Not a company yet', 'neu')}</a>`).join('')}`);
    FR.pf7e = () => phone('[Northwind Labs Inc.]', `${lnk('‹ Portfolio')}<div style="display:flex;align-items:center;gap:10px">${CM('NL', 40)}<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:17px;font-weight:800">[Northwind Labs Inc.]</span><span style="display:flex;gap:5px">${TB('Company')}${pill('Active', 'pos')}</span></div></div>${SLUG('/c/northwind-labs')}<section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px"><h3 style="margin:0 0 6px;font-size:15px;font-weight:800">Legal information</h3>${[['Entity type', 'C-Corporation'], ['Jurisdiction', 'Delaware, United States'], ['Registration number', '[7712345]'], ['Tax ID', '[••-•••4821]'], ['Incorporated', '[12 Mar 2026]']].map(([k, val]) => `<div style="display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)"><span style="${M};font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${k}</span><span style="font-size:13.5px">${val}</span></div>`).join('')}</section><section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px"><h3 style="margin:0 0 6px;font-size:15px;font-weight:800">Projects in this company</h3>${COS[0].pr.map(([i, n]) => `<a href="#" style="display:flex;align-items:center;gap:8px;min-height:44px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)">${PM(i, 22)}<span style="flex:1;font-size:13.5px;font-weight:600">${n}</span><span aria-hidden="true" style="color:var(--mut)">›</span></a>`).join('')}</section>`);
    const EYC = dark ? '#a78bfa' : '#7c3aed';
    const EYE = z => `<svg width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true" style="display:block;flex:none"><path fill="${EYC}" fill-rule="evenodd" d="M1.6 12C5.6 4.6 18.4 4.6 22.4 12C18.4 19.4 5.6 19.4 1.6 12ZM12 8.7a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 1 0 0-6.6Z"/><circle cx="12" cy="12" r="1.7" fill="${EYC}"/><path fill="${EYC}" d="M12 .4L13.4 6.9H10.6ZM12 23.6L13.4 17.1H10.6ZM.2 12L4.6 10.7V13.3ZM23.8 12L19.4 10.7V13.3Z"/></svg>`;
    const ASKH = `<button type="button" aria-label="Ask Eadwyn" style="display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 11px;box-sizing:border-box;border-radius:9px;border:1px solid var(--lavE,#ddd0fb);background:transparent;color:var(--vtx);font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;flex:none">${EYE(16)}Ask</button>`;
    const FTR = l => `<button type="button" aria-label="Ask Eadwyn to fill ${l}" title="Ask Eadwyn" style="margin-left:auto;width:20px;height:20px;flex:none;padding:0;border:none;border-radius:999px;background:var(--lav);display:grid;place-items:center;cursor:pointer">${EYE(13)}</button>`;
    const tl = (l, on) => on ? l + FTR(l) : l;
    const withAsk = sh => { const h = sh.html; const x = h.indexOf('aria-label="Close"'); if (x < 0) { const e2 = h.indexOf('</h2>') + 5; return Object.assign({}, sh, { html: h.slice(0, e2) + `<div style="padding-top:6px">${ASKH}</div>` + h.slice(e2) }); } const b = h.lastIndexOf('<button', x), e = h.indexOf('</button>', x) + 9; return Object.assign({}, sh, { html: h.slice(0, b) + '<div style="display:flex;align-items:center;gap:6px;flex:none">' + ASKH + h.slice(b, e) + '</div>' + h.slice(e) }); };
    const newCoAsk = withAsk(sheet('New company', 'Account › Portfolio · required fields are marked *', [
      FLD('Legal name', INP('', 'As it will appear on filings'), 'You type the legal name. Eadwyn never fills it.', 1),
      FLD('Entity type', SEL('C-Corporation'), '', 1),
      FLD('Jurisdiction', SEL('Delaware, United States'), '', 1),
      FLD('Registration number', INP('', 'Given by the registry after filing')),
      FLD('Tax ID', INP('', 'Given after filing')),
      FLD(tl('Registered address', 1), INP('', 'Street, city, postcode')),
      FLD('Incorporation date', INP('', 'DD Mon YYYY')),
      FLD(tl('Officers and directors', 1), INP('', 'Add a name and a role')),
      FLD('Slug', INP('/c/[northwind-labs]', ''), 'Set from the legal name. You can change it.')
    ].join(''), bS('Cancel') + bP('Create company'), 520));
    const legalSheet = ask => { const s2 = sheet('Edit legal facts', '[Northwind Labs Inc.] · Company settings › Legal', [
      FLD('Legal name', INP('[Northwind Labs Inc.]', ''), '', 1),
      FLD('Entity type', SEL('C-Corporation'), '', 1),
      FLD('Jurisdiction', SEL('Delaware, United States'), '', 1),
      FLD('Registration number', INP('[7712345]', '')),
      FLD('Tax ID', INP('[••-•••4821]', '')),
      FLD(tl('Registered agent', ask), INP('', 'The agent who receives legal mail')),
      FLD(tl('Mailing address', ask), INP('', 'Where other mail goes, if not the registered address')),
      NOTE('Changes to legal facts are recorded under your name. Filed documents do not change.')
    ].join(''), bS('Cancel') + bP('Save'), 520); return ask ? withAsk(s2) : s2; };
    const DRW = sel => { const S = SELS[sel], co = S[2] === 'Company'; const mk = co ? CM(S[0], 30) : PM(S[0], 30);
      const r = t => `<a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:9px;font-size:14px;color:var(--body);font-weight:500;text-decoration:none">${t}</a>`;
      const bot = co ? r('Team') + r('Company settings') + r('Projects') : r('Team') + r('Project settings');
      return `<div style="width:390px;height:844px;box-sizing:border-box;background:var(--card);display:flex;flex-direction:column;overflow:hidden"><div style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;border-bottom:1px solid var(--line)"><span style="font-size:16px;font-weight:800;letter-spacing:-0.02em">Menu</span><button type="button" aria-label="Close menu" style="width:44px;height:44px;border:none;background:transparent;color:var(--body);font-size:20px;cursor:pointer">×</button></div><div style="flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:2px"><button type="button" aria-haspopup="listbox" aria-label="Switch company or project" style="display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised,#faf9fc);color:var(--ink);font-family:'Space Grotesk',sans-serif;text-align:left;cursor:pointer">${mk}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:700">${S[1]}</span><span style="display:flex;align-items:center;gap:6px">${TB(S[2])}<span style="font-size:11.5px;color:var(--mut)">${co ? '' : S[3]}</span></span></span><span aria-hidden="true" style="color:var(--mut)">▾</span></button><div style="height:8px"></div>${SIDE.map(t => r(t)).join('')}<div style="height:1px;background:var(--line);margin:10px 0 8px"></div><div style="padding:2px 14px 4px">${EY(co ? 'Company settings' : 'Project settings')}</div>${bot}<a href="#" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:44px;padding:0 14px;font-size:12.5px;color:var(--mut);text-decoration:none">Billing is in Account › Billing ↗<span style="display:inline-flex;align-items:center;min-height:18px;padding:1px 7px;border-radius:999px;border:1px dashed var(--line2);font-size:10.5px">pending owner</span></a></div></div>`; };
    FR.pf4c = () => shell({ acct: true, h: 1340, body: overview(), sheet: newCoAsk });
    FR.pf6d = () => `<div style="display:flex;width:1440px">${shell({ w: 720, sel: 'nl', setSel: 'general', h: 860, body: setCo('General') + genCo })}${shell({ w: 720, sel: 'la', setSel: 'gen', h: 860, body: setSolo })}</div>`;
    FR.pf6f1 = () => DRW('nl');
    FR.pf6f2 = () => DRW('la');
    FR.pf8a = () => shell({ sel: 'nl', setSel: 'legal', h: 1060, body: setCo('Legal') + card('Legal facts', LEGAL), sheet: legalSheet(false) });
    FR.pf8b = () => shell({ sel: 'nl', setSel: 'legal', h: 1060, body: setCo('Legal') + card('Legal facts', LEGAL), sheet: legalSheet(true) });
    const html = (FR[v] || FR.pf1)();
    return { rootSt: (dark ? DARK : LIGHT) + ';' + F + ';color:var(--ink);background:var(--bg);width:max-content', body: { __html: html } };
  }
}

</script>
