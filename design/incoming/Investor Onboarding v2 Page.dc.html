    const resume = (confirm) => card('Welcome back. Pick up at step 4 of 7', 'Steps 1 to 3 are saved. Next: Sectors and regions.',

      + '<p class="foot" style="margin:0">Last saved 11 Nov, 18:04 UTC.</p>',
      '<div class="iob-ft"><button type="button" class="iob-b">Start over…</button><span style="margin-left:auto"></span><button type="button" class="iob-b iob-p">Continue at step 4 →</button></div>', { eyebrow: 'Investor onboarding' });
    const startOver = '<div class="iob-dlg"><div role="dialog" aria-modal="true" aria-labelledby="iobso"><h2 id="iobso">Start over?</h2><p style="margin:0;font-size:13px;line-height:1.55">Your saved answers for steps 1 to 3 are cleared and you begin at step 1. Your investor profile is not changed until you finish.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="iob-b">Cancel</button><button type="button" class="iob-b iob-p">Start over</button></div></div></div>';

    /* ---------- states ---------- */
    const STATES_HTML = () => '<div class="iob-st">'
      + vcard('Loading', 'Progress read', '<div class="iob-sk" style="width:60%"></div><div class="iob-sk"></div><div class="iob-sk" style="width:80%"></div><span class="raw" role="status">Reading your saved answers…</span>')
      + vcard('Saved answers unreadable', 'Unavailable · not a first visit', '<div class="iob-note iob-e"><span aria-hidden="true">!</span><div><b>We could not read your saved answers.</b> They may still be there. We have not restarted you at step 1.</div></div><div style="display:flex;gap:8px"><button type="button" class="iob-b iob-p iob-sm">Try again</button><button type="button" class="iob-b iob-sm">Start fresh…</button></div><span class="foot">Start fresh is a choice, with a confirm. Never automatic.</span>')
      + vcard('Save failed on a step', 'Step 4 · PUT progress failed', '<div class="iob-note iob-e"><span aria-hidden="true">!</span><div><b>Step 4 is not saved.</b> Your picks are still on screen.</div></div><div style="display:flex;gap:8px;align-items:center"><button type="button" class="iob-b iob-p iob-sm">Try again</button><button type="button" class="iob-b iob-sm" aria-disabled="true">Continue →</button></div><span class="foot">Continue stays off until the step saves. Too large (64 KB) or wrong flow are named, not retried.</span>')
      + vcard('Finish failed', 'Profile not saved', '<div class="iob-note iob-e"><span aria-hidden="true">!</span><div><b>Your profile was not saved.</b> All answers are kept. Onboarding is not marked complete.</div></div><button type="button" class="iob-b iob-p iob-sm">Try again</button><span class="foot">Never lands on Deals as if saved. ' + TAG('#6128 backend 3 · reorder + surface') + '</span>')
      + vcard('Refused', 'Wrong licence · 403', '<div>' + s('rf', 'Refused') + '</div><p style="margin:0">This wizard is for the investor licence. Your licence is <b>[Founder]</b>.</p><div style="display:flex;gap:8px"><a class="iob-b iob-p iob-sm" href="#">Change licence</a><a class="iob-b iob-sm" href="#">Ask an admin</a></div>')
      + vcard('Already completed', 'completed_at set', '<p style="margin:0">You finished on <span class="mo">[12 Oct]</span>.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="iob-b iob-p iob-sm" href="#">Go to deal flow</a><a class="iob-b iob-sm" href="#">Edit answers in Settings</a></div><span class="foot">Exploring member: Go to Exploring home instead of deal flow.</span>')
      + vcard('Not recorded', 'Optional values left blank', '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Target</dt><dd>' + s('nr', 'Not recorded') + '</dd><dt>Note</dt><dd>' + s('nr', 'Not recorded') + '</dd><dt>Excluded stages</dt><dd>' + s('no', 'None picked') + '</dd><dt>Thesis</dt><dd>' + s('sk', 'Skipped') + '</dd></dl><span class="foot">Written in words. Never 0 or a dash.</span>')
      + vcard('Application status unreadable', 'Ending A · 503', '<div class="iob-note iob-e"><span aria-hidden="true">!</span><div><b>Could not load your application status.</b></div></div><button type="button" class="iob-b iob-p iob-sm">Try again</button><span class="foot">The ending still shows. It never says “not applied” and offers no Apply until the status reads.</span>')
      + '</div>';

    /* ---------- phone ---------- */
    const phone = (bodyHtml, bar, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="iob-ph"><div class="iob-top"><span style="display:flex;gap:8px;align-items:center;font-weight:800"><span class="logo" aria-hidden="true"></span>Axal VC</span><span style="display:flex;gap:8px"><button type="button" class="ib" aria-label="Open Eadwyn" style="width:44px;height:44px">E</button><button type="button" class="ib" aria-label="Menu" style="width:44px;height:44px">☰</button></span></div><div class="iob-bdy">' + bodyHtml + '</div>' + (bar ? '<div class="iob-bar2">' + bar + '</div>' : '') + (o.sheet || '') + '</div></div>'; };
    const pprog = (n) => '<div class="iob-prog"><div class="iob-r"><b>' + (n === 'R' ? 'Review' : 'Step ' + n + ' of 7 · ' + STEPS[n - 1]) + '</b><span>' + (n === 'R' ? 100 : Math.round(n / 8 * 100)) + '%</span></div><div class="iob-bar"><i style="width:' + (n === 'R' ? 100 : Math.round(n / 8 * 100)) + '%"></i></div></div>';
    const pbar = (o) => { o = o || {}; return '<div class="iob-rw"><button type="button" class="iob-b iob-l">← Back</button>' + (o.skip ? '<button type="button" class="iob-b iob-q">Skip for now</button>' : '') + '<button type="button" class="iob-b iob-p" style="flex:1"' + (o.dis ? ' aria-disabled="true"' : '') + '>' + (o.cta || 'Continue →') + '</button></div>'; };
    const phSect = () => phone(pprog(4) + '<section class="iob-card"><h1>Sectors and regions</h1><div class="iob-in iob-plh">⌕ Search sectors</div><span class="iob-cnt" role="status">2 of ' + NSECT + ' picked</span><div class="iob-chips">' + J(NFX.slice(0, 16).map(t => chip(t, PICK.indexOf(t) >= 0 ? 'on' : ''))) + '</div><button type="button" class="iob-b iob-l iob-sm" style="align-self:flex-start">Show all ' + NSECT + ' ▾</button></section>', pbar());
    const phThesis = () => phone(pprog(6) + '<section class="iob-card"><h1>Your thesis</h1><div class="iob-in iob-plh iob-ta">A few sentences on what you look for…</div><span class="iob-cnt">0 / 2,000 characters</span></section>', null, { sheet: '<div class="iob-dlg" style="align-items:flex-end"><div class="iob-sheet" role="dialog" aria-modal="true" aria-labelledby="iobps" style="position:relative;width:100%"><span class="iob-grab" aria-hidden="true"></span><div style="display:flex;justify-content:space-between;align-items:center"><b id="iobps" style="font-size:15px">Eadwyn · draft from your answers</b>' + TAG('#6128') + '</div><p class="foot" style="margin:0">Uses only your answers from steps 1 to 5.</p><div class="iob-prop"><span class="iob-k">Proposal · not saved</span><p>' + DRAFT + '</p></div><div style="display:flex;gap:8px"><button type="button" class="iob-b iob-p" style="flex:1">Accept</button><button type="button" class="iob-b" style="flex:1">Edit</button><button type="button" class="iob-b" style="flex:1">Discard</button></div><p class="foot" style="margin:0">Nothing is saved until you continue.</p></div></div>' });
    const pr = (n, rows) => '<section class="iob-card" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">' + n + ' · ' + STEPS[n - 1] + '</b><button type="button" class="iob-b iob-sm" style="min-height:44px">Edit</button></div>' + J(rows.map(r => '<div style="display:flex;flex-direction:column;gap:2px;font-size:12.5px"><span class="iob-k">' + r[0] + '</span><span>' + r[1] + '</span></div>')) + '</section>';
    const phReview = () => phone(pprog('R') + pr(1, [['Type', 'Family office'], ['Entity details', s('sk', 'Skipped')]]) + pr(2, [['Accreditation', 'Non-US investor'], ['', YT]]) + pr(3, [['Check per deal', '<span class="mo">$50k–$250k</span>'], ['Stages', 'Seed, Series A']]) + pr(4, [['Sectors', 'FinTech, AI'], ['Regions', 'Europe']]), pbar({ cta: 'Finish' }));
    const phFail = () => phone(pprog(4) + '<div class="iob-note iob-e" role="alert"><span aria-hidden="true">!</span><div><b>Step 4 is not saved.</b> Your picks are still here. Check your connection and try again.</div></div><section class="iob-card"><h1>Sectors and regions</h1><span class="iob-cnt">2 of ' + NSECT + ' picked</span><div class="iob-chips">' + J(NFX.slice(0, 12).map(t => chip(t, PICK.indexOf(t) >= 0 ? 'on' : ''))) + '</div><span class="iob-k">Regions</span><div class="iob-chips">' + J(GEOS.map(t => chip(t, t === 'Europe' ? 'on' : ''))) + '</div></section>', '<div class="iob-rw"><button type="button" class="iob-b iob-l">← Back</button><button type="button" class="iob-b iob-p" style="flex:1">Try again</button></div><span class="foot" style="text-align:center">Continue comes back once step 4 saves</span>');

    /* ---------- docs ---------- */
    const FLOWS = [
      ['1', 'Who you are', 1, ['investor_type', 'firm_name', 'Entity details (optional, Skip) → corporate_profiles'], 'Seats, cohorts, Trust entity, sanctions screening'],
      ['2', 'Accreditation', 1, ['accreditation_status (You told us)', 'country'], 'No reader yet'],
      ['3', 'Check size and stages', 1, ['ticket_band → ticket_min/max_usd', 'stages_json'], 'Thesis fit, round calls, checklist, event picks'],
      ['4', 'Sectors and regions', 1, ['sectors_json ◇', 'geos_json'], 'Thesis fit, round calls, event picks, Investor Signals'],
      ['5', 'Exclusions', 0, ['anti_thesis_sectors_json ◇', 'anti_thesis_stages_json'], 'Thesis fit, round calls'],
      ['6', 'Thesis', 0, ['thesis_text', 'contribute_to_signals', 'Eadwyn draft ◇'], 'Checklist, thesis cloud, Investor Signals'],
      ['7', 'Fund interest', 0, ['lp_intent', 'lp_target_usd', 'notes'], 'Checklist; prefills the fund application']
    ];
    const DOCS = {
      IOB00: () => '<div class="cv iob-doc" style="' + VARS + ';width:1200px"><div><span class="iob-k">IO-0 · Flow map · /onboarding/investor</span><h1>Seven steps and a review. Steps 1 to 4 are required.</h1><p class="foot" style="font-size:13px;margin-top:4px">Each step names what it stores and who reads it. Dashed boxes are optional and show Skip for now. Entity details is an optional block inside step 1.</p></div>'
        + '<div class="iob-flow">' + J(FLOWS.map(f => '<div class="iob-fs' + (f[2] ? '' : ' iob-opt') + '"><span class="iob-n">STEP ' + f[0] + ' · ' + (f[2] ? 'REQUIRED' : 'OPTIONAL') + '</span><b>' + f[1] + '</b><ul>' + J(f[3].map(x => '<li>' + x + '</li>')) + '</ul><span class="iob-k" style="margin-top:auto">Read by</span><span>' + f[4] + '</span></div>')) + '<div class="iob-fs iob-rvb"><span class="iob-n">REVIEW</span><b>Check your answers</b><ul><li>Every answer by step</li><li>Edit → step → back</li><li>Skipped / Not recorded in words</li></ul><span class="iob-k" style="margin-top:auto">Action</span><span>Finish</span></div></div>'
        + '<div><h2>Order at Finish</h2><p class="foot" style="margin:4px 0 10px">Today the order is reversed and the profile save’s failure is discarded (OnboardingWizard → onFinish → <span class="iob-code">catch {}</span>). ' + TAG('#6128 backend 3') + '</p><div class="iob-ord"><div><b>1 · Save profile</b><span class="iob-code">PUT /api/investor-profile/me</span><span class="foot">Failure: stay on Review, answers kept (IO-8)</span></div><span>→</span><div><b>2 · Mark onboarding complete</b><span class="iob-code">POST /api/onboarding/complete</span><span class="foot">Only after step 1 succeeds</span></div><span>→</span><div><b>3 · Ending (IO-6)</b><span class="foot">A · Fund interest = Yes → application</span><span class="foot">B · every other investor → next steps</span><span class="foot">C · exploring member → /exploring</span></div></div></div>'
        + '<div class="iob-g2"><div class="iob-sc"><span class="iob-k">Removed</span><h3>“What matters most” sliders</h3><p style="margin:0">Five sliders wrote <span class="iob-code">value_weights_json</span>. Nothing reads it since the matching engine was removed (D378). The step is dropped and the field is no longer written. ' + FLAG('Q1 · option A') + '</p></div><div class="iob-sc"><span class="iob-k">Annotation key</span><div class="iob-legend">' + TAG('backend work, named issue') + FLAG('owner decision') + '</div><div class="iob-legend">' + s('v', 'Value') + s('no', 'None') + s('nr', 'Not recorded') + s('na', 'Not applicable') + s('sk', 'Skipped') + s('un', 'Unavailable') + s('rf', 'Refused') + s('yt', 'You told us · not verified') + '</div><span class="foot">Tags are annotations for the build, never product copy.</span></div></div></div>',
      IOB11: () => '<div class="cv iob-doc" style="' + VARS + ';width:1200px"><div><span class="iob-k">IO-11 · Handoff</span><h1>Stored fields, readers, reused components and the work left</h1><p class="foot" style="font-size:13px;margin-top:4px">Checked on main 6d7712c6d1 (Sat 14 Nov 2026). Brief written against 45e7c55fa6; the files it names are unchanged in substance.</p></div>'
        + '<table class="iob-tbl"><thead><tr><th>Field on screen</th><th>Stored in</th><th>Read by</th><th>Board</th></tr></thead><tbody>' + J([
          ['Investor type · firm name', 'investor_profiles.investor_type, .firm_name', 'investor seats, cohorts', 'IO-1'],
          ['Entity details (optional)', 'corporate_profiles.entity_name, .entity_type, .registration_number, .registered_country, .signing_authority_name, .signing_authority_title', 'Trust Entity tab, sanctions screening (trust.ts)', 'IO-1'],
          ['Accreditation · country', 'investor_profiles.accreditation_status, .country', 'no reader; labelled You told us', 'IO-2A'],
          ['Check per deal · stages', 'investor_profiles.ticket_band → .ticket_min_usd, .ticket_max_usd · .stages_json', 'thesisFit.ts, roundCalls.ts, onboarding checklist, event picks', 'IO-2B'],
          ['Sectors · regions', 'investor_profiles.sectors_json ◇ · .geos_json', 'thesisFit, roundCalls, capRelReads, event picks, Investor Signals', 'IO-2C'],
          ['Exclusions', 'investor_profiles.anti_thesis_sectors_json ◇, .anti_thesis_stages_json', 'thesisFit, roundCalls', 'IO-2D'],
          ['Thesis · Signals switch', 'investor_profiles.thesis_text (2,000) → .thesis_keywords_json · .contribute_to_signals', 'checklist, vectorize, thesis cloud, Investor Signals (k≥5)', 'IO-3'],
          ['Fund interest · target · note', 'investor_profiles.lp_intent, .lp_target_usd, .notes', 'checklist (target); prefill of the application', 'IO-4, IO-6A'],
          ['Progress · finished', 'onboarding_progress.step, .total_steps, .data (64 KB), .completed_at', 'resume gate (App.jsx), this wizard', 'IO-7, IO-8'],
          ['Application status', 'lp_applications.status', 'ending A', 'IO-6A'],
          ['Identity · Trust', 'users.kyc_status · legal_obligations.status, .required', 'endings B and C', 'IO-6']
        ].map(r => '<tr><td>' + r[0] + '</td><td><code>' + r[1] + '</code></td><td>' + r[2] + '</td><td class="mo">' + r[3] + '</td></tr>')) + '</tbody></table>'
        + '<div class="iob-g2"><div class="iob-sc"><span class="iob-k">Requires engineering ◇</span><p style="margin:0"><b>1 · Sectors kept as picked.</b> <span class="iob-code">PUT /investor-profile/me</span> filters to the 11 <span class="iob-code">SECTOR_OPTIONS</span> in investor_signals.ts; only Robotics is in both lists. Accept the 82 NFX sectors (and for exclusions), so <span class="iob-code">completed_at</span> can be set. ' + FLAG('Q2 · A') + '</p><p style="margin:0"><b>2 · Eadwyn thesis draft.</b> No endpoint drafts from the answers; <span class="iob-code">investor.profile.thesis</span> is gated to Investor Pro. ' + FLAG('Q4 · A, free') + '</p><p style="margin:0"><b>3 · Finish order.</b> Frontend: save profile, then complete, then ending; surface the error; Review reads back the saved row.</p><p style="margin:0"><b>4 · Application prefill.</b> Map investor_type (Angel → individual, Family office → family_office, Institutional LP → institution, Fund GP → other). Never prefill <span class="iob-code">accredited</span>; flag a target outside $50k–$2M. ' + FLAG('Q3 · A') + ' ' + FLAG('Q5 · A') + '</p></div>'
        + '<div class="iob-sc"><span class="iob-k">Reused · frontend only</span><p style="margin:0">OnboardingCanvas, OnboardingWizard (Step n of N, Back, Skip for now, Continue), ChoiceField, MultiChoiceField, SelectField, TextField, TextArea. New in the frontend: type cards, the entity block, sector search with a count, “In your thesis” disabled chips, Review with Edit-and-return, the three endings, the unreadable-progress and finish-failed states, the phone bar.</p><span class="iob-k">Accessibility</span><p style="margin:0">Radio and checkbox semantics on cards and chips (aria-checked / aria-pressed); disabled chips keep their reason as text; progressbar with a value; the pick count is a live status; errors use role=alert and keep focus on the failing step; 44px targets on phone; states always carry a word and a glyph.</p><span class="iob-k">Routes</span><p style="margin:0">No new route. /kyc, /deals and the fund application are never linked for an exploring member.</p></div></div></div>'
    };

    /* ---------- boards ---------- */
    let html;
    if (B === 'IOB01') html = page(step1(), { h: 1080 });
    else if (B === 'IOB02A') html = page(step2(), { h: 900 });
    else if (B === 'IOB02B') html = page(step3(), { h: 900 });
    else if (B === 'IOB02C') html = page(step4(), { h: 1020 });
    else if (B === 'IOB02D') html = page(step5(), { h: 1020 });
    else if (B === 'IOB03' || B === 'IOB10A') html = page(step6(), { h: 900, rail: 1 });
    else if (B === 'IOB04') html = page(step7(), { h: 900 });
    else if (B === 'IOB05' || B === 'IOB10B') html = page(reviewCard(), { h: 1860 });
    else if (B === 'IOB06A') html = page(endA(), { h: 900 });
    else if (B === 'IOB06B') html = page(endB(), { h: 900 });
    else if (B === 'IOB06C') html = page(endC(), { h: 900, exploring: 1 });
    else if (B === 'IOB06V') html = crop(endVar(), 1400);
    else if (B === 'IOB07A') html = page(welcome(), { h: 1000 });
    else if (B === 'IOB07B') html = page(resume(), { h: 900 });
    else if (B === 'IOB07C') html = crop('<div style="position:relative;height:300px;border-radius:12px;overflow:hidden">' + startOver + '</div>', 600);
    else if (B === 'IOB08') html = crop(STATES_HTML(), 1400);
    else if (B === 'IOB09A') html = phSect();
    else if (B === 'IOB09B') html = phThesis();
    else if (B === 'IOB09C') html = phReview();
    else if (B === 'IOB09D') html = phFail();
    else if (B === 'IOB00') html = DOCS.IOB00();
    else if (B === 'IOB11') html = DOCS.IOB11();
    else html = page(step1(), { h: 1080 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
