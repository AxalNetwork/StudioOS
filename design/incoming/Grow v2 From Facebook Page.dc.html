    else if (B === 'GFB5S') html = mStates();
    else if (B === 'GFB6') html = page(distPage(distPart({ mark: 0 })), { h: 1180, cur: 'Distribution' });
    else if (B === 'GFB6R') html = page(rtPage(rtPart({ mark: 0 })), { h: 1500, cur: 'Revenue and traction' });
    else if (B === 'GFB6P') html = phone('Distribution', mDist());
    else if (B === 'GFBH') html = handoff();
    else html = page(distPage(distPart({ mark: 1 })), { h: 1180, cur: 'Distribution' });
    return { html: { __html: html } };
  }
}
