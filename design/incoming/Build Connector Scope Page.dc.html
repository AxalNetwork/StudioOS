    const mE = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="me" style="max-height:720px"><div class="grab" aria-hidden="true"></div><div style="padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px"><span class="eye">Scope</span><h2 id="me" style="font-size:18px;font-weight:800;margin:0">What do you want to stop?</h2><label class="bls-opt on"><input type="radio" name="md" checked><span><b>Stop using GitHub for ' + CO + '</b><small>' + V + ' stops getting new items. GitHub keeps serving ' + CO2 + '.</small></span></label><label class="bls-opt"><input type="radio" name="md"><span><b>Disconnect GitHub from your account</b><small>Ends it for ' + CO + ' and ' + CO2 + '.</small></span></label><p class="raw" style="margin:0">Items already in Build stay either way.</p><button type="button" class="btn p" style="min-height:48px">Review</button><button type="button" class="btn" style="min-height:44px">Cancel</button></div></div>';
    const mF = '<h2 class="bls-mh">GitHub for ' + V + '</h2>' + mLad('unbound').replace('Connected to your account since Tue 3 Nov 2026. Account-level: it can serve any company you belong to.', 'Connected to your account.').replace(GH, '[noah-brandt]') + '<div class="bls-own"><span class="eye">Who can fix this</span><b>' + MR + ', the venture’s owner</b><span>Only she (or an Axal admin) can link ' + V + ' to a company.</span><button type="button" class="btn" style="min-height:44px">Copy link to this setup</button></div>';

    /* ---------- BLS00 today on main ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const today = () => dk('<h1>Today on main · why the walkthrough saw a contradiction</h1><p>Authenticated walkthrough, 26 Nov 2026, founder preview with Super Admin authority: Overview said the project had no company scope for connectors; Connect a tool repeated that connected tools could not feed it, then listed GitHub as Connected, “Feeds” several Build modules, with Disconnect enabled. Confirmed against <code>main</code> 7553cd37b9. Nothing in this table is a guess.</p>'
      + tbl(['Surface', 'What main draws', 'Where', 'Why it misleads'], [
        ['Overview · Operating systems card', '“This project has no company scope for connectors.” (Not recorded)', '<code>routes/cycle_build.ts</code> operating(), lines 1331, 1353–1356', 'Internal words (“scope”, “connectors”); no repair, no owner named.'],
        ['Connect a tool · banner', '“This project has no company, so connected tools cannot feed it.”', '<code>connectorsModel.js</code> companyBanner(), state <code>none</code>', 'True, but the row below contradicts it.'],
        ['Connect a tool · GitHub row', '“Connected” pill, “Feeds Product roadmap, Prototype / MVP, … · synced …”, Disconnect', '<code>toolRow()</code> uses <code>feedsLabel(p)</code>, the registry’s static list; <code>servesCompany</code> is skipped when there is no company', 'Says what GitHub can feed in general, not what feeds this venture.'],
        ['Connect a tool · Disconnect confirm', '“Data already in StudioOS stays. The stored credentials are deleted.”', '<code>disconnectNote()</code>; <code>DELETE /api/integrations/:uid</code> deletes every <code>integration_companies</code> row', 'Does not say it ends GitHub for every company the account connection serves.'],
        ['Operating systems', '“Company not linked yet” · Go to Company Creation', '<code>OperatingSystemsHome.jsx</code> CompanyNotLinked', 'Sends a founder with a company elsewhere to incorporate again; the fix is a link.']])
      + '<h2>The three scopes main already records</h2>' + tbl(['Scope', 'Record', 'Who changes it'], [
        ['Account', '<code>integrations</code> row (user_id, status, last_synced_at, config_json)', 'The member who connected it: connect, reconnect, <code>DELETE /api/integrations/:uid</code>.'],
        ['Company', '<code>integration_companies</code> (integration_id, company_id, enabled); <code>PUT /api/integrations/:uid/companies</code> replaces the set', 'The connection’s owner, for companies they belong to (<code>company_not_linked</code> 403 otherwise). Build shows “Use for {company}”.'],
        ['Project', '<code>projects.company_id</code>, written only by <code>POST /api/projects/:id/move</code> (services/projectMove.ts); GitHub’s <code>config_json.project_id</code> + <code>repositories</code> via <code>PUT /:uid/repositories</code>', 'Move: the venture’s owner or an Axal admin; the owner must belong to the company. Repositories: the connection’s owner, and only for a project whose company the connection serves (<code>project_not_enabled</code>).']])
      + '<h2>Other findings</h2><ul><li>A GitHub sync refuses with <code>github_no_repositories</code> or <code>github_project_not_enabled</code>: no repository, or the project’s company is off, are both real, distinct states.</li><li>One GitHub connection feeds one project at a time (<code>config_json.project_id</code>).</li><li>The sync log (<code>integration_logs</code>) records time, state, repositories and arrivals, not the project: a per-venture “last successful read” needs the project on that row (◇ #8774).</li><li>The move dialog exists only in Account › Companies › venture (<code>MoveVentureDialog</code>), with no way back to Build.</li></ul>');

    /* ---------- BLS12 handoff ---------- */
    const handoff = () => dk('<h1>Handoff · Project and company connector scope (#8774)</h1><p>Checked against <code>main</code> 7553cd37b9 on Thu 26 Nov 2026. Extends Build v2 (D4846) and D686 §5.4 (#1597): the Connect a tool lightbox, BD12’s Tools rows and BD20’s Company not linked yet. Shell, state words and the Eadwyn rail are Build v2’s.</p>'
      + '<h2>Acceptance → boards</h2>' + tbl(['Acceptance item', 'Answered on'], [
        ['Label account, company and project scope separately', 'The three-row ladder: BLS01, BLS03, BLS04, BLS05, BLS06, phone BLS11 A, D, F'],
        ['Say a module receives data only when the binding is effective', 'Feeds list: Not feeding (BLS01), After sync (BLS03), counts (BLS04), Stale (BLS05); GitHub row “feeds nothing in [Atlas Orchard] until…”'],
        ['Distinguish no scope, no repo, stale read, no items', 'Not linked · None chosen · Stale with age · No items (measured 0): BLS08 B, BLS10, BLS04 (Company creation No items)'],
        ['Permitted owner: link the project and return to setup', 'BLS01 → BLS02 (step 2, then back) → BLS02 B → BLS03; phone BLS11 A → B → C'],
        ['Other users: name the owner action', 'BLS06 A (co-founder: “Only [Maya Ruiz]…”), phone BLS11 F; refused member BLS10'],
        ['Consequence and scope of disconnecting an account-level tool', 'BLS07 Scope → Review → Result, BLS07 B account-wide review, phone BLS11 E'],
        ['Date and source of the last successful project read', 'BLS04, BLS05, BLS09 A, phone BLS11 D'],
        ['Test unbound / bound-no-repo / healthy / failing / read-only across Overview, Connect a tool, Operating systems', 'BLS08 B matrix; full pages BLS08 A, BLS01, BLS03, BLS04, BLS05, BLS06 B, BLS09 A, B']])
      + '<h2>Frontend only (main has the route)</h2><ul><li>Ladder from <code>GET /projects/:id</code> (company_id), <code>useConnectors({ companyId })</code> (connection, <code>company_ids</code>), <code>GET /:uid/repositories</code> (selected, project_id).</li><li>GitHub row: when <code>projectCompany().state</code> is <code>none</code> or <code>servesCompany</code> is false, say “feeds nothing in {venture}” and drop “Feeds …”.</li><li>Link dialog inside Build calling <code>companyActionsApi.moveProject</code>; on success reopen <code>/build/connect?project_id=…&amp;tool=github</code>. The owner is read from <code>GET /projects/:id/members</code>.</li><li>Use for {company} (exists), then the existing GitHub sync view with the feeds-after-sync list from <code>githubFeeds.ts</code> words.</li><li>Scoped stop: <code>PUT /:uid/companies</code> without the project’s company. Account-wide: existing DELETE with the new review naming every company in <code>company_ids</code>.</li><li>Operating systems: CompanyNotLinked’s action becomes Link to a company for an owner with a company; Go to Company Creation stays when the owner has none.</li></ul>'
      + '<h2>Backend required (◇ #8774)</h2>' + tbl(['Item', 'Boards'], [
        ['Record the project on each sync log row (or return the last ok sync per project), for “Last successful read of [venture]”', 'BLS04, BLS05, BLS09'],
        ['Reasons on the Overview and Operating systems reads that tell no company / company off / no repository / stale / failing apart, in founder words (today one sentence: “This project has no company scope for connectors.”)', 'BLS08, BLS09'],
        ['Stopping a company clears the connection’s <code>project_id</code> and repositories when that project’s company is removed, so later syncs do not fail with <code>github_project_not_enabled</code>', 'BLS07'],
        ['Stale as a field on the read (age of the last good read), per the ⚑ Q3 rule', 'BLS05, BLS08']])
      + '<h2>Pending the owner (⚑, drawn at A)</h2>' + tbl(['Question', 'A (drawn)', 'B'], [
        ['Q1 · Disconnect from Build', 'Build’s first choice is “Stop using for {company}”; account-wide disconnect is the second option with its own review', 'Build offers only the scoped stop; account disconnect lives in Account › Connectors'],
        ['Q2 · A co-founder who cannot link', 'Name the owner and copy a link to this setup', 'An in-app request to the owner (needs a notification route)'],
        ['Q3 · When a read is Stale', 'Immediately when the latest sync failed, else after 24 hours without a good read', 'Only after a failure']])
      + '<h2>Headings and focus order</h2>' + tbl(['Board', 'Order'], [
        ['Lightbox (BLS01, 03–06)', 'h2 “Connect a tool” → h3 “GitHub for {venture}”. Focus: Close → ladder (read as a list, each row one stop) → the one primary action → Search → filters → rows. Escape steps back from a panel, closes from the list (D686).'],
        ['Link dialog (BLS02)', 'h2 “Link {venture} to a company”. Focus: first company radio (arrow keys move) → Cancel → Link. Return focus to the ladder’s step 2 row, announced “Linked to {company}”.'],
        ['Disconnect (BLS07)', 'Scope radios → Review; Review’s destructive button is never focused first; Result is a polite status.'],
        ['Phone', '44px targets; bottom sheets trap focus; the step number is in the eyebrow and in the sheet’s accessible name.']])
      + '<h2>Accessibility</h2><p>Every state has a word and a glyph: Not linked ○ dashed, None chosen –, Stale ◷ with an age, No items 0, Failing ✕, Could not be read !, Refused ⊘, Read only 🔒︎. Colour never carries it alone. Dates are written out in Roboto Mono with UTC.</p>'
      + '<p>' + V + ', ' + CO + ', ' + CO2 + ', ' + MR + ', ' + NB + ', ' + IC + ', the GitHub logins, repositories, counts and dates are fictional sample data.</p>');

    /* ---------- route ---------- */
    let html = '';
    const dimOv = (st, overlay, h) => page(overview(st), { h: h || 1000, overlay });
    if (B === 'BLS00') html = today();
    else if (B === 'BLS01') html = dimOv('unbound', lbUnbound, 1160);
    else if (B === 'BLS02') html = dimOv('unbound', '<div class="dim1" style="opacity:.6"></div>' + linkDlg(), 1000);
    else if (B === 'BLS02B') html = crop('<span class="eye">Step 2 done · back in Connect a tool with step 3 next</span><div role="status">' + nt('g', '✓', V + ' is linked to ' + CO, 'Step 3: turn your GitHub on for ' + CO + ', then choose repositories.') + '</div>' + scopeCard('linked', '<div class="bls-fix"><div><b>Use GitHub for ' + CO + '</b><span>Adds ' + CO + ' to the companies your GitHub serves. ' + CO2 + ' keeps it.</span></div><button type="button" class="btn p">Use for ' + CO + '</button></div>'), 760);
    else if (B === 'BLS03') html = dimOv('norepo', lb(scopeCard('norepo') + repoView(), { top: 28, title: 'Connect GitHub', eye: 'Build · step 3 of 3', sub: 'Choose what StudioOS reads. You can change this later.', foot: '<span class="raw">Reads issues, pull requests and releases only.</span><span style="display:flex;gap:8px"><button type="button" class="btn">Back</button><button type="button" class="btn p">Sync selected</button></span>' }), 1180);
    else if (B === 'BLS04') html = dimOv('healthy', lb('<div role="status">' + nt('g', '✓', 'GitHub is synced for ' + V, 'Synced 14 issues and 6 pull requests. Product roadmap and Prototype / MVP now show them.') + '</div>' + scopeCard('healthy', '', { right: '<button type="button" class="btn bsm">Stop or disconnect…</button>' }) + lastRead('healthy') + '<div class="bls-after"><span class="eye">Feeds ' + V + ' now</span>' + feedList('healthy') + '</div>', { top: 28, foot: '<span></span><button type="button" class="btn p">Done</button>' }), 1160);
    else if (B === 'BLS05') html = dimOv('failing', lb(scopeCard('failing', '<div class="bls-fix"><div><b>Reconnect GitHub</b><span>Sign-in expired. Reconnecting keeps ' + CO + ' and your repositories.</span></div><button type="button" class="btn p">Reconnect</button></div>') + lastRead('failing') + '<div class="bls-after"><span class="eye">What ' + V + ' shows meanwhile</span>' + feedList('failing') + '</div>', { top: 28 }), 1160);
    else if (B === 'BLS06') html = page(overview('unbound'), { h: 1100, av: 'NB', overlay: lbCofounder });
    else if (B === 'BLS06B') html = page(osHead() + osTools('ro') + osSync('ro') + '<p class="raw">' + NB + ' is a co-founder, not the connection’s owner: he reads the ladder and the feeds, not the repository names; no Reconnect, Choose or Disconnect is offered. An advisor reads the same, with Read only on the page header. ' + tg('Read only') + '</p>', { h: 1000, cur: 'Operating systems', av: 'NB' });
    else if (B === 'BLS07') html = crop('<span class="eye">Stop or disconnect · Scope → Review → Result · from GitHub’s details in Connect a tool</span>' + disc(), 1400);
    else if (B === 'BLS07B') html = crop(discAcct(), 620);
    else if (B === 'BLS08') html = page(overview('unbound'), { h: 1000 });
    else if (B === 'BLS08B') html = matrix();
    else if (B === 'BLS09') html = page(osHead() + osTools('healthy') + osSync('healthy'), { h: 1000, cur: 'Operating systems' });
    else if (B === 'BLS09B') html = crop('<span class="eye">Operating systems › Tools · the Code system in each state</span><ul class="bls-code">' + J(['unbound', 'norepo', 'healthy', 'failing', 'ro'].map(s => '<li class="grp">' + ({ unbound: 'Account connected, venture not in a company', norepo: 'Bound, no repository', healthy: 'Healthy', failing: 'Failing, stale read', ro: 'Read only · seen by ' + NB })[s] + '</li>' + (s === 'unbound' ? '<li><b>Code</b><span>GitHub<small>—</small></span>' + tg('Not linked', 'Company not linked yet') + '<span class="raw">No row is listed: the section shows one prerequisite, Link to a company</span><a class="btn bsm" href="#">Link to a company</a></li>' : codeRow(s)))) + '</ul>', 1400);
    else if (B === 'BLS10') html = statesGrid();
    else if (B === 'BLS11A') html = phone('Connect a tool', mA);
    else if (B === 'BLS11B') html = phone('Connect a tool', mA, '<div class="dim2"></div>' + mB);
    else if (B === 'BLS11C') html = phone('Connect GitHub', mC);
    else if (B === 'BLS11D') html = phone('Connect a tool', mD);
    else if (B === 'BLS11E') html = phone('GitHub', mD, '<div class="dim2"></div>' + mE);
    else if (B === 'BLS11F') html = phone('Connect a tool', mF);
    else if (B === 'BLS12') html = handoff();
    else html = dimOv('unbound', lbUnbound, 1160);
    return { html: { __html: html } };
  }
}
