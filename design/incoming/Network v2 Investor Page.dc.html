    else if (B === 'NWIH') html = `<div class="${CV} doc"><div><span class="eye">Network v2 addendum · investor · #6256 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (6d7712c6d1)</h3><ul>
      <li><code>routes/partnernet.ts</code>: ties (<code>GET /relationships</code>, accepted rows), requests and <code>/respond</code>, <code>PATCH /relationships/:id</code> (private note), touches with <code>/void</code>, reminders (<code>?all=1</code>), the hand-added book (<code>/book</code>). No support-session guard anywhere in the file.</li>
      <li><code>lib/networkBook.js</code>: <code>COLD_AFTER_DAYS = 60</code>, strict <code>&gt;</code>; no recorded touch is unknown, not cold.</li>
      <li><code>routes/introductions.ts</code>: <code>/quota</code> and <code>/request</code> are investor-only (403 <code>investor_only</code>, 402 <code>quota_intros_exhausted</code>); message sliced to 2,000; target by <code>founder_user_id</code>, <code>founder_id</code> or <code>project_id</code>; propositions <code>LIMIT 200</code>; accept 402 <code>no_credits</code>; decline free.</li>
      <li><code>routes/relationships.ts</code>: who-knows, intro requests (decide, withdraw, outcome, follow-up), <code>/delivery/reconcile</code>, three Eadwyn drafts; every route refuses support sessions (403 <code>support_session_refused</code>).</li>
      <li><code>routes/contact_imports.ts</code>: LinkedIn CSV with preview, duplicate reviews with merge/keep/dismiss, imported book notes and tasks; writes 403 <code>support_session</code>.</li>
      <li><code>routes/contacts.ts</code>: <code>GET /</code> leads and <code>POST /invite</code> are the founder Leads surface.</li>
      <li><code>pages/investor/InvestorNetworkWorkspace.jsx</code> and <code>shellConfig.js</code> (<code>NETWORK_ZONES</code>, the investor sidebar).</li></ul>
      <h3 style="margin-top:12px">Preserved from the approved canvas</h3><ul><li>Header “Your network”, one primary and Ask beside it; the four links; the Person Sheet (now Tie Sheet); NW5 state words; NW3.2/NW3.4 lifecycle.</li><li>Numbering: the ids #4799 reserved (NW1.1, NW2.2, NW2.3, NW3, NW3.1, NW3.3, NW3.5, NW4, NW4.1, NW6, NW7, NW8.1, NW9, NW11), then NW12 onward. Board keys carry the NWI prefix (NWI12_2 = NW12.2).</li></ul></div>
      <div><h3>Backend required (◇)</h3><ul><li>Portfolio, Passed and LPs views: nothing links a tie to <code>investor_portfolio_holdings</code> or a passed deal; no LP store.</li><li>An organization record (only derived names exist).</li><li>A structured deal or fund link on a tie.</li><li>The target’s name on an investor ask (#6260).</li><li>Any ask status after Pending (#6261).</li><li>An Eadwyn draft for an ask message, and a follow-up draft for a tie.</li><li>Merge when the held record is not an imported contact.</li><li>Invite to Axal for investors.</li><li>Refusing support-session writes on <code>/api/partnernet/*</code>.</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑)</h3><ul><li>Q1 A: one Relationships page, two labelled groups, two counts.</li><li>Q2 A: Add person writes the partner book.</li><li>Q3 A: Your asks shows Pending only.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>The investor Overview, Relationships groups, Tie Sheet, Introductions groups, Organizations views, request sheet with the ask branch, NW6/NW7 states, phone, tablet and dark, all over existing routes.</li></ul>
      <h3 style="margin-top:12px">Accessibility</h3><ul><li>Going cold, due, refused and could-not-be-read each pair a word with a glyph; colour never carries meaning alone.</li><li>Sheets are modal dialogs with a labelled heading; the stepper sets <code>aria-current="step"</code>; disabled actions keep a visible reason.</li><li>Phone targets 44px, sticky primary, tables become cards.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Dropped from the old LP canvas I7: the standalone Eadwyn card, Support given rows and co-investor suggestions for a live deal.</li><li>The ◇ items without an issue number are tagged #6256.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
