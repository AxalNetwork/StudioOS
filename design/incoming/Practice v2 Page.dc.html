      + '<h2>Accessibility</h2><p>Practice sections are links with aria-current; filters are radio groups. Sheets are dialogs with focus containment, Escape and return focus. Icon buttons are named (“More: cancel or mark no-show for Acme”). Status always has a word and a shape. Save and send results are announced. Tables become stacked records under 768px. Touch targets 44px; primary actions 48px.</p><h2>Eadwyn</h2><p>Collapsed “Ask Eadwyn” spine by default; expanded rail leads with practice prompts; model selection, token and guard pricing, usage, held usage, top-up and add-tokens move under “AI settings / usage”.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'PX00') html = page(overview(), { h: 1150, cur: 'Overview' });
    else if (B === 'PX00b') html = page(overview({ failed: true }), { h: 1150, cur: 'Overview', rail: true });
    else if (B === 'PX01') html = page(firstUse(), { h: 820, cur: 'Overview' });
    else if (B === 'PX02') html = page(opps(), { h: 1100, cur: 'Opportunities' });
    else if (B === 'PX02b') html = oppsEmpty();
    else if (B === 'PX03') html = page(engagements(), { h: 900, cur: 'Engagements' });

    else if (B === 'PX03d') html = page(engagements(), { h: 900, cur: 'Engagements', overlay: agreementTab() });

    else if (B === 'PX05b') html = availLoading();

    else if (B === 'PX06c') html = addVersion();

    else if (B === 'PX07') html = page(earnings(), { h: 1050, cur: 'Earnings' });
    else if (B === 'PX07b') html = unsaved();
    else if (B === 'PX08') html = states();

    else if (B === 'PX12') html = inventory();

    else if (MOB[B]) html = MOB[B]();

    return { html: { __html: html } };
