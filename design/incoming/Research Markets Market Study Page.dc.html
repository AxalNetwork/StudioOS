    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const T = 'recorded today';
    const DOCS = {
      RST00: () => dk('<h1>RST-00 · What the market study answers, its seven sections, and where each value is read</h1><p>Pass 2 of #7703. Continues Research v2 (D3701): the project workspace RS-02, the reviewed brief RS-09 and the context rail RS-07 A and RS-10 D. A study adds one tab, Study, to the five that are built (⚑ Q1, option A). Checked against main <code>58ee9d1b73</code>. Sample people, companies, sources and figures are fictional. ◇ marks backend work with the issue that builds it; ⚑ marks an owner question, drawn as option A.</p>'

        + '<h2>The seven sections</h2><p>Scope and questions · Customers and demand · Size and scenarios · Competition and pricing · Entry strategy and risks · Evidence and findings · Report and monitoring. Addresses <code>/research/projects/:uid/study</code> and <code>/research/projects/:uid/study/:section</code> (new address, owner decision, Q1). Size, Competition and Report read “Not built yet” until pass 3 ships.</p>'
        + '<h2>Every value and where it is read</h2>' + tbl(['Value', 'Read from', 'Status'], [
          ['Project title, status, saved date, source count', '<code>GET /api/research/projects/:uid</code> · <code>research_projects</code>', T],
          ['Question, objective, scope, exclusions (edited on Overview)', 'same · <code>research_projects.question</code>, <code>.objective</code>, <code>.scope</code>, <code>.exclusions</code>', T],
          ['Sources answerable in Ask (n of m)', 'same, <code>evidence[].in_ask</code>', T],
          ['Findings by kind with citations', '<code>GET /api/research/projects/:uid/findings</code>', T],
          ['New research form', '<code>/research/projects?new=1&amp;question=</code>, <code>POST /api/research/projects</code>', T],
          ['Market, tracked sector, Markets filters', '<code>GET /api/research/markets</code>; filters live in the address only', T + ' (filters stored nowhere)'],
          ['Study: product, boundary, model, decision to be made, horizon, venture, origin; segments', '<code>GET</code>/<code>PUT /api/research/projects/:uid/study</code>, <code>POST …/with-study</code>', ENG(7719)],
          ['Questions, evidence links, counts, decisions', '<code>research_study_questions</code>, <code>_links</code>, <code>_decisions</code>', ENG(7720) + ' (a link naming a reference: ' + ENG(7721) + ')'],
          ['Completeness by topic', '<code>GET …/study/completeness</code>', ENG(7726)],
          ['Attached references and the five kinds of figure', '<code>/api/research/projects/:uid/study/refs</code>', ENG(7721) + ' with ' + ENG(7716)],
          ['Observation search and fields', '<code>GET /api/research/observations</code>', ENG(7716) + '; enterprise counts ' + ENG(7717) + '; published date ' + ENG(7709)],
          ['Interviews, problems, hypotheses, experiments, demand records, channels, readiness, payback', 'study reads of Validate and Grow tables (the study never calls their routes)', ENG(7722)],
          ['Progress bar on a My Research card', 'none: the list read returns no question count', ENG('no issue') + ' ' + FL('Q7')],
          ['Unpaid trial, repeat use per segment', 'no store', 'Not recorded, with the reason']])),
      RST16: () => dk('<h1>RST-16 · Main task path · clickable</h1><p>One founder, ' + FOUNDER + ' of ' + VEN + ', from a market to a recorded decision. Each step opens the frame named on the right; in the canvas the frame label is the link. Focus lands on the heading of each new view.</p><div style="border:1px solid #ececf1;border-radius:12px;background:#fff">' + J([
          ['Start from a market', 'Markets › ' + MKT + ' › New market research. The form carries “Started from”.', 'RST02', 'RST-02 · /research/projects?new=1'],
          ['Define the scope and one segment', 'Save scope with ' + SEGS[0].n + ' as beachhead; accept “Use [Germany] as customer geography?”.', 'RST03', 'RST-03 · /study/scope'],
          ['Add three questions', 'Customer definition, Demand, Pricing.', 'RST04', 'RST-04 · /study/scope'],
          ['Find and attach a customer-count observation', '[Enterprises · 86.23 · Germany · 2023] · [41,200], topic Size.', 'RST08', 'RST-08 · /study/evidence'],
          ['Inspect its source', 'The inspector RMO-01: three dates, ' + SRC_A + '; Close returns to the row.', 'RST08', 'RMO-01 (pass 1 A)'],
          ['Attach interviews and an experiment', '7 interviews and [H1] read from Validate for the beachhead.', 'RST09', 'RST-09 · /study/customers'],
          ['Tie a channel to the entry plan', '[Dental association newsletter]: assumed USD [180], measured USD [240].', 'RST10', 'RST-10 · /study/entry'],
          ['Record a contradiction', '[Price sensitivity is higher…] linked as Contradicts on the Pricing question.', 'RST05', 'RST-05 · /study/scope'],
          ['Leave one question open', 'Pricing stays Open with its gap and next validation action.', 'RST05', 'RST-05'],
          ['Record a decision', 'Test further, with rationale, what could reverse it, and two pieces of evidence.', 'RST07B', 'RST-07 B · sheet']
        ].map((s, i) => '<div class="rst-step"><i>' + (i + 1) + '</i><div><b>' + s[0] + '</b><p>' + s[1] + '</p></div><a class="fr" href="#' + s[2] + '">Open frame ' + s[2] + '<small>' + s[3] + '</small></a></div>')) + '</div>'),
      RST18: () => dk('<h1>RST-18 · Handoff</h1><p>Checked on main <code>58ee9d1b73</code> (Thu 19 Nov 2026): <code>cloudflare-worker/src/routes/research_projects.ts</code> (project read, owner-only, a project that is not yours is 404 not found; archived projects refuse writes with 409), <code>research_project_findings.ts</code> (three kinds; interpretations accepted, edited or discarded), <code>frontend/src/pages/research/ResearchProject.jsx</code> and <code>researchProjects.js</code> (five tabs; Overview’s “Key questions answered” reads Not recorded), <code>MyResearch.jsx</code> (New research form; no progress bar), <code>MarketHeaderOps.jsx</code> and <code>marketDirectoryExport.js</code> (New market research opens <code>?new=1&amp;question=</code> with the market named as text), <code>founderZoneActions.js</code>, <code>advisorZoneActions.js</code>, <code>partnerZoneActions.js</code> (founder: handler; advisor and partner: drawn disabled with the reason). No <code>research_stud*</code> table or <code>/study</code> route exists.</p>'
        + tbl(['Board', 'Recorded today or ◇', 'Builder'], [
          ['RST-01 Study frame', 'Project bar, five tabs, Overview texts: today. Study tab, sections, no-study None: ' + ENG(7719) + ' · address ' + FL('Q1'), '#7729'],
          ['RST-02 New research carries the market', 'Form and header action by licence: today. Started from, create together: ' + ENG(7719), '#7729'],
          ['RST-03 Scope', 'Overview texts: today. Product, segments, venture link, origin: ' + ENG(7719) + ' · ' + FL('Q5'), '#7729'],
          ['RST-04 Question list', ENG(7720), '#7730'],
          ['RST-05 One question', ENG(7720) + '; a link to a reference ' + ENG(7721), '#7730'],
          ['RST-06 Counts', ENG(7720) + '; D: ' + ENG('no issue') + ' ' + FL('Q7') + ', not built by #7730', '#7730 (not D)'],
          ['RST-07 Completeness and decision', ENG(7726) + ', ' + ENG(7720), '#7730'],
          ['RST-08 Evidence and findings', ENG(7716) + ', ' + ENG(7717) + ', ' + ENG(7721) + '; Evidence and Findings tabs today', '#7731'],
          ['RST-09 Customers and demand', ENG(7722) + ' · ' + FL('Q6'), '#7732'],
          ['RST-10 Entry strategy and risks', ENG(7722), '#7732'],
          ['RST-11 Eadwyn', 'A: interpretations today (Findings); linking ' + ENG(7720), '#7731 (A)'],
          ['RST-12 to RST-15, RST-17', 'Each builder builds its own frames on these boards', 'all four']])
        + '<h2>Owner questions in this pass</h2>' + tbl(['Question', 'Drawn'], [['Q1 · where the sections live', 'A: one new tab Study, <code>/research/projects/:uid/study</code> and <code>/study/:section</code>; RST-01 is drawn, not built until answered'], ['Q5 · a country filter as customer geography', 'A: customer countries stay empty; Scope offers “Use [Germany] as customer geography?”'], ['Q6 · stage words on demand kinds', 'A: Interest · Intent · Payment; Unpaid trial and Repeat use Not recorded'], ['Q7 · progress bar on a My Research card', 'A: drawn, ◇ and “proposed”, built by no issue']])
        + '<h2>Frontend only</h2><p>The section list and phone section sheet; the read-only Overview texts with “Edit on Overview”; the header action’s placement by licence (already built); stage words (Q6) on records the Worker returns; keeping contradicting evidence beside supporting evidence; the Partial banner when Validate or Grow fails; focus and live-region wording (RST-17). Mounting the inspector RMO-01 unchanged (built by #7718).</p>'
        + '<h2>Not drawn here</h2><p>Size and scenarios, Competition and pricing, Report and monitoring: pass 3 (RST-20 onward). A market’s own page with direct observations, attaching a market to an existing study, assisted search for candidate figures: each needs its own brief after #7737.</p>')
    };

    /* ---------- RST-17 keyboard ---------- */
    const kb = () => crop('<span class="eye">RST-17 · Keyboard and accessibility · tab order, live regions, focus return</span><div class="rst-g2"><section class="cd"><b>Tab order</b><ol style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.45;padding-left:0;list-style:none">' + J(['Project tabs (arrow keys move within; Study is the sixth)', 'Study sections list (one stop, ↑ ↓ to move, Enter opens)', 'Scope: Save scope, then fields top to bottom', 'Segment card: reorder handle, Mark as beachhead, Edit, Archive', '“Use [Germany] as customer geography?”: Use Germany, No', 'Question list: reorder handle (Space lifts, ↑ ↓ moves, Space drops), question link, Edit', 'One question: Add evidence, each link, Gap, Next action, Answer, Save', 'Context rail toggle (last)'].map((t, i) => '<li><span class="rst-tab">' + (i + 1) + '</span>' + t + '</li>')) + '</ol></section>'
      + '<section class="cd"><b>Live-region wording (polite)</b>' + J(['Scope saved.', 'Question added: [Do German data-protection rules…]. 5 questions.', 'Question moved to position 2 of 5.', 'Reference attached to the study: [Enterprises · 86.23 · Germany · 2023].', 'Decision recorded: Test further.', 'Evidence linked as Contradicts.'].map(t => '<span class="rst-live">◌ ' + t + '</span>')) + '<b style="margin-top:6px">Alerts (assertive)</b>' + J(['Save failed. Your edits are kept.', 'Someone else saved this scope first. Nothing was overwritten.', 'Validate could not be read. Your segments still show.'].map(t => '<span class="rst-live" style="border-color:var(--negE)">! ' + t + '</span>')) + '</section></div>'
      + '<div class="rst-g3"><section class="cd"><b>Focus return</b><p style="font-size:12.5px;line-height:1.5">Closing Record a decision, Attach to this study, Add evidence or the inspector returns focus to the button or row that opened it. Escape closes a sheet; focus stays inside an open sheet.</p></section><section class="cd"><b>Reading order</b><p style="font-size:12.5px;line-height:1.5">On one question, Supporting is read before Contradicting, then Context; each link reads its direction word first (“Contradicts, Your conclusion, …”). Counts read “1 for, 1 against”.</p></section><section class="cd"><b>Never colour alone</b><p style="font-size:12.5px;line-height:1.5">Directions, topic states, question statuses, the five kinds of figure and Platform States each carry a word and a glyph. Targets are 44px on phone; the reorder handle has a visible 2px violet ring.</p></section></div>'
      + '<div class="cd" style="gap:8px"><b>Focused handle on the question list</b>' + '<table class="rst-tb" style="max-width:760px"><tbody><tr><td style="width:42px"><button type="button" class="rst-dr rst-ring" aria-label="Move question 3, use arrow keys">⋮⋮</button></td><td style="width:130px"><span class="rst-tp">Size</span></td><td>' + QN[2][1] + '</td><td style="width:100px">' + qs('o') + '</td></tr></tbody></table></div>', 1300);

    let html;
    if (B === 'RST00') html = DOCS.RST00();
    else if (B === 'RST01' || B === 'RST15A') html = page(frameHome(), { h: 1080 });
    else if (B === 'RST01B') html = page(frameNone(), { h: 900, qs: 'nr' });
    else if (B === 'RST01C') html = page(frameNoVen(), { h: 900 });
    else if (B === 'RST01D') html = page(frameArch(), { h: 900 });
    else if (B === 'RST02' || B === 'RST15B') html = page(myRHead() + npForm(true), { h: 1000, rail: false });
    else if (B === 'RST02B') html = crop(npForm(false), 800);
    else if (B === 'RST02C') html = crop('<span class="eye">Markets header · New market research by licence</span>' + licRow(), 1300);
    else if (B === 'RST02D') html = crop(npForm(true, { err: true }), 800);
    else if (B === 'RST03' || B === 'RST15C') html = page(study('scope', scope()), { h: 1880 });
    else if (B === 'RST03B') html = page(study('scope', scope({ conflict: true, offer: false })), { h: 1880 });
    else if (B === 'RST03C') html = venStates();
    else if (B === 'RST04' || B === 'RST15D') html = page(study('scope', qList()), { h: 900 });
    else if (B === 'RST05' || B === 'RST15E') html = page(study('scope', oneQ()), { h: 1250, rail: false });
    else if (B === 'RST05B') html = pickEv();
    else if (B === 'RST06' || B === 'RST15F') html = page(ovCounts(), { h: 900 });
    else if (B === 'RST06B') html = cntStates();
    else if (B === 'RST06C') html = myCard();
    else if (B === 'RST07' || B === 'RST15G') html = page(study('', compl() + covApart() + decHist()), { h: 1150, rail: false });
    else if (B === 'RST07B') html = page(study('', compl() + covApart() + decHist()), { h: 1150, rail: false, overlay: decSheet() });
    else if (B === 'RST08' || B === 'RST15H') html = page(study('evidence', findObs()), { h: 900, rail: false });
    else if (B === 'RST08B') html = page(study('evidence', attached()), { h: 1180, rail: false });
    else if (B === 'RST08C') html = page(study('evidence', findObs()), { h: 900, rail: false, overlay: attachSheet() });
    else if (B === 'RST08D') html = refStates();
    else if (B === 'RST09' || B === 'RST15I') html = page(study('customers', custDemand()), { h: 1780, rail: false });
    else if (B === 'RST09B') html = page(study('customers', custDemand({ partial: true })), { h: 1000, rail: false });
    else if (B === 'RST10' || B === 'RST15J') html = page(study('entry', entry()), { h: 1200, rail: false });
    else if (B === 'RST11') html = eadwyn();
    else if (B === 'RST12') html = empties();
    else if (B === 'RST13') html = statesGrid();
    else if (B === 'RST17') html = kb();
    else if (B === 'RST16') html = DOCS.RST16();
    else if (B === 'RST18') html = DOCS.RST18();
    else if (MOB[B]) html = MOB[B]();
    else html = DOCS.RST00();
    return { html: { __html: html } };
  }
}
