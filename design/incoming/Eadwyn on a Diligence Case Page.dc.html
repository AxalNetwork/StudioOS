.edc-fh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.edc-fh>div:first-child{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--mu)}
.edc-fh b{font-size:14px;color:var(--ink)}
.edc-fm{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--mu);white-space:nowrap;flex-wrap:wrap}
.edc-fm .mo{font-size:11.5px}
.edc-help{border:1px solid var(--lavE);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px;background:var(--raised)}
.edc-file{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--hair);border-radius:9px;padding:8px 10px;background:var(--card)}
.edc-file>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.edc-file b{font-size:12.5px}
.edc-file small{font:500 10.5px var(--mo);color:var(--mu);line-height:1.4}
.edc-off{opacity:.6;border-style:dashed}
.edc-ref{gap:6px!important;padding:12px!important}
.edc-ref b{font-size:12.5px;line-height:1.4}
.edc-ref p{margin:0}
.edc-ref code{font:500 10px var(--mo);color:var(--mu);margin-top:auto}
.edc-fab{position:absolute;right:16px;bottom:20px;min-height:48px;padding:0 16px;border-radius:999px;border:0;background:#7c3aed;color:#fff;font:800 13px var(--sg);box-shadow:0 8px 20px rgba(124,58,237,.3)}
.edc-pch{display:flex;flex-direction:column;gap:4px}
.edc-pch b{font-size:18px}
.edc-pch .edc-chip{align-self:flex-start}
.edc-ptabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);overflow:hidden}
.edc-ptabs a{min-height:44px;display:inline-flex;align-items:center;padding:0 10px;font:600 13px var(--sg);color:var(--mu)!important;border-bottom:2px solid transparent;white-space:nowrap}
.edc-ptabs a[aria-current=page]{color:var(--ink)!important;font-weight:800;border-color:#7c3aed}
.edc-p44 .btn{min-height:44px!important;padding:0 14px}
.edc-psticky{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--hair)}
.edc-psheet{border:1px solid var(--hair);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.08);padding:10px 14px 80px;display:flex;flex-direction:column;gap:9px;background:var(--card)}
.edc-grab{align-self:center;width:40px;height:4px;border-radius:4px;background:var(--hair2)}
.cv .btn.p{background:var(--btnp)!important;border-color:var(--btnp)!important;color:var(--btnpt)!important}
.edc-ch .ctl{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;flex:none}
.edc-meta{gap:4px 14px}
.edc-cardh .ptag{font-size:10px}
.edc-vl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.edc-vl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;font-size:12px;align-items:baseline}
.edc-due{white-space:nowrap}
.edc-sub{font-size:12px;color:var(--mu)}
.edc-fh>div:first-child{flex:1;min-width:0}
.edc-fm{flex-wrap:nowrap}
.edc-kpis b .edc-st{font-size:12px;margin-top:6px}
.cv .tbl td.edc-due{white-space:nowrap}

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "1180px"}, "board": {"editor": "enum", "default": "EDC20", "options": ["EDC20", "EDC21", "EDC21B", "EDC22", "EDC22B", "EDC23", "EDC23B", "EDC24", "EDC25", "EDC25B", "EDC26", "EDC26B", "EDC28", "EDC27A", "EDC27B", "EDC27B2", "EDC27C", "EDC29"]}}'>
class Component extends DCLogic {
  renderVals() {
    const B = this.props.board || 'EDC20';

    const P = dark
      ? { bg: '#0b1220', card: '#111827', raised: '#1f2937', ink: '#e5e7eb', mu: '#9ca3af', hair: '#374151', hair2: '#4b5563', vi: '#a78bfa', vt: '#c4b5fd', lav: 'rgba(167,139,250,.14)', lavE: 'rgba(167,139,250,.4)', pos: '#34d399', posBg: 'rgba(52,211,153,.1)', posE: 'rgba(52,211,153,.4)', neg: '#f87171', negBg: 'rgba(248,113,113,.1)', negE: 'rgba(248,113,113,.45)', amT: '#fcd34d', amBg: 'rgba(245,158,11,.1)', amE: 'rgba(245,158,11,.45)', amD: '#f59e0b', dim: 'rgba(3,7,18,.66)', skel: '#1f2937', btnp: '#a78bfa', btnpt: '#0b1220' }

    const LK = '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="currentColor"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

    /* ---------- vocabulary: words + glyphs (Deals v2, dpd) ---------- */
    const SEV = { Critical: '◆◆', High: '▲', Medium: '◆', Low: '○', Info: 'i' };
    const sev = (s) => '<span class="dpd-sev ' + s.toLowerCase() + '">' + SEV[s] + ' ' + s + '</span>';

    const ead = '<span class="dpd-e" aria-hidden="true">E</span>';

    /* ---------- sample case: [Company Alpha] ---------- */
    // [name, blocking, worked, total, status, verdict, reviewer, pending, pastDue]
    const SEC = [

      ['Product & Technology Risk', false, 7, 7, 'done', 'pass', 'Dev Testcase', 0, 0],
      ['Market & Traction', false, 7, 7, 'done', 'pass', 'Dev Testcase', 0, 0],
      ['Market Position & Competitors', false, 5, 5, 'done', 'warn', 'Eva Demo', 0, 0],
      ['Compliance / AML / Sanctions', true, 6, 6, 'done', 'pass', 'Chloé Placeholder', 0, 0],
      ['Reputation & Press Signals', false, 4, 4, 'done', 'pass', 'Eva Demo', 0, 0],
      ['Cyber & Data Posture', false, 1, 6, 'pen', 'none', null, 5, 0]
    ];
    const WORKED = SEC.reduce((a, s) => a + s[2], 0), TOTAL = SEC.reduce((a, s) => a + s[3], 0), PEND = SEC.reduce((a, s) => a + s[7], 0), LATE = SEC.reduce((a, s) => a + s[8], 0), DONE = SEC.filter(s => s[4] === 'done').length;

    /* ---------- shell (#3704 union sidebar, de.js) + Eadwyn rail (#5130) ---------- */
    const INV_NAV = ['Studio', 'Spin-Out Lab', 'Deals', 'Axal VC Fund', 'Fund', 'Trust', 'Network', 'Research'];
    const FND_NAV = ['Home', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'];
    const railCollapsed = '<aside class="sp" aria-label="Eadwyn"><button type="button" class="e" aria-label="Open Eadwyn" aria-expanded="false">E</button><span class="vt" aria-hidden="true">Ask</span></aside>';
    const rail = (o) => '<aside class="edc-rail" aria-label="Eadwyn">'

      + '<div class="edc-rf"><div class="inp" style="min-width:0;min-height:38px">' + (o.ask || 'Ask about this case…') + '</div><div class="edc-rfl"><span>Runs on your own tokens · the cost is in Settings</span>' + FL('Q2 · A') + '</div></div></aside>';
    const shell = (body, o) => {
      const nav = o.founder ? FND_NAV : INV_NAV;
      const cur = o.founder ? 'Raise' : 'Deals';
      const coName = o.founder ? '[Company Alpha]' : '[Harbor Seed Fund]';
      return '<div class="edc-sh' + (o.rail ? '' : ' edc-nor') + '" style="min-height:' + (o.h || 900) + 'px">'
        + '<aside class="dsd"><div class="lg" style="padding:4px 16px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px"><span class="logo" aria-hidden="true"></span>Axal VC</div><button type="button" class="co" aria-label="Company or project: ' + coName + '"><i aria-hidden="true"' + (o.founder ? ' style="background:#7c3aed"' : '') + '></i>' + coName + '<span>▾</span></button><nav aria-label="Workspace">' + J(nav.map(t => ((t === 'Trust') ? '<div class="sep"></div>' : '') + '<a href="#"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + '</a>')) + '</nav></aside>'
        + '<div class="mn"><div class="tb"><div class="srch"><span aria-hidden="true">⌕</span>Search StudioOS</div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="ib" aria-label="Notifications">' + bell + '</button><button type="button" class="av" aria-label="Account menu: Portfolio, Companies, Licences" aria-haspopup="menu">' + (o.av || 'AE') + '</button></div></div>'

    /* ---------- case header + nine tabs (DDL3 frame) ---------- */

    const caseHead = (o) => '<div class="edc-crumb">Due diligence <span>›</span> [Company Alpha]<em>' + (o.route || '/due-diligence/:uid') + '</em></div>'

    const decisionBar = () => '<section class="cd edc-dec"><span class="edc-dico" aria-hidden="true">✎</span><div><b>Decision: not recorded.</b><span class="edc-sub">Only the lead or an Admin records the decision. Eadwyn never does.</span></div><a class="btn bsm" href="#">Go to sign-off</a></section>';
    const secTable = (o) => '<table class="tbl edc-sect"><thead><tr><th>Section</th><th>Blocks Proceed</th><th>Status</th><th>Verdict</th><th class="n">Items worked</th><th>Reviewer</th></tr></thead><tbody>'

    const ovRail = () => ({ scope: 'Reads this case only · lead', tasks: leadTasks(0), body: sumCard() });

    /* ---------- DDL21 · request drafts ---------- */
    const REQ = [['Signed IP assignment from [Founder B]', 'Corporate & Legal', 'w', '22 Oct 2026', '1 Nov 2026', true], ['Q3 bank statements', 'Financial Health', 'w', '29 Oct 2026', '18 Nov 2026'], ['Revenue by customer, last 12 months', 'Financial Health', 'r', '18 Oct 2026', '25 Oct 2026'], ['Penetration test scope', 'Cyber & Data', 'r', '27 Oct 2026', '3 Nov 2026'], ['Customer references (3)', 'Market & Traction', 'v', '6 Oct 2026', '13 Oct 2026'], ['Competitor list', 'Market Position', 'v', '8 Oct 2026', '15 Oct 2026'], ['Data room access for the case lead', 'Case-wide', 'v', '3 Oct 2026', '10 Oct 2026']];

    const reqTable = (extra) => '<table class="tbl"><thead><tr><th>Request</th><th>Section</th><th>State</th><th>Asked</th><th>Due</th></tr></thead><tbody>' + (extra || '') + J(REQ.map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + reqSt(r[2]) + '</td><td class="mo">' + r[3] + '</td><td class="mo' + (r[5] ? ' edc-late' : '') + '">' + r[4] + (r[5] ? '<div>13 days past due</div>' : '') + '</td></tr>')) + '</tbody></table>';
    const DRAFTS = [
      ['Cap table reconciled to your share register', 'Please share the current share register and the cap table it was reconciled against, with any differences explained.', 'Corporate & Legal Structure', '24 Nov 2026', 'item “Cap table reconciled” · pending'],

    const phone = (title, body, extra) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="More">…</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (extra || '') + '</div></div>';
    const pfab = '<button type="button" class="edc-fab" aria-label="Open Eadwyn">E · Eadwyn</button>';
    const pHead = '<div class="edc-pch"><b>[Company Alpha]</b><span class="edc-chip edc-chip-v">◷ In review</span><span class="raw">Lead Ada Example · IC 3 Dec 2026</span></div>';
    const pTabs = (cur) => '<nav class="edc-ptabs" aria-label="Case">' + J(['Overview', 'Checklist', 'Flags', 'Requests', 'Documents', 'Sign-off'].map(t => '<a href="#"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + '</a>')) + '</nav>';
    const pSticky = (t) => '<div class="edc-psticky"><button type="button" class="btn p" style="width:100%;min-height:48px">' + t + '</button></div>';
    const MOB = {
      EDC27A: () => phone('Due diligence', pHead + '<div class="edc-card"><div class="edc-cardh"><span class="eye">' + ead + ' Summary · a note, not saved</span></div>'
        + '<div class="edc-part"><h3>Worked <span class="mo">5 of 8</span> sections</h3><span class="raw">4 Pass, 1 Warn · Sections</span></div>'
        + '<div class="edc-part"><h3>Open <span class="mo">11</span> items · <span class="mo edc-late">2</span> past due</h3><span class="raw">Checklist · Corporate & Legal, Financial, Cyber</span></div>'
        + '<div class="edc-part edc-blocks"><h3>Blocks Proceed</h3><ul class="edc-lines">' + ln(blk + ' Corporate & Legal · Financial Health', 'Sections') + ln(sev('High') + ' IP assignment not signed', 'Flag · Checklist · Corporate & Legal') + '</ul></div>'
        + '<div class="edc-acts edc-p44"><button type="button" class="btn p bsm">Open the blocking item</button>' + btn('Keep') + btn('Discard') + '</div><div class="edc-made"><span>' + LK + ' This case only</span><span class="mo">15:42</span></div></div>'
        + pTabs('Overview') + '<div class="mc"><div class="dv"><span>Checklist</span><b class="mo">41 of 52</b></div><div class="dv"><span>Open flags</span><b class="mo">3</b></div><div class="dv"><span>Sections completed</span><b class="mo">5 of 8</b></div></div>', pfab),
      EDC27B: () => phone('Eadwyn · request drafts', '<div class="edc-banner"><b>Nothing is sent until you send it.</b></div>' + J(DRAFTS.slice(0, 2).map((d, i) => '<article class="edc-draft"><span class="eye">Draft ' + (i + 1) + ' of 3</span><b>' + d[0] + '</b><p>' + d[1] + '</p><dl class="edc-kv"><dt>Section</dt><dd>' + d[2] + '</dd><dt>Due</dt><dd class="mo">' + d[3] + '</dd><dt>From</dt><dd>' + d[4] + '</dd></dl><div class="edc-acts edc-p44">' + btn('Edit') + btn('Send') + btn('Discard') + '</div></article>')) + '<span class="raw">Draft 3 of 3 below · ' + LK + ' Reads this case only</span>'),
      EDC27B2: () => phone('Compose request', '<div class="edc-pre">' + ead + ' Prefilled from draft 1 · edit anything</div><div class="fld"><label>What you need <span>· required</span></label><div class="ta" style="min-height:44px;font-size:13px;padding:10px">' + DRAFTS[0][0] + '</div></div><div class="fld"><label>Details</label><div class="ta" style="min-height:96px;font-size:13px;padding:10px">' + DRAFTS[0][1] + '</div></div><div class="fld"><label>Section</label><div class="ta" style="min-height:44px;font-size:13px;padding:10px">Corporate & Legal Structure ▾</div></div><div class="fld"><label>Due date</label><div class="ta mo" style="min-height:44px;font-size:13px;padding:10px">24 Nov 2026 ▾</div></div><p class="raw">The subject sees exactly this text. Full-height sheet; Cancel returns to the drafts.</p>', pSticky('Send request')),
      EDC27C: () => phone('Requests from Axal VC', '<section class="cd edc-freq"><b>Q3 bank statements</b><span class="raw">All accounts, July to September 2026.</span><div class="edc-fm"><span class="mo">Due 18 Nov 2026</span>' + fSt('w') + '</div></section><div class="edc-psheet"><span class="edc-grab" aria-hidden="true"></span><div class="edc-cardh"><span class="eye">' + ead + ' Help me answer</span></div><div class="ta" style="min-height:64px;font-size:12.5px;padding:8px 10px">Attached are the statements for all three accounts, July to September 2026, and the September management accounts that reconcile to them.</div>'
        + J(FILES.map(f => '<div class="edc-file"><div><b>▤ ' + f[0] + '</b><small>' + f[1] + '</small></div><button type="button" class="btn bsm" style="min-height:44px">Remove</button></div>')) + '<p class="edc-fine">' + LK + ' Eadwyn reads your data room only. Axal VC sees what you send.</p></div>', pSticky('Send answer · note and 2 files'))
    };

    /* ---------- DDL29 · handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      EDC29: () => dk('<h1>Handoff · Eadwyn on a diligence case · DDL20 to DDL29</h1><p>Checked on main <code>6d7712c6d1</code> (14 Nov 2026). Component keys are <code>EDC20</code> to <code>EDC29</code>; the landing names them DDL20 to DDL29 in the Due Diligence Desk grid. Nothing here sends, saves, records a verdict, raises or resolves a flag, or decides.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it shows'], [
          ['<code>pages/admin/AdminBoardFrame.jsx</code>', 'The rail is drawn only for a Super Admin or <code>role === &quot;admin&quot;</code>. <code>AdminDueDiligenceCasePage.jsx</code> wraps the case in it, so an investor, Operating Partner or advisor on a case gets no Eadwyn.'],
          ['<code>App.jsx</code>', '<code>/due-diligence</code>, <code>/my-reviews</code>, <code>/:uid</code>, <code>/:uid/:tab</code> mount the same pages as <code>/admin/due-diligence/*</code> for admin, partner, investor and advisor; <code>/due-diligence/requests</code> is the founder’s page and draws no rail.'],
          ['<code>routes/rail_run.ts</code>', 'Runs <code>studio:layout</code>, <code>sessions:block</code> and <code>form:*</code>; any other option is refused <code>unknown_handler</code>. No diligence option.'],
          ['<code>routes/dd.ts</code>', '<code>requireDdReader</code>: Admin, or a held partner, investor or advisor licence. <code>caseAllowed</code>: <code>requests</code> and <code>memo_read</code> for Admin, lead or opener; <code>decide</code> for Admin or lead; <code>verdict</code> never for an observer (403 “An observer reads this section and does not record its verdict.”); a reviewer’s verdict needs the signed NDA (412). <code>MEMO_MAX = 8000</code> per part. <code>PATCH /requests/:id/respond</code> takes one <code>file_uid</code> per call.'],
          ['<code>routes/data_room.ts</code>', '<code>POST /:projectUid/search</code> over the room’s own index; unbound index → <code>available: false</code>, “Data room search is not switched on yet.”'],
          ['<code>routes/ai_rail_proposals.ts</code>', 'Statuses proposed, accepted, edited, discarded, withdrawn; <code>POST /:uid/decide</code> with accept, edit or discard, one at a time.']])
        + '<h2>Backend required ◇</h2><p>Five options on <code>POST /api/ai/rail/run</code>, each writing <code>ai_rail_proposals</code> rows only: <code>dd:summary</code> (DDL20), <code>dd:request_drafts</code> (DDL21), <code>dd:memo_draft</code> (DDL22), <code>dd:section_summary</code> (DDL23, summary and verdict note), <code>dd:answer_from_room</code> (DDL24). The rail for non-admin case members on <code>/due-diligence/*</code> (#5130 owns the shell rail). Withdrawing a draft when its item changes (DDL26 stale) is part of each run’s proposal record. The build issue filed from this canvas names them.</p>'
        + '<h2>Pending the owner ⚑ (drawn as option A)</h2><p>Q1 · Eadwyn reads encrypted flag detail, evidence excerpts and reviewer notes, never the subject’s email or legal name; the memo only for Admin, lead or opener. Q2 · runs spend the member’s own tokens, the cost shown in Settings, not on the rail. Q3 · a reviewer gets “Draft my verdict note” after the NDA, for their own section, never an observer.</p>'
        + '<h2>Handoffs</h2><p>Summary → the blocking item or flag on its tab, row open · request draft → DDL6b prefilled → back to Requests with the new row · memo draft → Save memo on Sign-off → Record decision · founder’s answer → their list with the request marked Answered.</p>'
        + '<h2>Frontend only</h2><p>The rail on <code>/due-diligence/*</code> for case members once the runs exist; the summary card, draft cards, memo side-by-side, character counts, the founder’s Help me answer panel (sequential <code>respond</code> calls, one per kept file, then the note); phone sheets and sticky actions; dark tokens.</p>'
        + '<h2>Preserved</h2><p>The Due Diligence Desk frame: case header, nine tabs, DDL3 Overview, DDL6 and DDL6b requests, DDL10 memo, DDL12b reviewer, DDL15 founder page. Existing boards are not redrawn.</p>'
        + '<h2>Open questions</h2><p>The brief names a “Diligence sidebar row”; on main the investor sidebar has none (Research › Diligence is a research zone), so the boards reach cases from Deals. Whether a summary kept as a note is visible to other case members is not decided.</p>'
        + '<h2>Accessibility</h2><p>Every state and severity pairs a word with a glyph; Not recorded, None and Unavailable each have their own shape. Every Eadwyn line names its source as text. Draft cards are articles with labelled actions; sheets trap and return focus; phone targets are 44px; tables have real headers.</p>')
    };

    let html;
    if (B === 'EDC20') html = page(overview(), { h: 1180, rail: ovRail() });
    else if (B === 'EDC21') html = page(requestsPage(), { h: 1180, rail: reqRail() });
    else if (B === 'EDC21B') html = sheet6b();
    else if (B === 'EDC22') html = page(signoffPage(), { h: 1720, rail: memoRail(false) });
    else if (B === 'EDC22B') html = memoRO();
    else if (B === 'EDC23') html = page(reviewerPage(false), { h: 1080, av: 'BS', rail: revRail(false) });
    else if (B === 'EDC23B') html = page(reviewerPage(true), { h: 1000, av: 'OB', rail: revRail(true) });
    else if (B === 'EDC24') html = page(founderPage(), { h: 1080, founder: true, av: 'FN', rail: fRail() });
    else if (B === 'EDC25') html = page(emptyPage(), { h: 900, rail: emptyRail() });
    else if (B === 'EDC25B') html = founderEmpty();
    else if (B === 'EDC26') html = states();
    else if (B === 'EDC26B') html = refusals();
    else if (B === 'EDC28') html = page(overview(), { h: 1180, rail: ovRail() });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview(), { h: 1180, rail: ovRail() });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
