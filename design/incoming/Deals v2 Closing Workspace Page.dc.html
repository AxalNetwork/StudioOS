      + stBox('Not recorded', '<ul class="rz"><li><span>Owner</span>' + NR() + '</li><li><span>Due date</span>' + NR() + '</li><li><span>Reference</span>' + NR() + '</li><li><span>Note</span>' + NR() + '</li><li><span>Executed</span><span class="mu">Not yet executed</span></li></ul><p class="foot">A measured 0 shows as 0. Not recorded never reads as 0 or blank.</p>')
      + stBox('Unavailable per section', '<div class="dcl-mini"><b>Checklist</b>' + cs('done') + '<span class="raw">4 of 8 done</span></div><div class="nt r"><span class="ic" aria-hidden="true">!</span><div><b>Paper could not be read.</b><div>That is not the same as having no paper.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div><div class="dcl-mini"><b>Transfer</b><span class="raw">3 recorded · $1,250,000</span></div>')
      + stBox('Refused', RF('You are not on this deal. Ask the deal’s Admin to add you.') + RF('A support session cannot change a closing.') + '<p class="foot">Refused names the reason; it never shows an empty workspace.</p>')
      + stBox('Saving and save failed', '<div class="dcl-mini"><b>Pro-rata rights recorded</b><span class="raw">◌ Saving…</span></div><div class="nt r"><span class="ic" aria-hidden="true">!</span><div><b>Not saved.</b><div>Your edits are still in the sheet.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>')
      + stBox('Record transfer refused by a condition', '<div class="nt a"><span class="ic" aria-hidden="true">‖</span><div><b>Nothing was recorded.</b><div>An open Investment committee condition holds transfers on this deal. Resolve it, then record again.</div></div></div><a href="#" style="font-size:12.5px">See conditions</a>')
      + stBox('Super Admin preview', '<div class="you"><span aria-hidden="true">▲</span><div><b>You are previewing the Investor interface.</b> Record transfer will be recorded as <b>Super Admin</b>, not as the investor.</div></div><div style="display:flex;gap:6px"><button type="button" class="btn bsm">Return to HQ</button><button type="button" class="btn bsm dcl-acc">Record as Super Admin</button></div>', 1)
      + stBox('Stale and partial', '<p class="dcl-s"><span class="dcl-st a"><i aria-hidden="true">◷</i>Stale · read 2 h ago</span></p><p class="dcl-s"><span class="dcl-st n"><i aria-hidden="true">◑</i>Partial</span> 1 of 7 envelopes could not be read; 6 are shown.</p>')
      + '</div>', 1400);

    /* ---------- phone ---------- */
    const phone = (title, body, extra, back) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative;overflow:hidden"><div class="pt"><button type="button" class="pi" aria-label="' + (back ? 'Back' : 'Menu') + '">' + (back ? '‹' : '☰') + '</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (extra || '') + '</div></div>';
    const sticky = (inner) => '<div class="dcl-stk">' + inner + '</div>';
    const mtabs = (cur, tabs) => '<nav class="zn dcl-mt" aria-label="Closing workspace">' + J(tabs.map(t => '<a href="#"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + '</a>')) + '</nav>';
    const MOB = {
      DCL28a: () => phone('Closing', '<h1 class="dcl-ph1">Deals at closing</h1><p class="raw">2 deals · as of 14 Nov 2026</p>'
        + J([[TW, '2 of 3', 'None open', tx('3 recorded · $1,250,000'), 'Awaiting signatures'], [SM, '3 of 4', '2 open', tx('Held · 2 recorded · €500,000', true), 'Transfers held']].map(d => '<article class="cd dcl-mc"><div class="ch"><b style="font-size:15px">' + d[0].n + '</b>' + co('Raise') + '</div><div>' + me('Closing') + '</div><dl class="dcl-mkv"><dt>Signatures</dt><dd class="mo">' + d[1] + ' on the open envelope</dd><dt>Conditions</dt><dd>' + (d[2] === 'None open' ? '<span class="mu">None open</span>' : ks('open') + ' <span class="mo">2</span>') + '</dd><dt>Transfers</dt><dd>' + d[3] + '</dd></dl><a class="btn" href="#">Open</a></article>'))),
      DCL28b: () => phone('Tidewater Systems', '<div><span class="eye">Seed 2026 · SAFE · USD</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + tx('Awaiting signatures', true) + '<span class="raw">Due 18 Dec 2026</span></div></div>'
        + mtabs('Checklist', ['Checklist', 'Paper', 'Conditions', 'Transfer', 'Audit']) + '<p class="raw"><b class="mo">4</b> of 8 done · 1 overdue · 1 blocked</p>'
        + '<ul class="dcl-mrows">' + J(CKL.slice(4).concat(CKL.slice(0, 2)).map(r => '<li><span><b' + (r[1] === 'skip' ? ' class="dcl-strike"' : '') + '>' + r[0] + '</b><small>' + (r[3] ? r[3] + ' · <span class="mo">' + r[4] + '</span>' : r[2] || 'Owner not recorded') + '</small></span>' + cs(r[1]) + '<i aria-hidden="true">›</i></li>')) + '</ul>', '', true),
      DCL28c: () => phone('Checklist item', '', '<div class="sheet" style="top:56px;max-height:none;border-radius:0" role="dialog" aria-modal="true" aria-label="Checklist item"><div style="padding:16px 18px;display:flex;flex-direction:column;gap:14px"><h2 style="font-size:18px">Pro-rata rights recorded</h2>'
        + '<div class="fld"><label>Status</label><div class="dcl-seg4" role="radiogroup" aria-label="Status">' + J(['Pending', 'Done', 'Blocked', 'Skipped'].map(s => '<button type="button" role="radio" aria-checked="' + (s === 'Pending') + '">' + s + '</button>')) + '</div></div>'
        + '<div class="fld"><label>Owner ' + DT('#6156') + '</label><button type="button" class="disc" style="min-height:48px"><b>Name A</b><i aria-hidden="true">›</i></button></div>'
        + '<div class="fld"><label>Due date ' + DT('#6156') + '</label><div class="inp mo" style="min-height:44px;color:var(--ink)">10 Nov 2026</div><span class="dcl-st a" style="align-self:flex-start"><i aria-hidden="true">◷</i>Overdue · 4 days</span></div>'
        + '<div class="fld"><label>Note <span>· optional</span></label><div class="ta" style="min-height:80px">Pro-rata clause is in the SAFE; record it in the cap table once accepted.</div></div>'
        + '<button type="button" class="btn p" style="min-height:48px">Save</button><button type="button" class="btn" style="min-height:44px">Cancel</button></div></div>', true),
      DCL28d: () => phone('Saltmarsh Robotics', mtabs('Transfer', ['Checklist', 'Paper', 'Conditions', 'Transfer', 'Audit']) + DISC
        + J(TRF_SM.map(r => '<article class="cd dcl-mc"><div class="ch"><b class="mo" style="font-size:18px">' + r[0] + '</b>' + pv(r[2]) + '</div><dl class="dcl-mkv"><dt>Firm</dt><dd>' + r[5] + '</dd><dt>Reference</dt><dd class="mo">' + r[1] + '</dd><dt>Recorded</dt><dd>' + r[3] + ' · <span class="mo">' + r[4] + '</span></dd><dt>Note</dt><dd>' + (r[6] || NR()) + '</dd></dl></article>'))
        + '<p class="raw"><b class="mo">2</b> transfers recorded · <b class="mo">€500,000</b> in EUR, all time</p>',
        sticky('<p class="dcl-s"><b>2 open conditions hold this.</b> Resolve them in the Investment committee. <a href="#">See conditions</a></p><button type="button" class="btn p" aria-disabled="true" style="width:100%;min-height:48px">Record transfer</button>'), true),
      DCL29a: () => phone('Investment committee', '<span class="eye">Decision · meeting 10 Nov 2026</span><h1 class="dcl-ph1">Acme Robotics · Invest / Pass / Defer</h1>' + co('Raise')
        + '<dl class="dcl-mkv"><dt>Eligible</dt><dd class="mo">6</dd><dt>Voted</dt><dd class="mo">4 · Invest 2 · Defer 1 · Abstain 1</dd><dt>Recused</dt><dd class="mo">1 · not counted in the tally</dd><dt>To vote</dt><dd class="mo">1 · you</dd></dl>'
        + '<section class="cd dcl-mc"><span class="eye">My vote</span><p class="dcl-s">You have not voted yet.</p></section>'
        + '<section class="cd dcl-mc"><span class="eye">Conditions</span><p class="dcl-s">' + ks('open') + ' <b class="mo">2</b> open · block Closing</p><a href="#" style="font-size:13px;min-height:44px;display:flex;align-items:center">See conditions ›</a></section>',
        sticky('<button type="button" class="btn p" style="width:100%;min-height:48px">Vote</button><span class="raw" style="text-align:center">Opens the vote sheet (dialogs in #6142)</span>')),
      DCL29b: () => phone('Conditions', '<p class="raw">Acme Robotics · 2 open · 0 met · 0 waived</p>'
        + J([['Customer reference calls', 'Name B'], ['Updated cap table', 'Founder']].map(c => '<article class="cd dcl-mc"><div class="ch"><b style="font-size:14px">' + c[0] + '</b>' + ks('open') + '</div><p class="dcl-s"><span class="dcl-st a"><i aria-hidden="true">‖</i>Blocks Closing</span></p><dl class="dcl-mkv"><dt>Owner</dt><dd>' + c[1] + '</dd><dt>Raised</dt><dd class="mo">7 Nov 2026</dd></dl><button type="button" class="btn" style="min-height:44px">Mark met or waived…</button></article>'))
        + '<p class="foot">An approved decision with no open conditions hands off to Closing with its conditions.</p>', '', true),
      DCL29c: () => phone('Investment committee', '<section class="cd dcl-mc" style="padding:28px 18px"><h1 class="dcl-ph1">No investment decision is open.</h1><p class="mu dcl-s">Decisions appear here when a deal reaches the Investment committee.</p><button type="button" class="disc2" aria-expanded="false" style="min-height:44px">How voting works ▾</button></section>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      DCLH: () => dk('<h1>Closing workspace · handoff</h1><p>Addendum to Deals v2 (DX8 · DE08 and DE08b, DX7 · DE07, DX14 dialogs). Sections DX17 to DX28 and boards DE19 to DE30; the keys here are DCL19 to DCL30. Checked on main 6d7712c6d1 (14 Nov 2026). Sample: Tidewater Systems in USD (no open condition), Saltmarsh Robotics in EUR (two open conditions from a second decision); both fictional.</p>'
        + '<h2>Checked on main</h2>' + tbl(['Board', 'Read or write on main', 'Status'], [
          ['Checklist (DE23, DE28b-c)', 'checklist read; apply template (SAFE, stock purchase, subscription); add item; set status pending / done / blocked / skipped; lead or Admin only', 'Working'],
          ['Owner, due date, Overdue, history', 'not on main: #6156, PR #6327 open', '◇ Backend'],
          ['Paper (DE19)', 'signing envelopes per deal: title, type, state, recipients signed, sent, completed; Admin sees all, others their own; open document', 'Working'],
          ['Conditions (DE20)', 'IC conditions list per deal; transfer hold read (Admin only; failure is never “nothing holds it”)', 'Working; owner ◇ #6156'],
          ['Admin hidden-condition row', 'the hold read gives a count only for conditions the Admin can see; the hidden case is known only when that count is empty and the transfer is still held', 'Working, drawn as that variant'],
          ['Transfer (DE21a-b)', 'transfers read (every reader of the deal); record transfer: Admin, refused while a condition is open or the hold is unreadable', 'Working'],
          ['Phone verifier', 'phone verified is a yes or no; only the recorder and time are stored', '◇ Backend'],
          ['Audit (DE22)', 'closing events (Admin and founder); transfers and paper joined from their own records', 'Working; actor name ◇'],
          ['After close (DE25)', 'close rules; cap-table proposal decided by the founder; reporting duties returned on close; Admin records Portfolio positions with an optional line', 'Working; line → position read ◇'],
          ['Commit (DE29)', 'commit room read: decision, votes, recusals, conditions, minutes', 'Working; dialogs are #6142']])
        + '<h2>Requires engineering (◇)</h2><p>Checklist item owner and due date, checklist history, condition owner (#6156, PR #6327). The actor’s name on closing events (only an id is stored). A person who confirmed a transfer by phone, separate from the recorder. A read that links a closing line to its Portfolio position. The last three need a new issue.</p>'
        + '<h2>Pending the owner (⚑)</h2><p>Q1 A: open /deals/closing to the Operating Partner who leads the round (route change for #5912; today the route admits Admin and investor only). Q2 A: investors read the checklist. Q3 A: investors see every transfer, as served. Q4 A: investors read condition sentences on decisions they may see. Q5 A: the founder reads the closing audit on their own raise page, not here.</p>'
        + '<h2>Frontend only</h2><p>Tabbed workspace, status words and glyphs, the held reason beside a disabled Record transfer, empty states, phone layouts and dark tokens. The disclaimer appears once, on the Transfer tab. The Unreadable state of Deals v2 is drawn with the D5129 word Unavailable. Zone counts change to Commit 1 and Closing 2 for this sample.</p>'
        + '<h2>Accessibility</h2><p>Tabs use aria-current; status is a word plus a glyph; a disabled Record transfer names its reason with aria-describedby; the item sheet is a labelled dialog that returns focus; the audit is an ordered list with time elements; phone targets are 44px and no table is wider than the screen.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DCL19') html = page(hdr('Closing') + paper(), { h: 1000, rail: paperRail });
    else if (B === 'DCL20') html = page(hdr('Closing') + conditions(), { h: 1000, rail: condRail });
    else if (B === 'DCL21a') html = page(hdr('Closing') + transferA(), { h: 820 });
    else if (B === 'DCL21b') html = page(hdr('Closing') + transferB(), { h: 900 });
    else if (B === 'DCL22') html = page(hdr('Closing') + audit(), { h: 1080 });
    else if (B === 'DCL23') html = page(hdr('Closing') + checklist(), { h: 1010, rail: ckRail, av: 'NB' });
    else if (B === 'DCL24') html = page(hdr('Closing', true) + investor(), { h: 900, sw: 'Northwind Ventures', av: 'ND' });
    else if (B === 'DCL25') html = page(hdr('Closing') + after(), { h: 900 });
    else if (B === 'DCL25b') html = beforeClose();
    else if (B === 'DCL26') html = empties();
    else if (B === 'DCL27') html = states();
    else if (B === 'DCL30a') html = page(hdr('Closing') + transferA(), { h: 820 });
    else if (B === 'DCL30b') html = page(hdr('Closing', true) + investor(), { h: 900, sw: 'Northwind Ventures', av: 'ND' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(hdr('Closing') + paper(), { h: 900, rail: paperRail });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
