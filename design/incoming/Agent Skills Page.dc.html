    const PASTE = `<div style="${M};font-size:12px;line-height:1.65;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);color:var(--ink);white-space:pre-wrap;word-break:break-word">---\nname: churn-interview-summary\ndescription: Summarises why a customer left, in their words.\narea: Growth\nlevel: Working\ntaxonomy:\n  - product/customer-discovery: Working\n  - gtm/retention: Aware\ntools: [customer_research.read]\noutput: draft\nversion: 1\n---\n1. Read the churned customer’s interview notes.\n2. List the reasons they gave, in their own words.\n3. Match each reason to a pain theme in Validate.\n4. Draft a one-page summary with the evidence.</div>`;
    const SK7P = () => SHEETO(560, SHEAD('New skill', 'For [Northwind Labs]’s agents') + `<div style="flex:1;min-height:0;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:16px">${MODE('Paste a SKILL.md')}${FLD('SKILL.md', PASTE)}${PARSED(0)}<div style="display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--body)">${ICO.info}<span>It lands as a draft and runs nowhere until a named editor publishes it.</span></div></div>` + SFOOT('1 field to fix before publishing', bG('Cancel') + bP('Save as draft')));

    const PEOPLE = [['[Avery Stone]', 4], ['[Jordan Reyes]', 5], ['[Sam Okafor]', 2], ['[Avery Stone]', 3], [null, 0], ['[Mina Patel]', 3], [null, 0], ['[Avery Stone]', 2]];
    const AGL = () => { const sp = { Aurel: '$[3.84]', Ryssa: '$[2.10]', Seren: '$[20.00]', Sylva: '$[0.62]' }; return PAD(CARD(H3('AI agents on [Northwind Labs]', '4 agents · agents on a project are listed on that project’s Team', bP(ICO.plus + 'Add an AI agent', SM)) + TEAMS[0].ag.map(n => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)">${ACMP(n, { z: 40 })}${n === 'Seren' ? PILL('Paused · cap reached', 'amb') : PILL('Active', 'pos')}<span style="${M};font-size:12px;color:var(--mut);width:150px;text-align:right">${sp[n]} of $20 this month</span></div>`).join(''))); };
    const SK8B = () => { const ag = TEAMS[0].ag, ks = [...new Set(ag.flatMap(n => AGSK[n]))], av = COV(ks), pv = PEOPLE.map(p => p[1] / 5);
      const best = (i) => { let b = null, q = 0; ag.forEach(n => { const x = COV(AGSK[n])[i]; if (x > q) { q = x; b = n; } }); return b ? [b, Math.round(q * 5)] : null; };
      const rows = AREAS.map((ar, i) => { const p = PEOPLE[i], b = best(i); const gap = !p[0]; return `<div role="row" style="display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr) 190px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);${gap && b ? 'background:var(--ambF);' : ''}"><span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700">${ADOT(ar, 8)}${ar}</span><span style="font-size:12.5px;color:${p[0] ? 'var(--ink)' : 'var(--mut)'}">${p[0] ? p[0] + ' · ' + LV[p[1] - 1] : 'No one'}</span><span style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);min-width:0">${b ? `${AVI(AG(b[0]), 22, 6)}${b[0]} · ${LV[b[1] - 1]} ${PILL('Agent', 'vio')}` : '<span style="color:var(--mut)">No agent</span>'}</span><span style="font-size:12px;font-weight:600;color:${gap ? 'var(--ambT)' : 'var(--mut)'}">${gap ? (b ? 'People gap · covered by agents only' : 'People gap') : ''}</span></div>`; }).join('');
      return PAD(`<div style="display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start">${CARD(`${H3('Coverage on the 8 axes', 'People and agents on [Northwind Labs]’s Team')}<div style="display:flex;justify-content:center">${RAD(av, 340, { lab: 1, people: pv, al: 'Agent coverage' })}</div><div style="display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--body)"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:rgba(14,165,233,.25);border:2px solid #0ea5e9;box-sizing:border-box"></span>People</span><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--lav);border:2px solid var(--vio);box-sizing:border-box"></span>Agent</span></div><span style="font-size:12px;line-height:1.5;color:var(--mut)">People levels come from each member’s skills in /studio. Agent levels come from assigned skills.</span>`)}${CARD(`${H3('By axis', 'A gap covered only by agents still reads as a people gap: agents propose, and a person on the Team has to judge the work.')}<div role="table" aria-label="Coverage by axis" style="border:1px solid var(--line);border-radius:10px;overflow:hidden"><div role="row" style="display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr) 190px;gap:12px;padding:8px 14px;background:var(--raised)">${['Axis', 'People', 'Agents', ''].map(t => `<span role="columnheader" style="${M};font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${t}</span>`).join('')}</div>${rows}</div>`, 'gap:14px')}</div>`); };

    const EMPTYCO = `<div style="padding:28px 20px;border-radius:12px;border:1px dashed var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><span style="font-size:15px;font-weight:700">No skills in Legal yet</span><span style="font-size:13px;line-height:1.5;color:var(--mut);max-width:420px">[Northwind Labs] hasn’t written or imported a Legal skill. Legal skills explain and draft; a person decides.</span><div style="display:flex;gap:8px">${bS(ICO.plus + 'New skill', SM)}${bG('Paste a SKILL.md', SM)}</div></div>`;
    const ERR = `<div role="status" style="padding:28px 20px;border-radius:12px;border:1px solid var(--negE);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><span style="color:var(--neg)">${ICO.warn}</span><span style="font-size:15px;font-weight:700">Skills could not be read</span><span style="font-size:13px;color:var(--mut)">That is not the same as having none. Your agents keep running the skills they have.</span>${bS('Try again', SM)}</div>`;
    const NOTE = (t, k) => `<div role="note" style="display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:10px;background:${k === 'amb' ? 'var(--ambF)' : 'var(--raised)'};border:1px solid ${k === 'amb' ? 'var(--ambE)' : 'var(--line)'};font-size:13px;line-height:1.5;color:${k === 'amb' ? 'var(--ambT)' : 'var(--body)'}">${k === 'amb' ? ICO.warn : ICO.info}<span>${t}</span></div>`;
    const PH390 = (title, inner, o) => { o = o || {}; return `<div style="position:relative;width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden"><div style="height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--card);box-sizing:border-box"><a href="#" style="display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 6px;color:var(--vio);font-weight:600;font-size:14px;text-decoration:none">${ICO.back}${o.back || 'Team'}</a><span style="flex:1;text-align:center;font-size:15px;font-weight:800">${title}</span><button type="button" aria-label="Ask Eadwyn" style="width:44px;height:44px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0">${EYE(22)}</button></div>${inner}</div>`; };
    const PDIR = () => PH390('Skills', `<div style="flex:1;min-height:0;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:12px"><div role="group" aria-label="Area" style="display:flex;gap:6px;flex:none;overflow-x:auto;overflow-y:hidden">${['All', 'Product', 'Engineering', 'Design', 'GTM', 'Marketing', 'Finance', 'Legal', 'Capital'].map((a, i) => CHIP((i ? ADOT(a, 7) : '') + a, !i, 'min-height:44px;flex:none')).join('')}</div><div style="height:44px;border-radius:7px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut);font-size:14px;box-sizing:border-box">${ICO.search}Search skills</div><div style="display:flex;align-items:center;justify-content:space-between">${CHIP('Popular ▾', false, 'min-height:44px')}<span style="${M};font-size:12px;color:var(--mut)">82 skills</span></div>${EB('From Axal')}${SCARD(SKO('investor-update'), { ez: 72, narrow: 1 })}${SCARD(SKO('runway-note'), { ez: 72, narrow: 1 })}</div>`);
    const PASG = () => PH390('Assign to agents', `<div style="flex:1;min-height:0;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--card)"><span style="font-size:12.5px;color:var(--mut)">Investor update draft · v3 · +≈1.2k tokens per run</span>${EB('[Northwind Labs] · Company')}${AROW('Sylva', { on: 1 })}${EB('[Atlas Pilot] · Project')}${AROW('Ilyse', { on: 1 })}${AROW('Kade', { on: 1, warn: 1 })}${EB('[Orbit] · Project')}${AROW('Vesta', { dis: 1 })}</div><div style="flex:none;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--card)">${bP('Assign to 3 agents', 'width:100%;min-height:48px')}</div>`, { back: 'Skill' });

    const BODY = (h) => `<div style="flex:1;min-height:0;overflow:hidden;padding:18px 20px">${h}</div>`;
    const FR = {
      sk0: () => ({ w: 1440, html: SHELL(HDR() + SK0B()) }),
      sk1: () => ({ w: 1440, html: SHELL(HDR() + DIR()) }),
      sk2: () => ({ w: 1440, html: SHELL(SK2H() + SK2B()) }),
      sk3: () => ({ w: 1440, h: 1480, html: SHELL(SK2H() + SK2B(), { h: 1480, sheet: SK3S() }) }),
      sk3ok: () => ({ w: 560, html: SK3OK() }),
      sk4: () => ({ w: 1440, h: 1180, html: SHELL(HDR({ tab: 'AI agents', act: bP(ICO.plus + 'Add an AI agent') + ASK() }) + AGL(), { h: 1180, sheet: SHEETO(560, SHEAD('Aurel', 'AI agent · [Northwind Labs]') + BODY(PROF('Aurel')) + SFOOT(LNK('Rule book ›', 'font-size:12.5px') + ' · ' + LNK('Approvals · 2 waiting ›', 'font-size:12.5px'), bG('Close'))) }) }),
      sk4e: () => ({ w: 560, html: `<div style="padding:20px;background:var(--card)">${PROF('Corvane')}</div>` }),
      sk5: () => ({ w: 1440, h: 1380, html: SHELL(HDR({ tab: 'AI agents', act: bP(ICO.plus + 'Add an AI agent') + ASK() }) + AGL(), { h: 1380, sheet: SK5S() }) }),
      sk6: () => ({ w: 620, html: `<div style="padding:20px">${CE({ w: 580 })}</div>` }),
      sk7w: () => ({ w: 1440, h: 1420, html: SHELL(HDR() + DIR(), { h: 1420, sheet: SK7W() }) }),
      sk7p: () => ({ w: 1440, h: 1180, html: SHELL(HDR() + DIR(), { h: 1180, sheet: SK7P() }) }),
      sk8: () => ({ w: 1440, html: SHELL(HDR({ tab: 'People', crumb: 'Company settings › Team', act: bP(ICO.plus + 'Add to team') + ASK() }) + SK8B()) }),
      sk9a: () => ({ w: 1440, html: SHELL(HDR() + DIR({ area: 'Legal', count: '10 skills', ax: ['clause-review', 'compliance-calendar'], axct: 10, co: [], coEmpty: EMPTYCO })) }),
      sk9b: () => ({ w: 1440, h: 900, html: SHELL(HDR() + DIR({ load: 1, count: '' }), { h: 900 }) }),
      sk9c: () => ({ w: 1440, h: 760, html: SHELL(HDR() + DIR({ err: ERR, count: '' }), { h: 760 }) }),
      sk9d: () => ({ w: 1440, html: SHELL(HDR({ act: ASK() }) + DIR({ banner: NOTE('You can read the skills library. Team editors write, import and assign skills.') })) }),
      sk9e: () => ({ w: 560, html: `<div style="padding:20px;background:var(--card)">${PROF('Sylva', { retired: 1 })}</div>` }),
      sk9f: () => ({ w: 560, html: `<div style="padding:20px;background:var(--card);display:flex;flex-direction:column;gap:14px">${PARSED(1)}<div style="display:flex;justify-content:flex-end;gap:8px">${bX('Publish', 'Salesforce (read) isn’t approved for this Team')}${bP('Save as draft')}</div></div>` }),
      sk9g: () => ({ w: 1440, html: SHELL(HDR({ act: bX(ICO.plus + 'New skill', 'AI agents aren’t switched on for [Northwind Labs]') + ASK({ dis: 1 }) }) + DIR({ banner: NOTE('AI agents aren’t switched on for [Northwind Labs]. You can read the library; writing and assigning skills open once a Team owner switches agents on.', 'amb') }), { spine: { off: 1 } }) }),
      sk9h: () => ({ w: 390, h: 844, html: PDIR() }),
      sk9i: () => ({ w: 390, h: 844, html: PASG() }),
      sk9j: () => ({ w: 768, html: SHELL(HDR() + DIR({ cols: 2, ez: 72, narrow: 1, ax: AXSH.slice(0, 4), co: ['pricing-page'] }), { icons: 1 }) })
    };
    const fr = (FR[v] || FR.sk1)();
    return { rootSt: `${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };

  }
}

</script>
</body></html>
