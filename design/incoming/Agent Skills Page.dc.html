    const COVER = () => CARD(`<div style="display:flex;align-items:baseline;gap:8px"><h2 style="margin:0;font-size:15px;font-weight:800">Team coverage</h2><span style="font-size:12.5px;color:var(--mut)">People and agents on the same eight categories</span></div><p style="margin:0;font-size:13px;line-height:1.5;color:var(--body)"><b style="color:var(--ink)">One people gap:</b> Legal / Compliance is covered only by an agent. Everything else has a person on it.</p><div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start">${RADAR([{ vals: [4, 3, 2, 3, 2, 3, 0, 3], col: 'var(--vio)', fill: 'var(--lav)' }, { vals: [0, 0, 0, 1, 1, 3, 2, 4], col: 'var(--sky)', dash: '5 4' }], { s: 260, al: 'People and agents coverage' })}<div style="display:flex;flex-direction:column;gap:2px"><div style="display:flex;gap:14px;margin-bottom:6px"><span style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:14px;border-top:2px solid var(--vio)"></span>People</span><span style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:14px;border-top:2px dashed var(--sky)"></span>Agent</span></div>${CATS.map((c, i) => { const pv = [4, 3, 2, 3, 2, 3, 0, 3][i], av = [0, 0, 0, 1, 1, 3, 2, 4][i]; return `<div style="display:grid;grid-template-columns:150px 100px 110px minmax(0,1fr);gap:10px;align-items:center;min-height:30px;border-top:1px solid var(--line);font-size:12.5px"><span style="font-weight:600">${c}</span><span>${pv ? LV[pv] : '<span style="color:var(--mut)">Not recorded</span>'}</span><span style="color:var(--body)">${av ? 'Agent · ' + LV[av] : '<span style="color:var(--mut)">—</span>'}</span><span>${!pv && av ? CHIP('People gap · covered only by agents', 'background:var(--ambF);border-color:var(--ambE);color:var(--ambT)') : ''}</span></div>`; }).join('')}</div></div>`);

    const ST = (t, inner) => CARD(`${EB(t)}${inner}`, 'min-height:150px');
    const STATES = () => `<div style="padding:24px;background:var(--bg);display:grid;grid-template-columns:repeat(4,320px);gap:16px">${[ST('Empty role', '<p style="margin:0;font-size:13px;color:var(--mut)">No skills for Sales development yet. Axal adds skills as roles grow; editors can write one.</p>' + LNK('New skill')), ST('Loading', SK('70%', 12) + SK('92%', 9) + SK('60%', 9) + '<span style="font-size:11.5px;color:var(--mut)">Reading…</span>'), ST('Could not be read', `<div role="alert" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600;color:var(--neg)">Skills could not be read.</span>${bS('Try again', SM + 'align-self:flex-start')}</div>`), ST('Read-only member', '<p style="margin:0;font-size:13px;color:var(--body)">You can read every skill. Only company editors add skills or assign them.</p><span style="font-size:12px;color:var(--mut)">No New skill and no Assign button.</span>'), ST('Retired Axal skill, still pinned', SROW({ n: 'Quarterly LP letter', tools: ['Mercury'], ver: 'v2' }, { retired: 1, why: 'Keeps working at v2. Pick a replacement.' })), ST('Agent with no skills', RADAR([], { s: 160, nr: 1 })), ST('Imported, unapproved tool', NOTE('This SKILL.md asks for HubSpot read, which no sponsor has approved. It stays a draft.', 'amb')), ST('AI agents not switched on', '<p style="margin:0;font-size:13px;color:var(--body)">AI agents aren’t switched on for [Northwind Labs]. Skills can be read, not assigned.</p>' + LNK('Open Team settings'))].join('')}</div>`;
    const PHONE = (inner, t) => `<div style="height:844px;display:flex;flex-direction:column;background:var(--bg)"><div style="height:56px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--card)"><span style="width:44px;height:44px;display:grid;place-items:center">${ICO.menu}</span><span style="flex:1;font-size:15px;font-weight:800">${t}</span><button type="button" aria-label="Ask Eadwyn" style="width:44px;height:44px;border:none;background:transparent;display:grid;place-items:center">${EYE(22)}</button></div><div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const FR = {
      sk0: () => ({ w: 1440, h: 940, html: SHELL(`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">${[['Skills available', '[68]', 'From Axal [52] · yours [16]'], ['Agents with skills', '[9] of [11]', '[2] agents have none yet'], ['Updates available', '[3]', 'Agents pinned to an older version']].map(k => `<section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;font-weight:600;color:var(--mut)">${k[0]}</span><span style="font-size:22px;font-weight:800">${k[1]}</span><span style="font-size:12px;color:var(--mut)">${k[2]}</span></section>`).join('')}</div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:15px;font-weight:800">Roles</span>${VIEWSW('By role')}<span style="margin-left:auto;font-size:12.5px;color:var(--mut)">Pick a role to see its skills</span></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">${ROLES.map(ROLE).join('')}</div>`, { h: 860 }) }),
      sk1: () => ({ w: 1440, h: 1120, html: SHELL(DIR(), { h: 1120 }) }),
      sk2: () => ({ w: 1440, h: 1240, html: SHELL(SKPAGE(), { h: 1240, hd: { acts: bS('Assign to agents…') + ASK() } }) }),
      sk3: () => ({ w: 1180, html: `<div style="display:flex;gap:20px;padding:20px;background:var(--bg)">${ASSIGN()}${ASSIGN(1)}</div>` }),
      sk4: () => ({ w: 700, html: `<div style="display:flex;padding:20px;background:var(--bg)">${PROFILE({ scope: '[Northwind Labs] › [Pilot app]' })}</div>` }),
      sk4v: () => ({ w: 700, html: `<div style="display:flex;padding:20px;background:var(--bg)">${PROFILE({ scope: '[Northwind Labs] › [Pilot app]', vals: 1 })}</div>` }),
      sk5: () => ({ w: 600, html: `<div style="display:flex;padding:20px;background:var(--bg)">${ADDSK()}</div>` }),
      sk6: () => ({ w: 700, html: `<div style="display:flex;padding:20px;background:var(--bg)">${NEWAG()}</div>` }),
      sk7: () => ({ w: 1180, html: `<div style="display:flex;gap:20px;padding:20px;background:var(--bg)">${WRITE()}${PASTE()}</div>` }),
      sk8: () => ({ w: 1440, h: 760, html: SHELL(COVER(), { h: 760, hd: { t: 'Team', pur: 'The people and AI agents working on [Northwind Labs]. Agents propose; people decide.', tab: 'People and agents', acts: bP('Add to team') + ASK() } }) }),
      sk9: () => ({ w: 1400, html: STATES() }),
      sk9b: () => ({ w: 700, html: `<div style="display:flex;padding:20px;background:var(--bg)">${PROFILE({ none: 1 })}</div>` }),
      ph1: () => ({ w: 390, h: 844, html: PHONE(`${LNK('‹ Roles', 'font-size:14px;min-height:44px;display:inline-flex;align-items:center')}<span style="font-size:18px;font-weight:800">Investor relations</span>${SCARD(AX[0])}${SCARD(AX[1])}`, 'Skills') }),
      ph2: () => ({ w: 390, h: 844, html: PHONE(`<span style="font-size:18px;font-weight:800">Assign to agents</span>${AROW('Investor relations', 'Company', 4, 1)}${AROW('Investor relations', '[Pilot app] · project', 1, 1, '', 1)}${AROW('Investor relations', '[Clinic pilot] · project', 2, 0, 'Needs the HubSpot read tool, which its sponsor hasn’t approved.', 1)}<div style="margin-top:auto">${bP('Save', 'width:100%;min-height:48px')}</div>`, 'Skills') }),
      tab: () => ({ w: 768, h: 760, html: `<div style="height:760px;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:14px;box-sizing:border-box"><span style="font-size:20px;font-weight:800">Skills · Roles</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">${ROLES.slice(0, 6).map(ROLE).join('')}</div></div>` })
    };
    const fr = (FR[v] || FR.sk0)();
    return { rootSt: `${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };

  }
}

</script>
