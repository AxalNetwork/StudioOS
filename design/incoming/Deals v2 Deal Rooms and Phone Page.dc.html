      + cbox('C · Remove from the sticky header', hdrC(3, 2) + '<div class="dra-res" role="status"><b>' + Q('Copperline Energy') + ' removed from Compare.</b><span>The other two stay. <button type="button" class="lk">Undo</button></span></div>')
      + cbox('D · Add a venture · back with picks kept', '<table class="tbl"><tbody>' + J([['Northwind Robotics', 1], ['Bluefern Health', 1], ['Copperline Energy', 1], ['Lumen Grid', 1], ['Quayside Pay', 0]].map(r => '<tr><td style="width:32px"><input type="checkbox"' + (r[1] ? ' checked' : ' disabled aria-describedby="max4"') + ' aria-label="Compare ' + Q(r[0]) + '"></td><td' + (r[1] ? '' : ' style="color:var(--mu)"') + '>' + Q(r[0]) + '</td></tr>')) + '</tbody></table><p id="max4" class="dra-note">At most 4 ventures. Remove one to add another.</p><button type="button" class="btn p" style="align-self:flex-start">Back to Compare · 4</button>')
      + cbox('E · Saved notes partly unreadable', '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div>One saved note could not be read; the others are below.</div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div><div class="cs2"><span class="eye">Saved note · 12 Nov</span><p style="font-size:12.5px">' + Q('Northwind Robotics') + ' leads on team; revisit Financial after the model update.</p></div>')
      + cbox('F · Loading', '<div aria-busy="true" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">' + J([0, 1, 2].map(() => '<div style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:14px"></span><span class="sk" style="height:10px;width:70%"></span><span class="sk" style="height:10px;width:50%"></span></div>')) + '</div><span class="raw">Column skeletons, no bars</span>')
      + cbox('G · Scorecard unreadable or locked in one column', '<div class="dra-g3">' + J([['Financial', 0, [46, 'Low']], ['Financial', 2, 'lk'], ['Financial', 3, 'ur']].map(r => '<div><small>' + Q(CV[r[1]][0]) + '</small>' + cval(r[2], r[1]) + '</div>')) + '</div>')
      + cbox('H · Eadwyn refused (409)', '<div class="nt"><span class="ic" aria-hidden="true">⊘</span><div>Not enough ventures here have a score to compare. Eadwyn drafts from scores only.</div></div>')
      + cbox('I · Refused · no Investor licence', '<div class="nt"><span class="ic" aria-hidden="true">⊘</span><div><b>Compare reads your own deal flow, which is for investors.</b><div>An admin can grant the Investor licence.</div></div></div>')
      + '</div>', 1440);

    /* DE30 handoff */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>DE30 · Backend fit · Deals v2 addendum A (#6141)</h1><p>Checked on main <code>6d7712c6d1</code> (14 Nov 2026). Continues Deals v2 (DE01–DE18) with its shell, status families and absence states. Deal rooms gets no pill (D4815): the zone row stays Deal flow, Screening, Commit, Closing, and /deals/rooms is reached from “Other deal activity”.</p>'
      + tbl(['Board', 'Worker read / write', 'Frontend only', 'Backend (◇)'], [
        ['DE19–DE24 Deal rooms', '<code>GET /api/deals</code> (name, sector, status, instrument, <code>target_raise</code>→<code>amount</code>, currency, <code>capital_committed</code>, <code>can_read</code>, <code>is_member</code>) · <code>GET /api/deals/dealroom/quota</code> · <code>GET /api/deals/invitations/mine</code> · <code>GET /api/deals/flow</code> · <code>POST /api/deals/flow</code> · <code>POST /:id/dealroom/join</code> (402, 409) · <code>DELETE /:id/dealroom/leave</code>', 'Page is live as <code>DealRoomsPanel</code>; new: table columns, company status + my stage + invitation per row, Scope step, the allowance copy from the brief, More menu with Add to my deal flow, phone cards and sheets, dark', 'My commitment per row · NDA per row · changed-since-opened count (read-only) · Eadwyn rooms-fit task'],
        ['DE25–DE26 Screening', '<code>GET /api/deals/screening</code> (<code>available:false</code>, 403) · <code>PATCH /api/deals/flow/:dealId</code> (409 flow_changed) · <code>POST /api/deals/flow/:dealId/pass</code> · <code>GET /api/deals/pass-analytics</code> (buckets, unrecorded, <code>intake_not_raising</code>)', 'Disclosure layout, my reasons table, phone cards and sheets', 'Eadwyn screening task'],
        ['DE27 IC phone', '<code>GET /api/ic</code>, <code>GET /api/ic/:uid</code> (votes, rationale, conditions, minutes) · <code>POST /api/ic/:uid/vote</code> (rationale required; recusal needs its declaration)', 'Cards, sticky Vote, sheet, tally with Recused beside it', 'Eadwyn IC task'],
        ['DE28–DE29 Compare', '<code>GET /api/deals/flow</code> + <code>POST /api/venture-scores/batch</code> · <code>GET/POST /api/deals/flow/compare-note</code>, <code>/keep</code> (409 scores_not_recorded, 503 note_unreadable)', 'Remove from header, 4-pick limit message, phone switcher and sections', '—']])
      + '<h2>The three ◇ row values (owner pick A: drawn, backend tasks filed, the build ships without them)</h2>' + tbl(['Value', 'Why the list cannot show it today', 'Needs'], [['My commitment', 'Only <code>GET /api/deals/:id/commitments</code> returns it, one deal at a time; the list carries the confirmed total for all investors', 'A per-caller commitment field on the list, narrowed by firm'], ['NDA state', 'Checked per room (<code>pairwise_ndas</code> via <code>GET /api/data-room/shared/:projectUid</code>)', 'A batched NDA state on the list'], ['Changed since you opened it', '<code>GET /api/deals/:id/whats-new</code> moves the last-seen watermark on every read', 'A read-only count per deal that does not move the watermark']])
      + '<h2>Decisions and open questions</h2><p>' + OWN('Bulk move / pass · pick A') + ' Not in this version: no bulk bar is drawn on DE02 or anywhere else. The <code>.bulk</code> style stays unused.</p><p>' + OWN('◇ row values · pick A') + ' Drawn with ◇; the three backend tasks are filed on approval.</p><p><b>No pill for Deal rooms (D4815).</b> The page keeps the Deals heading area and the zone row with nothing selected.</p><p><b>Copy changes.</b> The allowance line moves from “3 of 5 deal rooms” to “3 of 5 rooms used · Professional plan”, and the full message follows the brief; <code>quotaFullLine</code> and <code>quotaLine</code> change, the server fields do not. The used count is every firm’s; the Requested view is this firm’s, so 3 used and 2 requested can both be true, and the line says so.</p><p><b>Open question.</b> The Scope step names the firm and the allowance after; today’s panel goes straight to the review sentence. Keep a separate Scope step, or fold it into Review?</p>'
      + '<h2>Handoff</h2><p>Open deal → /deals/:id (DE04) with the room open. Add to my deal flow → Sourcing on /deals. Move to diligence → the Diligence column. An Open IC condition links to Closing (DE08).</p><h2>Accessibility</h2><p>Views are a tablist with counts in the accessible name; access, invitation and stage each carry a word and a glyph; the allowance meter has a text label; phone targets are 44px, tables become cards, forms open as sheets that trap and return focus, and nothing scrolls sideways (the Compare chips scroll inside their own row only). Results use role=status; failures role=alert.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DRA19') html = page(roomsPage(), { h: 1370 });
    else if (B === 'DRA19B') html = eadRooms();
    else if (B === 'DRA20') html = rowsAll();
    else if (B === 'DRA20B') html = reqFlow();
    else if (B === 'DRA20C') html = allowAll();
    else if (B === 'DRA21A') html = page(emptyPage('all'), { h: 640 });
    else if (B === 'DRA21B') html = page(emptyPage('open'), { h: 640 });
    else if (B === 'DRA21C') html = page(emptyPage('req'), { h: 640 });
    else if (B === 'DRA22') html = roomStates();
    else if (B === 'DRA24') html = page(roomsPage(), { h: 1370 });
    else if (B === 'DRA25') html = scrA();
    else if (B === 'DRA25B') html = scrB();
    else if (B === 'DRA27S') html = icStates();
    else if (B === 'DRA28') html = cmpStates();
    else if (B === 'DRA30') html = handoff();
    else if (MOB[B]) html = MOB[B]();
    else html = page(roomsPage(), { h: 1370 });
    return { html: { __html: html } };
  }
}
