    const recs = () => doc('Contracts v2 · CT-90', 'Recommendations: problem → design → benefit', 'Each change below exposes behaviour the live product already supports (agreements, templates, forms, document types, closings, governance collections, versions, confidential records, restricted ownership metadata, envelope linking, status transitions, preview/download, permissions). Nothing here invents a parallel product.',

        ['Lifecycles (CT-91)', 'Templates, agreements and governance records share status styling, so an approved template can read like a signed contract.', 'Three separate state vocabularies with distinct glyphs, plus an object-type tag on every row. Templates use a dashed tag and “Approved for use”; executed instruments use a solid dark “● Executed” seal that no template state can show.', 'An approved template can never be mistaken for an executed agreement, in tables, search or mobile.'],

        ['Document workspace (CT-07)', 'A side panel carries both quick actions and substantive work.', 'Keep the side panel for quick actions (CT-02). Substantive work opens a workspace with Overview · Document · Versions · Legal Review · Activity · Related.', 'Long legal work gets room; quick checks stay one click away.'],
        ['Legal review (CT-08)', 'Review is implied by status, and AI research is not separated from counsel’s decision.', 'A review record with eleven defined fields, tied to an exact version hash. Eadwyn research sits in a dashed lavender panel labelled “AI research · not approval”; counsel’s decision sits in a solid ink panel only counsel can complete.', 'No one can read AI output as legal approval, and every approval is tied to the exact text reviewed.'],
        ['Restricted / incomplete (CT-09, CT-10)', 'Restricted or empty templates can still look usable.', 'Restricted and Incomplete overlays sit on top of the lifecycle state. Generate, Use template and Publish are not rendered (not just disabled) while either overlay applies; the reason and the available actions are spelled out.', 'Unusable documents can’t produce agreements by accident.'],
        ['Related documents (CT-11)', 'Documents appear isolated; a change to a governing document doesn’t flag its dependants.', 'A Related tab shows the dependency tree. A change to the governing document raises a non-destructive banner (“4 related documents may require review”) and a review checklist. Nothing is rewritten.', 'Downstream risk becomes visible without automating legal changes.'],
        ['Execution evidence (CT-12)', 'Envelope-signed and uploaded copies are treated alike, and an upload could imply execution.', 'An explicit choice between a StudioOS envelope and an externally signed upload, always bound to an approved, immutable version. A draft version is rejected, with an explanation.', 'Execution is always provable, and a draft can never become the executed record.'],
        ['Search (CT-13)', 'Per-tab search only; historical versions clutter results.', 'Cross-object search from the top bar or the / key. Each result shows its type, entity, status and version. Defaults to current versions, with historical versions counted and opt-in. Eight simple filters, no filter builder.', 'Finding “the LPA” takes one query and returns the right object type.'],
        ['Cross-border (CT-15)', 'Delaware is effectively assumed.', 'A cross-border section on agreements with a foreign party: counterparty jurisdiction, governing law (as chosen, never defaulted), countries of performance, tax, data-transfer mechanism, local counsel, sanctions/trade. Open items block Send.', 'International deals get the checks they need before signature.'],
        ['Eadwyn (CT-07)', 'Model choice, token prices, usage and top-up balance take persistent space beside legal work.', 'A collapsed 44px rail, plus contextual actions in the workspace (Compare versions, Identify missing fields, Explain this clause, Find related agreements, Prepare review checklist, Summarise findings). Model settings live in Account › AI tokens.', 'The legal work gets the space; AI help appears only where a concrete task needs it.'],
        ['High-risk actions (CT-16)', 'Consequential actions sit beside routine ones.', 'Three action tiers. High-risk actions are permission-gated, need a reason and typed confirmation, and are logged in Security.', 'Fewer irreversible mistakes, and every consequential change can be audited.']]));

    const interactions = () => doc('Contracts v2 · CT-92', 'Interaction specifications', 'Behaviour an implementation agent must follow. URLs are illustrative and keep the existing /admin/contracts base path.',
