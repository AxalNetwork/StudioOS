/* founder band (shipped D699), drawn on its tint */
.amn-band{position:relative;height:52px;background:#140c26;color:#fff;flex:none}
.amn-band .amn-in{position:absolute;top:0;bottom:0;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;gap:9px}
.amn-band .amn-t{color:#fff}
.amn-band .amn-av{width:26px;height:26px;background:rgba(255,255,255,.92);color:#6d28d9;border:0;font-size:10px}
.amn-pill{display:inline-flex;align-items:center;min-height:28px;max-width:118px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);font:700 11px var(--sg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amn-pillc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
.amn-ovl{position:absolute;top:4px;bottom:4px;background:rgba(220,38,38,.35);border:1.5px solid #f87171;z-index:3}
/* layout helpers */
.amn-pair{display:flex;gap:20px;align-items:flex-start}
.amn-cell{display:flex;flex-direction:column;gap:8px;min-width:0}
.amn-cell h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.amn-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 20px}
.amn-frame{border:1px solid var(--hair2);border-radius:6px;overflow:hidden;align-self:flex-start;background:var(--bg)}
.amn-lab{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.amn-pb>*,.amn-dmain>*,.amn-sheet>*,.amn-list>*{flex-shrink:0}
.amn-sw{background:var(--card)}
.amn-abw .amn-say{padding:0 12px 9px}
.nwi-cv p.amn-nm{margin-top:2px}
.nwi-cv p.amn-rl{margin-top:2px}
</style>

      <tr><td><b>Notifications</b></td><td>Bell, 44 px, count badge</td><td>Bell</td><td>Shell</td></tr>
      <tr><td><b>Name, email, role, release tag</b></td><td>Account menu header and footer</td><td>Name in the button; header and footer in the menu</td><td>Account</td></tr>
      <tr><td><b>Account, Usage … Log Out</b></td><td>Account menu (sheet)</td><td>Account menu (dropdown)</td><td>Account</td></tr>
      <tr><td><b>Super Admin Mode, HQ, HQ-HELD, branch, Preview shell, Back to HQ</b></td><td>Admin bar, 44 px controls</td><td>Admin bar; HQ chip in the row</td><td>Mode</td></tr>
      <tr><td><b>“Investor View” and other role-view chips</b></td><td>Said by the bar’s trigger</td><td>Chip in the row</td><td>Mode</td></tr>
      <tr><td><b>New envelope, Contract tools, Ask</b></td><td>Page header (“Page actions”)</td><td>Page header</td><td>Page</td></tr></tbody></table>
      ${ANN('<b>Page actions never move into the header</b>, and header controls never act on the page. Two menus are named for what they hold: “Shortcuts” in the header, “Contract tools” on the page. The account menu holds only things about the signed-in account.')}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${TO('Q1 · A: a Shortcuts menu in the header')}${TO('Q2 · A: stage word in the row, tag in the menu')}</div>
      <p class="amn-cap">Q1 B puts Email, Wellness and Refer &amp; Earn in the account menu, as the founder’s sheet does. Q2 B hides the release badge below 360 px. The founder’s phone sheet (<code>AccountSheet.jsx</code>) already adds Email, Wellness and Refer &amp; Earn to the rows on the left.</p></div></div></div>`;
    }
    else if (B === 'AMN52') html = `<div class="${CV} crop" style="width:1000px"><b style="font-size:16px">Founder · the phone band (shipped, D699) at 390 and 320</b>
      <div style="display:grid;grid-template-columns:400px minmax(0,1fr);gap:22px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:14px"><span class="amn-lab">Main · 390 · [Atlas Orchard]</span><div class="amn-frame">${BAND(390, { pillW: 100, tb: true })}</div>
      <span class="amn-lab">Main · 320</span><div class="amn-frame" style="width:320px">${BAND(320, { pillW: 100, tb: true })}</div>
      <span class="amn-lab">Proposed · 320 and 360</span><div class="amn-frame" style="width:320px">${BAND(320, { fix: true, tb: true })}</div><div class="amn-frame" style="width:360px">${BAND(360, { fix: true, tb: true })}</div></div>
      <div style="display:flex;flex-direction:column;gap:12px">
      ${ANN('<b>Computed from <code>PhoneHeader.jsx</code>’s classes, not measured.</b> The row is inset 22 px each side. The right cluster is three 44 px targets with 9 px gaps (150 px). The company pill is centred absolutely, up to 118 px. With “[Atlas Orchard]” (about 100 px), the pill reaches into the Studio target by about 27 px at 390 and 71 px at 320 (red). The test in AMNH measures both.')}
      ${ANN('<b>Proposed:</b> the pill joins the flow between the logo and the cluster (<code>flex:1</code>, centred in what is left, truncating at 96 px); below 360 the wordmark hides and the mark carries “Axal VC” as its name. The band, its tint, its five targets and its sheets are otherwise as shipped.')}
      ${ANN('<b>Already right on main:</b> 44 px targets, the account sheet (<code>PhoneSheet</code>) is a modal dialog, Escape closes it, and focus returns to the initials (<code>opener</code>). The other five roles copy this behaviour.')}</div></div></div>`;

    /* ======================= states ======================= */
    else if (B === 'AMN60') {
      const st = (k, title, o, cap) => `<div class="amn-cell"><h3>${title}</h3><div class="amn-frame" style="width:320px">${phone(k, 320, o.h || 57, o.body || '', Object.assign({ bar: o.bar || false }, o))}</div><p class="amn-cap">${cap}</p></div>`;
      html = `<div class="${CV} crop" style="width:1400px"><b style="font-size:16px">States · the closed header at 320</b>
      <div class="amn-grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        ${st('iv', 'Account not loaded yet', { load: true, cnt: 0 }, 'The trigger keeps its 44 px and reads “Account menu, loading”; a neutral placeholder holds the initials’ place and the sheet opens on a skeleton header.')}
        ${st('iv', 'No display name', { ini: 'L', nm: '[lena@example.com]' }, 'Initials from the email’s first letter (<code>initialsOf</code>); the label and the menu header use the email.')}
        ${st('op', '99+ unread', { cnt: 140 }, 'The badge reads 99+ inside the 44 px target; the label says “more than 99 unread”.')}
        ${st('iv', 'Unread count could not be read', { cnt: 'u' }, `An outlined “!” and the label “unread count unavailable”. ${TB('frontend · #8682')} Main’s <code>refreshCount</code> swallows the error and keeps 0, so a failed read looks like none.`)}
        ${st('iv', 'Release: beta', { rel: 'beta' }, 'Sky, the word “beta”. A stable release shows no word in the row; its version is in the account menu footer.')}
        ${st('ad', 'Branch suspended', { bar: true, susp: true, h: 131 }, 'Main’s badge words (“BRANCH · SUSPENDED”) move from the row into the admin bar below 1024, on their own line, never clipped.')}
        ${st('sa', 'Focus on the workspace menu', { fvm: true }, 'Focus ring: 2 px violet inside the target, visible on white and on the lavender open state.')}
        ${st('iv', 'Open state', { acx: true }, 'The trigger of an open menu is lavender and <code>aria-expanded="true"</code>.')}
      </div></div>`;
    }

    /* ======================= dark ======================= */
    else if (B === 'AMN70') html = phone('iv', 390, 844, `<span class="amn-pe">Investor · Deals</span><h1 class="amn-h1">Deals</h1>${SHIPPED('Deals as shipped', 300)}`, { bar: false, acx: true, over: SHEET('iv', { top: 64, fv1: true }) });
    else if (B === 'AMN71') html = phone('sa', 320, 844, `${CONTRACTS({ more: true })}`, { tb: true });

    /* ======================= accessibility ======================= */
    else if (B === 'AMN80') html = `<div class="${CV} doc"><div><span class="eye">Shell · account menu on narrow screens · #8682 · accessibility</span><h2 style="font-size:22px;margin-top:4px">Target boundaries, keyboard order, focus return, what is announced</h2></div>
      <div class="cols"><div><h3>Keyboard order below 1024 px (amber numbers on AMN10 and AMN40)</h3><ul>
      <li>${FO(1)} Skip to content ${FO(2)} Preview shell (admins) ${FO(3)} Back to HQ, while previewing ${FO(4)} Open workspace menu ${FO(5)} Shortcuts ${FO(6)} Notifications ${FO(7)} Account menu, then the page’s h1 region.</li>
      <li>Roles without Shortcuts skip 5. Roles without the bar start at 4.</li></ul>
      <h3 style="margin-top:10px">Open and dismiss</h3><ul>
      <li><b>Workspace menu:</b> a modal dialog “Workspace menu”; focus to Close; Tab cycles inside; Escape, Close or the scrim closes; focus returns to ☰. Choosing a row navigates and focus goes to the new page’s h1.</li>
      <li><b>Account menu:</b> a modal sheet labelled by the name; focus to the first row; Escape, Close, the scrim or a swipe down closes; focus returns to the initials (as <code>PhoneSheet</code> does today).</li>
      <li><b>Shortcuts:</b> a menu; ↓ ↑ Home End move; Escape and Tab out close; focus returns to ⋯.</li>
      <li><b>Desktop account dropdown:</b> the same keys as Shortcuts; Escape now returns focus to the button.</li>
      <li>Pointer and keyboard open the same thing; there is no hover-only control.</li></ul></div>
      <div><h3>Targets</h3><ul><li>Every header and bar control is at least 44 × 44 px, with the glyph centred; the dashed amber boxes on AMN10, AMN15, AMN20, AMN40 and AMN50 are the target boundaries, edge to edge, no overlap.</li><li>Focus ring: 2 px violet (white on the bar) drawn inside the target, so the row never clips it.</li><li>At 200% zoom (an effective 195 px) the wordmark and stage word hide first; ☰, bell and account stay.</li></ul>
      <h3 style="margin-top:10px">Names and announcements</h3><ul>
      <li>Account: “Account menu, [full name]”; acting as: “Account menu, acting as [Lena Sato]”. Bell: “Notifications, 3 unread” or “… unread count unavailable”. Shortcuts: “Shortcuts: Email, Wellness, Refer &amp; Earn”.</li>
      <li>Preview ended stays main’s polite status “Preview ended. You are back in HQ.” Opening and closing a menu announces only the expanded state; no toasts.</li>
      <li>The release word keeps its title (“Alpha: features are still being built and may change.”) and is read once in the account menu footer.</li></ul>
      <h3 style="margin-top:10px">Headings</h3><ul><li>The header has no heading; the page’s h1 is first. The account sheet’s name is its label, not a heading; the drawer’s rows are a <code>nav</code> “Primary navigation”.</li></ul></div></div></div>`;

    /* ======================= handoff ======================= */
    else if (B === 'AMNH') html = `<div class="${CV} doc"><div><span class="eye">Shell · account menu on narrow screens · #8682 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, what the owner picks, and where each acceptance item is answered</h2></div>
      <div class="cols"><div><h3>Checked on main (ee23155ff6)</h3><ul>
      <li><code>App.jsx</code>: the header row, <code>UserDropdown</code> (rows by held licence, D4473; Escape closes without focus return), <code>PortalSwitcher</code> (Preview shell, chip, sentence, Back to HQ, D8730 focus return), the drawer and <code>MobileTabBar</code> (founder only).</li>
      <li><code>ui/phone/PhoneHeader.jsx</code>, <code>AccountSheet.jsx</code>, <code>PhoneSheet.jsx</code>: the founder band, 44 px targets, the sheet with Escape and focus return. <code>HeaderForWidth</code> picks band or header.</li>
      <li><code>components/NotificationBell.jsx</code> (34 px default, 44 px band tone; <code>refreshCount</code> keeps 0 on a failed read), <code>AxalLogo.jsx</code> and <code>lib/release.js</code> (the release badge), <code>lib/previewShells.js</code>, <code>lib/impersonationBar.js</code>, <code>ui/SidebarNav.jsx</code>, <code>sidebarConfig.js</code>, <code>pages/admin/contracts/ContractsDesk.jsx</code> (page actions).</li></ul>
      <h3 style="margin-top:12px">Requires engineering</h3><ul><li>No Worker or D1 change: <code>/me</code> already carries name, email, role, elevation and branch. ◇ marks frontend proposals.</li><li>Frontend: extend <code>HeaderForWidth</code> so every role gets a narrow header below 1024 (App.jsx imports are frozen, D5615, so the new header lives in <code>ui/phone/</code>); reuse <code>PhoneSheet</code> for the account sheet with the role line, the preview or acting-as line and the release footer; the Shortcuts menu; drawer Escape and focus return; the desktop dropdown’s keys and focus return; the bell’s unavailable state; the founder pill fix.</li></ul>
      <h3 style="margin-top:12px">Pending the owner (⚑, option A drawn)</h3><ul><li>Q1 A: Email, Wellness, Refer &amp; Earn in a header “Shortcuts” menu. B: in the account menu, as the founder’s sheet does.</li><li>Q2 A: below 1024 the row shows the release stage word; the full tag is in the account menu footer. B: hide the badge below 360.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>The founder band and its sheets; main’s account rows and order; the Preview shell words; the support-session bar; Eadwyn as the one rail; desktop’s row.</li></ul></div>
      <div><h3>Acceptance mapped</h3><table class="amn-mx"><tbody>
      <tr><td><b>320, 360, 390: every account and navigation control fits, with a long name, notifications, alpha and preview indicators</b></td><td>AMN10, AMN15, AMN20 (rulers), AMN40, AMN50, AMN52, AMN60; main today AMN01</td></tr>
      <tr><td><b>Full tap area and focus ring; account menu and workspace navigation open and dismiss with pointer and keyboard, focus back on the trigger</b></td><td>AMN11, AMN12, AMN13, AMN14, AMN21, AMN22, AMN31, AMN80</td></tr>
      <tr><td><b>Six roles; menu open, closed and role preview; page actions apart from account actions</b></td><td>AMN50, AMN51, AMN52; open AMN12, AMN21, AMN70; preview AMN40–AMN43; page vs account AMN10, AMN51</td></tr></tbody></table>
      <h3 style="margin-top:12px">Tests the acceptance asks for</h3><ul>
      <li>Playwright, beside <code>tests/e2e/admin_contracts.spec.js</code>: six role fixtures × 320, 360, 390 on their home and on <code>/admin/contracts</code> (admins): <code>scrollWidth === innerWidth</code>; every header and bar control’s box inside the viewport, at least 44 × 44 px, not overlapping another.</li>
      <li>Same spec: open and dismiss the account menu, the workspace menu and Shortcuts by click and by Enter, close by Escape, Close and scrim; assert <code>document.activeElement</code> is the trigger each time.</li>
      <li>Same spec with a Super Admin previewing Investor and an Admin previewing Founder: the bar fits, Back to HQ is reachable, the account menu header is the operator’s.</li>
      <li>Node: <code>initialsOf</code> and the account label for name, email-only and long names; the bell label for a failed count.</li>
      <li>axe on the six closed and open headers (<code>axe-top-routes.spec.js</code> pattern).</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Measure AMN01’s 320 and 360 and AMN52’s overlap in the first test run.</li><li>Tablet (768) uses the narrow header too, with the wordmark; not drawn.</li></ul></div></div></div>`;

    if (!html) html = '<div>unknown board</div>';
    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('amn-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
