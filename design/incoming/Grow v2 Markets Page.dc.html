      + '<div class="prow"><section class="cd" aria-labelledby="dph"><div class="ch"><h2 id="dph">Drafted entry plan · 3 steps</h2><span class="sm">as on GR-22</span></div><ol class="grm-dr flat">' + J([['Ask [Law firm A] for a [Country C] regulation memo', 'Cites: Regulation not scored'], ['Price a local entity with [Advisor A]', 'Cites: Cost to enter not scored'], ['Book five demand calls from the waitlist', 'Cites: Demand 7 / 10 · 9 founder interviews']].map(d => '<li><b>' + d[0] + '</b><small>' + d[1] + '</small><div class="grm-pa"><button type="button" class="btn bsm">Accept</button><button type="button" class="btn t bsm">Edit</button><button type="button" class="btn t bsm">Discard</button></div></li>')) + '</ol></section>'
      + '<section class="cd" aria-labelledby="dch"><div class="ch"><h2 id="dch">Comparison · [Market C] and [Market A]</h2><span class="sm">as on GR-23</span></div><p style="font-size:12.5px;line-height:1.55">[Market C] trails [Market A] on Demand by 1 and on Partners by 1. Regulation and Cost to enter can’t be compared: [Market C] has no score for them yet.</p><p class="raw">Cites: each market’s sources · Research as of 1 Nov 2026</p><div class="grm-pa"><button type="button" class="btn bsm">Keep as note</button><button type="button" class="btn t bsm">Discard</button></div></section></div>'
      + '<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>After Accept on Regulation:</b> “Regulation 6 / 10 saved with its source.” Readiness stays Not recorded until Cost to enter is scored too.</div></div>';

    /* ---------- GR-25 first use, one market ---------- */
    const firstUse = () => listHead({ ro: 1 }) + '<section class="cd grm-empty" aria-labelledby="feh"><h2 id="feh">No markets yet</h2><p>Add the markets you might go after. Each is scored on four parts — Demand, Regulation, Partners and Cost to enter — and readiness appears once all four are scored.</p><button type="button" class="btn p">Add your first market</button><p class="raw">Nothing recorded for Lumen Robotics · read Sat 14 Nov, 14:30</p></section>';
    const addDlg = () => dlg('amh', 'Add your first market', '<p class="raw">Only the name is required</p>',
      '<div class="fld"><label for="amn">Market name</label><div class="ta" id="amn" style="min-height:40px">[Market A]</div></div><div class="fld"><label for="amc">Country <span>· optional, from Research › Geographies</span></label><div class="selb" id="amc"><span>[Country A]</span><span aria-hidden="true">▾</span></div></div><div class="fld"><label for="ams">State <span>· optional</span></label><div class="selb" id="ams"><span>Considering</span><span aria-hidden="true">▾</span></div></div><p class="foot">Scores come later, each with its source. You can leave the country blank.</p>',
      '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Add market</button>', 560);
    const oneM = { n: '[Market A]', c: '[Country A]', r: '[Region 1]', st: 'Considering', dec: null, on: null, p: [null, null, null, null], s: [null, null, null, null], rep: 0 };
    const oneMarket = () => listHead({ cmp: false }) + '<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>[Market A] added.</b> Next: score demand, and say where it came from.</div></div>'
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><table class="etb grm-lt"><thead><tr><th>Market</th><th>State</th><th>Readiness <span class="mo">/40</span></th><th>Weakest part</th><th>Decision</th><th>Next step</th></tr></thead><tbody><tr><td><a href="#" class="grm-mn"><b>[Market A]</b></a><small>[Country A] · [Region 1]</small></td><td>' + spill('Considering') + '</td><td>' + nr('Demand, Regulation, Partners, Cost to enter not scored') + '</td><td>' + wk(oneM) + '</td><td>' + nr('Not decided') + '</td><td><a href="#" class="grm-nx">Score demand, and say where it came from →</a></td></tr></tbody></table><div class="qft"><span>1 market · read Sat 14 Nov, 14:31</span></div></section>'
      + '<section aria-label="[Market A] parts" style="display:flex;flex-direction:column;gap:8px"><div class="ch"><h2 style="font-size:15px;font-weight:800">[Market A] · four parts</h2><span class="raw">None scored yet · never drawn as 0</span></div><div class="grm-parts four">' + J(PARTS.map((_, i) => partTile(oneM, i, null, { noev: 1 }))) + '</div></section>';

    /* ---------- GR-26 states ---------- */
    const box = (t, inner, cls) => '<section class="cd' + (cls ? ' ' + cls : '') + '" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const statesA = () => crop('<span class="eye">Loading · Not recorded · zero vs not recorded vs unavailable</span><div class="grm-sg">'
      + box('Loading · list', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px">' + J([1, 2, 3].map(() => '<div style="display:flex;gap:10px"><span class="sk" style="height:14px;width:30%"></span><span class="sk" style="height:14px;width:18%"></span><span class="sk" style="height:14px;width:22%"></span></div>')) + '<span class="raw">Announced: “Loading markets”</span></div>')
      + box('Loading · record', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:20px;width:40%"></span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><span class="sk" style="height:60px"></span><span class="sk" style="height:60px"></span></div><span class="raw">Announced: “Loading [Market A]”</span></div>')
      + box('Same cell, three meanings', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>[Market D] Regulation</dt><dd><span class="grm-ps"><b>0</b> / 10</span> ' + st('Zero', 'Measured 0') + '</dd><dt>[Market C] Regulation</dt><dd>' + nr('') + '</dd><dt>Research for [Country A]</dt><dd>' + st('Unavailable') + ' <span class="mu" style="font-size:12px">couldn’t be read</span></dd></dl>')
      + '</div><div class="grm-sg" style="grid-template-columns:repeat(4,minmax(0,1fr))">'
      + box('Readiness', nr('Regulation, Cost to enter not scored'))
      + box('A part score', '<div class="grm-ph"><b>Cost to enter</b>' + nr('') + '</div><div class="grm-src">No source yet · <a href="#">Score cost to enter</a></div>')
      + box('Decision', nr('Not decided'))
      + box('Size', nr('No size recorded') + '<div class="grm-src">Add it with Edit, with its source</div>')
      + box('Step owner and due date', '<span class="grm-nri">○ Owner not recorded</span><span class="grm-nri">○ Due date not recorded</span>')
      + box('Attached country', nr('No Research › Geographies country attached') + '<a href="#" class="grm-hoff">Attach with Edit →</a>')
      + box('Per-country demand', nr('Demand data is global only') + '<div class="grm-src">Always, for every country today</div>')
      + box('No replies', '<p class="mu" style="font-size:12.5px">No replies to a market ask yet.</p><p class="foot">A failed replies read also looks like this today ' + NEW('#6119 · replies read reports failure') + '</p>')
      + '</div>', 1400);
    const overviewCard = '<section class="cd grm-ovc" aria-labelledby="ovh"><div class="ch"><h2 id="ovh">Grow Overview · Markets card</h2><span class="sm">From Grow Overview · read 14:30</span></div><p style="font-size:13px">4 markets · readiness by market. Next: <a href="#">Source the regulation score for [Market C].</a></p></section>';
    const listFail = () => listHead({ cmp: false }).replace('<span class="grm-dis"><button type="button" class="btn" aria-disabled="true" aria-describedby="cmpw">Compare</button><small id="cmpw">Add a second market to compare</small></span>', '<button type="button" class="btn" aria-disabled="true">Compare</button>') + overviewCard
      + '<section class="cd grm-fail" role="alert" aria-labelledby="lfh"><div class="ch"><h2 id="lfh">Your markets</h2>' + st('Unavailable') + '</div><p style="font-size:13.5px"><b>The market list couldn’t be read.</b> Your markets are not lost, and they are not shown as an empty list.</p><div style="display:flex;gap:8px"><button type="button" class="btn">Try again</button></div><p class="foot">Add market still works. Filters, sort, compare and the per-row next steps return with the list.</p></section>';
    const statesB = () => crop('<span class="eye">Unavailable: record, Research and history fail separately</span><div class="grm-sg" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr)">'
      + box('(c) The record read fails', '<div role="alert" style="display:flex;flex-direction:column;gap:8px"><div>' + st('Unavailable') + '</div><p style="font-size:13.5px"><b>[Market A] couldn’t be read.</b></p><p class="mu" style="font-size:12.5px">Its parts, entry plan, localisation and the first page of history come from one read, so none of them is shown.</p><div style="display:flex;gap:8px"><button type="button" class="btn">Try again</button><a class="btn t" href="#">Back to Markets</a></div></div>', 'grm-fail')
      + box('(b) Research › Geographies fails', '<p class="mu" style="font-size:12px">The record loads; only the evidence strip says so.</p>' + partTile(MK.A, 0, null, { everr: 1 }))
      + box('(d) A later page of history fails', '<ul class="grm-hist">' + J(HIST.slice(0, 3).map(h => '<li><span class="mo">' + h[0] + '</span><span><b>' + h[2] + '</b> ' + h[3] + '</span></li>')) + '</ul><div class="nt" role="alert" style="padding:8px 10px"><span class="ic" aria-hidden="true">?</span><div>' + st('Unavailable') + ' <b>Earlier history couldn’t be read.</b><div class="mu">Only this panel is affected.</div></div></div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + '</div>', 1400);
    const statesC = () => crop('<span class="eye">Refused · Read only</span><div class="grm-sg" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">'
      + box('Refused', '<div style="display:flex;flex-direction:column;gap:8px"><div>' + st('Restricted', 'No access') + '</div><p style="font-size:13.5px"><b>You don’t have access to this venture.</b></p><p class="mu" style="font-size:12.5px">Lumen Robotics’ founder can add you as a member.</p><a class="btn" href="#" style="align-self:flex-start">Back to Grow</a></div>')
      + box('Read only · advisor member', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>You can read this venture’s markets; the founder can make you a writer.</b></div></div><div class="grm-pills">' + spill('Entering') + dpill('Enter', '2 Oct 2026') + '<span class="grm-rdl">Readiness ' + rdc(MK.A) + '</span></div><ol class="grm-plan">' + J(STEPS.slice(0, 3).map(s => '<li class="' + (s[3] === 'done' ? 'dn2' : '') + '"><span class="grm-cbr" aria-hidden="true">' + (s[3] === 'done' ? '✓' : '') + '</span><span class="grm-stx"><b>' + s[0] + '</b><small>' + s[1] + ' · due <span class="mo">' + s[2] + '</span></small></span>' + (s[3] === 'over' ? st('Overdue', 'Overdue · 4 days') : st('Done')) + '</li>')) + '</ol><p class="foot">No Add market, Edit, Change decision, Add entry step, ticks or Eadwyn proposals. Advisor-role and partner-role accounts never reach this page.</p>')
      + '</div>', 1400);
    const editForm = (err) => dlg('emh', 'Edit market · [Market C]', '<p class="raw">' + (err ? 'Not saved · your edits are kept' : 'Saving…') + '</p>',
      (err ? '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>' + err + '</b></div></div>' : '')
      + '<div class="grm-f2"><div class="fld"><label for="en">Name</label><div class="ta" id="en" style="min-height:38px' + (err && err.indexOf('already') > 0 ? ';border-color:var(--neg)' : '') + '">' + (err && err.indexOf('already') > 0 ? '[Market A]' : '[Market C]') + '</div>' + (err && err.indexOf('already') > 0 ? '<small class="grm-fe">✕ That market is already on the list</small>' : '') + '</div><div class="fld"><label for="es">State</label><div class="selb" id="es"><span>Considering</span><span aria-hidden="true">▾</span></div></div></div>'
      + '<div class="grm-f2"><div class="fld"><label for="rs">Regulation (0–10)</label><div class="ta" id="rs" style="min-height:38px;font-family:var(--mo)">6</div></div><div class="fld"><label for="rsc">Regulation source</label><div class="ta" id="rsc" style="min-height:38px' + (err && err.indexOf('source') > 0 ? ';border-color:var(--neg)' : '') + '">' + (err && err.indexOf('source') > 0 ? '' : '[Law firm A] memo, 12 Nov 2026') + '</div>' + (err && err.indexOf('source') > 0 ? '<small class="grm-fe">✕ The regulation score needs its source</small>' : '') + '</div></div>'
      + '<div class="fld"><label for="eg">Attach a country <span>· from Research › Geographies</span></label><div class="selb" id="eg"><span>[Country C]</span><span aria-hidden="true">▾</span></div></div><p class="foot">A score names where it came from.</p>',
      err ? '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Save</button>' : '<button type="button" class="btn" aria-disabled="true">Cancel</button><button type="button" class="btn p" aria-disabled="true" aria-busy="true">Saving…</button>', 520);
    const statesD = () => '<div class="cv" style="' + VARS + ';width:1700px;padding:20px;display:grid;grid-template-columns:repeat(3,520px);gap:20px;align-items:start"><div style="display:flex;flex-direction:column;gap:6px"><span class="eye">Saving</span>' + editForm(null) + '</div><div style="display:flex;flex-direction:column;gap:6px"><span class="eye">Save failed · source missing</span>' + editForm('The regulation score needs its source.') + '</div><div style="display:flex;flex-direction:column;gap:6px"><span class="eye">Save failed · duplicate name</span>' + editForm('That market is already on the list.') + '</div></div>';

    /* ---------- GR-27 phone ---------- */
    const mcard = (k) => { const m = MK[k]; return '<a href="#" class="grm-mcard"><div class="grm-ph"><b>' + m.n + '</b>' + spill(m.st) + '</div><div class="grm-mrow"><span class="eye">Readiness</span>' + rdc(m) + '</div><div class="grm-mrow"><span class="eye">Weakest</span>' + wk(m) + '</div>' + (k === 'C' ? '<div class="grm-nx">Score regulation, and say where it came from →</div>' : '') + '</a>'; };
    const pdisc = (t, v) => '<button type="button" class="disc" aria-expanded="false"><b>' + t + '</b><i aria-hidden="true">›</i><span>' + v + '</span></button>';
    const MOB = {
      GRM27A: () => phone('Markets', '<div class="raw">Lumen Robotics · 4 markets · by readiness</div><button type="button" class="btn p" style="min-height:48px">Add market</button><div class="chips" role="radiogroup" aria-label="Filter by state" style="flex-wrap:nowrap;overflow:hidden"><button type="button" role="radio" aria-checked="true">All 4</button><button type="button" role="radio" aria-checked="false">Considering 2</button><button type="button" role="radio" aria-checked="false">Entering 1</button></div>' + J(ORDER.map(mcard))),
      GRM27B: () => phone('[Market A]', '<div class="grm-pills">' + spill('Entering') + dpill('Enter', '2 Oct 2026', 1) + '</div><div class="grm-rdl">Readiness ' + rdc(MK.A, 1) + '<small>out of 40, current</small></div><button type="button" class="btn p" style="min-height:48px">Edit</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn" style="min-height:44px">Add entry step</button><button type="button" class="btn" style="min-height:44px">Change decision</button></div><section aria-label="Four parts" class="grm-pm">' + J(PARTS.map((p, i) => '<button type="button" class="grm-pmr" aria-expanded="false"><b>' + p + '</b><span class="grm-ps"><b>' + MK.A.p[i] + '</b> / 10</span><small>' + MK.A.s[i] + '</small></button>')) + '</section><section class="cd" style="padding:12px 14px"><h2 style="font-size:15px">Entry plan · 2 of 5 done</h2><ol class="grm-plan big">' + J(STEPS.slice(0, 3).map(s => stepRow(s, 1))) + '</ol></section>'),
      GRM27C: () => phone('[Market A]', '<section class="cd" style="padding:12px 14px"><h2 style="font-size:15px">Entry plan · continued</h2><ol class="grm-plan big">' + J(STEPS.slice(3).map(s => stepRow(s, 1))) + '</ol></section><section class="cd" style="padding:12px 14px"><h2 style="font-size:15px">Localisation · 1 of 3</h2><ul class="grm-loc big">' + J(LOC.map(l => '<li>' + cbx(l[1], (l[1] ? 'Done: ' : 'Tick ') + l[0], 1) + '<span><b>' + l[0] + '</b><small>' + (l[1] ? 'Ticked 12 Nov' : 'Open') + '</small></span></li>')) + '</ul></section><div>' + pdisc('Attached country', '[Country A] · [Region 1]') + pdisc('Size', '[€4.2m] EUR · [Analyst report A]') + pdisc('Replies', '2 · latest [Investor A], 6 Nov') + pdisc('History', 'Latest 12 Nov · [Founder B]') + '</div>'),
      GRM27D: () => phone('Compare', '<div class="raw">[Market A] and [Market B] · per part</div>' + J(PARTS.map((p, i) => '<section class="grm-mcmp"><b>' + p + '</b><div><span>[Market A]</span><span class="grm-ps"><b>' + MK.A.p[i] + '</b> / 10</span></div><div><span>[Market B]</span><span class="grm-ps"><b>' + MK.B.p[i] + '</b> / 10</span></div><small>' + diffWords(MK.A, MK.B, i) + '</small></section>')) + '<section class="grm-mcmp"><b>Readiness · out of 40</b><div><span>[Market A]</span>' + rdc(MK.A) + '</div><div><span>[Market B]</span>' + rdc(MK.B) + '</div><small>[Market A] leads by 5</small></section>'),
      GRM27E: () => phone('[Market A]', '<p style="font-size:13px">Entry plan · 2 of 5 done</p>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="aes"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="aes" style="font-size:17px;font-weight:800">Add entry step</h2><div class="fld"><label for="ast">Step</label><div class="ta" id="ast" style="min-height:48px">Open a local bank account</div></div><div class="fld"><label for="aso">Owner <span>· optional</span></label><div class="ta" id="aso" style="min-height:48px">[Founder A]</div></div><div class="fld"><label for="asd">Due <span>· optional</span></label><div class="ta" id="asd" style="min-height:48px;font-family:var(--mo)">4 Dec 2026</div></div><button type="button" class="btn p" style="min-height:48px">Add</button><button type="button" class="btn" style="min-height:48px">Cancel</button></div></div>')
    };

    /* ---------- GR-29 handoff ---------- */
    const handoff = () => dk('<h1>Markets · handoff</h1><p>Checked on <code>origin/main</code> 6d7712c6d1 (14 Nov 2026); the brief was written against 2ec47b843d and no Grow or Markets file changed between them. Boards GR-21 to GR-29 continue Grow v2 (GR-01 to GR-20); GR-29 is this handoff.</p>'
      + '<h2>On main and working</h2>' + tbl(['Part', 'Read or write', 'Where'], [['List: name, state, readiness, readiness_reason, weakest_part, decision, replies; filter by state; sort by readiness or name', '<code>GET /api/cycles/grow/modules/market-expansion</code>', '<code>routes/cycle_grow.ts</code>, <code>readiness()</code> in <code>services/growCycle.ts</code>'], ['Overview next step “Source the &lt;part&gt; score for &lt;market&gt;.” (first market by name with a gap)', '<code>GET /api/cycles/grow/overview</code>', '<code>marketCard</code>'], ['Record: parts with source, entry plan (30), localisation, attached country, sizing, history', '<code>…/records/:uid</code>, <code>…/records/:uid/activity</code>', '<code>services/records/grow.ts</code>'], ['Edit (state, decision, scores and sources, country from Research, size), Change decision, Add entry step, Tick a localisation check', 'record actions; <code>POST</code>/<code>PATCH /api/cycles/grow/markets</code>', '<code>services/growWriters.ts</code>'], ['Country evidence: companies, companies by market, funds, signals (country, then region), demand not_recorded', '<code>GET /api/research/geographies/:code</code>', '<code>routes/research_markets.ts</code>']])
      + '<h2>Requires engineering (◇)</h2>' + tbl(['Item', 'Why'], [['Customers or sign-ups by country', 'Prospects and customers carry no country'], ['Partners covering a market', '<code>growth_partners</code> has no market or country link'], ['WGI and FATF regulation indices', '<code>country_index_values</code> is read only by venture scoring'], ['Eadwyn proposals, drafted plans and comparisons stored on a market', 'The <code>market-entry-brief</code> skill writes a brief and stores nothing on a market'], ['Before and after values on history lines', 'The log records “Market updated” only'], ['Entry-step and localisation counts in the list read', 'Needed for a list next step beyond scoring'], ['A replies read that reports failure', '<code>marketReplies</code> swallows errors and returns none'], ['Step done, edit, remove (#6113); remove a market (#6115)', 'Not on main yet']])
      + '<h2>Pending the owner (⚑, option A drawn)</h2><p>Compare as a panel on Markets, no new route · proposals drawn on the record, Accept writes through Edit market · history shows who and when plus the current decision, before/after ◇.</p>'
      + '<h2>Frontend only</h2><p>The ranked table and phone cards, unscored rows sorted last, Not recorded wording with the missing parts, the compare panel built from the list read and two record reads, the overdue word and glyph (due date before today and not done), 44px targets, sheets on phone, dark tokens, and the handoff links that keep the venture and return to the same market.</p>'
      + '<h2>Accessibility</h2><p>One h1 per screen. States are a word plus a glyph and a border style; colour never carries meaning alone. Readiness reads “28 out of 40, current”; a Not recorded readiness reads its missing parts. Checkboxes are labelled with the step text. Failures announce as alerts; saves as status. Sheets trap and return focus. Not claimed until tested.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'GRM21') html = mpage(list(), { h: 900, rail: listRail() });
    else if (B === 'GRM22' || B === 'GRM28') html = mpage(recBody(), { h: 1540, rail: planRail() });
    else if (B === 'GRM23') html = mpage(listHead({ cmp: 'on' }) + cmpPanel('A', 'B'), { h: 900, rail: cmpRail() });
    else if (B === 'GRM23B') html = crop(cmpPanel('A', 'C'), 1100);
    else if (B === 'GRM24') html = mpage(proposals(), { h: 1010 });
    else if (B === 'GRM25') html = mpage(firstUse(), { h: 760 });
    else if (B === 'GRM25C') html = crop(addDlg(), 600);
    else if (B === 'GRM25B') html = mpage(oneMarket(), { h: 900 });
    else if (B === 'GRM26') html = statesA();
    else if (B === 'GRM26B') html = mpage(listFail(), { h: 760 });
    else if (B === 'GRM26C') html = statesB();
    else if (B === 'GRM26D') html = statesC();
    else if (B === 'GRM26E') html = statesD();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'GRM29') html = handoff();
    else html = mpage(list(), { h: 900, rail: listRail() });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
