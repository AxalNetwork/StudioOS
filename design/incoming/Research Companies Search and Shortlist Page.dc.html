      RCQ06D: () => phone(PROJ, '<div class="rcq-pt"><a href="#">Overview</a><span>Evidence · Findings · Comparisons · Brief · Study</span></div><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:16px;font-weight:800">Shortlist</h2><button type="button" class="btn p rcq-44">Add companies</button></div><div class="rcq-filt rcq-filtp" role="group" aria-label="Show"><button type="button" aria-pressed="true">All 7</button><button type="button" aria-pressed="false">Considering 4</button><button type="button" aria-pressed="false">Shortlisted 2</button></div>' + J([SUBJ[0], SUBJ[2], SUBJ[4]].map(r => pshort(r)))),
      RCQ06E: () => phone(PROJ, '<div class="rcq-pt"><a href="#">Overview</a><span>Shortlist</span></div>' + pshort(SUBJ[0], { open: true }), { sheet: psheet('[Company A Robotics]', '<dl class="rcq-sjd rcq-sjdp"><dt>Status</dt><dd>' + statusSel('Shortlisted').replace('rcq-ss', 'rcq-ss rcq-44') + '</dd><dt>Rationale</dt><dd>' + SUBJ[0][6] + '</dd><dt>Next action</dt><dd>' + SUBJ[0][7] + ' · due ' + mono(SUBJ[0][8]) + '</dd><dt>Note</dt><dd><span class="rcq-only">Only you see this</span> ' + SUBJ[0][9] + '</dd><dt>Added</dt><dd>' + mono(SUBJ[0][2]) + ' · Company · in the directory</dd></dl>', '<button type="button" class="btn" style="flex:1">Close</button><button type="button" class="btn p" style="flex:1">Edit</button>') }),
      RCQ07C: () => phone('Companies', ptop() + pcount + J(CAP.slice(1, 4).map(pcap))),
      RCQ07D: () => phone(PROJ, '<div class="rcq-pt"><a href="#">Overview</a><span>Evidence · Findings · Comparisons · Brief · Study</span></div><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:16px;font-weight:800">Shortlist</h2><button type="button" class="btn p rcq-44">Add companies</button></div>' + J([SUBJ[0], SUBJ[2], SUBJ[4]].map(r => pshort(r))))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RCQ01') html = page(capPage({ anno: anno('RCQ-01', 'RS-17 A as landed, with one new fieldset, “What it does”. Only companies with a sourced fact that supports the search are listed, each with that fact. The two counts beside them are in their own words. The search is kept in the address. Built by #7859. Eadwyn: proposes nothing here.') }), { h: 1220 });
    else if (B === 'RCQ01B') html = crop('<span class="eye">RCQ-01 · the attribute picker open</span>' + capSearch({ pick: true, attr: '', term: '' }) + '<div class="rcq-pick" role="listbox" aria-label="Attribute">' + J(ATTRS.map(a => '<div role="option" class="rcq-ao' + (a[0] === 'Use case' ? ' on' : '') + '" aria-selected="' + (a[0] === 'Use case') + '"><span>' + a[0] + '</span><small class="rcd-mo">recorded for [' + a[1] + '] of ' + DIRN + '</small></div>')) + '</div><p class="rcd-foot">The twelve attributes of RCT-07 (page 1) ' + ENGK('K6', '#7828') + '. Each count says how many records hold a sourced fact for it; it is not a market size. Use case: [47] recorded = [6] that match “inspection” + [41] that do not.</p>', 1160);
    else if (B === 'RCQ02') html = page(head() + anno('RCQ-02', 'A name search for “robotik” that also reads other names, legal names, register numbers and websites ' + ENGK('K7', '#7833') + '. A result found by any field but its name carries one line naming that field and its source. One row per company. Built by #7859.') + '<div class="rcd-srow">' + nameSearch('robotik', { k7: true }) + '</div>' + ADDR('/research/companies?q=robotik') + '<div class="rcq-cc"><p class="rcq-cc1"><b class="rcd-mo">[4]</b> companies match “robotik” <span class="mu">· one row per company · in name order</span></p></div>' + nmTable(NAMEQ) + '<p class="rcd-foot">[Müster Robotik] matched on its name, so no line is added. [Pell Industrial] matched on its website only. Today on main the search reads name and website only and would list two of these four.</p>', { h: 900 });
    else if (B === 'RCQ02B') html = crop('<span class="eye">RCQ-02 · precedence, accents and identifiers</span><div class="rcq-g3">'
      + '<section class="cd"><h3 class="rcq-h3">Which field is named</h3><ol class="rcq-ol"><li>Name (no line)</li><li>Legal name</li><li>Other name</li><li>Identifier (register number)</li><li>Website</li></ol><p class="rcq-p">When several fields match, only the first in this order is named. A company is one row, never one per field.</p></section>'
      + '<section class="cd"><h3 class="rcq-h3">Without accents ' + ENGK('K7', '#7832') + '</h3><div class="rcd-in rcd-q"><i aria-hidden="true">⌕</i><b>muster</b></div><div class="rcq-mini"><a href="#" class="rcd-lk">[Müster Robotik]</a><small>Industrial automation · [Country D]</small></div><p class="rcq-p">Case and accents are ignored on both sides. Today “muster” finds nothing: LOWER folds ASCII only.</p></section>'
      + '<section class="cd"><h3 class="rcq-h3">By register number ' + ENGK('K7', '#7833') + '</h3><div class="rcd-in rcd-q"><i aria-hidden="true">⌕</i><b>[HRB 000123]</b></div><div class="rcq-mini"><a href="#" class="rcd-lk">[Ostbrück Automation]</a><div class="rcq-mon"><span class="rcq-monk">Matched on identifier:</span> <b>[Register A] [HRB 000123]</b> · source [Register A]</div></div><p class="rcq-p">The register is named with the number; a number alone is never shown.</p></section></div>', 1160);
    else if (B === 'RCQ03') html = page(capPage({ menu: true, annoTop: anno('RCQ-03', 'Saved searches for Companies, in a menu beside “Copy link to these results” ' + FLAG('Q9 · A') + ' ' + ENGK('K8', '#7860') + '. A saved search keeps criteria, never results. Built by #7860.'), focus: null }) .replace('<div class="acts">', '<div class="acts" style="position:relative">').replace('Copy link to these results</button></div></header>', 'Copy link to these results</button>' + menu({ foc: 0 }) + '</div></header>'), { h: 1220 });
    else if (B === 'RCQ03B') html = crop('<span class="eye">RCQ-03 · save, rename and delete</span><div class="rcq-g3">'
      + '<section class="cd rcq-dlg" role="dialog" aria-labelledby="sv"><h3 class="rcq-h3" id="sv">Save this search</h3><label class="rcd-f"><span>Name</span><span class="rcd-in"><b>[Inspection robotics]</b></span></label><div class="rcq-crit"><b>Criteria kept</b><span>Use case: inspection</span><span>Country: [Country A]</span><small>Results are not kept. Opening it reads the directory again.</small></div><div class="rcq-dbt"><button type="button" class="btn t">Cancel</button><button type="button" class="btn p">Save</button></div><p class="rcq-ok">' + G.ok + 'Saved: [Inspection robotics] · 4 of 20</p></section>'
      + '<section class="cd rcq-dlg"><h3 class="rcq-h3">Rename</h3><label class="rcd-f"><span>Name</span><span class="rcd-in"><b>[Grid storage peers 2018+]</b></span></label><div class="rcq-dbt"><button type="button" class="btn t">Cancel</button><button type="button" class="btn">Rename</button></div><p class="rcq-p">Created ' + mono('5 Nov 2026') + ' stays. Criteria do not change.</p><h3 class="rcq-h3" style="margin-top:6px">At the cap</h3><p class="rcq-p">' + chip('rf', 'Refused') + ' You have <b>20 of 20</b> saved searches. Delete one to save another. Nothing was saved.</p></section>'
      + '<section class="cd rcq-dlg"><h3 class="rcq-h3">Delete · review</h3><p class="rcq-p">Delete <b>[Grid storage peers]</b>? Only the saved criteria go. No company, project or shortlist changes.</p><div class="rcq-dbt"><button type="button" class="btn t">Keep it</button><button type="button" class="btn rcq-del">Delete</button></div><h3 class="rcq-h3" style="margin-top:6px">Result</h3><p class="rcq-ok">' + G.ok + 'Deleted [Grid storage peers] · 2 of 20 left</p></section></div>', 1160);
    else if (B === 'RCQ03C') html = crop('<span class="eye">RCQ-03 · opening a search whose criterion no longer exists</span><section class="cd rcq-dlg" role="alertdialog" aria-labelledby="gn" style="max-width:640px"><h3 id="gn" style="font-size:15px;font-weight:800">[Grid storage peers] needs a choice before it runs</h3><p class="rcq-p">The criterion <b>Sector label: Energy storage</b> is no longer offered by the directory. Nothing has run yet.</p><div class="rcq-crit"><b>Criteria saved ' + mono('5 Nov 2026') + '</b><span class="rcq-gone">' + G.x + 'Sector label: Energy storage · no longer offered</span><span>Founded 2018 – 2026</span></div><div class="rcq-dbt"><button type="button" class="btn t">Cancel</button><button type="button" class="btn">Edit the search</button><button type="button" class="btn p">Run without it</button></div><p class="rcd-foot">The saved search is not changed until you save it again. Run without it reads the directory with the criteria that remain.</p></section>', 1160);
    else if (B === 'RCQ04') html = page(anno('RCQ-04', 'Only the Shortlist panel is new. The page around it is cited in grey and not redrawn. Each subject: name, kind, date added and state (recorded); rationale, a private note, status, next action and due date, edited in place ' + ENGK('K9', '#7818') + '. Built by #7850. Eadwyn: proposes nothing here.') + overview(), { h: 1500, cur: 'My Research' });
    else if (B === 'RCQ04B') html = crop('<span class="eye">RCQ-04 · editing one subject in place</span><section class="cd rcq-panel"><ul class="rcq-sjl"><li class="rcq-sj rcq-edit"><div class="rcq-sj1"><div class="rcq-sjn"><a href="#" class="rcd-lk">[Halden Grid]</a><span class="rcq-kind">Company</span><span class="rcq-add">added ' + mono('12 Nov 2026') + '</span></div></div>'
      + '<div class="rcq-ef"><label class="rcd-f"><span>Rationale</span><span class="rcd-in rcq-ta">[Thermal inspection overlaps our site audits]</span></label><label class="rcd-f"><span>Note · <span class="rcq-only">Only you see this</span></span><span class="rcd-in rcq-ta">[Ask whether they license the thermal model]</span></label>'
      + '<div class="rcq-er"><fieldset class="rcd-f"><legend>Status ' + FLAG('Q5 · A') + '</legend><div class="rcq-seg" role="radiogroup"><button type="button" role="radio" aria-checked="true">Considering</button><button type="button" role="radio" aria-checked="false">Shortlisted</button><button type="button" role="radio" aria-checked="false">Set aside</button></div></fieldset><label class="rcd-f" style="flex:1"><span>Next action</span><span class="rcd-in"><b>[Book a call with their site team]</b></span></label><label class="rcd-f" style="width:150px"><span>Due date <em class="rcq-opt">optional</em></span><span class="rcd-in rcd-mo">2 Dec 2026</span></label></div>'
      + '<div class="rcq-dbt" style="justify-content:flex-start"><button type="button" class="btn p bsm">Save</button><button type="button" class="btn t bsm">Cancel</button><span class="rcq-pcn">Saves this subject only ' + ENGK('K9', '#7818') + '</span></div></div></li></ul></section>', 1000);
    else if (B === 'RCQ05') html = crop('<span class="eye">RCQ-05 · states, each with a word and a glyph</span><div class="rcq-sg">'
      + box('Loading · fact search', skelRows(3))
      + box('Loading · shortlist', '<section class="cd" aria-busy="true"><div class="rcd-skh">' + chip('ld', 'Loading the shortlist') + '</div>' + J([1, 2, 3].map(i => '<div class="rcd-sk"><i style="width:' + (130 + i * 20) + 'px"></i><i style="width:80px"></i><i style="width:200px"></i></div>')) + '</section>')
      + box('Empty · no business facts in the catalogue', emptyFacts)
      + box('Empty · no saved search', emptySaved)
      + box('Empty · nothing on the shortlist', emptyShort)
      + box('Not recorded · no rationale, no next action', nrBox)
      + box('Unavailable · the fact search failed', capUn)
      + box('Unavailable · notes failed, subjects stay', notesUn)
      + box('Refused · an Advisor has no project route', refusedP)
      + box('Archived project · read-only', '<section class="cd"><div class="rcq-band">' + G.rf + '<span><b>Archived · read-only.</b> Restore the project to edit the shortlist.</span></div><ul class="rcq-sjl">' + subj(SUBJ[0], { ro: true }) + '</ul></section>')
      + '</div>', 1440);
    else if (B === 'RCQ05B') html = crop('<span class="eye">RCQ-05 · saving and save failed</span><div class="rcq-g3">'
      + '<section class="cd"><h3 class="rcq-h3">Saving</h3><div class="rcd-in rcq-ta" aria-busy="true">[Book a call with their site team]</div><p class="rcq-pcn">' + chip('ld', 'Saving') + ' Fields stay editable; Save is off until the Worker answers.</p></section>'
      + '<section class="cd" role="alert"><h3 class="rcq-h3">Save failed</h3><div class="rcd-in rcq-ta">[Book a call with their site team]</div><p class="rcq-p">' + chip('un', 'Not saved') + ' The shortlist did not answer. Your text is kept here. ' + retry('Try again') + '</p></section>'
      + '<section class="cd" role="alert"><h3 class="rcq-h3">Changed elsewhere · refused</h3><p class="rcq-p">' + chip('rf', 'Refused') + ' This note was changed in another tab at ' + mono('14:06') + '. Nothing was saved. Your text is kept below; copy it, then load the newer note.</p><div class="rcd-in rcq-ta">[Ask whether they license the thermal model]</div><div class="rcq-dbt" style="justify-content:flex-start"><button type="button" class="btn bsm">Load the newer note</button></div></section></div>', 1160);
    else if (B === 'RCQ06') html = tablet();
    else if (B === 'RCQ07') html = page(capPage({}), { h: 1110 });
    else if (B === 'RCQ07B') html = page(overview(), { h: 1440, cur: 'My Research' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(capPage({}), { h: 1180 });
    return { html: { __html: html } };
  }
}

</script>
