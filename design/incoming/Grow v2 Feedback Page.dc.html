      GRF29D: () => phone('Route replay', '<div class="raw">Shipped 2 Nov · 1 of 5 told</div>' + J(LOOP.slice(1, 5).map(r => '<label class="mc grf-pl2"><span class="grf-ck on big" role="checkbox" aria-checked="true">✓</span><span><b>' + r[0] + '</b><small>' + r[1] + '</small>' + (r[2] ? '<a href="#">Write email ↗</a>' : '<span class="grf-ne">No email recorded</span>') + '</span>' + st('Due') + '</label>')) + '<div class="mc grf-pl2 grf-dis"><span class="grf-ck off big" aria-hidden="true"></span><span><b>Ola Dahl</b><small>Did not ask to be told</small></span></div>', '<div class="grf-stk"><div style="display:flex;gap:10px;align-items:center"><b style="white-space:nowrap">4 selected</b><button type="button" class="selb" style="min-height:44px;flex:1" aria-haspopup="listbox"><span>How you told them: Call</span><span aria-hidden="true">▾</span></button></div><button type="button" class="btn p" style="min-height:48px">◇ Mark 4 told</button></div>')
    };

    /* ---------- handoff ---------- */
    const handoff = () => dk('<h1>Feedback v2 · handoff</h1><p>Continues Grow v2 (#4861) from GR-21. Checked against <code>origin/main</code> 6d7712c6d1 on 14 Nov 2026 (the brief was written against 45e7c55fa6; no feedback code changed between them).</p>'
      + '<h2>What GR-06 draws and what this canvas adds</h2>' + tbl(['Already on Grow v2', 'Added here'], [['GR-06: Customers header, tab row Pipeline · Accounts · Feedback, the Pipeline body', 'GR-21 Feedback tab body, Add feedback sheet, theme placement review'], ['GR-04: Feedback is a Customers tab', 'GR-22 one item with the customer panel, link sheet and Mark told'], ['GR-02 rail: “Theme for 4 unthemed feedback items · Review”; GR-11 review dialog', 'GR-21C the same dialog for a theme placement; GR-23 theme weight; GR-24/25 Save as feedback; GR-26 close the loop; GR-27 empty; GR-28 states; GR-29 phone; GR-30 dark']])
      + '<h2>Checked on main</h2>' + tbl(['Store / route', 'What it showed'], [['<code>routes/cycle_grow.ts</code> recordsFor(product-improvement)', 'List: uid, body, source, theme, roadmap item, status, from_name (writers only), created_at. Filters Source, Theme, Status; sorts Newest, Oldest, Theme. No told state, email, company or shipped date in the list.'], ['<code>services/records/grow.ts</code> productImprovement', 'Record: pills status + theme or “No theme”; facts Source, Theme (“No theme yet”), Roadmap item (“Not linked to a roadmap item”), Status. Sections Theme (count by status), Closing the loop (writers, only when notify_on_ship), Customer (side, writers; Plan = recurring revenue under the exact company name in the last 60 days). Actions Change theme, Mark told (shipped + asked + not told), Edit.'], ['<code>services/growWriters.ts</code> markFeedbackTold', 'Refuses “Nobody asked to be told…” and “Mark it told once it has shipped”; records told_at and told_via (email, call, message, in_person); returns a mailto: draft when an email exists. One item at a time.'], ['<code>services/fills/registry.ts</code> feedback_theme', 'Places unthemed items only into themes already named; never names one.'], ['<code>sql/migrations/443, 462</code>', 'product_feedback has from_name, from_email, from_company, notify_on_ship, told_at, told_via; no contact_id and no origin column.'], ['<code>routes/grow_inbox.ts</code>, <code>routes/contacts.ts</code>', 'Inbox reads replies (contact_replies) and cannot send; no Save as feedback.'], ['<code>sql/migrations/438</code> interview_session_marks', 'label is nullable, so marks without a label exist.']])
      + '<h2>Backend required (◇)</h2>' + tbl(['Item', 'Boards'], [['Customer link: product_feedback → contacts (owner question 1, option A)', 'GR-21, 22, 23, 24, 25, 29'], ['Origin column (Inbox reply, Interview, Notion, PostHog survey, Typed)', 'GR-21, 22, 24, 25'], ['Told state in the list read (notify_on_ship, told_at, told_via, from_email, shipped_on)', 'GR-21 count, GR-26'], ['Theme weight read: distinct people, records, ledger revenue last 60 days (owner question 2, option A)', 'GR-21, 23, 29B'], ['Save as feedback from an Inbox reply and an interview note, through POST /feedback', 'GR-24, 25, 27, 29C'], ['Mark told for several items at once', 'GR-26, 29D']])
      + '<h2>Frontend only</h2><p>The tab body layout, counts strip, theme column, feedback rows, Add feedback sheet (existing POST), record view layout over the existing record read, Change theme and single Mark told, the empty state, loading and unreadable states, read-only for advisors, phone and dark tokens. /grow/product-improvement opens the Customers › Feedback tab with record links unchanged (owner question 3, option A).</p>'
      + '<h2>Handoffs</h2><p>A linked customer opens Pipeline/Accounts with the item named. A roadmap item opens /build/roadmap with the theme carried. Closing the loop returns to the theme with the told count updated.</p>'
      + '<h2>Accessibility</h2><p>One h1 per screen. The theme column is a list of links with aria-current on the selected theme. Every status pairs a word with a shape. Checkboxes are real checkboxes with names; disabled rows say why in text. Sheets trap focus and return it; Saved and Marked messages are polite status, failures are alerts. Phone targets are 44px or more. Not claimed until tested.</p>'
      + '<h2>Open questions</h2><p>All three owner questions are drawn as option A. Whether Mark told for several people opens one draft per person or none is left open: GR-26 keeps a Write email link per row.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'GRF21' || B === 'GRF30') html = page(feedbackTab(), { h: 1120, rail: 'active' });
    else if (B === 'GRF21B') html = page(feedbackTab(), { h: 1120, rail: 'active', overlay: addSheet() });
    else if (B === 'GRF21C') html = crop(reviewDlg(), 700);
    else if (B === 'GRF22') html = page(rec1(), { h: 780, rail: false });
    else if (B === 'GRF22B') html = page(rec2(), { h: 780, rail: false });
    else if (B === 'GRF22C') html = linkSheet();
    else if (B === 'GRF23') html = page(weight(false), { h: 1000, rail: false });
    else if (B === 'GRF24') html = page(inbox(false), { h: 900, cur: 'Distribution', rail: false, overlay: saveSheet({ from: 'Kai Mori’s reply · 22 Oct', q: 'Honestly, what would get us over the line is a CSV of each depot’s routes every Monday, so our planners can work in Excel.', who: 'Kai Mori', email: 'kai@kite.example', co: 'Kite Systems', link: 1, rec: 'Pipeline · Talking', theme: 'Fleet CSV export', origin: 'Inbox reply' }) });
    else if (B === 'GRF24B') html = page(inbox(true), { h: 900, cur: 'Distribution', rail: false, overlay: saveSheet({ done: 1, from: 'Kai Mori’s reply · 22 Oct', q: 'Honestly, what would get us over the line is a CSV of each depot’s routes every Monday, so our planners can work in Excel.', who: 'Kai Mori', email: 'kai@kite.example', co: 'Kite Systems', link: 1, rec: 'Pipeline · Talking', theme: 'Fleet CSV export', origin: 'Inbox reply' }) });
    else if (B === 'GRF25') html = page(interview(), { h: 900, area: 'Validate', rail: false, overlay: saveSheet({ from: 'Interview · Hanne Vik · 30 Oct', q: 'If I could get a file per depot every Monday I’d stop doing this by hand. That alone would be worth paying for.', consent: '<div class="grf-orow"><span class="eye">Quote consent</span>' + st('Shipped', 'Yes') + '<span class="raw">recorded on the interview</span></div>', who: 'Hanne Vik', email: '<span style="color:var(--mu)">Not recorded</span>', co: 'Ostra Depot AS', link: 0, theme: 'Fleet CSV export', origin: 'Interview' }) });
    else if (B === 'GRF26') html = page(closeLoop(false), { h: 820, rail: false });
    else if (B === 'GRF26B') html = page(closeLoop(true), { h: 820, rail: false });
    else if (B === 'GRF26C') html = loopRoadmap();
    else if (B === 'GRF27') html = page(empty(), { h: 820, rail: 'empty' });
    else if (B === 'GRF27B') html = page(firstSave(), { h: 820, rail: 'first' });
    else if (B === 'GRF28') html = states();
    else if (B === 'GRF28B') html = page(feedbackTab({ ro: 1 }), { h: 980, rail: false });
    else if (B === 'GRF28C') html = page(weight(true), { h: 1000, rail: false });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'GRF31') html = handoff();
    else html = page(feedbackTab(), { h: 1080, rail: 'active' });
    return { html: { __html: html } };
  }
}

</script>
