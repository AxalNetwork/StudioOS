    const HAND = () => `<div style="padding:32px 36px;display:flex;flex-direction:column;gap:20px;background:var(--bg)"><div style="display:flex;flex-direction:column;gap:6px">${EB('SAQ-H · handoff · #8832 for #5570 · continues HQ AI Agents (D4137), boards SA32–SA37')}<h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em">Compute capacity · what is on main, what is not</h1><p style="margin:0;font-size:13px;color:var(--mut)">Checked on main ${C('d26a93a252')}, ${DAY}. Decision file: ${C('D4137-p6.md')}, beside D4137 (SA25–SA31 are #8823’s, ${C('D4137-p5.md')}; if that lands later or not at all, these ids stay and the landing takes the next free part). <b>No route serves any admission field today:</b> every ◇ value exists in code or storage only.</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 28px">${CARD('', HROW('Checked on main · real', [
      `${C('durable-objects/workspace-admission.ts')}: the ${C('WorkspaceAdmission')} object, bound as ${C('WORKSPACE_ADMISSION')} in ${C('wrangler.toml')}; ${C('COORDINATOR_LIMITS')} = halted false, 1 running and 10 waiting per venture, 100 waiting, ${C('per_provider_running')} and ${C('per_region_running')} empty, so no lease is admitted (SA34a). Its ${C('/op')} answers only request, settle, withdraw and the swarm ops: there is no ${C('planning')} op.`,
      `${C('services/agents/workspaceAdmission.ts')}: slot fields (${C('run_uid, tenant_id, agent_id, provider, region, state, generation, enqueued_at, admitted_at, lease_expires_at, compute_reserve_microusd, cancel_requested, settlement')}); ${C('planning()')} returns registered (or ${C('unavailable')}), simultaneous executions, limit, waiting and ${C('by_region')}. Missing metrics charge the reserve with ${C('measured: false')}.`,
      `${C('services/agents/workspacePlacement.ts')}: six cost lines, ${C('unavailable')} without a rate card; deny network = egress 0; ${C('reserve_basis')} quote or ${C('spec_ceiling')}; reasons ${C('consent … over_budget')}. Pure: no store, no route.`,
      `${C('workspaceAdmissionStore.ts')}: one key ${C('workspace-admission-v1')} in DO storage.`,
      `Correction to the brief: since #8686 (D5585-p13) ${C('workGraphReleaseAdmin.ts')} calls the client’s ${C('swarmSnapshotFor')} for one venture’s render admissions. No compute-lease field is read by any route.`,
      `D1: ${C('team_agents')} (not removed); ${C('agent_task_runs')} admitted/running; ${C('ai_agent_policy.paused*')}, ${C('workspace_agents_cap')}, ${C('workspace_live_agents_cap')} (D8071); ${C('swarm_admission_events')} with ${C('charged_microusd, measured, outcome, code')} (${C('no_capacity, venture_capacity, budget_exhausted')} …).`,
      `Routes: ${C('GET /api/admin/ai-agents/policy')} (paused, client ${C('adminAiAgentsApi.policy()')}); ${C('GET …/policy/budgets')} (platform ceilings; agents list ${C('LIMIT 500')}; no client method); ${C('GET /api/admin/ai-agents/runs/:uid')} (client ${C('run(uid)')}, SA7).`,
      `Frontend: ${C('App.jsx')} has ${C('/hq/ai-agents/operations')}, ${C('/spend')}, ${C('/policies')}, ${C('/audit')}; no ${C('/compute')}.`]), { pad: '16px 18px' })}${CARD('', HROW('Backend required · ◇ #8832 / #5570', [
      `An authenticated Super Admin read route over the coordinator: ${C('planning()')} plus per-provider, per-venture and reconciling counts and the lease list (SA32, SA33). It needs a new coordinator op.`,
      `A stored record of provider and region caps and the admission halt (D5586-p3 §5), and the write route to set caps (SA32 “Set provider caps”, SA34a).`,
      `A stored rate card per provider (SA33 quote lines); store ${C('reserve_basis')} on the slot.`,
      `Store compute-lease refusals with their reason (${C('admission_halted, admission_queue_full, tenant_queue_full')}, placement reasons).`,
      `Provider health (Healthy · Degraded · Down · Unknown); a platform-wide count of registered and live agents (the budgets read lists 500).`,
      `#5570 metrics: queue wait, start p50/p95, errors, cost per success, 7 days, and alert thresholds (SA32 muted row).`,
      `A route for ${C('admission.withdraw')} (SA33 “Withdraw this run”); client methods for all of these and for ${C('GET …/policy/budgets')}.`]), { pad: '16px 18px' })}${CARD('', HROW('Owner questions · ⚑ drawn as A', [
      'Q1 Where it lives: <b>A) a new Compute view at /hq/ai-agents/operations/compute</b> beside Runs, Spend, Policies and Audit · B) a section under Runs · C) HQ › Platform (D4559).',
      'Q2 A venture sees its own containers: <b>A) not now; HQ only</b>, the team sees run capacity on #7078’s card · B) one line on that card.',
      `Q3 Compute admission halt: <b>A) the AI agents pause also halts compute admission, one switch</b> (today ${C('COORDINATOR_LIMITS.halted')} is a constant, not tied to the pause ◇) · B) a separate halt here.`]), { pad: '16px 18px' })}${CARD('', HROW('Acceptance mapped to boards', [
      'Owner-approved canvas landed in design/incoming/ → this canvas, SA32–SA37 and SAQ-H, with ' + C('D4137-p6.md') + '.',
      'Every number maps to a recorded field or says Not recorded → SA32 (each value carries ◇ and its field above), SA33 (lease and settlement fields), SA35 Not recorded and Unreadable, SA34a (no caps today).',

      '1,000 registered agents distinct from 1,000 containers → the two tiles, never summed, “Registered agents hold no capacity” (SA32, SA36).']), { pad: '16px 18px' })}${CARD('', HROW('Frontend only', ['The Compute sub-tab and route; tiles, tables, meters and state words (■ Full, No cap set with a lock, ◌ Unavailable, ○ Not recorded yet, ? Unreadable, ⊘ Refused, ↻ Reconciling).', 'Paused banner reads the existing policy; tables dim but stay readable (SA35E).', 'Eadwyn (#5130) summarises and drafts a note: accept, edit, discard; it changes nothing.', 'Phone 390 with 44 px targets: cards, no table wider than the screen; the lease opens as a full-height sheet.']), { pad: '16px 18px' })}${CARD('', HROW('Handoffs', ['A run row → SA7 run detail (the lease is keyed by the engine’s run uid, so the uid travels).', 'A venture row → that team’s Agents engine card for its run capacity: <b>#7078</b>, pending its canvas; drawn as a disabled ◇ “Team run capacity (coming)”. This view draws no fixed/elastic or sub-agent control.', 'The agents caps → Spend › Agent budgets (SA15).', 'The pause banner → Policies (the kill switch).', 'Sibling #8823 (SA25–SA31, workflow run timeline): the same eight agents; run uids follow SA7.']), { pad: '16px 18px' })}</div><div style="display:flex;flex-direction:column;gap:6px">${EB('Accessibility')}<span style="font-size:13px;line-height:1.55;color:var(--body)">Each holding / cap is ${C('role="meter"')} named “holding of cap, full”. Every state has a word and a glyph; colour never carries it alone. The lease panel is a dialog: focus moves to its title and back to the row on close. Unreadable areas are announced as alerts; Refresh results politely. Phone targets are 44 px.</span></div></div>`;

    /* ---------- frames ---------- */
    const split = (h) => { const i = h.indexOf('|SIDE|'); return i < 0 ? [h, ''] : [h.slice(0, i), h.slice(i + 6)]; };
    const PAGE = (h, o) => { o = o || {}; const [m, s] = split(h); return SHELL(m, Object.assign({}, o, { side: s })); };
    const OVER = (h, panel, H) => `<div style="position:relative;height:${H}px;overflow:hidden">${PAGE(h, { h: H })}<div aria-hidden="true" style="position:absolute;inset:0;z-index:5;background:rgba(17,24,39,.32)"></div><div style="position:absolute;top:0;right:0;bottom:0;z-index:6;display:flex">${panel}</div></div>`;
    let fr;
    if (B === 'SA32') fr = { w: 1440, h: 2170, html: PAGE(SA32B(), { h: 2170 }) };
    else if (B === 'SA33') fr = { w: 1440, h: 1180, html: OVER(SA32B(), PANEL({ waiting: 1 }), 1180) };
    else if (B === 'SA33B') fr = { w: 1440, h: 1180, html: OVER(SA32B(), PANEL({}), 1180) };
    else if (B === 'SA34') fr = { w: 1440, h: 1240, html: PAGE(SA34A(), { h: 1240 }) };
    else if (B === 'SA34B') fr = { w: 1440, h: 760, html: PAGE(SA34Bb(), { h: 760 }) };
    else if (B === 'SA35') fr = { w: 1440, h: 1300, html: PAGE(SA32B({ load: 1, norail: 1 }), { h: 1300 }) };
    else if (B === 'SA35B') fr = { w: 1440, h: 1000, html: PAGE(NRV(), { h: 1000 }) };
    else if (B === 'SA35C') fr = { w: 1440, h: 1000, html: PAGE(SA32B({ unr: 1, norail: 1 }), { h: 1000 }) };
    else if (B === 'SA35D') fr = { w: 1440, h: 560, html: PAGE(REFV() + '|SIDE|' + RAILC, { h: 560 }) };
    else if (B === 'SA35E') fr = { w: 1440, h: 2170, html: PAGE(SA32B({ paused: 1, norail: 1 }), { h: 2170 }) };
    else if (B === 'SA35F') fr = { w: 1440, h: 300, html: FULLROW() };
    else if (B === 'SA35G') fr = { w: 1440, h: 640, html: PSTATES() };
    else if (B === 'SA36') fr = { w: 390, h: 1600, html: PH36() };
    else if (B === 'SA36B') fr = { w: 390, h: 1180, html: PH36B() };
    else if (B === 'SA37') fr = { w: 1440, h: 2170, html: PAGE(SA32B(), { h: 2170 }) };
    else if (B === 'SA37B') fr = { w: 390, h: 1600, html: PH36() };
    else if (B === 'SAQH') fr = { w: 1200, h: 0, html: HAND() };
    else fr = { w: 1440, h: 2170, html: PAGE(SA32B(), { h: 2170 }) };
    const html = `<div style="${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased">${fr.html}</div>`;
    return { html: { __html: html } };
  }
}
