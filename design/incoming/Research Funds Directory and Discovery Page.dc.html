.st-tw{display:flex;flex-direction:column;gap:6px;min-width:0}

.st-tv{font:800 26px var(--mo);letter-spacing:-.03em;line-height:1.1;color:var(--ink)}

.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}
.st-foot2 b{color:var(--ink)}
/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.st-list li:first-child{border-top:0}

.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.st-lbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-lbh b{font-size:14px}
.st-cnt{font:700 11px var(--mo);padding:1px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);color:var(--ink)}
.st-none{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:9px;background:var(--raised);font-size:13px}
.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}
.st-unbox{border:1.5px dashed var(--hair2);background:var(--card)}

.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st-chh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-chh b{font-size:14px}
.st-ch svg{font-family:var(--sg)}
.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}
.st-ch2 h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st-comp .st-tile{background:var(--raised)}
.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}
.st-prov{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:500 11.5px var(--mo);color:var(--mu)}
/* phone */
.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}
.st-plist{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}
.st-plist>div:first-child{border-top:0}
.st-plist span{font-size:12.5px}
/* do / don't */
.st-dd{display:flex;flex-direction:column;gap:8px}
.st-ddt{font:800 14px var(--sg)}
.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}
.st-do .st-ddl{color:var(--pos)}
/* options */
.st-opt{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.st-opt p{font-size:12.5px;line-height:1.55;color:var(--mu)}
.st-opt b{font-size:15px}
.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}

.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}
/* Sign In v2 (#6956) — SGN boards. Self-contained; reuses the AuthShell / authV2 values. */
.sgn{--ink:#241f38;--mu:#6b6577;--hair:#e8e6ee;--vi:#7c3aed;--vd:#6d28d9;--lav:#f4f0fe;--lave:#ddd0fb;--mo:'Roboto Mono',ui-monospace,monospace;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.45;position:relative}
.sgn,.sgn *{box-sizing:border-box}
:where(.sgn) :where(h1,h2,h3,p,ul,ol){margin:0;padding:0}
:where(.sgn) :where(ul,ol){list-style:none}
.sgn button{font-family:inherit;cursor:pointer}
.sgn a{color:var(--vd);text-decoration:none}
.sgn-mo{font-family:var(--mo)}
/* scene */
.sgn-scene{overflow:hidden;background-color:#3b2f5c;background-size:cover;background-position:center;background-repeat:no-repeat}
.sgn-ph.sgn-scene{background-position:63% center}
.sgn-scrim{position:absolute;inset:0;background:rgba(36,31,56,.34)}
.sgn-scrim.sgn-scm{background:rgba(20,16,36,.32)}
.sgn-scrim.sgn-sch{background:rgba(20,16,36,.16)}
.sgn-hd{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 32px;z-index:2}
.sgn .sgn-wm{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:#fff}
.sgn-mk{width:24px;height:24px;border-radius:7px;background:var(--vi);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.sgn-pn{font:500 10px var(--mo);letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.sgn-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px;z-index:1}
.sgn-card{position:relative;width:400px;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:0 18px 50px rgba(20,16,36,.30);padding:28px 30px 24px}
.sgn-card.flat{box-shadow:0 2px 14px rgba(36,31,56,.07);width:100%}
.sgn-h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;outline:none}
.sgn-h1.sm{font-size:20px}
.sgn-sub{margin-top:8px;font-size:13.5px;line-height:1.5;color:#3d3650}
.sgn-sub.sgn-mu,.sgn-mu{color:var(--mu)}
.sgn-addr{font-weight:700;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.sgn-eyec{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mo);color:var(--mu);margin-bottom:10px}
.sgn-dest{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin:0 0 8px}
.sgn-dest b{color:var(--ink);font-weight:600}
/* buttons */
.sgn-stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sgn-rel{position:relative}
.sgn-side{position:absolute;left:calc(100% + 40px);top:12px;white-space:nowrap}
.sgn-b{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;width:100%;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--hair);background:#fff;color:var(--ink);padding:0 16px;white-space:nowrap}
.sgn-b svg{flex:none}
.sgn-b.pri{background:var(--vi);border-color:var(--vi);color:#fff}
.sgn-b.apl{background:#000;border-color:#000;color:#fff;font-family:-apple-system,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:16px;letter-spacing:-.01em}
.sgn-b.apl svg{margin-top:-3px}
.sgn-b.ggl{background:#fff;border-color:#747775;color:#1f1f1f;font-family:Roboto,Arial,sans-serif;font-weight:500;font-size:14.5px;letter-spacing:.01em}
.sgn-b.sec{background:#fff;border-color:var(--hair);color:var(--ink);font-size:14px}
.sgn-b[aria-disabled]{opacity:.55;cursor:not-allowed}
.sgn-b.sgn-fr{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--vi)}
.sgn-pill{border-radius:999px;height:52px;font-size:16px;box-shadow:0 8px 24px rgba(20,16,36,.35)}
.sgn-quiet{margin-top:18px;padding-top:12px;text-align:center;font-size:13.5px;color:var(--mu)}
.sgn .sgn-ql{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:#c9c4d6;text-underline-offset:3px}
.sgn-back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--mu);background:none;border:0;padding:8px 8px 8px 0;margin:-8px 0 8px;min-height:44px}
.sgn-links{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:16px;font-size:13px;color:#c0bccb}
.sgn .sgn-lk{color:var(--vd);font-weight:600}
.sgn-fine{margin-top:12px;font-size:12px;color:var(--mu);text-align:center;line-height:1.5}
/* method rows */
.sgn-meth{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sgn-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px 12px 12px 12px;color:var(--ink);min-height:64px}
.sgn-row>svg{color:#a19cb0;flex:none}
.sgn-rt{width:36px;height:36px;border-radius:9px;background:var(--lav);color:var(--vd);display:grid;place-items:center;flex:none}
.sgn-rx{display:flex;flex-direction:column;min-width:0;flex:1}
.sgn-rx b{font-size:14.5px;font-weight:700}
.sgn-rx small{font-size:12.5px;color:var(--mu);margin-top:1px}
/* fields */
.sgn-form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.sgn-lbl{display:block;font:500 10px var(--mo);letter-spacing:.11em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.sgn-in{position:relative;height:46px;border:1px solid var(--hair);border-radius:10px;padding:0 14px;display:flex;align-items:center;font-size:14.5px;background:#fff;color:var(--ink);white-space:nowrap;overflow:hidden}
.sgn-in.sgn-pc{color:#a1a1aa}
.sgn-in.foc{border-color:var(--vi);box-shadow:0 0 0 3px rgba(124,58,237,.22)}
.sgn-in.err{border-color:#b91c1c;box-shadow:0 0 0 3px rgba(185,28,28,.12)}
.sgn-in.sgn-code{font:600 21px var(--mo);letter-spacing:.42em;justify-content:center;padding-right:70px;padding-left:70px}
.sgn-caret{display:inline-block;width:1.5px;height:20px;background:var(--vi);margin-left:1px}
.sgn-pst{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:7px;font:600 11.5px 'Space Grotesk',sans-serif;letter-spacing:0;color:var(--mu);background:#fff}
.sgn-help{margin-top:6px;font-size:12px;color:var(--mu)}
.sgn-help.sgn-he{color:#b91c1c}
/* Turnstile placeholder */
.sgn-ts{display:flex;justify-content:space-between;align-items:center;height:56px;border:1px dashed #c9c4d6;border-radius:8px;background:#fafafa;padding:0 12px;font-size:13px}
.sgn-ts.sgn-tf{border-color:#fcd34d;background:#fffbeb;color:#92400e}
.sgn-tsb{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sgn-tsbox{width:22px;height:22px;border:2px solid #9ca3af;border-radius:4px;background:#fff}
.sgn-tsok{width:22px;height:22px;border-radius:50%;background:#047857;color:#fff;display:grid;place-items:center}
.sgn-tsn{font:500 9.5px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:#9ca3af;white-space:nowrap}
/* banners */
.sgn-bn{display:flex;gap:9px;align-items:flex-start;margin-top:14px;border:1px solid;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.sgn-bn svg{flex:none;margin-top:1px}
.sgn-bn>div{flex:1;min-width:0}
.sgn-bn.sgn-bn-err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.sgn-bn.sgn-bn-ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.sgn-bn.sgn-bn-info{background:var(--lav);border-color:var(--lave);color:#4c1d95}
.sgn-bn.sgn-bn-warn{background:#fffbeb;border-color:#fcd34d;color:#92400e}
.sgn-bnx{margin-top:10px}
.sgn-bnx .sgn-b{height:42px;font-size:13.5px}
/* waiting */
.sgn-big{width:52px;height:52px;border-radius:14px;background:var(--lav);color:var(--vd);display:grid;place-items:center;margin-bottom:14px}
.sgn-big.sgn-bok{background:#ecfdf5;color:#047857}
.sgn-big.sgn-bapl{background:#000;color:#fff}
.sgn-big.sgn-bggl{background:#fff;border:1px solid #dadce0}
.sgn-big svg{width:26px;height:26px}
.sgn-wait{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;height:48px;border-radius:10px;background:#f7f6fa;border:1px solid var(--hair);font-size:14px;font-weight:600;color:#3d3650}
.sgn-spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(124,58,237,.25);border-top-color:var(--vi);flex:none}
.sgn-b.pri .sgn-spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.sgn-hand{display:flex;flex-direction:column}
.sgn-tagrow{margin-top:14px}
/* annotations */
.sgn-tag{display:inline-flex;align-items:center;font:700 10.5px var(--mo);color:#6d28d9;background:#f4f0fe;border:1px dashed #a78bfa;border-radius:5px;padding:2px 7px;white-space:nowrap}
.sgn-pol{display:inline-flex;align-items:center;font:700 10.5px var(--mo);color:#92400e;background:#fffbeb;border:1px dashed #f59e0b;border-radius:5px;padding:2px 7px;white-space:nowrap}
.sgn-num{position:absolute;z-index:5;width:22px;height:22px;border-radius:50%;background:#18181b;color:#fff;font:700 11px var(--mo);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.sgn-ad{position:absolute;right:40px;top:200px;width:300px;z-index:5;background:#fff;border:1px dashed #9ca3af;border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.5;color:#3d3650}
.sgn-ad b{display:block;font:700 10px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:#18181b;margin:2px 0 6px}
.sgn-ad ol{list-style:decimal;padding-left:18px;margin-bottom:10px}
.sgn-mot{position:absolute;left:16px;right:16px;top:100px;z-index:6;font:600 11px var(--mo);color:#fff;background:rgba(24,24,27,.82);border:1px dashed rgba(255,255,255,.6);border-radius:8px;padding:7px 10px;text-align:center}
.sgn-ghost{position:absolute;left:0;right:0;bottom:0;height:410px;border:2px dashed rgba(255,255,255,.7);border-bottom:0;border-radius:20px 20px 0 0;z-index:4;pointer-events:none}
/* phone */
.sgn-ph{border-radius:28px}
.sgn-sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0 34px;color:#fff;font-size:15px;font-weight:600;z-index:3}
.sgn-sb .sgn-mo{font-family:-apple-system,system-ui,sans-serif;font-weight:600}
.sgn-sbi{display:flex;gap:3px;align-items:flex-end}
.sgn-sbi i{width:3px;background:#fff;border-radius:1px;height:6px}.sgn-sbi i:nth-child(2){height:8px}.sgn-sbi i:nth-child(3){height:10px}
.sgn-sbi b{width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;margin-left:6px;position:relative}
.sgn-phd{position:absolute;top:52px;left:20px;z-index:3}
.sgn-sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:20px 20px 0 0;padding:8px 20px 50px;box-shadow:0 -10px 40px rgba(20,16,36,.25)}
.sgn-sheet.sgn-rise{transform:translateY(46%);opacity:.92}
.sgn-sheet.sgn-kbd2{bottom:252px;padding-bottom:16px}
.sgn-sheet.sgn-kbd{bottom:252px;padding-bottom:16px;max-height:268px;overflow:hidden;border-radius:20px 20px 0 0}
.sgn-ph[style*="width:320px"] .sgn-sheet{padding-left:16px;padding-right:16px}
.sgn-ph[style*="width:320px"] .sgn-h1{font-size:21px}
.sgn-ph[style*="width:320px"] .sgn-b{font-size:14.5px}
.sgn-grab{display:block;width:36px;height:5px;border-radius:3px;background:#d4d1dc;margin:0 auto 4px}
.sgn-shtop{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:2px}
.sgn-shtop .sgn-back{margin:0}
.sgn-x{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;border:0;background:#f4f3f7;color:#3d3650;font-size:13px;font-weight:600}
.sgn-sheet .sgn-side{display:none}
.sgn-home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#18181b;transform:translateX(-50%);z-index:9}
.sgn-home.lt{background:#fff}
.sgn-kb .sgn-home{background:#18181b}
.sgn-reopen{position:absolute;left:20px;right:20px;bottom:50px;z-index:4}
.sgn-kb{position:absolute;left:0;right:0;bottom:0;height:252px;background:#d1d4db;z-index:8;padding:0 0 34px}
.sgn-kbar{height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3c3c43;border-bottom:1px solid #c3c6cd}
.sgn-kr{display:flex;gap:5px;padding:0 3px;margin-top:8px}
.sgn-kr i{flex:1;height:30px;background:#fff;border-radius:5px;box-shadow:0 1px 0 #898a8d}
.sgn-kr i.sgn-kw{flex:2.4;background:#abb0ba}.sgn-kr i.sgn-ksp{flex:6}
.sgn-kr i.sgn-kgo{background:#0a84ff;color:#fff;font:600 13px system-ui;font-style:normal;display:grid;place-items:center}
.sgn-kbl{position:absolute;right:8px;bottom:12px;font:600 9px var(--mo);color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
.sgn-scr{position:absolute;right:4px;bottom:262px;width:3px;height:60px;border-radius:2px;background:rgba(0,0,0,.3);z-index:6}
/* native / provider placeholders */
.sgn-nat{position:absolute;right:110px;top:190px;width:400px;z-index:6}
.sgn-natl{font:600 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(24,24,27,.82);border-radius:6px;padding:5px 8px;margin-bottom:6px;text-align:center}
.sgn-natb,.sgn-natph{display:flex;flex-direction:column;align-items:center;gap:8px;background:#f2f2f7;border:2px dashed #9ca3af;border-radius:16px;padding:22px;color:#1c1c1e;font-family:-apple-system,system-ui,sans-serif;font-size:13px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sgn-natb .sgn-big,.sgn-natph .sgn-big{margin:0;background:#e5e5ea;color:#1c1c1e}
.sgn-natb b,.sgn-natph b{font-size:15px}
.sgn-natg{display:block;width:85%;height:10px;border-radius:5px;background:#dcdce1}.sgn-natg.sgn-ns{width:55%}
.sgn-natf{display:flex;gap:10px;width:100%;margin-top:8px}
.sgn-natf span{flex:1;height:38px;border-radius:9px;background:#e5e5ea;display:grid;place-items:center;font-weight:600}
.sgn-natf span.sgn-on{background:#0a84ff;color:#fff}
.sgn-natph{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;padding:18px 18px 34px}
.sgn-natph .sgn-natl{position:static;width:100%}
.sgn-gwin{position:absolute;right:120px;top:150px;width:420px;height:520px;z-index:6;background:#fff;border:2px dashed #9ca3af;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
.sgn-gbar{height:34px;background:#eceef1;display:flex;align-items:center;gap:6px;padding:0 10px;font:500 11px var(--mo);color:#5f6368}
.sgn-gbar i{width:10px;height:10px;border-radius:50%;background:#c4c7cc}
.sgn-gbar span{margin-left:10px;background:#fff;border-radius:5px;padding:3px 10px;flex:1}
.sgn-gbody{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 30px;text-align:center;font-family:Roboto,Arial,sans-serif;color:#5f6368;font-size:13px}
.sgn-gbody svg{width:32px;height:32px}
.sgn-gbody b{font-size:18px;color:#1f1f1f;font-weight:500}
/* crops & docs */
.sgn-crop{display:flex;gap:24px;align-items:flex-start;background:#f4f3f7;padding:28px}
.sgn-cell{flex:none}
.sgn-cap{margin-bottom:10px;min-height:44px}
.sgn-cap b{display:block;font:700 10.5px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:#18181b}
.sgn-cap span{display:block;font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.4}
.sgn-doc{width:1200px;background:#fff;padding:36px 40px 40px}
.sgn-eye{font:700 10.5px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.sgn-doc h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.sgn-doc h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.sgn-p{font-size:13.5px;line-height:1.55;color:#3d3650;margin-bottom:8px;max-width:1080px}
.sgn-ul{display:flex;flex-direction:column;gap:7px}
.sgn-ul li{font-size:13px;line-height:1.5;color:#3d3650;padding-left:14px;position:relative}
.sgn-ul li::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:#a19cb0}
.sgn-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;margin-top:8px}
.sgn-tbl{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.5}
.sgn-tbl th{text-align:left;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--hair);padding:8px 10px 8px 0}
.sgn-tbl td{border-bottom:1px solid var(--hair);padding:9px 12px 9px 0;vertical-align:top;color:#3d3650}
.sgn-tbl td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.sgn-jr{display:flex;align-items:stretch;gap:8px;margin-top:12px}
.sgn-jl{width:80px;flex:none;font:700 11px var(--mo);text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding-top:12px}
.sgn-jb{width:180px;flex:none;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;background:#fff;display:flex;flex-direction:column;gap:2px}
.sgn-jb b{font-size:13px}.sgn-jb span{font-size:11.5px;color:var(--mu);line-height:1.35}
.sgn-jb.sgn-jok{border-color:#a7f3d0;background:#ecfdf5}
.sgn-jb.sgn-jgh{visibility:hidden}
.sgn-ja{width:16px;flex:none;display:grid;place-items:center;color:#a19cb0;font-weight:700}
/* Research Funds 1/5 (#7031) — RFD boards. New classes only; reuses rs_extra, st_extra and sgn_extra. */
.rfd-pg{position:relative;overflow:hidden}
.rfd-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rfd-tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1.5px dashed #a78bfa;background:var(--lav);color:var(--vt);font:700 10.5px var(--mo);letter-spacing:.02em;white-space:nowrap;vertical-align:middle;margin:0 2px}
.rfd-pol{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1.5px solid var(--amE);background:var(--amBg);color:var(--amT);font:700 10.5px var(--mo);vertical-align:middle;margin:0 2px}
.rfd-fe{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--hair2);background:var(--raised);color:var(--mu);font:600 10.5px var(--mo);white-space:nowrap;vertical-align:middle;margin:0 2px}
.rfd-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:#7c3aed;color:#fff;font:800 11px var(--mo);vertical-align:middle;flex:none}
.rfd-ann{border:1.5px dashed #a78bfa;border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.7;color:var(--ink);background:var(--card)}
.rfd-ann code,.rfd-sgnote code{font:500 11px var(--mo)}
.rfd-foc{outline:2px solid #7c3aed!important;outline-offset:2px}
.rfd-on{display:inline-flex;align-items:center;gap:4px;color:var(--pos);font:700 11.5px var(--sg)}
.rfd-ok{display:inline-flex;align-items:center;gap:6px;color:var(--pos);font:700 12.5px var(--sg)}
.rfd-ok a{color:var(--vt)!important;text-decoration:underline}
.rfd-live:empty{display:none}
.rfd-live{font-size:12px;color:var(--pos);font-weight:600}
/* tabs */
.rfd-tabs{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair)}
.rfd-tl{display:flex;gap:4px}
.rfd-tl button{display:inline-flex;align-items:center;gap:7px;padding:9px 12px 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:600 13.5px var(--sg);color:var(--mu)}
.rfd-tl button[aria-selected=true]{color:var(--ink);font-weight:800;border-color:#7c3aed}
.rfd-tl button span{font:600 11px var(--mo);color:var(--mu)}
.rfd-url{font-size:11.5px;color:var(--mu);padding-bottom:8px}
.rfd-url code{font:500 11px var(--mo);color:var(--ink)}
.rfd-url b{color:var(--vt)}
/* search and filters */
.rfd-sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:end}
.rfd-q{display:flex;flex-direction:column;gap:5px;grid-column:1/2}
.rfd-ql{font:700 12px var(--sg);color:var(--ink)}
.rfd-qi{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border:1.5px solid var(--hair2);border-radius:10px;background:var(--card);font-size:14px}
.rfd-qi .mu{color:var(--mu)}
.rfd-sort{display:flex;flex-direction:column;gap:5px;grid-column:2/3;grid-row:1}
.rfd-sort small,.rfd-dd small{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.rfd-fl{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.rfd-dd{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 12px;border:1px solid var(--hair2);border-radius:10px;background:var(--card);color:var(--ink);font:600 12.5px var(--sg);text-align:left}
.rfd-fl .rfd-dd{flex-direction:column;align-items:flex-start;gap:0;position:relative;padding-right:28px;min-width:150px}
.rfd-fl .rfd-dd i{position:absolute;right:11px;top:13px;font-style:normal;color:var(--mu)}
.rfd-dd b{font-weight:700}
.rfd-dd i{font-style:normal;color:var(--mu)}
.rfd-dd.on{border-color:var(--lavE);background:var(--lav)}
.rfd-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rfd-cl{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-right:2px}
.rfd-chips .fc button{border:0;background:transparent;color:inherit;min-width:22px;min-height:22px;border-radius:999px}
.rfd-cnt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rfd-cnt h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.rfd-cnt .mo{font-family:var(--mo)}
.rfd-sp{flex:1}
.rfd-ex{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);margin-top:-6px}
.rfd-ex a{color:var(--vt)!important;font-weight:700;text-decoration:underline}
/* results table */
.rfd-tw{padding:0!important;gap:0!important;overflow:hidden}
.rfd-t td{vertical-align:top;padding:10px 12px}
.rfd-t td.w{padding-top:12px}
.rfd-vh{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rfd-vn{border:0;background:transparent;padding:0;font:700 13.5px var(--sg);color:var(--ink);text-align:left;border-radius:4px}
.rfd-vh small{font-size:11.5px;color:var(--mu);display:flex;gap:4px;align-items:center}
.rfd-vh .rfd-tag{margin:2px 0}
.rfd-sz{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mo);white-space:nowrap}
.rfd-sz b{font-weight:600;font-size:13px;color:var(--ink)}
.rfd-sz i{font-style:normal;font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.04em}
.rfd-fo{max-width:230px;color:var(--mu);font-size:12px;line-height:1.45}
.rfd-cite{font:500 11px var(--mo);color:var(--mu);line-height:1.5}
.rfd-cite b{color:var(--ink);font-weight:600}
.rfd-why{font-size:12px;line-height:1.5;max-width:380px}
.rfd-pg2{display:flex;gap:6px;justify-content:flex-end}
.rfd-pg2 [aria-current]{border-color:#7c3aed;background:var(--lav);color:var(--vt)!important}
/* disclosure */
.rfd-dsc{padding:0!important;gap:0!important}
.rfd-dh{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 18px;border:0;background:transparent;text-align:left;color:var(--ink)}
.rfd-dh span{display:flex;flex-direction:column;gap:2px}
.rfd-dh b{font-size:14px;font-weight:800}
.rfd-dh small{font-size:12px;color:var(--mu)}
.rfd-dh i{font-style:normal;color:var(--mu)}
.rfd-cov{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:22px;padding:4px 18px 18px;border-top:1px solid var(--hair)}
.rfd-cov h3{font-size:13px;font-weight:800;margin:14px 0 8px}
.rfd-src{display:flex;flex-direction:column;gap:10px}
.rfd-src li{display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.45;padding:10px 12px;border:1px solid var(--hair);border-radius:10px}
.rfd-src li span{color:var(--mu)}
.rfd-src li .mo{font-size:11px}
.rfd-src li.rfd-wd{border-style:dashed;background:var(--raised)}
.rfd-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:12px;margin-bottom:8px}
.rfd-bar .mo{font-size:11.5px}
.rfd-bar .mo i{font-style:normal;color:var(--mu)}
.rfd-bar div{grid-column:1/3;height:6px;border-radius:999px;background:var(--raised);border:1px solid var(--hair);overflow:hidden}
.rfd-bar div i{display:block;height:100%;background:#7c3aed}
/* sheet */
.rfd-dim{position:absolute;inset:0;background:var(--dim);z-index:7}
.rfd-sheet{position:absolute;top:0;right:0;bottom:0;width:480px;z-index:8;background:var(--card);border-left:1px solid var(--hair);box-shadow:-20px 0 50px rgba(0,0,0,.18);padding:22px 24px;display:flex;flex-direction:column;gap:14px;overflow:hidden}

      + box('Data defect found on main', '<p style="font-size:12.5px;line-height:1.5"><b class="mo">232</b> EuroTech rows (229 of them reported in 2025–2026) hold a million times too little: Angular Ventures III is listed at <b>€121m</b> and stored as <b class="mo">12100</b> cents (€121). They would sort last and fall out of “from €50M”.</p>' + tag('#7031 re-import sizes before size filters ship') + '<p class="raw">Not drawn on any board; every size shown here was checked against the list.</p>') + '</div>', 1300);
    else if (B === 'RFD02D') html = crop('<span class="eye">Disclosure open · source coverage and where the money is, below the results</span>' + disc(true), 1240);

    /* ================= RFD03 phone ================= */

      + '<p class="rfd-pcnt" aria-live="polite"><b class="mo">' + NM + '</b> match · of <span class="mo">' + TOTAL + '</span></p>' + J([R[1], R[2], R[3], R[8]].map(r => pcard(r))), { bar: pbar });
    else if (B === 'RFD03B') html = phone('Funds', ptabs('dir') + J([R[1], R[2]].map(r => pcard(r))), { sheet: psheet('<div class="rfd-psh"><div class="rfd-psr"><h2 id="ps-t">Filters</h2><button type="button" class="btn t bsm">Clear all</button></div>'
      + J([['Manager HQ', 'United Kingdom'], ['Stated focus', 'B2B software'], ['Vintage', 'Any']].map(f => '<label class="rfd-pf"><small>' + f[0] + '</small><span class="rfd-in">' + f[1] + '<i aria-hidden="true">▾</i></span></label>'))
      + '<fieldset class="rfd-pf"><legend><small>Size · one currency at a time</small></legend><div class="rfd-cur" role="radiogroup" aria-label="Size currency"><button type="button" role="radio" aria-checked="true">EUR</button><button type="button" role="radio" aria-checked="false">USD</button></div><div class="rfd-mm"><label>From <span class="rfd-in mo">€50M</span></label><label>To <span class="rfd-in mu">No limit</span></label></div></fieldset>'
      + '<label class="rfd-ck"><span class="rfd-cb" aria-hidden="true"></span>EIF-backed</label><label class="rfd-ck"><span class="rfd-cb" aria-hidden="true"></span>EIFO-backed</label></div><div class="rfd-psf"><button type="button" class="btn p" style="width:100%;min-height:48px">Show ' + NM + ' fund vehicles</button></div>', 740) });
    else if (B === 'RFD03C') html = phone('Funds', ptabs('dir') + J([R[2], R[8]].map(r => pcard(r, { sel: r[0] === 'dawncapital' }))), { sheet: psheet('<div class="rfd-psh"><div class="rfd-psr"><div><span class="eye">Fund vehicle</span><h2 id="ps-t">Dawn Capital Opp</h2><small class="mu">Dawn Capital · manager based in UK</small></div><button type="button" class="ib" aria-label="Close fund details">✕</button></div>'
      + '<div class="rfd-pkv"><div><small>Reported size</small><b class="rfd-sz"><b>€75m</b><i>EUR</i></b></div><div><small>Vintage</small><b class="mo">2023</b></div></div><p class="rfd-cite">EuroTech VC Funds · @Euro_VC · 25 Sep 2023 · <a href="#">View list ↗</a></p>'
      + '<button type="button" class="rfd-more" aria-expanded="false">More about this vehicle<span>focus, geography, backing, website, other vehicles</span><i aria-hidden="true">▾</i></button><button type="button" class="btn" style="min-height:44px">Add to project…</button><a href="#" class="btn t" style="align-self:center">Open full profile</a></div>'
      + '<div class="rfd-psf"><button type="button" class="btn p" style="width:100%;min-height:48px">Save to shortlist</button></div>', 560) });
    else if (B === 'RFD03D') html = phone('Funds', ptabs('dir') + J([R[2], R[8]].map(r => pcard(r, { sel: r[0] === 'dawncapital' }))), { sheet: psheet('<div class="rfd-psh"><div class="rfd-psr"><div><span class="eye">Fund vehicle</span><h2 id="ps-t">Dawn Capital Opp</h2><small class="mu">Dawn Capital · manager based in UK</small></div><button type="button" class="ib" aria-label="Close fund details">✕</button></div>'
      + '<button type="button" class="rfd-more" aria-expanded="true">More about this vehicle<span>secondary facts</span><i aria-hidden="true">▴</i></button>' + facts(R[8], { short: 0 }) + siblings + '</div>'
      + '<div class="rfd-psf"><span class="rfd-ok" role="status">' + G.ok + 'Saved to shortlist</span><a href="#" class="btn" style="min-height:44px">Open dossier</a></div>', 740) });
    else if (B === 'RFD03E') html = phone('Funds', ptabs('mine') + '<section class="cd rfd-empty rfd-pe"><span class="eye">Your shortlist</span><h2>No fund is on your shortlist yet</h2><p>Search ' + TOTAL + ' fund vehicles from two public lists, each fact with its source.</p></section><p class="raw">Already know the fund? <a href="#">Add a fund by hand</a></p>', { bar: '<div class="rfd-pb"><button type="button" class="btn p" style="flex:1;min-height:48px">Browse fund directory</button></div>' });

    /* ================= RFD04 signed out and restored ================= */
    else if (B === 'RFD04') html = desk(card(), '<div class="rfd-sgnote"><b>Signed out, opened:</b> <code>' + LINK + '</code><br>The guard keeps it as <code>/login?next=…</code> and the card names Funds (<code>destinationArea</code>). ' + tag('#7031 add /research/funds to RETURN_AFTER_LOGIN_PREFIXES and DESTINATION_AREAS') + ' Today this link reaches the generic “Sign in to Axal VC” and the filters are lost. Apple is left out until #6957 (Sign In v2 ⚑).</div>');
    else if (B === 'RFD04P') html = sphone(card());
    else if (B === 'RFD04B') html = page(directory({ link: 'shared', banner: '<div class="nt rfd-res" role="status"><span class="ic" aria-hidden="true">' + G.ok + '</span><div><b>Signed in. This is the search you opened.</b><div>Directory · 3 filters · Size, largest first · page 1 of 1. Focus is on the results heading.</div></div></div>' }) + ann(num(1) + ' The kept <code>next</code> is consumed once; search, filters, sort, rows per page and page come back from the URL (D4612). Focus lands on the results heading and the status is announced once. ' + num(2) + ' A founder or admin account lands here; any other role keeps today’s rule and sees the existing “not for your account” page, with the link not reused.'), { h: 1440 });
    else if (B === 'RFD04C') html = crop('<span class="eye">Profile round trip · Back to results restores the list, the selected row and keyboard focus</span><div class="rfd-row2">'
      + '<section class="cd rfd-box"><div class="crumb"><a href="#">Research</a>/<a href="#">Funds</a>/<b>Dawn Capital Opp</b></div><a href="#" class="rfd-back rfd-foc">‹ Back to results <small>11 vehicles · 3 filters</small></a><h2 style="font-size:20px;font-weight:800">Dawn Capital Opp</h2><p class="raw">/research/funds/catalog/dawncapital?from=' + '<span class="mo">view%3Ddirectory%26hq_country%3DGB…</span></p><p class="raw">The link carries the list’s query and the vehicle uid. Browser Back does the same. Today the link is <code>/research/funds?view=directory</code> and the filters are dropped.</p>' + fe('frontend only') + tag('#7031 vehicle uid stable across imports') + '</section>'
      + '<section class="cd rfd-box" style="padding:0;overflow:hidden"><div class="nt" role="status" style="margin:12px"><span class="ic" aria-hidden="true">' + G.ok + '</span><div><b>Back to 11 results.</b><div>Dawn Capital Opp is selected.</div></div></div><table class="etb rfd-t"><tbody>' + J([R[6], R[7], R[8], R[9]].map(r => '<tr' + (r[0] === 'dawncapital' ? ' class="sel"' : '') + '><td>' + veh(r, { sel: false, foc: r[0] === 'dawncapital' }) + '</td><td style="text-align:right">' + sizeCell(r) + '</td><td class="w">' + r[5] + '</td></tr>')) + '</tbody></table><p class="raw" style="padding:10px 14px">The row is scrolled into view and its name button has focus (violet ring). The Sheet stays closed until Enter.</p></section></div>', 1240);
    else if (B === 'RFD04D') html = dk('<h1>Return after sign-in · the sequence and its dependencies</h1>' + tbl(['Step', 'What happens', 'Code on main', 'Change'], [
      ['1 Open link signed out', 'RequireAuth sends a signed-out visitor to <code>loginRedirectFor(location)</code>', '<code>RETURN_AFTER_LOGIN_PREFIXES = [\'/learning\', \'/grow\']</code>: /research goes to a bare <code>/login</code>', tag('#7031 add /research/funds')],
      ['2 Sign-in names the destination', '“Sign in to continue to Funds”, what Funds is and who it is for', '<code>DESTINATION_AREAS</code> has Grow only (#4579)', tag('#7031 add the Funds entry') + ' copy on RFD-04'],
      ['3 Keep the path through email link, Google, passkey or code', '<code>storePendingNext</code> in localStorage, 24 h TTL, consumed once per page load', 'Exists; <code>sanitizeNextPath</code> refuses paths over 200 characters', tag('#7031 a long filtered URL falls back to /login: raise the limit or keep a short server-side return id')],
      ['4 Land on the list', 'The URL restores q, hq_country, focus, size, vintage, eif/eifo, sort, limit and offset', '<code>queryFromSearch</code> / <code>searchFromQuery</code> (D4612)', fe('frontend only: size_min/max and the currency param')],
      ['5 Role rules', 'Founder and admin only, as today', '<code>labRoles([\'admin\', \'founder\'])</code> on /research/funds', 'Unchanged'],
      ['6 Announce', 'One polite status; focus on the results heading', '—', fe('frontend only')],
      ['Profile round trip', 'Back to results carries the query and the selected uid; focus returns to the row’s name button', 'Profile back link drops the query', fe('frontend only')]])
      + '<p>Sample link (' + LINK.replace(/&amp;/g, '&').length + ' characters): <code>' + LINK + '</code>. It fits under 200; a link with a search phrase and every filter may not, which is why step 3 needs a decision.</p>' + pol('Owner, option A: keep the 200-character cap; a longer link returns to the Directory without filters and says the filters could not be kept. Option B: a short server-side return id'));

    /* ================= RFD05 states and dark ================= */
    else if (B === 'RFD05') html = crop('<span class="eye">Loading, zero results, failed read, unknown size and shortlist states · each has its own words and next action</span><div class="rfd-g3">'
      + box('Loading', '<div aria-busy="true"><p style="font-weight:700;font-size:13px">Loading fund vehicles…</p>' + J([1, 2, 3, 4].map(() => '<div class="rfd-sk"><i></i><i></i><i></i></div>')) + '<p class="raw">No count is shown until the read answers. Search and filters stay usable.</p></div>', 'aria-busy')
      + box('Zero results', '<p style="font-weight:700;font-size:13px">No fund vehicle matches these 4 filters.</p><div class="rfd-chips">' + J(['HQ: United Kingdom', 'Focus: B2B software', 'Size: from €500M (EUR)', 'Vintage: 2026'].map(c => '<span class="fc">' + c + '<button type="button" aria-label="Remove filter ' + c + '">✕</button></span>')) + '</div><p style="font-size:12.5px">Removing <b>Vintage: 2026</b> would show <b class="mo">2</b>.</p><button type="button" class="btn bsm" style="align-self:flex-start">Clear all filters</button><p class="raw">The unfiltered total stays visible. The suggestion uses the facet counts the API already returns.</p>', 'aria-live polite')
      + box('Failed read', '<div class="rfd-err" role="alert">' + chip('un') + '<p><b>The fund directory did not answer.</b> Your search and filters are kept. No rows and no count are shown: a failed read is not zero funds.</p>' + retry('Retry') + '</div><p class="raw">HTTP 503 “Unreadable”. The Directory tab drops its number.</p>', 'role alert')
      + box('Size not recorded', '<div class="rfd-pc"><span class="rfd-pcn"><b>Outlier Grove I</b><small>Outlier Grove · UK · 2025</small></span>' + chip('nr') + '<p class="raw">The source lists no size for this vehicle. EuroTech VC Funds · @Euro_VC · 8 Apr 2025</p></div><p class="raw">Not 0, not a dash; sorted after sized rows; outside every size filter.</p>')
      + box('Shortlist could not be read', '<div class="rfd-err">' + chip('un') + '<p>Your shortlist could not be read, so Save is off: it cannot tell whether a vehicle is already on it.</p>' + retry('Retry') + '</div>')
      + box('Save failed', '<p class="rfd-bad" role="alert">' + G.un + '<span><b>Dawn Capital Opp was not saved.</b> Nothing changed on your shortlist.</span></p><button type="button" class="btn p bsm" style="align-self:flex-start">Try again</button><p class="raw">Focus stays on the button.</p>')
      + box('Already on the shortlist', '<p>' + saved + '</p><a href="#" class="btn bsm" style="align-self:flex-start">Open dossier</a><p class="raw">A repeat save is idempotent by directory uid (D4613).</p>')
      + box('Vehicle list taken down', '<p style="font-size:12.5px"><b>This fund’s list was removed.</b> Its publisher’s terms forbid republishing; no field is shown.</p><p class="raw">HTTP 410 from <code>/fund-directory/:uid</code>.</p>')
      + box('Signed-in role without Funds', '<p style="font-size:12.5px">Funds is for founder accounts. You are signed in as an investor.</p><a href="#" class="btn bsm" style="align-self:flex-start">Go to your workspace</a><p class="raw">Existing role rule; the kept link is not reused.</p>')
      + '</div>', 1400);
    else if (B === 'RFD05B') html = page(directory({ link: 'shared', sel: 'dawncapital', mine: ['dawncapital'] }), { h: 1260, overlay: sheet(R[8], { done: 1 }) });
    else if (B === 'RFD05C') html = phone('Funds', ptabs('dir') + '<label class="rfd-pq" for="pq2"><span class="rfd-ql">Search fund vehicles or managers</span><span class="rfd-qi" id="pq2"><span aria-hidden="true">⌕</span><b>dawn</b></span></label><p class="rfd-pcnt" aria-live="polite"><b class="mo">2</b> match “dawn” · of <span class="mo">' + TOTAL + '</span></p>' + pcard(R[1]) + pcard(R[8], { mine: 1 }) + '<div class="rfd-err">' + chip('un', 'Unavailable') + '<p style="font-size:12.5px">“Where the money is” could not be read. The results above are unaffected.</p>' + retry() + '</div>', { bar: pbar.replace('Filters · 3', 'Filters') });

    /* ================= RFD06 accessibility and focus ================= */

      ['1', 'Funds tabs', 'tablist “Funds”; tab “Directory, 1,966 funds”', 'Arrow keys, Home, End', 'Stays on the tab'],
      ['2', 'Browse fund directory', 'button', 'Enter', 'Search field on the Directory tab'],

      ['6', 'Sort', 'select “Sort”', 'Arrow keys', 'Stays; order announced'],
      ['7', 'Vehicle name', 'button with aria-expanded, controls the Sheet', 'Enter opens', 'Sheet heading'],
      ['8', 'Row Save', 'button “Save Dawn Capital Opp to shortlist”', 'Enter', 'Stays; becomes “On shortlist”'],
      ['9', 'Sheet', 'dialog labelled by the vehicle name; focus trapped', 'Escape or ✕ closes', 'The row’s name button (7)'],
      ['10', 'Disclosure', 'button aria-expanded, controls coverage', 'Enter', 'Stays'],
      ['11', 'Pager', 'nav “Pages of results”', 'Tab', 'Results heading after a page turn']])
      + '<div class="cols"><div><h2>Announcements (one polite region)</h2><p>“11 fund vehicles match, of 1,966.” · “No fund vehicle matches these 4 filters.” · “Dawn Capital Opp saved to your shortlist.” · “Signed in. This is the search you opened.” Errors use role alert once: “The fund directory did not answer.” Loading sets aria-busy on the results only.</p></div><div><h2>Visible focus and layout</h2><p>2 px violet ring with 2 px offset on every control, on light and dark. Size, vintage and dates in Roboto Mono; currency code beside every amount. At 390 px there is no horizontal page scroll: rows become cards, filters a full-height sheet, the fund a bottom sheet with Save in thumb reach. Touch targets at least 44 px. Never colour alone: Not recorded is dotted with a dash glyph, Unavailable dashed with “!”.</p></div></div>');

    /* ================= RFD07 handoff ================= */
    else if (B === 'RFD07') html = dk('<h1>Handoff · #7031 Funds discovery</h1><p>Checked against main <code>87bf3ac4ac</code> (16 Nov 2026).</p>' + tbl(['Board', 'Route and state', 'Data behind it', 'Work'], [
      ['RFD-01 Empty My funds', '/research/funds, no view param', '<code>GET /api/research/funds</code> (migration 216)', fe('frontend') + ' Browse fund directory, Add a fund by hand, no zero counters'],
      ['RFD-01B Tabs from a link', '?view=directory', '<code>fundsTabOf</code>, <code>directoryTabLabel</code>', fe('frontend') + ' “opened from a link” line'],
      ['RFD-02 Directory', '/research/funds?view=directory&amp;…', '<code>GET /api/research/fund-directory</code>: q, hq_country, focus, size_band, size_min/max, vintage, eif, eifo, sort, limit ≤ 100, offset; coverage, sources, facets', fe('frontend') + ' results first, chips, min/max, disclosure, vehicle label from fund_number · ' + tag('vehicle rows') + tag('USD on the Shai list')],
      ['RFD-02B Sheet', 'same URL, row selected', '<code>GET /fund-directory/:uid</code>, <code>POST /api/research/funds</code> (catalogue_uid, D4613)', fe('frontend') + ' rename to Save to shortlist; Add to project… is the existing D5157 panel'],
      ['RFD-02C Sizes', '—', '<code>presentFund</code>: EUR only today', tag('USD currency') + tag('re-import 232 rows') + tag('reports keyed by vehicle')],
      ['RFD-03 Phone', 'same routes at 390', 'same', fe('frontend') + ' cards, filter sheet, bottom sheet'],
      ['RFD-04 Sign-in return', '/login?next=…', '<code>pendingNext.js</code>', tag('prefix and destination entry') + pol('long URLs')],
      ['RFD-04C Profile round trip', '/research/funds/catalog/:id', '<code>FundCatalogProfile</code> back link', fe('frontend')],
      ['RFD-05 States', 'all', '503 Unreadable, 410 Removed, facets for the zero-result hint', fe('frontend')]])
      + '<div class="cols"><div><h2>Requires engineering (◇)</h2><p><b>One row per vehicle.</b> The import keys <code>research_fund_directory</code> by manager name, so Dawn Capital’s Opp (€75m) and Fund V (€582m), both reported 25 Sep 2023, collapse into one row; and <code>research_fund_directory_reports</code> draws different vehicles as one fund’s “size over time” (€190m, €110m, €340m, €100m, €75m). Key by manager + fund_number with a stable uid.<br><b>USD sizes.</b> Migration 429 stores the Shai Goldman list in US cents (its 1A note) but <code>presentFund</code> marks only the EuroTech list, so Afore IV (US$185m, 21 Feb 2025) reads Not recorded. Mark the list USD and scope size filters, bands and sort by currency.<br><b>Size defect.</b> 232 EuroTech rows, 229 of them from 2025–2026, hold a millionth of the listed size (Angular Ventures III: €121m stored as 12100 cents).<br><b>Return after sign-in.</b> Add /research/funds to the return prefixes and a Funds destination entry.<br><b>Investment geography</b> needs an evidenced field; none exists.<br>The route’s <code>source</code> string still names the withheld Deep Tech list.</p></div>'
      + '<div><h2>Preserved</h2><p>Two tabs, both mounted; server search, filters, sort and paging; URL state (D4612); EUR-only comparisons; Not recorded with reasons; citation with publisher and terms (D597); withheld list; idempotent add; role guard; the shared Sheet; Eadwyn as the one rail.</p><h2>Changed from main</h2><p>Search and results before coverage and the money band (now a disclosure). The 760 px table becomes a table that fits 1,140 px and cards at 390. EIF/EIFO moves from a column to the Sheet and the filter. “Add to my funds” is named Save to shortlist.</p><h2>Open</h2><p>Long return URLs (⚑). Whether Save needs a project picker (no: drawn separate). The clickable “Funds discovery Page” prototype is not part of this canvas.</p></div></div>');

    else html = page(directory({ link: 'shared' }), { h: 1260 });
    return { html: { __html: html } };
  }
