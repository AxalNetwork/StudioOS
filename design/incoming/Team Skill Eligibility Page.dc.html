      + '<div class="tms-cp"><div style="display:flex;flex-direction:column;gap:8px"><span class="eye">Checked in order (skillLinks.ts attachCheck, minus the role gate)</span><div class="tms-rule">' + J(RULE.map(r => '<div><i>' + r[0] + '</i><b>' + r[1] + '</b><span style="color:var(--mu)">' + r[2] + '</span><span>' + r[3] + '</span></div>')) + '</div><div class="tms-line">' + BE('#8768 · drop role_mismatch from attachCheck, /available and /assignable (D4116 “any skill to any agent”)') + '</div></div>'
      + '<div style="display:flex;flex-direction:column;gap:8px"><span class="eye">Where each entry point stands on main 7553cd37b9</span><table class="tms-tbl"><thead><tr><th>Entry point</th><th>Today</th><th>These boards</th></tr></thead><tbody>' + J(TODAY.map(r => '<tr><td><b>' + r[0] + '</b></td><td class="bad">' + r[1] + '</td><td>' + r[2] + '</td></tr>')) + '</tbody></table></div></div>'
      + '<div class="tms-line"><span class="raw">Counts: each picker shows Published · Can attach · Attached · Blocked · Couldn’t be read for the agent in hand; the directory shows Listed · Published · Drafts · Couldn’t be read. A count not read shows “—”, never 0.</span></div>', 1400);

    /* ---------- TMS15: card copy, keyboard, headings ---------- */
    const copyBoard = () => crop('<span class="eye">Final card copy · keyboard · headings and focus order</span><div class="tms-cp">'
      + '<section class="cd"><h3 style="font-size:14px;font-weight:800">Card anatomy (directory and pickers)</h3><dl class="tms-ba"><dt>Eyebrow</dt><dd>From Axal · v1 &nbsp;|&nbsp; ' + CO + ' · no version</dd><dt>Name</dt><dd>The skill’s name, as published</dd><dt>The job</dt><dd>One or two sentences: what it does, from what. No “when…” routing clause, no catalogue or roadmap text, no tool or infrastructure instructions</dd><dt>Needs</dt><dd>Required inputs in plain words, or “Not recorded”</dd><dt>You get</dt><dd>“A brief”, “A draft” or “A record change”, plus who accepts it when the steps name one</dd><dt>Run cost</dt><dd>“Not recorded” until a run records it; an estimate is labelled “(estimate)”</dd><dt>State</dt><dd>Published v1 · Draft · no published version · Can attach · Attached · v1 · Blocked · tool · Couldn’t be read</dd><dt>Reason</dt><dd>Blocked and Draft always carry one sentence of why and one link to who can change it</dd></dl></section>'
      + '<section class="cd"><h3 style="font-size:14px;font-weight:800">The job line: before and after</h3><dl class="tms-ba"><dt>Before</dt><dd><del>Builds a rolling 13-week cash forecast from dated recorded receipts and payments when reviewing liquidity needs.</del></dd><dt>After</dt><dd>Builds a rolling 13-week cash forecast from dated recorded receipts and payments.</dd><dt>Before</dt><dd><del>Reviews receivables, inventory and payables cycles from comparable recorded inputs when assessing cash conversion.</del></dd><dt>After</dt><dd>Reviews receivables, inventory and payables cycles from comparable recorded inputs.</dd><dt>Rule</dt><dd>Customer copy is the purpose up to its first routing clause, at most 160 characters. Planning, routing and infrastructure text stays in the SKILL.md for HQ</dd></dl><div class="tms-line">' + BE('#8768 · a customer description field, or the cut done in the library files and the store') + '</div><p class="raw">The truncated roadmap and infrastructure text seen on 26 Nov is not in the library files on main; it comes from rows in the store. Open question on the handoff.</p></section>'
      + '<section class="cd"><h3 style="font-size:14px;font-weight:800">Keyboard</h3><dl class="tms-ba"><dt>' + kb('/') + '</dt><dd>Focus search in the directory or a picker</dd><dt>' + kb('↑') + ' ' + kb('↓') + '</dt><dd>Move through results (a listbox; the active row is announced with its state)</dd><dt>' + kb('Space') + '</dt><dd>Tick or untick the row; a Blocked or Attached row says why and stays unticked</dd><dt>' + kb('Enter') + '</dt><dd>Open details; ' + kb('Esc') + ' goes back to the list with focus on the same row and the selection kept</dd><dt>' + kb('Esc') + '</dt><dd>In search: clear the words first, then close the drawer</dd><dt>Live</dt><dd>“3 can attach, 3 blocked in Finance” is announced politely after each filter</dd></dl></section>'
      + '<section class="cd"><h3 style="font-size:14px;font-weight:800">Headings and focus order</h3><dl class="tms-ba"><dt>Directory</dt><dd>h1 Team · h2 Finance (sr-only) · h3 per card. Focus: tabs → ① Area → ② Search → ③ Show → ④ Sort → cards (Open, Assign)</dd><dt>Skill page</dt><dd>h1 Team · h2 the skill · h3 The job, Needs, You get, Steps, Your agents, Cost and quality. Focus: back link → Extend → Assign → blocks</dd><dt>Drawers</dt><dd>Dialog labelled by its h2; focus starts in search, then area, list, Cancel, Add. Focus returns to the button that opened it</dd><dt>Wizard</dt><dd>Step list with aria-current; the Next button names what happens with zero skills</dd><dt>Never colour alone</dt><dd>Each state has a word, a glyph and its own border (solid, dashed, dotted, filled)</dd><dt>Phone</dt><dd>44 px targets, one column, the action bar at the bottom</dd></dl></section></div>', 1400);

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      TMS16: () => dk('<h1>Handoff · Team · Skill Eligibility Across Pickers (#8768)</h1><p>Checked against <code>main</code> 7553cd37b9 on Thu 26 Nov 2026. Look and shell from Skill Library v2 (SK-09, SK-10) and main’s Team page (<code>/account/companies/:uid/settings/team?tab=skills</code>). Code-informed, not screenshot-verified.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['<code>cloudflare-worker/src/routes/team_skills.ts</code>', '<code>GET /skills</code> lists every readable skill; a writer (a Super Admin for Axal skills) also gets drafts. <code>GET /agents/:uid/skills/available</code> keeps published skills and drops every refusal except <code>tool_not_approved</code>, so <code>role_mismatch</code> silently removes other roles’ skills. <code>/skills/:uid/assignable</code> lists only agents of the skill’s roles. Cards carry <code>readiness</code>, <code>run_cost: null</code>, <code>used_by</code>; no inputs, no per-agent state'],
          ['<code>services/agents/skillLinks.ts</code> <code>attachCheck</code>', 'not_found → version_not_published → skill_retired → skill_suspended → <b>role_mismatch</b> → tool_not_approved → capability_missing (D8070). The role gate contradicts D4116 §2.3 “any skill can go to any agent”'],
          ['<code>frontend/src/pages/team/SkillSheets.jsx</code>', '<code>AddSkillsSheet</code>: empty reads “No other skill of this role yet.” <code>SkillsStep</code> (wizard): client filter <code>directory(…, { fit: role })</code> + published, no tool check, Next always enabled. <code>AssignSkillSheet</code> says “Any agent can take it” while the Worker lists role agents only'],
          ['<code>frontend/src/pages/team/SkillsTab.jsx</code>, <code>SkillParts.jsx</code>', 'Assign only when <code>status === published</code>; a draft gets a Draft chip and “Not published yet.”, no reason or alternative. <code>blockedWords</code> hides <code>role_mismatch</code>'],
          ['<code>services/agents/skillInputs.ts</code> (D4667)', 'Required inputs for 10 skills, Cash runway snapshot included; served only by <code>POST /skills/discover</code> (no client method)'],
          ['<code>services/agents/skills/*.md</code>, <code>skillLibrarySeed.ts</code>', 'The seed makes Axal <b>drafts</b>; each publishes after golden cases (9 of 10) and a second Super Admin. Several descriptions end in a “when …” routing clause'],
          ['<code>services/agents/personas.ts</code>', 'Natural fit = two areas per persona (Vesta: Legal, Finance; Tessaly: Finance, Capital; Kade: Product, Marketing; Ryssa: Capital, Finance)']])
        + '<h2>Acceptance → boards</h2>' + tbl(['Acceptance item', 'Board'], [
          ['Distinguish listed, published, eligible, attached, blocked by policy and unreadable', 'TMS00 legend; chips on TMS01, TMS02, TMS04, TMS07; Couldn’t be read on TMS09'],
          ['Relevant counts and a recovery action in both directions', 'Counts: TMS01, TMS04, TMS05, TMS07, TMS08. Recovery: draft → published alternative (TMS03, TMS01 card); blocked → sponsor or allowed tools (TMS02, TMS04, TMS07); empty → other area or approve tools (TMS05, TMS08)'],
          ['Respect published versions, qualification and tool approval', 'TMS00 rule 2–5; TMS03 (draft, golden-case bar); TMS04 and TMS07 (tools)'],
          ['Role fit as a recommendation; every entry point uses the same rule', 'TMS00 (rule and today table); the same states in the directory, skill page, Assign (TMS17), Add skills and the wizard; “Natural fit” labels on TMS02, TMS04, TMS07, TMS17'],
          ['Keep selection when filtering or returning from a detail', 'TMS04 tray; TMS05 (filter); TMS06 (back from details); TMS12'],
          ['Job, required inputs, proposed output, cost or “Not recorded”', 'TMS01 cards, TMS02, TMS06, TMS15 anatomy'],
          ['Remove catalogue planning/routing boilerplate', 'TMS15 before/after and the copy rule'],
          ['Test a draft-only area, an eligible cross-area skill, an opted-out tool', 'Legal for Vesta (TMS05); Kade + Cash runway snapshot, and Vesta (role Legal) + Finance skills (TMS02, TMS04); mercury.read for Vesta, stripe.read for Ryssa (TMS04, TMS07)'],
          ['Prompt: Finance directory, skill detail, existing agent, wizard, keyboard search, empty-eligible, desktop and 390', 'TMS01–TMS08 and TMS17; TMS01 and TMS15; TMS05 and TMS08; TMS10–TMS14']])
        + '<h2>Preserved</h2><p>The Team page, its tabs and h1; the 8 areas and their tokens (<code>skillAreas.js</code>); SK-09/SK-10 card and page structure; Assign to agents and Extend; publication through golden cases and a second Super Admin; tool grants decided by the sponsor and Team settings; nothing attaches, publishes or grants by itself; Eadwyn as the one rail.</p>'
        + '<h2>Frontend only</h2><p>State chips and counts from fields the Worker returns; the job-line copy rule where the text is already clean; listbox keyboard model; selection kept across filter and details (state in the drawer); explicit empty states; Next naming “with no skills”; phone layouts.</p>'
        + '<h2>Backend required (◇, all #8768 unless named)</h2>' + tbl(['Need', 'Where'], [
          ['Drop <code>role_mismatch</code> from <code>attachCheck</code>, <code>/available</code> and <code>/assignable</code>; natural fit only sorts (D4116)', 'skillLinks.ts, team_skills.ts'],
          ['<code>/agents/:uid/skills/available</code> returns every published skill with <code>eligibility: { state, code, tool, fit }</code>, and counts', 'team_skills.ts'],
          ['The same answer for an agent not yet added (persona, scope, sponsor’s approved tools) for the wizard', 'new read beside <code>/:scope/:id/cost-estimate</code>'],
          ['Per-area counts on <code>GET /skills</code>: listed, published, drafts (count only for readers), unreadable; per-agent states for the directory line', 'team_skills.ts'],
          ['Required inputs on <code>GET /skills/:uid</code> and cards (from <code>skillInputs.ts</code>); “Not recorded” for the rest', 'team_skills.ts'],
          ['A published alternative for a draft (discovery over published skills, same area)', 'skillDiscovery.ts'],
          ['Customer description without routing or infrastructure text', 'skills/*.md and the store'],
          ['Recorded run cost per skill', '#4536']])
        + '<h2>Pending the owner (⚑, option A drawn)</h2><p><b>Q1.</b> Founders see how many Axal drafts an area holds (“14 in qualification at Axal”), never their names or contents. A: yes, as drawn (TMS01, TMS05). B: hide drafts entirely; a draft-only area then reads “No Legal skill is published yet” with no number.</p>'
        + '<h2>Open questions</h2><p>Where the truncated roadmap and infrastructure text came from: not in the library files on main, so probably store rows written outside the seed. Whether Super Admins in a founder preview should see Axal drafts in the Team directory at all (drawn behind a banner, TMS03).</p>'
        + '<p>' + CO + ', ' + MAYA + ', ' + NOAH + ', ' + IRIS + ', [Atlas runway forecast], every count, date and cost are fictional sample content. Agent personas and skill names are main’s. Design only.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'TMS00') html = model();
    else if (B === 'TMS01') html = page(directory(), { h: 1530 });
    else if (B === 'TMS02') html = page(detail(), { h: 1000 });
    else if (B === 'TMS03') html = page(draftDetail(), { h: 1000, who: IRIS });
    else if (B === 'TMS04') html = page(peopleBody(), { h: 1120, overlay: '<div class="tms-dim">' + vestaDrawer() + '</div>' });
    else if (B === 'TMS05') html = crop(legalDrawer(), 640);
    else if (B === 'TMS06') html = crop(kpiDetailDrawer(), 640);
    else if (B === 'TMS07') html = page(peopleBody(), { h: 1120, overlay: '<div class="tms-dim">' + wizard() + '</div>' });
    else if (B === 'TMS08') html = crop(wizardEmpty(), 680);
    else if (B === 'TMS09') html = crop('<span class="eye">States · each says what happened and what to do next · shown in the Vesta drawer and the Finance directory</span><div class="tms-st">' + J(STATES.map(s => sbox(s[0], s[1]))) + '</div>', 1400);
    else if (B === 'TMS15') html = copyBoard();
    else if (B === 'TMS17') html = crop(assignSheet(), 640);
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(directory(), { h: 1330 });
    return { html: { __html: html } };
  }
}
