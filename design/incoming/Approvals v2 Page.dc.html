    else if (B === 'AP17') html = page(inbox({ menu: 1 }), { h: 1700 });
    else if (B === 'AP18a') html = crop(strip([['Waiting', '0', 'across 20 lanes · all read'], ['Overdue', '0', 'measured'], ['Unassigned', '0', 'measured'], ['Oldest', '—', 'nothing waiting']]) + emptyQ('Nothing needs approval', 'All approval queues currently read as clear.'));
    else if (B === 'AP18b') html = crop(emptyQ('No approvals match these filters.', 'Group: Deals & portfolio · Owner: Me', true));
    else if (B === 'AP18c') html = crop(note('r', '!', '<b>1 lane could not be read. The inbox may be incomplete.</b><div>Due diligence · Could not be read · <button type="button" class="btn t bsm" style="padding:0">Try again</button></div>', '<a class="btn bsm" href="#">View details</a>') + strip(failStrip));
    else if (B === 'AP18d') html = crop('<div style="position:relative;height:200px">' + queue({ callout: false, foot: false, rowsHtml: band('o', '! Overdue · over 72 hours · 8') + qrow(R[6]) + qrow(R[7]) }) + '<div class="toast" role="status" style="bottom:4px">✓ <span>Ada Example was approved. Filters and page kept.</span><a href="#">View in Decided</a></div></div>');
    else if (B === 'AP18e') html = crop(modal({ eye: 'Product testers · Ben Sample', title: 'Approve Ben Sample as a product tester?', body: note('a', '↻', '<b>This item changed while you were reviewing it.</b> The latest state has been loaded: Admin B declined it at 16:02. Nothing was recorded by you.'), foot: '<button type="button" class="btn">Close</button><button type="button" class="btn p">View latest</button>' }).replace('class="dim2"', 'class="dim2" style="display:none"').replace('class="mdl"', 'class="mdl" style="position:static;transform:none;width:100%"'), 620);
    else if (B === 'AP18f') html = crop(note('a', '!', '<b>The decision may have been recorded, but the notification could not be delivered.</b><div>Check the item before trying again — Eva Demo may already show as verified.</div>', '<a class="btn bsm" href="#">Check item</a>'), 720);
    else if (B === 'AP18g') html = crop(decided(true).split('<section class="qc"')[1] ? '<section class="qc"' + decided(true).split('<section class="qc"')[1] : '', 1100);
    else if (B === 'AP18i') html = crop(hqCard(), 640);
    else if (B === 'AP19') html = page(inbox({ noWl: true }), { h: 1000, ead: true });
    else html = page(inbox(), { h: 1700 });
    return { html: { __html: html } };
  }
}
</script>
