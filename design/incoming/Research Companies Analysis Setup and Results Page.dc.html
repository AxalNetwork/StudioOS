.sw3{display:grid;grid-template-columns:minmax(0,1.2fr) 150px minmax(0,1.6fr) 150px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--hair);font-size:12.5px}
.sw3.hd{border-top:0;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--hair)}

.sw3 .im{color:var(--mu);font-size:12px;line-height:1.45}
.prev{border:1px dashed var(--hair2);border-radius:12px;padding:12px 14px;background:transparent}

.rsh{display:grid;grid-template-columns:200px minmax(0,1fr) 44px}
.rsh.wr{grid-template-columns:200px minmax(0,1fr) 340px}
.crumb{font:600 12px var(--sg);color:var(--mu);display:flex;gap:6px;align-items:center}

.crumb b{color:var(--ink);font-weight:700}
.ph1{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.ph1 .acts{display:flex;gap:8px;align-items:center}
.btn.ea{gap:7px}
.btn.ea i{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#7c3aed;color:#fff;font:800 10px var(--sg);font-style:normal}
.qbox{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:1px solid var(--hair);border-radius:14px;background:var(--card)}
.qbox label{font:700 12.5px var(--sg)}
.qin{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 8px 0 14px;border:1.5px solid var(--hair2);border-radius:12px;background:var(--card);font-size:14px;color:var(--mu)}

.qin .btn{margin-left:auto}
.sug{display:flex;gap:8px;flex-wrap:wrap}

.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pc{border:1px solid var(--hair);border-radius:14px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:8px}

.pc .m{display:flex;gap:10px;flex-wrap:wrap;font:500 11.5px var(--mo);color:var(--mu)}
.pc .f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;border-top:1px solid var(--hair)}
.prog{height:6px;border-radius:999px;background:var(--raised);border:1px solid var(--hair);overflow:hidden}

.rail{border-left:1px solid var(--hair);background:var(--card);display:flex;flex-direction:column}
.rail .rh{padding:14px 16px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
.rail .rb{padding:14px 16px;display:flex;flex-direction:column;gap:16px;flex:1}

.rail ul{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.45}
.rail .rf{padding:12px 16px;border-top:1px solid var(--hair)}
.ptab{display:flex;gap:4px;border-bottom:1px solid var(--hair)}

.pbar2{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}

.fd{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fd .kk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fd p{font-size:13px;line-height:1.55}
.fk{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font:700 10.5px var(--mo);letter-spacing:.04em;text-transform:uppercase}

.fk.ea2{background:var(--lav);color:var(--vt);border:1px dashed var(--lavE)}
.fk.hu{background:var(--ink);color:var(--card);border:1px solid var(--ink)}
.fd.ea2{border-style:dashed;border-color:var(--lavE)}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--lav);color:var(--vt);font:700 10.5px var(--mo);vertical-align:1px;border:1px solid var(--lavE)}

.pass{border-left:3px solid #7c3aed;background:var(--raised);padding:8px 12px;font-size:12.5px;line-height:1.55;border-radius:0 8px 8px 0}

.nr{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sg);color:var(--mu);font-style:italic}
.nr:before{content:"";width:10px;height:10px;border:1.5px dashed var(--hair2);border-radius:3px}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{padding:9px 12px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
.cmp thead th{font:700 13px var(--sg);background:var(--raised)}
.cmp tbody th{font:600 12px var(--sg);color:var(--mu);width:200px}
.prop{border:1.5px dashed #a78bfa;border-radius:12px;background:var(--lav);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--vt)}
.prop b{color:var(--ink)}
.ptag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;border:1px dashed #a78bfa;font:700 10px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--vt);background:var(--lav)}
.vstep{display:flex;flex-direction:column;gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}
.vstep li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--hair);font-size:12.5px}
.vstep li:last-child{border-bottom:0}
.vstep li i{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;border:1px solid var(--hair2);font:700 11px var(--mo);font-style:normal;color:var(--mu)}
.vstep li.dn i{background:var(--pos);border-color:var(--pos);color:#fff}
.vstep li.on{background:var(--lav)}
.vstep li.on i{background:#7c3aed;border-color:#7c3aed;color:#fff}
.brief{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:28px 34px;display:flex;flex-direction:column;gap:14px;font-size:13.5px;line-height:1.6}
.brief h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brief h3{font-size:15px;font-weight:800;margin-top:6px}
.brief .rv2{display:flex;align-items:center;gap:8px;font:600 11.5px var(--mo);color:var(--mu)}
.dest{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dest label{border:1px solid var(--hair);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;background:var(--card)}
.dest label.on{border:2px solid #7c3aed;background:var(--lav)}
.dest label.off{opacity:.6;border-style:dashed}
.dest b{font-size:13.5px}
.dark-fix .stt.ok{background:transparent}
.pc>.stt,.pc>.nr,.cd>.stt{align-self:flex-start}

.st-bh{display:flex;gap:14px;align-items:flex-start}
.st-bh h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.st-bh p{font-size:13px;color:var(--mu);margin-top:4px;max-width:1060px;line-height:1.55}
.st-id{font:700 11px var(--mo);padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap;margin-top:2px}
.st-sec{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px}
.st-sh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.st-note{font-size:12px;color:var(--mu)}
.st-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st-sep{width:1px;height:20px;background:var(--hair2);margin:0 6px}
.st-gray{filter:grayscale(1)}
/* chips */

.st-c svg{flex:none}
.st-nr{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-na{color:var(--mu);background:transparent;border-color:transparent;padding-left:2px}
.st-un{color:var(--ink);background:var(--card);border-color:var(--hair2);border-style:dashed;border-width:1.5px}
.st-un svg{color:var(--neg)}
.st-rf{color:var(--ink);background:var(--raised);border-color:var(--ink);border-width:1px}
.st-stale{color:var(--amT);background:transparent;border-color:var(--amE);border-style:dashed;border-width:1.5px}
.st-part{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-pv{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dashed;border-width:1.5px;font-style:italic}
.st-nc{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-l-ok{color:var(--pos);background:var(--posBg);border-color:var(--posE)}
.st-l-am{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-l-mu{color:var(--mu);background:var(--raised);border-color:var(--hair2)}
.st-l-fl{color:#fff;background:var(--neg);border-color:var(--neg)}
.st-retry{display:inline-flex;align-items:center;gap:4px;font:700 11.5px var(--sg);color:var(--vt);background:transparent;border:0;padding:2px 4px;border-radius:6px;vertical-align:middle}
.st-unin{display:inline-flex;align-items:center;gap:4px;color:var(--neg);font-weight:800}
.st-nrin{color:var(--mu);font-style:italic;font-weight:600}
.st-nain{color:var(--mu)}
.st-why{display:block;font-size:12px;color:var(--mu);line-height:1.45}
.st-route{font:700 12px var(--sg)}
.st-zero{color:var(--ink)!important;font-weight:800}
.st-cellnr{color:var(--mu)}
.st-stack{font:800 20px var(--mo);letter-spacing:-.02em}
.st-eng{display:inline-flex;font:700 11px var(--mo);color:var(--vt);background:var(--lav);border:1px dashed var(--lavE);border-radius:6px;padding:1px 6px}
.st-spec{font:500 11px var(--mo)}
/* tiles */
.st-tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.st-t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.st-tw{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-cap2{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.st-tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px;min-height:150px;align-items:flex-start}
.st-tl{font-size:12px;color:var(--mu);font-weight:600}
.st-tv{font:800 26px var(--mo);letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.st-ts{display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:12px}

.st-big-nr{color:var(--mu);font-weight:500}
.st-big-un{display:inline-grid;place-items:center;width:30px;height:30px;border:1.5px dashed var(--hair2);border-radius:8px;font:800 18px var(--sg);color:var(--neg)}
.st-big-rf{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:8px;font:700 18px var(--sg);color:var(--ink);background:var(--raised)}
.st-provv{color:var(--mu);font-style:italic}
.st-wh{font:700 15px var(--sg);color:var(--mu);font-style:italic}
.st-withheld{border-style:dashed}
.st-mini{min-height:120px}
.st-sk{display:inline-block;height:12px;border-radius:5px;background:var(--skel)}
/* prose */
.st-prose{font-size:14px;line-height:1.7;padding:6px 0;border-bottom:1px solid var(--hair)}
.st-prose:last-child{border-bottom:0}
/* tables */
.st-tb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}
.st-tb th{text-align:left;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
.st-tb td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.st-tb .n{text-align:right;font-family:var(--mo)}
.st-tb code,.st-dict code,.st-sec code,.st-bh code,.st-rules code,.st-opt code,.st-foot2 code{font:500 11px var(--mo);background:var(--raised);border:1px solid var(--hair);padding:0 4px;border-radius:4px}
.st-dict{background:var(--card);border-radius:12px;overflow:hidden}
.st-dict td:first-child{font-weight:800;white-space:nowrap}
.st-dict td:first-child small{display:block;font:600 10px var(--mo);color:var(--mu);text-transform:uppercase;letter-spacing:.05em}

.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}
.st-foot2 b{color:var(--ink)}
/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}

.st-list small{font-size:12px;color:var(--mu)}
.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.st-lbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-lbh b{font-size:14px}
.st-cnt{font:700 11px var(--mo);padding:1px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);color:var(--ink)}
.st-none{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:9px;background:var(--raised);font-size:13px}
.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}
.st-unbox{border:1.5px dashed var(--hair2);background:var(--card)}
.st-unbox svg{color:var(--neg);margin-top:3px}
.st-unbox div,.st-rfbox div{display:flex;flex-direction:column;gap:3px;flex:1}
.st-unbox span,.st-rfbox span{color:var(--mu)}
.st-rfbox{border:1px solid var(--ink);background:var(--raised)}
.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st-chh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-chh b{font-size:14px}
.st-ch svg{font-family:var(--sg)}
.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}
.st-ch2 h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st-comp .st-tile{background:var(--raised)}
.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}
.st-prov{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:500 11.5px var(--mo);color:var(--mu)}
/* phone */
.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}
.st-plist{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}
.st-plist>div:first-child{border-top:0}
.st-plist span{font-size:12.5px}
/* do / don't */
.st-dd{display:flex;flex-direction:column;gap:8px}
.st-ddt{font:800 14px var(--sg)}
.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}

        + '<h2>Evidence vocabulary (desktop, tablet, phone, export)</h2><p>' + ev('sup') + ' every finding names a fetched source · ' + ev('par') + ' some findings have none, named · ' + ev('ins') + ' 0 sources and 0 candidates · ' + ev('non') + ' search ran, returned none · ' + chip('un') + ' a read failed, with Retry · ' + chip('rf') + ' · ' + NR + ' · ' + chip('nv') + '</p><p>Annotation key: ' + ENG('Worker') + ' needs backend work on #7041 · ' + FL('owner') + ' owner decision, option A drawn.</p>'),
      RCA12: () => dk('<h1>Accessibility, keyboard order and return focus</h1>' + tbl(['Area', 'Specification'], [
          ['Labels', 'Every control has a visible label used as its accessible name: “Market or industry, required”, “Target customer”, “Geography”, “Region focus”, “Depth” (radiogroup), “Startup”, “Known competitors”. Help text is tied with aria-describedby.'],
          ['Keyboard order', 'Change company → Market → Target customer → Geography → Region focus → Depth → Startup → Known competitors → More context → Run. On results: Export → Refresh sources → Re-run → Save → findings → questions → competitor rows.'],
          ['Focus', '2px violet ring with a 2px offset on every control, dark and light. Never removed.'],
          ['Return focus', 'Classification panel, export dialog and phone sheets return focus to the control that opened them. After a run, focus moves to the results h1.'],
          ['Live regions', 'Running is role=status (polite). Run failed and a failed list read are role=alert. Startups loading is announced once; the arrival does not move focus.'],
          ['State words', 'Supported, Partial, Insufficient evidence, No candidates, Unavailable, Refused, Not recorded, Not verified: each with its own glyph and border. Never colour alone.'],
          ['Targets', '44px minimum on phone and tablet; the phone Run and Re-run bar is 48px and stays visible.'],
          ['Tables', 'Competitor table has a caption and column headers; each source chip reads “Source 1, home, fetched”.']])),
      RCA13: () => dk('<h1>Handoff</h1><p>Checked against main <code>87bf3ac4ac</code> on Mon 16 Nov 2026.</p>'
        + tbl(['Checked on main', 'What it showed'], [
          ['<code>frontend/src/lib/companyDirectoryView.js</code> analysisHref', 'The profile button sends <code>?tab=analyses&amp;market=&lt;name&gt;&amp;website=&lt;url&gt;</code>. No uid.'],
          ['<code>components/CompetitorAnalysis.jsx</code>', 'The query writes the website into Known competitors as “Official website: …” (the self-match). When the startup list arrives, mode flips to startup and the first startup is chosen, so its sector replaces the market (the replaced subject). Depth Quick/Deep; Region select; nudge and problem. Saved list has loading, failed and empty states.'],
          ['<code>services/competitorAnalysis.ts</code>', 'Known competitors become “direct” candidates with no check against the subject. With no AI output, normalizeOutput writes three fixed gaps, a wedge and three next actions.'],
          ['<code>routes/competitors.ts</code>', 'analyze (400 market_required, 403 forbidden for a project, 500 analysis_failed), get, patch, per-candidate patch/add/remove/crawl, rerun, refresh, export md/json. Markdown has no subject or evidence line.'],
          ['Schema (baseline)', '<code>competitor_analyses</code> (inputs_json, mode, project_id; no subject uid), <code>competitor_candidates</code> (category, origin, scores_json), <code>competitor_sources</code> (candidate_id, url, kind, status = HTTP code), <code>competitor_analysis_outputs.output_json</code>.'],
          ['<code>pages/research/CompanyAnalysis.jsx</code>, <code>companyAnalysisRead.js</code>', 'Four tiles (Competitors, Direct, Adjacent, Sources fetched), Not recorded for a failed run, inputs row, feature grid, signal columns, gaps, wedge, next steps, notes. Kept.'],
          ['research_company_directory (migration 228)', 'website, source_name, source_url, source_license, as_of. Companies House rows carry no website. No verification column.']])
        + '<h2>Requires engineering ◇ #7041</h2>' + tbl(['Item', 'Why'], [
          ['Durable subject uid on the run', 'competitor_analyses has no subject column; the subject today exists only as text in inputs_json.market. Needed for the subject bar, the list column and export.'],
          ['Self-match protection', 'Refuse the subject name, uid and domain as known or discovered candidates; record it as “Excluded”.'],
          ['Verified website status', 'A checked state and date for research_company_directory.website. Until then the card says Not verified.'],
          ['Claim-to-source references', 'output_json sentences carry source ids; sources are linked to candidates only today. Needed for citation chips and quoted passages.'],
          ['No fallback findings', 'normalizeOutput must not write fixed gaps, wedge or next actions; with 0 sources it returns an Insufficient evidence result.'],
          ['Evidence status in list and export', 'A derived status (Supported, Partial, Insufficient evidence, No candidates) on the list payload and in the Markdown/JSON export, with Subject and a Suggested questions heading.']])
        + '<h2>Frontend only</h2><ul><li>Send <code>company=&lt;uid&gt;</code> from the profile, read GET /api/research/company-directory/:uid and draw the subject card; stop writing the website into Known competitors.</li><li>Never switch mode or pick a startup when the list arrives; association only by an explicit choice; “Fill empty fields” is explicit.</li><li>Split Market question, Startup and Known competitors into separate groups; keep the subject bar on setup and results.</li><li>Draw “Next steps the run listed” as Suggested research questions, apart from findings; distinguish No candidates from Unavailable reads using competitor_sources.status.</li><li>Tablet and phone layouts; dark tokens as on RCA11.</li></ul>'
        + '<h2>Pending the owner ⚑</h2><ul><li>A run on an unverified or missing website is allowed and labelled (A drawn), or blocked (B).</li><li>Unsupported gaps and wedge lines move to Suggested research questions (A drawn), or are dropped (B).</li></ul>'
        + '<h2>Preserved</h2><p>Routes, the Companies tabs, the four tiles and their 0 vs Not recorded rule, per-row classification change, Re-run, Refresh sources, Save, Export, the Eadwyn rail. Sample companies, people and figures are fictional.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RCA01') html = page(profile(), { h: 900 });
    else if (B === 'RCA02') html = page(setup('loading'), { h: 1300 });
    else if (B === 'RCA02B') html = setupCrop('loaded', 'After the startups load · nothing is chosen for you · the subject is unchanged');
    else if (B === 'RCA02C') html = setupCrop('chosen', 'After you choose a startup · the subject is still Halden Grid');
    else if (B === 'RCA02D') html = subjVariants();
    else if (B === 'RCA03') html = page(custom(), { h: 1300 });
    else if (B === 'RCA04') html = running();
    else if (B === 'RCA05') html = page(supported(), { h: 1500, rail: railA });
    else if (B === 'RCA05B') html = support();
    else if (B === 'RCA06') html = page(partial(), { h: 1300 });
    else if (B === 'RCA07') html = page(insufficient(), { h: 960 });
    else if (B === 'RCA07B') html = states();
    else if (B === 'RCA08') html = exportPv();
    else if (B === 'RCA09') html = tabSetup();
    else if (B === 'RCA09B') html = tabRes();
    else if (B === 'RCA11') html = page(supported(), { h: 1500, rail: railA });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(supported(), { h: 1500, rail: railA });
    return { html: { __html: html } };
  }
}
