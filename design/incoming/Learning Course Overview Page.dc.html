      if (o.cred && l.n === 10) p.push('passing records an exam result; no certificate is issued');
      return p.join(' · ');
    };
    const row = (l, P, o) => {
      o = o || {};
      const s = P[l.n];
      const on = o.next === l.n;
      const nx = on ? `<span class="nx">${o.nw || 'Start here'}</span>` : '';
      const name = `${l.t} · lesson ${l.n} of 10, ${KIND[l.k].toLowerCase()}, ${l.r ? 'required' : 'optional'}, ${sword(s)}`;
      const title = o.nolink === l.n ? `<span class="na2">${l.t}</span>` : `<a href="#" aria-label="${name}"${on ? ' aria-describedby="nxd"' : ''}>${l.t}</a>`;
      if (o.ph) return `<li class="lr${l.r ? '' : ' opt'}${on ? ' on' : ''}"><span class="ln">${l.n}</span><span class="li">${ICO[l.k]}</span><div class="lt">${title}<div class="lmr"><span class="lm">${meta(l, o)}</span>${stat(s)}${nx}</div></div></li>`;
      return `<li class="lr${l.r ? '' : ' opt'}${on ? ' on' : ''}"><span class="ln">${l.n}</span><span class="li">${ICO[l.k]}</span><div class="lt">${title}<span class="lm">${meta(l, o)}</span></div><div class="lx">${nx}${stat(s)}</div></li>`;
    };
    const modh = (m, o) => {
      const rq = L.filter((l) => l.m === m && l.r).length;
      const op = L.filter((l) => l.m === m && !l.r).length;
      return `<div class="mh"><h3>Module ${m} · ${MT[m]}</h3><span class="mcn">${rq} required · ${op} optional${o.tot && o.tot[m] ? ' · ' + o.tot[m] : ''}</span></div>`;
    };
    const mod = (m, P, o, only) => {
      o = o || {};
      const ls = L.filter((l) => l.m === m && (!o.reqOnly || l.r) && (!only || only.indexOf(l.n) >= 0));
      return `<li>${modh(m, o)}<ol class="ll">${J(ls.map((l) => row(l, P, o)))}</ol></li>`;
    };
    const LG = `<div class="lgd2"><span>${ICO.reading}Reading</span><span>${ICO.exercise}Exercise</span><span>${ICO.exam}Exam</span><span><span class="op">Optional</span>not counted toward completion</span></div>`;
    const SEG = (req) => `<div class="seg" role="radiogroup" aria-label="Show lessons"><button type="button" role="radio" aria-checked="${!req}">All 10</button><button type="button" role="radio" aria-checked="${!!req}">Required only · 7</button></div>`;
    const LENNOTE = `<p class="note"><span aria-hidden="true">—</span><span><b style="color:var(--ink)">Lesson lengths are not recorded.</b> 1 h 25 min is the author’s estimate for the whole course; no lesson gets an estimate of its own.</span></p>`;
    const syl = (P, o) => {
      o = o || {};
      return `<section class="cd" aria-labelledby="syl"><div class="ch"><h2 id="syl">Syllabus</h2><span class="sm">10 lessons · 7 required · 3 optional</span></div><div class="sbar">${SEG(o.reqOnly)}${o.ph ? '' : LG}</div><ol class="mods">${mod(1, P, o)}${mod(2, P, o)}</ol>${o.lenNote === false ? '' : LENNOTE}${o.foot || ''}</section>`;
    };

    /* ---------- commitment band: output, commitment and next action together ---------- */
    const doneReq = (P) => L.filter((l) => l.r && P[l.n] === 'done').length;
    const bar = (n) => `<span class="bar" role="progressbar" aria-label="Required lessons completed" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${n}" aria-valuetext="${n} of 7 required lessons"><i style="width:${Math.round((n / 7) * 100)}%"></i></span>`;

      resume: (ph) => `<p class="pgl"><b>3 of 7</b> required lessons completed · ${mo('43%')}</p>${bar(3)}${ph ? '' : '<button type="button" class="btn p big">Resume lesson 6</button>'}<p class="tgt" id="nxd">Opens <b>${L[5].t}</b>, the lesson you last opened and have not finished.</p>`,

        <dl class="cmf"><div><dt>Time</dt><dd><b>${C.est}</b><small>the author’s estimate for the whole course</small></dd></div><div><dt>Required</dt><dd><b>7 lessons</b><small>5 readings, 1 exercise, 1 exam</small></dd></div><div><dt>Optional</dt><dd><b>3 readings</b><small>open them any time</small></dd></div></dl>

    /* ---------- side column: progressive About ---------- */
    const OUTS = (all) => `<section class="cd" aria-labelledby="ouh"><div class="ch"><h2 id="ouh">You’ll be able to</h2><span class="sm">5 outcomes</span></div><ol class="oc" id="ocl">${J(OUTC.slice(0, all ? 5 : 3).map((x) => `<li>${x}</li>`))}</ol><button type="button" class="btn t" aria-expanded="${all}" aria-controls="ocl" style="align-self:flex-start">${all ? 'Show fewer' : 'Show all 5 outcomes'}</button></section>`;
    const PREQ = (nr) => `<section class="cd" aria-labelledby="prh"><div class="ch"><h2 id="prh">Before you start</h2></div>${nr ? `<p>${NR('prerequisites')}</p>` : `<ul class="pq">${J(PRE.map((x) => `<li>${x}</li>`))}</ul>`}</section>`;
    const DET = (o) => {

    const phone = (body, stk, o) => `<div class="${CV} ph fx" style="width:390px">${o && o.banner ? o.banner : ''}${phTop('Course')}<main class="pbd" style="overflow:hidden">${body}</main>${stk ? `<div class="stk">${stk}</div>` : ''}</div>`;

    /* ===== phone 390 ===== */
    else if (B === 'LCO10') html = phone(`<nav aria-label="Breadcrumb" class="crumb"><a href="#">‹ Learning</a></nav>${PHEAD}${COMMIT('start', { ph: 1 })}${phSyl(P0, { next: 1 }, [[1, [1, 2]]])}`, STK.start);
    else if (B === 'LCO11') html = phone(`${phSyl(P0, { next: 1 }, [[1, [1, 2, 3, 4, 5]], [2, [6]]])}`, STK.start);
    else if (B === 'LCO12') html = phone(`<ol class="mods">${mod(2, P0, { ph: 1, next: 1 })}</ol>${LENNOTE}${OUTS(false)}`, STK.start);
    else if (B === 'LCO13') html = phone(`${PHEAD2}${COMMIT('resume', { ph: 1 })}<ol class="mods">${mod(2, P1, { ph: 1, next: 6, nw: 'Resume here' }, [6, 7])}</ol>`, STK.resume);
    else if (B === 'LCO14') html = phone(`${PHEAD}${COMMIT('done', { ph: 1 })}<ol class="mods">${mod(2, P2, { ph: 1 }, [7, 8, 9])}</ol>`, '');
    else if (B === 'LCO15') html = phone(`<div class="ann">${LBL('Observed · Super Admin, draft')}</div><ol class="mods">${mod(2, P0, { ph: 1, draft: 1 }, [8, 9, 10])}</ol>${DET({ draft: 1, nores: 1 })}`, STK.start, { banner: `<div class="bn sup" role="status" style="display:block;padding:10px 16px;line-height:1.5"><b>Author preview · ◆ Draft.</b> Members cannot open this course yet. <a href="#" style="font-weight:700;text-decoration:underline">Edit in Studio</a></div>` });
    else if (B === 'LCO16') html = phone(`${OUTS(true)}${PREQ()}${DET({})}${RES}`, STK.start);
    else if (B === 'LCO17') html = phone(`<nav aria-label="Breadcrumb" class="crumb"><a href="#">‹ Learning</a></nav><header class="hdr"><div class="hrow"><div><span class="eye">Learning · Course</span><h1>Course</h1></div></div></header><section class="cd" role="alert"><p>${UN()}</p><p class="sub">The course could not be read. This is not a claim that the course has no lessons.</p><button type="button" class="btn" style="align-self:flex-start">Retry</button></section><section class="cd" aria-busy="true" aria-label="Loading the course">${sk('70%', 14)}${sk('100%')}${sk('90%')}${sk('40%', 36)}</section>`, '');

    /* ===== LCO03 · syllabus component variants ===== */
    else if (B === 'LCO03') {
      const v = (cap, l, P, o) => cell(cap, lone(l, P, o));
      html = crop(1300, `<div class="ch"><h2 style="font-size:17px">Syllabus components · lesson rows, module headers, filter</h2><div class="ann">${LBL('Variants')}</div></div>

          ${v('<b>Completed</b>', L[2], P2)}
          ${v('<b>Optional reading</b> · raised row, the word Optional, muted icon', L[3], P0)}
          ${cell('<b>Exercise</b> with its summary ' + TB('#8288 · lesson summary'), lone(L[6], P0))}
          ${cell('<b>Exam</b> with its summary ' + TB('#8288 · lesson summary'), lone(L[9], P0))}

          ${cell('<b>Module headers</b>', `<div class="cd" style="gap:10px">${modh(1, {})}${modh(1, { tot: { 1: '49 min' } })}<div class="mh"><h3>Module 2 · ${NR('title')}</h3><span class="mcn">4 required · 1 optional</span></div></div>`)}

          ${cell('<b>Legend</b> · words beside every icon', `<div class="cd">${LG}</div>`)}

      const m1 = (o) => `<ol class="mods ph2">${mod(1, P0, Object.assign({ ph: 1 }, o))}</ol>`;

        ${cell('<b>B · some recorded</b> · ' + 'Synthetic', `<div class="cd">${m1({ len: LENB })}<p class="note"><span aria-hidden="true">—</span><span>Lengths are recorded for 2 of 5 lessons in this module, so no module total is shown.</span></p></div>`)}
        ${cell('<b>C · all recorded</b> · Synthetic', `<div class="cd">${m1({ len: LENC, tot: { 1: '49 min' } })}<p class="note"><span aria-hidden="true">i</span><span>A module totals only when every lesson has a length. Module 2 can never total on main: exercise and exam lessons carry no length (route rule #4180).</span></p></div>`)}

    else if (B === 'LCO05') {

        ${cell('<b>Before · 25 Nov</b> · the right column was mostly absence', `<div class="was"><span class="wl">Before</span><div class="cd" style="gap:6px"><b>Resources</b><span class="foot">No resources · The author has attached no resource to this course.</span></div><div class="cd" style="gap:6px"><b>Certificate</b><span class="foot">Certificates are not issued for courses yet.</span></div></div>`)}
        ${cell('<b>Credential · option A (drawn)</b> ' + TO('owner · credential copy'), `<div class="cd"><p class="sub">No certificate card and no certificate line on the overview. Nothing is issued (MyLearning and LearningWired both say so), so the page says nothing about it. The exam’s own page (#8667) states what passing records.</p></div>`)}
        ${cell('<b>Credential · option B</b> · one line on the exam row only', `<ol class="ll ph2" style="background:var(--card)">${row(L[9], P0, { cred: 1, ph: 1 })}</ol>`)}

        ${cell('<b>Nothing recorded</b> · one sentence (main’s ABOUT_NOT_RECORDED)', `<section class="cd"><div class="ch"><h2>About this course</h2></div><p>${NR()}</p><p class="sub">Who this course is for, what it teaches and what it assumes are not recorded yet.</p></section>`)}

        ${cell('<b>Unavailable</b> · Retry keeps focus on the button', `<section class="cd" role="alert"><p>${UN()}</p><p class="sub">The course could not be read. This is not a claim that the course has no lessons.</p><div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn">Retry</button><span class="foot">While retrying: “Retrying…”, disabled</span></div></section>`)}
        ${cell('<b>No such course</b> · also a draft opened by a member (404)', `<section class="cd"><p><span class="s">○ No such course</span></p><p class="sub">This course does not exist, or it is not published.</p><a href="#" class="btn" style="align-self:flex-start">Back to Learning</a></section>`)}
        ${cell('<b>No lessons yet</b> · no Start, a reason instead', `<section class="cd"><div class="cma" style="padding:0;border:0">${ACT.none()}</div></section>`)}
        ${cell('<b>No required lesson</b> · no percentage, never 0%', `<section class="cd"><p class="pgl">No lesson is required, so there is no percentage.</p><button type="button" class="btn p big">Start lesson 1</button><p class="tgt">Synthetic. Start opens the first lesson.</p></section>`)}
        ${cell('<b>First required lesson not published</b> ' + TB('#8288 · lesson opens flag, proposed'), `<section class="cd"><ol class="ll ph2">${row(L[0], P0, { nolink: 1, ph: 1 })}</ol><button type="button" class="btn p big">Start lesson 2</button><p class="tgt">Synthetic. Start skips to the first required lesson that opens, by D5356’s rule.</p></section>`)}
      </div>`);
    }

    /* ===== LCO08 · focus order, names and wrapping ===== */
    else if (B === 'LCO08') {
      const fo = [
        ['1', '‹ Learning', 'link “Learning”', 'Returns to the tab and query the learner came from (#8662).'],
        ['2', 'Add to my plan', 'button', 'Existing AddToPlan; secondary.'],
        ['3', 'Start lesson 1 / Resume lesson 6', 'button, aria-describedby the target line', 'The one primary. On a phone the sticky bar holds the same control, placed in the DOM right after the progress line.'],
        ['4', 'All 10 · Required only · 7', 'radiogroup “Show lessons”', 'One tab stop; arrow keys switch. Counts never change with the filter.'],
        ['5–14', 'Lesson links in outline order', 'link, name = title · lesson n of 10, kind, required or optional, status', 'Visible title first, so the name contains the label.'],
        ['15', 'Show all 5 outcomes', 'button, aria-expanded, aria-controls the list', 'Focus stays on the button after expanding.'],
        ['16–17', 'Resources', 'link “…, opens in a new tab”', 'Only when resources exist.'],
        ['18', 'Eadwyn', 'button “Expand Eadwyn”', 'The shared rail (#5130).']
      ];
      html = crop(1300, `<div class="ch"><h2 style="font-size:17px">Focus order, accessible names and wrapping</h2></div>
      <div class="cells" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)">
        ${cell('<b>Focus order</b> · after the shell’s sidebar and top bar', `<section class="cd"><table class="tbl fx"><thead><tr><th>#</th><th>Element</th><th>Role and name</th><th>Note</th></tr></thead><tbody>${J(fo.map((r) => `<tr><td><span class="fm">${r[0]}</span></td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr>`))}</tbody></table></section>`)}
        <div class="cells">
          ${cell('<b>Headings and landmarks</b>', `<section class="cd"><ul class="pq"><li><code>h1</code> course title; one per page.</li><li><code>h2</code> (visually hidden) for the commitment band; <code>h2</code> Syllabus, You’ll be able to, Before you start, Course details, Resources.</li><li><code>h3</code> Module 1 · [Claims and evidence], Module 2 · [From register to decision memo].</li><li>Syllabus is an ordered list of modules, each an ordered list of lessons.</li><li>Progress: <code>role=progressbar</code>, valuetext “3 of 7 required lessons”.</li></ul></section>`)}
          ${cell('<b>Wrapping</b> · the longest title at desktop, 520px and phone', `<div class="tw"><ol class="ll" style="width:100%">${row(L[3], P0)}</ol><ol class="ll" style="width:520px">${row(L[3], P0)}</ol><ol class="ll ph2" style="width:358px">${row(L[3], P0, { ph: 1 })}</ol></div><p class="foot">Titles wrap and are never truncated or clamped; the status column is a fixed 150px on desktop and moves under the title on a phone. h1 wraps at 760px.</p>`)}
        </div>
      </div>`);
    }

    /* ===== LCO00 · journey, evidence and annotation key ===== */
    else if (B === 'LCO00') {
      const ev = [
        ['2 modules, 10 lessons and 0 of 7 required, but nowhere said what 7 and 10 mean', 'The band says 7 required (5 readings, 1 exercise, 1 exam) and 3 optional; the syllabus header says “10 lessons · 7 required · 3 optional” once; every row says Required or Optional.', 'LCO01, LCO03'],
        ['The lesson count appeared twice (card meta and a pill)', 'Counted once, in the syllabus header. The band counts required and optional, not the total.', 'LCO01'],
        ['Each of the ten rows said “Length not recorded”', 'One note under the syllabus; a length, when one exists, sits in the row’s meta line.', 'LCO04'],
        ['The right column spent its space on No resources and an unavailable certificate', 'No card when nothing is attached; no certificate card (option A).', 'LCO05, LCO02'],
        ['On a phone the duration badge squeezed titles into short columns', 'Titles take the full row width; status and markers go under the title.', 'LCO10, LCO11, LCO08'],
        ['The practical output was buried near the end of About this course', 'It leads the first screen, beside the commitment and Start.', 'LCO01, LCO10']
      ];
      const fl = [
        ['1', 'Find the course', 'From Learning or a course card (#8662 LHM, #8663 LCC).', '/learning?tab=courses'],
        ['2', 'Read the commitment', 'Output, time, 7 required, Start. Desktop LCO01 · phone LCO10.', '/learning/courses/:slug'],
        ['3', 'Scan the syllabus', 'Filter to Required only if wanted. Desktop LCO01 · phone LCO11, LCO12.', 'same page'],
        ['4', 'Start', 'Opens lesson 1, the first required lesson, in the reader (#8665 LRD).', '/learning/courses/:slug/:lesson'],
        ['5', 'Come back · Resume', 'Resume lesson 6 by D5356’s rule. Desktop LCO01B · phone LCO13. Exercise and exam open #8666 LEW, #8667 LEX.', 'same page'],
        ['6', 'Complete', '7 of 7 required; optional lessons stay open. Desktop LCO01C · phone LCO14.', 'same page']
      ];
      html = `<div class="${CV} doc"><div><span class="eye">Learning · #8664 · course overview and syllabus</span><h2 style="font-size:22px;margin-top:4px">Evidence-based pitch narratives · what the learner leaves with, what it asks, and where Start goes</h2><p class="sub" style="margin-top:6px;max-width:900px">The course page at <code>/learning/courses/evidence-based-pitch-narratives-v1</code>, redrawn from the 25 Nov production audit inside the existing Axal VC shell. Everything drawn is read by <code>GET /api/learning/courses/:slug</code> on main except what carries a ◇ tag.</p></div>
      <div><h3>Route · desktop 1440 and phone 390 are the same page</h3><div class="flow">${J(fl.map((x) => `<div><span class="fm">${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span><code>${x[3]}</code></div>`))}</div></div>
      <div><h3>Observed on 25 Nov → this canvas</h3><table class="tbl"><thead><tr><th>Observed</th><th>Now</th><th>Boards</th></tr></thead><tbody>${J(ev.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="mo">${r[2]}</td></tr>`))}</tbody></table></div>
      <div class="cols"><div><h3>Annotation key</h3><ul><li>${TB('issue')} needs data or backend work; #8288 when it is release work, “proposed” when no issue exists.</li><li>${TO('owner')} an owner decision; option A is drawn.</li><li>${LBL('Synthetic')} a state not observed in production.</li></ul></div><div><h3>States used</h3><ul><li>${NR()} a field the author left empty.</li><li>${NONE('none attached')} an answered empty list.</li><li>${UN()} the read failed; Retry.</li><li>${DRAFT} the course or exam is not published.</li></ul></div></div></div>`;
    }

    /* ===== LCO09 · engineering handoff ===== */
    else if (B === 'LCO09') {
      html = `<div class="${CV} doc"><div><span class="eye">Learning · #8664 · engineering handoff</span><h2 style="font-size:22px;margin-top:4px">Course overview and syllabus · handoff</h2><p class="sub" style="margin-top:6px">Checked against main <code>7b0db10927</code> on Thu 26 Nov 2026. Read-only; nothing here sends, publishes or grants.</p></div>
      <div class="cols">
        <div><h3>On main (checked)</h3><ul>
          <li><code>cloudflare-worker/src/routes/learning.ts</code> <code>GET /courses/:slug</code>: course (title, summary, level, <code>estimated_minutes</code>, <code>resources</code>, <code>status</code>, <code>published_at</code>, <code>meta</code>), modules, lessons (<code>kind</code>, <code>required</code>, <code>duration_seconds</code> joined for video and reading only, <code>progress</code>), and <code>progress {required, completed, percent}</code> over required lessons.</li>
          <li><code>services/learningCourseMeta.ts</code> (D4650): audience, stage, outcomes (≤ 8), prerequisites, author, reviewer, reviewed_on, <code>practical_output</code> (≤ 300 characters).</li>
          <li><code>services/learningResume.ts</code> (D5356): last started lesson, else first required not completed. Used by <code>/me</code> and Next for you, not by the course page.</li>
          <li><code>CourseOutline.jsx</code>: Start/Continue goes to the first lesson not ticked, optional included; the lesson count is drawn twice; <code>lengthsSent</code> tests the key, so every row says Length not recorded.</li>
          <li><code>LearningWired.jsx</code> <code>CourseView</code>: side column = Resources card + a Certificate card that always says not issued. <code>learningModel.js</code> <code>courseAbout</code> puts You’ll leave with fifth.</li>
          <li>Drafts: <code>canSeeLearning</code> lets a Super Admin read a draft; a member gets 404 “No such course”.</li></ul></div>
        <div><h3>Acceptance → boards</h3><ul>
          <li>First screen explains output, commitment and next action: <b>LCO01, LCO10</b>.</li>
          <li>Syllabus distinguishes 7 required from 10 total: <b>LCO01, LCO03, LCO11</b>.</li>
          <li>All ten titles fit at 390px and desktop: <b>LCO01, LCO11, LCO12, LCO08</b>.</li>
          <li>A missing duration never earns a repeated badge or an invented estimate: <b>LCO04</b>.</li>
          <li>Start opens the first required lesson: <b>LCO01, LCO10, LCO07</b>.</li>
          <li>Resume: <b>LCO01B, LCO13</b>. Completion: <b>LCO01C, LCO14</b>.</li>
          <li>Conditional resources: <b>LCO05, LCO02</b>. Optional lessons: <b>LCO03, LCO11</b>.</li>
          <li>Draft visibility explicit in author preview: <b>LCO02, LCO15</b>.</li>
          <li>Outcomes and prerequisites progressive: <b>LCO06, LCO16</b>. States: <b>LCO07, LCO17</b>. Focus, names, wrapping: <b>LCO08</b>.</li></ul></div>
        <div><h3>Frontend only</h3><ul>
          <li>Commitment band from <code>meta.practical_output</code>, <code>meta.audience</code>, <code>meta.stage</code>, <code>level</code>, <code>estimated_minutes</code> and the lessons’ <code>required</code> and <code>kind</code>.</li>
          <li>Start = first required lesson; Resume = D5356’s rule applied to the lessons the route sends (started, else first required not completed).</li>
          <li>Count lessons once; Required/Optional words on rows; the All · Required only filter.</li>
          <li>Lengths: test <code>!= null</code>; meta line, not a column.</li>
          <li>Drop the Certificate card; Resources card only when the list is not empty.</li>
          <li>Outcomes 3 then Show all; author preview banner from <code>course.status</code>.</li></ul></div>
        <div><h3>Requires data or backend ◇</h3><ul>
          <li>${TB('#8288')} lesson summaries on the course read: exercise answer limit, exam question count, time limit, pass mark, attempts. Today they are read on the exercise and exam pages only.</li>
          <li>${TB('#8288')} the exam’s and item’s own publication status per lesson, so the author preview marks a draft exam and Start skips a lesson that opens nothing.</li>
          <li>${TB('#8288')} the course’s <code>completed_at</code> (read by the route, not sent).</li>
          <li>${TB('proposed')} the resume lesson on the course read itself (<code>resumeLessons</code>), so “last started” uses <code>updated_at</code>, which the lesson progress does not send.</li></ul></div>
        <div><h3>Owner questions ⚑ (option A drawn)</h3><ul>
          <li>${TO('credential')} A: say nothing about certificates on the overview until one is issued. B: one line on the exam row.</li>
          <li>${TO('filter')} A: All is the default and the filter is not remembered. B: remember Required only per learner.</li>
          <li>${TO('time')} A: show <code>estimated_minutes</code> as “About 1 h 25 min”. B: show “85 min”, as the course cards do (#8663).</li></ul></div>
        <div><h3>Coordination</h3><ul>
          <li>#8288 owns the functional release; the ◇ items are listed there for sizing.</li>
          <li>Siblings: #8662 LHM (back link keeps tab and query), #8663 LCC (card shows the same output, time and 7 required), #8665 LRD (lesson 1 reader, outline sidebar uses these rows), #8666 LEW (Pitch decision memo, 2,000 characters), #8667 LEX (exam: 8 questions, untimed, 75%, 3 attempts, draft), #8668 LPL (Continue learning names the same lesson as Resume), #8669 LST (Studio fields behind the band).</li>
          <li>Syllabus titles, modules and the exam follow the shared catalogue (<code>LEARN_CATALOGUE.md</code>, from #8665 LRD); bracketed titles are synthetic. Prior umbrella #3726; landed look: <code>design/incoming/Learning.dc.html</code>.</li></ul></div>
      </div></div>`;
    }

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lco-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
