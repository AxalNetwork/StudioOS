        + '<div class="cols"><div><h2>One observation</h2><p>A metric (label and key), a value (it can be empty, never 0), a unit, a geography (type and code), the period measured, a status, the retrieval time, an edition (<code>vintage</code>), and the earlier row it replaced (<code>supersedes_observation_id</code>, set on the newer row; “Replaced by” is derived from it). Its source: name, link, dataset or edition, methodology link, usage note. Rows are never edited: a provider revision is a new row.</p>'
        + '<h2>Three dates, always labelled</h2><p><b>Period measured</b> · the period the figure describes (<code>period</code>, e.g. 2025). <b>Published</b> · when the source published it (<code>published_at</code>: the column exists and is empty in every row; ◇ #7709 fills it; until then it reads Not recorded and never borrows another date). <b>Retrieved</b> · when Axal read it (<code>retrieved_at</code>). Stale and Fresh always say they count from Retrieved.</p></div>'
        + '<div><h2>Five statuses</h2>' + tbl(['Status', 'Means'], [[ss('actual'), 'The source calls it actual'], [ss('estimate'), 'The source calls it an estimate'], [ss('forecast'), 'The source calls it a forecast'], [ss('axal'), 'Computed by Axal, not published by a source'], [ss('unspecified'), 'The source does not say. <b>Every row held today</b> (<code>worldBankStatus()</code> returns <code>unspecified</code>)']])
        + '<h2>Four figure states ' + ENG('#7716') + '</h2><p>' + FS.none() + ' the catalogue expects the metric, no row is held<br>' + FS.fail() + ' the value still shows<br>' + FS.stale() + '<br>' + FS.nocov() + '</p></div></div>'
        + '<h2>Every value on these boards</h2>' + tbl(['Value on screen', 'Read from', 'Stored in', 'Today'], [
          ['Country name, region, two-letter code', '<code>GET /api/research/geographies/:code</code>', '<code>research_countries</code>', TODAY],
          ['Demand per country · Not recorded with its reason', 'same, <code>demand.reason</code>', 'no store', TODAY + ' (stays as built)'],
          ['Metric label, value, unit, period, status, retrieved, edition, the row it replaced', '<code>GET /api/research/market-data/countries/:iso3</code> (three-letter code only)', '<code>research_market_observations</code>', TODAY + ' · status always Unspecified; edition = retrieval time'],
          ['Source name, link, dataset, methodology link, usage note; last successful read', 'same read; <code>GET /api/research/market-data/sources</code>', '<code>research_market_sources</code>', TODAY],
          ['Published date; the provider’s own edition', '◇', '<code>.published_at</code>, <code>.vintage</code>', ENG('#7709')],
          ['A country’s figures asked for with the page’s two-letter code', '◇ <code>GET /api/research/observations</code>', 'mapping constant in the new service', ENG('#7716')],
          ['One observation with its chain of revisions', '◇ <code>GET /api/research/observations/:id</code>', 'same table', ENG('#7716')],
          ['Definition, what it counts, scale, currency and price basis, industry scheme and code, size band, limitations', '◇ <code>…/observations/metrics</code> and new nullable columns', '<code>research_market_metrics</code> (new)', ENG('#7716')],
          ['The four figure states', '◇ computed by the Worker from the catalogue, the source row and its refresh policy', '—', ENG('#7716')],
          ['The country file; figures a source’s terms keep out of it, counted by source', '◇ <code>GET /api/research/observations/export.csv</code>; on main <code>…/market-data/export.csv?country=DEU</code> exports every row', 'new export column on <code>research_market_sources</code>', ENG('#7716')],
          ['Enterprises, net turnover, persons employed by activity, size band, year; status Estimate', '◇', 'same table', ENG('#7717')]])),
      RMO06: () => dk('<h1>RMO-06 · Main task path and keyboard (clickable)</h1><p>A founder opens Germany, reads one figure’s three dates, opens the value it replaced, closes the sheet and downloads the file. Each step is one click or keystroke on the frame named; in the prototype each frame links to the next. The same path works for an investor, advisor, operating partner or admin: every licence that opens Geographies reads these figures (<code>researchAccess.js</code>: geographies ALL).</p>'
        + tbl(['Step', 'Action', 'Frame', 'Focus after', 'Announced'], [
          ['1', 'Research › Geographies › Germany', 'RMO-02', 'h1 “Germany”', 'page title'],
          ['2', 'Inspect on the row “Unemployment, 2025” (Enter or click anywhere on the row)', 'RMO-02 → RMO-01 B', 'the sheet’s heading', 'dialog name “Unemployment”'],
          ['3', 'Read Period measured · Published · Retrieved', 'RMO-01 A / B', 'unchanged', 'the three labelled lines in order'],
          ['4', '“Replaced by” link, or “Open the value held now →”', 'RMO-01 B → the [3.4] observation', 'the new heading, same sheet', '“Showing the value retrieved 12 Nov 2026”'],
          ['5', 'Close (button, ✕ or Escape)', 'RMO-02', 'the Inspect button of the row that opened the sheet', '—'],
          ['6', 'Download these figures (CSV)', 'RMO-02', 'unchanged', 'polite: “File downloaded: 8 figures for Germany. 3 figures from [Source B: Open Registry Sample] are not in the file.” · failed, assertive: “Download failed. Nothing changed. Try again.”'],
          ['Phone', 'Tap a card; the bottom sheet; swipe down or Close', 'RMO-04 A → B → C', 'the card that opened it', 'same wording']])
        + '<h2>Keyboard</h2><p>Tab moves through the country strip, Go to a country, the figures block’s rows (one Inspect button per row, labelled “Inspect &lt;metric&gt;, &lt;period&gt;”), the source and methodology links of each group, then Download. In the sheet: focus is trapped; the order is ✕, the links in reading order (Replaced, Replaced by, Source, Methodology), Close. Escape closes from anywhere in the sheet. No control inside the sheet writes anything.</p>'),
      RMOH: () => dk('<h1>RMO-H · Handoff · Research Markets observations (#7703 pass 1 A)</h1>'
        + '<p>Built by <b>#7718</b> (frontend, slot S16, blocked on #7716). The inspector is mounted unchanged by the study’s Evidence section (RST-08, pass 2). The Geography page’s companies, funds and signals stay as built (D546).</p>'
        + '<h2>Per board</h2>' + tbl(['Board', 'Recorded today', '◇ waits on'], [
          ['RMO-01 A · inspector', 'metric label, value, unit, period, status (always Unspecified), retrieved, edition as the retrieval run, source name, link, dataset, methodology link, usage note', ENG('#7709') + ' published date, provider edition · ' + ENG('#7716') + ' definition, what it counts, scale, currency and price basis, industry and size band, limitations, one-observation read'],
          ['RMO-01 B · replaced', '<code>supersedes_observation_id</code> on the newer row; both rows kept', ENG('#7716') + ' the chain in one read (on main the client derives “Replaced by” from the country list)'],
          ['RMO-01 C · missing values', 'Published empty in every row; Unspecified', ENG('#7716') + ' definition Not recorded; an empty value only arrives from a writer that keeps it (see findings)'],
          ['RMO-02 · country figures', 'Source A rows and source fields', ENG('#7716') + ' the read by two-letter code · ' + ENG('#7717') + ' every Source B row'],
          ['RMO-03 · states', 'loading, Unavailable with Try again, empty', ENG('#7716') + ' the four figure states; Not recorded on a definition'],
          ['RMO-04 · phone, RMO-05 · dark, RMO-06 · path', 'as their desktop boards', 'as their desktop boards']])
        + '<div class="cols"><div><h2>Checked on main (58ee9d1b73)</h2><p><code>routes/research_market_data.ts</code>: four routes, each behind <code>requireAuth</code> only; the country read takes <code>^[A-Z]{3}$</code> and returns every row for the country, all periods and every superseded row, ordered by metric, period, retrieval. <code>services/researchMarketData.ts</code>: status is always <code>unspecified</code>, <code>published_at</code> NULL, <code>vintage</code> = the run time; a row is inserted only when the value changed; an empty provider value is skipped. <code>sql/migrations/767_research_market_global_data.sql</code>: the two tables; six sources, World Bank the only one enabled. <code>pages/research/GeographyProfile.jsx</code>: two-letter <code>:code</code>, the Demand card “Not recorded”, no call to the market-data reads. <code>lib/api/researchMarkets.js</code> has <code>countryMarketData(iso3)</code> and <code>marketDataCsvUrl()</code> with no caller.</p>'
        + '<h2>Findings for the builds</h2><p>1 · Retrieved is the first time a value was seen: an unchanged value is not re-inserted, so a row’s age is not the source’s freshness. Stale must count from the source’s last successful read or a last-confirmed date; the board says which date it uses (' + ENG('#7716') + '). 2 · Empty provider values are dropped by the ingest, so today “No value published” cannot occur and the metric reads No observation held (' + ENG('#7709') + ' one shared writer). 3 · <code>POST /market-data/refresh/world-bank</code> is open to any signed-in member; #7709 makes imports operator-run. Not drawn on any member screen. 4 · The CSV on main has no export rule: it exports every row of a source.</p></div>'
        + '<div><h2>Requires engineering (◇)</h2><p>#7709 published date and the provider’s edition. #7716 the read by two-letter code, one observation with its revisions, metric definitions and the new descriptive columns, the four figure states, the export with the terms rule and its count. #7717 enterprise counts, turnover and persons employed (Source B in these boards).</p>'
        + '<h2>Pending the owner (⚑)</h2><p>' + FL('pass 1 A') + ' <b>Earlier periods of a metric.</b> The read returns every period. A) the block shows the newest period per metric; earlier periods are in the file and in the inspector’s chain only. B) a row expands to its earlier periods. Drawn: A. Questions 8 and 9 of #7703 belong to pass 1 B (LCD).</p>'
        + '<h2>Frontend only</h2><p>The block, its grouping by source, the sheet and its focus return, the phone cards and bottom sheet, the dark tokens, live-region wording. Two-letter to three-letter mapping must not be done in the browser: it waits for ' + ENG('#7716') + '.</p>'
        + '<h2>Builds waiting</h2><p>#7718 (state:blocked) on #7716 (blocked) and #7709 (ready); Source B rows on #7717 (blocked). Released by landing this pass with LCD as <code>D7703.md</code>.</p></div></div>'
        + '<h2>Accessibility</h2><p>One h1 per page; the sheet is a modal dialog named by its heading, focus trapped, Escape closes, focus returns to the row’s Inspect button. Each figure state and status is a word with its own glyph and border; none relies on colour. A missing value is the words “No value published” or “No value”, never 0 or a blank. Targets 44px on phone; no table wider than the screen.</p>')
    };

    let html;
    const g = DOCS[B];
    const pageMain = (blk, o) => pageF(head + stats + (blk || block(o)) + rest, o);
    if (g) html = g();
    else if (B === 'RMO01' || B === 'RMO05') html = pageMain(null, { h: 1180, overlay: sheet(inspA(), 'pop') });
    else if (B === 'RMO01B') html = pageMain(block({ rows: { une: { on: true } } }), { h: 1180, overlay: sheet(inspB(), 'une') });
    else if (B === 'RMO01C' || B === 'RMO05B') html = crop('<span class="eye">RMO-01 C · values missing · each says so in words · drawn as sheets at the inspector’s width</span><div style="display:grid;grid-template-columns:600px minmax(0,1fr);gap:20px;align-items:start"><aside class="rmo-sheet rmo-shst" role="dialog" aria-labelledby="rmo-sh-nv"><div class="rmo-shb">' + inspC() + '</div>' + sheetFoot + '</aside><div style="display:flex;flex-direction:column;gap:14px">'
      + '<div class="rmo-box"><h3>What a gap never becomes</h3><p>Empty value → “No value published”, never 0 and never a blank cell.</p><p>Published empty → Not recorded. It never borrows the retrieval date, the period or the edition.</p><p>No definition → Not recorded with the reason.</p><p>Unspecified → Unspecified. Never shown as Actual, never hidden.</p></div>'
      + axalLine
      + '<div class="rmo-box"><h3>Not applicable is not missing</h3><p>Industry and size band on a population figure, currency on a count of people: ' + NA() + ', in grey with no border, so it never reads as a gap.</p></div>'
      + '<div class="rmo-box"><h3>Estimate appears only on a ◇ sample</h3><p>Every row held today is ' + ss('unspecified') + '. ' + ss('estimate') + ' is drawn only on the Source B enterprise counts, which wait on ' + ENG('#7717') + '.</p></div></div></div>', 1440);
    else if (B === 'RMO02' || B === 'RMO05C') html = pageMain(null, { h: 1600 });
    else if (B === 'RMO03' || B === 'RMO05D') html = crop('<span class="eye">RMO-03 A · per figure · four states that never look alike ' + ENG('#7716') + '</span><section class="cd rmo-blk"><p class="rmo-sub">One row of each state, from both sources. In the block each sits in its source’s group.</p><div class="rmo-grp">' + fsRows() + '</div></section>'
      + '<div class="rmo-grid4"><div class="rmo-box"><h3>' + FS.none() + '</h3><p>The metric is in the catalogue for this source and country; the source holds no row. Never 0.</p></div><div class="rmo-box"><h3>' + FS.fail('Source failing') + '</h3><p>The last valid value still shows with its retrieval date and age: [61,300] persons, retrieved 9 Oct 2026, 41 days ago.</p></div><div class="rmo-box"><h3>' + FS.stale('Stale') + '</h3><p>Counts from Retrieved: 10 Sep 2026, 70 days ago, against a monthly source. The value still shows.</p></div><div class="rmo-box"><h3>' + FS.nocov() + '</h3><p>No enabled source publishes this metric for Germany. No value, no period, no status.</p></div></div>', 1300);
    else if (B === 'RMO03B') html = crop('<span class="eye">RMO-03 B · the whole block · and the one-line answers</span><div class="rmo-grid2">'
      + '<div class="rmo-box"><span class="eye">Empty · the read worked and holds nothing</span>' + blockEmpty() + '<p>A member has no action here: figures arrive when HQ imports them. Never shown for a failed read.</p></div>'
      + '<div class="rmo-box"><span class="eye">Loading</span>' + blockLoad() + '<p>The stat cards, companies, funds and signals render from their own read and do not wait.</p></div>'
      + '<div class="rmo-box"><span class="eye">Unavailable · the observation read failed</span>' + blockUa() + '<p>Named: the country figures. Still works: the rest of the page (RMO-03 C).</p></div>'
      + '<div class="rmo-box"><span class="eye">Not recorded on Published and on a definition</span><dl class="rmo-dl">' + kv('Published', NR('the source gives no publication date')) + kv('Definition', NR('no definition is stored for this metric')) + '</dl><p>The same chip and words on desktop, phone and dark.</p></div>'
      + '<div class="rmo-box"><span class="eye">Download failed</span><div class="rmo-dlf" role="alert">' + chip('un', 'Download failed') + '<span>The file could not be downloaded. Nothing changed.</span>' + retry() + '</div><p>The block, the rows and any open sheet stay as they were.</p></div>'
      + '<div class="rmo-box"><span class="eye">Refused · does not apply</span><p>' + chip('na') + ' Every licence that opens Geographies reads these figures, so there is no Refused state for this block.</p></div></div>', 1300);
    else if (B === 'RMO03C') html = pageMain(blockUa(), { h: 940 });
    else if (B === 'RMO04A' || B === 'RMO05E') html = phone('Germany', pA());
    else if (B === 'RMO04B' || B === 'RMO05F') html = phone('Germany', pA(), pSheet(pInspB()));
    else if (B === 'RMO04C') html = phone('Germany', pA(), pSheet(pInspC()));
    else if (B === 'RMO04D') html = phone('Germany', pD());
    else if (B === 'RMO04E') html = phone('Germany', pE());
    else if (B === 'RMO06B') html = crop('<span class="eye">RMO-06 B · tab order through the block and the sheet · live-region wording</span><div class="rmo-grid2"><div class="rmo-box"><h3>The block</h3>'
      + '<div class="rmo-forow">' + fo(1) + '<span>Country strip, then Go to a country</span></div><div class="rmo-forow">' + fo(2) + '<span>Row Inspect buttons in reading order: Population … Research and development expenditure</span></div><div class="rmo-forow">' + fo(3) + '<span>' + SRC.A.name + ': Source ↗, Methodology ↗</span></div><div class="rmo-forow">' + fo(4) + '<span>' + SRC.B.name + ' rows, then its Source ↗</span></div><div class="rmo-forow">' + fo(5) + dl({ ring: true }) + '</div>'
      + '<div class="rmo-forow" style="margin-top:6px"><span class="raw">Focused row:</span><b>Unemployment, 2025</b><button type="button" class="rmo-ob rmo-ring" aria-label="Inspect Unemployment, 2025" aria-haspopup="dialog">Inspect<span aria-hidden="true">›</span></button><span class="raw">Enter opens the sheet</span></div></div>'
      + '<div class="rmo-box"><h3>The sheet</h3><div class="rmo-forow">' + fo('a') + '<button type="button" class="rmo-x rmo-ring" aria-label="Close and return to the row">✕</button><span>first stop; focus lands on the heading before it</span></div><div class="rmo-forow">' + fo('b') + '<a href="#">[3.4] percent, retrieved 12 Nov 2026 →</a></div><div class="rmo-forow">' + fo('c') + '<a href="#">' + SRC.A.name + ' ↗</a></div><div class="rmo-forow">' + fo('d') + '<a href="#">[Methodology notes] ↗</a></div><div class="rmo-forow">' + fo('e') + '<button type="button" class="btn">Close</button><span>then back to ✕</span></div>'
      + '<p>Escape closes. Focus returns to the Inspect button of the row that opened the sheet.</p></div>'
      + '<div class="rmo-box"><h3>Live regions</h3><div class="rmo-live" role="status"><span class="eye">polite</span>File downloaded: 8 figures for Germany. 3 figures from [Source B: Open Registry Sample] are not in the file.</div><div class="rmo-live a" role="alert"><span class="eye">assertive</span>Download failed. Nothing changed. Try again.</div><div class="rmo-live" role="status"><span class="eye">polite</span>Showing the value retrieved 12 Nov 2026.</div></div>'
      + '<div class="rmo-box"><h3>Rings and targets</h3><p>2px violet ring, 2px offset, on every control in light and dark. Row Inspect buttons are 32px on desktop and the whole card is the target on phone (at least 44px). Screen readers hear each row as “Unemployment, 3.4 percent, period 2025, status Unspecified, retrieved 12 Nov 2026, replaced an earlier value”.</p></div></div>', 1300);
    else html = pageMain(null, { h: 1600 });
    return { html: { __html: html } };
  }
}

</script>
