.rfm-ta{border:1.5px solid var(--hair2);border-radius:9px;background:var(--card);padding:9px 11px;font-size:13px;line-height:1.55;color:var(--ink);min-height:74px}
.rfm-field.rfm-dirty .rfm-ta{border-color:var(--amD)}
.rfm-field.rfm-fail .rfm-ta{border-color:var(--neg)}

.rfm-tests{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rfm-test{border:1px solid var(--hair);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;background:var(--card)}
.rfm-test p{font-size:12.5px;line-height:1.5}
.rfm-test small{font-size:11.5px;color:var(--mu);line-height:1.45}

.rfm-ev{font-size:12px;color:var(--mu);line-height:1.45}
.rfm-match{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--sg);color:var(--pos)}
.rfm-taken{font-size:12px;color:var(--ink);font-weight:600;line-height:1.45}
.rfm-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rfm-step{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}

.rfm-sh{display:flex;align-items:center;gap:8px}
.rfm-n{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--pri);color:#fff;font:700 11px var(--mo)}
.rfm-mini{display:flex;flex-direction:column;gap:8px;border:1px solid var(--hair2);border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.12);background:var(--card)}
.rfm-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rfm-ver{display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);border-radius:10px;padding:10px;background:var(--raised);min-width:0}

.rfm-ver .rfm-ta{font-size:12px}
.rfm-mdl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;font-size:12.5px;align-items:center}
.rfm-mdl dt{color:var(--mu);font-size:12px}
.rfm-mdl dd{margin:0}
.rfm-rail .rb section p{color:var(--ink)}
.rfm-e{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#7c3aed;color:#fff;font-weight:800;font-size:12px}
.rfm-chq .kv2 dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cd>.stt,.box>.stt{align-self:flex-start}
.cd>.rfm-id{align-self:flex-start}
.rfm-ex th{white-space:normal}
.rfm-id,.rfm-un{align-self:flex-start}

    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RFM00: () => dk('<h1>FND-S00 · Journey, routes and the annotation key</h1><p>Research Funds 3 of 5 (#7033). Continues the approved Research v2 canvas (RS-01 to RS-12) in the founder shell, after briefs 1 and 2 (Directory and vehicle identity). The quarterly report editor is brief 4. Sample now: Mon 16 Nov 2026. Bracketed names, notes and figures are fictional; Dawn Capital · Opp is the one real public catalogue row, shown with its publisher and dates.</p>'
        + '<h2>Routes and boards</h2>' + tbl(['Board', 'Route', 'State drawn'], [['FND-S01', '<code>/research/funds</code> (My funds tab, no param)', 'Populated, 1,284 saved, page 1 of 26'], ['FND-S01B', '<code>/research/funds?q=atlas</code>', 'Search across every saved fund'], ['FND-S01C', '<code>/research/funds</code>', 'Loading, first use, Unavailable, filtered empty, no round, counts Unavailable, offline, legacy row'], ['FND-S02', '<code>/research/funds/f_7Q2K</code>', 'Linked dossier, all saved'], ['FND-S02B', 'same', 'Cheque comparison, same-currency examples'], ['FND-S02C', 'same', 'Loading, 404, Unavailable, public record Unavailable, 410, Not recorded fields'], ['FND-S03', '<code>/research/funds/f_9M4T</code> + chooser Sheet', 'Legacy entry needing a choice'], ['FND-S03B/C', 'same; <code>/research/funds?view=directory</code>', 'Choice results; Directory to dossier by id'], ['FND-S04', '<code>/research/funds/f_7Q2K</code>', 'Dirty, stage saved, saving, saved'], ['FND-S04B/C', 'same', 'Failed with draft kept, offline, leave guard; conflict compare Sheet'], ['FND-S05/B', 'same', 'Existing brief draft; accepted, refused, failed'], ['FND-S06', 'all of the above at 390', 'Phone'], ['FND-S07', 'S01, S02, S04C', 'Dark']])
        + '<h2>Three decisions, never one</h2><p><b>Stage fit</b> (Right stage, Wrong stage, Not assessed), <b>Route in</b> (Warm path, No route in, Not recorded) and <b>Status</b> (Researching, Passed, with a pass reason) are separate columns since migration 216 and separate controls here. Not assessed is not Wrong stage; No route in is neutral.</p>'
        + '<h2>Identity, three kinds</h2><p>' + ID.cat('id') + ' a catalogue record, linked by <code>catalogue_uid</code> (D4613), opens <code>/research/funds/catalog/:id</code>. ' + ID.man() + ' created by hand, no public facts. ' + ID.leg() + ' saved before D4613 with no link; opens a chooser and is never linked by name.</p>'
        + '<h2>First use and recovery</h2><p><b>First use:</b> empty My funds → Browse the Directory → choose a vehicle → Add to my funds (idempotent on its id) → the dossier opens with the identity block linked → record stage, route, thesis, note → draft the brief. <b>Recovery:</b> a failed or conflicting save keeps the text on the page and offers Try again, Copy text or Compare; a legacy entry is resolved in the chooser; a list or count read failure shows Unavailable, never 0.</p>'
        + '<h2>Annotation key</h2><p>' + PT() + ' needs backend work, issue named. ' + FLAG('Owner') + ' an owner decision, option A drawn. Dashed violet boxes are annotations, not product copy.</p>'),
      RFM08: () => dk('<h1>FND-S08 · Keyboard, focus and announcements</h1><p>Every control has an accessible name, a visible 2px violet focus ring and a keyboard path. Status changes go to one polite live region per page; failures use role="alert" next to the field they concern.</p>'
        + '<h2>Focus sequence · dossier</h2>' + tbl(['#', 'Element', 'Keys'], [['1', 'Breadcrumb links', 'Tab'], ['2', 'Open catalogue vehicle → (or Choose the record… / Link to a catalogue vehicle…)', 'Enter'], ['3', 'Stage fit radiogroup', 'Tab in to the checked option; arrows change and save that field'], ['4', 'Route in radiogroup', 'same'], ['5', 'Status radiogroup, then Pass reason when Passed', 'same; reason saves with its own button'], ['6', 'View the source list ↗ (public record, read-only)', 'Enter'], ['7', 'Their thesis · Edit', 'Enter opens the field in place'], ['8', 'Note textarea, then Save note', 'Ctrl/Cmd+Enter saves the note'], ['9', 'Cheque range · Edit, Allocation ◇', 'Enter'], ['10', 'Open quarterly reports →', 'Enter'], ['11', 'Write into the note, Edit first, Discard', 'Enter'], ['12', 'Eadwyn rail', 'F6 moves between main and rail']])
        + '<h2>Shortlist</h2><p>Tabs (My funds, Directory) use arrows, Home and End, as on main. Filter chips are a radiogroup. Search is a labelled field; results are announced (“2 of 1,284 saved funds match atlas”). Each fund name is a link to its own uid. Pagination is a nav with Previous, the current page (aria-current) and Next.</p>'
        + '<h2>Where focus returns</h2>' + tbl(['Closes', 'Focus returns to'], [['Chooser Sheet · Cancel or Esc', 'Choose the record…'], ['Chooser Sheet · Link or Keep', 'The identity block heading, which now names the result'], ['Conflict Sheet · Cancel', 'The note textarea, text intact'], ['Conflict Sheet · a choice', 'The note textarea with the chosen text'], ['Leave guard · Stay and save', 'Save note'], ['Write into the note · accepted', 'The added “Pre-meeting brief:” section in the note']])
        + '<h2>Announcements</h2>' + tbl(['Event', 'Region', 'Words'], [['Field saved', 'polite', '“Stage fit saved.” plus “Your note is still unsaved.” when it is'], ['Note saved', 'polite', '“Note saved.”'], ['Save failed', 'alert', '“Your note did not save. Your text is still here.”'], ['Conflict', 'alert', '“Your note changed elsewhere. Compare both versions.”'], ['Linked / kept', 'polite', '“Linked to [Atlas AI] · [Fund I].” / “Kept as your own record.”'], ['Brief accepted', 'polite', '“Brief written into your note. Nothing was sent.”'], ['Search', 'polite', '“2 of 1,284 saved funds match atlas.”']])
        + '<h2>Phone</h2><p>Targets are at least 44px. Sheets rise from the bottom, trap focus and return it as above. The conflict compare becomes two tabs, Saved and Yours.</p>'),
      RFM09: () => dk('<h1>FND-S09 · Handoff</h1><p>Checked on main <code>87bf3ac4ac</code> (16 Nov 2026). Sample people, notes and figures are fictional; Dawn Capital · Opp (<code>dawncapital</code>, €75m, fund date 25 Sep 2023, EuroTech VC Funds (public spreadsheet), as of 4 Oct 2026) is committed public directory data from migration 378.</p>'
        + '<h2>Checked on main</h2>' + tbl(['Where', 'What it showed'], [
          ['<code>routes/research.ts</code> GET /funds', 'Owner-scoped, <code>ORDER BY created_at DESC LIMIT 500</code>, no search, offset or total. researched, right_stage, warm_path, passed and passed_without_reason counts and cheque_overlap_count are computed over those ≤500 rows.'],
          ['Same, cheque overlap', '<code>activeRaiseTargetCents</code> reads <code>raise_target_usd</code> from the active company’s project; overlap counts funds whose range includes the whole round (missing low end = 0). No target → null with a note, not 0.'],
          ['<code>services/researchFundRead.ts</code>', '<code>fundOverlapNote</code>: “Your raise target is $X — inside/outside the range they state. A note, not a score.” A missing end stays open.'],
          ['POST /funds, migration 202611092035', '<code>catalogue_uid</code> since D4613; partial unique index (owner, catalogue_uid). Rows saved earlier keep NULL; nothing backfilled.'],
          ['PATCH /funds/:uid', 'Writes only the keys sent (field-scoped already). No version or updated_at precondition, so a second tab silently wins.'],
          ['<code>FundsZone.jsx</code> dossierMap, <code>FundCatalogProfile.jsx</code>', 'Directory → dossier by normalized name (lowercase, non-alphanumerics removed). “Atlas A-I” and “Atlas AI” both become “atlasai”.'],
          ['<code>FundDossier.jsx</code> apply()', 'Every save re-reads the row and resets note, thesis, pass reason, source and cheque buffers. A stage change discards unsaved note text.'],
          ['ZoneDraft <code>research/funds</code>, writeBriefIntoNote', 'Accept appends “Pre-meeting brief:” after the stored note; refusals note_full and fund_not_found; nothing is sent. Page reloads via onAccepted={load}.'],
          ['<code>FundReportsPanel.jsx</code>', 'Quarterly reports on the dossier, each with a source URL. Drawn here only as an entry point.'],
          ['<code>researchFundDirectory.ts</code>', 'Directory sizes only for the EuroTech list (EUR); other lists answer “Not recorded: this list records no size in a known currency”. Catalogue route <code>/research/funds/catalog/:id</code>; 410 for a list taken down.']])
        + '<h2>Backend required (◇ #7033)</h2>' + tbl(['Item', 'Note'], [
          ['Pagination and search', 'GET /funds with q, limit, offset, sort and total; counts computed over all saved rows and labelled with their scope.'],
          ['Identity filter and legacy resolve', '?identity=legacy; PATCH catalogue_uid on a NULL row, refused 409 when another row holds it (the unique index already does).'],
          ['Conflict detection', 'PATCH carries the updated_at it read; 409 with the stored row when it changed.'],
          ['Allocation field', 'research_funds.intended_allocation_cents (USD) and an allocation count; compared only in the same currency.'],
          ['Public record on the dossier', 'GET /funds/:uid returns the linked catalogue row (or Unavailable / 410) separately from the private fields.']])
        + '<h2>Frontend only</h2><p>Per-field buffers and dirty flags in FundDossier; leave guard; dossier links and Directory map keyed by uid and catalogue_uid, not name; three separate decision controls; scoped feedback and focus return for Write into the note; status announcements.</p>'
        + '<h2>Open questions</h2><p>' + FLAG('Q1') + ' Is a legacy entry with one exact name match linked automatically? Drawn: no, always the chooser. ' + FLAG('Q2') + ' Does Keep as my own record stop future match prompts for good? Drawn: yes.</p>')
    };

    /* ---------- dispatch ---------- */
    let html;
    if (B === 'RFM07') html = shortlist();
    else if (B === 'RFM07B') html = linkedDossier();
    else if (B === 'RFM07P') html = mconflict();
    else if (B === 'RFM01') html = shortlist();
    else if (B === 'RFM01B') html = searchCrop();
    else if (B === 'RFM01C') html = listStates();
    else if (B === 'RFM02') html = linkedDossier();
    else if (B === 'RFM02B') html = chequeCrop();
    else if (B === 'RFM02C') html = dossierStates();
    else if (B === 'RFM03') html = legacyPage();
    else if (B === 'RFM03B') html = chooserResults();
    else if (B === 'RFM03C') html = dirCrop();
    else if (B === 'RFM03D') html = crop('<span class="eye">FND-S03D · A record you created by hand · /research/funds/f_K8P5</span>' + idBand('man') + '<div class="rfm-two"><section class="cd rfm-pub"><div class="ch"><h2>' + SH.lock + ' Public record</h2><span class="rfm-ro">Read-only</span></div><p style="font-size:12.5px">Not linked to a catalogue vehicle, so no public facts are shown. ' + NR('nothing is borrowed from a similar name') + '</p></section>' + privCard({ text: '[Angel collective; writes first cheques in hardware.]', count: '52', btn: '<button type="button" class="btn bsm" aria-disabled="true">Save note</button>' }).replace('[We back technical founders automating physical work, from first cheque to Series A.]', '[Twelve operators who write first cheques into hardware founders.]').replace('[atlas-a-i.vc/thesis] · 14 Mar 2026', '[keel.example/about] · 2 Oct 2026') + '</div>', 1300);
    else if (B === 'RFM04') html = flow();
    else if (B === 'RFM04B') html = failCrop();
    else if (B === 'RFM04C') html = conflictPage();
    else if (B === 'RFM05') html = briefCrop();
    else if (B === 'RFM05B') html = acceptCrop();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = linkedDossier();
    return { html: { __html: html } };
  }
}

</script>
