    const pfaBackend = (text) => '<span class="pfa-backend">◇ NEW UX CAPABILITY — backend support required</span><p class="pfa-small pfa-muted">' + text + '</p>';
    const pfaNav = (current, company) => '<nav class="pfa-nav" aria-label="' + (company ? 'Company workspace' : 'Portfolio') + '">' + (company ? ['Overview', 'Financials', 'Reports', 'Support', 'Activity'] : ['Overview', 'Positions', 'Reports', 'Performance', 'Value-add']).map(x => '<a href="#pfa-main"' + (x === current ? ' aria-current="page"' : '') + '>' + x + '</a>').join('') + '</nav>';
    const pfaFacts = (pairs) => '<dl class="pfa-facts">' + pairs.map(([k,v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') + '</dl>';
    const pfaTable = (caption, heads, rows) => '<table class="pfa-table"><caption>' + caption + '</caption><thead><tr>' + heads.map(x=>'<th scope="col">'+x+'</th>').join('') + '</tr></thead><tbody>' + rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('') + '</tbody></table>';
    const pfaFrame = (title, tab, body, opts) => {
      opts = opts || {}; const co = opts.company === true; const phone = opts.phone === true;
      const heading = '<div class="pfa-heading"><div class="pfa-stack" style="gap:7px"><p class="pfa-meta">Account › <a href="#pfa-main">Portfolio</a>' + (co ? ' › Northwind Labs' : '') + '</p><h1>' + title + '</h1><p class="pfa-muted">' + (co ? 'Climate software · Seed · Oslo' : 'Investments, evidence and the work that follows.') + '</p></div><div class="pfa-meta">' + (co ? 'Held via SPV · 6.2% effective ownership' : 'Gross of fees and carry · book as of 30 Sep 2026') + '</div></div>';
      const content = '<a class="pfa-skip" href="#pfa-main">Skip to Portfolio content</a><div class="pfa-stack">' + heading + pfaNav(tab,co) + '<section id="pfa-main" tabindex="-1" class="pfa-stack" aria-label="' + title + '">' + body + '</section><p class="pfa-footer">D4817 addendum · design for owner review · fictional sample records · not a production read</p></div>';
      if (phone) return '<div class="cv pfa pfa-phone' + (B.endsWith('D') ? ' pfa-dark' : '') + '" style="' + VARS + ';width:390px;min-height:844px"><header class="pfa-top">' + pfaBtn('☰',false,' aria-label="Open account navigation"') + '<b>Portfolio</b>' + pfaBtn('HC',false,' aria-label="Account"') + '</header><main class="pfa-body" aria-label="Portfolio">' + content + '</main></div>';
      return page(content,{w:opts.tablet?834:1440}).replace('class="cv"','class="cv pfa' + (opts.tablet?' pfa-tablet':'') + (B.endsWith('D')?' pfa-dark':'') + '"');
    };
    const pfaHolding = '<div class="pfa-note">Holding route: <b>via SPV</b> · Northwind SPV I. The 6.2% figure is effective ownership as recorded; route notes and document source remain available here and on each obligation.</div>';
    const pfaCompanyMetrics = '<div class="pfa-metrics">' + pfaMetric('Invested','$1,500,000','Gross deployed cost') + pfaMetric('Latest carrying value','$2,400,000','31 Mar 2026 · GP estimate') + pfaMetric('Ownership','6.2%','Effective ownership · recorded') + pfaMetric('Multiple','1.60×','Carrying value ÷ invested') + '</div>';
    const pfaReported = () => pfaCard('Company-reported performance', '<p class="pfa-small pfa-muted">Frozen values from reports you received. Each small multiple shows only two recorded observations: June, then September. Rings identify amended points.</p><div class="pfa-three">' + [ ['Revenue','$84,000','Quarter to 30 Sep 2026',78000,84000],['MRR','$28,000','At 30 Sep 2026',26000,28000],['Cash','$240,000','At 30 Sep 2026',360000,240000],['Burn','$50,000 / month','Founder-reported basis',45000,50000],['Runway','4.8 months','At 30 Sep 2026',8,4.8] ].map(([n,v,d,prev,now],i)=>'<article class="pfa-stack" style="gap:8px"><h3>'+n+'</h3><strong class="pfa-value" style="font-size:20px">'+v+'</strong><div class="pfa-chart"><div class="pfa-bars" role="img" aria-label="'+n+': June '+prev+', September '+now+'; units and source in table below"><i style="height:'+Math.round(prev/Math.max(prev,now)*90)+'%"></i><i'+(i===0?' class="pfa-correction-point"':'')+' style="height:'+Math.round(now/Math.max(prev,now)*90)+'%"></i></div><div class="pfa-row pfa-between pfa-meta"><span>Jun</span><span>Sep</span></div></div>'+pfaMeta(d+(i===0?' · corrected report':''))+'</article>').join('') + '</div><details open><summary>Reported values and corrections · table</summary><div id="pfa-reported-table">'+pfaTable('Same reported values; sample report dates, units and correction state', ['Figure','30 Jun 2026','30 Sep 2026','Source'], [['Revenue','$78,000','<span class="pfa-corrected">$84,000 · corrected</span>','Q3 founder report'],['MRR','$26,000','$28,000','Q3 founder report'],['Cash','$360,000','$240,000','Q3 founder report'],['Burn','$45,000 / month','$50,000 / month','Q3 founder report'],['Runway','8.0 months','4.8 months','Q3 founder report']])+'</div></details><div class="pfa-note"><b>What changed since the last report</b><p>Revenue and MRR increased; cash and runway decreased. These are source-preserved figures, not a new interpretation of the company.</p></div>');
    const pfaRights = () => {const phone=B==='PFA11'; const duties=[['Quarterly update','<a class="pfa-link" href="#pfa-main">Shareholders agreement · §7.2</a>','Quarterly · due 30 days after period end'],['Information right','<a class="pfa-link" href="#pfa-main">Shareholders agreement · §7.4</a>','As stated in the document']];const holders=[['Founders · ordinary','70.0%','Recorded holdings'],['Investors · preferred','23.8%','Recorded holdings'],['Northwind SPV I · preferred','6.2%','Recorded effective ownership']];const dutyBody=phone?'<div class="pfa-stack">'+duties.map(([n,source,value])=>'<article class="pfa-note"><h3>'+n+'</h3>'+pfaFacts([['Source',source],['Duty',value]])+'</article>').join('')+'</div>':pfaTable('Duties under the signed documents — read only',['Duty','Clause / source','What is recorded'],duties);const capBody=phone?'<div class="pfa-stack">'+holders.map(([n,value,basis])=>'<article class="pfa-note"><h3>'+n+'</h3>'+pfaFacts([['Ownership',value],['Basis',basis]])+'</article>').join('')+'</div>':pfaTable('Authorised investor read; sample register, not an editable cap table',['Holder / class','Ownership','Basis'],holders);return pfaCard('Ownership & rights','<p class="pfa-muted">Duties, source documents and the investor cap table. Read only.</p>'+dutyBody+'<details open><summary>Investor cap table · read only</summary>'+capBody+'</details><p class="pfa-meta">If a document or cap table cannot be read, only that section says Unreadable.</p>');};
    const pfaObligation = () => pfaCard('Q3 2026 reporting obligation',pfaHolding+pfaFacts([['Company','Northwind Labs'],['Period','1 Jul–30 Sep 2026'],['Due','30 Oct 2026'],['Received','Not recorded'],['Status',pfaPill('▲ Overdue · 11 days','warn')],['Missing','Q3 report · 6 required KPIs'],['Last chase','2 Nov 2026 · by Morgan (sample)'],['Source','Shareholders agreement · §7.2']])+'<div class="pfa-row">'+pfaBtn('Ask for this report',true)+pfaBtn('Waive this period')+'</div>');
    const pfaReports = () => pfaCard('Reporting obligations',pfaTable('Company, holding route and period are always explicit. Overdue comes from the obligation due date.',['Company / route','Due / received','State / missing','Last chase','Next action'],[['<a class="pfa-link" href="#pfa-main">Northwind Labs</a><small>Via SPV · Q3 2026</small>','30 Oct 2026<small>Received: Not recorded</small>',pfaPill('▲ 11 days overdue','warn')+'<small>Q3 report · 6 KPIs</small>','2 Nov 2026',pfaBtn('Ask for report',true)],['<a class="pfa-link" href="#pfa-main">Lumen Robotics</a><small>Direct · Q3 2026</small>','30 Oct 2026<small>Received: 28 Oct 2026</small>',pfaPill('✓ Received','good')+'<small>No missing requirement</small>','Not recorded',pfaBtn('Open report')]])+'<div class="pfa-note">Company Reports also keeps the founder submission, original KPI values, correction history and document source. Waive is a separate confirmed action, never an unlabeled menu item.</div>');
    const pfaConfirm = (waive) => '<div class="cv pfa pfa-dialog" style="'+VARS+'"><div class="pfa-card" role="dialog" aria-modal="true" aria-labelledby="pfa-confirm-title"><div class="pfa-row pfa-between"><h2 id="pfa-confirm-title">'+(waive?'Waive this reporting period':'Ask Northwind Labs for its report')+'</h2>'+pfaBtn('×',false,' aria-label="Close confirmation"')+'</div>'+pfaFacts([['Company','Northwind Labs'],['Period','Q3 2026 · due 30 Oct'],['Holding route','Via Northwind SPV I'],['Source','Shareholders agreement · §7.2']])+'<p>'+(waive?'This period is marked waived. It does not waive future periods or change the signed duty.':'Record a request for this missing period. Delivery follows the recorded outcome; the UI never promises exactly-once external delivery.')+'</p>'+(waive?'<p class="pfa-meta">No free-text reason is recorded by the current waiver action.</p>':'<div class="pfa-note">Confirmation shows the actual response: request recorded, not sent, unconfirmed, cooldown or conflict. A conflict keeps the selected company and period.</div>')+'<div class="pfa-row">'+pfaBtn(waive?'Waive Northwind · Q3 2026':'Ask Northwind · Q3 2026',true)+pfaBtn('Cancel')+'</div><p class="pfa-meta">Use the existing Sheet confirmation: named focus entry, containment, Escape and return. This specimen sends nothing.</p></div></div>';
    const pfaRules = () => pfaCard('Attention rules and evidence',pfaTable('Signals stay distinct; a stale update is not a late reporting obligation.',['Rule','Queue reason','Evidence / date'],[['Runway under 6 months','Attention · short runway','Founder-reported 4.8 months · 30 Sep'],['Update older than 30 days','Watch · stale update','Last received update · exact date'],['Health turned red within 90 days','Attention · recent health change','Health snapshot and transition date'],['Latest mark below cost','Watch · marked down','Recorded mark, basis and date'],['No positive scoring evidence','Not enough evidence','Typed source state, not a green default'],['Source failed','Unreadable / Unavailable','Named failed source and Retry']])+'<p class="pfa-small pfa-muted">Use D4645 source states, not exception-text parsing. Health snapshot age and the current recompute result remain separate; a previous score is not a freshly computed score.</p>');
    const pfaCohorts = () => pfaCard('Vintage cohorts',pfaTable('Gross figures · book as of 30 Sep 2026 · sample cohorts reconcile to the approved $7m / $11.1m / $0.9m book.',['Vintage','Invested','Carrying value','Distributed','TVPI'],[['2024','$3,500,000','$7,600,000','$900,000','2.43×'],['2025','$2,250,000','$2,100,000','$0','0.93×'],['2026','$1,250,000','$1,400,000','$0','1.12×']])+'<p class="pfa-meta">Cohorts remain in Performance. Company-specific marks, realisations and rounds move to Company Financials with a direct company link.</p>');
    const pfaSupport = () => '<div class="pfa-two">'+pfaCard('Log support · Northwind Labs','<label for="pfa-support-kind">Support type</label><select id="pfa-support-kind"><option>Introduction</option><option>Other supported type</option></select><label for="pfa-support-title">What you committed to</label><input id="pfa-support-title" value="Introduce the founder to a pilot customer"><div class="pfa-row pfa-between"><label for="pfa-support-detail">Details</label>'+pfaBtn('Draft with Eadwyn')+'</div><textarea id="pfa-support-detail">Offer an introduction after the founder confirms the context to share.</textarea>'+pfaMeta('Owner: you · state: Promised · dates only as recorded')+'<p id="pfa-support-error" class="pfa-error-text" role="alert">This did not save. Your entries are kept.</p><div class="pfa-row">'+pfaBtn('Try saving again',true)+pfaBtn('Cancel')+'</div>')+pfaCard('Supported actions and validation','<label for="pfa-support-empty">What you committed to</label><input id="pfa-support-empty" value="" aria-invalid="true" aria-describedby="pfa-support-required"><p id="pfa-support-required" class="pfa-error-text">Describe the support before saving.</p><hr class="pfa-separator"><h3>Deliver and Withdraw</h3><p>Confirm the entry, company and effect; a failed save leaves the entry and confirmation context in place. Show actor, date and the existing amendment history.</p>'+pfaFacts([['Supported states','Promised · Delivered · Withdrawn'],['Not enabled','In progress · Cancelled · due date'],['Meetings resulting','Not recorded']])+pfaBackend('Additional lifecycle states, due dates and meeting outcomes are not supplied by today’s support route.'))+'</div>';
    const pfaStates = () => '<div class="pfa-two">'+pfaCard('Company not held / not readable','<p class="pfa-muted">This company is not available in this portfolio.</p>'+pfaBtn('Back to Portfolio',true)+'<p class="pfa-meta">Generic title until an authorised identity read succeeds. Do not reveal a company name through a 404/not-held state.</p>')+pfaCard('Company read failed','<div class="pfa-note pfa-error"><b>Company details are Unreadable</b><p>Retry this read. A failure is not a company with no holdings or reports.</p></div>'+pfaBtn('Try again',true))+pfaCard('Independent source failure','<div class="pfa-metrics">'+pfaMetric('NAV','$11.1m','Read successfully · 30 Sep')+pfaMetric('Reports','Unreadable','Retry reports only')+'</div><p>Keep valid metrics, company identity and navigation. Never replace the whole page with an empty portfolio.</p>')+pfaCard('States remain distinct',pfaFacts([['Paid in','$0 · measured zero'],['Latest mark','Not recorded · no mark exists'],['Last report','Stale · recorded date remains visible'],['Health','Not enough evidence · typed source state'],['Admin preview','Private in preview · no private read'],['No obligation','Successful read · nothing due']]))+'</div>';
    const pfaRoutes = () => pfaCard('Route-aware titles and continuity',pfaTable('Addresses are frontend proposals where new tabs are needed; current working deep links stay valid.',['Destination','Route / compatibility','Document title'],[['Overview','/portfolio · Investor /health becomes a replace alias','Portfolio · Axal VC'],['Positions','/portfolio/positions','Positions · Portfolio · Axal VC'],['Reports','/portfolio/updates is retained','Reports · Portfolio · Axal VC'],['Performance','/portfolio/performance','Performance · Portfolio · Axal VC'],['Value-add','/portfolio/value-add','Value-add · Portfolio · Axal VC'],['Company Overview','/portfolio/companies/:uid','Northwind Labs · Portfolio · Axal VC'],['Company Financials','…/:uid/financials · old /terms → #ownership-rights','Northwind Labs · Financials · Portfolio · Axal VC'],['Company Reports','…/:uid/reports is retained','Northwind Labs · Reports · Portfolio · Axal VC'],['Company Support / Activity','…/:uid/support · …/:uid/activity','Company name · tab · Portfolio · Axal VC'],['Not held / identity unreadable','Keep selected address, generic title','Company · Portfolio · Axal VC'],['Investor preview','Existing preview context; do not request private data','Portfolio · Investor preview · Axal VC']])+'<p class="pfa-small pfa-muted">Company name appears only after an authorised identity read. /health is not globally redirected for Founder/Partner; existing admissions and views are retained. #4473 owns account navigation.</p>');
    const pfaHandoff = () => '<div class="pfa-two">'+pfaCard('One frame and one landmark','<p>The application owns one main landmark. Portfolio uses a named content section inside it; no nested main. One visible-on-focus skip link reaches that section.</p><p>Portfolio navigation names Overview, Positions, Reports, Performance and Value-add. Company navigation names Overview, Financials, Reports, Support and Activity. No primary destination requires Eadwyn.</p><p>Phone uses a scrolling named navigation strip rather than hiding Performance behind the rail. Focused items scroll into view.</p>')+pfaCard('Interactive checks before implementation sign-off','<p>Keyboard reachability, focus visibility/containment/return, inert background, field/error associations, async announcements, contrast, zoom/reflow and reduced motion must be exercised on the built app.</p><p>Use existing Card, Stat, Pill, Charts and Sheet primitives. #5311 builds the shared Portfolio patterns once; #4818 hardens them. No accessibility compliance is claimed from this canvas.</p>')+pfaCard('Current backend fit','<p>D4644 supports gross calculations and as-of mark selection on positions and analytics. D4645 supplies source states, stale health metadata and guarded reminders. D4647 supplies completed-period semantics, stable history pages and population totals.</p><p>Company-reported figures/corrections and reporting Ask/Waive already exist. Waive currently records no free-text note; this design does not invent one.</p>')+pfaCard('Still requires backend support',pfaBackend('A joined company activity timeline, saved views, request-a-mark, added support lifecycle/due-date/meeting fields, and any financial write conflict/history capability not returned by the current API remain explicitly unavailable. Preserve existing per-source histories instead of fabricating a joined one.'))+'</div>';
    const pfaParity = () => '<div class="pfa-two">'+pfaCard('Current admissions are preserved',pfaFacts([['Investor','New holdings navigation and five-tab company workspace'],['Founder / Partner','Retain their admitted /portfolio and /health views'],['Partner Delivery','Keep /delivery; the Investor design does not retire it'],['Admin preview','One shared banner; private sections withheld'],['Other accounts','Follow the current route/API refusal, not a new canvas-only licence rule']]))+pfaCard('Account continuity and contextual drafts','<p><a class="pfa-link" href="#pfa-main">Also in your account: Companies →</a></p><p>Portfolio means investment holdings at /portfolio. Companies means account/legal entities and projects at /account/portfolio. #4473 owns the menu placement.</p><p>Positions keeps “Draft the narrative”, Reports “Draft the read”, and Value-add “Draft the summary” in their existing contextual proposal bands. Unreadable sources withhold drafting. The shell-wide Eadwyn structure remains #5130’s.</p>')+'</div>';
    const pfaBoard = (id) => {
      if(id==='PFA01'||id==='PFA13D') return pfaFrame('Northwind Labs','Overview',pfaHolding+pfaCompanyMetrics+pfaReported(),{company:true});
      if(id==='PFA02') return pfaFrame('Northwind Labs','Financials',pfaCompanyMetrics+pfaRights(),{company:true});
      if(id==='PFA03') return pfaFrame('Northwind Labs','Reports',pfaReports()+pfaObligation(),{company:true});
      if(id==='PFA04') return pfaConfirm(false);
      if(id==='PFA05') return pfaConfirm(true);
      if(id==='PFA06') return pfaFrame('Positions','Positions','<div class="pfa-row pfa-between"><label for="pfa-asof">Read the book as of <input id="pfa-asof" type="date" value="2026-09-30"></label>'+pfaBtn('Apply date',true)+'</div>'+pfaMeta('Both /positions?as_of and /positions/analytics?as_of honour this date. Operating attention is a separate current read with its own dates.')+pfaCompanyMetrics+pfaRules());
      if(id==='PFA07') return pfaFrame('Performance','Performance','<div class="pfa-metrics">'+pfaMetric('NAV','$11.1m','30 Sep 2026 · gross')+pfaMetric('Paid in','$7.0m','Gross deployed cost')+pfaMetric('Distributed','$0.9m','Recorded proceeds')+pfaMetric('TVPI','1.71×','Total value ÷ paid in')+'</div>'+pfaCohorts()+pfaCard('Company history and other tools','<p>Open a company’s Financials for its mark history, realisations and rounds. Vintage cohorts remain here.</p><div class="pfa-row"><a class="pfa-link" href="#pfa-main">Northwind Labs · Financials →</a><a class="pfa-link" href="#pfa-main">Exit Waterfall →</a></div><p class="pfa-meta">Exit Waterfall remains at /portfolio/waterfall as a secondary modelling tool, not a sixth primary destination.</p>'));
      if(id==='PFA08') return pfaFrame('Value-add','Value-add',pfaSupport());
      if(id==='PFA09') return pfaFrame('Portfolio states','Overview',pfaStates());
      if(id==='PFA10'||id==='PFA15D') return pfaFrame('Northwind Labs','Reports',pfaObligation()+pfaCard('Source-preserved report detail','<p>The selected submission, original values, corrections and required/missing KPI list remain reachable after the obligation card.</p>'+pfaBtn('Open latest received report',false,' disabled')),{company:true,phone:true});
      if(id==='PFA11') return pfaFrame('Northwind Labs','Financials',pfaHolding+pfaCard('Investment and ownership',pfaFacts([['Invested','$1,500,000 · gross'],['Latest value','$2,400,000 · 31 Mar 2026'],['Ownership','6.2% · effective'],['Mark state',pfaPill('◷ 7 months old','warn')]]))+pfaRights(),{company:true,phone:true});
      if(id==='PFA12') return pfaFrame('Value-add','Value-add',pfaCard('Support entries',pfaTable('Compact tablet rows; dates and history stay in labelled details.',['Entry / company','State','Owner'],[['Pilot customer introduction<small>Northwind Labs</small>',pfaPill('Promised'),'Morgan'],['Fundraising review<small>Lumen Robotics</small>',pfaPill('Delivered','good'),'Priya']])+'<details open><summary>Northwind · dates, history and next action</summary>'+pfaFacts([['Created','28 Oct 2026 · Morgan'],['Delivered','Not recorded'],['History','One recorded creation'],['Next action',pfaBtn('Mark delivered',true)]])+'</details>'),{tablet:true});
      if(id==='PFA14D') return pfaFrame('Northwind Labs','Financials',pfaCompanyMetrics+pfaRights(),{company:true});
      if(id==='PFA16') return pfaFrame('Routes and handoff','Overview',pfaRoutes()+pfaHandoff());
      if(id==='PFA17') return pfaFrame('Access and existing workflows','Overview',pfaParity());
      return pfaFrame('Portfolio addendum','Overview',pfaHandoff());
    };

    let html = '';
    if (B.startsWith('PFA')) html = pfaBoard(B);
    else if (B === 'PF01') html = page(overview(), { h: 1700 });
    else if (B === 'PF01b') html = page(overviewAttn(), { h: 1250, menu: true });
    else if (B === 'PF01c') html = page(overview({ partial: true }), { h: 1700 });
    else if (B === 'PF02') html = page(positions(false), { h: 900 });
    else if (B === 'PF02b') html = page(positions(true), { h: 900, overlay: markDrawer() });
    else if (B === 'PF03') html = page(performance('chart'), { h: 1000 });
    else if (B === 'PF03b') html = page(performance('table'), { h: 1000 });
    else if (B === 'PF04') html = page(reports(false), { h: 820 });
    else if (B === 'PF04b') html = page(reports(true), { h: 1000 });
    else if (B === 'PF05') html = page(valueAdd(), { h: 820 });
    else if (B === 'PF06a') html = page(coOverview(), { h: 980 });
    else if (B === 'PF06b') html = page(coFin(), { h: 1000 });
    else if (B === 'PF06c') html = page(coReports(), { h: 900 });
    else if (B === 'PF06d') html = page(coSupport(), { h: 820 });
    else if (B === 'PF06e') html = page(coActivity(), { h: 820 });
    else if (B === 'PF07a') html = crop(F1(), 640);
    else if (B === 'PF07b') html = crop(F2(), 640);
    else if (B === 'PF07c') html = crop(F3(), 640);
    else if (B === 'PF07d') html = crop(F4(), 640);
    else if (B === 'PF07e') html = crop(F5(), 640);
    else if (B === 'PF08') html = page(preview(), { h: 900, preview: true });
    else if (B === 'PF09') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PF11') html = comps();
    else if (B === 'PF12') html = handoff();
    else html = page(overview(), { h: 1700 });
    return { html: { __html: html } };
  }
}

</script>
