      ['Partially available metrics', '<div class="kpiq" style="grid-template-columns:1fr 1fr"><div><small>TVPI</small><b>1.71×</b></div><div><small>IRR</small><b class="unr" style="font-size:13px">! Unavailable</b></div></div>'],
      ['No current reporting obligation', st('No obligation', 'No report due this quarter') + '<span class="raw">Kite Systems’ first report is due 15 Nov</span>'],
      ['Read-only', nt('', 'i', 'Marks and distributions are HQ admin acts', 'You can review them; requesting a new mark from HQ is proposed.', '')],
      ['Permission denied', nt('', '⦸', 'Portfolio is for Investor licences', 'See your licences in the Account menu.', '')],
      ['Private in admin preview', PRIV],
      ['Save conflict', nt('a', '!', 'This position changed while you were working', 'Not saved; your draft is kept.', 'Review again')],
      ['Export failure', nt('r', '✕', 'Export failed', 'Nothing was downloaded. Try again or export a smaller range.', 'Try again')],
      ['No mark recorded', '<span class="nrec">No mark recorded</span><span class="raw">Kite Systems · carried at cost for NAV</span>'],
      ['Overdue reporting', st('Overdue', 'Q3 · 11 days overdue')],
      ['No support recorded', nt('', '○', 'No support recorded for Aster Bio', 'Record what you have done, or plan something.', 'Record support')]
    ];
    const states = () => crop('<span class="eye">States · each says what happened and what to do next · never collapsed into one empty state</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);

    /* ---------- responsive ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Account menu">HC</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mnav = (cur, full) => '<nav class="pfnav" aria-label="Portfolio" style="overflow:hidden">' + J((full ? ['Overview', 'Positions', 'Reports', 'Performance', 'Value-add'] : ['Overview', 'Positions', 'Reports', 'More ▾']).map(t => '<a href="#" style="padding:12px 10px;min-height:44px"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + '</a>')) + '</nav>';
    const pcard = (c) => '<div class="pfc"><div class="r1"><b>' + c[0] + '</b>' + hl(c[10]) + '</div><dl><dt>Invested</dt><dd>' + c[3] + '</dd><dt>Latest FMV</dt><dd>' + (c[5] || '<span class="nrec" style="font-size:11px">No mark</span>') + '</dd><dt>MOIC</dt><dd>' + (c[8] || '—') + '</dd><dt>Reporting</dt><dd style="font-family:var(--sg);font-weight:600">' + c[9][1] + '</dd></dl></div>';
    const MOB = {
      PF10b: () => phone('Portfolio', mnav('Overview') + '<div class="kpiq" style="grid-template-columns:1fr 1fr"><div><small>NAV · 30 Sep</small><b>$11.1m</b></div><div><small>TVPI · gross</small><b>1.71×</b></div><div><small>DPI</small><b>0.13×</b></div><div><small>IRR</small><b>21.3%</b></div></div><h2 style="font-size:16px;font-weight:800">Needs attention · 5</h2><div class="pfc"><div class="r1"><b>Northwind Labs</b>' + hl('Attention') + '</div><small class="mu" style="font-size:12px">Runway 4.8 mo · mark 7 months old · Q3 overdue 11 d</small><a class="btn p" href="#" style="min-height:44px">Open Northwind Labs</a></div>' + pcard(CO[3])),
      PF10c: () => phone('Positions', mnav('Positions') + '<div style="display:flex;gap:8px"><div class="inp" style="min-width:0;flex:1;min-height:44px">⌕ Search</div><button type="button" class="btn" style="min-height:44px">Filters (1)</button><button type="button" class="btn" style="min-height:44px" aria-label="Sort">Sort</button></div>' + J(CO.slice(0, 3).map(pcard)),
        '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs" style="max-height:440px"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="fs" style="font-size:17px;font-weight:800">Filters</h2><label class="ck"><input type="checkbox" checked>Attention</label><label class="ck"><input type="checkbox" checked>Watch</label><label class="ck"><input type="checkbox">Not enough evidence</label><label class="ck"><input type="checkbox">Stale mark</label><button type="button" class="btn p" style="min-height:48px">Show 3 companies</button></div></div>'),
      PF10d: () => phone('Record a mark', '<div class="mtitle" style="font-size:12px">Northwind Labs · 6.2% · invested $1,500,000</div>' + flow(2).replace('flow5', 'flow5" style="font-size:9px') + '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>As of</dt><dd>30 Sep 2026</dd><dt>FMV</dt><dd class="mo">$2,400,000 → $2,100,000</dd><dt>Portfolio NAV</dt><dd class="mo">$11.1m → $10.8m</dd></dl><button type="button" class="btn p" style="min-height:48px">Record $2,100,000 mark</button><button type="button" class="btn" style="min-height:48px">Back to edit</button>'),
      PF10a: () => '<div class="cv" style="' + VARS + ';width:834px;height:1112px"><div class="ph" style="width:834px;height:1112px"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Portfolio</b><button type="button" class="pi" aria-label="Account menu">HC</button></div><div class="pbd" style="overflow:hidden">' + mnav('Overview', true) + '<div class="kpiq"><div><small>NAV · 30 Sep</small><b>$11,100,000</b></div><div><small>TVPI</small><b>1.71×</b></div><div><small>DPI</small><b>0.13×</b></div><div><small>IRR</small><b>21.3%</b></div></div><span class="raw">Gross of fees and carry · 5 of 6 marked</span>' + attention(3) + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><table class="ptbl"><thead><tr><th>Company</th><th class="n">Invested</th><th class="n">FMV</th><th>Reporting</th><th>Health</th></tr></thead><tbody>' + J(CO.slice(0, 5).map(c => '<tr><td><a class="cnm" href="#">' + c[0] + '</a></td><td class="n">' + c[3] + '</td><td class="n">' + (c[5] || '—') + '</td><td>' + st(c[9][0], c[9][1].replace('Q3 · ', '')) + '</td><td>' + hl(c[10]) + '</td></tr>')) + '</tbody></table><p class="foot" style="padding:8px 12px">Tablet keeps 5 columns; ownership, MOIC and last update open in the row’s sheet.</p></section></div></div></div>'
    };

    /* ---------- components + handoff ---------- */
    const comps = () => crop('<span class="eye">Reusable patterns</span><div class="compgrid">'
      + box('Financial metric', '<div class="kpiq" style="grid-template-columns:1fr"><div><small>TVPI</small><b>1.71×</b><small>Total value ÷ paid-in · as of 30 Sep 2026 · gross</small></div></div><span class="raw">Value · basis · as-of · gross/net · availability</span>')
      + box('Attention item', '<ol class="attn"><li style="grid-template-columns:minmax(0,1fr) auto"><div><div class="cn">Northwind Labs</div>' + hl('Attention') + '<div class="ev" style="margin-top:4px"><span><i>Runway</i>4.8 months · 12 Oct</span></div></div><a class="btn p bsm" href="#">Open →</a></li></ol>')
      + box('Reporting obligation', '<table class="ptbl"><tbody><tr><td><b>Fjord Data</b></td><td class="mo">3 Nov</td><td>' + st('Overdue', '4 days') + '</td><td>Not chased</td></tr></tbody></table>')
      + box('Health status', hl('Healthy') + hl('Watch') + hl('Attention') + hl('Not enough evidence') + hl('Unreadable'))
      + box('Freshness / provenance', '<span class="raw">As of 30 Sep 2026 · source: term sheet · recorded by M. Okafor (HQ)</span>' + st('Stale', '7 months old'))
      + box('Partial failure', nt('a', '!', '1 of 4 sources unreadable', 'Health · retry; the rest is current.', 'Retry'))
      + box('Preview privacy', PRIV + '<span class="raw">One banner: “Previewing Investor · private investor data withheld” · Back to HQ</span>')
      + box('Financial confirmation', flow(2) + '<span class="raw">The button names the act, amount and company</span>')
      + box('Activity timeline', tline(2))
      + '</div>', 1400);
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Navigation, backend fit, metadata and accessibility</h1><p><b>Shell (#3704).</b> No licence switcher; the sidebar is the union of held licences (Investor: Studio, Spin-Out Lab, Deals, Axal VC Fund, Fund, Trust, Network, Research). Portfolio and Companies never appear in the sidebar: both open from the Account menu, labelled <b>Portfolio</b> (the investment portfolio) and <b>Companies &amp; projects</b> (the account surface), so no two destinations share a name (#4473). Today’s <code>shellConfig.js</code> still has a Portfolio bucket in the Investor sidebar; #4473 moves it. Inside Portfolio, one local navigation: Overview · Positions · Reports · Performance · Value-add. Eadwyn is never needed to reach a destination. Live visual QA waits for #4849.</p>'
      + tbl(['Board area', 'Today (checked 7 Nov 2026)', 'Status'], [
        ['Performance summary', '<code>GET /api/positions/analytics</code>: paid_in, distributed, NAV, TVPI, DPI, RVPI, IRR (null when no rate solves), position_count, unmarked_position_count, mark_coverage; gross; <code>?as_of=</code>', 'Frontend only. Unmarked positions carry at cost today; #4644 decides the policy'],
        ['Positions, mark history', '<code>GET /api/positions</code> (invested, ownership, FMV, multiple, mark date, basis), <code>/positions/marks</code>, <code>/positions/:projectUid</code>', 'Frontend only'],
        ['Health', '<code>/api/portfolio/health</code> snapshots: green / yellow / red badge + drivers', 'Healthy / Watch / Attention map from badges. <b>Not enough evidence</b> and <b>Unreadable</b> per company: backend required (#4645)'],
        ['Reports', '<code>/api/portfolio-updates</code> (submit, share, send), <code>/positions/kpi-compliance</code>, <code>/api/portfolio/chase</code>, <code>/chases</code>, <code>/coverage</code>', 'Frontend: obligation inbox; per-company required KPI set shown from compliance'],
        ['Value-add', '<code>/api/portfolio-support</code>: promised → delivered, owner, timestamps', 'In progress, Cancelled, due dates, meeting outcomes: backend required (#4642)'],
        ['Marks and distributions', '<code>POST /positions/:projectUid/marks</code>, <code>/distributions</code>; <code>requireAdmin</code>', 'Frontend: Prepare → Review → Confirm → Receipt. Conflict detection (write states what it read) and financial action history: backend required (#4642, #4647)'],
        ['Company Activity', 'No joined timeline', 'Backend required'],
        ['Saved views', 'None', 'Backend required'],
        ['Exports', 'Existing CSV paths', '#4647 owns completeness']])
      + '<h2>Page metadata</h2><p><code>Portfolio · Axal VC</code>, <code>Positions · Portfolio · Axal VC</code>, <code>Performance · Portfolio · Axal VC</code>, <code>Northwind Labs · Portfolio · Axal VC</code>, <code>Northwind Labs · Financials · Portfolio · Axal VC</code>.</p>'
      + '<h2>Accessibility (targets WCAG 2.2 AA; not claimed from screenshots)</h2><p>Local navigation is links with aria-current; company tabs likewise, URL-backed. Tables have captions and th scope; the company name is a link, never hidden in an overflow menu. Health and reporting states are words with shapes. Every chart has a Table view and a text alternative; no interpolation. Dialogs trap focus, return it to the trigger, and keep the company in the title; async results announce through role="status" / role="alert". Phone: 44px targets, 48px commit buttons, filter sheet, record cards.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'PF01') html = page(overview(), { h: 1700 });
    else if (B === 'PF01b') html = page(overviewAttn(), { h: 1250, menu: true });
    else if (B === 'PF01c') html = page(overview({ partial: true }), { h: 1700 });
    else if (B === 'PF02') html = page(positions(false), { h: 900 });
    else if (B === 'PF02b') html = page(positions(true), { h: 900, overlay: markDrawer() });
    else if (B === 'PF03') html = page(performance('chart'), { h: 1000 });
    else if (B === 'PF03b') html = page(performance('table'), { h: 1000 });
    else if (B === 'PF04') html = page(reports(false), { h: 820 });
    else if (B === 'PF04b') html = page(reports(true), { h: 1000 });
    else if (B === 'PF05') html = page(valueAdd(), { h: 820 });
    else if (B === 'PF06a') html = page(coOverview(), { h: 980 });
    else if (B === 'PF06b') html = page(coFin(), { h: 1000 });
    else if (B === 'PF06c') html = page(coReports(), { h: 900 });
    else if (B === 'PF06d') html = page(coSupport(), { h: 820 });
    else if (B === 'PF06e') html = page(coActivity(), { h: 820 });
    else if (B === 'PF07a') html = crop(F1(), 640);
    else if (B === 'PF07b') html = crop(F2(), 640);
    else if (B === 'PF07c') html = crop(F3(), 640);
    else if (B === 'PF07d') html = crop(F4(), 640);
    else if (B === 'PF07e') html = crop(F5(), 640);
    else if (B === 'PF08') html = page(preview(), { h: 900, preview: true });
    else if (B === 'PF09') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PF11') html = comps();
    else if (B === 'PF12') html = handoff();
    else html = page(overview(), { h: 1700 });
    return { html: { __html: html } };
  }
}

</script>
