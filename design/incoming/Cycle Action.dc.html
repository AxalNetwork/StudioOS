<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
  <style>body{margin:0}a{color:#6d28d9;text-decoration:none}a:hover{color:#7c3aed}.ca{container-type:inline-size}@container (max-width:520px){.ca-g2,.ca-g3{grid-template-columns:minmax(0,1fr)!important}.ca-steps{flex-wrap:nowrap!important;overflow-x:auto}}</style>
</helmet>
<div class="ca" style="{{ root }}">
  <sc-if value="{{ phone }}" hint-placeholder-val="{{ false }}"><span style="width:36px;height:4px;border-radius:99px;background:#ececf1;align-self:center;margin-top:8px;flex:none"></span></sc-if>
  <sc-if value="{{ isSheet }}" hint-placeholder-val="{{ true }}"><div style="padding:16px 20px;border-bottom:1px solid #ececf1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none">
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><sc-if value="{{ isPage }}" hint-placeholder-val="{{ false }}"><span style="font-size:12.5px;font-weight:600;color:#6d28d9;margin-bottom:4px">‹ {{ cycle }}</span></sc-if><sc-if value="{{ isSheet }}" hint-placeholder-val="{{ true }}"><span style="font-size:10px;font-weight:700;color:#6b6577;text-transform:uppercase;letter-spacing:.1em">{{ cycle }}</span></sc-if><span style="font-weight:700;font-size:18px;letter-spacing:-.02em">{{ title }}</span><span style="font-size:12.5px;color:#6b6577;line-height:1.45">{{ sub }}</span></div>
    <sc-if value="{{ isSheet }}" hint-placeholder-val="{{ true }}"><span style="width:30px;height:30px;border-radius:50%;border:1px solid #ececf1;display:grid;place-items:center;color:#6b6577;flex:none;font-size:15px">×</span></sc-if>
  </div></sc-if>
  <sc-if value="{{ hasSteps }}" hint-placeholder-val="{{ false }}"><div class="ca-steps" style="{{ sx.steps }}"><sc-for list="{{ steps }}" as="s" hint-placeholder-count="5"><span style="{{ s.style }}">{{ s.t }}</span></sc-for></div></sc-if>
  <sc-if value="{{ banner }}" hint-placeholder-val="{{ false }}"><div style="{{ bannerStyle }};{{ sx.banner }}">{{ banner }}</div></sc-if>
  <div style="{{ sx.body }}">
    <sc-if value="{{ hasList }}" hint-placeholder-val="{{ false }}">
      <div style="border:1px solid #ececf1;border-radius:9px;padding:9px 12px;font-size:13px;color:#a1a1aa">{{ search }}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><sc-for list="{{ filters }}" as="f" hint-placeholder-count="3"><span style="{{ f.style }}">{{ f.t }}</span></sc-for><span style="margin-left:auto;font-size:12px;color:#6b6577">Sort: {{ sort }} ▾</span></div>
      <span style="font:500 11.5px 'Roboto Mono',monospace;color:#6b6577">{{ count }}</span>
    </sc-if>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-if value="{{ g.label }}" hint-placeholder-val="{{ true }}"><span style="font-size:10px;font-weight:700;color:#6b6577;text-transform:uppercase;letter-spacing:.1em">{{ g.label }}</span></sc-if>
        <div style="border:1px solid #ececf1;border-radius:12px;overflow:hidden;background:#fff">
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
            <div style="padding:11px 14px;border-bottom:1px solid #f4f3f7;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
              <div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-weight:700;font-size:13.5px">{{ r.a }}</span><sc-if value="{{ r.pill }}" hint-placeholder-val="{{ false }}"><span style="{{ r.pillStyle }}">{{ r.pill }}</span></sc-if></span><sc-if value="{{ r.b }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;line-height:1.45;color:{{ r.bc }}">{{ r.b }}</span></sc-if></div>
              <sc-if value="{{ r.act }}" hint-placeholder-val="{{ false }}"><span style="{{ r.actStyle }}">{{ r.act }}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ bar }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:700">{{ bar.label }}</span><span style="font-family:'Roboto Mono',monospace">{{ bar.value }}</span></div><div style="height:8px;border-radius:99px;background:#f4f3f7"><div style="height:8px;border-radius:99px;background:#7c3aed;width:{{ bar.pct }}"></div></div></div></sc-if>
    <sc-if value="{{ note }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:1.5;color:#6b6577">{{ note }}</span></sc-if>
  </div>
  <sc-if value="{{ hasFoot }}" hint-placeholder-val="{{ true }}"><div style="{{ sx.foot }}"><span style="font-size:12px;color:#6b6577">{{ footNote }}</span><div style="display:flex;gap:8px"><sc-if value="{{ back }}" hint-placeholder-val="{{ false }}"><span style="{{ btnGhost }}">{{ back }}</span></sc-if><span style="{{ nextStyle }}">{{ next }}</span></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:820},&quot;action&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;connect&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;connect&quot;,&quot;call&quot;,&quot;update&quot;]},&quot;view&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {

    const P = { ok: pill('#047857', '#ecfdf5', '#a7f3d0'), grey: pill('#6b6577', '#f4f3f7', '#ececf1'), bad: pill('#b91c1c', '#fef2f2', '#fecaca'), amb: pill('#92400e', '#fffbeb', '#fcd34d'), vio: pill('#6d28d9', '#f4f0fe', '#ddd0fb'), nr: pill('#6b6577', '#f4f3f7', '#d4d1dc', 1), pro: 'font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#7c3aed;border-radius:99px;padding:2px 7px' };

    const R = (a, b, pillT, pillS, act, actS, bc) => ({ a, b: b || '', bc: bc || '#6b6577', pill: pillT || '', pillStyle: pillS || '', act: act || '', actStyle: actS || '' });
    const G = (label, rows) => ({ label, rows });

      if (view === 'locked') Object.assign(o, { banner: 'Accounting connections are part of Pro. Free keeps every tool you have already connected.', bannerStyle: banners.grey });

      const step = { round: 0, materials: 1, audience: 2, preview: 3, send: 4, readiness: 4, nodataroom: 1, nomatch: 2, counsel: 4 }[view];
      Object.assign(o, { cycle: 'Raise', title: 'Call for Capital', sub: 'Prepares a call to investors verified on Axal. A call is never public.', hasSteps: step !== undefined, steps: stepper(names, step ?? 0), back: step > 0 ? 'Back' : '', next: step === 4 ? 'Send the call' : 'Next', footNote: 'Step ' + ((step ?? 0) + 1) + ' of 5' });
      if (view === 'round') o.groups = [G('Filled from your round planner', [R('Amount', '[$1,500,000]', '', '', 'Edit', B.link), R('Instrument', 'SAFE', '', '', 'Edit', B.link), R('Key terms', 'Cap [$8M] · discount [20%]', '', '', 'Edit', B.link), R('Minimum cheque', '[$25,000]', '', '', 'Edit', B.link), R('Target close', '[15 Jan]', '', '', 'Edit', B.link)])];
      if (view === 'materials' || view === 'nodataroom') o.groups = [G('Materials', [R('Pitch deck', 'v[4] · [12 Oct] · [12] slides', '', '', 'Change', B.link), view === 'nodataroom' ? R('Data room', 'No data room yet. Investors will see the deck only.', 'Not recorded', P.nr, 'Create a data room', B.primary) : R('Data room', 'Linked behind its NDA gate. Files are never copied into the call.', 'NDA gate on', P.ok, 'Change', B.link)])];
      if (view === 'audience' || view === 'nomatch') o.groups = [G('Investors I choose', [R('[n] investors from Capital relationships', 'Selected by hand', '', '', 'Choose', B.link)]), G('Matching investors on Axal', [view === 'nomatch' ? R('No matching investors yet', 'No verified investor fits your stage, sector and cheque size. Widen the minimum cheque, or send to the investors you choose.', 'None', P.grey) : R('[n] verified investors match', 'Thesis fits [sector], stage [Seed], cheque [$25k–$250k]. Names appear only once they respond.', 'Verified only', P.vio, 'Include', B.primary)])], o.note = 'Only investors verified on the platform can see the call.';

      if (view === 'send') o.groups = [G('Ready to send', [R('To', '[n] chosen investors and [n] matching investors'), R('Terms', 'Approved by counsel · [12 Oct]', 'Approved', P.ok), R('Readiness', '[7] of [7] items in place', 'Ready', P.ok)])];

      if (view === 'page' || view === 'noreply') Object.assign(o, { title: 'Update · [October]', sub: 'Sent [1 Nov] to [n] investors, [n] team members and the Axal network (asks only)', hasSteps: false, hasList: true, search: 'Search replies…', filters: [chip('All', true), chip('Replies'), chip('Opened')], sort: 'Latest', count: '1–25 of [N]', groups: [G('Replies to asks', [R('A hire · [Role]', '[Name] proposed a candidate · [2 Nov]', 'Candidate', P.ok, 'Open in Team expansion', B.link), R('A customer introduction', '[Name] offered an intro to [Company] · [2 Nov]', 'Lead', P.ok, 'Open in Distribution', B.link), view === 'noreply' ? R('A market contact', 'No replies after [14] days.', 'No replies', P.amb, 'Ask again', B.primary) : R('A market contact', '[Name] knows someone in [market]', 'Contact', P.ok, 'Open in Market expansion', B.link)]), G('Opened', [R('[Investor]', 'Opened [1 Nov] · replied', 'Replied', P.ok), R('[Team member]', 'Opened [1 Nov]', 'Opened', P.grey)])], hasFoot: false, note: 'Each reply became an item in the module that asked.' });
    }

      const ch = (t, d, on) => R(t, d, on ? 'Selected' : '', on ? P.vio : '');

        G('How', [ch('In person', 'Record on this device; the phone sits on the table.', true), ch('Video call', 'Join with Zoom, Google Meet or Teams.'), ch('Phone call', 'Record a call from this device.'), ch('Text chat', 'Paste or import a written conversation.'), ch('Upload a file', 'Audio, video or a transcript you already have.')]),
