    const SV = (d, s) => `<svg width="${s || 16}" height="${s || 16}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:block">${d}</svg>`;

    const ROWS = { founder: ['Studio', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'], investor: ['Studio', 'Spin-Out Lab', 'Deals', 'Portfolio', 'Axal VC Fund', 'Fund', 'Network', 'Research', 'Trust'], advisor: ['Studio', 'Spin-Out Lab', 'Practice', 'Cohorts', 'Expertise', 'Network', 'Research'], partner: ['Studio', 'Spin-Out Lab', 'Pipeline', 'Delivery', 'Offers', 'Network', 'Research'], admin: ['Studio', 'Accounts', 'Approvals', 'Programs', 'Community', 'Contracts', 'Fund admin', 'Insights', 'Licences'] };
    const CO = { founder: ['NL', '[Northwind Labs]'], investor: ['HS', '[Harbor Street Capital]'], advisor: ['KA', '[Kestrel Advisory]'], partner: ['RO', '[Ridgeway Ops]'], admin: ['SL', '[Studio Lisbon]'] };
    const APPH = () => `<div style="height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);box-sizing:border-box"><div style="display:flex;align-items:center;gap:9px;width:208px;flex:none"><img src="/axal-mark.png" alt="" style="width:26px;height:26px;display:block;border-radius:6px;object-fit:contain"><span style="font:800 15px ${SG};letter-spacing:-0.02em;color:var(--ink)">Axal VC</span></div><div style="flex:1;max-width:440px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut);font:500 13px ${SG};box-sizing:border-box">${ICO.search}Search Axal VC</div><div style="margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--body)">${ICO.bell}${AV('AE', 30)}</div></div>`;
