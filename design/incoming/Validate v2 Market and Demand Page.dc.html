      + waitlist({ w: 690, h: 180 }) + '<div class="vx-ev" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + J(TOT.slice(0, 4).map(e => '<div style="border-bottom:1px solid var(--hair)"><span class="l">' + e[0] + '</span><b>' + e[1] + '</b><small>' + e[2] + '</small></div>')) + '</div>' + sortc.replace('latest signal', 'newest') + J(SG.slice(2, 5).map(scard)));

    /* ---------- V29 phone ---------- */
    const psheet = (title, inner) => '<div class="vam-pscrim" aria-hidden="true"></div><div class="vam-psheet" role="dialog" aria-modal="true" aria-label="' + title + '"><i class="gr" aria-hidden="true"></i><b style="font-size:15px">' + title + '</b>' + inner + '</div>';
    const MOB = {
      VAM30A: () => phone('Market intelligence', msel('Market intelligence') + nxt('Complete the positioning map', '[InvoiceHub] has no position yet.', 'Open the map').replace('class="btn"', 'class="btn" style="min-height:44px"')
        + '<div class="vam-tiles3 st">' + sizeTile('Total market', '[€64.8M]', '18,000 × €3,600') + sizeTile('Serviceable', '[€25.9M]', '40% of the total') + sizeTile('Obtainable', '[€1.3M]', '5% win rate') + '</div>'
        + '<button type="button" class="selb" style="min-height:44px"><span>Method and assumptions · reviewed 6 Nov</span><span aria-hidden="true">›</span></button>'
        + '<span class="eye">Competitors tracked · 4</span>' + J(COMP.slice(0, 3).map(ccard)) + '<span class="eye">Position · price and depth</span><ul class="rz">' + J(COMP.map(c => '<li><b>' + c.n + '</b><small>' + (c.price ? c.price + ' · ' + c.depth : 'Not recorded') + '</small></li>')) + '</ul>'),
      VAM30B: () => phone('Demand and urgency', msel('Demand and urgency') + nxt('Confirm the 3 signals waiting', 'They don’t count until confirmed.', 'Review 3').replace('class="btn"', 'class="btn" style="min-height:44px"') + '<section class="cd" style="padding:12px;gap:6px"><div class="ch"><b>Waitlist sign-ups</b><span class="sm">last 13 weeks</span></div>' + lineSvg(330, 150, { sparse: 1 }) + '<span class="raw">140 of the bar of 200</span></section>' + '<div class="vx-ev" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + J(TOT.slice(0, 4).map(e => '<div style="border-bottom:1px solid var(--hair)"><span class="l">' + e[0] + '</span><b>' + e[1] + '</b><small>' + e[2] + '</small></div>')) + '</div>',
        psheet('Suggestions to review · 4', '<article class="vx-sug"><div class="row" style="grid-template-columns:1fr"><span>Interview · Priya Raman · 28 Oct</span><div class="q">“If this isn’t live before the e-invoicing deadline, we’ll have to hire someone.”</div></div><div class="row" style="grid-template-columns:1fr"><span>Eadwyn’s reading</span><div class="ai">Urgency · High · before the 2028 mandate</div></div><div class="ft" style="flex-direction:column;align-items:stretch"><button type="button" class="btn" style="min-height:44px">Accept</button><div style="display:flex;gap:6px"><button type="button" class="btn" style="flex:1;min-height:44px">Edit</button><button type="button" class="btn" style="flex:1;min-height:44px">Discard</button></div></div></article>')),
      VAM30C: () => phone('[Reconcily]', '<div><span class="raw">Market intelligence</span><h1 style="font-size:22px;font-weight:800">[Reconcily]</h1><div class="vx-meta"><span>Direct · tracked since Sep 2026</span>' + st('Watching') + '</div></div><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Latest signal</dt><dd>Funding · 2 Nov</dd><dt>Funding to date</dt><dd class="vam-mono">[$14.5M] · USD</dd><dt>Price</dt><dd>Higher than ours</dd><dt>Depth</dt><dd>Broader</dd></dl><button type="button" class="btn p" style="min-height:48px">Add a signal</button><span class="eye">Signals · 4</span>' + J(SIGS.slice(0, 3).map(r => '<div class="vx-card"><div class="r1"><b>' + r[0] + '</b><span class="raw">' + r[2] + '</span></div><small>' + r[1] + ' · ' + r[3] + '</small></div>')) + '<div class="vam-row"><button type="button" class="btn" style="min-height:44px;flex:1">Edit</button><button type="button" class="btn" style="min-height:44px;flex:1">Stop tracking</button></div>'),
      VAM30D: () => phone('Letter of intent', '<div><span class="raw">Demand and urgency signals</span><h1 style="font-size:22px;font-weight:800">Letter of intent · [Fleetwise]</h1><div class="vx-meta"><span class="vam-mono">[€12,000 / year] · 6 Nov</span>' + st('Confirmed') + '</div></div><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Counts toward</dt><dd>' + st('Not applicable', 'No bar for this kind') + '</dd><dt>Evidence</dt><dd>fleetwise-loi-signed.pdf</dd><dt>Interview</dt><dd>Maya Chen · 2 Oct</dd><dt>Feeds</dt><dd>H2 ' + dir('s') + '</dd><dt>Urgency</dt><dd>High · before the Q1 close</dd><dt>Objection</dt><dd>Trust</dd></dl><button type="button" class="btn p" style="min-height:48px">Open evidence</button><div class="vam-row"><button type="button" class="btn" style="min-height:44px;flex:1">Edit</button><button type="button" class="btn" style="min-height:44px;flex:1">Attach</button></div><button type="button" class="btn" style="min-height:44px">Mark to confirm</button>')
    };

    /* ---------- V31 handoff ---------- */
    const R = (e, b, r, be, v) => [e, b, r, be, v];
    const HROWS = [
      R('Next action', 'V17, V22', '<code>GET /api/cycles/validate/overview</code> marketCard / demandCard <code>next</code>', 'None', 'Each next-action rule from <code>cycleValidate.ts</code> shows its text'),
      R('Total, serviceable, obtainable', 'V17, V28–V30', 'overview marketCard <code>series.tam/sam/som</code> → <code>projects.tam/sam/som</code>', 'None', '“No figure entered” and “No source recorded for this figure” render as words, never 0'),
      R('Source and as-of per figure, history', 'V17, V18', '◇ needs Worker work: <code>source</code> is always null; <code>project_market_assumptions</code> is one upserted row', 'New columns or table + read', 'Figure shows source and date; history lists earlier values'),
      R('Sizing method and inputs, override', 'V18', '<code>GET/PUT /api/projects/:id/market-assumptions</code> → <code>project_market_assumptions</code> (canEditProjectData)', 'None', 'Partner gets Refused; arithmetic matches the saved inputs'),
      R('Citation on an input', 'V17, V18', 'same read, <code>filled</code> → <code>fill_provenance</code> target <code>market_assumption:&lt;field&gt;</code>', 'None', 'Founder-typed inputs show no citation'),
      R('Use a Research figure', 'V18', '◇ needs Worker work: Research › Markets holds company counts, not a size', 'New fill source', '—'),
      R('Readiness marks', 'V17', '<code>GET /api/cycles/validate/market-readiness</code> · <code>PUT …/market-marks/:item</code> → <code>market_readiness_marks</code>', 'None', 'Mark and date persist; unmark clears'),
      R('Sources list', 'V17', 'same read · <code>POST/DELETE …/market-sources</code> → <code>market_sources</code>; Notion via FromNotion (D1087)', 'None', 'A source with no link shows “No link”'),
      R('Competitors tracked table and count', 'V17', '<code>GET …/modules/market-intelligence</code> (loadTracked) · overview <code>competitors_tracked</code>', 'None', 'Kind and Signal filters; sort latest or name; stopped excluded'),
      R('Positioning map', 'V17, V28, V29', 'records <code>competitor_tracking.price_position/depth_position</code>', '◇ positions in the list read (today per record only)', 'Unpositioned competitors listed under the map'),
      R('Competitor record', 'V20', '<code>GET …/modules/market-intelligence/records/:id</code>; stop tracking writes <code>competitor_tracking.stopped_at</code>', 'None', 'Headcount absent (Q2 · A); “Show signals for” relabels <code>watch</code> (Q1 · A)'),
      R('Comparison summary, relevance, sources', 'V19', '<code>GET /api/competitors/:id</code> → <code>competitor_candidates</code>, <code>competitor_sources</code> (member who ran it)', '◇ a read for the team and partners', 'Another member sees the ◇ note; tracked facts still show'),
      R('From interviews (market)', 'V17, V20', 'record <code>findings</code> → <code>interview_findings</code> alternative, market_fact', 'None', 'Quote withheld for a non-writer without quote consent'),
      R('Waitlist line and bar', 'V22, V26', 'demandCard <code>series.signups</code>, <code>series.bar</code> · <code>PUT …/waitlist-target</code> → <code>waitlist_signups</code>, <code>demand_signals</code>, <code>metric_targets</code>', 'None', 'Under 3 weeks with a sign-up shows the sentence, not a line'),
      R('Totals by kind, to confirm', 'V22', 'demandCard <code>series.signals</code>, <code>next</code> → <code>demand_signals</code> + <code>revenue_entries</code>', 'None', 'Waitlist tile counts typed signals only'),
      R('Need-to-have share', 'V22', 'demandCard <code>series.need_to_have</code> → <code>interview_pain_severities</code>', 'None', '“No interview has a pain judged yet” when none'),
      R('Committed value by currency', 'V22', '◇ needs Worker work', 'Sum per currency', 'Never one total across currencies'),
      R('Urgency strip and view', 'V22, V23', '◇ needs Worker work: <code>findingsFor</code> exists, no module read sends it', 'Module-level read', 'Counts equal accepted findings'),
      R('Signals table', 'V22', '<code>GET …/modules/demand-signals</code> (signal-, revenue-, waitlist- rows)', 'None', 'Kind, Period filters; Newest, Oldest sort'),
      R('Signal record', 'V24', '<code>GET …/demand-signals/records/:id</code> → evidence file, <code>hypothesis_evidence_links</code>, <code>customer_segments</code>, findings', 'None', 'revenue- has no actions; waitlist- shows “Signed up themselves”'),
      R('From Google', 'V22, V25', 'module <code>parts.from_google</code> (D1092, <code>validateFeeds.ts</code>)', 'None', 'No respondent named; partner Refused'),
      R('PostHog facts and survey marks', 'V22, V25', '<code>GET /api/cycles/validate/posthog?module=demand_signals</code> (D1605)', 'None', 'Never changes the waitlist count'),
      R('Lovable sign-ups', 'V22, V24, V26', '<code>lovable_signup_tokens</code>; <code>waitlist_signups</code> source lovable (D1312)', 'None', '“A sign-up with no name”'),
      R('Typeform suggestions', 'V25', '◇ #5829, screens #5830', 'In progress', '—'),
      R('Export', 'V17, V22', '◇ needs Worker work: no CSV for either page', 'Export route', '—'),
      R('Eadwyn proposals', 'V17, V22, V25', 'market fill (<code>services/fills/registry.ts</code>, market_input); interview proposals; competitor scan', 'None', 'No proposal writes a market size')
    ];
    const DOCS = {
      VAM32: () => dk('<h1>Developer handoff · V17–V30</h1><p>Checked on <code>main</code> 6d7712c6d1 (14 Nov 2026), the brief’s table from 45e7c55fa6 re-read in <code>cycleValidate.ts</code>, <code>records/validate.ts</code>, <code>routes/cycle_validate.ts</code>, <code>routes/projects.ts</code>, <code>routes/competitors.ts</code>, <code>validateWriters.ts</code>, <code>google/validateFeeds.ts</code>, <code>posthog/validate.ts</code>. ◇ marks what needs Worker work.</p>'
        + tbl(['Element', 'Boards', 'Reads / writes', 'Backend', 'Verify by'], HROWS)
        + '<div class="cols"><div><h2>Owner questions · option A drawn ⚑</h2><p>1 · Watch for becomes “Show signals for”, a filter on what a re-run keeps (D690 decision 8). 2 · Headcount removed. 3 · Pre-sales and letters of intent are counts with no bar (D690 decision 7). 4 · Market figures go to the deck and the Verdict only.</p><h2>Frontend only</h2><p>Layout, the positioning map drawing, the module selector below 1024, cards below 768, bottom sheets on phone, dark tokens, renaming “Unreadable” to Unavailable on screen, the Name sort option label.</p></div><div><h2>Access</h2><p>Founder and co-founders write. A partner reads with no actions and is Refused on sizing inputs, From Google and From PostHog. Advisors, investors and other founders are Refused on the whole page.</p><h2>Accessibility</h2><p>Every state has a word and a glyph; the map and the line carry a text title; the comparison scrolls inside its panel with a keyboard-focusable region; 44px targets on phone; urgency levels as words.</p></div></div>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'VAM18') html = page(market(), { h: 1940 });
    else if (B === 'VAM18B') html = page(market({ short: true }), { h: 900, rail: true, railHtml: railMarket });
    else if (B === 'VAM19') html = page(market({ short: true, noPrimary: true }), { h: 1250, overlay: sheet() });
    else if (B === 'VAM19B') html = crop('<span class="eye">Sizing sheet · Saving, Save failed (edits kept) and an override in use</span><div class="vam-g3w"><div class="vam-ftbox">' + sheetFoot('saving') + '</div><div class="vam-ftbox">' + sheetFoot('failed') + '</div><div>' + sizeTile('Total market', '[€70.0M]', 'Computed would be €64.8M', { ovr: 1 }) + '</div></div>', 1300);
    else if (B === 'VAM20') html = page(compare(true), { h: 960 });
    else if (B === 'VAM20B') html = page(compare(false), { h: 960 });
    else if (B === 'VAM21') html = page(compRec(), { h: 960 });
    else if (B === 'VAM21B') html = stopFlow();
    else if (B === 'VAM22') html = page(marketEmpty(), { h: 900 });
    else if (B === 'VAM23') html = page(demand(), { h: 2180 });
    else if (B === 'VAM24') html = page(urgency(), { h: 900 });
    else if (B === 'VAM25') html = page(sigRec(), { h: 1090 });
    else if (B === 'VAM25B') html = recVariants();
    else if (B === 'VAM26') html = page(suggestions(), { h: 1090 });
    else if (B === 'VAM27') html = page(demandEmpty(), { h: 900 });
    else if (B === 'VAM27B') html = page(demandFew(), { h: 900 });
    else if (B === 'VAM28') html = statesM();
    else if (B === 'VAM29A') html = tabMarket();
    else if (B === 'VAM29B') html = tabDemand();
    else if (B === 'VAM31A') html = page(market(), { h: 1940, dark: true });
    else if (B === 'VAM31B') html = page(demand(), { h: 2180, dark: true });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(market(), { h: 2400 });
    return { html: { __html: html } };
  }
}

</script>
