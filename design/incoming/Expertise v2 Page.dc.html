    /* ---------- visibility ---------- */
    const visibility = () => crumb('Visibility') + xhead('Visibility', 'What has actually been recorded about your work being seen and booked.', '<div class="seg" role="radiogroup" aria-label="Period"><button type="button" role="radio" aria-checked="false">7 days</button><button type="button" role="radio" aria-checked="true">30 days</button><button type="button" role="radio" aria-checked="false">90 days</button></div>')
      + '<div class="strip" style="grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card)"><div><small>Article opens</small><b>412</b><small>raw opens, not unique people</small></div><div><small>Booking requests</small><b>3</b><small>on your booking links</small></div><div><small>Talk reach</small><b style="font-family:var(--sg);font-size:14px">' + NREC + '</b><small>nothing records it</small></div><div><small>Profile views</small><b style="font-family:var(--sg);font-size:14px">' + NREC + '</b><small>not instrumented</small></div></div>'
      + '<div class="g"><section class="cd" style="grid-column:span 7"><div class="ch"><h2>Articles by opens</h2></div><table class="tbl"><thead><tr><th>Article</th><th class="n">Opens</th></tr></thead><tbody><tr><td>ICP before pitch</td><td class="n">186</td></tr><tr><td>Three numbers your board wants</td><td class="n">121</td></tr><tr><td>4 other articles</td><td class="n">105</td></tr></tbody></table></section>'
      + '<section class="cd" style="grid-column:span 5"><div class="ch"><h2>Booking links</h2></div><ul class="rz"><li><b>Intro call · 30 min</b><small>Linked from your profile</small><b class="mo">2 requests</b></li><li><b>Pricing review</b><small>Shared by email</small><b class="mo">1 request</b></li><li><b>Fundraising strategy</b><small>No booking link yet</small><a class="btn bsm" href="#">Add booking link</a></li></ul></section></div>';

    /* ---------- public relationship ---------- */
    const publicRel = () => crop('<span class="eye">Edit vs public · what founders see on /advisors/:uid</span><div class="g" style="gap:12px">'
      + J([['Profile', 'Public', 'Name, headline, about, areas, location', 'Edit profile'], ['Session types and booking links', 'Public', 'Set in Practice › Sessions', 'Open Sessions'], ['Services', 'Private', 'Your records; not listed', 'Manage services'], ['Proof', 'Private', 'Kept until publishing is built', 'Manage proof'], ['Thinking', 'Public', 'Published articles only', 'Manage thinking'], ['Visibility', 'Private', 'Only you see these figures', 'View visibility']].map(r => '<section class="cd" style="grid-column:span 4;gap:6px"><b>' + r[0] + '</b>' + st(r[1] === 'Public' ? 'Published' : 'Private', r[1]) + '<span class="raw">' + r[2] + '</span><a class="btn t bsm" href="#" style="align-self:flex-start;padding:0">' + r[3] + ' →</a></section>')) + '</div><p class="foot">“Edit profile” opens the editor; “Preview public profile ↗” opens the public page in a new tab and is disabled until a saved profile gives it an address.</p>', 1100);

    /* ---------- states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const nt = (tone, ic, h, d, act) => '<div class="nt ' + tone + '"' + (tone === 'r' ? ' role="alert"' : '') + '><span class="ic" aria-hidden="true">' + ic + '</span><div><b>' + h + '</b><div>' + d + '</div></div>' + (act ? '<span class="bt"><button type="button" class="btn bsm">' + act + '</button></span>' : '') + '</div>';
    const STATES = [
      ['Loading · one section', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:12px;width:50%"></span><span class="sk" style="height:12px;width:80%"></span></div><span class="raw">Proof loading; Profile and Services already drawn</span>'],
      ['Empty', nt('', '+', 'No services yet', 'Add what you sell, with a price and currency.', 'Add service')],
      ['Error · this section', nt('r', '✕', 'This section could not be read.', 'Other sections are unaffected.', 'Try again')],
      ['Success', nt('g', '✓', 'Service saved', 'Price CHF 450.00 · just now', '')],
      ['Permission denied', nt('', '⦸', 'Expertise needs an Advisor licence', 'Your account doesn’t hold one. Ask HQ to add it.', '')],
      ['Unavailable', nt('', '?', 'Advisor data unavailable', 'Select an advisor to view their services.', '')],
      ['Not recorded', '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Talk reach</dt><dd>' + NREC + '</dd></dl><button type="button" class="disc2" aria-expanded="false">Why? ▾</button>'],
      ['Destructive confirmation', '<b style="font-size:13px">Delete “Board advisor”?</b><p style="font-size:12.5px">Its 1 confirmation request goes too, including R. Haddad’s name and email. It can’t be undone.</p><div style="display:flex;gap:6px"><button type="button" class="btn bsm">Cancel</button><button type="button" class="btn dg bsm">Delete claim and request</button></div>']
    ];
    const states = () => crop('<span class="eye">States · every section loads, fails and retries on its own · “failed” never looks like 0</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);

    /* ---------- responsive ---------- */
    const phone = (body, w) => '<div class="cv" style="' + VARS + ';width:' + (w || 390) + 'px;height:' + (w ? 1024 : 844) + 'px"><div class="ph" style="width:' + (w || 390) + 'px;height:100%"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Expertise</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div></div></div>';
    const mtabs = '<nav class="wst" aria-label="Expertise sections" style="flex:none;overflow:hidden">' + J(['Overview', 'Profile', 'Services', 'Proof', 'More ▾'].map((t, i) => '<a href="#"' + (i === 0 ? ' aria-current="page"' : '') + ' style="padding:12px 9px;min-height:44px">' + t + '</a>')) + '</nav>';
    const mob = () => phone(mtabs + '<a class="btn" href="#" style="min-height:44px">Preview public profile ↗</a><section class="nba" style="flex-direction:column;align-items:stretch;padding:14px"><span class="k2">Next step</span><h2 style="font-size:15px">Ask Jane Smith to reconfirm “Enterprise GTM”</h2><button type="button" class="btn p" style="min-height:48px">Ask again</button></section>' + J(YE.map(y => '<button type="button" class="disc"><b>' + y[0] + '</b><span>' + y[1].replace(/<[^>]+>/g, '').replace(/^\s+/, '') + '</span><i aria-hidden="true">›</i></button>')));
    const tab = () => phone(mtabs + xhead('Expertise', 'Build the profile founders use to understand, trust and engage you.', prevBtn()) + '<section class="nba"><div style="flex:1"><span class="k2">Recommended next step</span><h2>Ask Jane Smith to reconfirm “Enterprise GTM”</h2></div><button type="button" class="btn p">Ask again</button></section><div class="wfs" style="grid-template-columns:1fr 1fr">' + J(PRF.slice(0, 4).map(proofCard)) + '</div>', 768);

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const docMap = () => dk('<h1>Current-state map and revised IA</h1>' + tbl(['Today (live, 7 Nov)', 'Problem', 'Revised'], [
      ['Six identity layers (Super Admin Mode, Previewing · Advisor shell, Advisor View, Expertise, Axal VC, Advisor preview)', 'Which context am I in?', 'One preview banner: “Viewing as Advisor · No advisor selected” with Impersonate and Exit'],
      ['“Public profile” links to the editor', 'Label promises a public page', '“Edit profile” and “Preview public profile ↗” as two actions'],
      ['Five equal zone cards, each explaining absence', 'No next action; repeated prose', 'Your Expertise strip + one recommended step (max 3) derived from state'],
      ['Implementation prose in empty states', 'Reads like system notes', 'Short state copy; the why behind a disclosure'],
      ['Eadwyn rail with models, prices, allowance, top-up', 'Competes with the task', 'Compact “Ask Eadwyn” card; model and money in AI settings']])
      + '<h2>Information architecture</h2><p>Expertise › Overview · Profile · Services · Proof · Thinking · Visibility, following Build → Prove → Publish → Engage → Learn. Booking stays in Practice › Sessions (D4681), and the overview says so instead of implying services are bookable.</p><h2>State dimensions</h2>'
      + tbl(['Dimension', 'Values used', 'Source'], [['Completion', 'Incomplete · Complete (n of 7 fields)', 'Frontend, from the profile'], ['Record state (services)', 'Active · Inactive', '<code>advisor_services</code> (D4681)'], ['Verification (proof)', 'Self-stated · Awaiting · Confirmed · Declined · Withdrawn · Needs reconfirmation', 'Consents + events (D4670)'], ['Editorial (thinking)', 'Draft · Submitted · In review · Changes requested · Not accepted · Approved · Scheduled · Published', '<code>/me/thinking</code> (D4681)'], ['Visibility', 'Public · Private', 'D4681: profile, session types and articles are public; services and proof are not']]));
    const docHand = () => dk('<h1>Components, accessibility and handoff</h1>' + tbl(['Component', 'Rule'], [['ExpertiseHeader / PublicPreviewButton', 'Title, one line, Edit profile + Preview public profile ↗ (disabled with reason until saved)'], ['ExpertiseStatus', 'Five cells: label, fact, sub-fact, one action. Unreadable cells say so and retry alone (D4697)'], ['NextActionCard', 'One dominant step; at most 3 total; none when state supports none'], ['ServiceCard', 'Title, kind, duration, currency + price (or “No price set”), Active/Inactive, Edit · Mark inactive · Delete'], ['ProofCard / AttestationStatus', 'Claim, attester, state, dates; “Confirmed by …”, never “Verified”'], ['ArticleWorkflowBadge', 'Eight editorial states, each with one next step'], ['InlineSaveStatus', '“Profile updated” vs “Not saved, your text is kept”, announced politely / as alert']])
      + '<h2>Accessibility</h2><p>WCAG 2.2 AA target. Field limits shown as live counters tied by aria-describedby; over-limit blocks save and never truncates. Code entry is six labelled inputs with paste support. Sections announce loading/unreadable by word. 44px targets on phone; tabs become a section nav; no horizontal tables.</p><h2>Backend fit</h2>'
      + tbl(['Board item', 'Today', 'Status'], [['Overview counts', '<code>/me/services</code>, <code>/me/proof</code>, <code>/me/thinking</code>, <code>/me/visibility</code> counts (D4689)', 'Frontend'], ['Proof ask / answer / code', '<code>POST /me/proof/:id/consent-request</code>, <code>/proof-consents/:token/claim|code|respond</code> (D4670)', 'Frontend'], ['Copy link, cancel request', 'invite_token on the list; cancel = delete consent?', 'Check: no dedicated cancel route found'], ['Resend by email', 'No mail on ask (D4670 §3)', 'Not built — omit or backend'], ['Publish proof / services, bookable services', 'Not public (D4681)', 'Backend required'], ['Draft profile vs published', 'One save writes the live profile', 'Backend required'], ['Concurrent service edits', 'Not checked', 'Backend required (#4674)'], ['Profile views, unique reach, talk reach', 'Not recorded', 'Stay Not recorded']])
      + '<p>React: <code>pages/advisor/expertise/</code> zones keep their routes; Overview becomes ExpertiseStatus + NextActionCard over <code>useBucketSources</code> (per-section retry, D4697).</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'EX01') html = page(overview(), { h: 1150 });
    else if (B === 'EX02') html = page(noProfile(), { h: 860 });
    else if (B === 'EX03') html = page(adminPreview(), { h: 700, banner });
    else if (B === 'EX04a') html = tab();
    else if (B === 'EX04b') html = mob();
    else if (B === 'EX05a') html = page(profile(false), { h: 960, cur: 'Profile' });
    else if (B === 'EX05b') html = page(profile(true), { h: 960, cur: 'Profile' });
    else if (B === 'EX06') html = page(services(), { h: 1000, cur: 'Services' });
    else if (B === 'EX07') html = svcEdit();
    else if (B === 'EX08') html = page(proof(), { h: 900, cur: 'Proof' });
    else if (B === 'EX09') html = askFlow();
    else if (B === 'EX10a') html = recipient('start');
    else if (B === 'EX10b') html = recipient('code');
    else if (B === 'EX10c') html = recipient('done');
    else if (B === 'EX11') html = page(thinking(), { h: 820, cur: 'Thinking' });
    else if (B === 'EX12') html = page(visibility(), { h: 760, cur: 'Visibility' });
    else if (B === 'EX13') html = publicRel();
    else if (B === 'EX14') html = states();
    else if (B === 'EX15') html = docMap();
    else if (B === 'EX16') html = docHand();
    else html = page(overview(), { h: 1150 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
