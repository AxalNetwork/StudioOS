      + '<div class="qft"><span>A Lab or Mercury tick explains itself and cannot be unticked by hand. Lab ticks apply while the founder holds one venture. The runway item shows only with Mercury connected, or once ticked by hand.</span></div></section>'
      + '<div style="display:flex;flex-direction:column;gap:14px"><section class="cd grc-nl" style="gap:8px"><div class="ch"><h2>Not applicable</h2>' + NEW('#6121') + '</div><p style="font-size:12.5px">Mark one item as not applicable, with a reason. It leaves the count: “6 of 8 done · 1 not applicable”.</p><div class="fld"><label for="na1">Reason</label><div class="ta" id="na1" style="min-height:44px">No key-person cover: two founders, both on the board.</div></div><p class="raw">Not stored today; never drawn as done or as open.</p></section>'
      + '<section class="cd grc-nl" style="gap:8px"><div class="ch"><h2>Option B</h2>' + NEW('New store') + '</div><p class="raw">Items by jurisdiction and entity type</p><span class="eye">Delaware · C-corp</span><ul class="grc-rl sm"><li><span>Franchise tax + annual report</span>' + st('Open') + '</li><li><span>Registered agent</span>' + st('Done') + '</li></ul><span class="eye">England and Wales · Ltd</span><ul class="grc-rl sm"><li><span>Confirmation statement</span>' + st('Open') + '</li><li><span>PSC register kept</span>' + st('Not applicable') + '</li></ul><p class="foot">Each list is per entity; a project links one entity today.</p></section></div></div>';

    /* ---------- GR-25 empty ---------- */
    const emptyPage = () => head(true) + '<section class="cd grc-empty"><h2>No obligations yet. The compliance calendar appears here.</h2><p class="mu" style="font-size:13px">Add the filings, board meetings and renewals this company owes. Each gets an owner, a due date and reminders.</p><button type="button" class="btn p" style="align-self:flex-start">Add obligation</button></section>'
      + '<div class="grc-g2" style="grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start"><section class="cd" style="gap:8px"><div class="ch"><h2>2 found in your calendar</h2><span class="sm">Google Calendar · read 14:20</span></div>' + calCard(['Board meeting', '12 Dec 2026', 'Governance', '#board', 'Board meeting']) + calCard(['Delaware franchise tax + annual report', '1 Mar 2027', 'Compliance', '#filing', 'Filing deadline']) + '<p class="foot">Each has its own Accept and Dismiss. After the first obligation is added, this page becomes the working view.</p></section>'
      + '<section class="cd" aria-labelledby="ck0" style="gap:8px"><div class="ch"><h2 id="ck0">Durability checklist</h2><span class="sm">0 of 9 done</span></div><ul class="grc-ck">' + J(CK.slice(0, 8).map(c => '<li><i aria-hidden="true"></i><div><b>' + c[0] + '</b><small>Open</small></div></li>')) + '</ul><p class="raw">Runway item hidden: Mercury is not connected</p></section></div>'
      + '<section class="cd" style="gap:6px"><div class="ch"><h2>Updates history</h2><a class="btn t bsm" href="#">Reporting →</a></div><p style="font-size:12.5px" class="mu">No update sent yet. ' + st('None') + '</p></section>' + second;

    /* ---------- GR-26 states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const wholeDown = () => head(true) + '<div class="grc-g2" style="grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start"><section class="cd" style="gap:8px"><span class="eye">Company card · still shown</span><dl class="kv2" style="grid-template-columns:minmax(0,1fr) auto"><dt>Due, next 90 days</dt><dd class="mo">8</dd><dt>Checklist items done</dt><dd class="mo">6 of 9 · 67%</dd></dl><p class="raw">Compliance calendar and checklist · as of 14 Nov 2026</p></section>'
      + '<section class="cd grc-down" role="alert"><div class="grc-r">' + st('Unavailable') + '<span class="raw">read 14:31</span></div><h2 style="font-size:16px">Unreadable: Compliance calendar and checklist could not be read</h2><p style="font-size:12.5px" class="mu">The obligations, checklist, cash and runway and updates history are not shown, because they come from the same read. Nothing was changed. Add obligation returns once the read works.</p><button type="button" class="btn p" style="align-self:flex-start">Try again</button></section></div>'
      + '<div class="grc-g4">' + J(['Obligations', 'Durability checklist', 'Cash and runway', 'Updates history'].map(t => '<section class="cd grc-dash"><b style="font-size:13px">' + t + '</b>' + st('Unavailable') + '<small class="raw">Never drawn as 0 or as an empty list</small></section>')) + '</div>';
    const statesGrid = () => crop('<span class="eye">Region states · each has a word and a shape; zero, Not recorded and Unavailable never look alike</span><div class="grc-g4">'
      + box('Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:7px"><span class="sk" style="height:12px;width:50%"></span><span class="sk" style="height:26px"></span><span class="sk" style="height:26px"></span><span class="sk" style="height:26px"></span><span class="raw">List and checklist skeletons · announced “Loading obligations”</span></div>')
      + box('Not recorded', '<ul class="grc-rl sm"><li><span>Owner</span><span class="grc-no">No owner named</span></li><li><span>Repeats</span>' + NR() + '</li><li><span>Reminders</span><span class="grc-no">No reminder set</span></li><li><span>Done on</span>' + NR() + '</li><li><span>Runway</span>' + NR() + '</li></ul><p class="raw">Runway: “Not recorded: Mercury gave no available balance”</p>')
      + box('Measured zero vs none', '<ul class="grc-rl sm"><li><span>Due in next 30 days</span><b class="mo">0</b></li><li><span>Past meetings</span><span class="grc-no">Not held yet</span></li><li><span>Agenda</span><span class="grc-no">No agenda item yet</span></li><li><span>Minutes</span><b class="mo">0 stored</b></li></ul><p class="raw">0 is a value: the read worked and found none.</p>')
      + box('Unavailable · one part', '<div class="nt"><span class="ic" aria-hidden="true">?</span><div>' + st('Unavailable') + '<div style="margin-top:4px"><b>Updates history</b>: Unreadable: Updates history could not be read.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div><div class="nt"><span class="ic" aria-hidden="true">?</span><div>' + st('Unavailable') + '<div style="margin-top:4px"><b>Cash and runway</b>: Unreadable: the Mercury figures could not be read.</div></div></div><p class="raw">The obligations list and checklist stay; only the failed part says so.</p>')
      + box('Refused', '<div class="nt"><span class="ic" aria-hidden="true">' + SH.lk + '</span><div>' + st('Refused') + '<div style="margin-top:4px"><b>Only this venture’s team can see its obligations.</b> The founder can add you as a member.</div></div></div><p class="raw">An investor, or another venture’s founder</p>')
      + box('Read only · advisor', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div>' + st('Read only') + '<div style="margin-top:4px">No Add obligation, no Mark held, no ticks. Ana Costa, Priya Raman and Jonas Weber can edit.</div></div></div><p class="raw">An advisor membership on a founder account</p>')
      + box('Cash hidden', '<div class="nt"><span class="ic" aria-hidden="true">' + SH.lk + '</span><div>' + st('Team only') + '<div style="margin-top:4px">From the founder’s Mercury: only the venture’s team sees these figures.</div></div></div>')
      + box('Saving and save failed', '<div style="display:flex;flex-direction:column;gap:8px"><span>' + st('Saving', 'Saving…') + '</span>' + '<div class="nt r"><span class="ic" aria-hidden="true">✕</span><div><b>Save failed, your edits are kept.</b><div>Nothing was written.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div></div>')
      + box('Upload refused · too large', '<p class="grc-err">' + SH.fl + ' Minutes are 20 MB at most</p><p class="raw">board-pack-scan.pdf · 31.4 MB · 413</p>')
      + box('Upload refused · wrong type', '<p class="grc-err">' + SH.fl + ' Minutes are a PDF or a DOCX file</p><p class="raw">minutes.pages · 415</p>')
      + box('Upload refused · no storage', '<p class="grc-err">' + SH.fl + ' File storage is not configured</p><p class="raw">503 · the meeting is not marked held; notes are kept</p>')
      + box('Mark held refused · clash', '<p class="grc-err">' + SH.fl + ' Another governance obligation is already due on 2027-03-12. Pick another date.</p><p class="raw">409 · the next date collides</p>')
      + '</div>', 1400);

    /* ---------- phone 390 ---------- */
    const phone = (title, body, sheet, back) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="' + (back ? 'Back' : 'Menu') + '">' + (back ? '‹' : '☰') + '</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mcard = (r) => '<a href="#" class="mc grc-mc' + (r[4] === 'Overdue' ? ' od' : '') + '"><div class="r1"><b>' + r[0] + '</b>' + st(r[4]) + '</div><small>' + r[1] + ' · <span class="mo">' + r[2] + '</span></small><small>' + (r[3] || '<span class="grc-no">No owner named</span>') + '</small></a>';
    const sheetP = (h, inner) => '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + h + '"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px">' + inner + '</div></div>';
    const MOB = {
      GRC27a: () => phone('Company', '<div class="raw">Lumen Robotics · next 90 days</div><div class="grc-due ph4">' + J([['Overdue', 2, 'od', SH.ar], ['30 days', 3, '', SH.cal], ['90 days', 5, '', SH.cal], ['Later', 4, '', SH.up]].map(d => '<button type="button" class="' + d[2] + '" aria-pressed="false"><b>' + d[1] + '</b><span>' + d[3] + d[0] + '</span></button>')) + '</div>' + J(OB.slice(0, 4).map(mcard)) + '<button type="button" class="btn p" style="min-height:48px">Add obligation</button><button type="button" class="disc"><b>Durability checklist</b><span>6 of 9 done</span><i aria-hidden="true">›</i></button>'),
      GRC27b: () => phone('Board meeting', '<div class="grc-sub" style="flex-wrap:wrap"><span>Governance</span><span class="mo">due 12 Dec 2026</span>' + st('Scheduled') + '</div><div class="raw">Owner: Ana Costa · Repeats Quarterly</div><button type="button" class="btn p" style="min-height:48px">Mark held</button><section class="cd" style="padding:12px 14px;gap:6px"><h2 style="font-size:15px">Agenda</h2><ul class="grc-rl sm"><li><span>Hiring plan for 2027</span><small>Jonas W.</small></li></ul><button type="button" class="btn" style="min-height:44px">Add agenda item</button></section><section class="cd" style="padding:12px 14px;gap:6px"><h2 style="font-size:15px">Past meetings</h2><ul class="grc-rl sm"><li><span class="mo">11 Sep 2026</span><a href="#">Open minutes</a></li><li><span class="mo">12 Jun 2026</span><a href="#">Open minutes</a></li><li><span class="mo">12 Dec 2025</span><span class="grc-no">no minutes</span></li></ul></section><section class="cd" style="padding:12px 14px;gap:6px"><h2 style="font-size:15px">Reminders</h2><ul class="grc-rl sm"><li><span>30 days before</span>' + st('Sent') + '</li><li><span>7 days before</span>' + st('On') + '</li></ul></section>', '', true),
      GRC27c: () => phone('Board meeting', '<p style="font-size:13px">Governance · due 12 Dec 2026</p>', sheetP('mhs', '<h2 id="mhs" style="font-size:17px;font-weight:800">Mark held</h2>' + fld('m1', 'Held on', '<span class="mo">12 Dec 2026</span>', ' style="min-height:48px"') + '<div class="fld"><label for="m2">Notes</label><div class="ta" id="m2" style="min-height:60px">Approved the 2027 hiring plan.</div></div><div class="fld"><label for="m3">Minutes <span>· PDF or DOCX, up to 20 MB</span></label><button type="button" class="btn" id="m3" style="min-height:48px">Choose file…</button><small class="raw">Opens the system file picker</small></div><p class="foot">Moves the due date on by its repeat (quarterly).</p><button type="button" class="btn p" style="min-height:48px">Mark held</button><button type="button" class="btn" style="min-height:48px">Cancel</button>'), true),
      GRC27d: () => phone('Company', '<section class="cd" style="padding:12px 14px;gap:8px"><div class="ch"><h2 style="font-size:15px">Durability checklist</h2><span class="sm">6 of 9</span></div><ul class="grc-ck">' + J(CK.slice(4, 8).map(c => '<li class="' + (c[1] ? 'dn' : '') + '"><i aria-hidden="true">' + (c[1] ? '✓' : '') + '</i><div><b>' + c[0] + '</b><small>' + (c[1] ? c[2] + ' · ' + c[3] : 'Open') + '</small></div></li>')) + '</ul><button type="button" class="btn t" style="min-height:44px">Show all 9</button></section>'
        + '<section class="cd" style="padding:12px 14px;gap:6px"><div class="ch"><h2 style="font-size:15px">Cash and runway</h2>' + st('Team only') + '</div><dl class="kv2" style="grid-template-columns:minmax(0,1fr) auto"><dt>Cash available</dt><dd class="mo">$612,400</dd><dt>Runway, months</dt><dd class="mo">14</dd></dl><small class="raw">From Mercury, as of 13 Nov 2026</small></section>'
        + '<section class="cd" style="padding:12px 14px;gap:6px"><div class="ch"><h2 style="font-size:15px">From Google Calendar</h2><span class="sm">2</span></div><b style="font-size:13px">Board strategy session</b><small class="raw">20 Jan 2027 · becomes Governance</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn" style="min-height:44px">Accept</button><button type="button" class="btn" style="min-height:44px">Dismiss</button></div></section>')
    };

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const map = () => dk('<h1>Where things sit · Company</h1><p>Route <code>/grow/durable-company-building</code> (tab “Company”; the old name stays in the URL). Record <code>/grow/durable-company-building/:id</code>, the target of reminder links. No new route.</p>'
      + '<div class="grc-map">' + J([
        ['Obligations', 'Read and written here', '<code>compliance_events</code> · title, kind, due_date, owner_name, completion_status, recurrence, remind_days_json', ''],
        ['Board meetings', 'Record view', '<code>obligation_agenda_items</code>, <code>obligation_occurrences</code> (held_on, notes, minutes_file_key in R2 <code>grow-minutes/</code>)', 'Pack, Eadwyn agenda accept, resolutions'],
        ['Durability checklist', 'Read and ticked here', '<code>DURABILITY_ITEMS</code> + <code>durability_checklist</code>; Lab from <code>spinout_lab_milestones</code>; runway from <code>mercury_grow_facts</code>', 'Per-jurisdiction list, Not applicable'],
        ['Cash and runway', 'Read here, team only', '<code>mercury_grow_facts</code> via <code>cashFacts</code>', ''],
        ['Updates history', 'Read here, written in Reporting', '<code>portfolio_updates</code>, <code>update_recipients</code>, Beehiiv post figures', ''],
        ['Calendar proposals', 'Decided here, one at a time', '<code>google_workspace_proposals</code> (#board, #filing)', 'Fact-based proposals'],
        ['Calendar → Compliance', 'Second editor of the same rows', '<code>/api/compliance</code>, <code>/api/company/:uid/compliance</code> on <code>compliance_events</code>', ''],
        ['Brand', 'Link card only', 'Lives at <code>/build/brand</code> (D4862)', '']
      ].map(m => '<div><b>' + m[0] + '</b><small>' + m[1] + '</small><p>' + m[2] + '</p>' + (m[3] ? '<span class="ptag">◇ new: ' + m[3] + '</span>' : '<span class="raw">Exists on main</span>') + '</div>')) + '</div>'
      + '<h2>Handoffs</h2>' + tbl(['From / to', 'What travels'], [['Overview Company card, Needs your attention', 'Lands here; “Give Registered agent renewal an owner.” opens the owner picker on that row'], ['Reminder notification', 'Opens the record; the deep link keeps working'], ['Write the update', '<code>/grow/reporting</code> with the period'], ['Open in Calendar', 'Calendar compliance layer at the obligation’s date'], ['Spin-Out Lab item', 'Spin-Out Lab compliance milestones']]));
    const handoff = () => dk('<h1>Handoff · GR-21 to GR-29</h1><p>Checked on <code>origin/main</code> 6d7712c6d1 (14 Nov 2026). The brief was checked on 45e7c55fa6; every file these boards rely on was re-read on 6d7712c6d1.</p>'
      + tbl(['Part', 'On main', 'Status'], [
        ['Obligations list, filters, due windows', '<code>cycle_grow.ts</code> <code>recordsFor</code>, <code>dueWindow</code> (overdue, next 30, next 90, later; windows do not overlap; a snoozed or done past row is in none)', 'Frontend: due strip as filters, overdue first'],
        ['Add / edit, clash refusal', '<code>growWriters.ts</code> <code>addObligation</code>, 409 “Another … obligation is already due on YYYY-MM-DD”', 'Frontend: show it on Due; format the date'],
        ['Owner', 'Grow writes <code>owner_name</code> text, <code>owner_user_id</code> always null; <code>company_compliance.ts</code> has assignable / assignee / ready / done', '◇ Grow form setting the team assignee'],
        ['Reminders', '<code>REMIND_PRESETS</code> 30, 14, 7, 1, 0; at most three; <code>growDaily.ts</code> sends; new due date resets sent', 'Frontend only'],
        ['Agenda, Mark held, minutes', '<code>records/grow.ts</code> sections Agenda, Past meetings, Reminders, Documents; <code>markHeld</code> 413 / 415 / 503, next-date clash 409', 'Frontend only'],
        ['Resolutions', 'Documents row “Not recorded: No resolution store”', '◇ store'],
        ['Pack and draft agenda', 'Skill <code>board-meeting-brief</code> exists (proposes, sends nothing); not run from Grow; no Pack section; no accept path', '◇ run from the rail, Pack section, Accept writes agenda items'],
        ['Checklist', '<code>growCycle.ts</code> <code>DURABILITY_ITEMS</code> (nine), sources Spin-Out Lab / manual / Mercury', '◇ Not applicable; ◇ option B per jurisdiction'],
        ['Fact-based proposals', 'None in Grow. <code>compliance.ts</code> <code>STANDARD_EVENTS</code> (us_de_ccorp, us_de_llc, uk_ltd …) are written directly at incorporation by <code>legal.ts</code>', '◇ proposer; can reuse STANDARD_EVENTS'],
        ['Partial failure', '<code>records_state: unreadable</code> with <code>card</code> only; <code>updates_reason</code>; Mercury part <code>unreadable</code>', 'Frontend: Platform States word “Unavailable” with the Worker’s sentence'],
        ['Access', 'Writers: owner, co-founders, partners, admins; advisor reads; cash team only. App guards <code>/grow/:slug</code> to admin and founder accounts (<code>App.jsx</code> 3664–3665)', '⚑ an account whose own role is advisor or partner is turned away before the read-only rule']
      ])
      + '<h2>Open questions</h2><p>1 · Checklist: A drawn (fixed nine + ◇ Not applicable). 2 · Risk stays an obligation kind; no policies register. 3 · Owner from the company team (A). 4 · Brand stays at /build/brand. 5 · Compliance and Other share the stored event type, so they clash with each other on one day: keep or split? 6 · Partner and advisor accounts at the route guard.</p>'
      + '<h2>Accessibility</h2><p>Due strip chips are toggle buttons (aria-pressed), 44px on phone. Overdue, Snoozed, Done and Not live each carry a word and a glyph. The owner picker is a listbox; the clash refusal is tied to Due with aria-describedby. Unavailable regions use role=alert once, not per part. Tables keep a caption; phone uses cards, no table wider than the screen.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'GRC21' || B === 'GRC28') html = page(working({ sel: '' }), { h: 2060 });
    else if (B === 'GRC22') html = page(record(), { h: 1060, rail: 'record' });
    else if (B === 'GRC22B') html = markHeld();
    else if (B === 'GRC22C') html = flow();
    else if (B === 'GRC23') html = page(addPage(), { h: 960, rail: false });
    else if (B === 'GRC24') html = page(ckPage(), { h: 820, rail: false });
    else if (B === 'GRC25') html = page(emptyPage(), { h: 1000, rail: 'empty' });
    else if (B === 'GRC26') html = page(wholeDown(), { h: 760, rail: false });
    else if (B === 'GRC26B') html = statesGrid();
    else if (B === 'GRC26C') html = page(working({ ro: true, cash: 'hidden' }), { h: 1360, rail: false });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'GRC29') html = map();
    else if (B === 'GRC29B') html = handoff();
    else html = page(working({}), { h: 1780 });
    return { html: { __html: html } };
  }
}

</script>
</body>
