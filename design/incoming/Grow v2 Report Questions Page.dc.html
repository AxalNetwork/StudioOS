    const frozen = (o) => { o = o || {}; return '<section class="cd"><div class="ch"><h2>The report as frozen · revision 1</h2><span class="raw">What the investors received on 2 Nov 2026</span></div><div class="grq-fz">' + J(FIGS.map(s => '<div><span class="eye">' + s[0] + '</span><ul class="grq-fig">' + J(s[1].map(f => '<li class="grq-fr fz"><div class="grq-fl"><b>' + f[1] + '</b><small>' + f[3] + '</small></div><div class="grq-fv">' + (f[2] == null ? NR : '<b class="mo">' + f[2] + '</b>') + '</div><div class="grq-fs">' + (f[2] == null ? '' : srcChip(f[4]) + '<span class="raw">as of ' + f[5] + '</span>') + '</div><div class="grq-fq">' + (!o.empty && FCOUNT[f[0]] ? qchip(FCOUNT[f[0]]) : '') + '</div></li>')) + '</ul></div>')) + '</div>' + leftOut() + '</section>'; };
    const revStrip = () => '<div class="nt"><span class="ic" aria-hidden="true">i</span><div>Revision 1 · sent 2 Nov 2026 to 3 investors. Nothing in it has been corrected. Its figures are frozen at send.</div></div>';
    const sentReport = (o) => { o = o || {}; return fHead() + revStrip() + recips() + fQuestions(o) + frozen(o); };

    /* ---------- founder: desk (RPT1 + question rows) ---------- */
    const NEEDS_YOU_LINE = 'Only you and your co-founders see this list. Investors see the state of what they are owed, nothing more.';
    const needRow = (pill, t, btn, prim, extra) => '<li><div class="grq-np">' + pill + '</div><div class="grq-nt">' + t + (extra || '') + '</div><div class="grq-nb">' + btn.map((b, i) => '<a href="#" class="btn bsm' + (prim && i === 0 ? ' p' : '') + '">' + b + '</a>').join('') + '</div></li>';
    const needs = (withQ, compact) => { const rows = [
        needRow('<span class="grq-pill a"><i aria-hidden="true">▲</i>Late · 6 days</span>', '[Oct 2026] monthly update to [Harbor Capital] and [Axal VC Fund I] is 6 days late.', ['Prepare it', 'Give an expected date'], true),
        needRow('<span class="grq-pill n"><i aria-hidden="true">?</i>Asked</span>', '[Harbor Capital] asked for the [Oct 2026] update on [10 Nov].', ['Open the request'])]
      .concat(withQ ? [
        needRow(qp('unread'), '<b>Question</b> · ' + Q.D.who + ' asked about MRR in the ' + REP + ' · <span class="raw">' + Q.D.ago + '</span>', ['Open and reply'], false, compact ? '' : ' ' + NEW('desk question rows')),
        needRow(qp('open'), '<b>Question</b> · ' + Q.C.who + ' asked about Customers in the ' + REP + ' · <span class="raw">' + Q.C.ago + '</span>', ['Open and reply'])] : []);
      return '<section class="cd" aria-labelledby="nyh"><div class="ch"><h2 id="nyh">Needs you <span class="grq-cnt2">' + rows.length + '</span></h2><span class="raw">Late and missing first, oldest due first · then requests · then questions</span></div><ol class="grq-need">' + J(rows) + '</ol><p class="foot">' + NEEDS_YOU_LINE + '</p></section>'; };
    const desk = (withQ) => '<div class="crumb"><a href="#">Grow</a>/<b>Reporting</b></div><header class="ph1"><div><h1>Reporting</h1><p>The reports ' + CO + ' owes its investors, what was sent, and what investors asked.</p></div><div class="acts"><button type="button" class="btn">Duties</button><button type="button" class="btn">History</button></div></header>'
      + needs(withQ)
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><div class="ch" style="padding:12px 16px"><h2>Sent</h2><span class="raw">Latest revision of each report</span></div><table class="etb"><thead><tr><th>Report</th><th>Sent</th><th>Recipients</th><th>Opened</th><th>Questions</th></tr></thead><tbody>'
      + '<tr><td><a href="#"><b>' + REP + '</b></a><small>Quarterly KPI report · revision 1</small></td><td class="w">2 Nov 2026</td><td class="w">3</td><td class="w">2 of 3</td><td>' + (withQ ? qp('unread', '1 unread') + ' ' + qp('open', '1 open') : '<span class="raw">None asked</span>') + '</td></tr>'
      + '<tr><td><a href="#"><b>[Sep 2026] update</b></a><small>Monthly update · revision 1</small></td><td class="w">8 Oct 2026</td><td class="w">2</td><td class="w">2 of 2</td><td><span class="raw">None asked</span></td></tr></tbody></table><p class="foot" style="padding:10px 16px">The Questions column needs the question store ' + NEW('desk read') + '</p></section>';

    /* ---------- boards ---------- */
    const DRAFT1 = composer({ subj: 'MRR', about: 'MRR · ' + PER + ' · [$48,200] · Connector · Stripe · as of [30 Sep 2026]', text: 'whats driving the mrr jump? seems high', count: 34 });
    const WHOLE = composer({ subj: 'the whole report', about: 'The whole report · ' + REP + ', revision 1', empty: 1, count: 0 });
    const b22 = () => ipage(coBack(), { h: 1920, rail: true, overlay: ov(reader({ mode: 'pre', open: 'mrr', cmp: DRAFT1 })) });
    const b22a = () => ipage(coBack(), { h: 2060, overlay: ov(reader({ mode: 'full', wholeCmp: WHOLE })) });
    const b22b = () => ipage(coBack(), { h: 1420, overlay: ov(reader({ mode: 'none' })) });
    const b23 = () => fpage(sentReport({ box: true }), { h: 2000, rail: true });
    const b23a = () => fpage(desk(true), { h: 900 });
    const box = (t, inner, w) => '<div class="grq-box"' + (w ? ' style="grid-column:span ' + w + '"' : '') + '><span class="eye">' + t + '</span>' + inner + '</div>';
    const crop = (inner, w) => '<div class="cv" style="' + VARS + ';width:' + (w || 900) + 'px;padding:20px;display:flex;flex-direction:column;gap:14px">' + inner + '</div>';
    const b23b = () => crop('<span class="eye">Founder · no questions yet · the sent report and the desk</span><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">' + fQuestions({ empty: true }) + needs(false) + '</div><p class="foot">No question row and no “0” on Needs you: the row kind appears only when a question exists. The count chip counts the rows that are there (2).</p>', 1300);
    const withdrawDlg = () => crop('<span class="eye">Withdraw · review in an in-page dialog, then the result</span><div style="display:grid;grid-template-columns:560px minmax(0,1fr);gap:20px;align-items:start">'
      + '<div class="grq-mdl" role="dialog" aria-modal="true" aria-labelledby="wdh"><div class="mdh"><h2 id="wdh">Withdraw your question?</h2><button type="button" class="ib" aria-label="Close">✕</button></div><div class="mdb"><div class="grq-ab"><span class="eye">About</span><span>' + Q.C.about + '</span></div><p class="grq-qt">' + Q.C.text + '</p><dl class="kv2" style="grid-template-columns:130px minmax(0,1fr)"><dt>What changes</dt><dd>The question shows as Withdrawn. The founders can no longer reply to it.</dd><dt>What stays</dt><dd>The founders see that you withdrew it. The text stays in the record.</dd><dt>Undo</dt><dd>None. You can ask a new question.</dd></dl></div><div class="mdf"><button type="button" class="btn">Keep the question</button><button type="button" class="btn dg">Withdraw question</button></div></div>'
      + '<div style="display:flex;flex-direction:column;gap:10px"><span class="raw">Result, in place of the question</span><ol class="grq-iql">' + iQ('C', { state: 'wd', lab: 'Withdrawn 14 Nov' }).replace('6 Nov 2026', '14 Nov 2026') + '</ol><div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div>Withdrawn. ' + CO + '’s founders see it as withdrawn.</div></div><p class="foot">Withdraw shows only on an unanswered question. ' + NEW('POST withdraw') + '</p></div></div>', 1240);
    const states = () => crop('<span class="eye">States · the frozen report always draws; only the questions change</span><div class="grq-grid">'
      + box('Loading · investor reader', '<ul class="grq-fig">' + figRow(FIGS[0][1][0], { noLink: false }) + '</ul>' + thread('loading') + '<p class="foot">Figures and statements draw from the report read; only the thread waits.</p>')
      + box('Loading · founder Questions', fQuestions({ loading: true }))
      + box('Not recorded · still askable', '<ul class="grq-fig">' + figRow(FIGS[0][1][2], {}) + '</ul><div class="grq-ab"><span class="eye">About</span><span>Gross margin · ' + PER + ' · Not recorded</span></div><p class="foot">Not recorded is never drawn as 0 or as a blank value.</p>')
      + box('Unreadable · questions read failed', '<div class="nt" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Your questions could not be read.</b><div class="mu">This is not a claim that nobody asked. The report, its figures and statements still work.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div><p class="foot">Same block on the founder side, worded for “Questions”.</p>')
      + box('Refused · admin, advisor or partner', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>Read only.</b><div class="mu">Only the founders reply. You see the threads as they read the sent report.</div></div></div><ol class="grq-fql">' + fQ('C', { ro: true }) + '</ol>' + FLAG('Read-only threads · option A'))
      + box('Refused · support session', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>A support session cannot ask or reply.</b><div class="mu">The report and the threads read as the account sees them. No composer, no Reply, no Withdraw. Opening it records no open.</div></div></div>')
      + box('Refused · not a recipient', '<div class="grq-empty"><b>No thread is drawn.</b><span>A person who did not receive this report never sees it or its questions: the Worker answers as if there were no report (the same 404).</span></div>')
      + box('Saving · text kept', '<div class="grq-cmp sm"><div class="ta grq-tx">' + Q.C.text + '</div><div class="grq-ca"><button type="button" class="btn">Cancel</button><button type="button" class="btn p" aria-disabled="true">Sending…</button></div></div>')
      + box('Save failed · the Worker’s own sentence', '<div class="grq-cmp sm"><div class="ta grq-tx">Can you send the cohort data to dana@[harborcap].example?</div><div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Not sent.</b><div>The privacy check found an email address in your question. Remove it and send again.</div></div></div><div class="grq-ca"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Send question</button></div></div><p class="foot">Names the kind of finding, never the words. ' + NEW('lintForSend on questions') + '</p>')
      + box('Withdrawn while the founder was replying', '<div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>[Dana Ruiz] withdrew this question.</b><div>Your draft is kept and not sent.</div></div></div><div class="ta grq-tx">Thanks, Dana. About a third of the [214] are on annual plans…</div><div class="grq-ca"><button type="button" class="btn">Copy draft</button><button type="button" class="btn">Discard draft</button></div>')
      + box('Corrected report · investor', '<div class="nt"><span class="ic" aria-hidden="true">↻</span><div><b>Revision 2 · corrected 13 Nov 2026</b><div class="mu">Customers changed from [214] to [211] · reason “[Stripe refund]”.</div></div></div><p style="font-size:12.5px">3 of your questions are on revision 1. <a href="#">Open revision 1 →</a></p>' + FLAG('Option C · stays, and linked'))
      + box('Corrected report · founder', '<div class="nt"><span class="ic" aria-hidden="true">↻</span><div><b>Revision 2 · corrected 13 Nov 2026</b><div class="mu">4 questions on revision 1 · 1 still unread.</div></div></div><p style="font-size:12.5px"><a href="#">Open the questions on revision 1 →</a></p><p class="foot">A question stays on the revision it was asked on; it does not move to revision 2.</p>')
      + '</div>', 1400);

    /* ---------- phones ---------- */
    const phoneShell = (head, body, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative">' + head + '<div class="pbd" style="overflow:hidden;gap:12px' + (o.pbar ? ';padding-bottom:96px' : '') + '">' + body + '</div>' + (o.pbar ? '<div class="grq-pbar">' + o.pbar + '</div>' : '') + (o.sheet || '') + '</div></div>'; };
    const pt = (t) => '<div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + t + '</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div>';
    const rHead = '<div class="grq-phh"><a href="#" class="grq-back">‹ Reports</a><h1>' + REP + '</h1><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="grq-pill a"><i aria-hidden="true">◐</i>Sent without [Partner revenue]</span></div><span class="raw">Quarterly KPI report · sent 2 Nov 2026 · rev 1</span><span class="raw">' + CO + '</span></div>';
    const mFig = (f, c) => '<li class="grq-mf"><div class="grq-mr"><b>' + f[1] + '</b>' + (f[2] == null ? NR : '<b class="mo">' + f[2] + '</b>') + '</div><small>' + f[3] + (f[2] == null ? '' : ' · ' + f[4]) + '</small><div class="grq-mr">' + (c ? qchip(c) : '<span></span>') + '<a href="#" class="grq-ql">Question about this figure</a></div></li>';
    const mIQ = (id) => { const q = Q[id]; return '<li class="mc"><div class="grq-mr"><span class="grq-subj">' + q.about + '</span>' + qp(q.inv) + '</div><small>Asked ' + q.at + '</small><p class="grq-qt" style="font-size:13px">' + q.text + '</p>' + (q.reply ? '<div class="grq-rep"><div class="grq-rh"><b>' + q.reply[0] + '</b><span class="raw">' + q.reply[1] + '</span></div><p>' + q.reply[2] + '</p></div>' : '') + '</li>'; };
    const MOB = {
      GRQ25: () => phoneShell(rHead, '<ul class="grq-mfl">' + mFig(FIGS[0][1][0], 1) + mFig(FIGS[0][1][1], 1) + '</ul><button type="button" class="disc"><b>5 more figures · 1 left out</b><span>Gross margin (Not recorded), Net burn, Runway, Headcount, Items shipped · Partner revenue left out</span><i aria-hidden="true">›</i></button><h2 style="font-size:15px;font-weight:800">Your questions · 3</h2><ol class="grq-mql">' + mIQ('D') + mIQ('B') + '</ol>', { pbar: '<button type="button" class="btn" style="min-height:48px;width:100%">Ask about the whole report</button>' }),
      GRQ25s: () => phoneShell('<div class="grq-shh"><button type="button" class="pi" aria-label="Close">✕</button><b>Question</b><span style="width:44px"></span></div>', '<div class="grq-ab"><span class="eye">About</span><span>MRR · ' + PER + ' · [$48,200] · Connector · Stripe · as of [30 Sep 2026]</span></div><div class="fld"><label>Your question <span>· to ' + CO + '’s founders</span></label><div class="ta grq-tx" style="min-height:150px;font-size:14px">' + Q.D.text + '</div><div class="grq-cnt"><span>Reworded by Eadwyn · accepted</span><span class="mo">' + Q.D.text.length + ' / 600</span></div></div><p class="grq-vis">' + lock + '<span>Only ' + CO + '’s founders see your question and their answer. Other investors do not.</span></p><p class="raw">Nothing is posted until you press Send question.</p>', { pbar: '<button type="button" class="btn p" style="min-height:48px;width:100%">Send question</button>' }),
      GRQ25a: () => phoneShell(pt('Reporting'), '<div class="raw">' + CO + '</div><section class="cd" style="padding:12px 14px"><div class="ch"><h2 style="font-size:16px">Needs you <span class="grq-cnt2">4</span></h2></div><ol class="grq-need ph2">'
        + needRow('<span class="grq-pill a"><i aria-hidden="true">▲</i>Late · 6 days</span>', '[Oct 2026] monthly update is 6 days late.', ['Prepare it'], true)
        + needRow('<span class="grq-pill n"><i aria-hidden="true">?</i>Asked</span>', '[Harbor Capital] asked for [Oct 2026] on [10 Nov].', ['Open the request'])
        + needRow(qp('unread'), '<b>Question</b> · ' + Q.D.who + ' asked about MRR in the ' + REP + ' · <span class="raw">2 days ago</span>', ['Open and reply'])
        + needRow(qp('open'), '<b>Question</b> · ' + Q.C.who + ' asked about Customers in the ' + REP + ' · <span class="raw">4 days ago</span>', ['Open and reply'])
        + '</ol><p class="foot">' + NEEDS_YOU_LINE + '</p></section>'),
      GRQ25b: () => phoneShell('<div class="grq-phh"><a href="#" class="grq-back">‹ Reporting</a><h1>' + REP + '</h1><span class="raw">Sent 2 Nov 2026 · revision 1 · 3 recipients</span></div>', '<div class="ch"><h2 style="font-size:16px;font-weight:800">Questions · 4</h2><span class="raw">1 unread · 1 open</span></div><ol class="grq-mql">' + J(['D', 'C', 'B'].map(id => { const q = Q[id]; return '<li class="mc' + (q.fo === 'unread' ? ' grq-un' : '') + '"><div class="grq-mr"><b>' + q.who + '</b>' + qp(q.fo) + '</div><span class="grq-subj">' + q.about + '</span><small>Asked ' + q.at + '</small><p class="grq-qt" style="font-size:13px">' + q.text + '</p>' + (q.fo === 'ans' ? '<small>Answered by ' + q.reply[0] + ' · ' + q.reply[1] + '</small>' : '<button type="button" class="btn" style="min-height:44px">Reply</button>') + '</li>'; })) + '</ol><button type="button" class="disc"><b>1 withdrawn</b><span>[Priya Shah] · Runway · 6 Nov</span><i aria-hidden="true">›</i></button>'),
      GRQ25r: () => phoneShell('<div class="grq-shh"><button type="button" class="pi" aria-label="Close">✕</button><b>Reply to [Dana Ruiz]</b><span style="width:44px"></span></div>', '<div class="grq-ab"><span class="eye">About</span><span>' + Q.D.about + '</span></div><p class="grq-qt" style="font-size:13px">' + Q.D.text + '</p><div class="cs2 grq-prop"><span class="raw">Eadwyn · draft reply</span><p class="grq-draft" style="font-size:13px">Thanks, Dana. The [$48,200] is Stripe MRR as of [30 Sep 2026], as the report shows. <mark>[Most of the increase came from new customers; two annual plans moved to monthly billing in August.]</mark></p><p class="grq-chk"><i aria-hidden="true">!</i>Highlighted claim is not in the report. Check before sending.</p><div class="grq-3b"><button type="button" class="btn">Accept</button><button type="button" class="btn">Edit</button><button type="button" class="btn">Discard</button></div></div><div class="fld"><label>Reply as [Maya Lind]</label><div class="ta grq-tx ph0" style="min-height:96px;font-size:14px">Write your reply…</div><div class="grq-cnt"><span>Only [Dana Ruiz] and your co-founders</span><span class="mo">0 / 1,200</span></div></div>', { pbar: '<button type="button" class="btn p" style="min-height:48px;width:100%" aria-disabled="true">Send reply</button>' })
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Handoff · questions on a sent report (#6096)</h1><p>Checked on <code>main</code> 6d7712c6d1 (14 Nov 2026). Nothing for questions exists today; every question value on these boards is ◇. Maps to the Reporting canvas as RPT22–RPT26; the decision would be <code>D1056-p1.md</code>.</p>'
      + '<h2>Checked on main</h2>' + tbl(['Where', 'What it shows'], [
        ['<code>routes/reporting_reports.ts</code> <code>GET /reports/:uid</code>', 'Founders get the team view (recipients with delivered and <code>opened_at</code>); a recipient’s first read records <code>opened</code> (not in a support session); an admin, advisor or partner gets <code>read_only: true</code>; anyone else gets the same 404 as no report.'],
        ['<code>routes/reporting.ts</code> <code>GET /desk</code>, <code>POST /periods/:uid/ask</code>', 'Needs you rows and “Ask for this report” (event <code>asked</code>). “Ask” is taken; these boards say Question.'],
        ['<code>sql/migrations/579_reporting_duties.sql</code>', '<code>reporting_events.event</code> CHECK lists 14 events, none for questions.'],
        ['<code>sql/migrations/437_share_an_update.sql</code>, <code>portfolio_updates.ts</code>', '<code>update_asks</code> run founder → recipient, <code>kind</code> held to hire, customer, partner, market, capital; Share an update’s writes refuse a report row (409 <code>report_row</code>).'],
        ['<code>pages/investor/CompanyReports.jsx</code>', 'Reader says “Questions about this report go to the company. A report carries no asks to reply to.” This copy is replaced by the Your questions block.'],
        ['<code>pages/investor/PortfolioCompanyPage.jsx</code>', 'Reads only the ownership hash; nothing opens the reader from the URL.'],
        ['<code>services/telegramRedactCheck.ts</code> <code>lintForSend</code>', 'Exists for Telegram and X posts; not wired to any reporting text.']])
      + '<h2>Backend required (◇)</h2>' + tbl(['Need', 'Shape'], [
        ['Store', '<code>report_questions</code> (update_id, figure_key or null, asker_user_id, text ≤ 600, created_at, read_at, withdrawn_at) and <code>report_question_replies</code> (question_id, author_user_id, text ≤ 1,200, created_at). Separate from <code>update_asks</code> (option A).'],
        ['Reads', 'Investor: my questions on report <code>:uid</code> with replies. Founder: every question with asker names. <code>GET /desk</code> gains question rows after the period and request rows.'],
        ['Writes', 'Ask (figure key or whole report + text) by a recipient; reply by a founder; withdraw by the asker before an answer; mark read on a founder’s first open. Support sessions refused.'],
        ['Events, notifications', 'New <code>reporting_events</code> values (a migration to widen the CHECK); one notification type each way.'],
        ['Privacy check', '<code>lintForSend</code> over question and reply text; the error names the kind of finding.'],
        ['Deep links', 'Open <code>/portfolio/companies/:uid/reports</code> with the reader at a report and its thread; an anchor on <code>/grow/reporting/:id</code> for a question.']])
      + '<h2>Pending the owner (⚑)</h2><p>Drawn with the brief’s picks: reports carry questions (A); private to the asker and the founders (A); a new store (A); on a correction a question stays on its revision and the new one links to it (C); admins, advisors and partners read threads read-only (A).</p>'
      + '<h2>Frontend only</h2><p>The per-figure link and inline composer in the 640 reader, the Your questions block, the founder Questions cards and figure chips that jump to them, the phone sheets with pinned actions, the state pills, the withdraw dialog and the dark tokens.</p>'
      + '<h2>Open questions</h2><p>Can an investor ask about a left-out figure? Drawn: only through “Ask about the whole report”. Should a figure chip count withdrawn questions? Drawn: yes. One primary per screen: on the founder page Send reply is primary and each card’s Reply is secondary, where the brief calls Reply primary.</p>'
      + '<h2>Accessibility</h2><p>Each figure link is a 44px target and names its figure in its accessible name. Pills carry a glyph and a word (◷ ● ✓ –); Unread is violet with ●, never red. The composer counter is announced politely; send failures are alerts. The withdraw dialog traps focus and returns it to the question.</p>');

    /* ---------- route ---------- */
    let html;
    if (B === 'GRQ22') html = b22();
    else if (B === 'GRQ22a') html = b22a();
    else if (B === 'GRQ22w') html = withdrawDlg();
    else if (B === 'GRQ22b') html = b22b();
    else if (B === 'GRQ23') html = b23();
    else if (B === 'GRQ23a') html = b23a();
    else if (B === 'GRQ23b') html = b23b();
    else if (B === 'GRQ24') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'GRQ26') html = b22a();
    else if (B === 'GRQ26b') html = b23();
    else if (B === 'GRQ27') html = handoff();
    else html = b22();
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
