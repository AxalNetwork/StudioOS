  <style>
body{margin:0}

        <div class="cd"><span class="tag">Status</span><div class="acts">${STP.draft}${STP.published}${STP.archived}</div><p class="foot">Glyph + word. Draft is amber, never red.</p></div>
        <div class="cd"><span class="tag">Who can open it now</span><div class="acts">${REACH.draft}${REACH.open}${REACH.program}${REACH.archived}</div><p class="foot">Derived from status + visibility; dashed outline only for draft.</p></div>
        <div class="cd"><span class="tag">Type label</span><div class="acts">${J(['Course', 'Video', 'Reading', 'Exercise', 'Exam'].map((t) => `<span class="ty">${t}</span>`))}</div><p class="foot">Text, not icons alone; the Video column carries ${'<span class="pl g">✓ Stream · Ready</span>'} <span class="pl">Link</span> <span class="pl">Uploaded file</span>.</p></div></div>
      <div class="cd"><span class="tag">Journey tile · coverage states (main’s four, plus a failed read)</span><div class="jr" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        <div class="jt ok"><span class="pl g">✓ Published</span><b>Founders</b><small>At least one published course open to members names this journey.</small></div>
        <div class="jt w"><span class="pl a">▽ Not reachable</span><b>Founders</b><small>Courses name it, but each is a draft, archived, or for program members only.</small></div>
        <div class="jt"><span class="pl v">◔ Unknown</span><b>Advisors</b><small>No course names it, but some record no audience and may serve it.</small></div>
        <div class="jt m"><span class="pl r">✕ Missing</span><b>Investors</b><small>Every course records its audience, and none names it.</small></div>
        <div class="jt"><span class="s ur">? Unavailable</span><b>All journeys</b><small>Coverage could not be read. Not a claim of missing material.</small></div></div></div>
      <div class="g3">
        <div class="cd"><span class="tag">Filter control</span>${'<div class="flt"><span>Status</span><button type="button" class="dd">Any status ▾</button></div><div class="flt"><span>Status</span><button type="button" class="dd on">Draft ▾</button></div>'}<span class="chip">Status: Draft<button type="button" aria-label="Remove filter Status: Draft">×</button></span></div>
        <div class="cd"><span class="tag">Preview bar</span><div class="pvb" style="border-radius:8px"><b>◉ Preview</b><span>Draft · not visible to members. Previewing changes nothing.</span></div><div class="pvb" style="border-radius:8px"><b>◉ Preview</b><span>Published · what a founder sees now.</span></div></div>
        <div class="cd"><span class="tag">Save status</span><span class="ss a">● Unsaved · 2 fields</span><span class="ss">◌ Saving…</span><span class="ss g">✓ Saved ${mo('16:40 UTC')}</span><span class="ss r">✕ Not saved · see the message</span></div></div>
      <div class="g2"><div class="cd"><span class="tag">Syllabus row</span>${'<div class="syl"><ol>'}${J([SYL[0], SYL[3], SYL[4], SYL[6]].map((s) => `<li><span class="n">${s.n}</span><div><span class="kd">${s.k}</span> ${s.req ? '' : '<span class="opt">Optional</span>'}<div>${s.t}</div>${s.tgt === 'draft' ? '<small class="w2">◌ Not open to members yet: draft.</small>' : s.tgt === 'program' ? '<small class="w2">◌ For program members only.</small>' : ''}</div><span class="foot">${s.req ? 'Required' : ''}</span></li>`))}</ol></div></div>
        <div class="cd"><span class="tag">Course card · inventory on phone</span><div class="pc2"><div class="r1"><span class="ty">Course</span>${STP.draft}</div><b>${PC}</b><small>For Founders · Intro · 85 min · Open · updated ${mo('2026-11-24')}</small><div>${REACH.draft}</div></div></div></div>`);

    else if (B === 'LST12') html = crop(1300, `<span class="lbl">Focus order, accessible names and wrapping</span>
      <div class="g2">
        <div class="cd"><span class="tag">Focus order · inventory (LST02)</span><ol class="rs" style="gap:5px">
          <span>${FO(1)} Skip link → main · ${FO(2)} ‹ Learning · ${FO(3)} Create (menu button)</span>
          <span>${FO(4)} Studio tabs: Content, Webinars, Coverage, Regional programs (one tab stop, arrows move)</span>
          <span>${FO(5)} Founders tile “Show the 4 drafts” (the only interactive journey tile)</span>
          <span>${FO(6)} Search · ${FO(7)} Type · ${FO(8)} Status · ${FO(9)} Visibility · ${FO(10)} Clear filters</span>
          <span>${FO(11)} Table: each title link in row order · ${FO(12)} Pager</span></ol>
          <span class="tag" style="margin-top:6px">Focus order · course workspace (LST04)</span><ol class="rs" style="gap:5px">
          <span>${FO(1)} ‹ All content · ${FO(2)} Review and publish · ${FO(3)} Workspace tabs</span>
          <span>${FO(4)} Checklist actions in row order (Open lesson 7, Review, Coverage, Add)</span>
          <span>${FO(5)} Previewing as · ${FO(6)} preview content (links inert, Start disabled with its reason)</span></ol>
          <p class="foot">Opening the publish dialog moves focus to its heading; Escape and Cancel return it to Review and publish. Applying a filter keeps focus on the control and announces the count (“4 of 46”) in a polite live region.</p></div>
        <div class="cd"><span class="tag">Accessible names</span><table class="tbl"><thead><tr><th>Control</th><th>Name</th></tr></thead><tbody>
          <tr><td>Create</td><td>“Create”, <code>aria-haspopup="menu"</code>, expanded state</td></tr>
          <tr><td>Filters</td><td>“Type: All types”, “Status: Draft”, “Visibility: Any visibility”</td></tr>
          <tr><td>Chip remove</td><td>“Remove filter Status: Draft”</td></tr>
          <tr><td>Founders tile</td><td>“Founders: Not reachable. 4 courses name founders; each is a draft. Show them.”</td></tr>
          <tr><td>Reach chip</td><td>Text is the name: “Super Admins only”; the glyph is decorative</td></tr>
          <tr><td>Checklist row</td><td>Title + state word read first (“Blocks publishing.”)</td></tr>
          <tr><td>Publish course (unavailable)</td><td><code>aria-disabled</code> + <code>aria-describedby</code> naming the 2 blocking checks</td></tr>
          <tr><td>Preview region</td><td>“Preview of the member page”, bar in <code>role="status"</code></td></tr>
          <tr><td>Move buttons</td><td>“Move lesson 7 up”, “Move module 2 down”</td></tr></tbody></table></div></div>
      <div class="g3">
        <div class="cd"><span class="tag">Long title · desktop row</span><div class="wrapdemo"><b style="font-size:13px">[A very long course title that keeps going: what founders should measure before, during and after a seed raise]</b><small class="foot">Wraps to two lines in the Title column; Type, Status and Updated keep their width. Never truncated with an ellipsis.</small></div></div>
        <div class="cd"><span class="tag">Long title · 390 card</span><div class="pc2" style="width:300px"><div class="r1"><span class="ty">Course</span>${STP.draft}</div><b>[A very long course title that keeps going: what founders should measure before, during and after a seed raise]</b><div>${REACH.draft}</div></div></div>
        <div class="cd"><span class="tag">200% text</span><div class="zoom" style="line-height:1.25"><b>${PC}</b></div><p class="foot">The workspace stacks (checklist above preview) below 1100px wide; the table becomes cards below 760px; Create and Review and publish stay on screen.</p></div></div>`);

    else if (B === 'LST13') html = doc(`<div><span class="eye">Engineering handoff · #8669 · checked on main 7b0db10927</span><h2 style="font-size:20px;margin-top:4px">Learning studio: inventory, authoring and member preview</h2><p class="sub" style="margin-top:4px">Route <code>/learning/studio</code> (Super Admin, <code>guard(['admin'], hqOnly(…))</code>; every call <code>requireSuperAdmin</code>). No AI rail on Learning pages (D4478). Release work is #8288; sibling canvases #8662 to #8670 share one catalogue (<code>LEARN_CATALOGUE.md</code>).</p></div>
      <div><h3>Design acceptance → boards</h3><table class="tbl"><thead><tr><th>Acceptance item</th><th>Answered on</th></tr></thead><tbody>
        <tr><td>An editor can locate a draft founder course and see why it is unreachable, retaining real status and program visibility.</td><td>LST02 (journeys strip, separate Status / Visibility / Who can open it now), LST03 (Founders → 4 drafts, reason per row), LST04 checklist, LST10A–C phone</td></tr>
        <tr><td>Covers create, edit, empty inventory and filtered zero results, with explicit save, preview and publication actions.</td><td>Create: LST02B, LST08, LST08B, LST10G · Edit: LST04B, LST04C, LST09B · Empty and filtered zero: LST09, LST10H · Save / Preview / Review and publish: LST04, LST04B, LST06, LST07</td></tr>
        <tr><td>Preview exposes what an eligible member will see; publishing controls reflect permissions and the #8288 release gates.</td><td>LST06, LST06B, LST10E (preview) · LST07, LST07B, LST10F (gates) · LST07C (permissions, reach changes) · LST05 (gate sources)</td></tr></tbody></table></div>
      <div class="cols">
        <div><h3>What main has (drawn as working)</h3><ul>
          <li><code>LearningStudio.jsx</code>: content table, webinar list and coverage on one page; editor chosen by the address (<code>?course=</code>, <code>?new=course</code>…). Six “New …” links today (LST01).</li>
          <li><code>StudioContentTable.jsx</code>: one chip row <code>STUDIO_FILTERS</code> (All kinds, Published, Draft, Archived, Program-only); Programs column reads Not recorded (<code>programs: null</code>).</li>
          <li><code>StudioCourseBuilder.jsx</code>: title, slug, summary, cover link (+ draw after save), minutes, level, visibility, resources, audience, stage, practical output, outcomes, prerequisites, author, reviewer, review date; modules and lessons with move, rename, delete.</li>
          <li><code>studioParts.jsx</code> <code>StatusActions</code>: Publish posts at once; Archive asks twice.</li>
          <li><code>admin_learning.ts</code>: publish refuses <code>no_lessons</code>; <code>slug_taken</code>; <code>GET /coverage</code> with <code>coverage_unreadable</code>.</li>
          <li><code>learningCoverage.ts</code>: Published / Not reachable (draft, archived, program-only) / Unknown / Missing.</li>
          <li><code>learningAccess.ts</code> <code>canSeeLearning</code>: Super Admin sees everything; members see published open, or program content when enrolled. Audience never restricts access.</li></ul>
          <h3 style="margin-top:12px">Frontend only</h3><ul>
          <li>One Create menu; Webinars, Coverage and Regional programs as studio tabs; the second “New webinar” removed.</li>
          <li>Type, Status and Visibility as three filters with counts, search, chips, address state and paging of the lists already read.</li>
          <li>“Who can open it now” derived from status + visibility; the journeys strip from <code>GET /coverage</code>.</li>
          <li>Course workspace: checklist from the course tree and the item, exercise and exam lists; live card preview from the form; Review and publish dialog before the existing publish call; confirmation before saving a visibility change on a published course.</li>
          <li>Preview drawn with the member page components from the authoring read, under the Preview bar, with Start inert.</li>
          <li>States: loading, partial and full Unavailable, empty, filtered zero, offline, refusals in the route’s words.</li></ul></div>
        <div><h3>Needs data or backend ${TB('…')}</h3><ul>
          <li>${TB('#8288')} Publish refuses a course whose required lessons open unpublished content (release work 2, dependency readiness).</li>
          <li>${TB('#8288')} The reviewed revision is the one that publishes; unsaved-edit guards on the editors (release work 2).</li>
          <li>${TB('#8288')} Published structure and used assessments keep their meaning (release work 3); the syllabus editor then explains frozen lessons.</li>
          <li>${TB('proposed')} A preview projection: the member read for a chosen learner (role, enrolment), so a Super Admin sees exactly what that member’s read returns. Today the member read shows a Super Admin everything, and “View as” does not change it.</li>
          <li>${TB('proposed')} Programs that hold an item or course in the content list (today Not recorded).</li></ul>
          <h3 style="margin-top:12px">Owner decisions ${TO('…')}</h3><ul>
          <li>${TO('Q1')} Must a course record a reviewer and review date before it publishes? <b>A (drawn):</b> yes, it blocks. B: a warning only.</li>
          <li>${TO('Q2')} Should Unpublish ask first? <b>A (drawn):</b> yes, one confirmation naming who loses access. B: as today, immediate.</li></ul>
          <h3 style="margin-top:12px">Coordination</h3><ul>
          <li>#8288 owns the gates; this canvas draws where they appear (checklist, publish dialog) and keeps them tagged until they ship.</li>
          <li>#8663 course cards and #8664 course overview supply the member components the preview reuses; #8667 draws the exam’s own author preview.</li>
          <li>Catalogue: Evidence-based pitch narratives (2 modules, 10 lessons, 7 required), exam “What can you substantiate?”, exercise “Pitch decision memo”.</li></ul>
          <h3 style="margin-top:12px">Accessibility</h3><ul><li>Focus order and names: LST12. Status, reach and checks pair a glyph with a word. The unavailable Publish keeps a visible reason. Phone targets 44px; tables become cards below 760px.</li></ul></div></div>`);

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lst-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
