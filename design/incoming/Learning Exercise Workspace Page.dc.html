        ['Sheet', 'modal, named by its title', 'focus trapped; Close returns focus to the button that opened it'],
        ['Sticky bar', 'Submit for review', '44px tall; never covers the counter'],
      ].map((r, i) => `<span class="num">${i + 1}</span><span>${r[0]}</span><span class="mu">${r[1]} · ${r[2]}</span>`))}</div>
      <h3 style="font-size:13px;margin-top:6px">Counter announcements</h3><p class="foot">Visible always; announced politely only at 200 left, 100 left, 0 left and when over (“43 characters over the limit”), not on every keystroke.</p></section></div>
      <section class="cd"><div class="ch"><h2>Wrapping long titles</h2>${SYN('long title')}</div><div class="g2"><div class="wrapdemo"><span class="eye">1440 · h1 wraps, actions stay right</span><div class="tw" style="margin-top:6px"><h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere">Pitch decision memo: which of your six claims can you substantiate before the partner meeting on Thursday?</h1><button type="button" class="btn">Add to my plan</button></div><p class="foot" style="margin-top:6px">Breadcrumb keeps the full course name and wraps; it is never cut with an ellipsis.</p></div>
      <div class="wrapdemo" style="max-width:390px"><span class="eye">390 · h1 over three lines, band below</span><h1 style="font-size:22px;font-weight:800;line-height:1.25;margin-top:6px;overflow-wrap:anywhere">Pitch decision memo: which of your six claims can you substantiate before the partner meeting on Thursday?</h1><p class="foot" style="margin-top:6px">Top bar shows “Exercise”, not the title. Criterion names wrap inside their h3; score badges stay fixed at 26px.</p></div></div></section>`);

    /* ===== LEW-12 · Handoff ===== */
    else if (B === 'LEW12') html = `<div class="${CV} doc"><div><span class="eye">Learning · Exercise workspace · #8666 · engineering handoff</span><h2 style="font-size:22px;margin-top:4px">What main has, what is frontend only, what needs data, and what the owner decides</h2></div>
      <div class="cols">
      <div><h3>Checked on main (7b0db10927)</h3><ul>
      <li><code>pages/learning/ExercisePanel.jsx</code>: instructions through <code>&lt;ReactMarkdown&gt;</code> with no plugins, so pipe tables are text. The Status card is <code>order-first</code> below lg, which put Status and “No review yet” above Instructions on phones. The answer comes after the instructions. The textarea has <code>maxLength</code> and <code>required</code>. Device drafts via <code>useLearningDraft</code> with <code>DRAFT_WORDS</code>.</li>
      <li><code>pages/learning/LearningAssessments.jsx</code>: <code>ExercisePage</code> puts <code>ExerciseSubmit</code> in the header (Submit / Submitting… / Resubmit), with <code>NotPublished</code> (“Draft · members cannot open it”) and <code>AddToPlan</code>.</li>
      <li><code>routes/learning_assessment.ts</code>: <code>GET /api/learning/exercises/:uid</code> returns the exercise with <code>answer_max_chars: 2000</code> for text and up to 50 submissions, newest first. <code>POST …/submissions</code>: 400 <code>bad_answer</code> (empty, over 2,000 code points), 409 <code>already_accepted</code>, 404 <code>not_found</code>. No reviewer name and no server draft.</li>
      <li><code>routes/admin_learning_assessment.ts</code>: <code>POST /submissions/:uid/review</code> sets <code>accepted</code> or <code>needs_work</code> with feedback (≤ 10,000).</li>
      <li><code>sql/migrations/390_learning_exercises_exams.sql</code>: no deliverable, time, rubric or score columns; submissions keep <code>reviewer_id</code>, <code>feedback</code>, <code>reviewed_at</code>.</li>
      <li><code>frontend/package.json</code>: <code>remark-gfm ^4.0.1</code> is a dependency; nothing in <code>frontend/src</code> imports it.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Deliverable band first; brief tabs beside a fixed answer column; phone jump list and sheets (LEW02, LEW03, LEW08).</li><li><code>remark-gfm</code> + <code>RubricTable</code> for exercises and readings (LEW04, LEW04B, LEW04C).</li><li>Counter without <code>maxLength</code>, overage shown; validation text; advisory heading check (LEW05).</li><li>State chips and words; one primary chosen by draft state; read-first after a timeout (LEW06, LEW05).</li><li>Remove <code>order-first</code> from Status; status moves into the band.</li></ul></div>
      <div><h3>Needs data or backend (◇)</h3><ul><li>Structured deliverable, suggested time and rubric (criteria, levels, total, minimums): proposed, #8288. Today they come from the author’s text.</li><li>Per-criterion reviewer scores (Option B, LEW07): proposed, #8288.</li><li>Reviewer’s name in the learner read: #8288.</li><li>Exercise draft held on the account across devices: proposed, #8288.</li><li>Idempotent submit key: proposed, #8288.</li></ul>
      <h3 style="margin-top:12px">Owner questions (⚑, option A drawn)</h3><ul><li><b>Q1</b> Per-criterion scores? A: written feedback and status only.</li><li><b>Q2</b> Submit a new version while one awaits review? A: yes (the route allows it), labelled “Submit a new version”.</li><li><b>Q3</b> Where drafts live? A: this device only, always worded so.</li><li><b>Copy</b> The rubric wording here is a sample: copy the production criteria verbatim from the exercise’s instructions.</li></ul>
      <h3 style="margin-top:12px">Acceptance → boards</h3><table><thead><tr><th>Item</th><th>Boards</th></tr></thead><tbody><tr><td>Five criteria × four scores at both sizes, 11/15 and R3 ≥ 2, no raw delimiters</td><td>LEW03, LEW04, LEW04B, LEW04C, LEW08C, LEW10M</td></tr><tr><td>Instructions, answer and rubric reachable directly; visible counter; validation explained</td><td>LEW02, LEW03, LEW05, LEW08A, LEW08B, LEW08D, LEW11</td></tr><tr><td>First attempt, draft, submitting, submitted, needs work, accepted, save failure distinct; only persisted actions claim saved or submitted</td><td>LEW06, LEW06B, LEW06C, LEW06D, LEW08E–LEW08H</td></tr></tbody></table>
      <h3 style="margin-top:12px">Coordination</h3><ul><li>#8288 release work; #8664 overview (same deliverable and 2,000 limit); #8665 reader (shared renderer); #8667 exam (status chip family); #8668 My Learning (exercise status words); #8669 Studio (rubric preview, Option B form).</li></ul>
      <h3 style="margin-top:12px">Accessibility</h3><ul><li>Every state pairs a glyph and a word; R3’s minimum is text, not colour. Targets 44px on phone. Dark tokens checked on LEW10 and LEW10M.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lew-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
