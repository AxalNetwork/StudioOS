.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}

.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}

.st-dd{display:flex;flex-direction:column;gap:8px}

.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}

.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}

        ['Portfolio v2', 'Unreadable', 'Unavailable (pick A)'],

        ['<code>&lt;PartialBanner&gt;</code>', '<code>missing</code> · <code>of</code> · <code>sources</code>[{ name, state }] · <code>withheld</code>[sentence] · <code>onRetry</code>', 'one banner above a block'],

        ['<code>stateFromRead(read, field)</code>', 'an <code>OperationalRead</code>, a field path, and the HTTP error if any', 'returns the state and reason, so no page decides it inline']

        ['<code>source_updated_at: null</code>', '“Source time not recorded” on the provenance line'],
        ['last-good time older than the store threshold', 'Stale with its age (needs #5247)']

      + '<pre class="st-code">&lt;DataState state="unavailable" what="Payments" claim="This is not a claim that none exist." onRetry={reload} /&gt;\n&lt;StateChip kind="stale" age="7 months" lastGood="2026-03-31" /&gt;\n&lt;PartialBanner missing={1} of={4} sources={[{ name: \'Health\', state: \'unavailable\' }]} onRetry={reload} /&gt;</pre>', 1200);

    /* ---------- handoff ---------- */
    const ST14 = () => crop(head('ST-14', 'Handoff', 'What is frontend only, what needs the Worker, and what this canvas supersedes.')

      ])
      + sec('Checked on main', '<p class="st-why"><code>cloudflare-worker/src/util/operationalRead.ts</code> (statuses ready · partial · unavailable; <code>read_at</code>, <code>source_updated_at</code>, <code>complete</code>, <code>completeness_reason</code>, <code>source</code>; no stale status). <code>frontend/src/ui/Honesty.jsx</code> (<code>Unrecorded</code> grey italic, reason on hover only; <code>Unreadable</code> red alert with Retry and a required <code>claim</code>). <code>frontend/src/lib/raiseErrors.js</code> (403 → forbidden, 404 → not_found). The v2 <code>.stt</code> chips in <code>Portfolio v2 Page.dc.html</code>.</p>')
      + sec('Sample data', '<p class="st-why">Funds, companies, figures and dates on these boards are sample data, used only to show the states.</p>'), 1200);

    const MAP = { ST00, ST01, ST02, ST03, ST04, ST05, ST06, ST07, ST07B, ST08, ST08B, ST09, ST10, ST11, ST12, ST13, ST14 };
    let html = '';
    if (B === 'ST00') html = ST00();
    else if (B === 'ST01') html = ST01();
    else if (B === 'ST02') html = ST02();
    else if (B === 'ST03') html = ST03();
    else if (B === 'ST04') html = ST04();
    else if (B === 'ST05') html = ST05();
    else if (B === 'ST06') html = ST06();
    else if (B === 'ST07') html = ST07();
    else if (B === 'ST07B') html = ST07B();
    else if (B === 'ST08') html = ST08();
    else if (B === 'ST08B') html = ST08B();
    else if (B === 'ST09') html = ST09();
    else if (B === 'ST10') html = ST10();
    else if (B === 'ST11') html = ST11();
    else if (B === 'ST12') html = ST12();
    else if (B === 'ST13') html = ST13();
    else if (B === 'ST14') html = ST14();
    else html = (MAP[B] || ST00)();
    return { html: { __html: html } };
