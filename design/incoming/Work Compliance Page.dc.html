    const TSHEET = (o) => { o = o || {}; return SHEET('Delaware franchise tax', P('Due · Mon 1 Mar 2027', 'mu') + P('Payment', 'mu'), `<p style="margin:0;font:500 13px/1.55 ${SG};color:var(--body)">The annual tax every Delaware corporation pays to stay in good standing. Legal basis: 8 Del. C. § 501–503.</p><div>${FLD('Jurisdiction', 'Delaware')}${FLD('Recurrence', 'Every year · Mar 1')}${FLD('Owner', WHO({ p: 'JR' }))}${FLD('Status', 'Due')}${FLD('Filing history', 'Paid 1 Mar 2026 · $[400] · proof attached by [Jordan Reyes]')}${FLD('Documents', `<span style="display:inline-flex;align-items:center;gap:6px">${I.doc}Franchise tax receipt 2026.pdf</span>`)}${FLD('Linked work', `Prepare Delaware franchise tax figures · ${P('In progress in Pilot app', 'prj', I.link)}`)}</div>${o.pick ? `<div role="dialog" aria-label="Create work in a project" style="border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(24,24,27,.12)">${EB('Create work in a project')}${[['Pilot app', '12 open', 1], ['Data platform', '4 open']].map(p => `<div role="radio" aria-checked="${!!p[2]}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid ${p[2] ? 'var(--lavE)' : 'var(--line)'};background:${p[2] ? 'var(--lav)' : 'var(--card)'}"><span style="font:700 13px ${SG};color:var(--ink)">${p[0]}</span><span style="margin-left:auto;font:600 11px ${M};color:var(--mut)">${p[1]}</span></div>`).join('')}<span style="font:500 12px/1.45 ${SG};color:var(--mut)">The item lands in that project’s Backlog, linked back here as “For: Delaware franchise tax”. The task stays with Acme Inc.</span><div style="display:flex;gap:6px;justify-content:flex-end">${bG('Cancel', SMB)}${bP('Create in Pilot app', SMB)}</div></div>` : ''}`, (o.ro ? `<span style="font:500 12.5px ${SG};color:var(--mut)">Only company admins change compliance tasks.</span>` : bP('Mark done…') + bS('Reschedule') + bS('Assign owner') + bS('Create work in a project…', o.pick ? 'border-color:var(--vio)' : '')), 560); };
    const CPAGE = () => `<div style="flex:1;min-height:0;padding:14px 28px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start"><div style="display:flex;flex-direction:column;gap:14px">${MINI('Legal information', `${FLD('Legal name', 'Acme Inc.')}${FLD('Entity', 'Delaware C-Corp')}${FLD('Incorporated', '12 Mar 2026')}`)}${MINI('Locations', FLD('Registered', '[Wilmington, DE]') + FLD('Office', '[Lisbon, PT]'))}</div><div style="display:flex;flex-direction:column;gap:14px">${MINI('Documents', `${['Certificate of incorporation.pdf', 'Bylaws.pdf', 'Franchise tax receipt 2026.pdf'].map(d => `<span style="display:flex;align-items:center;gap:7px;font:500 13px ${SG};color:var(--ink)">${I.doc}${d}</span>`).join('')}`)}${MINI('Projects', [['Pilot app', '12 open'], ['Data platform', '4 open']].map(p => `<div style="display:flex;font:600 13px ${SG};color:var(--ink)">${p[0]}<span style="margin-left:auto;font:600 11.5px ${M};color:var(--mut)">${p[1]}</span></div>`).join(''))}</div><section aria-label="Compliance" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font:800 15px ${SG};color:var(--ink)">Compliance</h2>${P('1 overdue', 'am')}</div>${TASKS.slice(0, 5).map(t => `<div style="display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)"><span style="font:700 11.5px ${M};color:${t[0] === 'ov' ? 'var(--ambT)' : 'var(--ink)'};text-align:center;padding:3px 0;border-radius:6px;background:${t[0] === 'ov' ? 'var(--ambF)' : 'var(--raised)'}">${t[7].charAt(0) + t[7].slice(1).toLowerCase()} ${t[8]}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font:700 13px ${SG};color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t[1]}</span><span style="font:500 11.5px ${SG};color:var(--mut)">${t[3]} · ${PPL[t[4]]}</span></span>${t[0] === 'ov' ? P('Overdue', 'am') : P('Due', 'mu')}</div>`).join('')}<div style="display:flex;gap:14px;padding-top:6px"><a href="#" style="font:600 12.5px ${SG}">See all compliance tasks ›</a><a href="#" style="font:600 12.5px ${SG}">Open in Calendar ›</a></div></section></div>`;
    const CCAL = () => `<div style="padding:28px;background:var(--bg)"><div role="grid" aria-label="Week of 1 March 2027" style="display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)"><span style="background:var(--raised);border-bottom:1px solid var(--line)"></span>${['MON 1', 'TUE 2', 'WED 3', 'THU 4', 'FRI 5'].map(d => `<span style="padding:8px 10px;background:var(--raised);border-bottom:1px solid var(--line);border-left:1px solid var(--line)">${EB(d)}</span>`).join('')}<span style="padding:8px;font:700 9.5px ${M};color:var(--mut);border-bottom:1px solid var(--line)">ALL DAY</span><div style="padding:6px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px">${['Delaware franchise tax', 'Delaware annual report'].map(t => `<span style="display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--mut);font:600 11.5px ${SG};color:var(--ink);white-space:nowrap;overflow:hidden"><span style="overflow:hidden;text-overflow:ellipsis">${t}</span><span style="margin-left:auto;font:700 10px ${M};padding:1px 5px;border-radius:4px;background:var(--raised);color:var(--body)">Acme Inc.</span></span>`).join('')}</div>${[0, 1, 2, 3].map(() => `<div style="border-left:1px solid var(--line);border-bottom:1px solid var(--line)"></div>`).join('')}<span style="padding:8px;font:600 10.5px ${M};color:var(--mut)">10:00</span><div style="padding:6px;border-left:1px solid var(--line)"><div style="padding:6px 8px;border-radius:6px;background:var(--prjT);border:1px solid var(--prjT);border-left:3px solid var(--prj);display:flex;flex-direction:column;gap:2px"><span style="font:700 12px ${SG};color:var(--ink)">Work for: Delaware franchise tax</span><span style="font:500 11px ${SG};color:var(--body)">Prepare figures · Pilot app · CFO agent session</span></div></div>${[0, 1, 2, 3].map(() => `<div style="border-left:1px solid var(--line);min-height:80px"></div>`).join('')}</div><p style="margin:10px 0 0;font:500 12.5px ${SG};color:var(--mut)">The Compliance layer shows the same tasks, each with its company badge. Linked project work shows in the project’s colour.</p></div>`;
    const CSTATES = () => `<div style="padding:28px;background:var(--bg);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start">${[MINI('Standalone project', `<div style="padding:8px;border-radius:10px;background:var(--raised)"><span style="padding:4px 10px">${EB('Project settings · Pilot app')}</span>${SBROW('Work', false, '12 open')}${SBROW('Team')}${SBROW('Project settings')}</div><span style="font:500 12px/1.45 ${SG};color:var(--mut)">No company, so no Legal and no Compliance anywhere for this project.</span>`), MINI('A company with no projects yet', `${bX('Create work in a project…', 'Add a project to this company first')}<span style="font:500 12px ${SG};color:var(--mut)">Add a project to this company first.</span>`), MINI('Read-only member', `${TROW(TASKS[3], { ro: 1 })}<span style="font:500 12px/1.45 ${SG};color:var(--mut)">No checkbox and no New compliance task. Only company admins change compliance tasks.</span>`), MINI('Could not be read', MSG('Compliance could not be read', 'That is not the same as having nothing due.', bS('Try again', SMB), 'n')), MINI('Company page · nothing recorded', `<div style="display:flex;align-items:center"><span style="font:800 14px ${SG};color:var(--ink)">Compliance</span></div><span style="font-style:italic;color:var(--mut);font-size:13px">Not recorded</span><span style="font:500 12px ${SG};color:var(--mut)">No compliance tasks are recorded for Acme Inc. yet.</span>`), MINI('Empty list', `${MSG('No compliance tasks yet', 'Common ones for a Delaware C-Corp:', bP('New compliance task', SMB))}${['Delaware franchise tax · every year · Mar 1', 'Delaware annual report · every year · Mar 1', 'Registered agent renewal · every year', '83(b) election · within 30 days of each founder grant'].map(x => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font:500 12.5px ${SG};color:var(--ink)"><span style="flex:1">${x}</span>${bS('Add', 'min-height:26px;padding:0 9px;font-size:11.5px')}</div>`).join('')}`)].join('')}</div>`;
    const CPH = () => `<div style="height:844px;display:flex;flex-direction:column;background:var(--bg)">${PTOP('Compliance · Acme Inc.')}<div style="padding:10px 16px;display:flex;flex-direction:column;gap:2px">${SEGC(['Due · 5', 'Overdue · 1', 'Done · 3', 'All · 9'], 'All · 9', 'Status')}<div style="margin-top:8px;padding:0 10px;border-radius:10px;background:var(--ambF);border:1px solid var(--ambE)">${EB('Overdue · 1', 'var(--ambT)')}${TROW(TASKS[0], { ph: 1 })}</div><span style="padding-top:10px">${EB('November 2026')}</span>${TROW(TASKS[1], { ph: 1 })}<span style="padding-top:10px">${EB('December 2026')}</span>${TROW(TASKS[2], { ph: 1 })}<span style="padding-top:10px">${EB('March 2027')}</span>${TROW(TASKS[3], { ph: 1 })}</div></div>`;
    const FR = {
      w0: () => ({ w: 1440, html: ENTRY() }),
      w1: () => ({ w: 1440, h: 1040, html: SHELL('project', 'work', WH('Board') + BOARD({ drop: 3, dragFrom: 2, dragX: 592, dragY: 114, moveAt: [1, 1] }), { h: 1040 }) }),
      w2: () => ({ w: 1440, h: 900, html: SHELL('project', 'work', WH('Backlog') + BACK(), { h: 900 }) }),
      w3: () => ({ w: 1440, h: 900, html: SHELL('project', 'work', WH('Burn-up') + BURN(), { h: 900 }) }),
      w3e: () => ({ w: 1440, h: 900, html: SHELL('project', 'work', WH('Burn-up') + BURN(true), { h: 900 }) }),
      w4: () => ({ w: 1440, h: 1040, html: SHELL('project', 'work', WH('Board') + BOARD({}), { h: 1040, side: ITEMSH() }) }),
      w5: () => ({ w: 1440, h: 860, html: `<div style="padding:28px;background:var(--bg);display:flex;gap:28px;justify-content:center;height:860px;box-sizing:border-box"><div style="display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden">${RUNSH(false)}</div><div style="display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden">${RUNSH(true)}</div></div>` }),
      w6: () => ({ w: 1440, h: 900, html: SHELL('project', 'team', PH({ eb: 'Acme › Pilot app · Team', t: 'Activity', p: 'What the project’s people and AI agents did, newest first.', act: ASK }) + FEED(), { h: 900 }) }),
      w7: () => ({ w: 1440, h: 860, html: SHELL('project', '', PH({ eb: 'Calendar · Pilot app', t: 'Workload', p: 'Who carries what, week by week.', act: bP('New ▾') + ASK }) + WORK(), { h: 860 }) }),
      w8: () => ({ w: 1440, html: STATES() }),
      w8a: () => ({ w: 1440, h: 900, html: SHELL('project', 'work', WH('Backlog') + BACK({ agOff: true }), { h: 900 }) }),
      w8p1: () => ({ w: 390, h: 844, html: PH1() }), w8p2: () => ({ w: 390, h: 844, html: PH2() }), w8p3: () => ({ w: 390, h: 844, html: PH3() }),
      w8t: () => ({ w: 768, h: 1024, html: SHELL('project', 'work', WH('Board', { filter: false, nv: false }) + BOARD({ ncol: 3, noStrip: true }), { h: 1024, sbi: true }) }),
      c1: () => ({ w: 1440, h: 820, html: SHELL('company', '', PH({ eb: 'Account › Portfolio', t: 'Acme Inc.', p: 'Delaware C-Corp · the company hosts its projects and carries the legal and compliance work.', act: bS('Company settings') }) + CPAGE(), { h: 820 }) }),
      c2: () => ({ w: 1440, h: 1120, html: SHELL('company', 'comp', CH() + LTABS + CLIST(), { h: 1120 }) }),
      c2m: () => ({ w: 1440, h: 900, html: SHELL('company', 'comp', CH() + LTABS + MONTH(), { h: 900 }) }),
      c3: () => ({ w: 1440, h: 1180, html: SHELL('company', 'comp', CH() + LTABS + CLIST(), { h: 1180, side: TSHEET({ pick: true }) }) }),
      c3r: () => ({ w: 1440, h: 1180, html: SHELL('company', 'comp', CH({ act: ASK }) + LTABS + CLIST({ ro: true }), { h: 1180, side: TSHEET({ ro: true }) }) }),
      c4: () => ({ w: 1440, html: CCAL() }),
      c5: () => ({ w: 1440, html: CSTATES() }),
      c5p: () => ({ w: 390, h: 844, html: CPH() })
    };
    const fr = (FR[v] || FR.w1)();
    return { rootSt: `${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font:500 13px/1.45 ${SG};-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };
  }
}
