.ifd-tag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;border:1px dashed #a78bfa;font:700 10px var(--mo);letter-spacing:.04em;text-transform:uppercase;color:var(--vt);background:var(--lav);white-space:nowrap;align-self:flex-start}

.ifd-ban.g{background:var(--posBg);border-color:var(--posE)}
.ifd-steps{display:flex;gap:0}

.ifd-flt{display:flex;gap:6px;flex-wrap:wrap}

      else if (B === 'IFD14D') html = ph('Calls', 'Calls', '<div class="ifd-res" style="font-size:12px">Call 2 · ' + D.c2 + ' · due 2 Dec 2026 · residual [$0.02] on ' + LPn('B') + '</div>' + J(C2.slice(2, 5).map(r => card(LPn(r[0]), r[4] === 'part' ? CS('part') : CS('open'), kv([['Owed', r[1]], ['Outstanding', r[3]]]) + '<div style="display:flex;gap:8px"><button type="button" class="btn p" style="flex:1">Record receipt</button><button type="button" class="btn">More…</button></div>'))));
      else if (B === 'IFD14E') html = ph('Calls', 'Distributions', '<span class="ifd-sk" style="height:200px"></span>', psheet('New distribution · Review', pst(1) + kv([['Proceeds', '[$1,200,000.00]'], ['Basis returned', '[$800,000.00]'], ['Profit', '[$400,000.00]'], ['Carry withheld', '[$80,000.00]'], ['Rate', '20% · default', 1], ['To LPs', '[$1,119,999.98]'], ['Unallocated', '[$0.02]']]) + J([['B', '[$373,333.33]'], ['D', '[$280,000.00]'], ['A', '[$233,333.33]']].map(x => '<div class="ifd-r" style="display:flex;justify-content:space-between;font-size:12.5px"><span>' + LPn(x[0]) + '</span><b class="mo">' + x[1] + '</b></div>')) + '<span class="raw">+ 3 more lines</span>', '<button type="button" class="btn p ifd-full">Confirm distribution</button>'));
      else if (B === 'IFD14F') html = ph('Ledger', 'Ledger', '<div class="ifd-flt"><button type="button" aria-pressed="true" style="min-height:44px">Q4 2026 · open</button><button type="button" style="min-height:44px">Q3 2026</button></div>' + card('Summary', S('ok', 'Balanced'), kv([['Fee accrued', D.fee], ['Expenses', D.exp], ['Debits = credits', '[$6,067,866.68]']])) + J([['JE-0415 · 12 Nov', 'Cash · LP receivable', '[$875,000.00]'], ['JE-0414 · 11 Nov', 'Cash · LP receivable', '[$400,000.00]'], ['JE-0413 · 10 Nov', 'Cash · LP receivable', '[$1,166,666.68]']].map(j => card(j[0], '<span class="raw">receipt</span>', kv([['Accounts', j[1], 1], ['Dr = Cr', j[2]]])))));
      else if (B === 'IFD14G') html = ph('Reporting', 'Reporting', J([['Q4 2026', CS('draft'), [['Dates', '1 Oct – 31 Dec 2026'], ['Saved', '13 Nov 2026']]], ['Q3 2026', CS('iss'), [['Issued', '20 Oct 2026'], ['Delivered', NR('not tracked'), 1]]], ['Q2 2026 · correction', CS('iss'), [['Issued', '5 Aug 2026'], ['Corrects', 'Q2 2026', 1]]]].map(p => card(p[0], p[1], kv(p[2]) + '<button type="button" class="btn ifd-full">Open</button>'))) + '<button type="button" class="btn p ifd-full">New period</button>');
      else if (B === 'IFD14H') html = ph('Reporting', 'Q4 2026 report', '<div class="ifd-f"><label>Label</label><div class="ifd-in" style="min-height:44px">Q4 2026</div></div><section class="ifd-sec"><h3>Letter</h3><div class="ifd-txt">Dear partners, the fund issued its second call on 2 Nov 2026…</div></section><section class="ifd-sec"><h3>Key developments<button type="button" class="btn">Add</button></h3><span style="font-size:12.5px"><b class="mo">2 Nov</b> · Call 2 issued</span></section><section class="ifd-sec"><h3>Outlook</h3>' + NR() + '</section>', '<div class="ifd-sticky"><button type="button" class="btn" style="flex:1">Save draft</button><button type="button" class="btn p" style="flex:1">Issue…</button></div>');
    }

    /* =================== FV-H · Handoff =================== */
    else if (B === 'IFD16') {
      html = doc('<span class="eye">FV-H · Handoff and backend fit · #6229 · checked on main 6d7712c6d1 (brief written on 45e7c55fa6)</span><h2>Investor Fund v2 · each board, its Worker route, and what is new</h2><div class="ifd-cols">'
        + '<div><h3>Boards → Worker routes (all on main)</h3><ul><li>FV1 <code>GET /api/funds</code>, <code>/api/funds/:id/analytics</code> (fundRollup.ts), <code>/api/fund-performance/:id</code> and <code>/history?step=quarter</code>; FV1b <code>POST /api/funds</code>.</li><li>FV2 the 402 from <code>requireFundGp</code>; <code>LockedFund</code> in InvestorFundLanding.jsx today offers no next step.</li><li>FV3–FV4 <code>GET/POST /api/funds/:id/lps</code>, <code>PUT …/lps/:lpId/type</code>, <code>GET/POST …/comms</code>, <code>GET …/lp-report/:lpId</code>.</li><li>FV5–FV7 <code>GET …/capital-calls</code>, <code>POST …/capital-calls/preview</code>, <code>POST …/capital-call</code> (409 <code>no_billable_lps</code>, Fund I hold D708), <code>POST …/lines/:lineId/receipts</code>, <code>GET …/ledger</code>; reminder via <code>ZoneDraft surface="funds/calls"</code>.</li><li>FV8 <code>GET /api/funds/distributions</code>, <code>POST …/distributions/preview</code>, <code>/distributions/execute</code>, <code>/distributions/:id/mark-paid</code>.</li><li>FV9 <code>GET /api/fund-ledger</code>, <code>/:id?period_id=</code>, <code>GET /api/fund-fees/:fundId</code>.</li><li>FV10–FV11 <code>GET /api/lp-reports</code>, <code>…/report-periods</code>; Mercury <code>/api/mercury/investor/proposals</code> and <code>/reporting</code>.</li></ul></div>'
        + '<div><h3>Backend required (◇)</h3><ul><li>Edit an LP’s name, email or commitment: only the type has a write.</li><li>The GP reading call notices Axal HQ issued on their fund (<code>legal_notices</code> is admin-issued and LP-read).</li><li>Per-LP delivery of a period or pack: none is recorded; issued is never delivered.</li><li>Eadwyn drafting the period letter.</li><li>Fund-level NAV: positions attributed to the fund (<code>PUT /api/fund-performance/positions/:id/fund</code>) with dated marks.</li><li>(b) A: <code>fund_ledger.ts</code> grants full read on <code>fund_admin_user_id</code>, not <code>gp_user_id</code>; a read-only GP scope is a Worker change.</li><li>Authenticate step for a non-admin GP: <code>fundAdminAccess.ts</code> gates support sessions and steps up Super Admin acts only; a GP of record is not stepped up on calls, receipts or distributions today.</li></ul><h3 style="margin-top:12px">Owner picks drawn (⚑)</h3><ul><li>(a) A · the GP previews, executes and marks paid · (b) A · read-only journal · (c) A · Talk to Axal · (d) A · four zone cards stay.</li><li>D5129 Q2: Unavailable is the failed-read word.</li></ul></div>'
        + '<div><h3>Frontend only</h3><ul><li>Zone row with counts; <code>?fund=</code> travels across zones; the picker shows only for 2+ funds.</li><li>Overview: tiles with their counting rule and as-of; NAV row with reasons; chart gap rules; the gap list; zone cards.</li><li>Locked surface with the zone as a variable; No fund to operate with My commitment.</li><li>Steppers on every money sheet (Prepare → Review → Confirm → Authenticate → Receipt); a changed amount drops the preview.</li><li>Phone cards and full-height sheets; dark tokens.</li></ul><h3 style="margin-top:12px">Handoffs</h3><ul><li>LP row → LP record · outstanding line → Record receipt or Draft reminder · issued period → LP statement preview · LP-only investor → My commitment (Axal VC Fund).</li></ul></div>'
        + '<div><h3>Accessibility</h3><ul><li>Every state pairs a word and a glyph; colour never carries meaning alone. The chart has a legend in words, a table view, and an aria-label; a 0 is a labelled baseline tick, a gap is named, a failed quarter is an outlined, labelled slot.</li><li>44px rows, phone targets and sheet buttons; tables never wider than the phone (cards instead).</li><li>Sheets and dialogs are dialogs with focus on the heading and Escape to close; the stepper exposes aria-current="step".</li><li>Reasons are visible text, never a hover.</li></ul><h3 style="margin-top:12px">Open</h3><ul><li>The brief names sections FV1 onward; board keys here carry the IFD prefix (IFD01 = FV1).</li><li>The ◇ items have no build issue yet; they are tagged #6229.</li></ul></div>'
        + '</div>');
    }
    else {
      html = crop('<b>Unknown board</b>', 400);
    }

    return { html: { __html: html } };
  }
}
