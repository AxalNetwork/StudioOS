    FR.ri3 = () => ({ w: 1440, h: 960, html: RSH(RHD({ crumb: 'Raise › Capital relationships', t: 'Bluefern Capital', p: 'Investor in your seed pipeline.', r: bP('Log a step') + ASK() }) + BODY(`${RECHEAD()}${STRIP()}`), { lit: 'Raise', h: 960, side: ASKSHEET(false) }) });
