    /* ---------- GR-45 · Refusals (the typed name kept in every case) ---------- */
    const rbox = (t, inner) => '<section class="cd gtm-rb"><div class="ch"><h2 style="font-size:13px">' + t + '</h2></div>' + inner + '</section>';
    const gr45 = () => crop('<span class="eye">Refusals · the field keeps what was typed · the message sits under it and names the fix · words and a glyph, never colour alone</span><div class="gtm-rg">'
      + rbox('Empty · 400 on to', editForm('[Exprot]', '', { err: 1, list: false, note: false, msg: msg('rf', 'A theme needs a name.') }))
      + rbox('Same name · 400 on to', editForm('[Exprot]', '[Exprot]', { err: 1, list: false, note: false, msg: msg('rf', 'The new name is the same as the old one.') }))
      + rbox('Case only · before Save · not a refusal', editForm('[Exprot]', '[export]', { list: false, note: false, msg: msg('nfo', '“[Export]” exists with other capitals. Saving makes a separate theme; to combine them, choose “[Export]” from the list.') }) + mergeList('[Exprot]', '[Export]') + '<p class="raw">Save stays allowed: it renames to “[export]”. Matching is exact, case included (owner, 14 Nov 2026).</p>')
      + rbox('Not found · 404 on from · renamed meanwhile', editForm('[Exprot]', '[Export files]', { err: 1, list: false, note: false, msg: msg('rf', 'No feedback has that theme any more.', '<button type="button" class="btn bsm">Reload themes</button>') }))
      + rbox('Refused · 403 · read-only now', editForm('[Exprot]', '[Export files]', { err: 1, list: false, note: false, msg: msg('rf', 'You can read this venture but not change it. The venture’s founder can give you edit access in Team.') }))
      + rbox('Near the limit · counter from 70 characters', editForm('[Exprot]', '[Export the harvest log, spray schedule and yield per block as CSV files]', { list: false, note: false, count: 74 }) + '<p class="raw">The field stops at 80, as the Worker trims to 80.</p>')
      + '</div>', 1400);

    /* ---------- GR-46 · No themes yet ---------- */
    const UN = [
      { q: 'The block map loads slowly on the tractor tablet.', who: '[Lena Aas]', co: '[Fjord Cider]', s: 'Open', rm: '', org: 'Typed', d: '24 Nov' },
      { q: 'Could the frost alert also go to my foreman?', who: '[Ines Duarte]', co: '[Quinta Alta]', s: 'Open', rm: '', org: 'Interview', d: '20 Nov' },
      { q: 'Export the harvest log for our bank.', who: '[Jo Park]', co: '', s: 'Open', rm: '', org: 'Typed', d: '18 Nov' }
    ];
    const gr46 = () => page(custHead({}) + tabs('3')
      + counts({ open: '3', openSub: 'of 3 items · 0 planned · 0 shipped', themes: '0', themesSub: 'measured · 3 items have no theme', told: '0', toldSub: 'nothing shipped yet' })
      + '<p class="raw" style="margin:-6px 0 0">Themes: 0, measured · 3 items have no theme</p>'
      + '<div class="grf-two"><nav class="cd grf-tc" aria-labelledby="thh"><div class="ch"><h2 id="thh">Themes</h2></div><p class="grf-none">' + st('Zero', 'No themes yet') + '</p><p style="font-size:12.5px;color:var(--mu)">Name a theme on an item with Change theme. Rename appears on a theme’s heading once it has one.</p><ol class="grf-th"><li class="grf-more gtm-nt on"><span>No theme yet · 3 items</span></li></ol></nav>'
      + '<section class="cd grf-fl" aria-labelledby="fbh"><div class="ch gtm-hd"><div class="gtm-hn"><h2 id="fbh">No theme yet · 3 items</h2><span class="gtm-hc">' + st('Not recorded', 'No theme') + ' not a theme, so no Rename</span></div></div><ul class="grf-fb">' + J(UN.map(f => fbRow(f))) + '</ul><div class="qft"><span>Open an item and use Change theme to give it one</span><button type="button" class="btn bsm">Change theme</button></div></section></div>'
      + '<div class="gtm-after"><span class="eye">After the first theme is saved</span><div class="gtm-mini2"><ol class="grf-th"><li class="on"><div class="nm"><a href="#" aria-current="true">[Exports]</a><span>1</span></div><div class="grf-split">1 open · 0 planned · 0 shipped</div></li><li class="grf-more gtm-nt"><span>No theme yet · 2 items</span><a href="#">Show</a></li></ol><div class="gtm-hn" style="padding:10px 14px"><b>[Exports]</b><span class="gtm-hc">1 feedback row · 0 roadmap items <i class="gtm-ms">measured</i></span><button type="button" class="btn bsm gtm-rn">Rename</button></div></div></div>', { h: 860, rail: 'first' });

    /* ---------- GR-47 · States ---------- */
    const skl = (w, h) => '<span class="sk" style="height:' + (h || 12) + 'px;width:' + w + '"></span>';
    const gr47 = () => crop('<span class="eye">States of the control · Platform States words and shapes (D5129) · zero, Not recorded and Unreadable never look alike</span><div class="gtm-sg">'
      + box('Loading', '<div aria-busy="true" class="gtm-hd" style="display:flex;gap:10px;align-items:center">' + skl('160px', 16) + skl('120px', 12) + '</div><p class="raw">GR-28’s skeleton. Rename is not drawn until the theme counts arrive. Announced: “Loading feedback”.</p>')
      + box('Not recorded · items with no theme', '<ol class="grf-th" style="border:1px solid var(--hair);border-radius:10px"><li class="grf-more gtm-nt"><span>No theme yet · 2 items</span><a href="#">Show</a></li></ol><p class="raw">' + st('Not recorded', 'No theme') + ' never offered for rename, never counted as a theme.</p>')
      + box('Unreadable · theme counts', '<div class="gtm-hn"><b>[Exprot]</b><span class="gtm-hc">6 items · counted from the list</span></div>' + msg('un', st('Unreadable') + ' Rename is unavailable: theme counts could not be read.', '<button type="button" class="btn bsm">Try again</button>') + '<p class="raw">Items, weight and Close the loop still work. Nothing is shown as 0.</p>')
      + box('Refused · advisor or reader', '<div class="gtm-hn"><b>[Exprot] · 6 items</b></div><p class="raw">GR-28’s advisor read: no Rename, no field, no list. Nothing is drawn; not a disabled button. parts.themes is absent for them.</p>')
      + box('Saving', editForm('[Exprot]', '[CSV export]', { dis: 1, list: false, note: false }) + '<p class="raw">Field and buttons disabled; Save reads Saving… ' + st('Saving', 'Saving') + '</p>')
      + box('Save failed · network', editForm('[Exprot]', '[CSV export]', { err: 1, list: false, note: false, msg: msg('fl', 'This could not be saved. Try again.', '<button type="button" class="btn bsm">Try again</button>') }) + '<p class="raw">The typed name is kept. Nothing moved.</p>')
      + '</div>', 1400);
    const gr47b = () => page(tab({ noRename: 1, noRenameNote: '<div class="gtm-una" role="status">' + st('Unreadable') + '<span>Rename is unavailable: theme counts could not be read.</span><button type="button" class="btn bsm">Try again</button></div>',
      head: '<div class="ch gtm-hd"><div class="gtm-hn"><h2 id="fbh">[Exprot] · 6 items</h2><span class="gtm-hc">counted from the list · roadmap items not shown</span></div><div class="gtm-una" role="status">' + st('Unreadable') + '<span>Rename is unavailable: theme counts could not be read.</span><button type="button" class="btn bsm">Try again</button></div></div>' }), { h: 1000, rail: 'before' });

    /* ---------- GR-48 · Phone 390 ---------- */
    const phone = (title, body, sheetH) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheetH || '') + '</div></div>';
    const pcard = (f) => '<div class="mc grf-pc"><p class="grf-q">“' + f.q + '”</p><b style="font-size:12.5px">' + f.who + (f.co ? ' · ' + f.co : '') + '</b><div class="r1">' + st(f.s) + '<span class="grf-rm">' + (f.rm || 'No roadmap item') + '</span></div></div>';
    const pTab = () => '<div class="seg" role="tablist" aria-label="Customers" style="min-height:44px"><button type="button" role="tab" aria-selected="false">Pipeline</button><button type="button" role="tab" aria-selected="false">Accounts</button><button type="button" role="tab" aria-selected="true" aria-checked="true">Feedback</button></div>'
      + '<div class="grf-chips" role="tablist" aria-label="Themes">' + J([['[Export]', 9], ['[Exprot]', 6], ['[Onboarding]', 4]].map((t) => '<button type="button" role="tab" aria-selected="' + (t[0] === '[Exprot]') + '">' + t[0] + ' <span class="mo">' + t[1] + '</span></button>')) + '</div>'
      + '<div class="gtm-ph"><div><b>[Exprot]</b><span>6 feedback rows · 1 roadmap item</span></div><button type="button" class="btn gtm-p44">Rename</button></div>';
    const psheet = (h, inner) => '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + h + '"><div class="grab" aria-hidden="true"></div><div class="gtm-psb">' + inner + '</div></div>';
    const pField = (v, o) => { o = o || {}; return '<div class="fld"><label for="ptn">New name for [Exprot]</label><div class="gtm-inp p44' + (o.err ? ' err' : '') + '" id="ptn" role="textbox">' + v + '<span class="gtm-caret" aria-hidden="true"></span></div></div>' + (o.msg || ''); };
    const pList = (pick) => '<div class="gtm-ml p"><span class="eye">Or merge into an existing theme</span><ul role="listbox" aria-label="Merge into an existing theme">' + J(MERGE_TO('[Exprot]').map(t => '<li role="option" aria-selected="' + (t[0] === pick) + '" class="' + (t[0] === pick ? 'on' : '') + '"><b>' + t[0] + '</b><span class="mo">' + fbw(t[1]) + ' · ' + rmw(t[3]) + '</span></li>')) + '</ul></div>';
    const gr48a = () => phone('Customers', pTab() + J(ITEMS.slice(0, 3).map(pcard)) + '<button type="button" class="btn p" style="min-height:48px">Add feedback</button>');
    const gr48b = () => phone('Customers', pTab() + pcard(ITEMS[0]), psheet('rsh', '<h2 id="rsh" class="gtm-pst">Rename [Exprot]</h2><p class="raw">6 feedback rows · 1 roadmap item</p>' + pField('[Exprot]') + pList('') + '<p class="gtm-n1">Every feedback row and roadmap item with this theme changes. Other ventures are never touched.</p><button type="button" class="btn p gtm-p48">Save</button><button type="button" class="btn gtm-p48">Cancel</button>'));
    const gr48c = () => phone('Customers', pTab() + pcard(ITEMS[0]), psheet('msh', '<h2 id="msh" class="gtm-pst">Merge “[Exprot]” into “[Export]”?</h2><div class="gtm-ask p" role="alertdialog" aria-labelledby="msh"><p>This moves 6 feedback rows and 1 roadmap item to “[Export]”, and “[Exprot]” is gone.</p></div><button type="button" class="btn p gtm-p48">Merge</button><button type="button" class="btn gtm-p48">Cancel</button>'));
    const gr48d = () => phone('Customers', pTab() + pcard(ITEMS[0]), psheet('fsh', '<h2 id="fsh" class="gtm-pst">Rename [Exprot]</h2><p class="raw">6 feedback rows · 1 roadmap item</p>' + pField('[export]', { msg: msg('nfo', '“[Export]” exists with other capitals. Saving makes a separate theme; to combine them, choose “[Export]” from the list.') }) + pList('') + '<button type="button" class="btn p gtm-p48">Save</button><button type="button" class="btn gtm-p48">Cancel</button>'));

    /* ---------- GR-50 · After a rename ---------- */
    const ITEMS_R = ITEMS.map(f => f);
    const gr50 = () => page(tab({ list: T_RENAMED, sel: '[CSV export]', items: ITEMS_R,
      status: '<div class="nt g gtm-st" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Renamed: 6 feedback rows and 1 roadmap item updated.</b> [Exprot] is now [CSV export]; it stays selected.</div></div>' }), { h: 1000, rail: 'after3' });
    const gr50b = () => crop('<span class="eye">Where the new name reads after the rename · nothing travels but the new name</span><div class="gtm-3">'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Build › Roadmap · [CSV export v1]</h2><a class="btn t bsm" href="#">Open ↗</a></div><dl class="kv2" style="grid-template-columns:150px minmax(0,1fr)"><dt>Answers feedback theme</dt><dd><b>[CSV export]</b></dd><dt>Status</dt><dd>' + st('Planned') + '</dd></dl><p class="raw">roadmap_okrs.feedback_theme moved in the same write, so the item still answers the theme.</p></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Your Activity · /activity</h2><span class="sm">your rows only</span></div><ul class="gtm-act"><li><span class="mo">27 Nov · 10:42</span><span>Theme renamed on 6 feedback rows and 1 roadmap item</span><span class="raw">Grow · Product improvement</span></li></ul><p class="raw">The summary holds counts only, never the theme’s words. The other writers do not see this row.</p></section>'
      + '<section class="cd gtm-nb"><div class="ch"><h2 style="font-size:13.5px">Venture activity · for every writer</h2>' + NEW('#8835 · venture-wide activity') + '</div><p class="gtm-nbt">Not built</p><p class="raw">No route reads activity_logs by venture and module (entity_id is NULL here). Drawn as an outline only.</p></section>'
      + '</div>', 1400);

    /* ---------- handoff (GTM-H) ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Feedback themes · rename or merge · handoff (#8835)</h1><p>Continues Grow v2 · Feedback (#6099, last board GR-31). <b>Renumbered:</b> the brief numbers these boards GR-32 to GR-39, but #8819 (Beehiiv) holds GR-32 to GR-42, so this canvas uses GR-43 to GR-50 in the same order: GR-32→GR-43, GR-33→GR-44, GR-34→GR-45, GR-35→GR-46, GR-36→GR-47, GR-37→GR-48, GR-38→GR-49, GR-39→GR-50. Every reference on these boards uses the new numbers. Checked against <code>origin/main</code> d26a93a252 on 27 Nov 2026. Decision file on landing: <code>D6099-p3.md</code>, beside <code>D6099.md</code> and <code>D6099-p2.md</code>.</p>'
      + '<h2>What main does today</h2><p><code>FeedbackThemes.jsx</code> (D6098) is drawn by <code>defs/grow.jsx</code> as a separate “Feedback themes” section under the Feedback tab body on /grow/product-improvement: every theme in one list, sorted by name, each with Rename, an inline field, and an amber merge box with the same question. It hides the roadmap count when it is 0, and draws nothing when <code>parts.themes</code> is null, so an unreadable read looks like no themes. This canvas moves the control into the tab’s theme heading (GR-21 / GR-29), shows 0 roadmap items as measured, and draws Unreadable in words.</p>'
      + '<h2>Checked on main</h2>' + tbl(['File / route', 'What it showed'], [
        ['<code>services/growWriters.ts</code> <code>renameFeedbackTheme</code>', '400 “A theme needs a name” and “The new name is the same as the old one” on <code>to</code>; 400 on <code>from</code>; 404 “No feedback has that theme”; 409 <code>{merge_needed, feedback, roadmap_items}</code> without <code>merge: true</code>. One batch updates <code>product_feedback.theme/updated_by/updated_at</code>, <code>roadmap_okrs.feedback_theme</code> and one <code>activity_logs</code> row (counts only, <code>entity_id</code> NULL). Answer <code>{from, to, merged, feedback, roadmap_items}</code>. Exact match, case included; every statement bound to <code>project_id</code>.'],
        ['<code>services/growWriters.ts</code> <code>feedbackThemes</code>', '<code>[{theme, feedback, roadmap_items}]</code>, only themed rows (NULL and empty excluded), sorted by theme.'],
        ['<code>routes/cycle_grow.ts</code> recordsFor(product-improvement), <code>PATCH /feedback/themes</code>', '<code>parts.themes</code> only when <code>writes()</code> (<code>canAccessProject … write</code>); a failed read is <code>null</code>, never zeros; 403 “You can read this venture but not change it”.'],
        ['<code>pages/cycles/FeedbackTab.jsx</code>, <code>feedbackTabModel.js</code> <code>placementsFrom</code>', 'The v2 tab is on main (D6865 p2). A pending <code>feedback_theme</code> proposal is shown only when its theme is still named; the rest are counted as held back. Main’s line reads “1 placement names a theme you have not named, so it is not offered”; GR-50 draws the brief’s wording.'],
        ['<code>routes/activity.ts</code>', 'Reads <code>activity_logs</code> where <code>user_id</code> is the viewer only.'],
        ['<code>D6098.md</code> Owner decisions (2026-11-14)', 'Confirmed: matching is exact, case included; “Exprot” and “exprot” are two themes. The brief cited it unchecked.'],
        ['<code>pages/cycles/forms.js</code>', 'The roadmap form’s “Answers feedback theme” chip reads the same theme names.']])
      + '<h2>Acceptance mapped to boards</h2>' + tbl(['Acceptance item', 'Boards'], [['Rename', 'GR-43, GR-50'], ['Merge confirmation names both themes, N feedback rows and M roadmap items (and the stale-list counts)', 'GR-44'], ['Refusals: empty, same name, not found (and case only, read-only)', 'GR-45'], ['Saving, failed save', 'GR-47'], ['Reader / advisor: nothing drawn', 'GR-47'], ['Themes unreadable', 'GR-47, GR-47 B'], ['Phone 390', 'GR-48'], ['Dark', 'GR-49'], ['In the theme column / chip row, not a module block', 'GR-43, GR-48'], ['Exact matching, case included', 'GR-45 (case only)'], ['Empty: no themes', 'GR-46']])
      + '<h2>Backend required (◇, #8835)</h2>' + tbl(['Item', 'Boards'], [['A venture-wide activity list showing the rename to every writer (no route reads <code>activity_logs</code> by venture and module)', 'GR-50 B'], ['Re-pointing Eadwyn’s held-back placements to the new name (nothing rewrites <code>ai_rail_proposals</code>)', 'GR-44 C, GR-50 rail'], ['Eadwyn suggesting two themes are the same (only under Q2 B; not drawn)', 'none']])
      + '<p>Not drawn at all: undo of a rename or merge (no route; after a merge nothing records which rows came from which theme); who renamed a theme and when, on the theme itself (activity holds counts only).</p>'
      + '<h2>Owner questions (⚑, option A drawn)</h2>' + tbl(['Question', 'Drawn'], [['Q1 · Where Rename sits on desktop', 'A · on the selected theme’s heading, one theme at a time (GR-43). B (a Manage themes mode listing every theme) is close to what main has today.'], ['Q2 · Does Eadwyn suggest merges?', 'A · no; the GR-21C placements keep Accept, Edit and Discard (GR-43, GR-50).']])
      + '<h2>Frontend only</h2><p>Moving Rename into the heading and chip row; the merge list under the field; the case-only note (a client-side comparison with the theme list); the 80-character counter from 70; “0 roadmap items” as measured; Unreadable in words with Try again; Reload themes after a 404; Saving and Save failed with the name kept; the phone bottom sheet; dark tokens; selecting the new name after the write.</p>'
      + '<h2>Handoffs to sibling canvases</h2><p>Grow v2 · Feedback (#6099): GR-21, GR-21C, GR-23, GR-26, GR-28 and GR-29 unchanged. Grow v2 · Beehiiv (#8819) owns GR-32 to GR-42; nothing here crosses it. Build › Roadmap reads the new name with no change. After landing, #6098 rebuilds <code>FeedbackThemes.jsx</code> to these boards.</p>'
      + '<h2>Accessibility</h2><p>One h1 per screen. Rename has an accessible name with the theme. The field has a label naming the old theme; refusals are alerts tied to the field, the case-only note is a polite status. The merge question is an alertdialog that moves focus to Merge’s question and returns it to the heading on Cancel. Phone targets 44px or more. Not claimed until tested.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'GR43') html = gr43();
    else if (B === 'GR43B') html = gr43b();
    else if (B === 'GR44') html = gr44();
    else if (B === 'GR44B') html = gr44b();
    else if (B === 'GR44C') html = gr44c();
    else if (B === 'GR45') html = gr45();
    else if (B === 'GR46') html = gr46();
    else if (B === 'GR47') html = gr47();
    else if (B === 'GR47B') html = gr47b();
    else if (B === 'GR48A') html = gr48a();
    else if (B === 'GR48B') html = gr48b();
    else if (B === 'GR48C') html = gr48c();
    else if (B === 'GR48D') html = gr48d();
    else if (B === 'GR49') html = gr43b();
    else if (B === 'GR49B') html = gr44();
    else if (B === 'GR49C') html = crop('<span class="eye">Dark · the words and glyphs stay</span><div class="gtm-rg">'
      + rbox('Case only', editForm('[Exprot]', '[export]', { list: false, note: false, msg: msg('nfo', '“[Export]” exists with other capitals. Saving makes a separate theme; to combine them, choose “[Export]” from the list.') }))
      + rbox('Empty', editForm('[Exprot]', '', { err: 1, list: false, note: false, msg: msg('rf', 'A theme needs a name.') }))
      + rbox('Unreadable', msg('un', st('Unreadable') + ' Rename is unavailable: theme counts could not be read.', '<button type="button" class="btn bsm">Try again</button>'))
      + '</div>', 1400);
    else if (B === 'GR50') html = gr50();
    else if (B === 'GR50B') html = gr50b();
    else if (B === 'GTMH') html = handoff();
    else html = gr43();
    return { html: { __html: html } };
  }
}

</script>
