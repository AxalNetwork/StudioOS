.rax-write mark{background:none;padding:0 2px;border-bottom:2px solid var(--neg)}

.rax-write span{border-bottom:2px dotted var(--amT)}
.rax-jn{display:flex}

.rax-jn>div+div{border-left:0}

.rax-recb{border:1.5px solid var(--ink)}

.rax-stop{border:1.5px dashed var(--hair);border-radius:12px;padding:14px 16px;color:var(--mu);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.rax-al{display:grid;grid-template-columns:180px minmax(0,1fr) 48px 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.rax-al .bar{height:10px;border-radius:5px;background:var(--raised);overflow:hidden;border:1px solid var(--hair)}
.rax-al .bar i{display:block;height:100%;background:var(--ink)}

      RA26c: () => phone('Use of funds', '<div class="mc"><span class="eye">What this round buys</span><b>[$1.5m] · 5 sections</b></div>' + J(ALLOC.slice(0, 3).map(a => '<div class="mc"><div class="r1"><b>' + a[0] + '</b><span class="mo">' + a[1] + '%</span></div><small>' + a[2] + '</small></div>')) + '<div class="mc"><span class="eye">Runway</span>' + REC + '<small>Today [11 months]</small>' + MOD + '<small>After the raise [24 months]</small></div>'),
      RA26d: () => phone('Pipeline', '<div class="chips" style="flex-wrap:nowrap;overflow:hidden">' + J(PIPE.slice(0, 4).map((p, i) => '<button type="button" aria-checked="' + (i === 3) + '" style="min-height:40px">' + p[0] + ' <span>' + p[1] + '</span></button>')) + '</div>' + J([['[Fund name]', 'Diligence · due tomorrow', 'Answer questions'], ['[Investor name]', 'Diligence · due today', 'Send deck v6']].map(x => '<div class="mc"><b>' + x[0] + '</b><small>' + x[1] + '</small><button type="button" class="btn p" style="min-height:44px">' + x[2] + '</button></div>')) + '<p class="raw">Stages scroll sideways; the selected stage filters the cards.</p>')
    };

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RAA: () => dk('<h1>Current-state audit and before / after</h1><p>From the live audit of <code>/raise?project_id=12</code> on 7 Nov 2026, the authenticated browser audit of 8 Nov 2026, and <code>cycle_raise.ts</code>, <code>RaiseOverviewLead.jsx</code>, <code>shellConfig.js</code> on main. Rows marked 8 Nov were verified in the browser.</p>' + tbl(['Change', 'Current problem', 'Proposed', 'Why better', 'Preserved'], [
        ['Primary action', 'No action beside the title (Build and Grow have one)', 'One contextual action: Prepare to raise → Build pitch → Share with investor → Add investor; Ask beside it', 'The page says what to do now', 'All modules and Ask'],
        ['Readiness', 'Leads with “0 / 100” and a second full breakdown lower down', '“6 of 8 areas assessed”, then at most three actions; scores move to Detailed readiness', 'Founders act on gaps instead of chasing a number', 'Scores, history, rescoring'],
        ['Empty states', 'Six separate absence cards', 'One materials status table early; rich cards once data exists', 'Early page fits one screen', 'Direct links to each module'],
        ['Data semantics', '“Deck views 0” beside “Data room files Not recorded” and “Files 0”', '0 · Not recorded · Unavailable · Not applicable, one component', 'Numbers can be trusted', 'The house “Not recorded” rule'],
        ['Pitch card', 'Offers Share before a shareable deck is established', 'Draft · saved · reviewed · shared states; Share only after a saved version', 'No sharing a draft by accident', 'Pitch Studio routes (#4853)'],
        ['Connected sources', 'Three “Not connected” rows', 'One Connect sources message; rows once one is configured', 'Less repetition', 'Per-source freshness'],
        ['Navigation', 'Ten peer modules plus a duplicate select in the DOM', 'Grouped Prepare · Materials · Investors; inactive variant hidden', 'A visible journey; cleaner accessibility tree', 'Every route'],
        ['Eadwyn', 'Model names, token prices, holds and top-up lead; “best free reasoner” beside a price', 'Task suggestions first; Model: Recommended; usage behind a disclosure', 'Help with the raise, not the infrastructure', 'Usage transparency, quote contracts'],
        ['Also in Raise', 'Incorporate and Co-Founder Agreement read as Raise modules', '“Related company setup”, dashed and secondary', 'No implied ownership change', 'The links'],
        ['Duplicate layers · 8 Nov', 'Use of funds and Capital relationships render a dedicated Home and then a generic Cycle “at a glance + records” block with the same figures', 'The tool’s Home owns the page; records behind its own tab (RA14)', 'One set of numbers, one editing path', 'Every record (#5081)'],
        ['Refused source · 8 Nov', 'Cap table says it belongs to another company, then renders Planned round, No holders yet, AI proposals and Evidence', 'Refusal stops the page: Switch company · Ask for access (RA20b)', 'No false empty data', 'The permission check (#5079)'],
        ['Unreadable source · 8 Nov', 'Commitments unreadable, yet “Nothing needs you … every commitment has a status”', '“Needs you could not be fully checked.” + Partial + Retry (RA22c)', 'Uncertainty is not reported as all-clear', 'Needs you (#5080)'],
        ['Duplicate select · 8 Nov', 'Desktop shows the grouped nav and a Module select', 'Select only below 1024px; inactive variant hidden', 'One nav, clean accessibility tree', 'Every route'],
        ['Generic CTA · 8 Nov', '“Build your deck” in the header of every Raise tool', 'Per-tool action (Save version, Complete data room, Add investor…)', 'The button matches the page', 'Pitch Studio entry (D4853)'],
        ['Pitch copy · 8 Nov', '“Data coverage 2 of 85” with no denominator; “Try again” with no button; “About 0 text areas or 0 images”', '“2 of 85 figures linked to a recorded source”; inline Retry; plain usage (RA18)', 'Each message is actionable', 'Pitch Studio as built'],
        ['Support read · 8 Nov', '“Use an audited support read to open this room.” with no way to do it', 'Reason gate → Open read only → timer → End access; reason shown to founder (RA19b)', 'A dead end becomes an audited path', 'Audit log, founder visibility'],
        ['Empty analytics · 8 Nov', 'Evidence and Capital relationships render zero-filled dashboards; Capital relationships shows “Not read here yet”', 'Purpose-built empty states (RA15b, RA22b)', 'First use explains what to do', 'The analytics, once data exists']])),
      RAB: () => dk('<h1>Journey, IA and component hierarchy</h1><div class="cols"><div><h2>Journey</h2><p><b>Prepare</b> Evidence → Readiness. <b>Build the story</b> Narrative → Pitch. <b>Prepare diligence</b> Data room → Cap table → Use of funds. <b>Run the raise</b> Capital relationships (Pipeline, Outreach, Calls, Commitments, Closing). The Overview’s journey strip marks done, in progress and not started from recorded state (narrative versions, <code>/deck-ready</code>, data-room checklist, prospects, calls), never from readiness scores.</p><h2>Overview order</h2><p>1 Header · 2 Journey + Fundraising status · 3 Next best actions (≤ 3) · 4 Materials (status table early, cards later) · 5 Investor activity · 6 Connected evidence · 7 Detailed readiness · Related company setup.</p></div><div><h2>Components</h2>' + tbl(['Component', 'Rule'], [['RaiseHeader', 'Title, promise, one primary action from state, Ask'], ['JourneyStrip', 'Four stages, aria-current on the active stage'], ['ReadinessSummary', '“n of 8 areas assessed”; unassessed areas named, never scored 0'], ['NextActionCard', 'Title, reason, outcome, one CTA; optional “Readiness impact”'], ['MaterialsStatusTable / MaterialCard', 'Table while early, cards once a module has data'], ['PitchCard', 'Five states; Share only from a saved version'], ['InvestorActivity', 'Counts from prospects, calls and deck links; empty state with Add investor'], ['SourceList', 'One message at zero; per-source freshness after'], ['ValueState', 'One Raise-wide vocabulary: Recorded, Modelled, Founder figure, Backed, Mismatch, Not recorded, Unavailable, Partial, Stale, Changed, Founder only, Refused (RA23)'], ['ModuleHeader', 'Breadcrumb, title, purpose, version/state line, one contextual primary, tool tabs'], ['ConflictBanner', 'Review latest · Compare changes · Copy my version (RA24)'], ['ContextRail', 'Page description → Suggested here → Related → Ask → Model → Usage (RA25)'], ['RefusalBlock', 'Terminates the page; nothing renders after it']]) + '</div></div>'),
      RAC: () => dk('<h1>Roadmap and backend fit</h1><p>Ranked by impact over complexity, re-checked against main on 9 Nov 2026 (<code>cycle_raise.ts</code>, D4853 Pitch Studio routes) and the open issues filed from the 8 Nov browser audit.</p>' + tbl(['#', 'Change', 'Impact', 'Complexity', 'Backend'], [
        ['1', 'Refusal terminates the page (Cap table and every tool)', 'High · trust', 'Low', 'Typed refusal from the read so the page can stop ' + BE('#5070 / #5079')],
        ['2', 'Propagate unreadable into Needs you, Committed, Remaining', 'High · trust', 'Low', 'Per-source read status on the summary payload ' + BE('#5080')],
        ['3', 'Remove generic Cycle layer under mature tools; per-tool header actions', 'High', 'Low', 'None (#5081)'],
        ['4', 'One desktop nav; Module select only compact; four-stage IA', 'Medium', 'Low', 'None'],
        ['5', 'Readiness: ≤3 priorities, 8-area table, PMF separate, no-target copy', 'High', 'Medium', 'Freshness and next-action routing per area ' + BE('#5071')],
        ['6', 'Narrative states + versions as releases + conflict banner', 'High', 'Medium', 'Atomic saves and stale-write detection (version token) ' + BE('#5069') + '; “Used by” needs consumers to record the narrative version they read ' + BE()],
        ['7', 'Data room Home (8 of 12, access, activity, recent)', 'Medium', 'Medium', 'One Home endpoint instead of many requests ' + BE('#5072')],
        ['8', 'Support read-only reason gate', 'Medium', 'Medium', 'Time-boxed grant, reason stored and shown to the founder ' + BE()],
        ['9', 'Evidence ↔ Capital relationships reconciliation; Committed from confirmed commitments', 'High', 'Medium', BE('#5073')],
        ['10', 'Canonical venture context (company, viewer role, capabilities)', 'High', 'Medium', BE('#5074') + ' · drives founder vs admin empty copy'],
        ['11', 'Cap table Recorded vs Modelled scenarios', 'Medium', 'Low', 'Scenarios stored apart from issuances; confirm the API keeps them apart ' + BE('Confirm')],
        ['12', 'Use of funds plan vs actual, dependencies', 'Medium', 'Medium', 'Actuals by category from Mercury ' + BE()],
        ['13', 'Pitch copy fixes (coverage denominator, Retry, usage)', 'Medium', 'Low', 'None (#4839)'],
        ['14', 'Eadwyn contextual rail per tool', 'Medium', 'Low', 'Prompts map to mounted runs only'],
        ['15', 'Mobile per-module layouts (cards, View table)', 'Medium', 'Medium', BE('#5075') + ' for dense-data endpoints']])),
      RAD: () => dk('<h1>Accessibility, components and tokens</h1><div class="cols"><div><h2>Accessibility · WCAG 2.2 AA (target, not claimed until tested)</h2><p>Every state has a word and a shape, never colour alone (Recorded ●, Modelled ◌ dashed, Mismatch ✕, Backed ✓, Founder figure ✎, Changed ↻). Charts carry a title, a one-line semantic summary and a Table view; Readiness ships the table as the default. Headings in order: h1 tool, h2 per section. Tabs use <code>aria-current</code>; the investor sheet is a modal dialog with focus trapped and returned. Repeated links are named (“Open pitch: [deck]”, “Add files: Data room”). Refusal and errors use <code>role=alert</code>; the conflict banner is announced once. Targets 24px minimum desktop (2.5.8), 44px mobile, 48px primary. Focus visible on every control (2.4.11). The inactive nav variant is <code>hidden</code>.</p></div><div><h2>Components</h2>' + tbl(['Component', 'Notes'], [['ModuleHeader', 'crumb · h1 · purpose · state line · primary · tabs'], ['StateTag', 'Raise vocabulary; text + glyph + border style'], ['FigureRow', 'label · value · provenance (Recorded / Modelled / Unavailable)'], ['RecordedBlock / ModelledBlock', 'Solid ink border vs dashed violet hatch'], ['RefusalBlock', 'Terminal; no children render after it'], ['PartialNotice', 'What was checked, what wasn’t, Retry'], ['ConflictBanner', 'Three actions; never auto-merges'], ['ContextRail', 'Per-tool CTX config'], ['EmptyState', 'Title, one sentence, ≤3 actions; viewer-aware copy']]) + '<h2>Tokens</h2><p>Reuse the house tokens (<code>--ink --mu --hair --card --lav --pos --neg --am*</code>). Add <code>--modelled</code> (#7c3aed dashed + hatch) and <code>--recorded</code> (ink, solid). No new colours for states: shape and word carry them.</p></div></div>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RA01') html = page(overview('early'), { h: 1700 });
    else if (B === 'RA02') html = page(overview('active'), { h: 1500 });
    else if (B === 'RA03') html = ctas();
    else if (B === 'RA04') html = crop(status('early') + next('early'), 1180);
    else if (B === 'RA05') html = pitchStates();
    else if (B === 'RA06') html = crop(sources('none') + sources('some'), 900);
    else if (B === 'RA07') html = crop(detailed(true), 900);
    else if (B === 'RA08') html = semantics();
    else if (B === 'RA09') html = states();
    else if (B === 'RA10a') html = page(head('early') + journey('early') + status('early') + next('early'), { h: 900, rail: 'full' });
    else if (B === 'RA10b') html = page(head('early') + journey('early') + status('early') + next('early'), { h: 900, rail: 'off' });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'RA12') html = navSpec();
    else if (B === 'RA13') html = page(overview('active'), { h: 1500 });
    else if (B === 'RA14') html = cleanup();
    else if (B === 'RA15') html = page(evidence(), { h: 960, rail: 'evidence', cur: 'Evidence' });
    else if (B === 'RA15b') html = evidenceEmpty(false);
    else if (B === 'RA15c') html = evidenceEmpty(true);
    else if (B === 'RA16') html = page(readiness(), { h: 1160, rail: 'readiness', cur: 'Fundraising readiness' });
    else if (B === 'RA17') html = page(narrative(), { h: 1150, rail: 'narrative', cur: 'Investor narrative' });
    else if (B === 'RA18') html = pitchInt();
    else if (B === 'RA19') html = page(dataroom(), { h: 900, rail: 'dataroom', cur: 'Data room' });
    else if (B === 'RA19b') html = support();
    else if (B === 'RA20') html = page(captable(), { h: 1000, rail: 'captable', cur: 'Cap table' });
    else if (B === 'RA20b') html = capRefused();
    else if (B === 'RA21') html = page(uof('on'), { h: 1060, rail: 'uof', cur: 'Use of funds' });
    else if (B === 'RA21b') html = crop(uof('off'), 1100);
    else if (B === 'RA22') html = page(caprel('full'), { h: 950, rail: 'caprel', cur: 'Capital relationships' });
    else if (B === 'RA22b') html = page(caprel('empty'), { h: 700, rail: 'caprel', cur: 'Capital relationships' });
    else if (B === 'RA22c') html = page(caprel('partial'), { h: 950, rail: 'caprel', cur: 'Capital relationships' });
    else if (B === 'RA22d') html = page(caprel('full'), { h: 950, rail: 'off', cur: 'Capital relationships', overlay: invSheet() });
    else if (B === 'RA23') html = vocab();
    else if (B === 'RA24') html = conflict();
    else if (B === 'RA25') html = eadSys();
    else if (MOB2[B]) html = MOB2[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview('early'), { h: 1700 });
    return { html: { __html: html } };
  }
}
