        [POL('3') + ' /build/roadmap’s Board view and zone row (This week · Board · Roadmap · Cadence · KPI entry)', 'Drop the Board view (Product roadmap is the board) and the zone row; Work board ↗ stays in the Build nav', 'Keep both']])
      + '<h2>Accessibility</h2><p>One h1 per page; the view switch is a radio group with arrow keys; the highlighted row carries aria-current and a word (“Opened from Product roadmap”), not colour alone; status lines use role=status; targets 44px on phone, primary 48px; focus order on BLR00.</p>');

    let html;
    if (B === 'BLR00') html = route00();
    else if (B === 'BLR01') html = page(board01({ ann: 1, focusDoor: 1 }), { h: 900 });
    else if (B === 'BLR01B') html = page(board01({ sel: 'Harvest log' }), { h: 900, overlay: sheetItem() });
    else if (B === 'BLR02') html = page(land({}), { h: 1060 });
    else if (B === 'BLR02B') html = page(land({ hl: 'Harvest log', from: 'Product roadmap · [Harvest log]', back: 'Back to [Harvest log]' }), { h: 1080 });
    else if (B === 'BLR03') html = page(land({ view: 'Dependencies', cta: '<button type="button" class="btn p">Edit dependency links</button>', body: deps() }), { h: 1060 });
    else if (B === 'BLR03B') html = page(land({ view: 'Scenarios', cta: '<button type="button" class="btn p">New scenario</button>', body: scen() }), { h: 980 });
    else if (B === 'BLR04') html = page(backBoard(), { h: 900 });
    else if (B === 'BLR05') html = page(zeroRm(), { h: 820 });
    else if (B === 'BLR05B') html = page(zeroLand(), { h: 840 });
    else if (B === 'BLR06') html = states06();
    else if (B === 'BLR07A') html = pRm({ focusDoor: 1 });
    else if (B === 'BLR07B') html = pLand({ open: 1 });
    else if (B === 'BLR07C') html = pLand({ hl: 'Harvest log', backFocus: 0 });
    else if (B === 'BLR07D') html = pRm({ ret: 1, col: 'Next 1' });
    else if (B === 'BLR07E') html = pZero();
    else if (B === 'BLR08') html = handoff();
    else html = route00();
    return { html: { __html: html } };
  }
}
