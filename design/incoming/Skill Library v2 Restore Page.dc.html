      SK32A: () => phone('Review & versions', '<div class="skx-crumb">Skills library / ' + SKN + '</div><div style="display:flex;gap:8px;align-items:center">' + st('In review') + '<span class="raw">v3 current</span></div><h2 style="font-size:16px;font-weight:800">Published versions</h2><p class="skr-warn sm">' + SH.ar + '<span><b>The draft has edits that were never published.</b></span></p><p class="skr-rule">' + SH.lk + ' Restoring copies a version into the draft. It publishes nothing and moves no agent.</p>' + pEad('[v1] is the last version before tickets.read…', false) + J(VERS.map(v => pcard(v)))),
      SK32B: () => phone('Review & versions', '<h2 style="font-size:16px;font-weight:800">Published versions</h2>' + pcard(VERS[0]), null, '<div class="skr-grab" aria-hidden="true"></div><div class="skr-shh"><b id="sht">Restore [v1] as the draft</b><button type="button" class="pi" aria-label="Close">✕</button></div><div class="skr-shb">'
        + '<div class="scopebox"><b>What happens</b><ul><li><span>•</span><span>The draft takes v1’s definition.</span></li><li><span>•</span><span>Ships only as [v4] after review and evals.</span></li><li><span>•</span><span>You can’t approve it. ' + RV + '’s review is withdrawn.</span></li><li><span>•</span><span>[4] agents on v3, [2] on v1 keep their pins.</span></li></ul></div>'
        + '<button type="button" class="disc skr-44" aria-expanded="false"><b>What changes in the draft</b><span>1 field · 3 steps restored · 4 removed</span><i aria-hidden="true">›</i></button>'
        + pEad('Suggests a reason from the diff', false)
        + '<div class="skx-fld"><label for="pr">Reason <span>· required, 10 to 500</span></label><div class="skx-in skx-ta" id="pr" style="min-height:88px">' + REASON + '</div><span class="raw skx-cnt2" style="align-self:flex-end">' + REASON.length + ' / 500</span></div></div><div class="skr-shf"><button type="button" class="btn skr-44" style="flex:1">Cancel</button><button type="button" class="btn p skr-44" style="flex:1.4">Restore v1 as draft</button></div>'),
      SK32C: () => phone('Review & versions', '<h2 style="font-size:16px;font-weight:800">Published versions</h2>' + pcard(VERS[0]), null, '<div class="skr-grab" aria-hidden="true"></div><div class="skr-shh"><b id="sht">The draft has edits that were never published</b></div><div class="skr-shb"><p style="font-size:13px;line-height:1.5">Restoring v1 replaces them. They are kept in the audit log, not in the draft.</p><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Last edited by</dt><dd>' + ED + '</dd><dt>Last edited at</dt><dd>' + BR('#8825') + '</dd></dl>'
        + pEad('Keep my draft: the edit changes step 6', false) + '<code class="skr-code" style="align-self:flex-start">draft_has_changes</code></div><div class="skr-shf col"><button type="button" class="btn skr-44">Keep my draft</button><button type="button" class="btn dg skr-44">Discard edits and restore v1</button></div>'),
      SK32D: () => phone('Review & versions', '<div class="skr-ptoast" role="status">' + SH.ok + '<span>Restored v1 as the draft. It ships as v4 after review and evals.</span></div><div style="display:flex;gap:8px;align-items:center">' + st('Published') + '<span class="raw">v3 current</span></div>'
        + '<section class="skr-pc"><b>Draft · release readiness</b>' + st('Blocked', 'Needs approval') + '<p class="raw">A new review is needed.</p><p style="font-size:12.5px">Evaluation: 10 of 10 pass · results reused from [v1]: <b class="mo">10</b> of <b class="mo">10</b> required runs</p><p class="skr-disc">' + SH.cp + ' Your unpublished edits were discarded and kept in the audit log.</p></section>'
        + pEad('Ask ' + OK + ' to review', false) + J(VERS.slice(0, 1).map(v => pcard(v))), '<button type="button" class="btn p" style="flex:1">Ask for review…</button>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      SKRH: () => dk('<h1>Handoff · SK-26 to SK-33 · Restore a published version (#8825, for #4537)</h1><p>Continues Skill Library v2 (SK-01 to SK-16, D4956; SK-17 to SK-25 are the Extension Compare addendum, D5963). The control lives in SK-05 “Review &amp; versions”, card Published versions, whose ◇ for earlier versions (#4533) is now on main. Same shell, tabs, skx-tbl table, skx-dlg dialog, diff, readiness words and the Eadwyn rail. Checked against <code>main</code> d26a93a252 on Fri 27 Nov 2026. Code-informed, not screenshot-verified. Decision file on landing: <code>D4956-p1.md</code> (no <code>D4956-p*</code> exists yet).</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['<code>cloudflare-worker/src/routes/admin_hq_skills.ts</code> 876–887', '<code>POST /:uid/restore</code> { from_version, reason, discard_draft? }: Super Admin, 404 <code>not_found</code>, then 400 <code>reason_required</code> (10 to 500, <code>REASON_MIN</code>/<code>MAX</code>) before anything else; <code>GET /:uid/pins</code> at 889'],
          ['<code>services/agents/skillRecovery.ts</code> <code>restoreDraft</code>', 'Order: 409 <code>retired</code> → 400 <code>version_unknown</code> → 400 checkDraft code (+ <code>tool</code>) → 409 <code>already_restored</code> → 409 <code>draft_has_changes</code> { draft_hash }. Writes the draft, <code>updated_by</code> = restorer, withdraws a requested review, audits <code>agent_skill_restore_proposed</code> with the reason and the discarded draft. Answers { from_version, current_version, next_version, definition_hash, discarded, freshness }'],
          ['<code>GET /:uid</code> (same route file, 480–527)', '<code>versions[]</code>: version, published_at, by, evidence, publish_audited (null when the log was unreadable), release_note; <code>skill.updated_by</code>, <code>skill.draft_hash</code>; <code>review.open</code>; <code>freshness</code>; <code>retired.replacement</code>; <code>reviewers</code> excludes the caller and the last editor. No <code>updated_at</code> served'],
          ['<code>skillLifecycle.ts</code> <code>lifecycleStatus</code>, <code>ReleaseDecision</code>', 'A published skill with an open review on its evidence reads <b>In review</b> (SK-26); the restore withdraws it, so it reads <b>Published</b> again (SK-29). <code>review.released_version</code> and <code>evaluation.reused</code> drive “A new review is needed” and “Results reused from v1”'],
          ['<code>auth.ts</code> <code>requireSuperAdmin</code>; <code>util/branch.ts</code>', '403 “Super admin required”; on a branch 403 “HQ only” first'],
          ['<code>services/agents/skills.ts</code> <code>checkDraft</code>', 'Messages drawn verbatim on SK-30 C: <code>tag_unknown</code>, <code>tool_not_read_only</code>'],
          ['<code>frontend/src/lib/api/adminHqSkills.js</code>', '<code>get</code> and <code>diff</code> exist; no <code>restore</code> or <code>pins</code> method (the build adds <code>restore</code>; #8824 adds pins)'],
          ['<code>frontend/src/pages/hq/aiAgents/ReleaseEvidence.jsx</code>, <code>releaseModel.js</code>', 'Today’s Published versions list (no action) and the readiness words SK-29 reuses']])
        + '<h2>Acceptance → boards</h2>' + tbl(['Acceptance item', 'Board'], [['Choosing an immutable version', 'SK-26 (row action), SK-27 (picker of published versions only)'], ['A required reason', 'SK-27 (10 to 500, live count), SK-30 D'], ['A separate discard confirmation after draft_has_changes', 'SK-28, SK-32 C'], ['Success', 'SK-29, SK-32 D'], ['Each refusal by its code', 'SK-30 A–F, SK-31'], ['Creates a draft through review and evals, publishes nothing', 'SK-26 line, SK-27 “What happens”, SK-29 readiness'], ['Desktop, 390 phone, dark', 'SK-26 to SK-31, SK-32 A–D, SK-33']])
        + '<h2>Backend required (◇ #8825)</h2>' + tbl(['Need', 'Today'], [['The draft’s last edit time', '<code>agent_skills.updated_at</code> is stored; no read returns it'], ['“Restored from vK by, on: reason” on the draft after a reload', 'Only the <code>agent_skill_restore_proposed</code> audit row records it'], ['Restore rows in the version timeline (source version, reason, actor, time; read as draft restores)', '#4533 part E, fields as posted on #4533 on 15 Nov; not on main']])
        + '<h2>Owner questions (⚑, drawn as A)</h2><p>Q1 “Restore as draft…” also on the current row, to throw a draft away (same route, same discard confirmation): <b>A, yes</b> (SK-26). Q2 Eadwyn may draft the reason as a suggestion the person must edit before Restore enables: <b>A</b> (SK-27).</p>'
        + '<h2>Frontend only (#4537)</h2><p>The action column and Publish-recorded mark; the unpublished-edits line (draft_hash vs the current version’s evidence.definition_hash, only when recorded); “The draft holds this version”; the dialog, picker, diff (existing <code>diff</code>), reason counter; the separate confirmation re-sending with <code>discard_draft: true</code> and the reason kept; the readiness line from the restore answer’s <code>freshness</code>; refusal cards; phone sheets; dark. Eadwyn proposals never send a restore.</p>'
        + '<h2>Handoffs</h2><p>After a restore: Ask for review (SK-05) → evals (SK-03) → Publish gate (SK-06) → v(N+1). Teams re-pin on SK-10. Pins read: #8824. Version timeline: #4533. Card B’s replacement [Launch plan] is SK-07’s; this canvas is the skill before that retirement.</p>'
        + '<h2>Departures from the brief</h2><p>Eadwyn’s SK-26 proposal names [v1], not [v2], so Accept opens the same restore SK-27 to SK-29 draw. The suggested reason drops <code>tickets.read</code> (a read tool these sample versions carry) instead of <code>crm.write</code>: a published version cannot hold a write tool, so <code>crm.write</code> appears only in SK-30 C. Unavailable is the ST word for a failed read; “couldn’t be read” is its sentence. SK-31 B is a page of its own because a refused viewer gets no tab.</p>'
        + '<h2>Accessibility</h2><p>The versions table has real headers; every state is a word plus a glyph; the discard confirmation is an alertdialog that replaces the first dialog and returns focus to the row; the reason count is a polite live region; refusals are live regions with the code in text; 44px targets and no wide table at 390; dark keeps every word and shape.</p>'
        + '<p>[Launch checklist], [Iris Chen], [M. Osei], [R. Haddad], [M. Okafor], versions, steps, tools, counts and dates are fictional sample content. Design only.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    const g = (x) => '<div class="g">' + x + '</div>';
    if (B === 'SK26') html = page(dhead() + g(diffCard() + reviewCard() + versionsCard({ warn: true })) + spec(['Unpublished-edits line: skill.draft_hash ≠ versions[current].evidence.definition_hash (shown only when the current version has a recorded definition)', 'Status In review: lifecycleStatus of a published skill with an open review (review.open by ' + RV + ')', 'Agents pinned now: GET /:uid/pins versions[].agents (0 is a real zero) · Publish recorded: versions[].publish_audited']), { h: 1240, rail: rail26() });
    else if (B === 'SK27') html = page(dhead() + g(diffCard() + reviewCard() + versionsCard({ warn: true, sel: 1 })), { h: 1360, rail: rail26(), overlay: restoreDlg({ sugg: true }) });
    else if (B === 'SK28') html = crop(discardDlg() + spec(['Opens only after POST /:uid/restore answers 409 draft_has_changes { draft_hash }; it replaces the SK-27 dialog', '“Discard edits and restore v1” re-sends { from_version: 1, reason, discard_draft: true }; Keep my draft sends nothing', 'Last edited by: skill.updated_by { uid, name }, Not recorded when null']), 600);
    else if (B === 'SK29') html = page(dhead({ state: 'Published', line: 'The draft holds v1’s definition · ships as v4 after review and evals', meta: SLUG + ' · From Axal · v3 current (published 16 Nov) · draft restored from v1' }) + g(readyCard() + askCard() + versionsCard({ holds: 1 })) + spec(['Readiness from the restore answer’s freshness (GET /:uid freshness after a reload): blocking [needs_approval], evaluation { pass 10, total 10, not_evaluated 0, reused { version 1, results 10 } }, review.released_version 1', 'Status chip: the open review was withdrawn, so lifecycleStatus reads published again · discarded = true → the discard line']), { h: 1310, rail: rail29(), toast: toast });
    else if (B === 'SK30') html = crop('<div class="skr-refwrap"><div><span class="eye">Refusals from POST /:uid/restore · each by its code, in the dialog</span><div class="skr-refg">' + J(REF.map(refCard)) + '</div></div>' + rail30() + '</div>', 1440);
    else if (B === 'SK31A') html = states();
    else if (B === 'SK31B') html = page(refusedPage(), { h: 760, av: ['TV', '[T. Vance], HQ admin'], rail: rail('<section class="skr-quiet"><span class="eye">' + st('Refused') + '</span><p>Nothing was read, so nothing is proposed.</p></section>', { lead: 'This page was refused.' }) });
    else if (B === 'SK33') html = page(dhead() + g(diffCard() + reviewCard() + versionsCard({ warn: true, sel: 1 })), { h: 1360, rail: rail26(), keepRail: true, overlay: restoreDlg({ sugg: true }) });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(dhead() + g(diffCard() + reviewCard() + versionsCard({ warn: true })), { h: 1240, rail: rail26() });
    return { html: { __html: html } };
  }
}

</script>
