    const RAILC = (t, dot) => `<aside aria-label="Eadwyn" style="width:48px;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;box-sizing:border-box"><button type="button" aria-label="Expand Eadwyn" aria-expanded="false" style="width:32px;height:32px;border-radius:999px;border:1px solid var(--lavE);background:var(--lav);color:var(--vdeep);font-weight:800;font-size:13px;cursor:pointer;padding:0;position:relative">E${dot === false ? '' : '<span aria-hidden="true" style="position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:999px;background:var(--vbtn);border:2px solid var(--card)"></span>'}</button><span aria-hidden="true" style="writing-mode:vertical-rl;font-size:11.5px;color:var(--mut)">${t || '1 proposal · Financial analysis'}</span></aside>`;
    const SHELL = (main, o) => { o = o || {}; return `<div style="display:flex;flex-direction:column;height:${o.h}px">${APPH()}${o.ro ? ROB : ''}<div style="flex:1;display:flex;min-height:0">${SB()}<main style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--bg)">${main}${o.over || ''}</main>${o.side === undefined ? RAILC() : o.side}</div></div>`; };
    const TABL = [['Overview', null], ['Roster', 16], ['Skills library', 80], ['Operations', null]];

    const HDR = (tab, o) => { o = o || {}; const sub = SUBS[tab]; return `<header style="flex:none;padding:22px 28px 0;display:flex;flex-direction:column"><div style="display:flex;align-items:flex-start;gap:16px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><nav aria-label="Breadcrumb">${EB('HQ › AI agents' + (o.crumb ? ' › ' + o.crumb : ''))}</nav><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.2">${o.title || 'AI agents'}</h1>${o.pill || ''}</div><p style="margin:0;font-size:13px;line-height:1.5;color:var(--mut);max-width:720px">${o.line || 'The agents and skills every team is offered, the caps and models they run on, and how they are used. Every change is logged with your name and a reason.'}</p></div><div style="display:flex;align-items:center;gap:8px;flex:none;padding-top:4px">${o.acts || ''}</div></div>${o.notabs ? '' : `<nav aria-label="AI agents" style="display:flex;gap:22px;margin-top:16px;border-bottom:1px solid var(--line)">${TABL.map(([t, n]) => `<a href="#"${t === tab ? ' aria-current="page"' : ''} style="display:inline-flex;align-items:center;gap:7px;min-height:40px;font-size:13.5px;font-weight:${t === tab ? 700 : 600};color:${t === tab ? 'var(--ink)' : 'var(--mut)'};border-bottom:2px solid ${t === tab ? 'var(--vio)' : 'transparent'};margin-bottom:-1px;text-decoration:none">${t}${n != null ? `<span style="${M};font-size:11.5px;font-weight:500;color:var(--mut)">${n}</span>` : ''}</a>`).join('')}</nav>`}${sub && !o.nosub ? `<nav aria-label="${tab}" style="display:flex;gap:6px;margin-top:12px">${sub.map(([t, n]) => `<a href="#"${t === o.sub ? ' aria-current="page"' : ''} style="display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid ${t === o.sub ? 'var(--lavE)' : 'var(--line2)'};background:${t === o.sub ? 'var(--lav)' : 'var(--card)'};color:${t === o.sub ? 'var(--vdeep)' : 'var(--body)'};font-size:12.5px;font-weight:${t === o.sub ? 700 : 500};text-decoration:none;box-sizing:border-box">${t}${n != null ? `<span style="${M};font-size:11px;color:var(--mut)">${n}</span>` : ''}</a>`).join('')}</nav>` : ''}</header>`; };
    const BODY = (h, x) => `<div style="flex:1;min-height:0;overflow:hidden;padding:16px 28px 24px;display:flex;flex-direction:column;gap:14px;${x || ''}">${h}</div>`;
    const ROOT = (w, h, inner, x) => `<div style="${VARS};width:${w}px;height:${h}px;box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;${x || ''}">${inner}</div>`;
    const SHEET = (title, sub, body, foot, w) => `<aside role="dialog" aria-label="${title}" style="width:${w || 520}px;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:-12px 0 32px rgba(24,24,27,.08);height:100%;box-sizing:border-box"><div style="flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><span style="font-size:17px;font-weight:800;letter-spacing:-0.02em">${title}</span>${sub ? `<span style="font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap">${sub}</span>` : ''}</div><button type="button" aria-label="Close" style="width:32px;height:32px;border-radius:7px;border:none;background:transparent;color:var(--body);display:grid;place-items:center;cursor:pointer;padding:0">${ICO.x}</button></div><div style="flex:1;min-height:0;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:16px">${body}</div>${foot ? `<div style="flex:none;display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)">${foot}</div>` : ''}</aside>`;
    const DLG = (t, ps, btns, w, extra) => `<div role="dialog" aria-label="${t}" style="width:${w || 480}px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(24,24,27,.16);padding:22px 24px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-0.02em;line-height:1.3">${t}</h2>${ps.map(p => `<p style="margin:0;font-size:13.5px;line-height:1.55;color:var(--body)">${p}</p>`).join('')}${extra || ''}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">${btns}</div></div>`;
    const OVER = (inner, top) => `<div style="position:absolute;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:${top || 120}px;z-index:5">${inner}</div>`;
    const OVSHEET = (sheet) => `<div style="position:absolute;inset:0;background:var(--scrim);z-index:5"></div><div style="position:absolute;top:0;right:0;bottom:0;z-index:6;display:flex">${sheet}</div>`;

    /* ---------- the run page pieces ---------- */
    const SUBLINE = 'One run of the HQ reference workflow, frozen at v1 when it was admitted. Each node is one assessment; the final brief is a proposal for a person to decide.';
    const RUNHDR = (S, o) => { o = o || {}; return HDR('Operations', { sub: 'Runs', crumb: 'Operations › Runs › Startup Assessment run', title: 'Startup Assessment run', pill: RS(S.status), line: o.line || SUBLINE, acts: o.acts === undefined ? bS(ICO.list + 'Open in run log', SM) + bP(ICO.stop + 'Cancel run', SM) : o.acts }); };
    const FACT = (k, v) => `<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:11.5px;color:var(--mut)">${k}</span><span style="font-size:13px;color:var(--ink);display:flex;gap:6px;align-items:center;flex-wrap:wrap">${v}</span></span>`;
    const RUNCARD = (S, o) => { o = o || {}; const facts = [
      FACT('Workflow', `<span style="display:flex;flex-direction:column;gap:1px">Startup Assessment<span style="${M};font-size:11.5px;color:var(--mut)">startup-assessment</span></span>`),
      FACT('Version · definition hash', MONO('v1') + MONO('· ' + HASH, 'color:var(--mut)')),
      FACT('Scope', SCOPE),
      FACT('Started by', '[Sample admin: R. Okafor]'),
      FACT('Started', MONO('27 Nov 2026, 09:12 UTC')),
      FACT('Ended', S.ended ? MONO(S.ended) : S.endedNR ? ST.nr() : `<span style="color:var(--mut)">Not ended · the run is live</span>`)
    ]; return `<section aria-label="Run" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:${o.cols === 3 ? 'minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr)' : 'minmax(0,1.15fr) minmax(0,.95fr) minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)'};gap:12px 24px">${facts.join('')}</div>${S.cancel ? `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)">${CHP(G.sq, 'Cancel requested', 'ink')}${MONO(S.cancel, 'font-size:12px')}<span style="color:var(--mut)">by [Iris Chen] · nothing new starts</span></div>` : ''}<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)"><span style="font-size:13px;color:var(--ink);font-weight:600">${BUDGET}</span><span style="font-size:12px;color:var(--mut)">The ceiling this plan allows, not spend.</span><span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${o.noTag ? '' : BE('#4535 · GET /api/admin/ai-agents/workflow-runs/:uid') + BE('Q2 route')}</span></div></section>`; };

    /* node card in the graph */
    const COSTL = (a, small) => a && a.cost ? `<span style="font-size:${small ? 11.5 : 12}px;color:var(--body)">${MONO(a.cost, 'font-size:' + (small ? 11.5 : 12) + 'px')} charged for this attempt</span>` : `<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)">${ST.nr()}last attempt’s cost</span>`;
    const NCARD = (k, S, x, y, w, h) => { const n = NODES[k], s = S[k], last = s.att && s.att[s.att.length - 1]; const bd = s.s === 'fail' ? 'var(--negE)' : s.s === 'run' ? 'var(--lavE)' : 'var(--line)'; return `<article aria-label="${n.t}: ${NSD[s.s][1]}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;box-sizing:border-box;background:var(--card);border:${s.s === 'fail' ? 1.5 : 1}px solid ${bd};border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden"><div style="display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap">${NS(s.s)}<span style="margin-left:auto;${M};font-size:11px;color:var(--mut);white-space:nowrap">${last ? 'Attempt ' + last.n + ' of 2' : '0 of 2'}</span></div><b style="font-size:14.5px;line-height:1.25">${LNK(n.t, 'color:var(--ink);font-weight:700')}</b><span style="${M};font-size:11.5px;color:var(--body);overflow-wrap:anywhere">${n.sk} · pinned v1</span><span style="font-size:12px;color:var(--mut)">${n.role} · ${n.ag}${n.appr ? ' · <span style="color:var(--ambT);font-weight:600">Needs a person’s decision</span>' : ''}</span>${s.s === 'ns' ? '' : COSTL(last)}<span style="font-size:12px;line-height:1.4;color:${s.s === 'fail' ? 'var(--neg)' : 'var(--body)'};${s.s === 'fail' ? 'font-weight:600' : ''}">${s.why}${s.code ? `<br>${CODE(s.code)}` : ''}</span>${s.after ? `<span style="font-size:11.5px;color:var(--mut);line-height:1.35">${s.after}</span>` : ''}</article>`; };

    /* final brief card in the graph */
    const BRIEFCARD = (S, x, y, w, h) => { const b = S.brief; let body = '';
      if (b.kind === 'wait') body = `${CHP(G.dotted, 'Not assembled yet', 'mut')}<b style="font-size:14px;line-height:1.35">Brief not assembled yet · waits on ${b.n} assessments</b><ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px">${ORDER.filter(k => ['wait', 'run', 'ns'].includes(S[k].s)).map(k => `<li style="display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--body)">${NODES[k].t}<span>${NS(S[k].s)}</span></li>`).join('')}</ul>${ORDER.some(k => S[k].s === 'fail') ? '<span style="font-size:12px;line-height:1.45;color:var(--body)">Financial analysis failed: the brief will mark Financials missing.</span>' : ''}<span style="font-size:12px;color:var(--mut);line-height:1.45">It reads all four assessments. No Accept, Edit or Discard until it is assembled.</span>`;
      else if (b.kind === 'none') body = `${CHP(G.dotted, 'Not assembled', 'mut')}<b style="font-size:14px;line-height:1.35">${b.t}</b><span style="font-size:12px;color:var(--mut);line-height:1.45">${b.d}</span>${b.q ? OQ('Q5 · brief after stop or cancel') : ''}`;
      else body = `${DEC(b.dec || 'Open')}<b style="font-size:14px;line-height:1.35">3 of 4 assessments included · Financial analysis failed</b><ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px">${BSEC.map(s => `<li style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--body)">${SECD[s.m][0]}<span style="flex:1;min-width:0">${s.t}</span><span style="font-size:11px;color:var(--mut)">${SECD[s.m][1]}</span></li>`).join('')}</ul>${b.dec && b.dec !== 'Open' ? `<span style="font-size:12px;color:var(--body)">${b.dec} by [Iris Chen] · ${MONO('27 Nov, 10:05 UTC', 'font-size:11.5px')}</span>` : ''}${LNK('Open the brief', 'font-size:12.5px')}`;

    /* the dependency graph: level 1 (three), level 2 (Product assessment, after Market research), the final brief */
    const GRAPH = (S, W, ch) => { const gap = 46, cw = Math.floor((W - 2 * gap) / 3), top = 26, rg = 14; ch = ch || 196; const Hh = top + 3 * ch + 2 * rg; const X = [0, cw + gap, 2 * (cw + gap)]; const Y = (r) => top + r * (ch + rg);
      const ar = (x1, y1, x2, y2, solid) => `<path d="M${x1} ${y1} L${x2 - 7} ${y2}" stroke="${solid ? V.body : V.faint}" stroke-width="${solid ? 1.8 : 1.3}" ${solid ? '' : 'stroke-dasharray="4 4"'} fill="none"></path><path d="M${x2 - 8} ${y2 - 4.5} L${x2} ${y2} L${x2 - 8} ${y2 + 4.5}z" fill="${solid ? V.body : V.faint}"></path>`;

      const lab = (i, t) => `<span style="position:absolute;left:${X[i]}px;top:0">${EB(t)}</span>`;
      return `<div role="group" aria-label="Run graph, by level. The list below reads the same nodes." style="position:relative;width:${W}px;height:${Hh}px;flex:none">${svg}${lab(0, 'Level 1 · starts together')}${lab(1, 'Level 2 · after Market research')}${lab(2, 'Final brief')}${NCARD('mr', S, X[0], Y(0), cw, ch)}${NCARD('fa', S, X[0], Y(1), cw, ch)}${NCARD('lc', S, X[0], Y(2), cw, ch)}${NCARD('pa', S, X[1], Y(0), cw, ch)}${BRIEFCARD(S, X[2], Y(0), cw, 3 * ch + 2 * rg)}<span style="position:absolute;left:${X[1]}px;top:${Y(1) + 8}px;width:${cw}px;font-size:11.5px;color:var(--faint);line-height:1.45">Dashed lines: each assessment feeds the brief’s sections. Market research also feeds them, through its own sections.</span></div>`; };

    /* the list reading of the graph */
    const LIST = (S, o) => { o = o || {}; const rows = ORDER.map(k => { const n = NODES[k], s = S[k], last = s.att && s.att[s.att.length - 1]; return [`<span style="display:flex;flex-direction:column;gap:2px;min-width:0">${LNK(n.t, 'font-size:13px')}<span style="${M};font-size:11px;color:var(--mut);overflow-wrap:anywhere">${n.sk} · pinned v1</span></span>`, NS(s.s), MONO(last ? last.n + ' of 2' : '0 of 2', 'font-size:12px'), last && last.model ? MONO(last.model, 'font-size:12px') : ST.nr(), last && last.cost ? MONO(last.cost, 'font-size:12px') : ST.nr(), `<span style="font-size:12.5px;color:var(--body);line-height:1.4">${s.why}${s.code ? ` ${CODE('· ' + s.code)}` : ''}</span>`]; });
      return TBL(o.cols || 'minmax(0,1.35fr) 200px 70px 96px 110px minmax(0,1.7fr)', ['Node · skill', 'State', 'Attempts', 'Last model', 'Last attempt’s cost', 'Why'], rows, { al: 'Nodes, in dependency order', foot: `<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">Node totals, run total and cost by executed skill version: ${ST.nr()} waits on cost by version (#4536)</span><span style="margin-left:auto">${BE('#4536')}</span>` }); };

    const SA25 = (S, o) => { o = o || {}; const W = o.W || 1104; return RUNHDR(S, o) + BODY(`<a href="#" style="display:inline-flex;align-items:center;gap:4px;color:var(--vio);font-weight:600;font-size:12.5px;text-decoration:none;margin-bottom:-4px">${ICO.back}Back to runs · Workflow runs</a>` + RUNCARD(S, { cols: o.narrow ? 3 : 6 }) + GRAPH(S, W, o.ch) + (o.nolist ? '' : LIST(S, o))); };

    /* ---------- Eadwyn rail (shared, #5130) ---------- */
    const RAILO = (o) => { o = o || {}; return `<aside aria-label="Eadwyn" style="width:360px;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-sizing:border-box"><div style="display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)"><span aria-hidden="true" style="width:26px;height:26px;border-radius:999px;background:var(--lav);border:1px solid var(--lavE);color:var(--vdeep);display:grid;place-items:center;font-weight:800;font-size:12px">E</span><b style="font-size:14px">Eadwyn</b><span style="font-size:12px;color:var(--mut)">· ${o.ctx || 'Startup Assessment run'}</span><button type="button" aria-label="Collapse Eadwyn" aria-expanded="true" style="margin-left:auto;width:32px;height:32px;border-radius:7px;border:none;background:transparent;color:var(--body);cursor:pointer;font-size:16px">›</button></div><div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px"><article style="border:1px solid var(--lavE);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;background:var(--card)"><div style="display:flex;align-items:center;gap:6px">${EB('Proposal')}<span style="margin-left:auto">${PILL('Waiting for you', 'rev')}</span></div><b style="font-size:14px;line-height:1.35">${o.t}</b>${o.p.map(p => `<p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--body)">${p}</p>`).join('')}${o.cite ? `<span style="font-size:12px;color:var(--mut)">Cites: ${o.cite}</span>` : ''}<div style="display:flex;gap:6px;flex-wrap:wrap">${bS('Accept', SM)}${bS('Edit', SM)}${bG('Discard', SM)}</div></article>${o.extra || ''}<p style="margin:0;font-size:12px;line-height:1.5;color:var(--mut)">${o.foot || 'Eadwyn proposes; it never retries a node, cancels the run or decides the brief. Accept records your choice with your name; Discard asks for no reason.'}</p></div><div style="padding:12px 16px;border-top:1px solid var(--line)"><div style="min-height:40px;border:1px solid var(--line2);border-radius:9px;display:flex;align-items:center;padding:0 12px;color:var(--faint);font-size:13px">Ask about this run…</div></div></aside>`; };
