      + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><table class="etb"><thead><tr><th scope="col">Perk</th><th scope="col">Who can use it</th><th scope="col">State</th><th scope="col">Claims</th><th scope="col"></th></tr></thead><tbody>' + J([['20% off the first go-to-market sprint', 'Founders', 'In review', '—', 'Submitted 5 Nov · HQ reviews within 5 working days'], ['Free board-pack review', 'Founders, seed stage', 'Live', NM('Not recorded'), ''], ['Investor-update template pack', 'All members', 'Rejected', '—', 'HQ: “Needs terms and an expiry date.”']].map(r => '<tr><td><b>' + r[0] + '</b>' + (r[4] ? '<small>' + r[4] + '</small>' : '') + '</td><td>' + r[1] + '</td><td>' + st(r[2]) + '</td><td>' + r[3] + '</td><td style="text-align:right"><button type="button" class="btn ' + (r[2] === 'Rejected' ? 'p ' : '') + 'bsm">' + (r[2] === 'Rejected' ? 'Edit and resubmit' : 'Edit') + '</button></td></tr>')) + '</tbody></table></section><p class="foot">Editing a live perk sends it back to review.</p>';

    /* ---------- states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:14px">' + t + '</h2></div>' + inner + '</section>';
    const states = () => crop('<span class="eye">Loading, error and save states · shared across all six zones</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">'
      + box('Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:14px;width:55%"></span><span class="sk" style="height:14px;width:80%"></span><span class="sk" style="height:14px;width:40%"></span></div><span class="raw">Announced: “Loading proof”</span>')
      + box('Couldn’t load', '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Proof couldn’t be loaded.</b><div>Nothing here is out of date — it just isn’t shown.</div></div><span class="bt"><button type="button" class="btn bsm">Retry</button></span></div>')
      + box('Saving · saved · failed', '<div style="display:flex;flex-direction:column;gap:8px;font-size:13px"><span role="status">' + st('In review', 'Saving…') + '</span><span role="status">' + st('Live', 'Saved 14:32') + '</span><span role="alert">' + st('Rejected', 'Not saved — your entries are kept') + '</span></div>')
      + box('Not measured', '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Conversion</dt><dd>' + NM() + '</dd></dl><div class="how" style="font-size:12.5px">Views aren’t recorded, so a conversion rate would be invented.</div><span class="raw">Explanation opens from ⓘ, not printed permanently</span>')
      + '</div>', 1400);

    /* ---------- mobile ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const zsw = (cur) => '<button type="button" class="selb" style="min-height:44px" aria-haspopup="listbox"><span><span class="mu">Offers ·</span> ' + cur + '</span><span aria-hidden="true">▾</span></button>';
    const MOB = {
      OF09a: () => phone('Offers', zsw('Overview') + '<div class="strip4" style="grid-template-columns:1fr 1fr;gap:10px">' + J(RD.slice(0, 4).map(r => '<div class="kc"><span class="t">' + r[0] + '</span><span class="v" style="font-size:20px">' + r[1] + '</span><span class="s"><span>' + r[2] + '</span></span></div>')) + '</div><h2 style="font-size:16px;font-weight:800">What needs attention</h2><article class="rec"><b>Strengthen your storefront</b><p>1 of 5 proof items is self-stated.</p><a class="btn p" href="#" style="min-height:44px">Request approval</a></article><article class="rec"><b>3 testers to review</b><a class="btn" href="#" style="min-height:44px">Review applicants</a></article>'),
      OF09b: () => phone('Proof', zsw('Proof') + '<button type="button" class="btn p" style="min-height:48px">+ Add proof</button>' + J(PRF.slice(0, 3).map(prfCard)).replace(/btn bsm/g, 'btn').replace(/btn t bsm/g, 'btn t')),
      OF09c: () => phone('Product testing', zsw('Product testing') + '<div class="mc"><b>Founder onboarding pilot</b><small>8 places · 5 taken · 10 Nov – 8 Dec</small>' + st('Recruiting') + '<div class="nx"><div><b>3 applicants need review</b></div></div><button type="button" class="btn p" style="min-height:48px">Review applicants</button></div><div class="mc"><b>Pricing calculator beta</b>' + st('Draft') + '<button type="button" class="btn" style="min-height:44px">Submit for approval</button></div>'),
      OF09d: () => phone('Audience fit', '<p class="raw">Slide-overs become near-full-screen sheets</p>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mf" style="max-height:780px"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:12px"><h2 id="mf" style="font-size:18px;font-weight:800">Who is a great fit?</h2><div class="qf"><label for="m1">Client type or sector</label><div class="ta" id="m1" style="min-height:44px">B2B SaaS companies</div></div><div class="qf"><label for="m2">Minimum engagement</label><div class="ta" id="m2" style="min-height:44px">$25,000</div></div><div class="qf"><label>How strong is this fit?</label><div class="seg2" style="width:100%"><button type="button" role="radio" aria-checked="true" style="flex:1;min-height:44px">Strong</button><button type="button" role="radio" aria-checked="false" style="flex:1;min-height:44px">Good</button><button type="button" role="radio" aria-checked="false" style="flex:1;min-height:44px">Possible</button></div></div><div class="qf"><label for="m3">When someone isn’t a fit, what should we say?</label><div class="ta" id="m3" style="min-height:70px"></div></div><button type="button" class="btn p" style="min-height:48px">Save rule</button><button type="button" class="btn" style="min-height:48px">Cancel</button></div></div>')
    };

    /* ---------- spec ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const spec = () => dk('<h1>Components, states and backend fit</h1><p>The six zones keep their URLs; the zone bar groups them as Sell · Prove · Target · Test with Overview first, one level, every zone one click away. Each screen has one amber primary action; Export and other secondary actions are outlined or text buttons. Body text 14px, secondary 13px, metadata never below 12px.</p>'
      + tbl(['Component', 'Rule'], [['Status chip', 'Neutral by default; green only for Live/approved/complete, amber for pending or action required, red for rejected/withdrawn. Always icon + word.'], ['Consent label', 'Client approved · Approval requested · Self-stated · Withdrawn · Superseded — icon, word and one line; a client-approved card has a solid green outline, a self-stated one a dashed outline.'], ['Not measured / Not recorded', 'Grey text + ⓘ that opens the reason; never a zero, never a paragraph on the page.'], ['Recommendation', 'At most three, each tied to a recorded state (self-stated proof, rule without reply, applicants waiting, programme ready to submit). None shown when nothing qualifies.'], ['Sheet / slide-over', 'One shared component: role="dialog", labelled title, focus trap, Escape, focus return, inert background; near-full-screen sheet on phones.'], ['Form field', 'Visible label, field-level error tied with aria-describedby, entries kept after a failed save, Saving / Saved / Not saved announced, destructive action away from Save.']])
      + '<h2>Checked against the code (7 Nov 2026)</h2>' + tbl(['Area', 'Today', 'Status'], [
        ['Catalog', '<code>catalogState</code>: Draft (no price) · Live · Unlisted', 'Frontend only. Requests per service: shown where recorded; otherwise Not recorded'],
        ['Perk deals', '<code>perks.ts</code>: draft · in_review · live · paused · rejected; editing a live perk returns it to review', 'Frontend only'],
        ['Proof', '<code>/api/partner/offers/proof</code>: published is derived (consent given, not withdrawn), else self_stated; consent rows carry requested_at, given, withdrawn_at, consent_text', 'Frontend for four states; <b>Superseded needs backend support</b>'],
        ['Audience fit', '<code>/fit-rules</code>: best_fit with a signal, exclusions with statement and referred_to; Pipeline·Leads counts these rules to score leads', 'Frontend: conversational form over the same fields; copy says rules rank, never reject'],
        ['Visibility', '<code>/visibility</code>: per-surface engagement count and won value (agreed price), unattributed count; views null by design', 'Frontend only. <b>Trend needs a time series — backend required</b>; views stay Not measured'],
        ['Product testing', '<code>/api/partner/testing</code>: draft → submitted → approved → open → testing → closed (+ rejected, paused); submit, applicants, pick/decline, logo', 'Frontend: five-step lifecycle (submitted+approved = HQ review, open = Recruiting, closed = Complete); logo uses the existing route'],
        ['Overview', 'No readiness endpoint; each zone has its own read', 'Frontend can compose from zone reads; a single summary read is optional (#4696)']])
      + '<h2>Accessibility</h2><p>Zone bar: links with aria-current, grouped with role="group" and a visible group label. Tables keep th scope; on phones rows become labelled cards. Focus ring amber-700 2px. Touch targets 44px; primary actions 48px on phones. Contrast: metadata #5f5a55 on white (7:1).</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'OF01') html = page(overview(false), { h: 1060 });
    else if (B === 'OF01b') html = page(overview(true), { h: 720 });
    else if (B === 'OF02') html = page(catalog(), { h: 820 });
    else if (B === 'OF02b') html = page(catalog(), { h: 900, overlay: svcSheet() });
    else if (B === 'OF03') html = page(proof(), { h: 1000 });
    else if (B === 'OF03b') html = page(proofEmpty(), { h: 620 });
    else if (B === 'OF03c') html = consentSpec();
    else if (B === 'OF04') html = page(fit(), { h: 720 });
    else if (B === 'OF04b') html = page(fit(), { h: 900, overlay: fitSheet() });
    else if (B === 'OF05') html = page(visibility(), { h: 760 });
    else if (B === 'OF06') html = page(testing(), { h: 1020 });
    else if (B === 'OF06b') html = testingEmpty();
    else if (B === 'OF07') html = page(perks(), { h: 720 });
    else if (B === 'OF08') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'OF10') html = spec();
    else html = page(overview(false), { h: 1060 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
