      + box('LinkedIn hint', fld('u4', 'LinkedIn', '', { ph: 'linkedin.com/company/your-company', help: 'Your company page, not a personal profile.' }) + ENG('server URL validation · #4962'))
      + '</div><p class="foot">Normalisation is shown before saving, never applied silently. “Open ↗” appears only for a valid saved value.</p>', 1000);
    const textBoard = () => crop('<span class="eye">Narrative fields, numbers and revenue</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">'
      + box('Description near the limit', fld('t1', 'Description', V.desc + ' We sell to farms in Norway, Scotland and Chile and are piloting in Canada.', { ta: true, hint: '272 / 280', help: '8 characters left.' }))
      + box('Over the limit', fld('t2', 'Description', V.desc + ' We sell to farms in Norway, Scotland and Chile and are piloting new buoy designs in Canada.', { ta: true, err: 'Shorten by 6 characters (286 / 280).', hint: '286 / 280' }))
      + box('Employee count', fld('t3', 'Employee count', '14.5', { err: 'Use a whole number, like 14.' }) + '<p class="csx-help">Numeric keyboard on mobile; no negative numbers.</p>')
      + box('Current products', fld('t4', 'Current products', V.prod, { ta: true, help: 'One per line. e.g. “Buoy sensor kit”.' }))
      + box('Expansion goals', fld('t5', 'Expansion goals', V.goals, { ta: true, help: 'One per line. Examples only; not a stored list.' }))
      + box('Revenue range · transitional', fld('t6', 'Revenue range', V.rev, { help: 'Free text today. A band picker needs the approved contract.' }) + ENG('revenue bands · #4964'))
      + '</div>', 1300);
    const leave = () => crop('<div role="dialog" aria-modal="true" aria-labelledby="lv" style="width:520px;background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.18);display:flex;flex-direction:column"><div class="mdh"><h2 id="lv">Leave General with 3 unsaved changes?</h2><button type="button" class="ib" aria-label="Stay on General">✕</button></div><div class="mdb"><ul class="rz"><li><b>Description</b><small>edited</small></li><li><b>Regions and markets</b><small>Canada added</small></li><li><b>Logo</b><small>new file picked</small></li></ul><p style="font-size:12.5px">Going to Legal discards them. Nothing has been saved.</p></div><div class="mdf"><button type="button" class="btn">Discard and go to Legal</button><button type="button" class="btn p">Stay and save</button></div></div><p class="foot">Shown for settings navigation, sidebar links and browser Back (with the browser’s own prompt on tab close). Focus returns to the link that was activated if you stay.</p>' + ENG('dirty-navigation guard · #4961'), 600);

    /* ---------- matrix ---------- */
    const MX = [['Clean', 'All changes saved · last saved time', 'Hidden', 'Saved values', 'none'], ['Dirty', 'Unsaved changes · n fields', 'Discard · Save changes', 'Pending, marked', 'polite once'], ['Validating', 'Checking fields…', 'Disabled', 'Pending', 'none'], ['Saving', 'Saving…', 'Disabled', 'Pending', 'polite'], ['Saved', 'Saved · time', 'Hidden after 4 s', 'Saved values', 'polite'], ['Field invalid', 'Fix n fields', 'Go to first problem · Save', 'Pending', 'assertive summary'], ['Server failed', 'Save failed · reason', 'Discard · Try again', 'Pending', 'assertive'], ['Partial', 'Logo saved; n changes need attention', 'Discard the n · Save the n', 'Logo saved, rest pending', 'assertive'], ['Unknown outcome', 'Checking save outcome…', 'Disabled until read-back', 'Unchanged', 'polite'], ['Conflict', 'Newer company data exists', 'Review differences · Reload and reapply', 'Server values', 'assertive'], ['Read-only', 'Read-only · reason', 'None', 'Saved values', 'none'], ['Archived', 'Archived · restore to edit', 'Restore company…', 'Saved values', 'none']];
    const matrix = () => crop('<span class="eye">Save-state matrix</span><table class="csx-mx"><thead><tr><th>State</th><th>Rail status</th><th>Save bar actions</th><th>Preview shows</th><th>Announcement</th></tr></thead><tbody>' + J(MX.map(r => '<tr><th scope="row">' + r[0] + '</th><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td><td class="mo">' + r[4] + '</td></tr>')) + '</tbody></table><p class="foot">“Saved” appears only after the server confirms. Partial, unknown and conflict depend on #4961 and #4963; until those land, the build must not claim a single atomic save.</p>', 1100);

    /* ---------- mobile ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Back to company">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Settings sections">☰</button></div><div class="pbd" style="overflow:hidden;padding-bottom:90px">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mnav = '<button type="button" class="selb" style="min-height:44px" aria-haspopup="listbox"><span>Section: <b>General</b></span><span aria-hidden="true">▾</span></button>';
    const MOB = {
      CS12a: () => phone('Company settings', '<div class="csx-hd"><span class="csx-av sm">TL</span><div><span class="eye">Company settings</span><b style="font-size:18px;display:block">Tidepool Labs</b></div></div>' + mnav + '<button type="button" class="disc" aria-expanded="false"><b>Preview</b><span>How Tidepool Labs appears across StudioOS</span><i aria-hidden="true">▾</i></button>' + identity({})),
      CS12b: () => phone('Company settings', presence({}) + matching({})),
      CS12c: () => phone('Company settings', presence({ descDirty: true, descVal: dirtyOpts.descVal, descCount: '121' }), '<div style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px 26px;background:var(--card);border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px" role="region" aria-label="Save changes"><span role="status" style="font-size:13px;font-weight:700">● Unsaved changes · 3 fields</span><div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px"><button type="button" class="btn" style="min-height:48px">Discard</button><button type="button" class="btn p" style="min-height:48px">Save changes</button></div></div>'),
      CS12d: () => phone('Company settings', '<div class="csx-mode" role="note" style="font-size:12px"><span><b>Support session</b> · read-only</span><span class="csx-r"><a class="btn bsm" href="#" style="min-height:36px">HQ</a></span></div>' + mnav + identity({ ro: true, logo: { ro: true } }))
    };

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      CS00: () => dk('<h1>Current state and the new hierarchy</h1><p>Today’s General tab (<code>CompanyGeneralForm.jsx</code>, <code>generalFormModel.js</code> SECTIONS) is one long form: Logo · Identity (name, stage, currency) · Links · Where you operate · About · Growth (revenue, employees, products, goals), with a logo-and-name preview after the form and one Save that sends changed fields to <code>PATCH /api/company/:uid</code> plus the logo over <code>POST/DELETE /api/company/:uid/logo</code>.</p>'
        + tbl(['Today', 'Problem', 'Redesign'], [['Fields grouped by column', 'Consequences unclear: naming, matching, presentation and money mixed', 'Four intent groups: Company identity · Public presence · Matching profile · Business snapshot, each with a purpose line'], ['Preview after the form, logo and name only', 'Far from the fields; shows little', 'Sticky right-rail preview with public fields only, marked when it includes unsaved changes'], ['Save state implicit', 'Users infer whether edits are pending; logo and fields save separately', 'Sticky save bar while dirty + rail status with 12 states; no false “Saved”'], ['179-option native currency select', 'High friction', 'Searchable combobox; Not recorded explicit; no guessed default'], ['Regions as free text with chips; revenue, products, goals single-line', 'Format unclear', 'Multi-select (canonical list pending #4964), multiline narrative fields, examples'], ['Logo tile looks droppable; Upload is a separate button', 'Tile not a real control', 'One accessible drop zone'], ['Tabs with role=tab', 'They are routes', 'Settings navigation with aria-current'], ['Super Admin preview shell dominates', 'Competes with the task', 'Compact mode bar; read-only reason; no editable-looking controls']]) + '<p>Public vs private is the Worker’s own split (<code>PUBLIC_FIELDS</code> vs <code>PRIVATE_FIELDS</code> in <code>routes/company.ts</code>): the preview never shows revenue, employees, products or goals.</p>'),
      CS14: () => dk('<h1>Components and accessibility</h1>' + tbl(['Component', 'Spec'], [['Settings header + navigation', 'Avatar, name, “Company settings”, optional status badge; nav links Team · General · Legal · Projects with <code>aria-current="page"</code>; no role=tab'], ['Mode / read-only banner', 'One amber line: role and shell previewed, whether writes are allowed, Back to HQ. Read-only fields render as dashed read-only values, not disabled inputs; Save is absent'], ['Logo uploader', 'One <code>button</code> drop zone; Enter/Space opens picker; drop optional; Replace/Remove; inline error with <code>role="alert"</code>; PNG/SVG, square, ≤ 2 MB'], ['Text / URL field', 'Visible label; help and error linked by <code>aria-describedby</code>; <code>aria-invalid</code>; URL normalisation previewed in help text'], ['Currency combobox', 'ARIA 1.2 combobox + listbox, <code>aria-activedescendant</code>; Esc restores; “Not recorded” explicit'], ['Region multi-select', 'Combobox + chips; each chip a named remove button; focus moves to next chip'], ['Revenue', 'Free text now; band picker after #4964'], ['Textarea + counter', 'Counter announced at 20 left and at the limit, not every keystroke'], ['Company preview', 'Public fields only; “Includes unsaved changes” tag while dirty'], ['Save bar', 'Appears only when dirty; sticky, never covers the focused field; status in <code>role="status"</code>'], ['Error callout', 'Summary at top on submit with links to fields; focus moves to it'], ['Conflict / reconciling', 'Amber; disabled actions while checking; Review differences shows mine / theirs per field']])
        + '<h2>Keyboard and touch</h2><p>Tab order follows the visual groups. Focus ring 2px violet everywhere. Mobile targets ≥ 44px, save bar buttons 48px above the safe area. Status never by colour alone (each state has a word and a shape). Light and dark meet WCAG AA contrast by token choice; to be verified in browser QA, not claimed here.</p>'),
      CS15: () => dk('<h1>Handoff and “Requires engineering”</h1>' + tbl(['Design element', 'Maps to', 'Status'], [['Header + nav', '<code>CompanySettingsTabs.jsx</code> <code>SettingsHead</code>', 'Frontend: replace role=tab with nav links + aria-current'], ['Four groups', '<code>generalFormModel.js</code> SECTIONS', 'Frontend: regroup; same fields'], ['Preview rail', '<code>CompanyGeneralForm.jsx</code>, <code>portfolioUi.jsx</code> (CompanyMark)', 'Frontend'], ['Save bar + rail status', '<code>CompanyGeneralForm.jsx</code>', 'Frontend for clean/dirty/saving/saved/invalid/failed; partial and unknown need #4961'], ['Logo uploader', '<code>lib/api/companyLogo.js</code>', 'Frontend'], ['Currency combobox', '<code>CURRENCY_CODES</code> (matches Worker ISO list)', 'Frontend; currency names from <code>Intl.DisplayNames</code>'], ['Regions multi-select', '<code>regionsOf</code>/<code>regionsText</code>', 'Free-entry chips now; canonical list needs #4964'], ['Read-only / support mode', '<code>lib/settingsScope.js</code>, <code>services/companyAccess.ts</code> <code>canEdit</code>', 'Needs #4960 (server-enforced read-only for HQ/support)'], ['Conflict', '<code>PATCH /api/company/:uid</code>', 'Needs #4963: no version check today (UPDATE by id)'], ['Archived read-only', '<code>archived_at</code> (D1137)', 'Needs #4963 to refuse writes to archived companies consistently'], ['Server validation of URLs, numbers', '<code>routes/company.ts</code>', 'Needs #4962 (only name and currency are validated today)']])
        + '<h2>Requires engineering</h2><p><b>#4960</b> read-only boundary for HQ and support sessions · <b>#4961</b> one reliable save across logo and fields, outcome read-back, dirty-navigation guard · <b>#4962</b> server validation and Worker/FastAPI parity · <b>#4963</b> version check, archived consistency, audit events · <b>#4964</b> canonical regions and revenue bands, fewer reads, accessibility foundations. The design doesn’t mask any of these: the boards that depend on them carry the tag.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    const H = 1480;
    if (B === 'CS01') html = page(general('clean'), { h: H });
    else if (B === 'CS02') html = page(general('dirty', dirtyOpts), { h: H + 60 });
    else if (B === 'CS03') html = page(general('saving', dirtyOpts), { h: H + 60 });
    else if (B === 'CS04') html = page(general('saved'), { h: H });
    else if (B === 'CS05') html = page(general('invalid', Object.assign({}, dirtyOpts, { errSummary: true, webErr: 'Enter a full address, like https://tidepool.example', webVal: 'tidepool', empErr: 'Use a whole number, like 14.', empVal: '14.5' })), { h: H + 160 });
    else if (B === 'CS06') html = page(general('failed', dirtyOpts), { h: H + 60 });
    else if (B === 'CS07') html = page(general('partial', Object.assign({}, dirtyOpts, { logoPend: false })), { h: H + 60 });
    else if (B === 'CS08') html = page(general('checking', dirtyOpts), { h: H + 60 });
    else if (B === 'CS09') html = page(general('conflict', dirtyOpts), { h: H + 60 });
    else if (B === 'CS10') html = page(general('ro'), { h: H });
    else if (B === 'CS11') html = page(general('archived'), { h: H + 60 });
    else if (B === 'CS16') html = page(general('dirty', dirtyOpts), { h: H + 60 });
    else if (B === 'CS20') html = currency();
    else if (B === 'CS21') html = regionBoard();
    else if (B === 'CS22') html = logoBoard();
    else if (B === 'CS23') html = urlBoard();
    else if (B === 'CS24') html = textBoard();
    else if (B === 'CS25') html = leave();
    else if (B === 'CS13') html = matrix();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(general('clean'), { h: H });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
