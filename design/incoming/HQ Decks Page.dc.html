      return DHDR('Beta cohort', { acts: bP(ICO.plus + 'Add people') }) + BODY(`<div style="display:flex;align-items:center;gap:8px">${SEARCH('Search by name or company')}${CHIP('Feature ▾')}${CHIP('Added by ▾')}</div>` + (o.add ? TBL('minmax(0,1.4fr) minmax(0,1.3fr) minmax(0,1fr) 92px', ['Name', 'Features on', 'Added', ''], BETA.map(b => [`${PAV(b[0].replace(/[\[\]]/g, '').split(' ').map(w => w[0]).join(''), 28)}<span style="display:flex;flex-direction:column;gap:1px;min-width:0"><b style="font-size:13.5px;color:var(--ink)">${b[0]}</b><span style="font-size:12px;color:var(--mut)">${b[1]}</span></span>`, b[2].split(' · ').map(t => TAG(t)).join(''), `<span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:12.5px">${b[3]}</span>${MONO(b[4], 'font-size:11.5px;color:var(--mut)')}</span>`, bG('Remove…', SM)]), { al: 'Beta cohort', foot: PAGER('1–6 of 24') }) : TBL('minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr) 120px 100px', ['Name', 'Company', 'Features on', 'Added by', 'When', ''], rows, { al: 'Beta cohort', foot: PAGER('1–6 of 24') }))) + '|SIDE|' + (o.add ? add : ''); };
    const HD3D = DIM(DLG('Remove [Dev Testcase] from the beta cohort?', ['They lose Logo wall on their next page. Logo walls already on their slides stay.'], bS('Cancel') + bDF('Remove'), 480, REASON('Why remove them?')));

    const SECT = ['B2B software', 'Fintech', 'Health', 'Climate', 'Consumer', 'Deep tech'];
    const STG = ['Pre-seed', 'Seed', 'Series A', 'Series B+'];
    const TPL = ['Problem-first', 'Traction-led', 'Metrics grid', 'Thesis and proof'];
    const HD4 = (o) => { o = o || {}; const ro = o.ro; const cell = (si, gi) => { const k = (si + gi) % 4; const ch = (si === 1 && gi === 1) || (si === 3 && gi === 0); return `<div style="background:var(--card);border:1px solid ${si === 0 && gi === 1 && o.sheet ? 'var(--lavE)' : 'var(--line)'};border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0">${THUMB(k, 172)}<span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><b style="font-size:13px;color:var(--ink)">${TPL[k]}</b>${ch ? TAG('Changed', 'border-color:var(--lavE);color:var(--vdeep)') : TAG('Default')}</span>${ch ? `<span style="font-size:11.5px;color:var(--mut)">by [Admin Name] · 14 Oct 2026</span>` : ''}<span style="display:flex;gap:6px">${ro ? bX('Change', 'Only a super admin can change default templates', SM) + (ch ? bX('Reset', 'Only a super admin can reset default templates', SM) : '') : bS('Change', SM) + (ch ? bG('Reset to default', SM) : '')}</span></div>`; };
      const grid = `<div role="table" aria-label="Default templates by sector and stage" style="display:grid;grid-template-columns:120px repeat(4,minmax(0,1fr));gap:10px;align-items:start"><span></span>${STG.map(s => `<span role="columnheader" style="${M};font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:0 2px">${s}</span>`).join('')}${SECT.map((s, si) => `<span role="rowheader" style="font-size:13px;font-weight:700;color:var(--ink);padding-top:8px">${s}</span>${STG.map((_, gi) => cell(si, gi)).join('')}`).join('')}</div>`;
      const sheet = SHEET('Default template · B2B software · Seed', 'Founders starting a Seed deck in B2B software get this first', `${THUMB(1, 470)}<div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:15px;color:var(--ink)">Traction-led · Default</b><span style="font-size:12.5px;line-height:1.5;color:var(--body)">[12] cards: title, problem, traction first, product, market, business model, team, round, use of funds, appendix.</span></div><div style="display:flex;flex-direction:column;gap:8px">${EB('Choose another')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${TPL.map((t, i) => `<div role="radio" aria-checked="${i === 1}" style="display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;border:1px solid ${i === 1 ? 'var(--lavE)' : 'var(--line)'};background:${i === 1 ? 'var(--lav)' : 'var(--card)'}">${THUMB(i, 206)}<span style="font-size:12.5px;font-weight:600;color:var(--ink)">${t}</span></div>`).join('')}</div></div>${REASON('Why change the default?')}`, bS('Cancel') + bP('Save'), 520);
      if (o.sheetOnly) return sheet;
      return DHDR('Default templates') + BODY(NOTE('Each sector and stage starts founders on one template. Founders can still pick any template.') + grid) + '|SIDE|' + (o.sheet ? sheet : ''); };

    const NORMS = [['MRR', '$[10k]–$[50k]', '[Axal portfolio · 2025 cohort · n=48]', '12 Oct 2026'], ['Month-on-month growth', '[10]–[20]%', '[Public seed benchmarks report · 2026]', '12 Oct 2026'], ['Gross margin', '[60]–[80]%', '[Public seed benchmarks report · 2026]', '12 Oct 2026'], ['Burn multiple', 'under [2.0]x', '[Axal portfolio · 2025 cohort · n=48]', '3 Oct 2026'], ['Runway after the raise', '[18]–[24] months', '[Axal portfolio · 2025 cohort · n=48]', '3 Oct 2026'], ['Round size', '$[1.5M]–$[3M]', null, null]];
    const HD5 = (o) => { o = o || {}; const rows = NORMS.map(n => [`<b style="font-size:13.5px;color:var(--ink)">${n[0]}</b>`, MONO(n[1]), n[2] ? `<span style="font-size:12.5px">${n[2]}</span>` : `<span style="display:flex;flex-direction:column;gap:2px">${NR('', 'font-size:12.5px')}<span style="font-size:11.5px;color:var(--ambT)">The critic does not cite a norm with no source.</span></span>`, n[3] ? MONO(n[3], 'font-size:12px') : NR('', 'font-size:12.5px'), MOREB('Actions for ' + n[0])]);
      rows.push([`<span style="font-size:13.5px;color:var(--mut);text-decoration:line-through">Logo count</span>`, MONO('[5]+ logos', 'color:var(--mut)'), `<span style="font-size:12.5px;color:var(--mut)">Retired 2 Oct 2026 by [Second Admin] · “Not a stage signal”</span>`, PILL('Retired', 'hid'), '']);
      const side = SHEET('[Northwind Labs] · its own norms', 'Opened from the deck critic · read only', NOTE('The founders set these. The critic cites them before HQ’s norms for this project. HQ cannot change them.') + TBL('minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)', ['Metric', 'Their target', 'Set by'], [['MRR', MONO('$[40k] by [Mar 2027]'), '[Ada Example]'], ['Gross margin', MONO('[72]%'), '[Ada Example]'], ['Runway after the raise', MONO('[20] months'), '[Jordan Reyes]']].map(r => [`<b style="font-size:13px;color:var(--ink)">${r[0]}</b>`, r[1], `<span style="font-size:12.5px">${r[2]}</span>`]), { al: 'Project norms', py: 9 }) + `<span style="font-size:12px;color:var(--mut)">Last changed by the founders on 19 Oct 2026.</span>`, bS('Close'), 520);
      return DHDR('Stage norms', { acts: bP(ICO.plus + 'Add norm') }) + BODY(`<div role="radiogroup" aria-label="Stage" style="display:flex;gap:6px">${STG.map((s, i) => CHIP(s, i === 1)).join('')}</div>` + TBL('minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.8fr) 120px 36px', ['Metric', 'Typical range', 'Source', 'Last reviewed', ''], rows, { al: 'Seed norms', foot: PAGER('1–7 of 7') }) + NOTE('The deck critic quotes the norm, its range and its source beside a founder’s figure. It never rates the company.')) + '|SIDE|' + (o.side ? side : ''); };
    const HD5D = DIM(DLG('Add a Seed norm', ['The critic starts citing it on the next deck it reads.'], bS('Cancel') + bP('Add norm'), 500, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${FLD('Metric', INP('Net revenue retention'), '', 1)}${FLD('Typical range', INP('[100]–[120]%', '', true), '', 1)}</div>${FLD('Source', INP('[Public seed benchmarks report · 2026]'), 'Required. A norm with no source is never cited.', 1)}${REASON('Why add it?')}`) + DLG('Retire “Logo count”?', ['The critic stops citing it at once. Decks it was cited on keep the old note until they are read again.'], bS('Cancel') + bDF('Retire'), 480, REASON('Why retire it?')));

    const PHD = `<div style="display:flex;flex-direction:column;height:844px;background:var(--bg)"><div style="height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--line)"><button type="button" aria-label="Menu" style="width:44px;height:44px;border:none;background:transparent;color:var(--ink);font-size:18px;cursor:pointer">☰</button><span style="flex:1;font-size:16px;font-weight:800;letter-spacing:-0.02em">Decks · Reports</span>${PILL('HQ', 'hq')}</div><div style="padding:10px 16px;background:var(--raised);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--body);display:flex;gap:8px;align-items:center">${ICO.lock}Read only. Resolve on a larger screen.</div><div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px">${REPS.slice(0, 4).map(r => `<article style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:14px;color:var(--ink)">${r[1]}</b>${PILL(r[7], r[7] === 'Open' ? 'wait' : 'pub')}</div><span style="font-size:12.5px;color:var(--body)">${r[2]} · ${r[3]}</span><span style="font-size:12.5px;color:var(--ink)">${r[5]} · ${r[6]}</span><span style="${M};font-size:11.5px;color:var(--mut)">${r[0]} · ${r[4]}</span></article>`).join('')}</div></div>`;

    const FR = {
      hd1: () => ({ w: 1440, h: 1327, html: PG(HD1({ sheet: 1 }), { h: 1327 }) }),
      hd1e: () => ({ w: 1440, h: 640, html: PG(HD1({ empty: 1 }), { h: 640 }) }),
      hd2: () => ({ w: 1440, h: 760, html: PG(HD2(), { h: 760 }) }),
      hd2b: () => ({ w: 1440, html: HD2D }),
      hd3: () => ({ w: 1440, h: 1045, html: PG(HD3({ add: 1 }), { h: 1045 }) }),
      hd3b: () => ({ w: 1440, html: HD3D }),
      hd4: () => ({ w: 1440, h: 1652, html: PG(HD4(), { h: 1652 }) }),
      hd4b: () => ({ w: 1440, html: DIM(`<div style="height:1020px;display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(24,24,27,.16)">${HD4({ sheetOnly: 1 })}</div>`) }),
      hd5: () => ({ w: 1440, h: 997, html: PG(HD5({ side: 1 }), { h: 997 }) }),
      hd5b: () => ({ w: 1440, html: HD5D }),
      hd6a: () => ({ w: 1440, h: 700, html: PG(HD1({ load: 1 }), { h: 700 }) }),
      hd6b: () => ({ w: 1440, h: 640, html: PG(HD2({ err: 1 }), { h: 640 }) }),
      hd6c: () => ({ w: 1440, h: 1689, html: PG(HD4({ ro: 1 }), { h: 1689, ro: 1 }) }),
      hd6d: () => ({ w: 390, h: 844, html: PHD })
    };
    const fr = (FR[v] || FR.hd1)();
    return { rootSt: `${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };

  }
}

</script>
