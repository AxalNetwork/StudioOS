        ['Annual invoice rows, Record payment, Void (nothing paid), PDF, revision conflict', '<code>routes/admin_licences_fees.ts</code>, <code>services/licenceFeeInvoices.ts</code> (migration 513, UNIQUE <code>licence_uid, period_start</code>; PATCH <code>expected_revision</code> → 409 <code>invoice_changed</code>; <code>paid_not_void</code>)', 'Preserved, unchanged'],
        ['Issue refusals: not billable, no start date, currency unknown, licensor not payee, terms unreadable (503)', '<code>issueFeeInvoice</code>, <code>licensorRefusal</code> in <code>services/licenceAccount.ts</code>; due = <code>payment_terms_days</code> or 30', 'Reused for the initial invoice'],
        ['Accepted initial fee, accepted surcharge, decision kind, date, by, reason, currency; per-country regulatory class', '<code>GET /:uid/pricing</code> → <code>latest_decision</code>, <code>countries[].regulatory_class</code>', 'Frontend'],
        ['Apply write, refusals (400 accepted_value_required; 409 terms_conflict, snapshot_stale, agreement_ack_required, currency_mismatch, licence_terminated; 503 agreement_unreadable)', '<code>routes/admin_licence_pricing_apply.ts</code>, <code>services/licencePricingApply.ts</code>', 'Frontend; sentences shown as given'],
        ['Licensee’s own invoices and their own failure', '<code>GET /api/licence/mine/statements</code> → <code>fee_invoices</code>, <code>fee_invoices_reason</code> (“Your annual fee invoices could not be read…”)', 'Frontend; sentence drops “annual” once the initial invoice is listed (#5954)']])
      + '<h2>Backend required (◇)</h2>' + tbl(['Need', 'Today on main', 'Issue'], [
        ['An initial invoice: a kind or a sibling table, one per licence ever (void included), two lines, class frozen on it, reference, Issue write and its refusals (already issued, not started, no initial fee)', '<code>licence_fee_invoices</code> is one row per licence year; nothing invoices the initial fee', '#5954'],
        ['Apply writes the accepted minimum royalty to <code>licence_terms.minimum_guarantee_cents</code> and counts it as a contractual change (agreement acknowledgement)', '<code>CONTRACTUAL</code> writes only <code>annual_fee_cents</code> and <code>revenue_share_bps</code>; the other three figures are on the decision only', '#5953'],
        ['The Apply review knows whether an initial invoice is issued', 'The pricing read returns no invoices; needs a second read of <code>/:uid/fee-invoices</code> once invoices carry a kind', '#5954']])
      + '<div class="cols"><div><h2>Frontend only</h2><p>The Fees section split (initial card above the annual list) in <code>LicenceFeeInvoices.jsx</code>; the five-row “Goes to” table in <code>CountryPricing.jsx</code>; the post-Apply link “Initial invoice: issue it from Fees”; Not recorded, Unavailable and €0 drawn apart; phone, tablet and dark layouts; the Eadwyn proposals (accept, edit or discard; Eadwyn sends nothing and writes nothing).</p><h2>Pending the owner (⚑)</h2><p>None. The three questions in the brief are drawn as A, the owner’s answers Q9, Q10 and Q11 on #1008: HQ presses Issue from the start date; older licences are not invoiced automatically; a later Apply records the new initial figures on the decision only.</p></div><div><h2>Open for engineering</h2><p>The initial invoice’s reference (<code>AXAL-LIC-&lt;ref&gt;-INIT</code> is drawn as a sample) and whether its due date follows <code>payment_terms_days</code> are #5954’s to record. Main’s agreement-ack sentence says “Contract tab”; the boards say Agreement section, the Licences v2 name.</p><h2>Accessibility</h2><p>Every status carries a word and a glyph; Void is struck and worded; disabled actions keep a sentence saying why; the ack is a real checkbox with its label; phone actions are 44 px; the sheet and bottom sheet are modal dialogs with a labelled title; amounts are tabular mono with the currency printed.</p></div></div>');

    let html;
    const hq = (cur, body, o) => pg(identL(cur, o) + body, o);
    if (B === 'LFI41') html = hq('Operations', feesBody('issued'), { h: 960 });
    else if (B === 'LFI41B') html = hq('Operations', feesBody('overdue', { note: 'Sample later: Mon 21 Dec 2026 · read 09:10 UTC' }), { h: 1160, attn: '<b>1 item needs HQ</b> · Initial invoice overdue · 8 days · €58,000.00', rail: ead('Eadwyn reads this licence’s invoices and changes nothing. Eadwyn sends nothing: an accepted note is yours to send.', prop('Proposed reminder note · not sent', 'Dear A. Peeters, our records show nothing received yet for invoice ' + REF0 + ' (€58,000.00, due 13 Dec 2026). Please pay by bank transfer to Axal VC Holdings LLC quoting that reference, or let us know if payment is already on its way.', 'From the invoice row (due 13 Dec 2026, paid €0.00) and the licence’s administrator', '<button type="button" class="btn bsm">Accept as draft</button><button type="button" class="btn bsm">Edit</button><button type="button" class="btn t bsm">Discard</button>') + '<p class="foot">Accepted text is kept as a draft on this licence for HQ to send from its own mail. StudioOS sends no reminder.</p>') });
    else if (B === 'LFI42') html = hq('Operations', feesBody('ready', { noPrimary: true, note: 'Sample: Fri 13 Nov 2026 · before issue' }), { h: 1160, attn: '<b>1 item needs HQ</b> · Initial invoice not issued · pricing ' + DEC, overlay: issueSheet() });
    else if (B === 'LFI42B') html = crop('<span class="eye">Receipt · after Issue the sheet closes and the card shows the new invoice</span>' + icard('issued') + '<div style="height:64px"></div>' + toast('Issued · <b class="mo">' + REF0 + '</b> · €58,000.00 · <a href="#">Open PDF</a>'), 1300);
    else if (B === 'LFI43') html = sheetCrop('L43 · lifecycle · 1 of 2', strip('Not yet issued', 'Licence active or suspended, started, decision accepted', icard('ready')) + strip('Licence not started', 'Active, starts_on 1 Dec 2026 is after today', icard('notstarted')) + strip('No start date', 'territory_licences.starts_on is NULL', icard('nostart', { nostartDue: true })) + strip('Paid', 'Paid total equals the total', icard('paid')));
    else if (B === 'LFI43B') html = sheetCrop('L43 · lifecycle · 2 of 2', strip('Part paid', 'Paid €20,000 of €58,000', icard('part')) + strip('Voided', 'Voided with nothing paid · the slot stays used', icard('void')) + strip('Not invoiced', 'Licence draft, pending activation or terminated', icard('notbill')) + strip('Basket licence', 'Axal VC Benelux · one class per country · overridden decision', icard('basket', { decision: 'overridden 10 Nov 2026 by M. Okafor · surcharge set by HQ', noPrimary: true })));
    else if (B === 'LFI44') html = pg(identL('Operations', { lic: LL, since: 'Started 1 Nov 2026 · renews 1 Nov 2027 · Agreement v1 executed' }) + opsNav + feesHead() + noDec() + annual({ empty: true }), { h: 800 });
    else if (B === 'LFI45') html = sheetCrop('L45 · data states · 1 of 2', strip('Loading', 'Card and list load separately', loadCard() + annual({ loading: true })) + strip('Initial fee not recorded', 'accepted_initial_fee_cents is NULL', icard('nrfee')) + strip('Surcharge not recorded', 'accepted_regulatory_surcharge_cents is NULL · one line only', icard('nrsur', { noPrimary: true })));
    else if (B === 'LFI45B') html = sheetCrop('L45 · data states · 2 of 2', strip('Invoices unreadable', 'Decision read; invoice read failed', icard('invunread') + annual({ unread: true })) + strip('Decision unreadable', 'Invoice read; pricing read failed', decUnread() + annual()) + strip('Refused', 'Not a Super Admin', refusedCard()) + strip('Conflict', 'Record payment on an older revision', conflictCard()));
    else if (B === 'LFI45C') html = hq('Operations', feesBody('ready', { noPrimary: true }), { h: 1160, overlay: issueSheet('<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Not issued.</b> This licence’s terms name Axal VC Management LLC as the licensor, but the territory licence fee is paid to Axal VC Holdings LLC, so no payment instructions are given. Ask HQ to correct the terms before you pay. <span class="raw">(409 <code>licensor_not_payee</code>)</span></div></div>') });
    else if (B === 'LFI45D') html = crop('<span class="eye">L45 · Issue refusals · shown as the Worker gives them, sheet kept open</span>' + ctab(['Code', 'Sentence shown', 'Source'], [
        ['<code>initial_invoice_exists</code>', 'An initial invoice has been issued for this licence; no second one can be issued.', BK(5954) + ' new'],
        ['<code>licence_not_billable</code>', 'A pending activation licence is not invoiced. Only an active or suspended licence is.', 'main · annual issue'],
        ['<code>not_started</code>', 'This licence starts on 1 Dec 2026, so its initial invoice can be issued from then.', BK(5954) + ' new'],
        ['<code>no_start_date</code>', 'This licence records no start date, so its licence year cannot be told. Set the start date first.', 'main · annual issue'],
        ['<code>no_initial_fee</code>', 'The accepted pricing has no initial fee, so there is nothing to invoice.', BK(5954) + ' new'],
        ['<code>currency_unknown</code>', 'This licence’s currency ("") is not one StudioOS can price in, so its fee cannot be invoiced. Set the licence currency first.', 'main · annual issue'],
        ['<code>licensor_not_payee</code>', 'This licence’s terms name Axal VC Management LLC as the licensor, but the territory licence fee is paid to Axal VC Holdings LLC, so no payment instructions are given…', 'main · <code>licensorRefusal</code>'],
        ['<code>terms_unreadable</code> · 503', 'This licence’s terms could not be read, so its licensor and payment terms are unknown. Nothing was issued; try again.', 'main · route']]), 1300);
    else if (B === 'LFI46') html = studioPage(false);
    else if (B === 'LFI46B') html = studioPage(true);
    else if (B === 'LFI47') html = hq('Terms', pmNav + '<p class="raw">Sample: Thu 12 Nov 2026, the review as HQ saw it before applying. Extends L26’s Apply step.</p>' + applyCard(), { h: 1200, rail: eadApply });
    else if (B === 'LFI47B') html = crop('<span class="eye">Receipt · after Apply</span><section class="cd"><div class="nt g"><span class="ic" aria-hidden="true">✓</span><div><b>Applied · decision recorded 12 Nov 2026 14:32 by M. Okafor.</b> Core terms revision 8 · pushed to the Belgium branch.</div></div>' + ctab(['Figure', '#Now', 'Where it landed'], [['Annual fee', '€45,000', 'Core terms · invoiced from the 2027–28 licence year'], ['Royalty', '5.50%', 'Core terms'], ['Minimum royalty', '€18,000', 'Schedule § 4.4 minimum guarantee ' + BK(5953)], ['Initial fee', '€50,000', 'Decision · for the one-off initial invoice'], ['Regulatory surcharge · class high', '€8,000', 'Decision · billed once with the initial fee']]) + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><a class="btn p" href="#">Initial invoice: issue it from Fees ›</a><a class="btn" href="#">Agreement v2 may no longer match · open Agreement</a></div><p class="foot">The link opens L41/L43 on the same licence. Nothing was invoiced by Apply.</p></section>', 1100);
    else if (B === 'LFI48') html = sheetCrop('L48 · Apply review states · 1 of 2', strip('Not recorded', 'The recommendation lacks a figure', rvNR()) + strip('No recommended annual fee', 'Only Override with a typed value goes ahead', rvNoAnnual()) + strip('Agreement mismatch', 'Annual fee changes; agreement v2 exists', rvAck()) + strip('Initial invoice already issued', 'Re-apply after issue ' + BK(5954), rvIssued(false) + '<span class="eye" style="margin-top:6px">Invoices unreadable</span>' + rvIssued(true)));
    else if (B === 'LFI48B') html = rvStates();
    else if (B === 'LFI49A') html = tab(tabHead('Operations') + opsNav + feesHead('Read 14:30 UTC') + icard('issued') + annual(), 1080);
    else if (B === 'LFI49B') html = tab(tabHead('Terms') + pmNav + tabApply(), 1020);
    else if (B === 'LFI50A') html = phFees();
    else if (B === 'LFI50B') html = phIssue();
    else if (B === 'LFI50C') html = phApply();
    else if (B === 'LFI51A') html = hq('Operations', feesBody('issued'), { h: 960, dark: true });
    else if (B === 'LFI51B') html = hq('Terms', pmNav + applyCard(), { h: 1240, dark: true, rail: eadApply });
    else if (B === 'LFI52') html = handoff();
    else html = hq('Operations', feesBody('issued'), { h: 1160 });
    return { html: { __html: html } };
  }
}
