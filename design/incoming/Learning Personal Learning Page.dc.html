      <div style="display:flex;flex-direction:column;gap:8px"><span class="eye">${TO('Q3')} Super Admin with nothing assigned · option A</span>${ASSIGN_EMPTY(1)}<p class="foot">Option B: keep “Ask HQ: open a ticket” for everyone, as production does.</p></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="eye">Unavailable</span><section class="cd">${UNBLK('The programs assigned to you', 'This is not a claim that none is assigned.')}</section></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="eye">Refused · the route’s own words</span><section class="cd">${chip('rf')}<b>Not open to you</b><p style="font-size:12.5px">Programs are assigned to admins.</p><a href="#">Back to Learning ›</a><p class="foot">Seen only if the role changes during a session; the tab is not drawn for non-admins.</p></section></div></div>`);
    }

    /* =================== LPL10 · roles and eligibility =================== */
    else if (B === 'LPL10') {
      const y = '<span class="sc sc-ok">' + G.ok + 'Shown</span>', n = '<span class="foot">Not drawn</span>';
      html = crop(1400, `<div class="acts"><span class="tag">LPL-10 · who sees what, and what progress may claim</span></div><div class="g2"><section class="cd"><b>Tabs by role</b><table class="mtx"><thead><tr><th>Role being browsed</th><th>History</th><th>Plan</th><th>Programs</th><th>Assigned to you</th><th>HQ contact</th></tr></thead><tbody><tr><td>Founder, investor, partner, advisor</td><td>${y}</td><td>${y}</td><td>${y}</td><td>${n}</td><td>Programs tab: Ask HQ</td></tr><tr><td>Exploring</td><td colspan="4">Coming-soon card in place (the gate on main, learningAccess.js)</td><td>—</td></tr><tr><td>Admin</td><td>${y}</td><td>${y}</td><td>${y}</td><td>${y}</td><td>Both tabs: Ask HQ</td></tr><tr><td>Super Admin</td><td>${y}</td><td>${y}</td><td>${y}</td><td>${y}</td><td>${TO('Q3')} studio link</td></tr><tr><td>Support session</td><td colspan="4">Read as the member; every plan write refused (support_session_refused)</td><td>—</td></tr></tbody></table></section>
      <section class="cd"><b>Progress and credentials claim only what is recorded</b><ul class="ckl"><li>${G.ok}<span>Course percent comes from <code>learning_progress</code>; none recorded draws “Progress not recorded”, never 0%.</span><b class="mo">LPL02B</b></li><li>${G.ok}<span>Program progress counts the content you can open: a course or item completed, an exercise <b>accepted</b>, an exam <b>passed</b>. A submitted exercise is not counted yet.</span><b class="mo">LPL08</b></li><li>${G.ok}<span>An exam result shows the score with the pass mark only for a submitted attempt.</span><b class="mo">LPL03</b></li><li>${G.ok}<span>Next lesson comes from the resume rule and says why (“3 of 7 required lessons complete”).</span><b class="mo">LPL03</b></li><li>${G.ok}<span>A draft exam (the observed course’s exam “What can you substantiate?”, eight questions, is a draft) is never shown to a member, so it is never counted.</span><b class="mo">#8667</b></li></ul></section></div>
      <div class="g2"><section class="cd"><b>Certificates: removed</b><p class="foot" style="font-size:12.5px">Main issues no certificate and stores none. The card that read “Not recorded · Certificates are not issued for courses yet” is removed: a feature the product does not have is not drawn (ST-00).</p></section><div class="crt"><div class="acts">${TB('proposed · no issue')}<span class="syn">Not on main</span></div><b>If certificates are added: a card appears only when one is issued</b><p class="foot" style="font-size:12.5px">Example eligibility a policy would have to set: the course complete and its exam passed. Until then nothing about certificates is shown, and no learner is told they are “eligible”.</p></div></div>`);
    }

    /* =================== LPL11 · component variants =================== */
    else if (B === 'LPL11') {
      html = crop(1400, `<div class="acts"><span class="tag">LPL-11 · components</span></div><div class="g2">
      <section class="cd"><b>Tabs</b>${TABS('Plan')}${TABS('Programs', 1)}<p class="foot">Links with aria-current="page"; each tab is its own route, so Back and deep links work. Wrap order on narrow desktop: tabs scroll horizontally, never wrap.</p></section>
      <section class="cd"><b>Origin labels (plan rows)</b><div class="acts">${ogC('From course')}${ogB}${ogW}${ogX}</div><b>Program membership</b><div class="acts"><span class="og oc">${G.lock} Added by HQ</span><span class="og ob">You joined</span><span class="sc sc-in">Open to join</span></div><p class="foot">Each pairs a word with an outline; colour never carries the meaning alone.</p></section>
      <section class="cd"><b>Result and status chips</b><div class="acts">${chip('in', 'Submitted')}${chip('ok', 'Accepted')}${chip('wa', 'Needs work')}${mo('88%')} ${chip('ok', 'Pass')}${mo('62%')} ${chip('fl', 'Fail')}${chip('ok', 'Done')}<span class="foot">Planned · Not marked done · Missed · Skipped</span></div></section>
      <section class="cd"><b>Section card states</b><div class="acts">${chip('none')}${chip('nr')}${chip('un')}${chip('rf')}${chip('pt', 'Partial · 2 of 3')}${chip('st', 'Stale · read 14:05')}</div><p class="foot">An empty section on a returning History collapses into one line instead of its own card:</p><div class="quiet">Not yet: <b>videos</b> · <b>exam results</b> <a href="#">Browse courses ›</a></div></section>
      <section class="cd"><b>Long titles wrap; nothing truncates mid-word</b><div class="rows">${rw(`<a href="#"><b>[Evidence-based pitch narratives for regulated markets: what can you substantiate when your evidence comes from pilots that have not finished?]</b></a><small>Resume: [A lesson title that is also long enough to wrap onto a second line]</small>${pbar(10)}`, mo('10%'))}</div><p class="foot">Titles wrap to any number of lines (overflow-wrap: anywhere for unbroken strings); the right column keeps its width. On phone, actions move under the title.</p></section>
      <section class="cd"><b>Next for you · variants</b><div class="rows">${rw('<b>Continue a course</b><small>“3 of 7 required lessons complete.”</small>', '<span class="btn p">Continue lesson</span>')}${rw(`<b>Next in a program</b><small>“Next in ${SEED}.”</small>`, '<span class="btn p">Open</span>')}${rw('<b>Next in your plan</b><small>“In your plan for 2026-11-28.”</small>', '<span class="btn p">Open</span>')}${rw('<b>Nothing waiting</b><small>Names the three checks; no invented suggestion.</small>', '<span class="btn">Browse courses</span>')}</div></section>
      </div>`);
    }

    /* =================== LPL12 · phone 390 =================== */
    else if (B === 'LPL12A') {
      html = phone('My learning', `${PH1('History')}<section class="hero"><h2>Start with a course</h2><p class="lead">You have not started, submitted or sat anything yet.</p>${courseList(2)}<a href="#">See all 4 courses ›</a></section>`, { step: 'A · first use', stk: '<button type="button" class="btn p">Browse all courses</button>' });
    }
    else if (B === 'LPL12B') {
      html = phone('My learning', `${PH1('History')}<section class="nx"><div><span class="eye">Next for you</span><h2 style="font-size:15px;margin-top:3px">${PN}</h2><p>Lesson 6 of 10 · ${LESSON}</p><p>3 of 7 required lessons complete.</p>${pbar(43)}</div></section><section class="cd"><div class="ch"><h2 style="font-size:14px;font-weight:800">Scheduled study</h2><a href="#">Plan ›</a></div><div class="rows">${rw(`<b style="font-size:13px">${SB1}</b><small>${mo('Sat 28 Nov · 10:00')}</small>`, '')}${rw(`<b style="font-size:13px">${PN}</b><small>${mo('Tue 1 Dec · 18:00')}</small>`, '')}</div></section><section class="cd"><div class="ch"><h2 style="font-size:14px;font-weight:800">Submitted work</h2><span class="foot">2</span></div><div class="rows">${rw('<b style="font-size:13px">[Write your one-line claim]</b>', chip('in', 'Submitted'))}${rw('<b style="font-size:13px">[Interview script draft]</b>', chip('ok', 'Accepted'))}</div></section>`, { step: 'Returning', stk: '<button type="button" class="btn p">Continue lesson</button>' });
    }
    else if (B === 'LPL12C') {
      html = phone('My learning', `${PH1('Plan')}<section class="hero"><h2>Nothing planned yet</h2><p class="lead">Put a course on your calendar, or set time aside for your own study.</p></section>${ORIGINKEY}`, { step: 'B · plan empty', stk: '<button type="button" class="btn">Add a study block</button><button type="button" class="btn p">Plan a course</button>' });
    }
    else if (B === 'LPL12D') {
      html = phone('My learning', `${PH1('Plan')}`, { step: 'C · choose', sheet: BSH('Plan learning', `${fld('What to plan', 'Course', { sel: 1 })}${J(CAT.map((c, i) => `<button type="button" class="opt${i === 0 ? ' on' : ''}" style="min-height:52px"><span style="min-width:0;text-align:left"><b style="font-size:13px">${c.t}</b><small>${c.l}</small></span><span class="ch2">Choose</span></button>`))}`, '<button type="button" class="btn">Cancel</button>', { eye: 'Step 1 of 2', top: 130 }) });
    }
    else if (B === 'LPL12E') {
      html = phone('My learning', `${PH1('Plan')}`, { step: 'D · schedule', sheet: BSH('Add to my plan', `<p style="font-size:13.5px;font-weight:700">Course · ${PN}</p><div class="two">${fld('Date', '2026-12-01')}${fld('Time', '18:00')}</div><div class="two">${fld('Duration', '45 min', { sel: 1 })}${fld('Repeat', 'Every week', { sel: 1 })}</div>${fld('Until', '2026-12-15', { opt: 1 })}${fld('Reminder', '30 minutes before', { sel: 1 })}`, '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Add to my plan</button>', { eye: 'Step 2 of 2', top: 70 }) });
    }
    else if (B === 'LPL12F') {
      const n1 = Object.assign({}, R.pn1, { nw: 1, p: `Next: ${LESSON}` });
      html = phone('My learning', `${PH1('Plan')}<section class="cd"><div class="ch"><h2 style="font-size:14px;font-weight:800">Upcoming</h2><span class="foot">3</span></div><ul class="rows">${prow(n1)}${prow(Object.assign({}, R.pn2, { nw: 1, acts: '' }))}</ul></section>`, { step: 'E · back on the plan', toast: `<div class="toast" role="status" style="bottom:20px;width:350px;font-size:12px">${G.ok} Added to your plan, every Tuesday until 15 Dec.</div>` });
    }
    else if (B === 'LPL12G') {
      html = phone('My learning', `${PH1('Plan')}`, { step: 'F · study block', sheet: BSH('Plan a study block', `<p class="foot">Time for your own study. You mark it done.</p>${fld('Name', 'Read the term sheet guide', { f: 1 })}<div class="two">${fld('Date', '2026-11-28')}${fld('Time', '10:00')}</div><div class="two">${fld('Duration', '1 hour', { sel: 1 })}${fld('Repeat', 'Does not repeat', { sel: 1 })}</div>${fld('Reminder', '30 minutes before', { sel: 1 })}`, '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Add to my plan</button>', { top: 90 }) });
    }
    else if (B === 'LPL12H') {
      html = phone('My learning', `${PH1('Programs')}<section class="cd"><div class="ch"><h2 style="font-size:14px;font-weight:800">Programs you are in</h2><span class="foot">2</span></div><div class="rows">${rw(`<div class="meta"><span class="og oc">${G.lock} Added by HQ</span></div><b style="font-size:13.5px">${SEED}</b><small>${mo('2 of 5')} complete</small>${pbar(40)}`, '<a class="btn" href="#" aria-label="Open program">›</a>')}${rw(`<div class="meta"><span class="og ob">You joined</span></div><b style="font-size:13.5px">${HIRE}</b><small>None of 1 complete yet</small>`, '<a class="btn" href="#" aria-label="Open program">›</a>')}</div></section><section class="cd"><div class="ch"><h2 style="font-size:14px;font-weight:800">Open to join</h2></div>${rw(`<b style="font-size:13.5px">${OFFH}</b><small>EMEA</small>`, '<button type="button" class="btn">Join</button>')}</section><a class="btn" href="#">Ask HQ: open a ticket</a>`, { step: 'G · programs' });
    }

    /* =================== LPL13 · dark =================== */
    else if (B === 'LPL13') {
      html = shell('f', PLAN_RET(), { h: 1240 });
    }
    else if (B === 'LPL13B') {
      html = shell('f', HIST_RET(), { h: 1240 });
    }

    /* =================== LPL14 · accessibility =================== */
    else if (B === 'LPL14') {
      html = `<div class="${CV} doc"><div><span class="eye">LPL-14 · focus order, accessible names, wrapping</span><h2 style="font-size:20px;margin-top:4px">Accessibility</h2></div><div class="cols">
      <div><h3>Focus order · History</h3><ol style="list-style:decimal;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:3px"><li>Skip link, sidebar, top bar (shell, unchanged)</li><li>‹ Learning (back link)</li><li>Tabs: History, Plan, Programs (, Assigned to you)</li><li>Header action (Browse courses)</li><li>Next for you · Continue lesson (the one primary)</li><li>Main column sections, top to bottom; within a row: title link, then its actions</li><li>Side column: Scheduled study, Open your plan, Your programs, Open Programs</li></ol>
      <h3 style="margin-top:12px">Focus order · Plan</h3><ol style="list-style:decimal;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:3px"><li>‹ Learning, tabs</li><li>Add a study block, then Plan a course (primary last, as in the dialogs)</li><li>Upcoming rows: title link, then actions left to right; ⋯ is a menu button named “More actions: Mark done, Remove”</li><li>Past 30 days, then Goals</li></ol>
      <h3 style="margin-top:12px">Dialogs</h3><ul><li>Plan learning / Add to my plan / Plan a study block: role="dialog", aria-modal, labelled by its title; focus starts on the first field (Name, or What to plan).</li><li>Order in the study block dialog: Name, Date, Time, Duration, Repeat, Reminder, Goal, (Target date), Cancel, Add to my plan (LPL07 numbers 1–9).</li><li>Esc, ✕ and Cancel close and return focus to the trigger; after a save, focus moves to the first new row (tabindex −1) and a polite status announces “Added to your plan”.</li><li>Field labels are kept word for word from PlanSheet.jsx: Name, Date, Time, Duration, Repeat, Until, Reminder, Goal, Target date.</li></ul></div>
      <div><h3>Accessible names</h3><ul><li>Tabs nav: “My learning”; current tab aria-current="page".</li><li>Course links in the first-use card: “Open course: &lt;title&gt;”.</li><li>Progress bars are aria-hidden; the percent or “2 of 5 complete” is the text.</li><li>Origin labels are text (“From course”, “Study block · yours”), not icons.</li><li>Phone sheets: “Close” on ✕; the program chevron button: “Open program”.</li><li>Account button: “Account menu: … Learning (current)”.</li></ul>
      <h3 style="margin-top:12px">Status and errors</h3><ul><li>Partial banner: role="status" (the page still works). Unavailable section text: plain text with Try again; Try again re-reads only that store.</li><li>Field errors: role="alert" and aria-describedby on the field; focus moves to the first invalid field.</li><li>Join refusal sits beside the program it was for.</li></ul>
      <h3 style="margin-top:12px">Wrapping and size</h3><ul><li>Titles wrap without truncation (LPL11); dates and times are Roboto Mono and never wrap inside a value.</li><li>Phone: 44 px targets, sticky primary, sheets scroll inside; tabs become a three-part control.</li><li>Colour is never the only signal: every state has a word and a glyph or outline.</li></ul></div></div></div>`;
    }

    /* =================== LPL15 · handoff =================== */
    else if (B === 'LPL15') {
      const acc = (t, b) => `<li><span aria-hidden="true">☐</span><span>${t}</span><b class="mo">${b}</b></li>`;
      html = `<div class="${CV} doc"><div><span class="eye">LPL-15 · engineering handoff · #8668 · checked against main 7b0db10927</span><h2 style="font-size:20px;margin-top:4px">Handoff</h2></div>
      <div><h3>Design acceptance → boards</h3><ul class="ckl" style="list-style:none;padding:0">${acc('An empty history provides a direct course-discovery action without multiple empty cards.', 'LPL01, LPL01B, LPL12A')}${acc('Partial read failures stay distinct from genuine inactivity.', 'LPL02, LPL02B')}${acc('A course-linked plan item and a personal study block have clear origins and next actions.', 'LPL04, LPL04B, LPL11')}${acc('Keyboard dismissal returns focus to its trigger.', 'LPL07, LPL07B, LPL14')}${acc('Assigned-program guidance and HQ contact remain available for the appropriate role.', 'LPL08, LPL09, LPL09B, LPL10')}${acc('Examples of progress and credentials reflect actual eligibility.', 'LPL03, LPL08, LPL10')}${acc('Prompt: course selection → scheduling → back to the plan; standalone study-block dialog.', 'LPL06A–D, LPL07, LPL12D–G')}${acc('Prompt: program membership and self-enrolment kept distinct.', 'LPL08, LPL12H')}${acc('Prompt: linked desktop and 390 prototype; variants; focus, names, wrapping, empty/error.', 'LPL00, LPL11, LPL12A–H, LPL14')}</ul></div>
      <div class="cols"><div><h3>What main has (checked)</h3><ul><li><code>pages/learning/MyLearning.jsx</code>: five sections from three reads (progress, submissions, attempts), each with its own state, plus the static Certificates card.</li><li><code>LearningWired.jsx</code> MePage: <code>/me</code>, <code>/me/submissions</code>, <code>/me/attempts</code>; header link to the plan.</li><li><code>routes/learning.ts</code> GET <code>/me</code>: in_progress and completed rows; each in-progress course carries <code>resume</code> (D5356).</li><li><code>routes/learning_lists.ts</code>: submissions (submitted, accepted, needs_work) and attempts (score null until submitted, pass mark).</li><li><code>LearningPlanPage.jsx</code>, <code>PlanSheet.jsx</code> (PlanPicker, PlanSheet, AddToPlan), <code>PlanRowActions.jsx</code>, <code>learningPlanModel.js</code>; <code>routes/learning_plan.ts</code> + migration 758 (item_kind, title_override, repeat, reminder, status planned/done/skipped/missed, goal_json); GET <code>/plan/next</code> (learningNext.ts: continue_course, program, plan).</li><li><code>MyPrograms.jsx</code> on the home: enrolled with progress, Open to join with Join; <code>routes/learning_programs.ts</code> <code>/programs/enrolled</code>, <code>/programs</code>, <code>/programs/:uid/enrol</code>. No self-unenrol route.</li><li><code>LearningPrograms.jsx</code> + <code>ProgramsTable.jsx</code>: <code>/learning/programs</code> (admin), empty state with “Ask HQ: open a ticket” → <code>/help/tickets</code>.</li><li>Migration 389: <code>learning_enrollments.enrolled_by</code> (the member’s own id on a self-enrolment).</li></ul></div>
      <div><h3>Needs data or backend</h3><ul><li>${TB('#8288')} <code>/programs/enrolled</code> returns <code>enrolled_at</code> but not who enrolled: add <code>self_enrolled</code> from <code>enrolled_by = user_id</code> for “Added by HQ” / “You joined” (LPL08).</li><li>${TB('proposed')} Certificates: no table, route or policy; the card is removed until one exists (LPL10).</li><li>${TB('proposed')} Per-occurrence status for repeating items (status is per item today, so a past week reads “Not marked done”).</li></ul>
      <h3 style="margin-top:12px">Owner questions (option A drawn)</h3><ul><li>${TO('Q1')} Programs as a My learning tab at <code>/learning/my-programs</code> (A), or keep it only on the Learning home (B).</li><li>${TO('Q2')} Course-linked plan items keep Mark done in ⋯ (A), or only Learning marks them done (B).</li><li>${TO('Q3')} A Super Admin with nothing assigned sees a studio link (A), or the HQ ticket like everyone (B, production today).</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Tabs over existing routes; the first-use card and its rule (LPL02B table); removal of the Certificates card.</li><li>PlanPicker reused on /learning/plan (“Plan a course”); origin labels; Continue lesson on course rows from <code>/me</code> resume; status + focus to new rows.</li><li>“Open your plan” link after AddToPlan saves; the programs tab composed from MyPrograms.</li></ul>
      <h3 style="margin-top:12px">Coordination</h3><ul><li>#8288 release work. Siblings: #8662 home (Browse all courses lands on the catalogue), #8663 cards, #8664 overview (Add to my plan), #8665 reader (resume lesson), #8667 exam (draft exam never counted).</li></ul></div></div></div>`;
    }

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lpl-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
