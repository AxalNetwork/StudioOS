.st-dict td:nth-child(4){font:700 13px var(--mo);color:var(--mu);white-space:nowrap}
.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}

/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}

.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}

.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}

.st-rfbox{border:1px solid var(--ink);background:var(--raised)}
.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}

.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}

.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}

.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}

.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}
.st-do .st-ddl{color:var(--pos)}
/* options */

.st-opt b{font-size:15px}
.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}

.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}

.adp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.adp-kbd{margin-left:auto;font:600 10px var(--mo);color:var(--mu);border:1px solid var(--hair);border-radius:5px;padding:1px 5px}
.adp-navn{margin-left:auto;font:700 10px var(--mo);color:var(--mu);background:var(--raised);border:1px solid var(--hair);border-radius:999px;padding:0 6px}
.sd nav a{gap:6px}
/* indicators */
.adp-p-dr{color:var(--ink);background:var(--card);border-color:var(--hair2)}
.adp-p-rv{color:var(--vt);background:var(--lav);border-color:var(--lavE)}
.adp-p-sa{color:var(--amT);background:transparent;border-color:var(--amE);border-style:dashed;border-width:1.5px}
.adp-p-np{color:var(--neg);background:var(--card);border-color:var(--negE);border-style:dashed;border-width:1.5px}
.adp-r-nr{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.adp-r-pub{color:#fff;background:var(--pos);border-color:var(--pos)}
.adp-r-wd{color:var(--ink);background:var(--raised);border-color:var(--ink)}
.adp-r-ar{color:var(--mu);background:var(--raised);border-color:var(--hair)}
.adp-d-acc{color:var(--vt);background:var(--lav);border-color:var(--lavE)}
.adp-stage{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--sg);color:var(--mu);white-space:nowrap}
.adp-stage .eye{padding:0 5px;border:1px solid var(--hair);border-radius:4px}
.adp-stg2{font:600 12.5px var(--sg);color:var(--mu)}
.adp-ver{display:inline-flex;align-items:center;font:700 11px var(--mo);padding:2px 8px;border-radius:6px;border:1px solid var(--hair2);background:var(--card);color:var(--ink);white-space:nowrap}
.adp-ver.ed{border-color:var(--vi);color:var(--vt);background:var(--lav)}
.adp-ann{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mo);color:#7c3aed;background:repeating-linear-gradient(135deg,rgba(124,58,237,.07) 0 6px,transparent 6px 12px);border:1px dashed #a78bfa;border-radius:5px;padding:1px 6px;white-space:nowrap;vertical-align:middle}
.adp-pol{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mo);color:#b45309;background:#fff7ed;border:1px dashed #f59e0b;border-radius:5px;padding:1px 6px;white-space:nowrap;vertical-align:middle}
.adp-src{display:inline-flex;align-items:center;gap:4px;font:700 10px var(--mo);letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid var(--hair);background:var(--raised);color:var(--mu);white-space:nowrap;margin-right:4px}
.adp-src em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--mu)}
.adp-src-c{color:var(--vt)}.adp-src-s{color:var(--pos)}.adp-src-t{border-style:dashed}
.adp-ntb{display:flex;gap:6px;flex:none;align-items:center}
.nt .ic{font-weight:800;flex:none}
.btn.sm{min-height:28px;padding:0 10px;font-size:12px}
.btn.dng{color:var(--neg)!important;border-color:var(--negE)}
.btn.p.sm{min-height:28px}
/* page header + queue */
.adp-ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.adp-ph h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.adp-ph p{font-size:13px;color:var(--mu);margin-top:3px}
.adp-phr{display:flex;gap:10px;align-items:center}
.adp-views{display:flex;gap:4px;border-bottom:1px solid var(--hair)}
.adp-views a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 9px;font:600 13px var(--sg);color:var(--mu)!important;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.adp-views a[aria-current=page]{color:var(--ink)!important;font-weight:800;border-color:var(--vi)}
.adp-views a .mo{font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--hair);background:var(--raised)}
.adp-views.sm a{padding:7px 8px;font-size:12.5px}
.adp-fil{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adp-fb{font-weight:600}
.adp-q td{vertical-align:top;padding:11px 10px}
.adp-q td small{margin-top:2px}
.adp-vn{font-weight:800;color:var(--ink)!important}
.adp-st3{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.adp-own{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.adp-blk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mu)}
.adp-blk.a{color:var(--amT)}.adp-blk.g{color:var(--pos)}.adp-blk.r{color:var(--neg)}
.adp-nw{white-space:nowrap;font-size:12px}
.adp-qf{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--hair)}
.adp-pg{display:flex;gap:8px;align-items:center;font-size:12px}
.adp-card{background:var(--card);border:1px solid var(--hair);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.adp-ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.adp-ch h2{font-size:14px;font-weight:800}
.adp-cb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.adp-row{display:flex;align-items:center;gap:8px}
.adp-sep{height:1px;background:var(--hair);margin:4px 0}
.adp-g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.adp-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.adp-g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.adp-g2w{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.adp-side2{display:flex;flex-direction:column;gap:10px}

.adp-crop>.adp-g2,.adp-crop>.adp-g3,.adp-crop>.adp-g5,.adp-crop>.adp-card,.adp-crop>p,.adp-crop>.adp-row,.adp-crop>.adp-mstat,.adp-crop>.adp-ead,.adp-crop>section{grid-column:1/-1}
.adp-cell{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.adp-cell.sm{min-height:0}
.adp-empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 0;width:100%}
.adp-sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--skel),var(--skel2),var(--skel))}
/* workspace */
.adp-wh{display:flex;flex-direction:column;gap:8px}
.adp-crumb{display:flex;gap:6px;font:600 12px var(--sg);color:var(--mu)}
.adp-crumb a{color:var(--mu)!important}
.adp-crumb span:last-child{color:var(--ink)}
.adp-wr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}

.adp-ind{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.adp-indc{display:inline-flex;align-items:center;gap:7px}
.adp-wa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:640px}
.adp-actor{font-size:12px;color:var(--mu)}
.adp-actor b{color:var(--ink)}
.adp-tabs{gap:22px}
.adp-save{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--sg);color:var(--mu);padding:4px 9px;border-radius:7px;border:1px solid var(--hair);background:var(--card);white-space:nowrap}
.adp-save.ok{color:var(--pos);border-color:var(--posE);background:var(--posBg)}
.adp-save.bad{color:var(--neg);border-color:var(--negE);background:var(--negBg)}
.adp-save.am{color:var(--amT);border-color:var(--amE);background:var(--amBg)}
.adp-spin{width:12px;height:12px;border-radius:999px;border:2px solid var(--hair2);border-top-color:var(--vi);display:inline-block;flex:none}
.adp-ws{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.adp-ws.one{grid-template-columns:minmax(0,1fr)}
.adp-wm{display:flex;flex-direction:column;gap:14px;min-width:0}
.adp-wsd{display:flex;flex-direction:column;gap:12px}
.adp-rl{display:flex;flex-direction:column}
.adp-rl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px}
.adp-rl li:first-child{border-top:0}
.adp-rl small{display:block;color:var(--mu);font-size:11.5px}
.adp-ri{display:grid;place-items:center;width:18px;height:18px;border-radius:999px;border:1px solid var(--hair2);color:var(--mu);font-size:11px}
.adp-ri.ok{color:var(--pos);border-color:var(--posE);background:var(--posBg)}
.adp-ri.blk{color:var(--amT);border-color:var(--amE);background:var(--amBg)}
.adp-ri.un{color:var(--neg);border-color:var(--hair2);border-style:dashed;background:var(--card)}
.adp-bs{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.adp-bs.miss{border-color:var(--amE)}
.adp-bs header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adp-bs h3{font-size:13.5px;font-weight:800}
.adp-srcs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.adp-ta{border:1px solid var(--hair);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.55;background:var(--card);color:var(--ink)}
.adp-ta.fv{outline:2px solid var(--vi);outline-offset:1px}
.adp-ph2{color:var(--mu)}
.adp-lk2{font:700 11.5px var(--sg)}
.adp-bs .foot{display:flex;align-items:center;gap:5px;color:var(--amT)}
.adp-h2{font-size:15px;font-weight:800}
/* terms */
.adp-tr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-top:1px solid var(--hair);align-items:start}
.adp-tr:first-child{border-top:0}
.adp-tr label{font-size:12.5px;font-weight:600;padding-top:6px}
.adp-tv{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.adp-ts{grid-column:2}
.adp-ts:empty{display:none}
.adp-in{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border:1px solid var(--hair2);border-radius:8px;background:var(--card);font-size:13px;color:var(--ink);min-width:180px}
.adp-in.err{border-color:var(--neg);border-width:1.5px}
.adp-cur{font:700 10px var(--mo);color:var(--mu)}
.adp-req{color:var(--neg);font-weight:800}
.adp-fe{display:flex;align-items:center;gap:5px;color:var(--neg);font-size:12px;font-weight:600}
.adp-cmp{display:flex;flex-direction:column;gap:8px}
.adp-cmp dl,.adp-kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:12.5px}
.adp-cmp dt,.adp-kv dt{color:var(--mu)}
.adp-kv dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* evidence */
.adp-evh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.adp-acc{font-size:12px;display:inline-flex;align-items:center;gap:5px}
.adp-acc.nda{color:var(--ink);font-weight:600}
.adp-drw{position:absolute;top:0;right:0;bottom:0;width:480px;background:var(--card);border-left:1px solid var(--hair);box-shadow:-20px 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:9}
.adp-pkl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--hair);font-size:12.5px}

/* audience */
.adp-aud li{display:grid;grid-template-columns:minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair);font-size:12.5px}
.adp-aud li:first-child{border-top:0}
.adp-aud small{display:block;color:var(--mu);font-size:11px}
.adp-disc{display:flex;justify-content:space-between;align-items:center;gap:10px}
.adp-disc small{display:block;color:var(--mu);font-size:11.5px}
.adp-ap{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px solid var(--hair);justify-items:start}
.adp-ap:first-child{border-top:0}
/* review */
.adp-cmph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.adp-tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.adp-diff th[scope=row]{font:600 12.5px var(--sg);text-transform:none;letter-spacing:0;color:var(--ink);white-space:normal}
.adp-chg{background:var(--amBg)}
.adp-mat{font:700 9.5px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--amT);border:1px solid var(--amE);border-radius:4px;padding:0 4px;white-space:nowrap}
