    else if (B === 'NOF10') html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ acts: `<button type="button" class="btn ask">${E}Ask</button><button type="button" class="btn p">Request introduction</button>` })}
      ${PSW.replace('class="pswb"', 'class="pswb" style="max-width:320px"')}${PFIG}
      ${PSRCH('harbor')}<p class="foot" role="status">${mo('2')} of ${mo(K.orgs)} organizations · ${mo('10')} people · <button type="button" class="lk">Export…</button></p>
      <div class="g2" style="align-items:start">${ocard(ORGS[0])}${ocard(ORGS[2], { open: 1 })}</div></main></div>`;

    /* ===== FN3.11 · Dark ===== */
    else if (B === 'NOF11') html = shell(SEARCH({ foc: '[Harbor Seed]', ann: false }), { h: 1000 });
    else if (B === 'NOF11B') html = phone('Organizations', `${PSW}${PSRCH('harbor')}<p class="foot" role="status">${mo('2')} of ${mo(K.orgs)} organizations · ${mo('10')} people · <button type="button" class="lk">Export…</button></p>${ocard(ORGS[0])}${ocard(ORGS[2], { open: 1 })}`, null, { back: 1 });

    /* ===== FN3.12 · Prototype, keyboard and focus ===== */
    else if (B === 'NOF12') html = `<div class="${CV} doc"><div><span class="eye">Network · Organizations · founder · #7051 · prototype</span><h2 style="font-size:22px;margin-top:4px">The task flow, where focus goes, and what is announced</h2></div>
      <table class="tbl"><thead><tr><th scope="col">#</th><th scope="col">Step</th><th scope="col">Frame (desktop · phone)</th><th scope="col">Control</th><th scope="col">Focus goes to</th><th scope="col">Announced (polite)</th></tr></thead><tbody>
      ${J([
        ['1', 'Pick the startup', 'FN3.6 · NOF06 · phone NOF09A', 'Project switcher, top left (phone: Startup button)', 'The search field', '“Organizations for [Kelp Bio]: 41 organizations, 187 people.”'],
        ['2', 'Search a company', 'FN3.2 · NOF02 · NOF09B', 'Search organizations (filters as you type, 250 ms)', 'Stays in the field', '“2 of 41 organizations match harbor.”'],
        ['3', 'Open its people', 'FN3.2 · NOF02 · NOF09B', 'Show 4 people ▾ (Enter or Space)', 'Stays on the button, now Hide people', '“4 people at [Harbor Seed].”'],
        ['3a', 'Inspect a shared strongest tie', 'FN3.1 · NOF01B', '2 people share it', 'The popover heading; Esc returns to the button', '—'],
        ['4', 'Open one contact', 'FN3.3 · NOF03 · NOF09C', 'Open (row button)', 'The sheet heading; focus is trapped in the sheet', '—'],
        ['5', 'Return', 'FN3.4 · NOF04 · NOF09D', '✕, Esc, or the back link', 'The same Open button on [Ada Okafor]’s row', '“Back to Organizations · harbor · [Harbor Seed].”'],
        ['6', 'Fix a missing organization', 'FN3.8 · NOF08', 'No organization → Set it in the relationship book', 'The first Organization field; Back to Organizations restores step 2', '“27 contacts with no organization.”'],
        ['7', 'Export the result', 'FN3.5 · NOF05 · NOF09E', 'Export…', 'The first scope option; Cancel returns to Export…', '“Exported 10 people.”']
      ].map((r) => `<tr><td class="mo">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`))}</tbody></table>
      <div class="cols"><div><h3>What is restored on return</h3><ul><li>The startup, the search text, the view and the table page are in the URL: <code>?project_id=41&amp;q=harbor&amp;page=1&amp;open=[Harbor Seed]</code>. A reload or Back gives the same list.</li><li>The open company stays open. The row and scroll position are kept because the sheet opens over the list rather than replacing it.</li><li>Focus returns to the control that opened the sheet. If that row is gone after an edit (the organization was changed), focus goes to the list heading and the change is announced.</li><li>On phone the contact is a full page. Back returns to the card with the company open and focus on the same Open button.</li></ul></div>
      <div><h3>Keyboard order (desktop)</h3><ul><li>Project switcher → Network links → Ask → Request introduction → search → view → Export… → table rows (people disclosure, then Inspect when shown) → pager.</li><li>Inside an open company: each person’s Open button in list order, then the next organization row.</li><li>Every control shows a 2px violet focus ring (drawn on the focused controls in NOF02, NOF04, NOF06, NOF09D).</li><li>Phone: every target is at least 44px; the rows are labelled cards with no horizontal scrolling.</li></ul>
      <h3 style="margin-top:12px">Screen readers</h3><ul><li>The table has column headers; each disclosure has <code>aria-expanded</code> and controls a labelled region.</li><li>Counts that are not known yet read “Counting” or “Could not be read”, never 0.</li><li>Strength is a word with a dot pattern; colour never carries it alone.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NOFH') html = `<div class="${CV} doc"><div><span class="eye">Network · Organizations · founder · #7051 · handoff</span><h2 style="font-size:22px;margin-top:4px">Data source, what each count means, what the frontend can do now, and what needs the backend</h2></div>
      <div class="cols"><div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>routes/contacts.ts</code> <code>GET /api/contacts</code>: founder only. <code>project_id</code> is a server filter inside the authorized scope and before <code>LIMIT</code> (403 <code>project_not_authorized</code>). Keyset cursor, <code>limit</code> default and maximum 200, <code>has_more</code>, <code>next_cursor</code>. <code>total</code> and per-audience <code>counts</code> cover the whole filtered set.</li>
      <li>There is no <code>organization</code> or search parameter and no per-organization aggregate.</li>
      <li><code>GET /api/contacts/:uid</code> returns the contact with its replies and tasks. <code>PUT /api/contacts/:uid</code> saves strength and organization (trimmed, 200 characters, blank clears) and stamps <code>last_activity_at</code> on every edit.</li>
      <li><code>pages/founder/FounderNetworkOrganizations.jsx</code> still calls <code>api.contactsList()</code> with no <code>project_id</code>. It reads one page (the newest 200 across every startup) and filters it in the browser. A startup whose contacts are older shows as empty, and the counts and export describe that page.</li>
      <li>It has no search, no people per organization, no late-response guard, and Export writes only <code>groups</code> from that page (<code>zoneActionBuilder</code> “· this view”).</li>
      <li><code>FounderNetworkRelationships.jsx</code> already sends <code>project_id</code>, keeps <code>total</code> apart from the page and loads more by cursor. Its <code>ContactProfileEditor</code> edits strength and organization in place.</li>
      <li><code>lib/networkBook.js</code>: <code>organizationOf</code> reads <code>organization</code>, then <code>company</code>, then <code>firm</code>, never an email domain. <code>STRENGTHS</code> is Strong, Warm, Cool.</li>
      <li><code>founderZoneActions.js</code> still says “no field on it names an organisation”. That note is out of date since migration 386.</li></ul>
      <h3 style="margin-top:12px">What each figure means</h3><ul><li><b>Organizations</b>: distinct organization strings on this startup’s contacts, as entered. 41.</li><li><b>People with an organization</b>: contacts with a non-blank organization. 187 of 214.</li><li><b>No organization</b>: 27. 187 + 27 = 214, the Worker’s <code>total</code>.</li><li><b>People in a row</b>: contacts with exactly that string.</li><li><b>Strongest recorded tie</b>: the highest of Strong, Warm, Cool in the group. When several people share it, the count is shown with Inspect. When nobody has a rating, it reads Not recorded.</li><li><b>Last record activity</b>: the newest <code>last_activity_at</code> in the group. Edits move it, so it is not called Last interaction. Last interaction is the newest logged reply, and only the contact sheet shows it.</li><li><b>Range</b> (1–10 of 41) is the table page. The figures above it always cover the whole startup. The export scope says which of the two it writes.</li></ul></div>
      <div><h3>Frontend only (can ship on main’s routes)</h3><ul><li>Send <code>project_id</code>. Walk <code>next_cursor</code> until <code>has_more</code> is false, then group. Until then, counts read Counting and Export waits.</li><li>Tag each read with the startup and a serial. Drop an answer for a startup that is no longer selected.</li><li>Search, views, disclosure rows, Inspect, the contact sheet over <code>GET /:uid</code>, and edits through <code>PUT /:uid</code>.</li><li>Keep startup, <code>q</code>, view, page and the open row in the URL. Return focus to the opener.</li><li>Export the whole filtered result from the walked set, with the scope named in the dialog.</li><li>Distinct empty, no-match and could-not-be-read states. Correct the out-of-date zone note.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇ #7051)</h3><ul><li>An aggregate <code>GET /api/contacts/organizations?project_id=&amp;q=</code> with name, people, strongest strength, the strength’s count, newest activity, plus the mapped and missing counts. Without it, a startup with thousands of contacts needs many page reads before anything is counted.</li><li>An <code>organization</code> filter on <code>GET /api/contacts</code>, including <code>none</code>, for the people in a group and for “No organization” in the relationship book (FN3.8).</li><li>Server-side export of the same scope when the walk is too large.</li></ul>
      <h3 style="margin-top:12px">Tests the brief asks for</h3><ul><li>200 newer contacts in startup A and one older contact in B: B shows its one organization.</li><li>One startup with more than 200 contacts: [Harbor Seed] lists [Priya Nair] from page 2.</li><li>Switching startup while a read is pending: the late answer is dropped.</li></ul>
      <h3 style="margin-top:12px">Preserved and open</h3><ul><li>The approved Network shell and header, the four links, the Person Sheet look, NW5 state words, and Eadwyn as the only rail. Investor organizations stay NW4 and NW4.1 (#6256). HQ’s read-only own book stays NW11. This page shows only the founder’s startups.</li><li>No owner pick is open. Spelling variants are never merged here.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nof-') === 0 ? x : 'nof-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
