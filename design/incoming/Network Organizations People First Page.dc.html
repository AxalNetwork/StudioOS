      <h3 style="margin-top:12px">Open</h3><ul><li>Who staffs “Help identify the right person”, and how fast (#7678).</li><li>Section ids are NPO-01 onward; the landed FN3.x and NW4.x boards keep theirs.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => (x.indexOf('noi-') === 0 || x.indexOf('npo-') === 0 || x.indexOf('st-') === 0) ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
