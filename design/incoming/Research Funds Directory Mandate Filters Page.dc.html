.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--lav);color:var(--vt);font:700 10.5px var(--mo);vertical-align:1px;border:1px solid var(--lavE)}

.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th,.cmp td{padding:9px 12px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}

.prop{border:1.5px dashed #a78bfa;border-radius:12px;background:var(--lav);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--vt)}
.prop b{color:var(--ink)}
.ptag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;border:1px dashed #a78bfa;font:700 10px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--vt);background:var(--lav)}
.vstep{display:flex;flex-direction:column;gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}

.vstep li.on{background:var(--lav)}
.vstep li.on i{background:#7c3aed;border-color:#7c3aed;color:#fff}
.brief{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:28px 34px;display:flex;flex-direction:column;gap:14px;font-size:13.5px;line-height:1.6}
.brief h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brief h3{font-size:15px;font-weight:800;margin-top:6px}
.brief .rv2{display:flex;align-items:center;gap:8px;font:600 11.5px var(--mo);color:var(--mu)}
.dest{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dest label{border:1px solid var(--hair);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;background:var(--card)}
.dest label.on{border:2px solid #7c3aed;background:var(--lav)}
.dest label.off{opacity:.6;border-style:dashed}
.dest b{font-size:13.5px}
.dark-fix .stt.ok{background:transparent}
.pc>.stt,.pc>.nr,.cd>.stt{align-self:flex-start}

.st-bh{display:flex;gap:14px;align-items:flex-start}
.st-bh h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.st-bh p{font-size:13px;color:var(--mu);margin-top:4px;max-width:1060px;line-height:1.55}
.st-id{font:700 11px var(--mo);padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap;margin-top:2px}
.st-sec{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px}
.st-sh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.st-note{font-size:12px;color:var(--mu)}
.st-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st-sep{width:1px;height:20px;background:var(--hair2);margin:0 6px}
.st-gray{filter:grayscale(1)}
/* chips */
.st-c{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font:700 11px var(--sg);line-height:1.6;white-space:nowrap;border:1px solid var(--hair);background:var(--raised);color:var(--mu);vertical-align:middle}
.st-c svg{flex:none}
.st-nr{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-na{color:var(--mu);background:transparent;border-color:transparent;padding-left:2px}
.st-un{color:var(--ink);background:var(--card);border-color:var(--hair2);border-style:dashed;border-width:1.5px}
.st-un svg{color:var(--neg)}
.st-rf{color:var(--ink);background:var(--raised);border-color:var(--ink);border-width:1px}
.st-stale{color:var(--amT);background:transparent;border-color:var(--amE);border-style:dashed;border-width:1.5px}
.st-part{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-pv{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dashed;border-width:1.5px;font-style:italic}
.st-nc{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-l-ok{color:var(--pos);background:var(--posBg);border-color:var(--posE)}
.st-l-am{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-l-mu{color:var(--mu);background:var(--raised);border-color:var(--hair2)}
.st-l-fl{color:#fff;background:var(--neg);border-color:var(--neg)}
.st-retry{display:inline-flex;align-items:center;gap:4px;font:700 11.5px var(--sg);color:var(--vt);background:transparent;border:0;padding:2px 4px;border-radius:6px;vertical-align:middle}
.st-unin{display:inline-flex;align-items:center;gap:4px;color:var(--neg);font-weight:800}
.st-nrin{color:var(--mu);font-style:italic;font-weight:600}
.st-nain{color:var(--mu)}
.st-why{display:block;font-size:12px;color:var(--mu);line-height:1.45}
.st-route{font:700 12px var(--sg)}
.st-zero{color:var(--ink)!important;font-weight:800}
.st-cellnr{color:var(--mu)}
.st-stack{font:800 20px var(--mo);letter-spacing:-.02em}
.st-eng{display:inline-flex;font:700 11px var(--mo);color:var(--vt);background:var(--lav);border:1px dashed var(--lavE);border-radius:6px;padding:1px 6px}
.st-spec{font:500 11px var(--mo)}
/* tiles */
.st-tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.st-t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.st-tw{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-cap2{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.st-tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px;min-height:150px;align-items:flex-start}
.st-tl{font-size:12px;color:var(--mu);font-weight:600}
.st-tv{font:800 26px var(--mo);letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.st-ts{display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:12px}
.st-tna{opacity:1}
.st-big-nr{color:var(--mu);font-weight:500}
.st-big-un{display:inline-grid;place-items:center;width:30px;height:30px;border:1.5px dashed var(--hair2);border-radius:8px;font:800 18px var(--sg);color:var(--neg)}
.st-big-rf{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:8px;font:700 18px var(--sg);color:var(--ink);background:var(--raised)}
.st-provv{color:var(--mu);font-style:italic}
.st-wh{font:700 15px var(--sg);color:var(--mu);font-style:italic}
.st-withheld{border-style:dashed}
.st-mini{min-height:120px}
.st-sk{display:inline-block;height:12px;border-radius:5px;background:var(--skel)}
/* prose */
.st-prose{font-size:14px;line-height:1.7;padding:6px 0;border-bottom:1px solid var(--hair)}
.st-prose:last-child{border-bottom:0}
/* tables */
.st-tb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}
.st-tb th{text-align:left;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
.st-tb td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.st-tb .n{text-align:right;font-family:var(--mo)}
.st-tb code,.st-dict code,.st-sec code,.st-bh code,.st-rules code,.st-opt code,.st-foot2 code{font:500 11px var(--mo);background:var(--raised);border:1px solid var(--hair);padding:0 4px;border-radius:4px}
.st-dict{background:var(--card);border-radius:12px;overflow:hidden}
.st-dict td:first-child{font-weight:800;white-space:nowrap}
.st-dict td:first-child small{display:block;font:600 10px var(--mo);color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.st-dict td:nth-child(4){font:700 13px var(--mo);color:var(--mu);white-space:nowrap}
.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}
.st-foot2 b{color:var(--ink)}
/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.st-list li:first-child{border-top:0}
.st-list li>span:first-child{display:flex;flex-direction:column}
.st-list small{font-size:12px;color:var(--mu)}
.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.st-lbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-lbh b{font-size:14px}
.st-cnt{font:700 11px var(--mo);padding:1px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);color:var(--ink)}
.st-none{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:9px;background:var(--raised);font-size:13px}
.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}
.st-unbox{border:1.5px dashed var(--hair2);background:var(--card)}
.st-unbox svg{color:var(--neg);margin-top:3px}
.st-unbox div,.st-rfbox div{display:flex;flex-direction:column;gap:3px;flex:1}
.st-unbox span,.st-rfbox span{color:var(--mu)}
.st-rfbox{border:1px solid var(--ink);background:var(--raised)}
.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st-chh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-chh b{font-size:14px}
.st-ch svg{font-family:var(--sg)}
.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}
.st-ch2 h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st-comp .st-tile{background:var(--raised)}
.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}
.st-prov{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:500 11.5px var(--mo);color:var(--mu)}
/* phone */
.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}
.st-plist{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}
.st-plist>div:first-child{border-top:0}
.st-plist span{font-size:12.5px}
/* do / don't */
.st-dd{display:flex;flex-direction:column;gap:8px}
.st-ddt{font:800 14px var(--sg)}
.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}
.st-do .st-ddl{color:var(--pos)}
/* options */
.st-opt{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.st-opt p{font-size:12.5px;line-height:1.55;color:var(--mu)}
.st-opt b{font-size:15px}
.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}
.st-whyi{font-size:12px;color:var(--mu)}
.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}
/* Research Funds 1/5 (#7031) — RFD boards. New classes only; reuses rs_extra, st_extra and sgn_extra. */
.rfd-pg{position:relative;overflow:hidden}
.rfd-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rfd-tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1.5px dashed #a78bfa;background:var(--lav);color:var(--vt);font:700 10.5px var(--mo);letter-spacing:.02em;white-space:nowrap;vertical-align:middle;margin:0 2px}
.rfd-pol{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1.5px solid var(--amE);background:var(--amBg);color:var(--amT);font:700 10.5px var(--mo);vertical-align:middle;margin:0 2px}
.rfd-fe{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--hair2);background:var(--raised);color:var(--mu);font:600 10.5px var(--mo);white-space:nowrap;vertical-align:middle;margin:0 2px}
.rfd-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:#7c3aed;color:#fff;font:800 11px var(--mo);vertical-align:middle;flex:none}
.rfd-ann{border:1.5px dashed #a78bfa;border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.7;color:var(--ink);background:var(--card)}
.rfd-ann code,.rfd-sgnote code{font:500 11px var(--mo)}
.rfd-foc{outline:2px solid #7c3aed!important;outline-offset:2px}
.rfd-on{display:inline-flex;align-items:center;gap:4px;color:var(--pos);font:700 11.5px var(--sg)}
.rfd-ok{display:inline-flex;align-items:center;gap:6px;color:var(--pos);font:700 12.5px var(--sg)}
.rfd-ok a{color:var(--vt)!important;text-decoration:underline}
.rfd-live:empty{display:none}
.rfd-live{font-size:12px;color:var(--pos);font-weight:600}
/* tabs */
.rfd-tabs{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair)}
.rfd-tl{display:flex;gap:4px}
.rfd-tl button{display:inline-flex;align-items:center;gap:7px;padding:9px 12px 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:600 13.5px var(--sg);color:var(--mu)}
.rfd-tl button[aria-selected=true]{color:var(--ink);font-weight:800;border-color:#7c3aed}
.rfd-tl button span{font:600 11px var(--mo);color:var(--mu)}
.rfd-url{font-size:11.5px;color:var(--mu);padding-bottom:8px}
.rfd-url code{font:500 11px var(--mo);color:var(--ink)}
.rfd-url b{color:var(--vt)}
/* search and filters */
.rfd-sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:end}
.rfd-q{display:flex;flex-direction:column;gap:5px;grid-column:1/2}
.rfd-ql{font:700 12px var(--sg);color:var(--ink)}
.rfd-qi{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border:1.5px solid var(--hair2);border-radius:10px;background:var(--card);font-size:14px}
.rfd-qi .mu{color:var(--mu)}
.rfd-sort{display:flex;flex-direction:column;gap:5px;grid-column:2/3;grid-row:1}
.rfd-sort small,.rfd-dd small{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.rfd-fl{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.rfd-dd{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 12px;border:1px solid var(--hair2);border-radius:10px;background:var(--card);color:var(--ink);font:600 12.5px var(--sg);text-align:left}
.rfd-fl .rfd-dd{flex-direction:column;align-items:flex-start;gap:0;position:relative;padding-right:28px;min-width:150px}
.rfd-fl .rfd-dd i{position:absolute;right:11px;top:13px;font-style:normal;color:var(--mu)}
.rfd-dd b{font-weight:700}
.rfd-dd i{font-style:normal;color:var(--mu)}
.rfd-dd.on{border-color:var(--lavE);background:var(--lav)}
.rfd-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rfd-cl{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-right:2px}
.rfd-chips .fc button{border:0;background:transparent;color:inherit;min-width:22px;min-height:22px;border-radius:999px}
.rfd-cnt{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rfd-cnt h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.rfd-cnt .mo{font-family:var(--mo)}
.rfd-sp{flex:1}
.rfd-ex{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);margin-top:-6px}
.rfd-ex a{color:var(--vt)!important;font-weight:700;text-decoration:underline}
/* results table */
.rfd-tw{padding:0!important;gap:0!important;overflow:hidden}
.rfd-t td{vertical-align:top;padding:10px 12px}
.rfd-t td.w{padding-top:12px}
.rfd-vh{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rfd-vn{border:0;background:transparent;padding:0;font:700 13.5px var(--sg);color:var(--ink);text-align:left;border-radius:4px}
.rfd-vh small{font-size:11.5px;color:var(--mu);display:flex;gap:4px;align-items:center}
.rfd-vh .rfd-tag{margin:2px 0}
.rfd-sz{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mo);white-space:nowrap}
.rfd-sz b{font-weight:600;font-size:13px;color:var(--ink)}
.rfd-sz i{font-style:normal;font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.04em}
.rfd-fo{max-width:230px;color:var(--mu);font-size:12px;line-height:1.45}
.rfd-cite{font:500 11px var(--mo);color:var(--mu);line-height:1.5}
.rfd-cite b{color:var(--ink);font-weight:600}
.rfd-why{font-size:12px;line-height:1.5;max-width:380px}
.rfd-pg2{display:flex;gap:6px;justify-content:flex-end}
.rfd-pg2 [aria-current]{border-color:#7c3aed;background:var(--lav);color:var(--vt)!important}
/* disclosure */
.rfd-dsc{padding:0!important;gap:0!important}
.rfd-dh{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 18px;border:0;background:transparent;text-align:left;color:var(--ink)}

    else if (B === 'RFD14C') html = phone('Funds', ptabs + pcard(D.hp, { sel: 1 }), { sheet: psheet('<div class="rfd-psh"><div class="rfd-psr"><div><span class="eye">Manager</span><h2 id="ps-t">' + D.hp.n + '</h2><small class="mu">A manager record · based in United Kingdom</small></div><button type="button" class="ib" aria-label="Close record details">✕</button></div>'

      + '<div class="rfd-psf"><button type="button" class="btn p" style="width:100%;min-height:48px">Save to shortlist</button></div>', 560) });

    /* ================= RFD15 dark ================= */

    /* ================= RFD16 keyboard ================= */
    else if (B === 'RFD16') html = dk('<h1>Keyboard, focus and announcements · the new controls</h1><p>Extends RFD-06; its order before and after these controls is unchanged.</p>' + tbl(['#', 'Element', 'Accessible name / role', 'Keyboard', 'Focus after'], [

      ['RFD-08', 'Stage, Invests in and Cheque filters with counts; the lines that say what each leaves out; Show them', '<code>GET /api/research/fund-directory</code> today: five filters, <code>size_band=none</code> as Show them (D7166 part 2); <code>stage</code> answers 400 (<code>researchFundDirectory.ts:233</code>)', tag('#7749 stage, invests_in, cheque, cheque_currency, =none, =worded, facets') + ' over ' + tag('#7743') + ', rows via ' + tag('#7751') + ' · build #7756'],
      ['RFD-09', 'The mandate on a row with a source chip and year; the cheque as stated; mandate coverage', '<code>research_fund_vehicle_facts</code> exists with no rows and no writer; list rows carry no <code>proposed</code>', tag('#7749 mandate, coverage.mandate') + tag('#7748 qualifier') + ' · build #7756'],
      ['RFD-10', 'Kind word, Kind filter and facet, count line and heading by kind, Sheet header for a manager, search label', '<code>matchLine</code> (<code>fundDirectoryRead.js</code>) says “fund vehicles match” for every row, manager rows included (D7326); search is <code>name LIKE</code> only (<code>:365</code>)', tag('#7744 record_kind') + tag('#7749 search') + ' · build #7758'],

      ['RFD-13 to 16', 'States, phone, dark, keyboard', 'as above; Refused is the existing role guard, worded as RFD-05', 'Both builds']])
      + '<div class="cols"><div><h2>Handoff path</h2><p>A row opens the Sheet, then the profile at <code>/research/funds/catalog/:id</code>. Back to results restores every filter, the new ones included (stage, invests_in, cheque, cheque_currency, kind), the sort, the page and the selected row. ' + fe('frontend: extend queryFromSearch / searchFromQuery') + '</p>'
      + '<h2>Eadwyn rail (#5130)</h2><p>Not redrawn; the collapsed spine stays. Its task for this page: from a sentence the founder types about their round, Eadwyn proposes a set of filter chips, shown unsaved; the founder applies, edits or discards them. Eadwyn never states a fund’s stage, place or cheque. ' + tag('no issue yet') + '</p></div>'
      + '<div><h2>Owner questions (option A drawn)</h2><p>' + pol('Q1 = #7738 Q5') + ' A cheque that is not a range or bound is counted as cannot be compared, with Show them.<br>' + pol('Q2 = #7738 Q6') + ' No mark on a row; age in words; “Old statement” on the profile only. B and C on RFD-12C.<br>' + pol('Q3 = #7738 Q7') + ' Count line by kind; phone button “Show N records”.<br>' + pol('#7740 Q3') + ' Accelerator and resource rows drawn conditional.</p><h2>Preserved</h2><p>RFD-02’s table, filter row, Sheet and phone sheet; Save to shortlist as the one primary; EUR-and-USD sizes and Show them; Not recorded with reasons; the citation; the role guard.</p></div></div>');

    else html = page(dir8(), { h: 1420 });
