<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "900px"}, "board": {"editor": "enum", "default": "IEP8", "options": ["IEP8", "IEP8B", "IEP9A", "IEP9B", "IEP9C", "IEP9D", "IEP9E", "IEP9F", "IEP9G", "IEP10", "IEP10B", "IEP10C", "IEP11A", "IEP11B", "IEP11C", "IEP11D", "IEP11E", "IEP12", "IEP12B", "IEPDOC"]}}'>
class Component extends DCLogic {
  renderVals() {
    const B = this.props.board || 'IEP8';
    const dark = /^IEP12/.test(B);
    const P = dark
      ? { bg: '#0b1220', card: '#111827', raised: '#1f2937', ink: '#e5e7eb', mu: '#9ca3af', hair: '#374151', hair2: '#4b5563', vi: '#a78bfa', vt: '#c4b5fd', lav: 'rgba(167,139,250,.12)', lavE: 'rgba(167,139,250,.4)', pos: '#34d399', posBg: 'rgba(52,211,153,.1)', posE: 'rgba(52,211,153,.4)', neg: '#f87171', negBg: 'rgba(248,113,113,.1)', negE: 'rgba(248,113,113,.45)', amT: '#fcd34d', amBg: 'rgba(245,158,11,.1)', amE: 'rgba(245,158,11,.45)', amD: '#f59e0b', dim: 'rgba(3,7,18,.66)', skel: '#1f2937', skel2: '#273244', pbtn: '#7c3aed' }
      : { bg: '#f4f3f7', card: '#ffffff', raised: '#f8f7fb', ink: '#18181b', mu: '#5f5a6b', hair: '#e7e5ee', hair2: '#d3d0dc', vi: '#7c3aed', vt: '#6d28d9', lav: '#f3effe', lavE: '#ddd2fb', pos: '#047857', posBg: '#ecfdf5', posE: '#a7f3d0', neg: '#b91c1c', negBg: '#fef2f2', negE: '#fecaca', amT: '#92400e', amBg: '#fffbeb', amE: '#fcd34d', amD: '#d97706', dim: 'rgba(24,24,27,.42)', skel: '#ebe9f1', skel2: '#f4f3f7', pbtn: '#7c3aed' };

    const bell = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

    /* ---------- Platform States glyphs and chips (ST-00 to ST-14, D5129) ---------- */
    const SV = (d) => '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12">' + d + '</svg>';
    const G = {
      nr: SV('<path d="M2 6h8" stroke="currentColor" stroke-width="1.8"/>'),
      un: SV('<path d="M6 1.6v6" stroke="currentColor" stroke-width="2.2"/><circle cx="6" cy="10.2" r="1.2" fill="currentColor"/>'),
      rf: SV('<circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 9.2l6.4-6.4" stroke="currentColor" stroke-width="1.6"/>'),

      ok: SV('<path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2"/>'),
      pd: SV('<circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 3.2V6l1.9 1.3" fill="none" stroke="currentColor" stroke-width="1.5"/>'),
      ring: SV('<circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.6"/>'),
      re: SV('<path d="M9.8 4.4A4.2 4.2 0 1 0 10 7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 1.6v3.2H7.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'),
      x: SV('<path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="2.2"/>')
    };
    const K = {
      nr: ['st-nr', 'nr', 'Not recorded'], un: ['st-un', 'un', 'Unavailable'], rf: ['st-rf', 'rf', 'Refused'], part: ['st-part', 'part', 'Partial'],
      inf: ['iep-sinf', 'pd', 'In formation'], nay: ['iep-snay', 'ring', 'Not a company yet'], ninc: ['iep-sninc', 'ring', 'Not incorporated yet'], inc: ['iep-sinc', 'ok', 'Incorporated'],
      act: ['iep-sact', '', 'Active'], fail: ['iep-sfail', 'x', 'Save failed'], saving: ['iep-ssav', 'pd', 'Saving…']
    };
    const chip = (k, label) => { const x = K[k]; return '<span class="st-c ' + x[0] + '">' + (x[1] ? G[x[1]] : '') + (label || x[2]) + '</span>'; };
    const NR = '<span class="iep-nr">' + G.nr + 'Not recorded</span>';
    const retry = (s) => '<button type="button" class="st-retry">' + G.re + (s || 'Try again') + '</button>';

    /* ---------- annotations (not product copy) ---------- */
    const ENG = (t) => '<span class="iep-eng" title="Needs backend work">◇ ' + t + '</span>';
    const FLAG = (t) => '<span class="iep-flag" title="Owner decision, drawn as option A">⚑ ' + t + '</span>';
    const ADD = (t) => '<span class="iep-addl">' + (t || 'Added') + '</span>';
    const FS = ENG('#6685 formation state');
    const CO = ENG('#6687 ?company= and a company-subject order');

    /* ---------- sample record (fictional, the PF canvas names; every board reads these) ---------- */
    const ME = '[Avery Stone]', ADM = '[Jordan Reyes]';
    const KS = '[Kestrel Studio]', MF = '[Marlow Foods]', NW = '[Northwind Labs Inc.]', BF = '[Bluefern Health Lda]', HR = '[Harbor Robotics GmbH]';
    const LA = '[Lantern]', TW = '[Tidewater]', OR = '[Orbit]', AP = '[Atlas Pilot]';
    const ORD_HR = '412', ORD_OR = '418';
    const NW_LEGAL = [['Legal name', NW], ['Legal form', 'Corporation'], ['Country', 'United States · Delaware'], ['Registration number', '<span class="mo">[7741902]</span>'], ['Incorporation date', '<span class="mo">12 Mar 2024</span>']];
    const HR_LEGAL = [['Legal name', HR], ['Legal form', 'GmbH'], ['Country', 'Germany'], ['Registration number', NR], ['Incorporation date', NR]];
    const BLANK = [['Legal name', NR], ['Legal form', NR], ['Country', NR], ['Registration number', NR], ['Incorporation date', NR]];

    /* ---------- shell (#3704): switcher top-left, licence-union sidebar, Account menu, the one Eadwyn rail collapsed ---------- */
    const NAV = ['Home', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'];
    const mark = (ini, kind) => '<span class="iep-mk ' + (kind || 'c') + '" aria-hidden="true">' + ini + '</span>';
    const side = (sel, ini) => '<aside class="sd"><div class="lg"><span class="logo" aria-hidden="true"></span>Axal VC</div><div style="padding:0 12px 10px"><button type="button" class="selb iep-swb" aria-haspopup="menu" aria-label="Switch company or project. Current: ' + (sel || KS) + '">' + mark(ini || 'KS') + '<span class="iep-swn">' + (sel || KS) + '</span><span aria-hidden="true">▾</span></button></div><nav aria-label="Workspace" class="iep-nav">' + J(NAV.map(t => '<a href="#">' + t + '</a>')) + '</nav></aside>';
    const top = '<div class="tb"><div class="srch"><span aria-hidden="true">⌕</span>Search StudioOS</div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="ib" aria-label="Notifications">' + bell + '</button><button type="button" class="av" style="border:0" aria-haspopup="menu" aria-label="Account menu: Portfolio, Companies, Licences">AS</button></div></div>';
    const rail = '<aside class="sp" aria-label="Eadwyn"><button type="button" class="e" aria-label="Open Eadwyn" aria-expanded="false">E</button><span class="vt" aria-hidden="true">Ask</span></aside>';
    const page = (body, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:1440px' + (o.h ? ';height:' + o.h + 'px' : '') + '"><div class="sh" style="min-height:' + (o.h || 900) + 'px">' + side(o.sel, o.ini) + '<div class="mn">' + top + '<main class="bd" style="gap:16px;position:relative">' + body + '</main></div>' + rail + '</div>' + (o.overlay || '') + '</div>'; };
    const crop = (inner, w) => '<div class="cv" style="' + VARS + ';box-sizing:border-box;width:' + (w || 1180) + 'px;padding:20px;display:flex;flex-direction:column;gap:14px">' + inner + '</div>';
    const cropHead = (id, t, note) => '<div class="iep-ch"><span class="iep-id">' + id + '</span><div><b>' + t + '</b>' + (note ? '<p>' + note + '</p>' : '') + '</div></div>';
    const tri = (cols) => '<div class="iep-tri">' + J(cols.map(c => '<div class="iep-col"><div class="iep-colh">' + c[0] + '</div>' + c[1] + '</div>')) + '</div>';
    const S1 = chip('ninc', 'Not incorporated') + ' <span class="raw">action shown</span>';
    const S2 = chip('inf') + ' <span class="raw">action replaced</span>';
    const S3 = chip('inc') + ' <span class="raw">nothing added</span>';
    const btn = (t, cls) => '<a class="btn' + (cls ? ' ' + cls : '') + '" href="#">' + t + '</a>';
    const openOrd = (id) => '<a class="iep-open" href="#" aria-label="In formation. Open the order ' + id + '">' + G.pd + 'In formation · <u>Open</u></a>';
    const quiet = '<a class="iep-quiet" href="#">Already incorporated? Record its legal facts</a>';

    /* ---------- INC8 start board ---------- */
    const opt = (o) => '<label class="iep-opt' + (o.on ? ' on' : '') + (o.dis ? ' dis' : '') + '"><span class="iep-rd" aria-hidden="true"></span>' + mark(o.ini, o.kind) + '<span class="iep-on"><b>' + o.name + '</b><small>' + o.meta + '</small></span><span class="iep-ow">' + o.word + '</span></label>';
    const grpH = (n, t, sub, tags) => '<div class="iep-gh"><span class="iep-n">' + n + '</span><div><h2>' + t + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (tags ? '<span class="iep-tg">' + tags + '</span>' : '') + '</div>';
    const startBody = (o) => { o = o || {};
      const sel = o.sel === undefined ? 'ks' : o.sel;
      const projs = [{ k: 'la', ini: 'LA', kind: 'p', name: LA, meta: 'Standalone project · you own it · /p/lantern', word: chip('nay') }, { k: 'tw', ini: 'TW', kind: 'p', name: TW, meta: 'Standalone project · you own it · /p/tidewater', word: chip('nay') }];
      const cos = [{ k: 'ks', ini: 'KS', kind: 'c', name: KS, meta: 'Company · you are an Admin · /c/kestrel-studio', word: chip('ninc', 'No legal record yet') }, { k: 'mf', ini: 'MF', kind: 'c', name: MF, meta: 'Company · you are an Admin · /c/marlow-foods', word: chip('ninc', 'No legal record yet') }];
      const row = (r) => opt(Object.assign({ on: sel === r.k }, r));
      return '<div class="iep-crumb"><a href="#">Incorporate</a></div>'
        + '<header class="iep-hd"><h1 id="h8">What are you incorporating?</h1><p>Pick one. The next steps ask about the company and where to form it. Nothing is filed or charged until you pay at the end.</p></header>'
        + '<div class="iep-start" role="radiogroup" aria-labelledby="h8">'
        + '<section class="iep-grp">' + grpH('1', 'Convert a project into a company', 'Your standalone projects. The project moves under the new company once it is filed.') + '<div class="iep-list">' + J(projs.map(row)) + '</div><p class="iep-foot">' + OR + ' is in formation and is not listed. ' + openOrd(ORD_OR) + '</p></section>'
        + '<section class="iep-grp">' + grpH('2', 'Incorporate a company', 'Companies you administer with no legal record and no open order.', FS + CO) + '<div class="iep-list">' + J(cos.map(row)) + '</div><p class="iep-foot">3 of your companies are not listed: 2 are incorporated and 1 is in formation. They are in Account › Portfolio.</p></section>'
        + '<section class="iep-grp">' + grpH('3', 'A new company', '', FLAG('Q2 · A') + FLAG('#6681 7a · A')) + '<div class="iep-list">' + opt({ on: sel === 'new', ini: '+', kind: 'n', name: 'A new company', meta: 'Start fresh. We create a project for it first.', word: '' }) + '</div><p class="iep-foot">The company record appears when the registry’s acceptance is recorded.</p></section>'
        + '<div class="iep-ql">' + quiet + FLAG('Q3 · A') + '<span class="raw">Opens the legal facts sheet (PF8) for the company you pick there.</span></div>'
        + '</div>'
        + '<div class="iep-bar" role="region" aria-label="Continue"><span class="iep-bt">' + (sel ? 'Opens Incorporate with <b>' + (sel === 'ks' ? KS : sel === 'la' ? LA : 'a new project') + '</b> filled in: its name, team and location.' : '<span class="mu">Pick one to continue.</span>') + '</span><button type="button" class="btn p"' + (sel ? '' : ' aria-disabled="true" disabled') + '>Continue</button></div>';
    };

    const pill = (t, tone) => '<span class="iep-pill ' + (tone || '') + '">' + t + '</span>';
    const TB = (t) => '<span class="iep-tb">' + t + '</span>';
    const coCard = (o) => '<article class="iep-card"><div class="iep-crow">' + mark(o.ini) + '<div class="iep-cn"><b>' + o.name + '</b><span>' + TB('Company') + pill(o.pill, o.tone) + '</span><span class="raw">' + o.slug + '</span></div></div>'
      + '<dl class="iep-facts"><dt>Country</dt><dd>' + o.jur + '</dd><dt>Type</dt><dd>' + o.type + '</dd><dt>Team</dt><dd class="mo">' + o.team + '</dd></dl>'
      + (o.added || '') + '<div class="iep-cact"><a class="btn bsm" href="#">Open</a><a class="btn bsm" href="#">Company settings</a></div></article>';
    const addBlock = (inner) => '<div class="iep-added">' + ADD() + inner + '</div>';
    const cardA = (st) => st === 1 ? coCard({ ini: 'KS', name: KS, pill: 'Active', tone: 'pos', slug: '/c/kestrel-studio', jur: NR, type: NR, team: '[3]', added: addBlock('<span class="iep-line">' + chip('ninc') + '</span>' + btn('Incorporate ' + KS, 'p bsm') + quiet) })
      : st === 2 ? coCard({ ini: 'HR', name: HR, pill: 'In formation', tone: 'amb', slug: '/c/harbor-robotics', jur: 'Germany', type: 'GmbH', team: '[3]', added: addBlock(openOrd(ORD_HR) + '<span class="raw">Opens order ' + ORD_HR + ' · /incorporate/success</span>') })
      : coCard({ ini: 'NW', name: NW, pill: 'Active', tone: 'pos', slug: '/c/northwind-labs', jur: 'United States', type: 'Corporation', team: '[6]' });
    const prCard = (o) => '<article class="iep-card"><div class="iep-crow">' + mark(o.ini, 'p') + '<div class="iep-cn"><b>' + o.name + '</b><span>' + TB('Project') + (o.pill || '') + '</span><span class="raw">' + o.slug + '</span></div></div><dl class="iep-facts"><dt>Stage</dt><dd>' + o.stage + '</dd><dt>Team</dt><dd class="mo">' + o.team + '</dd></dl>' + (o.added || '') + '<div class="iep-cact"><a class="btn bsm" href="#">Open project</a></div></article>';
    const cardB = (st) => st === 1 ? prCard({ ini: 'LA', name: LA, slug: '/p/lantern', stage: 'Validate', team: '[2]', pill: chip('nay'), added: addBlock(btn('Convert this project into a company', 'p bsm') + '<span class="raw">Was “Make it a company”</span>') })
      : st === 2 ? prCard({ ini: 'OR', name: OR, slug: '/p/orbit', stage: 'Build', team: '[4]', pill: chip('inf'), added: addBlock(openOrd(ORD_OR) + '<span class="raw">Opens order ' + ORD_OR + ' · /incorporate/success</span>') })
      : '<article class="iep-card"><div class="iep-crow">' + mark('NW') + '<div class="iep-cn"><b>' + NW + '</b><span>' + TB('Company') + pill('Active', 'pos') + '</span></div></div><ul class="iep-nest"><li>' + mark('AP', 'p') + '<span><b>' + AP + '</b><small class="raw">/c/northwind-labs/p/atlas-pilot</small></span><a class="btn bsm" href="#">Open</a></li></ul><p class="raw">A project under an incorporated company: nothing added.</p></article>';

    /* ---------- PF2 legal card ---------- */
    const facts = (rows) => '<dl class="iep-kv">' + J(rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>')) + '</dl>';
    const legalCard = (rows, o) => { o = o || {}; return '<section class="iep-card"><div class="iep-lch"><h3>Legal information</h3>' + (o.noEdit ? '' : '<a href="#" class="iep-tl">Edit in Legal</a>') + '</div>' + (o.pre || '') + facts(rows) + (o.post || '') + '</section>'; };
    const cardC = (st) => st === 1 ? legalCard(BLANK, { pre: addBlock('<span class="iep-line">' + chip('ninc') + '</span>' + btn('Incorporate ' + KS, 'p bsm') + quiet) })

      : legalCard(NW_LEGAL);

    /* ---------- PF5 switcher ---------- */
    const swRow = (ini, kind, name, word, cur, indent) => '<div class="iep-swr' + (cur ? ' cur' : '') + (indent ? ' in' : '') + '" role="menuitemradio" aria-checked="' + (!!cur) + '">' + mark(ini, kind) + '<span class="iep-swt">' + name + '</span>' + (word ? '<span class="iep-sww">' + word + '</span>' : '') + (cur ? '<span class="iep-ck" aria-hidden="true">✓</span>' : '') + '</div>';
    const swW = (k) => k === 'inf' ? '<span class="iep-w inf">' + G.pd + 'In formation</span>' : '<span class="iep-w nay">' + G.ring + 'Not a company yet</span>';
    const createRows = (hi) => '<div class="iep-swc"><div class="iep-swa">＋ Create company</div><div class="iep-swa">＋ Create project</div><div class="iep-swa new' + (hi ? ' hi' : '') + '">＋ Incorporate a company' + (hi ? ADD() : '') + '</div></div>';
    const switcher = (o) => { o = o || {}; return '<div class="iep-sw" role="menu" aria-label="Switch company or project">'

      + swRow('BF', 'c', BF, '', false)
      + swRow('HR', 'c', HR, swW('inf'), false)
      + swRow('KS', 'c', KS, '', true)
      + swRow('MF', 'c', MF, '', false)
      + '<div class="iep-swh">Standalone projects</div>'
      + swRow('LA', 'p', LA, swW('nay')) + swRow('TW', 'p', TW, swW('nay')) + swRow('OR', 'p', OR, swW('inf'))
      + createRows(!o.plain) + '</div>'; };

    /* ---------- Company settings › Legal (PF6 Legal tab + PF8) ---------- */

    const ninCard = (name) => '<section class="iep-ninc">' + ADD() + '<div class="iep-nh">' + G.ring + '<b>Not incorporated yet</b></div><p>No registration number, no incorporation date and no open order are recorded for ' + name + '.</p><div class="iep-nb">' + btn('Incorporate ' + name, 'p bsm') + quiet + '</div></section>';
    const factsCard = (rows, edit) => '<section class="iep-card"><div class="iep-lch"><h3>Legal facts</h3>' + (edit === false ? '' : '<a href="#" class="iep-tl">Edit</a>') + '</div>' + facts(rows) + '</section>';
    const cardE = (st) => st === 1 ? setHead('KS', KS) + ninCard(KS) + factsCard(BLANK)
      : st === 2 ? setHead('HR', HR) + '<section class="iep-ninc inf">' + ADD() + '<div class="iep-nh">' + G.pd + '<b>In formation</b></div><p>A paid order is open for ' + HR + '.</p>' + openOrd(ORD_HR) + '</section>' + factsCard(HR_LEGAL)
      : setHead('NW', NW) + factsCard(NW_LEGAL);

    /* ---------- Project settings ---------- */
    const psCard = (st) => st === 1 ? '<section class="iep-card"><div class="iep-lch"><h3>Company</h3></div><p class="iep-p">' + LA + ' is a standalone project. It is not a legal entity, and it governs itself. Its Owner manages its team and agents.</p>' + addBlock('<div class="iep-nb">' + btn('Convert this project into a company', 'p bsm') + '<a class="btn bsm" href="#">Move under a company</a></div><span class="raw">“Make it a company” reworded · Move under a company unchanged</span>') + '</section>'
      : st === 2 ? '<section class="iep-card"><div class="iep-lch"><h3>Company</h3></div><p class="iep-p">' + OR + ' is a standalone project. It is not a legal entity, and it governs itself. Its Owner manages its team and agents.</p>' + addBlock('<div class="iep-nb">' + openOrd(ORD_OR) + '<a class="btn bsm" href="#">Move under a company</a></div>') + '</section>'
      : '<section class="iep-card"><div class="iep-lch"><h3>Company</h3></div><p class="iep-p">' + AP + ' sits under ' + NW + ', a legal entity that governs it.</p><div class="iep-nb"><a class="btn bsm" href="#">Move out of ' + NW + '</a></div><p class="raw">Nothing added.</p></section>';
    const psHead = (name) => '<div class="iep-sth">' + mark(name === AP ? 'AP' : name.substr(1, 2).toUpperCase(), 'p') + '<div><span class="eye">Project settings · General</span><b>' + name + '</b></div></div>';

    /* ---------- states ---------- */
    const sk = (w, h) => '<span class="sk" style="height:' + (h || 12) + 'px;width:' + w + '"></span>';
    const skRow = () => '<div class="iep-skr"><span class="sk" style="width:16px;height:16px;border-radius:999px"></span><span class="sk" style="width:30px;height:30px;border-radius:8px"></span><span style="display:flex;flex-direction:column;gap:6px;flex:1">' + sk('38%', 12) + sk('56%', 9) + '</span>' + sk('110px', 18) + '</div>';
    const box = (t, inner, span, tag) => '<section class="cd" style="gap:10px' + (span ? ';grid-column:span ' + span : '') + '"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2>' + (tag || '') + '</div>' + inner + '</section>';
    const loadStart = '<div aria-busy="true" class="iep-skw">' + sk('46%', 20) + J([1, 2].map(() => '<div class="iep-skg">' + sk('34%', 12) + skRow() + skRow() + '</div>')) + '<div class="iep-skg">' + sk('22%', 12) + skRow() + '</div></div><span class="raw">Announced: “Reading what you can incorporate”. Continue stays off. No group says “none” while reading.</span>';
    const loadCard = '<article class="iep-card" aria-busy="true"><div class="iep-crow"><span class="sk" style="width:34px;height:34px;border-radius:9px"></span><span style="display:flex;flex-direction:column;gap:6px;flex:1">' + sk('48%', 13) + sk('30%', 9) + '</span></div>' + sk('100%', 10) + sk('70%', 10) + '<div class="iep-added sk-on">' + sk('42%', 18) + sk('64%', 28) + '</div></article><span class="raw">The formation line is a skeleton: no action is shown until the state is read.</span>';
    const loadSw = '<div class="iep-sw" aria-busy="true"><div class="iep-swh">Companies</div>' + J([1, 2, 3, 4].map(() => '<div class="iep-swr">' + '<span class="sk" style="width:22px;height:22px;border-radius:6px"></span>' + sk('60%', 11) + '</div>')) + createRows(false) + '</div><span class="raw">The create rows are drawn at once; the row words wait for the read.</span>';
    const unread = (name) => '<div class="iep-unr" role="alert"><span class="st-c st-un">' + G.un + 'Unavailable</span><p><b>We could not check whether ' + name + ' is incorporated.</b> That is not the same as “not incorporated”, so no action is shown.</p>' + retry() + '</div>';
    const refused = (name) => '<div class="iep-ref"><span class="st-c st-rf">' + G.rf + 'Refused</span><p>Only an Admin of ' + name + ' can start this. Ask ' + ADM + '.</p></div>';
    const statesGrid = () => crop('<span class="eye">INC10 · States · each block fails on its own</span><div class="iep-sg">'
      + box('Loading · INC8', loadStart, 1) + box('Loading · crop (a), PF1 card', loadCard, 1) + box('Loading · crop (d), switcher', loadSw, 1)
      + box('Not recorded · the Legal card with every fact blank', legalCard(BLANK, { pre: addBlock('<span class="iep-line">' + chip('ninc') + '</span>' + btn('Incorporate ' + KS, 'p bsm') + quiet) }) + '<span class="raw">“Not incorporated yet” is a recorded state: the blanks plus no open order were read. Each blank reads Not recorded, never “–” or 0.</span>', 1, FS)
      + box('Unavailable · the formation state could not be read', legalCard([['Legal name', NR], ['Legal form', NR], ['Country', NR], ['Registration number', NR], ['Incorporation date', NR]], { pre: unread(KS) }) + '<span class="raw">The orders read failed. The card never falls back to showing Incorporate. Try again rereads this card only.</span>', 1, FS)
      + box('Refused · a member who is not an Admin', legalCard(BLANK, { noEdit: true, pre: '<div class="iep-line">' + chip('ninc') + '</div>' + refused(KS) }) + '<span class="raw">The member sees the facts and the state; no action, no quiet link, no Edit.</span>', 1)
      + box('Partial · INC8 with one list unreadable', '<div class="iep-grp" style="padding:12px">' + grpH('1', 'Convert a project into a company') + '<div class="iep-list">' + opt({ ini: 'LA', kind: 'p', name: LA, meta: 'Standalone project · you own it', word: chip('nay') }) + opt({ ini: 'TW', kind: 'p', name: TW, meta: 'Standalone project · you own it', word: chip('nay') }) + '</div></div><div class="iep-grp" style="padding:12px">' + grpH('2', 'Incorporate a company') + unreadList() + '</div>', 2)
      + box('Refused · no project owned and no company administered', '<div class="iep-ref"><span class="st-c st-rf">' + G.rf + 'Refused</span><p>You are a member of ' + KS + ' and ' + OR + '’s team. Only a project’s owner or a company’s Admin can incorporate it.</p></div><p class="raw">INC8 still offers “A new company”, which is always yours to start.</p>', 1)
      + '</div>', 1440);
    const unreadList = () => '<div class="iep-unr" role="alert"><span class="st-c st-un">' + G.un + 'Unavailable</span><p><b>Your companies could not be read.</b> That is not the same as none. Projects above still work.</p>' + retry() + '</div><span class="st-c st-part">' + G.part + 'Partial</span>';

    /* ---------- legal facts sheet (PF8) saving / failed ---------- */
    const fld = (l, v, o) => { o = o || {}; return '<div class="iep-f"><label>' + l + (o.hint ? '<span>' + o.hint + '</span>' : '') + '</label><div class="iep-in' + (o.ph ? ' ph' : '') + (o.dirty ? ' dirty' : '') + '">' + v + '</div></div>'; };
    const sheetBody = (o) => { o = o || {};
      return '<div class="iep-shb">' + fld('Legal name', KS + ' Ltd', { dirty: true }) + fld('Legal form', 'Private limited company (Ltd)', { dirty: true }) + fld('Country', 'United Kingdom', { dirty: true }) + fld('Registration number', '<span class="mo">[15550218]</span>', { dirty: true }) + fld('Incorporation date', '<span class="mo">04 Feb 2026</span>', { dirty: true, hint: 'As on the certificate' }) + '</div>'; };
    const legalSheet = (st) => '<div class="iep-sheet" role="dialog" aria-modal="true" aria-labelledby="lsh' + st + '"><div class="iep-shh"><span class="eye">PF8 · Legal facts</span><h2 id="lsh' + st + '">Record ' + KS + '’s legal facts</h2><p class="mu">For a company already incorporated elsewhere. This records facts; it files nothing.</p></div>' + sheetBody()
      + (st === 'saving' ? '<div class="iep-shf" role="status">' + chip('saving') + '<span class="mu">Saving 5 facts</span><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn" aria-disabled="true">Cancel</button><button type="button" class="btn p" aria-disabled="true">Saving…</button></span></div>'
        : '<div class="iep-shf err" role="alert">' + chip('fail') + '<span>Nothing was saved. Your 5 typed values are kept.</span><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Try again</button></span></div>') + '</div>';

    /* ---------- phone ---------- */
    const phone = (title, body, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="' + (o.back ? 'Back' : 'Menu') + '">' + (o.back ? '‹' : '☰') + '</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden;padding-bottom:' + (o.pin ? 110 : 28) + 'px">' + body + '</div>' + (o.pin || '') + (o.sheet || '') + '</div></div>'; };
    const mOpt = (o) => opt(o).replace('class="iep-opt', 'class="iep-opt m');
    const mStart = '<h1 class="iep-mh1">What are you incorporating?</h1><p class="mu" style="font-size:13px">Pick one. Nothing is filed or charged until you pay at the end.</p>'
      + '<h2 class="iep-mh">Convert a project into a company</h2>' + mOpt({ ini: 'LA', kind: 'p', name: LA, meta: 'Standalone project · you own it', word: chip('nay') }) + mOpt({ ini: 'TW', kind: 'p', name: TW, meta: 'Standalone project · you own it', word: chip('nay') })
      + '<h2 class="iep-mh">Incorporate a company ' + ENG('#6685 #6687') + '</h2>' + mOpt({ on: true, ini: 'KS', kind: 'c', name: KS, meta: 'Company · you are an Admin', word: chip('ninc', 'No legal record yet') }) + mOpt({ ini: 'MF', kind: 'c', name: MF, meta: 'Company · you are an Admin', word: chip('ninc', 'No legal record yet') })
      + '<h2 class="iep-mh">A new company ' + FLAG('Q2 · A') + '</h2>' + mOpt({ ini: '+', kind: 'n', name: 'A new company', meta: 'Start fresh. We create a project for it first.', word: '' })
      + '<div class="iep-ql m">' + quiet + '</div>';
    const mPin = '<div class="iep-mpin" role="region" aria-label="Continue"><span class="raw">Opens Incorporate with ' + KS + ' filled in</span><button type="button" class="btn p" style="min-height:48px;width:100%">Continue</button></div>';
    const mCards = '<h1 class="iep-mh1">Portfolio</h1><h2 class="iep-mh">Companies</h2>' + cardA(1) + cardA(2) + cardA(3);
    const mSw = '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Switch company or project" style="max-height:720px"><div class="grab" aria-hidden="true"></div><div style="padding:8px 12px 24px;overflow:hidden">' + switcher().replace('class="iep-sw"', 'class="iep-sw m"') + '</div></div>';
    const mLegal = '<div class="iep-sth">' + mark('KS') + '<div><span class="eye">Company settings</span><b>' + KS + '</b></div></div><button type="button" class="selb" style="min-height:44px;width:100%;color:var(--ink)" aria-haspopup="listbox"><span>Section: <b>Legal</b></span><span aria-hidden="true">▾</span></button>' + ninCard(KS).replace('class="iep-ninc"', 'class="iep-ninc m"') + factsCard(BLANK);
    const mSheet = '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mls" style="max-height:700px"><div class="grab" aria-hidden="true"></div><div style="padding:10px 16px 22px;display:flex;flex-direction:column;gap:12px"><span class="eye">PF8 · Legal facts</span><h2 id="mls" style="font-size:18px;font-weight:800">Record ' + KS + '’s legal facts</h2>' + sheetBody().replace('class="iep-shb"', 'class="iep-shb m"') + '<button type="button" class="btn p" style="min-height:48px">Save legal facts</button><button type="button" class="btn" style="min-height:44px">Cancel</button></div></div>';

    /* ---------- crops a to g ---------- */
    const CROPS = {
      a: ['INC9a · PF1 company card', 'Added: the action “Incorporate [Company]” and the quiet link. Today the card shows status, country, type, team and location.', (s) => cardA(s)],
      b: ['INC9b · PF1 standalone project card', 'The existing action reworded: “Make it a company” becomes “Convert this project into a company”.', (s) => cardB(s)],
      c: ['INC9c · PF2 company page · Legal information', 'The same action beside the Not recorded facts.', (s) => cardC(s)],
      e: ['INC9e · Company settings › Legal (PF6 Legal tab, PF8 facts)', 'A card above the facts. Incorporated: no card.', (s) => cardE(s)],
      f: ['INC9f · Project settings › General · Company card', 'Reworded action; “Move under a company” unchanged.', (s) => psHead(s === 3 ? AP : s === 2 ? OR : LA) + psCard(s)]
    };
    const triCrop = (k) => { const c = CROPS[k]; return crop(cropHead(c[0].split(' · ')[0], c[0].split(' · ').slice(1).join(' · '), c[1]) + tri([[S1, c[2](1)], [S2, c[2](2)], [S3, c[2](3)]]) + '<div class="iep-legend"><span class="iep-addl">Added</span><span class="raw">marks the only new part; everything else is the landed board.</span>' + (k === 'a' || k === 'c' || k === 'e' ? FS + CO + FLAG('Q3 · A') : FS) + '</div>', 1180); };
    const cropD = () => crop(cropHead('INC9d', 'PF5 sidebar switcher', 'A third create row, “Incorporate a company”, under Create company and Create project, and a small word on rows. No per-row menu.') + '<div class="iep-dgrid"><div><span class="eye">Open, as PF5</span>' + switcher() + '</div><div class="iep-dstates"><span class="eye">One row in each state</span>'
      + '<div class="iep-colh">' + chip('ninc', 'Not incorporated') + ' <span class="raw">no word on the row</span></div>' + '<div class="iep-sw">' + swRow('KS', 'c', KS, '', false) + '</div><p class="raw">A company with no legal record carries no word: its door is the create row, which opens INC8 with it listed.</p>'
      + '<div class="iep-colh">' + chip('inf') + ' <span class="raw">word on the row</span></div>' + '<div class="iep-sw">' + swRow('HR', 'c', HR, swW('inf')) + swRow('OR', 'p', OR, swW('inf')) + '</div><p class="raw">The word, not a menu. Picking the row switches to it, as today.</p>'
      + '<div class="iep-colh">' + chip('inc') + ' <span class="raw">nothing added</span></div>' + '<div class="iep-sw">' + swRow('NW', 'c', NW, '') + '</div>'
      + '<div class="iep-colh">' + chip('nay') + ' <span class="raw">standalone projects</span></div>' + '<div class="iep-sw">' + swRow('LA', 'p', LA, swW('nay')) + '</div>'
      + '</div></div><div class="iep-legend"><span class="iep-addl">Added</span><span class="raw">the create row and the two row words.</span>' + FS + FLAG('Q1 · A') + '</div>', 1180);
    const cropG = () => crop(cropHead('INC9g', 'Portfolio empty state (PF7)', 'A third option beside New project and New company. The empty state has no company, so it has one state only.') + '<section class="iep-empty"><span class="eye">Account › Portfolio</span><h2>Nothing in your portfolio yet</h2><p>Create a company for a legal entity, or a project to start working before you incorporate. You can move a project into a company later.</p><div class="iep-nb"><a class="btn" href="#">New project</a><a class="btn" href="#">New company</a>' + addBlock('<a class="btn p" href="#">Incorporate a new company</a>') + '</div><p class="raw">Incorporate a new company opens INC8 with “A new company” picked.</p></section>', 900);

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Handoff · Incorporate entry points (#6719, DB1)</h1><p>Checked against <code>main</code> 992bd74ad6 on Sun 15 Nov 2026 (the brief cited d7db415161). Continues Incorporate (D1414) at INC8; INC8 replaces INC1. INC2 to INC7, PF1 to PF8, CS-00 to CS-27 and BD26 stay as drawn apart from the added row or card. Board keys here are IEP8 to IEP12; landing renames them INC8 to INC12. Build issue: #6688 (F1).</p>'
      + '<h2>Checked on main</h2>' + tbl(['Source', 'What it showed'], [
        ['<code>routes/account_companies.ts</code> <code>cardFacts</code>', 'Status: archived, else <code>in_formation</code> when an order is paid, packet_processing or packet_ready (joined by <code>COALESCE(i.company_id, p.company_id)</code>), else active; unavailable when the orders read fails. The <code>legal</code> block returns legal name, form, jurisdiction and incorporation date, not the registration number. No “not incorporated” state.'],
        ['<code>routes/account_portfolio.ts</code> <code>GET /api/account/switcher</code>', 'Companies with nested projects, standalone projects, seated projects elsewhere; <code>create</code> holds only company and project. No formation word on rows. A failed read is <code>{available:false}</code>, never empty.'],
        ['<code>routes/company_legal.ts</code>', '<code>GET</code>/<code>PUT /api/company/:uid/legal</code> with legal name, form, jurisdiction, registration number, incorporation date, registered agent; the write goes through <code>editorOf</code>.'],
        ['<code>routes/legal.ts</code> <code>POST /incorporation/order</code>', 'Requires <code>project_id</code>; a company cannot be the subject. Owner of the project, or admin or partner licence.'],
        ['<code>pages/incorporate/IncorporateFlow.jsx</code>', 'Reads <code>?project=</code> and <code>?order=</code> (admins, read only). No <code>?company=</code>, no start board: INC1 is today’s first step.'],
        ['<code>PortfolioOverview.jsx</code>, <code>ProjectPage.jsx</code>, <code>team/ProjectSettingsPage.jsx</code>', '“Make it a company” → <code>/incorporate?project=&lt;id&gt;</code> for the owner; “Move under a company” beside it in Project settings. The empty state offers New project and New company.'],
        ['<code>ui/CompanySwitcher.jsx</code>', 'Create company and Create project rows only. <code>CompanySettingsTabs.jsx</code> Legal tab: Legal facts card with Edit when <code>can_edit</code>.'],
        ['<code>/incorporate/success?incorporation_id=</code>', 'The member’s order page that “In formation · Open” links to.']])
      + '<h2>Backend required (◇)</h2>' + tbl(['Item', 'Issue', 'Boards'], [
        ['Derived <code>formation_state</code> (not incorporated, in formation, incorporated) on the company, switcher and project reads; registration number and filed orders count as incorporated', '#6685 (E5)', 'INC8, INC9a–f, INC10, INC11, INC12'],
        ['<code>/incorporate?company=&lt;uid&gt;</code> and an order whose subject is a company (<code>subject_company_id</code>), Admin only', '#6687 (E7)', 'INC8 group 2, INC9a, c, e'],
        ['The switcher’s third create row needs no Worker change; its row words need E5', '#6685', 'INC9d']])
      + '<h2>Pending the owner (⚑, drawn as option A)</h2>' + tbl(['Question', 'Drawn'], [['Q1 · switcher', 'One create row “Incorporate a company” and a status word on rows; no per-row menu'], ['Q2 · a new company from INC8', 'Today’s rule (D1414): a project is created first, then incorporated'], ['Q3 · the quiet link', '“Already incorporated? Record its legal facts” on the card and in settings'], ['#6681 question 7a · company record for a new case', 'Created when the registry’s acceptance is recorded (line under “A new company”); unanswered on 15 Nov 2026']])
      + '<h2>Frontend only</h2><p>The INC8 layout, ordering and Continue bar; the reworded project action; the added card on Company settings › Legal; the empty-state third option; the loading, refused and save states; phone and dark. “Record its legal facts” reuses PF8 and <code>PUT /api/company/:uid/legal</code> as they are.</p>'
      + '<h2>Rules kept</h2><p>Who sees an action: the project’s owner, or an Admin of the company; a member sees facts and the refusal sentence, nobody else sees an action. No price, duration or country on any door. “Not incorporated yet” is recorded; “could not check” is Unavailable and never shows the action. Every action opens <code>/incorporate</code> with its subject and prefills name, team and location as PF3b promises.</p>'
      + '<h2>Accessibility</h2>' + tbl(['Area', 'Rule'], [['INC8', 'One radiogroup across the three groups, each group a labelled section; arrow keys move, Continue is disabled with a reason until a row is picked.'], ['States', 'Not incorporated (dashed ring), In formation (clock), Incorporated (check), Not recorded (dash, italic), Unavailable (! dashed), Refused (⊘): word and glyph, never colour alone.'], ['Switcher', 'menu with menuitemradio rows; the row word is part of the accessible name (“[Harbor Robotics GmbH], in formation”).'], ['Phone', '44px targets, Continue pinned 48px above the safe area, sheets become bottom sheets with focus trapped.'], ['Announcements', 'Loading is aria-busy; Saving uses a polite status; read failures use alert on their block only.']])
      + '<p>' + ME + ', ' + ADM + ', ' + KS + ', ' + MF + ', ' + NW + ', ' + BF + ', ' + HR + ', ' + LA + ', ' + TW + ', ' + OR + ', ' + AP + ', orders ' + ORD_HR + ' and ' + ORD_OR + ' and every fact are fictional sample data.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'IEP8') html = page(startBody(), { h: 1020 });
    else if (B === 'IEP8B') html = crop('<span class="eye">INC8 · nothing picked yet</span>' + startBody({ sel: null }).replace(/[\s\S]*<div class="iep-bar"/, '<div class="iep-bar"'), 900);
    else if (B === 'IEP9A') html = triCrop('a');
    else if (B === 'IEP9B') html = triCrop('b');
    else if (B === 'IEP9C') html = triCrop('c');
    else if (B === 'IEP9D') html = cropD();
    else if (B === 'IEP9E') html = triCrop('e');
    else if (B === 'IEP9F') html = triCrop('f');
    else if (B === 'IEP9G') html = cropG();
    else if (B === 'IEP10') html = statesGrid();
    else if (B === 'IEP10B') html = page('<div class="iep-crumb"><a href="#">Incorporate</a></div><header class="iep-hd"><h1>What are you incorporating?</h1></header><section class="iep-emp"><span class="st-c iep-szero">' + G.ok + '0 projects · 0 companies</span><h2>Nothing to incorporate yet</h2><p>You own no standalone project and administer no company without a legal record. Both lists were read.</p><div class="iep-list" style="max-width:640px">' + opt({ on: true, ini: '+', kind: 'n', name: 'A new company', meta: 'Start fresh. We create a project for it first.', word: '' }) + '</div></section><div class="iep-bar" role="region" aria-label="Continue"><span class="iep-bt">Opens Incorporate for <b>a new company</b>. We create its project first.</span><button type="button" class="btn p">Continue</button></div>', { h: 760, sel: NW, ini: 'NW' });
    else if (B === 'IEP10C') html = crop('<span class="eye">INC10 · Saving and save failed on “Record its legal facts” (PF8)</span><div class="iep-two">' + legalSheet('saving') + legalSheet('failed') + '</div>', 1180);
    else if (B === 'IEP11A') html = phone('Incorporate', mStart, { pin: mPin, back: true });
    else if (B === 'IEP11B') html = phone('Portfolio', mCards);
    else if (B === 'IEP11C') html = phone('Portfolio', mCards, { sheet: mSw });
    else if (B === 'IEP11D') html = phone('Company settings', mLegal, { back: true });
    else if (B === 'IEP11E') html = phone('Company settings', mLegal, { back: true, sheet: mSheet });
    else if (B === 'IEP12') html = page(startBody(), { h: 1020 });
    else if (B === 'IEP12B') html = crop('<span class="eye">INC12 · crops (a), (d) and (e) on the dark tokens</span><div class="iep-tri">' + '<div class="iep-col"><div class="iep-colh">(a) ' + S1 + '</div>' + cardA(1) + '<div class="iep-colh">(a) ' + S2 + '</div>' + cardA(2) + '</div><div class="iep-col"><div class="iep-colh">(d) switcher</div>' + switcher() + '</div><div class="iep-col"><div class="iep-colh">(e) ' + S1 + '</div>' + cardE(1) + '</div></div>', 1180);
    else if (B === 'IEPDOC') html = handoff();
    else html = page(startBody(), { h: 1020 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
