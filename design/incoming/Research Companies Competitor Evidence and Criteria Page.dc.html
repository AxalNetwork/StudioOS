.rca-fact{display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;background:var(--card)}
.rca-fact p{font-size:13px;line-height:1.55}
.rca-fact .rca-k{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rca-fact.nos{border-style:dashed;border-color:var(--amE);background:var(--amBg)}
.rca-fact.int{border-style:dashed;border-color:var(--lavE)}
.rca-nos{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--sg);color:var(--amT)}
.rca-qs{border:1.5px dashed var(--lavE);border-radius:14px;background:var(--lav);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rca-qs h2{font-size:14px;font-weight:800}
.rca-qs ul{display:flex;flex-direction:column;gap:6px}
.rca-qs li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5}
.rca-qs li i{font-style:normal;color:var(--vt);font-weight:800}
/* competitors table */
.rca-ct{width:100%;border-collapse:collapse;font-size:12.5px}
.rca-ct th{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);background:var(--raised)}
.rca-ct td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.rca-ct tr:last-child td{border-bottom:0}
.rca-ct td small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px;line-height:1.45}
.rca-ct tr.on td{background:var(--lav)}
.rca-cls{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font:700 10.5px var(--mo);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--hair2);color:var(--ink);background:var(--card)}
.rca-cls.dir{border-color:var(--ink)}
.rca-cls.adj{border-style:dashed}
.rca-cls.unc{border-style:dotted;color:var(--mu)}
.rca-src{display:inline-flex;align-items:center;gap:5px;padding:1px 7px 1px 2px;border-radius:999px;border:1px solid var(--hair2);font:600 11px var(--sg);background:var(--card);white-space:nowrap;margin:2px 4px 2px 0}
.rca-src i{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:999px;background:var(--lav);color:var(--vt);font:700 10px var(--mo);font-style:normal;border:1px solid var(--lavE)}
.rca-src.bad{border-style:dashed;color:var(--ink)}
.rca-src.bad i{background:var(--negBg);color:var(--neg);border-color:var(--negE)}
.rca-src.na{border-style:dotted;color:var(--mu)}
.rca-sup{display:flex;flex-direction:column;gap:8px}
.rca-sup dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:12.5px}
.rca-sup dt{color:var(--mu);font-weight:600}
/* states grid */
.rca-sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rca-sc{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.5}
.rca-sc h3{font-size:13px;font-weight:800}
.rca-sc .rca-api{font:500 10.5px var(--mo);color:var(--mu)}
.rca-empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border:1.5px dashed var(--hair2);border-radius:14px;background:var(--card);padding:22px 24px}
.rca-empty h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.rca-empty p{font-size:13px;color:var(--mu);max-width:720px;line-height:1.55}
/* export */
.rca-md{font:500 11.5px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;color:var(--ink)}
.rca-md b{font-weight:700}
.rca-md .h{color:var(--vt);font-weight:700}
.rca-md .q{color:var(--mu)}
/* annotations */
.rca-flag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;border:1px solid var(--amE);font:700 10px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--amT);background:var(--amBg)}
.rca-ko{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;background:#18181b;color:#fff;font:700 10px var(--mo);flex:none}
.rca-an{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mo);color:var(--vt);background:var(--lav);border:1px dashed var(--lavE);border-radius:6px;padding:1px 6px}
/* tablet */
.rca-tb{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:0 14px;border-bottom:1px solid var(--hair);background:var(--card)}
.rca-tb .selb{min-width:0}
/* phone */
.rca-pbar{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--hair);padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px}
.rca-pbar .btn{min-height:48px;justify-content:center}
.rca-psub{display:flex;flex-direction:column;gap:4px;border:1px solid var(--hair);border-left:3px solid #7c3aed;border-radius:10px;background:var(--card);padding:9px 12px;font-size:12.5px}
.rca-psub b{font-size:15px;font-weight:800}
.rca-ph .rca-in{min-height:44px}
.rca-ph .rca-seg{min-height:44px}
.rca-t2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rca-t2 .rca-tile b{font-size:18px}
.rca-dark .rca-ko{background:#e5e7eb;color:#0b1220}
.mc>.rca-cls,.mc .rca-cls{align-self:flex-start}
.rca-ct td,.rca-ct td b,.rca-src{color:var(--ink)}
.rca-src.na{color:var(--mu)}
.rca-dark .selb{color:var(--ink);background:var(--card);border-color:var(--hair2)}
/* RCE · Research Companies · Competitor Evidence and Criteria (#7809 page 3). Every class is rce-; chips reuse st_extra.css (.st-c) and rca_extra.css. */
.rce-ann{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;border:1px dashed var(--lavE);border-radius:9px;background:var(--lav);font:600 11px var(--mo);color:var(--vt);line-height:1.5}
.rce-ann b{color:var(--ink);font-weight:800}
.rce-ann .rce-ea{color:var(--mu);font-weight:500}
.rce-new{display:inline-flex;align-items:center;padding:0 6px;border-radius:5px;background:#7c3aed;color:#fff;font:700 9.5px var(--mo);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.rce-was{display:inline-flex;align-items:center;padding:0 6px;border-radius:5px;border:1px solid var(--hair2);color:var(--mu);font:600 9.5px var(--mo);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;background:var(--raised)}
.rce-mo{font-family:var(--mo);font-size:11.5px;color:var(--mu)}
.rce-mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:12px;line-height:1;color:var(--vt);background:var(--lav);border:1px solid var(--lavE);flex:none;vertical-align:-3px}
.rce-mk.c{border-style:dashed;background:transparent}
/* statement types: word + border, never colour alone */
.rce-st{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:5px;font:700 10px var(--mo);letter-spacing:.03em;white-space:nowrap;border:1px solid var(--hair2);color:var(--ink);background:var(--card);vertical-align:middle;line-height:1.7}
.rce-st.co{border-color:var(--ink)}
.rce-st.rg{border-color:var(--ink);border-width:1.5px;background:var(--raised)}
.rce-st.tp{border-style:dotted;border-width:1.5px}
.rce-st.in{border-style:dashed;border-color:var(--lavE);color:var(--vt);background:var(--lav)}
/* the four evidence gaps */
.rce-gap{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font:700 11px var(--sg);line-height:1.6;white-space:nowrap;border:1.5px solid var(--hair2);background:transparent;color:var(--ink);vertical-align:middle}
.rce-gap.nf{border-style:dotted;color:var(--mu)}
.rce-gap.no{border-style:solid;border-color:var(--ink)}
.rce-gap.su{border-style:dashed;border-color:var(--amE);color:var(--amT);background:var(--amBg)}
.rce-gap.od{border-style:double;border-width:3px;padding:0 7px 0 5px}
.rce-hold{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font:700 11px var(--sg);line-height:1.6;white-space:nowrap;border:1.5px solid var(--amE);color:var(--amT);background:var(--amBg)}
.rce-hold.wd{border-color:var(--ink);color:var(--ink);background:var(--raised)}
.rce-hold.gone{border-style:dashed;border-color:var(--hair2);color:var(--mu);background:transparent}
.rce-cf{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:999px;border:1.5px solid var(--neg);color:var(--neg);font:700 10.5px var(--sg);background:var(--negBg);white-space:nowrap}
/* context */
.rce-ctx{border:1px solid var(--hair);border-left:3px solid #7c3aed;border-radius:12px;background:var(--card);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.rce-ctx header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rce-ctx header h2{font-size:14.5px;font-weight:800}
.rce-dl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 14px;font-size:12.5px;line-height:1.5}
.rce-dl dt{color:var(--mu);font-weight:600}
.rce-dl dd{margin:0;min-width:0}
.rce-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rce-opt{border:1.5px solid var(--hair2);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;background:var(--card)}
.rce-opt.on{border-color:#7c3aed;background:var(--lav)}
.rce-opt b{font-size:13px;display:flex;gap:8px;align-items:center}
.rce-opt small{color:var(--mu);font-size:11.5px;line-height:1.45}
.rce-rad{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--hair2);display:inline-block;flex:none;background:var(--card)}
.rce-rad.on{border:5px solid #7c3aed}
.rce-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--hair2);display:inline-grid;place-items:center;flex:none;background:var(--card);font-size:11px;color:#fff;line-height:1}
.rce-cb.on{background:#7c3aed;border-color:#7c3aed}
.rce-ord{display:flex;flex-direction:column;gap:6px;counter-reset:o}
.rce-ord li{display:grid;grid-template-columns:22px 18px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--hair);border-radius:9px;padding:6px 8px;background:var(--card);font-size:12.5px}
.rce-ord li .h{color:var(--mu);font-size:13px;letter-spacing:-2px}
.rce-ord li.lift{border:2px solid #7c3aed;box-shadow:0 6px 18px rgba(124,58,237,.18)}
.rce-ord .mv{display:flex;gap:4px}
.rce-ord .mv button{min-width:30px;min-height:26px;border:1px solid var(--hair2);border-radius:7px;background:var(--card);color:var(--ink);font-size:12px}
.rce-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rce-ch{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border-radius:999px;border:1px solid var(--hair2);background:var(--card);font:600 12px var(--sg);color:var(--ink)}
.rce-ch i{font:700 10px var(--mo);font-style:normal;color:var(--mu)}
/* criteria per candidate */
.rce-crit{display:flex;flex-direction:column;gap:3px;font-size:12px}
.rce-crit div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.rce-crit span.l{min-width:112px;color:var(--mu);font-weight:600}
.rce-sup{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--pos)}
.rce-unk{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--mu);font-style:italic}
/* leads */
.rce-lead{border:1.5px dashed var(--hair2);border-radius:12px;background:var(--card);padding:10px 14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr) 120px 170px;gap:12px;align-items:start;font-size:12.5px;line-height:1.5}
.rce-lead.ea{border-color:#a78bfa;background:var(--lav)}
.rce-lead small{display:block;color:var(--mu);font-size:11.5px}
.rce-lead .acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.rce-lh{font:700 9.5px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:2px}
/* claim panel */
.rce-claim{display:flex;flex-direction:column;gap:10px;border:1px solid var(--hair);border-radius:14px;background:var(--card);padding:14px 16px}
.rce-claim h3{font-size:14px;font-weight:800;line-height:1.35}
.rce-claim .rce-dl{grid-template-columns:150px minmax(0,1fr)}
.rce-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rce-side{border:1.5px solid var(--neg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.rce-quote{font:600 13px var(--sg);border:1px solid var(--hair2);border-radius:9px;padding:8px 10px;background:var(--raised);white-space:normal}
.rce-quote em{font-style:normal;font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:2px}
/* grids */
.rce-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rce-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rce-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rce-g5{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}
.rce-g5>div{padding:10px 12px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rce-g5>div.h{background:var(--raised);font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.rce-g5>div.rh{font-weight:800;font-size:12.5px;background:var(--raised)}
/* matrix */
.rce-mxw{border:1px solid var(--hair);border-radius:14px;background:var(--card);overflow:hidden}
.rce-mx{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.rce-mx th,.rce-mx td{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:8px 9px;vertical-align:top;text-align:left}
.rce-mx th:last-child,.rce-mx td:last-child{border-right:0}
.rce-mx thead th{background:var(--raised);font-size:12.5px;font-weight:800;color:var(--ink)}
.rce-mx thead th small{display:block;font:500 10.5px var(--mo);color:var(--mu);margin-top:3px;font-weight:500}
.rce-mx thead th .rce-hold{margin-top:4px}
.rce-mx tbody th{background:var(--raised);font-size:12px;font-weight:800;color:var(--ink)}
.rce-mx tbody th small{display:block;font:600 10px var(--mo);color:var(--mu);margin-top:3px;letter-spacing:.03em}
.rce-mx td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--raised) 6px 7px)}
.rce-cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start;line-height:1.4}
.rce-cell b{font-weight:700;font-size:12px;color:var(--ink)}
.rce-cell .s{font:500 10.5px var(--mo);color:var(--mu)}
.rce-cell.int{border-left:2px dashed var(--lavE);padding-left:6px}
.rce-cell.rce-cfx{border-left:2px solid var(--neg);padding-left:6px}
.rce-lnk{display:block;padding:8px 12px;font-size:12px;background:var(--raised);border-top:1px solid var(--hair)}
.rce-lnk a{color:var(--vt)!important;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.rce-sel{outline:2px solid #7c3aed;outline-offset:-2px}
/* side sheet */
.rce-dim{position:absolute;inset:0;background:var(--dim);z-index:7}
.rce-ss{position:absolute;top:0;right:0;bottom:0;width:560px;z-index:8;background:var(--card);border-left:1px solid var(--hair);box-shadow:-20px 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column}
.rce-ssh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--hair)}
.rce-ssh h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.rce-ssb{padding:14px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;flex:1}
.rce-ssf{padding:12px 20px 16px;border-top:1px solid var(--hair);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.rce-ssf .raw{margin-right:auto}
.rce-lbl{font:700 12px var(--sg);color:var(--ink)}
.rce-fx{border:1px solid var(--ink);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.5;background:var(--raised)}
.rce-carry{display:flex;flex-direction:column;gap:6px}
.rce-carry li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--hair);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.5}
.rce-carry li.int{border-style:dashed;border-color:var(--lavE);background:var(--lav)}
.rce-carry li.stay{border-style:dashed;border-color:var(--amE);background:var(--amBg)}
.rce-carry li small{display:block;color:var(--mu);font-size:11px}
/* findings */
.rce-fd{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.rce-fd p{font-size:13px;line-height:1.55}
.rce-fd .rce-fk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rce-cite{border:1px solid var(--hair);border-radius:9px;background:var(--raised);padding:7px 10px;font-size:11.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.rce-cite .c{font:600 11px var(--mo);color:var(--ink)}
.rce-cite.cp{border-left:3px solid #7c3aed}
/* snapshot switch */
.rce-sw{display:inline-flex;border:1.5px solid var(--hair2);border-radius:10px;overflow:hidden}
.rce-sw span{display:flex;align-items:center;gap:6px;padding:6px 12px;font:600 12px var(--sg);color:var(--mu);white-space:nowrap}
.rce-sw span.on{background:var(--lav);color:var(--vt);font-weight:800}
.rce-sw span+span{border-left:1px solid var(--hair2)}
.rce-snapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px dashed var(--lavE);border-radius:10px;padding:8px 12px;font-size:12.5px;background:var(--lav)}
/* placeholder for cited boards not in this canvas */
.rce-ph{border:1.5px dashed var(--hair2);border-radius:12px;background:var(--raised);color:var(--mu);display:flex;flex-direction:column;gap:8px;padding:14px 16px;font-size:12px;line-height:1.5}
.rce-ph b{color:var(--ink);font:700 11px var(--mo);letter-spacing:.05em;text-transform:uppercase}
.rce-phrow{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--hair2);border-radius:8px;overflow:hidden;background:var(--card)}
.rce-phrow>span{padding:6px 9px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:11.5px;color:var(--mu)}
.rce-phrow>span.k{font-weight:700;color:var(--ink);background:var(--raised)}
/* export lines */
.rce-ex{font:500 11px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:9px;padding:8px 10px;white-space:pre-wrap;color:var(--ink)}
.rce-menu{border:1px solid var(--hair);border-radius:12px;background:var(--card);box-shadow:0 12px 30px rgba(24,24,27,.12);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:320px}
.rce-menu button{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:36px;padding:0 10px;border:0;background:transparent;border-radius:8px;font:600 12.5px var(--sg);color:var(--ink);text-align:left}
.rce-menu button span{font:500 11px var(--mo);color:var(--mu)}
.rce-menu button.on{background:var(--lav)}
.rce-menu hr{border:0;border-top:1px solid var(--hair);margin:4px 2px}
/* phone */
.rce-pc{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:11px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5}
.rce-pc.lead{border-style:dashed}
.rce-pc .btn{min-height:44px;justify-content:center}
.rce-pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:6px}

    else if (B === 'RCE03B') html = claimVar();
    else if (B === 'RCE04') html = gaps();
    else if (B === 'RCE05') html = page(savedBody(), { h: 1000, overlay: attachSheet() });
    else if (B === 'RCE05B') html = attachVar();
    else if (B === 'RCE06') html = page(findingsTab(), { h: 1360, cur: 'My Research' });
    else if (B === 'RCE06B') html = findVar();
    else if (B === 'RCE07') html = page(cmpTab(), { h: 1440, cur: 'My Research' });
    else if (B === 'RCE07B') html = chooser();
    else if (B === 'RCE07F') html = fundChoose();
    else if (B === 'RCE08') html = snapshot();
    else if (B === 'RCE08F') html = fundSnap();
    else if (B === 'RCE09') html = states9();
    else if (B === 'RCE10') html = states10();
    else if (B === 'RCE11T') html = tabMx();
    else if (B === 'RCE12') html = page(results(), { h: 1810, rail: railR });
    else if (B === 'RCE12B') html = claim();
    else if (B === 'RCE12C') html = page(cmpTab(), { h: 1440, cur: 'My Research' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(results(), { h: 1810, rail: railR });
    return { html: { __html: html } };
  }
}
