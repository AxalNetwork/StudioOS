    else if (B === 'NIE21C') html = phone('Request', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Request submitted.</b> Nothing has been sent to [Priya].</div></div><h1 style="font-size:20px;font-weight:800">Your request to meet [Priya Nair]</h1><div class="pc"><span class="eye">Request</span><span class="mo">${RID}</span><span class="eye" style="margin-top:6px">Submitted</span><span class="mo">${AT}</span><span class="eye" style="margin-top:6px">Owner</span><span style="align-self:flex-start">${ST.unas}</span><span class="eye" style="margin-top:6px">Next</span><span>Axal assigns an operator</span><span class="eye" style="margin-top:6px">Cost</span><span>No charge</span></div>`, '<a class="btn p" href="#">Back to Introductions</a>', { back: 1 });
    else if (B === 'NIE21D' || B === 'NIE22B') html = phone('Request', `<span class="eye">Through Axal · a3c8b6f1</span><h1 style="font-size:20px;font-weight:800">Your request to meet [Jules Avery]</h1>${FF(ST.cont, TR.wait, DL.sent, IN.not, 'nie-2')}<div class="nt"><span class="ic" aria-hidden="true">→</span><div><b>Next: [Jules] answers Axal.</b> Owner: [Ren Okada].</div></div><div class="pc"><span class="eye">Contacted</span><span class="mo">2026-11-18 14:20 UTC</span><span class="eye" style="margin-top:6px">Brief</span><span>v2 · sent to [Jules]</span></div>`, '<button type="button" class="btn">Withdraw</button><button type="button" class="btn p">Suggest an edit</button>', { back: 1 });
    else if (B === 'NIE21E') html = phone('Needs information', `<span class="pl a" style="align-self:flex-start">? Needs you</span><h1 style="font-size:20px;font-weight:800">Which [Ari Lane] do you mean?</h1><div class="pc"><span class="eye">From [Ren Okada] · Axal</span><span>“Two people named [Ari Lane] are linked to [Tidepool Labs]: the CTO and a former board observer. Which one?”</span></div><div class="f"><label for="pa">Your answer (Axal only)</label><span id="pa" class="in ta">The CTO. He presented at the Ocean Tech meetup in October.</span></div>`, '<button type="button" class="btn p">Send answer to Axal</button>', { back: 1 });
    else if (B === 'NIE21F') html = phone('Review your request', `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Not submitted.</b> 2 requirements for Founder · [Quill Analytics]. Draft kept.</div></div><h1 style="font-size:20px;font-weight:800">Before you submit</h1><div class="pc"><b>Venture profile</b><small>Stage and round not recorded</small><a class="btn" href="#" style="align-self:flex-start">Complete →</a></div><div class="pc"><b>Company due diligence</b><small>Not started</small><a class="btn" href="#" style="align-self:flex-start">Start →</a></div>`, '<button type="button" class="btn">Change capacity</button><button type="button" class="btn p">Save draft</button>', { back: 1 });

    /* ===== Frame index ===== */
    else if (B === 'NIEI') {
      const R = [
        ['NIE01 · desk', 'Requester (founder)', 'Network › Introductions', 'Request an introduction / Answer', 'general list + counts ◇; team, matches (live)'],
        ['NIE02 · entry points', 'Any member', 'Primary, Person Sheet, relationship, org row', 'Request sheet step 1', 'person ref (#7676) ◇'],

        ['NIE07 · submit states', 'Requester', 'Submit', 'Check / Open receipt / Try again', 'idempotency key ◇'],

        ['NIE14, 14B · contact', 'Operator', 'Review and contact', 'Send / Record contact / No route / Request info', 'send operation ◇'],

        ['NIE16 · response, made, outcome', 'Operator, requester', 'Target reply', 'Make the introduction / Record outcome', 'events ◇'],
        ['NIE17 · withdraw', 'Requester', 'Receipt, detail', 'Withdraw request', 'compare-and-set ◇'],
        ['NIE18, 18B · states', 'All', 'Any read', 'Retry etc.', 'D5129'],
        ['NIE20 · tablet; NIE21A–F · phone; NIE22, 22B · dark', 'Requester', 'as desktop', 'sticky primary', 'as desktop']

      html = `<div class="${CV} doc"><div><span class="eye">NIE · #7678 · frame index and accessibility</span><h2 style="font-size:22px;margin-top:4px">Each frame: who acts, where it opens from, what comes next, and what it reads</h2></div>
      <table class="tbl">${tableHdr(['Frame', 'Actor', 'Entry point', 'Next action', 'Data dependency'])}<tbody>${J(R.map((r) => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`))}</tbody></table>
      <div class="cols"><div><h3>Keyboard and focus</h3><ul><li>Request sheet: step list, target search (combobox, results as a listbox), route choice, capacity radio group, purpose, shareable preview, Back, Submit. Esc closes and returns focus to the control that opened it.</li><li>Errors: an error summary at the top of the step gets focus and links to each field; fields carry <code>aria-describedby</code>.</li><li>Blocked submit: focus to the alert; Return to introduction restores target, purpose and capacity and focuses Review.</li><li>Desk lanes are a tablist; tables use <code>th scope</code>; the record opened from a link returns focus to the tab you came from.</li><li>Operator case: header actions, then Target identity, Channels, Draft, side panels. The contact sheet traps focus; Send stays off until the review box is checked.</li></ul></div>

      <li>No commit on main for #7672, #7673, #7674, #7676 or #7677.</li></ul>
      <h3 style="margin-top:12px">Reused</h3><ul><li>Network shell, header, four links, request sheet stepper, record Sheet, desk strip (D7063), delivery recovery words (D7066), state words, the Eadwyn rail (#5130), the Admin console shell.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Type chips, lanes and the four-field status row; the sheet steps, previews and scoped-note layout; tablet, phone and dark. All of it waits on the contracts at right.</li></ul></div>
      <div><h3>Backend required (◇) · existing or proposed</h3><ul>
      <li>Proposed #7672/#7674: canonical person reference and provisional target (name, optional organization, title, public URL, context); organization as context only; directory search with source and freshness; suppression list.</li>
      <li>Proposed #7673: role-neutral entitlement and capacity list (with represented organization); readiness snapshot id and version recorded at submit and rechecked server-side (#7677 supplies it).</li>
      <li>Proposed #7673: general request create with idempotency key, one open request per target and capacity, durable receipt, scoped read by id, cursor list with totals per lane.</li>
      <li>Proposed #7673: operator entitlement, assignment with compare-and-set, case read, needs-information, no-route close, append-only activity, requester / operator / target note scopes.</li>
      <li>Proposed #7673: outreach send from an Axal mailbox with its own operation key and the existing reconcile pattern; external-contact event; target response with evidence; introduction-made event; outcome; withdraw with stage compare-and-set.</li>
      <li>Proposed #7673: notification deep link to the request id; support-session writes refused; policy read for any charge (none configured today).</li>
      <li>Existing: <code>/delivery/reconcile</code> and mail send operations (teammate only today); who-knows.</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑, option A)</h3><ul><li>Pricing: shown from a policy read; today “No charge”.</li><li>Operator entitlement: a named grant by a Super Admin.</li><li>Close note after withdrawal: the operator reviews and sends it.</li><li>Expiry: an operator’s recorded close, no automatic timer.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Whether a member target may answer in the app as well as by reply (drawn: operator records it).</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nie-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
