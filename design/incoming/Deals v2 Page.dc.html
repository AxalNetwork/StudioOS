      DE03a: () => phone('Deal flow', '<nav class="seg" aria-label="Scope"><a class="btn t bsm" href="#" aria-current="page" style="background:var(--card)">Mine 24</a><a class="btn t bsm" href="#">All 140</a><a class="btn t bsm" href="#">New 6</a></nav><div class="tools"><button type="button" class="dd" style="min-height:44px">Filters · 1</button><button type="button" class="dd" style="min-height:44px">Sort ▾</button></div>' + mcard({ n: 'Acme Robotics', s: 'Robotics · Lisbon' }) + mcard({ n: 'Harbor AI', s: 'AI tooling · Rotterdam', sc: 'low', strip: 'llmllllmlll', stale: true, days: '18' })),
      DE03b: () => phone('Deal flow', '<nav class="zn" aria-label="Stage" style="overflow:hidden">' + J(['Sourced 8', 'Screening 6', 'Diligence 5', 'Commit 3'].map((s, i) => '<a href="#"' + (i === 1 ? ' aria-current="page"' : '') + ' style="min-height:44px;white-space:nowrap">' + s + '</a>')) + '</nav>' + mcard({ n: 'Acme Robotics', s: 'Robotics · Lisbon' }) + '<p class="raw">No drag: every card has Move to…</p>'),
      DE03c: () => phone('Filters', '', '<div class="sheet" style="top:56px;max-height:none;border-radius:0" role="dialog" aria-modal="true" aria-label="Filters"><div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">' + J(['My stage', 'Sector', 'Location', 'Round', 'Owner'].map(f => '<button type="button" class="disc"><b>' + f + '</b><span>Any</span><i aria-hidden="true">›</i></button>')) + '<label class="ck"><input type="checkbox">Include passed</label><button type="button" class="btn p" style="min-height:48px">Show 24 deals</button></div></div>'),
      DE03d: () => phone('Compare 2', '<div class="sc3" style="grid-template-columns:1fr 1fr">' + J(['Acme Robotics', 'Bluefern Health'].map(v => '<div><b style="font-size:13px;font-family:var(--sg)">' + v + '</b></div>')) + '</div>' + J([['Ask', '€1.5M', '€2.0M'], ['Team', '78 · High', '74 · High'], ['Market', '71 · Medium', '69 · High'], ['Financial', '46 · Low', '58 · Medium'], ['MRR', '€42K', '€31K']].map(r => '<div class="mc"><span class="eye">' + r[0] + '</span><div class="dv"><b class="mo">' + r[1] + '</b><b class="mo">' + r[2] + '</b></div></div>'))),
      DE15: () => phone('Acme Robotics', '<div>' + co('Raise') + ' ' + me('Diligence · 3 of 8') + '</div><div class="fin5" style="grid-template-columns:1fr 1fr">' + J([['Round', '€1.5M'], ['Committed', '€620K'], ['Minimum', '€100K'], ['Closes', '20 Dec']].map(f => '<div style="border-bottom:1px solid var(--hair)"><small>' + f[0] + '</small><b>' + f[1] + '</b></div>')) + '</div><nav class="zn" style="overflow:hidden">' + J(['Overview', 'Scorecard', 'Evidence', 'Diligence'].map((t, i) => '<a href="#"' + (i === 0 ? ' aria-current="page"' : '') + ' style="min-height:44px">' + t + '</a>')) + '</nav><ol class="vstep">' + J(STEPS.slice(0, 5).map((s, i) => '<li class="' + (i < 2 ? 'dn' : i === 2 ? 'on' : '') + '"><i>' + (i < 2 ? '✓' : i + 1) + '</i><span>' + s + '</span><span></span></li>')) + '</ol>', '<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--hair)"><button type="button" class="btn p" style="width:100%;min-height:48px">Continue diligence</button></div>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Shell rule, backend fit and handoff</h1><p><b>Shell (#3704 over the prompt).</b> The prompt’s “do not redesign … the account switcher” conflicts with the owner’s 4 Nov rule. These boards follow #3704: no licence or account switcher; the top-left control is companies and projects only; the sidebar is the union of held licences (Investor here: Studio, Spin-Out Lab, Deals, Axal VC Fund, Fund, Trust, Network, Research); Portfolio, Companies and Licences live in the Account menu.</p>'
      + tbl(['Board area', 'Today (Worker routes)', 'Status'], [
        ['Deal flow, Needs your attention, views', '<code>deal_flow.ts</code> (list, inbox, pass, events), <code>deal_views.ts</code> (saved views, fit)', 'Frontend: one dominant job, compact Other activity, View settings'],
        ['Scorecard, eleven scopes', 'Existing scoring reads on the deal', 'Frontend: one score component with five absence states'],
        ['Screening, pass reasons', '<code>/api/deals/screening</code>, <code>/pass-analytics</code>', 'Frontend'],
        ['Investment committee', '<code>ic.ts</code>: decisions, votes, conditions, minutes; recusal counted beside the tally', 'Frontend'],
        ['Closing, transfers', '<code>closings.ts</code>, <code>/deals/:id/closing-checklist</code>, <code>/transfers</code>, <code>/transfer-gate</code>', 'Frontend'],
        ['Deal access and data room', '<code>deal_workroom.ts</code> room-access, <code>data_room.ts</code>', 'Frontend: Unreadable never falls through to Request invitation'],
        ['Compare + Eadwyn draft', '<code>/deal-flow/compare-note</code> (+ keep)', 'Frontend: proposal, Save to notes / Discard'],
        ['What’s new (material only)', '<code>/deals/:id/activity</code>, deal-flow events', 'Frontend filter of event kinds'],
        ['Preview-mode write policy', 'Preview is a shell preview; writes go out as Super Admin', 'Policy decision; disabling writes needs Worker enforcement (backend required)'],
        ['Route titles', 'Generic marketing title today', 'Frontend: “Deal flow · Axal VC” etc.']])
      + '<h2>Accessibility</h2><p>Scope links use aria-current; Board/Table is a radio group; scores announce as “Team 78, strong, high confidence”; Move to… replaces drag; tables have real headers and sort states; dialogs trap and return focus; mobile targets 44px.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DE01') html = page(dealflow(), { h: 1300 });
    else if (B === 'DE18') html = '<div class="cv" style="' + VARS + ';width:700px;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px"><div style="display:flex;height:640px;border:1px solid var(--hair);border-radius:12px;overflow:hidden">' + rail('tasks') + '</div><div style="display:flex;height:640px;border:1px solid var(--hair);border-radius:12px;overflow:hidden">' + rail('task') + '</div></div>';
    else if (B === 'DE01b') html = cardsAll();
    else if (B === 'DE02') html = page(table(), { h: 820 });
    else if (B === 'DE04') html = page(overview(), { h: 1150 });
    else if (B === 'DE05') html = page(scorecard(), { h: 980 });
    else if (B === 'DE06') html = page(screening(), { h: 760 });
    else if (B === 'DE07') html = page(commit(false), { h: 1000 });
    else if (B === 'DE07b') html = page(commit(true), { h: 560 });
    else if (B === 'DE08') html = page(closing(false), { h: 760 });
    else if (B === 'DE08b') html = page(closing(true), { h: 820 });
    else if (B === 'DE09') html = page(investment(), { h: 900, rail: 'task' });
    else if (B === 'DE10') html = dataroom();
    else if (B === 'DE11') html = page(compare(), { h: 1050 });
    else if (B === 'DE12') html = page(studio(), { h: 760, nav: 'Deals', preview: true });
    else if (B === 'DE13') html = states();
    else if (B === 'DE14') html = dialogs();
    else if (B === 'DE16a') html = page(dealflow(), { h: 1300 });
    else if (B === 'DE16b') html = page(overview(), { h: 1150 });
    else if (B === 'DE17') html = handoff();
    else if (MOB[B]) html = MOB[B]();
    else html = page(dealflow(), { h: 1300 });
    return { html: { __html: html } };
  }
}
