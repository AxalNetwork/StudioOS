/* ===== SHARED SITE KIT CSS (reuse verbatim in sibling public-site canvases #6978-#6982) =====
   The public site's tokens and shell, from frontend/src/components/site/site.css (.ax-site),
   restated under .pub-root. Breakpoints are classes, because a canvas frame is not a viewport:
     .pub-root            desktop (above 1060px)
     .pub-root.pub-t      1060px and below (header links fold into the menu button, grids two-up)
     .pub-root.pub-p      640px and below (everything stacks, 16px gutters); always add pub-t too
     .pub-root.pub-xs     320px (the header button drops its arrow); add pub-t pub-p too
   Production maps them to @media (max-width:1060px) and (max-width:640px). Light only. */
.pub-root{--pv:#6d28d9;--pv-h:#5b21b6;--pv-b:#7c3aed;--pv-lav:#a78bfa;--pv-lil:#c4b5fd;--pv-wash:#f4f0fe;
  --p-ink:#141118;--p-ink2:#3f3b47;--p-body:#4a4553;--p-mut:#6b6577;--p-faint:#9a96a8;
  --p-l1:#f0eff3;--p-l2:#ececf1;--p-l3:#dedce4;--p-band:#faf9fc;--p-hero-dk:#1a1328;
  --r-f:#6d28d9;--r-f-bg:#f4f0fe;--r-i:#059669;--r-i-bg:#e9f8f1;--r-o:#2563eb;--r-o-bg:#eaf1fd;--r-a:#d97706;--r-a-bg:#fdf3e4;
  --pf:'Public Sans','Inter',system-ui,-apple-system,sans-serif;
  --pf-d:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
  --pf-m:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pf-logo:'Space Grotesk','Inter',system-ui,sans-serif;
  font-family:var(--pf);background:#fff;color:var(--p-ink);-webkit-font-smoothing:antialiased;
  position:relative;overflow:hidden;font-size:14.5px;line-height:1.6;text-align:left}
.pub-root *,.pub-root *::before,.pub-root *::after{box-sizing:border-box}
.pub-root h1,.pub-root h2,.pub-root h3{font-family:var(--pf-d);font-weight:800;margin:0;text-wrap:balance;color:inherit}
.pub-root p{margin:0}
.pub-root a{color:inherit;text-decoration:none}
.pub-root ul,.pub-root ol{list-style:none;margin:0;padding:0}
.pub-root button{font-family:inherit;cursor:pointer}
.pub-root .pub-fr{outline:2px solid var(--pv);outline-offset:3px;border-radius:6px}
.pub-root .pub-foot .pub-fr{outline-color:var(--pv-lil)}

.pub-wrap{max-width:1280px;margin:0 auto;padding-left:34px;padding-right:34px}
.pub-wrap.is-role{max-width:1200px}
.pub-wrap.is-read{max-width:860px}
.pub-p .pub-wrap{padding-left:16px;padding-right:16px}
.pub-mono{font-family:var(--pf-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pub-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv);line-height:1.4}
.pub-lbl.is-q{color:var(--p-mut)}
.pub-lbl.is-dk{color:var(--pv-lav)}
.pub-h1{font-size:66px;line-height:.96;letter-spacing:-.045em}
.pub-h1 em{font-style:normal;color:var(--pv)}
.pub-p .pub-h1{font-size:38px}
.pub-h1-page{font-size:52px;line-height:1.02;letter-spacing:-.04em}
.pub-p .pub-h1-page{font-size:36px}
.pub-h1-role{font-size:68px;line-height:.98;letter-spacing:-.045em}
.pub-p .pub-h1-role{font-size:36px}
.pub-h2{font-size:35px;line-height:1.14;letter-spacing:-.032em}
.pub-p .pub-h2{font-size:28px}
.pub-h3{font-size:19px;line-height:1.25;letter-spacing:-.024em}
.pub-hero-copy{font-size:17px;line-height:1.68;color:var(--p-body)}
.pub-read{font-size:14.5px;line-height:1.68;color:var(--p-body)}
.pub-small{font-size:13px;line-height:1.55;color:var(--p-mut)}

/* Buttons: radius 11, weight 800; primary violet with an arrow; quiet white; ghost on dark only. */
.pub-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-weight:800;
  border:1px solid transparent;white-space:nowrap;font-family:var(--pf);line-height:1.2;min-height:44px;text-align:center}
.pub-btn.is-lg{padding:14px 26px;font-size:14.5px;min-height:48px}
.pub-btn.is-md{padding:11px 20px;font-size:13.5px}
.pub-btn.is-sm{padding:9px 16px;font-size:12.5px;min-height:40px}
.pub-btn.is-pri{background:var(--pv);color:#fff}
.pub-btn.is-pri.is-hov{background:var(--pv-h)}
.pub-btn.is-brt{background:var(--pv-b);color:#fff}
.pub-btn.is-qt{background:#fff;border-color:var(--p-l3);color:var(--p-ink)}
.pub-btn.is-gh{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.55);color:#fff}
.pub-btn.is-full{display:flex;width:100%}
.pub-btn[disabled]{opacity:.6}
.pub-root .pub-tl{color:var(--pv);font-weight:700}
.pub-root .pub-tl.is-dk{color:var(--pv-lil)}
.pub-card{background:#fff;border:1px solid var(--p-l2);border-radius:15px}
.pub-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;line-height:1.35;white-space:nowrap}
.pub-chip.is-v{background:var(--pv-wash);color:var(--pv)}
.pub-chip.is-q{background:#f4f3f7;color:var(--p-mut)}
.pub-chip.is-line{background:#fff;color:var(--p-body);border:1px solid var(--p-l3)}
.pub-chip.is-live{background:#fff;color:var(--p-ink);border:1px solid var(--p-l3)}
.pub-chip.is-live::before{content:'';width:7px;height:7px;border-radius:99px;background:var(--r-i)}
.pub-chip.is-soon{background:#fff;color:var(--p-mut);border:1px dashed var(--p-faint)}
.pub-chip.is-soon::before{content:'◷';font-size:11px;letter-spacing:0}
.pub-role{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em;line-height:1.35;white-space:nowrap}
.pub-role::before{content:'';width:7px;height:7px;border-radius:99px;background:currentColor}
.pub-role.is-f{color:var(--r-f);background:var(--r-f-bg)}
.pub-role.is-i{color:#047857;background:var(--r-i-bg)}
.pub-role.is-i::before{background:var(--r-i)}
.pub-role.is-o{color:var(--r-o);background:var(--r-o-bg)}
.pub-role.is-a{color:#b45309;background:var(--r-a-bg)}
.pub-role.is-a::before{background:var(--r-a)}
/* Chip text: Investors #047857 and Advisors #b45309 keep 4.5:1 on their tints (the brand #059669 and #d97706 measure 3.4 and 2.9); the dot keeps the brand hue. Flagged for the owner. */

/* Platform states (D5129) in site type: a word and a glyph each, never colour alone, never 0. */
.pub-st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;line-height:1.4}
.pub-st i{font-style:normal;font-family:var(--pf-m);font-weight:700}
.pub-st.is-nr{color:var(--p-mut);border-bottom:1px dashed var(--p-faint)}
.pub-st.is-ua{color:#92400e}
.pub-st.is-none{color:var(--p-mut)}
.pub-dk .pub-st.is-nr{color:rgba(255,255,255,.82);border-bottom-color:rgba(255,255,255,.5)}
.pub-dk .pub-st.is-ua{color:#fcd34d}
.pub-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#efedf4,#f7f6fa);height:12px}
.pub-dk .pub-skel{background:rgba(255,255,255,.14)}

/* Logo: the real mark (frontend/public/axal-mark.png) and "Axal VC" as live Space Grotesk bold text. 28px lockup. */
.pub-logo{display:inline-flex;align-items:center;gap:8px;height:28px;flex:none;color:var(--p-ink)}
.pub-logo img{width:28px;height:28px;object-fit:contain;flex:none;display:block}
.pub-logo b{font-family:var(--pf-logo);font-weight:700;font-size:17px;letter-spacing:-.025em;line-height:1;white-space:nowrap}
.pub-logo.is-dk{color:#fff}

/* Skip link, first focusable on every public page. */
.pub-skip{position:absolute;left:16px;top:10px;z-index:5;background:#fff;color:var(--pv);font-weight:800;font-size:13.5px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--p-l3);box-shadow:0 8px 24px rgba(20,17,24,.12)}

/* Header: fixed in production, 64px, never grows. */
.pub-hdr{position:relative;z-index:4;height:64px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--p-l1);font-family:var(--pf)}
.pub-hdr-row{height:63px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.pub-nav{display:flex;align-items:center;gap:24px;flex:1;justify-content:center;min-width:0}
.pub-nav a,.pub-nav button{font-size:13.5px;font-weight:500;color:var(--p-body);white-space:nowrap;background:none;border:0;padding:6px 0;
  display:inline-flex;align-items:center;gap:4px;font-family:var(--pf)}
.pub-nav .is-cur{color:var(--pv);font-weight:700}
.pub-nav .is-open{color:var(--pv)}
.pub-act{display:flex;align-items:center;gap:14px;flex:none}
.pub-act .pub-signin{font-size:13.5px;font-weight:700;color:var(--p-ink);padding:10px 2px}
.pub-menu-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--p-l3);
  background:#fff;color:var(--p-ink);font-size:18px;line-height:1;padding:0;flex:none}
.pub-menu-btn svg{width:18px;height:18px}
.pub-t .pub-nav,.pub-t .pub-act .pub-signin{display:none}
.pub-t .pub-menu-btn{display:inline-flex}
.pub-t .pub-act{gap:8px}
.pub-p .pub-hdr-row{gap:10px}
.pub-p .pub-act .pub-btn.is-sm{padding:9px 13px}
.pub-xs .pub-act .pub-btn.is-sm{padding:9px 11px;font-size:12px}
.pub-xs .pub-logo b{font-size:16px}
/* Enlarged text (200% text size): the header keeps 64px; the wordmark and button hold, the button label shortens. */
.pub-big .pub-act .pub-btn.is-sm{font-size:15px;padding:9px 12px}
.pub-big .pub-logo b{font-size:19px}

/* Network dropdown (desktop). */
.pub-netwrap{position:relative}
.pub-netmenu{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);width:380px;background:#fff;border:1px solid var(--p-l2);
  border-radius:16px;box-shadow:0 18px 44px rgba(20,17,24,.12);padding:8px;display:grid;gap:2px;z-index:6;text-align:left}
.pub-netmenu a{display:flex!important;gap:12px;align-items:flex-start;padding:11px 12px!important;border-radius:11px;white-space:normal!important}
.pub-netmenu a.is-hov{background:#f6f4fd}
.pub-netmenu .pub-ni{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(109,40,217,.08);color:var(--pv);font-size:15px}
.pub-netmenu .pub-nt{display:block;font-size:13.5px;font-weight:700;color:var(--p-ink)}
.pub-netmenu .pub-nb{display:block;font-size:12px;color:var(--p-mut);line-height:1.45;margin-top:2px;font-weight:400}

/* Mobile menu (1060px and below): a sheet under the header, 44px targets, a visible close button. */
.pub-mm{background:#fff;border-bottom:1px solid var(--p-l2);box-shadow:0 18px 40px rgba(20,17,24,.08)}
.pub-mm-in{padding:6px 16px 22px}
.pub-mm a{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 4px;font-size:16px;font-weight:600;color:var(--p-ink);border-bottom:1px solid #f4f3f7}
.pub-mm a.is-cur{color:var(--pv);font-weight:800}
.pub-mm a .pub-chev{color:var(--p-faint);font-size:14px}
.pub-mm-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--p-mut);padding:18px 4px 6px}
.pub-mm .pub-mm-sub a{padding-left:16px;font-size:15px;font-weight:500;min-height:44px}
.pub-mm-acc{padding-top:16px;display:flex;flex-direction:column;gap:6px}
.pub-mm-acc .pub-btn{width:100%}
.pub-mm-acc a.pub-mm-lp{min-height:44px;justify-content:center;font-size:13.5px;font-weight:600;color:var(--p-body);border:0}

/* Footer: gradient band, mark and words in white, four link columns, legal row and two legal lines. */
.pub-foot{background:linear-gradient(160deg,#241636 0%,#1a1328 38%,#131022 100%);color:#fff;position:relative;overflow:hidden;font-family:var(--pf)}
.pub-foot-rule{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(196,181,253,.45),transparent)}
.pub-foot-in{position:relative;padding-top:64px;padding-bottom:36px}
.pub-foot-grid{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr 1fr;gap:40px 28px}
.pub-foot-tag{font-size:14.5px;color:rgba(255,255,255,.84);line-height:1.68;margin-top:16px!important;max-width:300px}
.pub-soc{display:flex;gap:7px;margin-top:24px!important;flex-wrap:wrap}
.pub-soc a{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:#3b1a63}
.pub-soc svg{width:17px;height:17px;fill:currentColor}
.pub-soc img{width:21px;height:18px;object-fit:contain}
.pub-foot h2{font-family:var(--pf);margin:0 0 16px;font-size:12px;line-height:1.2;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--pv-lil)}
.pub-foot-list{display:flex;flex-direction:column;gap:4px}
.pub-foot-list a{display:inline-flex;align-items:center;min-height:32px;font-size:15px;line-height:1.35;color:rgba(255,255,255,.92);font-weight:500}
.pub-foot-div{display:flex;align-items:center;gap:14px;margin-top:44px}
.pub-foot-div span{flex:1;height:1px;background:rgba(196,181,253,.22)}
.pub-foot-div i{width:6px;height:6px;transform:rotate(45deg);background:rgba(196,181,253,.55);flex:none}
.pub-foot-legal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 64px;align-items:start;margin-top:26px}
.pub-foot-links{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap}
.pub-foot-links a{font-size:14px;line-height:1.65;color:rgba(255,255,255,.84);min-height:32px;display:inline-flex;align-items:center}
.pub-foot-small{font-size:14px;color:rgba(255,255,255,.74);line-height:1.65;max-width:560px}
.pub-foot-small strong{color:rgba(255,255,255,.92);font-weight:700}
.pub-foot-small u{color:rgba(255,255,255,.92);font-weight:600}
.pub-foot-copy{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pub-rel{font-family:var(--pf-m);font-size:11.5px;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.24);border-radius:99px;padding:2px 9px;white-space:nowrap}
.pub-t .pub-foot-grid{grid-template-columns:1fr 1fr}
.pub-t .pub-foot-grid > div:first-child{grid-column:1 / -1}
.pub-p .pub-foot-in{padding-top:48px}
.pub-p .pub-foot-grid{grid-template-columns:1fr 1fr;gap:30px 18px}
.pub-p .pub-foot-legal{grid-template-columns:1fr}
.pub-p .pub-soc a{width:44px;height:44px}
.pub-p .pub-foot-list a{font-size:14.5px;min-height:44px}
.pub-p .pub-foot-links a{min-height:44px}

/* Newsletter block ("The Axal VC Brief"), unchanged from components/site/NewsletterSignup.jsx. */
.pub-nl{background:var(--p-band);border-top:1px solid var(--p-l1);border-bottom:1px solid var(--p-l1);padding:44px 0}
.pub-nl-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.pub-nl-h{font-size:24px!important;letter-spacing:-.01em}
.pub-nl-d{margin:8px 0 10px!important;font-size:14px;line-height:1.55;color:var(--p-body)}
.pub-nl-form{display:flex;flex-direction:column;gap:10px}
.pub-nl-row{display:flex;gap:8px}
.pub-nl-in input{flex:1 1 auto;min-width:0;padding:11px 14px;border-radius:10px;border:1px solid #e4e2ea;background:#fff;color:var(--p-ink);font-size:13.5px;font-family:var(--pf);min-height:44px}
.pub-nl-in input::placeholder{color:var(--p-faint)}
.pub-nl-fine{font-size:11.5px;line-height:1.55;color:var(--p-mut)}
.pub-nl-err{padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;color:#991b1b;background:#fef2f2;border:1px solid #fecaca}
.pub-nl-sent{padding:14px 16px;border-radius:12px;border:1px solid var(--p-l3);background:#fff}
.pub-nl-sent b{display:block;font-weight:800;font-size:15px}
.pub-nl-sent p{margin-top:4px!important;font-size:13px;line-height:1.55;color:var(--p-body)}
.pub-t .pub-nl-in{grid-template-columns:1fr}
.pub-p .pub-nl-row{flex-direction:column}
/* ===== END SHARED SITE KIT CSS ===== */
.pub-mm .pub-mm-acc a.pub-btn{justify-content:center;border:1px solid var(--p-l3);font-size:14px;font-weight:800;min-height:48px}

/* ===== PUB · Homepage sections (#6977) and canvas annotations. Not part of the shared kit. ===== */

/* Canvas annotations: board strip, notes, measurement callouts. Annotations, not product copy. */
.pub-ann{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#e9e7ef;border-bottom:1px solid #d9d6e1;
  font:600 11px/1.4 'Roboto Mono',ui-monospace,monospace;color:#3f3b47;letter-spacing:.01em}
.pub-ann b{font-weight:700;color:#141118}
.pub-ann .pub-fe{padding:2px 8px;border-radius:5px;border:1px solid #6b6577;background:#fff;color:#141118}
.pub-ann .pub-rep{color:#6b6577}
.pub-note{font:500 11.5px/1.5 'Roboto Mono',ui-monospace,monospace;color:#3f3b47;background:#fffbeb;border:1px dashed #b45309;border-radius:8px;padding:8px 11px}
.pub-note b{color:#141118}
.pub-note.is-v{background:#faf7ff;border-color:#7c3aed}
.pub-meas{font:600 11.5px/1.45 'Roboto Mono',ui-monospace,monospace;color:#141118;background:#fff;border:1px solid #141118;border-radius:7px;padding:6px 9px;white-space:nowrap}
.pub-meas.is-dkm{background:#141118;color:#fff;border-color:#fff}
.pub-sheet{background:#eeedf2;padding:28px;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.pub-sheet.is-col{flex-direction:column}
.pub-cap{font:600 11px/1.4 'Roboto Mono',ui-monospace,monospace;color:#6b6577;margin-bottom:8px}
.pub-fr-box{border:1px solid rgba(24,24,27,.14);border-radius:10px;overflow:hidden;background:#fff;flex:none;width:max-content}

/* Hero */
.pub-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--p-l1)}
.pub-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 40%}
.pub-hero-veil{position:absolute;inset:0;background:linear-gradient(100deg,#fff 0%,rgba(255,255,255,.96) 42%,rgba(255,255,255,.62) 68%,rgba(109,40,217,.14) 100%)}
.pub-hero-body{position:relative;padding-top:104px;padding-bottom:96px}
.pub-hero-body .pub-h1{margin-top:22px;max-width:820px}
.pub-hero-body .pub-hero-copy{margin-top:26px;max-width:600px}
.pub-hero-btns{display:flex;gap:11px;flex-wrap:wrap;margin-top:34px}
.pub-hero-more{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:18px}
.pub-hero-more .pub-tl{font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.pub-hero-fine{font-size:13px;color:var(--p-mut);line-height:1.55}
.pub-t .pub-hero-body{padding-top:84px;padding-bottom:80px}
.pub-t .pub-hero-veil{background:linear-gradient(100deg,#fff 0%,rgba(255,255,255,.96) 55%,rgba(255,255,255,.8) 80%,rgba(255,255,255,.55) 100%)}
.pub-p .pub-hero{border-bottom:0}
.pub-p .pub-hero-body{padding-top:40px;padding-bottom:28px}
.pub-p .pub-hero-body .pub-h1{margin-top:16px}
.pub-p .pub-hero-body .pub-hero-copy{margin-top:18px;font-size:16px}
.pub-p .pub-hero-btns{flex-direction:column;margin-top:26px}
.pub-p .pub-hero-btns .pub-btn{width:100%}
.pub-p .pub-hero-more{flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px}
.pub-hero-art{display:block;width:100%;height:220px;object-fit:cover;object-position:18% 60%;border-bottom:1px solid var(--p-l1)}

/* Sections */
.pub-sec{padding-top:88px;padding-bottom:88px}
.pub-band{background:var(--p-band);border-top:1px solid var(--p-l1);border-bottom:1px solid var(--p-l1)}
.pub-p .pub-sec{padding-top:56px;padding-bottom:56px}
.pub-t .pub-sec{padding-top:72px;padding-bottom:72px}
.pub-p.pub-t .pub-sec{padding-top:56px;padding-bottom:56px}
.pub-shead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.pub-shead .pub-h2{margin-top:14px}

/* Demonstration */
.pub-demo-grid{display:grid;grid-template-columns:1fr 1.15fr .85fr;gap:18px;margin-top:34px;align-items:stretch}
.pub-t .pub-demo-grid{grid-template-columns:1fr 1fr}
.pub-t .pub-demo-grid > :nth-child(3){grid-column:1 / -1}
.pub-p .pub-demo-grid{grid-template-columns:1fr;gap:14px;margin-top:24px}
.pub-p .pub-demo-grid > :nth-child(3){grid-column:auto}
.pub-panel{padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px}
.pub-panel-h{display:flex;align-items:baseline;gap:10px}
.pub-panel-h .pub-mono{font-size:12px;font-weight:700;color:var(--pv)}
.pub-panel-h h3{font-size:17px;letter-spacing:-.02em}
.pub-inote{border:1px solid var(--p-l2);border-left:3px solid var(--pv);border-radius:10px;padding:14px 16px;background:#fff}
.pub-inote-m{font-family:var(--pf-m);font-size:11.5px;color:var(--p-mut);line-height:1.5}
.pub-quote{font-size:16px;line-height:1.55;color:var(--p-ink);margin-top:10px!important;font-weight:500}
.pub-slide{border:1px solid var(--p-l3);border-radius:10px;background:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:12px;aspect-ratio:16/9;justify-content:space-between}
.pub-p .pub-slide{aspect-ratio:auto}
.pub-slide-k{font-family:var(--pf-m);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p-mut)}
.pub-slide-t{font-family:var(--pf-d);font-weight:800;font-size:19px;line-height:1.22;letter-spacing:-.02em;color:var(--p-ink)}
.pub-slide-src{border-top:1px solid var(--p-l2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.pub-slide-src .pub-sq{font-size:12.5px;line-height:1.5;color:var(--p-body)}
.pub-slide-src .pub-sk{font-family:var(--pf-m);font-size:10.5px;color:var(--p-mut)}
.pub-limit{font-size:14.5px;line-height:1.66;color:var(--p-body)}

/* How it works */
.pub-root .pub-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.pub-root.pub-p .pub-steps{grid-template-columns:1fr;gap:12px;margin-top:24px}
.pub-step{padding:24px 22px;display:flex;flex-direction:column;gap:9px}
.pub-step-n{font-family:var(--pf-m);font-size:12px;font-weight:700;color:var(--pv)}
.pub-step h3{font-size:19px;letter-spacing:-.022em}
.pub-step p{font-size:14.5px;color:var(--p-body);line-height:1.62;flex:1}
.pub-step .pub-chip{align-self:flex-start;margin-top:6px}
.pub-eadline{margin-top:22px!important;font-size:14.5px;color:var(--p-body);line-height:1.6}

/* Find your role */
.pub-roles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:34px}
.pub-t .pub-roles{grid-template-columns:1fr 1fr}
.pub-rc{overflow:hidden;display:flex;flex-direction:column}
.pub-rc img{display:block;width:100%;height:150px;object-fit:cover;object-position:62% 30%}
.pub-rc-b{padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.pub-rc-chips{display:flex;gap:6px;flex-wrap:wrap}
.pub-rc-b p{font-size:14.5px;color:var(--p-body);line-height:1.6;flex:1}
.pub-rc-b .pub-tl{font-size:14px;min-height:32px;display:inline-flex;align-items:center}
.pub-p .pub-roles{grid-template-columns:1fr;gap:10px;margin-top:22px}
.pub-p .pub-rc{flex-direction:row;align-items:stretch}
.pub-p .pub-rc img{width:84px;height:auto;min-height:100%;flex:none;object-position:60% 30%}
.pub-p .pub-rc-b{padding:14px 16px;gap:7px}
.pub-p .pub-rc-b p{font-size:14.5px}
.pub-quiet{display:flex;align-items:center;gap:8px 26px;flex-wrap:wrap;margin-top:26px}
.pub-quiet a{font-size:13.5px;font-weight:600;color:var(--p-ink2);text-decoration:underline;text-decoration-color:var(--p-l3);text-underline-offset:4px;min-height:32px;display:inline-flex;align-items:center}
.pub-p .pub-quiet{flex-direction:column;align-items:flex-start;gap:2px}
.pub-p .pub-quiet a{min-height:44px}

/* Spin-Out Lab band */
.pub-lab{position:relative;overflow:hidden;background:#141118;color:#fff}
.pub-lab-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 46%}
.pub-lab-veil{position:absolute;inset:0;background:linear-gradient(96deg,rgba(20,17,24,.95) 0%,rgba(20,17,24,.88) 44%,rgba(20,17,24,.66) 72%,rgba(20,17,24,.5) 100%)}
.pub-lab-in{position:relative;padding-top:72px;padding-bottom:72px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.pub-lab .pub-h2{margin-top:14px;color:#fff}
.pub-lab-copy{font-size:15.5px;line-height:1.68;color:rgba(255,255,255,.84);margin-top:14px!important;max-width:520px}
.pub-lab .pub-btn{margin-top:26px}
.pub-coh{justify-self:end;width:100%;max-width:440px;background:rgba(20,17,24,.78);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:20px 22px}
.pub-coh-k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv-lav)}
.pub-coh dl{margin:10px 0 0;display:grid}
.pub-coh-r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.pub-coh-r:first-child{border-top:0}
.pub-coh dt{font-size:14px;color:rgba(255,255,255,.8)}
.pub-coh dd{margin:0;font-family:var(--pf-m);font-size:15px;font-weight:600;color:#fff;text-align:right}
.pub-coh-msg{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.88);margin-top:10px!important}
.pub-coh-msg b{color:#fff}
.pub-coh .pub-btn{margin-top:14px}
.pub-t .pub-lab-in{grid-template-columns:1fr;gap:30px}
.pub-t .pub-coh{justify-self:start}
.pub-p .pub-lab-in{padding-top:52px;padding-bottom:52px}
.pub-p .pub-lab .pub-btn{width:100%}
.pub-solo{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:20px;align-items:center;padding-top:40px;padding-bottom:40px}
.pub-solo h3{font-size:21px;letter-spacing:-.022em}
.pub-solo-i{border:1px solid var(--p-l2);border-radius:13px;padding:14px 16px}
.pub-solo-i b{display:block;font-size:14.5px;font-weight:700}
.pub-solo-i span{display:block;font-size:13.5px;color:var(--p-mut);line-height:1.5;margin-top:2px}
.pub-t .pub-solo{grid-template-columns:1fr 1fr}
.pub-t .pub-solo h3{grid-column:1 / -1}
.pub-p .pub-solo{grid-template-columns:1fr;gap:12px}

/* The firm and the product */
.pub-fp{display:grid;grid-template-columns:1fr 1fr .9fr;gap:24px;align-items:stretch}
.pub-fp.is-two{grid-template-columns:1fr 1fr}
.pub-t .pub-fp{grid-template-columns:1fr 1fr}
.pub-t .pub-fp > .pub-essay{grid-column:1 / -1}
.pub-p .pub-fp{grid-template-columns:1fr}
.pub-half{border-top:2px solid var(--pv);padding-top:22px;display:flex;flex-direction:column;gap:12px}
.pub-half h3{font-size:24px;letter-spacing:-.026em}
.pub-half p{font-size:15px;color:var(--p-body);line-height:1.66}
.pub-half .pub-links{display:flex;gap:22px;flex-wrap:wrap}
.pub-half .pub-tl{font-size:14px;min-height:32px;display:inline-flex;align-items:center}
.pub-essay{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.pub-essay h3{font-size:19px;line-height:1.3;letter-spacing:-.02em}
.pub-essay .pub-mono{font-size:12px;color:var(--p-mut)}
.pub-essay .pub-tl{font-size:14px;margin-top:auto}

/* Closing band */
.pub-close{position:relative;border-radius:22px;overflow:hidden;padding:56px 56px;display:flex;align-items:center;justify-content:space-between;gap:38px;flex-wrap:wrap;background:#141118}
.pub-close-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.pub-close-veil{position:absolute;inset:0;background:linear-gradient(115deg,rgba(20,17,24,.86) 0%,rgba(20,17,24,.7) 46%,rgba(20,17,24,.42) 100%)}
.pub-close h2{position:relative;font-size:31px;line-height:1.14;letter-spacing:-.03em;color:#fff;max-width:560px}
.pub-close .pub-hero-btns{position:relative;margin-top:0}
.pub-p .pub-close{padding:36px 22px;border-radius:18px}
.pub-p .pub-close h2{font-size:26px}
.pub-p .pub-close .pub-hero-btns{width:100%}

/* Docs (site kit, handoff) */
.pub-doc{background:#fff;padding:40px 44px;font-family:var(--pf);color:var(--p-ink)}
.pub-doc h2{font-family:var(--pf-d);font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.pub-doc h3{font-family:var(--pf-d);font-size:16px;letter-spacing:-.01em;margin:26px 0 8px}
.pub-doc p,.pub-doc li{font-size:13.5px;line-height:1.6;color:var(--p-body)}
.pub-doc ul.pub-ul{list-style:disc;padding-left:18px;display:grid;gap:4px}
.pub-doc code{font-family:var(--pf-m);font-size:12px;background:#f4f3f7;border-radius:4px;padding:1px 5px;color:var(--p-ink)}
.pub-doc table{border-collapse:collapse;width:100%;margin-top:6px}
.pub-doc th,.pub-doc td{text-align:left;vertical-align:top;border-top:1px solid var(--p-l2);padding:8px 10px 8px 0;font-size:12.5px;line-height:1.5;color:var(--p-body)}
.pub-doc th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--p-mut);font-weight:800}
.pub-doc td b{color:var(--p-ink)}
.pub-doc-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}
.pub-sw{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--p-body)}
.pub-sw i{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.08);flex:none}
.pub-sw code{margin-left:auto}
.pub-coh dd .pub-st{font-family:var(--pf);font-size:14px}
/* ===== PROGRAM PRESENTATION KIT CSS (#6965; defined by the Spin-Out Lab pilot #6966) =====
   Copy this file verbatim into each sibling build (#6967-#6975): pub_site.css,pub_extra.css,pgs_kit.css,<pfx>_extra.css.
   It styles the PK functions in the PROGRAM PRESENTATION KIT block of pgs.js. Every class starts pgs-.
   Public page: lives under .pub-root and uses its tokens (--pv, --p-ink, --pf, --pf-d, --pf-m ...).
   Slides: .pgs-sl is a 1920x1080 page with its own --s-* tokens; .pgs-sl.is-gray is the grayscale print variant.
   Admin entry points: .pgs-app uses the app palette (Space Grotesk, #F4F3F7 page, #7C3AED violet). */

/* --- Availability label: a word and a glyph, never colour alone --- */
.pgs-av{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.02em;
  line-height:1.3;white-space:nowrap;border:1px solid var(--p-l3);background:#fff;color:var(--p-ink);font-family:var(--pf)}
.pgs-av i{font-style:normal;font-family:var(--pf-m);font-size:11px;letter-spacing:0}
.pgs-av.is-apply{border-color:#c4b5fd;background:var(--pv-wash);color:#5b21b6}
.pgs-av.is-open{border-color:#a7e3c9;background:#e9f8f1;color:#047857}
.pgs-av.is-invite,.pgs-av.is-assigned{border-color:#cbd5e1;background:#f1f5f9;color:#334155}
.pgs-av.is-proposed{border-style:dashed;border-color:#9a96a8;background:#fff;color:#4a4553}
.pgs-av.is-notyet,.pgs-av.is-closed{background:#f4f3f7;color:#4a4553}
.pgs-av.is-lg{font-size:13px;padding:6px 14px}
.pgs-av.is-dk{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);color:#fff}

/* --- Download PDF: ink outline and a file glyph, never the violet of apply/sign in --- */
.pgs-dl{display:inline-flex;align-items:center;gap:12px;min-height:54px;padding:9px 20px 9px 14px;border-radius:11px;border:1.5px solid var(--p-ink);
  background:#fff;color:var(--p-ink);text-align:left;font-family:var(--pf)}
.pgs-dl svg{width:24px;height:24px;flex:none}
.pgs-dl-t{display:flex;flex-direction:column;line-height:1.25}
.pgs-dl-t b{font-size:14.5px;font-weight:800}
.pgs-dl-t small{font-family:var(--pf-m);font-size:11.5px;color:var(--p-mut);letter-spacing:-.01em}
.pgs-dl.is-full{display:flex;width:100%}
.pgs-dl.is-dk{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.pgs-dl.is-dk small{color:rgba(255,255,255,.78)}
.pub-root .pgs-dl.pub-fr.is-dk{outline-color:var(--pv-lil)}
.pgs-print{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:10px 4px;font-size:13.5px;font-weight:700;color:var(--p-body);
  text-decoration:underline;text-underline-offset:3px;min-height:44px;font-family:var(--pf)}
.pgs-print svg{width:16px;height:16px}

/* --- Hero: program name and purpose first --- */
.pgs-hero{border-bottom:1px solid var(--p-l1);background:#fff}
.pgs-hero-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.85fr);gap:64px;align-items:start;padding-top:44px;padding-bottom:60px}
.pub-t .pgs-hero-in{grid-template-columns:1fr;gap:32px}
.pub-p .pgs-hero-in{padding-top:20px;padding-bottom:36px;gap:28px}
.pgs-crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--p-mut);min-height:32px}
.pgs-hero-av{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.pgs-hero-eb{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv)}
.pub-root .pgs-h1{font-size:88px;line-height:.95;letter-spacing:-.05em;margin-top:18px}
.pub-p .pgs-h1{font-size:50px}
.pub-root .pgs-purpose{font-size:27px;line-height:1.32;letter-spacing:-.015em;color:var(--p-ink);font-weight:500;margin-top:20px;max-width:740px}
.pub-p .pgs-purpose{font-size:20px}
.pub-root .pgs-aud{font-size:15px;line-height:1.6;color:var(--p-body);margin-top:16px;max-width:660px}
.pgs-aud b{color:var(--p-ink);margin-right:6px}
.pgs-hero-dl{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px}
.pub-p .pgs-hero-dl{flex-direction:column;align-items:stretch;gap:4px}

/* --- The availability panel (right of the hero; below it at 1060px and narrower) --- */
.pgs-panel{background:var(--p-ink);color:#fff;border-radius:18px;padding:24px 26px}
.pgs-panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.14)}
.pgs-panel-k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv-lav)}
.pgs-panel .pub-coh{background:transparent;border:0;padding:14px 0 0;max-width:none;justify-self:auto}
.pgs-panel-act{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.pub-root .pgs-panel-fine{font-size:13px;color:rgba(255,255,255,.8);line-height:1.5}
.pgs-panel-fine a{color:var(--pv-lil);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* --- Section nav (the five sections, in their fixed order) --- */
.pgs-toc{border-bottom:1px solid var(--p-l1);background:#fff}
.pgs-toc ol{display:flex;margin:0 auto;gap:8px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px;align-items:center}
.pgs-toc-k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--p-mut);margin-right:8px}
.pgs-toc a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--p-body);border:1px solid var(--p-l2)}
.pgs-toc a b{font-family:var(--pf-m);font-size:11.5px;color:var(--pv)}
.pub-root.pub-p .pgs-toc ol{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pub-p .pgs-toc-k{grid-column:1/-1}
.pub-p .pgs-toc a{display:flex;height:100%;border-radius:10px;min-height:44px;font-size:13px;padding:8px 10px}

/* --- Sections --- */
.pgs-sec-in{padding-top:80px;padding-bottom:80px}
.pub-p .pgs-sec-in{padding-top:48px;padding-bottom:48px}
.pgs-sec-k{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv)}
.pgs-sec-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--pv);color:#fff;font-family:var(--pf-m);font-size:12px;letter-spacing:0}
.pub-root .pgs-sec-h{margin-top:14px;max-width:880px}
.pub-root .pgs-lead{font-size:16px;line-height:1.65;color:var(--p-body);margin-top:12px;max-width:740px}
.pgs-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.pgs-cols.is-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pub-t .pgs-cols,.pub-t .pgs-cols.is-3{grid-template-columns:1fr}
.pgs-card{background:#fff;border:1px solid var(--p-l2);border-radius:15px;padding:24px 26px}
.pub-p .pgs-card{padding:20px 18px}
.pgs-card h3{font-size:20px;letter-spacing:-.02em;line-height:1.25}
.pub-root .pgs-card>p{font-size:14.5px;line-height:1.55;color:var(--p-body);margin-top:8px}
.pgs-card-n{display:block;font-family:var(--pf-m);font-size:12px;font-weight:600;color:var(--pv);margin-bottom:8px}
.pub-root .pgs-aside{margin-top:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--p-body)}
.pgs-aside b{color:var(--p-ink)}

/* --- The journey: horizontal at 1440, stacked at 1060 and narrower --- */
.pub-root .pgs-tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:40px}
.pgs-tl>li{position:relative;padding:36px 26px 0 0}
.pgs-tl>li::before{content:'';position:absolute;left:0;right:0;top:9px;height:2px;background:var(--pv)}
.pgs-tl>li:last-child::before{right:26px}
.pgs-tl-node{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:99px;background:#fff;border:3px solid var(--pv);z-index:1}
.pgs-tl-k{font-family:var(--pf-m);font-size:12.5px;font-weight:600;color:#5b21b6;letter-spacing:-.01em}
.pub-root .pgs-tl h3{font-size:28px;line-height:1.12;letter-spacing:-.03em;margin-top:6px}
.pub-root .pgs-tl ul{margin-top:12px;display:grid;gap:8px}
.pgs-tl ul li{font-size:14.5px;line-height:1.55;color:var(--p-body);padding-left:16px;position:relative}
.pgs-tl ul li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:99px;background:var(--pv-lav)}
.pub-root.pub-t .pgs-tl{grid-template-columns:1fr;margin-top:28px}
.pub-t .pgs-tl>li{padding:0 0 28px 40px}
.pub-t .pgs-tl>li::before{left:9px;right:auto;top:20px;bottom:0;width:2px;height:auto}
.pub-t .pgs-tl>li:last-child::before{display:none}
.pub-t .pgs-tl>li:last-child{padding-bottom:0}
.pub-p .pgs-tl h3{font-size:23px}
.pub-root .pgs-tl-span{margin-top:30px;border:1.5px dashed var(--pv-b);border-radius:12px;padding:14px 18px;display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;background:#faf7ff}
.pgs-tl-span b{font-size:14.5px;color:var(--p-ink)}
.pgs-tl-span span{font-size:14px;color:var(--p-body);line-height:1.5}
.pub-root .pgs-tl-along{margin-top:14px;font-size:14px;color:var(--p-body);line-height:1.55}

/* --- Steps, lists and terms --- */
.pub-root .pgs-stg{display:grid;margin-top:12px}
.pgs-stg li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--p-l1);font-size:14.5px;line-height:1.5;color:var(--p-ink)}
.pgs-stg li:first-child{border-top:0}
.pgs-stg-n{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:99px;border:1.5px solid var(--pv);color:#5b21b6;font-family:var(--pf-m);font-weight:600;font-size:12.5px}
.pub-root .pgs-list{display:grid;margin-top:12px}
.pgs-list li{padding:12px 0;border-top:1px solid var(--p-l1)}
.pgs-list li:first-child{border-top:0}
.pgs-list b{display:block;font-size:14.5px;color:var(--p-ink)}
.pgs-list span{display:block;font-size:14px;color:var(--p-body);line-height:1.5;margin-top:2px}
.pub-root .pgs-terms{display:grid;margin:28px 0 0;border-top:1px solid var(--p-l2)}
.pgs-terms>div{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--p-l2)}
.pub-p .pgs-terms>div{grid-template-columns:1fr;gap:4px}
.pgs-terms dt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--p-mut);padding-top:3px}
.pgs-terms dd{margin:0;font-size:15px;line-height:1.55;color:var(--p-ink)}
.pgs-limits{margin-top:28px;border-left:4px solid var(--p-ink);background:var(--p-band);padding:18px 22px;border-radius:0 12px 12px 0}
.pub-root .pgs-limits h3{font-size:17px;letter-spacing:-.01em}
.pub-root .pgs-limits p{font-size:14.5px;color:var(--p-body);margin-top:6px;line-height:1.55}

/* --- Next step band: participation, sign-in and enquiry apart; the PDF apart again --- */
.pgs-next{background:var(--p-ink);color:#fff;border-radius:22px;padding:44px 48px}
.pub-p .pgs-next{padding:28px 20px;border-radius:16px}
.pub-root .pgs-next h2{font-size:40px;letter-spacing:-.035em;line-height:1.1}
.pub-p .pgs-next h2{font-size:28px}
.pgs-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}
.pub-t .pgs-acts{grid-template-columns:1fr}
.pgs-act{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pgs-act-who{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv-lav)}
.pub-root .pgs-act p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82)}
.pub-root .pgs-act .pub-tl{color:var(--pv-lil);font-size:14.5px;min-height:44px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px}
.pub-p .pgs-act .pub-btn{width:100%}
.pgs-take{margin-top:24px;padding-top:22px;border-top:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pgs-take>span{font-size:13.5px;color:rgba(255,255,255,.82)}
.pub-p .pgs-take{flex-direction:column;align-items:stretch;gap:10px}

/* --- Annotations (not product copy): backend ◇, owner ⚑, reading order --- */
.pgs-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font:600 11px/1.45 'Roboto Mono',ui-monospace,monospace;vertical-align:middle;letter-spacing:0;text-transform:none}
.pgs-tag.is-d{border:1.5px dashed #7c3aed;color:#5b21b6;background:#faf7ff}
.pgs-tag.is-f{border:1.5px solid #b45309;color:#92400e;background:#fffbeb}
.pgs-ord{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:#0f766e;color:#fff;
  font:700 11.5px/1 'Roboto Mono',ui-monospace,monospace;margin-right:8px;vertical-align:middle;letter-spacing:0;flex:none}
.pgs-ex{display:inline-flex;padding:2px 8px;border-radius:6px;border:1px dashed #6b6577;font:600 10.5px/1.45 'Roboto Mono',monospace;color:#4a4553;background:#f4f3f7}

/* --- Slides: 1920x1080, 96px margins, selectable text, no text under 22px --- */
.pgs-sl{box-sizing:border-box;--s-acc:#6d28d9;--s-acc-ink:#5b21b6;--s-wash:#f4f0fe;--s-line:#dedce4;--s-mut:#5f5a69;--s-body:#3f3b47;
  background:#fff;color:#141118;display:flex;flex-direction:column;padding:56px 96px 48px;font-family:var(--pf);font-size:28px;line-height:1.4}
.pgs-sl-top{display:flex;align-items:center;gap:20px;height:44px;flex:none}
.pgs-sl-top .pub-logo{height:36px}
.pgs-sl-top .pub-logo img{width:36px;height:36px}
.pgs-sl-top .pub-logo b{font-size:25px}
.pgs-sl-prog{font-size:24px;font-weight:700;color:var(--s-body);padding-left:20px;border-left:2px solid var(--s-line);line-height:36px}
.pgs-sl-n{margin-left:auto;font-family:var(--pf-m);font-size:22px;font-weight:600;color:var(--s-mut)}
.pgs-sl-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:20px 0}
.pgs-sl-foot{display:flex;justify-content:space-between;align-items:center;flex:none;border-top:2px solid var(--s-line);padding-top:16px;font-family:var(--pf-m);font-size:22px;color:var(--s-mut)}
.pgs-sl-eb{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--s-acc-ink)}
.pub-root .pgs-sl-h{font-size:76px;line-height:1.04;letter-spacing:-.04em;margin-top:14px;max-width:1560px}
.pgs-sl .pgs-av{font-size:26px;padding:10px 24px;gap:12px;border-width:2px}
.pgs-sl .pgs-av i{font-size:22px}
.pgs-cov{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:72px;align-items:center;height:100%}
.pub-root .pgs-cov-name{font-size:150px;line-height:.92;letter-spacing:-.055em;margin-top:30px}
.pub-root .pgs-cov-purpose{font-size:46px;line-height:1.26;letter-spacing:-.015em;font-weight:500;margin-top:34px}
.pub-root .pgs-cov-aud{font-size:28px;color:var(--s-body);margin-top:26px;line-height:1.45}
.pub-root .pgs-cov-ed{font-family:var(--pf-m);font-size:24px;color:var(--s-mut);margin-top:30px}
.pgs-cov-img{border-radius:28px;overflow:hidden;height:780px;background:#1a1328}
.pgs-cov-img img{width:100%;height:100%;object-fit:cover;display:block}
.pub-root .pgs-stl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:60px}
.pgs-stl>li{position:relative;padding:58px 40px 0 0}
.pgs-stl>li::before{content:'';position:absolute;left:0;right:0;top:15px;height:4px;background:var(--s-acc)}
.pgs-stl>li:last-child::before{right:40px}
.pgs-stl-node{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:99px;background:#fff;border:5px solid var(--s-acc);z-index:1}
.pgs-stl-k{font-family:var(--pf-m);font-size:24px;font-weight:600;color:var(--s-acc-ink)}
.pub-root .pgs-stl h3{font-size:48px;line-height:1.06;letter-spacing:-.035em;margin-top:10px}
.pub-root .pgs-stl p{font-size:26px;line-height:1.42;color:var(--s-body);margin-top:14px}
.pub-root .pgs-stl-span{margin-top:48px;border:3px dashed var(--s-acc);border-radius:20px;padding:22px 30px;font-size:27px;line-height:1.4;color:var(--s-body);background:var(--s-wash)}
.pgs-stl-span b{color:#141118}
.pub-root .pgs-scards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;margin-top:60px}
.pgs-scard{border:2px solid var(--s-line);border-radius:24px;padding:40px 40px 44px}
.pgs-scard-n{font-family:var(--pf-m);font-size:26px;font-weight:600;color:var(--s-acc-ink)}
.pub-root .pgs-scard h3{font-size:46px;line-height:1.08;letter-spacing:-.03em;margin-top:18px}
.pub-root .pgs-scard p{font-size:28px;line-height:1.42;color:var(--s-body);margin-top:16px}
.pgs-s2{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:52px}
.pgs-s2-k{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--s-mut);padding-bottom:10px}
.pgs-sstg li{display:flex;gap:26px;align-items:center;padding:17px 0;border-top:2px solid var(--s-line);font-size:32px;line-height:1.28}
.pgs-sstg li:first-child{border-top:0}
.pgs-sstg-n{flex:none;display:inline-grid;place-items:center;width:54px;height:54px;border-radius:99px;border:3px solid var(--s-acc);color:var(--s-acc-ink);font-family:var(--pf-m);font-size:24px;font-weight:600}
.pgs-slist li{padding:17px 0;border-top:2px solid var(--s-line)}
.pgs-slist li:first-child{border-top:0}
.pgs-slist b{display:block;font-size:34px;letter-spacing:-.02em;line-height:1.2}
.pgs-slist span{display:block;font-size:27px;line-height:1.38;color:var(--s-body);margin-top:6px}
.pgs-clo{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:72px;margin-top:44px;align-items:start}
.pgs-clo-rows li{display:grid;grid-template-columns:270px 1fr;gap:28px;padding:16px 0;border-top:2px solid var(--s-line);font-size:28px;line-height:1.36}
.pgs-clo-rows li:first-child{border-top:0}
.pgs-clo-rows b{font-size:21px;text-transform:uppercase;letter-spacing:.1em;color:var(--s-mut);padding-top:5px;line-height:1.3}
.pgs-clo-next{background:#141118;color:#fff;border-radius:28px;padding:44px 48px;display:flex;flex-direction:column;gap:30px}
.pgs-clo-k{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#c4b5fd}
.pub-root .pgs-clo-url{font-family:var(--pf-m);font-size:36px;font-weight:600;color:#fff;margin-top:8px;letter-spacing:-.02em;line-height:1.25}
.pub-root .pgs-clo-w{font-size:25px;color:rgba(255,255,255,.84);margin-top:6px;line-height:1.4}
/* Grayscale print variant: no fill depends on hue; dark panels print as outlines to save toner. */
.pgs-sl.is-gray{--s-acc:#141118;--s-acc-ink:#141118;--s-wash:#f3f3f3;--s-line:#c4c4c4;--s-mut:#4d4d4d;--s-body:#262626}
.pgs-sl.is-gray img{filter:grayscale(1) contrast(1.05)}
.pgs-sl.is-gray .pgs-av{background:#fff;border-color:#141118;color:#141118}
.pgs-sl.is-gray .pgs-clo-next{background:#fff;color:#141118;border:3px solid #141118}
.pgs-sl.is-gray .pgs-clo-k,.pgs-sl.is-gray .pgs-clo-url{color:#141118}
.pgs-sl.is-gray .pgs-clo-w{color:#262626}
.pgs-sl.is-gray .pgs-cov-img{background:#fff}

/* --- Scaled slide (contact sheet, grayscale sheet) --- */
.pgs-thumb{margin:0;display:flex;flex-direction:column;gap:8px}
.pgs-thumb-box{overflow:hidden;border:1px solid rgba(24,24,27,.2);border-radius:6px;background:#fff;position:relative}
.pgs-thumb-in{transform-origin:0 0;width:1920px;height:1080px}
.pgs-thumb figcaption{font:500 11.5px/1.5 'Roboto Mono',ui-monospace,monospace;color:#3f3b47}
.pgs-thumb figcaption b{color:#141118;font-weight:700}
.pgs-sheet{display:grid;gap:28px 24px;padding:28px;background:#eeedf2}

/* --- Public Programs index --- */
.pub-root .pgs-idx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.pub-root.pub-t .pgs-idx{grid-template-columns:1fr 1fr}
.pub-root.pub-p .pgs-idx{grid-template-columns:1fr}
.pgs-ic{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--p-l2);border-radius:16px;background:#fff}
.pgs-ic-g{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--p-mut)}
.pub-root .pgs-ic h3{font-size:26px;letter-spacing:-.03em;line-height:1.1}
.pub-root .pgs-ic p{font-size:14.5px;color:var(--p-body);line-height:1.55}
.pub-root .pgs-ic .pgs-ic-who{font-size:13px;color:var(--p-mut)}
.pub-root .pgs-ic-live{font-size:13px;color:var(--p-body)}
.pgs-ic-a{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--p-l1)}
.pgs-ic-a .pub-tl{min-height:44px;display:inline-flex;align-items:center}
.pgs-ic-pdf{font-size:13px;font-weight:700;color:var(--p-ink);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.pgs-ic-pdf svg{width:16px;height:16px}

/* --- Admin entry points (app look: Space Grotesk, #F4F3F7, #7C3AED) --- */
.pgs-app{box-sizing:border-box;--a-bg:#F4F3F7;--a-ink:#18181B;--a-mut:#5f5b66;--a-line:#e6e4ea;--a-v:#7C3AED;--a-vd:#5b21b6;--a-lav:#F4F0FE;
  font-family:'Space Grotesk',system-ui,sans-serif;background:var(--a-bg);color:var(--a-ink);padding:24px 28px;text-align:left;font-size:13px;line-height:1.5}
.pgs-app *{box-sizing:border-box}
.pgs-app a{text-decoration:none;color:inherit}
.pgs-app p{margin:0}
.pgs-app-crumb{font:700 11px 'Roboto Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--a-mut)}
.pgs-app h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0;line-height:1.2}
.pgs-app-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pgs-app-card{background:#fff;border:1px solid var(--a-line);border-radius:14px;overflow:hidden}
.pgs-app table{width:100%;border-collapse:collapse}
.pgs-app th,.pgs-app td{text-align:left;vertical-align:top;padding:12px 14px;border-top:1px solid var(--a-line);font-size:12.5px;font-weight:400}
.pgs-app thead th{border-top:0;font:700 10.5px 'Roboto Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--a-mut);background:#fbfafc}
.pgs-ad-name{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--a-vd);text-decoration:underline!important;text-decoration-thickness:1px!important;text-underline-offset:3px}
.pgs-ad-name svg{width:13px;height:13px}
.pgs-ad-plain{font-size:14px;font-weight:700}
.pgs-ad-sub{display:block;font-size:12px;color:var(--a-mut);margin-top:3px;line-height:1.45}
.pgs-ad-hint{display:inline-flex;gap:5px;font:600 10.5px/1.4 'Roboto Mono',monospace;color:var(--a-mut);margin-top:5px}
.pgs-ad-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;border:1px solid var(--a-line);font-size:11px;font-weight:700;background:#fff;white-space:nowrap}
.pgs-ad-pill.is-live::before{content:'';width:6px;height:6px;border-radius:99px;background:#059669}
.pgs-ad-pill.is-prop{border-style:dashed}
.pgs-ad-btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--a-line);background:#fff;font-size:13px;font-weight:700;color:var(--a-ink);white-space:nowrap}
.pgs-ad-btn svg{width:14px;height:14px}
.pgs-ad-btn.is-pres{border-color:#c4b5fd;color:var(--a-vd);background:var(--a-lav)}
.pgs-ad-btn.is-ph{min-height:44px}
.pgs-ad-tabs{display:flex;gap:20px;border-bottom:1px solid var(--a-line);margin-top:18px;flex-wrap:wrap}
.pgs-ad-tabs span{padding:10px 0;font-size:13px;font-weight:600;color:var(--a-mut)}
.pgs-ad-tabs span.is-cur{color:var(--a-ink);border-bottom:2px solid var(--a-v)}
.pgs-ad-facts{margin-top:12px;display:inline-flex;flex-wrap:wrap;gap:6px;padding:7px 12px;border:1px solid var(--a-line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600}
.pgs-ad-fr{outline:2px solid var(--a-v);outline-offset:3px;border-radius:6px}
.pgs-ad-ph{list-style:none;margin:0;padding:0 16px}
.pgs-ad-ph li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--a-line)}
.pgs-ad-ph li:first-child{border-top:0}
.pgs-ad-ph .pgs-ad-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.pgs-ad-ph .pgs-ad-name{min-height:32px}
/* ===== END PROGRAM PRESENTATION KIT CSS ===== */
/* PGL board styles (#6973, Learning). The reusable kit CSS is pgs_kit.css; every class here starts pgl-. */
/* The added availability word (PK.AV.each) */
.pgs-av.is-each{border-color:#c4b5fd;background:var(--pv-wash);color:#5b21b6}
.pgs-av.is-each.is-dk{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}

/* Hero panel body */
.pgl-pan{padding-top:14px}
.pub-root .pgl-pan-lead{font-size:15px;line-height:1.5;color:#fff}
.pgl-pan-l{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.pub-root .pgl-pan-l li{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.82);padding-left:14px;border-left:2px solid rgba(255,255,255,.22)}
.pgl-pan-l b{color:#fff}
.pgs-panel .pgs-tag{margin-left:4px}

/* "Illustration" chip: dashed, never looks like a credential */
.pgl-ex{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #6b6577;border-radius:99px;padding:4px 12px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#4a4553;background:#fff}
.pgl-ex.is-s{font-size:20px;padding:8px 22px;border-width:3px}

/* Course outline (web) */
.pgl-ol{margin:32px 0 0;background:#fff;border:1px solid var(--p-l2);border-radius:18px;padding:28px 30px}
.pub-p .pgl-ol{padding:20px 16px}
.pub-root .pgl-ol-crumb{margin-top:16px;font-size:13px;font-weight:700;color:var(--p-mut)}
.pgl-ol-crumb i{font-style:normal;margin:0 6px;color:var(--p-faint)}
.pub-root .pgl-ol-h h3{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
.pub-root .pgl-ol-mod{font-family:var(--pf-m);font-size:12.5px;color:var(--p-mut);margin-top:6px}
.pgl-ol-steps{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;position:relative}
.pgl-ol-steps>li{position:relative;border:1.5px solid var(--p-l3);border-radius:14px;padding:20px 20px 18px;display:flex;flex-direction:column;background:#fff}
.pgl-ol-steps>li:not(:last-child)::after{content:'→';position:absolute;right:-31px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:var(--pv)}
.pub-t .pgl-ol-steps{grid-template-columns:1fr;gap:28px}
.pub-t .pgl-ol-steps>li:not(:last-child)::after{content:'↓';right:auto;left:22px;top:auto;bottom:-27px;transform:none}
.pgl-ol-steps>li.is-exr{border-style:dashed}
.pgl-ol-steps>li.is-exm{border-color:var(--p-ink);border-width:2px}
.pgl-ol-top{display:flex;align-items:center;gap:10px}
.pgl-ol-n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:99px;border:2px solid var(--pv);color:var(--pv-h);font-family:var(--pf-m);font-size:13px;font-weight:700}
.pgl-ol-kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--p-mut);display:inline-flex;gap:6px;align-items:center}
.pgl-ol-kind i{font-style:normal;color:var(--p-ink);font-size:13px}
.pub-root .pgl-ol-steps h4{font-size:18px;line-height:1.3;letter-spacing:-.01em;margin-top:14px;color:var(--p-ink);font-family:var(--pf-d);font-weight:800}
.pub-root .pgl-ol-steps p{font-size:14.5px;line-height:1.55;color:var(--p-body);margin-top:8px}
.pub-root .pgl-ol-steps .pgl-ol-done{margin-top:auto;padding-top:14px;border-top:1px solid var(--p-l1);font-size:13.5px;color:var(--p-ink);display:flex;flex-direction:column;gap:2px}
.pgl-ol-done b{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--p-mut)}
.pub-root .pgl-ol-foot{margin-top:22px;border:1.5px dashed var(--pv-b);border-radius:12px;background:#faf7ff;padding:14px 18px;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;line-height:1.5;color:var(--p-body)}
.pgl-ol-foot b{color:var(--p-ink)}
.pub-root .pgl-fh{font-size:18px;letter-spacing:-.01em;margin-top:36px;margin-bottom:6px}

/* Learning as the parent (web) */
.pgl-tree{margin:32px 0 0}
.pgl-tree-p{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;background:var(--p-ink);color:#fff;border-radius:14px;padding:18px 22px}
.pgl-tree-k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--pv-lav)}
.pgl-tree-p b{font-family:var(--pf-d);font-size:24px;font-weight:800;letter-spacing:-.02em}
.pgl-tree-p span:last-child{font-size:14.5px;color:rgba(255,255,255,.82)}
.pgl-tree-kids{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px;position:relative}
.pgl-tree-kids::before{content:'';position:absolute;left:16.6%;right:16.6%;top:-16px;height:2px;background:var(--p-l3)}
.pgl-kid{position:relative;background:#fff;border-radius:14px;padding:18px 20px;border:2px solid var(--p-ink)}
.pgl-kid::before{content:'';position:absolute;left:50%;top:-30px;height:28px;width:2px;background:var(--p-l3)}
.pgl-kid.is-inv{border-style:dashed;border-color:#6b6577}
.pgl-kid.is-dr{border-style:dotted;border-color:#9a96a8;background:#fafafb}
.pub-t .pgl-tree-kids{grid-template-columns:1fr;gap:14px;margin-top:14px;padding-left:22px;border-left:2px solid var(--p-l3)}
.pub-t .pgl-tree-kids::before,.pub-t .pgl-kid::before{display:none}
.pgl-kid-av{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--p-ink)}
.pgl-kid-av i{font-style:normal}
.pub-root .pgl-kid h3{font-size:18px;margin-top:10px;letter-spacing:-.01em}
.pub-root .pgl-kid p{font-size:14px;line-height:1.5;color:var(--p-body);margin-top:6px}
.pub-root .pgl-kid .pgl-kid-in{font-family:var(--pf-m);font-size:11.5px;color:var(--p-mut);margin-top:12px}
.pub-root .pgl-tree-note{margin-top:20px;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14.5px;line-height:1.5;color:var(--p-body)}
.pgl-tree-note b{color:var(--p-ink)}

/* Slide scale (1920) */
.pgl-sl .pgs-cov{grid-template-columns:1fr}
.pgl-sl .pgs-cov>div:empty{display:none}
.pgl-sol{margin-top:40px}
.pgl-sol-h{display:flex;align-items:center;gap:28px}
.pgl-sol-t{font-family:var(--pf-m);font-size:24px;color:var(--s-mut)}
.pgl-sol ol{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:72px}
.pgl-sol li{position:relative;border:3px solid #a8a3b3;border-radius:24px;padding:30px 34px}
.pgl-sol li.is-exr{border-style:dashed}
.pgl-sol li.is-exm{border-color:#141118;border-width:4px}
.pgl-sol li:not(:last-child)::after{content:'→';position:absolute;right:-58px;top:50%;transform:translateY(-50%);font-size:44px;font-weight:700;color:var(--s-acc)}
.pgl-sol-n{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:99px;border:3px solid var(--s-acc);color:var(--s-acc-ink);font-family:var(--pf-m);font-size:24px;font-weight:600}
.pgl-sol-kind{margin-left:16px;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--s-mut)}
.pgl-sol-kind i{font-style:normal;color:#141118;margin-right:10px}
.pub-root .pgl-sol h3{font-size:44px;line-height:1.08;letter-spacing:-.03em;margin-top:22px}
.pub-root .pgl-sol li p{font-size:27px;line-height:1.35;color:var(--s-body);margin-top:14px}
.pub-root .pgl-sol-end{margin-top:34px;border:3px dashed var(--s-acc);border-radius:20px;padding:18px 30px;font-size:27px;color:var(--s-body);background:var(--s-wash)}
.pgl-sol-end b{color:#141118}
.pgl-stree{margin-top:40px}
.pgl-stree-p{display:flex;align-items:baseline;gap:28px;background:#141118;color:#fff;border-radius:22px;padding:24px 36px}
.pgl-stree-p b{font-family:var(--pf-d);font-size:48px;font-weight:800;letter-spacing:-.03em}
.pgl-stree-p span{font-size:28px;color:rgba(255,255,255,.82)}
.pgl-stree-kids{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:48px;position:relative}
.pgl-stree-kids::before{content:'';position:absolute;left:16.6%;right:16.6%;top:-26px;height:4px;background:#c9c6d1}
.pgl-skid{position:relative;border:4px solid #141118;border-radius:22px;padding:28px 32px}
.pgl-skid::before{content:'';position:absolute;left:50%;top:-50px;height:46px;width:4px;background:#c9c6d1}
.pgl-skid.is-inv{border-style:dashed;border-color:#6b6577}
.pgl-skid.is-dr{border-style:dotted;border-color:#9a96a8}
.pgl-skid-av{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.pgl-skid-av i{font-style:normal;margin-right:10px}
.pub-root .pgl-skid h3{font-size:36px;line-height:1.12;letter-spacing:-.025em;margin-top:14px}
.pub-root .pgl-skid p{font-size:27px;line-height:1.35;color:var(--s-body);margin-top:12px}
.pub-root .pgl-stree-note{margin-top:34px;font-size:28px;color:var(--s-body)}
.pgl-stree-note b{color:#141118}
.pgl-sl .pub-root .pgs-clo-url{white-space:nowrap}

/* Share preview and metadata (PGL07) */
.pgl-meta{display:grid;grid-template-columns:600px 1fr;gap:40px;padding:32px 40px}
.pgl-og{background:#fff;border:1px solid #dedce4;border-radius:12px;overflow:hidden;width:562px}
.pgl-og .pgs-thumb{margin:0}
.pgl-og .pgs-thumb figcaption{display:none}
.pgl-og-t{padding:12px 16px 16px;border-top:1px solid #dedce4}
.pgl-og-t span{font:500 12px/1.4 'Roboto Mono',monospace;color:#6b6577}
.pgl-og-t b{display:block;font-size:16px;margin-top:4px;color:#141118}
.pub-root .pgl-og-t p{font-size:13.5px;color:#4a4553;margin-top:4px;line-height:1.45}
.pgl-pre{margin:0;background:#141118;color:#e5e7eb;border-radius:10px;padding:16px 18px;font:500 12px/1.65 'Roboto Mono',monospace;white-space:pre-wrap;word-break:break-all}
.pgl-ic{max-width:420px}
</style>

           avail    a key of PK.AV (below): how anyone takes part, in words
       WEB PAGE. One h1 (the program name), the purpose sentence before anything else, then five sections in a
       fixed order: 1 Who it helps · 2 What they do · 3 How participation works · 4 Access required · 5 Next step.
         PK.web(bp, P, secs, o)       the page inside KIT.page: hero, section nav, secs (array of 5 PK.sec strings).

         PK.sec(bp, n, title, lead, body, o)   section n (1-5) under its fixed label; o.band = grey band
         PK.avail(k, o)               the availability label: glyph + words, never colour alone; o.dk on dark; o.text overrides

                                      o.along = one line under it; o.label = the list's accessible name (alt text)
