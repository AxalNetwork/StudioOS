      + '<div class="vav-see"><div><span class="eye">They will see</span><ul><li>This one decision: Pivot, the venture, 13 Nov, by ' + FOUNDER + '</li><li>Its evidence list, with directions and what counted</li><li>Its commitments</li><li>The reasoning, only if you tick it below</li></ul></div><div><span class="eye">They will not see</span><ul><li>Other decisions, including Withheld ones</li><li>Interviews, transcripts and hypotheses</li><li>Your Eadwyn conversations</li></ul></div></div>'
      + '<label class="vav-tick"><span class="vav-cb" aria-hidden="true"></span><span><b>Include reasoning</b><small>Off unless you tick it, for each share</small></span>' + FLAG('Q3 · pick A') + '</label>'
      + '<p class="vav-note">They open it in StudioOS after signing in, at its own read-only page. ' + FLAG('Q2 · pick A') + '</p>'
      + (o.err ? '<div class="nt r" role="alert" style="padding:9px 11px"><span class="ic" aria-hidden="true">✕</span><div><b>Couldn’t share.</b> Your selection is kept. Try again.</div></div>' : '')
      + '<div class="vav-sw2"><span class="eye">Shared with · 1</span>' + shareRow('Elena Varga', 'Operating Partner', '13 Nov', true) + '</div>'
      + '</div><div class="vav-shf"><span class="raw">Access to this one decision, not a file. Revoke at any time.</span><div style="display:flex;gap:8px"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">' + (o.saving ? 'Sharing…' : 'Share with 1 person') + '</button></div></div></div>'; };

    /* ---------- owner calls (⚑, not decided) ---------- */
    const opt = (l, t, d, pick) => '<li class="' + (pick ? 'pk' : '') + '"><span class="vav-l">' + l + '</span><div><b>' + t + '</b><small>' + d + '</small></div>' + (pick ? FLAG('drawn') : '') + '</li>';
    const owner = () => cropV('<div style="display:flex;gap:10px;align-items:center"><span class="eye">Owner calls on #6021 · none answered as of 14 Nov · the boards draw the marked option, not a decision</span></div><div class="vav-q3">'
      + '<section class="cd"><div class="ch"><h2 style="font-size:14px">1 · Who may read a recorded decision?</h2>' + FLAG('changes D693') + '</div><ol class="vav-opts">' + opt('A', 'Founder-only', 'D693 as is. V19 and V20 are dropped; V17, V18, V21–V23 stay.', false) + opt('B', 'Founder shares one given decision with named people', 'Revocable per person. Needs decision shares, routes, a candidate list and a wider canReadDecision.', true) + opt('C', 'Partner licence holders read every given decision', 'One rule change in canReadDecision; reverses D693 decision 7.', false) + '</ol></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:14px">2 · Under B, where does a recipient read it?</h2></div><ol class="vav-opts">' + opt('A', 'A read-only page in StudioOS, behind sign-in', 'At a route the owner names. Drawn in V20.', true) + opt('B', 'Only the PDF the founder sends', 'StudioOS records who it was shared with; no recipient page.', false) + '</ol></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:14px">3 · Under B, is the reasoning included?</h2></div><ol class="vav-opts">' + opt('A', 'Only when the founder ticks it', 'Per share. Drawn in V19.', true) + opt('B', 'Always', 'The tick box goes away.', false) + opt('C', 'Never', 'The memo page has no Reasoning section.', false) + '</ol></section></div>', 1400);

    /* ---------- V20 · recipient ---------- */
    const recip = () => '<div class="nt" style="background:var(--lav);border-color:var(--lavE)"><span class="ic" aria-hidden="true" style="background:var(--vt)">i</span><div><b>Shared by ' + FOUNDER + ' on <span class="vav-n">13 Nov</span>.</b> Read-only. You can see this one decision and nothing else from Tidepool’s Validate. ' + FLAG('Q2 · route named by the owner') + '</div></div>'
      + recordHead({ crumb: ['Shared with you', 'Tidepool · Pivot'], h1: 'Tidepool · Pivot · the venture', noact: true })
      + '<div class="vav-rec"><div class="vav-main">' + facts({ nosup: true }) + reasoning().replace('Reasoning</h2>', 'Reasoning</h2><span class="sm">included by ' + FOUNDER + '</span>') + '</div><div class="vav-side"><section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:14px">Commitments</h2></div>' + commitRows() + '</section><section class="cd" style="gap:6px"><span class="eye">Not part of this share</span><p style="font-size:12.5px;line-height:1.5" class="mu">Other decisions, interviews and hypotheses stay with the founder. Nothing here can be edited.</p></section></div></div>' + evidenceSec();
    const msgBox = (state, title, body, act) => '<section class="cd vav-msg">' + state + '<b style="font-size:15px">' + title + '</b><p style="font-size:12.5px;line-height:1.5">' + body + '</p>' + (act || '') + '</section>';

    /* ---------- V21 · states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const states = () => cropV('<span class="eye">Verdict states · Platform States (D5129) words and shapes · Not recorded and Unavailable never drawn as 0 or an empty list</span><div class="vav-g4">'
      + box('Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:7px"><span class="sk" style="height:12px;width:55%"></span><span class="sk" style="height:30px;width:100%"></span><span class="sk" style="height:30px;width:100%"></span><span class="sk" style="height:30px;width:80%"></span></div><span class="raw">Announced: “Loading the evidence for H2”</span>')
      + box('Not recorded', '<dl class="kv2" style="grid-template-columns:96px minmax(0,1fr)"><dt>Disproof</dt><dd>' + NR() + ' <a href="#">Add to H2</a></dd><dt>Success bar</dt><dd>' + NR() + '</dd><dt>Reasoning</dt><dd>' + NR() + '</dd><dt>Strength</dt><dd>' + NR('Strength not recorded') + '</dd><dt>Commitment</dt><dd>' + NR('Owner') + ' ' + NR('Due') + '</dd></dl>')
      + box('Evidence read · Unavailable', UN() + '<p style="font-size:12.5px">The evidence for H2 could not be read at <span class="vav-n">10:42</span>. The picker is disabled: a decision needs its evidence.</p><div class="vx-dec" style="opacity:.5;grid-template-columns:repeat(3,minmax(0,1fr))" aria-disabled="true"><label><b>Proceed</b></label><label><b>Pivot</b></label><label><b>Stop</b></label></div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + box('Record read · Unavailable', UN() + '<p style="font-size:12.5px">The decision record could not be read. Export memo and Share stay off until it is.</p><div style="display:flex;gap:8px"><button type="button" class="btn bsm" aria-disabled="true" style="opacity:.5">Export memo</button><button type="button" class="btn bsm" aria-disabled="true" style="opacity:.5">Share with…</button></div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + box('Refused · partner or investor today', RF() + '<p style="font-size:12.5px"><b>Decisions are the founder’s own.</b> Ask the founder if you need to see one.</p>' + FLAG('Q1 decides who can grant access'))
      + box('Share · saving', '<span class="stt pd">' + SH.pd + 'Sharing with Daniel Okafor…</span><p style="font-size:12.5px">The selection and the tick box stay as chosen. Share is disabled until the reply.</p>')
      + box('Share · save failed', '<div class="nt r" role="alert" style="padding:9px 11px"><span class="ic" aria-hidden="true">✕</span><div><b>Couldn’t share.</b> Nobody was given access. Your selection is kept.</div></div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + box('Revoke · saving and failed', shareRow('Elena Varga', 'Operating Partner', '13 Nov', true).replace('>Revoke<', ' aria-disabled="true" style="opacity:.55">Revoking…<') + '<div class="nt r" role="alert" style="padding:9px 11px"><span class="ic" aria-hidden="true">✕</span><div><b>Couldn’t revoke.</b> Elena Varga still has access. Try again.</div></div>')
      + '</div>', 1400);

    /* ---------- V22 · phone ---------- */
    const phone = (title, body, sheetH) => '<div class="cv vav-cv' + DK + '" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheetH || '') + '</div></div>';
    const evCard = (k, title, rows) => '<section class="vav-mc ' + k + '"><h3>' + title + '</h3>' + J(rows.map(n => { const e = EV[n - 1]; return '<div class="vav-mr"><span class="vav-n">E' + n + '</span><div><b>' + e[1] + '</b><small>“' + e[2] + '”</small><small>' + (e[4] || 'Strength not recorded') + ' · <span class="vav-n">' + e[5] + '</span>' + (e[7] === true ? '' : ' · ' + e[7]) + '</small></div></div>'; })) + '</section>';
    const MOB = {
      VAV22A: () => phone('Record a decision', '<div><span class="raw">For H2</span><p style="font-size:14px;font-weight:700;line-height:1.4">They will pay €300 a month for automatic reconciliation</p></div><div class="vav-cov" style="border-radius:10px;border:1px solid var(--amE)">' + COVER + '</div><button type="button" class="btn" style="min-height:44px">Read the evidence with Eadwyn</button>'
        + evCard('c', '<span class="vx-dir c"><i aria-hidden="true">−</i>Contradicts</span> 2', [1, 2]) + evCard('s', '<span class="vx-dir s"><i aria-hidden="true">+</i>Supports</span> 2', [3, 4]) + '<p class="raw">Not counted · 2 links, and the decision picker, below ↓</p>'),
      VAV22B: () => phone('Record a decision', '<div><span class="raw">For H2</span><p style="font-size:14px;font-weight:700">They will pay €300 a month…</p></div>', '<div class="vav-ov" aria-hidden="true"></div><div class="vav-bs" role="dialog" aria-modal="true" aria-label="Eadwyn · Read the evidence"><span class="vav-grab" aria-hidden="true"></span>' + SUMMARY().replace('<div class="vav-acts">', '<div class="vav-acts m">') + '</div>'),
      VAV22C: () => phone('Share this decision', '', '<div class="vav-fs" role="dialog" aria-modal="true" aria-labelledby="vavms"><div class="vav-shh"><div><span class="raw">Pivot · the venture · 13 Nov</span><h2 id="vavms">Share this decision</h2></div><button type="button" class="ib" aria-label="Close" style="min-width:44px;min-height:44px">✕</button></div><div class="vav-shb">' + FLAG('Q1 · pick B, pending owner')
        + '<fieldset class="vav-pick">' + J(PEOPLE.map(g => '<span class="eye">' + g[0] + '</span>' + J(g[1].map(p => '<label class="' + p[2] + '" style="min-height:48px"><span class="vav-cb' + (p[2] ? ' on' : '') + '" aria-hidden="true">' + (p[2] ? '✓' : '') + '</span><span><b>' + p[0] + '</b><small>' + p[1] + (p[2] === 'shared' ? ' · already shared' : '') + '</small></span></label>')))) + '</fieldset>'
        + '<label class="vav-tick" style="min-height:48px"><span class="vav-cb" aria-hidden="true"></span><span><b>Include reasoning</b><small>Off unless you tick it</small></span></label><p class="vav-note">They see this one decision, its evidence and commitments. Not other decisions, interviews or Withheld decisions.</p></div><div class="vav-shf" style="flex-direction:column;align-items:stretch"><button type="button" class="btn p" style="min-height:48px">Share with 1 person</button></div></div>')
    };

    /* ---------- docs ---------- */
    const dkd = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      VAV24: () => dkd('<h1>Handoff · Verdict addendum (#6021)</h1><p>Checked on <code>main</code> at <code>6d7712c6d1</code> (14 Nov 2026). Continues Validate v2 (#4837): V10 decision picker, V12 rail, V14 suggestion card. Boards V17–V23; nothing here is built.</p>'
        + '<h2>Checked on main</h2>' + tbl(['Where', 'What it showed'], [
          ['<code>services/records/verdict.ts</code> formOptions', 'Offers each piece of evidence with label, strength, date, hypothesis_id, source key, and <code>observed</code> for experiments; <code>bar: DECISION_EVIDENCE_BAR</code>; <code>suggested_evidence</code> (null when the interview read fails). <b>No direction.</b>'],
          ['<code>services/records/verdict.ts</code> record', 'Facts (Decision, For, Evidence, Supersedes, Counted methodology v2), sections Reasoning, Evidence it rests on (with direction and exclusions: “Not counted: same source as another link / evidence for another hypothesis / no observed result”), Commitments, Memo (Export PDF). Actions: Record a new decision (primary), export-memo, add-commitment, Plan the build, Mark a commitment done.'],
          ['<code>services/verdict.ts</code>', '<code>DECISION_EVIDENCE_BAR = 5</code>; below it a decision is kept as <code>withheld</code>; given/withheld state.'],
          ['<code>routes/_founder_validate_helpers.ts</code>', '<code>canReadDecision</code>: admin, or the venture’s own founder. Partners are refused (D693 decision 7).'],
          ['<code>frontend/src/App.jsx</code>', '<code>/validate/verdict</code> guarded to admin and founder.'],
          ['<code>lib/decisionMemoViewModel.js</code>, <code>decisionMemoPdf.js</code>', 'Memo drawn in the browser from the record read; nothing stored; no Worker PDF route.'],
          ['<code>routes/eadwyn.ts</code>', '<code>POST /conversations/:uid/quote</code> → <code>{ai:true, hold_microusd, model_label}</code> or <code>{ai:false, reason, message}</code>; <code>/ask</code> returns prose.'],
          ['<code>pages/cycles/verdictForm.js</code>', 'Fields Decision, For, Reasoning (“Why, in your words”); “n of 5 needed before a verdict is given. Below that it is withheld.”']])
        + '<h2>Requires engineering (◇)</h2>' + tbl(['Item', 'Boards', 'Issue'], [
          ['form-options returns each option’s <code>direction</code>', 'V17, V22A', '#6021'],
          ['A verdict-summary rail task whose answer is rows each citing one evidence key, checked server-side', 'V17, V18, V22B', '#6021 · #5130'],
          ['Under B: a <code>YYYYMMDDHHMM_6021_decision_shares.sql</code> migration (decision_id, grantee_user_id, created_by, created_at, revoked_at); grant, list and revoke as record actions through <code>services/verdict.ts</code>; the candidate list (the venture’s Operating Partners and investors); the recipient’s read; <code>canReadDecision</code> + unrevoked grant for that one decision; each grant and revoke logged under <code>validate.verdict</code>', 'V19, V20, V21, V22C', '#6021 (build issue filed after the owner answers)']])
        + '<h2>Pending the owner (⚑)</h2><p>Q1 who may read a decision (A founder-only · <b>B named shares, drawn</b> · C partners read given decisions). Q2 where a recipient reads it (<b>A StudioOS page, drawn</b> · B the PDF only); the route is the owner’s to name. Q3 reasoning (<b>A when ticked, drawn</b> · B always · C never). B or C amends D693 in <code>D6021.md</code>. Under A, V19 and V20 are dropped.</p>'
        + '<h2>Frontend only</h2><p>The evidence table with row ids (E1…) and the coverage sentence from data already returned; the rail task card, its seven states and the three actions (Use as reasoning copies text into the Reasoning field, edited before recording); the phone bottom sheet and full-height share sheet; dark tokens.</p>'
        + '<h2>Preserved</h2><p>V10’s picker (no choice pre-selected; primary stays Choose a decision → Record), V11’s handoff after Record, the CO:368 record layout and Export memo as a browser PDF. Eadwyn never picks or records a decision; its text is saved nowhere unless recorded as reasoning.</p>'
        + '<h2>Accessibility</h2>' + tbl(['Area', 'Rule'], [
          ['Citations', 'Each E-number is a link to its row (<code>#ev-n</code>); focus moves to the row and the row is announced with its label'],
          ['Direction', 'Supports (+) and Contradicts (−) carry the word and a glyph; Not counted (∅) carries its reason in words'],
          ['Rail states', 'Reading is aria-busy with a polite announcement; Unavailable and failures are alerts; Out of date names its age'],
          ['Share sheet', 'A modal dialog with focus trap; people are a fieldset of checkboxes; Share announces the result; Revoke returns focus to the list'],
          ['Phone', '44px targets, 48px primary; groups are cards, no table wider than 390']]))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'VAV17') html = pg(v17(), { h: 1240, rail: prail(SUMMARY()) });
    else if (B === 'VAV18A') html = railCrop('A · Not run yet', RS.A());
    else if (B === 'VAV18B') html = railCrop('B · Reading', RS.B());
    else if (B === 'VAV18C') html = railCrop('C · AI assistance off', RS.C(), '<div class="vav-rf"><div style="display:flex;justify-content:space-between;align-items:center"><span class="vx-sw"><i style="background:var(--hair2)"></i>AI assistance off</span><a href="#" style="font-size:12px;font-weight:700">AI settings</a></div></div>');
    else if (B === 'VAV18D') html = railCrop('D · Not available', RS.D());
    else if (B === 'VAV18E') html = railCrop('E · Evidence Unavailable', RS.E());
    else if (B === 'VAV18F') html = railCrop('F · Out of date', RS.F());
    else if (B === 'VAV18G') html = railCrop('G · No evidence yet', RS.G());
    else if (B === 'VAV19') html = pg(record(), { h: 1140, overlay: sheet() });
    else if (B === 'VAV19B') html = cropV('<span class="eye">Memo section variants on the decision record</span><div class="vav-g3">' + memoSec({ none: true }) + memoSec({ withheld: true }) + '<section class="cd" style="gap:10px"><div class="ch"><h2 style="font-size:14px">Memo</h2></div><div class="vav-sw2"><span class="eye">Shared with · 2</span>' + shareRow('Elena Varga', 'Operating Partner', '13 Nov', true) + shareRow('Kofi Mensah', 'Investor · Brightwater Seed', '13 Nov', false, '14 Nov') + '</div></section></div>', 1200);
    else if (B === 'VAV19Q') html = owner();
    else if (B === 'VAV20A') html = pg(recip(), { h: 1140, side: sideP(), top: topP, rail: closedRail('Open Eadwyn. It has no actions on a shared decision') });
    else if (B === 'VAV20B') html = cropV(msgBox(RF(), 'This decision was shared with named people only.', 'Ask ' + FOUNDER + ' for access. The same page shows after a revoke; it never says who else can see it.', '<a class="btn bsm" href="#" style="align-self:flex-start">Back to Home</a>'), 520);
    else if (B === 'VAV20C') html = cropV('<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>A later decision replaced this one on <span class="vav-n">13 Nov</span>.</b> This share covers only the decision below.</div></div>' + msgBox('<span class="pl">Superseded</span>', 'Tidepool · Proceed · the venture', 'Recorded <span class="vav-n">12 Sep</span> by ' + FOUNDER + ' · shared <span class="vav-n">20 Sep</span>. Evidence and commitments as recorded then.'), 520);
    else if (B === 'VAV20D') html = cropV(msgBox(UN(), 'This decision could not be read.', 'Nothing is shown over a failed read.', '<button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>'), 520);
    else if (B === 'VAV21') html = states();
    else if (B === 'VAV23A') html = pg(v17(), { h: 1240, rail: prail(SUMMARY()) });
    else if (B === 'VAV23B') html = pg(record(), { h: 1140, overlay: sheet() });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = pg(v17(), { h: 1240, rail: prail(SUMMARY()) });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
