.st-tb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}

      + '<p class="foot">Every row says the same two limits: a stored count does not name engagements, and it does not establish demand for the work.</p>', 1180);
    /* ===== RMP11 · roles ===== */
    else if (B === 'RMP11') {
      const c = (t, inner) => '<div class="rmp-sbox"><span class="eye">' + t + '</span>' + inner + '</div>';
      html = crop('<span class="eye">What each licence sees · proposal actions only where the role and the record support them</span><div class="rmp-s4">'
        + c('Service provider with quotes', '<div class="rmp-pills">' + AG.Current + '<span class="rmp-pp ok">Attachable</span></div><p style="font-size:12px">Proposal tile, the picker of quotes this reading is not on yet, and Attach to a proposal.</p>')
        + c('Service provider, no quote yet', '<div class="rmp-pills">' + AG.Current + '<span class="rmp-pp mu">No proposal to attach to</span></div><p style="font-size:12px">No proposal on this account. A reading attaches to a quote your partner profile owns. No Attach button.</p>')
        + c('Founder (#6279)', '<p style="font-size:12px">No Proposal tile, pill or card. One line: “On a founder licence, a reading is your own record of what comparable work went for, kept here to weigh a price you are offered.”</p><p class="rmp-mu">The “Draft, not saved” pill keeps its plain name.</p>')
        + c('Investor (RS-17)', '<p style="font-size:12px">Your market readings is not drawn on /research/markets: pricing readings are hidden from the investor view (D6273 Q2, decided A).</p>' + FLAG('Owner · direct link') + '<p class="rmp-mu">An old reading opened by its link: drawn as Not on your list.</p>')
        + '</div>', 1240);
    }
    /* ===== RMP12 · export and summaries ===== */
    else if (B === 'RMP12') html = crop('<span class="eye">Export CSV of your readings · cents kept as written</span><pre class="rmp-csv">metric,service_line,scope,low_usd,high_usd,comparables,ran_at,age_days,age\n"Investor-update edit · per update",yes,"One investor update, up to 1,200 words, one revision round",99.50,99.99,7,2026-11-16,0,current\n"Fractional CFO · monthly retainer",yes,"Two days a month, Seed to Series A",3200.00,4800.00,5,2026-07-01,138,stale\n"Seed financial model build",yes,"Three-statement model, 36 months, one scenario",4500.00,6000.00,12,2026-09-02,75,ageing\n"Intro call · first 30 minutes",no,,0.00,0.00,9,2026-10-20,27,current\n"Board-pack preparation",yes,,,,,,,not_recorded</pre><p class="foot">Amounts are plain decimals with two places, no rounding. An empty cell is Not recorded, never 0. The catalog price is not a column of this file. ' + FO + ' (today the Markets Export button exports the market directory rows).</p>'
      + '<div class="rmp-trace"><span class="eye">Eadwyn summary of your readings</span><span style="font-size:12.5px">Investor-update edit · per update (One investor update…): <b class="mo">$99.50 – $99.99</b>, from 7 comparables, run 2026-11-16 ' + PT() + '</span></div>', 1180);
    /* ===== phones ===== */
    else if (B === 'RMP13A') html = phone('Markets', '<div class="crumb">Research / Markets</div><button type="button" class="btn p" style="min-height:48px;width:100%">Record a reading</button><h2 class="rmp-h3">Your market readings</h2>' + J(AFTER.map(r => r.never ? '<div class="rmp-mc"><b>' + r.m + '</b><div>' + NRY + '</div></div>' : '<div class="rmp-mc"><b>' + r.m + '</b><div class="mo rmp-rng">' + r.lo + ' – ' + r.hi + '</div><div class="r2"><span class="mo">' + r.n + ' comparables · ' + r.ran + '</span>' + AG[r.band] + '</div></div>')));
    else if (B === 'RMP13B') html = phone('Record a reading', '<div class="rmp-pform">' + fld('Service line', 'Investor-update edit · per update', { sel: true }) + '<div class="rmp-two">' + fld('Low (USD)', '99.99', { cur: true, mono: true, bad: true }) + fld('High (USD)', '99.5', { cur: true, mono: true, bad: true, fo: true }) + '</div><div class="rmp-rowerr" role="alert"><i aria-hidden="true">!</i><span>High is below low. Nothing is saved until the range reads forward.</span></div></div>', '<div class="rmp-psave"><button type="button" class="btn p" disabled style="width:100%;min-height:48px">Record this reading</button></div>' + kb);
    else if (B === 'RMP13C') html = phone('Record a reading', '<div class="rmp-pform">' + fld('Service line', 'Investor-update edit · per update', { sel: true }) + '<div class="rmp-two">' + fld('Low (USD)', '99.50', { cur: true, mono: true }) + fld('High (USD)', '99.99', { cur: true, mono: true, fo: true }) + '</div><span class="rmp-hint">Dollars and cents. Comparables and run date are next.</span></div>', '<div class="rmp-psave"><button type="button" class="btn p" style="width:100%;min-height:48px">Record this reading</button></div>' + kb);
    else if (B === 'RMP13D') html = phone('Market reading', '<a href="#" class="btn t bsm" style="align-self:flex-start;min-height:44px">‹ Markets</a>' + OKN(['Recorded. This is the reading as stored.', '']) + '<span class="eye">Market reading</span><h1 style="font-size:20px;font-weight:800;line-height:1.2">' + RD.upd.m + '</h1><p class="rmp-mu" style="font-size:12px">Scope: ' + RD.upd.scope + '</p><div class="rmp-pills">' + AG.Current + '<span class="rmp-pp ok">Attachable</span></div><div class="rmp-tiles t2">' + tile('Comparable range', '<span class="rmp-amt">$99.50</span><span class="rmp-dash">–</span><span class="rmp-amt">$99.99</span>', 'from 7 comparables', { cls: 'rng w2' }) + tile('Run date', '2026-11-16', '0 d old · Current') + tile('Proposal', 'Attachable', 'with its run date', { cls: 'ok' }) + '</div><div class="rmp-vs v1"><div class="cat"><span class="eye">Catalog price · your offer</span><b class="mo">$120.00</b><span class="rmp-mu">Not added into the range.</span></div></div>');
    else if (B === 'RMP13E') html = phone('Record a fresh reading', '<div class="rmp-pform"><span class="eye">Fractional CFO · monthly retainer</span><div class="rmp-two">' + fld('Low (USD)', '', { cur: true, mono: true, ph: '0.00', fo: true }) + fld('High (USD)', '', { cur: true, mono: true, ph: '0.00' }) + '</div><span class="rmp-hint">Both amounts start blank. Run date is today, 2026-11-16.</span></div>', '<div class="rmp-psave"><button type="button" class="btn p" style="width:100%;min-height:48px">Record this reading</button></div>' + kb);
    /* ===== dark ===== */
    else if (B === 'RMP14') html = detailPage(RD.upd, { notice: OKN(['Recorded. This is the reading as stored.', '$99.50 – $99.99 from 7 comparables, run 2026-11-16.']) });
    else if (B === 'RMP14B') html = crop('<span class="eye">Validation and save failure · dark</span>' + form({ where: 'list', lines: true, line: 'Investor-update edit · per update', lo: '99.505', hi: '99.99', n: 7, ran: '2026-11-16', err: { lo: 'Use dollars and cents: two digits after the point at most. 99.505 is not rounded for you.' }, fail: 'StudioOS did not answer, so nothing was recorded. Your entries are still here.' }), 1000);
    else if (B === 'RMP14P') html = phone('Record a reading', '<div class="rmp-pform">' + fld('Service line', 'Investor-update edit · per update', { sel: true }) + '<div class="rmp-two">' + fld('Low (USD)', '99.50', { cur: true, mono: true }) + fld('High (USD)', '', { cur: true, mono: true, ph: '0.00', bad: true, fo: true }) + '</div><div class="rmp-rowerr" role="alert"><i aria-hidden="true">!</i><span>Enter the high. A range needs both ends.</span></div></div>', '<div class="rmp-psave"><button type="button" class="btn p" style="width:100%;min-height:48px">Record this reading</button></div>' + kb);

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl2 = tbl;
    const DOCS = {
      RMP00: () => dk('<h1>Comparable prices · journey and the cent rule</h1><p>A service provider ([Calder & Wren Advisory], fictional) records what comparable engagements went for, opens the stored reading, reopens it later and starts a fresh run. Every amount is integer cents in D1 (<code>range_low_cents</code>, <code>range_high_cents</code>) and is written back with two decimals wherever it appears: form, saved detail, reopened form, list, export and Eadwyn summaries. Nothing rounds, nothing collapses a range.</p>'
        + '<h2>Clickable path</h2>' + tbl2(['Step', 'Frame', 'Action → next'], [['1', 'RMP01 Markets · Your market readings', 'Record a reading → 2'], ['2', 'RMP02 Form open, blank amounts', 'type 99.50, 99.99, 7 → 3'], ['3', 'RMP03 Populated', 'Record this reading → 3B → 4 (or 3C on failure, inputs kept)'], ['4', 'RMP04 Saved detail', '‹ Markets → 4B; open the row again → 5'], ['5', 'RMP05 Reopened form, 99.50 and 99.99', 'Open the stale CFO row → 6'], ['6', 'RMP06 Stale reading', 'Record a fresh reading → 6B (amounts blank) → 6C (new record)'], ['Phone', 'RMP13A → 13C → 13D; 13B and 14P are the error paths; 13E is fresh', 'same order']])
        + '<h2>Labels that never merge</h2>' + tbl2(['Label', 'Means', 'Never'], [['Comparable range', 'What N comparable engagements went for, low to high, to the cent', 'Averaged, rounded or drawn with the catalog price'], ['Catalog price', 'What you list the service line at (Offers › Catalog)', 'Added into the range; shown where there is no service line (Not applicable)'], ['Comparables', 'A stored count, 1 or more', 'Named engagements; a measure of demand'], ['Run date / Age', 'The day you ran it; days since, Current ≤30, Ageing 31–90, Stale >90', 'The save time']])
        + '<h2>State vocabulary used</h2><p>Value (including $0.00, marked “0 is a value”), Not recorded (dotted, never $0), Not applicable, Unavailable (dashed, failed read, with Retry), Stale (dashed amber with its age). Words and shapes carry every state; colour never alone.</p>'),
      RMPH: () => dk('<h1>Handoff · Research Markets comparable prices (#7039)</h1><div class="cols"><div><h2>Checked on main (87bf3ac4ac)</h2><p><code>routes/research_client_prep.ts</code>: GET, POST, GET :uid and DELETE <code>/api/research/market-readings</code>. Integer cents are stored and returned exactly; POST refuses a missing metric, a range with high below low or a negative low, a count below 1 and a run date that is not YYYY-MM-DD. Low 0 is accepted, so $0.00 – $0.00 is a real reading. GET :uid adds <code>catalog_price_cents</code>, attachments and the caller’s partner quotes.</p><p><code>pages/research/marketReadingRead.js</code>: <code>dollarsToCents</code> takes up to two decimals; <code>readingFields</code> rounds the stored cents to whole dollars when the form reopens; <code>usd()</code> and <code>catalogLine()</code> round for display. <code>freshReadingForm</code> blanks both amounts and sets today.</p><p><code>MarketReading.jsx</code>: detail tiles, scope with Not recorded, proposal card only where the role and record have one (#6279), a save writes a new reading. <code>MarketDirectoryZone.jsx</code>: <code>Readings</code> list (name, run date, age only), <code>RecordReading</code> with the Service line picker only when lines exist; no scope field; a refusal keeps the form. <code>routes/research.ts</code> (Eadwyn <code>research/market</code> gather) rounds with <code>money()</code>.</p>'
        + '<h2>Preserved</h2><p>Research v2 shell, one h1, one violet primary, Ask Eadwyn secondary, Eadwyn as the one rail. Main’s sentences for refusals, empty and failed reads. New run = new record. Proposal card rules from #6279.</p></div><div>'
        + '<h2>Frontend only</h2><ul class="rmp-ul"><li>Format every amount from cents with two decimals: <code>readingFields</code>, <code>usd</code>, <code>catalogLine</code>, MarketZone <code>usd</code>.</li><li>List rows show the range, count and scope; Export CSV of readings.</li><li>Scope on the directory form.</li><li>Per-field validation words, including too many decimals.</li><li>Success notice on the opened detail; Retry wording.</li><li>Hide Your market readings for an investor (D6273 Q2).</li></ul>'
        + '<h2>Requires engineering ◇ #7039</h2><ul class="rmp-ul"><li><code>research.ts</code> gather for <code>research/market</code>: format cents with two decimals instead of <code>Math.round(cents / 100)</code>.</li></ul>'
        + '<h2>Pending the owner ⚑</h2><ul class="rmp-ul"><li>Whole-dollar amounts written as $4,500.00 (drawn A) rather than $4,500.</li><li>Main colours this page with the licence accent (partner amber, D593); the brief asks violet. Drawn violet.</li><li>An investor opening an old reading by link: drawn as Not on your list.</li></ul></div></div>'
        + '<h2>States · existing data or engineering change</h2>' + tbl2(['State', 'Frames', 'Source'], [['Readings list populated, empty, loading, failed read', 'RMP01, RMP09', 'Existing GET /market-readings; range and count columns are frontend only'], ['Record a reading with or without service lines', 'RMP02, RMP02B', 'Existing (#6279 hides the picker without lines)'], ['Validation: reversed, missing, decimals, count', 'RMP08, RMP13B, RMP14P', 'Existing checks; per-field words frontend only'], ['Save in progress, save failed with inputs kept', 'RMP03B, RMP03C', 'Existing (form kept on refusal)'], ['Success opens the stored detail', 'RMP04', 'Existing navigation; the notice is frontend only'], ['Reopen to the cent', 'RMP05', 'Frontend only (readingFields)'], ['Stale, fresh reading, new record', 'RMP06–RMP06C', 'Existing'], ['$0.00 range, whole dollars, Not recorded', 'RMP07', 'Existing data; formatting frontend only'], ['CSV export', 'RMP12', 'Frontend only'], ['Eadwyn summary to the cent', 'RMP12, rail', '◇ #7039 (research.ts)'], ['Investor without readings', 'RMP11', 'Frontend only (D6273 Q2)']]) + '<p>Main says “Try again” on failed reads; the brief’s “Retry” is drawn. Either word is fine for the build.</p>' + '<h2>Accessibility</h2>' + tbl2(['Area', 'Rule'], [['Amounts', 'Labels “Low (USD)” and “High (USD)” stay visible above each field; inputmode decimal; the $ is decorative'], ['Errors', 'Under the field, aria-invalid plus aria-describedby, “!” glyph and words; range errors are role=alert'], ['Phone', 'With the keyboard open, labels, cents, the error and Record this reading stay above the keyboard (sticky bar)'], ['Focus', 'Visible 2px violet ring; focus goes to the first empty field; after save, focus moves to the h1 of the stored reading'], ['States', 'Current, Ageing, Stale, Unavailable and Not recorded each have a word and a shape']]) + '<p>Sample data: [Calder & Wren Advisory], [Halden Grid], every reading, quote and figure is fictional. Design only.</p>')
    };
    if (!html && DOCS[B]) html = DOCS[B]();
    return { html: { __html: html || '' } };
  }
}
