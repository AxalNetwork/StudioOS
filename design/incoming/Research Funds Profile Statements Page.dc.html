    else if (B === 'RFP18') html = page(pbar() + ptabs() + cmpCard() + '<div class="rfp-grid2">' + ann('<b>On main.</b> <code>ATTRIBUTES.fund</code> in <code>research_project_comparisons.ts</code> lists ten rows (Manager … EIF / EIFO); Investment stage reads Not recorded. A failed cell reads <code>unreadable</code>, drawn Unavailable.') + ann('<b>◇ #7759</b> lists Investment geography and Initial cheque; <b>◇ #7748</b> fills the cells with statements. Two statements are drawn as two, the latest leading, so neither reads as the only one. No cell is ranked, summed or converted.') + '</div>', { h: 1480, cur: 'My Research' });

    /* FND-P19 · States */
    else if (B === 'RFP19') html = crop(bh('FND-P19', 'States', 'Each state says what happened and what still works. Zero, Not recorded and Unavailable never look alike.')
      + '<div class="rfs-grid3">'
      + '<section class="cd" aria-busy="true"><span class="rfp-cap">Loading · statements</span><div style="display:flex;flex-direction:column;gap:8px"><span class="rfp-skel" style="width:60%;height:16px"></span><span class="rfp-skel" style="width:85%"></span><span class="rfp-skel" style="width:70%"></span><span class="rfp-skel" style="width:78%"></span></div><p class="raw" role="status">Loading what the sources state…</p><p class="foot">Skeletons sit in the real lines. The rest of the profile is already shown.</p></section>'
      + '<section class="cd"><span class="rfp-cap">Not recorded · per field</span><dl class="rfp-kv" style="grid-template-columns:130px minmax(0,1fr)"><dt>Manager</dt><dd>' + NR('No source names the manager of this vehicle.') + '</dd><dt>Investment stage</dt><dd>' + NR(R_STAGE) + '</dd><dt>Investment geography</dt><dd>' + NR(R_GEO) + '</dd><dt>Initial cheque</dt><dd>' + NR(R_CHQ) + '</dd></dl></section>'
      + '<section class="cd"><span class="rfp-cap">Unavailable · read failed</span>' + chip('un') + '<b style="font-size:13.5px">What the sources state could not be read just now.</b><p style="font-size:12.5px">The rest of the profile still shows. These lines are not marked Not recorded, because that would say no source states them.</p>' + retry('Try again') + '</section>'
      + '<section class="cd"><span class="rfp-cap">Refused · role without Funds</span>' + chip('rf', 'Refused') + '<b style="font-size:13.5px">Funds is for founder accounts. You are signed in as [an investor].</b><p style="font-size:12.5px">Worded as the directory canvas words it. No one grants Funds to another role.</p><a href="#" class="btn" style="align-self:flex-start">Go to Home</a></section>'
      + '<section class="cd"><span class="rfp-cap">Source withdrawn during the session</span><div class="rfp-res r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>' + SRC.C.pub + '’s list was withdrawn.</b> Its statement on investment stage was removed. 2 sources remain.</div></div><p class="foot">The line redraws with the lower count (FND-P16 C). Nothing else on the profile changes.</p></section>'
      + '<section class="cd"><span class="rfp-cap">Zero is a value</span><dl class="rfp-kv" style="grid-template-columns:130px minmax(0,1fr)"><dt>Notable LPs</dt><dd>' + NR('The list names no LPs for this vehicle.') + '</dd><dt>Comparison cell</dt><dd>' + UN('This cell could not be read just now.') + '</dd></dl><p class="foot">No statement here can be a measured zero; a cheque of “0” is shown as worded with its source.</p></section>'
      + '</div>', 1440);
    else if (B === 'RFP19B') html = page(profile(SM, null, invest(SM, [['Investment stage', NR(R_STAGE)], ['Investment geography', NR(R_GEO)], ['Initial cheque', NR(R_CHQ)]], { foot: 'No list states how this vehicle invests yet. An Axal admin adds sources.' }) + '<div class="rfs-sa"><span class="rfs-sat">' + G.lock + 'Super Admin only</span><span>You can add a source for this vehicle.</span><a href="#" class="btn bsm" style="margin-left:auto">Open source imports</a></div>' + oneObs(SM), srcCard(SM), { mline: 'Manager not recorded · vintage <span class="mo">' + SM.vint + '</span>' }) + '<div class="rfp-grid2">' + ann('<b>No statements at all.</b> The profile is exactly as FND-P02: nothing added. A founder sees the line and no action. A Super Admin (<code>isSuperAdminUser</code>) sees one action, Open source imports, which goes to <code>/research/source-imports</code>. ' + ENG('#7753 · console route') + '') + ann('<b>Drawn for [Iris Chen], Super Admin.</b> The account chip reads IC. Save to shortlist stays the one primary action.') + '</div>', { h: 1260, av: 'IC' });

    /* FND-P21 · Dark */
    else if (B === 'RFP21') html = page(profile(NB, ST.nbMgr, invest(NB, nbRows()) + oneObs(NB), srcCard(NB) + vehicles(NB.mgr, NBV)), { h: 1140 });
    else if (B === 'RFP21B') html = page(profile(LV, ST.lvMgr, invest(LV, [['Investment stage', two(ST.lvStageB, ST.lvStageA, 'investment stage', false, { on: true })], ['Investment geography', '<div class="rfs-line">' + W('[DACH]') + '</div><div style="margin-top:5px">' + multi(2, 'investment geography') + '</div>'], ['Initial cheque', two(ST.lvChqB, ST.lvChqA, 'initial cheque')]]), srcCard(LV)), { h: 1000, overlay: stmtSheet('Investment stage', LV, [[ST.lvStageB, { lead: true }], [ST.lvStageA, {}]], { top: '<div class="rfs-dis">' + G.tri + 'Sources disagree · the latest reported leads</div>' }) });

    const MOB = {
      RFP18B: () => phone('Comparison', '<div class="crumb">' + PRJ + ' / Comparisons</div><div class="seg" role="radiogroup" aria-label="Comparison view" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button type="button" role="radio" aria-checked="true">By fund</button><button type="button" role="radio" aria-checked="false">By attribute</button></div><div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="pi" aria-label="Previous fund">‹</button><span class="raw">Fund 2 of 4</span><button type="button" class="pi" aria-label="Next fund">›</button></div>'
        + '<section class="cd" style="padding:12px 14px;gap:8px"><b style="font-size:16px">' + LV.name + '</b><span class="raw">' + LV.mgr + ' · vintage ' + LV.vint + '</span><dl class="rfp-kv"><dt>Reported size</dt><dd>' + amt(LV, true) + '<div style="margin-top:4px">' + sizeChip(LV) + '</div></dd><dt>Investment stage</dt><dd>' + two(ST.lvStageB, ST.lvStageA, 'investment stage', false, { compact: true, noBtn: true }) + '</dd><dt>Geography</dt><dd>' + W('[DACH]') + '<div style="margin-top:4px">' + multi(2, 'investment geography') + '</div></dd><dt>Initial cheque</dt><dd>' + two(ST.lvChqB, ST.lvChqA, 'initial cheque', false, { compact: true, noBtn: true }) + '</dd></dl></section>'),
      RFP18C: () => phone('Comparison', '<div class="crumb">' + PRJ + ' / Comparisons</div><div class="seg" role="radiogroup" aria-label="Comparison view" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button type="button" role="radio" aria-checked="false">By fund</button><button type="button" role="radio" aria-checked="true">By attribute</button></div><div class="selb" style="min-height:44px"><span>Attribute · <b>Initial cheque</b></span><span aria-hidden="true">▾</span></div><span class="raw">4 funds · as each source states it · not converted or ranked</span>'
        + '<div class="rfp-mcard"><b>' + NB.name + '</b>' + cell1(ST.nbChq) + '</div>'
        + '<div class="rfp-mcard"><b>' + LV.name + '</b><div class="rfs-dis">' + G.tri + 'Sources disagree · 2 statements</div>' + W(ST.lvChqB.v) + QT(ST.lvChqB.q) + chipS(ST.lvChqB) + '</div>'
        + '<div class="rfp-mcard"><b>' + AU.name + '</b>' + cell1(ST.auChq) + '</div>'
        + '<div class="rfp-mcard"><b>' + HP.name + '</b>' + NA('Stated per vehicle, not per manager.') + '</div>'),
      RFP20A: () => phone(NB.name, pProfile(NB, [['Manager', W(ST.nbMgr.v) + '<div>' + chipS(ST.nbMgr) + '</div>'], ['Stage', val(ST.nbStage)], ['Geography', val(ST.nbGeo)], ['Initial cheque', val(ST.nbChq)]]), pbar2),
      RFP20B: () => phone(LV.name, '<p class="raw">Profile behind the sheet</p>', pStatements()),
      RFP20C: () => phone(FJ.name, '<span class="eye">Five kinds of money · ' + FJ.name + '</span>' + J([sizeVal(FJ), val(ST.fjCap), val(ST.fjAum), val(ST.fjRev), val(ST.fjChq)].map((b, i) => '<section class="rfp-mcard rfs-pm"><div class="r1"><b>' + MONEY[i][0] + '</b><span class="rfs-whose">' + MONEY[i][2] + '</span></div>' + b + '</section>'))),
      RFP20D: () => phone(HP.name, '<a href="#" class="rfp-back" style="min-height:44px">‹ Back to results</a><div><span class="eye">Manager · public directory</span><h1 style="font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:3px">' + HP.name + '</h1><div class="raw" style="margin-top:4px">HQ [Munich] · 2 vehicles</div></div><dl class="rfp-kv"><dt>Reported size</dt><dd>' + NA(MGR_NA) + '</dd><dt>Vintage</dt><dd>' + NA(MGR_NA) + '</dd><dt>Manager AUM</dt><dd>' + val(ST.fjAum) + '</dd></dl><button type="button" class="disc" aria-expanded="false"><b>Vehicles · 2</b><span>' + LV.name + ', ' + FJ.name + '</span><i aria-hidden="true">▾</i></button>', pbar2),
      RFP21C: () => phone(LV.name, '<p class="raw">Profile behind the sheet</p>', pStatements())
    };

    const DOCS = {
      RFP22: () => dk('<h1>FND-P22 · Keyboard, focus and announcements</h1><p>Continues FND-P10. Every control has an accessible name and a visible 2px violet focus ring. The per-field statements open in the shared Sheet (D1317, D685) on the profile, and replace the Sheet’s content inside the detail Sheet; never a second Sheet.</p>'
        + '<h2>From the profile</h2>' + tbl(['#', 'Stop', 'Notes'], [['<span class="rfp-num">1</span>', '“2 sources” on Investment stage', 'A button: “2 sources state the investment stage. Open the statements”; aria-haspopup dialog'], ['<span class="rfp-num">2</span>', 'Sheet title “Investment stage · 2 sources”', 'Focus lands here on open, so the field is read first'], ['<span class="rfp-num">3</span>', 'Each statement, newest reported first', 'Read as: wording, qualifier, “Latest · leads” or “Same date · does not lead”, source, three dates'], ['<span class="rfp-num">4</span>', 'Each source chip', 'Opens the list in a new tab; its name says so'], ['<span class="rfp-num">5</span>', 'Close', 'Escape does the same; focus returns to the “2 sources” button']])
        + '<h2>From inside the detail Sheet</h2>' + tbl(['When', 'Focus goes to'], [['“2 sources” is pressed', 'The heading “Investment stage · 2 sources”; the Back control comes first in the Tab order'], ['Back, or the first Escape', 'The “2 sources” button that opened the statements'], ['A second Escape', 'Closes the Sheet; focus returns to the row’s name in the results'], ['A source is withdrawn while the statements are open', 'The heading; the lower count is announced']])
        + '<h2>Announcements</h2>' + tbl(['Event', 'Region', 'Text'], [['Statements open', 'none (dialog name)', 'Investment stage · 2 sources, dialog'], ['Sources disagree', 'read with the line', 'Sources disagree. The latest reported leads.'], ['Tied', 'read with the line', 'Sources disagree. Same reported date; neither leads.'], ['Statements could not be read', 'alert', 'What the sources state could not be read just now. Try again.'], ['Source withdrawn', 'alert', '[Source C]’s list was withdrawn. Its statement on investment stage was removed. 2 sources remain.']])
        + '<h2>Never colour alone</h2><p>Every tag is a word with a shape: Range, Typical, Average first cheque, Lower bound, Upper bound, As worded (bordered word tags); Earlier statement (lines glyph); Old statement (clock glyph and its age in words); Currency not verified (dashed circle with a question mark); Sources disagree (triangle and words). Not recorded, Not applicable and Unavailable keep their Platform States borders and glyphs.</p>'),
      RFP23: () => dk('<h1>FND-P23 · Handoff</h1><p>Checked against <code>main</code> at 58ee9d1b73 (19 Nov 2026). Continues D7032 (FND-P00 to FND-P11); returned as its own pair and landed as <code>D7032-p3.md</code>. No landed board is redrawn or renumbered.</p>'
        + '<h2>Boards, routes and fields</h2>' + tbl(['Board', 'Route', 'Field behind each value', 'Status'], [
          ['FND-P12, P12 B', '/research/funds/catalog/:id; the detail Sheet', '<code>item.proposed.manager_name</code>, <code>.investment_stage</code>, <code>.investment_geography</code>, <code>.initial_cheque</code>', 'Readable on main, no rows; recorded state ' + ENG('#7748 over #7743') + ', rows ' + ENG('#7751')],
          ['FND-P13', 'profile, Sheet', 'the cheque as written, qualifier, currency state, normalised range', ENG('#7743, #7748')],
          ['FND-P14', 'profile', 'lead preference, traction requirement, interests, date last raised; description', ENG('#7748') + ' · description ' + OWN('#7740')],
          ['FND-P15', 'profile', 'reported size (<code>fund_size_cents</code>, on main); stated fund capital, manager AUM, revenue threshold', 'size on main; rest ' + ENG('#7743, #7748')],
          ['FND-P16', 'profile Sheet; detail Sheet body', '<code>statements</code>, <code>tied</code>, flags, provenance per statement', ENG('#7748')],
          ['FND-P17', 'profile', 'record kind; <code>past_statements</code>; age per statement', ENG('#7744') + ' kind · ' + ENG('#7748')],
          ['FND-P18', '/research/projects/:uid/comparisons', 'two new rows in <code>ATTRIBUTES.fund</code>; cells as statements', ENG('#7759') + ' rows · ' + ENG('#7748') + ' cells'],
          ['FND-P19 to P22', 'shared', 'Platform States; <code>requireSuperAdmin</code>/<code>isSuperAdminUser</code> for Open source imports', 'shared builds of #7757 and #7759']])
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['<code>cloudflare-worker/src/services/researchFundProfile.ts</code>', '<code>PROPOSED_FIELDS</code> (four), <code>PROPOSED_REASONS</code>, <code>presentFact</code>: recorded / not_recorded / unavailable; one provenance object with reported, imported and reviewed dates'],
          ['<code>sql/migrations/202611180053_7167_research_fund_vehicle_facts.sql</code>', 'One row per vehicle and field; cheque as <code>min_cents</code>/<code>max_cents</code> in EUR, USD or GBP only, no wording; no rows written'],
          ['<code>frontend/src/pages/research/fundProfileRead.js</code>', '<code>PROPOSED_LABELS.initial_cheque</code> “Initial cheque range”; <code>chequeText</code> prints “from” or “up to” for one end; <code>managedLine</code> “Manager not recorded”'],
          ['<code>frontend/src/pages/research/FundCatalogProfile.jsx</code>, <code>FundProvenance.jsx</code>', '“How this vehicle invests · sourced fields only”; “Vehicles by [manager]”'],
          ['<code>cloudflare-worker/src/routes/research_project_comparisons.ts</code>', '<code>ATTRIBUTES.fund</code>: ten rows, no geography or cheque; a failed cell is <code>unreadable</code>']])
        + '<h2>Pending the owner · ⚑ (option A drawn)</h2>' + tbl(['Question', 'Drawn'], [['1 · Two sources disagree', 'A: both statements with source and date; the latest reported leads; tied, neither leads'], ['2 · Cheque wording and label', 'A: the source’s wording with a qualifier tag, label “Initial cheque” (the build renames “Initial cheque range”)'], ['3 · New fields on the dossier’s Public record card', 'A: no; the card stays as landed and links to the profile'], ['4 · Actions on manager, accelerator, resource', 'A: the landed actions for every kind'], ['#7740 · terms', 'Description and the accelerator and resource frames drawn conditional']])
        + '<h2>Frontend only</h2><p>The label rename to “Initial cheque”; the qualifier tags and currency-state words; the “N sources” button and opening the statements in the shared Sheet or in place inside the detail Sheet; the comparison phone views.</p>'
        + '<h2>Eadwyn</h2><p>The rail is not redrawn and this page hands no new task to the Eadwyn rail canvas (#5130). The dossier’s existing pre-meeting brief may cite these statements once they are recorded. Eadwyn never fills a Not recorded field and never settles a disagreement.</p>'
        + '<h2>Builds waiting</h2><p>#7757 (FND-P12 to FND-P17), #7759 (FND-P18), both for FND-P19 to FND-P23; after #7743, #7744 and #7748. Handoff paths: Save to shortlist opens the dossier; Compare in project opens the comparison with the two new rows; Back to results restores the directory as it was.</p>')
    };
    if (!html && MOB[B]) html = MOB[B]();
    if (!html && DOCS[B]) html = DOCS[B]();
    if (!html) html = page(profile(NB, ST.nbMgr, invest(NB, nbRows()), srcCard(NB)), { h: 1200 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
