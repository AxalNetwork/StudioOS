    /* ---------- phone ---------- */

    const ptabs = (cur) => '<div class="rml-tabs" role="tablist" aria-label="Markets" style="overflow:hidden"><button type="button" role="tab" aria-selected="' + (cur === 'dir') + '" style="padding:0 10px;min-height:44px">Market directory</button><button type="button" role="tab" aria-selected="' + (cur === 'listed') + '" style="padding:0 10px;min-height:44px">Listed companies</button></div>';

    const pCard = (r, k, o) => { o = o || {}; const ed = k === 'e'; return '<article class="rml-pc"><div class="r1"><b>' + N(r[1]) + '</b></div><div class="r2"><span class="rml-tk">' + T(r[0]) + '</span>' + srcChip(k) + (o.dup ? '<span class="rml-dup" style="margin-left:0">' + G.dup + '2 sources</span>' : '') + '</div>'

      + (o.open ? '<dl><dt>Exchange</dt><dd>' + (r[2] || NR) + '</dd><dt>CIK</dt><dd class="rml-tk" style="font-weight:600">' + (ed ? r[3] : NR) + '</dd><dt>Country</dt><dd>' + (ed ? NR : r[3]) + '</dd><dt>Sector</dt><dd>' + (ed ? NR : r[4]) + '</dd><dt>Market cap</dt><dd>' + (ed ? NR : r[5]) + '</dd><dt>Employees</dt><dd>' + (ed ? NR : r[6]) + '</dd><dt>Read</dt><dd class="w">' + (ed ? ED_DATE : 'Updated ' + SIG_DATE) + '</dd></dl>' + (ed ? '<a class="btn" href="#" style="min-height:44px">Open source file' + G.ext + '</a>' : '<span class="rml-nol">No source link recorded</span>') : '')

    const pBar = (pg, x, prev, next) => '<div class="rml-pbar">' + (pg ? '<div class="pg"><button type="button" class="btn"' + (prev ? '' : ' disabled aria-disabled="true" style="opacity:.45"') + '>‹ Previous</button><span>' + pg + '</span><button type="button" class="btn"' + (next ? '' : ' disabled aria-disabled="true" style="opacity:.45"') + '>Next ›</button></div>' : '') + '<button type="button" class="btn p" style="min-height:48px">' + G.dl + x + '</button></div>';

    const phPage2 = () => phone('Markets', ptabs('listed') + pSearch('energy') + pFilt(1, 'SEC EDGAR') + '<div aria-live="polite"><b style="font-size:15px;outline:2px solid var(--vi);outline-offset:3px;border-radius:6px" tabindex="-1">64 listing records · rows 51–64</b><p class="mu" style="font-size:12.5px;margin-top:2px">SEC EDGAR · “energy” · name A to Z. Country, sector, market cap and employees: Not recorded for these rows.</p></div>' + J(E2.slice(0, 4).map(r => pCard(r, 'e'))), pBar('Page 2 of 2', 'Export this page · 14 rows', true, false));
    const phSheet = () => phone('Markets', ptabs('listed') + pSearch('energy') + pFilt(1, 'SEC EDGAR'), '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 20px;display:flex;flex-direction:column;gap:12px"><h2 id="fs" style="font-size:17px;font-weight:800">Filters</h2>'

      + '<div><span class="rml-lb">Sort</span><button type="button" class="rml-sel" style="width:100%;min-height:44px">Name, A to Z<span aria-hidden="true">▾</span></button></div>'
      + '<p class="mu" style="font-size:12px">Applying returns to page 1.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn" style="min-height:48px">Reset</button><button type="button" class="btn p" style="min-height:48px">Apply</button></div></div></div>');

      + J(MK.map(m => '<a href="#" class="rml-pc" style="flex-direction:row;justify-content:space-between;align-items:center;min-height:56px;color:var(--ink)"><span><b style="font-size:14px">' + m[0] + '</b><br><span class="mu" style="font-size:12px">' + (m[1] || 'Not mapped') + '</span></span><span class="rml-tk">' + fmt(m[3]) + '</span></a>')), pBar('', 'Export filtered markets · 6 rows'));

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const journey = () => dk('<h1>Listed companies and scoped exports · journey, URL and annotation key</h1><p>Research · Markets (<code>/research/markets</code>) for any licence that holds Research. This addendum continues the Research v2 canvas (RS-03) and its sibling #7036, which owns the shared directory layout and the investor thesis. Every company, ticker, CIK, count and date here is fictional sample data.</p>'
      + '<h2>The main task, frame by frame</h2>' + tbl(['Step', 'What the reader does', 'Frame'], [['1', 'Opens Markets and chooses the Listed companies tab', 'RML-02 (desktop) · RML-10A (phone)'], ['2', 'Types HLDN: two listing records, one per source, each labelled', 'RML-03 · RML-10A'], ['3', 'Opens Details on the SEC EDGAR row, then its source file in a new tab', 'RML-03 · RML-03B'], ['4', 'Searches “energy”, picks SEC EDGAR, sorts by name, goes to page 2', 'RML-04 · RML-10B · RML-10C'], ['5', 'Exports this page: 14 rows, same order, every column', 'RML-04B · RML-07'], ['6', 'Refreshes or comes Back: the same page 2 returns', 'RML-04 URL note'], ['7', 'On Market directory, searches “storage” and exports the 6 filtered markets', 'RML-06 · RML-06B · RML-10D']])
      + '<h2>URL contract</h2>' + tbl(['Parameter', 'Values', 'Rule'], [['<code>tab</code>', '<code>listed</code>; absent = Market directory', 'Switching tabs keeps each tab’s own parameters'], ['<code>q</code>', 'up to 120 characters', 'Both tabs; the Worker matches name anywhere and ticker from its start'], ['<code>source</code>', '<code>signal_companies</code> · <code>sec_edgar</code>; absent = all', 'Listed only'], ['<code>sort</code>', 'Listed: <code>-market_cap</code> (default) · <code>market_cap</code> · <code>name</code> · <code>-name</code>. Directory: today’s values', 'Default left out'], ['<code>country</code>, <code>sector</code>', 'ISO code, sector name', 'Listed, when offered (RML-05); either one leaves EDGAR out'], ['<code>page</code>', '2 and up; absent = 1', 'Any change to q, source, sort, country or sector drops it'], ['History', 'replace', 'As the directory does today, so Back leaves Markets in one step and returns from a profile to the same view']])
      + '<h2>Annotation key</h2><p>' + PT('#7037 · backend') + ' needs a Worker change. ' + FL('Owner decision') + ' is a policy question, drawn as option A. <span class="rml-xd">Existing data</span> means the Worker already returns it. Tags are annotations, not product copy. States follow Platform States (D5129): Not recorded, None and Unavailable each keep a word and a glyph and are never drawn as 0.</p>');
    const mapping = () => dk('<h1>CSV column mapping</h1><p>Both files are written in the browser by <code>exportView</code> from the rows the view holds, in the order shown, as UTF-8 with a BOM. The label, the row count, the order and the columns describe the same records.</p>'
      + '<h2>Export filtered markets · Market directory</h2>' + tbl(['Column', 'From', 'When missing'], [['Market', '<code>name</code>', 'Always present'], ['Companies (taxonomy count)', '<code>supplied_count</code>', 'Always present; written without separators'], ['Tracked sector', '<code>mi_sector</code>', '“Not mapped”'], ['Slug', '<code>slug</code>', 'Always present']]) + '<p>Rows: the markets matching the search, in the current sort, every match (paged from the Worker if more than one read). File: <code>' + FILE_M + '</code>.</p>'
      + '<h2>Export this page · Listed companies</h2>' + tbl(['Column', 'Signal companies row', 'SEC EDGAR row'], [['Ticker', '<code>symbol</code>', '<code>symbol</code> (EDGAR ticker)'], ['Company', '<code>name</code>', '<code>name</code>'], ['Exchange', '<code>exchange</code> or Not recorded', '<code>exchange</code> or Not recorded'], ['Source', 'Signal companies', 'SEC EDGAR'], ['CIK', 'Not recorded', '<code>cik</code>'], ['Country', '<code>country</code> or Not recorded', 'Not recorded'], ['Sector', '<code>sector</code> or Not recorded', 'Not recorded'], ['Market cap band', '<code>market_cap_band</code> or Not recorded', 'Not recorded'], ['Employee band', '<code>employee_band</code> or Not recorded', 'Not recorded'], ['Other listings', 'Not recorded', '<code>other_listings</code> as “TICKER (EXCHANGE)”, “; ” between; None when empty'], ['Source date', '<code>updated_at</code> (date)', '<code>as_of</code>'], ['Source link', 'Not recorded', '<code>source_url</code>'], ['Licence', 'Not recorded', '<code>licence</code>']]) + '<p>Rows: this page only, as many as the label says. File: <code>listed-companies-page-&lt;n&gt;-&lt;rows&gt;-rows-&lt;date&gt;.csv</code>, e.g. <code>' + FILE_L + '</code>. ' + FL('Write “Not recorded” in cells, not blanks · drawn A') + '</p>');
    const handoff = () => dk('<h1>Handoff · #7037</h1>'
      + '<h2>Checked on main (87bf3ac4ac)</h2>' + tbl(['File', 'What it showed'], [['<code>routes/research_markets.ts</code> <code>GET /listed-companies</code>', 'Takes <code>q</code> (name contains, ticker starts with), <code>source</code> (signal_companies, sec_edgar), <code>sector</code>, <code>country</code>, <code>sort</code> (name, -name, market_cap, -market_cap; default -market_cap), <code>limit</code> (default 50, max 100), <code>offset</code>. Signal rows first, then EDGAR by name. A sector or country filter leaves EDGAR out. Returns <code>total</code>, <code>store_total</code>, per-source totals, EDGAR <code>not_recorded</code> fields, licence, URL and the store-wide overlap. A failed read is 503 <code>listed_companies_unreadable</code>.'], ['<code>pages/research/MarketDirectoryZone.jsx</code>', 'Tabs Private, Public, Government in React state, not the URL. <code>PublicPanel</code> has no search, source or sort control; its offset lives in state; it shows CIK, Not recorded and the EDGAR link. The directory keeps <code>q</code> and <code>sort</code> in the URL and filters the 100 markets it read.'], ['<code>workspaces/ResearchWorkspace.jsx</code>, <code>zoneActionBuilder.js</code>, <code>lib/csvExport.js</code>', 'The zone Export (“Export · this view”) always writes <code>markets.data.items</code>: up to 100 markets, unfiltered, in read order, on either tab. Columns Market, Companies (taxonomy count), Tracked sector, Slug. Named <code>markets-&lt;n&gt;-rows-&lt;date&gt;.csv</code>.'], ['<code>migrations/412_research_public_companies_edgar.sql</code>', 'Every EDGAR row’s <code>source_url</code> is the ticker file, not a company page.']])
      + '<h2>Preserved</h2><p>The Worker’s paging (50 a page, signal companies first, then EDGAR), its counts and refusal sentence, the two source captions with EDGAR’s licence and file link, <code>&lt;Unrecorded /&gt;</code> for missing values, the directory’s <code>?q=</code> and <code>?sort=</code>, and <code>exportView</code>’s file naming and BOM.</p>'
      + '<h2>Frontend only</h2><p>Tab names Market directory and Listed companies (shared with #7036); tab, q, source, sort and page in the URL; the search, source and sort controls; page-1 reset; the result count line and source explanation; per-page duplicate marker; Details disclosure; folded all-Not-recorded columns; focus after paging; scoped export labels and the listing mapping; the directory export writing the filtered, sorted rows (paging the existing <code>/api/research/markets?q=&amp;sort=&amp;dir=</code> when needed); export states; country and sector controls if offered; phone cards, filter sheet and dark tokens.</p>'

      + '<h2>Accessibility</h2>' + tbl(['Area', 'Rule'], [['Search', 'Visible label “Search name or ticker” with the matching rule as hint; Esc clears'], ['Source', 'Radio group with a visible label; a source left out by a filter says why in words'], ['Tables', 'Caption with the rows shown; th scope; Not recorded is a word with a dashed box'], ['Paging', 'Focus to the result heading, polite announcement; disabled buttons skipped'], ['Links', 'Source links say they open a new tab'], ['Status', 'Source, duplicate, None, Not recorded and Unavailable never rely on colour'], ['Touch', '44px on phone, 48px for the export and the sheet actions']]));

    /* ---------- route ---------- */

    else if (B === 'RML09') html = keyboard();
    else if (B === 'RML10A') html = phHLDN();
    else if (B === 'RML10B') html = phPage2();
    else if (B === 'RML10C') html = phSheet();
    else if (B === 'RML10D') html = phDir();
    else if (B === 'RML11') html = page(page2(), { h: 1500 });

    else html = page(page2(), { h: 1500 });
    return { html: { __html: html } };
