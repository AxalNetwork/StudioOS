    else if (B === 'NOP7') html = crop(1400, `<div style="display:flex;gap:20px;align-items:flex-start">${CHANGED(1)}<section class="cd" style="flex:1"><span class="tag">After Review the new group</span><div class="ch"><h2>New preview · 8 contacts</h2><span class="sm">version v43</span></div><table class="tbl"><thead><tr><th scope="col">Contact</th><th scope="col">Current</th><th scope="col">Proposed</th></tr></thead><tbody>${J([...ELM.map((c) => c.n === '[Priya Nair]' ? Object.assign({}, c, { k: 'c' }) : c), { n: '[Leo Park]', t: 'Producer', k: 'p' }].map((c) => `<tr${c.k !== 'c' ? ' class="nop-chg"' : ''}><td><b>${c.n}</b></td><td>${K(c.k)}</td><td>${c.k !== 'c' ? K('c') : '<span class="s">= Already Client</span>'}</td></tr>`))}</tbody></table><div class="cf"><span class="foot">The button names the new count.</span><button type="button" class="btn p">Apply to 3 contacts</button></div></section></div>`);

    /* ===== NW4-P.8 · Back on the company ===== */
    else if (B === 'NOP8') html = shell(COMPANY({ k: 'c', fv: 1, rows: ELM.map((c) => Object.assign({}, c, { k: 'c' })), sub: `7 people in your book · latest interaction ${mo('2026-11-09')} · type ■ Client`, result: `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Saved at ${mo('14:04')}: 3 contacts changed to Client.</b> [Elm Studio] reads ■ Client, 7 of 7. Back to Organizations keeps your search and filter.</div></div>` }), { h: 1000 });

    /* ===== NW4-P.9 · Directory states ===== */
    else if (B === 'NOP9') html = crop(1400, `<div class="g3">
      ${stcard('Loading', 'All organizations', `<p class="sub" role="status">Reading your book…</p>${J([1, 2, 3, 4].map(() => '<div class="nop-skr"><span class="sk" style="height:12px;width:32%"></span><span class="sk" style="height:12px;width:22%"></span><span class="sk" style="height:12px;width:8%"></span></div>'))}<p class="foot">Counts read “Loading”, never 0.</p>`)}
      ${stcard('None · no contacts', 'Your book has no contacts yet', `<p class="sub">${NONE} Organizations come from the company name on each contact. Add a person with their company to see it here.</p><div class="acts"><button type="button" class="btn p">Add person</button><a class="btn t" href="#">Import contacts</a></div>`)}
      ${stcard('Not recorded · contacts without companies', '15 contacts, none with a company', `<p class="sub">${NR('company')} on all 15. Nothing is grouped, and nothing is guessed from an email domain.</p><a class="btn" href="#" style="align-self:flex-start">Add companies in Relationships →</a>`)}
      ${stcard('None · no search matches', 'No company matches “elmx”', `<p class="sub">Searched 64 companies and their 171 people. Filter: All.</p><button type="button" class="btn" style="align-self:flex-start">Clear search</button>`)}
      ${stcard('Unavailable · read failed', 'All organizations', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Your book could not be read.</b> Nothing is shown as zero. Your contacts are unchanged.</div></div><button type="button" class="btn" style="align-self:flex-start">Try again</button>`, 'bad')}
      ${stcard('Partial · the read stopped at 500', 'All organizations', `<div class="nt a"><span class="ic" aria-hidden="true">◌</span><div><b>Partial: the read returns at most 500 contacts, and it returned 500.</b> Your book may hold more. Companies and counts cover those 500 only, and a company may be missing people.</div></div><p class="foot">Change relationship type stays off until the whole group is read. ${TB('full owner-scoped read and total · #7052')}</p>`)}</div>`);

    /* ===== NW4-P.10 · Tablet 768 ===== */
    else if (B === 'NOP10') html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ crumb: '<a href="#">Organizations</a> › [Elm Studio]', eye: 'Organization', h1: '[Elm Studio]', sub: '7 people · type ≠ Mixed', acts: `<button type="button" class="btn p">Change relationship type</button>` })}
      <section class="cd"><div class="ch"><h2>What [Elm Studio] is to the firm</h2>${K('m')}</div>${BREAK(ELM)}</section>
      <section class="cd"><div class="ch"><h2>People known</h2><span class="sm">7</span></div><table class="tbl"><tbody>${J(ELM.slice(0, 5).map((c) => `<tr><td><b>${c.n}</b><small>${c.t}</small></td><td>${K(c.k)}</td></tr>`))}</tbody></table></section></main>
      <div class="dim" aria-hidden="true"></div>${REVIEW({ w: 708 }).replace('class="nop-mdl"', 'class="nop-mdl" style="top:70px"')}</div>`;

    /* ===== NW4-P.11 · Phone 390 ===== */
    else if (B === 'NOPM1') html = phone('Network', `<header style="display:flex;flex-direction:column;gap:6px"><span class="eye">Network · Work our relationships</span><h1 style="font-size:22px;font-weight:800">Organizations</h1></header>${MSEL('Organizations')}
      <p class="foot"><b>${N.book}</b> contacts read 14:02 · <b>${N.withCo}</b> with a company · <b>${N.noCo}</b> without · <a href="#">See them</a></p>
      <label for="pq" class="sr">Search organizations</label><input id="pq" class="inp" style="min-height:44px;min-width:0;width:100%" placeholder="Search companies or people">
      <div class="f"><label for="pf">Relationship type</label><select id="pf" class="msel"><option>All · ${N.cos}</option><option>■ Client · ${N.c}</option><option>□ Prospect · ${N.p}</option><option>↗ Referral source · ${N.r}</option><option>≠ Mixed · ${N.m}</option><option>— Not recorded · ${N.nr}</option></select></div>
      ${J(COS.slice(0, 6).map((o) => `<a class="pc nop-pcl" href="#"><div class="r1"><b>${o.n}</b><span aria-hidden="true">›</span></div><dl class="nop-lr"><dt>Type</dt><dd>${K(o.k)}${o.part ? ' ' + PART(o.part) : ''}</dd><dt>Who says</dt><dd>${o.br}</dd><dt>People</dt><dd class="mo">${o.p}</dd><dt>Latest</dt><dd${o.lt ? ' class="mo"' : ''}>${o.lt || '— Not recorded'}</dd></dl></a>`))}
      <p class="foot">1–6 of ${N.cos} · <a href="#">More</a></p>`, null, { h: 1600 });
    else if (B === 'NOPM2') html = phone('[Elm Studio]', `<span class="eye">Organization</span><h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1><p class="sub">7 people · latest interaction 2026-11-09</p>
      <div class="pc"><span class="eye">What it is to the firm</span>${K('m')}${BREAK(ELM)}<small>4 Client, 2 Prospect, 1 with no type.</small></div>
      <div class="ch"><h2>People known</h2><span class="sm">7</span></div>${J(ELM.slice(0, 4).map((c) => `<div class="pc"><div class="r1"><div><b>${c.n}</b><br><small>${c.t}</small></div><button type="button" class="pi" aria-label="Open ${c.n}">›</button></div><dl class="nop-lr"><dt>Type</dt><dd>${K(c.k)}</dd><dt>Owner</dt><dd>${c.ow || '○ None assigned'}</dd></dl></div>`))}`, '<button type="button" class="btn p">Change relationship type</button>', { back: 1 });
    else if (B === 'NOPM3') html = phone('[Elm Studio]', `<span class="eye">Organization</span><h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1><div class="pc">${K('m')}${BREAK(ELM)}</div>`, null, { back: 1, sheet: bsheet({ id: 1, eye: 'Step 1 of 3 · Choose', h: 'Change relationship type', body: `<fieldset class="nop-fs"><legend class="sr">New relationship type</legend>${OPT('c', '4 of 7', 1, '3 would change')}${OPT('p', '2 of 7', 0, '5 would change')}${OPT('r', null, 0, '7 would change')}${OPT('x', '1 of 7', 0, '6 would become Not recorded')}</fieldset><p class="foot" role="status">■ Client chosen, not saved.</p>`, foot: '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Review 3 changes</button>' }) });
    else if (B === 'NOPM4' || B === 'NOPDM') html = phone('[Elm Studio]', `<h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1>`, null, { back: 1, sheet: bsheet({ id: 2, eye: 'Step 2 of 3 · Review', h: 'Review the change', body: `<dl class="nop-lr nop-lrw"><dt>Change</dt><dd>Set ${K('c')} on all 7</dd><dt>Will change</dt><dd><b class="mo">3</b> · 4 already Client</dd><dt>Read</dt><dd class="mo">14:02 · v41</dd></dl><ul class="nop-ml0" aria-label="7 contacts, current and proposed">${J(ELM.slice(3).map((c) => mRow(c, 'c')))}</ul><p class="foot">Scrolled to the 3 changes · 7 of 7 in the list, scroll up for the rest.</p>`, foot: '<button type="button" class="btn">Back</button><button type="button" class="btn p">Apply to 3 contacts</button>' }) });
    else if (B === 'NOPM5') html = phone('[Elm Studio]', `<h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1>`, null, { back: 1, sheet: bsheet({ id: 3, eye: 'Step 3 of 3', h: 'Saved', body: `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>The server confirmed 3 contacts changed.</b> [Elm Studio] now reads ■ Client, 7 of 7.</div></div><dl class="nop-lr nop-lrw"><dt>Changed</dt><dd>[Priya Nair], [Omar Reyes], [Hana Ito]</dd><dt>Saved</dt><dd class="mo">14:04 · by you</dd></dl>`, foot: '<button type="button" class="btn p">Back to [Elm Studio]</button>' }) });
    else if (B === 'NOPM6') html = phone('[Elm Studio]', `<h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1>`, null, { back: 1, sheet: bsheet({ id: 4, busy: 1, eye: 'Checking', h: 'Checking what was saved', body: `<div class="nt a" role="status"><span class="ic" aria-hidden="true">?</span><div><b>The connection dropped before the server answered.</b> Reloading [Elm Studio] before offering anything else.</div></div><div class="nop-skl"><span class="sk" style="height:12px;width:80%"></span><span class="sk" style="height:12px;width:60%"></span></div><p class="foot">No retry until the reload answers.</p>`, foot: '<button type="button" class="btn p" aria-disabled="true">Checking…</button>' }) });
    else if (B === 'NOPM7') html = phone('[Elm Studio]', `<h1 style="font-size:20px;font-weight:800">[Elm Studio]</h1>`, null, { back: 1, sheet: bsheet({ id: 5, eye: 'Nothing saved', h: 'The group changed', body: `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Nothing was saved.</b> [Elm Studio] changed after your review at 14:02.</div></div><dl class="nop-lr nop-lrw"><dt>Added</dt><dd>[Leo Park] · □ Prospect</dd><dt>Changed</dt><dd>[Priya Nair] □ → ■</dd><dt>Group now</dt><dd><b class="mo">8</b> · 3 would change</dd></dl>`, foot: '<button type="button" class="btn">Back</button><button type="button" class="btn p">Review the new group</button>' }) });

    /* ===== NW4-P.12 · Dark ===== */
    else if (B === 'NOPD1') html = DIR({ h: 1120 });
    else if (B === 'NOPD2') html = shell(COMPANY({}), { h: 1000, overlay: REVIEW({}) });

    /* ===== Prototype · keyboard and focus ===== */
    else if (B === 'NOPK') html = `<div class="${CV} doc"><div><span class="eye">Network Organizations · partner · #7052 · prototype</span><h2 style="font-size:22px;margin-top:4px">The clickable task flow, keyboard order and where focus goes</h2></div>
      <div class="nop-flow">${J([['NOP1', 'Organizations', 'Open on [Elm Studio]'], ['NOP2', '[Elm Studio]', 'Change relationship type'], ['NOP3', 'Choose', 'Review 3 changes'], ['NOP4', 'Review', 'Apply to 3 contacts'], ['NOP5', 'Saving → Saved', 'Back to [Elm Studio]'], ['NOP8', '[Elm Studio] · ■ Client', '‹ Back to Organizations']].map((s, i) => `<div class="nop-fs2"><span class="mo">${s[0]}</span><b>${s[1]}</b><small>${s[2]}</small></div>${i < 5 ? '<span class="nop-fa" aria-hidden="true">→</span>' : ''}`))}</div>
      <p class="foot">Branches from Apply: Not saved (NOP5) → Review again → NOP4 · no answer → Checking (NOP6) → It was saved → NOP8, or It was not saved → Review again → NOP4 · group changed (NOP7) → Review the new group → NOP4 with 8 contacts. Phone: NOPM1 → M2 → M3 → M4 → M5, with M6 and M7 as the branches.</p>
      <div class="cols">
      <div><h3>Keyboard order</h3><ul><li>Directory: search → type filter (arrow keys move inside the radio group) → table rows (Open per row) → pager.</li><li>Company: Back to Organizations → Ask → Change relationship type → people rows → Person Sheet buttons.</li><li>Choose: options (arrows) → Cancel → Review. Enter on an option does not commit.</li><li>Review: Changing/All toggle → the scrollable list (it is focusable and labelled) → Back → Cancel → Apply.</li><li>Visible focus: 2px violet ring offset 2px on every control, also on dark.</li></ul></div>
      <div><h3>Dialog and sheet</h3><ul><li>Desktop: <code>role=dialog</code>, <code>aria-modal</code>, labelled by its heading; Tab and Shift+Tab stay inside.</li><li>Phone: the same content as a bottom sheet, full width, 44px targets, sticky actions; the page behind is inert.</li><li>First focus: the chosen option in Choose; the summary heading in Review; the result heading in Saved and the checked states.</li><li>Escape: closes Choose and Review with nothing saved. Ignored while Saving or Checking, which announce “Still saving” or “Still checking”.</li><li>Not saved and The group changed are <code>alertdialog</code>; focus goes to their primary.</li></ul></div>
      <div><h3>Focus return and context</h3><ul><li>Cancel, ✕ and Escape return focus to Change relationship type.</li><li>After Saved, focus returns to Change relationship type and the page shows the saved line.</li><li>Back to Organizations restores the search text, the type filter, the page and the scroll, and focuses the company’s row link.</li></ul></div>
      <div><h3>Announcements</h3><ul><li>Choose: “Client chosen, not saved. 3 of 7 contacts would change.” (polite)</li><li>Saving: “Saving 3 contacts.” Saved: “Saved. 3 contacts changed to Client.”</li><li>Not saved, group changed: announced as alerts. Checking: “Checking what was saved.”</li><li>Directory filter: “14 Client companies.” No search matches: “No company matches elmx.”</li></ul></div>
      </div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NOPH') html = `<div class="${CV} doc"><div><span class="eye">Network Organizations · partner bulk relationship edits · #7052 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>pages/partner/OrganizationsZone.jsx</code>: a dashed “Nothing to roll up yet” card leads, with tiles including “Organization records 0”. The table under it is titled “Intended shape”.</li>
      <li>Its Build organization records modal writes as soon as a select changes: <code>for (const c of at) await api.partnerBookSetRelationship(c.uid, value)</code>. There is no review and no count. A failure stops the loop part-way and shows “That could not be changed.”; the book is not reloaded.</li>
      <li><code>lib/partnerBookRollUp.js</code>: groups on the trimmed, case-folded company text. Mixed when two set types differ. Unset contacts are skipped, so 3 Referral source + 1 unset reads plain “Referral source”.</li>
      <li><code>routes/partnernet.ts</code> <code>GET /book</code>: owner-scoped, <code>ORDER BY b.id ASC LIMIT 500</code>, no total and no error envelope. <code>PATCH /book/:uid/relationship</code>: one contact; <code>client</code>, <code>prospect</code>, <code>referral_source</code> or <code>null</code>; 404 when not yours; no version check, no batch route.</li>
      <li>Headcount, revenue and engagement sourced have no field. Nothing links a book contact to an engagement.</li></ul></div>
      <div><h3>Data source and counts</h3><ul>
      <li>Source: your relationship book (<code>partner_book_contacts</code>), read with <code>GET /api/partnernet/book</code>.</li>
      <li>Contacts read (186): rows returned. With a company (171) and without (15) add up to it.</li>
      <li>Companies (64): distinct trimmed, case-folded names. 14 + 22 + 9 + 5 + 14 = 64.</li>
      <li>People known: contacts carrying that name. Latest interaction: the newest <code>last_interaction_at</code> among them.</li>
      <li>Will change: contacts whose type differs from the chosen one. The button names this count; Saved shows the server’s count.</li></ul></div>
      <div><h3>Requires engineering (◇ #7052)</h3><ul>
      <li>Read one company’s complete owner-scoped group with a count and a version, with no 500 cap. Also return a book total so Partial is exact.</li>
      <li>One atomic save for the group: the expected version and uids go in, the confirmed affected count comes back. All or none.</li>
      <li>409 <code>group_changed</code> with the current group when membership or types moved since the review.</li>
      <li>An idempotency key so a retry after a dropped response is safe.</li>
      <li>Tests: a 501+ contact fixture with one company spanning the boundary, a rejected save, a response dropped after commit, and membership changing during review.</li></ul></div>
      <div><h3>Frontend only</h3><ul>
      <li>The populated list first, with the source line, the type filter with counts and the breakdown line. The dashed card and the “Organization records 0” tile are removed.</li>
      <li>Partial in the roll-up (${TO('Q1')} option A), the company page, the Person Sheet for one contact (single PATCH works today), Choose → Review → Result, the six directory states, phone, tablet and dark.</li>
      <li>Until the backend lands, Apply stays off on the company page. Per-contact edits from the Person Sheet keep working.</li>
      <li>Preserved: the Network shell and four links, Eadwyn as the one rail with the single-contact exposure draft (cost first), and the Not recorded words.</li></ul></div>
      <div><h3>Pending the owner</h3><ul><li>${TO('Q1')} A company with one type and some unset contacts: A, the type plus ◌ Partial “3 of 4 set” (drawn); B, the type alone, as on main.</li></ul></div>
      <div><h3>Open</h3><ul><li>Whether the group version is a hash of uids and types or a counter on the book.</li><li>The wording of each server refusal, once the save route names its codes.</li></ul></div>
      </div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nop-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
