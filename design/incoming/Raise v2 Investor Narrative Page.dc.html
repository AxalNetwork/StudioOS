      + '<section class="cd" style="gap:8px"><div class="ch"><h3 class="ran-h3">2 · Start an investor update</h3><span class="sm">Grow › Share an update</span></div><p style="font-size:12.5px;line-height:1.5">Opens <span class="mo">/grow/update</span> with a new update. Today it starts with a title only.</p><p style="font-size:12.5px">' + BE('Needs backend') + ' v4’s Traction and The ask sentences arrive as the update’s highlights. The update has no free body.</p><a class="btn" href="#" style="align-self:flex-start">Open Share an update</a></section></div></aside>';

    /* ---------- RAN24 · Build a deck from this version ---------- */
    const VERS = [['v5', '[Seed funds]', '[12 Nov 2026]', '[3]', 'v4', null], ['v4', '[Seed funds]', '[10 Nov 2026]', '[7]', 'v3', 'Pitch deck v6 · cards 1, 2'], ['v3', '[Angels]', '[28 Oct 2026]', '[4]', 'v2', null], ['v2', '[Pre-seed funds]', '[14 Oct 2026]', '[1]', 'Blank', null], ['v1', '[Seed funds]', '[2 Sep 2026]', '[5]', 'Live deck', null]];
    const verTable = () => '<section class="cd"><div class="ch"><h2>Versions</h2><span class="sm mo">5 saved · newest v5</span></div><table class="tbl"><thead><tr><th>Version</th><th>Audience</th><th>Saved</th><th>By</th><th class="n">Revision</th><th>Based on</th><th>Read by</th><th>Deck</th></tr></thead><tbody>'
      + J(VERS.slice(0, 3).map((r, i) => '<tr><td><b>' + r[0] + '</b>' + (i === 0 ? ' <small>newest</small>' : '') + '</td><td>' + r[1] + '</td><td class="mo">' + r[2] + '</td><td>' + FN + '</td><td class="n">' + r[3] + '</td><td>' + r[4] + '</td><td>' + (r[5] || '<span class="ran-nrec">' + SH.nd + 'No deck reads this version.</span>') + '</td><td>' + (i === 0 ? '<button type="button" class="btn bsm">Build a deck from v5</button>' : '<span class="ran-old">' + BE('Builds from v5, the newest, until older versions can be chosen') + '<a class="btn t bsm" href="#">Open v5</a></span>') + '</td></tr>')) + '</tbody></table><p class="foot">Read by counts only the current deck’s cards. ' + FLAG('Older versions: drawn as ◇, offer the newest (pick A)') + '</p></section>';
    const menu = () => '<div class="ran-menu" role="menu" aria-label="Share"><button type="button" role="menuitem">Copy or export…</button><button type="button" role="menuitem">Email intro…</button><button type="button" role="menuitem">Investor update…</button><button type="button" role="menuitem" class="on">Build a deck from v5…</button><span class="ran-mi">Reverse: <a href="#">Start from: Pitch deck v6’s words →</a> (NAR11)</span></div>';
    const ran24a = () => crop('<span class="eye">RAN24a · the entry · Story header (v5) and each Versions row</span><div class="ran-hdc"><div><b style="font-size:18px">Investor narrative</b><div class="ran-hl">' + picker(5) + '<span class="ran-mut">' + VLINE(5) + '</span></div></div><div style="position:relative;display:flex;gap:8px;align-items:flex-start"><button type="button" class="btn">History</button><button type="button" class="btn" aria-expanded="true" aria-haspopup="menu">Share ▾</button><button type="button" class="btn p">Save version</button>' + menu() + '</div></div>'
      + '<div style="height:150px"></div>' + verTable() + '<div class="nt"><span class="ic" aria-hidden="true">+</span><div><b>No version is saved yet.</b><div class="mu">Build a deck from the narrative: Save a version first.</div></div><span class="bt"><button type="button" class="btn bsm">New version</button></span></div>', 1300);
    const ran24b = () => crop('<span class="eye">RAN24b · confirm before the hand-off · nothing runs or is charged here</span><div class="cd ran-cf" role="dialog" aria-modal="true" aria-labelledby="bh"><div class="ran-lbh" style="padding:0"><div><span class="eye">Build a deck</span><h2 id="bh">Build a deck from v5</h2><p class="ran-mut" style="font-size:12.5px;margin-top:3px">' + VLINE(5) + '</p></div><button type="button" class="ib" aria-label="Close">✕</button></div>'
      + '<dl class="kv2" style="grid-template-columns:170px minmax(0,1fr)"><dt>What it reads</dt><dd>v5’s words, figure-free. A sentence that names a figure is left out; figures come bound from your records.</dd><dt>Outline</dt><dd><span class="mo">[11]</span> cards planned · <span class="mo">[1]</span> left out: Closing line, Not recorded</dd><dt>What it saves</dt><dd>A new deck version, Pitch deck v7, <b>not current</b>. Pitch deck v6 stays current.</dd><dt>Price, from the outline</dt><dd><span class="mo">[$0.84]</span> estimated · held when you confirm in the studio, charged for what runs</dd><dt>Read by</dt><dd>Changes only once you make v7 current and its cards bind v5.</dd></dl>'
      + '<p class="foot">The studio names the version it read: “Built from narrative v5”. It always reads the newest saved version.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Continue to Pitch deck studio</button></div><p class="foot mo" style="text-align:right">/raise/pitch/new?project_id=[12]</p></div>', 760);

    /* ---------- RAN25 · Change history panel ---------- */
    const histRow = (s) => '<li><div class="r1"><b>' + s[0] + '</b>' + s[2] + '</div><small class="mo">' + (s[3] ? 'Last changed ' + s[3] : (s[1] ? 'Not changed since this version was made' : 'Not changed since this version was made · Not recorded')) + '</small></li>';
    const histPanel = () => '<div class="dim1" style="opacity:.25"></div><aside class="drw" role="complementary" aria-labelledby="hh" style="width:480px"><div class="drh" style="padding:18px 22px 10px;display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eye">Change history</span><button type="button" class="ib" aria-label="Close history">✕</button></div><h2 id="hh" style="font-size:19px;font-weight:800">v4 · revision <span class="mo">[7]</span></h2><p class="foot">The last change of each section. Saved <span class="mo">[10 Nov 2026]</span>.</p></div>'
      + '<div class="drb" style="padding:0 22px 22px;display:flex;flex-direction:column;gap:12px;overflow:hidden"><ul class="ran-hist">' + J(SEC.map(histRow)) + '<li><div class="r1"><b>Positioning · one-liner</b>' + src('typed', 'Typed') + '</div><small class="mo">Last changed 9 Nov 2026, 11:20 · by ' + FN + '</small></li></ul>'
      + '<div class="ran-div">' + BE('Needs backend') + '<span>Earlier wordings</span></div><div class="ran-hx"><div class="r1"><b>Traction · before 10 Nov 2026, 16:40</b>' + src('typed', 'Typed') + '</div><p>“[$16,950] MRR in September across [12] paying teams.”</p><small>Written by [Co-founder name] · 3 Nov 2026, 09:40</small><button type="button" class="btn bsm" aria-disabled="true" style="align-self:flex-start">Undo the last fill</button></div></div></aside>';

    /* ---------- RAN26 · Empty ---------- */
    const empty = (t, s, a, b2) => '<section class="cd" style="padding:24px 26px;gap:10px;align-items:flex-start"><h2 style="font-size:17px;font-weight:800">' + t + '</h2><p style="font-size:13px;color:var(--mu);max-width:520px">' + s + '</p><div style="display:flex;gap:8px">' + a + (b2 || '') + '</div></section>';

    /* ---------- RAN27 · States ---------- */
    const skLb = () => '<div class="cd" aria-busy="true" style="gap:12px"><span class="raw">Announced: “Loading v4”</span><span class="sk" style="height:12px;width:24%"></span><span class="sk" style="height:22px;width:40%"></span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><span class="sk" style="height:58px"></span><span class="sk" style="height:58px"></span><span class="sk" style="height:58px"></span></div>' + J([62, 48, 70, 55, 40].map(w => '<div style="display:flex;gap:10px;align-items:center"><span class="sk" style="height:16px;width:16px"></span><span class="sk" style="height:11px;width:' + w + '%"></span></div>')) + '</div>';
    const err = (t, s, a) => '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>' + t + '</b><div>' + s + '</div></div>' + (a ? '<span class="bt"><button type="button" class="btn bsm">' + a + '</button></span>' : '') + '</div>';

    /* ---------- docs ---------- */
    const handoff = () => dk('<h1>Handoff · Investor narrative addendum (#6067)</h1><p>Continues Raise v2 (RA17) and the Investor narrative canvas (NAR1 to NAR21): these boards are RAN22 to RAN29, numbered from NAR22. Checked on main <code>6d7712c6d1</code> (the brief cites <code>45e7c55fa6</code>; nothing it relies on changed). Board 5 of the issue (Home without the Cycle layer) stays with #5081 and RA14 / RA17.</p>'
      + '<h2>Checked on main</h2>' + tbl(['What', 'Where', 'Found'], [
        ['Version read', '<code>GET /api/cycles/raise/narrative/:version</code> · <code>services/narrative/store.ts</code> <code>readNarrative</code>', 'Ten sections with body, audience note, source (kind, label, ref) and <code>updated_at</code>; meta with revision, start_from, based_on_version; positioning with <code>by</code> and <code>updated_at</code>. Each part can be unreadable on its own. No <code>created_at</code>, no <code>updated_by</code> per section, no <code>prior_value</code> returned.'],
        ['Read by', '<code>services/narrative/readers.ts</code>', 'Bindings on the current deck’s cards naming <code>narrative_version_meta:vN</code>.'],
        ['Deck from the narrative', '<code>routes/deck_narrative.ts</code>, <code>services/decks/narrativeBuild.ts</code>', 'Outline and build bind <code>MAX(version)</code>: always the newest. Build saves a version that is not current; 409 <code>quote_stale</code>, 422 <code>nothing_to_run</code>, 409 <code>build_in_flight</code>.'],
        ['Pitch studio entry', '<code>frontend/src/pages/raise/pitch/NewDeck.jsx</code>', 'Reads only <code>project_id</code> and <code>proposal</code> from the URL.'],
        ['Narrative pages', '<code>frontend/src/pages/raise/narrative/</code>', 'No copy, export, send, deck entry or history panel. Admin read is read-only (<code>readOnly={admin}</code>).'],
        ['Exports', '<code>routes/deck_exports.ts</code>', 'Per deck only; nothing exports a narrative. No narrative undo route (<code>fills.ts</code> undo is for rail fills).']])
      + '<div class="cols"><div><h2>Frontend only</h2><p>Copy text assembled from the version read (sections in order, Not recorded left out, options for audience notes, sources and the one-liner); the clipboard fallback that selects the text; the email intro as client-side text with placeholders, Copy and a <code>mailto:</code> Open in mail app; the Share menu and phone sheet; the History panel from <code>sections[].updated_at</code> and <code>source</code>; Build a deck on the newest version linking to <code>/raise/pitch/new?project_id=</code> with the outline’s price shown; the link to Share an update; admin Copy only.</p><h2>Preserved</h2><p>RA17’s header and Save version; NAR11 Start from; NAR12 Versions and Read by; NAR13 / NAR14 admin read and refusal; the Pitch studio’s own price confirm (Prepare, Review, Confirm). Nothing here sends, publishes or charges.</p></div>'
      + '<div><h2>Backend required (◇)</h2><p>Narrative export to PDF and DOCX with the watermark · an export log · the version’s created date on the read · build from a chosen version (<code>narrative_version</code> on outline and build) · update prefill as highlights · send from Axal · Eadwyn proposals for export selection and a shorter intro · section history read (earlier wordings, who wrote each) and Undo · the admin copy logged with its read reason.</p><h2>Open questions</h2><p>Highlights are the only place the update can take v4’s words: is that enough, or does the update need a body? Should Copy by the founder be logged too (drawn: no)?</p><h2>Owner (⚑, option A drawn)</h2><p>Admin with a logged reason: Copy only, logged with the reason. Watermark on every exported page. Older version: ◇ and offer the newest.</p><h2>Accessibility</h2><p>Lightbox and sheets are modal dialogs: focus moves to the title, is trapped and returns to the Share button. Format choices are a radiogroup; the checklist uses real checkboxes, with Not recorded rows disabled and named. “Copied 9 sections” is a polite status. ◇ and Not recorded carry a glyph and a word. Phone targets are 44px and the primary is pinned.</p></div></div>');

    /* ---------- route ---------- */
    let html = '';
    const PG = (body, o) => page(body, Object.assign({ cur: 'Investor narrative' }, o));
    const MOB = {
      RAN28a: () => phone('Investor narrative', '<button type="button" class="dd ran-vp" style="min-height:44px;width:100%">Version: <b>v4 · [Seed funds]</b> ▾</button><div><h1 style="font-size:22px;font-weight:800">Investor narrative</h1><p class="ran-mut" style="font-size:12px;margin-top:3px">revision <span class="mo">[7]</span> · saved <span class="mo">[10 Nov 2026]</span></p></div><div style="display:flex;gap:8px"><button type="button" class="btn" style="min-height:44px;flex:1">Share</button><button type="button" class="btn p" style="min-height:44px;flex:1">Save version</button></div>' + secCard(4),
        '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:8px"><h2 id="ms" style="font-size:17px;font-weight:800">Share v4</h2>' + J(['Copy text', 'Email intro', 'Investor update', 'Build a deck from v5', 'History'].map(t => '<button type="button" class="ran-row">' + t + '<i aria-hidden="true">›</i></button>')) + '</div></div>'),
      RAN28b: () => phone('Take v4 out', '<button type="button" class="dd ran-vp" style="min-height:44px;width:100%">Version: <b>v4 · [Seed funds]</b> ▾</button><div class="seg" role="radiogroup" aria-label="Format"><button type="button" role="radio" aria-checked="true">Copy text</button><button type="button" role="radio" aria-checked="false" aria-disabled="true">PDF</button><button type="button" role="radio" aria-checked="false" aria-disabled="true">DOCX</button></div><p class="foot" style="margin-top:-6px">PDF and DOCX ' + BE('Needs backend') + '</p>' + checklist(false).replace('ran-ck"', 'ran-ck ph"') + '<div class="ran-pin"><button type="button" class="btn p" style="min-height:48px;width:100%">Copy text · 9 sections</button></div>'),
      RAN28c: () => phone('Email intro', '<p class="ran-mut" style="font-size:12.5px">From v4 · One-liner, Problem, Traction, The ask</p>' + mail(true) + '<a href="#" style="font-size:13px;min-height:44px;display:flex;align-items:center">Make a link in Pitch deck share →</a><div class="ran-pin"><button type="button" class="btn p" style="min-height:48px;width:100%">Copy</button><button type="button" class="btn" style="min-height:44px;width:100%">Open in mail app</button></div>'),
      RAN28d: () => phone('History · v4', '<button type="button" class="dd ran-vp" style="min-height:44px;width:100%">Version: <b>v4 · [Seed funds]</b> ▾</button><p class="ran-mut" style="font-size:12.5px">revision <span class="mo">[7]</span> · last change of each section</p>' + J(SEC.slice(0, 6).map(s => '<div class="mc"><div class="r1"><b>' + s[0] + '</b>' + s[2] + '</div><small class="mo">' + (s[3] ? 'Last changed ' + s[3] : 'Not changed since this version was made') + '</small></div>')))
    };
    const STATES = {
      RAN27a: () => crop('<span class="eye">RAN27a · Loading · the tab bar is drawn at once</span>' + ntabs('Story') + skLb(), 760),
      RAN27b: () => crop('<span class="eye">RAN27b · Not recorded · never 0, never an empty line</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' + secCard(9) + '<div style="display:flex;flex-direction:column;gap:12px">' + readBy(5) + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Audience note · Traction</h2></div><span class="ran-nrec">' + SH.nd + 'Not recorded</span></section></div></div>', 900),
      RAN27c: () => crop('<span class="eye">RAN27c · Unreadable · each read fails on its own</span>' + err('This version could not be read right now.', 'The version list and Start from (NAR11) still work. Nothing was changed.', 'Try again') + err('The narrative versions could not be read.', 'The picker and Versions show Unavailable, not an empty list.', 'Try again') + err('Your investor narrative could not be read right now.', 'The deck outline could not read the narrative, so Build a deck waits. No price is shown and nothing was charged.', 'Try again') + '<p class="foot">Unavailable is a failed read: a red border, ✕ and a sentence. Not recorded is dotted and grey.</p>', 900),
      RAN27d: () => crop('<span class="eye">RAN27d · Refused and read-only</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><section class="cd" style="gap:8px;align-items:flex-start">' + st('Restricted', 'Refused') + '<b style="font-size:15px">The investor narrative is for the venture’s founders.</b><p class="ran-mut" style="font-size:12.5px">Investors, advisors, operating partners and explorers see NAR14’s panel. Nothing below it renders.</p></section>'
        + '<section class="cd" style="gap:8px;align-items:flex-start"><div class="nt" style="align-self:stretch"><span class="ic" aria-hidden="true">i</span><div><b>Read only · Admin, reason: [Quarterly portfolio review]</b><div class="mu">The founder sees this reason.</div></div></div><div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn p">Copy text</button><span class="foot">The copy is logged with the read reason ' + BE('Needs backend') + '</span></div><p style="font-size:12.5px">Only the venture’s founder builds or sends from the narrative.</p>' + FLAG('Admin may copy only: owner pick A') + '</section></div>', 1000),
      RAN27e: () => crop('<span class="eye">RAN27e · Copy failed · the clipboard is blocked</span><div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>The browser blocked copying.</b><div>The text is selected below. Press Ctrl+C (⌘C) to copy it by hand.</div></div></div><pre class="ran-mail sel" aria-label="v4 as plain text, selected">' + ONE + '\n\nProblem\n' + SEC[0][1] + '\n\nSolution\n' + SEC[1][1] + '\n\nWhy now\n' + SEC[2][1] + '\n…</pre>', 760),
      RAN27f: () => crop('<span class="eye">RAN27f · Build refused · nothing was charged</span><div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>The price changed, check it again.</b><div>The cards or your records changed since this quote, or it expired.</div></div><span class="bt"><button type="button" class="btn bsm">Refresh</button></span></div>' + err('Nothing to run.', 'No card of this deck can be built from your records yet. Each card in the outline says why.', '') + '<p class="foot">409 quote_stale and 422 nothing_to_run from <span class="mo">POST /api/decks/narrative/build</span>.</p>', 760)
    };
    const DOCS = {
      RAN30: () => handoff()
    };
    if (B === 'RAN22') html = PG(story(4) , { h: 1000, rail: null, overlay: exportBox(), h: 880 });
    else if (B === 'RAN22b') html = crop('<span class="eye">RAN22b · after Copy text, and after Eadwyn’s proposal is accepted</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="cd" style="gap:10px"><span class="stt ok" role="status" style="align-self:flex-start">' + SH.ok + 'Copied 9 sections</span><p style="font-size:12.5px">v4 · Problem to The ask, with the one-liner. Closing line was Not recorded and left out.</p></div><div class="cd" style="gap:10px">' + checklist(true) + '<p class="foot">Accepted: Competition left out. The button now reads Copy text · 8 sections.</p></div></div>', 1000);
    else if (B === 'RAN23') html = PG(story(4), { h: 1000, overlay: sendSheet() });
    else if (B === 'RAN24a') html = ran24a();
    else if (B === 'RAN24b') html = ran24b();
    else if (B === 'RAN25') html = PG(story(4), { h: 1000, overlay: histPanel() });
    else if (B === 'RAN26a') html = crop('<span class="eye">RAN26a · no saved version</span>' + empty('Nothing to export yet.', 'Save a version first. Copy, export, send and Build a deck all take a saved version.', '<button type="button" class="btn p">New version</button>'), 700);
    else if (B === 'RAN26b') html = crop('<span class="eye">RAN26b · every section Not recorded</span>' + empty('No words to copy in v2.', 'v2 · [Pre-seed funds] · saved [14 Oct 2026] · revision [1]. All ten sections are Not recorded.', '<button type="button" class="btn" aria-disabled="true">Copy text</button>', '<button type="button" class="btn p">Open Story</button>'), 700);
    else if (B === 'RAN26c') html = crop('<span class="eye">RAN26c · no change yet</span>' + empty('This version has not changed since it was made.', 'A version before its first save: revision [0]. Each section reads “Not changed since this version was made”.', '<button type="button" class="btn">Close history</button>'), 700);
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'RAN29') html = PG(story(4), { h: 1000, overlay: exportBox({ copied: true }), h: 880 });
    else if (DOCS[B]) html = DOCS[B]();
    else html = PG(story(4), { h: 1000, overlay: exportBox(), h: 880 });
    return { html: { __html: html } };
  }
}

</script>
