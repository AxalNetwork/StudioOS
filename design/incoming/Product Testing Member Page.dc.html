class Component extends DCLogic {
  renderVals() {
    const v = this.props.v || 'm1a';
    const dark = v === 'm5dk';
    const L = { bg: '#f4f3f7', card: '#ffffff', ink: '#18181b', body: '#3f3a47', mut: '#6b6577', line: '#ececf1', line2: '#e2dfe8', vio: '#7c3aed', vtx: '#6d28d9', lav: '#f4f0fe', lavE: '#ddd0fb', ambF: '#fef6d8', ambT: '#92400e', ambE: '#fcd34d', pos: '#047857', posT: '#ecfdf5', neg: '#b91c1c', negT: '#fef2f2', negE: '#fecaca', raised: '#faf9fc', skel: '#ececf1', dim: 'rgba(24,24,27,.32)' };
    const D = { bg: '#0b1220', card: '#111827', ink: '#e5e7eb', body: '#d1d5db', mut: '#9ca3af', line: '#374151', line2: '#4b5563', vio: '#7c3aed', vtx: '#a78bfa', lav: 'rgba(167,139,250,.14)', lavE: 'rgba(167,139,250,.38)', ambF: 'rgba(252,211,77,.14)', ambT: '#fcd34d', ambE: 'rgba(252,211,77,.4)', pos: '#34d399', posT: 'rgba(52,211,153,.12)', neg: '#f87171', negT: 'rgba(248,113,113,.12)', negE: 'rgba(248,113,113,.38)', raised: '#1f2937', skel: '#1f2937', dim: 'rgba(0,0,0,.55)' };

    const btn = (t, k, full) => { const s = k === 'p' ? `background:${T.vio};border:1px solid ${T.vio};color:#fff` : k === 'd' ? `background:${T.neg};border:1px solid ${T.neg};color:#fff` : k === 'dt' ? `background:transparent;border:1px solid transparent;color:${T.neg};padding:0 6px` : `background:${T.card};border:1px solid ${T.line2};color:${T.ink}`; return `<button type="button" style="min-height:${isPh ? 48 : 40}px;${full ? 'width:100%;' : ''}padding:0 14px;border-radius:9px;${SG};font-size:13.5px;font-weight:600;cursor:pointer;${s}">${t}</button>`; };

    const TS = {
      none: [pill('New', 'vio'), 'Become a Product tester', 'Try products before they launch and tell the team what works. Usually 1 to 3 hours a week.', btn('See what testers do', 'p')],
      applied: [pill('Waiting on Axal VC', 'wait'), 'Product tester', 'You applied on 17 Oct 2026. An Axal VC admin decides, and you’re told in Inbox.', btn('View my application', 's')],

      declined: [pill('Not approved', 'neg'), 'Product tester', 'Reason given: “[Not enough availability this quarter.]” You can apply again from 15 Jan 2027.', ''],
      removed: [pill('Removed', 'mut'), 'Product tester', 'You’re no longer in the tester pool. If you think this is wrong, open a ticket with Support.', btn('Open a ticket', 's')]
    };
    const tcard = (k) => k === 'load' ? card(`<div style="display:flex;justify-content:space-between">${eb('Product testing')}</div>${skel}`) : card(`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${eb('Product testing')}${TS[k][0]}</div><h3 style="margin:0;font-size:16px;font-weight:800;letter-spacing:-0.02em">${TS[k][1]}</h3>${p(TS[k][2])}${TS[k][3] ? `<div>${TS[k][3]}</div>` : ''}`);

    const PR = [['[Product Alpha]', '[Partner Firm A]', 'Try onboarding and tell us where you got stuck.', '1–15 Nov 2026', '6 of 20 left'], ['[Product Beta]', '[Partner Firm B]', 'Use the mobile app for a week and keep a short diary.', '4–25 Nov 2026', '3 of 10 left'], ['[Product Gamma]', 'Axal VC', 'Test the new data room with a real deck.', '10–24 Nov 2026', '12 of 15 left']];
    const selProg = v === 'm2b' || v === 'm5dk';
    const progRows = `<div role="table" aria-label="Open programmes"><div role="row" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 120px 104px 16px;gap:14px;padding:0 10px 8px">${['Product', 'What the test asks', 'Dates', 'Places'].map(h => `<span role="columnheader">${eb(h)}</span>`).join('')}<span></span></div>${PR.map((r, i) => `<div role="row" tabindex="0" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 120px 104px 16px;gap:14px;align-items:center;padding:12px 10px;border-top:1px solid ${T.line};cursor:pointer;${selProg && i === 0 ? `background:${T.lav};border-radius:10px` : ''}"><div role="cell" style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:700">${r[0]}</span><span style="font-size:12.5px;color:${T.mut}">${r[1]}</span></div><span role="cell" style="font-size:13px;line-height:1.45;color:${T.body}">${r[2]}</span><span role="cell" style="${MO};font-size:12.5px">${r[3]}</span><span role="cell" style="${MO};font-size:12.5px">${r[4]}</span><span aria-hidden="true" style="color:${T.mut}">›</span></div>`).join('')}</div>`;
    const progCard = (st) => card(h3('Open programmes', st === 'ok' ? count('1–3 of 3') : '') + (st === 'empty' ? p('No programmes are open right now. You’re told in Inbox when one opens.') : st === 'load' ? skel : st === 'err' ? err : progRows + p('Only active testers see this list. Places update as firms pick testers. No other tester’s name or email is ever shown.', T.mut)));

    const AP = [['[Product Alpha]', '[Partner Firm A]', 'Picked', 'pos', 'Testing 1–15 Nov 2026', 1], ['[Product Beta]', '[Partner Firm B]', 'Applied', 'wait', 'Waiting on [Partner Firm B] · decides by 31 Oct', 1], ['[Product Delta]', '[Partner Firm C]', 'Declined', 'mut', 'Not picked this time · 15 Oct 2026', 0], ['[Product Epsilon]', '[Partner Firm C]', 'Withdrawn', 'mut', 'Withdrawn for you by HQ · 12 Oct 2026', 0], ['[Product Zeta]', '[Partner Firm B]', 'Finished', 'vio', 'Closed 30 Sep 2026', 0]];
    const selApp = ['m3b', 'm3c', 'm3d'].includes(v) ? 1 : -1;
    const appRows = `<div role="table" aria-label="My applications">${AP.map((r, i) => `<div role="row" tabindex="0" style="display:grid;grid-template-columns:minmax(0,1.4fr) 104px minmax(0,2fr) 70px 16px;gap:12px;align-items:center;padding:12px 10px;border-top:1px solid ${T.line};cursor:pointer;${selApp === i ? `background:${T.lav};border-radius:10px` : ''}"><div role="cell" style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:700">${r[0]}</span><span style="font-size:12.5px;color:${T.mut}">${r[1]}</span></div><span role="cell">${pill(r[2], r[3])}</span><span role="cell" style="font-size:12.5px;line-height:1.45;color:${T.body}">${r[4]}</span><span role="cell">${r[5] ? `<a href="#" style="font-size:13px;font-weight:600;color:${T.neg}">Withdraw</a>` : ''}</span><span aria-hidden="true" style="color:${T.mut}">›</span></div>`).join('')}</div>`;
    const appsCard = (st) => card(h3('My applications', st === 'ok' ? count('1–5 of 5') : '') + (st === 'empty' ? p('You haven’t applied to a programme yet. Open programmes are listed above.') : st === 'load' ? skel : appRows));

    const studioHead = `<div style="display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em">Studio</h1><p style="margin:0;font-size:13.5px;color:${T.mut}">Where you work today: Eadwyn, your focus and what needs you.</p></div>`;
    const studio = (left, right) => studioHead + `<div style="display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">${left}</div><div style="display:flex;flex-direction:column;gap:14px">${right}</div></div>`;
    const ghostL = ghost('Eadwyn chat · drawn on its own canvas', 300) + ghost('Focus a section · drawn on its own canvas', 150);
    const ghostR = ghost('Needs you · drawn on its own canvas', 180);

    const inboxIco = `<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5l1.6-5.2A1 1 0 0 1 4.6 3.6h6.8a1 1 0 0 1 1 .7L14 9.5v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"></path><path d="M2 9.5h3.2l.8 1.6h4l.8-1.6H14"></path></svg>`;
    const SIDE = ['Studio', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'];
    const desk = (main, over, inbox) => `<div style="position:relative;width:1440px;height:960px;box-sizing:border-box;background:${T.bg};color:${T.ink};${SG};display:flex;flex-direction:column;overflow:hidden">
<header style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 20px;background:${T.card};border-bottom:1px solid ${T.line}"><div style="display:flex;align-items:center;gap:9px;width:200px"><img src="uploads/axal-logo-200x200.png" alt="" style="width:28px;height:28px;border-radius:7px;object-fit:contain;display:block"><span style="font-size:15px;font-weight:800;letter-spacing:-0.02em">Axal VC</span></div><div style="width:340px;min-height:38px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border:1px solid ${T.line2};border-radius:9px;color:${T.mut};font-size:13px;background:${T.bg}">Search Axal VC</div><div style="flex:1"></div><a href="#" aria-label="Inbox, 2 new"${inbox ? ' aria-current="page"' : ''} style="position:relative;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;${inbox ? `background:${T.lav};border:1px solid ${T.lavE};color:${T.vtx}` : `border:1px solid ${T.line2};color:${T.body}`}">${inboxIco}Inbox<span style="${MO};min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:${T.vio};color:#fff;font-size:11px;display:grid;place-items:center;box-sizing:border-box">2</span></a><span style="width:32px;height:32px;border-radius:999px;background:${T.lav};border:1px solid ${T.lavE};display:grid;place-items:center;font-size:11px;font-weight:800;color:${T.vtx};box-sizing:border-box">NA</span></header>
<div style="display:flex;flex:1;min-height:0"><nav aria-label="Main" style="width:220px;flex:none;box-sizing:border-box;background:${T.card};border-right:1px solid ${T.line};padding:14px 12px;display:flex;flex-direction:column;gap:2px">${SIDE.map(r => `<a href="#" style="display:flex;align-items:center;min-height:36px;padding:0 12px;border-radius:9px;font-size:13.5px;text-decoration:none;${r === 'Studio' && !inbox ? `background:${T.lav};color:${T.vtx};font-weight:700` : `color:${T.body};font-weight:500`}">${r}</a>`).join('')}</nav><main style="flex:1;min-width:0;box-sizing:border-box;padding:26px 30px;display:flex;flex-direction:column;gap:16px;overflow:hidden">${main}</main><aside aria-label="Eadwyn, collapsed" style="width:44px;flex:none;box-sizing:border-box;background:${T.card};border-left:1px solid ${T.line};display:flex;flex-direction:column;align-items:center;padding-top:14px"><img src="eadwyn-ai.png" alt="Eadwyn" style="width:28px;height:28px;border-radius:999px;object-fit:contain;background:#18181b;padding:2px;box-sizing:border-box;display:block"></aside></div>${over || ''}</div>`;
    const sheet = (ebT, title, body, foot) => `<div aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;right:44px;background:${T.dim};z-index:4"></div><aside role="dialog" aria-modal="true" aria-label="${title}" style="position:absolute;top:0;bottom:0;right:44px;width:560px;z-index:5;box-sizing:border-box;background:${T.card};border-left:1px solid ${T.line};border-radius:16px 0 0 16px;box-shadow:-24px 0 56px rgba(9,9,11,.2);display:flex;flex-direction:column"><div style="padding:18px 16px 14px 22px;border-bottom:1px solid ${T.line};display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div style="display:flex;flex-direction:column;gap:4px">${eb(ebT, T.vtx)}<h2 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em">${title}</h2></div><button type="button" aria-label="Close" style="width:40px;height:40px;border:none;background:transparent;color:${T.body};font-size:20px;cursor:pointer">×</button></div><div style="flex:1;min-height:0;overflow:hidden;padding:18px 22px;display:flex;flex-direction:column;gap:18px">${body}</div><div style="padding:14px 22px 18px;border-top:1px solid ${T.line};display:flex;align-items:center;gap:10px">${foot}</div></aside>`;
    const grow = (t) => `<span style="flex:1;font-size:12.5px;line-height:1.45;color:${T.mut}">${t}</span>`;
    const tiles = (L2) => `<div style="display:grid;grid-template-columns:repeat(${L2.length},minmax(0,1fr));gap:8px">${L2.map(([a, b]) => `<div style="border:1px solid ${T.line};border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px"><span style="font-size:12px;color:${T.mut}">${a}</span><span style="font-size:13.5px;font-weight:700">${b}</span></div>`).join('')}</div>`;
    const field = (l, ctl) => `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">${l}${ctl}</label>`;
    const box = (t, h) => `<div style="min-height:${h || 40}px;box-sizing:border-box;border:1px solid ${T.line2};border-radius:7px;padding:9px 12px;font-size:13px;font-weight:400;color:${T.mut};background:${T.card}">${t}</div>`;
    const chips = (L2, on) => `<div role="radiogroup" style="display:flex;gap:7px">${L2.map(c => `<span role="radio" aria-checked="${c === on}" style="display:inline-flex;align-items:center;min-height:${isPh ? 44 : 34}px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;box-sizing:border-box;${c === on ? `background:${T.lav};border:1px solid ${T.lavE};color:${T.vtx}` : `background:${T.card};border:1px solid ${T.line2};color:${T.body}`}">${c}</span>`).join('')}</div>`;
    const tick = `<span aria-hidden="true" style="width:16px;height:16px;flex:none;border-radius:4px;background:${T.vio};color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800">✓</span>`;

    const becomeBody = sec('What testers do', `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:${T.body}"><li>Try a product before it launches, usually 1 to 3 hours a week.</li><li>Answer a few questions and say what worked and what didn’t.</li><li>Firms pick testers from the pool for each programme. You choose which programmes to apply to.</li></ul>`) + sec('Who can apply', p('Any member with a profile can apply, Explorers included. Admin accounts can’t.')) + sec('Consent', `<div style="border:1px solid ${T.line};border-radius:10px;padding:12px 14px;background:${T.raised};display:flex;flex-direction:column;gap:8px">${p('I agree that the firm running a programme I join, and Axal VC, may email me about it, and that my answers go to that firm. I can withdraw from a programme, or leave the tester pool, at any time.')}<span style="${MO};font-size:11.5px;color:${T.mut}">Version [v2] · 1 Oct 2026</span></div><label style="display:flex;align-items:center;gap:8px;font-size:13px;min-height:32px">${tick}I agree to consent version [v2].</label>`) + field('Availability', box('[3 hours a week] ▾'));
    const becomeFoot = grow('An Axal VC admin decides. You’re told in Inbox.') + btn('Apply', 'p');
    const progBody = tiles([['Run by', '[Partner Firm A]'], ['Testing', '1–15 Nov 2026'], ['Places left', '6 of 20']]) + sec('What the test asks', p('Try onboarding in the first build and tell us where you got stuck. Plan for about 2 hours over the fortnight.')) + sec('Questions', field('What do you use today to onboard new users?', box('Write a few lines', 68)) + field('Which device will you test on?', box('[Laptop] ▾')) + `<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">How many hours can you give?${chips(['1', '2', '3 or more'], '2')}</div>`) + p('Your answers go to [Partner Firm A] only. Other testers can’t see them, and no one sees your email.', T.mut);
    const progFoot = grow('Applications close 31 Oct 2026.') + btn('Apply', 'p');
    const appBody = (k) => {
      const beta = k !== 'alpha';
      const st = k === 'done' ? pill('Withdrawn', 'mut') : beta ? pill('Applied', 'wait') : pill('Picked', 'pos');
      const line = k === 'done' ? 'You withdrew on 21 Oct 2026.' : beta ? 'Waiting on [Partner Firm B] · decides by 31 Oct 2026' : 'You’re testing 1–15 Nov 2026. [Partner Firm A] sends the build.';
      const note = k === 'done' ? `<div role="status" style="display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:${T.posT};color:${T.pos};font-size:13px;font-weight:600"><span aria-hidden="true">✓</span>You withdrew from [Product Beta]. [Partner Firm B] has been told.</div>` : '';
      return note + `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${st}<span style="font-size:13px;color:${T.body}">${line}</span></div>` + tiles(beta ? [['Run by', '[Partner Firm B]'], ['Testing', '4–25 Nov 2026'], ['Applied', '18 Oct 2026']] : [['Run by', '[Partner Firm A]'], ['Testing', '1–15 Nov 2026'], ['Picked', '20 Oct 2026']]) + sec('Your answers', `<div style="display:flex;flex-direction:column">${(beta ? [['Which phone do you use most?', '[Android]'], ['How many hours can you give?', '2'], ['Anything we should know?', '[Away 10–12 Nov]']] : [['What do you use today to onboard new users?', '[A checklist in a doc]'], ['Which device will you test on?', '[Laptop]'], ['How many hours can you give?', '2']]).map(([q, a]) => `<div style="display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid ${T.line}"><span style="font-size:12.5px;color:${T.mut}">${q}</span><span style="font-size:13.5px">${a}</span></div>`).join('')}</div>`) + p('Only [' + (beta ? 'Partner Firm B' : 'Partner Firm A') + '] sees your answers. No one sees your email.', T.mut);
    };
    const appFoot = (k) => k === 'confirm' ? `<div role="alertdialog" aria-label="Withdraw from [Product Beta]?" style="flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid ${T.negE};background:${T.negT}">${p('Withdraw from [Product Beta]? The firm is told; you can apply again while it is open.', T.ink, 'font-weight:600')}<div style="display:flex;justify-content:flex-end;gap:8px">${btn('Keep my place', 's')}${btn('Withdraw', 'd')}</div></div>` : k === 'done' ? grow('[Product Beta] is open until 31 Oct 2026.') + btn('Apply again', 'p') : btn('Withdraw', 'dt') + '<span style="flex:1"></span>' + btn('Close', 's');

    const MSG = [['Picked', 'pos', 'You were picked for [Product Alpha]', 'Testing runs 1–15 Nov 2026. [Partner Firm A] sends the build.', '2 h ago', 1], ['Applied', 'wait', 'You applied to [Product Beta]', '[Partner Firm B] decides by 31 Oct 2026.', 'Yesterday', 1], ['Tester status', 'vio', 'Your tester status is Active', 'You can apply to open programmes from Studio.', '17 Oct', 0], ['Declined', 'mut', '[Product Delta] didn’t pick you this time', 'You can apply to other open programmes.', '15 Oct', 0], ['Withdrawn', 'mut', 'HQ withdrew your application to [Product Epsilon]', 'You asked Support to withdraw it. [Partner Firm C] has been told.', '12 Oct', 0], ['Withdrawn', 'mut', 'You withdrew from [Product Eta]', '[Partner Firm A] has been told. You can apply again while it is open.', '9 Oct', 0], ['Programme closed', 'mut', '[Product Zeta] has closed', 'Thanks for testing. Your answers stay with [Partner Firm B].', '30 Sep', 0]];
    const inbox = (sel) => `<div style="display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em">Inbox</h1><p style="margin:0;font-size:13.5px;color:${T.mut}">Messages about your work on Axal VC.</p></div>${chips(['All', 'Product testing', 'Unread'], 'Product testing')}` + card(h3('Product testing', count('1–7 of 7')) + `<div role="list">${MSG.map((m, i) => `<div role="listitem" tabindex="0" style="display:grid;grid-template-columns:140px minmax(0,1fr) 84px 140px;gap:14px;align-items:center;padding:12px 10px;border-top:1px solid ${T.line};cursor:pointer;${sel && i === 0 ? `background:${T.lav};border-radius:10px` : ''}"><span>${pill(m[0], m[1])}</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:${i < 2 ? 800 : 600}">${m[2]}</span><span style="font-size:12.5px;color:${T.body}">${m[3]}</span></div><span style="${MO};font-size:12px;color:${T.mut}">${m[4]}</span><span style="display:flex;gap:14px;justify-content:flex-end"><a href="#" style="font-size:13px;font-weight:600;color:${T.vtx}">Open</a>${m[5] ? `<a href="#" style="font-size:13px;font-weight:600;color:${T.neg}">Withdraw</a>` : ''}</span></div>`).join('')}</div>`);

    const phTop = (title, back) => back ? `<div style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;padding:0 6px;background:${T.card};border-bottom:1px solid ${T.line}"><a href="#" style="display:inline-flex;align-items:center;min-height:44px;padding:0 10px;font-size:14px;font-weight:600;color:${T.vtx}">‹ ${back}</a></div>` : `<div style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 6px;background:${T.card};border-bottom:1px solid ${T.line}"><button type="button" aria-label="Menu" style="width:44px;height:44px;border:none;background:transparent;color:${T.ink};font-size:18px">☰</button><img src="uploads/axal-logo-200x200.png" alt="Axal VC" style="width:26px;height:26px;border-radius:6px;object-fit:contain;display:block"><span style="flex:1;padding-left:6px;font-size:16px;font-weight:800;letter-spacing:-0.02em">${title}</span><a href="#" aria-label="Inbox, 2 new" style="position:relative;width:44px;height:44px;display:grid;place-items:center;color:${T.body}">${inboxIco}<span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:999px;background:${T.vio}"></span></a></div>`;
    const phone = (inner) => `<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:${T.bg};color:${T.ink};${SG};display:flex;flex-direction:column;overflow:hidden">${inner}</div>`;
    const phCard = PR.map(r => `<a href="#" style="display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 6px 10px 14px;border-radius:12px;background:${T.card};border:1px solid ${T.line};text-decoration:none;color:${T.ink}"><span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:14px;font-weight:700">${r[0]}</span><span style="font-size:12.5px;color:${T.mut}">${r[1]}</span><span style="${MO};font-size:12px;color:${T.body}">${r[3]} · ${r[4]}</span></span><span aria-hidden="true" style="width:32px;text-align:center;color:${T.mut};font-size:16px">›</span></a>`).join('');
    const phApps = AP.slice(0, 3).map(r => `<a href="#" style="display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 6px 8px 14px;border-top:1px solid ${T.line};text-decoration:none;color:${T.ink}"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:13.5px;font-weight:700">${r[0]}</span><span style="font-size:12px;color:${T.body}">${r[4]}</span></span>${pill(r[2], r[3])}<span aria-hidden="true" style="width:24px;text-align:center;color:${T.mut}">›</span></a>`).join('');

    let html = '';
    if (v === 'm1a') html = desk(studio(ghostL, tcard('none') + ghostR));
    else if (v === 'm1b') html = desk(studio(ghostL, tcard('none') + ghostR), sheet('Product testing', 'Become a Product tester', becomeBody, becomeFoot));
    else if (v === 'm1c') html = desk(studioHead + `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">${[['Not applied', 'none'], ['Applied, waiting on Axal VC', 'applied'], ['Active', 'active'], ['Paused', 'paused'], ['Declined, with the reason given', 'declined'], ['Removed', 'removed']].map(([c, k]) => `<div style="display:flex;flex-direction:column;gap:6px">${eb(c)}${tcard(k)}</div>`).join('')}<div style="display:flex;flex-direction:column;gap:6px">${eb('Admin account')}${ghost('No card is drawn. Admin accounts can’t be Product testers.', 150)}</div></div>`);
    else if (v === 'm2a') html = desk(studio(progCard('ok') + ghost('Eadwyn chat · drawn on its own canvas', 240), tcard('active') + ghostR));
    else if (v === 'm2b' || v === 'm5dk') html = desk(studio(progCard('ok') + ghost('Eadwyn chat · drawn on its own canvas', 240), tcard('active') + ghostR), sheet('Open programme', '[Product Alpha]', progBody, progFoot));
    else if (v === 'm3a') html = desk(studio(appsCard('ok') + ghost('Eadwyn chat · drawn on its own canvas', 220), tcard('active') + ghostR));
    else if (v === 'm3b' || v === 'm3c' || v === 'm3d') { const k = v === 'm3b' ? 'open' : v === 'm3c' ? 'confirm' : 'done'; html = desk(studio(appsCard('ok') + ghost('Eadwyn chat · drawn on its own canvas', 220), tcard('active') + ghostR), sheet('My application', '[Product Beta]', appBody(k === 'done' ? 'done' : 'beta'), appFoot(k))); }
    else if (v === 'm4a') html = desk(inbox(false), '', true);
    else if (v === 'm4b') html = desk(inbox(true), sheet('My application', '[Product Alpha]', appBody('alpha'), appFoot('open')), true);
    else if (v === 'm5e') html = desk(studio(progCard('empty') + appsCard('empty'), tcard('active')));
    else if (v === 'm5l') html = desk(studio(progCard('load') + appsCard('load'), tcard('load')));
    else if (v === 'm5x') html = desk(studio(progCard('err') + appsCard('ok'), tcard('active')));
    else if (v === 'm5p1') html = phone(phTop('Studio') + `<div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${tcard('active')}<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;font-size:15px;font-weight:800;letter-spacing:-0.02em">Open programmes</h3>${count('3')}</div>${phCard}${card(h3('My applications', count('5')) + `<div style="margin:0 -6px">${phApps}</div>`, 'padding:14px 14px 4px')}</div>`);
    else if (v === 'm5p2') html = phone(phTop('', 'Studio') + `<div role="dialog" aria-label="[Product Alpha]" style="flex:1;min-height:0;display:flex;flex-direction:column;background:${T.card}"><div style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:column;gap:4px">${eb('Open programme', T.vtx)}<h2 style="margin:0;font-size:20px;font-weight:800;letter-spacing:-0.02em">[Product Alpha]</h2><span style="font-size:13px;color:${T.mut}">[Partner Firm A] · 1–15 Nov 2026 · 6 of 20 left</span></div>${sec('What the test asks', p('Try onboarding in the first build and tell us where you got stuck. About 2 hours over the fortnight.'))}${sec('Questions', field('What do you use today to onboard new users?', box('Write a few lines', 68)) + field('Which device will you test on?', box('[Laptop] ▾', 44)) + `<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">How many hours can you give?${chips(['1', '2', '3 or more'], '2')}</div>`)}${p('Your answers go to [Partner Firm A] only. No one sees your email.', T.mut)}</div><div style="padding:12px 16px 24px;border-top:1px solid ${T.line};display:flex;flex-direction:column;gap:6px">${btn('Apply', 'p', true)}<span style="font-size:12px;text-align:center;color:${T.mut}">Applications close 31 Oct 2026.</span></div></div>`);
    return { inner: { __html: html } };
  }
}
</script>
</body></html>
