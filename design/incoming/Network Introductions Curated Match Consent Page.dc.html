    const PIPE = (ms) => `<table class="tbl"><thead><tr><th scope="col">Match</th><th scope="col">Where it stands</th><th scope="col">You</th><th scope="col">Them</th><th scope="col">Made · outcome</th><th scope="col"><span class="sr">Open</span></th></tr></thead><tbody>
      ${J(ms.map((m) => `<tr><td><b>${m.n}</b><small>${m.w}</small></td><td>${PS(m.st, m)}</td><td>${SIDE(m.me)}</td><td>${SIDE(m.th)}</td><td>${m.st === 'made' ? `Made ${mo('2026-11-11')}<small>Outcome: — Not recorded</small>` : m.st === 'both' ? '<span class="s">— Not recorded</span><small>Both agreed is not Made</small>' : '<span class="s">○ Not applicable</span>'}</td><td><a class="btn t" href="#">Open</a></td></tr>`))}</tbody></table>`;
    const MATCHSEC = (o) => {
      o = o || {};
      return `<section class="cd" aria-labelledby="cm"><div class="ch"><h2 id="cm">Curated matches</h2><span class="sm">8 matches · 4 awaiting your decision</span></div>
      ${CREDLINE()}${PREFLINE}
      <div class="tools">${SEG()}<span style="margin-left:auto" class="acts"><button type="button" class="btn">Find new matches</button>${TO('Q2 · A, a separate search')}</span></div>
      <div class="g2">${mcard(M.ari, { cur: o.cur })}${mcard(M.jul)}${mcard(M.ada)}${mcard(M.tom)}</div>
      <div class="grh"><h3>Everything else · 4</h3><span class="foot">waiting, agreed, made and closed: no paid action</span></div>
      ${PIPE([M.hug, M.rhe, M.pri, M.len])}
      <div class="cf"><span class="foot">Accept uses 1 credit · Decline is free and sends nothing · opening this page, reading the balance or retrying a read creates no matches and no notifications ${TB('mutation-free list read · #7064')}</span></div></section>`;
    };
    const OTHERS = `<section class="cd nic-fold" aria-labelledby="ot"><div class="ch"><h2 id="ot">From your team · 5 &nbsp;·&nbsp; Your asks · 1</h2><span class="sm">unchanged · see NW3 on the approved investor canvas</span></div></section>`;
    const INTRO = (o) => `${HEAD({ tab: 'Introductions', h1: 'Introductions', sub: 'Requests between teammates, matches Axal curates for you, and the asks your tier allows. Three sources, never one count.' })}${OTHERS}${MATCHSEC(o)}`;

    /* ---------- the decision Sheet ---------- */
    const SHEET = (o) => {
      o = o || {};
      const m = o.m || M.ari;
      const ph = o.ph;
      const why = m.why ? `<ul class="nic-why">${J(m.why.map((w) => `<li>${w}</li>`))}</ul>` : `<p class="sub">${NR('the engine gave no reasons')}</p>`;
      const body = `${o.top || ''}<div class="nic-row">${o.ps || PS(m.st, m)}<span class="foot mo">${o.exl || 'expires ' + m.ex + ' · 7 days'}</span></div>
        <div class="sec"><h3>Who acts next</h3><p class="sub">${o.next || `<b>You.</b> [Ari] agreed on ${mo('2026-11-12')}. If you accept, you have both agreed.`}</p></div>
        <div class="sec"><h3>Recorded answers</h3>${CR(m)}<p class="foot">Each side’s own answer to this match, and when. Nothing about [Ari]’s scores or reasons is shown.</p></div>
        ${o.nowhy ? '' : `<div class="sec"><h3>Why Axal proposed this</h3>${why}</div>`}
        <div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Being in matching is not agreeing to this introduction.</b> Your matching preference lets Axal propose you. Accept is your agreement to meet ${m.s}, and ${m.s}’s is recorded separately.</div></div>
        ${o.cost !== undefined ? o.cost : `<div class="nic-cost"><div><span class="eye">Cost</span><b>Accept uses <span class="mo">1</span> credit</b><small>You have <span class="mo">3</span> (1 of this month’s 3 + 2 by referral). After: <span class="mo">2</span>.</small></div><div><span class="eye">Decline</span><b>Free</b><small>${m.s} is not notified.</small></div></div>`}
        ${o.extra || ''}`;
      const foot = o.foot !== undefined ? o.foot : `<span class="foot">Esc closes · focus returns to the card</span><div class="acts"><button type="button" class="btn">Decline · free</button><button type="button" class="btn p">Accept · 1 credit</button></div>`;
      if (ph) return body;
      return `<aside class="sheet-r nic-sheet" role="dialog" aria-modal="true" aria-labelledby="sh-${m.k}"><div class="dh"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:40px;height:40px;font-size:12px">${m.i}</span><div><span class="eye">Curated match</span><h2 id="sh-${m.k}">${m.n}</h2><p class="sub">${m.w}</p></div></div><button type="button" class="ib" aria-label="Close match">✕</button></div>
      <div class="dc" style="overflow:hidden">${body}</div><div class="df">${foot}</div></aside>`;
    };
    /* a sheet-shaped panel for state grids */
    const spanel = (tag, m, body, foot, w) => `<div class="panel" role="dialog" aria-labelledby="sp-${tag.length}-${m.k}" style="width:${w || 440}px"><div class="dh"><div style="display:flex;gap:10px;align-items:center"><span class="av">${m.i}</span><div><span class="eye">${tag}</span><h2 id="sp-${tag.length}-${m.k}">${m.n}</h2></div></div><button type="button" class="ib" aria-label="Close">✕</button></div><div class="dc">${body}</div><div class="df">${foot}</div></div>`;

    /* Eadwyn: a first-message draft once both agreed, cost quoted first */
    const RAIL_DRAFT = `<span class="eye">Suggested · both agreed</span>
      <div class="an"><b>[Rhea Moss] and you have both agreed.</b><span>Both answers are recorded (yours ${mo('2026-11-13')}, hers ${mo('2026-11-14')}). Made is not recorded yet.</span>
      <div class="cost"><span>Cost, quoted before drafting</span><b>[800] tokens</b></div>
      <div class="acts"><button type="button" class="btn">Draft a first message</button><button type="button" class="btn t">Not now</button></div>
      <span class="foot">Nothing is drafted until you choose.</span></div>
      <p class="foot">Eadwyn never accepts, declines, spends a credit, records Made or sends.</p>`;

    let html = '';

    /* ===== NW3-intro-match / eligible · page ===== */
    if (B === 'NIC01') html = shell('i', INTRO({}), { h: 1320, railT: 'Ask about introductions' });

    /* ===== NW3-intro-match / eligible · decision Sheet ===== */
    else if (B === 'NIC02') html = shell('i', INTRO({ cur: 1 }), { h: 1320, overlay: SHEET({}) });

    /* ===== NW3-intro-match / waiting · the seven consent states ===== */
    else if (B === 'NIC03') {
      const cell = (tag, m, nx, acts, extra) => `<section class="cd c3"><span class="tag">${tag}</span><div class="mh nic-mh2"><span class="av">${m.i}</span><div><b>${m.n}</b><small>${m.w}</small></div></div>${PS(m.st, m)}${CR(m)}<p class="sub"><b>Next:</b> ${nx}</p>${extra || ''}<div class="acts">${acts}</div></section>`;
      html = crop(1400, `${ANN('Investor [Morgan Vale]; the same words on every licence (NIC10)', 'Introductions › Curated matches, a card or its Sheet', 'Accept · 1 credit or Decline · free while it is open; otherwise Open', '<code>GET /api/introductions/propositions</code>: status, responded_at, counterpart_status, counterpart_responded_at, expires_at')}<div class="g">
      ${cell('Unanswered', M.jul, 'either of you can answer first.', `${DEC}${ACC()}`)}
      ${cell('Your agreement only', M.hug, 'waiting on [Hugo]. You have spent 1 credit; nothing else to do.', '<button type="button" class="btn t">Open</button>', `<p class="foot">Expires ${mo('2026-11-24')} if [Hugo] does not answer. ${TO('Q3 · A, the credit is not returned')}</p>`)}
      ${cell('Other agreement only', M.ari, 'you. Accepting makes it Both agreed.', `${DEC}${ACC()}`)}
      ${cell('Both agreed', M.rhe, 'both responses were received. Made is not recorded yet.', '<button type="button" class="btn">Record as made…</button>')}
      ${cell('Counterpart answer not recorded', M.ada, 'you. Axal curated this by hand, so no request was put to [Ada]: her answer is Not recorded, not “not answered”.', `${DEC}${ACC()}`)}
      ${cell('Closed after decline', M.len, 'nobody. A declined pair is not asked again, and no credit can be spent on it.', '<button type="button" class="btn t">Open</button>', `<p class="foot">Your own row on main is still pending: Accept would charge. ${TB('closed-pair check at charge time · #7064')}</p>`)}
      ${cell('Expired while the Sheet was open', { ...M.tom, st: 'expired', me: ['exp'], th: ['exp'] }, 'nobody. Accept is gone; the attempt at 14:03 used 0 credits (NIC04).', '<button type="button" class="btn t">Close</button>')}
      ${cell('Made, outcome separate', M.pri, 'record an outcome when there is one.', '<button type="button" class="btn">Add outcome…</button>', `<p class="foot">Made ${mo('2026-11-11')} was recorded by you. Outcome: ${NR()}</p>`)}</div>
      <p class="foot">${LBL('State words')} ○ Neither has answered · ! They agreed, your decision · ◷ You agreed, waiting · ✓✓ Both agreed · ● Made · ✕ Closed · ⌛ Expired · — Not recorded. Shape and word carry the state; colour only repeats it. Both agreed means both responses were received; only a separately recorded completion shows Made.</p>`);
    }

    /* ===== NW3-intro-match / closed · terminal pair and the stale attempt ===== */
    else if (B === 'NIC04') {
      const tomX = { ...M.tom, st: 'expired', me: ['exp'], th: ['exp'] };
      html = crop(1400, `${ANN('Investor [Morgan Vale]', 'The Sheet left open past 14:00, or opened from an old notification', 'Close; or Find new matches (a separate search)', 'accept answer (409 <code>already_responded</code> + status) and <code>GET /api/introductions/credits/history</code> for the spend check')}<div style="display:flex;gap:20px;align-items:flex-start">
      ${spanel('Expired while open · 14:03', tomX, `${PS('expired')}<div class="nt a" role="alert"><span class="ic" aria-hidden="true">⌛</span><div><b>Not accepted: this match expired at 14:00</b> while the Sheet was open. Accept is gone.</div></div>
        <div class="nic-rcpt"><span class="eye">Your credits</span><b><span class="mo">0</span> credits used by this attempt</b><small>Confirmed 14:03 from your credit history: no spend recorded for this match. Balance still <span class="mo">3</span>.</small></div>${CR(tomX)}`, `<span class="foot">Focus moved to the message</span><button type="button" class="btn p">Close</button>`)}
      ${spanel('Closed · the other side declined', M.len, `${PS('closed')}<div class="nt"><span class="ic" aria-hidden="true">✕</span><div><b>Closed.</b> [Lena] declined on ${mo('2026-11-08')}. A declined pair is not asked again, so there is nothing to accept.</div></div>${CR(M.len)}<p class="sub">Paid acceptance is hidden on a closed pair. Decline is not needed either.</p><p class="foot">${TB('refuse a charge when the pair is closed · #7064')}</p>`, `<span></span><button type="button" class="btn p">Close</button>`)}
      ${spanel('Stale attempt · checking', tomX, `${PS('expired')}<div class="nt"><span class="ic" aria-hidden="true">◷</span><div role="status"><b>Checking whether a credit was used…</b> Accept was refused because the match had closed. We are reading your credit history before saying anything about the balance.</div></div><span class="sk" style="width:70%;height:10px" aria-hidden="true"></span><p class="sub">Until the check finishes the balance reads <b>Provisional</b>, never a guessed number.</p>`, `<span></span><button type="button" class="btn" aria-disabled="true">Close</button>`)}</div>
      <p class="foot">${LBL('On main')} <code>POST …/accept</code> spends only while your own row is <code>pending</code>; a terminal row answers 409 <code>already_responded</code> with its status and spends nothing. It does not check <code>expires_at</code> (expiry is applied only by a list read) or the other side’s answer. ${TB('charge-time eligibility: own row, expiry, other side, both opt-ins · #7064')}</p>`);
    }

    /* ===== NW7 · balance recovery ===== */
    else if (B === 'NIC05') html = crop(1400, `${ANN('Any licence holding curated matches', 'Curated matches header; Sheet cost box', 'Refresh credits (a balance read only)', '<code>GET /api/introductions/credits</code>: allowance_remaining, referral_remaining, balance')}<div class="g">
      ${stcard('Value · read 13:48', 'Introduction credits', `${CREDLINE()}<p class="sub">Accept · 1 credit is on. The allowance is spent first, then referral credits.</p>`, 'c4')}
      ${stcard('Refreshing', 'Introduction credits', `<div class="line"><span><b class="mo">3</b> as of 13:48 <span class="nic-st">◷ Stale · 4 min</span></span><span class="foot" role="status">Reading your balance…</span></div><p class="sub">Accept waits for the new balance. Decline stays free and available.</p><div class="acts">${DEC}${ACC(1)}</div>`, 'c4')}
      ${stcard('Zero · read just now', 'Introduction credits', `<div class="line"><span>${CRED0}</span></div><p class="sub">No credits are available. December’s <b class="mo">3</b> arrive ${mo('2026-12-01')}; more come by referral.</p><div class="acts">${DEC}${ACC(1)}<a class="btn t" href="#">Referrals →</a></div><p class="foot">0 is a measured value here, read at 13:58.</p>`, 'c4')}
      ${stcard('Unknown · Not recorded', 'Introduction credits', `<div class="line"><span>Introduction credits</span>${NR('the reply had no balance')}</div><p class="sub">The read answered without a balance, so no number is drawn and Accept is off. Decline still works.</p><div class="acts">${DEC}${ACC(1)}<button type="button" class="btn t">↻ Refresh credits</button></div>`, 'c4')}
      ${stcard('Unavailable · the read failed', 'Introduction credits', `<div class="line" style="border-color:var(--negE);background:var(--negBg)"><span>Introduction credits</span>${UR()}</div><p class="sub">Your balance could not be read. This is not zero. Accept is off; Decline still works.</p><div class="acts">${DEC}${ACC(1)}<button type="button" class="btn">Retry</button></div>`, 'c4 bad')}
      ${stcard('After Accept · 1 credit', 'Introduction credits', `${CREDLINE({ c: CRED2, at: 'read 13:55' })}<p class="sub" role="status">You accepted [Ari Lane]. <b class="mo">1</b> credit used (this month’s allowance). You have both agreed.</p>`, 'c4')}</div>
      <p class="foot">${LBL('On main')} <code>GET /credits</code> exists and the investor page has a “Refresh credits” button, but it reloads <code>/propositions?refresh=1</code>, which can create matches. Frontend: call <code>api.introCredits()</code> instead. A deliberate search is “Find new matches” (NIC08).</p>`);

    /* ===== NW7 · lost response and safe retry ===== */
    else if (B === 'NIC06') html = crop(1400, `${ANN('Investor [Morgan Vale]', 'Accept · 1 credit in the Sheet', 'Check status: reads the match and the credit history, then offers the same action', '<code>POST …/accept</code> (spend key <code>intro:&lt;uid&gt;</code>), <code>GET …/credits/history</code>, a side-effect-free match read ◇')}<div class="g">
      ${stcard('1 · Sending', '[Ari Lane]', `<p class="sub" role="status">◷ Accepting… Do not close the Sheet.</p><span class="sk" style="width:70%;height:10px" aria-hidden="true"></span><div class="acts"><button type="button" class="btn" aria-disabled="true">Decline · free</button><button type="button" class="btn p" aria-disabled="true">Accepting…</button></div>`, 'c3')}
      ${stcard('2 · Response lost', '[Ari Lane]', `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>We could not confirm your answer.</b> The connection dropped. Your Accept may or may not have reached Axal. Check status never spends twice.</div></div><div class="line"><span>Credits</span><span class="nic-st">≈ Provisional · 3 before Accept</span></div><div class="acts"><button type="button" class="btn p">Check status</button></div>`, 'c3')}
      ${stcard('3a · It arrived', '[Ari Lane]', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>You accepted at 13:55.</b> <span class="mo">1</span> credit was used, once. You have both agreed.</div></div>${CREDLINE({ c: CRED2, at: 'read 13:56' })}<p class="foot">History shows one spend for this match.</p>`, 'c3')}
      ${stcard('3b · It did not arrive', '[Ari Lane]', `<div class="nt" role="status"><span class="ic" aria-hidden="true">○</span><div><b>Your answer did not arrive.</b> Nothing was spent; you still have <span class="mo">3</span>. The match is still open.</div></div><div class="acts">${DEC}<button type="button" class="btn p">Accept · 1 credit</button></div><p class="foot">The same action again. A repeat is refused by the server’s spend key, never charged twice.</p>`, 'c3')}
      ${stcard('Credits changed at the same moment', '[Ari Lane]', `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Your credits changed at the same moment.</b> Nothing was spent. Try again.</div></div><div class="acts"><button type="button" class="btn p">Try again</button></div><p class="foot">409 <code>credit_conflict</code>, <code>retryable: true</code>, <code>Retry-After: 1</code>.</p>`, 'c4')}
      ${stcard('Already answered elsewhere', '[Ari Lane]', `<div class="nt" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>You already accepted this match</b> (on your phone, 13:55). Nothing more was spent.</div></div>${PS('both')}<p class="foot">409 <code>already_responded</code>, status <code>accepted</code>: shown as the recorded answer, not an error.</p>`, 'c4')}
      ${stcard('Out of credits at send time', '[Ari Lane]', `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">0</span><div><b>No credits were available when you accepted.</b> Nothing was spent. Declining remains available.</div></div><div class="line"><span>${CRED0}</span></div><div class="acts">${DEC}<a class="btn t" href="#">Referrals →</a></div>`, 'c4')}</div>
      <p class="foot">${LBL('Safe retry')} On main the spend row is written only while your row is pending and only if no spend with key <code>intro:&lt;uid&gt;</code> exists, so a repeat cannot charge twice. Check status needs a match read with no side effects: today the list read can expire rows and create matches. ${TB('mutation-free match read · #7064')}</p>`);

    /* ===== NW5 · reads on the curated section ===== */
    else if (B === 'NIC07') html = crop(1400, `${ANN('Any licence', 'Introductions › Curated matches', 'Retry the read; Decline stays available on loaded matches', '<code>GET /api/introductions/propositions</code>; preference from <code>GET /api/settings/privacy</code>')}<div class="g">
      ${stcard('Loading', 'Curated matches', '<span class="sk" style="width:100%;height:12px" aria-hidden="true"></span><span class="sk" style="width:80%;height:12px" aria-hidden="true"></span><span class="sk" style="width:60%;height:12px" aria-hidden="true"></span><p class="foot" role="status">Loading matches…</p><p class="sub">No count is shown while loading.</p>', 'c3')}
      ${stcard('Verified empty', 'Curated matches', `<p class="sub"><b>No curated matches right now.</b> Read 13:48; your matching preference is On.</p><div class="acts"><button type="button" class="btn">Find new matches</button></div><p class="foot">Matches last 14 days and are proposed when someone else in matching fits.</p>`, 'c3')}
      ${stcard('Missing optional fields', '[Jules Avery]', `<dl class="rv"><dt>Headline</dt><dd>${NR()}</dd><dt>Country</dt><dd>${NR()}</dd><dt>Reasons</dt><dd>${NR()}</dd><dt>Private terms</dt><dd>${NR()}</dd></dl><p class="foot">The match still opens and can be answered.</p>`, 'c3')}
      ${stcard('Unavailable · records kept', 'Curated matches', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Matches could not be refreshed.</b> Showing 4 as of 13:48 <span class="nic-st">◷ Stale · 6 min</span></div></div><p class="sub">Decline is free and still works. Accept waits until matches and balance reload.</p><div class="acts">${DEC}${ACC(1)}<button type="button" class="btn">Retry</button></div>`, 'c3 bad')}
      ${stcard('Search for matches failed', 'Find new matches', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>We could not search for new matches just now.</b> This does not mean nobody fits. Your current matches are unchanged.</div></div><div class="acts"><button type="button" class="btn">Retry the search</button></div>`, 'c3 bad')}
      ${stcard('Eligibility not confirmed', 'Curated matches', `<div class="nt" role="status"><span class="ic" aria-hidden="true">?</span><div><b>Curated matches are unavailable right now.</b> We could not confirm whether matching can run for you. Your saved preference is unchanged.</div></div><div class="acts"><button type="button" class="btn">Retry</button></div><p class="foot">Generic on purpose: it never says why another member is or is not shown. ${TB('eligibility read · #7064')}</p>`, 'c3')}
      ${stcard('Access refused', 'A match from an old link', `<p>${RF()}</p><p class="sub">This introduction is not available to you. Nothing about it, or whether it exists, is shown.</p><div class="acts"><a class="btn t" href="#">Back to curated matches</a></div><p class="foot">On main: 404 <code>not_found</code> for another member’s match.</p>`, 'c3')}
      ${stcard('Unavailable · nothing loaded yet', 'Curated matches', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Matches could not be read.</b> Not zero, and not “none”. From your team and Your asks still show.</div></div><div class="acts"><button type="button" class="btn">Retry</button></div>`, 'c3 bad')}</div>`);

    /* ===== NW3-intro-match / preference and Find new matches ===== */
    else if (B === 'NIC08') html = crop(1400, `${ANN('Any licence; only the viewer’s own preference', 'Curated matches header → Settings › Sign-in and security', 'Change the preference in its existing setting; or Find new matches', '<code>user_settings.matching_opt_in</code> via <code>GET/PUT /api/settings/privacy</code> (default off, 60% profile to turn on)')}<div class="g">
      ${stcard('On', 'Your matching preference', `${PREFLINE}<p class="foot">Only your own preference is shown. Nobody else’s preference is ever displayed.</p>`, 'c4')}
      ${stcard('Off · the default', 'Your matching preference', `<div class="nic-pref"><span class="nic-off" aria-hidden="true">○</span><span><b>Your matching preference: Off.</b> Axal proposes no new matches to you or of you. Matches already open stay until answered or expired.</span><a href="#" class="btn t">Turn on in Settings →</a></div><p class="foot">Turning it on needs a profile at least 60% complete (yours: <span class="mo">48%</span>).</p>`, 'c4')}
      ${stcard('Preference unavailable', 'Your matching preference', `<div class="line" style="border-color:var(--negE);background:var(--negBg)"><span>Matching preference</span>${UR()}</div><p class="sub">It was not read, so it is not shown as Off. <a href="#">Open Settings →</a></p><div class="acts"><button type="button" class="btn">Retry</button></div>`, 'c4 bad')}
      <section class="cd c6"><span class="tag">Find new matches · confirm</span><div class="ch"><h2>Search for new curated matches?</h2></div><p class="sub">Axal looks for members who, like you, have matching on and fit your profile. Up to <b class="mo">5</b> new matches. It uses <b>no credit</b>.</p>
      <div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Each person found gets a card and a notification</b> with you as their match. That is why this is its own action: opening the page or refreshing credits never does it.</div></div>
      <div class="cf"><span class="foot">${TO('Q2 · A, member-started, up to 5')} ${TB('search endpoint · #7064')}</span><div class="acts"><button type="button" class="btn t">Cancel</button><button type="button" class="btn p">Search for matches</button></div></div></section>
      <section class="cd c6"><span class="tag">Find new matches · results</span><div class="ch"><h2>After the search</h2></div>
      <div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>2 new matches found</b> at 13:58. They are first in Awaiting your decision.</div></div>
      <div class="nt" role="status"><span class="ic" aria-hidden="true">○</span><div><b>No one new fits right now.</b> Searched 13:58 among members with matching on. Your open matches are unchanged.</div></div>
      <p class="foot">A reciprocal card needs both people’s current opt-in. On main the search checks only the other person’s. ${TB('mutual opt-in · #7064')}</p></section></div>`);

    /* ===== NW3-intro-match / terms · Made, outcome and private terms ===== */
    else if (B === 'NIC09') html = crop(1400, `${ANN('Partner and advisor record terms (as today); every role records Made and outcome ⚑', 'Sheet of a Both agreed or Made match', 'Record as made → Add outcome; Save terms', '<code>PUT /api/introductions/propositions/:uid/terms</code> → <code>intro_terms</code> (owner_user_id, kind, fee_bps, made_at, outcome)')}<div class="g">
      <section class="cd c4"><span class="tag">Both agreed · Made not recorded</span><div class="mh nic-mh2"><span class="av">RM</span><div><b>[Rhea Moss]</b><small>Founder, [Elm Studio]</small></div></div>${PS('both')}${CR(M.rhe)}
      <div class="nt"><span class="ic" aria-hidden="true">i</span><div>Both responses were received. That means the introduction <b>may</b> happen; it is Made only when someone records it.</div></div>
      <div class="f"><label for="md">Made on</label><span id="md" class="in hint">YYYY-MM-DD</span></div><div class="cf"><span class="foot">${TO('Q1 · A, every role records Made')}</span><button type="button" class="btn p">Record as made</button></div></section>
      <section class="cd c4"><span class="tag">Made · outcome separate</span><div class="mh nic-mh2"><span class="av">PN</span><div><b>[Priya Nair]</b><small>Head of partnerships, [Kelp Bio]</small></div></div>${PS('made')}
      <dl class="rv"><dt>Made</dt><dd>${mo('2026-11-11')} · recorded by you</dd><dt>Outcome</dt><dd>${NR()}</dd><dt>Kind</dt><dd>Favour · no economics</dd></dl>
      <div class="f"><label for="oc">Outcome (optional)</label><span id="oc" class="in ta hint">What came of it…</span><span class="cnt">0 / 2,000</span></div><div class="cf"><span class="foot">Only you can read this.</span><button type="button" class="btn">Save outcome</button></div></section>
      <section class="cd c4"><span class="tag">Eadwyn · after both agreed</span><div class="draft"><div class="cost"><span>Cost, quoted before drafting</span><b>[800] tokens · used</b></div><p class="tx">Hi Rhea, glad we both said yes. I’d like to hear how [Elm Studio] is thinking about its first studio partners. Would 30 minutes next week work?</p><div class="acts"><button type="button" class="btn">Accept into composer</button><button type="button" class="btn">Edit</button><button type="button" class="btn t">Discard</button></div><span class="foot">You review and send it yourself. Sending does not record Made.</span></div></section>
      <section class="cd c6"><span class="tag">Private terms · partner [Tom Becker]</span><div class="ch"><h2>Terms for [Tom Becker] ↔ [Jules Avery]</h2><span class="sm">only you can read these</span></div>
      <div class="seg" role="radiogroup" aria-label="Kind"><button type="button" role="radio" aria-checked="false">Favour</button><button type="button" role="radio" aria-checked="true">Referral fee</button></div>
      <div class="g2"><div class="f"><label for="fb">Fee (basis points)</label><span id="fb" class="in">250</span><span class="foot">= 2.5%</span></div><div class="f"><label for="ma">Made on</label><span id="ma" class="in">2026-11-12</span></div></div>
      <div class="f"><label for="ou">Outcome</label><span id="ou" class="in ta">Pilot scoping call booked for 2026-11-20.</span></div>
      <div class="cf"><span class="foot">[Jules] never sees your fee or outcome; theirs never shows here.</span><button type="button" class="btn p">Save terms</button></div></section>
      <section class="cd c6 bad"><span class="tag">Save failed · text kept</span><div class="ch"><h2>Terms for [Tom Becker] ↔ [Jules Avery]</h2></div>
      <div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Your terms were not saved.</b> Everything you entered is still here.</div></div>
      <div class="f"><label for="ou2">Outcome</label><span id="ou2" class="in ta">Pilot scoping call booked for 2026-11-20.</span></div><div class="f"><label for="fb2">Fee (basis points)</label><span id="fb2" class="in">250</span></div>
      <div class="cf"><span class="foot">Referral needs a fee between 1 and 10,000 bps.</span><button type="button" class="btn p">Save again</button></div></section></div>
      <p class="foot">${LBL('Not this record')} These are curated-match facts. A teammate introduction’s email delivery has its own evidence (NW3.5 on the approved canvas) and is never shown as Made here.</p>`);

    /* ===== NW3-intro-match / roles · one record, four licences ===== */
    else if (B === 'NIC10') {
      const col = (role, who, sw, m, me, st, nx, acts, extra) => `<section class="cd c3"><span class="tag">${role}</span><div class="ch"><h2>${who}</h2><span class="sm">${sw}</span></div><div class="mh nic-mh2"><span class="av">${m.i}</span><div><b>${m.n}</b><small>${m.w}</small></div></div>${st}${CR(m, me)}<p class="sub"><b>Next:</b> ${nx}</p>${extra || ''}<div class="acts">${acts}</div></section>`;
      const ariSide = { k: 'mv', i: 'MV', n: '[Morgan Vale]', s: '[Morgan]', w: 'Partner, [Harbor Lane Capital]', me: ['ok', '2026-11-12'], th: ['wait'] };
      const adaM = { k: 'jv', i: 'JA', n: '[Jules Avery]', s: '[Jules]', w: 'Founder, [Loomcraft]', me: ['ok', '2026-11-06'], th: ['ok', '2026-11-09'] };
      const tomM = { k: 'jv2', i: 'JA', n: '[Jules Avery]', s: '[Jules]', w: 'Founder, [Loomcraft]', me: ['ok', '2026-11-03'], th: ['ok', '2026-11-04'] };
      html = crop(1400, `${ANN('Founder, investor, advisor, partner', 'Each licence’s Network › Introductions', 'The action each state allows; terms only where the licence records them today', 'one route, one record per side; <code>stateOf</code> and <code>consentRecord</code> shared on main')}<div class="g">
      ${col('Founder', '[Ari Lane]', '[Tidepool Labs]', ariSide, 'You', `<span class="pl v nic-ps">◷ You agreed · waiting on [Morgan]</span>`, 'waiting on [Morgan]. You used 1 credit on 2026-11-12.', '<button type="button" class="btn t">Open</button>', '<p class="foot">No terms panel today on the founder desk.</p>')}
      ${col('Investor', '[Morgan Vale]', '[Harbor Lane Capital]', M.ari, 'You', PS('theirs', M.ari), 'you: Accept · 1 credit or Decline · free.', `${DEC}${ACC()}`, `<p class="foot">Made and outcome ${TO('Q1 · A')}</p>`)}
      ${col('Advisor', '[Ada Okafor]', 'Advisor', adaM, 'You', PS('both'), 'record it as made once you have met.', '<button type="button" class="btn">Record as made…</button>', '<p class="foot">Advisors answer matches; they cannot request one.</p>')}
      ${col('Partner', '[Tom Becker]', '[Northstar Capital]', tomM, 'You', `<span class="pl g nic-ps nic-made">● Made ${mo('2026-11-12')}</span>`, 'add the outcome when there is one.', '<button type="button" class="btn">Edit terms</button>', `<p class="foot">Referral fee · 2.5% · outcome “Pilot scoping call booked”. Private to [Tom].</p>`)}</div>
      <div class="nt"><span class="ic" aria-hidden="true">i</span><div>The founder and investor columns are the two sides of one pair: [Ari]’s “You agreed” is [Morgan]’s “[Ari] agreed”. The other side reads the same answer, never the other side’s terms, scores or reasons.</div></div>`);
    }

    /* ===== NW9 · tablet 768 ===== */
    else if (B === 'NIC11') html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ tab: 'Introductions', h1: 'Introductions', sub: 'Team requests, curated matches and your asks, counted apart.' })}
      <section class="cd"><div class="ch"><h2>Curated matches</h2><span class="sm">4 awaiting</span></div>${CREDLINE()}${SEG()}${mcard(M.ari, { cur: 1 })}${mcard(M.jul)}</section></main>
      <div class="dim" aria-hidden="true"></div>${SHEET({}).replace('class="sheet-r nic-sheet"', 'class="sheet-r nic-sheet" style="width:460px"')}</div>`;

    /* ===== NW8.1 · phone 390 ===== */
    else if (B === 'NIC12A') html = phone('Introductions', `${MSEL('Introductions')}<div class="ch"><h2>Curated matches</h2><span class="sm">4 awaiting</span></div><div class="line"><span><b class="mo">3</b> credits · 1 of 3 + 2 referral</span><button type="button" class="btn t" style="min-height:44px">↻ Refresh</button></div>
      <div class="seg" role="radiogroup" aria-label="Curated matches" style="align-self:flex-start"><button type="button" role="radio" aria-checked="true">Awaiting · 4</button><button type="button" role="radio" aria-checked="false">Waiting · 1</button><button type="button" role="radio" aria-checked="false">All · 8</button></div>
      ${J([M.ari, M.jul, M.ada].map((m) => `<div class="pc"><div class="r1"><div><b>${m.n}</b><br><small>${m.w}</small></div><button type="button" class="pi" aria-label="Open ${m.n}">›</button></div>${PS(m.st, m)}<small>You: ${m.me[0] === 'ok' ? 'agreed' : 'not answered'} · ${m.s}: ${m.th[0] === 'ok' ? 'agreed ' + m.th[1] : m.th[0] === 'nr' ? 'not asked' : 'not answered'} · expires ${m.ex}</small></div>`))}`, '<button type="button" class="btn">Find new matches</button>');
    else if (B === 'NIC12B') html = phone('[Ari Lane]', `<span class="eye">Curated match</span><h1 style="font-size:20px;font-weight:800">[Ari Lane]</h1><p class="sub">Founder, [Tidepool Labs] · Lisbon</p>${SHEET({ ph: 1, nowhy: 1, cost: `<div class="nic-cost"><div><span class="eye">Cost</span><b>Accept uses <span class="mo">1</span> credit</b><small>You have <span class="mo">3</span>. After: <span class="mo">2</span>.</small></div></div>` })}`, '<button type="button" class="btn">Decline · free</button><button type="button" class="btn p">Accept · 1 credit</button>', { back: 1 });
    else if (B === 'NIC12C') html = phone('[Ari Lane]', `<span class="eye">Curated match</span><h1 style="font-size:20px;font-weight:800">[Ari Lane]</h1>
      <div class="nt a" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>We could not confirm your answer.</b> Your Accept may or may not have reached Axal. Check status never spends twice.</div></div>
      <div class="line"><span>Credits</span><span class="nic-st">≈ Provisional · 3 before Accept</span></div>${CR(M.ari)}<p class="foot">Your note and place are kept while you check.</p>`, '<button type="button" class="btn p">Check status</button>', { back: 1 });
    else if (B === 'NIC12D') html = phone('[Tom Becker]', `<span class="eye">Curated match</span><h1 style="font-size:20px;font-weight:800">[Tom Becker]</h1>${PS('expired')}
      <div class="nt a" role="alert"><span class="ic" aria-hidden="true">⌛</span><div><b>Not accepted: this match expired at 14:00.</b></div></div>
      <div class="nic-rcpt"><span class="eye">Your credits</span><b><span class="mo">0</span> credits used by this attempt</b><small>Confirmed 14:03. Balance still <span class="mo">3</span>.</small></div>
      <div class="sec"><h3>Zero balance, on another match</h3><div class="line"><span><b class="mo">0</b> credits · read 13:58</span></div><p class="sub">Accept is off with this reason shown; Decline · free stays.</p></div>`, '<button type="button" class="btn p">Back to matches</button>', { back: 1 });

    /* ===== NW10 · dark ===== */
    else if (B === 'NIC13') html = shell('i', INTRO({}), { h: 1320, railT: 'Ask about introductions' });
    else if (B === 'NIC13B') html = shell('i', `${HEAD({ tab: 'Introductions', h1: 'Introductions', sub: 'Requests between teammates, matches Axal curates for you, and the asks your tier allows. Three sources, never one count.' })}${MATCHSEC({})}`, { h: 1480, rail: RAIL_DRAFT });

    /* ===== Accessibility ===== */
    else if (B === 'NIC14') {
      const kb = (n) => `<span class="nic-kb" aria-hidden="true">${n}</span>`;
      html = crop(1400, `<div class="g"><div class="c6" style="display:flex;flex-direction:column;gap:12px"><span class="tag">Keyboard order in the Sheet</span>
      <div class="panel" style="width:100%"><div class="dh"><div style="display:flex;gap:10px;align-items:center"><span class="av">AL</span><div><span class="eye">Curated match</span><h2>${kb(1)}[Ari Lane]</h2></div></div><button type="button" class="ib nic-fv" aria-label="Close match">✕</button>${kb(2)}</div>
      <div class="dc">${PS('theirs', M.ari)}${CR(M.ari)}<p class="sub">${kb(3)}<a href="#">Why Axal proposed this</a></p><p class="sub">${kb(4)}<a href="#">Change your matching preference in Settings →</a></p></div>
      <div class="df"><span class="foot">Esc closes</span><div class="acts">${kb(5)}<button type="button" class="btn">Decline · free</button>${kb(6)}<button type="button" class="btn p nic-fv">Accept · 1 credit</button></div></div></div>
      <p class="foot">Focus lands on the heading when the Sheet opens; Tab moves 1 → 6 and stays inside; Esc or ✕ returns focus to the card’s Open control. Visible focus: 2px violet ring, 2px offset, on both themes.</p></div>
      <div class="c6" style="display:flex;flex-direction:column;gap:12px"><span class="tag">Announced results (polite unless marked)</span>
      <table class="tbl"><thead><tr><th scope="col">After</th><th scope="col">Announcement</th></tr></thead><tbody>
      <tr><td>Accept</td><td>“Accepted [Ari Lane]. 1 credit used. You have both agreed. 2 credits left.”</td></tr>
      <tr><td>Decline</td><td>“Declined [Jules Avery]. No credit used. [Jules] is not notified.”</td></tr>
      <tr><td>Refresh credits</td><td>“3 credits available, read 13:48.” · or “Balance unavailable. Accept is off.”</td></tr>
      <tr><td>Lost response</td><td>Assertive: “We could not confirm your answer. Check status.”</td></tr>
      <tr><td>Check status</td><td>“You accepted at 13:55. 1 credit used once.” · or “Your answer did not arrive. Nothing was spent.”</td></tr>
      <tr><td>Expired while open</td><td>Assertive: “Not accepted. This match expired at 14:00. No credit used.”</td></tr>
      <tr><td>Find new matches</td><td>“2 new matches found.” · or “No one new fits right now.”</td></tr>
      <tr><td>Save terms failed</td><td>Assertive: “Your terms were not saved. Your entries are kept.”</td></tr></tbody></table>
      <ul class="nic-ul"><li>Phone targets 44 px; the paid and free actions sit in the sticky footer, Decline first.</li><li>Every state has a glyph and a word; “Accept · 1 credit” names its cost in the accessible name.</li><li>A disabled Accept keeps a visible reason next to it (zero, Unavailable, Not recorded, Stale).</li><li>Tables become cards on phone; the section select replaces the four links.</li></ul></div></div>`);
    }

    /* ===== Handoff ===== */
    else if (B === 'NICH') html = `<div class="${CV} doc"><div><span class="eye">Network · Introductions · #7064 · NW3-intro-match · handoff</span><h2 style="font-size:22px;margin-top:4px">Curated match consent, credits and private terms: what exists, what is frontend, what needs the Worker</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>routes/introductions.ts</code>: <code>GET /propositions</code> returns your <code>status</code>, <code>responded_at</code>, <code>expires_at</code>, the other side’s <code>counterpart_status</code> and date (null when there is no mirror row: not asked), and your own <code>terms</code> only. The same read <b>expires rows and, under 3 pending or with <code>?refresh=1</code>, generates up to 5 matches</b>.</li>
      <li><code>POST …/accept</code>: 402 <code>no_credits</code>, 409 <code>already_responded</code> (+ status), 409 <code>credit_conflict</code> (retryable, nothing spent). Spend key <code>intro:&lt;uid&gt;</code> makes a repeat safe. It checks only your own row is <code>pending</code>.</li>
      <li><code>POST …/decline</code>: free, no notification. <code>PUT …/terms</code>: your own row only (404 otherwise); favour or referral with <code>fee_bps</code> 1–10,000; <code>made_at</code>; outcome cut at 2,000.</li>
      <li><code>GET /credits</code> and <code>/credits/history</code> exist (history carries <code>source_ref</code>). Allowance spent first, then referral; investor free tier 3 a month; packs retired (D755).</li>
      <li><code>services/introductions.ts</code>: candidate read <code>LIMIT 500</code> with no order, then the other person’s opt-in filter, 14-day expiry, a reciprocal mirror row and a notification to the other person.</li>
      <li><code>services/matchingConsent.ts</code>: <code>matching_opt_in</code> defaults off and fails closed. <code>settings.ts</code> <code>GET/PUT /privacy</code>, 60% profile to turn on.</li>
      <li>Frontend: <code>IntroductionsPanel.jsx</code> (<code>stateOf</code>, <code>consentRecord</code>, TermsModal, partner), <code>advisor/network/IntroductionsZone.jsx</code> (MadeForm), <code>FounderNetworkDesk.jsx</code>, <code>InvestorNetworkWorkspace.jsx</code> (“Refresh credits” calls <code>/propositions?refresh=1</code>).</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>Shell, “Your network” header, four links, Sheet, NW5 state words, Eadwyn rail (#5130) from #4799 and #6256. NW3, NW7, NW8.1, NW9 and NW10 ids carry the NW3-intro-match variants.</li></ul>
      <h3 style="margin-top:12px">Frame index · role · entry · next · data</h3><ul>
      <li>NIC01/02 eligible: investor · Introductions › card · Accept · 1 credit / Decline · propositions + credits.</li><li>NIC03 waiting: all · card · per state · propositions. NIC04 closed: investor · open Sheet · Close · accept 409 + history.</li><li>NIC05/06 balance recovery: all · header, Sheet · Refresh credits, Check status · credits, history.</li><li>NIC07 reads, NIC08 preference: all · section · Retry, Settings, Find new matches · propositions, privacy.</li><li>NIC09 terms, NIC10 roles: partner, advisor, every role ⚑ · Sheet · Record as made, Save terms · terms PUT.</li><li>NIC11 tablet, NIC12 phone, NIC13 dark, NIC14 accessibility.</li></ul></div>
      <div><h3>Backend required (◇ #7064)</h3><ul>
      <li><b>Mutation-free reads.</b> A list read, a balance read and a retry create no matches, mirrors or notifications; expiry is computed, not written by the read.</li>
      <li><b>Mutual opt-in.</b> A reciprocal card needs both people’s current <code>matching_opt_in</code>; today only the other person’s is checked.</li>
      <li><b>Closed-pair eligibility at charge time.</b> Accept refuses with nothing spent when the match is past <code>expires_at</code>, the other side declined or expired, or either opt-in is off.</li>
      <li><b>Safe retries.</b> Keep the spend key; return <code>spent: 0|1</code> on 409 so the stale-attempt receipt need not read history.</li>
      <li><b>A separate search action</b> (today <code>?refresh=1</code> on the list read).</li>
      <li><b>Eligible results in a synthetic pool.</b> Fixtures of 101 and 500 candidates: with 101, every opted-in person is scored; with 500+ users the unordered <code>LIMIT 500</code> runs before the opt-in filter, so eligible people past row 500 are never considered. Assert the same eligible set either way.</li>
      <li>A generic eligibility read for “matching cannot run for you”.</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑)</h3><ul><li>Q1 A: every role may record Made and an outcome; fee fields stay with partners and advisors, as today.</li><li>Q2 A: Find new matches is member-started, up to 5 per search, never on page open.</li><li>Q3 A: a credit spent on a match that later expires unanswered is not returned.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Match card and decision Sheet with the cost beside Accept; the consent record; Refresh credits through <code>api.introCredits()</code>; balance Value / zero / Not recorded / Unavailable / Stale; Check status reading <code>/credits/history</code>; the stale-attempt receipt; hidden Accept on terminal pairs; roles over shared <code>stateOf</code>; tablet, phone, dark; focus return and announcements.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Whether a declined pair should show the other side’s “Declined” or a neutral “Closed” (drawn: “Closed · declined”, as main returns it).</li><li>Teammate email delivery stays on NW3.5; nothing here reads it.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nic-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
