.rsb-ss{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.rsb-ss h3{font:700 10.5px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.rsb-ss p{font-size:12px;line-height:1.5}
.rsb-skr{display:flex;flex-direction:column;gap:6px}
.rsb-skr i{display:block;height:12px;border-radius:5px;background:var(--skel)}
.rsb-ua{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--sg);color:var(--ink);border:1.5px dashed var(--hair2);border-radius:6px;padding:0 7px;background:var(--card)}
.rsb-rf{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--sg);color:var(--neg);border:1.5px solid var(--negE);border-radius:6px;padding:0 7px;background:var(--negBg)}
.rsb-none{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sg);color:var(--mu)}
.rsb-none:before{content:"∅";font-family:var(--mo);font-size:11px}
.rsb-sb{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;background:var(--card);border-top:1px solid var(--hair);display:flex;gap:8px}
.rsb-mc{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rsb-mc .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rsb-mc small{font-size:11.5px;color:var(--mu)}
.rsb-mc .mo{font-family:var(--mo);font-weight:600}
.rsb-tile.ph3{padding:9px 11px}
.rsb-tile.ph3 b{font-size:17px}
.rsb-toast{display:flex;gap:10px;align-items:center;border-radius:10px;background:var(--ink);color:var(--card);padding:10px 14px;font-size:12.5px;align-self:flex-start}
.rsb-toast a{color:#c4b5fd!important;font-weight:700}
.rsb-cost{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--amE);background:var(--amBg);color:var(--amT);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.45}
.rsb-pick{display:flex;gap:4px;flex-wrap:wrap}
.rsb-pick button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--hair2);background:var(--card);font:600 12.5px var(--sg);color:var(--ink)}
.rsb-pick button[aria-checked=true]{background:var(--lav);border-color:var(--lavE);color:var(--vt);font-weight:800}
.rsb-view{display:flex;gap:10px;align-items:center;padding:7px 12px;border:1px dashed var(--amD);background:var(--amBg);color:var(--amT);border-radius:9px;font:600 12px var(--sg)}
.rsb-ss .rsb-ua,.rsb-ss .rsb-rf,.rsb-ss .rsb-view,.rsb-ss .rsb-none,.rsb-ss .nr{align-self:flex-start}
.rsb-mc>.rsb-mk,.rsb-mc>.rsb-k{align-self:flex-start}
.rsb-tb td,.rsb-tb td b{color:var(--ink)}.rsb-tb td small,.rsb-tb td.rsb-trkc{color:var(--mu)}.cv{color:var(--ink)}
</style>
</helmet>
<div dangerouslySetInnerHTML="{{ html }}"></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "900px"}, "board": {"editor": "enum", "default": "RSB13", "options": ["RSB13", "RSB13B", "RSB13C", "RSB13D", "RSB14", "RSB14B", "RSB15", "RSB15B", "RSB16", "RSB17", "RSB17B", "RSB18A", "RSB18B", "RSB19", "RSB20", "RSB20B", "RSB22", "RSB22B", "RSB21A", "RSB21B", "RSB21C", "RSB21D", "RSB21E", "RSB21F", "RSBA", "RSBH"]}}'>
class Component extends DCLogic {
  renderVals() {

    const P = dark

      : { bg: '#f4f3f7', card: '#ffffff', raised: '#f8f7fb', ink: '#18181b', mu: '#6b6577', hair: '#ececf1', hair2: '#d6d3df', vi: '#7c3aed', vt: '#6d28d9', lav: '#f4f0fe', lavE: '#ddd2fb', pos: '#047857', posBg: '#ecfdf5', posE: '#a7f3d0', neg: '#b91c1c', negBg: '#fef2f2', negE: '#fecaca', amT: '#92400e', amBg: '#fffbeb', amE: '#fcd34d', amD: '#d97706', dim: 'rgba(24,24,27,.42)', skel: '#ececf1' };
    const VARS = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');

    const bell = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

    const SH = {
      ok: SV('<path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2"/>'),

      dm: SV('<path d="M6 1l5 5-5 5-5-5z" fill="currentColor"/>'),

    const S = {

      'Partly indexed': ['xar', 'half'], 'Partly answerable': ['xar', 'half'], Withdrawn: ['ni', 'us'], 'Consent recorded': ['ok', 'ok']
    };
    const st = (s, label) => { const x = S[s] || ['', 'nd']; return '<span class="stt ' + x[0] + '">' + SH[x[1]] + (label || s) + '</span>'; };
    const KC = '<span class="rsb-k cp">' + SH.dm + 'Comparison</span>';
    const KT = '<span class="rsb-k tk">' + SH.dmo + 'Tracked</span>';
    const TS = { Active: ['act', '●'], Parked: ['prk', 'Ⅱ'], Retired: ['ret', '✕'] };
    const ts = (s) => '<span class="rsb-ts ' + TS[s][0] + '"><span aria-hidden="true">' + TS[s][1] + '</span>' + s + '</span>';
    const MATCH = '<span class="rsb-mk"><span aria-hidden="true">✓</span>Matches your thesis sectors</span>';
    const ANTI = '<span class="rsb-mk anti"><span aria-hidden="true">⊘</span>In your anti-thesis</span>';

    /* ---------- investor shell (de.js, #3704) + Eadwyn rail (#5130) ---------- */

    const sideNav = (cur, zones, navCur) => '<aside class="dsd"><div class="lg" style="padding:4px 16px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px"><span class="logo" aria-hidden="true"></span>Axal VC</div><button type="button" class="co" aria-label="Company or project: [Northlake Capital]"><i class="rsb-ind" aria-hidden="true"></i>[Northlake Capital]<span>▾</span></button><nav aria-label="Workspace">'

    const railO = (title, body) => '<aside class="sp eadx" aria-label="Eadwyn" style="width:320px!important"><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--hair)"><span style="display:flex;gap:8px;align-items:center"><span style="display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#7c3aed;color:#fff;font-weight:800;font-size:12px">E</span><b style="font-size:13.5px">Eadwyn</b></span><button type="button" class="ib" aria-label="Collapse Eadwyn" aria-expanded="true">›</button></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1"><span class="eye">' + title + '</span>' + body + '</div><div style="padding:12px 16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:6px"><div class="inp" style="min-width:0;min-height:38px">Ask about this page…</div><button type="button" class="disc2" aria-expanded="false">Models and usage ▾</button></div></aside>';

    const fld = (label, v, o) => { o = o || {}; return '<div class="rsb-fld"' + (o.span ? ' style="grid-column:1/-1"' : '') + '><label>' + label + (o.req ? ' <span class="mu">(required)</span>' : '') + '</label><div class="rsb-in' + (o.ta ? ' ta' : '') + (o.err ? ' err' : '') + (o.ph ? ' ph2' : '') + '">' + v + '</div>' + (o.note ? '<em>' + o.note + '</em>' : '') + '</div>'; };

    /* ---------- sample data: one benchmark list, the same on every board ---------- */
    // [metric, ours, peer, source, n, asof, reading, created, uid]
    const BM = [
      ['Seed pre-money valuation', '$12.0M', '$10.5M median', '[Peer dataset A] · EU seed rounds', 42, 'Sep 2026', 'Above the median; this round has a named lead, most of the set did not.', '12 Nov 2026'],

    const bmRow = (r, i, sel) => {

    const bench = (o) => { o = o || {}; return hdr('<a href="#">Research</a>/<b>Benchmarking</b>', 'Benchmarking', 'Check a number against a peer set you can name', 'New benchmark')

    /* ---------- RSB13B New benchmark sheet ---------- */
    const newSheet = () => '<div class="rsb-dim"></div><div class="rsb-drw" role="dialog" aria-modal="true" aria-labelledby="nbh"><div class="mdh" style="border-bottom:1px solid var(--hair)"><div><h2 id="nbh">New benchmark</h2><p class="raw" style="margin-top:4px">Saved to your list only. Nothing is shared.</p></div><button type="button" class="ib" aria-label="Close">✕</button></div><div class="mdb" style="padding-top:14px;flex:1"><div class="rsb-fg">'
      + fld('Metric', 'Seed pre-money valuation, DACH', { req: true, span: true })

      + fld('Peer value', '$9.8M median', {})

    /* ---------- RSB13C row menu and delete (Scope → Review → Result) ---------- */

ths</h2><p>Benchmark row → detail → Back keeps filters (under Q1 B, back to the deal). Sector or country → Ask with a question naming it. A thesis’s deals → Deals filtered by thesis (◇).</p></div></div>'
