      ['Product testing', 'Product', 'Members test each other’s products', 'partly_built', 'Not running', 'Not open', 'Not offered', '—', '—']
    ];
    const CUSTOM = ['Climate founders circle', 'Custom · Ventures', 'Monthly circle for climate founders, run by Nordic Studio', 'proposed', 'Not running', 'Not open', 'Not offered', '—', '—'];
    const build = (k) => '<span class="dim5"><b><i class="' + DOT[k][0] + '" aria-hidden="true"></i>' + DOT[k][1] + '</b></span>';
    const catRow = (p) => '<div class="row" role="row"><div role="cell"><b>' + p[0] + '</b><small>' + p[2] + '</small></div><div role="cell">' + build(p[3]) + '<small>' + p[4] + '</small></div><div role="cell" style="font-size:12.5px">' + p[5] + '</div><div role="cell" style="font-size:12.5px">' + p[6] + '</div><div role="cell" style="font-size:12.5px">' + p[7] + '</div><div role="cell" style="font-size:12.5px;font-weight:600">' + p[8] + '</div><div role="cell" style="text-align:right"><a class="btn bsm" href="#" aria-label="Open ' + p[0] + '">Open</a></div></div>';
    const GROUPS = ['Ventures', 'Access', 'Network & referrals', 'Rewards', 'Learning', 'Product'];
    const catalogue = (grouped) => '<section style="display:flex;flex-direction:column;gap:10px" aria-labelledby="cth"><div class="ch"><h2 id="cth" style="font-size:15px;font-weight:800">Catalogue</h2><div class="tools"><div class="chips" role="radiogroup" aria-label="Category">' + J(['All', ...GROUPS].map(g => '<button type="button" role="radio" aria-checked="' + (g === 'All') + '">' + g + '</button>')) + '</div>' + seg('Catalogue layout', ['Rows', 'Cards'], 'Rows') + '</div></div>'
      + '<div class="cat" role="table" aria-label="Programmes"><div class="hrow" role="row"><span role="columnheader">Programme</span><span role="columnheader">Build · state</span><span role="columnheader">Member access</span><span role="columnheader">Studio offering</span><span role="columnheader">Existing grants</span><span role="columnheader">Activity · 12 wk</span><span></span></div>'
      + J(GROUPS.map(g => '<div class="gh" role="row"><span role="rowheader">' + g + '</span></div>' + J(PR.filter(p => p[1] === g).map(catRow)) + (g === 'Ventures' ? catRow(CUSTOM).replace('<b>Climate', '<b><span class="ptag" style="margin-right:6px">Custom</span>Climate') : ''))) + '</div></section>';
    const proposals = () => '<section class="cd" style="flex-direction:row;align-items:center;gap:18px"><div style="flex:1"><h2 style="font-size:15px;font-weight:800">Proposals</h2><p style="font-size:12.5px;color:var(--mu)">From studios, waiting for an HQ decision</p></div><div class="frac"><b>1</b><small>awaiting review</small></div><div class="frac"><b>3 days</b><small>oldest</small></div><div class="frac"><b style="font-family:var(--sg);font-size:13.5px">Nordic Studio</b><small>latest studio</small></div><a class="btn p" href="#">Open proposals</a></section>';
    const overview = () => head() + strip() + '<div class="g"><div style="grid-column:span 7">' + attention() + '</div><div style="grid-column:span 5">' + proposals().replace('flex-direction:row;align-items:center;gap:18px', 'gap:10px').replace('<div style="flex:1">', '<div>') + '</div></div>' + activity() + catalogue();

    /* ---------- card system ---------- */
    const pcard = (p, lead, extra) => '<article class="pcard2' + (extra === 'custom' ? ' custom' : '') + '"><div class="top"><div><span class="cat2">' + p[1] + '</span><h3>' + p[0] + '</h3></div><a class="btn bsm" href="#">Open</a></div><p style="font-size:12.5px;color:var(--mu)">' + p[2] + '</p><div class="lead">' + lead + '</div><dl><dt>Build</dt><dd>' + DOT[p[3]][1] + '</dd><dt>Members</dt><dd>' + p[5] + '</dd><dt>Studios</dt><dd>' + p[6] + '</dd><dt>Grants</dt><dd>' + p[7] + '</dd></dl><div class="f"><span class="raw">12 wk</span><b style="font-size:12.5px">' + p[8] + '</b></div></article>';
    const CARDS = [
      ['Proposed', ['Climate founders circle', 'Custom · Ventures', 'Approved from a studio proposal; not built yet', 'proposed', '', 'Not open', 'Not offered', '—', '—'], '<i class="dot-pr" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Proposed — next: write the playbook', 'custom'],
      ['Not built', PR[3], '<i class="dot-no" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Not built'],
      ['Partly built', PR[9], '<i class="dot-pt" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Partly built — 2 sections empty'],
      ['Operational', PR[6], '<i class="dot-ok" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Operational'],
      ['Paused', PR[7], '<i class="dot-pa" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Paused since 28 Oct'],
      ['HQ only', PR[8], '<i class="dot-ok" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Operational · HQ only'],
      ['Offered to studios, none granted', PR[4], '<i class="dot-ok" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Operational · offered, 0 granted'],
      ['Granted to studios', PR[2], '<i class="dot-ok" style="width:10px;height:10px;border-radius:3px;display:inline-block"></i>Operational · granted to 2']
    ];
    const cards = () => crop('<span class="eye">Programme card system · one layout for built-in and custom programmes · the lead line carries the most important state, the rest are labelled rows, not badges</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">' + J(CARDS.map(c => '<div style="display:flex;flex-direction:column;gap:6px"><span class="raw">' + c[0] + '</span>' + pcard(c[1], c[2], c[3]) + '</div>')) + '</div>', 1400);
    const dims = () => crop('<span class="eye">Five separate dimensions · never merged into one badge</span><table class="dt" style="background:var(--card)"><thead><tr><th>Dimension</th><th>Values</th><th>Stored today</th></tr></thead><tbody>'
      + '<tr><td>Build readiness</td><td>Proposed · Not built · Partly built · Live</td><td><code>programs.status</code></td></tr>'
      + '<tr><td>Operational state</td><td>Operational · Not running · Paused</td><td>Derived: Live → Operational; <code>paused</code> status</td></tr>'
      + '<tr><td>Member access</td><td>Open to all · Apply · Request · By invite · Not open yet · Closed</td><td><code>join_method</code> + playbook; “Not open yet” needs a field</td></tr>'
      + '<tr><td>Studio offering policy</td><td>HQ only · Offered · Not offered</td><td><code>PUT /:key/grantable</code></td></tr>'
      + '<tr><td>Existing studio grants</td><td>Granted to N studios · paused · ended</td><td><code>program grants</code> (granted / paused / ended)</td></tr></tbody></table>', 1100);

    /* ---------- detail shell ---------- */
    const dtabs = (mods, cur) => '<nav class="ptabs" aria-label="Programme">' + J(['Overview', 'Playbook', 'Availability & grants', 'Participation', ...mods, 'History', 'Settings'].map(t => '<a href="#"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + (t === 'Perk queue' ? ' <span>12</span>' : '') + '</a>')) + '</nav>';
    const detail = (custom) => { const p = custom ? CUSTOM : PR[6]; return '<div class="crumb" style="font:600 12px var(--sg);color:var(--mu)"><a href="#" style="color:var(--mu)">Programs</a> / <b style="color:var(--ink)">' + p[0] + '</b></div>'
      + '<header class="pgh"><div><span class="eye">' + p[1] + '</span><h1>' + p[0] + '</h1><p>' + p[2] + '</p></div><div class="ctl">' + (custom ? '<button type="button" class="btn">Edit playbook</button><button type="button" class="btn p">Mark as partly built</button>' : '<button type="button" class="btn">Export</button><a class="btn p" href="#">Review perk queue</a>') + '</div></header>'
      + dtabs(custom ? [] : ['Perk queue'], 'Overview')
      + '<div class="strip" style="grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card)">' + J([['Build', DOT[p[3]][1]], ['Operational', p[4]], ['Member access', p[5]], ['Studio offering', p[6]], ['Existing grants', p[7]]].map(d => '<div><small>' + d[0] + '</small><b style="font-size:14px;font-family:var(--sg)">' + d[1] + '</b></div>')) + '</div>'
      + (custom
        ? '<div class="g"><section class="cd" style="grid-column:span 7"><div class="ch"><h2>Playbook</h2><span class="sm">2 of 6 drafted · 0 published</span></div><ul class="rz">' + J(['Purpose', 'Who it’s for', 'How to join', 'Rewards and economics', 'HQ obligations', 'Templates'].map((s, i) => '<li><b>' + s + '</b><small>' + (i < 2 ? 'Copied from the approved proposal' : 'Empty') + '</small>' + (i < 2 ? st('Ready', 'Draft from proposal') : st('Empty', 'Empty')) + '</li>')) + '</ul></section>'
          + '<section class="cd" style="grid-column:span 5"><div class="ch"><h2>Capability modules</h2></div><p style="font-size:12.5px;color:var(--mu)">None yet. This programme works with the core sections alone.</p><div class="mods">' + J(['Applications', 'Hosts', 'Referral queue', 'Perk queue', 'Cohorts', 'Learners', 'Offers', 'NDA / signature'].map(m => '<span class="off">+ ' + m + '</span>')) + '</div><span class="ptag" style="align-self:flex-start">◇ Proposed — modules need registry support</span></section>'
          + '<section class="cd" style="grid-column:span 12"><div class="ch"><h2>Participation</h2></div><div class="nt"><span class="ic" aria-hidden="true">0</span><div><b>No one has joined yet.</b><div class="mu">Members can’t join until the programme is live and open.</div></div></div></section></div>'
        : '<div class="g"><section class="cd" style="grid-column:span 7"><div class="ch"><h2>Perk queue</h2>' + st('Overdue', '12 waiting · oldest 9 days') + '</div><table class="tbl"><thead><tr><th>Listing</th><th>Studio</th><th>Waiting</th><th></th></tr></thead><tbody>' + J([['Cloud credits — 6 months', 'Nordic Studio', '9 days'], ['Legal templates bundle', 'HQ', '7 days'], ['Design tool seats', 'Lisbon Studio', '6 days']].map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td class="mo">' + r[2] + '</td><td style="text-align:right"><button type="button" class="btn bsm">Review</button></td></tr>')) + '</tbody></table><p class="foot">+ 9 more · oldest first</p></section>'
          + '<section class="cd" style="grid-column:span 5"><div class="ch"><h2>Availability & grants</h2></div><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Studio offering</dt><dd>Offered to all studios</dd><dt>Granted</dt><dd>3 studios · 0 paused</dd><dt>Last change</dt><dd>2 Nov · granted to Lisbon Studio</dd></dl><a class="btn t bsm" href="#" style="align-self:flex-start">Manage grants →</a></section>'
          + '<section class="cd" style="grid-column:span 12"><div class="ch"><h2>Capability modules</h2></div><div class="mods"><span>✓ Perk queue</span><span class="off">+ Offers</span></div></section></div>'); };

    /* ---------- proposals workspace ---------- */
    const PROPS = [['Climate founders circle', 'Nordic Studio', 'Sent 4 Nov · 3 days', 'Waiting', 'Revision 2'], ['Studio office hours', 'Lisbon Studio', 'Decided 21 Oct', 'Approved', 'Revision 1'], ['Hardware lab access', 'Nordic Studio', 'Sent back 12 Oct', 'Waiting', 'Revision 1']];
    const propWs = (drawer) => head('Proposals') + '<div class="tools"><div class="inp">⌕ Search proposals</div><div class="chips" role="radiogroup" aria-label="Status"><button type="button" role="radio" aria-checked="true">Waiting for HQ<span>1</span></button><button type="button" role="radio" aria-checked="false">Sent back<span>1</span></button><button type="button" role="radio" aria-checked="false">Approved<span>1</span></button><button type="button" role="radio" aria-checked="false">Declined<span>0</span></button></div><button type="button" class="dd">Studio ▾</button><button type="button" class="dd">Oldest first ▾</button></div>'
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><table class="etb"><thead><tr><th>Proposal</th><th>Studio</th><th>Submitted</th><th>Revision</th><th>Status</th><th></th></tr></thead><tbody>' + J(PROPS.map((r, i) => '<tr' + (drawer && i === 0 ? ' class="sel"' : '') + '><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td class="w">' + r[2] + '</td><td class="w">' + r[4] + '</td><td>' + (r[3] === 'Approved' ? st('Approved') : i === 2 ? st('', 'Sent back') : st('Waiting', 'Waiting for HQ')) + '</td><td style="text-align:right"><button type="button" class="btn bsm">Review</button></td></tr>')) + '</tbody></table></section>';
    const SPEC = [['Purpose', 'A monthly peer circle for climate founders in the Nordic studio, with one HQ-hosted session per quarter.'], ['Audience', 'Founders of climate companies in the studio’s portfolio'], ['Eligibility', 'Active founder licence; company tagged climate'], ['Join method', 'Apply · studio approves'], ['Rewards / economics', 'No credits. Studio covers venue costs.'], ['HQ obligations', 'One quarterly session; playbook review'], ['Tools', 'Calendar, Community space'], ['Templates / contracts', 'Circle charter (attached)'], ['Studio', 'Nordic Studio · submitted by A. Lund']];
    const propDrawer = () => '<div class="dim1"></div><aside class="drw" role="dialog" aria-modal="true" aria-labelledby="prh" style="width:620px"><div class="drh"><div class="tr"><span class="eye">Proposal · Nordic Studio</span><button type="button" class="ib" aria-label="Close proposal">✕</button></div><h2 id="prh">Climate founders circle</h2><div class="mt">' + st('Waiting', 'Waiting for HQ') + '<span class="lock">' + SH.lk + ' Revision 2 · submitted 4 Nov 2026, 10:12 UTC · read-only</span></div></div>'
      + '<div class="drb"><section><h3>Submitted specification</h3><dl class="spec">' + J(SPEC.map(s => '<dt>' + s[0] + '</dt><dd>' + s[1] + '</dd>')) + '</dl></section><section><h3>History</h3><ul class="hist"><li><span>12 Oct</span>Revision 1 sent · sent back by HQ: “Add eligibility”</li><li><span>4 Nov</span>Revision 2 sent</li></ul></section></div>'
      + '<div class="drf"><div class="fld"><label for="pn">Note to the studio <span>· required for Send back and Decline</span></label><div class="ta" id="pn" style="min-height:44px"></div></div><div style="display:flex;gap:8px;justify-content:space-between;align-items:center"><span class="ln">Approving creates the programme as Proposed in the catalogue.</span><div style="display:flex;gap:8px"><button type="button" class="btn">Decline</button><button type="button" class="btn">Send back</button><button type="button" class="btn p">Approve revision 2</button></div></div></div></aside>';

    /* ---------- states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const kc = (cls, t, v, s) => '<div class="kc ' + cls + '"><span class="t">' + t + '</span><span class="v">' + v + '</span><span class="s">' + s + '</span></div>';
    const STATES = [
      ['Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:12px;width:40%"></span><span class="sk" style="height:22px;width:30%"></span><span class="sk" style="height:12px;width:70%"></span></div><span class="raw">Announced: “Loading programme summary”</span>'],
      ['Ready', kc('', 'Actions requiring HQ', '13', '12 Perk listings · 1 Strategic referral access')],
      ['Stale', kc('', 'Actions requiring HQ ' + st('Stale', 'As of 09:10'), '13', '<span>Couldn’t refresh at 14:30 — showing the 09:10 read</span>')],
      ['Partial / incomplete', kc('inc', 'People participating ' + st('Incomplete'), '1', '<span>9 of 10 programmes counted · Spin-Out Lab excluded</span>') + '<span class="raw">Never shown as a plain “1”</span>'],
      ['Empty', kc('', 'Credits · 12 weeks', '0', '<span>Measured zero: nothing granted or spent</span>')],
      ['Unavailable', kc('inc', 'Strategic referral access ' + st('Unavailable'), '—', '<span>The queue couldn’t be read.</span>') + '<button type="button" class="btn bsm" style="align-self:flex-start">Retry</button>'],
      ['Permission-restricted', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>Only a super admin can decide proposals.</b><div class="mu">You can read them and leave notes.</div></div></div>'],
      ['Headline with an unread queue', kc('inc', 'Actions requiring HQ ' + st('Incomplete'), '12+', '12 Perk listings · <span>Strategic referral access not read</span>') + '<span class="raw">“12+” — never a complete-looking 12</span>']
    ];
    const states = () => crop('<span class="eye">Region states · each is announced to screen readers by its word, not only its style</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);

    /* ---------- responsive ---------- */
    const phone = (body, w) => '<div class="cv" style="' + VARS + ';width:' + (w || 390) + 'px;height:' + (w ? 1024 : 844) + 'px"><div class="ph" style="width:' + (w || 390) + 'px;height:100%"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Programs</b><button type="button" class="pi" aria-label="Open Eadwyn, 3 recommendations">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div></div></div>';
    const mob = () => phone('<button type="button" class="dd" style="min-height:44px">Scope · HQ-held ▾</button>' + seg('Reporting period', ['4 wk', '12 wk', '52 wk'], '12 wk') + '<div class="strip4" style="grid-template-columns:1fr 1fr;gap:10px">' + kc('', 'Programs', '6', 'operational · 1 proposed') + kc('inc', 'People ' + st('Incomplete', 'Partial'), '1', '9 of 10 counted') + kc('', 'Actions', '13', '12 perks · 1 referral') + kc('', 'Credits', '0', '0 spent') + '</div><a class="btn p" href="#" style="min-height:48px">Review 12 perk listings</a>' + J(PR.slice(0, 4).map(p => '<div class="mc"><div class="r1"><b>' + p[0] + '</b>' + build(p[3]) + '</div><small>' + p[5] + ' · ' + p[6] + '</small></div>')));
    const tab = () => phone('<header class="pgh"><div><h1>Programs</h1></div><div class="ctl"><button type="button" class="btn p">New program</button></div></header><div class="strip4" style="grid-template-columns:1fr 1fr">' + kc('', 'Programs', '6', 'operational · 3 unavailable to studios · 1 proposed') + kc('inc', 'People participating ' + st('Incomplete'), '1', '9 of 10 programmes counted') + kc('', 'Actions requiring HQ', '13', '12 Perk listings · 1 Strategic referral') + kc('', 'Credits', '0', 'granted · 0 spent') + '</div>' + attention() + J(PR.slice(0, 3).map(p => pcard(p, build(p[3])))), 768);

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const rationale = () => dk('<h1>Rationale, status model and handoff</h1><p>The top answers four questions in order: what is operational (Programs), where people take part (People participating), what HQ must do (Actions requiring HQ, which reconciles with Needs attention and Waiting by programme), and what is incomplete (dashed cards and the Incomplete state). Proposals are a summary here and a workspace on their own route. The catalogue is rows by default, grouped by category, with the five state dimensions as labelled columns rather than badges; the card layout is the same data for narrow screens. A custom programme uses the same row and card with no bespoke layout.</p>'
      + tbl(['Requirement', 'Today (checked 7 Nov)', 'Needed'], [
        ['Build readiness', '<code>programs.status</code>: live, partly_built, not_built, proposed, paused', 'Split paused out into Operational state (frontend)'],
        ['Member access “not open yet”', 'Not stored', 'Backend: a member-access field on the registry row'],
        ['Studio offering', '<code>PUT /api/admin/programs/:key/grantable</code>', 'Frontend only'],
        ['Grants', 'Licence grants with granted / paused / ended', 'Frontend only (count per programme)'],
        ['Proposal revision', 'Statuses draft, sent, approved, sent_back, declined; no revision number; sent-back proposals are edited in place', 'Backend: revision number and an immutable snapshot per send; the decision names it'],
        ['Capability modules', 'Built-in programmes have bespoke pages', 'Backend + frontend: module flags on the registry; generic shell renders them'],
        ['Incomplete KPIs', 'Exceptions shown as prose with internal references', 'Frontend: coverage fraction and Incomplete state; never internal IDs'],
        ['Eadwyn', 'Rail shows model-list errors and pricing', 'Frontend: recommendations or the empty line; model detail moves to settings']])
      + '<h2>Accessibility</h2><p>Reporting period, Chart/Table, Rows/Cards and category filters are radio groups with <code>aria-checked</code>. Catalogue is a table with column headers and group row headers. Icon buttons (Refresh, Eadwyn) carry labels. Loading, stale, partial and unavailable each have a word announced with the region. Touch targets 44px on tablet and phone; the primary action stays first on narrow screens.</p><h2>React mapping</h2><p><code>pages/admin/programs/</code>: ProgramsOverview (header, strip, attention, activity, catalogue, proposals summary) · ProgramFrame + ProgramTabs become the generic shell with module slots · ProposalsPage keeps the table; ProposalTables’ filters move there only · NewProgramDialog unchanged.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'PG01') html = page(overview(), { h: 1990, rail: 'recs' });
    else if (B === 'PG02') html = cards();
    else if (B === 'PG02b') html = dims();
    else if (B === 'PG03') html = page(detail(false), { h: 1000 });
    else if (B === 'PG03b') html = page(detail(true), { h: 1000 });
    else if (B === 'PG04') html = page(propWs(true), { h: 900, overlay: propDrawer() });
    else if (B === 'PG05a') html = page(head() + strip() + attention(), { h: 760, rail: 'recs' });
    else if (B === 'PG05b') html = page(head() + strip() + attention(), { h: 760, rail: 'empty' });
    else if (B === 'PG05c') html = page(head() + strip() + attention(), { h: 760, rail: 'err' });
    else if (B === 'PG06') html = states();
    else if (B === 'PG06b') html = page(head() + activity('Table'), { h: 640 });
    else if (B === 'PG07a') html = tab();
    else if (B === 'PG07b') html = mob();
    else if (B === 'PG08') html = rationale();
    else html = page(overview(), { h: 1990, rail: 'recs' });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
