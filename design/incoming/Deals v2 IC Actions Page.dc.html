    const c24 = () => crop(ann('GET /api/ic/commit-room (minutes of the current decision) · PATCH /api/ic/meetings/:uid/minutes (organiser or Admin)')
      + '<div class="dic-grid3">' + fr('1 · Recorded', minutesBox('rec')) + fr('2 · Linked, nothing written (organiser)', minutesBox('none')) + fr('3 · No meeting on the deal', minutesBox('nomeet')) + '</div>'
      + '<div class="dic-grid3">' + fr('2b · Linked, nothing written (others)', minutesBox('none', false)) + fr('Editor · full-height sheet', '<div role="dialog" aria-modal="true" aria-label="Minutes" style="background:var(--card);border:1px solid var(--hair);border-radius:16px;height:340px;display:flex;flex-direction:column"><div class="mdh"><h2 style="font-size:16px">Minutes · [Acme Robotics IC]</h2></div><div class="mdb" style="flex:1"><div class="ta" style="flex:1">' + MIN_TEXT.replace('\n', '<br>') + '</div><span class="raw">Clearing the text and saving removes the minutes.</span></div><div class="mdf"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Save</button></div></div>')
      + fr('Another decision', minutesBox('other')) + '</div>', 1400);
    const c25b = () => crop('<section class="cd" style="padding:36px;align-items:flex-start;gap:10px"><h2 style="font-size:20px">No investment decisions yet.</h2><p class="mu" style="font-size:13px">0 decisions you can see.</p><button type="button" class="btn p">+ Open a decision</button></section>', 900);
    const c27 = () => crop(ann('Frontend only · collapsed by default under the tally') + '<section class="cd" style="gap:10px">' + tally(3, 1, 1, 1, { noHow: true })
      + '<button type="button" class="disc2" aria-expanded="true">How voting works ▴</button><ol class="dic-ol">'
      + J(['Every vote needs a reason.', 'Changing your vote replaces the old one.', 'Recusing declares a conflict, is final, and takes you out of the count. Abstain is a vote and stays in it.', 'The person who opened the decision, or an Admin, closes the vote with Invest, Pass or Defer.', 'No transfer can be recorded on the deal while a condition is open. The person who opened the decision, or an Admin, marks it met or waived.', 'Minutes belong to the deal’s IC meeting.'].map(t => '<li>' + t + '</li>')) + '</ol></section>', 900);
    const c28 = () => crop('<span class="eye">States · Platform States (D5129): zero, Not recorded and Unreadable never look alike</span><div class="dic-grid4">'
      + box('Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:46px;width:100%"></span><span class="sk" style="height:70px;width:100%"></span><span class="sk" style="height:12px;width:80%"></span><span class="sk" style="height:12px;width:70%"></span><span class="raw">Header and zone row render first</span></div>')
      + box('Not recorded', '<ul class="rz"><li>Memo ' + NR + '</li><li>Venture ' + NR + '</li><li>Outcome ' + NR + '</li><li>Older vote <span class="ab anr">— No reason recorded</span></li><li>Minutes ' + NR + '</li></ul>')
      + box('Zero is a value', tally(0, 0, 0, 0, { noGap: true, noHow: true }))
      + box('Unreadable · committee', nt('r', '✕', 'Investment committee could not be read.', 'Not the same as no decisions.', '<button type="button" class="btn bsm">Try again</button>') + '<span class="raw">The zone row and the rest of Deals still work.</span>')
      + box('Unreadable · meeting only', '<span class="eye">Minutes</span>' + nt('', '!', 'The meeting could not be read.', 'Not the same as no meeting.', '<button type="button" class="btn bsm">Try again</button>') + '<span class="raw">Never “No meeting”.</span>')
      + box('Refused · plan', '<p style="font-size:12.5px"><b>This is an Investor Professional feature.</b> Upgrade for full deal flow, intros, and exports.</p><button type="button" class="btn p bsm" style="align-self:flex-start">Upgrade</button>')
      + box('Refused · role / firm', '<p style="font-size:12.5px">A Founder or Advisor never sees the Commit pill.</p><p style="font-size:12.5px"><b>Decision not found.</b> A decision outside your firm reads as not found, never as forbidden.</p>')
      + box('Schedule IC meeting refused', '<p class="dic-err">Current deal relationship required</p><p class="dic-err">The meeting must start in the future.</p><span class="raw">Kept in the calendar’s form</span>')
      + box('Saving', '<div class="dic-my"><span>Recording your vote…</span><span class="sk" style="width:60px;height:10px"></span></div><span class="raw">Form locked, edits kept</span>')
      + '<section class="cd" style="gap:8px;grid-column:span 3"><div class="ch"><h2 style="font-size:13.5px">Save failed · the platform’s own words, edits kept</h2></div><div class="dic-grid2" style="gap:8px">'
      + J(['Every vote records its reason. Write the rationale before voting.', 'A recusal records the conflict it declares. Write the declaration as the rationale.', 'You recused yourself from this decision. A recusal is final: it and its declaration stand, and no later vote is recorded.', 'A condition is the sentence a later stage checks — write it.'].map(m => nt('r', '✕', 'Not saved.', m))) + '</div></section>'
      + '<section class="cd" style="gap:8px;grid-column:span 2"><div class="ch"><h2 style="font-size:13.5px">Super Admin preview · Option A</h2>' + FL('#4815 owner pick') + '</div><div class="you"><span aria-hidden="true">▲</span><div><b>Previewing the Investor shell.</b> Recorded as [Super Admin name], previewing.</div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn bsm">Cancel</button><button type="button" class="btn p bsm">Record vote as [Super Admin name]</button></div></section>'
      + '<section class="cd" style="gap:8px;grid-column:span 2"><div class="ch"><h2 style="font-size:13.5px">Option B · alternate</h2>' + FL('#4815') + '</div><p style="font-size:12.5px">Writes are refused in preview.</p><button type="button" class="btn bsm" style="align-self:flex-start">Return to HQ</button>' + PT('#5915 enforcement') + '</section>'
      + '</div>', 1440);

    /* ---------- phone ---------- */
    const phone = (title, body, extra) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative;overflow:hidden"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (extra || '') + '</div></div>';
    const mz = '<nav class="zn" aria-label="Deals" style="overflow:hidden;flex-wrap:nowrap">' + J([['Deal flow', '24'], ['Screening', '2'], ['Commit', '7'], ['Closing', '1']].map(z => '<a href="#"' + (z[0] === 'Commit' ? ' aria-current="page"' : '') + ' style="min-height:44px;white-space:nowrap">' + z[0] + '<span>' + z[1] + '</span></a>')) + '</nav>';
    const mDec = '<div class="dic-cardm"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="font-size:15px">Invest in [Acme Robotics] seed round</b>' + stg('voting') + '</div><span class="raw">[Acme Robotics] · €1.5M SAFE · opened [12 Nov]</span><button type="button" class="disc2" aria-expanded="false" style="min-height:44px">Read memo ▾</button></div>';
    const mTally = '<div class="dic-cardm" style="gap:4px"><b class="mo" style="font-size:14px">Invest 2 · Pass 1 · Abstain 1</b><span class="raw">of 4 votes cast on this decision</span><b class="mo" style="font-size:13px;color:var(--mu);border-top:1.5px dashed var(--mu);padding-top:6px;margin-top:4px">⊘ Recused 1 · not in the count</b></div>';
    const mOpts = '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px" role="radiogroup" aria-label="Your vote">' + J(['invest', 'pass', 'abstain'].map((k, i) => '<button type="button" role="radio" aria-checked="' + (i === 0) + '" class="btn dic-big" style="' + (i === 0 ? 'border:2px solid #7c3aed;background:var(--lav);color:var(--vt)!important' : '') + '">' + V[k][1] + ' ' + V[k][2] + '</button>')) + '</div>';
    const mVote = (r) => '<div class="dic-cardm' + (r[1] === 'recused' ? ' rec' : '') + '"><div style="display:flex;justify-content:space-between;align-items:center"><b>[' + r[0] + ']</b>' + vt(r[1]) + '</div><span style="font-size:12.5px">' + (r[1] === 'recused' ? 'Declared conflict: ' : '') + '“' + r[2] + '”</span><span class="raw">' + r[3] + '</span></div>';
    const mSheet = (t, body) => '<div class="dic-pdim"></div><div class="dic-sheet" role="dialog" aria-modal="true" aria-label="' + t + '"><span class="grab" aria-hidden="true"></span><b style="font-size:17px">' + t + '</b>' + body + '</div>';
    const MOB = {
      DIC29A: () => phone('Investment committee', mz + mDec + mTally + '<div class="dic-cardm" style="border-color:var(--lavE)"><b>Your vote</b>' + mOpts + '<div class="fld"><label>Reason <span>· required</span></label><div class="ta" style="min-height:64px"></div></div><button type="button" class="btn p dic-big">Record vote</button><button type="button" class="btn t dic-big">Recuse myself</button></div>'),
      DIC29B: () => phone('Investment committee', '<span class="eye">Votes · latest per member</span>' + mVote(VOTES[0]) + mVote(VOTES[2]) + mVote(VOTES[4]) + '<span class="eye">Conditions · 2 open block Closing</span><div class="dic-cardm"><div style="display:flex;justify-content:space-between;gap:8px"><span>' + CONDS[0][0] + '</span><button type="button" class="pi" aria-label="Condition actions: Mark met, Waive" aria-haspopup="menu" style="width:44px;height:44px">⋯</button></div><div>' + cst('open') + '</div><span class="raw">Added by ' + CONDS[0][2] + '</span></div><button type="button" class="disc2 dic-big" aria-expanded="false">Minutes · recorded [13 Nov] ▾</button>'),
      DIC29C: () => phone('Investment committee', mz + mDec + mTally, mSheet('Recuse yourself', '<p style="font-size:13px">Abstain is a vote cast and stays in the count. Recusing declares a conflict and takes you out of the count.</p>' + fld('Declaration of the conflict', 'I hold a stake in [Acme Robotics] through an angel syndicate.', true, 64) + '<div class="ack"><input type="checkbox" checked><span>I understand a recusal is final.</span></div><button type="button" class="btn p dic-big">Recuse</button><button type="button" class="btn dic-big">Cancel</button>')),
      DIC29D: () => phone('All decisions', mz + '<div class="seg" role="radiogroup" aria-label="Stage" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">' + J(['All 24', 'Draft 3', 'Voting 4', 'Decided 17'].map((i, n) => '<button type="button" role="radio" aria-checked="' + (n === 0) + '" style="min-height:44px;padding:0 4px">' + i + '</button>')) + '</div><span class="raw">24 decisions you can see</span>'
        + J([ALL[0], ALL[3], ALL[5], ALL[7]].map(r => '<div class="dic-cardm"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + r[0] + '</b>' + stg(r[2]) + '</div><span class="raw">' + r[5] + ' votes cast · ' + r[6] + ' open conditions</span><div style="display:flex;gap:8px;align-items:center">' + (r[3] ? vt(r[3]) + ' <span class="mo">' + r[4] + '</span> · ' + outc(r[7]) : NA()) + '</div></div>'))),
      DIC29E: () => phone('Investment committee', mz + mDec, mSheet('Close the vote', '<b class="mo">Invest 3 · Pass 1 · Abstain 1</b><span class="raw" style="margin-top:-8px">of 5 votes cast · ⊘ Recused 1 not in the count</span><div style="display:flex;flex-direction:column;gap:6px" role="radiogroup" aria-label="Decision">' + J(['invest', 'pass', 'defer'].map((k, i) => '<button type="button" role="radio" aria-checked="' + (i === 0) + '" class="btn dic-big" style="justify-content:flex-start;' + (i === 0 ? 'border:2px solid #7c3aed;background:var(--lav);color:var(--vt)!important' : '') + '">' + V[k][1] + ' ' + V[k][2] + '</button>')) + '</div><p style="font-size:13px">This closes the vote and records the time.</p><button type="button" class="btn p dic-big">Close vote</button><button type="button" class="btn dic-big">Cancel</button>')),
      DIC29F: () => phone('Investment committee', mz + mDec, mSheet('Open a decision', fld('Title', 'Invest in [Marlow Bio] seed round', true) + pick('Deal', '[Marlow Bio] · €2.0M seed', true) + pick('Diligence case', 'None', false) + '<label class="ck"><input type="checkbox" checked style="accent-color:#7c3aed">Start the memo from the scoring memo</label><span class="raw">IC meeting: Thu [19 Nov], 10:00 · from the deal</span><button type="button" class="btn p dic-big">Open decision</button><span class="raw">Saved as Draft. Voting opens when the first vote is cast.</span>'))
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>IC actions · handoff (#6142)</h1><p>Extends DE07 / DE07b of Deals v2 (section DX7). Boards DE19 to DE31 here use the keys DIC19 onward; renumber on landing if another addendum lands first. Checked against main 6d7712c6d1.</p>'
      + '<h2>Checked on main</h2>' + tbl(['Area', 'What main has', 'Board'], [
        ['Open a decision', '<code>POST /api/ic</code> (title required, Deal / Project not found, <code>from_scoring</code> seeds the memo). Only the retired <code>/ic</code> list page calls it.', 'DE19'],
        ['Vote, recuse', '<code>POST /api/ic/:uid/vote</code>: <code>rationale_required</code>, <code>recusal_requires_declaration</code>, 409 <code>recusal_is_final</code>; upsert replaces the old vote; no stage check. CommitZone has no vote form; <code>ICDecisionPage</code> does.', 'DE20, DE21'],
        ['Close', '<code>PUT /api/ic/:uid</code> with <code>decision</code> sets decided and <code>decided_at</code>; author or Admin. CommitZone already offers it.', 'DE22'],
        ['Conditions', '<code>POST /:uid/conditions</code>, <code>PATCH /conditions/:uid</code> (author or Admin; Reopen clears resolved fields). Transfer gate refuses 409 <code>open_conditions_block_transfer</code>.', 'DE23'],
        ['Minutes', 'commit-room <code>minutes</code> for the current decision only; <code>PATCH /meetings/:uid/minutes</code>, organiser or Admin (<code>may_record</code>).', 'DE24'],
        ['All decisions', '<code>GET /api/ic?status=</code>, <code>GET /api/ic/conditions?status=open</code>; CommitZone has an “All decisions” view (Decision, Stage, Tally, Rationales, Outcome).', 'DE25, DE26'],
        ['Routes', '<code>/deals/commit</code>: admin, investor. <code>/ic</code>, <code>/ic/:uid</code>: admin, partner, investor.', '⚑ Q2, Q3']])
      + '<h2>Backend required (◇, #6142 until filed)</h2><p>Voting roster · quorum · condition owner column · a meeting chosen on the decision · vote history · meeting and minutes for any decision · the opener’s name in the read · refusing votes and recusals once decided · condition history · Eadwyn condition wording.</p>'
      + '<h2>Owner questions (⚑, drawn as option A)</h2><p>Q1 vote buttons Invest / Pass / Abstain; close keeps Invest / Pass / Defer · Q2 one decision opens inside /deals/commit, /ic redirects · Q3 add Partner to /deals/commit · Q4 conditions get an owner · Q5 closing locks the vote. Super Admin preview writes wait on #4815 (enforcement #5915).</p>'
      + '<h2>Frontend only</h2><p>Open a decision dialog on /deals/commit · vote form, Change my vote, Recuse dialog · Current | All decisions switch with filters and the decision record · condition sheet and per-role row actions · minutes editor sheet · How voting works · exports built in the browser · phone sheets · dark tokens.</p>'
      + '<h2>Handoff to Closing</h2><p>Closed as Invest → /deals/closing for that deal, open conditions shown as Blocking; no transfer until met or waived. Pass and Defer → /deals/:id with the decision shown.</p>'
      + '<h2>Accessibility</h2><p>Vote options and Decision are radio groups; each vote, stage and condition status has a word and a glyph; Recused has its own dashed shape and sits beside the tally; dialogs trap and return focus; errors are role=alert and keep the text; phone targets 44px, no table wider than the screen.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DIC19') html = page(pDecision(), { h: 1100, ann: ann('POST /api/ic', 'dialog over /deals/commit · Saved as Draft'), overlay: openDlg() });
    else if (B === 'DIC19B') html = c19();
    else if (B === 'DIC20') html = page(pDecision(), { h: 1240, rail: 'memo', ann: ann('GET /api/ic/commit-room · POST /api/ic/:uid/vote · Eadwyn memo accept → PUT /api/ic/:uid (author or Admin)') });
    else if (B === 'DIC20B') html = c20();
    else if (B === 'DIC20C') html = page(pNoVotes(), { h: 1080, ann: ann('GET /api/ic/commit-room', 'Draft; the first vote moves it to Voting') });
    else if (B === 'DIC21') html = c21();
    else if (B === 'DIC22') html = c22();
    else if (B === 'DIC23') html = page(pConds(), { h: 1080, ann: ann('POST /api/ic/:uid/conditions · PATCH /api/ic/conditions/:uid', 'view of the author') });
    else if (B === 'DIC23B') html = c23();
    else if (B === 'DIC24') html = c24();
    else if (B === 'DIC25') html = page(pAll(), { h: 1000, ann: ann('GET /api/ic · GET /api/ic/conditions?status=open', 'a view on /deals/commit, no new route') });
    else if (B === 'DIC25B') html = c25b();
    else if (B === 'DIC26') html = page(pRecord(), { h: 1120, ann: ann('GET /api/ic/:uid', 'read-only; export built in the browser') });
    else if (B === 'DIC27') html = c27();
    else if (B === 'DIC28') html = c28();
    else if (B === 'DIC30A') html = page(pDecision(), { h: 1240, rail: 'memo' });
    else if (B === 'DIC30B') html = page(pConds(), { h: 1080 });
    else if (B === 'DIC31') html = handoff();
    else if (MOB[B]) html = MOB[B]();
    else html = page(pDecision(), { h: 1240, rail: 'memo' });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
