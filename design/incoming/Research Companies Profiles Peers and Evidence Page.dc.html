      + '<div class="rcp-g2" style="align-items:start"><section class="cd"><div class="rcp-fld"><label>Subject company</label><div class="rcp-inp rcp-pre">' + kindDir + '<b>Halden Grid</b><span class="raw">haldengrid.example · Norway · energy storage</span><button type="button" class="btn t bsm">Change</button></div><p class="raw">Kept with the analysis, so Direct and Adjacent are about this company. ' + tg('#7046 subject_uid on the analysis') + '</p></div>'
      + '<div class="rcp-fld"><label>Market / industry *</label><div class="rcp-inp">energy storage</div><p class="raw">Filled from the sector label; edit freely.</p></div><div class="rcp-fld"><label>Geography</label><div class="rcp-inp">Norway</div></div><div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn p">Analyze competitors</button><span class="raw">Quick scan · nothing runs until you press it</span></div></section>'
      + '<section class="cd" style="background:var(--raised)"><span class="eye">Today on main</span><p style="font-size:12.5px;line-height:1.55"><code class="mo">analysisHref()</code> opens <code class="mo">/research/companies?tab=analyses&amp;market=Halden Grid&amp;website=…</code>. The setup puts the company <b>name into Market / industry</b> and “Official website: …” into Known competitors. No field keeps which company the analysis is about.</p><p style="font-size:12.5px;line-height:1.55">The design keeps the same link and adds the subject. Until the Worker stores it, the frontend can show the subject chip from the query string, read-only.</p></section></div>', 1280);

    const candidate = (o) => { o = o || {}; return candHead() + tiles + '<div class="rcp-g2" style="align-items:start">' + rationale + inAnalysis + '</div>' + sourcesTbl + signals(); };

    const analysisCrop = () => crop('<div class="ch"><div><span class="eye">Saved analyses</span><h2 style="font-size:20px;font-weight:800;letter-spacing:-.02em">' + AN + '</h2><div class="raw">Subject Halden Grid ' + tg('#7046 subject') + ' · custom · updated 9 Nov 2026</div></div><button type="button" class="btn">Re-run</button></div>'
      + '<table class="rcp-rt"><caption class="rcp-sr">Candidates in this analysis</caption><thead><tr><th scope="col">Candidate</th><th scope="col">Category in this analysis</th><th scope="col">Rationale</th><th scope="col">Evidence</th><th scope="col"><span class="rcp-sr">Open</span></th></tr></thead><tbody>'
      + '<tr><th scope="row">Brightwell Storage<small>also a sector peer · directory</small></th><td><span class="rcp-cat">Direct competitor</span></td><td>Same Nordic grid buyers; utility-scale pricing page</td><td class="mo">4 sources · 3 signals</td><td><a class="btn bsm" href="#">Open</a></td></tr>'
      + '<tr><th scope="row">Tidewater Systems<small>directory · different sector label</small></th><td><span class="rcp-cat adj">Adjacent competitor</span></td><td>Battery analytics software sold to the same utilities</td><td class="mo">1 source · 1 signal</td><td><a class="btn bsm" href="#">Open</a></td></tr>'
      + '<tr><th scope="row">[Volta Fjord]<small>added by name · no directory match</small></th><td><span class="rcp-cat">Direct competitor</span> ' + chip('part', 'Unsupported') + '</td><td>' + NR + '</td><td>' + chip('nr', 'No source') + '</td><td><a class="btn bsm" href="#">Add a source</a></td></tr>'
      + '</tbody></table><p class="raw">A category without a rationale and a source reads Unsupported until both are added. Sector peers that are not in this analysis are not listed here.</p>', 1280);

    /* tablet */
    const tabProfile = () => tablet('Company', head(HG).replace('class="rcp-head"', 'class="rcp-head rcp-headT"') + grp(3, [['Description', 'no source holds one'], ['Logo', 'no source holds one'], ['Investors', 'no source lists them']]) + secnav('Key metrics') + keyMetrics(2) + peers(2, 2, false), 1440);
    const tabCand = () => tablet('Analysis candidate', candHead(true) + '<div class="rcp-row2"><button type="button" class="btn">Crawl site again</button><button type="button" class="btn t">Remove from analysis</button></div>' + rationale + '<div class="seg" role="tablist" aria-label="Candidate evidence"><button type="button" role="tab" aria-selected="false" aria-checked="false">Sources · 4</button><button type="button" role="tab" aria-selected="true" aria-checked="true">Signals · 3 + 2 context</button></div>' + signals(true), 980);

    /* states */
    const stBox = (t, body) => '<section class="rcp-stb"><div class="eye">' + t + '</div>' + body + '</section>';
    const states = () => crop('<div class="ch"><h2 style="font-size:20px;font-weight:800">States · profile, evidence and candidate</h2><span class="raw">each state has a word and a shape · colour is never the only cue</span></div><div class="rcp-g3" style="align-items:start">'
      + stBox('Loading · the company', '<div role="status" class="rcp-load">' + chip('ld', 'Loading the company…') + '<i style="width:60%"></i><i style="width:85%"></i><i style="width:40%"></i></div><p class="raw">Breadcrumb and Back stay usable. No figure is drawn until it arrives.</p>')
      + stBox('Unavailable · the whole company read', '<div class="rcp-empty">' + chip('un') + '<p>The company directory did not load. <b>This is not zero.</b></p>' + retry('Try again') + '</div><p class="raw">GET /company-directory/:uid → 503 Unreadable</p>')
      + stBox('Not found', '<div class="rcp-empty"><b>Company not found</b><p>No directory company has this id.</p><a class="btn t bsm" href="#">‹ Companies</a></div><p class="raw">404 · not a platform state; nothing to retry</p>')
      + stBox('Unavailable · one collection, Retry that one', '<div class="rcp-col rcp-colun">' + accH('Employment observations', '', chip('un', 'Unavailable'), true) + '<div class="rcp-ab"><p style="font-size:12.5px">This collection did not load. The other three did.</p>' + retry('Retry employment observations') + '</div></div><p class="raw">Retry re-reads the company and replaces only this collection; the rest of the page does not reload. ' + tg('#7046 per-collection read') + '</p>')
      + stBox('None · true empty', '<div class="rcp-col">' + accH('Funding rounds', '0 records', chip('none', 'None'), true) + '<div class="rcp-ab"><p style="font-size:12.5px">The read succeeded and holds no funding round for this company.</p></div></div>')
      + stBox('Not recorded · no sector label', '<div class="rcp-empty">' + chip('nr') + '<p>This company has no sector label, so it has no sector peers to match.</p></div><p class="raw">peers.status = not_recorded · never “0 peers”</p>')
      + stBox('Partial · value with incomplete provenance', '<article class="rcp-mc"><div class="rcp-mt"><span>Funding total</span>' + chip('part', 'Date partial') + '</div><div class="rcp-v">$24.0M<small>USD</small></div><dl class="rcp-pv"><dt>Publisher</dt><dd>[Nordic Funding Register]</dd><dt>Observed</dt><dd>' + obsNR(false) + '</dd><dt>Updated</dt><dd class="mo">2 Nov 2026</dd></dl></article>')
      + stBox('Refused · not in this member’s access', '<ul class="rcp-ref"><li>' + chip('rf') + '<span><b>Funds</b> · names show without a link when the member is not admitted to Funds (D4612).</span></li><li>' + chip('rf') + '<span><b>Add to research, Compare</b> · offered to founders and admins only; other roles see Set up competitor analysis alone.</span></li><li>' + chip('rf') + '<span><b>Signed out</b> · 401: Sign in to read the directory.</span></li></ul>')
      + stBox('Candidate · no source, no signal', '<div class="rcp-empty">' + chip('nr', 'No source') + '<p>A competitor with no URL is a name. Add a URL to record one.</p><div style="display:flex;gap:6px;width:100%"><span class="rcp-inp" style="flex:1;min-height:36px">https://</span><button type="button" class="btn">Add URL</button></div></div><div class="rcp-empty">' + chip('none', 'No company signal') + '<p>The crawl recorded no signal for this company.</p></div><div class="rcp-empty">' + chip('na', 'Context · Not applicable') + '<p>Not linked to a directory company, so no sector or country context.</p></div>')
      + '</div>', 1440);
    const absences = () => crop('<div class="ch"><h2 style="font-size:20px;font-weight:800">Four different absences, side by side</h2><span class="raw">never drawn alike · never drawn as 0 unless the source recorded 0</span></div><div class="rcp-g4">'
      + stBox('Blank field', '<div class="rcp-v" style="font-size:18px">' + chip('nr') + '</div><p class="rcp-d">Valuation: no source lists one.</p><p class="raw">value = null · status not_recorded</p>')
      + stBox('Recorded zero', '<div class="rcp-v"><b class="st-zero mo">NOK 0</b></div><p class="rcp-d">Debt in the FY2025 statement. The filing says 0.</p><p class="raw">a measured 0 is a Value</p>')
      + stBox('Unknown observation date', '<div class="rcp-v">$24.0M<small>USD</small></div><p class="rcp-d">Observed: ' + obsNR(false) + ' · Updated <span class="mo">2 Nov 2026</span></p><p class="raw">the update date is never shown as the observation date</p>')
      + stBox('Unreadable collection', '<div>' + chip('un') + '</div><p class="rcp-d">Financial statements did not load. This is not zero.</p>' + retry('Retry financial statements'))
      + '</div>', 1440);

    /* phone */
    const mHead = '<div class="crumb">Research / Companies</div><div>' + kindDir + '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px">Halden Grid</h1><a href="#" class="rcp-site" style="min-height:44px;display:inline-flex;align-items:center">haldengrid.example' + ext + '</a></div><div class="rcp-chips"><span class="rcp-chip">energy storage</span><span class="rcp-chip">Norway</span><span class="rcp-chip">Founded <b class="mo">2019</b></span></div>';
    const mActs = '<a href="#" class="btn p" style="min-height:48px">Set up competitor analysis →</a><div class="rcp-row2 m"><button type="button" class="btn">Add to research</button><button type="button" class="btn">Compare</button></div>';
    const mAcc = (t, n, st, open, body) => '<div class="rcp-col">' + accH(t, n, st, open) + (open ? '<div class="rcp-ab">' + body + '</div>' : '') + '</div>';
    const rCard = (r) => '<article class="mc"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>' + r[0] + '</b><b class="mo">' + r[3] + ' <span class="raw">' + r[4] + '</span></b></div><dl class="rcp-pv"><dt>Announced</dt><dd class="mo">' + r[1] + '</dd><dt>Publisher</dt><dd>' + r[7] + '</dd><dt>Verified</dt><dd>' + (r[8] ? '<span class="mo">' + r[8] + '</span>' : NR) + '</dd></dl><button type="button" class="btn" style="min-height:44px">Inspect ' + r[0] + '</button></article>';
    const MOB = {
      RCP05A: () => phone('Company', mHead + mActs + '<section class="rcp-src"><div class="eye">Directory record</div><b>' + HG.src + '</b><p>as of <span class="mo">1 Nov 2026</span></p><a href="#" style="min-height:44px;display:inline-flex;align-items:center">View the Wikidata record' + ext + '</a></section>' + grp(3, [['Description', ''], ['Logo', ''], ['Investors', '']]) + '<button type="button" class="rcp-jump" aria-haspopup="listbox">Jump to section · Key metrics ▾</button>' + mcard(METRICS[0])),
      RCP05B: () => phone('Evidence', '<div class="crumb">Halden Grid / Evidence</div><p class="raw">8 records in 3 collections · 1 collection unavailable. Each opens on its own.</p>' + mAcc('Funding rounds', '2', chip('ok', 'Read'), true, J(ROUNDS.map(rCard))) + mAcc('Employment observations', '', chip('un', 'Unavailable'), true, '<p style="font-size:12.5px">Did not load. This is not zero. The other sections still work.</p><button type="button" class="btn" style="min-height:44px">' + G.re + ' Retry this collection</button>') + mAcc('Financial statements', '2', chip('ok', 'Read'), false) + mAcc('Field citations', '4', chip('ok', 'Read'), false)),
      RCP05C: () => phone('Sector peers', '<div class="crumb">Halden Grid / Sector peers</div><h2 class="rcp-h2" style="font-size:17px">Sector peers <span class="rcp-cnt">11</span></h2><div class="rcp-rule"><b>Matching rule</b><span>Same sector label “energy storage” · Norway first, then by name · 8 of 11 shown</span></div>' + J(PEERS.slice(0, 3).map(p => peerCard(p).replace('class="rcp-pn"', 'class="rcp-pn" style="min-height:44px;display:flex;align-items:center"'))) + '<a href="#" class="btn" style="min-height:44px">See all 11 in Companies →</a>'),
      RCP05D: () => phone('Analysis candidate', '<div>' + kindCand + '</div><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em">Brightwell Storage</h1><div class="raw" style="font-family:var(--sg)">Direct competitor in <b>' + AN + '</b> · 78 / 100</div><div class="rcp-links"><a href="#" class="rcp-lk" style="min-height:44px;display:inline-flex;align-items:center">Directory profile →</a></div><div class="seg rcp-segm" role="tablist" aria-label="Candidate evidence"><button type="button" role="tab" aria-selected="false" aria-checked="false">Sources · 4</button><button type="button" role="tab" aria-selected="true" aria-checked="true">Signals · 3 + 2</button></div><div class="rcp-sgc"><div class="rcp-sgh"><b>About Brightwell Storage</b><span class="raw">from this analysis’s crawl</span></div><ul>' + J(SIG.map(sigRow)) + '</ul></div><div class="rcp-sgc rcp-ctx"><div class="rcp-sgh"><b>Context · not about this company</b></div><ul>' + J(CTX.map(ctxRow)) + '</ul></div>'),
      RCP05E: () => phone('Evidence', '<div class="crumb">Halden Grid / Key metrics</div>' + mcard(METRICS[0]), '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms1" style="max-height:640px"><div class="grab" aria-hidden="true"></div><div style="padding:6px 18px 22px;display:flex;flex-direction:column;gap:10px"><div class="ch"><h2 id="ms1" style="font-size:17px;font-weight:800">Funding total</h2><button type="button" class="pi rcp-foc" aria-label="Close evidence">✕</button></div><dl class="rcp-kv"><dt>Value</dt><dd><b class="mo">$24,000,000</b> USD</dd><dt>Publisher</dt><dd>[Nordic Funding Register]</dd><dt>Observed</dt><dd>' + obsNR(false) + '</dd><dt>Updated</dt><dd class="mo">2 Nov 2026</dd></dl><h3 class="rcp-h3">Supporting records · 2 publishers</h3><ul class="rcp-sup"><li><b>Series A · <span class="mo">$18.0M</span></b><span>[Nordic Funding Register] · 14 Mar 2025</span></li><li><b>Seed · <span class="mo">$6.0M</span></b><span>[Press release] · 6 Jun 2023</span></li></ul><a href="#" class="btn" style="min-height:48px">Open the publisher’s page' + ext + '</a><p class="raw">Closing returns focus to Inspect evidence.</p></div></div>')
    };

    /* docs */
    const dk = (inner) => '<div class="cv rcp" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RCP09: () => dk('<h1>RS-18 · linked prototype, keyboard order and focus</h1><p>The frames link as below. Each arrow is a real link or button on the boards; nothing runs on load and nothing is set by Eadwyn.</p>'
        + '<div class="rcp-flow">' + J([['RCP01B', 'Profile · Halden Grid'], ['RCP02', 'Evidence collections'], ['RCP02B', 'Record drawer'], ['RCP03', 'Sector peers'], ['RCP01C', 'Analysis setup · subject filled'], ['RCP03B', 'Analysis · Direct / Adjacent'], ['RCP04', 'Candidate · Sources + Signals']].map((x, i) => '<div class="rcp-fn"><span class="mo">' + x[0] + '</span><b>' + x[1] + '</b></div>' + (i < 6 ? '<span class="rcp-fa" aria-hidden="true">→</span>' : ''))) + '</div>'
        + tbl(['From', 'Control', 'Goes to', 'Focus after'], [
          ['Profile', 'Inspect evidence (a metric card)', 'Record drawer (desktop) · bottom sheet (phone)', 'The drawer’s ✕, its first control; Esc, ✕ and Close return focus to the same Inspect button'],
          ['Profile', 'Section nav · Evidence', '#evidence on the same page', 'The section heading (tabindex −1)'],
          ['Evidence', 'Collection header (button, aria-expanded)', 'Opens or closes that collection only', 'Stays on the header'],
          ['Evidence', 'Retry this collection', 'Re-reads; replaces only that collection', 'The collection header; result announced politely'],
          ['Profile', 'A peer name', 'That company’s profile (same route, new uid)', 'h1 of the new profile; the older read never lands on it (latestOnly)'],
          ['Profile', 'Set up competitor analysis →', 'Saved analyses tab, subject and market filled', 'Market / industry field'],
          ['Analysis', 'Open (candidate row)', 'Candidate page', 'h1'],
          ['Candidate', 'Directory profile →', 'The profile of the same company', 'h1; Back returns to the candidate'],
          ['Candidate (phone)', 'Sources / Signals tabs', 'Switches panel; arrow keys move between tabs', 'The selected tab']])
        + '<h2>Keyboard order</h2><p>Profile: breadcrumb → h1 → official site → Set up competitor analysis → Add to research → Compare → View the record → Not recorded group → section nav → metric cards (each: Inspect) → sector peers (name links, then See all) → … → Evidence collection headers, each followed by its rows’ Inspect buttons → Eadwyn rail last. Candidate: breadcrumb → category select → name → site → Directory profile → Crawl site again → Remove → Sources → Signals (company group, then context group) → Back to analysis → Eadwyn.</p>'),
      RCPH: () => dk('<h1>RS-18 · handoff</h1><p>Checked against <code>main</code> 87bf3ac4ac (16 Nov 2026). Boards draw the profile and evidence of a <b>directory company</b> and the page of an <b>analysis candidate</b>, kept apart by the ▣ and ◎ badges.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it does today'], [
          ['<code>services/researchCompanyDirectory.ts</code> <code>getCompany</code>', 'One read returns item, tracked_sector, metrics, four evidence collections (each <code>ok</code> or <code>unreadable</code> on its own), and peers. Rows already carry per-record publisher, URL, dates, verified_at and confidence.'],
          ['same file, <code>presentMetrics</code>', 'Every headline metric shares one <code>metrics_source_name/url</code> and one <code>metrics_confidence</code>. Funding total’s <code>as_of</code> is <code>metrics_updated_at</code>; the others fall back to it when their own date is null. So an unknown observation date arrives as the update date.'],
          ['same file, peers', 'Same sector label, <code>LOWER(TRIM())</code> exact; same country first (both must be recorded), then by name; 8 rows (<code>PEER_LIMIT</code>) and a total.'],
          ['<code>pages/research/CompanyProfile.jsx</code>', 'Calls the peers “Competitors” in a <code>min-w-[720px]</code> table; reduces each evidence collection to a row count in a <code>min-w-[640px]</code> table; one Retry reloads everything; CTA “Run competitor analysis →” via <code>analysisHref</code>; Add to research and Compare for founder and admin.'],
          ['<code>components/CompetitorAnalysis.jsx</code>', '<code>?market=</code> fills Market / industry with the company name; <code>?website=</code> goes to Known competitors. Nothing runs until Analyze.'],
          ['<code>pages/research/CompanyCandidate.jsx</code>', 'Category Direct/Adjacent, origin, relevance, summary, Sources (table at md+, cards below), Signals <code>hidden md:block</code>. No sector or country context. <code>directory_uid</code> links the profile.'],
          ['<code>routes/competitors.ts</code>', '<code>SELECT *</code> on <code>competitor_signals</code>: <code>observed_on</code>, <code>source_url</code>, <code>created_at</code> are already returned.']])
        + '<h2>Backend required ◇ #7046</h2>' + tbl(['Change', 'Why'], [
          ['Per-metric provenance in <code>presentMetrics</code>: publisher, URL, confidence and <code>observed_on</code> per metric, with <code>observed_on: null</code> when unknown and <code>updated_at</code> separate', 'Today the shared source and the update-date fallback make an unknown observation date look known'],
          ['A subject on the analysis (<code>subject_uid</code>, directory company) set from the profile link', 'Direct and Adjacent must name what they compete with'],
          ['Optional: read one evidence collection (<code>?part=funding_rounds</code>)', 'Retry one collection without re-reading the company. Until then the frontend re-reads and replaces only the failed collection.']])
        + '<h2>Owner decision ⚑</h2>' + tbl(['Question', 'Drawn'], [['The directory record’s stored <code>competitor_status</code> and <code>diligence_status</code> name no analysis. Show them on the profile?', 'A · not shown on the profile (main prints both as rows of Sources and evidence). B · keep them, worded “as stored on the directory record, not tied to an analysis”. ' + ow('A drawn')]])
        + '<h2>Preserved</h2><p>The five independent reads with their own states, the latestOnly guard when a peer link reuses the page, the Companies House OGL attribution and the record link, Market context, Funds (with D4612 links), the “This is not zero.” claim on Unavailable, Add to research and Compare with focus returned to the opener, and Directory profile → on the candidate.</p>'
        + '<h2>Frontend only</h2><p>Rename Competitors to Sector peers and print the matching rule; peer cards with no minimum width. Evidence collections as disclosures with record tables (wrap to cards under 640) and a record drawer / sheet. Group Not recorded optional fields. CTA copy “Set up competitor analysis →”; <code>analysisHref</code> also passes the sector label and country so Market / industry and Geography are filled, and the subject chip reads the query string. Candidate: show Signals on phone, split company signals from sector and country context (read through <code>directory_uid</code> → profile → markets and geographies, already used by the profile), show <code>observed_on</code> or “recorded on” from <code>created_at</code>. Unsupported tag when a category has no rationale and no source.</p>'
        + '<h2>Components and data</h2>' + tbl(['Component', 'Reads'], [['KindBadge', '“Directory company” ▣ outlined · “Analysis candidate” ◎ violet'], ['MetricCard', 'value, unit/currency, publisher, observed (or Not recorded), updated, evidence count, Inspect'], ['EvidenceCollection', 'one of <code>financials · employment · funding_rounds · sources</code>; status ok/unreadable; rows'], ['EvidenceRecord drawer/sheet', 'every column of the row; blank → Not recorded; 0 → 0'], ['PeerCard', 'name, website, country, same_country, founded, last round, employees'], ['SignalGroup', 'company: competitor_signals · context: market and geography signals']])
        + '<h2>Accessibility</h2><p>Disclosures are buttons with aria-expanded; drawer and sheet are modal dialogs that trap focus and return it to the opener; record tables have captions and row headers; links that open a new tab say so; 44 px targets on phone, 48 px primary; every state is a word and a glyph. Tablet 768: one column, Eadwyn behind a button.</p>')
    };

    let html = '';
    if (B === 'RCP01') html = page(profKR(), { h: 1300, e: { cov: ['Directory record · ' + KR.src, '4 evidence collections read · 0 records', 'Sector peers · 3 of 3 shown'], q1: 'Which UK funds could fit this company?', q2: 'What would add a website to this record?' } });
    else if (B === 'RCP01B') html = page(profHG(), { h: 1470 });
    else if (B === 'RCP01C') html = setup();
    else if (B === 'RCP02') html = page(crumb('Halden Grid') + '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">Halden Grid ' + kindDir + '</h1>' + secnav('Evidence') + evidence(), { h: 1240, rail: false });
    else if (B === 'RCP02B') html = page(head(HG) + secnav('Key metrics') + keyMetrics(4, 0), { h: 900, rail: false, overlay: drawer });
    else if (B === 'RCP03') html = page(crumb('Halden Grid') + '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">Halden Grid ' + kindDir + '</h1>' + secnav('Sector peers') + peers(4, 8), { h: 1000, rail: false });
    else if (B === 'RCP03B') html = analysisCrop();
    else if (B === 'RCP04') html = page(candidate(), { h: 1220, e: { stance: 'This page does not track a company or invent a homepage. Accept writes the summary already on this page.', cov: ['Brightwell Storage: Direct · discovered', '4 sources · 3 company signals', '2 context signals via the directory profile'], un: [['A relationship', 'Direct and Adjacent describe this analysis. Nothing stores a client, a prospect or a comparable.'], ['Headcount and funding', 'Not fields on a competitor row; open the directory profile.']], q1: 'Which claims in the rationale have no source?', q2: 'Compare Brightwell’s pricing with Halden Grid’s' } });
    else if (B === 'RCP06') html = tabProfile();
    else if (B === 'RCP06B') html = tabCand();
    else if (B === 'RCP07') html = states();
    else if (B === 'RCP07B') html = absences();
    else if (B === 'RCP08') html = page(profHG(), { h: 1470 });
    else if (B === 'RCP08P') html = MOB.RCP05A();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
