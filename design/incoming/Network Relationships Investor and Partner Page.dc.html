    const VIEWS = `<div class="seg" role="radiogroup" aria-label="View"><button type="button" role="radio" aria-checked="true">Everyone</button><button type="button" role="radio" aria-checked="false">Founders</button><button type="button" role="radio" aria-checked="false">Co-investors</button><button type="button" role="radio" aria-checked="false">▽ Going cold · 6</button><button type="button" role="radio" aria-checked="false" aria-disabled="true" style="opacity:.55">LPs</button></div>`;
    const INTROLINE = (s) => s === 'load'
      ? `<div class="ldl" role="status"><span class="spin" aria-hidden="true"></span><span><b>Introductions are still loading</b> · 12 s · credits, asks and Request introduction wait for this read only.</span><span class="foot" style="margin-left:auto">The book below is ready and every tie can be opened, logged and reminded.</span></div>`

    const RELPAGE = (o) => `${HEAD({ tab: 'Relationships', h1: 'Relationships', sub: 'Your ties on Axal and the contacts you keep, in two labelled groups with their own counts.', acts: o.intro ? `<button type="button" class="btn ask">${E}Ask</button><button type="button" class="btn p" aria-disabled="true">${o.intro === 'load' ? '◷ ' : ''}Request introduction</button>` : undefined })}

      <span style="margin-left:auto" class="acts"><button type="button" class="btn">↻ Refresh relationships</button><button type="button" class="btn">Import contacts</button><button type="button" class="btn">Add person</button></span></div>
      <section class="cd" aria-labelledby="g1"><div class="ch"><h2 id="g1">On Axal</h2><span class="sm">${N.ties} ties · accepted by both sides</span></div>
      <table class="tbl"><thead>${TIEHEAD}</thead><tbody>${J(TIES.slice(0, o.n || 7).map((t) => tieRow(t, o)))}</tbody></table>${pager(1, 25, N.ties)}</section>
      <section class="cd" aria-labelledby="g2"><div class="ch"><h2 id="g2">Contacts you keep</h2><span class="sm">${N.contacts} contacts · ${N.hand} added by hand · ${N.imp} imported</span></div>
      <table class="tbl"><thead><tr><th scope="col">Person</th><th scope="col">Organization</th><th scope="col">Title</th><th scope="col">Source · owner</th><th scope="col">Notes and follow-ups</th></tr></thead><tbody>${J(CONTACTS.slice(0, o.m || 4).map((c) => `<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td></tr>`))}</tbody></table>${pager(1, 25, N.contacts)}
      <div class="cf"><span class="foot">Two groups, two counts: ${N.ties} ties and ${N.contacts} contacts are never added together. Each group pages on its own.</span></div></section>`;

    /* ---------- the Tie Sheet with the interaction log (NW12.2 sheet, extended) ---------- */
    const OWN = (p) => `<span class="own">✎ Draft for ${p.n} · ${p.co} · ${mo('tie ' + p.id)}</span>`;
    const histList = (p, fresh) => `<ul class="tl">${fresh ? `<li class="new"><span class="mk ok" aria-hidden="true">✓</span><div><b>Call</b> · ${TXT_A.split('.')[0].replace('Call about', 'about')}<div class="foot">logged by you · just now</div></div><span class="w">2026-11-13 <button type="button" class="lk">Void</button></span></li>` : ''}${J(p.hist.map((h) => h[4] ? `<li><span class="mk no" aria-hidden="true">⊘</span><div class="vd"><b>${h[0]}</b> · ${h[1]}</div><span class="w">${h[2]} · voided</span></li>` : `<li><span class="mk ok" aria-hidden="true">✓</span><div><b>${h[0]}</b> · ${h[1]}<div class="foot">logged by ${h[3]}</div></div><span class="w">${h[2]}${h[3] === 'you' ? ' <button type="button" class="lk">Void</button>' : ''}</span></li>`))}</ul>`;
    const histBlock = (p, st, fresh) => st === 'load'

      : st === 'un' ? `<div class="nt r"><span class="ic" aria-hidden="true">?</span><div><b>Unavailable.</b> The touch log for ${p.n} could not be read. This is not a claim that none exist.</div><button type="button" class="btn bt">Retry</button></div>`
      : st === 'none' ? `<p>${NONE('no touch logged for ' + p.n)}</p>` : histList(p, fresh);
    const LOGFORM = (p, st, o) => {
      o = o || {};

      const txt = o.text !== undefined ? o.text : TXT_A;
      const status = {
        draft: `<span class="foot">Not saved yet. If you open another tie, this draft stays with ${p.n}.</span>`,
        saving: `<p class="sub" role="status">◷ Saving the touch to ${p.n} · ${p.co}… You can open another tie; this save stays bound to tie ${p.id}.</p>`,

        offline: `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">○</span><div><b>Offline · not saved.</b> Your text stays in this tab for ${p.n}. Retry when you are back online.</div></div>`,
        discard: `<div class="nt a" role="alertdialog" aria-labelledby="dq"><span class="ic" aria-hidden="true">!</span><div><b id="dq">Discard the draft for ${p.n} · ${p.co}?</b> The text is removed. Nothing was saved, so the tie does not change.</div></div>`
      }[st] || '';
      const btns = st === 'saving' ? `<button type="button" class="btn t" aria-disabled="true">Discard draft</button><button type="button" class="btn p" aria-disabled="true">◷ Saving…</button>`
        : st === 'failed' || st === 'offline' ? `<button type="button" class="btn t">Discard draft</button><button type="button" class="btn p${o.foc ? ' fr' : ''}">Retry save to ${p.f}</button>`
        : st === 'discard' ? `<button type="button" class="btn${o.foc ? ' fr' : ''}">Keep editing</button><button type="button" class="btn p">Discard draft</button>`
        : `<button type="button" class="btn t">Discard draft</button><button type="button" class="btn p">Save touch to ${p.f}</button>`;
      return `<div class="lf${lock ? ' lock' : ''}" role="group" aria-labelledby="lf${p.k}"><div class="lfh"><b id="lf${p.k}">Log a touch</b>${OWN(p)}</div>

        <div class="f"><label for="td${p.k}">When it happened</label><span id="td${p.k}" class="in mo">${o.date || '2026-11-13'}</span></div></div>
        ${status}<div class="acts" style="justify-content:flex-end">${btns}</div></div>`;
    };
    const REMS = (p, o) => {
      o = o || {};
      const form = o.remForm ? `<div class="lf" role="group" aria-labelledby="rf${p.k}"><div class="lfh"><b id="rf${p.k}">Add reminder</b><span class="own">✎ Reminder for ${p.n} · ${p.co} · ${mo('tie ' + p.id)}</span></div>
        <div class="frow"><div class="f"><label for="rn${p.k}">What to re-surface (optional)</label><span id="rn${p.k}" class="in${o.foc === 'rem' ? ' fr' : ''}">${o.remText || 'Ask about the [Kelp Bio] pilot result'}</span><span class="cnt">${(o.remText || 'Ask about the [Kelp Bio] pilot result').length} / 500</span></div><div class="f"><label for="rd${p.k}">Remind me on</label><span id="rd${p.k}" class="in mo">2026-12-01</span></div></div>
        ${o.remState === 'failed' ? `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Reminder not set for ${p.n}.</b> The server did not answer. Your date and text are kept.</div></div>` : o.remState === 'saving' ? `<p class="sub" role="status">◷ Setting the reminder for ${p.n}…</p>` : ''}
        <div class="acts" style="justify-content:flex-end"><button type="button" class="btn t"${o.remState === 'saving' ? ' aria-disabled="true"' : ''}>Discard</button><button type="button" class="btn p"${o.remState === 'saving' ? ' aria-disabled="true"' : ''}>${o.remState === 'failed' ? 'Retry reminder for ' + p.f : o.remState === 'saving' ? '◷ Setting…' : 'Set reminder for ' + p.f}</button></div></div>` : '';
      const set = o.remState === 'saved' ? `<label class="ck new"><input type="checkbox"> Ask about the [Kelp Bio] pilot result <span class="pl v">○ Upcoming</span><small>due 2026-12-01 · just set</small></label>` : '';
      return `<div class="sec"><h3>Reminders <span class="foot">· ${o.remState === 'saved' ? '2' : '1'} upcoming · 1 done</span></h3>${o.remState === 'saved' ? `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Reminder set for ${p.n} · ${p.co}</b> on ${mo('2026-12-01')}.</div></div>` : ''}${form}${set}
        <label class="ck"><input type="checkbox"> ${p.up[0]} <span class="pl v">○ Upcoming</span><small>due ${p.up[1]}</small></label>
        <label class="ck"><input type="checkbox" checked="checked"> <span class="vd">${p.done[0]}</span> <span class="pl g">✓ Done</span><small>done ${p.done[1]}</small></label>
        ${o.remForm || o.noAdd ? '' : '<button type="button" class="btn" style="align-self:flex-start">Add reminder</button>'}</div>`;
    };
    const SHEET = (p, o) => {
      o = o || {};
      const fresh = o.form === 'saved';
      const lt = fresh ? `<span class="mo">2026-11-13</span><small>1 day ago · was ${p.lt}</small>` : `<span class="mo">${p.lt}</span><small>${p.d} days ago</small>`;
      const kept = o.kept ? `<div class="kept" role="status"><span><span aria-hidden="true">✎ </span>Unsaved draft kept for <b>${o.kept.n}</b> · ${o.kept.co} · ${mo('tie ' + o.kept.id)}</span><span style="margin-left:auto" class="acts"><button type="button" class="btn">Open ${o.kept.f}’s tie</button><button type="button" class="btn t">Discard</button></span></div>` : '';

      const tag = o.abs ? 'aside class="sheet-r" style="width:520px"' : 'aside class="sheetx"' + (o.h ? ` style="height:${o.h}px"` : '');
      return `<${tag} role="dialog" aria-modal="true" aria-labelledby="ts${p.k}">

        <div class="dc" style="overflow:hidden">${kept}
        <dl class="st tx" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><dt>Company</dt><dd>${p.co}<small>from their own account</small></dd></div><div><dt>Last touch</dt><dd>${lt}</dd></div>${o.short ? '' : `<div style="grid-column:span 2"><dt>Deal or fund context</dt><dd>${p.ctx}</dd></div>`}</dl>
        <div class="sec"><h3>Touch history</h3>${log}${histBlock(p, o.hist || 'ok', fresh)}${formOpen ? '' : `<button type="button" class="btn${o.focAdd ? ' fr' : ''}" style="align-self:flex-start">Add touch</button>`}</div>
        ${o.noRem ? '' : REMS(p, o)}</div>
        <div class="df"><span class="acts"><button type="button" class="btn ask" aria-disabled="true">${E}Draft a note</button>${TB('#6256')}</span><button type="button" class="btn${formOpen || o.remForm ? '' : ' p'}">Request introduction</button></div></${o.abs ? 'aside' : 'aside'}>`;
    };

    /* the trace column: what the reviewer follows across A → B → A */
    const MINI = (cur, kept) => `<table class="mini" aria-label="On Axal rows"><tbody>${J([A, Bp].map((p) => `<tr${p.k === cur ? ' class="cur"' : ''}><td>${p.k === cur ? '▸ ' : ''}${p.n}${kept && kept.indexOf(p.k) >= 0 ? ' <span class="own">✎ Draft</span>' : ''}</td><td>${p.co}</td><td class="mo">tie ${p.id}</td></tr>`))}</tbody></table>`;
    const EV = (rows) => `<ol class="ev">${J(rows.map((r) => `<li class="${r[3] || ''}"><span class="tm">${r[0]}</span><span class="gl" aria-hidden="true">${r[1]}</span><div>${r[2]}</div></li>`))}</ol>`;

    const E1 = ['14:02:03', '1', `Open ${A.n}. ${mo('GET /relationships/4127/interactions')} starts <small>request a1, keyed to tie 4127</small>`];
    const E2 = ['14:02:05', '2', `Type in Log a touch. The draft is stored under tie 4127.`];

    const E4 = ['14:02:07', '4', `b1 answers. ${Bp.n}’s history shows.`];
    const E5 = ['14:02:09', '◷', `a1 answers late. It is stored under tie 4127 and not drawn: tie 4172 is open. Nothing is announced.`];
    const E6 = ['14:02:12', '5', `Return to ${A.n}. The kept draft and a1’s history show; no new read is needed.`];

    /* ---------- partner (operating partner) firm book ---------- */
    const strength = (b) => b.lt ? `${b.st}<small>${b.c} interactions · last ${b.d} d ago</small>` : `<span class="s">— Not recorded</span><small>${b.c} interactions, none dated</small>`;
    const bookRow = (b, o) => {

    const PSEG = (cur, off) => `<div class="seg" role="radiogroup" aria-label="View">${J([['un', 'Unassigned first'], ['all', 'All'], ['own', 'By owner'], ['cold', '▽ Going cold' + (off ? '' : ' · ' + BK.cold)]].map((x) => `<button type="button" role="radio" aria-checked="${x[0] === cur}">${x[1]}</button>`))}</div>`;
    const PTOOLS = (o) => `<div class="tools" role="toolbar" aria-label="Relationships actions">${PSEG(o.view || 'all', o.off)}<label for="bq" class="sr">Search the firm book</label><input id="bq" class="inp" style="min-width:220px;color:var(--ink);font-family:var(--sg)" placeholder="Search by name or organization"${o.q ? ` value="${o.q}"` : ''}>
      <span style="margin-left:auto" class="acts"><button type="button" class="btn"${o.off ? ' aria-disabled="true"' : ''}>Assign owner</button><button type="button" class="btn p${o.focTool ? ' fr' : ''}"${o.off ? ' aria-disabled="true"' : ''}>Log interaction</button><button type="button" class="btn"${o.off ? ' aria-disabled="true"' : ''}>Export</button></span></div>`;
    const PTILES = (un) => `<section class="tile2" aria-label="Firm book figures">${un ? `<div><span class="eye">Contacts</span><span class="un2">? Unavailable</span><span class="foot">the book could not be read</span></div><div><span class="eye">Unassigned</span><span class="un2">? Unavailable</span><span class="foot">not 0</span></div><div><span class="eye">Platform-sourced</span><span class="un2">? Unavailable</span><span class="foot">not 0</span></div>` : `<div><span class="eye">Contacts</span><b>${BK.all}</b><span class="foot">across ${BK.orgs} organizations</span></div><div><span class="eye">Unassigned</span><b>${BK.un}</b><span class="foot">no one at the firm owns these</span></div><div><span class="eye">Platform-sourced</span><b>${BK.plat}</b><span class="foot">read-only to the firm</span></div>`}<div><span class="eye">Firm-wide warmth score</span><span class="nr2">— Not recorded</span><span class="foot">no such score exists; strength is per row</span></div></section>`;
    const PPAGE = (o) => {
      o = o || {};
      const rows = o.rows || BOOK;
      const body = o.un
        ? `<section class="cd" aria-labelledby="fb"><div class="ch"><h2 id="fb">Contacts</h2>${UN('read failed at 14:06')}</div><div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Your firm book could not be read.</b> This is not an empty book: nothing is shown because nothing could be read. Log interaction, Assign owner and Export are off until it loads.</div><button type="button" class="btn bt">Retry</button></div><div class="cf"><span class="foot">Adding a contact still works; it appears once the book is read again.</span><button type="button" class="btn t">+ Add a contact to the book</button></div></section>`
        : `<section class="cd" aria-labelledby="fb"><div class="ch"><h2 id="fb">Contacts</h2><span class="sm">${o.count || BK.all + ' in All · unassigned first, then coldest'}</span></div>
          ${o.ok || ''}<table class="tbl"><thead><tr><th scope="col">Contact</th><th scope="col">Organization</th><th scope="col">Firm owner</th><th scope="col">Last interaction</th><th scope="col">Strength</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody>${rows.length ? J(rows.map((b) => bookRow(b, o))) : `<tr><td colspan="6">${o.empty}</td></tr>`}</tbody></table>${rows.length ? pager(1, 25, o.tot || BK.all) : ''}
          <div class="cf"><span class="foot">Strength is derived from logged interactions and shows its working on every row.</span><button type="button" class="btn t">+ Add a contact to the book</button></div></section>`;
      return `${HEAD({ eye: 'Network · Work our relationships', h1: 'Relationships', tab: 'Relationships', sub: 'The firm’s book: who you know at client companies, who at the firm owns each contact, and when you last spoke.', acts: `<button type="button" class="btn ask">${E}Ask</button>` })}
        ${PTILES(o.un)}${PTOOLS(o)}${body}`;
    };

    /* partner dialogs: the person picker (toolbar path) and the date dialog (both paths) */
    const dlg = (abs, eye, h, body, foot, w) => `<div class="${abs ? 'dlgc' : 'panel'}" role="dialog" aria-modal="true" aria-labelledby="d${h.length}"${abs ? '' : ` style="width:${w || 520}px"`}><div class="dh"><div><span class="eye">${eye}</span><h2 id="d${h.length}">${h}</h2></div><button type="button" class="ib" aria-label="Close">✕</button></div><div class="dc">${body}</div><div class="df">${foot}</div></div>`;
    const WHO = (b, change) => `<div class="who"><span class="av" style="width:36px;height:36px">${b.i}</span><div><b>${b.n}</b><small>${b.t} · <b>${b.co}</b> · owner ${b.own || 'Unassigned'}</small><small>Last interaction ${b.lt ? mo(b.lt) : 'Not recorded'}</small></div>${change ? '<button type="button" class="btn t">Change person</button>' : ''}</div>`;
    const DATE = (abs, b, o) => {
      o = o || {};
      const st = o.st || 'ready';
      const status = st === 'saving' ? `<p class="sub" role="status">◷ Logging the interaction with ${b.n} · ${b.co}…</p>`
        : st === 'failed' ? `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Not logged for ${b.n} · ${b.co}.</b> The server did not answer. The date and note are kept.</div></div>`
        : st === 'offline' ? `<div class="nt a" role="alert"><span class="ic" aria-hidden="true">○</span><div><b>Offline · not logged.</b> Retry when you are back online; the person, date and note are kept.</div></div>` : '';
      return dlg(abs, o.tool ? 'Log interaction · step 2 of 2' : 'Log interaction', `Log interaction with ${b.n}`, `${WHO(b, o.tool)}
        <div class="frow"><div class="f"><label for="wn">What happened (optional)</label><span id="wn" class="in${o.note ? '' : ' hint'}">${o.note || 'Say what you spoke about…'}</span></div><div class="f"><label for="wd">When it happened</label><span id="wd" class="in mo${o.foc === 'date' ? ' fr' : ''}">${o.date || '2026-11-14'}</span></div></div>
        <p class="foot">The date it happened, not the date you record it. A past date keeps Going cold honest.</p>${status}`,

    else if (B === 'NRI12E') html = phone('Log interaction', `<span class="eye">Step 2 of 2</span><h1 style="font-size:20px;font-weight:800">Log interaction with [Ari Lane]</h1>${WHO(BOOK[1], 1)}<div class="f"><label for="pd">When it happened</label><span id="pd" class="in mo" style="min-height:44px">2026-11-12</span></div><div class="f"><label for="pn2">What happened (optional)</label><span id="pn2" class="in" style="min-height:44px">Coffee about the [Harbor Seed] fund II</span></div><p class="foot">The date it happened, not the date you record it.</p>`, `<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Log for [Ari Lane]</button>`, { back: 1 });
    else if (B === 'NRI12F') html = phone('Relationships', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Logged for [Ari Lane] · [Harbor Seed]</b>, dated ${mo('Thu 2026-11-12')}.</div></div><div class="seg" role="radiogroup" aria-label="View" style="align-self:flex-start"><button type="button" role="radio" aria-checked="false">Unassigned</button><button type="button" role="radio" aria-checked="true">All</button><button type="button" role="radio" aria-checked="false">▽ Cold</button></div>
      ${J([BOOK[0], BOOK[1], BOOK[2]].map((b) => { const u = b.u === 'al'; return `<div class="pc"${u ? ' style="background:var(--posBg)"' : ''}><div class="r1"><div><b>${b.n}</b><br><small>${b.t} · ${b.co} · ${b.own || 'Unassigned'}</small></div></div><small>Last interaction ${u ? '2026-11-12 · 2 days ago' : b.lt ? b.lt + ' · ' + b.d + ' days' : 'Not recorded'}</small><button type="button" class="btn" style="min-height:44px;align-self:flex-start" aria-label="Log interaction with ${b.n}, ${b.co}">Log interaction</button></div>`; }))}`, `<button type="button" class="btn p fr">Log interaction</button>`);

    /* ===== Dark ===== */
    else if (B === 'NRI13B') html = shell('p', PPAGE({ view: 'all' }), { h: 1000, railT: 'Ask about the firm book', overlay: DATE(1, BOOK[1], { tool: 1, date: '2026-11-12', note: 'Coffee about the [Harbor Seed] fund II', st: 'failed' }) });

    /* ===== Prototype and accessibility ===== */
    else if (B === 'NRI14') html = `<div class="${CV} doc doc2"><div><span class="eye">Network Relationships · #7056 · prototype links, focus and announcements</span><h2 style="font-size:22px;margin-top:4px">How the frames link, where focus goes, and what is announced</h2></div>
      <table><thead><tr><th>From</th><th>Action</th><th>Opens</th><th>Focus lands on</th><th>Announced (polite unless marked)</th></tr></thead><tbody>
      <tr><td>NRI5 book</td><td>Press ${A.n}</td><td>NRI2A Tie Sheet A</td><td>Sheet heading “${A.n}”</td><td>“Tie Sheet, ${A.n}, ${A.co}. Loading touches.”</td></tr>
      <tr><td>NRI2A</td><td>Add touch, type</td><td>NRI2A</td><td>What happened</td><td>—</td></tr>
      <tr><td>NRI2A</td><td>Esc, then ${Bp.n} row</td><td>NRI2B</td><td>Sheet heading “${Bp.n}”</td><td>“Draft kept for ${A.n}, ${A.co}.”</td></tr>
      <tr><td>NRI2B</td><td>(late reply for tie 4127)</td><td>NRI2C, unchanged</td><td>Unchanged</td><td>Nothing</td></tr>
      <tr><td>NRI2C</td><td>Open [Jonas Berg]’s tie (kept strip)</td><td>NRI2D</td><td>What happened, text restored</td><td>“Unsaved draft restored for ${A.n}.”</td></tr>
      <tr><td>NRI2D</td><td>Save touch to [Jonas Berg]</td><td>NRI3A</td><td>Stays on the button (busy)</td><td>“Saving the touch to ${A.n}.”</td></tr>
      <tr><td>NRI3A</td><td>503</td><td>NRI3B</td><td>Retry save</td><td>assertive: “Touch for ${A.n} not saved. Your text is kept.”</td></tr>
      <tr><td>NRI3B</td><td>Retry save</td><td>NRI3C</td><td>Add touch</td><td>“Touch saved to ${A.n}, dated 13 November 2026.”</td></tr>
      <tr><td>NRI2D</td><td>Discard draft</td><td>NRI3D</td><td>Keep editing</td><td>alertdialog names the tie</td></tr>
      <tr><td>NRI4A</td><td>Set reminder for [Jonas Berger]</td><td>NRI4B Set</td><td>Add reminder</td><td>“Reminder set for ${Bp.n}, 1 December 2026.”</td></tr>
      <tr><td>NRI7 page</td><td>Row: Log interaction with [Morgan Vale]</td><td>NRI7 dialog</td><td>When it happened</td><td>“Log interaction with Morgan Vale, Loomcraft, dialog.”</td></tr>
      <tr><td>NRI7 dialog</td><td>Log, Cancel or Esc</td><td>NRI7B</td><td>The same row button</td><td>“Interaction logged for Morgan Vale, dated 14 November 2026.”</td></tr>
      <tr><td>Toolbar</td><td>Log interaction</td><td>NRI8A picker</td><td>Person combobox, nothing chosen</td><td>“Who did you speak with? 64 contacts in All.”</td></tr>
      <tr><td>NRI8A</td><td>↓ to [Ari Lane], Enter, Continue</td><td>NRI8B</td><td>When it happened</td><td>“Ari Lane, Harbor Seed, chosen.”</td></tr>
      <tr><td>NRI8B</td><td>Log for [Ari Lane]</td><td>NRI8C</td><td>Toolbar Log interaction</td><td>“Interaction logged for Ari Lane, dated 12 November 2026.”</td></tr>
      <tr><td>NRI9 filter</td><td>Log interaction</td><td>NRI9 empty picker</td><td>Clear search</td><td>“No contact in Going cold matches Morgan.”</td></tr></tbody></table>
      <div class="cols">
      <div><h3>Keyboard</h3><ul><li>Book: Tab reaches search, the view radios, toolbar actions, then rows; each row name opens its Tie Sheet; Esc closes it and returns focus to that name.</li><li>Tie Sheet: heading → kept-draft strip → Add touch → history → reminders → footer. Focus is trapped while it is modal.</li><li>Picker: combobox with ↑ ↓, Home, End, Enter; <code>aria-activedescendant</code> moves, selection only on Enter or tap. Continue is off until a person is chosen.</li><li>Date dialog: the person card and Change person, then What happened, When it happened, Back, Cancel, Log. Focus starts on When it happened. Back returns to the picker with the choice kept.</li></ul>
      <h3 style="margin-top:12px">Screen readers</h3><ul><li>One polite live region per sheet or dialog for loading and saved; failures use <code>role="alert"</code>.</li><li>A late read for a tie that is not open is never announced.</li><li>Every Save, Retry and Log names the person: “Save touch to [Jonas Berg]” is read with the form’s group label “Log a touch, draft for Jonas Berg, Elm Studio, tie 4127”.</li></ul></div>
      <div><h3>Phone keyboard</h3><ul><li>The sticky Save sits above the keyboard (NRI12A); the form scrolls, the header with the name stays.</li><li>Date uses the native date picker; text uses <code>enterkeyhint="done"</code>, so Return does not save.</li><li>Targets are 44 px; the primary is full width in the sticky bar.</li></ul>
      <h3 style="margin-top:12px">Error recovery</h3><ul><li>Failed save: text, date and tie kept; Retry resends the same body to the same tie.</li><li>Offline: nothing is queued in the background; Retry is a human action.</li><li>Failed read: Unavailable with Retry, never 0 and never an empty list.</li><li>Leaving a sheet with a draft keeps it for that tie until Discard or reload. ${TO('Q2 · A, tab memory only')}</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NRIH') html = `<div class="${CV} doc"><div><span class="eye">Network Relationships · investor and partner interactions · #7056 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what is frontend work, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>pages/investor/InvestorNetworkWorkspace.jsx</code>: one <code>touchNote</code>, <code>touchDate</code>, <code>reminderDate</code> and <code>reminderNote</code> for the whole page, so a draft typed on one tie shows in the next tie’s form. <code>readTouchLog</code> sets <code>touchLog</code> after its await without checking which tie is open, so a late reply for A replaces B’s history.</li>
      <li>The same file’s <code>load()</code> awaits <code>Promise.allSettled</code> over five reads (ties, summary, propositions, asks, reminders) and sets nothing until all answer: a slow propositions read keeps the book on its skeleton.</li>
      <li>Touch history (Void, recorder), the Reminders view (upcoming and done) and the open-reminder chip exist (#6259, #6453). Investors see one book table with a Strength column; the two groups are NW12.2, not built.</li>
      <li><code>pages/RelationshipsPage.jsx</code>: the toolbar handler is <code>setLogging(visible[0]?.uid || rows[0]?.uid)</code>: the first visible contact, or an off-filter contact when the view is empty. <code>LogModal</code> shows “Log an interaction” and a date, never the person; it is not a labelled dialog and returns focus nowhere. A failed <code>GET /book</code> sets <code>items: []</code> and the page says “Your book is empty”.</li>
      <li><code>routes/partnernet.ts</code>: <code>POST /relationships/:id/interactions</code> (note, <code>interacted_at</code>, 400 <code>touch_requires_substance</code>), <code>GET</code> (503 <code>interactions_unreadable</code>, up to 200 rows), <code>/void</code> (409 <code>already_void</code>), <code>POST /relationships/:id/reminders</code>, <code>GET /reminders?all=1</code>, <code>PATCH /reminders/:uid</code>; <code>GET /book</code> (500 rows), <code>POST /book/:uid/interactions</code> (<code>happened_at</code>, optional note, answers <code>{ ok: true }</code>).</li>
      <li><code>workspaces/partnerZoneActions.js</code> (Assign owner, Log interaction, Export) and <code>partnerZoneFilters.js</code> (Unassigned first, All, By owner, Going cold).</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>NW12.2’s page, the two groups with their own counts and pagers, and the Tie Sheet (#6256). Board keys carry the NRI prefix; sections are NW12.2-L1 to L6 and NW2-OP1 to OP4.</li></ul></div>
      <div><h3>Frontend only</h3><ul><li>Drafts, history reads and save results keyed by relationship id (contact uid for partners); a reply for a tie that is not open is stored, not drawn.</li><li>The save binds the tie id captured when Save is pressed; Discard is the only way a draft is removed.</li><li>Each section of the investor workspace sets its state when its own read answers.</li><li>Partner: a row path that opens the date dialog with the person; a toolbar path that opens a person picker scoped to the current view with no default; the date dialog names person and firm and collects the note the route already accepts; focus returns to the opener; a failed book read is Unavailable, not empty.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇)</h3><ul><li>An idempotency key on <code>POST /relationships/:id/interactions</code> and <code>POST /book/:uid/interactions</code>, so a Retry after a lost reply cannot record a touch twice (#7056).</li><li>Optional: <code>POST /book/:uid/interactions</code> returns the row it wrote (#7056).</li><li>Refusing support-session writes on <code>/api/partnernet/*</code> (#6256).</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑)</h3><ul><li>Q1 A: switching ties keeps each tie’s draft (B: ask to save or discard first).</li><li>Q2 A: drafts live in the tab only and are gone after a reload (B: keep them on the device).</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>The picker searches the book already read (up to 500 rows); a firm with more needs a server search.</li><li>The investor Strength column on main is not in NW12.2; this canvas follows NW12.2.</li><li>Focus, announcements, keyboard and phone keyboard are on the Prototype and accessibility board.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nri-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
