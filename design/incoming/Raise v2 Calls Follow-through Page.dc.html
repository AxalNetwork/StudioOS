    const confirmSheet = () => '<div class="dim2"></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="cfh" style="top:150px;width:560px;z-index:8"><div class="drh"><div class="tr"><span class="eye">[Investor A] · Capital relationships</span><button type="button" class="ib" aria-label="Close">✕</button></div><h2 id="cfh">Record a commitment</h2></div><div class="drb" style="gap:14px">'
      + '<fieldset class="rac-fmt" style="grid-template-columns:1fr 1fr"><legend class="eye">Status</legend><label class="on"><input type="radio" name="s" checked> <b>Signed</b><span>Counts toward the target</span></label><label><input type="radio" name="s"> <b>Wired</b><span>Counts toward the target</span></label></fieldset><p class="raw" style="margin-top:-6px">Soft stays as it is and is not counted.</p>'
      + '<div class="fld"><label for="amt">Amount <span>USD · typed by you</span></label><div class="selb" id="amt"><span class="mo">[$45,000]</span></div><span class="rac-diff">≠ Differs from the indicated [$50,000]</span></div>'
      + '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Only record what the investor has signed or wired. Indicated amounts are never counted.</b></div></div>'
      + '<p class="raw">Writes the investor’s pipeline line from Soft to Signed (<code>PUT /api/contacts/raise-prospects/:id</code>) ' + FLAG('Q4 · A') + '. The link back to this response is not stored ' + BE('#6053') + '; until it is, this sheet names the call in its own copy.</p></div>'
      + '<div class="drf" style="border-radius:0 0 16px 16px"><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Record as Signed</button></div></div></div>';
    const commitRail = prop('Proposal · a reason to confirm', '[Investor A] wrote “signed the SAFE” in a question on 5 Oct', 'This could mean the SAFE is signed. Check with the investor before you record it.', ['Accept as a note', 'Edit', 'Discard']) + '<p class="raw">Eadwyn never records a commitment.</p>';
    const CRL = [['[Investor A]', [['Signed', '[$45,000]', 1, 'Moved from Soft · 14 Nov'], ['Indicated through [Seed extension]', '[$50,000]', 0, '']], 1], ['[Investor D]', [['Wired', '[$50,000]', 1, ''], ['Indicated through [Seed extension]', '[$75,000]', 0, '']], 0], ['[Investor B]', [['Soft', '[$100,000]', 0, ''], ['Indicated through [Seed extension]', '[$100,000]', 0, '']], 0], ['[Investor E]', [['Signed · EUR', '[€45,000]', 0, 'Other currency'], ['Indicated through [Seed extension]', '[$50,000]', 0, '']], 0]];
    const commitments = () => mhead('Capital relationships / Commitments', 'Fundraising pipeline', 'Investors, conversations and commitments for [Seed round].', 'Follow up (3)', '<button type="button" class="btn">Add investor</button>', TABS, 'Commitments')
      + '<div class="rac-cm">' + kfig([['Committed against the target', '[$695,000]', 'of [$1,500,000] · was [$650,000] before 14 Nov']]) + '<dl><dt>' + SH.ok + ' Counts</dt><dd>Received · Signed · Wired · Confirmed · Pending</dd><dt>' + SH.na + ' Listed, never counted</dt><dd>Indicated · Soft · Status not recorded · Other currency</dd></dl></div>'
      + '<section class="cd"><div class="ch"><h2>Commitments by investor</h2><span class="sm">Each investor counts once, by their strongest line · showing 4 of 14</span></div><table class="tbl"><thead><tr><th>Investor</th><th>Line</th><th class="n">Amount</th><th>Counted</th><th>Note</th></tr></thead><tbody>'
      + J(CRL.map(c => J(c[1].map((l, i) => '<tr class="' + (c[2] && i === 0 ? 'rac-hl' : '') + '"><td>' + (i === 0 ? '<b>' + c[0] + '</b>' : '') + '</td><td>' + l[0] + '</td><td class="n">' + l[1] + '</td><td>' + (l[2] ? st('Ready', 'Counted') : st('Not applicable', 'Not counted')) + '</td><td class="raw">' + l[3] + '</td></tr>')))) + '</tbody></table><p class="raw">The Indicated line names its call. The Signed line keeps no call uid yet ' + BE('#6053 link to the response') + '</p></section>';

    /* ---------- CLS23 · conflicts ---------- */
    const conflicts = () => crop('<span class="eye">RAC23 · Confirm · conflicts</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">'
      + box('Already recorded', '<p style="font-size:12.5px">[Investor D] indicated <span class="mo">[$75,000]</span> on 5 Oct.</p><button type="button" class="btn bsm" aria-disabled="true">' + SH.ok + ' Already recorded as Wired · [$50,000]</button><p class="raw">The response never overwrites a Signed or Wired line.</p>')
      + box('Other currency', '<p style="font-size:12.5px">[Investor E]’s line is <span class="mo">[€45,000]</span>; the round is in USD.</p>' + st('Not applicable', 'Other currency') + '<p class="raw">Listed, never added to the USD total.</p>')
      + box('Withdrawn or blank', '<p style="font-size:12.5px">[Investor F] replaced the response on 8 Oct with no amount.</p><dl class="kv2" style="grid-template-columns:90px minmax(0,1fr)"><dt>Indicated</dt><dd>' + NREC + '</dd></dl><p class="raw">Amount not recorded is never drawn as $0. Record a commitment opens with Amount empty.</p>')
      + box('No pipeline line', '<p style="font-size:12.5px">[Investor G] is not in Capital relationships yet.</p><button type="button" class="btn bsm" aria-disabled="true" aria-describedby="g1">Record a commitment</button><span class="raw" id="g1">Off: there is no line to record against.</span><button type="button" class="btn p bsm" style="align-self:flex-start">Add to Capital relationships</button>') + '</div>', 1300);

    /* ---------- CLS24 · states ---------- */
    const sk = (w) => '<span class="sk" style="height:12px;width:' + w + '%"></span>';
    const states = () => crop('<span class="eye">RAC24 · States · Zero, Not recorded and Unavailable never look alike</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">'
      + box('Loading', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px">' + sk(40) + sk(80) + sk(65) + '</div><p class="raw">Each sheet (Remind, Export, New call, Record) announces “Loading [sheet]”; its primary stays off.</p>')
      + box('Not recorded', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Last reminded</dt><dd>' + NREC + '</dd><dt>Counsel approved</dt><dd>' + NREC + '</dd><dt>Cap · discount</dt><dd>' + NREC + '</dd><dt>Indicated</dt><dd>' + NREC + '</dd><dt>Answer</dt><dd>' + NREC + '</dd></dl>')
      + box('Measured zero', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Not opened</dt><dd class="mo">' + st('Measured zero', '0 of 30') + '</dd></dl><p class="raw">Read and counted: nobody is left.</p>')
      + box('Call unreadable', '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>[Seed extension] could not be read.</b><div>Remind, Export and Start a new call are off. The summary from the list still shows.</div></div></div><p class="raw">Closed 12 Oct · 11 of 24 responded · [$410,000] indicated</p><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + box('Commitments unreadable', '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Capital relationships could not be read; your record is saved.</b><div>Signed · [$45,000] was written to the pipeline.</div></div></div>' + st('Unavailable', 'Committed total unavailable'))
      + box('Refused · co-founder', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>Only the venture’s owner can do this. Ask ' + OWN + '.</b></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn bsm" aria-disabled="true">Remind</button><button type="button" class="btn bsm" aria-disabled="true">Export</button><button type="button" class="btn bsm">Record a commitment</button><button type="button" class="btn bsm">Start a new call</button></div>')
      + box('Admin and Explorer · HQ counsel', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>You do not have access to this call.</b><div class="mu">Admin and Explorer see CLS14’s card. HQ counsel reads only and sees none of these actions.</div></div></div>')
      + box('Saving and save failed', st('In progress', 'Saving…') + '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Someone else changed this call.</b><div><code>call_changed</code>: reload. Your edits are kept here; nothing is lost.</div></div><span class="bt"><button type="button" class="btn bsm">Reload</button></span></div>') + '</div>', 1400);

    /* ---------- phones ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative;overflow:hidden"><div class="pt"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const full = (title, inner, foot) => '<div class="rac-full" role="dialog" aria-modal="true" aria-label="' + title + '"><div class="pt"><button type="button" class="pi" aria-label="Close">✕</button><b style="font-size:15px">' + title + '</b><span style="width:44px"></span></div><div class="pbd" style="overflow:hidden">' + inner + '</div>' + (foot ? '<div class="rac-sticky">' + foot + '</div>' : '') + '</div>';
    const mcard = (r) => '<label class="mc rac-mc' + (r[9] ? ' rac-dis' : '') + '"><div class="r1"><span style="display:flex;gap:10px;align-items:center">' + cb(r[8], !!r[9], 'Select ' + r[0]) + '<b>' + r[0] + '</b></span></div><small>' + (r[3] ? 'Opened ' + r[3] + ' · not answered' : 'Not opened') + ' · ' + (r[6] === 'Never' ? 'never reminded' : 'reminded ' + r[6]) + '</small>' + (r[9] ? '<small>⦸ ' + r[9] + '</small>' : '') + '</label>';
    const MOB = {
      RAC25a: () => phone('[Bridge call]', '<div class="rax-sl">' + st('In progress', 'Open') + '<span class="stt">Closes <span class="mo">&nbsp;27 Nov</span></span></div><div class="chips" style="flex-wrap:nowrap;overflow:hidden">' + J([['Not opened', '9', 1], ['Opened, not answered', '7', 1], ['Not delivered', '1', 0]].map(c => '<button type="button" aria-pressed="' + !!c[2] + '" aria-checked="' + !!c[2] + '" style="min-height:44px">' + c[0] + ' <span>' + c[1] + '</span></button>')) + '</div><span class="raw">Since 6 Nov · out of 30 recipients · chips scroll sideways</span>' + J([RROWS[0], RROWS[2], RROWS[4], RROWS[5]].map(mcard)), '<div class="rac-sticky"><span>12 selected</span><button type="button" class="btn p" style="min-height:48px">Remind (12)</button></div>'),
      RAC25b: () => phone('[Bridge call]', '', full('Remind 12', '<span class="eye">What they receive</span><div class="rac-pv"><b>A private round call</b><p>[Northwind Labs] invited you to a private round call. It closes on 27 Nov.</p></div><p class="raw">No email. Nothing about who else was asked.</p><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Not answered</dt><dd>6 · 1 not named</dd><dt>Not opened</dt><dd>6 · 1 not named</dd></dl><p style="font-size:13px">At most 2 per recipient, 3 days apart.</p>' + FLAG('Q2 · A'), '<button type="button" class="btn" style="min-height:48px">Cancel</button><button type="button" class="btn p" style="min-height:48px">Remind 12</button>')),
      RAC25c: () => phone('[Seed extension]', '', full('Export responses', '<span class="eye">Format</span><fieldset class="rac-fmt" style="grid-template-columns:1fr"><label><input type="radio" name="f"> <b>CSV</b><span>For the cap table</span></label><label class="on"><input type="radio" name="f" checked> <b>PDF</b><span>For counsel</span></label></fieldset><span class="eye">Included</span><p style="font-size:13px">Terms and counsel approval, 20 named recipients’ dates, indicated amounts marked “Indicated, not committed”, 7 questions.</p><span class="eye">Withheld</span><p style="font-size:13px">[4] matching investors (counted only), emails, Eadwyn’s notes.</p>', '<button type="button" class="btn" style="min-height:48px">Cancel</button><button type="button" class="btn p" style="min-height:48px">Export</button>')),
      RAC26a: () => phone('Calls', '<div class="mc"><div class="r1"><b>[Seed extension]</b>' + st('Shared', 'Closed') + '</div><small>Closed 12 Oct · 11 of 24 responded</small><small>[$410,000] indicated, not committed</small><button type="button" class="btn p" style="min-height:48px">Start a new call from this</button></div><span class="raw">Drawn as of 3 Nov, before [Bridge call] existed.</span>'),
      RAC26b: () => phone('Calls', '', full('New call · terms', BANNER.replace(BE('“Started from” is not stored · #6053'), '') + STEPS(1) + fld('Amount', '<span class="mo">[$400,000]</span>', CAR, 'Was [$500,000]') + fld('Instrument', 'SAFE', CAR) + fld('Close date', '<span class="ra-mut">dd mmm yyyy</span>', NEWF, 'Not carried. Today or later.') + '<p class="raw">Deck: v6 offered · the closed call used v5. Counsel is needed again.</p>', '<button type="button" class="btn p" style="min-height:48px;flex:1">Save draft and continue</button>')),
      RAC26c: () => phone('[Investor A]', '<div class="rac-ind"><b>Indicated <span class="mo">[$50,000]</span> on 3 Oct through [Seed extension]</b><p>An intention, not a commitment. Not counted.</p></div><dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Opened</dt><dd class="mo">1 Oct</dd><dt>Responded</dt><dd class="mo">3 Oct</dd></dl>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rcm"><div class="grab" aria-hidden="true"></div><div style="padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px"><h2 id="rcm" style="font-size:17px;font-weight:800">Record a commitment</h2><fieldset class="rac-fmt" style="grid-template-columns:1fr 1fr"><legend class="sr">Status</legend><label class="on" style="min-height:44px"><input type="radio" checked> <b>Signed</b></label><label style="min-height:44px"><input type="radio"> <b>Wired</b></label></fieldset><div class="fld"><label>Amount <span>USD</span></label><div class="selb" style="min-height:44px"><span class="mo">[$45,000]</span></div><span class="rac-diff">≠ Differs from the indicated [$50,000]</span></div><p style="font-size:13px;font-weight:700">Only record what the investor has signed or wired. Indicated amounts are never counted.</p><button type="button" class="btn p" style="min-height:48px">Record as Signed</button><button type="button" class="btn" style="min-height:44px">Cancel</button></div></div>'),
      RAC27P: () => phone('Calls', '<div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>Calls for Capital are not switched on yet.</b><div class="mu">Remind, Export and Start a new call are not drawn (#1008 item 19).</div></div></div>'),
      RAC27R: () => phone('[Bridge call]', '<span class="eye">Signed in as ' + COF + ' · co-founder</span><div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>Only the venture’s owner can remind or export. Ask ' + OWN + '.</b></div></div><button type="button" class="btn" aria-disabled="true" style="min-height:44px">Remind</button><button type="button" class="btn" aria-disabled="true" style="min-height:44px">Export responses</button><div class="mc"><b>[Investor A] · responded</b><small>Indicated [$50,000], not counted</small><button type="button" class="btn p" style="min-height:48px">Record a commitment</button></div>')
    };

    /* ---------- CLS27 · switched off (desktop) ---------- */
    const offDesk = () => crop('<span class="eye">RAC27 · ROUND_CALLS_ENABLED off · CLS1’s card</span><section class="cd" style="padding:24px 26px;gap:10px;align-items:flex-start"><h2 style="font-size:19px;font-weight:800">Calls for Capital are not switched on yet.</h2><p style="font-size:13.5px;color:var(--mu);max-width:620px">A call lets you invite verified investors privately, with counsel’s approval. It is waiting for counsel to sign off (#1008 item 19).</p><p class="raw">Remind, Export and Start a new call are not drawn at all, not drawn as off. <code>GET /api/round-calls/availability</code> decides.</p></section>', 900);

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RACH: () => dk('<h1>Handoff · Calls follow-through (#6053)</h1><p>Checked against main <code>6d7712c6d1</code> on 14 Nov 2026. Board numbers continue the brief’s CLS16 to CLS28 as RAC16 to RAC28, drawn in the Raise v2 look. The whole area is behind <code>ROUND_CALLS_ENABLED = "false"</code> in <code>wrangler.toml</code> (#1008 item 19), so none of it can be checked live until counsel answers.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['services/roundCalls.ts', '<code>manageCall</code> (line 490) accepts only <code>close</code> and <code>extend</code>, owner only. <code>founderPage</code> returns recipients with origin, opened, data room, responded, delivery and indicated amount, the questions plus update-ask replies, <code>can.*</code> (draft and answer: owner or member; audience, send, extend, close: owner) and <code>read_only</code>.'],
          ['sql/migrations/436, 456', '<code>round_call_recipients</code> has <code>notified_at</code> and <code>delivery_state</code> but no reminder columns. <code>round_calls</code> has no source-call column and no currency.'],
          ['routes/round_calls.ts', 'No export, CSV or PDF route; no remind route.'],
          ['services/capRelReads.ts', '<code>COUNTED</code> = received, signed, wired, confirmed, pending. Indicated, Soft, Status not recorded and other currency are listed, not counted. Investors are matched by email; the strongest line counts once.'],
          ['routes/contacts.ts', '<code>PUT /api/contacts/raise-prospects/:id</code> (<code>updateLegacyProspect</code>) writes the pipeline line; <code>roundCallPipelineStatements</code> writes the Soft line on a response.'],
          ['pages/raise/calls/callsModel.js', '<code>newCallState</code>: “One call at a time. [name] is open.” (used on RAC21).'],
          ['RaiseCallPage.jsx, CallsTab.jsx', 'No export, remind or copy code.']])
        + '<h2>Requires engineering ◇</h2>' + tbl(['Need', 'Detail'], [['Remind', 'A <code>remind</code> action (owner only), <code>last_reminded_at</code> and a reminder count per recipient, the limit, and a result with the not-delivered count. Migration named <code>YYYYMMDDHHMM_6053_round_call_reminders.sql</code>.'], ['Export', 'CSV and PDF routes, the withheld rules, a “Questions could not be read” mark, and an export log (who, when).'], ['Started from', 'A source-call column on <code>round_calls</code>.'], ['Line to response link', 'A call uid on the typed Signed or Wired line, so it can link back to its response.']])
        + '<h2>Pending the owner ⚑ (option A drawn)</h2><p>Q1 remind and export: owner only. Q2 limit: 2 per recipient per call, 3 days apart. Q3 emails withheld from the export. Q4 Record a commitment writes the pipeline line Soft to Signed or Wired. Q5 counsel is not notified of an export.</p>'
        + '<h2>Frontend only</h2><p>Filter chips and the selection on the call page, the Remind and Export sheets’ layout, the copied banner and carried-field marks in the new-call sheet, the indicated-versus-recorded block in the drawer, the confirm sheet over the existing write, phone cards, sticky bar, full-screen sheets and dark tokens.</p>'
        + '<h2>Handoff paths</h2><p>Confirm ends on Capital relationships › Commitments (CRL9) with the investor’s line highlighted. A new call goes to the new-call sheet (CLS4) as a draft, then to counsel (CLS6). Export ends on the call page with the dated export row.</p>'
        + '<h2>Accessibility</h2><p>Filter chips are toggle buttons with <code>aria-pressed</code> and counts in text. Disabled checkboxes and actions carry their reason in text (<code>aria-describedby</code>). Sheets are modal dialogs that trap and return focus; the result line uses <code>role=status</code>, failures <code>role=alert</code>. States carry a word and a glyph: ⦸ limit, ◷ too soon, ≠ differs, ✓ counted. Phone targets 44px, primary 48px; no table wider than the screen.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RAC16') html = page(remindPage(), { h: 1240, rail: remindRail });
    else if (B === 'RAC16B') html = page(remindPage(), { h: 1240, overlay: remindSheet() });
    else if (B === 'RAC17') html = remindResult();
    else if (B === 'RAC18') html = page(seedClosedPage(true), { h: 960, overlay: exportSheet() });
    else if (B === 'RAC18B') html = exportRows();
    else if (B === 'RAC19') html = exportStates();
    else if (B === 'RAC20') html = page(seedClosedPage(), { h: 960 });
    else if (B === 'RAC20B') html = page(seedClosedPage(), { h: 1120, overlay: step1() });
    else if (B === 'RAC20C') html = page(seedClosedPage(), { h: 960, overlay: step3Page() });
    else if (B === 'RAC20D') html = crop('<span class="eye">Step 3 · a co-founder who started the copy</span><section class="cd" style="padding:0">' + step3(true) + '</section>', 900);
    else if (B === 'RAC21') html = crop('<span class="eye">RAC21 · Start a new call · blocked</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' + box('Another call is open', '<div class="mc"><div class="r1"><b>[Seed extension]</b>' + st('Shared', 'Closed 12 Oct') + '</div><small>11 of 24 responded · [$410,000] indicated, not committed</small><div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn bsm" aria-disabled="true" aria-describedby="r21">Start a new call from this</button><span class="raw" id="r21">One call at a time. [Bridge call] is open.</span></div></div><p class="raw">Same reason text as CLS2’s New call (<code>newCallState</code>).</p>') + box('No closed call yet', '<div class="mc"><div class="r1"><b>[Bridge call]</b>' + st('In progress', 'Open') + '</div><small>Sent 6 Nov · closes 27 Nov</small></div><p class="raw">This venture has no closed call, so “Start a new call from this” does not appear anywhere. Nothing is drawn off.</p>') + '</div>', 1100);
    else if (B === 'RAC22') html = page(seedNow() + seedFig() + '<section class="cd"><div class="ch"><h2>Responses</h2></div>' + seedTable('[Investor A]') + '</section>', { h: 960, rail: commitRail, overlay: drawer(false).replace('style="width:560px"', 'style="width:560px;right:330px"') });
    else if (B === 'RAC22B') html = page(seedNow() + seedFig() + '<section class="cd"><div class="ch"><h2>Responses</h2></div>' + seedTable('[Investor A]') + '</section>', { h: 960, overlay: drawer(false) + confirmSheet() });
    else if (B === 'RAC22C') html = page(commitments(), { h: 900, overlay: '<div class="toast" role="status"><span class="ok" aria-hidden="true">✓</span>Recorded as Signed · [$45,000] · [Investor A]<a href="#">Open line</a></div>' });
    else if (B === 'RAC22D') html = crop('<span class="eye">The drawer after saving</span><div style="position:relative;height:720px;border:1px solid var(--hair);border-radius:12px;overflow:hidden">' + drawer(true).replace('<div class="dim1"></div>', '').replace('style="width:560px"', 'style="width:100%;border-radius:0;box-shadow:none;border-left:0"') + '</div>', 600);
    else if (B === 'RAC23') html = conflicts();
    else if (B === 'RAC24') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'RAC27') html = offDesk();
    else if (B === 'RAC28') html = page(remindPage(), { h: 1240, rail: remindRail });
    else if (B === 'RAC28B') html = page(seedNow() + seedFig() + '<section class="cd"><div class="ch"><h2>Responses</h2></div>' + seedTable('[Investor A]') + '</section>', { h: 960, overlay: drawer(false) + confirmSheet() });
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(remindPage(), { h: 1240, rail: remindRail });
    return { html: { __html: html } };
  }
}
