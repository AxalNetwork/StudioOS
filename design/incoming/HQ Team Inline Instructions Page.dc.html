    const UNB_REVIEW = (ph) => DLG({ alert: 1, tone: 'neg', w: ph ? 358 : 540, eb: 'Step 2 of 3 · Review', title: 'Unbind [Paul Weber] from de?', body: SUMM([['Administrator', '[Paul Weber] · paul@example.com'], ['Branch', 'de [Axal Germany]'], ['Reason', 'Left [Axal Germany] on 20 Nov; licence owner asked HQ to remove his access']]) + `<ul style="margin:0;padding:10px 12px 10px 28px;border-radius:9px;background:var(--negT);border:1px solid var(--negE);font-size:12.5px;line-height:1.55;color:var(--body)"><li><b style="color:var(--ink)">The admin role is removed</b> and his role becomes Exploring.</li><li><b style="color:var(--ink)">His account on de is deactivated</b>; any session stops at its next request.</li><li>No security notice is sent. Nothing on this page undoes it.</li></ul><p style="margin:0;font-size:12px;color:var(--mut)">Next you will be asked for your authenticator code.</p>`, btns: `${bS('Back', SM + FOC)}${bN('Unbind from de', SM)}` });
    const STEPUP = (ph) => `<div role="dialog" aria-modal="true" aria-label="Confirm it’s you" style="width:${ph ? 390 : 384}px;background:var(--card);border:1px solid var(--line);border-radius:${ph ? '16px 16px 0 0' : '16px'};box-shadow:0 20px 50px rgba(0,0,0,.25);padding:22px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box"><div style="display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="width:36px;height:36px;border-radius:9px;background:var(--lav);color:var(--vdeep);display:grid;place-items:center;font-weight:800">✓</span><div style="flex:1"><h3 style="margin:0;font-size:14px;font-weight:800">Confirm it’s you</h3><span style="font-size:11.5px;color:var(--mut)">Sensitive action — re-enter your code</span></div>${ICO.x}</div><p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--body)">This action requires a recent authenticator check. Enter the current 6-digit code from your authenticator app to continue.</p><span style="display:block;height:48px;border-radius:9px;border:1px solid var(--vio);box-shadow:0 0 0 3px var(--lav);background:var(--raised);${M};font-size:24px;letter-spacing:.5em;text-align:center;line-height:48px;color:var(--ink)">48 21··</span><div style="display:flex;gap:8px">${bS('Cancel', 'flex:1;' + (ph ? 'min-height:44px' : ''))}${bP('Confirm', 'flex:1;opacity:.5;' + (ph ? 'min-height:44px' : ''))}</div><span style="font-size:10.5px;color:var(--faint);text-align:center">Keeps you signed in — only confirms this one action.</span></div>`;

    /* ---------- moves to finish (scenario C) ---------- */
    const MTF = (o) => {

      else if (o.result === 'unknown') body = OUTCOME({ who: '[Maya Ruiz]', from: 'fr', to: 'ib', fail: 'The answer did not arrive, so whether the invitation was created is not known. Read the moves again before retrying; a retry cannot create a second invitation for this move.', retry: `<span>${bS(ICO.refresh + 'Read the moves again', SM)}</span>` });
      else body = `<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:14px;align-items:center"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:13px;color:var(--ink)">[Maya Ruiz] · founder</b><span style="font-size:11.5px;color:var(--mut)">maya@example.com · ${BR('fr')} → ${BR('ib')} · started 26 Nov 16:40</span></span><span style="display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--neg)">${GL.tri}<span>Invitation did not land. ${fail}</span></span>${o.open ? `<span style="${BTN}${SM}border:1px solid var(--vio);background:var(--lav);color:var(--vdeep)" aria-expanded="true">Retry invitation ▴</span>` : bP('Retry invitation', SM + (o.focus ? FOC : ''))}</div>${o.open ? RETRYP() : ''}`;

    const RETRYP = () => `<div role="region" aria-labelledby="r-h" style="border:1px solid var(--lavE);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1"><h3 id="r-h" style="margin:0;font-size:15px;font-weight:800">Retry the invitation for [Maya Ruiz] on ib</h3><span style="font-size:12.5px;color:var(--mut)">Move from fr [Axal France] to ib [Axal Iberia] · attempt 2</span></div><button type="button" aria-label="Close, back to [Maya Ruiz]" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--body);display:grid;place-items:center;padding:0">${ICO.x}</button></div><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px">${PRES([['met', 'You hold the Super Admin elevation'], ['met', 'HQ recorded that fr closed the account'], ['met', 'No other retry is running for this move'], ['ask', 'Your authenticator code and a fresh step-up']])}${CONS('What the retry does', ['<b style="color:var(--ink)">Asks ib to invite maya@example.com as founder</b>, as fr recorded her when it closed the account. Nothing typed here reaches the invitation.', 'If ib already stored an invitation for this move, that one is used. A retry cannot create a second.', 'ib reports whether its mailer sent the email. If it did not, the link is shown to you once, to pass on yourself.', 'Until she accepts on ib, she has no active account on either branch.'])}</div><div style="display:flex;gap:10px">${bP('Retry invitation', SM)}${bG('Cancel', SM)}</div></div>`;

    /* ---------- lower page: what used to lead ---------- */

    /* ---------- desktop page ---------- */
    const PAGE = (o) => {

    const PHIT = (b, o) => {

      return `<div style="border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px"><span style="display:flex;align-items:center;gap:8px">${BR(b)}<span style="font-size:12px;color:var(--mut)">${b === 'fr' ? '[Axal France]' : '[Axal Germany]'}</span></span><span style="display:flex;flex-direction:column;gap:1px"><b style="font-size:14px">${h.who}</b><span style="font-size:12px;color:var(--mut)">${h.e} · ${h.role} · active · ${h.st}</span></span><span style="display:flex;gap:8px">${h.acts.map(btn).join('')}</span></div>`;

    const PPRES = (rows) => `<section style="display:flex;flex-direction:column;gap:2px"><h3 style="margin:0;font-size:11.5px;${M};letter-spacing:.06em;text-transform:uppercase;color:var(--mut)">Before you confirm</h3><ul style="margin:0;padding:0">${rows.map(r => PRE(r[0], r[1]).replace('grid-template-columns:124px', 'grid-template-columns:112px')).join('')}</ul></section>`;

    const DOC = (eb, title, inner) => `<div style="padding:32px 36px;display:flex;flex-direction:column;gap:22px;background:var(--bg)"><div style="display:flex;flex-direction:column;gap:6px">${EB(eb)}<h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em">${title}</h1></div>${inner}<p style="margin:0;font-size:12px;color:var(--mut)">Sample content only: [Iris Chen], [Tom Becker], [Ana Lopes], [Dr. Jonas Weber], [Paul Weber], [Maya Ruiz], their addresses, the six branches and their codes, and every figure (3 administrators, 6 branches, 64 accounts) are bracketed and fictional. Design only.</p></div>`;

    /* ================= boards ================= */
    let w = 1440, h = 900, inner = '';
    const S1 = `<span style="position:absolute;left:-36px;top:6px">${STEP('1')}</span>`;
    if (B === 'HTM00') {
      w = 1100; h = 460;
      inner = `<div style="padding:22px 26px;display:flex;flex-direction:column;gap:12px;height:640px;box-sizing:border-box">${EB('Today on main · HqTeamTable.jsx, no branch provisioned · for reference')}<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px">${EB('Team')}<p style="margin:0;font-size:12.5px;color:var(--mut);max-width:700px">Every administrator, the licence each holds, and where each stands on the compliance ladder. Grouped by branch: there is no global accounts table, so HQ holds its own and asks each branch over its private link.</p><div style="${M};font-size:11px;letter-spacing:.08em;color:var(--ink);font-weight:700">AXAL VC HQ <span style="color:var(--mut);font-weight:400;letter-spacing:0">HQ-held · 3 administrators, 3 active</span></div>${SK('100%', 12)}${SK('100%', 12)}${SK('100%', 12)}<p style="margin:0;font-size:11px;line-height:1.6;color:var(--faint)">No branch is provisioned, so every account on the platform is HQ-held and this is the whole team. Moving an account between branches closes it where it lives and re-invites it where it is going — records stay put. Move appears on a branch hit only when another branch code exists. It needs a step-up and TOTP; a refusal names the reason. HQ-held rows have no source branch, so they are not movable from this table. When the invitation on the destination does not land, the move stays under Moves to finish with Retry invitation, which invites the address the source recorded and nothing typed here. Support opens a session on an active branch account, on that branch’s own site, with the same step-up and a reason; the branch sends the person a security notice when the session is authorised, and the Support form shows whether it was stored. An administrator’s hit shows Unbind instead of Move: an administrator is unbound, not moved, and Unbind removes the role and deactivates the account on that branch, with the same step-up and a reason.</p></div>${ANN('The paragraph is printed after the “whole team” sentence on every render. With no branch provisioned none of Move, Support, Unbind or Retry invitation can appear, yet all four are explained here, after the list, in 11 px faint text. Above this card sit the holder console and, below it, the two action cards (nine rows of rules) before the 64-account directory.')}</div>`;
    }
    else if (B === 'HTM01') { h = 900; inner = DESK({ sc: 'A', h }); }
    else if (B === 'HTM01B') { inner = DESK({ sc: 'A', disc: 1, focusDisc: 1, annTop: SAY('Nothing announced: a disclosure states its own expanded state.', 'Screen reader') }); }
    else if (B === 'HTM01C') { inner = DESK({ sc: 'A', rt: { soOpen: 1 }, scroll: 150 }); }
    else if (B === 'HTM02') {
      h = 1000;
      inner = DESK({ sc: 'B', q: 'weber', h, ann: 1, br: { fr: { n: '1' }, de: { n: '2' } }, annTop: ANN('Row actions are buttons with full accessible names: “Support [Dr. Jonas Weber] on fr”, “Move [Dr. Jonas Weber] from fr”, “Support [Paul Weber] on de”, “Unbind [Paul Weber] from de”. Only the actions that apply are drawn: no Move on an administrator, no Unbind on anyone else, nothing on a branch that did not answer. ① a member’s row: Support and Move. ② an administrator’s row: Support and Unbind, in the destructive style.') });
    }
    else if (B === 'HTM03') { h = 1100; inner = DESK({ sc: 'B', q: 'weber', h, scroll: 330, br: { fr: { open: 'move', panel: MOVEP({ reason: 0 }) } } }); }
    else if (B === 'HTM03B') { inner = DESK({ sc: 'B', q: 'weber', scroll: 330, br: { fr: { open: 'move', panel: MOVEP({ reason: 1 }) } } }, SCRIM(MOVE_REVIEW())); }
    else if (B === 'HTM03C') { inner = DESK({ sc: 'B', q: 'weber', scroll: 330, br: { fr: { open: 'move', panel: MOVEP({ reason: 1 }) } } }, SCRIM(STEPUP())); }
    else if (B === 'HTM03D') { inner = DESK({ sc: 'B', q: 'weber', scroll: 330, br: { fr: { moved: 1, focusOut: 1 } }, annMid: SAY('Moved. [Dr. Jonas Weber] is closed on fr and invited on ib. ib reports the email was sent.') }); }
    else if (B === 'HTM04') { h = 1000; inner = DESK({ sc: 'B', q: 'weber', h, scroll: 330, br: { fr: { open: 'support', panel: SUPP() } } }); }
    else if (B === 'HTM04B') {
      const res = `<div role="region" aria-labelledby="d-h" style="margin:0 14px 14px;border:1px solid var(--lavE);border-radius:12px;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px"><h3 id="d-h" style="margin:0;font-size:16px;font-weight:800">Support session authorised for [Dr. Jonas Weber]</h3>${CHIP('Changes nothing on the account')}<span style="margin-left:auto">${bG('Close', SM)}</span></div><p tabindex="-1" style="margin:0;font-size:13px;color:var(--body);${FOC}border-radius:4px">Opened in a new tab. The link works once, within five minutes. If no tab opened, ${LNK('open the session')}.</p><p style="margin:0;display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--body)">${GL.ok}<span><b style="color:var(--ink)">Told:</b> fr reports that its security notice was stored in his inbox there. Whether the email copy arrived is not reported.</span></p><p style="margin:0;font-size:12px;color:var(--mut)">The other two answers this line can give: “Not told: fr reports that its security notice could not be stored, so it sent him nothing. The session is authorised all the same.” · “Not recorded: fr did not report whether its security notice was stored.”</p></div>`;
      inner = DESK({ sc: 'B', q: 'weber', scroll: 330, br: { fr: { open: 'support', panel: res } }, annMid: SAY('Support session authorised. Opened in a new tab.') });
    }
