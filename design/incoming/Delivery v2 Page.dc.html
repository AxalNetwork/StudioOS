      ['Background refresh', '<div style="display:flex;gap:8px;align-items:center">' + st('Waiting', 'Refreshing…') + '<span style="font-size:13px">Board stays visible while it updates</span></div>'],
      ['Section could not be read', nt('r', '✕', 'Deliverables could not be read', 'The rest of Delivery is current.', 'Retry')],
      ['Partial data', nt('a', '!', 'Utilisation unavailable', 'Pipeline · Retainers didn’t respond. Health shows everything else.', 'Retry')],
      ['Saving', '<div style="display:flex;gap:8px;align-items:center">' + st('Waiting', 'Saving…') + '<span style="font-size:13px">Milestone due date</span></div>'],
      ['Save failed', nt('r', '✕', 'Couldn’t save the milestone', 'What you typed is kept below. Other editors stay open.', 'Try again') + '<div class="ta" style="min-height:36px">Channel test 1 · due 20 Nov</div>'],
      ['Saved', nt('g', '✓', 'Milestone saved', 'Verwood · channel test 1 · due 20 Nov', '')],
      ['Stale / conflict', nt('a', '!', 'Tomás changed this blocker at 14:21', 'Your edit wasn’t saved. Compare before you save again.', 'Compare') + NEW()],
      ['First deliverable', '<div><b style="font-size:14.5px">No deliverables yet</b><p style="font-size:13px;color:var(--mu)">Keep a record of work handed to clients.</p></div><button type="button" class="btn p bsm" style="align-self:flex-start">Log first deliverable</button>'],
      ['Capacity limits not set', '<div><b style="font-size:14.5px">Capacity limits not set</b><p style="font-size:13px;color:var(--mu)">Set available hours to identify over-allocation.</p></div><button type="button" class="btn bsm" style="align-self:flex-start">Set capacity →</button>'],
      ['No engagement health yet', '<div><b style="font-size:14.5px">No engagement health yet</b><p style="font-size:13px;color:var(--mu)">Health appears once Delivery records contain enough evidence.</p></div>'],
      ['Read only', '<div style="display:flex;gap:8px;align-items:center">' + st('Read only', 'Sent · October report') + '<span style="font-size:13px">Sent reports are records, not editable rows</span></div>']
    ];
    const states = () => crop('<span class="eye">Loading, empty, failure and conflict states</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);
    const handoff = () => crop('<span class="eye">Pipeline → Delivery handoff</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">'
      + '<section class="cd"><span class="eye">Pipeline · Win the work</span><div class="ch"><h2>Verwood · proposal accepted</h2>' + st('Signed off', 'Engagement created') + '</div><p style="font-size:13px">Project · $48k · 5 milestones</p><a class="btn p bsm" href="#" style="align-self:flex-start">Open in Delivery →</a></section>'
      + '<section class="cd"><span class="eye">Delivery · Ship the work</span><div class="ch"><h2>Verwood</h2>' + hl('Not rated') + '</div><p style="font-size:13px">Opened with Verwood selected · next action: set an owner and rate health</p><span class="raw">/delivery/board?engagement=verwood</span></section></div>', 1000);

    /* ---------- phone ---------- */
    const phone = (title, body) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div></div></div>';
    const mzt = (cur) => '<nav class="zt" aria-label="Delivery" style="overflow:hidden;flex:none">' + J(['Board', 'Deliverables', 'Capacity', 'Reports', 'Health'].map(z => '<a href="#"' + (z === cur ? ' aria-current="page"' : '') + ' style="padding:12px 8px;font-size:13px">' + z + '</a>')) + '</nav>';
    const MOB = {
      DL01m: () => phone('Delivery', mzt('Board') + '<div class="seg" role="radiogroup" aria-label="Engagements" style="display:grid;grid-template-columns:1fr 1fr"><button type="button" role="radio" aria-checked="true" style="min-height:40px">Attention · 2</button><button type="button" role="radio" aria-checked="false" style="min-height:40px">All · 5</button></div>' + J(ENG.filter(e => e[7]).map(e => '<article class="crd"><div class="r1"><b>' + e[0] + '</b>' + hl(e[2]) + '</div><small>' + e[1] + '</small><span class="mo" style="font-size:13px">' + e[3] + '</span><span class="nx">' + e[4] + '</span><a class="btn" href="#" style="min-height:44px">Open engagement</a></article>')) + '<p class="foot">3 more engagements need no attention · <a href="#">Show all</a></p>'),
      DL02m: () => phone('Deliverables', mzt('Deliverables') + '<button type="button" class="btn p" style="min-height:48px">Log deliverable</button>' + J(DLV.slice(0, 4).map(d => '<article class="crd"><b>' + d[1] + ' · ' + d[2] + '</b><small>' + d[0] + ' · sent ' + d[3] + '</small>' + (d[4] === 'Signed off' ? st('Signed off') : st('Sent', 'Sent · no sign-off')) + '<small>Read status unavailable</small></article>'))),
      DL03m: () => phone('Capacity', mzt('Capacity') + '<div class="seg" role="radiogroup" aria-label="Time basis" style="display:grid;grid-template-columns:1fr 1fr"><button type="button" role="radio" aria-checked="true" style="min-height:40px">This week</button><button type="button" role="radio" aria-checked="false" style="min-height:40px">November</button></div>' + J(PEOPLE.map(p => '<article class="crd"><b>' + p[0] + '</b><div class="bar2"><i class="' + (p[5] === 'ov' ? 'ov' : '') + '" style="width:' + (p[2] ? Math.min(100, p[1] / p[2] * 100) : 30) + '%"></i></div><span class="mo" style="font-size:13px">' + p[1] + 'h / ' + (p[2] ? p[2] + 'h' : 'no limit') + '</span>' + (p[5] === 'ov' ? '<span class="nx" style="color:var(--neg)">6h over · includes an embedded seat</span>' : p[5] === 'nocap' ? '<span class="nx" style="color:var(--ink)">Capacity limits not set</span>' : '<span style="color:var(--pos);font-weight:700">8h available</span>') + '<small>' + p[3] + '</small></article>'))),
      DL04m: () => phone('Status reports', mzt('Reports') + '<button type="button" class="btn p" style="min-height:48px">Draft status report</button>' + J(REP.map(r => '<article class="crd"><div class="r1"><b>' + r[0] + '</b>' + (r[2] === 'Sent' ? st('Read only', 'Sent') : r[2] === 'Draft' ? st('Draft') : st('Not recorded', 'Not started')) + '</div><small>' + r[1] + ' · ' + r[3] + '</small></article>'))),
      DL05m: () => phone('Health', mzt('Health') + J(HCARD.slice(0, 3).map(h => '<article class="crd"><div class="r1"><b>' + h[0] + '</b>' + hl(h[1]) + '</div><span style="font-size:14px">' + h[2] + '</span><small>' + h[3] + '</small><small>Owner: ' + h[5] + '</small><a class="btn" href="#" style="min-height:44px">Review health</a></article>')))
    };

    /* ---------- handoff doc ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const spec = () => dk('<h1>Backend fit and handoff</h1><p>Checked against <code>cloudflare-worker/src/routes/partner_delivery.ts</code> and the Partner shell in <code>frontend/src/workspaces/shellConfig.js</code> on 7 Nov 2026. Delivery lives in the Partner workspace (Home · Pipeline · Delivery · Offers · Network · Research · Trust · Firm Settings). The live workspace has no engagements; every populated board uses sample clients.</p>'
      + tbl(['Board area', 'Today', 'Status'], [
        ['/delivery lands on Board', 'Route renders a directory overview', 'Frontend: redirect to /delivery/board'],
        ['Board', '<code>GET /board</code>: one row per engagement; mode derived from seats; health null when not recorded; milestones', 'Frontend: attention reasons from overdue milestones, open blockers, health, due reports'],
        ['Engagement sheet', 'Same reads as the zones', 'Frontend only; no second data model'],
        ['Deliverables', '<code>GET /deliverables</code>; <code>opened_at</code>/<code>signed_off_at</code> are the client’s to set and nothing sets <code>opened_at</code>', 'Frontend: “Read status unavailable”. Backend required for real open tracking'],
        ['Capacity', '<code>/capacity</code>, <code>/capacity/cap</code> (weekly hours), hours per <b>monthly</b> period, seats', 'Frontend: explicit time basis. Backend required to compare weekly limits with monthly allocations on one basis (#4690)'],
        ['Status reports', '<code>report-draft/:period</code>, <code>status-reports/:period</code> (shipped, next_up), <code>/send</code> records a person sent it', 'Frontend: composer + read-only sent records. Backend required: a Blocked field (today blockers are only evidence)'],
        ['Health', '<code>GET /health</code>: owner, scope state/note, satisfaction + source, utilisation read from retainers; <code>PUT …/health</code>', 'Frontend: risk board + detail. Backend required: review history'],
        ['Conflict state', 'Writes have no expected-version check', 'Backend required'],
        ['Eadwyn', 'AI rail with models and pricing', 'Frontend: collapsed on empty, prompts first, model/usage behind a disclosure']])
      + '<h2>Accessibility</h2><p>Working text 14px+; status always word + shape (Not rated is dashed, never green). Desktop tables keep header relationships; phone uses cards with 44px actions. Save, error and conflict messages announce via status/alert regions; failed saves keep typed text; destructive actions (delete milestone, revoke seat) sit apart from ordinary actions.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DL01') html = page(board('Attention'), { h: 760 });
    else if (B === 'DL01b') html = page(board('All'), { h: 840 });
    else if (B === 'DL02') html = page(deliverables(), { h: 760 });
    else if (B === 'DL03') html = page(capacity(true), { h: 980 });
    else if (B === 'DL04') html = page(reports(), { h: 760 });
    else if (B === 'DL04a') html = crop(composer(), 800);
    else if (B === 'DL05') html = page(health(), { h: 1000 });
    else if (B === 'DL05a') html = page(healthDetail(), { h: 1000 });
    else if (B === 'DL06') html = page(board('All', 'Verwood'), { h: 840, overlay: sheet() });
    else if (B === 'DL07') html = page(empty(), { h: 820 });
    else if (B === 'DL07b') html = states();
    else if (B === 'DL07c') html = handoff();
    else if (B === 'DL08') html = page(board('All'), { h: 840, rail: true });
    else if (B === 'DL08b') html = crop(composer(), 800);
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'DL09') html = spec();
    else html = page(board('Attention'), { h: 760 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
