    };
    const cSaved = (lic, k, span) => {
      const l = L[lic], t = 'Saved answers';
      if (k === 'empty') return card(t, '', '<p class="rsv-empty">No answer is saved yet.</p>', span);
      if (k === 'load') return card(t, '', '<div class="rsv-skel" aria-busy="true">' + sk('40%') + sk('85%') + sk('75%') + '</div>', span);
      return card(t, '<a class="rso-lk" href="#">Saved tab →</a>', big('[' + l.saved + ']', 'saved', 'all time') + '<ul class="rz">' + J(l.savedQ.map(q => '<li><b>' + q[0] + '</b><small class="mo">Asked ' + q[1] + '</small></li>')) + '</ul><p class="raw">The 3 most recently asked. No save date is recorded.</p>', span);
    };
    const docRow = (d) => '<li class="rsv-doc"><div class="rsv-d1"><b>' + d[0] + '</b>' + inAsk(d[4]) + '</div><div class="rsv-d2">' + from(d[1]) + '<span class="mo">Added ' + d[2] + '</span>' + st(d[3]) + '</div></li>';
    const cLibrary = (lic, k, span) => {
      const l = L[lic], t = 'Library';
      if (k === 'empty') return card(t, '', '<p class="rsv-empty">Nothing is in your library yet, so Ask has nothing to read.</p><div class="rsv-after"><span class="eye">After an upload</span><div>' + st('Pending') + '<span aria-hidden="true">→</span>' + st('Indexed') + inAsk(true) + '</div></div>', span);
      if (k === 'load') return card(t, '', '<div class="rsv-skel" aria-busy="true">' + sk('70%') + sk('90%') + sk('85%') + '</div>', span);
      return card(t, '<a class="rso-lk" href="#">Library →</a>', '<p class="rsv-lib"><b class="mo">[' + l.lib.yes + ']</b> answerable in Ask · <b class="mo">[' + l.lib.no + ']</b> not answerable ' + (l.lib.cl ? '<span>(<b class="mo">[' + l.lib.cl + ']</b> of them from clients)</span>' : '<span>(none from clients)</span>') + '</p><ul class="rsv-docs">' + J(l.docs.map(docRow)) + '</ul><p class="raw">The 3 newest. ' + (lic === 'adv' ? 'A client’s file is read-only and never in Ask; its date is the day the founder uploaded it.' : 'Only what you uploaded yourself.') + '</p>', span);
    };
    const rdRow = (r) => '<li class="rsv-rd"><div class="rsv-d1"><b>' + r[0] + '</b><span class="mo rsv-rng">' + r[1] + ' to ' + r[2] + '</span></div><div class="rsv-d2"><span>from <b class="mo">' + r[3] + '</b> comparables</span><span class="mo">Run ' + r[4] + ' · ' + r[5] + ' days ago</span></div></li>';
    const cMarkets = (lic, k, span) => {
      const l = L[lic], t = 'Market readings';
      if (k === 'empty') return card(t, '', '<p class="rsv-empty">No reading is recorded. Record one on <a href="#">Markets</a>.</p>', span);
      if (k === 'load') return card(t, '', '<div class="rsv-skel" aria-busy="true">' + sk('35%') + sk('90%') + sk('80%') + sk('70%') + '</div>', span);
      return card(t, '<a class="rso-lk" href="#">Markets →</a>', big('[' + l.rd + ']', 'readings stored', 'yours, all time') + '<ul class="rsv-docs">' + J(l.reads.map(rdRow)) + '<li class="rsv-rd"><div class="rsv-d1"><b>' + l.noRead + '</b>' + st('Not recorded', 'No reading yet') + '</div><div class="rsv-d2"><span>' + (lic === 'par' ? 'A catalogued service line of the firm' : 'A catalogued service line') + '</span></div></li></ul><p class="raw">The 3 newest readings, each the latest for its service line.</p>', span);
    };
    const coRow = (c, ur) => '<li><b>' + c[0] + '</b><small>' + (ur ? '<span class="rsv-unr">' + G.ua + 'Company name could not be read</span>' : 'Subject ' + c[1]) + ' · <span class="mo" style="white-space:nowrap">Updated ' + c[3] + '</span></small>' + st(c[2]) + '</li>';
    const cCompanies = (k, span) => {
      const t = 'Companies';
      if (k === 'empty') return card(t, '', '<p class="rsv-empty">You have not run an analysis yet.</p>', span);
      if (k === 'load') return card(t, '', '<div class="rsv-skel" aria-busy="true">' + sk('80%') + sk('70%') + '</div>', span);
      return card(t, '<a class="rso-lk" href="#">Companies →</a>', '<ul class="rz">' + J(CO.map((c, i) => coRow(c, k === 'nr' && i === 1))) + '</ul><p class="raw">The 3 most recently updated. Your own analyses, not a client book.</p>', span);
    };
    const cover = () => '<button type="button" class="disc" aria-expanded="false"><b>Source coverage</b><span>Directory-wide totals · companies, markets, funds, countries, sectors tracked · each with its source and as-of date</span><i aria-hidden="true">▾</i></button>';
    const flags = (lic) => lic === 'adv' ? '<div class="rsv-flags">' + FL('Q1 · A: own cards, not RS-01') + FL('Q2 · A: no My Research card') + FL('Q3 · A: Add a document') + FL('Q4 · A: Geographies inside Markets (#8821)') + '</div>' : '<div class="rsv-flags">' + FL('Q1 · A: own cards') + FL('Q4 · A: Geographies inside Markets') + '</div>';
    const overview = (lic, o) => { o = o || {}; const k = o.k;
      const g = lic === 'adv'
        ? cContinue(lic, o.cont || k) + cClients(lic, o.cl || k, 6) + cSaved(lic, k, 6) + cLibrary(lic, k, 6) + cMarkets(lic, k, 6) + cCompanies(o.co || k, 6)
        : cContinue(lic, o.cont || k) + cClients(lic, k, 6) + cSaved(lic, k, 6) + cLibrary(lic, k, 6) + cMarkets(lic, k, 6);
      return hdr(lic, o) + tabs(lic) + (o.flags === false ? '' : flags(lic)) + '<div class="g">' + g + '</div>' + (k === 'load' ? '<div class="rsv-skel" style="padding:12px 0;border-top:1px solid var(--hair)">' + sk('22%') + '</div>' : cover());
    };

    /* ---------- RS-26 states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const COV = [['Companies', '[12,480]', 'Company directory', '1 Nov 2026'], ['Markets', '[64]', 'Market directory, supplied by Axal', '28 Oct 2026'], ['Funds', null, 'The fund directory holds no fund yet'], ['Countries', '[38]', 'Company directory: distinct countries', '1 Nov 2026'], ['Sectors', null, 'No company in the directory records a sector']];
    const STATES = [
      ['Not recorded · Continue', '<div class="rsv-cont s"><div><b class="rsv-qt">“Which 3PLs in Oslo offer -25°C storage?”</b><small class="mo">Asked 26 Nov 2026, 09:20</small></div>' + st('No passage to cite') + '</div><p class="raw"><code>no_source</code>: Ask found no passage in your library</p>'],
      ['Failure · Continue', '<div class="rsv-cont s"><div><b class="rsv-qt">“Which 3PLs in Oslo offer -25°C storage?”</b><small class="mo">Asked 26 Nov 2026, 09:20</small></div>' + st('Ask could not run') + '</div><p class="raw"><code>model_unavailable</code> or <code>retrieval_unavailable</code>. Never drawn as “not answered”, “no passage” or Not recorded</p>'],
      ['Not recorded · a service line', '<ul class="rsv-docs"><li class="rsv-rd"><div class="rsv-d1"><b>Pricing teardown</b>' + st('Not recorded', 'No reading yet') + '</div><div class="rsv-d2"><span>A catalogued service line · record one on Markets</span></div></li></ul><p class="raw">Never “$0”, never a dash</p>'],
      ['Not recorded · an analysis subject', '<ul class="rz">' + coRow(CO[1], true) + '</ul><p class="raw"><code>subject_names: unreadable</code> · the analysis still opens</p>'],
      ['Unreadable · Clients open to you', UR('Your client list could not be read.', 'This is not a sign that no client opened their record.') + '<p class="raw">Only this card fails; every other card stays loaded (RS-26 C)</p>'],
      ['Refused · a grant that ended', '<div class="rsv-st">' + st('Refused') + '<p><b>No client record is open to you. The founder can open it again.</b></p><a class="rso-lk" href="#">Back to the overview</a></div><p class="raw">Opening a revoked or expired row in Client prep</p>'],
      ['Refused · Advisor licence lapsed', '<div class="rsv-st">' + st('Refused') + '<p><b>Client prep needs an active Advisor licence.</b></p><a class="rso-lk" href="#">Account › Licences</a></div><p class="raw">Frontend-derived: the list answers 200 with no rows and “Only an advisor holds client grants”, no 403</p>'],
      ['Withheld · one scope opened', '<ul class="rsv-cls">' + clRow(CL[0], 1) + '</ul><p class="raw">Muted, not red: the founder chose how much to open</p>'],
      ['Out of AI tokens', '<button type="button" class="btn rsv-ghost" disabled aria-disabled="true" style="align-self:flex-start"><i aria-hidden="true">E</i>Ask</button><p style="font-size:12.5px">You are out of AI tokens. Ask is off.</p><a class="rso-lk" href="#">Add tokens</a>'],
      ['Zero, Not recorded, Unreadable', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Saved answers</dt><dd><b class="mo">0</b> saved · all time</dd><dt>A reading</dt><dd>' + st('Not recorded', 'No reading yet') + '</dd><dt>Client list</dt><dd>' + st('Unreadable') + '</dd></dl><p class="raw">A measured 0 is a value; the other two never read as 0</p>'],
      ['No saving on this page', '<p style="font-size:12.5px">The overview reads only. Save and Discard live in Ask; Accept brief, Edit and Discard live in Client prep.</p>'],
      ['Offline', '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>You are offline.</b> What you last read stays on screen, marked ' + st('Stale', 'Stale · 4 min') + '</div></div>']
    ];
    const covOpen = () => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">Source coverage · expanded</h2><span class="raw">directory-wide, the same for every licence</span></div><table class="tbl"><thead><tr><th>Total</th><th class="n">Value</th><th>Source, or why nothing is recorded</th><th>As of</th></tr></thead><tbody>' + J(COV.map(c => '<tr><td><b>' + c[0] + '</b></td><td class="n">' + (c[1] || st('Not recorded')) + '</td><td>' + c[2] + '</td><td class="mo">' + (c[3] || '') + '</td></tr>')) + '</tbody></table><p class="raw">A section with nothing recorded says Not recorded with its reason, never 0</p></section>';
    const states = () => crop('<span class="eye">RS-26 B · States · ST-00 to ST-14 words · Zero, Not recorded and Unreadable never look alike</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>' + covOpen(), 1400);

    /* ---------- RS-27 phone ---------- */
    const phone = (lic, body, sheet) => '<div class="cv rso rsv" style="' + VARS(lic) + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:14px">' + L[lic].co + '</b><button type="button" class="pi" aria-label="Account menu">' + L[lic].ini + '</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mHead = (lic) => '<div><span class="eye">' + L[lic].eye + '</span><h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px">Research</h1></div><div style="display:flex;gap:8px"><button type="button" class="btn p" style="min-height:48px;flex:1">Add a document</button><button type="button" class="btn rsv-ghost rsv-ic" aria-label="Ask Eadwyn"><i aria-hidden="true">E</i></button></div><p style="font-size:13px;color:var(--mu)">Answer from your own library, prepare for each client from what they opened to you, and keep your market readings current.</p><label class="rsv-sel"><span>Module</span><b>Overview</b><i aria-hidden="true">▾</i></label>';
    const mCard = (t, inner, r) => '<div class="mc"><div class="rsv-clh"><span class="eye">' + t + '</span>' + (r || '') + '</div>' + inner + '</div>';
    const mCl = (c, i) => '<div class="mc"><div class="rsv-clh"><b>' + c.n + '</b></div><div class="rsv-scs">' + J(SCOPES.map((t, j) => scope(c.s[j], t))) + '</div>' + (!c.s[1] && !c.s[2] ? '<small class="rsv-wh">' + G.dash + 'Data room and Other sessions not opened to you</small>' : '') + '<small class="rsv-dt"><span>' + (c.until ? 'Open until <span class="mo">' + c.until + '</span>' : 'No end date') + '</span><span>Opened <span class="mo">' + c.opened + '</span></span></small><a class="btn" href="#" style="min-height:44px">Open in Client prep</a>' + (i === 0 ? '<a class="btn" href="#" style="min-height:44px">Draft a checkpoint brief</a>' : '') + '</div>';
    const l = L.adv;
    const MOB = {
      RS27: () => phone('adv', mHead('adv') + mCard('Continue where you left off', '<b style="font-size:13.5px">“' + l.last.q + '”</b><small class="mo">Asked ' + l.last.at + '</small>' + st('Answered') + '<a class="btn" href="#" style="min-height:44px">Continue in Ask</a>') + mCard('Clients open to you', big('[3]', 'ventures open to you', 'grants, not founders'))),
      RS27B: () => phone('adv', '<p class="raw">Scrolled · Clients open to you, one card per grant</p>' + J(CL.slice(0, 2).map(mCl)) + '<p class="raw">[Tern Cold Chain] follows, then Saved answers and Library</p>'),
      RS27C: () => phone('adv', '<p class="raw">Scrolled · Library, Market readings, Companies</p>' + mCard('Library', '<p class="rsv-lib"><b class="mo">[23]</b> answerable in Ask · <b class="mo">[6]</b> not answerable <span>(<b class="mo">[4]</b> of them from clients)</span></p>' + J(l.docs.slice(2).map(d => '<div class="rsv-mdoc"><b>' + d[0] + '</b><div class="rsv-d2">' + from(d[1]) + '<span class="mo">Added ' + d[2] + '</span></div><div class="rsv-d2">' + st(d[3]) + inAsk(d[4]) + '</div></div>')), '<a class="rso-lk" href="#">Library</a>')
        + mCard('Market readings', big('[5]', 'readings stored', 'yours, all time') + '<div class="rsv-mdoc"><b>' + l.reads[0][0] + '</b><span class="mo">' + l.reads[0][1] + ' to ' + l.reads[0][2] + '</span><small>from <b class="mo">9</b> comparables · <span class="mo">Run 20 Nov 2026 · 7 days ago</span></small></div>', '<a class="rso-lk" href="#">Markets</a>')
        + mCard('Companies', '<div class="rsv-mdoc"><b>' + CO[0][0] + '</b><small>Subject ' + CO[0][1] + ' · <span class="mo">Updated ' + CO[0][3] + '</span></small>' + st(CO[0][2]) + '</div><p class="raw">Your own analyses, not a client book.</p>') + cover()),
      RS27S: () => phone('adv', mHead('adv'), '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ask"><div class="grab" aria-hidden="true"></div><div style="padding:10px 18px 22px;display:flex;flex-direction:column;gap:10px"><div class="rsv-clh"><h2 id="ask" style="font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center"><span class="rso-e" aria-hidden="true">E</span>Ask</h2><button type="button" class="pi" aria-label="Close">✕</button></div>' + askPanel().replace('class="btn rsv-askb"', 'class="btn rsv-askb" style="min-height:48px"') + '</div></div>'),
      RS27P: () => phone('par', mHead('par').replace('Overview', 'Overview') + mCard('Continue where you left off', '<b style="font-size:13.5px">“' + L.par.last.q + '”</b><small class="mo">Asked ' + L.par.last.at + '</small>' + st('No passage to cite')) + mCard('Clients open to you', partnerEmpty + PT('Partner grant not built · #8822')))
    };

    /* ---------- RSV-H handoff ---------- */
    const dk = (inner) => '<div class="cv rso rsv" style="' + VARS('adv') + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RSVH: () => dk('<h1>Handoff · Research v2 · Advisor and Partner Overview (#8822)</h1><p>Continues Research v2 (D3701) from RS-23; RS-22 is the highest RS id landed. Follows IRV-01 (#6268) for a licence accent on the primary, with Eadwyn violet. Decision file: <code>D8822.md</code>, a new decision (a part file under D3701 is refused below D4000, D5615). Checked against <code>main</code> d26a93a252 on 27 Nov 2026. ◇ marks backend work; ⚑ marks the owner’s questions, each drawn as pick A.</p>'
        + '<div class="cols"><div><h2>What they read today (checked)</h2><p><code>App.jsx:2995-3000</code>: <code>/research</code> for an advisor or partner renders <code>ResearchWorkspace role</code>. Its root draws <code>ResearchOverviewPanel</code> (D536) above <code>BucketBoard</code> with <code>workspaces/boards/research.js</code>: five link cards for an advisor (Ask, Client prep, Markets, Geographies, Companies), four for a partner, and one live table, the document library. <code>shellConfig.js:179-194</code> zones match the brief; Geographies is still a zone on main. <code>ResearchHome.jsx</code> is imported only by <code>FounderResearchDesk.jsx</code>. <code>ClientPrepZone.jsx:72</code> keeps the chosen client in <code>useState(null)</code>; <code>AskZone.jsx:190-191</code> keep view and thread in state; neither reads a URL parameter.</p>'
        + '<h2>Found on main, beyond the brief</h2><p>The board’s Library summary counts <code>indexed</code> / <code>not_indexed</code>, which counts an indexed client share as answerable; the new card uses <code>answerable</code> / <code>not_answerable</code> (the rows’ <code>in_ask</code>, #4610). The board’s footnote says client files are “never copied here”, but <code>GET /api/research/documents</code> lists them read-only with <code>source: client</code> and “From [project]”. Both are fixed by building RS-23, not by a route.</p>'
        + '<h2>Backend required (◇ #8822)</h2><p><b>Open items across clients</b>: <code>GET /api/research/brief-notes</code> requires <code>?project=</code> (<code>research_client_prep.ts:375</code>), so nothing counts <code>research_brief_notes.open = 1</code> across grants. <b>A partner’s client grant</b>: grants are founder → advisor only (<code>advisor_grants.ts:419</code>); no store opens a record to a partner.</p>'
        + '<h2>Frontend build work (no new route)</h2><p>Deep-link parameters the zones must read: Client prep with a chosen client; Ask on a thread; Ask’s Saved tab; Library’s upload. Today none is read.</p></div>'
        + '<div><h2>Owner questions (⚑, drawn as A)</h2><p>Q1 own cards from the stores they reach, not RS-01 with Not recorded cards · Q2 no My Research card; <code>/research/projects</code> stays founder-only · Q3 primary “Add a document” · Q4 Geographies inside Markets, as #8821 does. Also carried from IRV: the failed-read word. The brief says “Unreadable”, ST-00 to ST-14 say “Unavailable”; drawn as Unreadable with the Unavailable glyph.</p>'
        + '<h2>Dropped (no source)</h2><p>Research projects and saved briefs (founder-only routes, <code>routes/researchProjects.jsx:24-29</code>), fund tracking, the next session with a client, and “what changed since my last visit”.</p>'
        + '<h2>Handoffs to sibling canvases</h2><p>#8821 Markets with Geographies inside (tab list). Research v2 RS-07 Ask and RS-06 Library (targets). Client prep’s checkpoint brief (Draft the brief; Accept brief, Edit, Discard) is drawn there, linked from here. IRV-01 (#6268) is the investor overview. Practice · Sessions holds what a client wrote when they booked.</p></div></div>'
        + '<div style="height:10px"></div>' + tbl(['Value on screen', 'Read from', 'Stored in', 'Board'], [
          ['Continue: newest question, when, how it ended', '<code>GET /api/research/ask/sessions?scope=all</code> (<code>research.ts:920</code>)', '<code>research_ask_answers.question</code>, <code>.created_at</code>, <code>.reason</code>', 'RS-23, RS-24 (no_source), RS-26'],
          ['Saved answers: count, 3 most recently asked', '<code>?scope=saved</code>, <code>totals.saved</code>, <code>id DESC</code>', '<code>.saved</code>, <code>.question</code>, <code>.created_at</code> (no saved-at: migrations 221, 385)', 'RS-23, RS-24'],
          ['Clients open to you (advisor)', '<code>GET /api/advisor-grants/shared/list</code> (<code>advisor_grants.ts:417</code>)', '<code>advisor_client_grants.scope_*</code>, <code>.expires_at</code>, <code>.created_at</code>; <code>projects.name</code>', 'RS-23, RS-26, RS-27'],
          ['Library counts and 3 newest', '<code>GET /api/research/documents</code> (<code>research.ts:341</code>; <code>in_ask</code> <code>:247</code>)', '<code>research_documents.index_state</code>, <code>.created_at</code>; <code>advisor_client_document_shares.status</code>', 'RS-23, RS-24, RS-25'],
          ['Market readings, stored count', '<code>GET /api/research/market-readings</code> (<code>:81</code>), <code>/summary</code> (<code>:190</code>)', '<code>research_market_readings.*</code>; <code>service_offerings.title</code>', 'RS-23, RS-24, RS-26'],
          ['Companies (advisor)', '<code>GET /api/competitors</code> (<code>competitors.ts:635</code>)', '<code>competitor_analyses.title</code>, <code>.status</code>, <code>.updated_at</code>, <code>.subject_uid</code>', 'RS-23, RS-26'],
          ['Source coverage', '<code>GET /api/research/overview</code> (<code>research_overview.ts:614</code>)', 'directory tables; per-section Not recorded with reason', 'RS-23 collapsed, RS-26 expanded'],
          ['◇ Open items per client', 'no read across clients', '<code>research_brief_notes.open</code>', 'RS-23 tag'],
          ['◇ Partner grant', 'no store', 'none', 'RS-24, RS-27 inset']])
        + '<div style="height:22px"></div>' + tbl(['Acceptance (#8822)', 'Where'], [
          ['A brief grounded in what each licence’s Research reads today', 'RS-23 advisor, RS-24 partner; the table above'],
          ['Desktop', 'RS-23, RS-24, RS-25 (both licences), RS-26'],
          ['390px', 'RS-27 (advisor, four frames) and RS-27 P (partner inset)'],
          ['Dark', 'RS-28'],
          ['Or a recorded decision to reuse RS-01', 'Q1 drawn as A (own cards); the owner’s answer goes in D8822.md']])
        + '<div style="height:22px"></div>' + tbl(['Accessibility', 'Rule'], [['States', 'Every state is a word plus a glyph: Answered, No passage to cite, Ask could not run, Indexed, In Ask, Not in Ask, Unreadable, Refused. Colour never alone'], ['Accent', 'The partner primary (#b45309) is never a status; amber “waiting” always carries its word'], ['Counts', 'Each figure says what it counts and for which period: “all time”, “stored”, “the 3 newest”, “grants, not founders”'], ['Evidence', 'A client’s fact reads “From [Venture]” with a lock; your own reads “Yours”. No other member’s email is shown'], ['Tabs', '<code>nav aria-label=Research</code>, <code>aria-current=page</code>; on phones a labelled Module select'], ['Touch', 'Phone targets 44px or more; client rows become cards; the Ask panel is a bottom sheet that returns focus to Ask'], ['Live', 'A card that fails announces with <code>role=alert</code>; loading cards are <code>aria-busy</code>']]))
    };

    let html;
    if (B === 'RS23') html = page(overview('adv'), { h: 1760, rail: 'ask' });
    else if (B === 'RS24') html = page(overview('par'), { lic: 'par', h: 1260, rail: 'ask' });
    else if (B === 'RS25') html = page(overview('adv', { k: 'empty', flags: false }), { h: 940 });
    else if (B === 'RS25P') html = page(overview('par', { k: 'empty', flags: false }), { lic: 'par', h: 860 });
    else if (B === 'RS26') html = page(overview('adv', { k: 'load', flags: false }), { h: 900 });
    else if (B === 'RS26B') html = states();
    else if (B === 'RS26C') html = page(overview('adv', { cl: 'ur', flags: false }), { h: 1640 });
    else if (B === 'RS28') html = page(overview('adv'), { h: 1760, rail: 'ask' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview('adv'), { h: 1760, rail: 'ask' });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
