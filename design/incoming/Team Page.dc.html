<script type="text/x-dc" data-dc-script data-props="{&quot;v&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tm1a&quot;,&quot;tm1b&quot;,&quot;tm1c&quot;,&quot;tm1d&quot;,&quot;tm1i2&quot;,&quot;tm1i1&quot;,&quot;tm1h&quot;,&quot;tm1g2&quot;,&quot;tm1g&quot;,&quot;tm1f&quot;,&quot;tm1e&quot;,&quot;tm2a&quot;,&quot;tm2as&quot;,&quot;tm2b&quot;,&quot;tm2c&quot;,&quot;tm3a&quot;,&quot;tm3b&quot;,&quot;tm3c&quot;,&quot;tm4a&quot;,&quot;tm4b&quot;,&quot;tm4b2&quot;,&quot;tm4c&quot;,&quot;tm5a&quot;,&quot;tm5b&quot;,&quot;tm6a&quot;,&quot;tm6b&quot;,&quot;tm6c&quot;,&quot;tm7a&quot;,&quot;tm7b&quot;,&quot;tm7b2&quot;,&quot;tm8a&quot;,&quot;tm9a1&quot;,&quot;tm9a2&quot;,&quot;tm9a3&quot;,&quot;tm9a5&quot;,&quot;tm9a4&quot;,&quot;tm9b1&quot;,&quot;tm9b2&quot;,&quot;tm9c1&quot;,&quot;tm9c2&quot;,&quot;tm9c3&quot;,&quot;tm9c4&quot;,&quot;tm9c5&quot;,&quot;tm9c6&quot;,&quot;tm9d1&quot;,&quot;tm9d2&quot;,&quot;tm9d3&quot;,&quot;tm9e&quot;,&quot;tma&quot;,&quot;tm4b3&quot;,&quot;tm9c7&quot;,&quot;tm1a-d&quot;,&quot;tm3b-d&quot;,&quot;tm6a-d&quot;,&quot;tm7a-d&quot;],&quot;default&quot;:&quot;tm1a&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const raw = String(this.props.v || 'tm1a');
    const dark = /-d$/.test(raw);
    const v = raw.replace(/-d$/, '');
    const M = "font-family:'Roboto Mono',ui-monospace,monospace";
    const F = "font-family:'Space Grotesk',system-ui,sans-serif";
    const VIO = dark ? '#a78bfa' : '#7c3aed';
    const LIGHT = '--bg:#f4f3f7;--card:#ffffff;--raised:#faf9fc;--ink:#18181b;--body:#3f3a47;--mut:#6b6577;--line:#ececf1;--line2:#e2dfe8;--vtx:#6d28d9;--lav:#f4f0fe;--lavE:#ddd0fb;--chip:#f4f3f7;--pos:#047857;--posT:rgba(4,120,87,.09);--neg:#b91c1c;--negT:#fef2f2;--negE:#fecaca;--scrim:rgba(24,24,27,.32);--skel:#ececf1';
    const DARK = '--bg:#0b1220;--card:#111827;--raised:#1f2937;--ink:#e5e7eb;--body:#d1d5db;--mut:#9ca3af;--line:#374151;--line2:#4b5563;--vtx:#a78bfa;--lav:rgba(167,139,250,.14);--lavE:rgba(167,139,250,.38);--chip:#1f2937;--pos:#34d399;--posT:rgba(52,211,153,.12);--neg:#f87171;--negT:rgba(248,113,113,.12);--negE:rgba(248,113,113,.38);--scrim:rgba(0,0,0,.55);--skel:#1f2937';

    const EY = (t, c) => `<span style="${M};font-size:11px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:${c || 'var(--mut)'}">${t}</span>`;
    const NR = '<span style="font-style:italic;color:var(--mut)">Not recorded</span>';
    const PK = { pos: 'background:var(--posT);color:var(--pos)', amb: 'background:#fcd34d;color:#92400e', neu: 'background:var(--chip);color:var(--body);border:1px solid var(--line2)', lav: 'background:var(--lav);color:var(--vtx);border:1px solid var(--lavE)', pend: 'background:transparent;color:var(--mut);border:1px dashed var(--line2)' };
    const pill = (t, k, tip) => `<span${tip ? ` title="${tip}"` : ''} style="display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;box-sizing:border-box;${PK[k || 'neu']}">${t}</span>`;
    const PEND = pill('pending owner', 'pend');
    const SPK = s => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.2l1.5 4.3 4.3 1.5-4.3 1.5L8 12.8 6.5 8.5 2.2 7l4.3-1.5z"/><path d="M13 10.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" opacity=".7"/></svg>`;
    const LOCK = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
    const SRCH = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM10.5 10.5L14 14"/></svg>';
    const BELL = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a4 4 0 1 1 8 0c0 3 1.5 4.5 1.5 4.5h-11S4 10 4 7zM6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>';
    const EAD = s => `<img src="/eadwyn-ai.png" alt="" style="width:${s}px;height:${s}px;display:block;flex:none;border-radius:999px;object-fit:contain;background:#18181b;padding:2px;box-sizing:border-box">`;

    const AV = (ini, s) => { s = s || 32; return `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:none;border-radius:999px;background:var(--chip);border:1px solid var(--line2);display:grid;place-items:center;font-size:${Math.round(s * 0.34)}px;font-weight:800;color:var(--body);box-sizing:border-box">${ini}</span>`; };
    const AG = s => { s = s || 32; return `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:none;border-radius:${Math.max(6, Math.round(s * 0.28))}px;background:var(--lav);border:1px solid var(--lavE);display:grid;place-items:center;color:var(--vtx);box-sizing:border-box">${SPK(Math.round(s * 0.52))}</span>`; };
    const AIP = pill(`${SPK(11)}AI agent`, 'lav');
    const AGN = { 'CFO': '[Nora Vale]', 'COO / Operations': '[Theo Marsh]', 'CMO / Growth': '[Iris Cole]', 'Research analyst': '[Milo Hart]', 'CTO': '[Ada Quinn]', 'CPO / Product': '[Leo Park]', 'Investor relations': '[Ravi Sen]', 'Head of People': '[Noor Haddad]' };
    const agentId = (role, sub) => `<div style="display:flex;align-items:center;gap:10px;min-width:0">${AG(32)}<div style="display:flex;flex-direction:column;gap:3px;min-width:0"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="font-size:13.5px;font-weight:800">${AGN[role] || role}</span>${AIP}</div>${AGN[role] || sub ? `<span style="font-size:12px;color:var(--mut)">${AGN[role] ? role + (sub ? ' · ' + sub : '') : sub}</span>` : ''}</div></div>`;
    const personId = (name, ini, sub) => `<div style="display:flex;align-items:center;gap:10px;min-width:0">${AV(ini)}<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:13.5px;font-weight:700">${name}</span>${sub ? `<span style="${M};font-size:11.5px;color:var(--mut)">${sub}</span>` : ''}</div></div>`;

    const BT = `display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:9px;${F};font-size:13.5px;font-weight:600;cursor:pointer;box-sizing:border-box;white-space:nowrap;text-decoration:none;`;
    const bP = (t, dis, tip) => `<button type="button"${dis ? ` aria-disabled="true" title="${tip || ''}"` : ''} style="${BT}border:1px solid #7c3aed;background:#7c3aed;color:#fff${dis ? ';opacity:.45;cursor:not-allowed' : ''}">${t}</button>`;
    const bS = (t, dis) => `<button type="button"${dis ? ' aria-disabled="true"' : ''} style="${BT}border:1px solid var(--line2);background:var(--card);color:var(--ink)${dis ? ';opacity:.45;cursor:not-allowed' : ''}">${t}</button>`;
    const bD = t => `<button type="button" style="${BT}border:1px solid var(--negE);background:var(--card);color:var(--neg)">${t}</button>`;
    const bDF = t => `<button type="button" style="${BT}border:1px solid #b91c1c;background:#b91c1c;color:#fff">${t}</button>`;
    const bT = (t, c) => `<button type="button" style="${BT}min-height:32px;padding:0 8px;border:1px solid transparent;background:transparent;color:${c || 'var(--vtx)'}">${t}</button>`;
    const sB = (t, k, dis) => `<button type="button"${dis ? ' aria-disabled="true"' : ''} style="${BT}min-height:32px;padding:0 11px;font-size:12.5px;${k === 'p' ? 'border:1px solid #7c3aed;background:#7c3aed;color:#fff' : k === 'v' ? `border:1px solid ${VIO};background:var(--card);color:var(--vtx)` : k === 't' ? 'border:1px solid transparent;background:transparent;color:var(--body)' : 'border:1px solid var(--line2);background:var(--card);color:var(--ink)'}${dis ? ';opacity:.45;cursor:not-allowed' : ''}">${t}</button>`;
    const lnk = t => `<a href="#" style="font-size:13px;font-weight:600;color:var(--vtx);text-decoration:none">${t}</a>`;
    const MENU = l => `<button type="button" aria-haspopup="menu" aria-label="${l}" style="width:36px;height:36px;border-radius:9px;border:none;background:transparent;color:var(--body);font-size:16px;font-weight:800;cursor:pointer">⋯</button>`;
    const CNT = n => `<span style="${M};font-size:12px;font-weight:500;color:var(--mut)">${n}</span>`;
    const card = (title, inner, right, extra) => `<section style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;min-width:0;${extra || ''}"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px"><h2 style="margin:0;font-size:15px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px">${title}</h2>${right || ''}</div>${inner}</section>`;
    const TH = t => t ? `<span role="columnheader" style="${M};font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${t}</span>` : '<span role="columnheader"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></span>';
    const tbl = (gt, heads, rows) => `<div role="table" style="display:flex;flex-direction:column;min-width:0"><div role="row" style="display:grid;grid-template-columns:${gt};gap:12px;align-items:center;padding:0 6px 8px">${heads.map(TH).join('')}</div>${rows.map(r => `<div role="row"${r.tab ? ' tabindex="0"' : ''} style="display:grid;grid-template-columns:${gt};gap:12px;align-items:center;padding:11px 6px;border-top:1px solid var(--line);${r.st || ''}">${r.c.map(x => `<div role="cell" style="min-width:0;font-size:13px;line-height:1.45">${x}</div>`).join('')}</div>`).join('')}</div>`;
    const SK = (n, h) => Array.from({ length: n }, () => `<div style="height:${h || 44}px;border-radius:7px;background:var(--skel)"></div>`).join('');
    const FLD = (label, inner, help) => `<div style="flex:none;display:flex;flex-direction:column;gap:6px"><span style="font-size:12.5px;font-weight:700">${label}</span>${inner}${help ? `<span style="font-size:12px;line-height:1.45;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap">${help}</span>` : ''}</div>`;
    const INP = (val, ph, st) => `<div role="textbox" style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13.5px;color:${val ? 'var(--ink)' : '#a1a1aa'};${st || ''}">${val || ph}</div>`;
    const SEL = val => `<div role="combobox" aria-expanded="false" tabindex="0" style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);font-size:13.5px;font-weight:600">${val}<span aria-hidden="true" style="color:var(--mut)">▾</span></div>`;
    const RAD = on => `<span aria-hidden="true" style="width:16px;height:16px;flex:none;border-radius:999px;box-sizing:border-box;border:${on ? '5px solid #7c3aed' : '1.5px solid var(--line2)'};background:var(--card)"></span>`;
    const CHK = on => `<span aria-hidden="true" style="width:16px;height:16px;flex:none;border-radius:4px;box-sizing:border-box;display:grid;place-items:center;font-size:10px;font-weight:800;line-height:1;${on ? 'background:#7c3aed;border:1px solid #7c3aed;color:#fff' : 'background:var(--card);border:1.5px solid var(--line2);color:transparent'}">✓</span>`;
    const TOG = on => `<span aria-hidden="true" style="width:36px;height:20px;flex:none;border-radius:999px;position:relative;box-sizing:border-box;background:${on ? '#7c3aed' : 'var(--line2)'}"><span style="position:absolute;top:2px;${on ? 'right:2px' : 'left:2px'};width:16px;height:16px;border-radius:999px;background:#fff"></span></span>`;
    const NOTE = (t, k) => `<div style="flex:none;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;${k === 'lav' ? 'background:var(--lav);border:1px solid var(--lavE);color:var(--ink)' : 'background:var(--raised);border:1px solid var(--line);color:var(--body)'}">${t}</div>`;
    const DL = rows => `<dl style="margin:0;flex:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden">${rows.map(([k, val], i) => `<div style="display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 12px;${i ? 'border-top:1px solid var(--line)' : ''}"><dt style="${M};font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)">${k}</dt><dd style="margin:0;font-size:13px;line-height:1.45;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${val}</dd></div>`).join('')}</dl>`;
    const CHIPS = L => `<div style="display:flex;flex-wrap:wrap;gap:4px">${L.map(x => `<span style="display:inline-flex;align-items:center;min-height:22px;padding:1px 8px;border-radius:999px;font-size:11.5px;background:var(--chip);border:1px solid var(--line2);color:var(--body)">${x}</span>`).join('')}</div>`;

    const AUTH = { View: 'View: Sees the work. Does not act on it.', Work: 'Work: Does the work and drafts it.', Flag: 'Flag: Raises a concern for review.', Sponsor: 'Sponsor: Champions a proposal and answers for it.', Vote: 'Vote: Decides. The only level that does.' };
    const PPL = [
      { n: '[Avery Stone] · you', ini: 'AS', sub: '[you@example.com]', role: 'Owner', title: '[Principal]', au: 'Sponsor', st: 'Active' },
      { n: '[Jordan Reyes]', ini: 'JR', role: 'Admin', title: '[Partner / GP]', au: 'Vote', st: 'Active' },
      { n: '[Sam Okafor]', ini: 'SO', role: 'Founder', title: null, au: 'Work', st: 'Active' },
      { n: '[Riley Chen]', ini: 'RC', role: 'Member', title: '[Analyst]', au: 'View', st: 'Active' },
      { n: '[Taylor Brooks]', ini: 'TB', role: 'Member', title: '[Associate]', au: 'Flag', st: 'Invited' }
    ];
    const RR = bT('Resend') + bT('Revoke', 'var(--body)');
    const INVC = [{ t: '[a•••@example.com] · sent [28 Oct] · expires [11 Nov] · email sent', right: RR }, { t: '[k•••@example.com] · sent [30 Oct] · expires [13 Nov] · email sent', right: RR }];
    const AGENTS = [
      { role: 'CFO', src: 'Platform model · [Model A]', tools: '+ [2] read-only tools from [Finance MCP]', sp: '[Avery Stone]', st: 'Active', month: '$[3.84] of $[25] cap', last: '[2 h ago]' },
      { role: 'COO / Operations', src: 'Platform model · [Model B]', sp: '[Jordan Reyes]', st: 'Active', month: '$[1.12] of $[15] cap', last: '[Yesterday]' },
      { role: 'CMO / Growth', src: 'Platform model · [Model A]', sp: '[Avery Stone]', st: 'Paused', why: 'Reached its monthly cap', month: '$[10.00] of $[10] cap', last: '[3 d ago]' },
      { role: 'Research analyst', src: 'Platform model · [Model C]', sp: '[Sam Okafor]', st: 'Active', month: null, last: null }
    ];

    const INV = (rows, title) => `<div style="flex:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:2px 14px;background:var(--raised)"><div style="padding:10px 0 8px">${EY(title || 'Invitations')}</div>${rows && rows.length ? rows.map(r => `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);${r.hl ? 'background:var(--lav);margin:0 -14px;padding:9px 14px' : ''}"><div style="display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap">${r.src ? pill(r.src, 'neu') : ''}<span style="${M};font-size:12.5px;color:${r.dead ? 'var(--mut)' : 'var(--ink)'}">${r.t}</span>${r.tag || ''}${r.note ? `<span style="font-size:12px;color:var(--mut);flex-basis:100%">${r.note}</span>` : ''}</div><div style="display:flex;align-items:center;gap:2px;flex:none">${r.right || ''}</div></div>`).join('') : '<p style="margin:0;padding:10px 0 12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)">No invitation is waiting.</p>'}</div>`;
    const PGT = 'minmax(0,2.4fr) 104px minmax(0,1.3fr) 112px 92px 40px';
    const pRows = (L, ro) => L.map(p => ({ c: [personId(p.n, p.ini, p.sub), `<span style="font-weight:600">${p.role}</span>`, p.title ? p.title : NR, pill(p.au, 'lav', AUTH[p.au]), p.st === 'Active' ? pill('Active', 'pos') : pill('Invited', 'neu'), ro ? '' : MENU('Actions for ' + p.n.replace(' · you', ''))], st: p.hl ? 'background:var(--lav);border-radius:10px' : '' }));
    const peopleCard = o => { o = o || {}; const L = o.list || PPL; return card(`People ${CNT('[' + L.length + ']')}`, (o.info || '') + tbl(PGT, ['Name', 'Role', 'Title', 'Authority', 'Status', ''], pRows(L, o.ro)) + (o.extra || '') + (o.ro ? `<p style="margin:0;font-size:12.5px;color:var(--mut)">${o.roLine || 'Only an Owner, Admin or Founder changes the team.'}</p>` : INV('inv' in o ? o.inv : INVC)), o.right); };
    const AGT = 'minmax(0,1.75fr) minmax(0,1.9fr) minmax(0,1fr) minmax(0,1.3fr) 150px 108px 40px';
    const agStat = (a, o) => o.paused ? `<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${pill('Paused', 'amb')}<span style="font-size:12px;line-height:1.4;color:var(--mut)">Eadwyn is paused for this account</span></div>` : a.st === 'Active' ? pill('Active', 'pos') : `<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${pill('Paused', 'amb')}<span style="font-size:12px;line-height:1.4;color:var(--mut)">${a.why}</span>${a.act ? lnk(a.act) : ''}</div>`;
    const aRows = (L, o) => L.map(a => ({ tab: 1, c: [agentId(a.role), `<div style="display:flex;flex-direction:column;gap:2px"><span>${a.src}</span>${a.tools ? `<span style="font-size:12px;color:var(--mut)">${a.tools}</span>` : ''}</div>`, a.sp, agStat(a, o), a.month ? `<span style="${M};font-size:12.5px">${a.month}</span>` : NR, a.last ? `<span style="${M};font-size:12.5px">${a.last}</span>` : NR, o.ro ? '' : MENU('Actions for the ' + a.role + ' agent')], st: 'cursor:pointer' }));
    const agentsCard = o => { o = o || {}; const L = o.list || AGENTS; return card(`AI agents ${L.length ? CNT('[' + L.length + ']') : ''}`, o.inner || (tbl(AGT, ['Agent', 'Source', 'Sponsor', 'Status', 'This month', 'Last activity', ''], aRows(L, o)) + `<p style="margin:0;font-size:12.5px;color:var(--mut)">${o.note || 'Agents propose; a named person accepts. Nothing is written without Accept.'}</p>`), o.right); };
    const AGEMPTY = `<div style="border:1px dashed var(--line2);border-radius:10px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">${AG(40)}<p style="margin:0;max-width:520px;font-size:13.5px;line-height:1.55;color:var(--body)">No agent works here yet. Add one in a role, like a CFO who drafts your runway note. It will only propose; you decide.</p>${bP('Add an AI agent')}</div>`;

    const SIDE = ['Studio', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research'];
    const RW = 52;
    const rail = st => {
      st = st || 'on';
