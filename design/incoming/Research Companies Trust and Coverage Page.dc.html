        + '<h2>Live announcements</h2>' + tbl(['Moment', 'Polite live region says'], [['Results load', '“26 to 50 of 186 companies match. 3 on hold, shown with their status.”'], ['Return from a profile, selection re-checked', '“Back to your results. 5 selected: 1 renamed, 1 on hold, 1 no longer available. Review selection.”'], ['Export preparing / done / refused', '“Preparing 183 rows.” · “companies-filtered-183-rows-2026-11-21.csv is ready.” · the Worker’s refusal sentence (role=alert)'], ['A profile section fails', 'role=alert on that section only: “Business facts are unavailable. Try again.”']])
        + '<h2>Touch, contrast, colour</h2>' + tbl(['Area', 'Rule'], [['Targets', '44 px on tablet and phone; filter chips 44 px tall in the sheet'], ['Status', 'Every review word and state carries a glyph and a word; the On hold row has a left rule and the chip, never colour alone'], ['Reasons', 'Visible text on the second line, never a title attribute'], ['Motion', 'Skeletons do not shimmer under prefers-reduced-motion']])),
      RCT12H: () => dk('<h1>RCT-12 · Handoff · Page 1 Trust and Coverage</h1><p>Checked read-only against <code>main</code> at <code>a2677f7615</code> (21 Nov 2026). The brief was written on <code>602e6e1b0</code>.</p>'
        + '<h2>What main does today</h2>' + tbl(['File', 'What it shows'], [
          ['<code>routes/research.ts</code> · <code>GET /company-directory</code>, <code>/company-directory/:uid</code>', 'Admits a held Founder or Advisor licence, an active Lab or an admin (D7178), else 403. <code>?part=</code> reads one evidence collection on its own (D7180)'],
          ['<code>services/researchCompanyDirectory.ts</code>', 'Each list returns <code>coverage.of</code>, <code>coverage.fields</code> and <code>facets.countries[].count</code>, counted on every call. The profile returns <code>source_name</code>, <code>source_url</code>, <code>source_license</code>, <code>as_of</code>, <code>website_status</code> (not_recorded, not_verified, verified; no writer for verified) and <code>tracked_sector</code> with <code>method</code>, or Not recorded with its reason, or unreadable'],
          ['<code>pages/research/CompanyProfile.jsx</code>, <code>AnalysisSubject.jsx</code>', 'Label every record not from Companies House “Wikidata · CC0”, the audit’s finding; K0 (#7810, #7812) fixes it first. Tracked sector reads Not recorded or Unavailable'],
          ['<code>pages/research/CompanyDirectoryZone.jsx</code>, <code>companyDirectoryState.js</code>', 'Filters, sort and page in the address; the selection and return point kept in this tab’s session (#7179, PR #7206). Coverage is a closed disclosure. No export control on the Companies directory yet: “Export this page” is K0 (#7813)'],
          ['Review status, native classification, mapping states, identity, business facts', 'Not on main: no column, table or read']])
        + '<h2>◇ Requires engineering (KEY lines used)</h2>' + tbl(['Line', 'What', 'Issues'], [['K0', 'Stored publisher, licence, attribution and mixed-source label; the page export columns; built first, drawn as the starting state', '#7810, #7812, #7813'], ['K1', 'Review status, reason, proof, check date, next action; the separate record dates; applied to every reader', '#7819 (store), #7820 (admin writes, no screen here), #7823'], ['K2', 'Native classification and the six mapping states', '#7821, #7822'], ['K3', 'Stored summary: by publisher, by information type, largest-country counts, refresh date; tracked-sector and mapping-state filters; the re-check read for a kept selection', '#7829, #7830'], ['K4', 'Export selection and filtered companies, scope words, row cap', '#7831'], ['K5', 'Legal names, other names, identifiers, the checked website', '#7825'], ['K6', 'Business facts with passages; what is supported per job', '#7828']])
        + '<h2>⚑ Pending the owner</h2>' + tbl(['Question', 'Drawn', 'Boards'], [['How a record on hold is served (#7819)', 'A: in results and on its profile with status and reason; left out of peers, counts and the filtered export. B hides it from all but an admin; C shows it everywhere with its status', 'RCT-01 to RCT-05, RCT-07 · <b>drawn to A, not for build until answered</b>'], ['Who opens Companies (#7824)', 'A: as main admits today; an Advisor is not offered Add to research or Compare', 'RCT-08']])
        + '<h2>Frontend only</h2>' + tbl(['Change', 'Detail'], [['Status chips and words', 'The four review words in the ST-12 shape; Needs research as a reason line'], ['Row layout', 'Publisher and as-of line, the hold line, sector label over tracked sector or mapping state'], ['Export menu', 'Scope and count on each item, the five states, no file past the cap'], ['Profile sections', 'Each section reads and fails alone, with Try again'], ['Phone and tablet', 'Cards, Filters sheet, stacked coverage, export bottom sheet']])
        + '<h2>BUILD ISSUES</h2><p>Page 1 · #7848: RCT-01 to RCT-04, RCT-08. #7849: RCT-05 to RCT-07, RCT-09. Shared by both: RCT-00, RCT-10 to RCT-12.</p><p>Handoff onward: Page 1 hands to an analysis (Set up competitor analysis →) or a shortlist (Add to research), as landed. ' + EAD + ' No fit score, rank or completeness figure is drawn; no catalogue count is worded as a market’s size.</p>')
    };

    const MOB = {
      RCT10C: () => pDir(),
      RCT10D: () => phone('Companies', ptop, { sheet: sheet('Filters', '<p class="rcd-scope" style="margin:0">Counts are of the ' + CNT + ' counted records</p><div class="rct-pf"><b>Tracked sector</b>' + J(TRK.slice(0, 4).map((t, i) => '<label class="rcd-hb rcd-p44' + (i === 3 ? ' on' : '') + '"><input type="checkbox"' + (i === 3 ? ' checked' : '') + '>' + t[0] + ' <span class="rcd-mo">' + t[1] + '</span></label>')) + '</div><div class="rct-pf"><b>Mapping state</b>' + J(MAPS.slice(1, 4).map(m => '<label class="rcd-hb rcd-p44"><input type="checkbox">' + m[0] + ' <span class="rcd-mo">' + n(m[1]) + '</span></label>')) + '</div>', '<button type="button" class="btn rcd-p44" style="flex:1">Reset all</button><button type="button" class="btn p rcd-p44" style="flex:1">Show results</button>') }),
      RCT10E: () => phone('Coverage', '<p class="rct-fixed">Counts of catalogue records. Not the size, share or full population of a market.</p>' + J([['By field', '8 fields · of ' + CNT, true], ['By country', '[1,840] in 3 countries', false], ['By publisher', '4 publishers · 16 name none', false], ['By information type', '4 types', false], ['By mapping state', '1,240 mapped', false]].map(d => '<details class="rct-pd"' + (d[2] ? ' open' : '') + '><summary>' + d[0] + ' <span class="raw">' + d[1] + '</span></summary>' + (d[2] ? J(FIELDS.slice(0, 5).map(c => '<div class="rcd-cv"><div><span>' + c[0] + '</span><b class="rcd-mo">' + n(c[1]) + '</b></div>' + bar(c[1], 3050) + '</div>')) : '') + '</details>')) + '<p class="rcd-foot">120 on hold not counted · refreshed 14 Nov 2026</p>'),
      RCT10F: () => phone('Companies', ptop, { sheet: sheet('Export', '<button type="button" class="rct-pex"><b>Export this page · 25 rows</b><small>Rows on page 2 as shown</small></button><button type="button" class="rct-pex"><b>Export selection · 2 companies</b><small>[Orchard Data], [Halden Grid]</small></button><button type="button" class="rct-pex"><b>Export filtered companies · 183 rows</b><small>186 match, less 3 on hold</small></button>', '<button type="button" class="btn rcd-p44" style="flex:1">Cancel</button>') }),
      RCT10G: () => pProf(),
      RCT11D: () => pDir(),
      RCT11E: () => pProf()
    };

    const STATES = {
      RCT01B: () => crop(anno('RCT-01 · filters', 'The two new filters open as checkbox chips, each option with its count of the counted records ' + ENG('K3 #7830') + '. Picked options go into the address and the Back to results summary.') + filters({ trk: 'Energy storage', map: 'All mapping states', open: '<div class="rct-opts"><div><b>Tracked sector</b>' + J(TRK.map((t, i) => '<label class="rcd-hb' + (i === 5 ? ' on' : '') + '"><input type="checkbox"' + (i === 5 ? ' checked' : '') + '>' + t[0] + ' <span>' + t[1] + '</span></label>')) + '<span class="mu" style="font-size:11.5px">and 9 more · 1,240 mapped in all</span></div><div><b>Mapping state</b>' + J(MAPS.map(m => '<label class="rcd-hb"><input type="checkbox">' + m[0] + ' <span>' + n(m[1]) + '</span></label>')) + '</div></div>' }) + active({ extra: '<span class="fc">Tracked sector: Energy storage<button type="button" aria-label="Remove filter: tracked sector energy storage">✕</button></span>' }) + '<div class="rct-addr"><span class="eye">Address</span><code>/research/companies?founded_from=2016&amp;founded_to=2024&amp;tracked_sector=energy-storage&amp;sort=-funding</code></div><a href="#" class="rcd-back">‹ Back to results <span>Founded 2016 – 2024 · Tracked sector: Energy storage · Funding total, highest first</span></a>', 1200),
      RCT02: () => crop(anno('RCT-02 · #7848', 'The coverage disclosure of RS-17 A, opened and extended. By field and by country are recorded today; the rest is ◇. ' + EAD) + coverage(), 1200),
      RCT03: () => page(anno('RCT-03 · #7848', 'The Export in the page header carries “this page”. Each scope states its count before the click, in the words #7831 fixes. ' + EAD) + head({ exp: true }) + '<div style="position:relative;height:430px">' + '<div style="position:absolute;right:0;top:-8px;z-index:3">' + expMenu() + '</div>' + countLine() + '<div style="opacity:.45">' + table({ rows: ROWS.slice(0, 4) }) + '</div></div>', { h: 900 }),
      RCT03B: () => crop('<span class="eye">RCT-03 · the export frames · the last three offer no file</span><div class="rct-g5">'
        + stb('Preparing', '<b>Export filtered companies · 183 rows</b><span class="rct-live">' + G.ld + 'Preparing 183 rows…</span><p class="rcd-foot">The menu stays open; Cancel stops it.</p>')
        + stb('Done', '<span class="rcd-live">' + G.ok + 'Ready</span><p><code>companies-filtered-183-rows-2026-11-21.csv</code></p><p class="rcd-foot">183 rows · 3 on hold left out · scope, count and day in the name</p>')
        + stb('Zero rows', chip('zero', 'No rows') + '<p>Nothing matches these filters, so there is no file. A file of headers only is never offered.</p>')
        + stb('Failed', chip('un') + '<p>The export read failed. No file was made, and none is cut short.</p>' + retry())
        + stb('Past the cap', chip('rf') + '<p>“3,050 companies match and one export holds at most 1,000. Narrow the filters.”</p><p class="rcd-foot">The Worker’s sentence, shown as it comes ' + ENG('K4 #7831') + '. No file.</p>')
        + '</div>', 1440),
      RCT04: () => page(anno('RCT-04 · #7848', 'Back from a profile. The kept selection is read again ' + ENG('K3 #7830') + ': one company renamed, one ' + ENG('K1') + ' On hold, one no longer available. The bar says so before Add to research or Compare can act. ' + EAD) + head() + active() + '<span class="rcd-live" role="status">' + G.ok + 'Back to your results: page 2 · 5 selected, 3 changed since you picked them</span>' + countLine() + table({ rows: ROWS.slice(5, 9), off: 5, sel: { hg: 1, qa: 1 } })
        + '<div class="rcd-sbar rct-sbar2" role="region" aria-label="Selected companies"><span><span><b class="rcd-mo">5</b> selected · <b>3 changed</b></span><small>1 renamed · 1 on hold · 1 no longer available, left out</small></span><button type="button" class="btn t bsm">Clear</button><button type="button" class="btn bsm" aria-haspopup="dialog">Review selection</button><button type="button" class="btn bsm">Add 4 to research</button><button type="button" class="btn p bsm">Compare 4</button></div>', { h: 900 }),
      RCT04B: () => crop(review(), 760),
      RCT05: () => page(anno('RCT-05 · #7849', 'The profile of RS-18 A with the record card for any publisher (K0) and, new, the status band ' + ENG('K1') + ', Identity ' + ENG('K5') + ' and Dates ' + ENG('K1') + '. Primary action unchanged. ' + EAD) + pHead(QA, { band: holdBand }) + secnav('Record') + '<div class="rcp-g2" style="align-items:start">' + identity() + dates() + '</div>' + cited('RS-18 A · Key metrics, Sector peers, Market context, Funds, Signals, Evidence', 120)),
      RCT05B: () => crop('<span class="eye">RCT-05 · the record card for any publisher ' + ENG('K0 #7810 #7812') + '</span><div class="rcp-g4">' + recCard('ch') + recCard('ra') + recCard('cw') + recCard('none') + '</div><p class="rcd-foot">Companies House ([Kestrel Robotics]), a register record ([Register A], Vellum Freight), a company-website record ([Northwind Labs]) and Source not recorded (Fernhill Analytics). Each names its own publisher; none is assumed.</p>', 1440),
      RCT05C: () => crop('<span class="eye">RCT-05 · the review status band, four cases ' + ENG('K1 #7819 #7823') + '</span><div class="rcp-g2">'
        + stb('On hold', holdBand)
        + stb('No review recorded', band({ chip: chip('nrv'), t: 'No review recorded', p: 'Axal has not checked this record. It is shown as the publisher states it.' }) + '<p class="rcd-foot">Never drawn as “Admitted”. A failed review-status read is Unavailable, never this.</p>')
        + stb('Withdrawn', band({ chip: chip('wd'), t: '[Company B Mobility] · Withdrawn', p: 'Reason: [the publisher retracted the record] · Withdrawn on <span class="mo">6 Nov 2026</span> · Checked by Axal on <span class="mo">7 Nov 2026</span>' }) + '<p class="rcd-foot">The saved name, status and reason only. No values, no peers, no actions but Back.</p>')
        + stb('Excluded', band({ chip: chip('ex'), t: '[Company D Holdings] · Excluded', p: 'Reason: [not an operating company: a holding entity] · Checked by Axal on <span class="mo">5 Nov 2026</span>' }) + '<p class="rcd-foot">As Withdrawn: saved name, status, reason, no values.</p>')
        + '</div>', 1440),
      RCT06: () => page(anno('RCT-06 · #7849', 'Classification ' + ENG('K2') + ' and what the record supports ' + ENG('K6') + '. ' + EAD) + pHead(HG, { rev: nrvLine }) + secnav('Classification') + classCard() + supports() + cited('RS-18 A · Key metrics and the sections below', 90)),
      RCT06B: () => crop('<span class="eye">RCT-06 · seven classification cases side by side · the six mapping states are Values ' + ENG('K2 #7821 #7822') + '</span><div class="rct-g7">' + J(CASES.map(caseCard)) + '</div><p class="rcd-foot">“Tracked sector: Not recorded” no longer appears. Each case names its native scheme and code where the publisher states one.</p>', 1440),
      RCT07: () => page(anno('RCT-07 · #7849', 'Business facts by attribute ' + ENG('K6 #7828') + ', a conflict shown on both facts, an outdated fact with its replacement, and the sector peers of RS-18 B with the hold rule ' + ENG('K1') + '. ' + EAD) + crumb('[Halden Grid]') + '<h1 class="rct-h1s">[Halden Grid]</h1>' + secnav('Business facts') + facts() + peers()),
      RCT07B: () => crop(passage(), 1000),
      RCT08: () => crop('<span class="eye">RCT-08 · states for the directory · #7848 · no save states: the page writes nothing of its own (Add to research and Compare keep RS-15 B)</span><div class="rct-g3">'
        + stb('Loading', skel())
        + stb('Empty · filters with nothing', chip('zero', 'No matches') + '<p><b>No company matches Tracked sector: Energy storage, Mapping state: Kept unmapped by hand.</b></p><div class="rcd-relax"><span class="fc">Tracked sector: Energy storage<button type="button" aria-label="Remove filter">✕</button></span><span class="fc">Kept unmapped by hand<button type="button" aria-label="Remove filter">✕</button></span></div><button type="button" class="btn bsm">Remove the last filter</button>')
        + stb('Not recorded', '<p>Coverage: Catalogue refreshed ' + NR + '</p><p class="rcd-foot">“Last refreshed: not reported by the directory today” until K3 #7829.</p><p>Row: <span class="rct-mapv">Mapping state</span> <b>Mapping not computed yet</b></p>')
        + stb('Unavailable · today', unBox('The company directory did not answer', 'No rows and no counts: coverage fails with the results in one read. Your filters and selection are kept.', 'the filters, the address, Copy link'))
        + stb('Unavailable · breakdowns alone ' + ENG('K3'), unBox('The coverage breakdowns did not load', 'Results are shown. By publisher, information type and mapping state are not.', 'every result, the filters, export of this page'))
        + stb('Unavailable · review status ' + ENG('K1'), unBox('Review status could not be read', 'The list is not shown: it would read as if every row were checked and admitted.', 'the filters and the address'))
        + stb('Refused · Advisor', chip('rf', 'Add to research and Compare: not offered') + '<p>An Advisor can read the directory and profiles. Adding and comparing need a held Founder licence, an active Spin-Out Lab or an admin. Ask your Lab admin.</p><p class="rcd-foot">No qualifying licence at all is RS-16B-08, not redrawn. ⚑ #7824 A</p>')
        + stb('Export', '<p>Preparing · failed · past the cap, as RCT-03.</p>' + chip('rf') + '<p class="rcd-foot">“3,050 companies match and one export holds at most 1,000. Narrow the filters.”</p>')
        + stb('A filter value no longer offered', '<span class="rcd-live">' + G.ok + 'Mapping state reset</span><p>The address asked for “Unmapped”, which is no longer a state. The filter falls back to All mapping states and says so.</p>')
        + '</div>', 1440),
      RCT09: () => crop('<span class="eye">RCT-09 · states for the profile · #7849 · each section reads and fails alone</span><div class="rct-g3">'
        + stb('Loading', skel('Loading the record', 'Header first; each section shows its own skeleton and no value until its read answers.'))
        + stb('Empty · no business fact yet', '<p><b>Business facts</b></p>' + NRR() + '<p class="rcd-foot">An Axal admin adds checked facts. A member has no action here.</p>')
        + stb('Unavailable · one section', unBox('Business facts are unavailable', 'The facts read failed. Identity, classification, dates and peers stay.', 'every other section') + '<p class="rcd-foot">Never a blank profile, never “none”.</p>')
        + stb('Not recorded', '<dl class="kv2"><dt>Native classification</dt><dd>' + NR + '</dd><dt>Legal name</dt><dd>' + NR + '</dd><dt>Source effective</dt><dd>' + NR + '</dd></dl>')
        + stb('Withdrawn record', band({ chip: chip('wd'), t: '[Company B Mobility] · Withdrawn', p: 'Reason: [the publisher retracted the record] · 6 Nov 2026' }) + '<p class="rcd-foot">No values are shown.</p>')
        + stb('Refused', chip('rf') + '<p>As RS-16B-08: this account does not hold access to Companies. A held Founder or Advisor licence, an active Spin-Out Lab or an admin can open it.</p>')
        + '</div>', 1440),
      RCT10A: () => '<div class="cv rcp" style="' + VARS + ';width:768px;height:1024px;overflow:hidden"><div class="pt" style="padding:0 10px"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Research · Companies</b><button type="button" class="pi" aria-label="Open Eadwyn"><span class="rcd-e">E</span></button></div><div style="padding:18px 22px;display:flex;flex-direction:column;gap:12px"><h1 style="font-size:22px;font-weight:800">Companies</h1>' + ptop + J(ROWS.slice(5, 10).map((r, i) => pcard(r, i + 5))) + '</div></div>',
      RCT10B: () => '<div class="cv rcp" style="' + VARS + ';width:768px;height:1024px;overflow:hidden"><div class="pt" style="padding:0 10px"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">[Quarry AI]</b><button type="button" class="pi" aria-label="Open Eadwyn"><span class="rcd-e">E</span></button></div><div style="padding:18px 22px;display:flex;flex-direction:column;gap:12px">' + holdBand + '<h1 style="font-size:24px;font-weight:800">[Quarry AI]</h1>' + metaChips(QA) + '<div class="rcp-g2">' + acts() + recCard('wd') + '</div>' + identity() + '</div></div>',
      RCT11A: () => page(directory()),
      RCT11B: () => page(pHead(QA, { band: holdBand }) + secnav('Record') + '<div class="rcp-g2" style="align-items:start">' + identity() + dates() + '</div>'),
      RCT11C: () => page(pHead(HG, { rev: nrvLine }) + secnav('Classification') + classCard() + supports())
    };

    let html = '';
    if (B === 'RCT01') html = page(anno('RCT-01 · #7848', 'RS-17 A as landed, with the publisher and as-of on every row (K0). New: ' + ENG('K1') + ' the On hold chip and its reason on the row; ' + ENG('K3') + ' the tracked sector or mapping state under the sector label; two filters; the count names the 3 on hold. ⚑ #7819 drawn to A, not for build until answered. ' + EAD) + directory());
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(directory());
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
