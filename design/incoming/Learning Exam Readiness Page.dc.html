      <div class="nt"><span class="ic" aria-hidden="true">i</span><div>The intro (<code>GET /api/learning/exams/:uid</code>) and the attempts (<code>GET …/attempts</code>) fail apart. If the intro fails, the whole card is Unavailable with Retry and no Start. The server never lets a start exceed the limit, but a start while the count is unknown would still spend an attempt the learner could not see.</div></div>`);

    /* ===== Author preview (proposed) ===== */
    else if (B === 'LEX05') html = shell('a', `${HEAD({ eye: 'Learning · Exam · preview', acts: `<a class="btn" href="#">Edit in Studio</a>` })}
      <div class="xprev" role="status"><span aria-hidden="true" style="font:800 14px var(--mo);color:var(--vt)">◇</span><div><b>Preview · not an attempt.</b> Nothing is recorded, your attempts stay at 3, and the questions stay editable. Keyed answers are shown to you only.</div><span style="margin-left:auto">${TB('proposed · #8667')}</span></div>

      <div class="xq"><h2 id="qh">${Q[1]}</h2>${J(OPTS.map((t, k) => `<div class="xopt${k === 0 ? ' on' : ''}"><span class="xr" aria-hidden="true"></span><span>${t}${k === 0 ? ' <span class="xkeyd">· keyed answer</span>' : ''}</span></div>`))}<p class="sub"><b>Explanation:</b> Before-and-after logs from the customers who would make the claim are the only option a reader can check.</p></div>
      <div class="xnav"><button type="button" class="btn">‹ Question 1</button><button type="button" class="btn t">End preview</button><button type="button" class="btn p">Question 3 ›</button></div></section></div>
      <div class="c4" style="display:flex;flex-direction:column;gap:16px"><section class="cd"><div class="ch"><h2>How the preview works</h2></div><ul class="tl"><li><span class="mk ok">1</span><span>Reads the Studio exam (<code>GET /api/admin/learning/exams/:uid</code>), which already carries questions and keys. Super Admin only.</span><span></span></li><li><span class="mk ok">2</span><span>Never calls <code>POST …/attempts</code>, so no attempt, no allowance, no freeze.</span><span></span></li><li><span class="mk no">3</span><span>No score: a marked dry run needs a grade route that writes nothing. ${TB('proposed')} ${TO('Q2 A')}</span><span></span></li><li><span class="mk no">4</span><span>Program admins who author but are not Super Admin cannot read keys today. ${TB('proposed')}</span><span></span></li></ul></section></div></div>`, { h: 940 });

    /* ===== Exams tab ===== */
    else if (B === 'LEX06') html = EXPAGE(`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">Observed</span><span class="foot">1 Unavailable → 2 Retry → 3 empty, published-catalogue only</span></div>${EXEMPTY(true)}`);
    else if (B === 'LEX06B') html = crop(1440, `<div class="g3">${stcard('1 · Read failed', 'Exams', EXUN)}${stcard('Search miss', 'Exams', `<div class="xempty"><h3>No exam title matches “cohort”</h3><p class="sub">Try another word, or clear the search.</p><button type="button" class="btn">Clear search</button></div>`)}${stcard('Published · synthetic', 'Exams', `${EXROW}<p class="foot">Row figures come from <code>GET /api/learning/exams</code>; a row whose attempts read is missing says Not recorded.</p>`)}</div>
      <p class="foot">The empty state (3) is its own words: “No exams published yet”. It is never shown for a failed read (1) or a search miss. Members never see the draft line.</p>`);

    /* ===== Proposed in-attempt flow (synthetic) ===== */
    else if (B === 'LEX07') html = PREPAGE('f', 'ready', { overlay: STARTDLG(1), acts: `${SYN}<button type="button" class="btn">Add to plan</button>` });
    else if (B === 'LEX08') html = shell('f', `${HEAD({ crumb: false, eye: 'Exam · attempt 1 of 3', sub: false, acts: `${SYN}<a class="btn t" href="#">Leave · resume later</a>` })}<div class="g"><div class="c8">${QCARD(2, 0)}</div><div class="c4" style="display:flex;flex-direction:column;gap:16px"><section class="cd"><div class="ch"><h2>Questions</h2><span class="sm">1 answered</span></div><ol class="xrows">${J(Q.slice(0, 4).map((q, i) => `<li style="grid-template-columns:26px minmax(0,1fr) auto"><span class="n">${i + 1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${q}</span>${i === 0 ? '<span class="xc ok"><i aria-hidden="true">✓</i></span>' : i === 1 ? '<span class="xc op"><i aria-hidden="true">●</i>Here</span>' : '<span></span>'}</li>`))}</ol><p class="foot">+ 4 more. ${TB('question list · proposed')}</p></section></div></div>`, { h: 860 });
    else if (B === 'LEX09') html = shell('f', `${HEAD({ crumb: false, eye: 'Exam · attempt 1 of 3', sub: false, acts: SYN })}<div class="g"><div class="c8">${REVIEW()}</div><div class="c4"><section class="cd"><div class="ch"><h2>On main today</h2></div><p class="sub">Review before you submit, per-question Edit and Submit answers exist in <code>ExamFlow.jsx</code>. This board restyles them; nothing new is recorded.</p></section></div></div>`, { h: 860 });
    else if (B === 'LEX10') html = shell('f', `${HEAD({ crumb: false, eye: 'Exam · attempt 1 of 3', sub: false, acts: SYN })}<div class="g"><div class="c8">${REVIEW()}</div></div>`, { h: 860, overlay: SUBDLG });
    else if (B === 'LEX11') html = shell('f', `${HEAD({ eye: 'Exam · result', acts: SYN })}<div class="g"><div class="c8" style="display:flex;flex-direction:column;gap:16px">${RESULT(false)}</div><div class="c4" style="display:flex;flex-direction:column;gap:16px"><section class="cd"><div class="ch"><h2>Your attempts</h2><span class="sm">2 left</span></div>${ATTS.one}</section></div></div>`, { h: 1300 });
    else if (B === 'LEX11B') html = shell('f', `${HEAD({ eye: 'Exam · result', acts: SYN })}<div class="g"><div class="c8" style="display:flex;flex-direction:column;gap:16px">${RESULT(true)}</div><div class="c4" style="display:flex;flex-direction:column;gap:16px"><section class="cd"><div class="ch"><h2>Your attempts</h2><span class="sm">1 left</span></div>${ATTS.two}<a class="btn t" href="#" style="align-self:flex-start" aria-disabled="true">Attempt 1 feedback ${TB('#8288')}</a></section></div></div>`, { h: 900 });
    else if (B === 'LEX12') html = PREPAGE('f', 'after1', { overlay: STARTDLG(2), att: 'one', acts: `${SYN}<button type="button" class="btn">Add to plan</button>` });
    else if (B === 'LEX13') html = crop(1440, `<div class="g3">${stcard('Start refused · 409', 'no_attempts_left', `<div class="nt" role="alert"><div>${RF()} This exam allows 3 attempts, and all have been used.</div></div><p class="foot">The route’s own words. The attempts list is read again, and Start becomes “No attempts left”.</p>`)}${stcard('Start not confirmed', 'Network failure', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Your attempt could not be confirmed.</b> It may have started. Trying again is safe: the server resumes an open attempt and never opens a second.</div></div><button type="button" class="btn p" style="align-self:flex-start">Try again</button>`)}${stcard('Save not reaching the account', 'In the attempt', `<p class="sub" role="status">${UN('not saved to your account')}</p><p class="sub">It is still kept on this device, and is sent again when you reconnect.</p><p class="foot">Words from <code>examServerDraft.js</code>; on main.</p>`)}</div>`);

    /* ===== Phone 390 × 844 ===== */
    else if (B === 'LEX20') html = phone('Exam', `${PHEAD()}<section class="cd" aria-labelledby="bs"><div class="ch"><h2 id="bs">Before you start</h2></div>${POL('ready')}<p class="xsum">${SUM.member}</p></section><section class="cd"><div class="ch"><h2>Your attempts</h2></div>${ATTS.none}</section>`, '<button type="button" class="btn p">Start attempt 1 of 3</button>');
    else if (B === 'LEX21') html = phone('Exam', `${PHEAD()}<section class="cd" aria-labelledby="bs"><div class="ch"><h2 id="bs">Before you start</h2></div>${POL('un')}<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Your attempts could not be read.</b> Not a claim that you have none left, or no limit.</div></div><p class="xsum">${SUM.unknown}</p></section>`, '<button type="button" class="btn xoff" aria-disabled="true" aria-label="Start exam, off until your attempts are read">Start exam</button><button type="button" class="btn p">↻ Retry</button>');
    else if (B === 'LEX22') html = phone('Exam', `${PHEAD()}<section class="cd">${POL('ready')}</section>`, '<button type="button" class="btn p">Start attempt 1 of 3</button>', { overlay: STARTDLG(1) });
    else if (B === 'LEX23') html = phone('Attempt 1 of 3', `${SYN}${QCARD(2, 0, '✓ Saved to your account', true).replace('<div class="xnav"><button type="button" class="btn">‹ Back</button><button type="button" class="btn p">Next ›</button></div>', '')}`, '<button type="button" class="btn">‹ Back</button><button type="button" class="btn p">Next ›</button>');
    else if (B === 'LEX24') html = phone('Review', `${SYN}${REVIEW(true).replace('<div class="xnav"><button type="button" class="btn">Back to questions</button><button type="button" class="btn p">Submit answers</button></div>', '')}`, '<button type="button" class="btn">Questions</button><button type="button" class="btn p">Submit answers</button>');
    else if (B === 'LEX25') html = phone('Result', `${RESULT(false, true).replace(/<div class="xnav"[^]*?<\/div><\/section>/, '</section>')}`, '<button type="button" class="btn p">Try again · attempt 2 of 3</button>');
    else if (B === 'LEX26') html = phone('Learning', `<header class="hdr"><span class="eye">Learning</span><h1 style="font-size:22px;font-weight:800">Learning</h1></header><label class="eye" for="ls">Catalogue</label><select id="ls" class="msel"><option>Exams</option></select><div class="xsrch" role="search"><span aria-hidden="true">⌕</span>Search</div>${EXEMPTY(false)}`, '', { back: false });
    else if (B === 'LEX27') html = phone('Exam · draft', `${PHEAD()}<section class="cd" aria-labelledby="bs"><div class="ch"><h2 id="bs">Before you start</h2></div>${DRAFTNOTE}${POL('ready')}<p class="xsum">${SUM.draft}</p></section>`, '<button type="button" class="btn">Start counted…</button><button type="button" class="btn p">Preview</button>');

    /* ===== Variants ===== */
    else if (B === 'LEX30') html = crop(1440, `<div><span class="eye">Components · variants</span><h2 style="font-size:18px;font-weight:800;margin-top:4px">Policy facts, the start action, status words and attempt rows</h2></div>
      <section class="cd"><div class="xvar">
      <span>Attempts left</span><div class="row"><div class="xbox"><b>3</b><small>of 3 · Value</small></div><div class="xbox"><b>2</b><small>after the open one</small></div><div class="xbox"><b>0</b><small>3 of 3 used · a Value</small></div><div class="xbox"><b style="font:700 14px var(--sg)">No limit</b><small>null after a good read</small></div><div class="xbox">${NR()}<small>limit not sent · Start off</small></div><div class="xbox">${UN()}<small>read failed · Retry · Start off</small></div><div class="xbox">${SK(60)}<small>reading · Start off</small></div></div>
      <span>Time</span><div class="row"><div class="xbox"><b style="font:700 14px var(--sg)">No time limit</b><small>null: untimed, once</small></div><div class="xbox"><b>30 min</b><small>timed: “the clock runs until you submit”</small></div><div class="xbox">${NR()}<small>value not sent</small></div></div>
      <span>Pass mark</span><div class="row"><div class="xbox"><b>75%</b><small>6 of 8 right · derived in the page</small></div><div class="xbox">${NR()}<small>value not sent</small></div></div>
      <span>Start action</span><div class="row"><button type="button" class="btn p">Start attempt 1 of 3</button><button type="button" class="btn p">Resume attempt 1</button><button type="button" class="btn p xbusy" aria-disabled="true">Starting…</button><button type="button" class="btn xoff" aria-disabled="true">Start exam</button><span class="xwhy">+ visible reason</span><button type="button" class="btn xoff" aria-disabled="true">No attempts left</button><button type="button" class="btn p">Preview without an attempt</button>${TB('proposed')}</div>
      <span>Status words</span><div class="row">${DRAFT}${PUB}<span class="xc"><i aria-hidden="true">▣</i>Archived · members cannot open it</span>${PASS}${FAIL}${OPEN}<span class="xc no"><i aria-hidden="true">◷</i>Timed out · 0%</span>${NR('score')}${RF()}</div>
      <span>Attempt row</span><div class="row" style="flex:1"><ul class="xatt" style="flex:1;min-width:0">${ATTS.two.replace(/<\/?ul[^>]*>/g, '')}<li><span><b>Attempt 1</b></span>${OPEN}<small>started 2026-11-26 10:12 · Resume uses no attempt</small></li><li><span><b>Attempt 1 · score not recorded</b></span>${NR()}<small>submitted 2026-11-26 10:31</small></li></ul></div>
      <span>Notes</span><div class="row"><div class="nt a" style="flex:1"><span class="ic" aria-hidden="true">◐</span><div><b>Draft note</b> sits above the facts, before the action, with its glyph and word.</div></div><div class="xprev" style="flex:1"><span aria-hidden="true">◇</span><div><b>Preview banner</b> dashed violet: “not an attempt”.</div></div></div>
      </div></section>`);
    else if (B === 'LEX31') html = crop(1440, `<div><span class="eye">Accessibility · focus order · wrapping</span><h2 style="font-size:18px;font-weight:800;margin-top:4px">Focus order on the preflight, accessible names, and a long title at 1440 and 390</h2></div>
      <div class="g"><section class="cd c7"><div class="hdr xlong"><span class="eye">${FO(1)}Breadcrumb · Learning › ${CO}</span><h1>${FO(2)}${EX}</h1></div>
      <div class="xcta">${FO(3)}<button type="button" class="btn">Add to plan</button></div>${POL('un')}<div class="xcta">${FO(4)}<button type="button" class="btn p">↻ Retry reading attempts</button>${FO(5)}<button type="button" class="btn xoff" aria-disabled="true">Start exam</button></div><div class="xcta">${FO(6)}<a class="btn t" href="#">Back to ${CO}</a></div></section>
      <section class="cd c5"><div class="ch"><h2>Names and roles</h2></div><ol class="xa11y">
      <li><span class="xfo">1</span><span><code>nav aria-label="Breadcrumb"</code>; the last item is plain text.</span></li>
      <li><span class="xfo">2</span><span>The only <code>h1</code>; “Before you start” is <code>h2</code>. The title is never repeated as a heading.</span></li>
      <li><span class="xfo">3</span><span>“Add to plan” keeps its visible name; it is the header’s only action.</span></li>
      <li><span class="xfo">4</span><span>Retry: “Retry reading attempts”. After a retry, focus stays on it; the result is announced in a <code>role="status"</code> region.</span></li>
      <li><span class="xfo">5</span><span>Start off: <code>aria-disabled="true"</code>, focusable, <code>aria-describedby</code> the reason. Never removed, so the layout does not jump.</span></li>
      <li><span class="xfo">6</span><span>“Back to ${CO}” is a link, not a button.</span></li>
      <li><span class="xfo">·</span><span>Facts are a <code>dl</code> labelled “Exam policy”; Unavailable carries its word and glyph, not only red.</span></li>
      <li><span class="xfo">·</span><span>Dialogs: <code>role="dialog"</code>, <code>aria-modal</code>, focus starts on Cancel, Escape cancels, focus returns to the button that opened it.</span></li>
      <li><span class="xfo">·</span><span>Options are a <code>radiogroup</code> labelled by the question; each option is a 44px label.</span></li>
      <li><span class="xfo">·</span><span>Phone: sticky bar holds at most two buttons; the primary is right-most.</span></li></ol></section></div>
      <div class="g"><section class="cd c7 xlong"><span class="tag">1440 · long title wraps, never truncates</span><h1>${EX} Claim registers, sourcing market-size figures and what investors will check before a partner meeting</h1><p class="foot">max-width 880px, overflow-wrap:anywhere. In lists and the review the title may truncate with the full text in <code>title</code> and the accessible name.</p></section>
      <div class="c5">${phone('Exam', `<header class="hdr xlong"><span class="eye">Exam · lesson 10 of 10</span><h1>${EX} Claim registers, sourcing market-size figures and what investors will check before a partner meeting</h1></header>`, '', { h: 330 })}</div></div>`);

    /* ===== Handoff ===== */
    else if (B === 'LEX99') html = `<div class="${CV} doc"><div><span class="eye">Learning · #8667 · engineering handoff</span><h2 style="font-size:22px;margin-top:4px">Exam readiness, draft preview and attempts: what main has, what is proposed, what the owner decides</h2></div>
      <div class="cols">
      <div><h3>Checked on main (7b0db10927)</h3><ul>
      <li><code>routes/learning_assessment.ts</code>: <code>GET /exams/:uid</code> (intro: title, intro, pass mark, time limit, max attempts, reveal, question count, status); <code>POST /exams/:uid/attempts</code> starts or resumes, one conditional INSERT, never past the limit, 409 <code>no_attempts_left</code> / <code>no_questions</code>; <code>PUT …/answers</code> saves choices; <code>POST …/submit</code> grades on the server; <code>GET …/attempts</code> returns <code>attempts_left</code> (null = no limit).</li>
      <li>Migrations <code>…2214_learning_attempt_policy</code> (pass mark, limit and reveal copied onto each attempt) and <code>…1028_5356_exam_attempt_drafts</code> (choices held on the server).</li>
      <li><code>routes/admin_learning_assessment.ts</code>: questions freeze at the first attempt (409 <code>exam_has_attempts</code>); <code>GET /admin/learning/exams/:uid</code> returns questions with keys, Super Admin only.</li>
      <li><code>services/learningAccess.ts</code> <code>canSeeLearning</code>: a draft is visible to a Super Admin only.</li>
      <li><code>routes/learning_lists.ts</code> <code>GET /exams</code>: published only, so a Super Admin with only drafts sees “No exams published yet”.</li>
      <li><code>pages/learning/ExamFlow.jsx</code>: the Start button is disabled only by <code>!onStart || busy || spent</code>, so it stays live when attempts are unreadable (the bug). The title is h1 in <code>LearningHeader</code> and h2 in <code>ExamIntro</code>. Review before submit exists; no start or submit confirmation; result reveals answers only per the attempt’s policy.</li>
      <li><code>LearningHome.jsx</code> <code>AssessmentList</code>, <code>examServerDraft.js</code>, <code>learningDrafts.js</code>, <code>assessmentModel.js</code> (<code>FROZEN_LINE</code>), <code>learningModel.js</code> (<code>examRow</code>).</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>One h1; the card heading becomes “Before you start”; untimed said once (LEX02).</li><li>Start off with a reason while attempts are loading, unreadable or not recorded; Retry is the primary (LEX04, LEX21).</li><li>Draft note and the freeze sentence above the action (LEX03, LEX27).</li><li>Start and submit confirmations, and the retry confirmation (LEX07, LEX10, LEX12): wording over the existing routes.</li><li>Exams tab: separate Unavailable, search miss and empty; the Super Admin draft line reads <code>GET /admin/learning/exams</code> (LEX06, LEX06B).</li><li>Preview from the Studio read, no score (LEX05, ⚑ Q2 A).</li><li>“6 of 8 right” is derived in the page from pass mark and count.</li><li>After a pass the primary is Back to the course; main’s Try again is dropped there (LEX11B).</li></ul></div>
      <div><h3>Needs data or backend (◇)</h3><ul><li>Preview for authors who are not Super Admin, and a marked dry run that writes nothing: proposed, no issue yet.</li><li>The in-attempt question list with answered marks (LEX08): proposed; the attempt payload has what it needs, so this may become frontend-only.</li><li>Opening an earlier attempt’s feedback under its stored reveal (LEX11B): <b>#8288</b> item 4.</li><li>Attempt writes, eligibility and completion reconciliation stay with <b>#8288</b> (items 1 and 3); this canvas changes no write.</li></ul>
      <h3 style="margin-top:12px">Owner questions (⚑), option A drawn</h3><ul><li><b>Q1</b> On a draft, A: Preview is the primary and a counted start is secondary behind its confirmation. B: no Start on drafts at all.</li><li><b>Q2</b> Preview, A: keyed answers, no score. B: a server dry-run grade.</li><li><b>Q3</b> Confirmation, A: before every start that spends an attempt (never on Resume). B: on the first attempt of a draft only.</li></ul>
      <h3 style="margin-top:12px">Acceptance → boards</h3><ul><li>One heading and one concise policy summary (exam, time, threshold, attempts, effect of starting): <b>LEX02</b>, LEX03, LEX20, LEX27; before state LEX01.</li><li>A failed attempt-policy read offers recovery, is never 0 or unlimited, safe CTA until known: <b>LEX04</b>, LEX04B, LEX21, LEX30.</li><li>Preview vs counted start, in-progress attempt, reveal policy, writes with #8288: <b>LEX05</b>, LEX03, LEX02B, LEX07, LEX11, LEX11B, LEX13.</li><li>Published-catalogue empty state, separate: LEX06, LEX06B, LEX26. Focus, names, wrapping: LEX31.</li></ul>
      <h3 style="margin-top:12px">Coordination</h3><ul><li>#8288 owns every route change. Siblings: #8664 course overview (lesson 10 row links here), #8665 reader, #8668 My Learning (attempt history), #8669 Studio (the draft and freeze line), #8662 home and tabs.</li><li>The catalogue is the shared one: ${CO}, 2 modules, 10 lessons, 7 required; [Maya Ruiz] of [Northwind Labs]; [Iris Chen], Super Admin.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lex-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
