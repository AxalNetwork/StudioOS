    const OPT = o => { if (!o) return ''; const p = []; if (o.R) p.push(o.R === 'list' ? 'R list' : 'R:' + o.R); if (o.RT) p.push('R text'); if (o.B) p.push('{' + o.B + '}'); if (typeof o.L === 'string') p.push('L'); if (o.I) p.push('I:' + o.I); if (o.C || o.Sr) p.push('C ' + (o.C || 'line') + (o.Sr ? ' {' + o.Sr.join(', ') + '}' : '')); if (o.M4) p.push('M4:terms'); if (o.H) p.push('H'); if (o.S) p.push('S'); if (o.Q) p.push('Q'); if (o.P) p.push('P'); return p.length ? ' ' + p.join(' ') : ''; };
    const TH = (t, i, w) => `<div role="img" aria-label="TPL-${t.id} card ${i + 1}: ${LB[t.cards[i][0]]}" style="width:${w}px;height:${Math.round(w * 9 / 16)}px;position:relative;overflow:hidden;border-radius:8px;border:1px solid #dedbe5;box-shadow:0 8px 22px rgba(24,24,27,.09);flex:none"><div style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(${(w / 1920).toFixed(5)});transform-origin:0 0;background:${SWX[t.sw][0]};overflow:hidden">${SLIDE(t, i)}</div></div>`;
    const SK = { 'Pre-seed': 'pre_seed', Seed: 'seed', 'Series A': 'series_a', 'Series B+': 'series_b_plus' };
    const BOARD = t => {
      const S = SWX[t.sw], c2 = t.ch || {};
      const chT = `Number bottom right · ${c2.rule ? 'footer rule' : 'no footer rule'} · ${c2.mark === 'tl' ? 'mark top left' : c2.mark === 'bl' ? 'mark bottom left' : 'no mark'}${c2.sec ? ' · section label' : ''}`;
      const TR = (role, f, sample) => `<div style="display:flex;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid #ececf1"><span style="${MO};font-size:11px;color:#6b6577;width:58px;flex:none">${role}</span><span style="font-family:${FS(f)};font-size:${role === 'Display' ? 22 : 15}px;font-weight:${role === 'Display' ? (DW[f] || 700) : 400};color:#18181b;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sample}</span><span style="font-size:12px;color:#6b6577;flex:none">${f}</span></div>`;
      const SEC = (lab, inner) => `<div style="display:flex;flex-direction:column;gap:6px">${EBB(lab)}${inner}</div>`;
      const P13 = s => `<div style="font-size:13px;line-height:1.5;color:#3f3a47">${s}</div>`;
      const spec = `<div style="width:528px;flex:none;display:flex;flex-direction:column;gap:16px">${SEC('Swatch', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px">${SWC(S[0], S[5] + ' · page')}${SWC(S[4], 'Surface')}${SWC(S[1], 'Ink')}${SWC(t.ac, 'Accent')}</div><div style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:7px;background:${t.ac};color:${t.ai};font-size:13px;font-weight:700">Aa</span><span style="${MO};font-size:11.5px;color:#6b6577">accent_ink ${t.ai}</span></div>`)}${SEC('Type', TR('Display', t.fd, '[Venture name]') + TR('Body', t.fb, '[One line on what you do]') + TR('Mono', t.fm, '[Figure] · as of [date]') + `<div style="${MO};font-size:11.5px;color:#3f3a47;padding-top:4px">ratio ${t.r} · surface ${t.surf} · radius ${t.rad} · image radius ${t.irad}, overlay none</div>`)}${SEC('Decor', `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.45;color:#3f3a47">${t.dec.map(d => `<li>${d}</li>`).join('')}</ul>`)}${SEC('Chrome', P13(chT))}${SEC('Art', P13(ART[t.art] + (t.img ? ` · image on the ${t.imgOn || 'solution'} card<span style="display:block;margin-top:4px;${MO};font-size:11.5px;line-height:1.5;color:#6b6577">“${t.img}”</span>` : ' · no generated image' + (t.nim ? '; ' + t.nim : ''))))}${SEC('Tone', P13(t.tone))}${+t.id <= 12 ? SEC('Written for', P13('AI-native companies. Placeholders ask for the model’s task, the person in the loop, corrections learned from, gross margin after compute, and where the moat is: workflow fit, proprietary data and feedback.')) : ''}${SEC('What sets it apart', P13(t.dist))}</div>`;
      const head = `<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="${MO};font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:#18181b;color:#fff">TPL-${t.id}</span><span style="font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#18181b">${t.nm}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${PILL(SK[t.st] || t.st, 'v')}${PILL('audience_tags [' + t.aud.join(', ') + ']')}${PILL('deck_audience ' + t.da)}${PILL(t.sty)}${t.dr ? PILL('Card order drafted to complete the set · pending owner', 'a') : ''}</span></div>`;
      const grid = `<div style="display:flex;flex-direction:column;gap:10px">${EBB('Cards (' + t.cards.length + ')')}<div style="display:grid;grid-template-columns:repeat(4,332px);gap:18px 16px">${t.cards.map((c, i) => `<div style="display:flex;flex-direction:column;gap:6px">${TH(t, i, 332)}<span style="${MO};font-size:11px;color:#6b6577;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i + 1} ${c[0]}·${c[1]}${OPT(c[2])}</span></div>`).join('')}</div></div>`;
      return `<div style="width:1440px;box-sizing:border-box;padding:28px 32px 32px;background:#ffffff;${AP};color:#18181b;display:flex;flex-direction:column;gap:22px">${head}<div style="display:flex;gap:28px;align-items:flex-start">${TH(t, 0, 820)}${spec}</div>${grid}</div>`;
    };
    const tp = TS.find(x => x.id === v) || TS[0];
    return { body: { __html: BOARD(tp) } };

  }
}

</script>
</body></html>
