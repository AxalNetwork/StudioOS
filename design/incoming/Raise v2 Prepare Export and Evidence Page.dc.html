      + box('Evidence library', '<div class="rap-ri"><div><b>[Letter of intent from Brightline Freight for a 12-month pilot]</b><span class="rap-meta">' + SRC('Typed') + '<span class="mo">Dated 10 Nov 2026</span><span>Anecdote</span></span></div><div class="rap-rv">' + SHR('Private') + '</div></div>')
      + box('Linked to a claim', '<div class="rap-clr" style="grid-template-columns:minmax(0,1fr) auto"><b>Design partners</b>' + CT('ff') + '<small style="grid-column:1/-1">Linked by you · backed by a typed item, so it stays Founder’s figure</small></div>')
      + box('Reader outside Axal (after NDA, if shared)', '<div class="rap-ri"><div><b>[Letter of intent from Brightline Freight for a 12-month pilot]</b><span class="rap-meta">' + SRC('Typed', true) + '<span class="mo">Dated 10 Nov 2026</span></span></div></div>') + '</div>', 1240);
    const optB = () => crop('<span class="eye">B · no new item: the claim note is the only hand-written path (built, D900)</span><div style="display:grid;grid-template-columns:1.2fr 1fr;gap:14px">'
      + '<section class="cd"><div class="ch"><h2>Revenue (ARR) · Narrative v4</h2>' + CT('mm') + '</div><p class="raw">[Mercury] shows [$362k] as of 1 Nov · you stated [$410k]</p><div style="display:flex;gap:6px"><button type="button" class="btn bsm">Use [$362k]</button><button type="button" class="btn bsm">Keep mine, with a note</button></div><div class="rap-note"><span class="eye">Your note · founder only today</span><p>[ARR counts the Acme pilot, which starts billing in December.]</p></div></section>'
      + '<section class="cd"><div class="ch"><h2>Where the note appears</h2></div><ul class="rap-ul"><li>Evidence · Claims, under the claim (founder only)</li><li>Narrative and Pitch checks, beside the mismatch</li><li>A reader outside Axal: only with Q7 A, labelled “The founder’s note”, after an NDA</li></ul><div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Evidence comes from records and connectors.</b></div></div></section></div>', 1240);

    /* ---------- RA-33 · empty states ---------- */
    const empties = () => crop('<span class="eye">Empty states · one message, one action each</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">'
      + box('Composer · nothing shared yet', '<div class="nt"><span class="ic" aria-hidden="true">' + SH.lk + '</span><div><b>No evidence is shared with investors yet. Choose what to share in Evidence.</b><div class="mu">0 items are Summary or After NDA; 12 are Private.</div></div></div><button type="button" class="btn p bsm" style="align-self:flex-start">Choose what to share</button>')
      + box('Shared links · none sent', '<div class="nt"><span class="ic" aria-hidden="true">↗</span><div><b>Links you send appear here, with views and a way to stop them.</b></div></div><button type="button" class="btn p bsm" style="align-self:flex-start">New pack</button>')
      + box('Readiness snapshot · never scored', '<div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>Run the checks to score readiness.</b><div class="mu">Nothing is scored yet, so there is no snapshot to share.</div></div></div><button type="button" class="btn p bsm" style="align-self:flex-start">Re-score</button>') + '</div>', 1240);

    /* ---------- RA-34 · states ---------- */
    const SK = (w) => '<span class="sk" style="height:12px;width:' + w + '%"></span>';
    const STS = [
      ['Loading · composer', '<div aria-busy="true" class="rap-skc">' + SK(40) + SK(90) + SK(85) + SK(70) + '</div><span class="raw">Announced: “Loading items you can share”. Create pack disabled.</span>'],
      ['Loading · links and snapshot', '<div aria-busy="true" class="rap-skc">' + SK(60) + SK(95) + SK(95) + '</div><span class="raw">Rows keep their height; nothing reads 0 while loading.</span>'],
      ['Not recorded', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Dated</dt><dd>' + NREC + '</dd><dt>Provider</dt><dd>' + NREC + '</dd><dt>Value</dt><dd>' + NREC + '</dd><dt>Checked</dt><dd>' + NREC + '</dd><dt>What is missing</dt><dd>' + NREC + '</dd></dl>'],
      ['Unreadable · Evidence', '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Evidence could not be read. Try again.</b><div>Create pack is disabled until it loads.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>'],
      ['Unreadable · audience counts only', '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Who can see this on Axal could not be read.</b><div>The pack can still be created.</div></div></div><dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Data-room access</dt><dd>' + UNAV + '</dd></dl>'],
      ['Unreadable · snapshot or status', '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Readiness could not be read.</b><div>Nothing is exported half-filled. Create snapshot is disabled.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>'],
      ['Unreadable · links list', '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Shared links could not be read. Try again.</b><div>Links you sent keep working.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>'],
      ['Unavailable · Eadwyn', '<div class="nt"><span class="ic" aria-hidden="true">⦸</span><div><b>Eadwyn is unavailable right now.</b><div class="mu">Every part works without the proposal or the draft (RA-10 B).</div></div></div>'],
      ['Unavailable · a source', '<b>Weekly active teams</b><span class="rap-meta">' + SRC('Connector') + '<span class="raw">[PostHog]</span></span><span class="stt un" style="align-self:flex-start">' + SH.ua + 'Unavailable · source not read since 9 Nov</span><small class="raw">Kept out of the pack until it reads; never shown as 0.</small>'],
      ['Refused · not a founder', '<div class="nt"><span class="ic" aria-hidden="true">' + SH.lk + '</span><div><b>Only this venture’s founders can share its evidence. Ask a founder.</b><div class="mu">Super Admins and capital staff see these pages read-only, with no Share button.</div></div></div>'],
      ['Refused · support session', '<div class="nt"><span class="ic" aria-hidden="true">' + SH.lk + '</span><div><b>Evidence decisions and source details are unavailable in a support session.</b></div></div>'],
      ['Saving, then save failed', '<div class="rap-done" style="color:var(--mu)">' + SH.pd + 'Creating pack…</div><div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>The pack was not created.</b><div>Your 6 selected items are kept. Nothing was shared.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>'],
      ['Stale · founder side', '<div class="rap-chg">' + TAG('Changed since sent', 'ch') + '<small>Runway re-read on 13 Nov · “[Angel C] follow-up” still shows the 6 Nov copy</small><a class="btn bsm" href="#">Make a new pack</a></div><p class="raw">The reader’s copy never changes silently.</p>'],
      ['Stale · source age', '<div style="display:flex;gap:6px;flex-wrap:wrap">' + st('Stale', 'Read 9 days ago') + '<span class="stt xst">' + SH.st + 'Stale · age not recorded</span></div><p class="raw">Shown on the item in the composer, with its age.</p>']
    ];
    const states = () => crop('<span class="eye">States · Not recorded, Unreadable, Unavailable and zero never look alike</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STS.map(s => box(s[0], s[1]))) + '</div>', 1400);
    const pubState = (h, p) => '<section class="rap-gone"><span class="eye">Axal VC · shared link</span><h2>' + h + '</h2><p>' + p + '</p></section>';
    const readerStates = () => crop('<span class="eye">For the reader outside Axal · none of these shows venture data, not even its name</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">'
      + pubState('This link has expired', 'Ask the person who sent it for a new one.') + pubState('This link was stopped by the founder', 'Ask the person who sent it if you still need it.') + pubState('View limit reached', 'This link has been opened as many times as its sender allowed.') + '</div>', 1240);

    /* ---------- RA-35 · phone 390 ---------- */
    const phone2 = (title, body, overlay, right) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b>' + (right || '<button type="button" class="pi" aria-label="More actions" aria-haspopup="menu">⋯</button>') + '</div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (overlay || '') + '</div></div>';
    const psheet = (title, body, foot) => '<div class="dim2"></div><div class="sheet rap-psh" role="dialog" aria-modal="true" aria-labelledby="psh" style="top:30px;max-height:none"><div class="grab" aria-hidden="true"></div><div class="rap-pshh"><h2 id="psh">' + title + '</h2><button type="button" class="pi" aria-label="Close">✕</button></div><div class="rap-pshb">' + body + '</div>' + (foot ? '<div class="rap-pshf">' + foot + '</div>' : '') + '</div>';
    const pRow = (x, on) => '<div class="rap-prow">' + CB(on, x.sum) + '<div><b>' + x.sum + '</b><small>' + x.src + ' · ' + x.on + ' · ' + x.str + '</small>' + SEES(x, true) + '</div></div>';
    const rphone = (kind, body) => '<div class="cv rap-pub" style="' + VARS + ';width:390px;height:844px;overflow:hidden"><div class="rap-rt" style="padding:0 16px"><span class="rap-vn">' + VEN + '</span><span class="raw">' + kind + '</span></div><div class="rap-pm">' + body + '</div></div>';
    const MOB = {
      RA35a: () => phone2('Evidence', '<div><span class="eye">Raise · Prepare</span><h1 style="font-size:22px;font-weight:800;margin-top:3px">Evidence</h1></div><button type="button" class="btn p" style="min-height:48px">Review 3 items</button>' + kfig([['Claims checked', '14'], ['Shared', '8 items']]),
        '<div class="rap-menu" role="menu"><button type="button" role="menuitem">Ask Eadwyn</button><button type="button" role="menuitem">Share outside Axal</button><button type="button" role="menuitem">Shared links</button><button type="button" role="menuitem">Add evidence</button></div>'),
      RA35b: () => phone2('Evidence', '', psheet('Evidence pack', '<div class="rap-paud"><span class="rap-rd"></span><b>Before an NDA: coverage only</b></div><div class="rap-paud on"><span class="rap-rd on"></span><b>An NDA is signed outside Axal</b><small>Confirmed by you · dated 12 Nov 2026</small></div>'
        + '<span class="eye">Fundraising readiness · 2</span>' + pRow(it('i1'), true) + pRow(it('i4'), true) + '<span class="eye">Use of funds · 2</span>' + pRow(it('i2'), true) + pRow(it('i5'), true) + '<button type="button" class="disc2" style="min-height:44px" aria-expanded="false">▸ Claims these items back · 4</button><button type="button" class="disc2" style="min-height:44px" aria-expanded="false">▸ Not included: Private (4) and not shareable (2)</button>',
        '<span class="raw">6 of 8 selected</span><button type="button" class="btn p" style="min-height:48px;width:100%">Create pack</button>')),
      RA35c: () => phone2('Shared links', '<span class="raw">4 live · 1 expired · 1 revoked</span>' + J([0, 3, 4, 5].map(i => LINKS[i]).map(r => '<div class="mc' + (r.s !== 'live' ? ' rap-goneC' : '') + '"><div class="r1"><b>' + r.l + '</b>' + lst(r.s) + '</div><small>' + r.what + ' · ' + r.n + '</small><small class="mo">Expires ' + r.e + ' · ' + r.v + ' views</small>' + (r.chg ? '<span class="rap-chg">' + TAG('Changed since sent', 'ch') + '</span>' : '') + (r.s === 'live' ? '<div style="display:flex;gap:8px"><button type="button" class="btn" style="min-height:44px;flex:1">Copy link</button><button type="button" class="btn rap-dg" style="min-height:44px;flex:1">Revoke</button></div>' : '') + '</div>')), '', '<button type="button" class="pi" aria-label="New pack">＋</button>'),
      RA35d: () => phone2('Evidence', '', psheet('Add evidence', fieldRow('Area', sel('Fundraising readiness')) + fieldRow('Summary · one line', inp('[Letter of intent from Brightline Freight]')) + fieldRow('Value · optional', inp('[36,000] USD')) + fieldRow('Dated', inp('10 Nov 2026')) + fieldRow('File · optional', '<span class="rap-drop" style="min-height:48px"><span><a href="#">Choose a file</a></span></span>') + '<div class="rap-fixed" style="grid-template-columns:1fr"><div>' + SRC('Typed') + '</div><div><span>Strength: <b>Anecdote</b></span></div><div>' + SHR('Private') + '<small class="raw">Change it later in Evidence</small></div></div>', '<button type="button" class="btn p" style="min-height:48px;width:100%">Add</button>')),
      RA35e: () => rphone('Evidence pack', '<span class="eye">Before an NDA</span><h1>Evidence pack</h1><p class="raw">Shared by ' + FOUNDER + ' on 9 Nov 2026</p><div class="rap-snap">' + SH.pd + '<span>This shows what was shared on 9 Nov 2026; it does not update.</span></div>' + J(covRows().slice(0, 4).map(r => '<div class="mc"><b>' + r.a + '</b><small>' + r.k + ' · ' + r.s + ' · ' + r.n + ' item</small><small class="mo">Newest ' + r.d + '</small></div>')) + '<div class="nt"><span class="ic">' + SH.lk + '</span><div><b>Figures, files and quotes open once the NDA is signed.</b></div></div>'),
      RA35f: () => rphone('Evidence pack', '<span class="eye">After an NDA</span><h1>Evidence pack</h1><p class="raw">Shared by ' + FOUNDER + ' on 14 Nov 2026 · does not update</p><span class="eye">Fundraising readiness</span>' + J([it('i1'), it('i4')].map(x => '<div class="mc"><b>' + x.sum + '</b><small>' + SRC(x.src, true) + ' · ' + x.str + '</small><span class="rap-fig mo">' + x.val + '</span><small class="mo">Dated ' + x.on + '</small></div>')) + '<span class="eye">Investor narrative and Pitch deck</span><div class="mc"><b>' + it('i3').sum + '</b><span class="rap-rs rap-ssum"><b>≡</b>Shared as a summary only</span></div>' + '<span class="eye">Capital relationships</span><div class="mc"><b>' + it('i6').sum + '</b><span class="rap-rs rap-swh"><b>⊘</b>Value withheld</span><small>' + it('i6').wh + '</small></div><span class="eye">Claims these items back · 4, first shown</span><div class="mc"><div class="r1"><b>Revenue (ARR)</b>' + CT('mm') + '</div><small class="mo">Checked 13 Nov 2026</small><div class="rap-note"><span class="eye">The founder’s note</span><p>' + CLM[0].note + '</p></div></div>'),
      RA35g: () => rphone('Readiness snapshot', '<h1>Fundraising readiness</h1><p class="raw">Shared by ' + FOUNDER + ' on 12 Nov 2026 · scores as recorded that day</p>' + J(RD.map(r => '<div class="mc"><div class="r1"><b>' + r[0] + '</b>' + (r[1] === 'person' ? '<small>Assessed by a person</small>' : r[1] == null ? '<span class="stt ni">' + SH.nd + 'Not scored yet</span>' : '<span class="mo"><b>' + r[1] + '</b> / 10</span>') + '</div>' + (typeof r[1] === 'number' ? '<small>' + r[2] + ' · ' + (r[3] === 'nr' ? 'missing: not recorded' : r[3]) + '</small>' : '') + '</div>'))),
      RA35h: () => rphone('Raise status', '<h1>Raise status</h1><p class="raw">Shared by ' + FOUNDER + ' on 14 Nov 2026 · does not update</p><div class="mc"><span class="eye">Stage</span><b>Run the raise</b></div><div class="mc"><span class="eye">Materials</span>' + J(MATR.map(m => '<div class="r1"><small>' + m[0] + '</small>' + m[1] + '</div>')) + '</div><div class="mc"><span class="eye">Investors · counts by stage</span>' + J(PIPE.map(p => '<div class="r1"><small>' + p[0] + '</small><b class="mo">' + p[1] + '</b></div>')) + '</div><div class="mc"><span class="eye">Next steps</span><small>' + NXT.join(' · ') + '</small></div>')
    };

    /* ---------- RA-37 · handoff ---------- */
    const DOCS = {
      RA37: () => dk('<h1>Handoff · export and share for Prepare, and evidence by hand (#6054)</h1><p>Addendum to Raise v2 (RA-01 to RA-26, RA-A to RA-D). Checked on main 6d7712c6d1 on 14 Nov 2026. Decision file on approval: D4863-p1.md beside D4863.md.</p>'
        + '<h2>Checked on main</h2>' + tbl(['What', 'Where', 'Finding'], [
          ['Sharing inside Axal', 'cycle_raise.ts PATCH /evidence/items/:id · EvidenceReview.jsx ShareDialog (VR5)', 'Built. Sets Private / Summary / After NDA. Nothing here changes it; the composer links back to it.'],
          ['See as an investor', 'GET /evidence/preview?nda=0|1 · previewEvidence, sharedView (D1266)', 'Built. Coverage before NDA; summaries, figures for After NDA items after it; audience counts with an unreadable state.'],
          ['Withheld values', 'raiseEvidence.ts valueWithheld', 'Built. One investor’s money and bank lines other than runway, revenue, mapped spend and KPI snapshots return a reason, no number.'],
          ['Left out entirely', 'quoteConsented, fileAdmits', 'Built. Unconsented quotes and files the data room refuses never reach the projection.'],
          ['Changed since accepted', 'currentShared (snapshot_hash)', 'Built. An item whose source changed drops out of the shared read; RA-29’s “Changed since sent” reads the same fingerprint.'],
          ['Pack read', 'evidencePack(env, id, {audience:\'scoring\'}) with pack_hash', 'Built for scoring only; no route.'],
          ['Claim note and links', 'POST/DELETE /evidence/claims/:id/note and /link · EvidenceDrawers.jsx HOW', 'Built. “Found by the check”, “Linked by you”, “Proposed by Eadwyn, accepted by you”. No investor read returns the note.'],
          ['Readiness', 'raiseCycle.ts READINESS_ITEMS', 'Eight items; Team’s missing text reads “Team is assessed by a person”; pmf is drawn apart.'],
          ['Share links pattern', 'captable_share_tokens (migration 170), /share/captable, /share/deck, /share/lab-report', 'Built for cap table, deck and lab report. Nothing for Raise.'],
          ['Export or share outside Axal', 'cycle_raise.ts', 'Missing. No PDF, link, link list or public page for Raise.'],
          ['Create one evidence item', 'cycle_raise.ts', 'Missing. Only POST /evidence/items/batch (accept or dismiss, D5073). source_label already allows typed.']])
        + '<div class="cols"><div><h2>Backend required (◇)</h2><ul class="rap-dl"><li><b>' + ISS + ':</b> pack as PDF and link, reusing evidencePack and sharedView with the preview audience (uncommitted, every folder), not a third read.</li><li><b>' + ISS + ':</b> readiness snapshot and Raise status as PDF and link.</li><li><b>' + ISS + ':</b> a share-link store per output (label, expiry, view limit, views, last opened, revoked), its list and Revoke.</li><li><b>' + ISS + ':</b> public /share/evidence/:token and siblings, with the three refusal pages that show no venture data.</li><li><b>' + ISS + ':</b> the founder’s note in the after-NDA reader view (Q7).</li><li><b>' + ISS + ':</b> an Eadwyn proposal of a pack selection, and a covering-line draft.</li><li><b>' + ISS + ':</b> POST /evidence/items writing source_label typed, strength anecdote, visibility private (Q2).</li><li><b>#6045:</b> the Overview’s stage and primary action.</li></ul></div>'
        + '<div><h2>Frontend only</h2><ul class="rap-dl"><li>“Share outside Axal” beside Ask; never primary; absent for Super Admins and capital staff.</li><li>Composer layout, grouping, “The reader sees” column, collapsed Not included lines.</li><li>Shared links tab, grey rows for expired and revoked, PDF copies list.</li><li>Reader pages and A4 print styles; phone cards and sheets; dark tokens.</li></ul><h2>Preserved</h2><ul class="rap-dl"><li>RA-03 primary actions, RA-08 values, RA-23 words, the Eadwyn rail (RA-10, RA-25).</li><li>The in-Axal Share dialog (VR5) and See as an investor (VR11).</li><li>ADP-03 (#5457) stays a separate format (Q5).</li></ul></div></div>'
        + '<h2>Accessibility</h2><ul class="rap-dl"><li>Every state carries a word and a glyph: sharing (lock, ≡, #), reader sees (▦, ≡, #, ⊘), link state (✓ Live, dashed Expired, ✕ Revoked), claim tags. Colour is never alone.</li><li>Composer: fieldset and legend for the reader choice; rows are checkboxes named by their summary; Create pack stays reachable at the sheet foot; focus returns to Share outside Axal on close.</li><li>Revoke is two steps with a named scope; the result is announced. Phone targets are 44px.</li><li>Reader pages: one h1, a status note for “does not update”, tables with headers, no sign-in wall, print styles for A4.</li></ul>'
        + '<h2>Open questions for the owner (A drawn)</h2>' + tbl(['Q', 'Question', 'Drawn'], [['Q1', 'What may a pack show someone outside Axal?', 'A · as on Axal; coverage by default, summaries and After NDA figures after a confirmed NDA'], ['Q2', 'Can a founder add evidence by hand?', 'A · typed item, Private, Anecdote, Founder’s figure (RA-32 A); B drawn too'], ['Q3', 'Investors on the status page', 'A · counts by stage only'], ['Q4', 'Formats', 'A · link and PDF'], ['Q5', 'Relation to ADP-03', 'A · separate'], ['Q6', 'Public route', 'A · /share/evidence/:token'], ['Q7', 'Founder’s note for the reader', 'A · after NDA, labelled'], ['Q8', 'Overall score on the snapshot', 'A · no']])
        + '<p style="margin-top:12px">Also open: the header label. Evidence already has a Share dialog (VR5) that sets sharing inside Axal, so the new action is drawn as “Share outside Axal” to keep the two apart.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RA27') html = rpage(evUnder(), { h: 1340, railW: 330, railHtml: proposal('open'), sheet: composer(false, IT.map(x => x.k)) });
    else if (B === 'RA27b') html = rpage(evUnder(), { h: 1640, railW: 330, railHtml: proposal('accepted'), sheet: composer(true, PICK, { open: true }) });
    else if (B === 'RA27c') html = created();
    else if (B === 'RA28') html = readerPage(false);
    else if (B === 'RA28b') html = readerPage(true);
    else if (B === 'RA28c') html = a4Pack();
    else if (B === 'RA29') html = rpage(linksPage(), { h: 980 });
    else if (B === 'RA29b') html = revokeFlow();
    else if (B === 'RA30') html = rpage(rdUnder(), { h: 900, railW: 330, railHtml: draftRail(), cur: 'Fundraising readiness', sheet: snapSheet() });
    else if (B === 'RA30b') html = a4Snap();
    else if (B === 'RA31') html = rpage(ovUnder(), { h: 720, cur: 'Overview', sheet: statusSheet() });
    else if (B === 'RA31b') html = statusReader();
    else if (B === 'RA31c') html = a4Status();
    else if (B === 'RA32') html = rpage(evUnder(), { h: 720, sheet: addSheet() });
    else if (B === 'RA32b') html = addWhere();
    else if (B === 'RA32c') html = optB();
    else if (B === 'RA33') html = empties();
    else if (B === 'RA34') html = states();
    else if (B === 'RA34b') html = readerStates();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'RA36') html = rpage(evUnder(), { h: 1340, railW: 330, railHtml: proposal('open'), sheet: composer(false, IT.map(x => x.k)) });
    else if (B === 'RA36b') html = rpage(linksPage(), { h: 980 });
    else if (DOCS[B]) html = DOCS[B]();
    else html = rpage(evUnder(), { h: 1180, railW: 330, railHtml: proposal('open'), sheet: composer(false, IT.map(x => x.k)) });
    return { html: { __html: html } };
  }
}

</script>
