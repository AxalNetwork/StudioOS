    // BU21 · Eadwyn on a module page vs the rail
    const eadRail = '<aside class="sp eadx" aria-label="Eadwyn" style="min-width:0;overflow:hidden;box-sizing:border-box"><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--hair)"><b style="font-size:13.5px">Eadwyn · Solution design</b><button type="button" class="ib" aria-label="Collapse Eadwyn" aria-expanded="true">›</button></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1"><div class="prm">' + J(SUGG.solution.map(x => '<button type="button">' + x + '</button>')) + '</div><div class="cs2"><span class="eye">Answer · Which features have no evidence link?</span><p style="font-size:12.5px;line-height:1.55">One: <b>Dark mode</b>. No pain or hypothesis from Validate mentions it.</p><a class="btn bsm" href="#" style="align-self:flex-start">Link evidence</a></div></div><div style="padding:12px 16px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px"><div class="inp" style="min-width:0;min-height:38px">Ask about Solution design…</div><button type="button" class="disc2" aria-expanded="true">AI settings ▴</button><dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Model</dt><dd>Recommended</dd><dt>Allowance</dt><dd>41,200 of 100,000 this month</dd><dt>Billing</dt><dd><a href="#">Account › Billing and usage</a></dd></dl></div></aside>';

    // BU23 · navigation and copy
    const navCopy = () => dk('<h1>Navigation and module copy</h1><div class="bx2-nav"><div><h2>Before (8 Nov live)</h2><p>Global sidebar → cycle navigation → Overview / Tools tabs → six module tabs → a module select. Tools reads as both a top-level Build view and part of Operating systems.</p></div><div><h2>After</h2><p>Sidebar: <b>Build</b> › Overview · Plan · Progress · Tools, then the six modules. Inside a module: its own sections only (Operating systems: Systems · Cadence · Tools ↗). No module tabs or module select inside pages; the sidebar is the one module switcher. <b>Tools</b> is one page; Operating systems links to it.</p></div></div>'
      + tbl(['Module', 'Before (system-oriented)', 'After (founder outcome)'], [['Solution design', 'Records below; tabs above…', 'Decide what you are building, and tie every feature to the evidence behind it.'], ['Prototype / MVP', 'Must-have rows and connector parts', 'Ship the smallest product that tests what Validate proved.'], ['Product roadmap', 'Roadmap items by status', 'Decide what ships now, next and later, and show what shipped.'], ['Founding team', 'Founder records', 'Agree who builds the company, and on what terms.'], ['Company creation', 'Formation records and filings', 'Get the company formed, then keep its filings current.'], ['Operating systems', 'Systems, cadence and tool history', 'Run the company on connected systems and a weekly rhythm.']])
      + '<h2>One dominant action per state</h2>' + tbl(['Module', 'Empty', 'In progress'], [['Solution design', 'Add first feature', 'Link evidence to the first feature without it · else Add feature, on the list'], ['Prototype / MVP', 'Add first must-have', 'The next blocked or due must-have'], ['Product roadmap', 'Add first item', 'Move the next item into Now'], ['Founding team', 'Add founder', 'Add vesting terms'], ['Company creation', 'Start formation', 'The nearest-deadline filing'], ['Operating systems', 'Link company', 'Connect or reconnect the first system that needs it']]) + '<p>' + PTn('#5076') + ' ' + PTn('#5068') + '</p>');

    // BU24 · phone, empty module and no-company state
    const mEmpty = () => phone('Solution design', '<p style="font-size:13px;color:var(--mu)">Decide what you are building, and tie every feature to the evidence behind it.</p><section class="bx2-guide" style="padding:18px"><span class="eye">No features yet</span><h2 style="font-size:17px">Start with the feature your evidence argues for</h2><button type="button" class="btn p" style="min-height:48px;align-self:stretch">Add first feature</button></section><button type="button" class="disc"><b>Ask Eadwyn</b><span>3 suggestions for this module</span><i aria-hidden="true">›</i></button>');

    /* ---------- route ---------- */

    if (B === 'BU00') html = audit();
    else if (B === 'BU01') html = page(overview(), { h: 1500 });

    else if (B === 'BU11') html = page(company(), { h: 900, cur: 'Company creation' });
    else if (B === 'BU12') html = page(tools(), { h: 1000, cur: 'Tools' });
    else if (B === 'BU13a') html = crop(send(1), 760);
    else if (B === 'BU13b') html = crop(send(2), 760);

    else if (B === 'BU14') html = states();

    else if (B === 'BU14d') html = page(overview(), { h: 1500 });
    else if (B === 'BU10b') html = mProgress();
    else if (B === 'BU10c') html = mPlan();
    else if (B === 'BU10d') html = mTrail();
    else if (B === 'BU15') html = authDesk();
    else if (B === 'BU15m') html = authPhone();
