/* IHS · Investor Studio Home v2 (#6126) — continues Studio Modularity (SM16 to SM27). Every class is ihs- prefixed. */
.ihs-cv{--bg:#f4f3f7;--card:#fff;--raised:#faf9fc;--ink:#18181b;--body:#3f3a47;--mut:#6b6577;--line:#ececf1;--line2:#e2dfe8;--vi:#7c3aed;--vtx:#6d28d9;--lav:#f4f0fe;--lavE:#ddd0fb;--chip:#f4f3f7;--pos:#047857;--posT:#ecfdf5;--posE:#a7f3d0;--amT:#92400e;--amBg:#fffbeb;--amE:#fcd34d;--err:#b91c1c;--skel:#ececf1;--scrim:rgba(24,24,27,.42);
  --sg:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mo:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  font-family:var(--sg);font-size:13px;line-height:1.45;color:var(--ink);background:var(--bg);position:relative;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ihs-cv.ihs-dark{--bg:#0b1220;--card:#111827;--raised:#1f2937;--ink:#e5e7eb;--body:#d1d5db;--mut:#9ca3af;--line:#374151;--line2:#4b5563;--vi:#a78bfa;--vtx:#c4b5fd;--lav:rgba(167,139,250,.14);--lavE:rgba(167,139,250,.42);--chip:#1f2937;--pos:#34d399;--posT:rgba(52,211,153,.12);--posE:rgba(52,211,153,.4);--amT:#fcd34d;--amBg:rgba(252,211,77,.1);--amE:rgba(252,211,77,.5);--err:#f87171;--skel:#1f2937;--scrim:rgba(0,0,0,.6)}
.ihs-cv *{box-sizing:border-box}
.ihs-cv h1,.ihs-cv h2,.ihs-cv h3,.ihs-cv p,.ihs-cv ul,.ihs-cv ol{margin:0;padding:0}
.ihs-cv ul,.ihs-cv ol{list-style:none}
.ihs-cv a{color:var(--vtx);text-decoration:none}
.ihs-cv button{font-family:var(--sg);cursor:pointer}
.ihs-mo{font-family:var(--mo)}
.ihs-mu{color:var(--mut)}
.ihs-ey{font:700 10.5px var(--mo);letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
/* shell */
.ihs-shell{display:flex;flex-direction:column;background:var(--bg)}
.ihs-top{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.ihs-brand{display:flex;align-items:center;gap:9px;width:214px;flex:none;font-size:15px;font-weight:800;letter-spacing:-.02em}
.ihs-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--card);font:800 12px var(--sg)}
.ihs-search{width:340px;min-height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--mut);font-size:13px}
.ihs-ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--body);display:grid;place-items:center}
.ihs-avt{width:34px;height:34px;border-radius:999px;background:var(--lav);border:1px solid var(--lavE);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--vtx)}
.ihs-hq{font:700 11.5px var(--mo);letter-spacing:.07em;padding:3px 10px;border-radius:999px;background:#18181b;color:#fff;border:1px solid #4b5563}
.ihs-row{flex:1;display:flex;min-height:0}
.ihs-side{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.ihs-side.ihs-nar{width:64px;align-items:center}
.ihs-sw{width:100%;min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);text-align:left;margin-bottom:10px}
.ihs-sw b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihs-sq{width:30px;height:30px;flex:none;border-radius:7px;background:var(--lav);border:1px solid var(--lavE);color:var(--vtx);display:grid;place-items:center;font-size:11px;font-weight:800}
.ihs-nav{display:flex;align-items:center;min-height:36px;padding:0 12px;border-radius:9px;font-size:13.5px;color:var(--body)!important;font-weight:500}
.ihs-nav[aria-current]{background:var(--lav);color:var(--vtx)!important;font-weight:700}
.ihs-side.ihs-nar .ihs-nav{width:40px;height:40px;padding:0;justify-content:center;font-size:11.5px;font-weight:700}
.ihs-sep{height:1px;background:var(--line);margin:8px 4px}
.ihs-main{flex:1;min-width:0;padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px;position:relative}
.ihs-foot{height:38px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-top:1px solid var(--line);background:var(--card);font-size:12px;color:var(--mut)}
/* header */
.ihs-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ihs-ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ihs-ttl h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ihs-badge{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(14,165,233,.14);color:var(--ink)}
.ihs-badge i{width:7px;height:7px;border-radius:999px;background:#0ea5e9}
.ihs-purp{font-size:13.5px;color:var(--mut);margin-top:4px;max-width:640px}
.ihs-hr{display:flex;align-items:center;gap:12px;flex:none}
.ihs-date{font:500 12.5px var(--mo);color:var(--mut)}
/* buttons */
.ihs-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.ihs-btn.ihs-p{border-color:#7c3aed;background:#7c3aed;color:#fff}
.ihs-btn.ihs-v{border-color:var(--vi);color:var(--vtx);background:var(--card)}
.ihs-btn.ihs-t{border-color:transparent;background:transparent;color:var(--body)}
.ihs-btn.ihs-sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.ihs-btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.ihs-lnk{display:inline-flex;align-items:center;min-height:28px;font-size:12.5px;font-weight:600;color:var(--vtx);white-space:nowrap}
/* annotation tags (not product copy) */
.ihs-be{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border:1.5px dashed var(--vi);border-radius:6px;background:var(--lav);color:var(--vtx);font:700 11px var(--mo);white-space:nowrap}
.ihs-pol{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border:1.5px solid var(--amE);border-radius:6px;background:var(--amBg);color:var(--amT);font:700 11px var(--mo);white-space:nowrap}
.ihs-note{font-size:12px;color:var(--mut);line-height:1.45}
/* bands */
.ihs-thesis{position:relative;background:var(--lav);border:1px solid var(--lavE);border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:flex-start}
.ihs-thesis .ihs-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ihs-thesis .ihs-ey{color:var(--vtx)}
.ihs-thq{font-size:13px;line-height:1.5}
.ihs-crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.ihs-cg{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.ihs-cgl{font:600 10.5px var(--mo);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.ihs-chip{display:inline-flex;align-items:center;min-height:22px;padding:1px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:11.5px;font-weight:600;color:var(--body);white-space:nowrap}
.ihs-chip.ihs-x{text-decoration:line-through;color:var(--mut);background:transparent;border-style:dashed}
.ihs-band{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ihs-av{width:40px;height:40px;flex:none;border-radius:999px;background:var(--chip);border:2px solid #0ea5e9;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--body)}
.ihs-pill{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--body);border:1px solid var(--line2)}
.ihs-pill.ihs-lv{background:var(--lav);color:var(--vtx);border-color:var(--lavE)}
.ihs-pill.ihs-ps{background:var(--posT);color:var(--pos);border-color:var(--posE)}
.ihs-pill.ihs-am{background:var(--amBg);color:var(--amT);border-color:var(--amE)}
.ihs-lock{position:absolute;top:12px;right:12px;color:var(--mut);display:flex}
/* Eadwyn chat */
.ihs-chat{background:var(--card);border:1px solid var(--lavE);border-radius:14px;overflow:hidden}
.ihs-chh{display:flex;align-items:center;gap:12px;padding:14px 18px 14px 22px;background:var(--lav);border-bottom:1px solid var(--line)}
.ihs-ead{width:36px;height:36px;flex:none;border-radius:10px;background:#7c3aed;color:#fff;display:grid;place-items:center;font:800 15px var(--sg)}
.ihs-chg{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.ihs-chl{display:flex;flex-direction:column;min-height:300px}
.ihs-thr{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.ihs-bub{align-self:flex-start;max-width:78%;padding:10px 13px;border-radius:12px 12px 12px 4px;background:var(--chip);border:1px solid var(--line);font-size:13.5px;line-height:1.5}
.ihs-bub.ihs-u{align-self:flex-end;border-radius:12px 12px 4px 12px;background:#7c3aed;color:#fff;border-color:#7c3aed}
.ihs-comp{border-top:1px solid var(--line);padding:12px 20px 14px;display:flex;align-items:center;gap:6px}
.ihs-inp{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--card);font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.ihs-send{width:42px;height:42px;flex:none;border-radius:10px;border:none;background:#7c3aed;color:#fff;display:grid;place-items:center}
.ihs-chr{background:var(--raised);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ihs-tabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.ihs-tabs a{display:inline-flex;align-items:center;min-height:46px;font-size:13.5px;font-weight:600;color:var(--body);border-bottom:2px solid transparent;white-space:nowrap}
.ihs-tabs a[aria-current]{color:var(--vtx);font-weight:700;border-bottom-color:var(--vi)}
.ihs-prop{border:1.5px dashed var(--vi);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:9px;max-width:560px}
/* module grid + tile */
.ihs-mh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ihs-mh h2{font-size:16px;font-weight:800;letter-spacing:-.02em}
.ihs-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:stretch}
.ihs-grid.ihs-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ihs-grid.ihs-g1{grid-template-columns:minmax(0,1fr)}
.ihs-tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ihs-th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ihs-th h3{flex:1;min-width:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.ihs-tn{font-size:12px;color:var(--mut);text-align:right}
.ihs-tf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ihs-sub{font-size:12px;color:var(--mut);line-height:1.45}
/* Needs you rows */
.ihs-nr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ihs-nr.ihs-half{grid-template-columns:30px minmax(0,1fr) auto}
.ihs-gl{width:32px;height:32px;border-radius:9px;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;color:var(--body)}
.ihs-nr.ihs-top .ihs-gl{background:var(--lav);border-color:var(--lavE);color:var(--vtx)}
.ihs-ns{min-width:0;display:flex;flex-direction:column;gap:2px}
.ihs-ns b{font-size:13.5px;font-weight:700;line-height:1.35}
.ihs-ns span{font-size:12px;color:var(--mut);line-height:1.4}
.ihs-nd{font:500 12px var(--mo);color:var(--body);white-space:nowrap;text-align:right}
.ihs-od{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--sg);color:var(--ink);white-space:nowrap}
.ihs-od svg{color:var(--err)}
/* state words (D5129): glyph + word, never colour alone */
.ihs-st{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:var(--card);color:var(--body)}
.ihs-st.ihs-ok{background:var(--posT);border-color:var(--posE);color:var(--pos)}
.ihs-st.ihs-out{border-style:solid;border-color:var(--ink);color:var(--ink)}
.ihs-st.ihs-nst{border-style:dashed;color:var(--mut);background:transparent}
.ihs-st.ihs-nrc{border-style:dotted;color:var(--mut);background:var(--chip)}
.ihs-st.ihs-un{border-color:var(--line2);color:var(--ink);background:var(--raised)}
.ihs-st.ihs-wh{color:var(--mut);background:var(--chip)}
.ihs-nrec{font-size:12.5px;font-weight:600;color:var(--mut)}
.ihs-unr{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;color:var(--body)}
.ihs-unr svg{color:var(--err);flex:none;margin-top:2px}
/* funds */
.ihs-tb{width:100%;border-collapse:collapse;font-size:13px;color:var(--ink)}
.ihs-tb td,.ihs-tb th{color:inherit}
.ihs-tb thead th{color:var(--mut)}
.ihs-tb th{font:700 10.5px var(--mo);letter-spacing:.07em;text-transform:uppercase;text-align:right;padding:0 10px 8px;white-space:nowrap}
.ihs-tb th:first-child,.ihs-tb td:first-child{text-align:left;padding-left:0}
.ihs-tb td{padding:11px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mo);font-size:12.5px;white-space:nowrap;vertical-align:middle}
.ihs-tb td:first-child{font-family:var(--sg);font-size:13.5px;font-weight:700}
.ihs-tb tfoot td{font-weight:700;border-top:1.5px solid var(--line2)}
.ihs-bar{position:relative;height:8px;border-radius:999px;background:var(--chip);border:1px solid var(--line2);overflow:hidden;min-width:120px}
.ihs-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--lavE);border-right:2px solid var(--vi)}
.ihs-bar b{position:absolute;left:0;top:0;bottom:0;background:var(--vi)}
.ihs-lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.ihs-lg i{width:12px;height:8px;border-radius:2px;display:inline-block}
/* figures */
.ihs-figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ihs-fig{padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.ihs-fig .ihs-l{font-size:11.5px;color:var(--mut)}
.ihs-fig .ihs-v{font:600 20px var(--mo);line-height:28px}
.ihs-fig .ihs-r{font-size:12px;font-weight:600;color:var(--mut);line-height:1.35}
.ihs-kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ihs-kv span:last-child{font:600 12.5px var(--mo)}
/* fit */
.ihs-fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ihs-fr .ihs-co{display:flex;flex-direction:column;gap:1px;min-width:0}
.ihs-fr .ihs-co b{font-size:13.5px}
.ihs-fchips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.ihs-tip{position:absolute;z-index:4;width:250px;padding:8px 11px;border-radius:8px;background:#18181b;border:1px solid #374151;color:#fff;font-size:12px;line-height:1.45;box-shadow:0 8px 20px rgba(24,24,27,.25)}
/* arrivals */
.ihs-ar{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ihs-ar .ihs-gl{width:28px;height:28px;border-radius:8px}
/* skeleton */
.ihs-sk{display:block;height:12px;border-radius:6px;background:var(--skel)}
/* module map */
.ihs-scrim{position:absolute;inset:0;background:var(--scrim);z-index:6}
.ihs-modal{position:absolute;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(24,24,27,.3);display:flex;flex-direction:column;overflow:hidden}
.ihs-mc{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card);min-width:0}
.ihs-mc b{font-size:13px}
.ihs-pv{height:40px;border-radius:8px;background:var(--lav);padding:7px 9px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.ihs-pv i{height:4px;border-radius:3px;background:var(--vi);opacity:.55;display:block}
.ihs-added{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 10px;border-radius:8px;background:var(--posT);color:var(--pos);font-size:12.5px;font-weight:700;align-self:flex-start}
/* phone */
.ihs-ph{width:390px;height:844px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.ihs-pht{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 4px;background:var(--card);border-bottom:1px solid var(--line)}
.ihs-t44{width:44px;height:44px;display:grid;place-items:center;border:none;background:transparent;color:var(--body);border-radius:10px;flex:none}
.ihs-phb{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.ihs-card44{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ihs-sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -12px 32px rgba(24,24,27,.22)}
.ihs-grab{width:40px;height:4px;border-radius:999px;background:var(--line2);align-self:center}
/* docs */
.ihs-doc{width:1200px;padding:36px 44px;display:flex;flex-direction:column;gap:20px;background:var(--card)}
.ihs-doc h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.ihs-doc h3{font-size:13.5px;font-weight:800}
.ihs-dl{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.ihs-dl ul{display:flex;flex-direction:column;gap:6px}
.ihs-dl li{font-size:12.5px;line-height:1.5;color:var(--body);padding-left:12px;position:relative}
.ihs-dl li:before{content:'·';position:absolute;left:2px;color:var(--mut)}
.ihs-code{font:500 11.5px var(--mo);background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ihs-crop{padding:24px;display:flex;flex-direction:column;gap:14px}
.ihs-lab{font:700 10.5px var(--mo);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ihs-ebar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 36px rgba(24,24,27,.14)}
.ihs-phb>*{flex:none}
/* SIV · Studio Home Investor card destinations (#8731). Reuses ihs_extra.css (Investor Studio Home v2); every new class is siv- prefixed. */
.siv-to{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 5px;min-height:22px;padding:2px 8px;border:1px dashed var(--line2);border-radius:6px;background:var(--raised);color:var(--body);font-size:11.5px;max-width:100%}
.siv-tor{display:flex;justify-content:flex-end;margin-top:-6px}
.siv-to b{color:var(--ink);font-weight:700}
.siv-to .ihs-mo{font-size:10.5px;color:var(--mut)}
.siv-step{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;min-height:26px;padding:2px 10px 2px 3px;border-radius:999px;background:#18181b;color:#fff;font-size:12px;font-weight:700}
.siv-step i{width:20px;height:20px;border-radius:999px;background:#7c3aed;display:grid;place-items:center;font:700 11px var(--mo);font-style:normal}
.siv-was,.siv-new{align-self:flex-start;font:700 10.5px var(--mo);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.siv-was{background:var(--chip);color:var(--mut);border:1px solid var(--line2)}
.siv-new{background:var(--lav);color:var(--vtx);border:1px solid var(--lavE)}
.siv-bad,.siv-good{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;line-height:1.4}
.siv-bad{color:var(--ink)}
.siv-bad svg{color:var(--err)}
.siv-good{color:var(--pos)}
.siv-fx{display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px dashed var(--line2);border-radius:8px;background:var(--raised);font-size:12.5px;color:var(--body)}
.siv-fx b{font:700 11px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.siv-snip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.siv-hr{height:1px;background:var(--line)}
.siv-dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.siv-dh h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.siv-secn{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.siv-secn a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--body)!important;white-space:nowrap}
.siv-secn a[aria-current]{border-color:var(--vi);color:var(--vtx)!important;background:var(--lav)}
.siv-secn.siv-scroll{flex-wrap:nowrap;overflow:hidden}
.siv-gate{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;border:1px solid var(--lavE);background:var(--lav);color:var(--vtx)}
.siv-gate div{display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.siv-gate b{font-size:13.5px}
.siv-gate span{font-size:12.5px;color:var(--body)}
.siv-gate.siv-gray{border-color:var(--line2);background:var(--raised);color:var(--mut)}
.siv-sec{display:flex;flex-direction:column;gap:10px;border-radius:12px}
.siv-sec.siv-focus{outline:2px solid var(--vi);outline-offset:6px}
.siv-sech{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.siv-sech h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.siv-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.siv-kv4{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.siv-kv4 div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.siv-kv4 span{font-size:11.5px;color:var(--mut)}
.siv-kv4 b{font:600 14px var(--mo)}
.siv-ok{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:var(--posT);border:1px solid var(--posE);color:var(--pos);font-size:12.5px;font-weight:600}
.siv-hero{background:#241a3d;color:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:8px}
.siv-hero b{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
