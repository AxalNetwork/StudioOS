      <section class="cd"><span class="tag">Optional slow breathing · Mindfulness on</span><div class="ch"><h2>Three slow breaths</h2><button type="button" class="btn">Start</button></div><div class="mot"><figure>${DAWN(110, 42)}<span>in · 4 s</span></figure><figure>${DAWN(110, 42).replace('M58 52a26 26 0 0 1 52 0', 'M52 52a32 32 0 0 1 64 0')}<span>hold</span></figure><figure>${DAWN(110, 42)}<span>out · 6 s</span></figure></div><p class="sub" aria-live="polite">Text equivalent, read aloud: “Breathe in… and out. Breath 1 of 3.”</p><p class="foot">Starts only when pressed, stops on Pause or Escape. With <code>prefers-reduced-motion: reduce</code> the sun does not move; the words count the breaths instead. No sound by default.</p></section></div>`);

    /* ===== Handoff ===== */
    else if (B === 'WLMH') html = `<div class="${CV} doc"><div><span class="eye">Wellness · member home · #7117 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked on main, what needs the backend, and what the owner decides</h2></div>
      <div class="cols">
      <div><h3>Checked on main (f62f025552)</h3><ul>
      <li><code>FounderWellbeingMenu.jsx</code>: header heart for founder and admin (App.jsx), menu with one link “Today’s check-in” to <code>/wellbeing</code>; status from <code>GET /daily?days=1</code>. A failed read falls through to “Take a minute to check in”.</li>
      <li><code>ui/phone/AccountSheet.jsx</code>: “Founder Wellbeing” row with the same status; “Unreadable” on failure.</li>
      <li><code>WellbeingPage.jsx</code>: guard admin and founder, investors refused; four cards (this week’s check-in, past weeks, bookings, resources), each with its own Unreadable and Retry. Admin pulse shown only in admin view mode.</li>
      <li><code>routes/wellbeing.ts</code>: <code>POST /daily</code> is an alias of <code>/checkins</code>, one check-in per UTC week, a later save replaces it. Eight optional scores, note and tags encrypted (plaintext fallback reported). Aggregate floor 7, windows 30/90.</li>
      <li><code>WellbeingBookPage.jsx</code>: Expert, Service, Time, Confirm; ranks with the member’s own past check-in tags (<code>want_category</code>), with no consent step.</li>
      <li><code>services/wellbeing/bookings.ts</code>: calendar invite titled “Axal · &lt;expert&gt; session”, attendees booker and expert by name and email. Expert list shows <code>booker_name</code>; no check-in data. <code>POST /bookings/:uid/cancel</code>: unpaid only.</li>
      <li><code>expertCategories.ts</code>: therapist, psychiatrist, dietitian, nutritionist, mindfulness coach, spiritual/philosophical advisor. Migration 433: sample experts inactive and refused at booking.</li></ul></div>
      <div><h3>Requires engineering ◇</h3><ul>
      <li>${TB('#7118')} independent daily, weekly and monthly records (member-local day, week, month), history, Edit reflection, retention, deletion and export, heart and sheet straight to Today.</li>
      <li>${TB('#7119')} practice preferences, interests, consent for topic use (off by default; the directory stops reading check-ins when off), Why this?, Dismiss and reset.</li>
      <li>${TB('#7120')} group occurrences, seats without overselling, release, facilitator cancellation, discreet calendar title.</li>
      <li>${TB('#7116')} the Programs catalogue entry with its Open link (PR #7122 in review).</li></ul>
      <h3 style="margin-top:12px">Pending the owner ⚑</h3><ul>
      <li>${TO('Q1')} The live provider roster is unverified: which approved providers, practice regions, services, languages and real slots go live. Every provider here is a [Sample].</li>
      <li>${TO('Q2')} Offer Spiritual guidance and its optional prompts at launch, and who writes them.</li>
      <li>${TO('Q3')} How long reflections are kept, and export.</li>
      <li>${TO('Q4')} Group release window, wait-list, paid groups and refunds.</li>
      <li>${TO('Q5')} Any role beyond founder and admin needs its own access decision.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Order and copy of the home, the dawn motif, the popover opening Today with Retry, the renamed sheet row, failed-save keeping text, the four-week table in words, dark tokens.</li></ul></div>
      <div><h3>Contrast (WCAG 2.1, text ≥ 4.5:1)</h3><table class="ctab"><thead><tr><th>Pair</th><th>Ratio</th></tr></thead><tbody>
      <tr><td><span class="sw2c" style="background:#1C1A17"></span>ink #1C1A17 on page #FAF7F2</td><td class="mo">16.25</td></tr>
      <tr><td><span class="sw2c" style="background:#6B655C"></span>muted #6B655C on #FAF7F2 / white</td><td class="mo">5.40 / 5.77</td></tr>
      <tr><td><span class="sw2c" style="background:#4E6B58"></span>sage text #4E6B58 on white / sage tint</td><td class="mo">5.89 / 5.24</td></tr>
      <tr><td><span class="sw2c" style="background:#6F8F7A"></span>sage #6F8F7A on white: graphics and borders only</td><td class="mo">3.57</td></tr>
      <tr><td><span class="sw2c" style="background:#7C3AED"></span>white on violet #7C3AED (primary)</td><td class="mo">5.70</td></tr>
      <tr><td><span class="sw2c" style="background:#6D28D9"></span>link #6D28D9 on #FAF7F2</td><td class="mo">6.65</td></tr>
      <tr><td><span class="sw2c" style="background:#ECE8E1"></span>dark ink #ECE8E1 on #14161A / #1B1E23</td><td class="mo">14.83 / 13.69</td></tr>
      <tr><td><span class="sw2c" style="background:#A8A196"></span>dark muted #A8A196 on #1B1E23</td><td class="mo">6.53</td></tr>
      <tr><td><span class="sw2c" style="background:#9DB8A6"></span>dark sage #9DB8A6 on #1B1E23</td><td class="mo">7.83</td></tr>
      <tr><td><span class="sw2c" style="background:#A78BFA"></span>#14161A on dark primary #A78BFA</td><td class="mo">6.66</td></tr></tbody></table></div>
      <div><h3>Keyboard and screen-reader order</h3><ul>
      <li>Heart: button, <code>aria-expanded</code>, opens a dialog with focus on Energy; Tab goes Energy, Stress, Sleep, note, Open full home, Save today. Escape or Save closes and returns focus to the heart.</li>
      <li>Five-point rows: one radio group each, arrow keys move, labels read “Energy, from 1 Drained to 5 Charged”.</li>
      <li>Home: h1, Today, This week, This month (each h2 with date and state word), Recommendations, My bookings, Practice preferences, Resources.</li>
      <li>Status changes (saved, couldn’t load) are announced (<code>role=status</code> / <code>alert</code>). Trends have a table in words. Works at 200% zoom.</li>
      <li>Touch targets 44 px on phone; visible focus ring on every control. Static by default; motion only on request and never under reduced motion.</li></ul>
      <h3 style="margin-top:12px">1440 and 390</h3><ul><li>1440: shell 196 + content + 44 rail; periods in three columns; Recommendations 8 / bookings 4 columns.</li><li>390: periods stacked, sticky 44 px primary, heart in the phone header and the Wellness row in the Account sheet.</li></ul>
      <h3 style="margin-top:12px">Never</h3><ul><li>Streaks, “you missed”, scores or ratings of anyone’s mental or spiritual health, risk scores, diagnosis, prescribing, “we monitor”, journal text sent to a model. Measurement counts saves per cadence, opened recommendations and confirmed seats only.</li></ul></div>
      </div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'wlm-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
