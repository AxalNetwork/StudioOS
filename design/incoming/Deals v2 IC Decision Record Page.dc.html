      + radios('Outcome', [['Open', 'Too early to say', ''], ['Vindicated', 'The decision held up', ''], ['Regret', 'We would decide differently', '']], 0)
      + '<dl class="dir-kv"><dt>Reviewed on</dt><dd>' + PT('Not stored') + '</dd><dt>Reason</dt><dd>' + PT('Not stored') + '</dd><dt>Reviewed by</dt><dd>' + PT('Not stored') + '</dd></dl></section>'
      + '<section class="cd" style="grid-column:span 6"><div class="ch"><div><h2>Record position</h2><span class="raw">After Invest · Admin today</span></div></div><p style="font-size:13px">Opens the position ledger with these filled. Nothing is recorded until you save it there.</p><dl class="dir-kv"><dt>Venture</dt><dd>[Northwind Labs]</dd><dt>Round</dt><dd>[Northwind Labs] · Seed</dd><dt>Not carried</dt><dd>Amount, date, instrument and terms: you type them in the ledger</dd></dl></section>'
      + '<section class="cd" style="grid-column:span 6"><div class="ch"><div style="display:flex;gap:10px;align-items:center"><h2>Conditions</h2><span class="pl a">1 open · blocking Closing</span></div></div><table class="tbl"><thead><tr><th>Condition</th><th>Status</th><th>Resolved</th></tr></thead><tbody><tr><td>Updated cap table from the founder</td><td>' + cst('open') + '</td><td class="mo">—</td></tr><tr><td>Signed side letter on information rights</td><td>' + cst('waived') + '</td><td class="mo">[Name A] · 30 Oct</td></tr></tbody></table><p style="font-size:12.5px">Carried to <a href="#">Closing</a>: the transfer cannot be recorded while it is open.</p></section>'
      + minutes({ meet: false }).replace('grid-column:span 12', 'grid-column:span 6') + '</div>';

    /* ---------- DE25 partner ---------- */
    const DE25P = () => crop('<span class="eye">Partner · drawn as Q2 A: admitted to the Commit decision pages only</span>' + FL('Q2 · A')
      + '<section class="cd" style="gap:12px"><nav class="zn" aria-label="Deals">' + J(['Deal flow', 'Screening', 'Commit', 'Closing'].map(z => '<a href="#"' + (z === 'Commit' ? ' aria-current="page"' : ' aria-disabled="true"') + '>' + (z === 'Commit' ? '' : LK + ' ') + z + '</a>')) + '</nav>'
      + '<p style="font-size:13px">Deal flow, Screening and Closing are part of the Investor licence. As a Partner you can vote, recuse and add a condition on decisions your firm shares with you.</p>'
      + '<div class="dir-mine"><span><b>You haven’t voted on ' + TITLE + '.</b></span><span style="display:flex;gap:8px"><button type="button" class="btn bsm">Recuse…</button><button type="button" class="btn p bsm">Vote…</button></span></div>'
      + '<p class="raw">Memo, terms, the decision and conditions’ resolution are read-only, each with its one-line reason, as on DE25.</p></section>', 1200);

    /* ---------- DE26 states ---------- */
    const sbox = (t, inner, span) => '<section class="cd" style="gap:8px' + (span ? ';grid-column:span ' + span : '') + '"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const DE26 = () => crop('<span class="eye">States · Zero, Not recorded and Unreadable never look alike</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start">'
      + sbox('Loading · list and record', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:12px;width:50%"></span><span class="sk" style="height:28px;width:100%"></span><span class="sk" style="height:28px;width:100%"></span><span class="sk" style="height:60px;width:100%"></span><span class="raw">Header, breadcrumb and zones render first; no counts until read</span></div>')
      + sbox('Empty', '<p style="font-size:13px"><b>No investment decision is open.</b></p><span class="raw">DE19b: one action, Open a decision</span>')
      + sbox('Not recorded', '<ul class="dir-nr">' + J([['Memo', ''], ['Proposed terms', ''], ['Venture', ''], ['Deal', ''], ['Diligence case', 'No diligence case'], ['Reason on a vote before D494', ''], ['Minutes', 'Minutes for 10 Nov haven’t been written yet']].map(r => '<li><span>' + r[0] + '</span>' + (r[1] ? '<span class="mu" style="font-size:11.5px">' + r[1] + '</span>' : ab('nr')) + '</li>')) + '</ul>')
      + sbox('No meeting', '<p style="font-size:12.5px">No IC meeting is linked to this deal.</p><span class="raw">Minutes card · not the same as unwritten minutes</span>')
      + sbox('Unreadable · the record', crumb(['Deals', 'Commit', TITLE]) + '<div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>This decision could not be read.</b><div>Votes and actions are hidden until it is. That is not the same as no votes.</div></div></div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button><span class="raw">Never a vote form on a record that was not read</span>', 2)
      + sbox('Unreadable · one card', '<b style="font-size:12.5px">Conditions</b>' + ab('ur') + '<span class="raw">The conditions could not be read. The rest of the record stands.</span><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + sbox('Unreadable · the list', '<div class="seg" role="tablist" aria-label="View"><button type="button" role="tab" aria-selected="true">All</button><button type="button" role="tab" aria-selected="false">Mine to vote</button></div><p style="font-size:12.5px"><b>Decisions could not be read.</b></p><span class="raw">No counts on the tabs</span><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
      + sbox('Refused · not your firm', '<p style="font-size:13px"><b>This decision isn’t available to you.</b></p><a class="btn bsm" href="#" style="align-self:flex-start">All decisions</a><span class="raw">Same words whether it exists or not</span>')
      + sbox('Refused · licence', '<p style="font-size:13px"><b>Investment committee is part of the Investor licence.</b> An Admin can grant it.</p><a class="btn bsm" href="#" style="align-self:flex-start">See licences in Account</a>')
      + sbox('Refused · plan', '<p style="font-size:13px"><b>Investment committee is part of the Investor Professional plan.</b></p><a class="btn bsm" href="#" style="align-self:flex-start">See plans</a><span class="raw">Refused today below Professional</span>')
      + sbox('Saving · save failed', '<div class="dir-in" style="min-height:44px;font-size:12px">Retrofit kits that run on existing shelving…</div><span class="raw">Saving…</span><div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div><b>Memo not saved.</b> Your text is kept. Try again.</div></div>')
      + sbox('Super Admin preview', '<span class="pl a">Previewing · Investor shell · writes are recorded as Super Admin</span><p class="raw">A vote or decision in preview names the real actor in its dialog, per the owner’s answer on #4815.</p>', 2)
      + sbox('Partial · Mine to vote', '<p style="font-size:12.5px">Mine to vote <b class="mo">2</b> <span class="pl">◔ Partial</span></p><span class="raw">Of the 100 most recent decisions · older decisions are not checked</span>') + sbox('Zero · Not recorded · Unreadable', '<ul class="dir-nr"><li><span>Votes cast on this decision</span><b class="mo">0</b></li><li><span>Reason on an old vote</span>' + ab('nr') + '</li><li><span>Open conditions</span>' + ab('ur') + '</li></ul><span class="raw">A measured 0 is a value</span>', 2)
      + '</div>', 1400);

    /* ---------- phones ---------- */
    const phone = (title, body, extra, h) => '<div class="cv" style="' + VARS + ';width:390px;height:' + (h || 844) + 'px"><div class="ph" style="height:' + (h || 844) + 'px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (extra || '') + '</div></div>';
    const pcard = (r) => '<article class="mc dir-pc"><b style="font-size:14px">' + r[0] + '</b><div class="dir-meta">' + (r[1] ? co('Raise') + ' ' + r[1] : ab('nr')) + '</div><div class="dir-meta">' + me(r[2]) + (r[3] ? dec(r[3][0], r[3][1]) : '') + '</div>' + tally(r[4][0], r[4][1], r[4][2], r[4][3]) + '<div class="dv"><span class="raw">My vote</span>' + (r[5] ? vote(r[5]) : '<span class="dir-nv">Not voted yet</span>') + '</div></article>';
    const foot = (inner) => '<div class="dir-pf">' + inner + '</div>';
    const DE27A = () => phone('Investment committee', '<div class="dir-chips">' + J([['All', '6'], ['Mine to vote', '2'], ['Voting', '2'], ['Draft', '1'], ['Decided', '3']].map((t, i) => '<button type="button" aria-pressed="' + (i === 0) + '">' + t[0] + ' <span class="mo">' + t[1] + '</span></button>')) + '</div><span class="raw">Mine to vote: of the 100 most recent decisions</span>' + J(LIST.slice(0, 4).map(pcard)), foot('<button type="button" class="btn p" style="width:100%;min-height:48px">Open a decision</button>'));
    const ptile = (k, v) => '<div><small>' + k + '</small><b>' + v + '</b></div>';
    const pvote = (v) => '<article class="mc dir-pv' + (v[1] === 'recused' ? ' dir-pvr' : '') + '"><div class="dv"><b>' + v[0] + (v[4] === 'me' ? ' <span class="mu">(you)</span>' : '') + '</b>' + vote(v[1]) + '</div><p style="font-size:12.5px">' + (v[1] === 'recused' ? 'Conflict declared: “' + v[2] + '”<br><span class="dir-nc">Not counted in the tally</span>' : '“' + v[2] + '”') + '</p><span class="raw">' + v[3] + '</span></article>';
    const DE27B = () => phone(TITLE, '<div class="dir-meta">' + me('Voting') + dec(null) + '</div><div class="dir-meta"><span>' + co('Raise') + ' [Acme Robotics]</span></div>'
      + '<div class="dir-tiles">' + ptile('Votes cast', '4') + ptile('Reasons', '4 of 4') + ptile('Recused · not counted', '1') + ptile('Open conditions', '2') + ptile('IC meeting', '10 Nov') + ptile('Eligible voters', PT('#6143')) + '</div>'
      + '<h3 class="dir-ph3">Votes ' + tally(3, 0, 1, 1) + '</h3>' + J(VOTES.map(pvote)) + '<button type="button" class="btn" style="min-height:44px">Change my vote</button>'
      + '<h3 class="dir-ph3">Memo</h3><div class="dir-memo dir-clamp"><p><b>Problem:</b> Mid-size warehouses cannot automate picking without a full retrofit.</p><p><b>Solution:</b> Retrofit kits that run on existing shelving. <span class="dir-fill">Two pilots converted to paid contracts in September.</span><span class="dir-ftag">Eadwyn</span></p><p><b>Why now:</b> Labour costs in logistics rose for the third year.</p></div><button type="button" class="btn t bsm" style="align-self:flex-start;min-height:44px">Show all of the memo</button>'
      + '<h3 class="dir-ph3">Proposed terms</h3><dl class="dir-kv">' + J(TERMS.map(t => '<dt>' + t[0] + '</dt><dd>' + t[1] + '</dd>')) + '</dl>'
      + '<h3 class="dir-ph3">Conditions <span class="pl a">2 open · blocking Closing</span></h3>' + J(CONDS.map(c => '<article class="mc"><b style="font-size:13px">' + c[0] + '</b><div class="dv">' + cst(c[1]) + '<span class="raw">' + c[2] + '</span></div>' + (c[1] === 'open' ? '<div style="display:flex;gap:6px"><button type="button" class="btn" style="min-height:44px;flex:1">Mark met</button><button type="button" class="btn" style="min-height:44px;flex:1">Waive</button></div>' : '<span class="raw">Resolved ' + c[3] + '</span>') + '</article>'))
      + '<h3 class="dir-ph3">Minutes</h3><p style="font-size:12.5px">Discussed pilot conversion and hardware margin. Members asked for reference calls before closing…</p><span class="raw">Recorded by [Name A] on 10 Nov 16:20</span>',
      foot('<button type="button" class="btn p" style="width:100%;min-height:48px">Record decision</button>'), 2050);
    const kb = '<div class="dir-kb" aria-hidden="true">keyboard</div>';
    const DE27C = () => phone(TITLE, '<div style="opacity:.4">' + J(VOTES.slice(0, 2).map(pvote)) + '</div>', '<div class="sheet" role="dialog" aria-modal="true" aria-label="Change my vote" style="bottom:260px;max-height:none"><div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px"><div class="dv"><b style="font-size:15px">Change my vote</b><button type="button" class="pi" aria-label="Close">✕</button></div><div class="dir-cur"><span class="raw">Current</span>' + vote('yes') + '</div>' + radios('Your vote', [['Yes, invest', '', '✓'], ['No, pass', '', '✕'], ['Abstain', '', '–']], 0) + fld('Reason', box('Team has shipped two pilots that converted; price holds|', 52), true, 'Every vote records its reason') + '<div class="dv"><a href="#" class="dir-alt" style="min-height:44px;display:flex;align-items:center">⊘ Recuse instead</a><button type="button" class="btn p" style="min-height:44px">Record vote</button></div></div></div>' + kb);
    const DE27D = () => phone(TITLE, '<div style="opacity:.4">' + J(VOTES.slice(0, 2).map(pvote)) + '</div>', '<div class="sheet dir-dlg-rec" role="dialog" aria-modal="true" aria-label="Recuse" style="bottom:260px;max-height:none"><div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px"><div class="dv"><b style="font-size:15px">⊘ Recuse</b><button type="button" class="pi" aria-label="Close">✕</button></div><p style="font-size:12.5px">Not a vote. You declare a conflict and leave the count.</p>' + fld('Declaration of the conflict', box('I hold an advisory role at [Quayside Pay]|', 52), true) + '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>A recusal is final.</b> No later vote is recorded.</div></div><label class="ck" style="min-height:44px"><input type="checkbox" checked>I understand.</label><button type="button" class="btn dir-btn-rec" style="min-height:48px">⊘ Recuse</button></div></div>' + kb);

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DE29 = () => dk('<h1>IC decision record · checked on main, backend required and handoff</h1><p>Checked against main <code>6d7712c6d1</code> (the brief was written on <code>45e7c55fa6</code>; <code>routes/ic.ts</code> has not changed since). Drawn as the brief’s picks: Q1 B (<code>/deals/commit</code> All decisions and <code>/deals/commit/:uid</code>, <code>/ic*</code> forwarding), Q2 A, Q3 A, Q4 A, Q5 A.</p>'
      + '<h2>Checked on main</h2>' + tbl(['Board', 'What exists', 'Where'], [
        ['DE19 list', 'List of up to 500 decisions, newest update first, with tally; Mine to vote from the 100 most recent', '<code>GET /api/ic</code>, <code>GET /api/ic/commit-room</code>'],
        ['DE20 open', 'Title required; deal and venture existence checks; scorecard memo seed; diligence case link (silently dropped if not found)', '<code>POST /api/ic</code>, <code>ICDecisionsPage.jsx</code>'],
        ['DE21 record', 'Memo, terms (free JSON), votes with names, conditions with added-by and resolved-by names, dd case', '<code>GET /api/ic/:uid</code>, <code>ICDecisionPage.jsx</code>'],
        ['Fill marks', 'Fill with Eadwyn on the memo’s words only, author until decided (D1329)', '<code>useScopedFill</code>, form <code>ic-memo</code>'],
        ['DE22a/b vote, recuse', 'Reason required (D494); recusal needs a declaration and is final (D468); first vote moves Draft to Voting; a vote also writes a private journal draft', '<code>POST /api/ic/:uid/vote</code>'],
        ['DE22c conditions', 'Any member adds; author or Admin marks met, waived or open; open conditions refuse a transfer', '<code>POST /:uid/conditions</code>, <code>PATCH /conditions/:uid</code>, <code>openConditionsOnDeal</code>'],
        ['DE22d minutes', 'Organiser or Admin writes; read only for the most recent decision', '<code>PATCH /meetings/:uid/minutes</code>, commit-room'],
        ['DE23, DE24', 'Decision by author or Admin, first decided date kept on reopen; outcome open, vindicated, regret; Record position for Admin', '<code>PUT /api/ic/:uid</code>, <code>/portfolio/positions</code>'],
        ['Access', 'Admin, Investor, Partner; Investors below Professional refused by the plan gate', '<code>canUseIc</code>, <code>INVESTOR_PRO_PREFIXES</code>']])
      + '<h2>Backend required (◇)</h2><ul><li>Voting roster: eligible voters, who has not voted, To vote (#6143).</li><li>Condition owner (#6143).</li><li>The opener’s name: only an id is served, so the read-only reason on DE25 cannot name them yet.</li><li>Minutes and meeting for any decision other than the most recent.</li><li>An Eadwyn memo draft scoped to this decision that may name recusals and conditions.</li><li>Reason on Record decision and on Reopen; outcome date, reason and reviewer.</li><li>Quorum.</li><li>Refusing a vote on a Decided record (Q5 A).</li><li>Export of the decision record and minutes.</li><li>Saying in the dialog that a diligence case was not attached.</li></ul>'
      + '<h2>Pending the owner (⚑)</h2><p>Q1 route (drawn B), Q2 Partner (drawn A), Q3 vote words (drawn A), Q4 who may vote once a roster exists (A: the author picks; not drawn beyond ◇), Q5 votes after the decision (drawn A).</p>'
      + '<h2>Frontend only</h2><p>The Deals shell and breadcrumb, All decisions tabs and filter, the IC record link in the deal page header (new: the deal page has none on main), <code>/ic*</code> forwarding, read-only reasons, the recusal’s own dialog and glyph, sticky phone footer, dark tokens.</p>'
      + '<h2>Accessibility</h2><p>Tabs are a tablist with counts in text; votes and recusal carry a glyph and a word; the vote is a radio group; required fields name the refusal in text next to the field; dialogs trap and return focus; phone targets 44px and sheets keep the reason above the keyboard.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DIR19') html = page(DE19(), { h: 760 });
    else if (B === 'DIR19B') html = page(DE19B(), { h: 640 });
    else if (B === 'DIR20') html = page(DE19(), { h: 1000, overlay: openDlg() });
    else if (B === 'DIR20B') html = DE20B();
    else if (B === 'DIR21') html = page(DE21(), { h: 1900, rail: true, av: 'NA' });
    else if (B === 'DIR22A') html = page(DE21(), { h: 1000, overlay: voteDlg({}) });
    else if (B === 'DIR22A2') html = crop('<span class="eye">First vote · and refused without a reason</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">' + voteDlg({ first: true }) + voteDlg({ refused: true }) + '</div>', 1100);
    else if (B === 'DIR22B') html = page(DE25(), { h: 1000, overlay: recDlg({}) });
    else if (B === 'DIR22B2') html = crop('<span class="eye">After recusing ([Name F]) · and the platform’s refusals</span><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start"><section class="cd" style="gap:10px"><div class="ch"><h2>Votes</h2>' + tally(3, 0, 1, 2) + '</div><table class="tbl"><tbody>' + voteRow(['[Name F]', 'recused', 'I hold an advisory role at [Quayside Pay], a competitor of [Acme Robotics].', '14 Nov 11:05'], {}) + '</tbody></table><p class="raw">Your row reads Recused. Change my vote is gone.</p></section><div style="display:flex;flex-direction:column;gap:12px">' + recDlg({ empty: true }) + '<section class="cd" style="gap:8px"><span class="eye">A second try</span><div class="nt r" role="alert"><span class="ic" aria-hidden="true">✕</span><div>You recused yourself from this decision. A recusal is final: it and its declaration stand, and no later vote is recorded.</div></div></section></div></div>', 1200);
    else if (B === 'DIR22C') html = DE22C();
    else if (B === 'DIR22D') html = DE22D();
    else if (B === 'DIR23') html = page(DE21(), { h: 1000, overlay: recordDlg() });
    else if (B === 'DIR23B') html = DE23B();
    else if (B === 'DIR24') html = page(DE24(), { h: 820, av: 'AA' });
    else if (B === 'DIR25') html = page(DE25(), { h: 1460, av: 'NF' });
    else if (B === 'DIR25P') html = DE25P();
    else if (B === 'DIR26') html = DE26();
    else if (B === 'DIR28A') html = page(DE21(), { h: 1900, rail: true });
    else if (B === 'DIR28B') html = page(DE25(), { h: 1000, overlay: recDlg({}) });
    else if (B === 'DIR29') html = DE29();
    const MOB = {
      DIR27A: () => DE27A(),
      DIR27B: () => DE27B(),
      DIR27C: () => DE27C(),
      DIR27D: () => DE27D()
    };
    if (!html && MOB[B]) html = MOB[B]();
    if (!html) html = page(DE21(), { h: 1900, rail: true });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
