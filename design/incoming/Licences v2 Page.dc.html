      : '<section class="fail"><div class="top"><span class="ic" style="background:var(--amT)" aria-hidden="true">!</span><div style="flex:1"><h2 style="font-size:16px;font-weight:800">Update pending</h2><p style="font-size:12.5px">HQ revision 143 · France branch revision 142 · last attempt failed 6 min ago</p></div><button type="button" class="btn p">Retry sync</button></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><dl class="kv2"><dt>What failed</dt><dd>The branch didn’t acknowledge within 60 s (attempt 3 of 3)</dd><dt>Effect</dt><dd>France still runs the 30-day payment terms until it receives 143</dd><dt>Provisioning</dt><dd>' + st('Failed', 'Failed 3 Nov 14:38') + ' <a href="#">Reconcile deployment…</a></dd></dl>' + NEW + '</div></section>');
    const HIST = [['Commercial terms amended', '3 Nov 2026 · 14:32', 'Guillaume Lauzier', [['Annual fee', '€90,000', '€100,000'], ['Payment terms', '30 days', '45 days']], 'Annual licence review', ['Out of sync', 'France has not acknowledged revision 143']], ['Administrator added', '28 Oct 2026 · 10:05', 'Guillaume Lauzier', [['Administrators', '2', '3 (P. Durand)']], 'Finance hire', ['Synced', 'France acknowledged revision 142']], ['Invoice issued', '1 Sep 2026 · 09:00', 'M. Okafor', [['Invoice', '—', 'FR-2026-02 · €90,000']], 'Licence year 2026–27', ['None', 'No branch change']]];
    const history = () => '<section class="cd"><ol style="display:flex;flex-direction:column">' + J(HIST.map(h => '<li style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--hair)"><div><b style="font-size:13.5px">' + h[0] + '</b><div class="raw">' + h[1] + '</div><div style="font-size:12.5px">' + h[2] + '</div></div><div style="display:flex;flex-direction:column;gap:6px"><dl class="kv2" style="grid-template-columns:150px minmax(0,1fr)">' + J(h[3].map(d => '<dt>' + d[0] + '</dt><dd><span style="color:var(--mu);text-decoration:line-through">' + d[1] + '</span> → ' + d[2] + '</dd>')) + '</dl><div style="font-size:12.5px"><span class="mu">Reason:</span> ' + h[4] + '</div><div style="font-size:12.5px"><span class="mu">Branch:</span> ' + st(h[5][0], h[5][1]) + '</div></div></li>')) + '</ol><button type="button" class="btn bsm" style="align-self:center">Load older</button></section>';

    /* ---------- sheets ---------- */
    const sheet = (h, title, body, foot) => '<div class="dim1" style="opacity:1"></div><aside class="drw" role="dialog" aria-modal="true" aria-labelledby="' + h + '" style="width:540px"><div class="drh"><div class="tr"><span class="eye">Consequential action</span><button type="button" class="ib" aria-label="Cancel">✕</button></div><h2 id="' + h + '">' + title + '</h2></div><div class="drb" style="gap:14px">' + body + '</div><div class="drf"><div style="display:flex;gap:8px;justify-content:flex-end">' + foot + '</div></div></aside>';
    const Q = (n, t, inner) => '<section><h3>' + n + ' · ' + t + '</h3>' + inner + '</section>';
    const terminate = () => sheet('tm', 'Terminate Axal VC France', Q('1', 'What will happen', '<ul class="rz"><li><b>The territory licence ends</b></li><li><b>France is released for another licence</b><small>Suspension would keep it held; termination does not</small></li><li><b>Licence administrator access is removed</b><small>3 administrators</small></li></ul>')
      + Q('2', 'What else it affects', '<ul class="rz"><li><b>The France deployment receives the terminated state</b></li><li><b>Contracts, invoices and history are kept</b></li><li><b>No new licence-year invoices</b><small>FR-2026-02 (€90,000, overdue) stays open</small></li></ul>')
      + Q('3', 'Reason recorded', '<div class="fld"><label for="tr">Reason <span>· required</span></label><div class="ta" id="tr" style="min-height:60px"></div></div>')
      + Q('4', 'Can it be undone?', '<div class="nt r"><span class="ic" aria-hidden="true">✕</span><div><b>This cannot be reversed from this screen.</b></div></div>'), '<button type="button" class="btn">Cancel</button><button type="button" class="btn dg">Terminate licence</button>');
    const partial = () => crop('<span class="eye">Mutation outcomes · partial never looks like full success</span><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px">'
      + '<section class="cd" style="gap:6px">' + st('Pending', 'Pending') + '<b>Suspending…</b><span class="raw">Waiting for HQ to confirm</span></section>'
      + '<section class="cd" style="gap:6px">' + st('Completed', 'Completed') + '<b>Licence suspended</b><span class="raw">HQ and France confirmed revision 144</span></section>'
      + '<section class="cd" style="gap:6px;border:1.5px solid var(--amE)">' + st('Partial', 'Partially completed') + '<b>Licence suspended at HQ</b><p style="font-size:12.5px">France has not yet acknowledged revision 144. Retrying the suspension itself is not necessary.</p><button type="button" class="btn p bsm" style="align-self:flex-start">Retry branch sync</button></section>'
      + '<section class="cd" style="gap:6px">' + st('Refused', 'Refused') + '<b>Not suspended</b><span style="font-size:12.5px">A terminated licence can’t be suspended.</span></section>'
      + '<section class="cd" style="gap:6px">' + st('Unknown', 'Outcome unknown') + '<b>No response from HQ</b><span style="font-size:12.5px">Re-read the licence before trying again.</span><button type="button" class="btn bsm" style="align-self:flex-start">Re-read licence</button></section></div>', 1400);
    const honesty = () => crop('<span class="eye">None · Not recorded · Unavailable</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">'
      + '<section class="cd" style="gap:8px">' + st('None') + '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Requests</dt><dd>None</dd></dl><p class="raw">Read succeeded; there is genuinely nothing.</p></section>'
      + '<section class="cd" style="gap:8px">' + st('Not recorded') + '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Governing law</dt><dd>' + NREC + '</dd></dl><p class="raw">No authoritative value has been recorded. Links to where it is set.</p></section>'
      + '<section class="cd" style="gap:8px">' + st('Unavailable') + '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Branch revision</dt><dd><span class="unr">! Unavailable · <a href="#">Retry</a></span></dd></dl><p class="raw">France branch didn’t respond. Never shown as 0 or as current.</p></section></div>', 1100);
    const phone = (title, body) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px"><div class="pt"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="More">⋯</button></div><div class="pbd" style="overflow:hidden">' + body + '</div></div></div>';
    const triage = () => phone('Licence', '<div class="inp" style="min-width:0;min-height:44px">⌕ Search licences</div><div class="mc"><b style="font-size:16px">Axal VC France</b><small class="raw">AXL-FR-001 · France</small>' + st('Active', 'ACTIVE') + '</div><section class="cd" style="padding:12px 14px;gap:8px"><h2 style="font-size:15px">3 items need HQ</h2><ul class="rz"><li><b>Terms differ from v4</b>' + st('Differs', 'Agreement') + '</li><li><b>2 studio requests</b>' + st('Waiting', '4 days') + '</li><li><b>Invoice overdue · €90,000</b>' + st('Overdue') + '</li></ul></section><button type="button" class="btn p" style="min-height:48px">Review 2 requests</button><button type="button" class="disc"><b>Agreement</b><span>v4 executed · terms changed</span><i aria-hidden="true">›</i></button><button type="button" class="disc"><b>History</b><span>Terms amended 3 Nov</span><i aria-hidden="true">›</i></button>');
    const ISS = ['Legal entity', 'Territory', 'Commercial terms', 'Administrators', 'Agreement', 'Issue'];
    const issue = () => '<header class="pgh"><div><h1>Issue a licence</h1><p>Step 2 of 6 · Territory</p></div></header><div class="ws" style="grid-template-columns:240px minmax(0,1fr)"><ol class="vstep">' + J(ISS.map((s, i) => '<li class="' + (i < 1 ? 'dn' : i === 1 ? 'on' : '') + '"><i>' + (i < 1 ? '✓' : i + 1) + '</i><span>' + s + '</span><span></span></li>')) + '</ol>'
      + '<section class="cd"><div class="ch"><h2>Which countries does Helvetic Ventures SA hold?</h2></div><div class="chips"><button type="button" aria-checked="true">Switzerland</button><button type="button" aria-checked="true">Austria</button><button type="button">Liechtenstein</button></div><div class="nt a" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>Austria is already held</b><div>Axal VC DACH holds Austria (suspended licences still hold their countries). Overlapping territories are refused; remove Austria or terminate the other licence first.</div></div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn">Back</button><button type="button" class="btn p" aria-disabled="true">Continue to commercial terms</button></div></section></div>';

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Backend fit and handoff</h1><p>Checked against <code>routes/admin_licences.ts</code>, <code>admin_deployments.ts</code>, <code>licence_requests.ts</code> and <code>services/licenceLedgerReads.ts</code> on 7 Nov 2026. Production has 0 issued licences; L0 is the live state and every populated board uses the brief’s France example plus sample licences.</p>'
      + tbl(['Board area', 'Today', 'Status'], [
        ['Ledger, summary, territories', '<code>GET /api/admin/licences</code>, <code>/summary</code>, <code>/territories</code>; statuses draft · active · suspended · terminated', 'Frontend: zero state, progressive coverage, Needs HQ chips as filters'],
        ['Terms read / amend', '<code>GET</code>/<code>PUT</code>/<code>PATCH /:uid/terms</code>', 'Frontend: amendment session + diff + reason. Backend: reason on the terms write if not stored'],
        ['Terms conflict', 'No optimistic-concurrency check found', 'Backend required: expected revision / updated_at on writes'],
        ['Agreement', '<code>/:uid/contract</code> (template + version), <code>/contract/:uid/send</code>', 'Frontend: readiness, frozen preview, version list'],
        ['Access', '<code>/:uid/admins</code>, <code>/:uid/seats</code>', 'Frontend; seat utilisation stays Not recorded'],
        ['Requests, compliance, billing', '<code>/:uid/requests</code>, <code>/:uid/notices</code>, <code>/:uid/fee-invoices</code>', 'Frontend'],
        ['Branch sync revisions', 'Deploy, retry and reconcile exist (<code>admin_deployments.ts</code>); no HQ-vs-branch revision acknowledgement found', 'Backend required: per-licence revision and branch acknowledgement'],
        ['History', '<code>GET /:uid/events</code>', 'Frontend: structured before/after; branch outcome needs the revision work above'],
        ['Partial success', 'Depends on branch acknowledgement', 'Backend required (same as above)']])
      + '<h2>Accessibility</h2><p>Licence sections are links with aria-current and URL-backed (<code>/admin/licences/:uid/:section</code>). Consequence sheets trap focus, name the four questions as headings, and associate the reason field with its error. No browser <code>prompt()</code>/<code>confirm()</code>. Status always has a word and a shape; amounts carry their currency.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'L00') html = page(zero(), { h: 820 });
    else if (B === 'L01') html = page(ledger(false), { h: 900 });
    else if (B === 'L02') html = page(ledger(true), { h: 760 });
    else if (B === 'L03') html = page(ident('Overview', { healthy: true }) + facts(true), { h: 760, rail: true });
    else if (B === 'L04') html = lpage('Overview', facts(false), { h: 800 });
    else if (B === 'L05') html = lpage('Terms', termsRead(), { h: 1050 });
    else if (B === 'L06') html = lpage('Terms', termsAmend(), { h: 1150 });
    else if (B === 'L07') html = lpage('Terms', termsConflict(), { h: 820 });
    else if (B === 'L08') html = lpage('Agreement', agrExec(false), { healthy: true, h: 780 });
    else if (B === 'L09') html = lpage('Agreement', agrExec(true).split('<section class="cd"><div class="ch"><h2>Versions')[0] + agrDraft(), { h: 1120 });
    else if (B === 'L10') html = lpage('Agreement', agrReady(), { h: 900 });
    else if (B === 'L11') html = lpage('Access', access(), { h: 820 });
    else if (B === 'L12') html = lpage('Operations', opsReq(), { h: 760 });
    else if (B === 'L13') html = lpage('Operations', opsBill(), { h: 720 });
    else if (B === 'L14') html = lpage('Operations', opsDeploy(true), { healthy: true, h: 700 });
    else if (B === 'L15') html = lpage('Operations', opsDeploy(false), { h: 820 });
    else if (B === 'L16') html = lpage('History', history(), { h: 1000 });
    else if (B === 'L17') html = lpage('Overview', facts(false), { h: 900, overlay: terminate() });
    else if (B === 'L18') html = partial();
    else if (B === 'L19') html = honesty();
    else if (B === 'L20') html = triage();
    else if (B === 'L21') html = page(issue(), { h: 640 });
    else if (B === 'L22') html = handoff();
    else html = page(zero(), { h: 820 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
