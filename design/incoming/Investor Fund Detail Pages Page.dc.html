        + '<section class="ifp-card"><h2>Latest report</h2><div style="display:flex;justify-content:space-between;align-items:center"><span><b>Q2 2026 correction</b><span class="raw" style="display:block">issued 6 Aug 2026</span></span>' + S('is') + '</div><button type="button" class="btn p ifp-full">Read latest report</button></section>'
        + '<div class="ifp-acc"><div>GP of record <span>' + GPN + ' ▾</span></div><div>LPA <span>v3 · signed ▾</span></div><div>Service providers <span>2 Not recorded ▾</span></div></div>', { });
    }
    else if (B === 'IFP19B') {
      html = phone(phead('/funds/:fundId · you manage this fund', '<span class="ifp-chip g">' + G.dot + 'Investing</span><span class="ifp-chip v">' + G.ok + 'GP</span>')
        + '<div class="ifp-next" style="flex-direction:column;align-items:stretch;gap:8px"><b>Q3 2026 report is a draft: finish and issue.</b><span class="raw">saved 13 Nov 2026 · 3 unmarked</span><a class="btn p ifp-full" href="#">Open Q3 2026 draft</a></div>'
        + pg2([['Size', '$25,000,000.00'], ['LPs · live', '18'], ['Committed', '$21,400,000.00', 'today'], ['Invested', '$9,850,000.00', 'today']])
        + '<section class="ifp-card"><h2>Performance <span class="raw">30 Sep 2026 · quarter end</span></h2>' + pg2([['NAV', D.navQ], ['Called', D.called], ['TVPI', D.tvpiQ], ['IRR', D.irrQ]]) + TB('#6244 today’s figures for the GP') + '</section>'
        + '<div class="ifp-acc"><div>Reporting periods <span>1 draft · 4 issued ▾</span></div><div>Positions <span>12 · 3 unmarked ▾</span></div><div>LPA <span>Refused · not an LP ▾</span></div><div>GP and providers <span>2 Not recorded ▾</span></div></div>', {});
    }
    else if (B === 'IFP19C') {
      const qc = (h) => '<section class="ifp-card"><h2>' + h[0] + ' <span class="raw">' + h[1] + '</span></h2>' + pg2([['NAV', h[2]], ['Paid-in', h[3]], ['Distributed', h[4]], ['RVPI', h[5]], ['TVPI · DPI', h[7] + ' · ' + h[6]], ['IRR', h[8] || S('ua', 'Unavailable')]]) + '</section>';
      html = phone('<div><span class="raw">/funds/performance</span><h1 style="font-size:20px;font-weight:800">Fund performance</h1></div>'
        + '<section class="ifp-card" style="border:2px solid #7c3aed"><h2>' + FUND + '</h2><span class="raw">as of 14 Nov 2026</span>' + pg2([['NAV', NR()], ['Called', '$10.70M'], ['DPI', '0.04×'], ['IRR', NR()]]) + '</section>'
        + '<span class="ifp-lbl">Quarterly history · 7 quarters</span>' + qc(HIST[0]) + qc(HIST[1])
        + '<span class="ifp-lbl">Positions · 3 unmarked</span><section class="ifp-card"><h2>[Bluefern Health] ' + S('um') + '</h2><span class="raw">Pre-seed · invested $500,000.00 · no valuation</span><button type="button" class="btn ifp-full">Record a valuation</button></section>', {});
    }

    /* ===== I20 · phone reporting period ===== */
    else if (B === 'IFP20A') {
      html = phone('<div><span class="raw">/funds/:fundId/reporting/:periodId · draft</span><h1 style="font-size:20px;font-weight:800">Q3 2026 report</h1><div class="ifp-hl" style="margin-top:4px">' + S('dr') + '<span class="raw">1 Jul – 30 Sep 2026</span></div></div>'
        + '<button type="button" class="ifp-tool" style="width:100%;min-height:48px;font:700 13px var(--sg);color:var(--ink)" aria-expanded="false"><span>Figures beside the letter</span><span class="raw">NAV $13.42M at 30 Sep ▾</span></button>'
        + '<div class="ifp-acc"><div style="background:var(--lav)">Letter <span>3 paragraphs ▴</span></div></div>'
        + '<div class="ifp-sec"><div class="ifp-in ta">Dear limited partners, in the third quarter we called the fourth tranche of capital, $2,140,000.00…</div><div class="ifp-in ta">[Lumen Robotics] and [Harbor AI] continued to grow…</div><button type="button" class="ifp-add" style="min-height:44px">+ Add paragraph</button></div>'
        + '<div class="ifp-acc"><div>Key developments <span>2 ▾</span></div><div>Outlook <span>1 ▾</span></div><div>Subsequent events <span>None yet ▾</span></div></div>'
        + '<div style="display:flex;gap:8px"><button type="button" class="btn" style="flex:1">Save draft</button><button type="button" class="btn p" style="flex:1">Checklist and issue</button></div>', { left: '‹ Back to fund' });
    }
    else if (B === 'IFP20B') {
      html = phone('<span class="ifp-sk" style="height:300px"></span>', { left: '‹ Back to fund', ov: '<div class="ifp-scrim"></div><div class="ifp-psheet" role="dialog" aria-label="Before you issue" style="top:150px"><div class="ifp-grab"></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--hair)"><b style="font-size:16px">Before you issue</b><button type="button" class="ib" aria-label="Close" style="width:44px;height:44px">✕</button></div><div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1"><span class="pl" style="align-self:flex-start">Advisory · only dates enforced</span><ul class="ifp-ck"><li><i class="y">✓</i><div>Dates set<small>enforced</small></div></li><li><i class="y">✓</i><div>Letter not empty</div></li><li><i class="y">✓</i><div>LPA attached</div></li><li><i class="x">!</i><div>3 unmarked positions<small>today’s count</small></div></li></ul><p class="ifp-cap">Issuing cannot be undone. LPs can read the issued report. Any change requires a separate correcting period.</p></div><div style="padding:12px 16px;border-top:1px solid var(--hair);display:flex;gap:8px"><button type="button" class="btn" style="flex:1">Keep draft</button><button type="button" class="btn p" style="flex:1">Confirm issue</button></div></div>' });
    }
    else if (B === 'IFP20C') {
      html = phone('<div><span class="raw">' + FUND + '</span><h1 style="font-size:20px;font-weight:800">Q2 2026 correction</h1><div class="ifp-hl" style="margin-top:4px">' + S('is') + S('co') + '</div><span class="raw">1 Apr – 30 Jun 2026 · issued 6 Aug 2026 by ' + ENT + '</span></div>'
        + '<div class="ifp-ban" style="padding:10px 12px"><span class="ifp-ic">' + G.co + '</span><div><b style="font-size:13px">This report corrects Q2 2026.</b><p><a href="#">Read the original →</a></p></div></div>'
        + '<span class="ifp-lbl">Letter</span>' + J(LETTER.slice(0, 2).map((p, i) => '<p style="font-size:14px;line-height:1.65"><span class="raw">¶' + (i + 1) + ' </span>' + p + '</p>'))
        + '<span class="raw">Key developments, outlook and subsequent events follow · then Figures as issued ◇</span>', { left: '‹ Fund', right: '<button type="button" class="btn t" style="min-height:44px">Print</button><button type="button" class="btn t" aria-disabled="true" style="min-height:44px">PDF ◇</button>' });
    }

    /* ===== Handoff ===== */
    else if (B === 'IFP22') {
      html = '<div class="cv" style="' + VARS + '"><div class="ifp-doc"><span class="eye">I-H · Handoff · #6244 · checked on main 6d7712c6d1 (brief written on 45e7c55fa6)</span><h2>Investor fund detail pages · what is real, what is new</h2><div class="ifp-cols">'
        + '<div><h3>Checked on main</h3><ul><li><code>services/fundReports.ts readFundPage</code>: LPs 0 → Committed 0 (real zero); any LP without a commitment → null + “Not every LP has a recorded commitment.”; no positions → Invested null; size 0 reads as null; periods filtered to issued for a non-manager.</li><li><code>routes/funds.ts</code>: <code>/:id/page</code> and <code>/:id/report-periods/:periodId</code> share one access check and one 503 sentence; <code>/:id/lpa/download</code> answers 403 “You are not an LP of this fund.” and 404 “No LPA body is stored for this fund.”; an admin’s issue is refused 409 “Admins issue a reporting period from the reporting queue.”</li><li><code>routes/fund_performance.ts</code>: list and <code>/:id</code> read only funds where the caller is an LP, or all for an admin; <code>/positions</code> and <code>/history</code> need <code>requireFundGp</code>.</li><li><code>services/fundPerformance.ts</code>: one reason per null figure; IRR null for missing inputs and for an ambiguous root alike.</li><li><code>pages/FundPage.jsx</code> has no performance band today; <code>FundReportPeriodPage.jsx</code> has the editor, Issue dialog, PackCard and the correcting banner; <code>FundPerformancePage.jsx</code> has the per-fund summaries with a status filter.</li><li><code>/lp-portal</code> already returns frozen fund figures for periods issued through the reporting queue; the period read does not.</li></ul></div>'
        + '<div><h3>Frontend only (build now)</h3><ul><li>Fund page layout, the next-action line, positions summary, performance band from the existing reads with as-of and basis on every figure.</li><li>GP not an LP: band from the latest <code>/history</code> row, labelled “quarter end”.</li><li>Figures beside the letter from <code>/page</code> (today) and the <code>/history</code> row matching the period end.</li><li>Advisory pre-issue checklist; Preview as LP; the typeset reading view and print stylesheet; correction banner (forward link).</li><li>History table, NAV-and-called chart, positions with Unmarked, calls and distributions lists on the detail.</li><li>Phone and dark layouts; states as on I18.</li></ul><h3 style="margin-top:12px">Preserved</h3><ul><li>Routes, the one 503 sentence, the Issue dialog text, the pack flow (draft → prepared → issued, preparer cannot issue), issued is immutable.</li></ul></div>'
        + '<div><h3>Backend required (◇, #6244)</h3><ul><li>Management fee and carry on <code>/page</code>.</li><li>Today’s performance (list and <code>/:id</code>) for the GP of record (pick A).</li><li>Figures as issued on the period read: return the stored snapshot and freeze NAV, Called, Distributed, TVPI, DPI, IRR at issue (pick A).</li><li>Performance at a non-quarter end; Committed at a past date.</li><li>Issuer’s name; “Corrected by” back-link.</li><li>The IRR cash-flow series as one read, and a reason code that separates “input missing” from “no unique solution”.</li><li>Fund-level history for LPs (pick A).</li><li>Edits for GP of record and provider fields; other fund documents; a period PDF.</li><li>Eadwyn: <code>funds/report</code> letter draft, summary between issued reports, Q&amp;A on one report.</li></ul></div>'
        + '<div><h3>Pending the owner (⚑, drawn as A)</h3><ul><li>Q1 performance: /funds/performance stays as the cross-fund summary, and each fund page carries a band linking to it.</li><li>Q2 GP of record reads today’s performance.</li><li>Q3 LPs see fund-level history, not positions.</li><li>Q4 the LP reading view shows frozen figures as issued.</li></ul><h3 style="margin-top:12px">Handoff and accessibility</h3><ul><li>Fund page → Performance (I12), → a period (I14 or I16); period → Back to fund; Your position → Axal VC Fund (I5) and the capital statement; GP → Open LPs, Reporting archive. The fund id travels with each.</li><li>Every state pairs a word with a glyph; IRR Unavailable has its own glyph and a dotted underline.</li><li>The chart has a text alternative; tables have headers; phone targets are 44px; no table wider than 390.</li><li>The Issue dialog traps focus and starts on Keep draft.</li></ul></div>'
        + '</div></div></div>';
    }

    else {
      html = crop('<b>Unknown board</b>', 400);
    }

    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
