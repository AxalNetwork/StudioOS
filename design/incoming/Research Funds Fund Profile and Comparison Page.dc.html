      RFP08E: () => phone('Comparison', '<div class="crumb">' + PRJ + ' / Comparisons</div><div class="seg" role="radiogroup" aria-label="Comparison view" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button type="button" role="radio" aria-checked="true">By fund</button><button type="button" role="radio" aria-checked="false">By attribute</button></div><div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="pi" aria-label="Previous fund">‹</button><span class="raw">Fund 3 of 6</span><button type="button" class="pi" aria-label="Next fund">›</button></div>'
        + '<section class="cd" style="padding:12px 14px;gap:8px"><b style="font-size:16px">Afore IV</b><span class="raw">Afore Capital · vintage 2025</span><dl class="rfp-kv" style="grid-template-columns:120px minmax(0,1fr)"><dt>Reported size</dt><dd>' + amt(AF, true) + '<div style="margin-top:4px">' + srcChip(AF) + '</div></dd><dt>Manager HQ</dt><dd>Bay Area</dd><dt>Stated focus</dt><dd>' + NR('The list states no focus for this vehicle.') + '</dd><dt>Label</dt><dd class="mo">IV</dd><dt>Stage</dt><dd>' + chip('nr') + '</dd><dt>Source use</dt><dd>Cite only<small>reviewed 7 Oct 2026</small></dd></dl><button type="button" class="btn" style="min-height:44px">Remove from comparison</button></section>'),

    if (!html && MOB[B]) html = MOB[B]();

    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';

      RFP00: () => dk('<h1>FND-P00 · Journey, routes and vocabulary</h1><p>The founder is deciding which specific vehicle could invest in their round. This canvas continues brief 1 (fund discovery): the same results row, the same three action names and the same return path. Component keys are <code>RFP…</code>; board ids are FND-P.</p>'

        + '<h2>Recovery path</h2><div class="rfp-flow"><div><b>Read fails</b>Unavailable · Retry repeats the read only</div><span>→</span><div><b>Record missing</b>404 · Back to results</div><span>→</span><div><b>Source withdrawn</b>410 · facts cleared, actions removed, alert</div><span>→</span><div><b>Back to results</b>same search, filters, sort, page, selected row and focus</div></div>'
        + '<h2>Boards</h2>' + tbl(['Board', 'Key', 'Route · state', 'Status'], [
          ['FND-P01 Detail Sheet', 'RFP01, RFP01B', 'Directory · Sheet open on Dawn Capital Opp; both Dawn vehicles', 'Sheet exists (D1317). ◇ vehicle ids'],
          ['FND-P02 Full vehicle profile', 'RFP02, RFP02B', '<code>/research/funds/catalog/:id</code> · EUR vehicle; native USD with a missing field', 'Page exists. ◇ USD, ◇ proposed fields'],
          ['FND-P03 Source, dates and history', 'RFP03', 'One figure followed through three places', '◇ provenance contract, ◇ vehicle history'],
          ['FND-P04 Save to shortlist', 'RFP04', 'Six states of the primary action', 'Exists as Add to my funds. ◇ match by vehicle'],
          ['FND-P05 Active project picker and result', 'RFP05, RFP05B', 'Sheet over the profile; outcomes', 'Exists (AddToResearch). Frontend: membership, archived'],
          ['FND-P06 Comparison', 'RFP06, RFP06B', '<code>/research/projects/:uid/comparisons</code>; compare at the 6 limit', 'Exists. ◇ USD and provenance per cell'],
          ['FND-P07 Missing, unavailable, withdrawn', 'RFP07, RFP07B, RFP07C', 'Profile states; withdrawal on an open Sheet and in a comparison', '404/410 exist. ◇ refresh clears the Sheet'],
          ['FND-P08 Phone 390', 'RFP08A to RFP08F', 'Sheet, profile, picker, six-fund comparison both ways, withdrawal', 'Bottom sheet exists. Frontend: By attribute view'],
          ['FND-P09 Dark', 'RFP09, RFP09B, RFP09C', 'Profile saved, comparison, phone Sheet with USD', 'Dark tokens exist'],
          ['FND-P10 Accessibility', 'RFP10', 'Focus sequence, focus return, announcements', 'Sheet contract D685 exists'],
          ['FND-P11 Handoff', 'RFPH', 'Checked on main, engineering, frontend, owner', '']])
        + '<h2>Vocabulary</h2>' + tbl(['Term', 'Means', 'Never'], [
          ['Fund vehicle', 'One fund a manager raised: Dawn Capital Opp, Dawn Capital Fund V, Afore IV', 'The manager. Two vehicles of one manager are two records'],
          ['Reported size', 'The size the source recorded, in its own currency, with its reported date', 'Converted, summed, banded across currencies or shown as 0'],
          ['Reported', 'The date the source recorded the figure (the list’s date column)', 'The import date'],
          ['Imported on', 'When Axal VC copied the list row (<code>as_of</code>)', 'A claim that the figure is current'],
          ['Source use reviewed', 'When the list’s reuse terms were last reviewed, and the verdict (D597)', 'Proof the figure is right'],
          ['Manager HQ', 'Where the manager is based', 'Where the vehicle invests'],
          ['Investment geography · Initial cheque', 'Where it invests and what it first writes, only from a source', 'Inferred from HQ or from fund size'],
          ['Not recorded', 'No source holds the value', 'A zero, a dash or an empty list'],
          ['Unavailable', 'The read failed; Retry', 'A claim that nothing exists'],
          ['Withdrawn', 'The source list was taken down for its terms; no fact is shown', 'Greyed-out old facts']])
        + '<h2>Annotation key</h2><div class="rfp-key">' + ENG('violet dashed: backend work on #7032') + OWN('amber: owner decision, option A drawn') + OK('existing on main') + '<span style="font-size:12px">Bracketed values are fictional samples. Unbracketed fund rows are committed directory data.</span></div>'),
      RFP10: () => dk('<h1>FND-P10 · Keyboard, focus and announcements</h1><p>Every control has an accessible name and a visible 2px violet focus ring. The Sheet follows the shared contract (D685): dialog role, named by its title, focus in on open, Tab kept inside, Escape closes, focus returns to the control that opened it.</p>'
        + '<h2>Focus sequence · detail Sheet (RFP01)</h2>' + tbl(['#', 'Stop', 'Notes'], [['<span class="rfp-num">1</span>', 'Sheet title “Dawn Capital Opp”', 'Focus lands here on open (tabindex -1), so the name is read first'], ['<span class="rfp-num">2</span>', 'Close Dawn Capital Opp details', 'Escape does the same'], ['<span class="rfp-num">3</span>', 'Source chip “@Euro_VC · reported 25 Sep 2023”', 'Opens the list in a new tab; its name says so'], ['<span class="rfp-num">4</span>', 'View the list ↗', ''], ['<span class="rfp-num">5</span>', 'Save to shortlist', 'The one primary action'], ['<span class="rfp-num">6</span>', 'Add to research project · 7 Compare in project · 8 Open full profile →', 'Each opens its own panel or page']])
        + '<h2>Focus return</h2>' + tbl(['When', 'Focus goes to'], [['The detail Sheet closes', 'The row’s name button in the results, which keeps its selected style'], ['The project picker or compare panel closes', 'The button that opened it (Add to research project or Compare in project)'], ['Back to results from the full profile', 'The row of the fund just viewed, on the same page of results with the same filters'], ['A withdrawn Sheet closes', 'The results heading, because the row has left the results; the count is announced'], ['A column is removed from a comparison', 'The next column’s header, or the Add fund button when none is left']])
        + '<h2>Announcements</h2>' + tbl(['Event', 'Region', 'Text'], [['Fund loading', 'status', 'Loading this fund…'], ['Saved to shortlist', 'status', 'Saved to your shortlist.'], ['Added to a project', 'status', 'Added Dawn Capital Opp to “' + PRJ + '”.'], ['Already in a project', 'status', 'Dawn Capital Opp is already in “' + PRJ2 + '”. Nothing was added.'], ['Comparison full', 'alert', 'A comparison holds at most 6 columns. Remove one first, or start another comparison.'], ['Read failed', 'alert', 'This fund could not be read. Retry.'], ['Source withdrawn', 'alert', 'This fund’s source list was withdrawn while you were reading. Its facts were removed.']])
        + '<h2>Keyboard paths</h2><p>Results: Tab to a row name, Enter opens the Sheet. Sheet: Tab through its controls, Escape closes. Picker: arrow keys move between projects; disabled projects are skipped and their reason is read with the group. Comparison: the table has a caption and row headers, so each value is read with its attribute and fund; on a phone, By fund pages with Previous and Next buttons and By attribute is a plain list.</p>'

        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['<code>frontend/src/pages/research/FundCatalogProfile.jsx</code>', '<code>/research/funds/catalog/:id</code>: loading, 410 removed list, 404 not found, Unreadable with Try again; “Add to my funds” or “Open your dossier →” matched by normalised name; ResearchActions (Add to my research, Compare); back link to <code>?view=directory</code> without the list’s context; size history chart for EUR rows only'],
          ['<code>frontend/src/pages/research/FundDirectory.jsx</code>', 'Drawer is the shared Sheet (width 480, phone sheet); FundDetails: Size, Stage (Not recorded, no store), Vintage, HQ, Stated focus, Notable LPs, EIF / EIFO, Fund, Website; SourceCard with publisher, terms and “as of”; on a failed detail read the drawer still renders the list row’s facts'],
          ['<code>frontend/src/pages/research/fundDirectoryRead.js</code>', '<code>sizeOf</code> shows a size only when <code>size_currency</code> is EUR; <code>STAGE_REASON</code>'],
          ['<code>cloudflare-worker/src/services/researchFundDirectory.ts</code>', '<code>SERVED_FUNDS</code> leaves out lists with verdict not allowed; <code>getFund</code> answers <code>{ removed }</code> for them; <code>presentFund</code> sets <code>size_currency</code> EUR only for the EuroTech list; stage filter refused'],
          ['<code>cloudflare-worker/src/routes/research_project_comparisons.ts</code>', 'Fund attributes HQ, Stated focus, Fund, Fund size, Vintage, Notable LPs, EIF / EIFO; cell source is <code>{ source_name, source_url }</code> with <code>as_of</code>; member states listed, withdrawn, removed, unreadable; <code>MEMBER_LIMIT</code> 6; 409 <code>project_archived</code>, <code>comparison_full</code>'],
          ['<code>frontend/src/pages/research/AddToResearch.jsx</code>, <code>researchComparisons.js</code>', 'Active projects only (archived filtered out), New research project, Add to project / Create comparison, outcome sentences and refusal words'],
          ['Migrations 378, 429, 406, 413; <code>attached_assets/EuroTechVCFunds(from1_2016)-Sheet1.csv</code>', 'Dawn Capital row (uid dawncapital) holds Opp €75m, 2023-09-25, 2023-Q3, imported 2026-10-04; the CSV also holds Fund V €582m with the same date and quarter. Afore IV US$185m (US cents), 2025-02-21, focus NULL, imported 2026-10-07. Sources: @Euro_VC and Shai Goldman cite only; Hello Tomorrow not allowed; all reviewed 2026-10-07 (D597)']])
        + '<h2>Requires engineering · ◇ #7032</h2>' + tbl(['Change', 'Why'], [
          ['Vehicle ids', 'The importer keys rows by manager, so Fund V was replaced by Opp. One row and one uid per vehicle; report rows carry the vehicle; the import refuses to merge two rows of one manager'],
          ['Native currency', 'Serve <code>size_currency</code> per list (USD for the Shai Goldman list, already stored as US cents); the comparison and profile print EUR and USD as reported, never converted; size filters stay per currency'],
          ['Dated provenance contract', 'One source object on the detail read and on each comparison cell: publisher, list title, published URL, reported on, imported on, reviewed on, verdict'],
          ['Source-policy refresh', 'Re-read the fund before Save, Add and Compare; a 410 clears the Sheet’s facts; a distinct <code>source_withdrawn</code> refusal instead of <code>not_in_directory</code>'],
          ['Proposed fields', 'Manager name, investment stage, investment geography and initial cheque range, each with source and reported date; none is stored today'],
          ['Vehicle history', 'A manager history lists vehicles with their labels; the size chart reads observations of one vehicle only']])
        + '<h2>Frontend only</h2>' + tbl(['Change', 'Where'], [['Action names Save to shortlist, Add to research project, Compare in project', 'FundDirectory, FundCatalogProfile, ResearchActions'], ['Shortlist matched by <code>catalogue_uid</code>, not name', 'FundCatalogProfile, FundsZone'], ['Picker shows Already here and Archived · read-only', 'AddToResearch, from <code>?status=all</code> and the project subjects'], ['Compare into an existing comparison with n of 6', 'AddToResearch, using the members route'], ['Back to results restores search, filters, sort, page, selected row and focus', 'FundCatalogProfile back link'], ['Phone comparison By fund pager and By attribute view', 'ProjectComparisons'], ['Unreadable becomes Unavailable on screen', 'UnreadableBadge']])
        + '<h2>Pending the owner · ⚑</h2>' + tbl(['Question', 'Drawn'], [['A dossier for a fund whose list is withdrawn', 'A: keep the founder’s own notes; drop the directory facts and the source'], ['A withdrawn fund already in a comparison', 'A: the column keeps its name with the explanation until the founder removes it'], ['Vehicles the list labels alike (three “Opp”)', 'A: manager plus label as the list writes it; the vintage beside it wherever two share a label']])
        + '<h2>Preserved</h2><p>Research v2 shell and type, the shared Sheet (D1317) and its contract (D685), Platform States vocabulary (D5129), D597 citations on every fund, owner-scoped projects, read-only archived projects, values read live and never stored, no score, rank, total or conversion.</p>')
    };
    if (!html && DOCS[B]) html = DOCS[B]();
    if (!html) html = page(dirPage(0), { h: 900, overlay: sheet(OPP, {}) });
    return { html: { __html: html } };
  }
