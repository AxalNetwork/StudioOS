      PS10: () => dk('<h1>Components and tokens</h1><h2>App chrome tokens (light / dark)</h2>' + J([['page', '#F4F3F7', '#0B1220'], ['surface', '#FFFFFF', '#111827'], ['hairline', '#ECECF1', '#374151'], ['ink', '#18181B', '#E5E7EB'], ['muted', '#6B6577', '#9CA3AF'], ['violet · primary, focus, selection', '#7C3AED', '#A78BFA'], ['lavender · proposed, AI', '#F4F0FE', 'rgba(167,139,250,.12)']].map(x => '<div class="ps-tok"><span>' + x[0] + '</span><span style="display:flex;gap:8px;align-items:center"><span class="ps-sw2" style="background:' + x[1] + '"></span><code>' + x[1] + '</code><span class="ps-sw2" style="background:' + x[2] + '"></span><code>' + x[2] + '</code></span><span></span></div>')) + '<p>Deck themes (Harbor here) live only inside the slide frame and never borrow chrome tokens; the chrome never borrows theme colours.</p>'
        + tbl(['Component', 'Spec'], [['Status pill <code>stt</code>', 'Word + shape + colour; never colour alone. Shared words: Draft saved, Version saved, Unsaved, Offline, Conflict, Read-only, Proposed, To fix, Worth a look, Couldn’t check, Stale, Not recorded, Tracking off, Measured zero'], ['Next step', 'One per page, violet outline, one primary button. Picked from state: no deck → Generate; unchecked version → Review; checked → Share; new engagement → Follow up'], ['Price card', 'Five states (PS-02 B). Carries quote id; button label includes the hold'], ['Source chip', 'Record + as-of; amber when stale; “Typed by you” when unlinked'], ['Proposal', 'Lavender; preview, sources, Accept / Reject / Regenerate (priced)'], ['Grid selection', '2 px violet, label “Chart · c6–12 r2–5”, snapping guides in rose, held areas dashed sky with the person’s name'], ['Recipient preview', 'Browser frame, exact version, watermark, permissions as Sees / Can / Cannot'], ['Absence', 'Tracking off, Unreadable, Measured zero, Not recorded: four looks (PS-07 C)']])
        + '<h2>Accessibility (WCAG 2.2 AA)</h2><p>Focus ring 2 px violet with 2 px offset; targets ≥ 24 px desktop, 44–48 px phone; toolbar is one <code>role="toolbar"</code> with arrow keys; tabs are links with <code>aria-current</code>; save state is a polite live region announced once per change; Grid areas reachable by keyboard (Tab to card, arrows between areas, Enter to select); dragging always has Move up / down. Contrast by token choice, to be verified in browser QA.</p>'),

      PS11: () => dk('<h1>Before / after, and deviations from the approved boards</h1>' + tbl(['Before', 'After', 'Why'], [['Six equal status cards on Overview', 'One Next step, then deck + readiness + investor activity', 'The brief’s P1: make the next action obvious'], ['“✓ Saved” for the draft', '“Draft saved · 16:52” beside “v7 · 3 cards differ”', 'Draft vs version must be unmistakable'], ['Ask in a lightbox over the card', 'Ask in the right column beside the selected area', 'The founder sees the area being changed while choosing'], ['Share settings first', 'Investor first, preview of what they receive', 'Design around the investor'], ['Review across four places with a score on top', 'One page per saved version, grouped, no score', 'No invented readiness score'], ['Absence states drawn alike', 'Four distinct looks', 'Tracking off ≠ unreadable ≠ zero ≠ not recorded']])

      PS12: () => dk('<h1>Handoff</h1>' + tbl(['Screen', 'Preserved', 'Frontend only', 'Backend required'], [

        ['Editor', '<code>PitchEditor</code>, <code>DeckToolbar</code>, <code>CardsStrip</code>, <code>GridStage</code>, <code>deckAutosave.js</code>, presence', 'Three columns; Review/Share/Export in toolbar; draft vs version pair; right-column Design / Data / Eadwyn', 'None after #4596'],

    if (B === 'PS01') html = page(phead('Overview') + homeDeck() + SAMPLE, { h: 840 });
    else if (B === 'PS01B') html = page(phead('Overview', 'Pitch studio', btn('Templates', 'gh')) + homeFirst(), { h: 900 });
