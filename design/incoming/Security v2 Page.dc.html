      SE11d: () => phone('DSR-0031', '<a class="btn t" href="#" style="min-height:44px;align-self:flex-start">‹ Privacy</a><div class="mc"><div class="r1"><b>Erasure · founder@lumen.example</b></div>' + stt('Pending', 'Open') + '</div><dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Received</dt><dd>20 Oct 2026</dd><dt>Due</dt><dd>19 Nov 2026</dd><dt>Remaining</dt><dd>12 days</dd><dt>Next action</dt><dd>Confirm removal, then record outcome</dd></dl><div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Closing doesn’t erase data.</b></div></div><button type="button" class="btn p" style="min-height:48px">Record outcome…</button>'),
      SE11e: () => phone('Resilience', mtabs('More ▾') + '<section class="fail"><div class="top"><span class="ic" style="background:var(--neg)" aria-hidden="true">✕</span><div><b>Restore drill failed</b><p style="font-size:12.5px">1 Nov 03:10 UTC · stopped at Restore</p></div></div><ol style="padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px"><li>✓ Find and verify backup</li><li>✓ Create drill database</li><li style="color:var(--neg);font-weight:800">✕ Restore · exit code 1</li><li class="mu">– Smoke test · not reached</li></ol></section><button type="button" class="disc"><b>Backup evidence</b><span>' + stt('Healthy', 'Present · 12 h old') + '</span><i aria-hidden="true">›</i></button><a class="btn p" href="#" style="min-height:48px">Open runbook</a>'),
      SE11f: () => phone('AI Safety', mtabs('More ▾') + '<div class="nt"><span class="ic" aria-hidden="true">i</span><div>HQ only · no branch attribution</div></div>' + ['Content safety|2 of 2|evaluated outputs safe · small sample', 'Delivery enforcement|0 of 37|inputs blocked', 'Usage anomalies|0 of 9|accounts over threshold'].map(x => { const y = x.split('|'); return '<div class="mc"><span class="eye">' + y[0] + '</span><div class="frac"><b>' + y[1].replace(' of ', ' <span>of ') + '</span></b><small>' + y[2] + '</small></div></div>'; }).join(''))
    };

    /* ---------- docs (spec boards) ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      SEA: () => dk('<h1>Audit of the live page and before/after IA</h1><p>Observed on the live /admin/security page and in SecurityPage.jsx (1,346 lines) on 7 Nov 2026.</p>'
        + tbl(['Finding', 'Why it hurts', 'Change'], [
          ['One long page mixes triage, investigation, action and explanation', 'A failed restore drill sits below unrelated content; an operator scrolls past engineering notes to act', 'Seven workspaces under one header; Overview leads with Action required'],
          ['Emergency action labelled “Force re-auth · all tenants”', 'The handler updates the HQ database only. Branch users are not signed out, so the label overclaims', '“Emergency re-authentication” scoped to HQ-held accounts, with “you will be signed out” stated'],
          ['Raw identifiers as primary labels (gate.totp detail=factor_required)', 'Readable only to engineers', 'Human label first, raw ID in small mono beneath and in the detail drawer'],
          ['“60 newest” with “there are more” and no way to continue', 'Investigation stops at row 60', 'Load older (needs a cursor on /governance)'],
          ['Raw user-agent and IP as session columns', 'Hard to scan; the important columns get squeezed', 'Browser and OS parsed; UA, IP, IDs in an expandable row'],
          ['“Not recorded” used for several meanings', 'Measured zero, unavailable and never-instrumented look the same', '13-state shared vocabulary with shapes'],
          ['AI safety mixes verdicts, enforcement and token anomalies; percentages on n=2', '“100% safe” overstates a tiny sample', 'Three blocks, always “x of n”, small-sample flag'],
          ['Eadwyn rail leads with model descriptions, pricing and top-up', 'Competes with incident work', 'Security prompts first; model and usage folded under a disclosure']])
        + '<h2>Information architecture</h2><div class="cols"><div><p><b>Before</b> — one scroll: overview counters → sessions table → governance ledger (60 rows) → DSR → sanctions → AI safety → backups → force re-auth, with implementation notes interleaved.</p></div><div><p><b>After</b> — <span class="mo">/admin/security</span> with workspaces <b>Overview · Events · Access · Privacy · Trust · AI Safety · Resilience</b> (?tab= deep links). Each workspace: triage strip → working table → detail drawer → actions in dialogs → explanation behind “How this is measured”.</p></div></div>'),
      SEB: () => dk('<h1>Components and states</h1>' + tbl(['Component', 'Use', 'Props / rules'], [
          ['StatusBadge', 'Every state in every workspace', '<code>state</code> one of the 13; renders word + shape + title. Never colour alone.'],
          ['SourceAvailability', 'Header and Events', '<code>read</code>/<code>total</code>, per-source list in a disclosure; partial reads show which source failed and Retry'],
          ['Freshness', 'Every block', '“Observed 14:30 UTC”; Stale when older than the block’s threshold, with last good + last checked'],
          ['ActionRequiredList', 'Overview', 'Severity → title → one-line why → when → one action; “Checked and clear” row of measured zeros beneath'],
          ['ActionDialog', 'All destructive actions', '3 steps Scope → Review → Result; ScopeBox, YouAffected, Reason (≥ 10 chars, server’s MIN_REASON), typed confirm only for emergency'],
          ['PerItemResults', 'Bulk revoke', 'Row per target with server outcome (revoked / already ended / not found); totals in the title'],
          ['EventRow + EventDrawer', 'Events', 'Human label, raw id beneath; drawer: what happened, who/where, related, raw JSON (collapsed)'],
          ['Fraction', 'AI Safety, Access', '“x of n” with a small-sample flag when n &lt; 20; no percentages under that'],
          ['EvidenceLimit', 'Anywhere a source can’t answer', 'Short grey left-rule note, plain language, links to technical detail']])
        + '<h2>Copy rules</h2><p>Primary line answers what is wrong; one short sentence of why; technical detail behind a disclosure. Dates absolute (“Thu 19 Nov 2026”) plus relative (“12 days left”). Scope always named: “HQ-held accounts”, never “all tenants”.</p>'),
      SEC: () => dk('<h1>Accessibility annotations</h1><p>Targets WCAG 2.2 AA in design decisions. Not a compliance claim until tested.</p>' + tbl(['Area', 'Specification'], [
          ['Workspace tabs', '<code>nav</code> of links with <code>aria-current="page"</code> (they are routes, not ARIA tabs); counts read as “Access, 2 items need action”'],
          ['Keyboard', 'Tab order: header → workspace nav → filters → table → row actions. Rows open the drawer on Enter. Esc closes drawer/dialog.'],
          ['Focus', 'Visible 2px violet ring on every control. Dialogs and drawers trap focus and return it to the control that opened them; after a revoke, focus moves to the result message, then back to the row (or the table caption if the row is gone).'],
          ['Announcements', 'Results and errors in <code>role="status"</code> / <code>role="alert"</code>. Field errors linked by <code>aria-describedby</code>. “Observed” time is <code>aria-live="polite"</code> on refresh only.'],
          ['Tables', 'Real <code>table</code> with <code>caption</code>, <code>th scope</code>; day groups as <code>colgroup</code> headers. Checkbox labels name the account.'],
          ['Status', 'Every state has text + shape; tooltips repeat as visually hidden text, not only <code>title</code>.'],
          ['Contrast', 'Body ≥ 4.5:1; amber text #92400e on #fffbeb; Failed is white on #b91c1c. Dashed/dotted outlines distinguish Stale/Unknown/Not instrumented in greyscale.'],
          ['Touch', 'Mobile targets ≥ 44px; destructive buttons 48px, full width, Cancel adjacent.'],
          ['Motion', 'Drawer/sheet slide 160ms; none under <code>prefers-reduced-motion</code>. No pulsing alerts.'],
          ['Small screens', 'Tables become cards (Events, Sessions, DSR); filters move to a sheet; destructive dialogs become bottom sheets with the same three steps.']])),
      SED: () => dk('<h1>React handoff — SecurityPage.jsx</h1>' + tbl(['Today', 'Becomes', 'Notes'], [
          ['<code>SecurityPage.jsx</code> (one component, 1,346 lines)', '<code>pages/hq/security/</code>: <code>SecurityShell</code> + one file per workspace', 'Shell owns header, SourceAvailability, workspace nav, <code>?tab=</code> routing'],
          ['Overview counters', '<code>OverviewWorkspace</code> · ActionRequiredList + StatusByArea', 'Derives from GET <code>/overview</code>; no new fields'],
          ['Governance ledger + FILTERS', '<code>EventsWorkspace</code> + <code>EventDrawer</code>', 'Keeps the six quick categories; label map <code>eventLabels.js</code> (raw kind → human label)'],
          ['Sessions table + force re-auth', '<code>AccessWorkspace</code> + <code>ActionDialog</code>', 'UA parsed client-side (<code>parseUserAgent.js</code>); bulk uses the existing per-item <code>results</code>; “Sign out everywhere” is the existing POST <code>/force-reauth/:userId</code>'],
          ['DSR block', '<code>PrivacyWorkspace</code> + <code>DsrDetail</code>', 'Due date computed from received + <code>DSR_CLOCK_DAYS</code> sent by the server'],
          ['Sanctions, AI, backups blocks', '<code>TrustWorkspace</code>, <code>AiSafetyWorkspace</code>, <code>ResilienceWorkspace</code>', 'TrustContentPage / TrustObligationsPage stay; Trust links to them'],
          ['Eadwyn rail', 'Security prompt set on this route', 'Model/usage under a disclosure']])
        + '<div class="cols"><div><h2>Frontend only</h2><p>Workspaces and routing · state vocabulary · human event labels + drawer · UA parsing · per-item bulk results (already returned) · HQ-held wording · reason validation · draft-vs-published diff (both are readable today) · AI fractions · restore-drill failure layout · mobile cards and sheets · Eadwyn prompts.</p></div>'
        + '<div><h2>Backend required</h2><p><b>Events:</b> cursor (<code>before</code>) on <code>/governance</code>, plus server-side search, date, actor and outcome filters. <b>Trust:</b> publish pinned to a draft revision so stale previews are refused. <b>Subprocessor notices:</b> per-notice delivery records. <b>Privacy:</b> DSR history entries beyond open/closed. <b>Resilience:</b> drill history (the record keeps only the latest run) and an error message beside the step and exit code.</p></div></div>'),
      SEE: () => dk('<h1>Limitations that stay visible</h1><p>These are true of the product today. The design shows them plainly instead of hiding the block.</p>' + tbl(['Limitation', 'Where it shows', 'Wording'], [
          ['Emergency re-auth reaches the HQ database only', 'Access, Overview, dialog', '“Signs out every HQ-held account. Branch databases are not touched.”'],
          ['AI records carry no branch', 'AI Safety header, Unsupported branch filter', '“HQ only. These figures can’t be split by branch.”'],
          ['Sanctions run on request, not on a schedule', 'Trust', '“On request, per entity”'],
          ['Ledger returns 60 newest with a “more” flag, no cursor', 'Events footer', 'Load older shown; until the cursor ships it reads “Showing newest 60 — narrow the filters to see older”'],
          ['Subprocessor notice delivery not recorded', 'Trust', 'Not instrumented'],
          ['DSR closing records a decision; erasure is separate', 'Privacy detail and close dialog', '“Closing records a decision. It does not erase data.”'],
          ['Only the requester can withdraw a DSR', 'Close dialog', '“Withdrawn isn’t offered: only the requester can withdraw.”'],
          ['No restore drill for KV', 'Resilience', 'Unsupported'], ['Drill record keeps only the latest run', 'Resilience · Drill history', 'Not instrumented · “Latest run only”']]))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'SE01') html = page(overview(), { h: 1250 });
    else if (B === 'SE12') html = page(overview(), { h: 1250, ead: true });
    else if (B === 'SE02') html = taxonomy();
    else if (B === 'SE03a') html = page(events(), { h: 1000 });
    else if (B === 'SE03b') html = page(events(), { h: 1000, overlay: evDrawer() });
    else if (B === 'SE04a') html = page(access(false), { h: 1100 });
    else if (B === 'SE04b') html = page(access(true), { h: 1150 });
    else if (B === 'SE05a') html = crop(D1(), 600);
    else if (B === 'SE05b') html = crop(D2(), 600);
    else if (B === 'SE05c') html = crop(D3(), 600);
    else if (B === 'SE05d') html = crop(D4(1), 640);
    else if (B === 'SE05e') html = crop(D4(2), 640);
    else if (B === 'SE05f') html = crop(D5(), 600);
    else if (B === 'SE05g') html = crop(D6(), 600);
    else if (B === 'SE06a') html = page(privacy(false), { h: 900 });
    else if (B === 'SE06b') html = page(privacy(true), { h: 1050 });
    else if (B === 'SE06c') html = crop(D7(), 600);
    else if (B === 'SE06d') html = crop(D8(), 600);
    else if (B === 'SE07a') html = page(trust(), { h: 1000 });
    else if (B === 'SE07b') html = crop(T2(), 660);
    else if (B === 'SE07c') html = crop(T3(), 600);
    else if (B === 'SE08') html = page(ai(), { h: 1000 });
    else if (B === 'SE09') html = page(res(), { h: 1150 });
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview(), { h: 1250 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
