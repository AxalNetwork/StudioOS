<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "900px"}, "board": {"editor": "enum", "default": "PTF01", "options": ["PTF00", "PTF01", "PTF02", "PTF03", "PTF04", "PTF05", "PTF06", "PTF07", "PTF08", "PTF09", "PTF10", "PTF11", "PTF12", "PTF13", "PTF14", "PTF15A", "PTF15B", "PTF15C", "PTF15D", "PTF15E", "PTF15F", "PTF16"]}}'>
class Component extends DCLogic {
  renderVals() {
    const B = this.props.board || 'PTF01';
    const P = { bg: '#f4f3f7', card: '#ffffff', raised: '#f8f7fb', ink: '#18181b', mu: '#6b6577', hair: '#ececf1', hair2: '#d3d0dc', vi: '#7c3aed', vt: '#6d28d9', lav: '#f4f0fe', lavE: '#ddd2fb', pos: '#047857', posBg: '#ecfdf5', posE: '#a7f3d0', neg: '#b91c1c', negBg: '#fef2f2', negE: '#fecaca', amT: '#92400e', amBg: '#fffbeb', amE: '#fcd34d', amD: '#d97706', dim: 'rgba(24,24,27,.42)', skel: '#ececf1', stage: '#e9e8ef' };
    const VARS = Object.keys(P).map(k => '--' + k + ':' + P[k]).join(';');
    const J = (a) => a.join('');
    const SV = (d) => '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12">' + d + '</svg>';
    const SH = {
      ok: SV('<path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2"/>'),
      ar: SV('<path d="M6 1l5 9.5H1z" fill="currentColor"/>'),
      fl: SV('<path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="2.2"/>'),
      pd: SV('<circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 3.5V6l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>'),
      lk: SV('<rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="currentColor"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>'),
      q: SV('<path d="M4.2 4.3a1.9 1.9 0 1 1 2.4 1.8c-.4.2-.6.5-.6 1V8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="10" r=".9" fill="currentColor"/>'),
      dot: SV('<circle cx="6" cy="6" r="4" fill="currentColor"/>'),
      nd: SV('<circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>'),
      off: SV('<circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 9.2l6.4-6.4" stroke="currentColor" stroke-width="1.6"/>'),
      nr: SV('<path d="M2 6h8" stroke="currentColor" stroke-width="1.8"/>'),
      un: SV('<path d="M6 1.6v6" stroke="currentColor" stroke-width="2.2"/><circle cx="6" cy="10.2" r="1.2" fill="currentColor"/>'),
      re: SV('<path d="M9.8 4.4A4.2 4.2 0 1 0 10 7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 1.6v3.2H7.2" fill="none" stroke="currentColor" stroke-width="1.6"/>')
    };
    /* one state vocabulary (Pitch Studio v2 + Platform States): the word carries the meaning, the shape repeats it, colour never alone */
    const S = {
      'Version saved': ['ok', 'ok'], 'All changes saved': ['ok', 'ok'], Passed: ['ok', 'ok'], Fixed: ['ok', 'ok'], 'Nothing to fix': ['ok', 'ok'],
      'Unsaved changes': ['pd', 'dot'], 'Changed in draft': ['pd', 'dot'], 'Your draft': ['pd', 'dot'],
      'Blocks export': ['fl', 'fl'], 'To fix': ['fl', 'fl'], Failed: ['fl', 'fl'],
      Warning: ['xar', 'ar'], 'Worth a look': ['xar', 'ar'], 'Out of date': ['xst', 'pd'],
      "Couldn’t check": ['un', 'q'], 'Checking…': ['un', 'q'],
      'Not checked': ['ni', 'nd'], 'Read-only': ['ni', 'lk'], Dismissed: ['ni', 'off']
    };
    const st = (s, label) => { const x = S[s] || ['', 'nd']; return '<span class="stt ' + x[0] + '">' + SH[x[1]] + (label || s) + '</span>'; };
    const K = { nr: ['st-nr', 'nr', 'Not recorded'], un: ['st-un', 'un', 'Unavailable'], stale: ['st-stale', 'pd', 'Stale'], part: ['st-part', 'nd', 'Partial'] };
    const chip = (k, label) => { const x = K[k]; return '<span class="st-c ' + x[0] + '">' + SH[x[1]] + (label || x[2]) + '</span>'; };
    const retry = (s) => '<button type="button" class="st-retry">' + SH.re + (s || 'Try again') + '</button>';
    const ENG = (t) => '<span class="st-eng" title="Annotation: requires engineering (not product copy)">◇ ' + t + '</span>';
    const POL = (t) => '<span class="ptf-pol" title="Annotation: owner decision (not product copy)">⚑ ' + t + '</span>';
    const NOTE = (n, t) => '<span class="ptf-note"><b>' + n + '</b>' + t + '</span>';
    const btn = (t, c, x) => '<button type="button" class="btn ' + (c || '') + '"' + (x || '') + '>' + t + '</button>';
    const SAMPLE = '<span class="ptf-sample">Sample data · Atlas Orchard, its deck and every figure are fictional</span>';
    const DECK = 'Atlas Orchard · Seed deck';

    /* ---------- the deck: themed apart from the app chrome (960 × 540 inner, 12 × 6 grid of 80 × 90) ---------- */
    const at = (c1, c2, r1, r2, inner, sty) => '<div style="position:absolute;left:' + ((c1 - 1) * 80) + 'px;top:' + ((r1 - 1) * 90) + 'px;width:' + ((c2 - c1 + 1) * 80) + 'px;height:' + ((r2 - r1 + 1) * 90) + 'px;padding:12px 18px;' + (sty || '') + '">' + inner + '</div>';
    const T = (t, o) => '<div style="font:800 34px var(--sg);letter-spacing:-.02em;line-height:1.2;' + (o || '') + '">' + t + '</div>';
    const tile = (label, value, face) => '<div style="display:flex;flex-direction:column;gap:4px;height:100%;justify-content:center"><div style="font:700 13px var(--mo);letter-spacing:.06em;color:#a9c0ae">' + label + '</div><div style="font:800 46px var(--sg);letter-spacing:-.02em;color:#f2b45c;line-height:1">' + value + '</div><div style="font:500 13px var(--sg);color:#a9c0ae">' + face + '</div></div>';
    const bars = (vals, lab) => '<div style="display:flex;align-items:stretch;gap:12px;height:250px;padding-top:8px">' + J(vals.map((v, i) => '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px"><div style="width:100%;height:' + v + '%;background:' + (i === vals.length - 1 ? '#f2b45c' : 'rgba(242,180,92,.38)') + ';border-radius:4px 4px 0 0"></div><span style="font:500 13px var(--mo);color:#a9c0ae">' + lab[i] + '</span></div>')) + '</div>';
    const SLIDES = {
      cover: () => at(1, 9, 2, 4, '<div style="font:700 15px var(--mo);color:#f2b45c;letter-spacing:.08em">SEED · 2026</div><div style="font:800 64px var(--sg);letter-spacing:-.03em;line-height:1;margin-top:14px">Atlas Orchard</div><div style="font:500 26px var(--sg);color:#c9d8cc;margin-top:16px;line-height:1.25">Yield forecasting for mid-size orchards</div>'),
      problem: () => at(1, 12, 1, 1, T('Growers guess the harvest')) + at(1, 7, 2, 5, '<div style="font:500 20px var(--sg);line-height:1.5;color:#c9d8cc">A mid-size orchard sells most of its crop before it is picked. Today the forecast is a walk through the rows and a number in a notebook.</div>'),
      traction: (o) => { o = o || {}; return at(1, 12, 1, 1, T('Traction since the first harvest')) + at(1, 4, 2, 3, tile('MRR', o.stale ? '$34.2k' : '$34.2k', 'Grow · Measured')) + at(1, 4, 4, 5, tile('PAYING CUSTOMERS', '38', 'Grow · Measured')) + at(5, 12, 2, 5, '<div style="font:700 13px var(--mo);color:#a9c0ae;margin-bottom:4px">FORECASTS DELIVERED PER MONTH</div>' + bars([22, 38, 61, 84], ['Aug', 'Sep', 'Oct', 'Nov*'])) + at(1, 12, 6, 6, '<div style="font:500 13px var(--mo);color:#a9c0ae">* November to date. Figures linked to their records.</div>'); },
      market: () => at(1, 12, 1, 1, T('Market')) + at(1, 12, 2, 5, '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:100%">' + J([['4,200', 'mid-size orchards in our three regions'], ['$1,900', 'average yearly spend on yield advice'], ['$8.0m', 'serviceable market today']].map(x => '<div style="border:1px solid rgba(242,180,92,.35);border-radius:12px;padding:18px"><div style="font:800 36px var(--sg);color:#f2b45c">' + x[0] + '</div><div style="font:500 16px var(--sg);color:#c9d8cc;margin-top:8px;line-height:1.35">' + x[1] + '</div></div>')) + '</div>'),
      whynow: (o) => { o = o || {}; const long = o.long; return at(1, 12, 1, 1, long ? (o.clipview ? T('Why now: growers must lock 2027 buyer contracts <span style="opacity:.35">before the frost season</span>') : '<div style="height:66px;overflow:hidden">' + T('Why now: growers must lock 2027 buyer contracts before the frost season') + '</div>') : T('Why now'), long && o.clipview ? 'overflow:visible;padding-top:40px' : '') + at(1, 7, 2, 5, '<div style="font:500 20px var(--sg);line-height:1.5;color:#c9d8cc">Buyers now ask for volume commitments in spring. A grower who can show a measured forecast signs earlier and at a better price.</div>') + at(8, 12, 2, 5, '<div style="border:1px dashed rgba(169,192,174,.5);border-radius:12px;height:100%;padding:18px;font:600 18px var(--sg);color:#c9d8cc;line-height:1.4">“We sign in March for a crop we see in September.”<div style="font:500 12px var(--mo);color:#a9c0ae;margin-top:10px">Validate › Interviews · 9 Oct</div></div>'); },
      product: (o) => { o = o || {}; return at(1, 12, 1, 1, T('Product')) + at(6, 12, 2, 5, '<div style="height:100%;border-radius:10px;background:#20402d;display:grid;place-items:center;font:600 14px var(--mo);color:#a9c0ae">App screenshot</div>') + at(o.overlap ? 4 : 1, o.overlap ? 8 : 5, 3, 4, '<div style="font:500 19px var(--sg);color:#e1ebe3;line-height:1.45;background:' + (o.overlap ? 'rgba(20,40,29,.85)' : 'transparent') + '">Scan ten trees a row with a phone. The forecast updates by the evening.</div>'); },
      competition: () => at(1, 12, 1, 1, T('Competition')) + at(1, 6, 2, 5, '<div style="font:500 19px var(--sg);line-height:1.5;color:#c9d8cc">Agronomy consultants visit twice a season. Satellite tools see canopy, not fruit. We count fruit on the tree.</div>') + at(7, 12, 2, 5, '<div style="height:100%;border-radius:10px;background:repeating-linear-gradient(45deg,#1d3a29 0 14px,#22452f 14px 28px);display:grid;place-items:center;font:600 14px var(--mo);color:#c9d8cc">Competitor map</div>')
    };
    const ORDER = [['cover', 'Cover'], ['problem', 'Problem'], ['traction', 'Traction'], ['market', 'Market'], ['whynow', 'Why now'], ['product', 'Product'], ['competition', 'Competition']];
    const NUM = { cover: 1, problem: 2, traction: 3, market: 4, whynow: 5, product: 6, competition: 9 };
    const slide = (k, w, o) => { o = o || {}; const h = Math.round(w * 9 / 16); return '<div class="ps-slide ptf-th" style="width:' + w + 'px;height:' + h + 'px' + (o.ring ? ';box-shadow:0 0 0 2px #7c3aed' : '') + '" role="img" aria-label="Slide ' + NUM[k] + ', ' + k + '"><div class="ps-sin" style="transform:scale(' + (w / 960).toFixed(4) + ')">' + SLIDES[k](o) + '</div>' + (o.grid ? '<div class="ps-gridov"></div>' : '') + (o.over || '') + '</div>'; };
    /* a finding drawn on its slide: the element outlined and numbered (main's overlay, #3661 PF3) */
    const mark = (n, l, t, w, h, tone, lab) => '<div class="ptf-mk ' + tone + '" style="left:' + l + '%;top:' + t + '%;width:' + w + '%;height:' + h + '%"><span class="ptf-mn">' + n + '</span>' + (lab ? '<span class="ptf-ml">' + lab + '</span>' : '') + '</div>';
    const M1 = (n, tone, lab) => mark(n, 0.6, 17.2, 32.6, 32.4, tone || 'wa', lab);
    const M2 = (n, tone, lab) => mark(n, 0.6, 50.6, 32.6, 32.4, tone || 'wa', lab);
    const CLIP = '<div class="ptf-clip" style="left:0;top:0;width:100%;height:16.66%"></div>';

    /* ---------- the findings (one draft check, one v7 check) ---------- */
    const F = {
      f1: { n: 1, sev: 'b', slide: 5, el: 'Title', val: '', prob: 'Cut off at export size', det: 'At 1920 × 1080 the title needs 2 lines and its block holds 1. The PDF and PowerPoint would lose “before the frost season”.', fix: 'Shorten it, or give the block another row.', aria: 'Show the title on slide 5' },
      f2: { n: 2, sev: 'w', slide: 3, el: 'Metric tile “MRR”', val: '$34.2k', prob: 'Source date not recorded', det: 'Bound to Grow › MRR (Measured), but the binding carries no date, so a reader can’t tell how current $34.2k is.', fix: 'Bind it again from Sources: the record is now dated 20 Nov 2026.', aria: 'Show the MRR tile on slide 3' },
      f3: { n: 3, sev: 'w', slide: 3, el: 'Metric tile “Paying customers”', val: '38', prob: 'Source date not recorded', det: 'Bound to Grow › Paying customers (Measured), but the binding carries no date, so a reader can’t tell how current 38 is.', fix: 'Bind it again from Sources: the record is now dated 20 Nov 2026.', aria: 'Show the Paying customers tile on slide 3' },
      f4: { n: 4, sev: 'w', slide: 9, el: 'Image “Competitor map”', val: '', prob: 'No alt text', det: 'A screen reader, and the HTML export, have nothing to say for it.', fix: 'Add alt text in the image toolbar.', aria: 'Show the Competitor map image on slide 9' }
    };
    const sevChip = (s) => s === 'b' ? st('Blocks export') : s === 'u' ? st("Couldn’t check") : st('Warning');
    /* one finding row: number, severity, slide · element, the source problem, why, what to do, its actions */
    const row = (f, o) => { o = o || {}; const where = (o.inGroup ? '' : 'Slide ' + f.slide + ' · ') + f.el + (f.val ? ' · <span class="mo">' + f.val + '</span>' : ''); return '<li class="ptf-row ' + (f.sev === 'b' ? 'b' : 'w') + (o.focus ? ' fv' : '') + (o.done ? ' done' : '') + (o.dim ? ' dim' : '') + '" aria-label="' + (f.sev === 'b' ? 'Blocks export' : 'Warning') + ', slide ' + f.slide + ', ' + f.el.replace(/[“”]/g, '') + ', ' + f.prob.toLowerCase() + '"><span class="ptf-n" aria-hidden="true">' + f.n + '</span><div class="ptf-rb"><div class="ptf-rh">' + (o.chip === false ? '' : sevChip(f.sev)) + (o.changed ? st('Changed in draft', 'Changed in your draft · not re-checked') : '') + '</div><b class="ptf-where">' + where + '</b><span class="ptf-prob">' + (f.sev === 'w' && f.prob.indexOf('date') > -1 ? chip('nr', 'Source date · Not recorded') : f.prob) + '</span>' + (o.compact ? '' : '<span class="ptf-det">' + f.det + '</span><span class="ptf-fix">' + f.fix + '</span>') + (o.noAct ? '' : '<span class="ptf-act">' + btn(o.showWord || 'Show on slide', 'gh bsm' + (o.focusBtn ? ' fv' : ''), ' aria-label="' + f.aria + '"') + (f.sev === 'w' && !o.noDismiss ? btn('Dismiss', 't bsm', ' aria-label="Dismiss: ' + f.el.replace(/[“”]/g, '') + ', slide ' + f.slide + '"') : '') + '</span>') + '</div></li>'; };
    const grp = (head, note, rows) => '<li class="ptf-grp"><div class="ptf-gh"><b>' + head + '</b><span>' + note + '</span></div><ul class="ptf-gl">' + rows + '</ul></li>';
    const slide3Group = (o) => { o = o || {}; return grp('Slide 3 · Traction · Source date not recorded · 2 metric tiles', 'One problem on two tiles. Each tile is its own finding: fixing or dismissing one leaves the other.', (o.f2 === 'fixed' ? '' : row(F.f2, { inGroup: true, chip: false, focusBtn: o.focus2, changed: o.f2 === 'changed', compact: o.compact })) + row(F.f3, { inGroup: true, chip: false, focusBtn: o.focus3, compact: o.compact })); };
    const sec = (h, count, note, inner, o) => { o = o || {}; return '<section class="ptf-sec" aria-labelledby="' + h.replace(/\W/g, '') + '"><div class="ptf-sh"><h3 id="' + h.replace(/\W/g, '') + '">' + h + ' <span class="mo">(' + count + ')</span></h3><span>' + note + '</span></div><ul class="ptf-list">' + inner + '</ul></section>'; };
    const passed = (n, open) => '<section class="ptf-sec"><button type="button" class="ptf-disc" aria-expanded="' + (open ? 'true' : 'false') + '"><span>' + st('Passed', 'Passed · ' + n + ' checks') + '</span><span class="mu" style="font-size:11.5px">' + (open ? 'Hide ▾' : 'Show ▸') + '</span></button>' + (open ? '<p class="mu" style="font-size:12px">Grid and overlap · Text density · Font size · Contrast · Image resolution and fit · Consistent theme · Unresolved placeholders</p>' : '') + '</section>';
    /* what was checked: the draft or a saved version, never mixed */
    const scope = (k, t) => k === 'draft'
      ? '<div class="ptf-scope draft"><span>' + st('Your draft', 'Checked: your draft · not a version') + '</span><span class="mo">' + (t || 'v7 + edits on 2 slides · checked 10:02') + ' · 12 slides</span></div>'
      : k === 'v8' ? '<div class="ptf-scope ver"><span>' + st('Version saved', 'Checked: v8') + '</span><span class="mo">saved Thu 26 Nov, 10:18 · 12 slides · what Export and links send</span></div>'
        : '<div class="ptf-scope ver"><span>' + st('Version saved', 'Checked: v7') + '</span><span class="mo">saved Wed 25 Nov, 16:40 · 12 slides · what Export and links send</span></div>';
    const summary = (cls, head, line) => '<div class="ptf-sum ' + cls + '" role="status"><b>' + head + '</b><span>' + line + '</span></div>';
    const DRAFT_SUM = summary('b', SH.fl + ' 1 blocker · 3 warnings', 'Fix the blocker before you save this draft as v8: a version with a blocker can’t be exported or shared. Warnings can be confirmed when you send.');
    const VERSION_LINE = (n) => '<div class="ptf-vl"><b>Your draft is not a version.</b> Export and investor links send v7, which still has ' + n + '. Save v8 to send your repairs; v8 is checked again as saved.</div>';

    /* the results panel (proposed), 420 wide, in the editor’s right column */
    const panel = (k) => {
      const head = '<div class="ptf-ph"><div><h2>Check before you send</h2></div>' + btn('✕', 'gh bsm', ' aria-label="Close the check"') + '</div>';
      const foot = '<div class="ptf-pf"><span class="mu" style="font-size:11.5px">Checks are free. They change nothing on your slides.</span>' + btn('Re-check draft', 'gh bsm') + '</div>';
      if (k === 'first') return head + '<div class="ptf-pb">' + scope('draft') + DRAFT_SUM
        + sec('To fix', 1, 'Blocks export once saved', row(F.f1))
        + sec('Worth a look', 3, 'Warnings · you can dismiss these', slide3Group({ focus2: true }) + row(F.f4))
        + passed(7) + VERSION_LINE('the 3 warnings') + '</div>' + foot;
      if (k === 'back') return head + '<div class="ptf-pb">' + scope('draft', 'v7 + edits on 2 slides · checked 10:09')
        + '<div class="ptf-fixed" role="status">' + SH.ok + ' Re-checked your draft · Fixed since the last check: Slide 3 · MRR tile</div>'
        + summary('b', SH.fl + ' 1 blocker · 2 warnings', 'The MRR tile now carries its date. 1 blocker and 2 warnings are left in your draft.')
        + sec('To fix', 1, 'Blocks export once saved', row(F.f1))
        + sec('Worth a look', 2, 'Warnings · you can dismiss these', slide3Group({ f2: 'fixed', focus3: true }) + row(F.f4))
        + passed(7) + VERSION_LINE('all 3 warnings, the MRR tile’s too') + '</div>' + foot;
      if (k === 'clean') return head + '<div class="ptf-pb">' + scope('draft', 'v7 + edits on 3 slides · checked 10:16')
        + '<div class="ptf-fixed" role="status">' + SH.ok + ' Fixed since the last check: Slide 5 · Title, Slide 3 · Paying customers tile, Slide 9 · Competitor map</div>'
        + summary('ok', SH.ok + ' Nothing to fix', 'All 10 checks passed on 12 slides of your draft.')
        + passed(10, true) + '<div class="ptf-vl"><b>Ready to save as v8.</b> Export and investor links send versions only: v7 still has its 3 warnings. Saving checks v8 again as saved.</div></div>' + foot;
      return '';
    };

    /* ---------- editor shell (Pitch Studio v2, PS-03) ---------- */
    const ERAIL = '<nav class="ps-rail" aria-label="StudioOS"><span class="ps-lg" aria-hidden="true"></span>' + J([['Home', 'H'], ['Validate', 'V'], ['Build', 'B'], ['Raise', 'R', 1], ['Grow', 'G'], ['Network', 'N']].map(x => '<a href="#" class="ps-ri' + (x[2] ? ' on' : '') + '" aria-label="' + x[0] + '"' + (x[2] ? ' aria-current="page"' : '') + '>' + x[1] + '</a>')) + '</nav>';
    const CHK = {
      draft: ['b', SH.fl + ' Draft · 1 blocker · 3 warnings'],
      back: ['b', SH.fl + ' Draft · 1 blocker · 2 warnings'],
      stale: ['o', SH.pd + ' Not checked since your last edit'],
      clean: ['ok', SH.ok + ' Draft · Nothing to fix'],
      v8: ['ok', SH.ok + ' v8 · Nothing to fix']
    };

    const D10 = () => crop('<span class="eye">PTF-10 · test fixture B · two stale metrics on one slide</span><h2 class="ptf-h">Both tiles on slide 3 changed in their store since v7 was saved</h2><p class="mu" style="font-size:12.5px">Fixture B: the bindings are dated 31 Oct 2026; the store now reads $36.8k and 41, dated 20 Nov 2026. The refresh read (<code>POST /api/decks/:id/refresh</code>) returns one row per tile, each with <code>field: block:0</code> and <code>block:1</code>.</p><div class="ps-g2">'
      + card('Today on main · one row for the slide', '<div class="ptf-mr"><span class="eye">Slide 3 · Whole slide</span><b>A bound figure has changed in its store.</b><span class="mu">The card shows an older figure than the record.</span><span style="display:flex;gap:6px">' + btn('Show me', 'gh bsm') + btn('Dismiss', 'gh bsm') + '</span></div><p class="mu" style="font-size:12px">Which figure, and that there are two, is not said. Dismissing it dismisses both.</p>', { r: '<span class="ptf-cb w">' + SH.ar + '1 warning</span>' })
      + card('Proposed · one row per tile, one action for both', '<ul class="ptf-list">' + grp('Slide 3 · Traction · Changed in its store · 2 metric tiles', 'Each tile is its own finding.', J([['2', 'MRR', '$34.2k', '$36.8k'], ['3', 'Paying customers', '38', '41']].map(x => '<li class="ptf-row w"><span class="ptf-n" aria-hidden="true">' + x[0] + '</span><div class="ptf-rb"><b class="ptf-where">Metric tile “' + x[1] + '”</b><span class="ptf-prob">' + chip('stale', 'Changed in its store') + '</span><span class="ptf-det">On the slide <span class="mo">' + x[2] + '</span> as of 31 Oct 2026 · in the record <span class="mo">' + x[3] + '</span> as of 20 Nov 2026</span><span class="ptf-act">' + btn('Show on slide', 'gh bsm', ' aria-label="Show the ' + x[1] + ' tile on slide 3"') + btn('Dismiss', 't bsm') + '</span></div></li>'))) + '</ul><div style="display:flex;gap:8px;align-items:center">' + btn('Refresh both from records', '') + '<span class="mu" style="font-size:11.5px">Main’s “Refresh from records”: draws the newest snapshot into your draft. Nothing is saved until you save a version. Keeping 31 Oct is Dismiss.</span></div>', { r: '<span class="ptf-cb w">' + SH.ar + '2 warnings</span>' })
      + '</div>' + card('On the slide', slide('traction', 560, { over: M1(2, 'wa', 'MRR · $34.2k → $36.8k') + M2(3, 'wa', 'Paying customers · 38 → 41') }) + '<p class="mu" style="font-size:12px">The editor’s existing “A figure on this card has changed in its store.” notice already lists each value then and now (<code>FigureCard.jsx</code> <code>ChangedNotice</code>); the check now says the same per tile.</p>'), 1200);

    const D11 = () => crop('<span class="eye">PTF-11 · structural and layout failures</span><h2 class="ptf-h">Blockers: the export would lose content, so they can’t be dismissed</h2><div class="ps-g2">'
      + card('Slide 5 · Title · cut off at export size', slide('whynow', 520, { long: true, clipview: true, over: CLIP + mark(1, 0.4, 0.4, 99.2, 16, 'bl', '') }) + '<p class="mu" style="font-size:12px">Drawn as exported. The red line is the edge of the title block; the greyed words past it are hidden in the PDF and PowerPoint.</p><ul class="ptf-list">' + row(F.f1, { noDismiss: true }) + '</ul><p class="mu" style="font-size:12px">Measured on the slide drawn at 1920 × 1080 (<code>PreflightMeasure</code>). Without a measurement it is “Couldn’t check”, never a pass.</p>', { r: st('Blocks export') })
      + card('Slide 6 · two blocks overlap', slide('product', 520, { overlap: true, over: mark(5, 25, 33.3, 41.6, 33.3, 'bl', 'Body text') + mark(5, 41.66, 16.66, 58.3, 66.6, 'bl ghost', 'Image “App screenshot”') }) + '<ul class="ptf-list"><li class="ptf-row b"><span class="ptf-n" aria-hidden="true">5</span><div class="ptf-rb"><div class="ptf-rh">' + st('Blocks export') + '</div><b class="ptf-where">Slide 6 · Body text and Image “App screenshot”</b><span class="ptf-prob">Two blocks overlap</span><span class="ptf-det">They share cells c6–8 r3–4, so the export would leave one out.</span><span class="ptf-fix">Move one of them.</span><span class="ptf-act">' + btn('Show on slide', 'gh bsm', ' aria-label="Show the overlapping blocks on slide 6"') + '</span></div></li></ul><p class="mu" style="font-size:12px">Both elements are named and outlined; the row is one finding (main: <code>layout</code>, one id).</p>', { r: st('Blocks export') })
      + '</div>' + card('What a blocker does to sending', '<dl class="ps-kv"><dt>Dismiss</dt><dd>Not offered. The Worker refuses it too (<code>422 finding_blocking</code>).</dd><dt>In the draft</dt><dd>The draft can still be saved: a version with a blocker can’t be exported or shared until a later version fixes it.</dd><dt>Export of that version</dt><dd>“Export PDF” is disabled with the reason: “Fix the blocker in your draft and save a new version to export.”</dd><dt>Other blocking checks</dt><dd>A block off the 12 × 6 grid, more than 24 blocks, an image block with no image.</dd></dl>'), 1200);

    const D12 = () => crop('<span class="eye">PTF-12 · check states</span><h2 class="ptf-h">Checking, couldn’t check, unreadable, out of date, read-only, not checked</h2><div class="ps-g3">'
      + card('Checking', '<div class="ptf-sum n" role="status"><b>' + SH.q + ' Checking slide 7 of 12</b><span>You can keep editing. Results appear when every slide is checked.</span></div><div class="ps-bar"><i style="width:50%"></i></div>', { r: st('Checking…') })
      + card('One slide couldn’t be checked', '<div class="ptf-sum n" role="status"><b>' + SH.q + ' No blockers found · 1 slide couldn’t be checked</b><span>Slide 9 was not drawn at export size, so cut-off text, font size and image fit were not measured. That is not a pass.</span></div><ul class="ptf-list"><li class="ptf-row u"><span class="ptf-n" aria-hidden="true">?</span><div class="ptf-rb"><div class="ptf-rh">' + st("Couldn’t check") + '</div><b class="ptf-where">Slide 9 · Competition</b><span class="ptf-act">' + retry('Try again to check slide 9') + '</span></div></li></ul><p class="mu" style="font-size:11.5px">Export lists it with the warnings to confirm. “Nothing to fix” is never shown.</p>', { r: st("Couldn’t check") })
      + card('The version couldn’t be read', '<div class="ptf-sum un" role="alert"><b>' + chip('un') + ' v7 wasn’t checked</b><span>v7’s content could not be read, so it could not be checked. This is not a pass and not an empty result.</span></div>' + retry() + '<p class="mu" style="font-size:11.5px">Export PDF stays disabled (main: <code>contentUnreadable</code>).</p>', { r: chip('un') })
      + card('Out of date', '<div class="ptf-sum o" role="status"><b>' + SH.pd + ' Out of date</b><span>You edited the draft after this check. The rows below describe the draft as it was at 10:02.</span></div>' + btn('Re-check draft', 'bsm') + '<p class="mu" style="font-size:11.5px">Rows keep their numbers; “Show on slide” draws the slide as checked, and says so.</p>', { r: st('Out of date') })
      + card('Read-only · a reader of the deck', '<div class="ptf-sum w" role="status"><b>' + SH.ar + ' No blockers · 3 warnings</b><span>You can see what needs fixing. Editors of this deck dismiss findings and repair them.</span></div><p class="mu" style="font-size:11.5px">Show on slide works; Dismiss and repair actions are absent, not greyed.</p>', { r: st('Read-only') })
      + card('Not checked yet', '<div class="ptf-sum n" role="status"><b>' + SH.nd + ' Not checked yet</b><span>Run the check on your draft. Export and Share check the version they send on their own.</span></div>' + btn('Check my draft', 'bsm'), { r: st('Not checked') })
      + '</div>', 1200);

    const D13 = () => crop('<span class="eye">PTF-13 · the headline, the export and what is announced</span><h2 class="ptf-h">“Nothing to fix” only when nothing is left: no blocker, no warning, nothing unchecked</h2><table class="ptf-tb"><thead><tr><th>Result</th><th>Headline</th><th>Export of that version</th><th>Announced once, politely, when the check ends</th></tr></thead><tbody>'
      + J([
        ['Blockers', SH.fl + ' 1 blocker · 3 warnings', 'Not allowed. Disabled with the reason.', '“Check finished on your draft: 1 blocker, 3 warnings. Export blocked until the blocker is fixed.”'],
        ['Warnings only', SH.ar + ' No blockers · 3 warnings', 'Allowed after the founder confirms the warnings.', '“Check finished on v7: no blockers, 3 warnings to confirm before export.”'],
        ['Unchecked slides', SH.q + ' No blockers found · 1 slide couldn’t be checked', 'Allowed after confirming; the slide is listed.', '“Check finished on v7: no blockers found, 1 slide couldn’t be checked.”'],
        ['Version unreadable', chip('un') + ' v7 wasn’t checked', 'Not allowed until it can be read.', '“v7 could not be read, so it was not checked.” (alert)'],
        ['Genuinely clean', SH.ok + ' Nothing to fix', 'Allowed, no confirmation.', '“Check finished on v8: nothing to fix. All 10 checks passed on 12 slides.”'],
        ['Out of date', SH.pd + ' Not checked since your last edit', 'Export checks the saved version itself.', 'Nothing on each edit; the chip changes silently.']
      ].map(r => '<tr><th scope="row">' + r[0] + '</th><td><b>' + r[1] + '</b></td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>')) + '</tbody></table><p class="mu" style="font-size:12px">Each headline names what was checked (“your draft”, “v7”). Counts are written in words beside the glyph; colour never carries severity alone.</p>', 1200);

    const D14 = () => crop('<span class="eye">PTF-14 · keyboard, headings and announcements</span><h2 class="ptf-h">From the toolbar chip to the element and back to the same row</h2><div class="ps-g3">'
      + card('Focus order · the panel', '<ol class="ptf-kb">' + J(['Toolbar chip “Draft · 1 blocker · 3 warnings” (Enter opens the panel; focus moves to its heading)', 'Close the check', 'Row 1 · Show the title on slide 5', 'Row 2 · Show the MRR tile on slide 3', 'Row 2 · Dismiss: MRR tile', 'Row 3 · Show the Paying customers tile on slide 3', 'Row 3 · Dismiss: Paying customers tile', 'Row 4 · Show the Competitor map image on slide 9', 'Row 4 · Dismiss', 'Passed · 7 checks (disclosure)', 'Re-check draft'].map((t, i) => '<li><span class="ptf-kn">' + (i + 1) + '</span>' + t + '</li>')) + '</ol>')
      + card('Focus order · on the slide', '<ol class="ptf-kb">' + J(['Show on slide selects the element; focus moves to the strip’s finding line (read once)', 'Back to the check', 'Previous · Next finding (aria-disabled at the first and the last)', 'Close the finding (Esc)', 'The element’s inspector: “Bind again with the record’s date”', 'Back to the check returns focus to the same row’s Show button; if the finding is fixed, to the next row, and the status says so'].map((t, i) => '<li><span class="ptf-kn">' + (i + 1) + '</span>' + t + '</li>')) + '</ol>')
      + card('Headings and live regions', '<ul class="ptf-ul"><li><b>h2</b> Check before you send</li><li style="padding-left:14px"><b>h3</b> To fix (1)</li><li style="padding-left:14px"><b>h3</b> Worth a look (3) · group heading is text, not a heading</li><li><b>Rows</b> are list items named “Warning, slide 3, Metric tile MRR, source date not recorded”</li><li><b>One polite status</b> per check: the PTF-13 sentence. Blockers are not alerts: the page still works. Only “couldn’t be read” is an alert.</li><li><b>Strip</b> finding line is polite; stepping reads the new finding once.</li><li><b>Repair</b> “Bound again in your draft.” is polite.</li><li><b>Targets</b> 32 px desktop, 44 px phone; focus ring 2 px violet with 2 px offset.</li></ul>')
      + '</div>', 1200);

    /* ---------- phone 390 ---------- */
    const phone = (title, body, foot, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ps-phone"><div class="ps-pst"><span>9:41</span><span>●●● ▮</span></div><div class="ps-ptop"><a href="#" class="ps-pbtn" aria-label="Back">‹</a><b>' + title + '</b><a href="#" class="ps-pbtn" aria-label="More">⋯</a></div>' + (o.banner || '') + '<div class="ps-pbody">' + body + '</div>' + (foot ? '<div class="ps-pfoot">' + foot + '</div>' : '') + (o.sheet || '') + '</div></div>'; };
    const step = (n, t) => '<span class="ptf-step">' + n + ' · ' + t + '</span>';
    const MOB = {
      PTF15A: () => phone('Check before you send', step(1, 'The check') + scope('draft').replace('ptf-scope', 'ptf-scope ph') + DRAFT_SUM.replace('Fix the blocker before you save this draft as v8: a version with a blocker can’t be exported or shared. Warnings can be confirmed when you send.', 'Fix the blocker before you save v8. Warnings can be confirmed when you send.') + '<ul class="ptf-list ph">' + row(F.f1, { compact: true }) + grp('Slide 3 · Source date not recorded · 2 tiles', '', row(F.f2, { inGroup: true, chip: false, compact: true, focusBtn: true }) + row(F.f3, { inGroup: true, chip: false, compact: true })) + '</ul><span class="mu" style="font-size:11.5px">+ 1 more warning · Passed · 7 checks</span>', btn('Re-check draft', '')),
      PTF15B: () => phone('Slide 3 · Traction', step(2, 'Show on slide') + slide('traction', 362, { over: M1(2, 'wa sel') + M2(3, 'wa ghost') }) + '<div class="ptf-pcard"><span class="eye">Finding 2 of 4 · Slide 3</span><b>Metric tile “MRR” · <span class="mo">$34.2k</span></b>' + chip('nr', 'Source date · Not recorded') + '<span class="mu" style="font-size:12.5px">Bound to Grow › MRR (Measured). The record is now dated 20 Nov 2026.</span><div style="display:flex;gap:8px">' + btn('Previous', 'gh bsm') + btn('Next', 'gh bsm') + '</div></div>', btn('Repair this tile', 'p') + btn('‹ Back to the check', 'gh')),
      PTF15C: () => phone('Slide 3 · Traction', step(3, 'Repair in your draft') + slide('traction', 362, { over: M1(2, 'wa sel') }), '', { sheet: '<div class="ps-psheet" role="dialog" aria-labelledby="rph"><span class="ps-grab"></span><b id="rph" style="font-size:16px">Bind the MRR tile again?</b><dl class="ps-kv" style="grid-template-columns:110px 1fr"><dt>Now</dt><dd><span class="mo">$34.2k</span> · date ' + chip('nr') + '</dd><dt>After</dt><dd><span class="mo">$34.2k</span> · as of <span class="mo">20 Nov 2026</span></dd></dl><p class="mu" style="font-size:12.5px">Changes your draft only. v7 is unchanged until you save v8.</p>' + btn('Bind again with the record’s date', 'p', ' style="min-height:48px"') + btn('Cancel', 'gh', ' style="min-height:48px"') + '</div>' }),
      PTF15D: () => phone('Check before you send', step(4, 'Back to the check') + '<div class="ptf-fixed" role="status">' + SH.ok + ' Re-checked · Fixed: Slide 3 · MRR tile</div>' + summary('b', SH.fl + ' 1 blocker · 2 warnings', 'Your draft. v7 still has all 3 warnings.') + '<ul class="ptf-list ph">' + row(F.f1, { compact: true }) + grp('Slide 3 · Source date not recorded · 1 tile left', '', row(F.f3, { inGroup: true, chip: false, compact: true, focusBtn: true })) + row(F.f4, { compact: true }) + '</ul>', btn('Re-check draft', '')),
      PTF15E: () => phone('Export v7', step(5, 'Export a saved version') + scope('v7').replace('ptf-scope', 'ptf-scope ph') + summary('w', SH.ar + ' No blockers · 3 warnings', 'Confirm them to export v7. They are not fixed in v7.') + '<ul class="ptf-list ph">' + row(F.f2, { compact: true, noAct: true }) + row(F.f3, { compact: true, noAct: true }) + row(F.f4, { compact: true, noAct: true }) + '</ul><label class="ptf-confirm"><span class="ptf-box" role="checkbox" aria-checked="true" tabindex="0">' + SH.ok + '</span><span><b>Export v7 with these 3 warnings</b></span></label>', btn('Export PDF', 'p') + '<span class="mu" style="font-size:11.5px;text-align:center">Your draft differs from v7. Save v8 to export it.</span>'),
      PTF15F: () => phone('Export v8', step(6, 'After save, v8 checked') + scope('v8').replace('ptf-scope', 'ptf-scope ph') + summary('ok', SH.ok + ' Nothing to fix', 'All 10 checks passed on 12 slides of v8.') + '<div class="ps-fld"><label>Format</label><div class="ps-in" style="min-height:44px">PDF · every card, as it prints<span class="mu" style="margin-left:auto">▾</span></div></div><p class="mu" style="font-size:12px">2 investor links still send v7. Move them in Share.</p>', btn('Export PDF', 'p'))
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      PTF16: () => dk('<h1>Handoff · #8772 Preflight finding to slide element</h1><p>Checked on <code>main</code> 7553cd37b9 (Thu 26 Nov 2026). Extends “Check before you send” (#3661, D1370, PF1–PF5) and its version rules (#4598); it forks nothing.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it does today'], [
          ['<code>pages/raise/pitch/preflightModel.js</code>', '<code>runPreflight</code>: ten checks, findings <code>{id, check, severity, card, block, title, detail, fix}</code>; blocking vs warning; refresh rows kept by slide only (one “a bound figure has changed” per slide); <code>deckKey</code> binds a result to its content.'],
          ['<code>pages/raise/pitch/preflightUiModel.js</code>', '<code>rowOf</code> “Slide N · Metric” from the block kind; <code>groupsOf</code>, <code>gateOf</code>, <code>fixedSince</code>, <code>sentLine</code>, <code>DIRTY_LINE</code>, <code>NOTHING_TO_FIX</code>.'],
          ['<code>pages/raise/pitch/PreflightPanel.jsx</code>', 'Panel, <code>GateBody</code> (“✓ Nothing to fix” whenever nothing blocks), <code>FindingStrip</code> (Previous/Next, back), <code>PreflightMeasure</code> at 1920 × 1080.'],
          ['<code>pages/raise/pitch/PitchEditor.jsx</code>', 'Panel runs on the working draft but is labelled <code>base.deck.version</code>; <code>show()</code> selects card and block; the gate drops Show me when dirty.'],
          ['<code>pages/raise/pitch/ExportDialog.jsx</code>', 'Checks the picked saved version itself (D4598); gate inline with no <code>onShow</code>; “Export anyway” then “Export PDF”; unreadable content disables export.'],
          ['<code>routes/deck_preflight.ts</code>', 'Dismissals per version; blocking ones refused <code>422 finding_blocking</code>; Eadwyn fix proposals (D4210).'],
          ['<code>routes/deck_sources.ts</code>, <code>services/decks/sources.ts</code>', '<code>POST /api/decks/:id/refresh</code> rows carry <code>slide</code> and <code>field: block:j</code>.'],
          ['<code>presentExportModel.js</code>, <code>services/decks/offlineHtml.ts</code>', 'Viewer <code>sourceOf</code> omits a missing date; the HTML export appendix writes “date not recorded”.'],
          ['<code>routes/deck_exports.ts</code>', 'Export history row: version, format, file hash, by, time. Nothing about the check.']])
        + '<h2>Frontend only</h2><p>Element names from the block (tile label, image alt or name, text style) and value in <code>rowOf</code>; per-element accessible names for Show and Dismiss; grouping by slide + check + problem with distinct child rows (ids unchanged); stale refresh rows mapped to their tiles; headline rules (PTF-13) replacing “Nothing to fix” over warnings; the scope line (draft vs saved version) and the draft panel no longer labelled v7; “Show in your draft” from Export; return focus to the same row; the repair on the tile inspector (re-bind from Sources keeps the value, adds the date); the confirm checkbox wording; viewer source line “date not recorded” (⚑ Q3).</p>'
        + '<h2>Requires engineering ' + ENG('#8772 export history') + '</h2><p>Record, on the <code>deck_exports</code> row, that the export went out with warnings confirmed (count and finding ids), so the history can say “Exported with 3 warnings confirmed”. Until then the dialog says what the history records today and nothing more.</p>'
        + '<h2>Owner decisions ⚑ (option A drawn)</h2>' + tbl(['Question', 'A (drawn)', 'B'], [['Q1 · Severity words', 'Keep To fix / Worth a look; add “Blocks export” / “Warning” chips', 'Rename the groups Blockers / Warnings'], ['Q2 · Same problem on several elements', 'One heading per slide + problem, a row per element', 'A flat list, each row repeating its slide'], ['Q3 · Viewer line with no date', '“Source: Grow · Measured · date not recorded”, as the export appendix', 'Keep omitting the date']])
        + '<h2>Acceptance → boards</h2>' + tbl(['Criterion', 'Boards'], [
          ['Severity, slide, element label and source problem; multiple elements on one slide told apart', 'PTF01, PTF09, PTF15A'],
          ['Duplicate reports grouped, distinct findings kept', 'PTF09, PTF10'],
          ['Inspect or repair the selected metric and return to the same check', 'PTF02, PTF03, PTF04, PTF15B–D'],
          ['When a repair changes the draft and a new frozen version needs rechecking', 'PTF03, PTF04, PTF05, PTF06, PTF07, PTF15E–F'],
          ['Which export is allowed; resulting recipient view', 'PTF05, PTF07, PTF08, PTF11, PTF13'],
          ['Tests: two stale metrics on one slide', 'PTF10'], ['Missing source date', 'PTF01–PTF04'], ['Structural / layout failure', 'PTF11'], ['Unreadable check', 'PTF12'], ['Genuine clean result', 'PTF06, PTF07, PTF13'],
          ['Warnings and blockers announced accurately; keyboard', 'PTF13, PTF14']])
        + '<h2>Preserved</h2><p>No score or verdict; nothing rewritten by the check; blockers never dismissible; dismissals per version; results only beside the content they read; “Couldn’t check” never a pass; Export and Share check the saved version they send; Eadwyn’s quoted fix proposal (D4210) where a text check offers it. Slides carry no brackets because the check flags bracketed text as a placeholder; the deck is marked fictional beside it instead.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'PTF00') html = D00();
    else if (B === 'PTF01') html = D01();
    else if (B === 'PTF02') html = D02();
    else if (B === 'PTF03') html = D03();
    else if (B === 'PTF04') html = D04();
    else if (B === 'PTF05') html = D05();
    else if (B === 'PTF06') html = D06();
    else if (B === 'PTF07') html = D07();
    else if (B === 'PTF08') html = D08();
    else if (B === 'PTF09') html = D09();
    else if (B === 'PTF10') html = D10();
    else if (B === 'PTF11') html = D11();
    else if (B === 'PTF12') html = D12();
    else if (B === 'PTF13') html = D13();
    else if (B === 'PTF14') html = D14();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = D01();
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
