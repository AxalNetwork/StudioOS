        SBOX('Pricing & Market', 'Partial', '<div class="nt a" style="padding:8px 10px"><span class="ic" aria-hidden="true">!</span><div>1 of 3 pricing sources unavailable: the review history didn’t load. Market and recommendation are current.</div></div>'),
        SBOX('Pricing & Market', 'Provisional', '<dl class="lx-kv"><dt>Annual licence</dt><dd>€74,000 · provisional</dd></dl><p class="raw">Apply asks for a reason when a result is provisional.</p>'),
        SBOX('Review queue', 'None', '<b>No reviews due in 120 days</b><p class="raw">Read succeeded.</p>'),
        SBOX('Ledger signals', 'Unavailable', '<dl class="lx-kv"><dt>Pricing signals</dt><dd>' + UNV + '</dd></dl><p class="raw">Operations chips still show; pricing chips say Unavailable, not 0.</p>')])) + '</div>', 1400);

    /* ---------- L40 · backend fit ---------- */
    const fit = () => dk('<h1>Backend fit · Licences &amp; Contracts v2 addendum</h1><p>Checked against <code>main</code> 9b8f1423cb on 10 Nov 2026 (no Worker changes since the brief’s 08c9ce14da). Every field drawn on L23–L37 and CT-17–CT-19 is here with its read, or “pending read” and the issue that adds it.</p>'
      + tbl(['Board · field', 'Read today', 'Status'], [
        ['L23 catalogue: country, region, currency, completeness, last update, regulatory class, recommended fees', '<code>GET /api/admin/licence-pricing/countries</code>', 'Frontend'],
        ['L23 tier and index in the list', 'Per snapshot only: <code>/countries/:code</code>', 'Pending read · #5020'],
        ['L24 inputs with status / source / source ref / as of; snapshots; trace', '<code>/countries/:code</code>, <code>POST …/:code/preview</code> → <code>trace</code>; a missing input returns <code>available: false</code>', 'Frontend'],
        ['L25 model versions; activate; preview impact', '<code>GET/POST …/models</code>, <code>/:uid/activate</code>, <code>/:uid/retire</code>', 'Frontend; impact table composed from per-country previews'],
        ['L26 basis, model, inputs, recommendation, latest decision, drift, next review, reviews', '<code>GET /api/admin/licences/:uid/pricing</code>; apply / override / reviews in <code>admin_licence_pricing_apply.ts</code> (reason, <code>expected_revision</code>)', 'Frontend'],
        ['L27 annual review queue', 'Reviews per licence only', 'Pending read · #5020'],
        ['L28 pricing and legal Needs HQ signals', '<code>/api/admin/licences</code> has no pricing or agreement readiness', 'Pending read · #5020, #5051'],
        ['L29 packages, versions, items, base fee, guidance', '<code>GET /api/admin/licence-packages</code>', 'Frontend'],
        ['L29–L31 standalone sum, saving, warnings', '<code>/api/admin/licences/:uid/package-pricing</code> (warnings: missing_program_price, program_price_unavailable, provisional_market_data, bundle_value_warning)', 'Frontend'],
        ['L30 programs-by-package matrix', 'Composed from each package’s <code>items</code>', 'Pending read · #5026'],
        ['L31 current package as one field', 'Policy holdings with origin <code>package_offer_accepted</code>', 'Pending read · #5026'],
        ['L32 offer review and accept', 'No offer store', 'Pending read · #5021, #5026'],
        ['L33 slots and per-program legally_in_force', '<code>GET /api/admin/licence-agreements/licences/:uid</code>; policies <code>/licence-agreement-policies/licences/:uid</code>', 'Frontend'],

        ['CT-17 filters: type, legal state, licence, program, package', '<code>GET /api/admin/contracts</code> with agreement_type, agreement_status, licence, program, package', 'Frontend'],
        ['CT-17 founder / investor / operating partner / advisor agreement types; family, type, holder filters', 'Types are <code>territory_licence | package | program_licence | program_schedule_addendum</code> only', 'Pending read · #5060'],
        ['CT-18 context line, legal-state word, deep links', '<code>contractAgreementSources.ts</code> (package_key, package_version, legal status)', 'Frontend · #5050'],

      + '<h2>Accessibility</h2><p>Filters are real controls with names; removable chips have a labelled remove button. Status always has a word and a shape. Matrix ticks carry “Included” / “Not included” labels. Sheets trap focus and name their steps; Apply, Override and Accept each need a recorded reason.</p>');

    /* ================= Contracts boards ================= */
    const CTABS = [['Agreements', '236'], ['Templates', '31'], ['Corporate Governance', '21'], ['Closings', '4']];
    const chead = () => '<header style="display:flex;flex-direction:column;gap:6px"><span class="eye">HQ</span><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">Contracts</h1><p style="font-size:13.5px;color:var(--mu);margin-top:3px">One record per agreement. Licences opens the same record.</p></div><button type="button" class="btn p">New agreement</button></div><nav class="ptabs" aria-label="Contracts">' + J(CTABS.map(t => '<a href="#"' + (t[0] === 'Agreements' ? ' aria-current="page"' : '') + '>' + t[0] + ' <span class="raw">' + t[1] + '</span></a>')) + '</nav></header>';
    const CAT = ['All', 'Licences', 'Fund', 'Founders', 'Services', 'Governance-linked'];
    const cfilters = (pend) => '<div class="chips">' + J(CAT.map((c, i) => '<button type="button" role="radio" aria-checked="' + (i === 1) + '">' + c + '</button>')) + '</div>'
      + '<div class="lx-frow">' + J(['Agreement type', 'Legal state', 'Licence / territory', 'Program', 'Axal VC package', 'Licence family', 'Licence type', 'Holder', 'Template', 'Signed / effective'].map((f, i) => '<button type="button" class="dd' + (i === 0 || i === 2 ? ' on' : '') + '">' + f + (i === 0 ? ': 2' : i === 2 ? ': France' : '') + ' ▾</button>')) + '</div>'
      + (pend ? '<div style="position:relative;max-width:420px;border:1px solid var(--hair2);border-radius:10px;background:var(--card);padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.1)"><span class="eye" style="padding:4px 8px;display:block">Agreement type</span>' + J([['Territory licence', true, 0], ['Package agreement', true, 0], ['Program licence', false, 0], ['Program schedule / addendum', false, 0], ['Founder licence agreement', false, 1], ['Investor licence agreement', false, 1], ['Operating Partner licence agreement', false, 1], ['Advisor licence agreement', false, 1]].map(o => '<div role="checkbox" aria-checked="' + o[1] + '" style="display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:12.5px"><span style="width:14px;height:14px;border-radius:3px;border:1.5px solid ' + (o[1] ? 'var(--vi);background:var(--vi)' : 'var(--hair2)') + '"></span>' + o[0] + (o[2] ? ' ' + PR : '') + '</div>')) + '</div>' : '');
    const AROWS = [
      ['Subsidiary Licence Agreement · v4', 'France · AXL-FR-001 · Territory licence', 'Territory licence', 'executed', 'executed', 'Axal VC France SAS', '2 Mar 2026', [1, 0, 0]],
      ['Venture Building Package Agreement · v1', 'France · AXL-FR-001 · Venture Building v1', 'Package agreement', 'sent', 'awaiting', 'Axal VC France SAS', '—', [1, 0, 1]],
      ['Spin-Out Lab Programme Licence · v1', 'France · AXL-FR-001 · Venture Building v1 · Spin-Out Lab', 'Program licence', 'executed', 'executed', 'Axal VC France SAS', '1 Dec 2026', [1, 1, 1]],
      ['AI-native Venture Programme Schedule · v1', 'France · AXL-FR-001 · Venture Building v1 · AI-native Venture', 'Program schedule / addendum', 'executed', 'executed', 'Axal VC France SAS', '1 Dec 2026', [1, 1, 1]],
      ['Founder Licence Agreement · v1', 'Léa Martin · UL-FND-0042 · Founder licence', 'Founder licence agreement', 'executed', 'executed', 'Léa Martin', '14 Feb 2026', [1, 1, 0]]];
    const links = (f) => '<span style="display:flex;gap:14px;font-size:12px;margin-top:5px">' + (f[0] ? '<a href="#">Open licence ›</a>' : '') + (f[1] ? '<a href="#">Open Program access ›</a>' : '') + (f[2] ? '<a href="#">Open package context ›</a>' : '') + '</span>';
    const arow = (a, sel) => ({ cls: sel ? 'sel' : '', c: ['<span class="tt">' + a[0] + '</span><span class="ts">' + ot('Agreement') + a[1] + '</span>' + links(a[7]), '<span style="font-size:12px">' + a[2] + (a[2].indexOf('Founder') === 0 ? '<br>' + PR : '') + '</span>', ls(a[3]) + '<div style="margin-top:4px">' + lw(a[4]) + '</div>', a[5], '<span class="mo" style="white-space:nowrap">' + a[6] + '</span>'] });
    const ctFilters = () => con(chead() + cfilters(true) + '<div class="lx-fchips" style="border:1px solid var(--hair);border-radius:10px"><span class="raw">Active filters</span><span class="rm">Type: Territory licence <i aria-label="Remove filter">×</i></span><span class="rm">Type: Package agreement <i aria-label="Remove filter">×</i></span><span class="rm">Licence: France · AXL-FR-001 <i aria-label="Remove filter">×</i></span><a href="#" style="font-size:12px">Clear all</a><span class="raw" style="margin-left:auto">2 of 236</span></div>'
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden">' + ctab(['Agreement', 'Type', 'Lifecycle · legal state', 'Counterparty', 'Effective'], AROWS.slice(0, 2).map(a => arow(a))) + '</section>', { h: 900 });
    const ctRows = () => con(chead() + cfilters(false)
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden">' + ctab(['Agreement', 'Type', 'Lifecycle · legal state', 'Counterparty', 'Effective'], AROWS.map((a, i) => arow(a, i === 2))) + '<div class="qft"><span>The context line names territory, licence, Axal VC package and program; the legal-state word sits beside the lifecycle pill</span><span>Founder licence type is pending read (#5060)</span></div></section>', { h: 900 });
    const ctNeverSent = () => con(chead()
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden">' + ctab(['Agreement', 'Type', 'Lifecycle · legal state', 'Envelope', 'Effective'], [
        { c: ['<span class="tt">Perks Programme Licence · v1</span><span class="ts">' + ot('Agreement') + 'France · AXL-FR-001 · Perks (standalone)</span>' + links([1, 1, 0]), '<span style="font-size:12px">Program licence</span>', ls('notsent') + '<div style="margin-top:4px">' + lw('draft') + '</div>', '<span class="lx-otag env">No envelope</span>', '<span class="mo">—</span>'] },
        { cls: 'sel', c: ['<span class="tt">Product Testing Programme Schedule · v1</span><span class="ts">' + ot('Agreement') + 'France · AXL-FR-001 · Venture Building v1 · Product Testing</span>' + links([1, 1, 1]), '<span style="font-size:12px">Program schedule / addendum</span>', ls('sent') + '<div style="margin-top:4px">' + lw('awaiting') + '</div>', '<span class="lx-otag">Envelope · 0 of 2 signed</span>', '<span class="mo">—</span>'] }]) + '</section>'
      + '<div class="lx-g2" style="align-items:start">' + card('A prepared version is neither signed nor a template', '<ul class="rz"><li><b>Perks Programme Licence v1 · prepared 6 Nov</b><small>Frozen text, no envelope, nobody has been asked to sign</small>' + ls('notsent') + '</li><li><b>Template: Programme Licence · v3</b><small>Lives in Templates, never in this list</small><span class="lx-otag" style="border-style:dashed">Template</span></li></ul><div style="display:flex;gap:8px"><button type="button" class="btn">Review document</button><button type="button" class="btn p">Send for signature…</button></div><p class="foot">Sending is its own step with the recipients named. Nothing is sent from Licences.</p>')
        + card('One agreement, one row', '<p style="font-size:13px">Product Testing Schedule v1 has an envelope. The version and its envelope are one row; the envelope’s state is a column, never a second record.</p><p class="foot">The same record opens from Licences › Agreement and from here.</p>') + '</div>', { h: 820 });
    const ctPhone = () => phone('Agreements', '<div class="inp" style="min-width:0;min-height:44px">⌕ Search agreements</div><div class="chips" style="flex-wrap:nowrap;overflow:hidden"><button type="button" aria-checked="true">Licence: France ×</button><button type="button" aria-checked="false">Type ▾</button><button type="button" aria-checked="false">Legal state ▾</button></div>'
      + J(AROWS.slice(0, 4).map(a => '<div class="lx-mcard"><b style="font-size:13.5px">' + a[0] + '</b><span class="raw">' + a[1] + '</span><div class="r">' + ls(a[3]) + lw(a[4]) + '</div><a href="#" style="font-size:12.5px">Open licence ›</a></div>')));
    const ctStates = () => crop('<span class="eye">Agreements list · states</span><div class="lx-g3">'
      + '<section class="cd">' + st('None') + '<b>No agreements match these filters</b><p class="raw">Type: Program licence · Licence: Ireland. Read succeeded.</p><button type="button" class="btn bsm" style="align-self:flex-start">Clear filters</button></section>'
      + '<section class="cd">' + st('Unavailable') + '<b>Agreements couldn’t be read</b><p class="raw">Contracts didn’t answer at 14:30. The list is never shown as empty.</p><button type="button" class="btn p bsm" style="align-self:flex-start">Retry</button></section>'
      + '<section class="cd">' + st('Refused') + '<b>You can’t view fund agreements</b><p class="raw">Restricted to fund administrators. Other categories still show.</p></section></div>', 1100);

    /* ---------- dark ---------- */
    const PDK = { bg: '#0b1220', card: '#111827', raised: '#162033', ink: '#e5e7eb', mu: '#a3a9b8', hair: '#243049', hair2: '#33405c', vi: '#a78bfa', vt: '#c4b5fd', lav: '#1e1b3a', lavE: '#4c3f8f', pos: '#6ee7b7', posBg: '#0f2a22', posE: '#1f5a46', neg: '#fca5a5', negBg: '#2a1215', negE: '#6b2a2f', amT: '#fcd34d', amBg: '#2a2110', amE: '#7a5b14', amD: '#f59e0b', dim: 'rgba(0,0,0,.5)', skel: '#243049' };
    const VDK = Object.keys(PDK).map(k => '--' + k + ':' + PDK[k]).join(';');

    let html;
    if (B === 'LX23') html = catalogue(false, false);
    else if (B === 'LX23B') html = catalogue(true, true);
    else if (B === 'LX24') html = countryDetail();
    else if (B === 'LX24B') html = countryMissing();
    else if (B === 'LX25') html = models(false);
    else if (B === 'LX25B') html = models(true);
    else if (B === 'LX26') html = pricingMarket({});
    else if (B === 'LX26B') html = pricingMarket({ none: true, stale: true });
    else if (B === 'LX26C') html = lpage('Terms', '<nav class="ptabs" aria-label="Terms" style="margin-top:-6px"><a href="#">Contract terms</a><a href="#" aria-current="page">Pricing &amp; Market</a></nav>' + pmBlocks({}), { h: 1440, overlay: overrideSheet() });
    else if (B === 'LX27') html = reviewQueue();
    else if (B === 'LX28') html = ledgerSignals();
    else if (B === 'LX29') html = packages();
    else if (B === 'LX30') html = matrix();
    else if (B === 'LX31') html = licPackage(false);
    else if (B === 'LX31B') html = licPackage(true);
    else if (B === 'LX32') html = lpage('Terms', '<nav class="ptabs" aria-label="Terms" style="margin-top:-6px"><a href="#">Contract terms</a><a href="#">Pricing &amp; Market</a><a href="#" aria-current="page">Axal VC package</a></nav>' + card('Recommended offers · priced for France', offerCards(true)), { h: 980, overlay: offerReview(false) });
    else if (B === 'LX32B') html = lpage('Terms', '<nav class="ptabs" aria-label="Terms" style="margin-top:-6px"><a href="#">Contract terms</a><a href="#">Pricing &amp; Market</a><a href="#" aria-current="page">Axal VC package</a></nav>' + card('Recommended offers · priced for France', offerCards(true)), { h: 1080, overlay: offerReview(true) });
    else if (B === 'LX33') html = agreementX();
    else if (B === 'LX34') html = programAccess();
    else if (B === 'LX35') html = studioView(false);
    else if (B === 'LX35B') html = studioView(true);
    else if (B === 'LX36') html = famLedger(0);
    else if (B === 'LX37') html = userLicence(false);
    else if (B === 'LX37B') html = userLicence(true);
    else if (B === 'LX38A') html = phPricing();
    else if (B === 'LX38B') html = phAgreement();
    else if (B === 'LX38C') html = phLedger();
    else if (B === 'LX39') html = states(false);
    else if (B === 'LX39B') html = states(true);
    else if (B === 'LX40') html = fit();
    else if (B === 'LXCT17') html = ctFilters();
    else if (B === 'LXCT18') html = ctRows();
    else if (B === 'LXCT19') html = ctNeverSent();
    else if (B === 'LXCT20A') html = ctPhone();
    else if (B === 'LXCT20B') html = ctStates();
    else if (B === 'LXDK1') html = pageN(ident('Terms') + '<nav class="ptabs" aria-label="Terms" style="margin-top:-6px"><a href="#">Contract terms</a><a href="#" aria-current="page">Pricing &amp; Market</a></nav>' + pmBlocks({}), { h: 1440, vars: VDK, dark: true }, 'Licences');
    else if (B === 'LXDK2') html = pageN(chead() + cfilters(false) + '<section class="cd" style="padding:0;gap:0;overflow:hidden">' + ctab(['Agreement', 'Type', 'Lifecycle · legal state', 'Counterparty', 'Effective'], AROWS.map((a, i) => arow(a, i === 2))) + '</section>', { h: 900, vars: VDK, dark: true }, 'Contracts');
    else html = catalogue(false, false);
    return { html: { __html: html } };
  }
}
