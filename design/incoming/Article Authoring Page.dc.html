    const PTOP = (dot) => `<div style="height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--card);box-sizing:border-box"><a href="#" style="display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 6px;color:var(--vio);font-weight:600;font-size:14px;text-decoration:none">${ICO.back}Articles</a><span style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mut)">${ICO.check}Saved</span><button type="button" aria-label="Ask Eadwyn${dot ? ', 1 waiting' : ''}" style="position:relative;width:44px;height:44px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0">${EYE(22)}${dot ? '<span aria-hidden="true" style="position:absolute;right:7px;top:8px;width:9px;height:9px;border-radius:999px;background:#f59e0b;border:2px solid var(--card)"></span>' : ''}</button>${bP('Publish', 'min-height:44px;padding:0 14px')}</div>`;
    const PDOC = `<div style="flex:1;min-height:0;overflow:hidden;padding:22px 16px 0;background:var(--page);${AB};color:var(--ink)"><h1 style="${AH};margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1.15">Pricing before product</h1><p style="margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--mut)">Why we charged our first customers before the product existed, and what it taught us.</p><div style="margin:16px 0 18px">${COVER(196, 0)}</div><p style="margin:0 0 14px;font-size:16px;line-height:1.7">In the first month of [Northwind Labs], we asked twelve operations leads to pay for a product that did not exist yet. Seven said yes.</p><h2 style="${AH};margin:20px 0 10px;font-size:22px;font-weight:700;letter-spacing:-0.02em">What we charged, and why</h2><p style="margin:0;font-size:16px;line-height:1.7">We set the price at $[1,200] a month, roughly a tenth of what a late shipment cost them in a typical week. <span style="background:var(--sel);border-radius:3px">We did not discount it, because a discount would have told us about their politeness, not their pain.</span></p></div>`;
    const PFMT = `<div role="toolbar" aria-label="Format" style="flex:none;display:flex;align-items:center;padding:0 4px;border-top:1px solid var(--line);background:var(--card)">${[[ICO.plus, 'Add a block'], ['B', 'Bold'], ['<span style="font-family:Georgia,serif;font-style:italic">I</span>', 'Italic'], [ICO.link, 'Link'], ['H2', 'Heading'], ['“', 'Quote'], ['•', 'Bulleted list'], [ICO.img, 'Image']].map(([t, a]) => `<button type="button" aria-label="${a}" style="width:44px;height:44px;flex:none;border:none;background:transparent;color:var(--body);display:grid;place-items:center;${SG};font-size:15px;font-weight:700;cursor:pointer;padding:0">${t}</button>`).join('')}</div>`;
    const PSHEET = `<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(24,24,27,.42)"></div><div role="dialog" aria-label="Eadwyn · Writing" style="position:absolute;left:0;right:0;bottom:0;height:776px;box-sizing:border-box;background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(24,24,27,.2)"><span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:999px;background:var(--line2);margin:8px 0 2px;flex:none"></span><div style="flex:none;display:flex;align-items:center;gap:10px;padding:4px 6px 8px 16px;border-bottom:1px solid var(--line)">${EYE(22)}<div style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800">Eadwyn</span>${EB('Articles · Writing')}</div><button type="button" aria-label="Close" style="width:44px;height:44px;border:none;background:transparent;color:var(--body);display:grid;place-items:center;cursor:pointer;padding:0">${ICO.x}</button></div><div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px"><div>${CHIP('Selected text · 30 words', true)}</div><div style="border-radius:12px;border:1px solid var(--lavE);background:var(--lav);padding:14px;display:flex;flex-direction:column;gap:10px"><span style="font-size:13.5px;font-weight:700">Rewrite · Shorter</span><div style="font-size:13px;line-height:1.55;color:var(--mut);text-decoration:line-through">We did not discount it, because a discount would have told us about their politeness…</div><div style="padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--lavE);font-size:13.5px;line-height:1.55">We did not discount it. A discount measures politeness, and interviews already give you plenty of that. We wanted to measure pain.</div>${bP('Replace', 'min-height:44px;width:100%')}<div style="display:flex;gap:8px">${bS('Insert below', 'min-height:44px;flex:1')}${bG('Discard', 'min-height:44px;flex:1')}</div><span style="${M};font-size:11px;color:var(--mut)">Charged $[0.004] of $[0.006] held</span></div>${EB('Actions')}<div style="display:flex;flex-direction:column">${ACTS.slice(0, 5).map(a => `<div style="display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:700">${a[0]}</span><span style="${M};font-size:11px;color:var(--mut)">Holds up to $[${a[2]}]</span></div>${bS('Run', 'min-height:44px')}</div>`).join('')}</div></div><div style="flex:none;padding:10px 16px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)">Nothing goes into your article until you press Insert or Replace.</div></div>`;

    const FR = {
      ar1: () => ({ w: 1440, h: 1000, html: SHELL(LIB(), { h: 1000 }) }),
      ar1p: () => ({ w: 1440, h: 1000, html: SHELL(LIB({ tab: 'Published' }), { h: 1000 }) }),
      ar2: () => ({ w: 1440, html: EDITOR({ full: true, sel: true, fmt: true, gutter: true }) }),
      ar2v: () => ({ w: 1440, h: 1100, html: EDITOR({ h: 1100, compact: true, hist: true, side: SHEET('Version history', 'Pricing before product · 5 versions', VHBODY, bG('Close') + bP('Restore this version')) }) }),
      ar3: () => ({ w: 1440, h: 1180, html: EDITOR({ h: 1180, compact: true, sel: true, prop: true, side: PANEL('main'), spine: { open: true }, ask: { open: true, wait: 1 } }) }),
      ar3c: () => ({ w: 1440, html: `<div style="padding:30px;background:var(--bg);display:flex;flex-direction:column;gap:18px"><div style="display:flex;flex-direction:column;gap:4px">${EB('From the writing panel')}<span style="font-size:16px;font-weight:700;color:var(--ink)">Every action returns a proposal. Nothing is written until you press Insert or Replace.</span></div><div style="display:grid;grid-template-columns:repeat(3,440px);gap:24px;align-items:start;justify-content:center">${GAL}</div></div>` }),
      ar4: () => ({ w: 1440, h: 1180, html: EDITOR({ h: 1180, compact: true, coverSel: true, side: SHEET('Generate an image', 'For the cover of Pricing before product', IMGBODY, bG('Cancel') + bP(EYE(15, false, '#ffffff') + 'Generate 4 images')) }) }),
      ar4b: () => ({ w: 1440, html: `<div style="padding:30px;display:flex;gap:24px;align-items:flex-start;justify-content:center;background:var(--bg)"><div style="height:720px;display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden">${SHEET('Pick a variant', 'For the cover · 3 of 4 variants usable', IMGRES, bG('Discard all') + bP('Use this image'), 500)}</div>${INS}${REF}</div>` }),
      ar5: () => ({ w: 1440, h: 1320, html: EDITOR({ h: 1320, compact: true, side: SHEET('Publish', 'Pricing before product · draft', PUBBODY, bS('Save') + bP('Send for review')) }) }),
      ar5b: () => ({ w: 1440, html: `<div style="padding:30px;display:grid;grid-template-columns:repeat(3,auto);gap:24px;justify-content:center;align-items:start;background:var(--bg)"><div style="display:flex;flex-direction:column;gap:8px">${EB('Confirm · member')}${DLGM}</div><div style="display:flex;flex-direction:column;gap:8px">${EB('Confirm · admin')}${DLGA}</div><div style="display:flex;flex-direction:column;gap:10px">${EB('Results')}${RES(PILL('In review', 'review'), 'Sent for review', '[Admin Name] will read it. You are told by email and in your inbox. You can keep editing until review starts.', bS('Open the draft', SM))}${RES(PILL('Scheduled · Tue 4 Nov, 09:00', 'sched'), 'Scheduled', 'It goes out within a minute of 09:00 your time (08:00 UTC).', bS('Move…', SM) + bG('Clear time…', SM))}${RES(PILL('Published', 'pub'), 'Live on the Articles page', 'axal.vc/articles/pricing-before-product', bS('View article ↗', SM) + bG('Copy link', SM))}${RES(PILL('Not published', 'neg'), 'The address was taken while you edited', 'Nothing went out. Choose another address and send it again.', bS('Change address', SM))}</div></div>` }),
      ar6a: () => ({ w: 1440, h: 1180, html: EDITOR({ h: 1180, compact: true, sel: true, side: PANEL('tokens'), spine: { open: true, bal: '$0.00', low: true }, ask: { dis: true, tok: true, al: 'Ask Eadwyn, unavailable: not enough AI tokens', why: 'Not enough AI tokens' } }) }),
      ar6b: () => ({ w: 1440, h: 1180, html: EDITOR({ h: 1180, compact: true, sel: true, side: PANEL('paused'), spine: { open: true, off: true }, ask: { dis: true, al: 'Ask Eadwyn, unavailable: AI is paused for your account', why: 'AI is paused for your account' } }) }),
      ar6c: () => ({ w: 1440, h: 900, html: SHELL(LIB({ empty: true }), { h: 900 }) }),
      ar6d: () => ({ w: 1440, h: 900, html: SHELL(LIB({ loading: true }), { h: 900 }) }),
      ar6e: () => ({ w: 1440, h: 1000, html: SHELL(LIB({ fail: true }), { h: 1000 }) }),
      ar6f: () => ({ w: 390, h: 844, html: `<div style="display:flex;flex-direction:column;height:844px;background:var(--page)">${PTOP(false)}${PDOC}${PFMT}<div style="flex:none;height:32px;display:flex;align-items:center;justify-content:center;background:var(--card);border-top:1px solid var(--line);${M};font-size:11.5px;color:var(--mut)">1,284 words · 6 min read</div></div>` }),
      ar6g: () => ({ w: 390, h: 844, html: `<div style="position:relative;display:flex;flex-direction:column;height:844px;background:var(--page)">${PTOP(true)}${PDOC}${PSHEET}</div>` })
    };
    const fr = (FR[v] || FR.ar1)();
    return { rootSt: `${VARS};width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };

  }
}

</script>
