      case 'VR12': return shell('admin', vr1({ hideBank: 1, head: { right: proj() }, banner: adminBanner('a studio admin'), tl: TLA, notice: bankNotice, right: noteCard() + covCard(r => !r.bank, { sum: 'Bank-derived claims are not shown here.' }) + opensCard() }));
      case 'VR12HQ': return shell('hq', head({ right: proj() }) + adminBanner('HQ') + tiles(TLA) + muted('The rest of the page matches the Admin view: read-only, with bank-derived evidence hidden.', 'margin-top:16px;font-size:13px'), { h: 600 });
      case 'VR13': return boardWrap(crop('Crop A · Nothing backs your Raise yet', head() + emptyCard()) + crop('Crop B · No investor has opened your evidence', `<div style="width:380px">${opensCard(1)}</div>`));
      case 'VR14': return shell(F, loadBody());
      case 'VR15': return boardWrap(crop('Crop A · Mercury could not be read', head() + amberNote('Mercury could not be read. Its items show their last known date.', btn(ic('refresh', 14) + 'Try again', 's', 'height:32px')) + tiles() + `<div style="margin-top:14px">${claimsCard({ merc: 1, areas: ['Fundraising readiness', 'Use of funds', 'Capital relationships'] })}</div>` + muted('Every other block renders as usual.', 'margin-top:10px')) + crop('Crop B · The evidence read failed', head() + errCard()));
      case 'VR16': return vr16();
      case 'VR17': return vr17();
      case 'VR18': return vr18();
      case 'VR19': return shell(F, vr1({ after: ufCard(1060, 'margin-top:14px') }));
      default: return shell(F, vr1());
    }
  }
}
</script>
