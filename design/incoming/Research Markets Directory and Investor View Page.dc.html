    /* ---------- route ---------- */
    let html = '';
    if (B === 'RMD01') html = pageF(dirDefault(), { h: 1180 });
    else if (B === 'RMD02') html = pageF(dirSearch(), { h: 1040 });
    else if (B === 'RMD03') html = pageF(dirFilter(), { h: 960, overlay: popCountry });
    else if (B === 'RMD03B') html = crop('<span class="eye">Source freshness and source type · the two coverage filters</span><div style="display:flex;gap:16px">' + popFresh + popType + '</div>', 720);
    else if (B === 'RMD04') html = pageF(dirExpanded(), { h: 960 });
    else if (B === 'RMD05') html = pageF(sectorPage(), { h: 980 });
    else if (B === 'RMD05B') html = restored();
    else if (B === 'RMD06') html = pageF(cards(), { h: 1020 });
    else if (B === 'RMD06B') html = pageF(analysis(), { h: 1080 });
    else if (B === 'RMD07') html = pageF(listed(), { h: 960 });
    else if (B === 'RMD08') html = pageI(invPage(''), { h: 1400 });
    else if (B === 'RMD08B') html = pageI(invPage('none'), { h: 1310 });
    else if (B === 'RMD08C') html = crop('<span class="eye">Thesis read failed · the directory stays usable · no marks, no claim that nothing matches</span><div style="display:grid;grid-template-columns:296px minmax(0,1fr);gap:16px;align-items:start">' + thesisUa() + '<div>' + tcard(table(['es', 'ir', 'dev'], { inv: true, th: 'ua' })) + '</div></div>', 1300);
    else if (B === 'RMD09') html = statesA();
    else if (B === 'RMD09B') html = statesB();
    else if (B === 'RMD10') html = focusBoard();
    else if (B === 'RMD12') html = pageF(dirExpanded(), { h: 960 });
    else if (B === 'RMD12B') html = pageI(invPage(''), { h: 1400 });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = pageF(dirDefault(), { h: 1180 });
    return { html: { __html: html } };
  }
}

</script>
