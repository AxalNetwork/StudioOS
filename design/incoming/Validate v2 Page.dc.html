.vx-exp dt{color:var(--mu)}
.vx-exp dd{font-weight:600;margin:0}
.vx-sw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.vx-sw i{width:32px;height:18px;border-radius:999px;background:#7c3aed;position:relative;display:inline-block}
.vx-sw i:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:999px;background:#fff}
.vx-field{display:flex;flex-direction:column;gap:5px}
.vx-field label{font-size:12px;font-weight:700}
.vx-field .in{min-height:36px;display:flex;align-items:center;padding:0 11px;border:1px solid var(--hair2);border-radius:8px;background:var(--card);font-size:13px}
.vx-field .in.err{border-color:var(--neg);box-shadow:0 0 0 1px var(--neg)}
.vx-field .em{font-size:12px;color:var(--neg);font-weight:600}
.vx-seg2{display:inline-flex;border:1px solid var(--hair2);border-radius:8px;overflow:hidden}
.vx-seg2 span{padding:6px 12px;font-size:12.5px;font-weight:600;border-right:1px solid var(--hair2);background:var(--card)}
.vx-seg2 span:last-child{border-right:0}
.vx-seg2 span.on{background:var(--ink);color:var(--card)}
.vx-card{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vx-card .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vx-card b{font-size:14px}
.vx-card small{font-size:12px;color:var(--mu)}
.vx-card>.stt,.vx-card .r1>.stt{flex:none}
.vx-mods{flex-wrap:wrap}
.vx-hy .vx-code{font:700 12px var(--mo);color:var(--vt)}
.vx-sh .eadx{max-width:320px;overflow:hidden}
.vx-sh .eadx>div{width:100%;box-sizing:border-box;min-width:0}
.vx-sh .eadx .hist li{grid-template-columns:96px minmax(0,1fr)}
.vx-sh .eadx .prm button{width:100%}
.vx-hy>a{white-space:nowrap}
</style>

      VA05m: () => phone('Jonas Berg', '<div class="raw">Session 2 · 21 Oct · Needs review</div><nav class="ptabs" aria-label="Session" style="gap:16px"><a href="#">Transcript</a><a href="#" aria-current="page">Findings 2</a><a href="#">Facts</a></nav>' + '<article class="vx-sug"><div class="row" style="grid-template-columns:1fr"><span>Original evidence · 18:45</span><div class="q">“Two of my team lose most of Friday to carrier invoices”</div></div><div class="row" style="grid-template-columns:1fr"><span>Eadwyn’s interpretation</span><div class="ai">Supports H1</div></div><div class="ft" style="flex-direction:column;align-items:stretch"><button type="button" class="btn p" style="min-height:44px">Accept</button><div style="display:flex;gap:6px"><button type="button" class="btn" style="flex:1;min-height:44px">Edit</button><button type="button" class="btn" style="flex:1;min-height:44px">Discard</button></div></div></article>'),
      VA10m: () => phone('Verdict', '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Material evidence is missing.</b><div>1 experiment has no result.</div></div></div><div class="vx-dec" style="grid-template-columns:1fr">' + J(['Proceed', 'Pivot', 'Stop'].map((d, i) => '<label' + (i === 1 ? ' class="on"' : '') + ' style="min-height:56px"><b>' + d + '</b></label>')) + '</div><div class="fld"><label for="mr">Rationale</label><div class="ta" id="mr" style="min-height:70px">Budget sits with finance…</div></div><button type="button" class="btn p" style="min-height:48px">Record Pivot</button>')
    };
    const tablet = () => '<div class="cv" style="' + VARS + ';width:768px;height:1024px"><div class="ph" style="width:768px;height:1024px"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Validate</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + header({ nomods: true }) + msel('Overview') + next('review') + '<div class="vx-ev" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + J(EVS.map(e => '<div><span class="l">' + e[0] + '</span><b>' + e[1] + '</b><small>' + e[2] + '</small></div>')) + '</div>' + needs(3) + '</div></div></div>';

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      VA00: () => dk('<h1>Audit, journeys and information hierarchy</h1><p>From the brief’s live audit of <code>/validate?project_id=12</code> (7 Nov 2026, page structure and text; no screenshots) and the code on <code>main</code>. “Visual” = seen in the live structure; “Source” = inferred from code.</p>'
        + tbl(['Sev.', 'Finding', 'Basis', 'Change'], [
          ['P0', 'Counts contradict each other (“Interviews this month 0”, “▲ 2 in 30 days”, “Record your first session”)', 'Visual', 'Every count names its population and window; “first” only when nothing exists'],
          ['P1', 'Three next-action systems compete (header CTA, Validate · Next, module empty states)', 'Visual', 'One primary next action with a reason; the rest in Needs attention'],
          ['P1', 'Module tabs and a Module dropdown on the same desktop page', 'Visual', 'One navigation per breakpoint: tabs on desktop, a selector below 1024'],
          ['P1', 'Eadwyn rail shows model prices, allowance, held spend, top-ups', 'Visual', 'Rail: Ask, page help, suggestions to review, AI on/off; the rest behind AI settings'],
          ['P1', 'Overview is seven module summaries', 'Visual', 'Objective → Next → Evidence → Needs attention → Hypotheses → Changes → Modules'],
          ['P1', 'Record a decision offered while key evidence is Not recorded', 'Visual', 'Decision stays available; the overview leads with Review evidence and says what is missing'],
          ['P2', 'PMF status links into Raise', 'Visual', 'Kept inside Validate as “Product-market fit evidence · incomplete”'],
          ['P2', 'Empty states stack into a wall', 'Visual', 'One “Still to establish” list on the overview; rich empty states stay inside modules']])
        + '<div class="cols"><div><h2>Existing journey</h2><p>Overview (7 module cards + 3 CTAs) → module tabs → Record (dialog) → Customer research → Interview (transcript, JSON-shaped proposals) → Hypotheses → Verdict → Build.</p></div><div><h2>Proposed journey</h2><p><b>Talk → Learn → Test → Decide</b>, the same on every breakpoint: record and review sessions (Talk) → accept findings into pains, fit and hypothesis evidence (Learn) → experiments with results (Test) → evidence snapshot and a founder decision → Plan the build.</p></div></div>'),
      VA15: () => dk('<h1>Components and interactions</h1>' + tbl(['Component', 'Rule'], [
          ['NextAction', 'Exactly one, with eyebrow, title, reason and one button; reads the existing Worker focus (D4589, <code>validateNextAction.ts</code>)'],
          ['EvidenceFigure', 'Label + number + what is counted; never a percentage; relationships and sources never merged'],
          ['DirectionTag', 'Supports (+) / Contradicts (−) / Unknown (?) as words with glyphs, not colour or ▲▼ alone'],
          ['SuggestionCard', 'Original evidence → Eadwyn’s interpretation (dashed) → destination → Discard / Edit / Accept'],
          ['TypedEditor', 'Per kind (pain, fit, hypothesis evidence, demand signal); original stays visible; founder version separate; inline errors; failed save keeps edits'],
          ['SessionPipeline', 'Recorded → Saving audio → Uploading → Transcribing → Summarising → Ready; completion only after the server confirms'],
          ['ExperimentCard', 'Planned is dashed and says it isn’t evidence; Done without a result reads Result needed'],
          ['DecisionPicker', 'Three equal choices, none pre-selected; rationale required; evidence chips; history']])
        + '<h2>Interactions</h2><p>Accepting a suggestion is idempotent and retry-safe (#4627); a second click never double-writes. Recording never switches silently to a new person (#4625); the dialog names the existing interview. Closing a form with unsaved edits asks first (#4630). A stale card retries once and then says it couldn’t (#4601).</p>'),
      VA16: () => dk('<h1>Accessibility and responsive</h1><p>Designed toward WCAG 2.2 AA; not claimed until keyboard and screen-reader testing is done.</p>' + tbl(['Area', 'Specification'], [
          ['Navigation', 'Modules are links with aria-current (desktop) or a labelled select (tablet/phone); session tabs are tabs'],
          ['Focus', '2px violet ring; dialogs trap focus and return it; after Accept, focus moves to the next suggestion'],
          ['Status', 'Every state has a word and a shape; recording state and upload progress are announced politely; failures as alerts'],
          ['Transcript', 'Timestamps are buttons that seek playback; playback has labelled play/pause/skip and keyboard shortcuts shown'],
          ['Text size', 'No state or action text under 12px; figures 20px+'],
          ['Touch', '44px targets; primary actions 48px on phone'],
          ['Long content', 'Evidence quotes truncate with “Show full quote”; tables become cards below 768']])
        + '<h2>Breakpoints</h2><p><b>1440</b>: nav + content + optional 320 Eadwyn rail. <b>768</b>: module select, evidence in 3×2, Needs attention above hypotheses. <b>390</b>: Venture → Next → Needs attention → Hypotheses → Evidence → Changes → Modules; no horizontal tables.</p>'),
      VA17: () => dk('<h1>Developer handoff</h1><p>Mapped to <code>frontend/src/pages/cycles/Validate*.jsx</code>, <code>pages/founder/validatePieces.jsx</code>, <code>workspaces/founder/ValidateDialogs.jsx</code> and the Worker routes <code>cycle_validate.ts</code>, <code>founder_validate*.ts</code>, <code>cycle_verdict.ts</code>, checked 7 Nov 2026.</p>'
        + tbl(['Change', 'User problem', 'Existing capability kept', 'Backend', 'Verify by'], [
          ['One next action', 'Three CTAs compete', 'Worker focus (D4589)', 'None', 'Overview shows one primary button for each focus rule'],
          ['Counted figures', 'Counts contradict', 'Overview figures', '#4585 source definitions', 'Each figure’s label matches its query population'],
          ['Evidence states', 'States imply proof', 'Links with direction and strength (<code>hypothesis_evidence_links</code>)', '#4586 methodology for state names', 'Unit tests per state rule'],
          ['Review queue', 'Pending findings scattered', '<code>validate_proposals</code> pending', '#4587 session/venture context', 'Count equals pending proposals'],
          ['Typed editor', 'Raw JSON editing', 'Accept / discard routes', '#4590 typed edits; #4627 retry-safe accept', 'No JSON field in the DOM'],
          ['Recording states', 'Unclear when audio is safe', 'Chunk PUT, sessions, processing stages', '#4624 final chunk; #4628 recovery', 'Kill the tab mid-stop; audio survives'],
          ['Experiment states', 'Planned looks like evidence', '<code>hypothesis_experiments</code> planned · running · done + result', '“Stopped” not stored', 'Done without result shows Result needed'],
          ['Verdict', 'Decision looks ready too early', '<code>validation_decisions</code> (given/withheld, evidence, superseded)', '#4629 history', 'Superseded decisions listed'],
          ['Recent changes', 'No meaningful feed', 'Cycle activity convention (migration 459)', 'Confirm the activity read covers these kinds', 'Feed lists only the six kinds'],
          ['Eadwyn rail', 'Rail dominated by economics', 'Rail + AI settings surface', 'None', 'No price on the default rail']]))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'VA01') html = page(overview('review'), { h: 1180 });
    else if (B === 'VA01b') html = page(overview('gap'), { h: 1180, rail: true });
    else if (B === 'VA03') html = page(research(), { h: 900 });
    else if (B === 'VA05') html = page(review(), { h: 1000 });
    else if (B === 'VA06') html = editors();
    else if (B === 'VA07') html = page(hypList(), { h: 760 });
    else if (B === 'VA08') html = page(hypDetail(), { h: 1000 });
    else if (B === 'VA09') html = page(experiments(), { h: 900 });
    else if (B === 'VA10') html = page(verdict({}), { h: 1180 });
    else if (B === 'VA10b') html = page(verdict({ sel: 'Pivot' }), { h: 1180 });
    else if (B === 'VA11') html = handoff();
    else if (B === 'VA12a') html = page(overview('review'), { h: 900, rail: true });
    else if (B === 'VA12b') html = page(overview('review'), { h: 900, rail: true, mode: 'settings' });
    else if (B === 'VA12c') html = page(overview('review'), { h: 900, rail: true, mode: 'off' });
    else if (B === 'VA13') html = states();
    else if (B === 'VA14') html = tablet();
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview('review'), { h: 1180 });
    return { html: { __html: html } };
  }
}

</script>
