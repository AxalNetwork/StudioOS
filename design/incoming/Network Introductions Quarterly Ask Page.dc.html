      ${ASKSEC({ left: 0, rows: ASKS_T, hl: 1, banner: `<div class="nt a" role="region" aria-label="Asks to resolve"><span class="ic" aria-hidden="true">!</span><div><b>3 asks were recorded before founders could answer them.</b> Each used a quarterly ask and nobody was told. Choose what happens to each one. Nothing is sent to a founder until you review and confirm it. ${TO('legacy policy · A, member decides')}</div></div>`, next: (a) => a.legacy ? (a.n ? `<button type="button" class="btn">Resolve</button>` : `<button type="button" class="btn">Resolve</button><small>can only be withdrawn or kept</small>`) : `<a class="btn t" href="#">Receipt</a>`, foot: `<p class="foot">The new ask to [Elm Studio] follows the founder-answer flow. ${TB('legacy resolution · #6261')}</p>` })}`, { h: 1020, railT: 'Ask about introductions', overlay: `<aside class="sheet-r" role="dialog" aria-modal="true" aria-labelledby="lg" style="width:560px"><div class="dh"><div><span class="eye">Resolve an earlier ask</span><h2 id="lg">[Sofia Lind] · [Arcpoint Energy]</h2></div><button type="button" class="ib" aria-label="Close">✕</button></div>
      <div class="dc"><dl class="rv"><dt>Asked</dt><dd class="mo">2026-10-19 · ${QL}</dd><dt>Founder told</dt><dd>No</dd><dt>Slot</dt><dd>${SLOT('used')}</dd></dl>
      <div class="seg" role="radiogroup" aria-label="Choose what happens" style="flex-direction:column;align-items:stretch">
      <button type="button" role="radio" aria-checked="true" style="text-align:left;min-height:44px">● Send it to [Sofia Lind] now · she will be told and can accept or decline</button>
      <button type="button" role="radio" aria-checked="false" style="text-align:left;min-height:44px">○ Withdraw it · 1 ${QL} ask returns to you, once</button>
      <button type="button" role="radio" aria-checked="false" style="text-align:left;min-height:44px">○ Keep it as a private record · nobody is told, the slot stays used</button></div>
      <p class="sub">Choosing does nothing yet. The next step shows exactly what [Sofia] will read.</p></div>
      <div class="df"><button type="button" class="btn t">Cancel</button><button type="button" class="btn p">Review</button></div></aside>` });
    else if (B === 'NIQ08B') html = crop(1400, `<div style="display:flex;gap:20px;align-items:flex-start">
      ${panel('Resolve · review', 'Send this ask to [Sofia Lind]?', `<p class="sub">[Sofia] will get a notification and open this ask. This is what she will read:</p><div class="pc"><span class="eye">From</span><b>[Iris Chen] · [Harbor Lane Capital]</b><span class="eye" style="margin-top:6px">Asked</span><span class="mo">2026-10-19 · sent to her 2026-11-16</span><span class="eye" style="margin-top:6px">Message</span><span>“We back climate hardware at seed and would like to meet before your round opens.”</span></div><div class="f"><label for="lm">Edit the message before it goes (optional)</label><span id="lm" class="in ta">We back climate hardware at seed and would like to meet before your round opens.</span><span class="cnt">82 / 2,000</span></div><p class="sub">No new ask is used: this one was paid on ${mo('2026-10-19')}.</p>`, `<button type="button" class="btn t">Back</button><button type="button" class="btn p">Notify [Sofia Lind]</button>`, 460)}
      ${panel('Resolve · result', 'Sent to [Sofia Lind]', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>[Sofia] was told at ${mo('2026-11-16 14:20 UTC')}.</b> The ask is Pending her answer.</div></div><dl class="rv"><dt>Status</dt><dd>${STAT.pend}</dd><dt>Slot</dt><dd>${SLOT('used', 'no second charge')}</dd></dl>${SAY('Sent to Sofia Lind. No new ask was used.')}`, `<span></span><button type="button" class="btn">Back to Your asks</button>`, 420)}
      ${panel('Resolve · target not available', 'This ask cannot be sent', `<div class="nt"><span class="ic" aria-hidden="true">⊘</span><div>You can no longer see this founder or venture, so the ask from ${mo('2026-08-12')} cannot be sent and no name is shown.</div></div><p class="sub">Withdraw it (its Q3 2026 slot is recorded as returned, ${QL} stays as it is) or keep it as a private record.</p>`, `<button type="button" class="btn">Keep</button><button type="button" class="btn p">Withdraw</button>`, 420)}</div>
      ${ANN(`${TO('legacy policy · A: member decides per ask, nothing automatic')} ${TB('resolution endpoint, founder notification for an old ask · #6261')}`)}`);

    /* ===== NW3-intro-ask.8 · Reads, refusals and support ===== */
    else if (B === 'NIQ09') html = crop(1400, `<div class="g3">
      ${stcard('Loading', 'Your asks', `<span class="sk" style="height:12px;width:60%"></span><span class="sk" style="height:34px"></span><span class="sk" style="height:34px"></span><p class="foot" role="status">Reading your asks and your allowance… Request introduction waits until both are read.</p>`)}
      ${stcard('Verified empty', 'Your asks', `<p class="sub">${NONE} No ask is recorded. One appears here when you send one.</p><div class="line"><span>${LEFT(3)}</span></div>`)}
      ${stcard('Optional fields missing', 'Your asks', `<table class="tbl"><tbody><tr><td>${tgt(ASKS_T[3])}</td></tr><tr><td><b>[Grace Tan]</b><small>${msgCell(ASKS_T[1])}</small></td></tr></tbody></table>`)}
      ${stcard('Unavailable', 'Your asks', `<div class="nt r"><span class="ic" aria-hidden="true">?</span><div><b>Your recorded asks could not be read.</b> Not shown as empty.</div></div><p class="sub">Request introduction is off: recorded asks must be readable before another is sent. Team requests still work.</p><div class="acts"><button type="button" class="btn">Try again</button></div>`, 'niq-bad')}
      ${stcard('Refused · not an investor', 'Your asks', `<p class="sub">${RF()} Asks are for investor licences. Your licence can still request introductions from your team.</p><p class="foot">${NOW('403 investor_only')}</p>`)}
      ${stcard('Refused · someone else’s ask', 'This ask is not available to you', `<p class="sub">${RF()} The link may be old, or the ask is not yours to read. Nothing about it is shown.</p><div class="acts"><a class="btn" href="#">Back to Introductions</a></div><p class="foot">${TB('per-ask read · #6261')}</p>`)}
      ${stcard('HQ support session', 'Your asks · read-only', `<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Support session.</b> You can read this member’s asks. Send, withdraw, resolve and answer are off.</div></div><p class="foot">${TB('refuse writes in a support session · #7065')}</p>`)}
      ${stcard('Eadwyn', 'Draft the message', `<div class="draft"><div class="cost"><span>Cost, quoted before drafting</span><b>[400] tokens</b></div><p class="tx">“We lead pre-seed rounds in creative tools…”</p><div class="acts"><button type="button" class="btn">Use in message</button><button type="button" class="btn">Edit</button><button type="button" class="btn t">Discard</button></div></div><p class="foot">Eadwyn drafts; it never sends, spends an ask or answers. ${TB('#6256')}</p>`)}
      ${stcard('Saving kept your text', 'Message kept', `<p class="sub">After any recoverable error the message stays in the field, ${MLEN} characters, until you send or discard it.</p>`)}</div>`);

    /* ===== Tablet 768 ===== */
    else if (B === 'NIQ10') html = `<div class="${CV} tab">${phTop('Introductions').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px;overflow:hidden">${HEAD({ tab: 'Introductions', h1: 'Introductions', sub: 'Team requests, curated matches and your asks.' })}${QUOTALINE(1)}${ASKSEC({ left: 1, rows: ASKS_T.slice(1, 3) })}</main><div class="dim" aria-hidden="true"></div><aside class="sheet-r" role="dialog" aria-modal="true" aria-labelledby="tc" style="width:600px"><div class="dh"><div><span class="eye">Request introduction · step 3 of 3</span><h2 id="tc">Review the ask</h2></div><button type="button" class="ib" aria-label="Close">✕</button></div><div class="dc">${REVIEW({ id: 't' })}</div><div class="df"><button type="button" class="btn t">Back</button>${SENDBTN()}</div></aside></div>`;

    /* ===== Phone 390 ===== */
    else if (B === 'NIQ11A') html = phone('Request introduction', `${STP(2)}<h1 style="font-size:20px;font-weight:800">Who can introduce you?</h1><p class="sub">[Elm Studio] · founder [Jules Avery]</p><div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>No teammate knows them.</b></div></div><div class="pc"><span class="eye">Fallback · a quarterly ask</span><b>Ask Axal to introduce you</b><small>Uses 1 quarterly ask, not an intro credit.</small><div class="line" style="margin-top:4px"><span>${LEFT(1)}</span></div><span class="pl a" style="align-self:flex-start">! Last ask</span></div>`, '<button type="button" class="btn p">Review the ask</button>', { back: 1 });
    else if (B === 'NIQ11B') html = phone('Review the ask', `${STP(3)}<h1 style="font-size:20px;font-weight:800">Review the ask</h1>${REVIEW({ id: 'p', nostep: 1, eadwyn: false })}`, SENDBTN(), { back: 1 });
    else if (B === 'NIQ11C') html = phone('Ask', `<span class="eye">Ask to [Elm Studio]</span><h1 style="font-size:20px;font-weight:800">We could not confirm the ask</h1><div class="nt a"><span class="ic" aria-hidden="true">?</span><div><b>The connection dropped before an answer.</b> Nothing will be sent again.</div></div><div class="pc"><span class="eye">Slot</span>${SLOT('chk')}<span class="eye" style="margin-top:6px">Allowance</span><span>shown as before: ${LEFT(1)}</span><span class="eye" style="margin-top:6px">Your message</span><span>kept · ${MLEN} characters</span></div>`, '<button type="button" class="btn p">Check what was recorded</button>', { back: 1 });
    else if (B === 'NIQ11D') html = phone('Ask', `<span class="pl a" style="align-self:flex-start">◷ Waiting · your decision</span><h1 style="font-size:20px;font-weight:800">[Iris Chen] asks to be introduced to you</h1><div class="pc"><span class="eye">From</span><b>[Iris Chen] · [Harbor Lane Capital]</b><span class="eye" style="margin-top:6px">For</span><span>[Elm Studio]</span><span class="eye" style="margin-top:6px">Message</span><span>“${MSG}”</span></div><p class="sub"><b>Accepting opens the NDA step.</b> It does not sign it.</p>`, '<button type="button" class="btn">Decline</button><button type="button" class="btn p">Accept</button>', { back: 1 });
    else if (B === 'NIQ11E') html = phone('Withdraw', `<h1 style="font-size:20px;font-weight:800">Withdraw this ask?</h1><div class="pc"><span class="eye">Ask</span><b>[Grace Tan] · [Tidepool Labs]</b><span class="eye" style="margin-top:6px">Founder told</span><span>No</span><span class="eye" style="margin-top:6px">Slot</span><span>1 ${QL} ask returns, once</span><span class="eye" style="margin-top:6px">Allowance</span><span><b class="mo">0</b> of <b class="mo">3</b> now · <b class="mo">1</b> after</span></div><p class="sub">Withdrawn is final. [Grace] is not contacted.</p>`, '<button type="button" class="btn">Back</button><button type="button" class="btn p">Withdraw ask</button>', { back: 1 });
    else if (B === 'NIQ11F') html = phone('Your asks', `<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>3 asks were recorded before founders could answer.</b> Nothing is sent until you choose.</div></div><div class="line"><span>${LEFT(0)}</span></div>${J(ASKS_T.map((a) => `<div class="pc"><div class="r1"><b>${a.n ? a.n + ' · ' + a.v : 'Not available'}</b>${STAT[a.st]}</div><small>${a.q} · asked ${mo(a.at)}</small>${a.legacy ? '<button type="button" class="btn" style="align-self:flex-start">Resolve</button>' : '<a class="btn t" href="#" style="align-self:flex-start">Receipt</a>'}</div>`))}`, '', { back: 1 });

    /* ===== Frame index ===== */
    else if (B === 'NIQI') {
      const R = [
        ['NIQ01 · NW3-intro-ask.0', 'Investor', 'Network › Introductions', 'Request introduction', 'GET /introductions, /quota (live)'],
        ['NIQ02 · .1 choose', 'Investor', 'Request introduction', 'Review the ask (fallback) or Continue (team)', 'who-knows (live); eligibility at step 1 ◇'],
        ['NIQ02B · .1 not eligible', 'Investor', 'Step 1 or send', 'Search someone else / Try again', '404 target_not_available, 503 target_unreadable (live)'],
        ['NIQ03 · .2 confirm', 'Investor', 'Review the ask', 'Use 1 ask and send', 'POST /request, /quota (live)'],
        ['NIQ04 · .3 sending, recovery', 'Investor', 'Use 1 ask and send', 'Open the receipt / Try again / Check', 'request key, single read ◇'],
        ['NIQ04B · .3 quota', 'Investor', 'Review the ask', 'Compare tiers / Try again', '402 quota_intros_exhausted (live)'],
        ['NIQ05 · .4 receipt', 'Investor (founder: shared fields)', 'Sent result, Your asks row', 'Withdraw (◇) or wait', 'GET /introductions (live); per-ask read ◇'],
        ['NIQ06 · .5 founder decision', 'Founder', 'Notification', 'Accept / Decline', '#6261 ◇'],
        ['NIQ06B · .5 answers', 'Founder, investor', 'Accept / Decline', 'Open the NDA step', '#6261 ◇'],
        ['NIQ06C · .5 NDA step', 'Founder', 'Open the NDA step', 'Review and sign / Back to the ask', '/api/trust/intro/* (live); return link ◇'],
        ['NIQ07 · .6 withdraw', 'Investor', 'Receipt › Withdraw ask', 'Back to Your asks', 'withdraw + restore ◇ #6261'],
        ['NIQ07B · .6 race, previous quarter', 'Investor', 'Withdraw ask', 'Open the NDA step / Check again', 'compare-and-set ◇'],
        ['NIQ08 · .7 legacy', 'Investor', 'Your asks banner', 'Review', 'resolution ◇, ⚑ policy'],
        ['NIQ08B · .7 legacy review', 'Investor', 'Resolve › Review', 'Notify / Withdraw / Keep', 'resolution ◇'],
        ['NIQ09 · .8 states', 'Investor, founder, HQ', 'Any read', 'Try again', 'D5129 states'],
        ['NIQ10 · tablet', 'Investor', 'Review the ask', 'Use 1 ask and send', 'as NIQ03'],
        ['NIQ11A–F · phone', 'Investor, founder', 'as desktop', 'sticky primary', 'as desktop'],
        ['NIQ12, NIQ12B · dark', 'Investor, founder', 'as NIQ03, NIQ06', 'as desktop', 'as desktop']
      ];
      html = `<div class="${CV} doc"><div><span class="eye">NW3-intro-ask · #7065 · frame index</span><h2 style="font-size:22px;margin-top:4px">Each frame: who acts, where it opens from, what comes next, and what it reads</h2></div>
      <table class="tbl">${tableHdr(['Frame', 'Actor', 'Entry point', 'Next action', 'Data dependency'])}<tbody>${J(R.map((r) => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`))}</tbody></table>
      <div class="cols"><div><h3>Keyboard order</h3><ul><li>Sheet: heading, target summary, message, Draft (Eadwyn), Back, Use 1 ask and send. Esc closes and returns focus to Request introduction.</li><li>Receipt: heading (focused after a send), Withdraw ask, Back to Your asks.</li><li>Founder: the ask, note, Decline, Accept. Accept moves focus to Open the NDA step.</li><li>Withdraw: Scope, Review, Result; focus returns to the ask’s row.</li></ul></div>
      <div><h3>Announcements (<code>role="status"</code>)</h3><ul><li>“Sending your ask to [Jules Avery].”</li><li>“Ask sent. Receipt ${RID}. 0 of 3 asks left in ${QL}.”</li><li>“Not sent. No ask was used. Your message is kept.”</li><li>“We could not confirm the ask. Nothing will be sent again.”</li><li>“Ask withdrawn. 1 of 3 asks left in ${QL}.”</li><li>“Accepted. Next: the NDA step in Trust Center.”</li></ul><p class="foot" style="margin-top:6px">Visible focus is a 2px violet ring (shown on the primary in NIQ03 and NIQ07). Phone targets are 44px; the primary stays in a sticky footer.</p></div></div></div>`;
    }

    /* ===== Handoff ===== */
    else if (B === 'NIQH') html = `<div class="${CV} doc"><div><span class="eye">NW3-intro-ask · #7065 · handoff</span><h2 style="font-size:22px;margin-top:4px">Quarterly investor ask and founder response: what exists, what is frontend, what needs the Worker</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>routes/introductions.ts</code>: <code>GET /quota</code> returns tier, quarter, used, cap, remaining (403 <code>investor_only</code>). <code>GET /</code> lists up to 200 asks with the target named only where visible (D6260). <code>POST /request</code> refuses 404 <code>target_not_available</code> and 503 <code>target_unreadable</code> before any slot, 402 <code>quota_intros_exhausted</code> at the cap, then bumps the counter and inserts a <code>pending</code> row. No request key, no withdraw, no status change.</li>
      <li><code>middleware/requireInvestorTier.ts</code>: <code>investor_introductions</code> (uid, quarter, message, status, created_at); quarter key like <code>2026Q4</code>; the counter resets when the quarter changes. Caps: Free 3, Plus 10, Pro 25, Institutional 100.</li>
      <li><code>lib/investorIntroRequest.js</code> and <code>InvestorIntroRequest.jsx</code> (#6551): quota line, unreadable disables sending, confirm with an optional message, a one-tab lock, “check your recorded asks before retrying”.</li>
      <li><code>InvestorNetworkWorkspace.jsx</code> Asked view: target, status, quarter, date; “nothing moves it yet”.</li>
      <li><code>routes/trust.ts</code>: <code>/intro/request</code> mints the 3-way NDA and notifies the founder; <code>/intro/status</code>.</li>
      <li>#6261 decision A (2026-11-15): founder notified, accepts or declines, accepted opens the Trust Center NDA step.</li></ul>
      <h3 style="margin-top:12px">Existing components reused</h3><ul><li>NW3.1 request sheet and stepper, NW3.3 decision layout, the Network shell, header, four links, Sheet, NW5 state words, the Eadwyn rail (#5130), Trust Center NDA page.</li></ul></div>
      <div><h3>Backend required (◇)</h3><ul>
      <li>#6261: founder notification, founder read of one ask, accept/decline with <code>decided_at</code>/<code>decided_by</code>, status <code>accepted</code>/<code>declined</code>/<code>withdrawn</code>.</li>
      <li>#6261: withdraw an unanswered ask with a compare-and-set on status and a one-time slot restore; the race returns the recorded answer.</li>
      <li>#7065: a request key on <code>POST /request</code> so a retry or a second tab returns the same receipt; one write for slot and row (today a failed insert leaves a slot used with no ask).</li>
      <li>#7065: a per-quarter adjustment record so a returned Q3 slot never raises Q4.</li>
      <li>#6261: legacy resolution for asks recorded before founders could answer: send now (after review), withdraw, or keep.</li>
      <li>#6261: who issues the NDA envelope after acceptance; #7065: a return-to-ask link from Trust Center.</li>
      <li>#7065: eligibility read at step 1; refusing writes in a support session. #6256: an Eadwyn draft for an ask message.</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑, option A)</h3><ul><li>Legacy asks: the member decides each one; nothing is sent automatically.</li><li>A declined ask keeps its slot; only an unanswered withdrawal returns one.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>The ask as step 3 of the request sheet with venture, founder, cost, quarter and allowance; last-slot notice; the sending, second-click, failed-save and lost-response states over today’s routes; the slot words; the receipt page built from the list read; phone, tablet and dark.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Whether a founder sees the investor’s message before accepting (drawn: yes).</li><li>A curated match is a different workflow (#7064); team requests are #7066.</li></ul></div></div></div>`;


    if (!html) html = '<div>unknown board</div>';
    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('niq-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
