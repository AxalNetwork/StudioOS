.dl3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}

.diff .ln.del span:last-child{text-decoration:line-through}
.diff .ln span:first-child{font:700 12px var(--mo)}
.frac{display:flex;flex-direction:column;gap:4px}
.frac b{font:700 15px var(--mo);letter-spacing:-.01em}
.frac b span{color:var(--mu);font-weight:500}
.frac small{font-size:12px;color:var(--mu);line-height:1.45}
.sam{display:inline-flex;gap:5px;align-items:center;font:600 11px var(--mo);color:var(--amT)}
.ev2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fail{border:1.5px solid var(--neg);border-radius:12px;background:var(--card);overflow:hidden}
.fail .top{background:var(--negBg);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--negE)}
.fail .pipe{display:flex;align-items:center;gap:0;padding:14px 16px}

.fail .pipe span+span{border-left:0}
.fail .pipe span.x{background:var(--neg);color:#fff;border-color:var(--neg)}
.fail .pipe span.sk2{color:var(--mu);border-style:dashed}
.prm{display:flex;flex-direction:column;gap:6px}
.prm button{text-align:left;min-height:34px;padding:6px 11px;border-radius:9px;border:1px solid var(--hair);background:var(--card);font:600 12.5px var(--sg);color:var(--ink)}
.prm button:hover{border-color:var(--lavE);background:var(--lav)}
.mc{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mc .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc b{font-size:14px}
.mc small{font-size:12px;color:var(--mu)}
.ph .wst{overflow:hidden}
.ph .wst a{padding:12px 10px;min-height:44px}
.ph .arq li{grid-template-columns:minmax(0,1fr);gap:6px}
.stx{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--card)}
.stx>div{padding:12px 10px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stx>div:last-child{border-right:0}
.stx small{font-size:11px;color:var(--mu);line-height:1.4}
.lim{border-left:3px solid var(--hair2);padding:4px 0 4px 10px;font-size:12px;color:var(--mu);line-height:1.5}
.lim b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cv .btn.p{background:#7c3aed;border-color:#7c3aed;color:#fff!important}
.stx{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:8px!important;border:0!important;background:none!important;overflow:visible!important}
.stx>div{border:1px solid var(--hair)!important;border-radius:10px;background:var(--card)}
.acts{display:flex;justify-content:flex-end;align-items:center;gap:4px;white-space:nowrap}
.ops .h{flex-wrap:wrap;align-items:flex-start}
.ph .wst{flex:none}

body{margin:0}
.cv{--mo:'Roboto Mono',ui-monospace,monospace;--sg:'Space Grotesk',system-ui,sans-serif;font-family:var(--sg);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;position:relative;font-size:13px;line-height:1.45;overflow:hidden}
.cv *{box-sizing:border-box}
.cv a{color:var(--vt);text-decoration:none}
.cv button{font-family:var(--sg);cursor:pointer}
.cv :focus-visible,.cv .fv{outline:2px solid var(--vi);outline-offset:2px}
.cv h1,.cv h2,.cv h3,.cv p,.cv ol,.cv ul,.cv dl,.cv dd,.cv dt{margin:0;padding:0}
.cv ol,.cv ul{list-style:none}
.mo{font-family:var(--mo)}
.mu{color:var(--mu)}
.eye{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.sh{display:grid;grid-template-columns:196px minmax(0,1fr) 44px}
.sd{background:var(--card);border-right:1px solid var(--hair);padding:14px 0;display:flex;flex-direction:column;gap:2px}
.sd .lg{padding:4px 16px 12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.01em}
.logo{width:20px;height:20px;border-radius:6px;background:#7c3aed;flex:none}
.sd .grp{padding:6px 20px 4px}
.sd nav{display:flex;flex-direction:column;gap:2px}
.sd nav a{display:flex;align-items:center;min-height:34px;padding:0 12px;margin:0 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink)}
.sd nav a[aria-current=page]{background:var(--lav);color:var(--vt);font-weight:800}
.mn{min-width:0;display:flex;flex-direction:column}
.tb{height:52px;border-bottom:1px solid var(--hair);background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}
.srch{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border:1px solid var(--hair);border-radius:7px;background:var(--card);color:var(--mu);font-size:12.5px;width:280px}
.bdg{padding:4px 9px;border-radius:999px;font:700 10px var(--mo);letter-spacing:.06em;color:#fff;background:#334155}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--card);color:var(--ink);padding:0}
.av{display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:var(--lav);color:var(--vt);font:700 10px var(--mo)}
.sp{border-left:1px solid var(--hair);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.sp .e{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#7c3aed;color:#fff;font-weight:800;font-size:13px;border:0;padding:0}
.sp .vt{writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.bd{padding:24px 30px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:4px}
.hd h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hd p{font-size:13px;color:var(--mu);margin-top:4px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:7px;position:relative}
.meta{display:flex;align-items:center;gap:8px;font:500 12px var(--mo);color:var(--mu);flex-wrap:wrap}
.lk{background:none;border:0;padding:0 2px;color:var(--vt);font:700 12px var(--sg);min-height:24px}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;border:1px solid var(--hair);background:var(--card);color:var(--mu);font:700 10px var(--mo);padding:0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--raised);border:1px solid var(--hair)}
.seg button{min-height:28px;padding:0 12px;border-radius:7px;border:0;background:transparent;color:var(--mu);font:600 12px var(--sg);white-space:nowrap}
.seg button[aria-checked=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair)}
