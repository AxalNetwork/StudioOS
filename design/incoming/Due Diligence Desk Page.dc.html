      DDL18c: () => phone(`<div style="padding:4px 16px 0;flex:1;overflow:hidden">${pback('My reviews')}<h1 style="margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em">[Company Alpha]</h1><div style="margin-top:10px;display:flex;gap:10px;padding:12px;border-radius:10px;background:${T.lav};border:1px solid ${T.le};font-size:13px;line-height:1.45"><span style="color:${T.vt}">${ic('info', 15)}</span><span>You’re reviewing <b>Financial Health &amp; Runway</b> as an invited expert. You see your section only.</span></div><div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:${T.card};border:1px solid ${T.hl}"><div style="display:flex;align-items:center;gap:10px"><span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:${T.vb};color:#fff;${M};font-size:12px;font-weight:700">1</span><span style="font-weight:600;font-size:14px">Sign the NDA</span></div><div style="font-size:12.5px;color:${T.mu};margin:6px 0 10px 34px">Upload your signed NDA for this section first. PDF, up to 10 MB.</div>${bt(`${ic('up', 14)}Upload NDA`, 's', 'width:100%;height:44px')}</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${pitem(IT2[1])}${pitem(IT2[3])}${pitem(IT2[5])}</div></div><div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;background:${T.card};border-top:1px solid ${T.hl}">${bt('Record verdict', 'p', 'width:100%;height:48px')}</div>`),

    let h = '';
