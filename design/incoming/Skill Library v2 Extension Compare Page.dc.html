      ['Unreadable · request failed', st('Unreadable') + '<div class="nt"><span class="ic" aria-hidden="true">' + SH.ua + '</span><div><b>The comparison could not be read</b><div>Nothing below is a guess. <a href="#">Back to the skill</a> still works.</div></div><span class="bt"><button type="button" class="btn bsm">Try again</button></span></div>'],
      ['Refused · 404', ntb('', '⦸', 'There is no such skill', 'Your company’s editors (Owner, Admin, Founder, primary admin) publish skills.', 'Back to Team') + '<span class="raw">The Worker’s 404 not_found: another company, or a member while the extension is an unpublished draft</span>'],

      ['Extend · save failed', ntb('r', '✕', 'The extension wasn’t created', 'Your reason, name and version are still here. Nothing was made.', 'Try again')],

      ['Edit refused · base_unreadable', ntb('a', '!', 'The Axal skill this extension is based on could not be read, so its tools cannot be checked.', 'Nothing was saved. Your edits are kept.', 'Try again')]

    const baseUnreadable = () => header({ role: 'editor', nobase: true }) + reasonQ()
      + '<div class="skx-ban un" role="alert"><span class="ic" aria-hidden="true">' + SH.ua + '</span><div><b>Axal’s version could not be read.</b><div>So there is no comparison and no update signal. This is not “up to date”. Your own version and history are below.</div></div><button type="button" class="btn bsm">Try again</button></div>'
      + '<section class="cd skx-nocmp"><div class="ch"><h2>Comparison</h2>' + st('Unreadable') + '</div><p>Not drawn while Axal’s side can’t be read. Nothing here means “no differences”.</p></section>'
      + history() + spec(['Banner: lineage.base === null → Unreadable; lineage.fields and base_update_available are null too, never shown as false or as an empty comparison', 'Header: “Based on Axal v3” from lineage.based_on.version; the Axal name (lineage.base.name) is unreadable and is not guessed. No Extend or Rebase without a readable base', 'History and “Your v2” still read from lineage.versions[] and the card']);

    const pcard = (x, cols) => '<article class="skx-pcd' + (x.k === 'c' ? ' skx-cf' : '') + '"><div class="r1"><b>' + PL[x.f] + '</b>' + mk(x.k) + '</div>' + J(cols.map(c => '<div class="skx-pst"><span class="eye">' + c[0] + ' · ' + c[1] + '</span>' + cellOf(x, c[2], NV) + '</div>')) + '</article>';
    const F17 = conflictsFirst(fields(v3, mine, v5));
    const phHead = () => '<div class="skx-crumb">Skills / ' + EXT + '</div><h1 style="font-size:20px;font-weight:800;letter-spacing:-.02em">Compare with Axal</h1><div class="skx-based">Based on Axal <b>' + AX + ' v3</b>' + st('Published', 'Your v2 · Published') + '</div>';
    const phBan = () => '<div class="skx-ban" role="status"><span class="ic" aria-hidden="true">↑</span><div><b>Axal published v5. You’re based on v3. 2 parts conflict.</b><div>Your agents keep their pinned version.</div></div></div>';

    const MOB = {
      SKX24A: () => phone(EXT, phHead() + phBan() + pcard(F17[0], COLS3), phBar),
      SKX24B: () => phone(EXT, pcard(F17[1], COLS3) + J(F17.slice(2).map(x => pcard(x, COLS3))), phBar),
      SKX24C: () => phone(EXT, '<h2 style="font-size:16px;font-weight:800">History</h2><ul class="skx-hist ph2"><li><b class="mo">Your v2</b><span>built on <b class="mo">Axal v3</b></span></li><li><b class="mo">Your v1</b><span>built on <b class="mo">Axal v3</b></span></li></ul><span class="raw">Published by, when: ' + BR('Not built yet') + '</span>' + reasonQ() + '<div class="skx-rbx" style="flex-direction:column;align-items:flex-start"><button type="button" class="btn" aria-disabled="true" style="min-height:44px;width:100%">Rebase onto v5</button>' + BR('Not built yet · #5965') + '</div>', phBar),
      SKX24D: () => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph skx-ph skx-sheet" style="height:844px" role="dialog" aria-modal="true" aria-labelledby="xs"><div class="pt"><button type="button" class="pi" aria-label="Close">✕</button><b id="xs" style="font-size:15px">Extend ' + AX + '</b><span style="width:44px"></span></div><div class="pbd" style="padding-bottom:110px">'
        + '<p class="raw">For ' + CO + ' · from Axal v5</p><div class="skx-fld"><label for="pr1">Why are you extending it? <span>· required</span></label><div class="skx-in skx-ta" id="pr1" style="min-height:96px">' + REASON + '</div><span class="raw skx-cnt2" style="align-self:flex-end">' + REASON.length + ' / 300</span></div>'
        + '<div class="skx-fld"><label for="pr2">Name <span>· optional</span></label><div class="skx-in" id="pr2" style="min-height:44px">[Market sizing · hospitals]</div></div><div class="skx-fld"><label for="pr3">Version</label><button type="button" class="dd" id="pr3" style="min-height:44px;justify-content:space-between">Axal v5 · newest ▾</button></div>'
        + '<div class="nt"><span class="ic" aria-hidden="true">i</span><div>You get a draft copy of Axal v5. Axal’s skill is not changed. <b>This is a new extension;</b> ' + EXT + ' stays as it is.</div></div></div><div class="skx-bb"><button type="button" class="btn" style="flex:1">Cancel</button><button type="button" class="btn p" style="flex:1.3">Create extension</button></div></div></div>'
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      SKXH: () => dk('<h1>Handoff · SK-17 to SK-25 (Skill Library v2 addendum, #5963)</h1><p>Continues Skill Library v2 (SK-01 to SK-16): same shell, type, palette, readiness words and dialogs; the Team library (SK-09) and Team skill page (SK-10) are the parents. Checked against <code>main</code> 6d7712c6d1 on Sat 14 Nov 2026. Code-informed, not screenshot-verified.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it showed'], [
          ['<code>cloudflare-worker/src/routes/team_skills.ts</code>', '<code>POST /skills/:uid/extend</code> (201 {skill, base}) with every refusal drawn on SK-21 B; <code>GET /skills/:uid/base</code> returns <code>lineage</code> or null; <code>threeWay()</code> over the seven parts; PATCH on an extension refuses <code>tool_not_in_base</code> and <code>base_unreadable</code>; every card carries <code>based_on</code>'],
          ['<code>mayRead</code> / <code>isMember</code> / <code>mayWrite</code>', 'Members and HQ admins read a published extension; a draft is readable only by its writers; another company and a member on a draft get 404 “There is no such skill.” HQ is never a writer (403 <code>not_editor</code>)'],
          ['<code>sql/migrations/202611130253_4538_skill_extension_lineage.sql</code>, D4538-p2', '<code>based_on_skill_uid</code>, <code>based_on_version</code>, <code>fork_reason</code> (1–300), <code>agent_skill_versions.based_on_version</code>. No creator or date is returned per version'],
          ['<code>frontend/src/lib/api/teamAgents.js</code>', 'No client method for <code>/base</code> or <code>/extend</code> (#5964 adds them)'],
          ['<code>frontend/src/routes/team.jsx</code>', 'The company Team page is <code>/account/companies/:uid/settings/team</code> (Skills via <code>?tab=skills</code>); no <code>/skills/:skillUid/base</code> route yet']])
        + '<h2>Preserved</h2><p>SK-09 / SK-10 layout and actions (Assign to agents, Edit, Publish), the readiness words, the dialog frame, the Eadwyn rail as the one shared rail, and pins that never move by themselves.</p>'
        + '<h2>Frontend only (#5964)</h2><p>The route (owner Q1 option A) and its link from SK-10 (“Based on Axal … · Compare with Axal”, only when <code>based_on</code> is set); conflicts-first ordering; the + / − line diff computed in the browser from the three part sets; marker words and glyphs; the “draft edits are not in this comparison” line (card.draft vs published parts); the Extend dialog, its counter and field-tied refusals; phone cards and the sheet; dark tokens; Eadwyn proposals copied into Edit my draft on Accept.</p>'
        + '<h2>Backend required (◇)</h2>' + tbl(['Need', 'Issue'], [['Rebase onto the newest Axal version, with a choice per conflicting part, creating a new draft', '#5965 (owner answer C: after this canvas)'], ['Who published each company version, and when (<code>lineage.versions[]</code> has only version and based_on_version)', 'none filed — drawn “Not built yet”; the issue’s “creator name” is dropped'], ['Client methods for <code>/base</code> and <code>/extend</code>', '#5964']])
        + '<h2>Owner questions (drawn as A)</h2><p>Q1 the comparison is its own page, linked from the skill page. Q2 HQ admins read it here read-only, as the Worker allows.</p>'
        + '<h2>Accessibility</h2><p>The comparison is a real table (row headers are parts, a caption names the order); every marker is a word plus a glyph; added and removed lines carry + / − and a hidden “Added:” / “Removed:”; disabled actions keep a visible reason (aria-describedby); refusals are live regions tied to their field; the dialog traps focus and returns it; 44px targets and no wide table on phone; dark keeps every word and shape.</p>'
        + '<p>[Lumen Robotics], [Market sizing], [Lumen market sizing] and every step, tool and tag are fictional sample content. Design only.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'SKX17') html = page(cmpBody({ role: 'editor', v5: true, rail: true, spec: SPEC17 }), { h: 1840, rail: rail() });
    else if (B === 'SKX18A') html = page(cmpBody({ role: 'editor', spec: ['No banner: lineage.base_update_available = false and lineage.base.retired = false → “Up to date with Axal v3”', 'Two columns: lineage.base.newest is null; markers from lineage.fields[] (base_changed is false on every part)'] }), { h: 1290 });
    else if (B === 'SKX18B') html = page(cmpBody({ role: 'editor', ret: true, spec: ['lineage.base.retired = true → chip and “No further Axal versions”; base_update_available is false by rule; Extend again hidden (POST /extend would answer base_retired)'] }), { h: 1290 });
    else if (B === 'SKX18C') html = page(cmpBody({ role: 'editor', v5: true, susp: true, spec: ['lineage.base.suspended = true (run gate on the HQ current version, v5) → chip, reason line, Extend Axal v5 again disabled (POST /extend would answer base_suspended)'] }), { h: 1510 });
    else if (B === 'SKX18D') html = page(cmpBody({ role: 'editor', v5: true, nc: true, spec: ['No lineage.fields[].conflict is true → “No parts conflict.”; markers Changed by you / Changed by Axal / Same as Axal only'] }), { h: 1370 });
    else if (B === 'SKX19A') html = page(crumb('Compare with Axal') + '<header class="skx-hd"><div><h1>[Lumen hiring rubric]</h1><p>Your company’s own skill · v2 · Published</p></div></header><section class="cd skx-nocmp"><p style="font-size:14px;font-weight:700">This skill is not based on an Axal skill.</p><p>There is nothing to compare it with.</p><div><button type="button" class="btn p">Back to the skill</button></div></section>' + spec(['GET /skills/:uid/base → { lineage: null } (card.based_on is null). The skill page doesn’t link here in this case; this covers a typed or old URL']), { h: 720 });
    else if (B === 'SKX19B') html = page(crumb('Compare with Axal').replace(EXT, '[Market sizing · hospitals]').replace(EXT, '[Market sizing · hospitals]') + '<header class="skx-hd"><div><h1>[Market sizing · hospitals]</h1><div class="skx-based">Based on Axal <b>' + AX + ' v5</b>' + st('Draft', 'Draft — not published yet') + '</div></div><div class="skx-acts"><button type="button" class="btn">Edit my draft</button></div></header>' + reasonQ() + '<p class="skx-quiet">' + GL.s + ' Up to date with Axal v5</p>'
      + '<section class="cd" style="padding:0;gap:0;overflow:hidden"><div class="ch" style="padding:12px 16px"><h2>Comparison · 7 parts</h2>' + legend(fields(v5, v5draft, null)) + '</div>' + compare(fields(v5, v5draft, null), [['Axal v5', 'what you built on', 'base'], ['Your draft', 'not published yet', 'mine']], { b: 5, n: 5 }, { pw: 170 }) + '</section>'
      + history({ none: true, publish: '<div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn p">Publish</button><span class="raw">The skill page’s existing Publish (SK-10). A company skill needs no Axal approval or test cases.</span></div>' }) + spec(['lineage.company.side = draft, lineage.company.version = null → “Draft — not published yet”; the comparison runs against the draft (writers only; a member gets 404 here)', 'lineage.versions[] is empty → “No published versions yet”']), { h: 1320 });
    else if (B === 'SKX20') html = page(closeUp(), { h: 1260 });
    else if (B === 'SKX21A') html = page(axalSkillPage(), { h: 900, overlay: extendDlg({ reason: '', count: '0', ead: true }) });
    else if (B === 'SKX21A2') html = crop(extendDlg({ again: true, name: '[Market sizing · hospitals]' }) + spec(['Opened from SK-17 “Extend Axal v5 again”: version preset to 5 (lineage.base.current_version). Body { company, reason, version: 5, name }', 'Name must differ: the current extension kept the short name market-sizing from when it was made']), 680);
    else if (B === 'SKX21B') html = crop('<div style="display:grid;grid-template-columns:620px minmax(0,1fr);gap:20px;align-items:start">' + extendDlg({ again: true, name: AX, nameErr: 'Your company already has a skill with this short name. Give the extension another name.' }) + '<div style="display:flex;flex-direction:column;gap:10px"><span class="eye">Every refusal, where it shows</span>' + J(REFUSALS.map(r => '<div class="skx-refx"><code>' + r[0] + '</code><span class="raw">' + r[1] + '</span><p>' + r[2] + '</p></div>')) + '</div></div>', 1340);
    else if (B === 'SKX21C') html = crop(extendDlg({ busy: true, again: true, name: '[Market sizing · hospitals]' }), 680);
    else if (B === 'SKX21D') html = page('<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Draft created from Axal v5.</b><div>[Market sizing · hospitals] is a draft. Agents can’t use it until you publish.</div></div></div><div class="skx-crumb">' + CO + ' settings / Team / Skills / <b>[Market sizing · hospitals]</b></div><header class="skx-hd"><div><h1 style="font-size:20px">[Market sizing · hospitals]</h1><p>' + CO + ' · Draft — not published yet</p><div class="skx-based">Based on Axal <b>' + AX + ' v5</b> · <a href="#">Compare with Axal</a></div></div><div class="skx-acts"><button type="button" class="btn">Edit draft</button><button type="button" class="btn p">Publish</button></div></header>'
      + '<div class="skx-sum"><section class="skx-blk"><h3>What it does</h3><p>' + P5 + '</p></section><section class="skx-blk"><h3>Reads</h3><p>CRM · Web · Metrics · Filings</p><span class="raw">Read-only · the tools of Axal v5 or fewer</span></section><section class="skx-blk"><h3>You get</h3><p>' + OUT + '</p></section></div>' + spec(['201 { skill, base: { uid, name, version: 5, current_version: 5 } } → the new draft’s Team skill page (SK-10)', '“Based on Axal … · Compare with Axal” is SK-10’s new line, shown only when card.based_on is not null']), { h: 760 });
    else if (B === 'SKX22A') html = page(cmpBody({ role: 'member', v5: true, spec: ['card.can_write = false → no actions and no draft line. A member reaches this only once the extension has a published version (mayRead)'] }), { h: 1480 });
    else if (B === 'SKX22B') html = page([['Your version v2', CO + ' v2'], ['Your v2', CO + ' v2'], ['Your v1', CO + ' v1'], ['Your extension is based', 'This extension is based'], ['Your agents keep', 'The company’s agents keep'], ['Your published versions', 'The company’s published versions'], ['what you built on', 'what it was built on'], ['Changed by you', 'Changed by the company'], ['Removed by you', 'Removed by the company'], ['until you choose', 'until its editors choose']].reduce((h, r) => h.split(r[0]).join(r[1]), cmpBody({ role: 'hq', v5: true, spec: ['HQ admin: isMember admits admins; mayWrite is false for a company skill → read-only. A draft-only extension answers 404 to HQ too'] })), { h: 1520, hq: true });
    else if (B === 'SKX23A') html = page(baseUnreadable(), { h: 900 });
    else if (B === 'SKX23B') html = crop('<span class="eye">States · each says what happened and what to do next</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);
    else if (B === 'SKX25A') html = page(cmpBody({ role: 'editor', v5: true, rail: true }), { h: 1590, rail: rail() });
    else if (B === 'SKX25B') html = MOB.SKX24A();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(cmpBody({ role: 'editor', v5: true, rail: true }), { h: 1700, rail: rail() });
    return { html: { __html: html } };
  }
}
