      const st = o.state; /* undefined | 'saving' | 'failed' | 'refused' */
      const reason = 'Comparables need the fund lists for the [Q4 landscape] report.';
      const body = `<div style="display:flex;align-items:center;gap:10px">${PAV('CA', 36)}<div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:14px;color:var(--ink)">[Competitor Analyst]</b><span style="font-size:12.5px;color:var(--mut)">Research · Active · sponsor [Maya Ruiz] · [Northwind Labs]</span></div></div>`
        + `<div style="display:flex;flex-direction:column;gap:9px;padding:12px 14px;border:1px solid var(--line);border-radius:10px">${KV('Capability', CODE('fund.read') + `<span style="font-size:12.5px;color:var(--mut)">fund · read</span>`)}${KV('What it allows', 'Read the fund records the agent’s team can already see: profile, positions and reports. It changes nothing. ' + ENG())}${KV('Platform offers', CELL('on', 'fund.read') + `<span style="font-size:12.5px;color:var(--mut)">November 2026</span> ` + ENG())}${KV('Now', '<b>Not granted</b>')}${KV('Last change', `Revoked by [Iris Chen] · <span style="${M};font-size:12px">30 Oct 2026, 09:05</span><span style="font-size:12.5px;color:var(--mut)">“Pilot ended; not needed until the Q4 report.” Granted before by [Iris Chen] on <span style="${M};font-size:12px">2 Oct 2026</span>.</span> ` + ENG())}${KV('Last refusal', 'None · no refused run for this agent')}</div>`
        + CBX('Apply to the Research role: [Competitor Analyst] and [Market Researcher] (who already has it)', false, 'align-items:flex-start;line-height:1.45') + `<span style="margin-top:-8px">${OWN('Q1 · A · per agent, with apply to role')}</span>`
        + REAS(reason, reason.length, st === 'failed' ? NOTE('<b>Could not save.</b> Nothing changed and your reason is kept. Press Grant fund.read to try again.', 'neg') : st === 'refused' ? NOTE('<b>The Worker refused this grant.</b> ' + CODE('capability_not_offered') + ' The platform stopped offering this capability at 15:38 UTC, after you opened the panel. Your reason is kept. ' + ENG('#8070 · code name proposed'), 'neg') : '')
        + EFFECT;
      const foot = st === 'saving' ? bG('Cancel') + bX('Granting…', 'Saving') : st === 'refused' ? bG('Close') + bX('Grant fund.read', 'Not offered this month') : bG('Cancel') + bP('Grant fund.read');
      return SHEET('Grant fund.read', 'HQ › AI agents › Policies › Capabilities', body, foot, 480);
    };
    const REVOKEP = () => {
      const reason = 'Unused for 34 days. Eadwyn proposal, edited: drafts now go through the sponsor.';
      const body = `<div style="display:flex;align-items:center;gap:10px">${PAV('PW', 36)}<div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:14px;color:var(--ink)">[Pitch Writer]</b><span style="font-size:12.5px;color:var(--mut)">Fundraising · Active · sponsor [Maya Ruiz] · [Northwind Labs]</span></div></div>`
        + `<div style="display:flex;flex-direction:column;gap:9px;padding:12px 14px;border:1px solid var(--line);border-radius:10px">${KV('Capability', CODE('email.draft') + `<span style="font-size:12.5px;color:var(--mut)">email · draft</span>`)}${KV('What it allows', 'Draft an email for a person to review. It never sends; email.send is locked. ' + ENG())}${KV('Now', `<b>Granted</b> by [Iris Chen] · <span style="${M};font-size:12px">6 Oct 2026, 15:42</span> ` + ENG())}${KV('Last used', `<span style="${M};font-size:12px">18 Oct 2026</span> · 34 days ago ` + ENG('#8070 · last use'))}${KV('Last refusal', `${CODE('capability_ungrantable')}<span style="${M};font-size:12px">19 Nov 2026, 10:31</span>${LNK('Open run in Audit ›', 'font-size:12.5px')}`)}</div>`
        + NOTE('From Eadwyn’s proposal. You edited the reason.', '')
        + REAS(reason, reason.length)
        + EFFECT
        + `<div style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--negE);border-radius:10px"><b style="font-size:13px;color:var(--ink)">Review</b><span style="font-size:12.5px;color:var(--body);line-height:1.5">[Pitch Writer] keeps research.read, company.read and fund.read. Its next run that asks to draft an email is refused with ${CODE('capability_missing')}. You can grant it again at any time.</span></div>`;
      return SHEET('Revoke email.draft', 'HQ › AI agents › Policies › Capabilities', body, bG('Cancel') + bDF('Revoke email.draft'), 480);
    };
    const LOCKP = `<div style="display:flex;flex-direction:column;gap:9px;padding:12px 14px;border:1px solid var(--line);border-radius:10px">${KV('Capability', CODE('code.merge') + ICO.lock)}${KV('Now', '<b>Locked</b> · no one can grant it')}${KV('Why', 'A person merges. code.merge, deploy.production, cloud.write, finance.execute and email.send exist as names and are never grantable to an agent.')}${KV('If asked', 'The Worker refuses the run with ' + CODE('capability_ungrantable') + ' ' + ENG())}</div>`;
    const OVER = (sheet) => `<div style="position:absolute;left:0;right:0;top:56px;bottom:0;background:rgba(24,24,27,.22);display:flex;justify-content:flex-end">${sheet}</div>`;

    /* ---------- phone 390 ---------- */
    const PTOP = (t) => `<div style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--card);border-bottom:1px solid var(--line)"><button type="button" aria-label="Menu" style="width:44px;height:44px;border:none;background:transparent;color:var(--ink);font-size:18px;cursor:pointer">☰</button><span style="flex:1;font-size:16px;font-weight:800;letter-spacing:-0.02em">${t}</span>${PILL('HQ', 'hq')}<button type="button" aria-label="Ask Eadwyn" style="width:44px;height:44px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer"><span style="display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#7c3aed;color:#fff;font-weight:800;font-size:12px">E</span></button></div>`;
    const PCARD = (a) => `<a href="#" style="flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 14px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit"><span style="display:flex;align-items:center;gap:10px">${PAV(a.ini, 32)}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="display:flex;align-items:center;gap:6px"><b style="font-size:14px;color:var(--ink)">${a.n}</b>${a.st === 'Paused' ? PILL('Paused', 'wait') : ''}</span><span style="font-size:12px;color:var(--mut)">${a.role} · ${a.g.length} granted</span></span><span aria-hidden="true" style="color:var(--mut);font-size:18px">›</span></span><span style="display:flex;flex-wrap:wrap;gap:5px">${a.g.map(g => `<span style="display:inline-flex;align-items:center;gap:3px;min-height:24px;padding:0 7px;border-radius:999px;background:var(--lav);border:1px solid var(--lavE);color:var(--vdeep);${M};font-size:11px">${ICO.check}${g}</span>`).join('')}</span><span style="font-size:11.5px;color:var(--mut)">${a.rf ? `Last refusal <span style="${M}">${a.rf[0]}</span> · <span style="${M}">${a.rf[1]}</span>` : 'Last refusal: None'}</span></a>`;
    const PH1 = `<div style="display:flex;flex-direction:column;height:844px;background:var(--bg)">${PTOP('Capabilities')}<div style="flex:1;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:10px"><nav aria-label="Breadcrumb">${EB('AI agents › Operations › Policies')}</nav><div style="display:flex;gap:6px;overflow:hidden">${CHIP('[Northwind Labs] ▾', true, 'min-height:36px')}${CHIP('Role ▾', false, 'min-height:36px')}${CHIP('Active, Paused ▾', true, 'min-height:36px')}</div><span style="font-size:12px;color:var(--body);line-height:1.45"><b style="color:var(--ink)">${AG.length} agents</b> · <b style="color:var(--ink)">${GRANTS} grants</b> now · ${OFFERED} of ${GRANTABLE} offered in Nov 2026 ${ENG()}</span>${J(AG.slice(0, 3).map(PCARD))}<span style="font-size:12px;color:var(--mut);text-align:center">5 more agents below</span></div><div style="flex:none;padding:10px 16px 18px;background:var(--card);border-top:1px solid var(--line)">${bP(ICO.plus + 'Grant a capability…', 'width:100%;min-height:44px')}</div></div>`;
    const PH2 = `<div style="display:flex;flex-direction:column;height:844px;background:var(--bg);position:relative">${PTOP('Capabilities')}<div style="flex:1;padding:12px 16px;opacity:.35">${PCARD(AG[1])}</div><div role="dialog" aria-label="Grant fund.read" style="position:absolute;left:0;right:0;bottom:0;top:120px;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);box-shadow:0 -12px 32px rgba(24,24,27,.14);display:flex;flex-direction:column"><span aria-hidden="true" style="width:40px;height:4px;border-radius:999px;background:var(--line2);margin:8px auto 2px;display:block"></span><div style="display:flex;align-items:center;gap:8px;padding:6px 8px 10px 16px;border-bottom:1px solid var(--line)"><b style="flex:1;font-size:16px">Grant fund.read</b><button type="button" aria-label="Close" style="width:44px;height:44px;border:0;background:transparent;color:var(--body);display:grid;place-items:center">${ICO.x}</button></div><div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px"><span style="font-size:13px;color:var(--ink)"><b>[Competitor Analyst]</b> · Research · Active</span><span style="font-size:13px;line-height:1.5;color:var(--body)">${CODE('fund.read')} Read the fund records the agent’s team can already see. It changes nothing. ${ENG()}</span><span style="font-size:12.5px;color:var(--mut);line-height:1.5">Offered in Nov 2026 · not granted now · revoked by [Iris Chen] on <span style="${M}">30 Oct 2026</span> ${ENG()}</span>${CBX('Apply to the Research role', false, 'min-height:44px')}${REAS('Comparables need the fund lists for the [Q4 landscape] report.', 62)}<span style="font-size:12px;color:var(--mut);line-height:1.45">Applies from the next run; live runs finish. ${OWN('Q2 · A')}</span></div><div style="display:flex;flex-direction:column;gap:8px;padding:10px 16px 18px;border-top:1px solid var(--line)">${bP('Grant fund.read', 'width:100%;min-height:44px')}${bG('Cancel', 'width:100%;min-height:44px')}</div></div></div>`;

    /* ---------- handoff (wide doc) ---------- */
    const H2 = (t) => `<h2 style="margin:18px 0 6px;font-size:15px;font-weight:800;letter-spacing:-0.01em;color:var(--ink)">${t}</h2>`;
    const UL = (xs) => `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.5;color:var(--body)">${xs.map(x => `<li>${x}</li>`).join('')}</ul>`;
    const HANDOFF = `<div style="padding:28px 32px;background:var(--card);display:flex;flex-direction:column;gap:4px">${EB('SAP-H · Handoff · #8070 · continues HQ AI Agents SA0–SA9 (D4137) · decision file D4137-p&lt;k&gt;.md')}<h1 style="margin:4px 0 2px;font-size:22px;font-weight:800;letter-spacing:-0.02em">Capability policies · SA10 to SA14</h1><p style="margin:0;font-size:13px;line-height:1.55;color:var(--body);max-width:1060px">The matrix lives at /hq/ai-agents/operations/policies as a second view of the Policies tab (Platform settings · Capabilities); Platform settings is SA6 unchanged. Super admin only. Checked against main <span style="${M}">270cdf4a2a</span>. People, agents, runs and dates are fictional.</p>`
      + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">`
      + `<div>${H2('Checked on main')}${UL([
        `<span style="${M}">routes/admin_ai_agents_policy.ts</span>: GET / and PUT models, caps, capacity, tools; POST locks, pause, resume. Super admin (<span style="${M}">requireSuperAdmin</span>, write bar). No capability route, no ceiling per capability.`,
        `<span style="${M}">routes/admin_ai_agents_roster.ts</span>: GET /roster returns the 16 personas (offered · hidden · retired), not deployed agents.`,
        `<span style="${M}">sql/migrations/712_team_agents.sql</span>: deployed agents with <span style="${M}">status</span> active · paused · removed and a sponsor. The matrix rows are these; the board uses their words (Active, Paused; Removed behind the filter).`,
        `<span style="${M}">728_agent_engine.sql</span>: <span style="${M}">agent_task_runs.refusal</span> holds a code only (≤ 64 chars), never the capability. Read by <span style="${M}">GET /api/agent-engine/runs/:uid</span> and the HQ run detail.`,
        `<span style="${M}">202611161330_5567_agent_authz_revisions.sql</span>: the revision pattern a grant or revoke bumps.`,
        `<span style="${M}">frontend/src/pages/hq/aiAgents/Operations.jsx</span> (Policies) and <span style="${M}">refusals.js</span>: reasons are 10 to 500 characters today.`,
        `No <span style="${M}">agent_capabilities</span>, <span style="${M}">capability_catalog</span>, <span style="${M}">agentCapabilities.ts</span> or <span style="${M}">capability_missing</span> anywhere on main.`])}`
      + `${H2('Requires engineering ◇ #8070')}${UL([
        `Migration <span style="${M}">…_8070_agent_capabilities.sql</span>: <span style="${M}">agent_capabilities</span>, <span style="${M}">capability_catalog</span> (the one sentence per name), the ceiling on <span style="${M}">ai_agent_policy</span>.`,
        `<span style="${M}">GET /api/admin/ai-agents/policy/capabilities</span>: agents (from team_agents) × grants with by and when, the ceiling, the last change per cell.`,
        `Grant and revoke routes, audited, bumping <span style="${M}">agent_authz_revisions</span>; refusals <span style="${M}">capability_missing</span>, <span style="${M}">capability_ungrantable</span>; <span style="${M}">capability_not_offered</span> is a proposed name.`,
        `The capability named in a refusal, and the last use per capability (Eadwyn’s 30-day proposal, “Last used”). Without them those lines read Not recorded.`])}</div>`
      + `<div>${H2('Pending the owner ⚑ (option A drawn)')}${UL([
        `Q1 · per agent, with “Apply to role” (A), or per role only (B). Drawn: a checkbox in the panel.`,
        `Q2 · a revoke applies at the next run and live runs finish (A), or halts live runs (B). Drawn: the line under every panel.`,
        `Reason length: the brief says ≤ 200; HQ takes 10 to 500 today. Drawn: 10 to 200.`])}`
      + `${H2('Frontend only')}${UL([
        `The Platform settings · Capabilities switch, domain collapse, filters (team, role, status) and the legend.`,
        `Cells are buttons with a name: “[Pitch Writer], email.draft: granted”. Locked and not-offered cells are images, not buttons. Arrow keys move in the grid; collapse buttons carry aria-expanded.`,
        `Phone 390: cards with granted chips, a bottom sheet, every target 44 px.`,
        `States: Loading, Not recorded (no grant yet), Unreadable (ceiling still works), Refused, Saving and Could not save (text kept).`])}`
      + `${H2('Handoffs')}${UL([
        `A last-refusal code opens the run in HQ › AI agents › Operations › Audit, carrying the run id (SA8).`,
        `#8071 Execution budgets (SAB, SA15–SA19) at Operations › Spend: the same eight agents and figures.`,
        `#8080 Registry (SAR, SA20–SA24) at Roster › Registry: each agent’s detail links here for its capabilities.`])}</div></div></div>`;

    /* ---------- boards ---------- */
    const ROOT = (w, h, inner) => `<div style="${VARS};width:${w}px;${h ? 'height:' + h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);${SG};font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased">${inner}</div>`;
    const EXP10 = ['research', 'company', 'fund', 'code', 'web'];
    const SA10 = (h) => PAGE2(MAINP(MX({ exp: EXP10 })), RAILC, h);
    let html;
    if (B === 'SA10') html = ROOT(1440, 1300, SA10(1300));
    else if (B === 'SA10B') html = ROOT(1440, 1380, PAGE2(MAINP(MX({ exp: ['email'], wa: 236, wd: 40, wc: 44, short: 1 }), { hdr: { acts: '' } }), RAIL, 1380));
    else if (B === 'SA11') html = ROOT(1440, 1300, SHELL(MAINP(MX({ exp: EXP10, sel: ['[Competitor Analyst]', 'fund.read'] })), { h: 1300, side: RAILC }) + OVER(GRANTP()));
    else if (B === 'SA11B') html = ROOT(520, 0, `<div style="display:flex;height:1100px;background:var(--bg);justify-content:flex-end">${REVOKEP()}</div>`);
    else if (B === 'SA11C') html = ROOT(1040, 0, `<div style="display:flex;gap:28px;padding:28px;background:var(--bg);align-items:flex-start"><div style="width:480px;display:flex;flex-direction:column;gap:10px">${EB('A locked cell · the panel explains, nothing to press')}<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px"><b style="font-size:15px">code.merge · [Frontend Builder]</b>${LOCKP}<div style="display:flex;justify-content:flex-end;gap:8px">${bG('Close')}${bX('Grant', 'Locked: a person merges')}</div></div></div><div style="width:480px;display:flex;flex-direction:column;gap:10px">${EB('A refusal from the Worker, inline with its code')}<div style="height:1010px;display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)">${GRANTP({ state: 'refused' }).replace('box-shadow:-12px 0 32px rgba(24,24,27,.08)', 'box-shadow:none;border-left:0')}</div></div></div>`);
    else if (B === 'SA12') html = ROOT(1440, 1000, SHELL(MAINP(MX({ exp: EXP10, load: 1 }), { sum: `${SK(520, 12)}`, hdr: { acts: bX(ICO.plus + 'Grant a capability…', 'Reading the agents') } }), { h: 1000, side: RAILC }));
    else if (B === 'SA12B') html = ROOT(1440, 1300, SHELL(MAINP(MX({ exp: EXP10, empty: 1 }), { sum: `<b style="color:var(--ink)">${AG.length} agents</b> in [Northwind Labs] · grants ${STC('nr')} no capability has been granted to any agent yet ${ENG()} · ${OFFERED} of ${GRANTABLE} offered in November 2026`, hdr: {} }), { h: 1300, side: RAILC }));
    else if (B === 'SA12C') html = ROOT(1440, 900, SHELL(MAINP(MX({ exp: EXP10, unread: 1 }), { sum: `Agents ${STC('un')} · ${OFFERED} of ${GRANTABLE} grantable capabilities offered in November 2026 ${ENG()}`, hdr: { acts: bX(ICO.plus + 'Grant a capability…', 'The agents could not be read') } }), { h: 900, side: RAILC }));
    else if (B === 'SA12D') html = ROOT(1440, 760, SHELL(PHDR({ acts: '' }) + BODY(SEG('Capabilities') + `<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:8px">${STC('rf')}<b style="font-size:15px;color:var(--ink)">Capability policies are shown to super admins only.</b><span style="font-size:13px;color:var(--body);max-width:640px;line-height:1.55">Nothing of the matrix is drawn, because the read was refused. That is not a claim that no capability is granted. A super admin can give you access: [Iris Chen].</span>${LNK('How HQ access is granted ›', 'font-size:13px;margin-top:4px')}</div>`), { h: 760, side: RAILC }));
    else if (B === 'SA12E') html = ROOT(1040, 0, `<div style="display:flex;gap:28px;padding:28px;background:var(--bg);align-items:flex-start">${[['Saving · the button says what is happening', 'saving'], ['Could not save · the panel keeps its text', 'failed']].map(([t, s]) => `<div style="width:480px;display:flex;flex-direction:column;gap:10px">${EB(t)}<div style="height:${s === 'failed' ? 960 : 880}px;display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)">${GRANTP({ state: s }).replace('box-shadow:-12px 0 32px rgba(24,24,27,.08)', 'box-shadow:none;border-left:0')}</div></div>`).join('')}</div>`);
    else if (B === 'SA13') html = ROOT(390, 844, PH1);
    else if (B === 'SA13B') html = ROOT(390, 844, PH2);
    else if (B === 'SA14') html = ROOT(1440, 1300, SA10(1300));
    else if (B === 'SA14B') html = ROOT(1440, 1300, SHELL(MAINP(MX({ exp: EXP10, sel: ['[Competitor Analyst]', 'fund.read'] })), { h: 1300, side: RAILC }) + OVER(GRANTP()));
    else if (B === 'SAPH') html = ROOT(1200, 0, HANDOFF);
    else html = ROOT(1440, 1300, SA10(1300));
    return { html: { __html: html } };
  }
}

</script>
</body>
