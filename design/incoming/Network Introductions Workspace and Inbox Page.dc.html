      <h3 style="margin-top:12px">Targets and states</h3><ul><li>Phone targets 44 px; the primary stays in a sticky bar.</li><li>Every status pairs a glyph with a word: ◷ Asked, ✓ Accepted, ✓✓ Made, ✕ Declined, ⊘ Withdrawn, ? Could not be read, ⊘ Refused, — Not recorded.</li><li>Sheets are modal dialogs labelled by their heading; Escape closes and returns focus.</li><li>Entered notes stay in the box after a failed save.</li></ul></div></div></div>`;
    }

    /* handoff */
    else if (B === 'NIDH') html = `<div class="${CV} doc"><div><span class="eye">Introductions desk, inbox and notification links · #7063 · handoff</span><h2 style="font-size:22px;margin-top:4px">What main does today, what is frontend only, and what needs the Worker</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>services/relationships.ts</code> <code>introRequests</code>: keyset pages on <code>(created_at, id)</code>, <code>totals</code> (sent, received, sent_pending, received_pending) over the whole filtered log, <code>has_more</code>, <code>next_cursor</code>. Default and maximum page 200. A bad cursor is 400 <code>cursor_invalid</code>; another team is 404.</li>
      <li><code>followUpsDueList</code> and <code>GET …/follow-ups-due</code>: the member’s own due follow-ups, independent of the log page.</li>
      <li><code>GET …/intro-requests/:uid</code> (#5310): the asker or the teammate only, else 404.</li>
      <li><code>routes/introductions.ts</code>: <code>GET /</code> (asks, investor only) and <code>GET /propositions</code> both <code>LIMIT 200</code>, no cursor, no total, no single-match read. No support-session refusal in the file.</li>
      <li><code>services/introDestination.ts</code> and <code>lib/introDestination.js</code>: <code>/network/introductions?intro=&lt;uid&gt;&amp;kind=request|proposition</code>.</li>
      <li><code>pages/relationships/IntroductionsDesk.jsx</code>: reads one page with no <code>limit</code> or cursor; Asked of you and Follow-ups are taken from that filtered page; <code>introMissing</code> fires when the uid is not on it, without a lookup.</li>
      <li><code>lib/pendingNext.js</code>: <code>RETURN_AFTER_LOGIN_PREFIXES</code> is <code>/learning</code> and <code>/grow</code>, so a signed-out link to <code>/network</code> lands on <code>/login</code> without <code>next</code>.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>The #6256 shell, header, four links, request sheet (NW3.1), Tie Sheet, state words and Eadwyn rail. NW3 and NW8.1 continue here as NW3-intro-desk.</li><li>Role rules: asks are investor only; support sessions are refused on <code>/api/relationships/*</code>.</li></ul></div>
      <div><h3>Frontend only</h3><ul><li>Asked of you from <code>status=pending</code> (or <code>totals.received_pending</code>) and Follow-ups due from <code>follow-ups-due</code>, both outside the history filters.</li><li>History with <code>limit=20</code>, “N shown of <code>totals</code>”, Load 20 more over <code>next_cursor</code>.</li><li>A linked request opens through <code>GET …/:uid</code>; “not available” only after its 404; a failed read is Unavailable with Retry.</li><li>Add <code>/network</code> to <code>RETURN_AFTER_LOGIN_PREFIXES</code>; restore filters, scroll and pages on return.</li><li>Needs you now strip, per-group counts and units, states, tablet, phone and dark.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇ #7063)</h3><ul><li>Cursor and whole-list total on <code>GET /api/introductions/propositions</code> and <code>GET /api/introductions</code>.</li><li><code>GET /api/introductions/propositions/:uid</code>, scoped to the caller, so an old match link opens directly.</li><li>Refuse support-session writes on <code>/api/introductions/*</code>.</li><li>Offer one stays #6637.</li></ul>
      <h3 style="margin-top:12px">Existing components</h3><ul><li><code>IntroductionsDesk</code>, <code>IntroRecordSheet</code>, <code>DraftFlow</code>, <code>SendUncertain</code>, <code>InvestorNetworkWorkspace</code>, the request sheet.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li><code>GET /propositions</code> also generates new matches when fewer than 3 are pending. Opening a link should not do that; #7064 owns it.</li></ul></div></div></div>`;


    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nid-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
