      '<div class="acx-conn">' + J(CONN.map(c => '<article class="acx-card"' + (detail && c[1] === 'Notion' ? ' style="border:2px solid #7c3aed"' : '') + '><div class="h"><span style="display:flex;gap:10px;align-items:center"><span class="acx-logo" aria-hidden="true">' + c[0] + '</span><h3>' + c[1] + '</h3></span>' + (c[2] ? st(c[2]) : '<span class="pl">Available</span>') + '</div><p class="l">' + c[3] + '</p><div class="f"><span></span>' + (c[4] ? '<button type="button" class="btn ' + (c[4] === 'Reconnect' ? 'p ' : '') + 'bsm">' + c[4] + '</button>' : '<span>—</span>') + '</div></article>')) + '</div>'
      + '<p class="foot">Slack shows Retry, not Connect: a failed status read is not the same as not connected.</p>');
    const connSheet = () => '<div class="dim1"></div><aside class="drw" role="dialog" aria-modal="true" aria-labelledby="cn" style="width:480px"><div class="drh"><div class="tr"><span class="eye">Connector</span><button type="button" class="ib" aria-label="Close Notion">✕</button></div><h2 id="cn">Notion</h2><div class="mt">' + st('Needs reconnect') + '<span class="mu">Access expired 3 Nov 2026</span></div></div><div class="drb"><section><h3>What it can do</h3><ul class="rz"><li><b>Read pages you share with Axal VC</b></li><li><b>Create pages from your briefs</b></li></ul></section><section><h3>History</h3><ul class="hist"><li><span>12 Sep</span>Connected by you</li><li><span>3 Nov</span>Notion refused the token (expired)</li></ul></section></div><div class="drf"><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn">Disconnect…</button><button type="button" class="btn p">Reconnect Notion</button></div></div></aside>';

    /* ---------- AC8 mobile ---------- */
    const phone = (title, body, back) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px"><div class="pt"><button type="button" class="pi" aria-label="' + (back ? 'Back to Account' : 'Menu') + '">' + (back ? '‹' : '☰') + '</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div></div></div>';
    const MOB = {
      AC08a: () => phone('Account', '<p style="font-size:13px;color:var(--mu)">Settings you manage for yourself.</p><div class="nt a"><span class="ic" aria-hidden="true">!</span><div>Add an authenticator app.</div></div><nav class="acx-pi" aria-label="Account sections"><span class="gh">Settings</span>' + J([['Profile and identity', 'Maya Lind · email verified', ''], ['Sign-in and security', 'No authenticator', st('Action needed', '1')], ['Privacy', 'Public profile on', ''], ['Notifications', 'In-app, email, push', ''], ['Billing and usage', 'Founder · Validate', ''], ['Connectors', '1 needs reconnect', st('Needs reconnect', '1')]].map(r => '<a href="#"><span>' + r[0] + '<small>' + r[1] + '</small></span>' + r[2] + '<span aria-hidden="true">›</span></a>')) + '</nav>'),
      AC08b: () => phone('Sign-in and security', '<button type="button" class="btn p" style="min-height:48px">Add authenticator app</button><div class="mc"><div class="r1"><b>Password</b>' + st('Active', 'Set') + '</div><small>Changed 14 Mar 2026</small></div><div class="mc"><div class="r1"><b>Authenticator app</b>' + st('Not set up') + '</div><small>Recommended</small></div><div class="mc"><div class="r1"><b>SMS codes</b>' + st('Verified') + '</div><small>+•• ••• ••• 4417</small></div><div class="mc"><div class="r1"><b>Safari · iOS 18</b></div><small>Last active 2 h ago</small><button type="button" class="btn" style="min-height:44px">Sign out…</button></div>', true),
      AC08c: () => phone('Profile and identity', '<div class="fld"><label for="m1">Display name</label><span class="acx-in" id="m1" style="min-height:44px">Maya L.</span><span class="acx-help">What members see.</span></div><div class="fld"><label for="m2">Username</label><span class="acx-in err" id="m2" style="min-height:44px" aria-invalid="true" aria-describedby="m2e">maya lind</span><span id="m2e" class="acx-err" role="alert">✕ Use letters, numbers and hyphens only.</span></div><div class="nt"><span class="ic" aria-hidden="true">i</span><div>Leaving with unsaved changes asks first.</div></div><div style="margin-top:auto;display:flex;gap:8px"><button type="button" class="btn" style="min-height:48px;flex:1">Cancel</button><button type="button" class="btn p" style="min-height:48px;flex:1">Save</button></div>', true),
      AC08d: () => phone('Billing and usage', '<div class="mc"><span class="eye">Plan</span><b>Founder · Validate</b><small>Next charge 1 Dec · €49.00</small></div><div class="mc"><span class="eye">AI tokens</span><b class="mo">41,200 / 100,000</b><small>Resets 1 Dec</small></div><div class="mc"><span class="eye">Payment method</span>' + UNR('Payment details unavailable') + '<small>Not the same as “no card”</small></div><button type="button" class="btn p" style="min-height:48px">Top up tokens</button>', true)
    };

    /* ---------- states matrix ---------- */
    const STS = [['Loading', '<div aria-busy="true" aria-label="Loading payment method" style="display:flex;flex-direction:column;gap:6px;width:100%"><span class="sk" style="height:12px;width:50%"></span><span class="sk" style="height:12px;width:80%"></span></div>'], ['Populated', 'Visa ending 4242'], ['Empty (read OK)', st('None', 'No payment method') + ' <button type="button" class="btn t bsm">Add card</button>'], ['Not recorded', NREC], ['Unreadable', UNR()], ['Partial', st('Partial', 'Plan read · card not read')], ['Saving', st('Saving', 'Saving…')], ['Saved', st('Saved', 'Saved 13:42')], ['Save failed', st('Save failed') + ' <button type="button" class="btn t bsm">Retry</button>'], ['Locked by plan', st('Locked', 'Included from Build') + ' <button type="button" class="btn t bsm">See plans</button>'], ['Forbidden', '<span class="mu">Your licence admin manages this.</span>']];
    const states = () => crop('<span class="eye">Required states for every card · never shown as zero, false or disconnected when the read failed</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STS.map(s => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13px">' + s[0] + '</h2></div><div style="font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + s[1] + '</div></section>')) + '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13px">Stale response</h2></div><p style="font-size:12.5px">A slow earlier save never overwrites a newer one; the switch shows the latest request’s result.</p></section></div>', 1300);

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd2, rows) => '<table class="dt"><thead><tr>' + J(hd2.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const ia = () => dk('<h1>Information architecture and navigation map</h1><p>Routes and the phone index are kept as they are today (<code>AccountCenter.jsx</code>, <code>accountPhone.js</code>). The redesign adds an Overview with status cards and makes the section nav persistent on desktop. The account menu keeps Portfolio, Companies and Licences (owner rule #3704); there is no licence switcher.</p><div class="acx-map">'
      + J([['Overview', '<code>/account</code><br>Status cards, one context-aware action'], ['Profile and identity', 'Route from <code>accountPathFor</code>, unchanged<br>Personal details · Legal identity · Public archetype'], ['Sign-in and security', '<code>/account/security-privacy</code><br>Methods · Recovery · Sessions'], ['Privacy', 'New section split from security-privacy<br>Audience groups · preview ' + '<span class="raw">(route to confirm)</span>'], ['Notifications', '<code>/account/notifications</code><br>Events × channels · push per browser'], ['Billing and usage', '<code>/account/billing</code>, <code>/account/usage</code><br>Plan · tokens · card · auto-reload · invoices'], ['Connectors', '<code>/account/connectors</code><br>Connected · available · coming soon · unknown'], ['Also kept', 'Portfolio, Following, Activity log, Appearance, Onboarding, Builder pages']].map(m => '<section><h3>' + m[0] + '</h3>' + m[1] + '</section>')) + '</div><h2>Observed vs inferred</h2><p>The brief’s findings were source-grounded, not a full authenticated walkthrough. These boards follow the code on current <code>main</code>; visual hierarchy issues remain hypotheses until the owner checks the live pages.</p>');
    const handoff = () => dk('<h1>Components, accessibility and handoff</h1>' + tbl(['Board area', 'Existing code', 'Status'], [
      ['Overview cards', '<code>AccountCenter.jsx</code> rows (planLine, followingLine)', 'Frontend: cards from each section’s own read; unreadable never becomes empty'],
      ['Profile and identity', '<code>AccountProfile.jsx</code>: account name, <code>display_name</code>, <code>profile_slug</code>, email/phone verification, identity keys <code>full_legal_name</code>, <code>date_of_birth</code>, <code>nationality</code>, <code>tax_residency_country</code>, latest archetype', 'Frontend; one editor per field (no duplicate editors); public preview from server fields ' + RV],
      ['Sign-in and security', 'Password, authenticator, SMS; trusted contacts (<code>auth_recover.ts</code>); sessions (<code>AccountDevices.jsx</code>)', 'Frontend guided steps; passkeys ' + BR + '; security fixes stay private (#4614)'],
      ['Privacy', 'Visibility fields on the profile', 'Frontend grouping by audience; route split ' + RV],
      ['Notifications', 'Events × in-app/email/push; push subscriptions per browser', 'Frontend per #4615’s effective contract; digest and quiet hours ' + BR],
      ['Billing and usage', '<code>BillingCards.jsx</code>, <code>AutoReloadCard.jsx</code>, <code>billing.ts</code>, <code>ai_budget.ts</code>', 'Frontend; “payment details unavailable” vs “no card” per #4617 / #3703'],
      ['Connectors', '<code>ConnectorSheet.jsx</code>, <code>connectorPageModel.js</code> (unreadable, unknown)', 'Frontend: no Connect on a failed status read (#4617)']])
      + '<h2>Accessibility</h2><p>Section nav is links with <code>aria-current</code>. Switches are <code>role="switch"</code> with names that include the event and channel. Each save announces through <code>role="status"</code>; failures use <code>role="alert"</code> tied to the field with <code>aria-describedby</code>. Dialogs trap focus and return it. Leaving with unsaved edits asks first. Phone rows are 56px and buttons 44–48px. Light and dark meet AA for body text; state is always a word plus a shape.</p><h2>Coordination</h2><p>#4614 (security, private), #4615 (notification preferences), #4616, #4617 (billing and connector states), #4618, #3703 (billing). No implementation task until the owner approves.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'AC00') html = ia();
    else if (B === 'AC01') html = page(overview(), { h: 760 });
    else if (B === 'AC01b') html = page(overview('states'), { h: 720 });
    else if (B === 'AC02') html = page(profile(false), { h: 1180 });
    else if (B === 'AC02b') html = page(profile(true), { h: 1100 });
    else if (B === 'AC03') html = page(security(), { h: 1050 });
    else if (B === 'AC03b') html = crop(enroll(), 640);
    else if (B === 'AC03c') html = crop(signout(), 560);
    else if (B === 'AC04') html = page(privacy(), { h: 980 });
    else if (B === 'AC05') html = page(notifications(), { h: 1000 });
    else if (B === 'AC06') html = page(billing(false), { h: 1100 });
    else if (B === 'AC06b') html = page(billing(true), { h: 1100 });
    else if (B === 'AC07') html = page(connectors(false), { h: 760 });
    else if (B === 'AC07b') html = page(connectors(true), { h: 760, overlay: connSheet() });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'AC09') html = states();
    else if (B === 'AC10') html = page(overview(), { h: 760 });
    else if (B === 'AC11') html = handoff();
    else html = page(overview(), { h: 760 });
    return { html: { __html: html } };
  }
}
