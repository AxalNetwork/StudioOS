      const sheetHead = (t, sub) => '<div><b style="font-size:17px">' + t + '</b>' + (sub ? '<div class="mu" style="font-size:12px">' + sub + '</div>' : '') + '</div>';
      const stepTag = (n, t) => '<span class="ptx-step">Step ' + n + ' · ' + t + '</span>';
      const MOB = {
      PTX10A: () => phone('Card 11 · The ask', stepTag(1, 'Notes helper') + slide('ask', 362) + '<div class="ps-fld"><label style="font-size:12px;font-weight:700">Speaker notes</label><div class="ps-in ps-ta foc" style="font-size:14px;min-height:110px">' + PRIV + '</div><small class="mu" style="font-size:12px;line-height:1.45">People who can open this deck in Axal VC see these notes. They leave Axal VC only in an export or link that includes them.</small><a href="#" style="font-size:12.5px;font-weight:700">Where notes go ›</a></div><p class="mu" style="font-size:12px">Notes and order only on a phone. Edit layouts on a larger screen.</p>', btn('Export…', 'p')),
      PTX10B: () => phone('Export v7', stepTag(2, 'Who it is for') + sheetHead('Who it is for', DECK + ' · v7, saved 25 Nov') + presetCards('inv') + '<b style="font-size:13px">Format</b>' + fmtList('pptx', { only: ['pdf', 'pptx', 'gs'] }) + '<span class="mu" style="font-size:11.5px">HTML and .odp below</span>', btn('Next · what leaves', 'p')),
      PTX10C: () => phone('Export v7', stepTag(3, 'What leaves') + sheetHead('Investor copy · PowerPoint') + '<button type="button" class="disc" aria-expanded="false" style="width:100%"><b>Preview</b><span>13 slides · 16:9 · notes not included</span><i aria-hidden="true">▾</i></button><ul class="ptx-dl ptx-dlp">' + drow('12 cards of v7', IN(), '') + drow('Speaker notes', OUT(), 'Notes on 9 cards stay here') + drow('Sources appendix', IN('Slide 13'), '5 figures; card 4’s SAM is not listed') + '</ul><div class="ptx-pm">' + J([['Editable', '33 text boxes · 2 charts · 1 diagram'], ['Picture', '1 chart (card 4) · 5 photos'], ['Smaller', 'Card 5’s long title']].map(r => '<div>' + chipFor(r[0]) + '<span>' + r[1] + '</span></div>')) + '</div>' + '<div class="ptx-gate ptx-gm" role="status"><div class="ps-ch"><b>v7 checked</b>' + st('Worth a look', '1 warning') + '</div><p>Card 4 · “SAM [$310M]” has no source.</p><b style="color:var(--amT)">Exporting with the warnings above confirmed.</b></div>', btn('Export PowerPoint · investor copy', 'p')),
      PTX10D: () => phone('Export v7', stepTag('3b', 'Working copy') + sheetHead('Working copy · PowerPoint', 'For [Noah Brandt]') + '<ul class="ptx-dl ptx-dlp">' + drow('Speaker notes', IN(), '9 cards, as speaker notes') + drow('Sources appendix', IN('Slide 13'), '5 figures') + '</ul>' + ackBox(true), btn('Export PowerPoint · working copy', 'p')),
      PTX10E: () => phone('Export v7', stepTag(4, 'Done') + done().replace('<h3 id="ptx-h-done" tabindex="-1">Exported PowerPoint of v7 · investor copy</h3>', '<h3 id="ptx-h-done" tabindex="-1">Exported · investor copy</h3>'), btn('Close', '')),
      PTX10F: () => phone('Export v7', stepTag(4, 'Failed') + '<div class="ps-card neg" role="alert"><b style="font-size:14px">The PowerPoint file could not be produced.</b><p style="font-size:12.5px">Try again in a moment. Nothing was shared.</p><span class="mo mu" style="font-size:11px">Reference: chart_shot_failed · slide 4 · 2 tries</span></div><ul class="ptx-dl ptx-dlp">' + drow('Kept', st('Version saved', 'Investor copy'), 'PowerPoint · v7 · notes not included · Sources included') + '</ul><p class="mu" style="font-size:12px">Nothing was recorded and no file was made. Try again uses the same settings.</p>', btn('Try again', 'p') + btn('Change settings', 'gh')),
    };
      html = MOB[B] ? MOB[B]() : dk('<h1>Unknown board</h1>');
    }

    return { html: { __html: html } };
  }
}

</script>
