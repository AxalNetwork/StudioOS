      <li><code>routes/founder_profile.ts</code> <code>GET /preview?audience=</code> (“What others see”) and <code>advisors_profile_draft.ts</code> (draft with revision check and publish): patterns for NRD06 and NRD04.</li>

      <div><h3>Backend required (◇ #7673, with #7672 and #7674)</h3><ul>

      <li>Requirement records: status, next actor, evidence references, review history, <code>decided_at</code>/<code>decided_by</code>, requester-visible explanation and internal note as separate fields.</li>

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nrd-' + x).join(' ') + '"');
    return { html: { __html: html } };
