    const dutiesCard = (o) => { o = o || {}; return card('Reporting duties', o.una ? '<div class="prm-note prm-error" role="alert"><b>' + st('una') + ' The duties read failed at 14:30 UTC.</b><p class="prm-small">The rights above and the cap table below are current. This is not “no duties”.</p></div>' + btn('Try again') : table('5 duties · from ' + CO + '’s duty table · kept from PFA02', ['Duty', 'Cadence', 'Due', 'Source', 'Paper', 'Holding route'], DUTIES.map(d => ['<b>' + d[0] + '</b>', d[1], d[2] + (d[3] ? '<small>' + st('def') + '</small>' : ''), lnk(d[4]), st(d[5]), d[6]])), '<a class="prm-link" href="#prm-main">Company Reports →</a>'); };

        + '<p class="prm-tag">After you ask</p>' + table('Your requests to record a right', ['Right', 'What you described', 'State'], [['Pro rata', 'Side letter of 3 Feb 2026, §2', st('req', '14 Nov 2026')]]), st('none', 'read succeeded'))

      + '<div class="prm-stack"><div class="prm-caseh"><b>b</b><h2>[Pelican Pay] · cap table not shared</h2></div><p class="prm-meta">Account › Portfolio › [Pelican Pay] · Financials · Ownership &amp; rights</p>' + pnav('Financials', true)
      + '<div class="prm-hold" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><span class="prm-label">Holding route</span><strong style="font-size:15px">Direct</strong><span class="prm-meta">Series A · 12 Feb 2026</span></div><div><span class="prm-label">Ownership % · as recorded 12 Feb 2026</span><strong class="prm-num">[5.0%]</strong><span class="prm-meta">invested [$1,250,000]</span></div></div>'
        + card('Reporting duties', table('2 duties · rights and duties still show', ['Duty', 'Due', 'Source'], [['Quarterly KPI report', '45 days after period end<small>' + st('def') + '</small>', lnk(IRA + ' §1.1(b)')], ['Annual audited statements', '120 days after period end', lnk(IRA + ' §1.1(c)')]]))
        + card('Investor cap table', '<div class="prm-empty" style="background:var(--raised)"><b>' + st('shared') + '</b><p>The founder has not shared [Pelican Pay]’s cap table with you. This is not an empty table: the founder grants access.</p><div class="prm-row">' + btn('Ask the founder for access…', true) + '</div><p class="prm-meta">After asking: “Asked. The founder answers on their Access tab.” One open ask per company; after a decline, once a day.</p></div>', st('ref'))

    /* ---------- portfolio positions register (PF-02) with request chips ---------- */
    const REG = [
      ['[Lumen Robotics]', '[$2,000,000]', '[8.5%]', '[$5,200,000]', '30 Sep 2026', 'Round price', ''],

      PRM24C: () => phone('Positions', '', phSheet(1, '<div class="prm-note">' + facts([['Company', CO + ' · fixed'], ['Latest mark', '[$2,400,000] · 31 Mar 2026'], ['Mark state', st('stale', '7 months')]]) + '</div><div class="prm-radio" role="radiogroup" aria-label="Kind"><label class="on" style="min-height:44px"><i aria-hidden="true"></i>New mark</label><label style="min-height:44px"><i aria-hidden="true"></i>Correction to the 31 Mar 2026 mark</label><label style="min-height:44px"><i aria-hidden="true"></i>Follow-on</label></div><div class="prm-field"><span>Reason · required</span><div class="prm-box tall">' + REASON + '</div><span class="prm-meta">Drafted by Eadwyn · you accepted it</span></div><div class="prm-field"><span>Evidence · optional ' + BK('evidence') + '</span>' + btn('Add a file or link', false, ' style="min-height:44px"') + '</div>', btn('Review request', true, ' style="min-height:48px"') + btn('Cancel', false, ' style="min-height:44px"'))),
      PRM24E: () => phone('Positions', '', phSheet(2, '<p class="prm-small">What HQ will see. Nobody else sees it.</p>' + facts([['Company', CO], ['Kind', 'New mark'], ['Reason', REASON], ['Evidence', '[Q3 board pack.pdf]']]) + meta('One open request per company, per investor.'), btn('Continue to confirm', true, ' style="min-height:48px"') + btn('Back', false, ' style="min-height:44px"'))),
      PRM24F: () => phone('Positions', '', phSheet(4, '<p role="status" class="prm-ok">✓ Requested 14 Nov 2026. HQ is told. You will see the answer here and on Positions.</p>' + facts([['Request', '<span class="prm-mono">[MR-0042]</span>'], ['State', st('req', '14 Nov 2026')]]), btn('Back to Positions', true, ' style="min-height:48px"'))),
      PRM24G: () => phone('Positions · HQ', '<p class="prm-meta">Account › Portfolio · HQ admin view</p><h1 style="font-size:22px">Open mark requests · 3</h1>' + J(QUEUE.map(q => '<article class="prm-pc"><div class="prm-row prm-between"><h3>' + q[0] + '</h3><span class="prm-meta">' + q[6] + '</span></div>' + facts([['Investor', q[1]], ['Kind', q[2]], ['Requested on', q[5]], ['Evidence', q[4]]]) + '<div class="prm-row">' + btn('Record a mark…', false, ' style="min-height:44px;flex:1"') + btn('Decline…', false, ' style="min-height:44px"') + '</div></article>')))
    };

    /* ---------- handoff ---------- */
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk"><h1>Handoff · rights beyond reporting duties, and request a mark (#6228)</h1><p>Continues the Portfolio v2 addendum (PFA01 to PFA17) as PFA18 onward; board keys carry the PRM prefix (PRM18 is PFA18). Decision part D4817-p10, to be confirmed when it lands. Checked on main <code>6d7712c6d1</code> (14 Nov 2026).</p>'
      + '<h2>Checked on main</h2>' + tbl(['Area', 'What main has', 'Status'], [
        ['Duties', '<code>GET /api/reporting/companies/:projectUid</code>; <code>reporting_duties</code> kind, cadence, due_rule, due_days, source_document, source_clause, source_kind (signed_envelope / closing_template), defaulted_json; investor gets <code>holding.route</code> only', 'Frontend only'],
        ['Duty registry', '<code>services/reportingDuties.ts</code> <code>INFORMATION_RIGHTS</code>: IRA §1.1(a)–(d), Term Sheet §2.2, deal-pack term sheet and side letter. Reporting clauses only; a blank due term takes <code>DEFAULT_DUE_DAYS</code>', 'Frontend only (duties); no other right'],
        ['Rounds and marks', '<code>GET /api/positions/:projectUid</code>: rounds, <code>cap_table_snapshot</code>, marks (as_of_date, fmv, post_money, event, basis, source, note); <code>POST …/:projectUid/marks</code> behind <code>requireAdmin</code>; bases round_price, secondary, gp_estimate, write_down, cost', 'Frontend only'],
        ['Cap table share', '<code>GET /api/captable/access/:projectId</code> refuses when not shared; <code>POST …/:projectId/ask</code> exists (“Asked. The founder answers on their Access tab.”)', 'Frontend only, including Ask the founder'],
        ['Company page', '<code>PortfolioCompanyPage.jsx</code>: Financials holds Ownership &amp; rights at <code>#ownership-rights</code>; …/terms redirects there', 'Frontend only (layout)'],
        ['Admin marks', '<code>PortfolioPositionsPage.jsx</code> records a mark with an inline form; PF-07 (#5854) is not on main', 'Waits on #5854'],
        ['Pro rata offer', '<code>raise_pro_rata</code> (offered / taking / waived / expired) read only by <code>requireRaiseUser</code>', 'Backend required']])
      + '<h2>Backend required (◇)</h2><p>The rights table: pro rata, information rights, board seat, observer seat, liquidation preference, anti-dilution, each with type, document, clause and terms, captured at closing. Reading a clause from a signed document (Eadwyn’s proposal on PFA18). A request to record a right (PFA18, PFA19). The investor’s own pro rata offer and the link to the round. Mark requests: #6205 adds <code>portfolio_mark_requests</code> with Requested and Resolved; this canvas also needs Declined with a reason, evidence (file or link), and a stored link to the answering mark.</p>'
      + '<h2>Pending the owner (⚑, option A drawn)</h2><p>All six rights stored as typed rows · investors may request a mark, one open per company per investor · evidence optional · Declined joins #6205 with a link to the answering mark · investors read their own pro rata offer. D5129 Q2 (the failed-read word): drawn as Unavailable; the brief says Unreadable.</p>'
      + '<h2>Frontend only</h2><p>The PFA18 rights layout over today’s duties and cap table (rights rows stay hidden until the table exists), the holding line, PFA21 to PFA23 over #6205 once it lands, phone cards, the Request Sheet steps, and the dark tokens.</p>'
      + '<h2>Navigation</h2><p>Right → its signed document · Reporting duties → company Reports tab · Pro rata → the live round ◇. Request → Receipt → Positions with the Requested chip. Admin Receipt → request Answered, linked to the new mark.</p>'
      + '<h2>Accessibility</h2><p>Tables have captions and scoped headers; every state is a word with a glyph; the Sheet traps focus, returns it to the Stale chip or row button, and announces results with role=status / role=alert. Phone targets 44px, commit buttons 48px, no table wider than the screen. Not claimed from screenshots.</p></div></div>';

    /* ---------- route ---------- */
    let html = '';
    if (B === 'PRM18') html = page(rightsPage(), { h: 2050, rail: eadRights() });
    else if (B === 'PRM18D') html = page(rightsPage(), { h: 2050, rail: eadRights() });
    else if (B === 'PRM19') html = crop('<span class="prm-tag">Ownership &amp; rights · nothing recorded · two cases side by side, each on its company’s Financials tab · empty states, not errors</span>' + emptyCases(), 1440);
    else if (B === 'PRM20') html = page(posFrame(register({ sel: true })), { h: 1120, overlay: '<div class="prm-dim"></div>' + prep() });
    else if (B === 'PRM20B') html = crop(dlg('Review · what HQ will see', steps(2), reviewBody(), btn('Back') + btn('Continue to confirm', true)), 680);
    else if (B === 'PRM20C') html = crop(dlg('Confirm · send to HQ', steps(3), confirmBody(), btn('Back') + btn('Send request for ' + CO, true)), 680);
    else if (B === 'PRM20R') html = crop(dlg('Request sent', steps(4), receiptBody(), btn('Open mark history') + btn('Back to Positions', true)), 680);
    else if (B === 'PRM21') html = page(posFrame(register({ chip: 'req', sel: true })), { h: 1000, overlay: '<div class="prm-dim"></div>' + historySheet() });
    else if (B === 'PRM21B') html = crop(chipSpec(), 1400);
    else if (B === 'PRM22') html = page(adminPos(), { h: 1100, admin: true, rail: eadAdmin() });
    else if (B === 'PRM22D') html = page(adminPos(), { h: 1100, admin: true, rail: eadAdmin() });
    else if (B === 'PRM22B') html = crop(recordPrep(), 720);
    else if (B === 'PRM22C') html = crop(recordReceipt(), 720);
    else if (B === 'PRM22E') html = crop(declineSheet(), 720);
    else if (B === 'PRM23') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PRMH') html = handoff();
    else html = page(rightsPage(), { h: 2050, rail: eadRights() });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
