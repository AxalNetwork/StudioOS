    const TOC = `<aside class="toc"><nav aria-label="Table of contents"><h2>Contents</h2>${J(SECTIONS.map((s, i) => `<a href="#"${i === 1 ? ' aria-current="true"' : ''}>${s}</a>`))}</nav></aside>`;
