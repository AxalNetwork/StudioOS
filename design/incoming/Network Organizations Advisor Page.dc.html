class Component extends DCLogic {
  renderVals() {

    /* ---------- sample data: fictional; every figure agrees on every board ----------
       Today Mon 16 Nov 2026. Advisor [Ada Okafor], practice [Okafor Advisory].
       12 accepted relationships = 10 counterparts with a linked company (7 companies) + 2 without one.
       Two different people are both named [Jules Avery]; both are at [Quill Analytics] and count as 2. */
    const PPL = [
      { id: 'mv', n: '[Morgan Vale]', i: 'MV', r: 'Founder', ty: 'Advisor · founder', co: '[Tidepool Labs]', lt: '2026-11-12', d: 4 },
      { id: 'ls', n: '[Lena Sato]', i: 'LS', r: 'Founder', ty: 'Advisor · founder', co: '[Kelp Bio]', lt: '2026-11-06', d: 10 },
      { id: 'tg', n: '[Theo Grant]', i: 'TG', r: 'Founder', ty: 'Advisor · mentee', co: '[Kelp Bio]', lt: null },
      { id: 'ic', n: '[Iris Chen]', i: 'IC', r: 'Investor', ty: 'Co-investor', co: '[Harbor Lane Capital]', lt: '2026-10-28', d: 19 },
      { id: 'ja1', n: '[Jules Avery]', i: 'JA', r: 'Founder', ty: 'Advisor · founder', co: '[Quill Analytics]', lt: '2026-10-21', d: 26 },
      { id: 'ja2', n: '[Jules Avery]', i: 'JA', r: 'Partner', ty: 'Operator partner', co: '[Quill Analytics]', lt: null },
      { id: 'pn', n: '[Priya Nair]', i: 'PN', r: 'Founder', ty: 'Advisor · founder', co: '[Loomcraft]', lt: '2026-10-02', d: 45 },
      { id: 'tb', n: '[Tom Becker]', i: 'TB', r: 'Partner', ty: 'Operator partner', co: '[Northstar Capital]', lt: '2026-09-30', d: 47 },
      { id: 'hb', n: '[Hugo Brandt]', i: 'HB', r: 'Investor', ty: 'Co-investor', co: '[Northstar Capital]', lt: null },
      { id: 'al', n: '[Ari Lane]', i: 'AL', r: 'Founder', ty: 'Advisor · mentee', co: '[Elm Studio]', lt: '2026-08-19', d: 89 },

    const LINKED = PPL.filter((p) => p.co);

    /* companies, counted over distinct counterpart ids, most people first then by name */
    const ORGS = [...new Set(LINKED.map((p) => p.co))].map((co) => {
      const ps = LINKED.filter((p) => p.co === co);
      const ids = new Set(ps.map((p) => p.id));
      const dated = ps.filter((p) => p.lt).sort((a, b) => (a.lt < b.lt ? 1 : -1));
      const types = {};
      ps.forEach((p) => { types[p.ty] = (types[p.ty] || 0) + 1; });
      return { co, ps, c: ids.size, lt: dated[0] ? dated[0].lt : null, d: dated[0] ? dated[0].d : null, types };

    /* ---------- shell: practice switcher top-left, sidebar = held licences (advisor), Account menu holds Portfolio, Companies, Licences ---------- */
    const NAV = ['Home', 'Practice', 'Cohorts', 'Expertise', 'Network', 'Research', '|', 'Trust', 'Practice Settings'];
    const side = `<aside class="sd"><div class="lg"><span class="logo" aria-hidden="true"></span>Axal VC</div><button type="button" class="sw2" aria-haspopup="listbox" aria-label="Switch practice or project: [Okafor Advisory]">[Okafor Advisory] <span aria-hidden="true">▾</span></button><span class="eye grp">Advisor</span><nav aria-label="Advisor">${J(NAV.map((t) => t === '|' ? '<div class="sep"></div>' : `<a href="#"${t === 'Network' ? ' aria-current="page"' : ''}>${t}</a>`))}</nav></aside>`;
    const top = `<div class="tb"><div class="srch"><span aria-hidden="true">⌕</span>Search StudioOS</div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="ib" aria-label="Notifications">${bell}</button><button type="button" class="av" style="border:0" aria-label="Account menu: Portfolio, Companies, Licences">AO</button></div></div>`;

    const TABS = (cur) => `<nav class="ptabs" aria-label="Network">${J(['Relationships', 'Introductions', 'Organizations'].map((t) => `<a href="#"${t === cur ? ' aria-current="page"' : ''}>${t}</a>`))}</nav>`;
    const HEAD = (o) => `${o.crumb ? `<nav aria-label="Breadcrumb" class="foot">${o.crumb}</nav>` : ''}<header class="hdr"><span class="eye">${o.eye || 'Network · Work my relationships'}</span><div class="hrow"><div><h1>${o.h1 || 'Organizations'}</h1><p>${o.sub || 'Companies linked on the accounts of people you have an accepted relationship with.'}</p></div><div class="acts">${o.acts !== undefined ? o.acts : `<button type="button" class="btn ask">${E}Ask</button>`}</div></div></header>${o.tab === false ? '' : TABS(o.tab || 'Organizations')}`;
    const pager = (a, b, tot) => `<div class="pg"><span>${a}–${b} of ${tot}</span><div class="pb"><button type="button" aria-label="Previous page" aria-disabled="true">‹</button><button type="button" aria-current="page">1</button><button type="button" aria-label="Next page" aria-disabled="true">›</button></div></div>`;

    /* ---------- directory pieces ---------- */
    const SUMLINE = `<div class="line"><span><b class="mo">${N.orgs}</b> companies · <b class="mo">${N.linked}</b> people with a linked company · <b class="mo">${N.unlinked}</b> without one · from <b class="mo">${N.ties}</b> accepted relationships</span><span class="foot">Read 09:14 today</span></div>`;
    const TOOLS = (q, focus) => `<div class="tools"><label for="oq" class="sr">Search companies and people</label><div class="inp noa-q${focus ? ' fv' : ''}" id="oq" role="searchbox" aria-label="Search companies and people">${q ? `<span style="color:var(--ink)">${q}</span><button type="button" class="lk" aria-label="Clear search" style="margin-left:auto">✕</button>` : '<span>Search companies or people</span>'}</div><button type="button" class="dd" aria-haspopup="listbox">Sort: Most people ▾</button><span class="foot" style="margin-left:auto">Only accepted relationships. Pending requests are in Relationships.</span></div>`;

    const REFNOTE = `<div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Affiliation is not referral credit.</b> A company here is the one linked on the other person’s own account. A company typed on a referral is text and is not used here; it does not show who referred a client or who earned credit. <a href="#">Referrals you have made →</a></div></div>`;
    const DIRECTORY = (o) => {
      o = o || {};
      const rows = o.q ? ORGS.filter((x) => x.co === '[Quill Analytics]') : ORGS;

      <table class="tbl"><thead>${DIRHEAD}</thead><tbody>${J(rows.map((x) => dirRow(x, o.focus && x.co === '[Quill Analytics]')))}</tbody></table>${pager(1, rows.length, rows.length)}
      <div class="cf"><span class="foot">Known people counts distinct accounts, not names: the two people named [Jules Avery] count as 2. One company per person.${o.ann ? ' ' + TO('Q1 · A, one company per person') : ''}</span></div></section>
      ${o.q ? '' : UNLINKCARD()}${REFNOTE}`;
    };

    /* ---------- company detail ---------- */
    const DETAILHEAD = `<tr><th scope="col">Person</th><th scope="col">Relationship type</th><th scope="col">Company source</th><th scope="col">Last recorded interaction</th><th scope="col"><span class="sr">Actions</span></th></tr>`;

      <div><a class="btn t noa-back" href="#">‹ Back to Organizations</a></div>

      <table class="tbl"><thead>${DETAILHEAD}</thead><tbody>${J(QUILL.ps.map((p) => detRow(p, o.cur && p.id === 'ja2')))}</tbody></table>
      <div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Two people, one name.</b> Both are named [Jules Avery]. They are different accounts, so each has its own row and its own relationship record. Role and relationship type tell them apart; no account id or email is shown.</div></div></section></div>

      <h3 style="margin-top:12px">Data source and counts</h3><ul><li>Source: <code>GET /api/partnernet/relationships</code>, accepted rows, grouped on <code>other.company</code>. Every row says “Linked on their account”.</li><li>Known people: distinct <code>other.id</code> per company, never distinct names (2 for the two [Jules Avery]).</li><li>Companies: distinct company names today, distinct profile ids once #7054 ships.</li><li>Without a linked company: rows with <code>company = null</code> and no <code>companies_unreadable</code> flag.</li><li>Latest recorded interaction: the newest <code>last_interaction_at</code> among the company’s people; none is Not recorded, never a date guess.</li><li>Sample: 12 accepted = 10 linked (7 companies: 2+2+2+1+1+1+1) + 2 without.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>The Network shell, header, state words, tables, Sheet and phone pieces copied from the approved investor addendum (#6256, NW4 and NW4.1); the advisor sidebar and accent from the Advisor Network canvas.</li></ul></div>
      <div><h3>Backend required (◇)</h3><ul><li>A company profile id on <code>other.company</code> (#7054, the Worker addition there), so two companies with one name stay two rows and the detail URL is stable. Until then the frontend keys a company by its name and two such companies merge.</li></ul>
      <h3 style="margin-top:12px">Owner pick drawn (⚑)</h3><ul><li>Q1 · A, one company per person, as <code>companiesOf</code> picks it ([Lena Sato] shows under [Kelp Bio] only, though she also runs [Quill Analytics]). B would list every company linked on a person’s account and needs a Worker change.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Replace the dashed card with the directory and company detail, grouped on the existing response.</li><li>Count by <code>other.id</code>; show role and type beside a repeated name.</li><li>The Person Sheet, the deep link to a card in the Relationship book (<code>?rel=&lt;id&gt;</code>, which the rows already carry) and focus return.</li><li>Keep search, sort and the opened company in the URL and history state.</li><li>States: loading, None, accepted with none linked, no matches, companies unreadable (from the flag) and tie read failed (503), each with its next action.</li><li>Show <code>last_interaction_at</code> on the Relationship book too.</li></ul>
      <h3 style="margin-top:12px">Kept out on purpose</h3><ul><li>Pending, declined and withdrawn requests; <code>GET /api/companies</code> (every public profile); email domains; companies typed on referrals; any referral credit or revenue.</li></ul>
      <h3 style="margin-top:12px">Accessibility</h3><ul><li>States pair a glyph with a word. Sheets are modal dialogs with a labelled heading. Phone targets are 44px.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>The Person Sheet lists no interaction history. <code>GET /relationships/:id/interactions</code> exists on main if the sheet should show it later.</li></ul></div></div></div>`;

    /* prefix: generic classes reuse the approved investor addendum styles (nwi-), new ones are noa- */
    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('noa-') === 0 ? x : x === 'adv' ? 'noa-adv' : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
