      <div class="cols"><div><h3>Keyboard order in the sheet</h3><ul><li>✕ → Back to Overview link (when opened from there) → follow-ups (checkboxes, then the Add form) → note box → Save note → older history → Ask → Add follow-up → Request introduction.</li><li>Escape always asks first when there are unsaved edits; inside the decision it means Keep editing.</li><li>Focus returns to the opener: the row’s Open on the same page, or the next row if that row left the list.</li></ul></div>
      <div><h3>Phone keyboard</h3><ul><li>Opening the note scrolls it above the keyboard; the sticky bar rides on the keyboard with Save note.</li><li>Back on the phone is the same as ✕: it asks first.</li><li>Targets are 44 px; the primary is full width.</li></ul></div></div></div>`;
    }

    /* ===== Handoff ===== */
    else if (B === 'NRUH') html = `<div class="${CV} doc"><div><span class="eye">Network › Relationships · founder follow-ups and Person Sheet · #7059 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>pages/founder/FounderNetworkDesk.jsx</code>: the overview asks <code>followUpsDue(3)</code>; each row’s Open and the “All N in Relationships” link go to <code>/network/relationships</code> with no contact or task, so the book opens unfiltered on page 1.</li>
      <li><code>services/linkedinCsvImport.ts</code> <code>followUpsDueOf</code>: rows carry <code>task_uid</code> and <code>contact.id</code>; <code>FOLLOW_UPS_DUE_MAX = 20</code>, no offset; <code>total</code> counts every overdue follow-up. <code>bookOf</code>: <code>BOOK_PAGE = 50</code>, ordered by name.</li>
      <li><code>notesOf</code> and <code>tasksOf</code>: <code>LIMIT 200</code> each; tasks are ordered open first, so done ones fall behind 200 open ones. <code>setTaskDone</code> keeps the first <code>done_at</code>; <code>addNote</code> and <code>addTask</code> write a new row each call.</li>
      <li><code>pages/founder/FounderRelationshipBook.jsx</code>: the sheet’s contact is found in the current filtered page (lines 71–75), so it closes when a completed task drops the person from “Has open follow-up”. A first close warns about an unsaved note only; a second close discards it. Save note has no busy state and clears the box after saving. Request introduction is a plain link. Filter, page and scroll are component state, not URL.</li>
      <li><code>relationshipBookModel.js</code>: <code>contextLine</code>/<code>historyRows</code> call any non-typed source “Imported”; a person matched by an import after being added by hand reads as imported.</li>
      <li><code>ui/Sheet.jsx</code>: dialog, focus trap and focus return to the opener.</li></ul>
      <h3 style="margin-top:12px">Preserved from the approved canvases</h3><ul><li>NW1 tiles and “Relationships needing attention” (B1: overdue only), NW2 columns, the NW2.1 Person Sheet sections and footer, NW5 state words, the #6256 shell and header.</li><li>New boards are numbered NWR4.1–NWR4.14 (Relationships brief 4); keys carry NRU.</li></ul></div>
      <div><h3>Backend required (◇ #7059)</h3><ul><li>Read one contact by id (and its position in the book), so a link opens a person past page one.</li><li>Page through every overdue follow-up (offset or cursor) beyond 20.</li><li>A follow-up read across the book by state (due today, later, no date, done in 30 days) for the queue.</li><li>A cursor for notes older than the newest 200, and done follow-ups read on their own.</li><li>An idempotency key on <code>POST /book/:id/notes</code> and <code>/tasks</code>, so Save again writes once.</li></ul>
      <h3 style="margin-top:12px">Owner pick drawn (⚑)</h3><ul><li>Drafts survive a reload in this tab only (session storage), option A. Option B: keep them per device until discarded.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Deep links <code>?contact=&amp;task=&amp;from=</code>; the selected follow-up; the sheet held by id; the pending-edits decision on every exit; busy states; text typed during a save kept; queue filter, page and scroll in the URL and history state; focus return to the next row; labels for added, matched by import, note written and follow-up completed.</li></ul>
      <h3 style="margin-top:12px">Accessibility</h3><ul><li>Each follow-up state pairs a glyph and a word: ◷ Overdue, ● Due today, ○ Due, □ No due date, ✓ Done.</li><li>The decision is an alertdialog that names both drafts; Keep editing takes focus.</li><li>Results go to a polite live region; failures use role=alert.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Whether Done in the queue covers 30 days or all time.</li><li>Threshold examples (27 overdue, 246 notes, 205 open) are review fixtures.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nru-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
