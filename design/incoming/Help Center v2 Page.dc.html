.hcv-da .h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--hair);background:var(--raised)}
.hcv-da h2{font-size:14px;font-weight:800}
.hcv-da .h span{font:600 11px var(--mo);color:var(--mu)}
.hcv-da li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--hair);font-size:12.5px;min-height:32px}
.hcv-da li:last-child{border-bottom:0}
.hcv-da li a{color:var(--ink)!important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcv-da li.dm a{color:var(--mu)!important;opacity:.7}
.hcv-da li .np{font:500 10.5px var(--mo);color:var(--mu)}

.hcv-tot>div{padding:12px 16px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:3px}
.hcv-tot>div:last-child{border-right:0}
.hcv-tot b{font:700 18px var(--mo)}
.hcv-tot small{font-size:11.5px;color:var(--mu)}
.hcv-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.hcv-tbl th{text-align:left;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:8px 12px;border-bottom:1px solid var(--hair);background:var(--raised);white-space:nowrap}
.hcv-tbl td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
.hcv-tbl td.n{font-family:var(--mo);text-align:right}
.hcv-tbl th.n{text-align:right}
.hcv-tbl td.fl{border-left:1.5px dashed #a78bfa;border-right:1.5px dashed #a78bfa;background:var(--lav);color:var(--mu);font-style:italic}
.hcv-tbl th.fl{border-left:1.5px dashed #a78bfa;border-right:1.5px dashed #a78bfa;color:var(--vt)}
.hcv-ml{display:flex;flex-direction:column}
.hcv-ml li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;padding:10px 16px;border-bottom:1px solid var(--hair);font-size:12.5px}
.hcv-ml li .mo{font-size:11.5px;color:var(--mu)}
.hcv-ml li small{grid-column:2;color:var(--mu);font-size:11.5px}
.hcv-sec{background:var(--card);border:1px solid var(--hair);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.hcv-sec>.h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.hcv-sec>.h h3{font-size:14px;font-weight:800}
.hcv-sec>.f{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--raised);font-size:12px;color:var(--mu)}
/* phone */
.hcv-acc{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:12px;background:var(--card);overflow:hidden}
.hcv-acc a,.hcv-acc button{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border:0;border-bottom:1px solid var(--hair);background:transparent;font:700 14px var(--sg);color:var(--ink)!important;text-align:left;width:100%}
.hcv-acc a:last-child,.hcv-acc button:last-child{border-bottom:0}
.hcv-acc small{font:600 11px var(--mo);color:var(--mu)}
.hcv-stk{position:absolute;left:16px;right:16px;bottom:16px;z-index:3}
.hcv-stk .btn{width:100%;min-height:48px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.hcv-bsh{position:absolute;left:0;right:0;bottom:0;top:64px;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);z-index:5;display:flex;flex-direction:column}
.hcv-bsh .gr{width:40px;height:4px;border-radius:999px;background:var(--hair2);margin:8px auto 0}
.hcv-bsh .hcv-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;border-bottom:1px solid var(--hair)}
.hcv-bsh .bd2{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:hidden}
.hcv-bsh .hcv-ft{padding:12px 16px 20px;border-top:1px solid var(--hair);display:flex;gap:8px}
.hcv-bsh .hcv-ft .btn{flex:1;min-height:48px}
.hcv-ph .hcv-ch2{grid-template-columns:1fr}
.hcv-ph .hcv-field{min-height:48px}
/* docs */
.hcv-dk table.dt td:first-child{width:220px}
.hcv-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hcv-dk ol.n{list-style:decimal;padding-left:20px;font-size:13px;line-height:1.6;color:#3f3a49}
.hcv-dk ul.b{list-style:disc;padding-left:20px;font-size:13px;line-height:1.6;color:#3f3a49}
.hcv-dk code{font:500 11.5px var(--mo);background:#f4f3f7;padding:1px 4px;border-radius:4px}
.hcv-ac>.hcv-ap,.hcv-stc .hcv-ap{align-self:flex-start}
.hcv-res li.gap{display:block;padding:9px 16px;font:500 11.5px var(--mo);color:var(--mu);background:var(--raised)}
.hcv-rail .hcv-rh span.hcv-re{display:grid}

          ['Still stuck?', 'Private security report opens the code-host advisory; chat only when <code>canUseCustomerChat</code>; status line hidden while loading, grey when unreadable']])
        + '<div class="hcv-cols"><div><h2>Preserved</h2><ul class="b"><li>The 12-area content model and one page per guide at <code>/help/&lt;section&gt;/&lt;guide&gt;</code></li><li>Ticket detail screens from the older canvas (H3–H7)</li><li>Every refusal message as the Worker words it</li></ul><h2>Frontend only</h2><ul class="b"><li>Search under the title, area chips, arrow keys, “First 25 results” (#4640)</li><li>Guide page column, Go to as primary, owner and review</li><li>Next steps after No; ticket sheet carrying link and words</li><li>Security choice in the sheet (same endpoint)</li><li>Role filter that dims; phone, tablet, dark</li></ul></div><div><h2>Backend required ◇</h2><ul class="b"><li>Broken-link and stale-guide flags (no store)</li><li>Searches that found nothing (not recorded)</li><li>Eadwyn drafting a ticket from a note</li><li>First verified dates (a verification pass, #4641)</li><li>An exact match total with Show more</li></ul><h2>Open questions ⚑ (option A drawn)</h2><ul class="b"><li>Group by the 12 recorded areas, or new goal groups</li><li>Admin review on /help, or /help/admin/content</li><li>Eadwyn suggests and answers only, or also drafts tickets</li><li>“First 25 results”, or an exact total with Show more</li><li>Security form in the Help sheet, or Trust Center only</li></ul></div></div>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'HCV01') html = page(home(), { h: 1600, rail: suggest() });
