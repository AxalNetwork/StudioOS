      ${stcard('Eadwyn quote', 'Ask Eadwyn to draft from this record', `<div class="cost"><span>Quoted before drafting</span><b>holds up to $[0.0040]</b></div><div class="acts"><button type="button" class="btn">Draft the reason</button><button type="button" class="btn t">Cancel</button></div><p class="foot">The draft goes into the reason only (Dev reads it), never the context. You send.</p>`, 'c4')}
      ${stcard('Reason missing', 'Ask Dev for an introduction', `<div class="f"><label for="rr">Why you’d like the introduction · required</label><span id="rr" class="in ta hint"></span><span class="foot" id="rrh">Write a reason: Dev reads it before deciding.</span></div><div class="acts"><button type="button" class="btn p" aria-disabled="true" aria-describedby="rrh">Send request to Dev</button></div>`, 'c4')}
      ${stcard('Investor licence', 'Not this flow', `<p class="sub">Curated matches (credits) and Ask Axal (quarterly asks) stay on Introductions. This sheet only asks a teammate and never spends a credit or an ask.</p><p class="foot">Credit-based flows: #6636, #6637.</p>`, 'c4')}</div>`);

    /* ===== W9 · tablet 768 ===== */
    else if (B === 'NRT09') html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ tab: 'Relationships', h1: 'Relationships', sub: 'The people you know.' })}
      <section class="cd"><div class="ch"><h2>My relationships</h2><span class="sm">142 people</span></div><table class="tbl"><tbody>${J(BOOK.slice(0, 6).map((r, i) => `<tr${i === 0 ? ' class="cur"' : ''}><td><b>${r[0].n}</b><small>${r[0].t}</small></td><td>${r[0].co}</td><td>${r[3]}</td></tr>`))}</tbody></table></section></main>
      <div class="dim" aria-hidden="true"></div>${PSHEET(MV1, WK.many(MV1), { w: 470 })}</div>`;

    /* ===== W10 · phone 390 ===== */
    else if (B === 'NRT10A') html = phone('[Ari Lane]', `<span class="eye">Relationship</span><h1 style="font-size:20px;font-weight:800">[Ari Lane]</h1><p class="sub">Head of Partnerships · [Tidepool Labs]</p><p class="sub">Added by you · 2026-10-04. Relationship strength: <b>Not recorded</b>.</p>${WK.one(AL)}<div class="sec"><h3>Private notes</h3><p class="foot">No notes yet.</p></div>`, '<button type="button" class="btn">Add follow-up</button><button type="button" class="btn p">Ask [Dev]</button>', { back: 1 });
    else if (B === 'NRT10B') html = phone('Request introduction', `<h1 style="font-size:20px;font-weight:800">Who should you ask?</h1><p class="sub">[Morgan Vale] · Partner, [Harbor Seed]</p><div role="radiogroup" aria-label="Teammate" style="display:flex;flex-direction:column;gap:8px">${J(KN.map((k, i) => knowRow(k, MV1, { radio: 1, on: i === 0 })))}</div><p class="foot">One teammate receives each request.</p>`, '<button type="button" class="btn p">Continue with [Dev]</button>', { back: 1 });
    else if (B === 'NRT10C') html = phone('Ask [Dev]', `<div class="pc"><span class="eye">To</span><b>[Dev Varma] only · [Kelp Bio]</b><span class="eye">About</span><span>[Morgan Vale] · Partner, [Harbor Seed]</span></div><div class="f"><label for="pr">Why you’d like the introduction · required</label><span id="pr" class="in ta" style="min-height:96px">${REASON}</span><span class="cnt">Dev sees this</span></div>`, '<button type="button" class="btn p">Send request to [Dev]</button>', { back: 1, kb: 1 });
    else if (B === 'NRT10D') html = phone('Request sent', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Sent to [Dev Varma] · ${mo(SENT_AT)}.</b> Dev decides. Nothing reaches [Morgan Vale] unless Dev writes the introduction.</div></div><div class="pc"><span class="eye">Status</span><span><span class="pl">◷ Asked</span> · not accepted, not made</span><span class="eye">Your reason</span><span>“${REASON}”</span></div><a class="btn t" href="#" style="min-height:44px;align-self:flex-start">Open in Introductions →</a>`, '<button type="button" class="btn p">Back to [Morgan Vale]</button>', { back: 1 });
    else if (B === 'NRT10E') html = phone('[Jules Avery]', `<span class="eye">Relationship</span><h1 style="font-size:20px;font-weight:800">[Jules Avery]</h1><p class="sub">Advisor · [Loomcraft]</p>${WK.name(JA)}<div class="sec"><h3>Private notes</h3><p class="foot">No notes yet.</p></div>`, '<button type="button" class="btn">Add follow-up</button>', { back: 1 });

    /* ===== W11 · dark ===== */
    else if (B === 'NRT11') html = shell('f', RELPAGE(0), { h: 1000, overlay: `${PSHEET(MV1, WK.many(MV1), { dirty: 1, w: 520, right: 500 })}<div class="dim2" aria-hidden="true"></div>${ASKSHEET({})}` });
    else if (B === 'NRT11B') html = phone('[Morgan Vale]', `<span class="eye">Relationship</span><h1 style="font-size:20px;font-weight:800">[Morgan Vale]</h1><p class="sub">Partner · [Harbor Seed]</p><div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Unsaved note.</b> Your note is kept while you ask for the introduction.</div></div>${WK.many(MV1)}`, '<button type="button" class="btn">Add follow-up</button><button type="button" class="btn p">Request introduction</button>', { back: 1 });

    /* ===== W12 · prototype map and accessibility ===== */
    else if (B === 'NRT12') html = `<div class="${CV} doc"><div><span class="eye">Network › Relationships · #7060 · prototype</span><h2 style="font-size:22px;margin-top:4px">How the frames link, where focus goes, and what is announced</h2></div>
      <div class="flow">
      <div><b>${PIN(1)} Person Sheet</b><code>NRT01 · NRT02</code><span>Opens from a row. The lookup runs on open when an identifier is recorded.</span></div>
      <div><b>${PIN(2)} Who should you ask?</b><code>NRT04 · NRT10B</code><span>Only with 2–3 teammates. One teammate skips to 3.</span></div>
      <div><b>${PIN(3)} Ask sheet</b><code>NRT04 · NRT04B · NRT10C</code><span>Target, recipient, reason; Send request to Dev.</span></div>
      <div><b>${PIN(4)} Request sent</b><code>NRT04 · NRT10D</code><span>Back to the Person Sheet, or Open in Introductions.</span></div>
      <div><b>${PIN(5)} Introductions</b><code>NRT05</code><span>The ledger row Asked; the recipient’s inbox.</span></div></div>
      <div class="cols">
      <div><h3>Keyboard and focus</h3><ul>
      <li>Sheet order: close ✕ → LinkedIn link → context → Who knows (rows, then the state’s one action) → notes → footer (Ask, Add follow-up, primary).</li>
      <li>Request introduction opens the next sheet on top; focus lands on its h2. Cancel, ✕ and Escape close only the top sheet and return focus to the control that opened it.</li>
      <li>Who should you ask? is one radio group: Tab enters at the selected teammate, arrows move, Space selects, Enter continues.</li>
      <li>After Send, focus goes to “Request sent”; Back to [Morgan Vale] returns focus to the Who knows row now marked Asked.</li>
      <li>Retry keeps focus on Try again while the lookup runs, then moves to the first result or the state word.</li></ul>
      <h3 style="margin-top:12px">Screen-reader announcements</h3><ul>
      <li>Loading: polite “Looking up who knows them…”; region <code>aria-busy</code>.</li>
      <li>Results: polite “3 teammates know Morgan Vale”, “Nobody who shares knows this person”, or “Not looked up: no LinkedIn profile or email recorded”.</li>
      <li>Unavailable and send failures: <code>role="alert"</code>, saying nothing was sent.</li>
      <li>Sent: polite “Request sent to Dev Varma. Status Asked.”</li></ul></div>
      <div><h3>Phone keyboard (390)</h3><ul>
      <li>The Ask sheet is full height; the To/About card stays above the field; the sticky Send sits on the keyboard (<code>visualViewport</code>), never under it.</li>
      <li>The reason field scrolls into view on focus; Return adds a line, it never sends.</li>
      <li>Targets 44 px; the primary is full width; Back is the top-left 44 px button and asks before discarding a typed reason.</li></ul>
      <h3 style="margin-top:12px">Error recovery</h3><ul>
      <li>Every failure keeps the reason, the context and the unsaved private note.</li>
      <li>Send failed → Send again (same recipient). No longer shared → Choose another teammate. Limit → tomorrow, nothing lost.</li>
      <li>Unavailable lookup → Try again; Request introduction stays hidden until it reads.</li></ul>
      <h3 style="margin-top:12px">Colour</h3><ul><li>✓, ○, —, ?, ⊘ and ◷ carry each state with a word; borders differ by style (solid, dotted, dashed, red rule) as well as colour.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NRTH') html = `<div class="${CV} doc"><div><span class="eye">Network › Relationships · #7060 · handoff</span><h2 style="font-size:22px;margin-top:4px">Team warm path: what was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>pages/founder/FounderRelationshipBook.jsx</code>: the Person Sheet passes <code>{ person: contact.name }</code> to <code>WhoKnowsStrip</code>, and the footer’s Request introduction is a <code>Link</code> to <code>/network/introductions</code> with <code>state.person</code> = the name. Nothing on that page reads <code>location.state</code>, and the link skips the sheet’s unsaved-note guard.</li>
      <li><code>services/relationships.ts</code> <code>whoKnowsQuery</code>: a person is a LinkedIn profile URL or an email; a name is 400 <code>person_unmatchable</code>. <code>BY_PERSON</code> matches <code>? IN (sr.url_key, sr.email_key)</code>, at most 50 rows, only teammates whose share with that team is effective now.</li>
      <li><code>services/linkedinCsvImport.ts</code> <code>bookOf</code>: each book row already carries <code>email</code> and <code>linkedin_url</code>.</li>
      <li><code>WhoKnowsStrip.jsx</code> / <code>AskIntroSheet</code>: up to three rows, “Ask Dev for an introduction”, reason (required, 1,000), context (optional), Eadwyn quote first, <code>POST /intro-requests</code> with <code>teammate</code> and <code>ref</code>; Request sent names the teammate.</li>
      <li><code>requestIntro</code>: re-checks visibility (404 when no longer shared), 20 a day (429), notifies the teammate “… asks for an introduction”; nothing reaches the person.</li>
      <li><code>relationshipsModel.js</code>: <code>TEAM_SEES</code> / <code>NEVER_SHARED</code>; statuses Asked, Accepted, Declined, Made, Withdrawn; Made only after the send (D4604 delivery states).</li>
      <li><code>relationshipBookModel.js</code> <code>bookCountLine</code>: “142 people · private to you”, which contradicts a team share. Migration 653: <code>shared_relationships</code> has no email, phone, notes or URL column.</li>
      <li><code>routes/contact_imports.ts</code>: no route edits a book contact’s profile or email; <code>POST /book</code> adds a new typed person only.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>NW2 Relationships and the NW2.1 Person Sheet (#4799), the Ask sheet (RI3) and the Introductions ledger. The Eadwyn rail stays the one rail.</li><li>Existing who-knows by company, used as the recovery for Not recorded and None.</li></ul></div>
      <div><h3>Frontend only</h3><ul>
      <li>Send <code>linkedin_url</code>, else <code>email</code>, to who-knows; skip the read when neither is recorded and show Not recorded.</li>
      <li>Separate Not recorded, None and Unavailable, each with its own action; never 0.</li>
      <li>Footer primary routes to the teammate: one → Ask sheet; several → Who should you ask? → Ask sheet. Sheets stack; the Person Sheet and its draft stay mounted.</li>
      <li>Review lines (target, recipient, cost) in the Ask sheet; Send names the teammate; the sent state says Asked, not Made.</li>
      <li>Guard on “Open in Introductions” for a dirty note. Errors keep every field.</li>
      <li>Book line and sharing summary from <code>GET /sharing</code>: Off, one team, several, unreadable.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇ #7060)</h3><ul>
      <li>Edit a book contact’s LinkedIn profile or email (a <code>PATCH /api/contacts/book/:id</code> with the same normalisers as <code>typedContactInput</code>).</li>
      <li>Requests for this person on the sheet after reload: list the caller’s requests by <code>contact_id</code> or <code>person_key</code>.</li></ul>
      <h3 style="margin-top:12px">Not in this flow</h3><ul><li>Credit and quota introductions for investors stay on Introductions (#6636, #6637). The team ask never spends a credit or an ask.</li></ul>
      <h3 style="margin-top:12px">Open questions</h3><ul><li>Should the who-knows read take the caller’s own <code>contact_id</code> instead of the identifier in the query string? Not needed for safety; it keeps the email out of URLs and logs.</li><li>No ⚑ owner pick is drawn.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nrt-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
