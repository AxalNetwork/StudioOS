.lhm-vl{font:700 10px var(--mo);letter-spacing:.05em;text-transform:uppercase;color:var(--mu);max-width:240px}
/* focus order */
.lhm-fo{display:grid;grid-template-columns:690px minmax(0,1fr);gap:18px;align-items:start}
.lhm-fom .lhm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

.lhm-tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--hair);border-radius:10px}
.lhm-tbl th{text-align:left;font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--hair)}
.lhm-tbl td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.45}
.lhm-fo .lhm-tbl{grid-column:2;grid-row:1}
.lhm-agree{grid-column:1 / span 2;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.lhm-agree h3{font-size:13.5px;font-weight:800}
.lhm-agree ul{list-style:disc;padding-left:18px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:3px}
/* before / after */
.lhm-ba{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.lhm-bac{display:flex;flex-direction:column;gap:8px}
.lhm-bac h3{font-size:13.5px;font-weight:800}
.lhm-bav{position:relative;border:1px solid var(--hair2);border-radius:10px;background:var(--card);overflow:hidden}
.lhm-blk{position:absolute;left:8px;right:8px;border-radius:6px;background:var(--raised);border:1px solid var(--hair);display:flex;align-items:flex-start;padding:3px 6px;overflow:hidden}
.lhm-blk span{font:600 10.5px var(--sg);color:var(--mu);line-height:1.25}
.lhm-blk.lhm-hot{background:var(--negBg);border-color:var(--negE)}
.lhm-blk.lhm-hot span{color:var(--neg);font-weight:800}
.lhm-blk.lhm-new2{background:var(--lav);border-color:var(--lavE)}
.lhm-blk.lhm-new2 span{color:var(--vt);font-weight:800}
.lhm-bfold{position:absolute;left:0;right:0;border-top:2px dashed #f59e0b}
.lhm-bfold span{position:absolute;right:6px;top:-17px;font:700 9.5px var(--mo);color:#92400e;background:#fffbeb;border-radius:4px;padding:0 4px}
/* docs */
.lhm-doc{width:1200px}
.lhm-steps{display:flex;flex-direction:column;gap:9px}
.lhm-steps li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45}
.lhm-steps small{display:block;color:var(--mu);font-size:12px}
.lhm-key{font:700 10.5px var(--mo);color:var(--vt);background:var(--lav);border:1px solid var(--lavE);border-radius:5px;padding:0 5px}
.lhm-split.lhm-one{grid-template-columns:minmax(0,1fr)}
.lhm-ce{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.lhm-stw .lhm-tab{padding:0 7px}
.lhm-stw .lhm-ft{flex-wrap:wrap}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "900px"}, "board": {"editor": "enum", "default": "LHM01", "options": ["LHM01", "LHM02", "LHM02B", "LHM03", "LHM03B", "LHM04", "LHM05", "LHM06", "LHM07", "LHM07B", "LHM08", "LHM08B", "LHM09", "LHM09B", "LHM10", "LHM10B", "LHM11", "LHM11B", "LHM11C", "LHM12", "LHM13", "LHM14", "LHM15", "LHM00", "LHM16"]}}'>
class Component extends DCLogic {
  renderVals() {
    const B = this.props.board || 'LHM01';
    const CV = 'cv';
    const J = (a) => a.join('');
    const mo = (s) => `<span class="mo">${s}</span>`;

    /* ---------- annotations (not product copy) ---------- */
    const TB = (t) => `<span class="bk" title="Needs data or backend work">◇ ${t}</span>`;
    const TO = (t) => `<span class="ow" title="Owner decision">⚑ ${t}</span>`;
    const SYN = (t) => `<span class="x-syn">Synthetic${t ? ' · ' + t : ''}</span>`;
    const OBS = (t) => `<span class="x-obs">Observed 25 Nov${t ? ' · ' + t : ''}</span>`;
    const NUM = (n) => `<span class="x-n" aria-hidden="true">${n}</span>`;
    const AN = (t) => `<span class="x-an">${t}</span>`;

    /* ---------- Platform States chips (st.js vocabulary) ---------- */
    const SV = (p) => `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">${p}</svg>`;
    const G = {
      un: SV('<path d="M6 1.6v6" stroke="currentColor" stroke-width="2.2"/><circle cx="6" cy="10.2" r="1.2" fill="currentColor"/>'),
      ok: SV('<path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2"/>'),
      re: SV('<path d="M9.8 4.4A4.2 4.2 0 1 0 10 7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 1.6v3.2H7.2" fill="none" stroke="currentColor" stroke-width="1.6"/>'),
      part: SV('<circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 1.4a4.6 4.6 0 0 1 0 9.2z" fill="currentColor"/>')
    };
    const CHIP = { nr: ['x-c x-nr', '', '— Not recorded'], un: ['x-c x-un', 'un', 'Unavailable'], part: ['x-c x-pa', 'part', 'Partial'], none: ['x-c x-no', '', '○ None'] };
    const chip = (k, label) => { const x = CHIP[k]; return `<span class="${x[0]}">${x[1] ? G[x[1]] : ''}${label || x[2]}</span>`; };
    const retry = (t) => `<button type="button" class="x-retry">${G.re}${t || 'Retry'}</button>`;
    const search = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
    const bell = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

    /* ---------- sample data: fictional except the observed course; every figure agrees on every board ----------
       Today Thu 26 Nov 2026. Learner [Maya Ruiz], founder of [Northwind Labs]. Super Admin [Iris Chen].
       Courses published 4 (each Intro). Searching “pitch” in Courses: 1 match. Maya: 1 course in progress at 43%
       (3 of 7 required lessons), resume lesson 6 [Write the narrative from the register] (a reading, so no time); 3 lessons completed in November;
       2 videos played in November; exams passed 0 of 0. Two upcoming webinars, one program. */
    const PITCH = 'Evidence-based pitch narratives';
    const SLUG = 'evidence-based-pitch-narratives-v1';
    const COURSES = [
      { k: 'Course', t: PITCH, m: 'Intro · 1 h 25 min', pct: 43 },
      { k: 'Course', t: '[Customer discovery in 30 days]', m: 'Intro · 1 h 25 min' },
      { k: 'Course', t: '[Unit economics for a seed raise]', m: 'Intro · 1 h 15 min', nw: 1 },
      { k: 'Course', t: '[Hiring your first five]', m: 'Intro · 1 h 20 min' }
    ];
    const ALLROWS = [
      { k: 'Course', t: '[Unit economics for a seed raise]', m: 'Intro · 1 h 15 min', nw: 1 },
      { k: 'Video', t: '[Reading a term sheet, clause by clause]', m: '13 min · Fundraising · Intro', nw: 1 },
      { k: 'Article', t: '[What we learned from 40 customer calls]', m: '[Leo Park] · 6 min read · 19 Nov 2026', nw: 1 },
      { k: 'Course', t: PITCH, m: 'Intro · 1 h 25 min', pct: 43 },
      { k: 'Reading', t: '[The claim register, explained]', m: 'Fundraising · Intro' },
      { k: 'Event', t: '[Founder office hours, Lisbon]', m: 'Thu 3 Dec 2026, 17:00 · Office hours' }
    ];
    const RESUME = 'Resume [Write the narrative from the register]';
    const UR = (q) => `<span class="x-url">axal.vc${q}</span>`;
    const TABS = ['All', 'Courses', 'Videos', 'Webinars', 'Articles', 'Publications', 'Events', 'Exercises', 'Exams'];
    const tid = (t) => t.toLowerCase();

    /* ---------- shell: company/project switcher top-left, sidebar = held licences, Account menu holds Portfolio, Companies, Licences.
       Learning pages carry no Eadwyn rail (D4478), so the shell has no right rail here. ---------- */
    const NAVS = { f: ['Home', 'Spin-Out Lab', 'Validate', 'Build', 'Raise', 'Grow', 'Network', 'Research', '|', 'Trust', 'Company Settings'], a: ['Home', 'Network', 'Research', '|', 'Admin console'] };
    const SW = { f: '[Northwind Labs]', a: '[Axal HQ]' };
    const GRP = { f: 'Founder', a: 'HQ' };
    const INI = { f: 'MR', a: 'IC' };
    const side = (r) => `<aside class="sd"><div class="lg"><span class="logo" aria-hidden="true"></span>Axal VC</div><button type="button" class="sw2" aria-haspopup="listbox" aria-label="Switch company or project: ${SW[r]}">${SW[r]} <span aria-hidden="true">▾</span></button><span class="eye grp">${GRP[r]}</span><nav aria-label="${GRP[r]}">${J(NAVS[r].map((t) => t === '|' ? '<div class="sep"></div>' : `<a href="#">${t}</a>`))}</nav></aside>`;
    const top = (r, menuOpen) => `<div class="tb"><div class="srch"><span aria-hidden="true">⌕</span>Search StudioOS</div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="ib" aria-label="Notifications">${bell}</button><button type="button" class="av${menuOpen ? ' x-avon' : ''}" style="border:0" aria-haspopup="menu" aria-expanded="${menuOpen ? 'true' : 'false'}" aria-label="Account menu">${INI[r]}</button></div></div>`;
    const MENU = (r) => `<div class="x-menu" role="menu" aria-label="Account menu"><div class="x-mh"><b>${r === 'a' ? '[Iris Chen]' : '[Maya Ruiz]'}</b><small>${r === 'a' ? 'Super Admin · HQ' : 'Founder · [Northwind Labs]'}</small></div>${J(['Account', 'Portfolio', 'Companies', 'Licences', '|', 'Calendar', 'Events', 'Learning', 'Help Center', 'Plans &amp; Pricing', '|', 'Log out'].map((t) => t === '|' ? '<div class="x-msep"></div>' : `<a href="#" role="menuitem"${t === 'Learning' ? ' aria-current="page" class="x-mon"' : ''}>${t}</a>`))}</div>`;
    const ubar = (url, tags) => `<div class="x-ub">${url}<span class="x-ubt">${tags || ''}</span></div>`;
    const shell = (r, body, o) => {
      o = o || {};
      const h = o.h || 900;
      return `<div class="${CV}" style="width:1440px;height:${h}px">${o.ub || ''}<div class="sh x-norail" style="min-height:${h - (o.ub ? 30 : 0)}px">${side(r)}<div class="mn">${top(r, o.menu)}<main class="bd x-bd">${body}</main></div></div>${o.menu ? MENU(r) : ''}${o.fold ? `<div class="x-fold" style="top:${o.fold + (o.ub ? 30 : 0)}px"><span>Fold of the observed 879 px viewport</span></div>` : ''}</div>`;
    };
    const crop = (w, body) => `<div class="${CV} crop" style="width:${w}px">${body}</div>`;

    /* ---------- the Learning header: one h1, author tools secondary ---------- */
    const HEAD = (o) => {
      o = o || {};
      const tools = o.admin
        ? `<button type="button" class="btn" aria-haspopup="menu" aria-expanded="${o.toolsOpen ? 'true' : 'false'}">Author tools <span aria-hidden="true">▾</span></button>${o.toolsOpen ? `<div class="x-tools" role="menu" aria-label="Author tools"><a href="#" role="menuitem">Learning studio<small>Courses, videos, exams, webinars</small></a><a href="#" role="menuitem">Programs assigned to you</a><a href="#" role="menuitem">Write an article</a></div>` : ''}`
        : '<a href="#" class="btn t">Write an article</a>';
      return `<header class="x-hd"><div><h1>Learning</h1><p>Courses, videos, webinars, articles, publications, events, exercises and exams, in one place.</p></div><div class="acts x-ta">${o.ann || ''}${tools}</div></header>`;
    };

    /* ---------- the entry: Browse courses or the learner’s real next lesson ---------- */
    const bar = (p) => `<span class="x-bar" aria-hidden="true"><i style="width:${p}%"></i></span>`;
    const ENTRY = (v, o) => {
      o = o || {};
      if (v === 'return') return `<section class="x-en" aria-labelledby="en-h"><div class="x-enm"><span class="eye">Continue where you left off</span><h2 id="en-h">${PITCH}</h2><p>${RESUME} · ${mo('43%')} of required lessons${o.noTag ? '' : ' · 3 of 7 required ' + TB('#8288 lesson counts on /me')}</p>${bar(43)}</div><div class="acts"><a href="#" class="btn t">Browse courses</a><a href="#" class="btn p x-big"${o.focus ? '' : ''}>Resume lesson</a></div></section>`;
      if (v === 'first') return `<section class="x-en" aria-labelledby="en-h"><div class="x-enm"><span class="eye">Start here</span><h2 id="en-h">Four short courses for founders</h2><p>${mo('4')} courses published, each between ${mo('1 h 15 min')} and ${mo('1 h 25 min')}. Start one and your place is kept.</p></div><div class="acts"><a href="#" class="btn p x-big"${o.focus ? '' : ''}>Browse courses</a></div></section>`;
      if (v === 'meun') return `<section class="x-en" aria-labelledby="en-h"><div class="x-enm"><span class="eye">Start here</span><h2 id="en-h">Browse the courses</h2><p>${chip('un')} <span class="mu">Your progress could not be read, so this is not a claim that you have started nothing.</span> ${retry()}</p></div><div class="acts"><a href="#" class="btn p x-big">Browse courses</a></div></section>`;
      if (v === 'empty') return `<section class="x-en" aria-labelledby="en-h"><div class="x-enm"><span class="eye">Start here</span><h2 id="en-h">No course published yet</h2><p>Courses HQ publishes appear here. Articles, videos and events are open now.</p></div><div class="acts"><a href="#" class="btn p x-big">Open articles</a></div></section>`;
      return '';
    };

    /* ---------- catalogue: format tabs, search, labelled panel ---------- */
    const FTABS = (cur, o) => {
      o = o || {};
      return `<div class="x-ft" role="tablist" aria-label="Learning formats">${J(TABS.map((t) => {
        const on = t === cur;
        return `<button type="button" role="tab" id="learning-tab-${tid(t)}" aria-selected="${on}" aria-controls="learning-panel" tabindex="${on ? 0 : -1}" class="x-tab${on ? ' x-on' : ''}${on && o.focus ? ' x-fv' : ''}">${on && o.num ? NUM(o.num) : ''}${t}</button>`;
      }))}</div>`;
    };
    const SEARCH = (q, o) => {
      o = o || {};
      const lab = o.label || 'Search courses, videos, webinars, articles, publications and events';
      return `<div class="x-sr" role="search"><label class="x-sl" for="ls">${o.num ? NUM(o.num) : ''}${o.short || 'Search'}</label><div class="x-in${o.focus ? ' x-fv' : ''}">${search}<span class="${q ? 'x-q' : 'x-ph'}">${q || lab}</span>${q ? `<button type="button" class="x-clr" aria-label="Clear search">✕</button>` : ''}</div></div>`;
    };
    const kindPill = (k) => `<span class="x-kp">${k}</span>`;
    const CARD = (r, o) => {
      o = o || {};
      return `<a href="#" class="x-card${o.focus ? ' x-fv' : ''}"${o.w ? ` style="width:${o.w}px"` : ''}>${o.num ? NUM(o.num) : ''}<span class="x-kr">${kindPill(r.k)}${r.draft ? '<span class="x-dr">Draft</span>' : ''}${r.nw ? '<span class="x-new">New</span>' : ''}${r.done ? `<span class="x-done">${G.ok}Completed</span>` : ''}</span><b class="x-ct">${r.t}</b><small>${r.m || chip('nr')}</small>${r.pct ? `<span class="x-pr2">${bar(r.pct)}<span class="mo">${r.pct}%</span></span>` : ''}</a>`;
    };
    const GRID = (rows, o) => `<div class="x-grid">${J(rows.map((r, i) => CARD(r, { focus: o && o.focus === i, num: o && o.num && i === 0 ? o.num : 0 })))}</div>`;
    const PANEL = (tab, inner, o) => {
      o = o || {};
      return `<div class="x-pn" role="tabpanel" id="learning-panel" aria-labelledby="learning-tab-${tid(tab)}"><div class="x-phd"><h2 id="panel-h">${o.num ? NUM(o.num) : ''}${o.title || tab}</h2>${o.meta ? `<span class="x-pm">${o.meta}</span>` : ''}</div>${inner}</div>`;
    };
    const CAT = (tab, q, inner, o) => {
      o = o || {};
      return `<section class="x-cat" aria-label="Catalogue">${FTABS(tab, { focus: o.tabFocus, num: o.n1 })}${SEARCH(q, { label: o.sLabel, short: o.sShort, num: o.n2 })}${PANEL(tab, inner, { title: o.title, meta: o.meta, num: o.n3 })}</section>`;
    };
    const ALLFOOT = `<p class="x-ff">The newest ${mo('24')} across courses, videos, readings, articles, publications and events. Each tab holds its own list.</p>`;

    /* ---------- Your learning: the overview, in its own region ---------- */
    const YL = (v) => {
      const fig = (l, val) => `<div class="x-fig"><span>${l}</span><b class="mo">${val}</b></div>`;
      const figs = v === 'first'
        ? fig('Courses in progress', '0') + fig('Lessons completed this month', '0') + fig('Videos played this month', '0') + fig('Exams passed', '0 of 0')
        : fig('Courses in progress', '1') + fig('Lessons completed this month', '3') + fig('Videos played this month', '2') + fig('Exams passed', '0 of 0');
      const prog = v === 'first'
        ? '<p class="mu x-sm">You are not in a program yet. Most programs are by invitation.</p>'
        : `<a href="#" class="x-row"><b>[Lisbon founders · winter 2026]</b><small>${mo('2')} of ${mo('6')} items done</small></a>`;
      return `<aside class="x-yl" aria-labelledby="yl-h"><div class="x-ylh"><h2 id="yl-h">Your learning</h2><nav aria-label="Your learning" class="x-yln"><a href="#">My learning</a><a href="#">My learning plan</a></nav></div>
        <div class="x-figs">${figs}</div><p class="x-note">November 2026, from your own record.</p>
        <div class="x-ys"><h3>Recommended for you</h3>${v === 'first' ? `<a href="#" class="x-row"><b>${PITCH}</b><small>[The reason the server sends, e.g. the course most founders start with]</small></a>` : `<a href="#" class="x-row"><b>[Pricing your seed round, live Q&amp;A]</b><small>[The reason the server sends, e.g. a webinar on the course you are taking]</small></a>`}</div>
        <div class="x-ys"><h3>Upcoming webinars <span class="x-z">Times in your zone, Europe/Lisbon</span></h3><div class="x-wr"><div><b>[Pricing your seed round, live Q&amp;A]</b><small class="mo">Tue 1 Dec 2026, 16:00 · 18 seats left</small></div><button type="button" class="btn">Register</button></div><div class="x-wr"><div><b>[Investor updates that get read]</b><small class="mo">Thu 10 Dec 2026, 16:00 · No seat limit</small></div><button type="button" class="btn">Register</button></div></div>
        <div class="x-ys"><h3>My programs</h3>${prog}</div></aside>`;
    };

    /* ---------- desktop home ---------- */
    const HOME = (o) => {
      o = o || {};
      const tab = o.tab || 'All';
      const q = o.q || '';
      let inner = o.inner;
      if (!inner) {
        if (tab === 'All') inner = GRID(o.entry === 'first' ? ALLROWS.map((r) => Object.assign({}, r, { pct: 0 })) : ALLROWS) + ALLFOOT;
        else if (tab === 'Courses' && q) inner = GRID([COURSES[0]], { focus: o.cardFocus ? 0 : -1 }) + `<p class="x-ff">${mo('1–1 of 1')} · <a href="#">Clear search</a> to see all ${mo('4')} courses</p>`;
        else inner = GRID(o.rows || COURSES) + `<p class="x-ff">${mo('1–4 of 4')}</p>`;
      }
      const meta = o.meta !== undefined ? o.meta : (tab === 'All' ? 'Newest first' : q ? `${mo('1')} course matches “${q}”` : `${mo('4')} courses`);
      return `${HEAD(o.head)}${o.entry === false ? '' : ENTRY(o.entry || 'return', o.entryO)}<div class="x-split${o.aside === false ? ' x-one' : ''}"><div class="x-main">${CAT(tab, q, inner, { title: o.ptitle || tab, meta, tabFocus: o.tabFocus })}</div>${o.aside === false ? '' : YL(o.entry === 'first' ? 'first' : 'return')}</div>`;
    };

    /* ---------- the course page header with the explicit return (body is #8664) ---------- */
    const COURSEHEAD = (o) => {
      o = o || {};
      const back = o.back === 'direct' ? '‹ Learning' : '‹ Back to Courses · “pitch”';
      return `<nav aria-label="Return" class="x-ret"><a href="#" class="x-back${o.focus ? ' x-fv' : ''}" aria-label="${o.back === 'direct' ? 'Back to Learning' : 'Back to Courses, search pitch, 1 result'}">${back}</a>${o.back === 'direct' ? '' : `<span class="x-crumb">Learning <span aria-hidden="true">›</span> Courses <span aria-hidden="true">›</span> “pitch”</span>`}</nav>
        <header class="x-chd"><span class="eye">Course</span><h1>${PITCH}</h1><p>[The course summary, as the course record sends it.]</p><div class="x-cm"><span class="x-kp">Intro</span>${mo('1 h 25 min')} · ${mo('2')} modules · ${mo('10')} lessons · ${mo('7')} required</div></header>
        <div class="x-defer">Outline, syllabus, About this course and the course action: drawn in #8664 (Learning Course Overview, LCO boards). This canvas owns only the return link and what it restores.</div>`;
    };

    /* ---------- phone ---------- */
    const phTop = (t, back) => `<div class="pt"><button type="button" class="pi" aria-label="${back ? 'Back' : 'Open menu'}">${back ? '‹' : '☰'}</button><b style="font-size:15px">${t}</b><div style="display:flex"><button type="button" class="pi" aria-label="Notifications">${bell}</button></div></div>`;
    const phone = (t, body, o) => `<div class="${CV} ph fx" style="width:390px;height:844px">${phTop(t, o && o.back)}<main class="pbd x-pbd">${body}</main>${o && o.ruler ? `<div class="x-rul" style="top:${o.ruler}px"><span>${o.rulerT || 'first result'}</span></div>` : ''}</div>`;
    const FGRID = (cur, o) => {
      o = o || {};

    }

    /* ===== LHM16 · Handoff ===== */
    else if (B === 'LHM16') {
      html = `<div class="${CV} doc x-doc"><div><span class="eye">Handoff · #8662 · checked against main 7b0db10927</span><h2 style="font-size:20px;margin-top:4px">Learning home and catalogue navigation · engineering handoff</h2></div>
