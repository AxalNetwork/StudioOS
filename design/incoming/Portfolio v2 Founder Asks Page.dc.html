      + box('Loading', asksSec('loading') + '<span class="raw">The other sections draw; only this one reads “Reading…”. Announced politely.</span>', st('Reading', 'Reading…'))
      + box('Not recorded', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Period</dt><dd>' + NREC + '</dd><dt>Hours</dt><dd>' + NREC + '</dd><dt>Outcome</dt><dd>' + NREC + '</dd></dl><p class="pak-cnt">3 asks in the update of ' + SENT + ' · period not recorded</p><span class="raw">Never 0, never blank.</span>', st('Not recorded'))
      + box('Unavailable · the asks read failed', asksSec('unread') + '<span class="raw">Report detail, KPIs, health and history stay.</span>', st('Unavailable'))
      + box('Refused · not a recipient', asksSec('refused') + '<span class="raw">Open the update is hidden: /updates/:uid answers 403 to you.</span>', st('Refused'))
      + box('Refused · Value-add', '<div class="pak-ref"><b>' + SH.rf + ' Value-add needs the Investor licence.</b><span>An admin can grant it. Promise support is hidden in Report detail without it.</span></div>', st('Refused'))
      + box('Recording', '<div class="pak-fa"><span class="raw">Every field is locked while it saves.</span><button type="button" class="btn p" aria-disabled="true">Recording…</button></div>', st('Reading', 'Saving'))
      + box('Record failed', '<p class="pak-ferr" role="alert">! The entry was not recorded: the Worker did not answer. Every value is kept.</p><div class="fld"><label>What happened</label><div class="ta pak-kept" style="min-height:44px">' + ASKS[0].t + '</div></div><div class="pak-fa"><span class="raw">Nothing was saved.</span><button type="button" class="btn p">Try again</button></div>', st('Failed'))
      + box('Field error', '<div class="fld"><label>What happened</label><div class="ta pak-bad" style="min-height:44px"></div><span class="pak-fe" role="alert">! Say what happened. An entry with no description is not recorded.</span></div>', st('Failed', 'Not saved'))
      + box('Company not in your book', '<div class="pak-ref"><b>' + SH.rf + ' This company is not in your book, so support cannot be logged against it.</b><span>The asks still read; Promise support is hidden.</span></div>', st('Refused'))
      + '</div>', 1440);

    /* ---------- phone 390 ---------- */
    const phone = (title, body, sheet, av) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative;overflow:hidden"><div class="pt"><button type="button" class="pi" aria-label="Back">‹</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Account menu">' + (av || 'IN') + '</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mAsk = (a) => '<div class="pak-mc"><span class="eye">Ask · ' + a.w + '</span><p class="pak-qt">“' + a.t + '”</p>' + ansLine(a) + '<button type="button" class="btn pak-pri pak-44">Promise support</button><a class="btn pak-44" href="#">Open the update ↗</a></div>';
    const coll = (t, s) => '<button type="button" class="pak-coll" aria-expanded="false"><span>' + t + '</span><span class="raw">' + s + ' ▾</span></button>';
    const MOB = {
      PAK24: () => phone('Report detail', '<div><span class="eye">Report detail · Q3 2026</span><h2 style="font-size:20px;font-weight:800">' + CO + '</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">' + st('Received', 'Received · Q3 2026') + '<span class="raw">' + SENT + '</span></div></div><div><b style="font-size:14px">Asks in this update</b><p class="pak-cnt">' + COUNTLINE + '</p></div>' + J(ASKS.slice(0, 2).map(mAsk)) + '<a class="raw" href="#" style="text-align:center">1 more ask below · Capital ↓</a>' + coll('What was received', 'Version 1') + coll('Health beside it', 'Healthy'), ''),
      PAK24b: () => phone('Value-add', '<div style="height:120px"></div>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mls" style="max-height:800px"><div class="grab" aria-hidden="true"></div><div style="padding:10px 16px 18px;display:flex;flex-direction:column;gap:10px"><h2 id="mls" style="font-size:17px;font-weight:800">Log support · ' + CO + '</h2>' + askChip().replace('pak-achip', 'pak-achip m') + sel('Kind', 'Customer', 'From the ask · can be changed') + sel('State', 'Promised') + '<div class="fld"><label>What happened <button type="button" class="pak-ask-e">Ask Eadwyn</button></label><div class="ta" style="min-height:64px">' + ASKS[0].t + '</div></div><div class="fld"><label>Hours <span>(optional)</span></label><div class="pak-sel"><span class="pak-ph">Leave blank if untimed</span></div></div><div class="fld"><label>Outcome <span>(optional)</span></label><div class="pak-sel"><span class="pak-ph">Leave blank until something comes of it</span></div></div><button type="button" class="btn p pak-44">Record entry</button></div></div>'),
      PAK24c: () => phone('Value-add', '<div class="pak-stats m"><div><small>Outstanding</small><b>2</b></div><div><small>Delivered</small><b>3</b></div></div>' + J([NEWROW].concat(LEDG.slice(0, 2)).map((r, i) => '<div class="pak-mc"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + r[0] + '</b>' + st(r[2]) + '</div><span class="raw">' + r[1] + ' · ' + r[5] + ' · hours ' + (r[3] || 'not recorded') + '</span><p style="font-size:12.5px">' + r[4] + '</p>' + (i === 0 ? '<a href="#" class="pak-al">◇ Answers an ask ↗</a><div class="pak-acts"><button type="button" class="btn pak-44" style="flex:1">Deliver</button><button type="button" class="btn pak-44" style="flex:1">Withdraw</button></div>' : '') + '</div>'))),
      PAK24d: () => phone('Q3 update', '<div><h2 style="font-size:18px;font-weight:800">Replies to asks</h2><p class="pak-cnt">' + COUNTLINE + '</p></div>' + '<div class="pak-mc"><span class="eye">Ask · A customer introduction</span><p class="pak-qt" style="font-weight:600">' + ASKS[0].t + '</p><div class="pak-rp"><div><b>' + OTH + ' · ' + ANS + '</b><span>Happy to make the intro once you have a one-pager.</span><a href="#">Open in Distribution</a></div><span class="pak-pill">Lead</span></div><span class="pak-pl p">' + SH.pd + ' ' + ME + ' promised support · Customer · ' + TODAY + ' ' + NEW() + '</span><span class="pak-pl d">' + SH.ok + ' Delivered ' + DLV + ' ' + NEW() + '</span></div><div class="pak-mc"><span class="eye">Ask · A hire</span><p class="pak-qt" style="font-weight:600">' + ASKS[1].t + '</p><span class="raw">No replies after 14 days.</span><button type="button" class="btn p pak-44">Ask again</button></div>', '', 'FN')
    };

    /* ---------- handoff ---------- */
    const dkd = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dkd('<h1>Founder asks in Reports, and one ask turned into a promise · handoff</h1><p>Continues <b>Portfolio v2 · Addendum</b> (PFA01–PFA17): boards PAK18–PAK25D are PFA18–PFA25D. No new route. Checked against main <code>6d7712c6d1</code> (the brief checked <code>45e7c55fa6</code>; the reads below are unchanged).</p>'
      + '<h2>Checked on main</h2>' + tbl(['Area', 'What main does', 'On the boards'], [
        ['Reports inbox and Report detail', '<code>InvestorPortfolioUpdates.jsx</code>: the 560 Sheet with What was received, Required KPI set, Health beside it, Update as written, History. Due reads “No due date recorded”. Rail is <code>WorkerRail</code>.', 'Kept as is; “Asks in this update” is added below Update as written.'],
        ['Latest update', '<code>GET /api/portfolio-updates/latest</code> (<code>portfolio_updates.ts</code> l.282): <code>dto</code> carries uid, period, title, body, version; no <code>sent_at</code>, no <code>kind</code>, no asks.', 'The detail learns “sent through Share” and the asks from <code>/:uid/page</code>.'],
        ['Asks', '<code>GET /api/portfolio-updates/:uid/page</code> (l.796): 404 when unsent or a report; 403 when the reader is not in <code>update_recipients</code>; a recipient gets kind, text, <code>link_ref</code>/<code>link_reason</code>, sent_at, period. No replies.', 'Kind chip with its word (<code>ASK_LABELS</code>), text as written, round call or its reason.'],
        ['Replies and Ask again', 'Author view only: <code>replies</code> with <code>landed_module</code>, <code>can_ask_again</code> after 14 days (<code>ASK_AGAIN_DAYS</code>). <code>SentUpdatePage.jsx</code> “Replies to asks”.', 'PAK21 keeps it unchanged.'],
        ['Log support', '<code>InvestorPortfolioValueAdd.jsx</code> <code>LogForm</code>: Company, Kind (Introduction, Board prep, Hiring, Customer, Fundraising, Other), State (Promised, Delivered), Hours (blank sent as absent), What happened (required, Ask via <code>useScopedFill</code>), Outcome; “Record entry” / “Recording…”. It is an inline card, not a sheet.', 'Drawn as that card, opened from the ask.'],
        ['Support write', '<code>POST /api/portfolio-support</code> (l.320): <code>canViewLpData</code> (admin or Investor licence), company must be in the book (404), summary required, state promised|delivered, <code>promised_at</code> accepted.', 'Refusals and field errors on PAK23.'],
        ['Founder read of support', '<code>GET /api/portfolio-support</code> is 403 for a founder (<code>canViewLpData</code>).', 'Promise lines on PAK21 are ◇.']])
      + '<h2>Requires engineering (◇ #6215)</h2><p>1. A nullable ask link on <code>portfolio_support_entries</code> (e.g. <code>ask_uid</code>), written by POST and returned by GET (“Answers an ask”). 2. The founder’s read of promises against their own asks on <code>/:uid/page</code> (author view): investor name, kind, promised/delivered/withdrawn dates only. 3. An investor’s answered/by-whom read on the recipient shape. 4. Optional: a per-company read of open asks across sent updates (question 3, option B). 5. “You promised this on [date]” needs (1). 6. <code>/:uid/page</code> sets <code>update_recipients.opened_at</code> on a recipient’s first read, so Report detail reading the asks there would mark the update opened without the investor opening it: a read that does not record an open, or the owner accepting it (⚑).</p>'
      + '<h2>Pending the owner (⚑)</h2><p>Boards draw option A for questions 1 to 4: a link column; the founder sees the promise and its later Delivered or Withdrawn, never hours or outcome; latest sent update only; the kind mapping hire→Hiring, customer→Customer, partner→Introduction, capital→Fundraising, market→Other, all editable.</p>'
      + '<h2>Frontend only</h2><p>The asks section reading <code>/:uid/page</code> for the latest uid (404 read as “not sent through Share”, 403 as Refused, any other failure as Unavailable); Promise support carrying company, kind and text into Log support with the company fixed; the kind mapping; a Promised date input (the API already takes <code>promised_at</code>); the confirmation and receipt (today’s form records on submit, with no review step); Back to the report returning to the same Report detail; phone cards and sheets; dark tokens.</p>'
      + '<h2>Preserved</h2><p>The inbox, its columns and Chase; every existing Report detail section and its Unreadable claims; Log support’s fields, Ask on What happened (outcome and hours never filled), “Record entry” / “Recording…”; Deliver and Withdraw; the founder’s Replies to asks, module links and Ask again after 14 days; the shell (#3704) and the Eadwyn rail (#5130).</p>' + '<h2>Ask kind → support kind</h2>' + tbl(['Ask kind (ASK_LABELS)', 'Support kind (KINDS)'], KMAP)
      + '<h2>Open questions</h2><p>Does a capital ask that already lands on a round call still warrant a Fundraising promise, or should Promise support point to the call? Should “Answered by” name the replier to other investors (privacy between recipients)? The boards draw it behind ◇ and leave it to the owner.</p>'
      + '<h2>Accessibility</h2><p>Each ask is a list item with its kind as text; answered, promised, delivered and withdrawn each carry a word and a glyph. Promise support and Open the update are named buttons; the sheet is a modal dialog with a labelled heading and returns focus to its Report detail button. Recording announces “Recording…” and a failure is role=alert tied to its field. Phone targets are 44px. Targets WCAG 2.2 AA; not claimed from screenshots.</p>');

    let html = '';
    if (B === 'PAK18') html = b18();
    else if (B === 'PAK19') html = b19({ draft: true });
    else if (B === 'PAK19b') html = crop(confirmBox(), 680);
    else if (B === 'PAK19c') html = crop(receipt(), 680);
    else if (B === 'PAK20') html = b20();
    else if (B === 'PAK20b') html = b20b();
    else if (B === 'PAK21') html = b21();
    else if (B === 'PAK21b') html = b21b();
    else if (B === 'PAK22') html = b22();
    else if (B === 'PAK23') html = b23();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PAK25D') html = page(head('Reports') + inbox(true), { h: 1240, rail: rail18(), overlay: detail('ok', { focus: true }) });
    else if (B === 'PAK25Db') html = b19({ draft: true });
    else if (B === 'PAK26') html = handoff();
    else html = b18();
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
