    const ASKB = o => {

      const chipW = o.wait && !o.run ? `<span style="${M};display:inline-flex;align-items:center;min-height:20px;padding:0 7px;border-radius:999px;background:#fcd34d;color:#92400e;font-size:11px;font-weight:700">[${o.wait}] waiting</span>` : '';

    };

    const PRF = {
      f: { n: '[Avery Stone]', ini: 'AS', role: 'Founder', col: '#7c3aed', tint: 'rgba(124,58,237,.14)' },
      i: { n: '[Jordan Reyes]', ini: 'JR', role: 'Investor', col: '#0ea5e9', tint: 'rgba(14,165,233,.14)', arch: '[Allocator]', fit: '[74]', fw: 'Good', fl: 'Fit with your deal flow', q: ['Question [7] · Thesis', 'Which stages do you invest in most often?'], cnt: '[6] answered · [2] waiting', purp: 'Your deals, portfolio and events, arranged the way you work.' },
      a: { n: '[Dana Whitfield]', ini: 'DW', role: 'Advisor', col: '#f59e0b', tint: 'rgba(245,158,11,.16)', arch: '[Mentor]', fit: '[81]', fw: 'Good', fl: 'Fit with founders’ asks', q: ['Question [5] · Practice', 'Which topics do founders book you for most?'], cnt: '[9] answered · [1] waiting', purp: 'Your sessions, clients and earnings, arranged the way you work.' },

    const PURPF = '[Northwind Labs] · [Founder line]: everything you have built across the platform, what it unlocked, and what to do next.';
    const roleChip = p => `<span style="display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:${p.tint};color:var(--ink)"><span style="width:7px;height:7px;border-radius:999px;background:${p.col}"></span>${p.role}</span>`;

    const FIXL = `<span title="Fixed: always on your Studio" aria-label="Fixed: always on your Studio" style="position:absolute;top:12px;right:12px;color:var(--mut);display:flex">${LOCK(13)}</span>`;
    const FIXTIP = `<div role="tooltip" style="position:absolute;top:-38px;right:0;z-index:4;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;background:#18181b;border:1px solid #374151;color:#fff;font-size:12px;white-space:nowrap;box-shadow:0 8px 20px rgba(24,24,27,.25)">${LOCK(12)}Fixed: always on your Studio</div>`;
    const DIM = o => o && o.dim ? 'opacity:.62;' : '';
    const SPK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="flex:none;margin-top:2px;display:block"><path d="M8 1.2l1.5 4.3 4.3 1.5-4.3 1.5L8 12.8 6.5 8.5 2.2 7l4.3-1.5z"/></svg>';
    const SV = (d, z) => `<svg width="${z || 18}" height="${z || 18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none">${d}</svg>`;
    const I_TKT = SV('<path d="M3 8V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5V8a2 2 0 0 0 0 4v1.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 13.5V12a2 2 0 0 0 0-4z"/><path d="M9.5 5v10" stroke-dasharray="2 2"/>', 17);
    const CSECS = { f: ['Founding team', 'Customer', 'Product', 'Funding', 'Prefs'], i: ['Thesis', 'Deal flow', 'Portfolio', 'Prefs'], a: ['Practice', 'Expertise', 'Clients', 'Prefs'], p: ['Firm', 'Capacity', 'Offers', 'Prefs'], e: ['About you', 'Goals', 'Prefs'] };
    const CPROP = { f: [['Who owns selling, and how much of their week it takes', 'High', 40], ['Which customer segment pays first', 'High', 25], ['What your first hire should own', 'Med', 10]], i: [['Which stages you invest in most often', 'High', 50], ['Your usual first cheque', 'Med', 30], ['Sectors you will not invest in', 'Med', 10]], a: [['Topics founders book you for', 'High', 60], ['Hours a month you give to sessions', 'Med', 30], ['Sectors you know best', 'Med', 20]], p: [['Engagements you can take on next month', 'High', 40], ['Services you deliver best', 'Med', 30], ['Your usual engagement length', 'Med', 15]], e: [['What brought you to Axal VC', 'High', 20], ['Whether you plan to found or to invest', 'High', 10]] };
