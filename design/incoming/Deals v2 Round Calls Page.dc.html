    const pcard = (c) => '<a class="mc dca-pc" href="#" aria-label="Open the call: ' + c.co + ' ' + c.n + '"><div class="r1"><b>' + c.co + '</b>' + (c.nw ? NEW : '') + '</div><span style="font-size:13px">' + c.n + ' · ' + c.ins + '</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + chip(c.st) + '<span class="raw">' + c.cl + '</span></div><span style="font-size:12.5px">' + (c.ind ? '<b>Indicated · <span class="mo">' + c.ind + '</span></b>' : '<span class="dca-ni">○ Not indicated</span>') + '</span><span style="font-size:12.5px">Data room · ' + DRW[c.dr] + '</span></a>';
    const MOB = {
      DCA21a: () => phone('Round calls', '<span class="dca-crumb" style="font-size:12px">Deals › Round calls</span><div class="chips" style="flex-wrap:nowrap;overflow:hidden">' + J([['Open', '3', 1], ['Needs my answer ◇', '2', 0], ['Paused', '1', 0], ['Closed', '2', 0]].map(f => '<button type="button" aria-checked="' + !!f[2] + '" style="min-height:44px">' + f[0] + ' <span class="mo">' + f[1] + '</span></button>')) + '</div><span class="raw">Chips scroll sideways · the whole card opens the call</span>' + J([CALLS[0], CALLS[1], CALLS[3]].map(pcard)) + PT('Company, my response, New · #6159')),
      DCA21b: () => phone('[Ferro Analytics]', '<div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:17px;line-height:1.3">A private round call from [Ferro Analytics]</b><div style="display:flex;gap:8px;align-items:center">' + chip('op') + '<span class="raw">Closes in 20 days · 4 Dec</span></div></div><div class="dca-ind"><b>Indicated · <span class="mo">[$50,000]</span> on <span class="mo">12 Nov</span></b><span>Not a payment or a signed investment.</span></div>'
        + J(['Terms', 'Pitch deck · v4', 'Data room · Asked on 12 Nov', 'Questions · 1 answered', 'My activity ◇'].map(t => '<button type="button" class="disc dca-acc"><b>' + t + '</b><i aria-hidden="true">▾</i></button>')), '<div class="dca-sticky"><button type="button" class="btn p" style="min-height:48px;flex:1">Change amount</button></div>'),
      DCA21c: () => phone('[Ferro Analytics]', '<b style="font-size:17px">A private round call from [Ferro Analytics]</b>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ps1"><div class="grab" aria-hidden="true"></div><div style="padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px"><h2 id="ps1" style="font-size:17px;font-weight:800">Indicate an amount</h2><div class="fld"><label>Amount <span>· USD</span></label><div class="inp" style="min-width:0;min-height:48px;color:var(--ink)"><span class="mo">75,000</span></div></div><p class="dca-rep">This replaces your indication of <span class="mo">[$50,000]</span>.</p><p class="foot">Minimum cheque <span class="mo">[$25,000]</span> · target <span class="mo">[$1,000,000]</span>.</p><p style="font-size:13px;font-weight:700">' + NOTE + '</p><button type="button" class="btn p" style="min-height:48px">Indicate <span class="mo">[$75,000]</span></button><button type="button" class="btn" style="min-height:44px">Cancel</button></div></div>'),
      DCA21d: () => phone('Round calls', '<span class="dca-crumb" style="font-size:12px">Deals › Round calls</span><div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>Coming soon. Round calls are not enabled on Axal yet.</b><div>A round call is private terms a founder sends to investors. You read them, ask questions and indicate an amount.</div></div></div><a class="btn" href="#" style="min-height:48px">Browse Deal flow</a><span class="raw">Switched off · no chips, no cards</span>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      DCAH: () => dk('<h1>Handoff · the investor’s round calls (#6159)</h1><p>Checked against main <code>6d7712c6d1</code> on Sat 14 Nov 2026. Boards DCA16 to DCA22 follow the brief’s CLS16 to CLS22 and are drawn in the Deals v2 frame (DE01, DX1), with CLS13 as landed for one call. The founder side is the Raise v2 Calls follow-through canvas (RAC); its words are reused: Indicated, never committed; matching investors unnamed. Round calls are off on Axal (<code>ROUND_CALLS_ENABLED = "false"</code> in <code>wrangler.toml</code>, three environments), so every board has a switched-off state.</p>'
        + '<h2>Checked on main</h2>' + tbl(['Area', 'What main does', 'Board'], [
          ['List read', '<code>routes/round_calls.ts</code> <code>GET /</code>: for <code>users.role = \'investor\'</code> returns <code>uid, name, instrument, target_close, state, sent_at</code>, drafts excluded, ordered by <code>sent_at</code>. Anyone else takes the founder branch', 'DCA16'],
          ['List page', '<code>RoundCallIndex</code> in <code>RoundCallPage.jsx</code>: a bare <code>&lt;ul&gt;</code> of “name · state · closes date”, raw state words, no breadcrumb, filters or empty explanation', 'DCA16, DCA17'],
          ['One call', '<code>investorPage</code> in <code>services/roundCalls.ts</code>; <code>InvestorCallView</code> (CLS13): company name, terms, In plain words, frozen deck, data room (recorded, nda_signed, has_grant, path), my indicated amount, my questions, evidence; sets <code>opened_at</code> once', 'DCA19'],
          ['Respond', '<code>POST /:uid/responses</code>: <code>commit</code> (min cheque ≤ amount ≤ target, overwrites <code>commitment_cents</code>), <code>question</code>, <code>data_room</code> (409 <code>nda_required</code>); no withdraw', 'DCA19, DCA20B'],
          ['Paused', '<code>readOnlyNote</code>: awaiting counsel, or deck changed after approval (<code>deck.unreadable</code>)', 'DCA19D'],
          ['Read errors', '<code>CallReadState</code>: 503 → “Coming soon. Round calls are not enabled.”; every other error, 403 and 404 included, → “Unreadable”', 'DCA20'],
          ['/deals', '<code>OtherDealActivity.jsx</code> + <code>otherActivityModel.js</code>: four items (Screening, IC decisions, Closing, Deal rooms), Unreadable per item; no round calls. Needs your attention is not on main (#5899)', 'DCA18'],
          ['Notification', '<code>round_call_received</code>, in-app, “A private round call”, link <code>/round-calls/:uid</code>', 'entry today']])
        + '<h2>Requires engineering ◇ (#6159, filed under #4815)</h2><ul style="list-style:disc;padding-left:18px;font-size:13px;line-height:1.7"><li>List fields: company name, target, my indicated amount, question asked and answered, data-room state, New (unopened), and “Paused · the deck changed after approval”.</li><li>Return <code>round_calls.closed_at</code> so an early close reads “Closed on [date]”.</li><li>Branch the list on the investor licence and KYC, not <code>users.role</code>.</li><li>Withdraw an indication (Q3 A): an action, a stored state, shown to the founder as Withdrawn.</li><li>A pending NDA envelope on the call read, and Sign the NDA from the page.</li><li>My activity: return <code>opened_at, committed_at, last_response_at</code> and the earlier amounts.</li><li>The deal id on the call; Add to deal flow.</li><li>/deals: Round calls in Other deal activity; a round-call item kind in Needs your attention (with #5899).</li><li>Eadwyn reads for the list nudge and the draft question.</li></ul>'
        + '<h2>Frontend only</h2><p>Breadcrumb “Deals › Round calls” with the Deals row highlighted; the list as a table with Open / Paused / Closed chips (words, glyphs), close-date phrasing, Open · Paused · Closed · All filters kept in the address; the empty state; distinct 403, 404, 503 and Unreadable states; Change amount with the “replaces” note; the phone cards, sticky bar and sheet; dark tokens.</p>'
        + '<h2>Owner questions · drawn as option A ⚑</h2><p>Q1 the list stays at /round-calls under Deals · Q2 a new amount replaces the old, and My activity keeps the earlier one · Q3 withdraw allowed while Open, shown to the founder · Q4 past its close date reads Closed, no Expired chip.</p>'
        + '<h2>Handoff paths and accessibility</h2><p>List → /round-calls/:uid; call → /research/diligence/:grant once the NDA is signed and access granted; ◇ call → /deals/:dealId. Back returns to /round-calls with <code>?filter=</code> kept. Status chips carry a word and a glyph; New is a word; Not recorded is italic words, Unreadable is “!” and a word; skeletons set aria-busy; dialogs trap focus and return it; Saving uses aria-busy; phone targets are 44px or more. The word Commit never appears on the investor’s pages.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DCA16') html = page(listPage('All'), { h: 1000, rail: listRail });
    else if (B === 'DCA16B') html = crop('<span class="eye">DCA16 · Needs my answer applied · /round-calls?filter=needs-answer</span>' + filters('needs') + listTable([CALLS[0], CALLS[1]]) + '<p class="raw">Open and not indicated · Back from a call returns here with the filter kept</p>', 1100);
    else if (B === 'DCA17') html = page(emptyPage(), { h: 760 });
    else if (B === 'DCA18') html = DCA18();
    else if (B === 'DCA18B') html = DCA18B();
    else if (B === 'DCA19') html = page(callBody({ draft: false }), { h: 1260, rail: callRail });
    else if (B === 'DCA19B') html = page(callBody(), { h: 1260, overlay: dlg });
    else if (B === 'DCA19C') html = DCA19C();
    else if (B === 'DCA19D') html = DCA19D();
    else if (B === 'DCA20') html = DCA20();
    else if (B === 'DCA20B') html = DCA20B();
    else if (B === 'DCA22a') html = page(listPage('All'), { h: 1000, rail: listRail });
    else if (B === 'DCA22b') html = page(callBody(), { h: 1260, rail: callRail });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(listPage('All'), { h: 1000, rail: listRail });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
