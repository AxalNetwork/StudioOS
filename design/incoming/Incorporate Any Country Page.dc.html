    else if (B === 'INC24D') html = phone('Your case', m19, '<button type="button" class="btn p" style="min-height:48px;width:100%">Answer ' + PR + '’s request</button>');
    else if (B === 'INC24E') html = phone('Your case', m19, '', m20);

  }
