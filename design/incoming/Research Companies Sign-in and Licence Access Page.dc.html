.st-tw{display:flex;flex-direction:column;gap:6px;min-width:0}

.st-tv{font:800 26px var(--mo);letter-spacing:-.03em;line-height:1.1;color:var(--ink)}

.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}
.st-foot2 b{color:var(--ink)}
/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.st-list li:first-child{border-top:0}

.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.st-lbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-lbh b{font-size:14px}
.st-cnt{font:700 11px var(--mo);padding:1px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);color:var(--ink)}
.st-none{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:9px;background:var(--raised);font-size:13px}
.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}
.st-unbox{border:1.5px dashed var(--hair2);background:var(--card)}

.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st-chh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-chh b{font-size:14px}
.st-ch svg{font-family:var(--sg)}
.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}
.st-ch2 h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st-comp .st-tile{background:var(--raised)}
.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}
.st-prov{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:500 11.5px var(--mo);color:var(--mu)}
/* phone */
.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}
.st-plist{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}
.st-plist>div:first-child{border-top:0}
.st-plist span{font-size:12.5px}
/* do / don't */
.st-dd{display:flex;flex-direction:column;gap:8px}
.st-ddt{font:800 14px var(--sg)}
.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}
.st-do .st-ddl{color:var(--pos)}
/* options */
.st-opt{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.st-opt p{font-size:12.5px;line-height:1.55;color:var(--mu)}
.st-opt b{font-size:15px}
.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}

.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}
/* Sign In v2 (#6956) — SGN boards. Self-contained; reuses the AuthShell / authV2 values. */
.sgn{--ink:#241f38;--mu:#6b6577;--hair:#e8e6ee;--vi:#7c3aed;--vd:#6d28d9;--lav:#f4f0fe;--lave:#ddd0fb;--mo:'Roboto Mono',ui-monospace,monospace;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.45;position:relative}
.sgn,.sgn *{box-sizing:border-box}
:where(.sgn) :where(h1,h2,h3,p,ul,ol){margin:0;padding:0}
:where(.sgn) :where(ul,ol){list-style:none}
.sgn button{font-family:inherit;cursor:pointer}
.sgn a{color:var(--vd);text-decoration:none}
.sgn-mo{font-family:var(--mo)}
/* scene */
.sgn-scene{overflow:hidden;background-color:#3b2f5c;background-size:cover;background-position:center;background-repeat:no-repeat}
.sgn-ph.sgn-scene{background-position:63% center}
.sgn-scrim{position:absolute;inset:0;background:rgba(36,31,56,.34)}
.sgn-scrim.sgn-scm{background:rgba(20,16,36,.32)}
.sgn-scrim.sgn-sch{background:rgba(20,16,36,.16)}
.sgn-hd{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 32px;z-index:2}
.sgn .sgn-wm{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:#fff}
.sgn-mk{width:24px;height:24px;border-radius:7px;background:var(--vi);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.sgn-pn{font:500 10px var(--mo);letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.sgn-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px;z-index:1}
.sgn-card{position:relative;width:400px;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:0 18px 50px rgba(20,16,36,.30);padding:28px 30px 24px}
.sgn-card.flat{box-shadow:0 2px 14px rgba(36,31,56,.07);width:100%}
.sgn-h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;outline:none}
.sgn-h1.sm{font-size:20px}
.sgn-sub{margin-top:8px;font-size:13.5px;line-height:1.5;color:#3d3650}
.sgn-sub.sgn-mu,.sgn-mu{color:var(--mu)}
.sgn-addr{font-weight:700;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.sgn-eyec{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mo);color:var(--mu);margin-bottom:10px}
.sgn-dest{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin:0 0 8px}
.sgn-dest b{color:var(--ink);font-weight:600}
/* buttons */
.sgn-stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sgn-rel{position:relative}
.sgn-side{position:absolute;left:calc(100% + 40px);top:12px;white-space:nowrap}
.sgn-b{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;width:100%;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--hair);background:#fff;color:var(--ink);padding:0 16px;white-space:nowrap}
.sgn-b svg{flex:none}
.sgn-b.pri{background:var(--vi);border-color:var(--vi);color:#fff}
.sgn-b.apl{background:#000;border-color:#000;color:#fff;font-family:-apple-system,'SF Pro Text',system-ui,'Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:16px;letter-spacing:-.01em}
.sgn-b.apl svg{margin-top:-3px}
.sgn-b.ggl{background:#fff;border-color:#747775;color:#1f1f1f;font-family:Roboto,Arial,sans-serif;font-weight:500;font-size:14.5px;letter-spacing:.01em}
.sgn-b.sec{background:#fff;border-color:var(--hair);color:var(--ink);font-size:14px}
.sgn-b[aria-disabled]{opacity:.55;cursor:not-allowed}
.sgn-b.sgn-fr{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--vi)}
.sgn-pill{border-radius:999px;height:52px;font-size:16px;box-shadow:0 8px 24px rgba(20,16,36,.35)}
.sgn-quiet{margin-top:18px;padding-top:12px;text-align:center;font-size:13.5px;color:var(--mu)}
.sgn .sgn-ql{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:#c9c4d6;text-underline-offset:3px}
.sgn-back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--mu);background:none;border:0;padding:8px 8px 8px 0;margin:-8px 0 8px;min-height:44px}
.sgn-links{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:16px;font-size:13px;color:#c0bccb}
.sgn .sgn-lk{color:var(--vd);font-weight:600}
.sgn-fine{margin-top:12px;font-size:12px;color:var(--mu);text-align:center;line-height:1.5}
/* method rows */
.sgn-meth{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sgn-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px 12px 12px 12px;color:var(--ink);min-height:64px}
.sgn-row>svg{color:#a19cb0;flex:none}
.sgn-rt{width:36px;height:36px;border-radius:9px;background:var(--lav);color:var(--vd);display:grid;place-items:center;flex:none}
.sgn-rx{display:flex;flex-direction:column;min-width:0;flex:1}
.sgn-rx b{font-size:14.5px;font-weight:700}
.sgn-rx small{font-size:12.5px;color:var(--mu);margin-top:1px}
/* fields */
.sgn-form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.sgn-lbl{display:block;font:500 10px var(--mo);letter-spacing:.11em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.sgn-in{position:relative;height:46px;border:1px solid var(--hair);border-radius:10px;padding:0 14px;display:flex;align-items:center;font-size:14.5px;background:#fff;color:var(--ink);white-space:nowrap;overflow:hidden}
.sgn-in.sgn-pc{color:#a1a1aa}

        ['Partner only', 'Partner', 'Refused boundary', 'Open Markets · See licences · Home', 'Silent redirect to /studio'],
        ['Active Spin-Out Lab', 'Any, Lab active', 'Directory and profiles', 'By the held licences; the Lab admits the route only', 'labRoles admits; zone list still by primary role'],
        ['Admin, not previewing', 'admin', 'Founder shell (researchRole)', 'As Founder', 'Works'],
        ['Admin “View as” Investor', 'previewed: Investor', 'Refused boundary, as that member would see it', 'Open Markets · Home', 'labRoles adds viewMode, so the route admits; the page has no zone'],
        ['Support session', 'the member’s', 'As the member', 'As the member; no licence offer', 'As the member'],
      ])
      + '<div class="sgn-g2"><div><h3>Annotations</h3><ul class="sgn-ul"><li><b>Active Lab.</b> <span class="sgn-mo">labRoles</span> and <span class="sgn-mo">canOpenResearch</span> admit any role while <span class="sgn-mo">spinout_lab_active = 1</span>. That opens the page, not the founder actions: actions still come from the held licences.</li><li><b>Admin preview.</b> “View as” is one previewed licence (<span class="sgn-mo">resolveHeldLicences</span> returns <span class="sgn-mo">[viewMode]</span>). Proposed: the preview shows what that member would see, including the boundary, instead of being admitted by <span class="sgn-mo">viewMode</span>.</li></ul></div>'
      + '<div><h3>Owner decisions</h3><ul class="sgn-ul"><li>' + pol('Mixed licences') + ' A: actions are the union of held licences (an Investor + Founder member gets the founder actions). B: actions follow the primary licence only.</li><li>' + pol('Refusal destination') + ' A: Open Markets is the primary action, with See licences (Account → Licences) and Home. B: See licences first, as Grow does.</li><li>' + pol('Admin preview') + ' A: “View as Investor” shows the boundary. B: keep today’s admission.</li></ul></div></div>');

    /* =================== tablet and dark =================== */
    else if (B === 'RCL13') html = page(LIC.invfounder, profile({ founder: 1, funds: 1, narrow: 1 }), { w: 768, h: 1024 });
    else if (B === 'RCL14') html = page(LIC.invfounder, profile({ founder: 1, funds: 1, who: 'Investor (primary) + Founder' }), { h: 1000 });

    /* =================== RS-16 C · phone =================== */
    else if (B === 'RCL15A') html = pubPhone();
    else if (B === 'RCL15B') html = sphone(A.first({ top: '<p class="sgn-eyec">' + I.lock + 'Research · Companies</p>' }));
    else if (B === 'RCL15C') html = sphone(A.sent({ noBack: 1 }), { back: 1 });
    else if (B === 'RCL15D') html = sphone(A.done(), { noClose: 1 });
    else if (B === 'RCL15E') html = rphone('Companies', mprofile({ founder: 1 }));
    else if (B === 'RCL15F') html = sphone(A.link({ noBack: 1, v: '', msg: bn('err', 'That sign-in link has expired or was already used. Send a new one.') }), { back: 1 });
    else if (B === 'RCL15G') html = sphone(A.ready(), { noClose: 1 });
    else if (B === 'RCL15H') html = sphone(A.first({ msg: bn('info', 'Your session ended. Sign in again to go back to Companies.') }));
    else if (B === 'RCL15I') html = rphone('Research', '<div class="crumb"><a href="#">Research</a>/<b>Companies</b></div>' + boundary({ lic: 'Investor' }));
    else if (B === 'RCL15J') html = rphone('Companies', mprofile({ founder: 1 }));

    /* =================== accessibility =================== */
    else if (B === 'RCL16') html = doc('<p class="sgn-eye">RS-16 C · focus, Back and keyboard</p><h2>Annotations for the build</h2>'
      + tbl(['Topic', 'Specification'], [
        ['Keyboard order', 'Public band: the three cards in reading order; “Open Companies” is the only focusable element in its card (a real link, 44 px tall on phones). Sign-in: as Sign In v2 (SGN-13). Restored page: skip link, sidebar, top bar, the Restored status, h1, actions (Compare, then Add to research), Back to Companies, content, Eadwyn.'],
        ['Focus on arrival', 'After sign-in the restored page moves focus to its h1 (tabindex −1); the “Restored” status is announced once (role=status) and does not take focus. The refusal moves focus to its h1. A filtered directory keeps its scroll at the top.'],
        ['Return focus', 'Back to Companies returns to the directory with the same URL, and focus returns to the row link that opened the profile. Dismissing the status returns focus to the h1.'],
        ['Back', 'The restored page replaces /login in history (<span class="sgn-mo">Navigate replace</span>), so Back from the company goes to the page before the public link, not to the sign-in form. Inside the sheet, Back is one step (SGN-13).'],
        ['Auth failure', 'Errors keep the step and the kept path; focus goes to the field the error names, otherwise the alert is announced and focus stays. Nothing in the error names the destination beyond “Companies”.'],
        ['Sign-up completion', '“Your account is ready” has one primary action, Continue to Companies, focused on arrival; “go to your home” is a link.'],
        ['Stale session', 'A 401 on a Research page clears the session and opens /login?next=&lt;this page&gt;; the card says “Your session ended. Sign in again to go back to Companies.” Licence policy is unchanged and no data is shown until sign-in.'],
        ['Targets and contrast', 'All controls ≥ 44 × 44 px on phones. The link on the public card is #C4B5FD on the dark veil (≥ 4.5:1). State chips carry a glyph and a word, never colour alone.'],
        ['Screen readers', 'The refusal is role=status with its h1; “Refused” is in the text. The Restored status reads “Signed in. This is the page you asked for.” Loading reads “Loading the company…”.'],
      ]));

    /* =================== handoff =================== */
    else if (B === 'RCL17') html = doc('<p class="sgn-eye">RS-16 · handoff · #7044 (part of #7040)</p><h2>Handoff</h2>'
      + '<div class="sgn-g2"><div><h3>Checked on main (87bf3ac4ac)</h3><ul class="sgn-ul">'
      + '<li><b>App.jsx</b>: <span class="sgn-mo">/research/companies</span>, <span class="sgn-mo">/company/:uid</span>, <span class="sgn-mo">/:id</span> and the candidate route use <span class="sgn-mo">guard(labRoles([admin, founder, advisor]))</span>. RoleGuard admits when the browsed role or any held licence is listed (D4473); otherwise it redirects to <span class="sgn-mo">/studio</span>. The page gets <span class="sgn-mo">role={researchRole}</span>, the primary role.</li>'
      + '<li><b>shellConfig.js</b> RESEARCH_ZONES: Companies is in the founder and advisor lists only. <b>ResearchWorkspace.jsx</b> falls back to “Nothing serves this zone yet” for a zone its role list lacks.</li>'
      + '<li><b>researchAccess.js</b> <span class="sgn-mo">canOpenResearch</span>: companies = admin, founder, advisor; checks the primary role, admin and active Lab, not held licences.</li>'
      + '<li><b>researchComparisons.js</b> <span class="sgn-mo">canAddToResearch</span>: founder or admin role. <b>research_project_comparisons.ts</b>: 6 members, 25 per add.</li>'
      + '<li><b>pendingNext.js</b>: <span class="sgn-mo">RETURN_AFTER_LOGIN_PREFIXES</span> = /learning, /grow; destination areas and setup-first prefixes name Grow only; 24 h TTL; 200 characters.</li>'
      + '<li><b>research.ts</b> <span class="sgn-mo">GET /company-directory</span> and <span class="sgn-mo">/:uid</span>: <span class="sgn-mo">requireAuth</span> only; 400 on a bad query, 503 Unreadable, 404 Not found.</li>'
      + '<li><b>CompanyProfile.jsx</b>: Company not found with a link to Companies; Unreadable with Retry. <b>GrowBoundary.jsx</b>: the boundary pattern reused for Companies.</li>'
      + '<li><b>IntelligencePage.jsx / siteIntelligence.js</b>: the Research cards are not links. <b>api.js</b>: a 401 on a protected page goes to a bare <span class="sgn-mo">/login</span>.</li></ul>'
      + '<h3>Requires engineering</h3><ul class="sgn-ul"><li>' + tag('#7044') + ' The Worker reads the same rule on <span class="sgn-mo">/company-directory</span> and <span class="sgn-mo">/company-directory/:uid</span> (held Founder or Advisor, an active Lab, or admin) and answers 403 Refused otherwise. Today any signed-in account can read both.</li><li>Frontend, one rule: research role, zone list, <span class="sgn-mo">canOpenResearch</span> and <span class="sgn-mo">canAddToResearch</span> read the held licences.</li></ul></div>'
      + '<div><h3>Frontend only</h3><ul class="sgn-ul"><li>“Open Companies →” on the public Companies card (<span class="sgn-mo">siteIntelligence.js</span> gains a <span class="sgn-mo">to</span>).</li><li>Add <span class="sgn-mo">/research/companies</span> to <span class="sgn-mo">RETURN_AFTER_LOGIN_PREFIXES</span>, <span class="sgn-mo">DESTINATION_AREAS</span> and <span class="sgn-mo">SETUP_BEFORE_DESTINATION_PREFIXES</span>.</li><li>“Your account is ready · Continue to Companies” after required setup.</li><li>The Restored status; the Companies boundary in <span class="sgn-mo">ROUTE_BOUNDARIES</span> instead of the silent redirect.</li><li>api.js 401 on a protected page: <span class="sgn-mo">/login?next=</span> with the same sanitiser.</li><li>The states on RCL10, using the existing Worker answers.</li></ul>'
      + '<h3>Components and tokens</h3>' + tbl(['Use', 'Reuse'], [
        ['Sign-in', 'Sign In v2 (#6956): AuthShell, AuthCard, the destination line and heading from <span class="sgn-mo">signInContextFor</span>'],
        ['Public', 'Public site kit from #6977 / #6980; the Research band unchanged'],
        ['Research', 'Research v2 shell, CompanyDirectoryZone, CompanyProfile, ResearchActions, Eadwyn rail (#5130)'],
        ['States', 'Platform States chips (D5129); Unavailable on screen for the Worker’s Unreadable'],
        ['Tokens', 'Page #F4F3F7, ink #18181B, violet #7C3AED, lavender #F4F0FE; dark #0B1220 / #111827, text #E5E7EB, violet #A78BFA'],
      ])
      + '<h3>Pending the owner</h3><ul class="sgn-ul"><li>' + pol('Mixed licences') + ' union of held licences (A).</li><li>' + pol('Refusal destination') + ' Open Markets first (A).</li><li>' + pol('Admin preview') + ' shows the boundary (A).</li><li>' + pol('Cross-device return') + ' not kept (A).</li></ul>'
      + '<h3>Open</h3><ul class="sgn-ul"><li>Coordinate the destination line with #6956’s build (#6958) and the card link with #6980.</li></ul></div></div>');

    else html = page(LIC.founder, profile({ founder: 1, funds: 1 }), { h: 1000 });
    return { html: { __html: html } };
  }
