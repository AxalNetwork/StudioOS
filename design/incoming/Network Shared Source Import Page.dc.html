      <li><code>POST …/publish/resume</code>, <code>GET …/receipt</code>, <code>POST …/corrections</code> (scope, review, result).</li>
      <li><code>GET …/coverage/nfx</code> ${TB('#7681')}; <code>POST /directory/orgs/:uid/research-links</code>.</li>
      <li>Every write refuses a support session (403) and anyone not a Super Admin.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NSIH') html = `<div class="${CV} doc"><div><span class="eye">Network sources · #7679 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked on main, what is preserved, and what needs the backend</h2></div>
      <div class="cols"><div><h3>Checked on main (a2677f7615)</h3><ul>
      <li><code>routes/contact_imports.ts</code> (D1351): <code>POST /api/contacts/import/linkedin-csv[?preview=1]</code>, reviews merge | keep | dismiss, the member’s own <code>/book</code>. Own-book only; a support session may not import. Not reused as the shared pipeline.</li>
      <li><code>services/linkedinCsvImport.ts</code>: LinkedIn-specific, <code>MAX_CSV_BYTES</code> 5 MB, <code>MAX_CSV_ROWS</code> 20,000, optional preview. These are facts about that importer, not limits for this one.</li>
      <li>No shared directory, source run, identity review or NFX route exists in <code>cloudflare-worker/src/routes/</code>. <code>admin_network*.ts</code> cover advisor standing and mentor profiles only.</li>
      <li><code>sql/migrations/406_research_fund_sources.sql</code>: per-list verdict republish allowed | cite only | not allowed; <code>202611180052_7166_…</code>: fund rows keyed per vehicle, retired ids in <code>research_fund_directory_uid_moves</code>.</li>
      <li>PR #7687 (#7672, open, not merged): <code>network_directory_sources</code>, <code>…_import_runs</code> (input = accepted + review + skipped), <code>…_entries</code> (person | organization; staged | published | suppressed | archived), <code>…_source_records</code>, <code>…_private_sources</code> (operator only), <code>…_affiliations</code> (source_association, is_current NULL), <code>…_reviews</code>, <code>…_research_links</code> (company | fund_manager | managed_fund_vehicle).</li>
      <li>#7681: owner decision B (2026-11-20), captured subset only; counts as on NSI-08.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>The Network shell and words of #6256 (nwi.js), the D7058 duplicate rules (a name alone never matches; merge only where permitted), Platform States.</li><li>FND-I (#7738) owns the Research private store and promotion; NSI cites FND-I11 and does not redraw it.</li></ul></div>
      <div><h3>Backend required (◇)</h3><ul><li>#7672: the directory schema (PR #7687), a stable key for Folk rows, mandate money fields, previous-investments evidence; fix the research-link foreign key on fund re-imports.</li><li>#7674: every admin route on NSI-17, plan hash and stale refusal, resumable batches, corrections and rollback, suppression, publication to members, step-up.</li><li>#7681: the NFX adapter, coverage read, list memberships, export upload and the continuation manifest.</li></ul>
      <h3 style="margin-top:12px">Pending the owner (⚑, A drawn)</h3><ul><li>Q1: who publishes. A: a Super Admin with step-up; Admins read only.</li><li>Q2: the 239 unverified Folk affiliations. A: publish as “Listed with [organization] by Folk”, never as a current role. B: hold them until reviewed one by one.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Nothing ships without the backend above. Once it exists: the console page, mapping table, review sheet, plan, receipt, states, tablet, phone and dark use existing Network components.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>#7676 and #7680 consume the published people and affiliations; their canvases decide how members see them.</li><li>Whether an Admin (not Super Admin) may stage runs.</li></ul></div></div></div>`;

    if (!html) html = '<div>unknown board</div>';
    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nsi-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
