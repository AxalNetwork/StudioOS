      ${stcard('Loading · each section on its own', 'Leads from your pages', `${SCOPE(A, { reading: 1 })}<div class="nrl-skel"><div><span class="sk" style="width:30%;height:10px"></span><span class="sk" style="width:22%;height:10px"></span></div><div><span class="sk" style="width:26%;height:10px"></span><span class="sk" style="width:24%;height:10px"></span></div></div><p class="foot">Whichever section answers first is shown first.</p>`)}
      ${stcard('First use · read, and empty', 'My relationships', `<p class="sub"><b>Your book is empty.</b> Import your LinkedIn connections or a spreadsheet. Nobody is contacted.</p><div class="acts"><button type="button" class="btn">Import contacts</button><button type="button" class="btn">Add person</button></div><p class="foot">0 people · read 14:02</p>`)}
      ${stcard('First use · startup with no signups yet', 'Leads from your pages', `<dl class="nrl-scope"><div><dt>Startup</dt><dd><b>${Bq.n}</b></dd></div><div><dt>Count</dt><dd><b class="mo">0</b> leads · read 14:02</dd></div></dl><p class="sub"><b>No one has signed up through ${Bq.n}’s pages yet,</b> and you have not invited anyone. Leads appear here when someone does.</p><a class="btn t" href="#" style="align-self:flex-start">Open Brand &amp; Pages →</a>`)}
      ${stcard('Filtered-empty · in the loaded page', 'Leads from your pages', `${CHIPS(A, { aud: 'Investors', cold: 1 })}<div class="nt a"><span class="ic" aria-hidden="true">½</span><div><b>No investor in the 200 loaded is going cold.</b> 14 leads are not loaded and have not been checked.</div></div><div class="acts"><button type="button" class="btn">Load the remaining 14</button><button type="button" class="btn t">Clear filters</button></div>`)}
      ${stcard('Filtered-empty · whole book', 'My relationships', `<p class="sub"><b>No one in your book matches “zeta” with Has open follow-up.</b> The search and the filter ran on all 142.</p><button type="button" class="btn t" style="align-self:flex-start">Clear search and filter</button>`)}</div>`);

    /* ===== NRL4B · partial failure, stale, retry ===== */
    else if (B === 'NRL4B') html = crop(1400, `<div class="g3">
      ${stcard('Partial read failure · next page', 'Leads from your pages', `${SCOPE(A)}<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div><b>The remaining 14 could not be read.</b> The 200 already loaded are unchanged, and the counts still say “of 200 loaded”.</div></div><button type="button" class="btn" style="align-self:flex-start">Try again</button>`, 'bad')}
      ${stcard('Stale · read a while ago', 'Leads from your pages', `<div class="ch">${STALE('read 13:38, 24 min ago')}<button type="button" class="btn">Read again</button></div><p class="sub">Rows, counts and export stay as read at 13:38 and say so. Read again replaces them only when the new read lands.</p><p class="foot">Stale after 15 minutes on screen, or when the tab returns from the background.</p>`)}
      ${stcard('Refreshing · rows kept', 'Leads from your pages', `<div class="ch"><span class="s">◌ Reading again… <span class="mo">since 14:02:10</span></span><button type="button" class="btn" aria-disabled="true" aria-busy="true">Read again</button></div><p class="sub">The 200 rows read at 13:38 stay usable, marked Stale. Export stays on and names 13:38 in the file.</p>`)}
      ${stcard('Retry · 1 of 3', 'Leads from your pages', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Leads for ${A.n} could not be read.</b> Not an empty list: no count is shown.</div></div><button type="button" class="btn">Try again</button><p class="foot">Focus lands on Try again. My relationships stays usable above.</p>`, 'bad')}
      ${stcard('Retry · 2 of 3', 'Leads from your pages', `<div class="ch"><span class="s">◌ Trying again…</span></div><button type="button" class="btn" aria-disabled="true" aria-busy="true">◌ Trying again</button><p class="foot">The button keeps focus and says it is busy. A second press does nothing.</p>`)}
      ${stcard('Retry · 3 of 3', 'Leads from your pages', `${SCOPE(A)}<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Leads read at 14:02.</b> 214 on ${A.n}, 200 loaded.</div></div><p class="foot">Announced once. Focus moves to the section heading.</p>`)}</div>`);

    /* ===== NRL5 · sibling failure keeps the other usable ===== */
    else if (B === 'NRL5') html = shell(RELPAGE(A, [], { bad: 1, book: { stale: 0 } }), { h: 1180 });
    else if (B === 'NRL5B') html = crop(1400, `<div class="g">
      <section class="c6 cd"><span class="tag">Person sheet · notes failed, follow-ups read</span><div class="ch"><div><span class="eye">Relationship</span><h2>[Iris Chen]</h2><p class="sub">Partner · [Harbor Lane Capital] · LinkedIn import 2026-10-30</p></div></div>
      <div class="sec"><h3>Follow-ups <span class="foot">· 3 open, 2 overdue · read 14:02</span></h3>
      <label class="ck"><input type="checkbox"> Send deck ${NEED}<small>due 2026-11-03</small></label><label class="ck"><input type="checkbox"> Book diligence call ${NEED}<small>due 2026-11-09</small></label><label class="ck"><input type="checkbox"> Intro to [Tom Becker]<small>no due date</small></label><button type="button" class="btn" style="align-self:flex-start">Add follow-up</button></div>
      <div class="sec"><h3>Private notes</h3><div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>The notes could not be read.</b> Not “no notes”. Follow-ups above still work. <button type="button" class="btn t">Try again</button></div></div><p class="foot">Add note is off until the notes are read, so a new note cannot hide older ones.</p></div>
      <div class="sec"><h3>History</h3><p class="sub"><span class="s">½ Partial</span> Follow-ups done and the import date are listed; notes are missing until they are read.</p></div></section>
      <section class="c6 cd"><span class="tag">Your contacts (other licences) · same rule</span><div class="ch"><h2>[Morgan Vale] · notes and follow-ups</h2></div>
      <div class="g2"><div class="nrl-half"><span class="eye">Notes · read</span><p class="sub">Met at the [Elm Studio] launch. Wants the pilot deck.</p><button type="button" class="btn t">Add note</button></div><div class="nrl-half bad"><span class="eye">Follow-ups · could not be read</span><p class="sub">? Not “no follow-ups”.</p><button type="button" class="btn">Try again</button></div></div>
      <p class="foot">${LBL('On main')} NetworkContacts reads notes and follow-ups together, so one failure hides both. Read them apart, as FounderRelationshipBook does.</p></section></div>`);
    else if (B === 'NRL5C') {
      const fRow = (r) => `<tr><td><b>${r[0]}</b><small>${r[1]}</small></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`;
      html = crop(1400, `<div class="g">
      <section class="c6 cd"><span class="tag">Partner · firm book read, roster failed</span><div class="ch"><h2>Firm relationship book</h2><span class="sm">48 contacts · 12 organizations</span></div>
      <div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>The firm roster could not be read,</b> so owners cannot be changed here. The book itself is read and usable. <button type="button" class="btn t">Try again</button></div></div>
      <table class="tbl"><thead><tr><th scope="col">Contact</th><th scope="col">Activity · source</th><th scope="col">Owner</th><th scope="col">Next</th></tr></thead><tbody>
      ${fRow(['[Rui Costa]', '[Harbor Seed]', '<span class="mo">2026-10-02</span><small>12 interactions logged · last 43 days ago</small>', '[Theo Grant]', '<button type="button" class="btn" aria-disabled="true">Change owner</button>'])}
      ${fRow(['[Paula Reyes]', '[Arden Bio]', `<span class="mo">2026-08-28</span><small>3 interactions logged · last 78 days ago</small><div style="margin-top:3px">${COLD}</div>`, '<span class="s">○ Unassigned</span>', '<button type="button" class="btn" aria-disabled="true">Take it</button>'])}
      ${fRow(['[Wen Li]', '[Loomcraft]', `${NOI}<small>0 interactions logged</small>`, '<span class="s">○ Unassigned</span>', '<button type="button" class="btn" aria-disabled="true">Take it</button>'])}</tbody></table>
      <p class="foot">Activity replaces Strong · Working · Thin. Those were computed from a count and an age and read as a judgement; the count and the date are what was recorded.</p></section>
      <section class="c6 cd bad"><span class="tag">Partner · firm book failed</span><div class="ch"><h2>Firm relationship book</h2></div>
      <div class="g3">${J(['Contacts', 'Unassigned', 'Platform-sourced'].map((t) => `<div class="tile"><span class="eye">${t}</span><span class="s ur">? Could not be read</span></div>`))}</div>
      <div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Your firm’s book could not be read.</b> No figure is shown: a 0 here would be a count nobody read. <button type="button" class="btn">Try again</button></div></div>
      <p class="foot">${LBL('On main')} RelationshipsPage shows the error above tiles reading 0, 0 and 0.</p><p class="foot">The roster read on its own: owners are listed in the picker when the book is back.</p></section></div>`);
    }

    /* ===== NRL6 · tablet 768 ===== */
    else if (B === 'NRL6') {
      const tRow = (l) => `<tr><td><b class="nrl-nm2">${l.n}</b><small class="nrl-cl">${l.o || 'Organization: Not recorded'}</small><small>${l.p} · ${l.ty}</small></td><td>${l.li ? `<span class="mo">${l.li}</span><small>reply · ${l.ld} days</small>${l.cold ? '<div>' + COLD + '</div>' : ''}` : NOI}</td><td>${fuCell(l.f, 1)}</td></tr>`;
      html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ sub: 'The people you keep, and your startup’s leads, counted apart.' })}
      <section class="cd"><div class="ch"><h2>My relationships</h2><span class="sm">${BOOK_N} people · private to you</span></div><div class="tools"><input class="inp" style="min-width:0;flex:1" placeholder="Search by name or organization" aria-label="Search your relationships"><button type="button" class="dd">Filters ▾</button></div>
      <table class="tbl"><thead><tr><th scope="col">Person · organization</th><th scope="col">Last recorded activity</th><th scope="col">Follow-ups</th></tr></thead><tbody>${J(BOOK.slice(0, 3).map((b) => `<tr><td><b>${b.n}</b><small>${b.o || 'Not recorded'} · ${b.r || 'role not recorded'}</small></td><td class="mo">${b.la[0]}<small>${b.la[1]}</small></td><td>${fuCell(b.f, 1)}</td></tr>`))}</tbody></table>${pager(1, 25, BOOK_N, 6)}</section>
      <section class="cd"><div class="ch"><h2>Leads from your pages</h2><button type="button" class="btn">Export…</button></div>${SCOPE(A)}<div class="tools"><button type="button" class="dd">Type: Everyone · 214 ▾</button><button type="button" class="dd">▽ Going cold · 9 of 200 loaded</button></div>
      <table class="tbl"><thead><tr><th scope="col">Person · source</th><th scope="col">Last interaction</th><th scope="col">Follow-ups</th></tr></thead><tbody>${tRow(LONG)}${tRow(LEADS_A[0])}${tRow(LEADS_A[1])}</tbody></table>
      <div class="pg"><span>200 of 214 loaded</span><button type="button" class="btn">Load the remaining 14</button></div></section></main></div>`;
    }

    /* ===== NRL7 · phone 390 ===== */
    else if (B === 'NRL7A') html = phone('Relationships', `${MSEL}${LSEG('b')}<p class="foot">${BOOK_N} people · private to you · not tied to a startup</p><label for="p1" class="sr">Search your relationships</label><input id="p1" class="inp" style="min-height:44px;min-width:0;width:100%" placeholder="Search by name or organization">${pcBook(BOOK[2])}${pcBook(BOOK[0])}${pcBook(BOOK[5])}<p class="foot">1–25 of ${BOOK_N} people · <a href="#">Next 25</a></p>`, '<button type="button" class="btn">Import</button><button type="button" class="btn p">Request introduction</button>', {});
    else if (B === 'NRL7B') html = phone('Relationships', `${LSEG('l')}<dl class="nrl-scope nrl-ph1"><div><dt>Startup</dt><dd><b>${A.n}</b></dd></div><div><dt>Count</dt><dd><b class="mo">${A.tot}</b> leads · whole startup</dd></div><div><dt>Loaded</dt><dd>${PART(`<b class="mo">${A.got}</b> of <b class="mo">${A.tot}</b>`)}</dd></div></dl><div class="seg" style="align-self:flex-start"><button type="button" role="radio" aria-checked="true">Everyone</button><button type="button" role="radio" aria-checked="false">▽ Cold · 9 of 200</button></div>${pcLead(LONG)}${pcLead(LEADS_A[0])}${pcLead(LEADS_A[1])}`, '<button type="button" class="btn">Load the remaining 14</button><button type="button" class="btn">Export…</button>', {});
    else if (B === 'NRL7C') html = phone('Relationships', `${LSEG('l')}<div class="nrl-live" role="status">${LBL('Announced')} “Showing leads for [Quill Analytics]. Reading.”</div><dl class="nrl-scope nrl-ph1"><div><dt>Startup</dt><dd><b>${Bq.n}</b> <span class="nrl-sw">switched 14:03:02</span></dd></div><div><dt>Count</dt><dd><span class="s">◌ Reading the count…</span></dd></div></dl><div class="nrl-skel">${J([0, 1, 2].map(() => '<div class="pc"><span class="sk" style="width:60%;height:11px"></span><span class="sk" style="width:80%;height:9px"></span><span class="sk" style="width:40%;height:9px"></span></div>'))}</div><p class="foot">Reading leads for ${Bq.n}… Nothing from [Kelp Bio] is kept here. My relationships is unchanged.</p>`, '<button type="button" class="btn" aria-disabled="true">Export · waits for the read</button>', {});
    else if (B === 'NRL7D') html = phone('Lead', `<span class="eye">Lead · ${A.n}</span><h1 style="font-size:20px;font-weight:800;overflow-wrap:anywhere">${LONG.n}</h1><p class="sub" style="overflow-wrap:anywhere">${LONG.o}</p>
      <div class="pc"><span class="eye">Signed up</span><span><span class="mo">${LONG.su}</span> · /pricing page · Investor</span><span class="eye" style="margin-top:6px">Last interaction</span><span><span class="mo">${LONG.li}</span> · reply logged · ${LONG.ld} days ago</span><span class="eye" style="margin-top:6px">Strength · set by you</span><span>${LONG.str}</span></div>
      <div class="sec"><h3>Follow-ups · 3 open, 1 overdue</h3><ul class="lst">${J(LONG.f.slice(2).map((t, i) => `<li><div><b style="font-size:13px">${t.split(' · ')[0]}</b><small>${i === 0 ? '◷ Overdue · ' : ''}${t.split(' · ')[1]}</small></div><button type="button" class="btn">Done</button></li>`))}</ul></div>`, '<button type="button" class="btn">Log a reply</button><button type="button" class="btn p">Add follow-up</button>', { back: 1 });
    else if (B === 'NRL7E') html = phone('Relationships', `${LSEG('b')}<label for="p5" class="sr">Search your relationships</label><div class="inp nrl-focus" style="min-height:44px;min-width:0;width:100%;color:var(--ink)">iris<span class="nrl-caret" aria-hidden="true"></span></div><p class="foot" role="status">1 person matches “iris” in all ${BOOK_N}.</p>${pcBook(BOOK[2])}<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>Leads could not be read.</b> Your relationships still work. <button type="button" class="btn t">Try again</button></div></div>`, null, { kb: KB });

    /* ===== NRL8 · desktop table with long content ===== */
    else if (B === 'NRL8') html = crop(1400, `<section class="cd nrl-sec"><span class="tag">Desktop · long names, long organizations, several follow-ups</span><div class="ch"><h2>Leads from your pages</h2><span class="sm">${A.tot} leads · ${A.got} loaded</span></div>
      <table class="tbl nrl-fixed"><colgroup><col style="width:22%"><col style="width:13%"><col style="width:10%"><col style="width:15%"><col style="width:22%"><col style="width:9%"><col style="width:9%"></colgroup><thead>${leadHead}</thead><tbody>${leadRow(LONG, 1)}${leadRow(LEADS_A[2], 1)}${leadRow(LEADS_A[0], 1)}</tbody></table>
      <div class="g3">${AN(1, 'Names and organizations wrap to two lines and never truncate mid-word; the full text is the link’s accessible name and is shown in full on the sheet.')}${AN(2, 'Up to three follow-ups are listed in the cell, overdue first; more reads “+N more” and opens the sheet.')}${AN(3, 'Below 1180 px the Strength and Status columns move under Person; below 768 rows become cards.')}</div></section>`);

    /* ===== NRL9 · dark ===== */
    else if (B === 'NRL9') html = shell(RELPAGE(A, LEADS_A), { h: 1640 });
    else if (B === 'NRL9B') html = shell(RELPAGE(Bq, [], { reading: 1, banner: `<div class="nrl-live" role="status">${LBL('Announced')} “Showing leads for [Quill Analytics]. Reading.”</div>` }), { h: 1180, sw: Bq.n });

    /* ===== NRL10 · accessibility and interaction notes ===== */
    else if (B === 'NRL10') html = `<div class="${CV} doc"><div><span class="eye">Network › Relationships · #7061 · accessibility and interaction</span><h2 style="font-size:22px;margin-top:4px">Keyboard, announcements, mobile keyboard and recovery</h2></div>
      <div class="cols">
      <div><h3>Keyboard order</h3><ul><li>Switcher → Ask → Request introduction → the four links → My relationships (search, Source, Has open follow-up, ↻, Import, Add person, rows, pager) → Leads (↻, Export, scope, type filter, chips, rows, Load the remaining) → Eadwyn.</li><li>Each section heading is a landmark with its own count; screen-reader users jump between the two lists with the region list.</li><li>Chips are toggle buttons (aria-pressed); the type filter is a radio group. Disabled controls stay focusable with aria-disabled and say why.</li></ul>
      <h3 style="margin-top:12px">Focus return</h3><ul><li>Closing the Person sheet or the Export dialog returns focus to the row or button that opened it.</li><li>After a switch, focus stays on the switcher. After Try again succeeds, focus moves to the section heading.</li></ul>
      <h3 style="margin-top:12px">Announcements (polite live region per section)</h3><ul><li>Switch: “Showing leads for [Quill Analytics]. Reading.” then “37 leads for [Quill Analytics].”</li><li>A dropped answer for another startup announces nothing.</li><li>Load more: “14 more leads loaded. All 214 loaded.”</li><li>Failure (assertive): “Leads for [Kelp Bio] could not be read. Try again.” The book’s region is not interrupted.</li><li>Filter: “9 of the 200 loaded are going cold.”</li></ul></div>
      <div><h3>Mobile keyboard</h3><ul><li>Search inputs are type=search with enterkeyhint=search; the sticky action bar hides while the keyboard is open so no target sits under it.</li><li>Results announce as the count changes, after the 250 ms pause.</li><li>The page scrolls the focused input above the keyboard; 44 px targets throughout.</li></ul>
      <h3 style="margin-top:12px">Error recovery</h3><ul><li>Every failure names the section and keeps the other section usable; no failure draws 0 or an empty list.</li><li>Try again is busy while it runs; a second press does nothing.</li><li>A failed next page keeps the loaded rows and their “of 200 loaded” units.</li><li>A failed save keeps the typed text and says what was kept.</li></ul>
      <h3 style="margin-top:12px">Clickable path</h3><ul><li>NRL1 → Jun Park’s Going cold → NRL1B; Export… → NRL3; switcher → NRL2 → NRL2B steps → NRL2C; ↻ on a failed section → NRL4B retry; tablet NRL6; phone NRL7A to NRL7E.</li></ul>
      <h3 style="margin-top:12px">Colour</h3><ul><li>Going cold (▽, dashed), Needs attention (◷), No interaction recorded (—), Stale (↺), Partial (½) and Could not be read (?) each have a glyph and a word; dark mode keeps them.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NRLH') html = `<div class="${CV} doc"><div><span class="eye">Network › Relationships · #7061 · brief 6 of 6 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>workspaces/NetworkWorkspace.jsx</code>: a founder’s Relationships draws <code>FounderRelationshipBook</code> (“My relationships”) and then <code>FounderNetworkRelationships</code> (the startup’s project-linked contacts) on one page.</li>
      <li><code>FounderNetworkRelationships.jsx</code>: <code>load()</code> and <code>loadMore()</code> keep no request token; a page asked for startup A can land after a switch to B and is appended or shown. Chips, “Going cold” and “Strong” are over loaded rows; Export writes the loaded <code>visible</code> rows.</li>
      <li><code>lib/networkBook.js</code>: <code>isCold</code> reads <code>last_activity_at</code>, which is stamped at creation, so a never-contacted signup is cold on day 61.</li>
      <li><code>routes/contacts.ts</code> <code>GET /</code>: <code>project_id</code>, <code>audience</code>, <code>status</code> filters; <code>total</code> and <code>counts</code> over the whole scope; pages of 200 with <code>has_more</code>/<code>next_cursor</code>; <code>last_reply_at</code> from contact replies; <code>next_task_due</code>, <code>open_tasks</code>. <code>PUT /:uid</code> also stamps <code>last_activity_at</code>.</li>
      <li><code>FounderRelationshipBook.jsx</code> + <code>relationshipBookModel.js</code>: <code>GET /api/contacts/book</code>, serial guard on reads, notes and follow-ups read apart. Last activity = note, follow-up done or entry.</li>
      <li><code>NetworkContacts.jsx</code>: notes and tasks in one <code>Promise.all</code>.</li>
      <li><code>RelationshipsPage.jsx</code>: book and roster via <code>allSettled</code>; a failed book sets <code>items: []</code> under the error, so tiles read 0; <code>strengthOf</code> is Strong/Working/Thin from count and age.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>NW2’s two sections, “My relationships · 142 people · private to you” and “Leads from your pages”; NWI header, links, state words and shell. Leads (NW2.2) is extended, not redrawn.</li></ul></div>
      <div><h3>Frontend only</h3><ul><li>Reject answers for a startup that is no longer selected (load and loadMore); empty the section and disable Export, filters and Load more while reading.</li><li>Scope strip; server-counted type filter via <code>audience</code>; “of 200 loaded” units; Export dialog that can read every page first.</li><li>Going cold from <code>last_reply_at</code>; No interaction recorded when there is none; Needs attention only for overdue follow-ups; Strength labelled “set by you”.</li><li>Partner tiles show Could not be read on a failed book; activity count and date in place of Strong/Working/Thin.</li><li>NetworkContacts reads notes and follow-ups apart. All states, tablet, phone and dark.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇ #7061)</h3><ul><li>Server counts for Going cold, Needs attention and No interaction recorded (today they are over the loaded page).</li><li>Direction and author of the last reply on the list.</li><li>An exchange log on book contacts, so My relationships can show Going cold.</li><li>Cross-store: leads (contacts) and the book (contact_imports) are separate stores; nothing links one person across them.</li></ul>
      <h3 style="margin-top:12px">Owner pick drawn (⚑)</h3><ul><li>Q1 A: on a switch, show the new startup at once and read; B keeps old rows dimmed until the new read lands.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Whether a logged reply alone is the right “interaction”, or meetings should count once recorded.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nrl-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
