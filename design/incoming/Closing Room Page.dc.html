    const ph2 = () => phone(pbar('', 'Closing'), `<div style="font:800 20px/1.2 ${SG};letter-spacing:-.02em">Payment instructions</div>${PWN('[Acme Robotics]')}${cd([['Payee', '[Acme Robotics, Inc.]'], ['Bank', '[Bank Name]'], ['Account', mono('••••4821', 'font-weight:600')], ['Routing (ABA)', mono('[routing number]')], ['Reference', mono('[ACME-SEED-0007]', 'font-weight:600')], ['Amount', mono('$250,000.00')]].map((r, i) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;${i ? `border-top:1px solid ${c.hl};` : ''}font:500 13px/1.35 ${SG}"><span style="color:${c.mu}">${r[0]}</span><span style="text-align:right">${r[1]}</span></div>`).join(''), 'gap:0;padding:6px 16px')}${btn('Reveal full number', 's', 0, 'width:100%;height:48px')}${mu('Revealing is recorded. The number shows for 30 seconds.', 'text-align:center')}`);
    const ph3 = () => phone(pbar('Closing'), `${eb('[Acme Robotics] · Seed')}${cd(`<div style="display:flex;align-items:center;gap:8px">${h3('From Mercury')}<span style="flex:1"></span>${dot(sc('Connector'), 7)}<span style="font:600 11.5px/1 ${SG};color:${c.mu}">Connector</span></div>${tx('A payment of ' + mono('[$250,000.00]') + ' on ' + mono('[14 Oct]') + ' from ' + mono('••••7710') + ' fits this commitment.')}<div style="display:grid;gap:8px">${btn('Accept', 's', 0, 'width:100%;height:44px')}${btn('Not this one', 't', 0, 'width:100%;height:44px')}</div>`)}`, sheet('Accept this match?', `${tx('It records ' + mono('[$250,000.00]') + ' as Sent, not yet confirmed, from your Mercury.')}${mu("The line is Received when [Acme Robotics]'s bank confirms it. [Acme Robotics] is told.")}`, btn('Accept', 'p', 0, 'width:100%;height:48px') + btn('Not this one', 's', 0, 'width:100%;height:48px')));

    const BD = {
      CP1: () => pgc(1030, shell('F', 'Raise', roomF())) + below(`<div style="display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;width:1172px">${cd(H('', 'Closing · [Acme Robotics] Seed', 'One place for the paper, the money and the cap table of this round.', btn('Add the receiving account', 'p') + more(), pl('Post-money SAFE', 'v')).replace('margin-bottom:18px', 'margin-bottom:0'))}${cd(`${h3("Your company's receiving account")}<div>${pl('Not set', 'a')}</div>${mu('Direct and third-party investors see no payment instructions until it is set.')}${btn('Add the receiving account', 's', 1, 'justify-self:start')}`)}</div>`, 'Before the receiving account is set'),
      CP2: () => { PR.I.co = '[Name] · personal'; PR.I.ini = 'NM'; return pgc(WH[1], shell('I', 'Deals', iroom())); },
      CP3: () => pgc(WH[1], adBg() + drw(560, 'Step 1 · Paper', 'Prepare the paper', cp3(), btn('Preview', 'p') + mu('Send for signature opens after a preview.'), mu(`[Fund I] · ${mono('$500,000.00')} · Axal VC fund`))),
      CP4: () => pgc(1020, shell('F', 'Raise', cp4page())) + below(crop('Super Admin · countersign', 640, 392, cs4(1)) + crop('Admin · the same step', 520, 392, cs4(0))),
      CP5: () => pgc(WH[1], adBg() + dlg(820, 'Choose the route for [Northwind Syndicate SPV]', cp5(), `${mu('The founder and the investor see the route you set.', 'margin-right:auto')}${btn('Back', 's')}${btn('Set route', 'p')}`)),
      CP6: () => pgc(WH[1], shell('I', 'Deals', cp6())),
      CP7: () => gnd(crop('Super Admin', 676, 800, `<div style="padding:16px">${fundCard(1)}</div>`) + crop('Admin', 676, 800, `<div style="padding:16px">${fundCard(0)}</div>`)),
      CP8: () => pgc(WH[1], adBg() + drw(560, 'Third-party fund · line 4 of 4', 'Record a third-party fund', cp8(), btn('Save the record', 'p') + btn('Cancel', 't'), mu(`[Harbor Ventures III] · ${mono('$300,000.00')}`))),
      CP9: () => { PR.I.co = '[Name] · personal'; PR.I.ini = 'NM'; return pgc(940, shell('I', 'Deals', iroom()) + scr() + drw(520, 'Pay · Direct', 'Payment instructions', payD(), btn('I have sent it', 'p') + btn('Close', 't'), mu(`For your ${mono('$250,000.00')} SAFE in [Acme Robotics]`))) + below(dlg(440, 'Reveal the full account number?', `${tx(`This is recorded: [Name], ${mono('[21 Oct 2026, 10:12]')}.`)}${mu('The number shows for 30 seconds, then hides again.')}`, btn('Cancel', 't', 1) + btn('Reveal for 30 seconds', 'p', 1), 'S') + dlg(470, 'The company changed its receiving account', `${tx(`[Acme Robotics] changed its receiving account on ${mono('[20 Oct]')}. Call the company on a number you already hold before you pay.`)}${mu('Shown to investors with an unpaid line.')}`, btn('Close', 't', 1) + btn('I have called', 'p', 1), 'S'), 'Two dialogs'); },
      CP10: () => pgc(980, adBg() + drw(560, 'Receipt · line 2 of 4', '[Northwind Syndicate SPV]', cp10(), btn('Record a transfer', 's') + btn('Upload a bank confirmation', 's'), `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pl('Syndicate (SPV)', 'n')}${mono('$400,000.00', 'font-weight:600')}${sp('Sent, not yet confirmed')}</div>`)) + below(rtD() + ubD(), 'What each admin button opens'),
      CP11: () => gnd(`<div style="display:grid;gap:8px">${eb('The dialog, over the closing room')}${cp11()}</div><div style="display:grid;gap:8px">${eb('Priced-round variant')}${cp11b()}</div>`),
      CP12: () => gnd(`<div style="display:grid;gap:8px">${eb('The card, after Closed')}${rep()}</div><div style="display:grid;gap:8px">${eb('The dialog')}${dlg(440, 'Start reporting duties?', `${tx('Each investor above gets your updates through Grow.')}${mu('[Harbor Ventures III] and [Name] start once you and they confirm the default terms.')}`, btn('Back', 't', 1) + btn('Start', 'p', 1), 'S')}</div>`),
      CP13: () => pgc(WH[1], shell('AD', 'Contracts', desk())),
      CP14: () => pgc(1420, shell('SA', 'Contracts', roomA('SA'))) + below(`<div style="width:340px">${actsP(0)}</div>`, 'The same panel, as an Admin sees it'),
      CP15: () => pgc(WH[1], shell('SA', 'Contracts', roomA('SA')) + scr() + drw(560, 'Closing · [Acme Robotics] Seed', 'Activity', `<div style="display:flex;gap:6px;flex-wrap:wrap">${fpill('All', 1)}${STEPS.map((t, i) => fpill((i + 1) + ' ' + t)).join('')}</div><div style="display:grid">${EVT.map(e => evRow(e, 1)).join('')}</div>`, btn('Export CSV', 's') + mu('Append-only. Nothing here can be edited or removed.'))),
      CP16: () => gnd(crop('Desk with no closings', 436, 560, `<div style="padding:18px">${H('Contracts › Closings', 'Closings', 'Every round from signed terms to money received.', '')}${cd(`${h3('No closings yet.')}${mu("Open one when a deal's terms are agreed.")}${btn('Open a closing', 'p', 1, 'justify-self:start')}`)}</div>`) + crop('Room with no lines', 436, 560, `<div style="padding:18px">${H('Raise › Capital relationships › Closing', 'Closing · [Acme Robotics] Seed', '', '')}${cd(`${h3('No commitment on this deal yet.')}${mu('Lines appear here when an investor commits in the deal room.')}`)}</div>`) + crop('Evidence with nothing', 436, 560, `<div style="padding:18px;display:grid;gap:12px">${eb('Receipt · line 4 of 4')}<div style="font:800 19px/1.2 ${SG};letter-spacing:-.02em">[Harbor Ventures III]</div>${cd(`${h3('Evidence')}${mu('No evidence recorded for this line yet.')}`)}</div>`)),
      CP17: () => pgc(WH[1], shell('F', 'Raise', roomF({ tiles: tiles([skT('Committed'), skT('Signed'), skT('Received'), skT('Closing deadline')]), lines: skC('Lines', 3), right: skC("Your company's receiving account", 1) + skC('Needs you', 2) }))),
      CP18: () => gnd(crop('One block failed · investor room', 676, 560, `<div style="padding:18px;display:grid;gap:14px">${tiles([tile('Your line', '$250,000.00', 'Direct'), tile('Received', '—', 'Could not be read')], 2)}${cd(`${h3('From Mercury')}${note('Your Mercury could not be read.', 'd')}${btn('Try again', 's', 1, 'justify-self:start')}${mu('The rest of the closing room still shows. A block that could not be read is never shown as zero.')}`)}</div>`) + crop('The room failed', 676, 560, `<div style="padding:18px">${H('Raise › Capital relationships › Closing', 'Closing · [Acme Robotics] Seed', '', more())}${cd(`${h3('This closing could not be read.')}${mu('That is not the same as there being nothing to close.')}${btn('Try again', 'p', 1, 'justify-self:start')}`)}</div>`)),
      CP19: () => gnd(crop('Explorer', 676, 420, np('E', '', noAcc('Closing rooms open to the founders and investors of a deal.', btn('Go to your home', 'p', 1, 'justify-self:start')))) + crop('Advisor', 676, 420, np('A', '', noAcc('Closing rooms open to the founders and investors of a deal.', btn('Go to your home', 'p', 1, 'justify-self:start')))) + crop("Another investor opens a line that isn't theirs", 676, 420, np('I', 'Deals', noAcc("Only this line's investor, the founder and the studio team see it.", btn('Back to your line', 's', 1, 'justify-self:start')))) + crop('Operating Partner', 676, 420, np('O', 'Delivery', opP()))),
      CP20: () => `<div style="padding:30px;display:flex;gap:25px">${ph1()}${ph2()}${ph3()}</div>`,
      CP21: () => pgc(WH[1], shell('AD', 'Contracts', desk()))
    };
    const out = (BD[B] || BD.CP1)();
    return { html: { __html: root(out) } };

  }
}
