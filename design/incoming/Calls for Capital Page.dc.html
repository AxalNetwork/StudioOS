    const cfCallPage = () => cfRH(cfBarOpen) + cfHead('Open', '[Seed extension]', CFSX) + `<div style="display:grid;gap:16px">${cfCStrip()}<div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start"><div style="display:grid;gap:16px;min-width:0">${cfFun()}${cfRespT()}</div>${cfQs()}</div>${cfFoot8}</div>`;
    const cfCrop = (lab, inner) => crop(lab, 676, 300, `<div style="padding:18px 20px">${inner}</div>`);

    // CLS11 drawers
    const cfKv = (k, v) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid ${c.hl};font:500 12.5px/1.35 ${SG}"><span style="color:${c.mu}">${k}</span><span style="text-align:right">${v}</span></div>`;
    const cfTl = (when, t, sub) => `<div style="display:grid;grid-template-columns:12px minmax(0,1fr) 64px;gap:10px;align-items:start;padding:9px 0;border-top:1px solid ${c.hl}"><span style="margin-top:5px">${dot(VIO, 8)}</span><div style="display:grid;gap:3px;min-width:0"><span style="font:600 12.5px/1.35 ${SG}">${t}</span>${sub ? `<span style="font:400 12px/1.4 ${SG};color:${c.mu}">${sub}</span>` : ''}</div>${mono(when, 'font-size:11.5px;color:' + c.mu + ';text-align:right;display:block')}</div>`;
    const cfRecD = () => drw(560, 'Recipient · chosen', '[Bluefern Capital]', `<div>${cfKv('Contact', '[Name] · Partner')}${cfKv('Email', mono('[name]@[bluefern].example', 'font-size:12px'))}${cfKv('Told on Axal', cfD('1 Oct 2026'))}${cfKv('Furthest response', cfRp('Indicated an amount'))}</div>${cd(`${eb('Amount indicated')}<div style="display:flex;align-items:center;gap:10px">${mono('$250,000', 'font-size:22px;font-weight:700')}${cfSrc('Recorded')}</div>${mu('Indicative. It is an intention, not a payment and not a signed investment.', 'font-size:12px')}`, 'gap:8px')}<div>${eb('Responses')}${cfTl('3 Oct', 'Opened the call')}${cfTl('8 Oct', 'Asked for the data room', 'You granted access on 9 Oct')}${cfTl('20 Oct', 'Asked a question')}${cfTl('24 Oct', 'Indicated an amount', '$250,000 · Recorded')}</div><div>${eb('Their questions')}<div style="padding:10px 0;border-top:1px solid ${c.hl};display:grid;gap:6px"><span style="font:600 13px/1.5 ${SG}">“When do you expect the first close?”</span>${mu('Answered 23 Oct: We plan a first close in the week of 16 Nov, once the call closes.', 'font-size:12px')}</div></div>`, btn('Open in Capital relationships', 'p'), `<div style="display:flex;align-items:center;gap:8px">${av('BC', SKY, 24)}<span style="font:500 12px/1.3 ${SG};color:${c.mu}">Investor · chosen from your pipeline</span></div>`);
    const cfMatchD = () => `<div style="position:relative;width:560px;height:500px;flex:none;border-radius:16px;overflow:hidden;border:1px solid ${c.hl};box-sizing:border-box">${drw(560, 'Recipient · matching', 'Matching investor', `<div style="font:500 13px/1.5 ${SG};color:${c.mu}">Name hidden until they respond</div><div style="display:grid;gap:8px">${eb('Why they match')}<div style="display:flex;gap:7px;flex-wrap:wrap">${['Stage fits [Seed]', 'Sector fits [Robotics]', 'Cheque range fits'].map(t => pl(okI(11, c.pos) + t, 'n')).join('')}</div></div><div>${cfKv('Opened', cfNr('Not shown until they respond'))}${cfKv('Told on Axal', cfD('1 Oct 2026'))}</div>${note('Their name, firm and email appear here once they ask for the data room, ask a question or indicate an amount.', 'i')}`, btn('Close', 's'))}</div>`;

    // CLS13 investor view
    const cfTerms = () => [['Instrument', 'SAFE'], ['Target', mono('$1,500,000')], ['Valuation cap', mono('$10,000,000')], ['Minimum cheque', mono('$25,000')], ['Closes', mono('15 Nov 2026')]].map(r => cfKv(r[0], r[1])).join('');
    const cfInvTop = st => H('Deals › Round calls › [Acme Robotics]', 'A private round call from [Acme Robotics]', `[Seed extension] · sent to you on ${mono('1 Oct 2026')} · closes ${mono('15 Nov 2026')}`, '', cfCs(st));
    const cfInv = () => cfInvTop('Open') + `<div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start"><div style="display:grid;gap:16px;min-width:0">${cd(`${h3('Terms')}<div>${cfTerms()}</div><div style="display:grid;gap:6px;padding-top:4px">${eb('In plain words')}${tx('A SAFE for up to $1,500,000 with a valuation cap of $10,000,000. The smallest cheque is $25,000, and the call closes on 15 Nov 2026.')}</div>`, 'gap:8px')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${cd(`${eb('Pitch deck')}<div aria-hidden="true" style="aspect-ratio:16/9;border-radius:8px;background:#18181b;display:grid;place-items:center;font:800 14px/1.2 ${SG};color:#ffffff">[Acme Robotics]</div><div style="font:700 13px/1.35 ${SG}">v7 · frozen 1 Oct 2026</div>${btn('Open the deck', 's', 1, 'justify-self:start')}`)}${cd(`${eb('Data room')}<div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;flex:none;border-radius:10px;background:${c.chip};display:grid;place-items:center">${lock(16)}</span><div style="font:700 13px/1.35 ${SG}">Sign the NDA to ask for access</div></div>${mu('Once signed: Ask for access. Your request reaches the founder in Data room › Requests.', 'font-size:12px')}${btn('Sign the NDA', 's', 1, 'justify-self:start')}`)}</div><div style="border:1.5px dashed ${c.hl};border-radius:12px;min-height:140px;display:grid;place-items:center;background:${c.chip}"><span style="font:600 12.5px/1.3 ${SG};color:${c.mu}">Evidence, drawn on its own canvas</span></div></div><div style="display:grid;gap:16px">${cd(`${h3('Indicate an amount')}${flb('Amount', fi(`<span style="color:${c.fa};font-weight:400">Amount in USD</span>`))}${mu('Minimum cheque $25,000.', 'font-size:12px')}${note('This records your intention. It is not a payment or a signed investment.', 'i')}${btn('Indicate an amount', 'p', 0, 'width:100%')}`)}${cd(`${h3('Ask a question')}<div style="min-height:72px;box-sizing:border-box;border-radius:7px;border:1px solid ${c.hl};background:${c.cd};padding:9px 11px;font:400 13px/1.5 ${SG};color:${c.fa}">Your question for [Acme Robotics]</div>${btn('Ask a question', 's', 1, 'justify-self:start')}${mu('The founders answer on Axal. Investors who asked see the answer.', 'font-size:12px')}`)}</div></div>`;
    const cfInvClosed = () => `${cfInvTop('Closed')}${cd(`${h3('This call is closed.')}${mu('You can still read the terms and the deck. You can no longer indicate an amount or ask a question.')}`)}`;

    // CLS14 profiles
    const cfNp = (k, lit, inner) => `<div style="position:relative;height:100%">${shell(k, lit, inner, { sw: 176 })}</div>`;
    const cfNo = (t, b) => cd(`<span style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:${c.chip}">${lock(16)}</span>${h3(t)}${b}`, 'margin-top:24px;max-width:420px');

    // CLS15 phone
    const cfPbar = (t, back) => `<div style="height:56px;display:flex;align-items:center;gap:4px;padding:0 6px;background:${c.cd};border-bottom:1px solid ${c.hl}">${back ? `<a href="#" style="height:44px;display:flex;align-items:center;padding:0 10px;font:600 14px/1 ${SG};color:${c.vi};text-decoration:none">‹ ${back}</a><span style="flex:1"></span>` : `<button type="button" aria-label="Menu" style="width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center">${ln('M4 7h16M4 12h16M4 17h16', 20, c.ink, 2)}</button><div style="flex:1;min-width:0;font:700 15px/1.2 ${SG};color:${c.ink}">${t}</div>`}<span style="width:44px;height:44px;display:grid;place-items:center">${av('FA', VIO, 30)}</span></div>`;
    const cfPhone = (bar, body) => `<div style="position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:30px;border:1px solid ${c.hl};background:${c.bg};box-shadow:0 12px 32px ${c.sh}"><div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 13px/1 ${SG};color:${c.ink}"><span>9:41</span><span style="font:600 10px/1 ${RM};letter-spacing:.08em">5G</span></div>${bar}<div style="padding:16px;display:grid;gap:14px">${body}</div></div>`;
    const cfPMod = () => `<div style="display:grid;gap:10px"><div style="font:800 10px/1.2 ${SG};letter-spacing:.09em;text-transform:uppercase;color:${c.vi}">Raise · What resources does this venture need?</div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0;font:800 20px/1.2 ${SG};letter-spacing:-.02em;color:${c.ink}">Calls for Capital</div>${btn('Call for Capital', 'p', 1, 'height:44px')}</div><div style="display:grid;gap:5px"><span style="font:600 11.5px/1 ${SG};color:${c.mu}">Module</span><div role="combobox" aria-label="Module" style="height:44px;box-sizing:border-box;border-radius:7px;border:1px solid ${c.hl};background:${c.cd};display:flex;align-items:center;padding:0 12px;font:600 14px/1 ${SG};color:${c.ink}">Calls<span style="margin-left:auto;color:${c.mu};font-size:11px">▾</span></div></div><div style="position:relative;margin:0 -16px;overflow:hidden"><nav aria-label="Capital relationships" style="display:flex;gap:20px;padding:0 16px;border-bottom:1px solid ${c.hl};white-space:nowrap;transform:translateX(-150px)">${CFCRT.map(t => `<a href="#"${t === 'Calls' ? ' aria-current="page"' : ''} style="height:44px;flex:none;display:inline-flex;align-items:center;text-decoration:none;font:${t === 'Calls' ? 700 : 500} 13px/1 ${SG};color:${t === 'Calls' ? c.ink : c.mu};${t === 'Calls' ? `box-shadow:inset 0 -2px 0 ${c.vi}` : ''}">${t}</a>`).join('')}</nav><span style="position:absolute;left:0;top:0;bottom:1px;width:28px;background:linear-gradient(90deg,${c.bg},transparent)"></span><span style="position:absolute;right:0;top:0;bottom:1px;width:28px;background:linear-gradient(270deg,${c.bg},transparent)"></span></div></div>`;
    const cfPCard = inner => `<div style="background:${c.cd};border:1px solid ${c.hl};border-radius:12px;padding:12px 14px;display:grid;gap:8px">${inner}</div>`;
    const cfPh1 = () => cfPhone(cfPbar('Raise'), `${cfPMod()}${cfPCard(`<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font:800 15px/1.3 ${SG}">[Seed extension]</span>${cfCs('Open')}</div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">${mono('$400,000', 'font-size:20px;font-weight:700')}<span style="font:500 12px/1 ${SG};color:${c.mu}">indicated of $1,500,000</span></div><div style="height:6px;border-radius:6px;background:${c.chip};overflow:hidden"><span style="display:block;height:100%;width:27%;background:${VIO}"></span></div>${mu('9 of 30 went past opening · 2 questions waiting · closes in 25 days', 'font-size:12px')}`)}${[['[Bridge]', 'Draft', 'SAFE · target $500,000 · not sent'], ['[Seed]', 'Closed', 'SAFE · $900,000 indicated · closed 30 Jun 2026']].map(r => cfPCard(`<div style="display:flex;align-items:center;gap:8px;min-height:24px"><span style="flex:1;font:700 14px/1.3 ${SG}">${r[0]}</span>${cfCs(r[1])}</div>${mu(r[2], 'font-size:12px')}`)).join('')}`);
    const cfPh2 = () => cfPhone(cfPbar('Raise'), `${cfPMod()}<div style="padding:14px;border-radius:12px;background:${c.lav};border:1px solid ${c.lavE};display:grid;gap:6px"><div style="font:800 15px/1.3 ${SG}">Calls for Capital are not switched on yet</div><div style="font:400 12.5px/1.5 ${SG};color:${c.ink}">Axal switches them on once its counsel has confirmed how a call may reach investors. Nothing you prepare is sent until then.</div></div>${cd(`<div style="display:flex;align-items:baseline;gap:8px">${h3('Get ready')}${mono('5 of 7', 'font-size:12px;color:' + c.mu)}</div><div>${CFRD.map(r => `<div style="display:flex;align-items:center;gap:10px;min-height:40px;border-top:1px solid ${c.hl}"><span style="flex:1;font:600 13px/1.3 ${SG}">${r[0]}</span>${cfRdy(r[2])}</div>`).join('')}</div>`, 'gap:6px;padding:12px 14px')}`);
    const cfPh3 = () => cfPhone(cfPbar('', 'Calls'), `${cfPMod()}<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font:800 17px/1.3 ${SG}">[Seed extension]</span>${cfCs('Open')}</div>${[['BC', '[Bluefern Capital]', 'Indicated an amount', '$250,000'], ['HS', '[Harbor Seed Fund]', 'Indicated an amount', '$100,000'], ['?', 'Matching investor', 'Not shown until they respond', '']].map(r => cfPCard(`<div style="display:flex;align-items:center;gap:9px">${av(r[0], r[0] === '?' ? MUT : SKY)}<div style="flex:1;min-width:0"><div style="font:700 13.5px/1.3 ${SG}">${r[1]}</div>${r[0] === '?' ? `<div style="font:400 11.5px/1.3 ${SG};color:${c.mu}">Name hidden until they respond</div>` : ''}</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${cfRp(r[2])}${r[3] ? mono(r[3], 'font-weight:700') + cfSrc('Recorded') : ''}</div>`)).join('')}`);
    const cfPh4 = () => `<div style="position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:30px;border:1px solid ${c.hl};background:${c.cd};box-shadow:0 12px 32px ${c.sh}"><div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 13px/1 ${SG};color:${c.ink}"><span>9:41</span><span style="font:600 10px/1 ${RM};letter-spacing:.08em">5G</span></div><div style="display:flex;align-items:center;gap:6px;height:56px;padding:0 6px;border-bottom:1px solid ${c.hl}"><button type="button" aria-label="Close" style="width:44px;height:44px;border:0;background:transparent;font:500 22px/1 ${SG};color:${c.ink}">×</button><div style="flex:1;font:700 15px/1.2 ${SG};color:${c.ink}">New call · step 1 of 5</div></div><div style="padding:10px 16px 12px;border-bottom:1px solid ${c.hl}">${cfSteps(1)}</div><div style="padding:16px;display:grid;gap:14px">${cfFld('Name', '[Seed extension]')}${cfFld('Target amount', mono('$1,500,000'), '', 'From your round settings')}${flb('Instrument', seg(['SAFE', 'Note', 'Equity'], 0))}${cfFld('Valuation cap', mono('$10,000,000'), '', 'From Cap table · scenario [Seed]')}${cfFld('Minimum cheque', mono('$25,000'), '', 'Typed by you')}</div><div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:${c.cd};border-top:1px solid ${c.hl};display:flex;gap:10px">${btn('Save draft', 's', 0, 'flex:1;height:48px')}${btn('Next', 'p', 0, 'flex:1;height:48px')}</div></div>`;

    const BD = {
      CLS1: () => pgc(WH[1], shell('F', 'Raise', cfCls1())),
      CLS2: () => pgc(WH[1], shell('F', 'Raise', cfList())),
      CLS3: () => pgc(WH[1], shell('F', 'Raise', cfEmpty())),
      CLS4: () => pgc(WH[1], cfPre() + cfSheet(1, 'The round', cfS1(), `${btn('Save draft', 's')}<span style="flex:1"></span>${btn('Next', 'p')}`)),
      CLS5: () => gnd(cfSheet(2, 'Materials', cfS2(), `${btn('Back', 's')}<span style="flex:1"></span>${btn('Next', 'p')}`, 980) + cfSheet(3, 'Audience', cfS3(), `${mono('12 chosen · 18 matching · 30 in all', 'font-size:12.5px;font-weight:600')}<span style="flex:1"></span>${btn('Back', 's')}${btn('Next', 'p')}`, 980)),
      CLS6: () => pgc(WH[1], cfPre() + cfSheet(4, 'Preview', cfS4(), `${btn('Back', 's')}<span style="flex:1"></span>${btn('Next', 'p')}`)),
      CLS7: () => gnd(cfSheet(5, 'Send', cfS5a(), `${btn('Back', 's')}<span style="flex:1"></span>${btn('Send', 'p')}`, 760) + cfSheet(5, 'Sent', cfS5b(), `<span style="flex:1"></span>${btn('Open the call', 'p')}`, 760)),
      CLS8: () => pgc(WH[1], shell('F', 'Raise', cfCallPage())),
      CLS9: () => gnd(cfCrop('Draft', cfHead('Draft', '[Bridge]', 'Not sent.', `<div style="display:flex;gap:8px">${btn('Continue draft', 'p', 1)}${cfDes('Delete draft', 1)}</div>`)) + cfCrop('Awaiting counsel', cfHead('Awaiting counsel', '[Seed extension]', `Sent ${mono('1 Oct 2026')} · asked to extend to ${mono('29 Nov 2026')} on ${mono('26 Oct')}`, note('Responses are paused until counsel approves the extended terms.', 'a'))) + cfCrop('Expired', cfHead('Expired', '[Seed extension]', '', `${tx('This call closed on 15 Nov 2026 with $400,000 indicated. It is read-only.')}${btn('Open a new call', 's', 1, 'justify-self:start')}`)) + cfCrop('Closed', cfHead('Closed', '[Seed]', '', tx('This call closed on 30 Jun 2026 with $900,000 indicated. It is read-only.')))),
      CLS10: () => gnd(dlg(420, 'Extend [Seed extension]', `${flb('New closing date', fi(mono('29 Nov 2026')))}${note('Extending pauses responses until counsel approves the new terms. Investors keep what they already sent.', 'a')}${mu('Recipients are told on Axal once counsel approves the new date.', 'font-size:12px')}`, btn('Back', 't', 1) + btn('Extend and ask counsel', 'p', 1), 'S') + dlg(420, 'Close [Seed extension]?', `${tx('Investors can no longer respond. Nothing already indicated is lost.')}${mu('Recipients are told on Axal that the call is closed.', 'font-size:12px')}`, btn('Keep it open', 's', 1) + cfDes('Close the call'), 'S') + dlg(460, 'Answer a question', `<div style="padding:11px 13px;border-radius:10px;background:${c.chip};display:grid;gap:4px"><span style="font:600 11.5px/1.2 ${SG};color:${c.mu}">[Name] · Angel · 26 Oct</span><span style="font:600 13px/1.5 ${SG}">“Is the SAFE post-money?”</span></div>${flb('Your answer', `<div style="min-height:84px;box-sizing:border-box;border-radius:7px;border:1px solid ${c.vi};box-shadow:0 0 0 3px ${c.lav};background:${c.cd};padding:9px 11px;font:400 13px/1.5 ${SG};color:${c.ink}">Yes. It is a post-money SAFE with a valuation cap of $10,000,000.</div>`)}${mu('Investors who asked see your answer.', 'font-size:12px')}`, btn('Cancel', 't', 1) + btn('Send answer', 'p', 1), 'S')),
      CLS11: () => pgc(1040, shell('F', 'Raise', cfCallPage()) + scr() + cfRecD()) + below(cfMatchD(), 'A matching investor, before they respond'),
      CLS12: () => gnd(crop('Loading', 440, 400, `<div style="padding:16px">${cd(`<div style="display:flex;align-items:center;gap:10px">${h3('Calls')}<span style="font:500 12px/1 ${SG};color:${c.mu}">Reading…</span></div>${[0, 1, 2, 3].map(() => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 80px 60px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid ${c.hl}">${sk('70%', 12)}${sk('100%', 20, 'border-radius:99px')}${sk('100%', 12)}</div>`).join('')}`)}</div>`) + crop('Read failed', 440, 400, `<div style="padding:16px">${cd(`${h3('The calls could not be read.')}${mu('This is not a claim that there are none.')}${btn('Try again', 'p', 1, 'justify-self:start')}${mu('New call stays off until the calls can be read.', 'font-size:12px')}`)}</div>`) + crop('A change refused', 440, 400, `<div style="padding:16px;display:grid;gap:12px">${cfHead('Open', '[Seed extension]', '')}${note('This call changed since you opened it. Reload to see its current state.', 'a')}${btn('Reload', 's', 1, 'justify-self:start')}${mu('Nothing you entered was saved.', 'font-size:12px')}</div>`)),
      CLS13: () => pgc(1040, shell('I', 'Deals', cfInv())) + below(crop('A closed call', 900, 300, `<div style="padding:18px">${cfInvClosed()}</div>`)),
      CLS14: () => gnd(crop('Co-founder · [Founder B]', 676, 380, `<div style="padding:18px 20px;display:grid;gap:10px">${cfHead('Draft', '[Bridge]', 'Not sent.', `<div style="display:flex;gap:8px;align-items:center">${btn('Continue draft', 'p', 1)}${cfDb('New call')}</div>`)}<div style="border-top:1px solid ${c.hl};padding-top:14px;display:grid;gap:10px">${cfHead('Open', '[Seed extension]', CFSX)}${snt('Only [Founder A] can send or close a call.')}</div></div>`) + crop('Super Admin · counsel recorder', 676, 380, `<div style="padding:18px 20px;display:grid;gap:12px">${cfHead('Awaiting counsel', '[Seed extension]', `Asked to extend to ${mono('29 Nov 2026')} on ${mono('26 Oct')}`)}${cd(`${h3("Record counsel's approval")}${flb('Approval reference', fi(mono('[CNS-2026-0142]')))}${mu('Sign in again to record it.', 'font-size:12px')}${btn('Sign in again and record', 'p', 1, 'justify-self:start')}`, 'gap:10px')}</div>`) + crop('Admin', 676, 380, cfNp('AD', '', cfNo("Calls belong to the venture's founders. Studio admins do not open them.", btn('Go to Studio', 's', 1, 'justify-self:start')))) + crop('Explorer', 676, 380, cfNp('E', '', cfNo('Calls for Capital open once your profile is set.', `<div style="display:flex;gap:8px">${btn('Set up your profile', 'p', 1)}${btn('Go to your home', 's', 1)}</div>`)))),
      CLS15: () => `<div style="padding:30px;display:flex;gap:25px">${cfPh1()}${cfPh2()}${cfPh3()}${cfPh4()}</div>`
    };
    const out = (BD[B] || BD.CLS1)();
    return { html: { __html: root(out) } };

  }
}
</script>
