    else if (B === 'NRF06D') html = phone('Possible match', `<div class="nt g" role="status"><span class="ic" aria-hidden="true">✓</span><div><b>Saved [Ari Lane].</b> One possible match to review.</div></div><h1 style="font-size:20px;font-weight:800" tabindex="-1">[Ari Lane] may already be in your book</h1>
      <div class="pc"><span class="eye">Just added · by you</span><b>[Ari Lane]</b><small>[Tidepool Labs] · Head of Operations</small></div>
      <div class="pc"><span class="eye">Already in your book</span><b>[Ari Lane]</b><small>[Tidepool Labs] · LinkedIn import · 2026-10-30</small></div>
      <div class="nrf-why"><b>Why:</b> the same LinkedIn profile, <span class="mo">linkedin.com/in/ari-lane-tp</span>.</div>
      <div class="nrf-col"><button type="button" class="btn">Keep both</button><button type="button" class="btn t">Dismiss</button><a class="btn t" href="#">Decide later</a></div>`,
      '<button type="button" class="btn p">Merge into existing</button>', { back: 1 });

    /* ===== NW9.2 · tablet 768 ===== */
    else if (B === 'NRF07') html = `<div class="${CV} tab">${phTop('Network').replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${HEAD({ tab: 'Relationships', h1: 'Relationships', sub: 'Your private book and your leads, kept apart.' })}
      <section class="cd"><div class="ch"><h2>My relationships</h2><span class="acts"><button type="button" class="btn">Import ▾</button><button type="button" class="btn">+ Add person</button></span></div><span class="inp" style="color:var(--ink);min-width:0">Studio</span>
      <table class="tbl"><thead><tr><th scope="col">Person</th><th scope="col">Organization</th><th scope="col">Source</th></tr></thead><tbody>${J(ROWS.map((r) => `<tr><td><b>${r.n}</b></td><td>${r.o}</td><td>${r.s}</td></tr>`))}</tbody></table></section></main>
      <div class="dim" aria-hidden="true"></div>${FORM({ v: { name: '[Morgan Vale]', org: '[Elm Studio]' }, foc: 'name', other: false }).replace('class="sheet-r nrf-sh"', 'class="sheet-r nrf-sh" style="width:460px"')}</div>`;

    /* ===== NW10.3 · dark ===== */
    else if (B === 'NRF08') html = shell(RELPAGE({}), {
      overlay: FORM({ v: { name: '', org: '[Elm Studio]', title: 'Partner', email: 'morgan@elmstudio', li: '' }, errs: { name: 'Enter the person’s name.', email: 'Enter a valid email address.' }, top: ERRSUM('2 fields', ['Name: enter the person’s name', 'Email: enter a valid email address']) })
    });
    else if (B === 'NRF08B') html = shell(RELPAGE({}), { overlay: REVSHEET });

    /* ===== Accessibility ===== */
    else if (B === 'NRF09') html = `<div class="${CV} doc"><div><span class="eye">Network Relationships · founder Add person · #7058 · accessibility</span><h2 style="font-size:22px;margin-top:4px">Keyboard, announcements, phone keyboard and recovery</h2></div>
      <div class="cols">
      <div><h3>Keyboard and focus</h3><ul><li>Add person (book toolbar or first-run step 2) opens the sheet; focus goes to Name. Focus stays inside the sheet.</li><li>Tab order: Name, Organization, Title, Email, LinkedIn profile, Import link, Invite link, Cancel, Save person, Close.</li><li>Enter submits once. Esc, Close or Cancel with entries asks once before discarding; a second Esc discards.</li><li>On close without saving, focus returns to the Add person button that opened it, on the list as it was.</li><li>After a save, focus moves to the new person’s name on the Person Sheet, or to the review heading when a match is returned.</li></ul></div>
      <div><h3>Screen-reader announcements</h3><ul><li>Open: “Add person, dialog. Saving adds this person to your own contacts. Nobody is contacted.”</li><li>Saving (polite): “Saving [Morgan Vale].” The sheet is <code>aria-busy</code>.</li><li>Saved (polite): “Saved [Morgan Vale] to your contacts. Nobody was contacted.”</li><li>Review (polite): “Saved, with one possible match to review: the same LinkedIn profile.”</li><li>Errors (assertive, once): the summary, “2 to fix before saving”; then each field reads its own message.</li><li>Not saved (assertive): “[Morgan Vale] was not saved. Your entries are kept.”</li></ul></div>
      <div><h3>Phone keyboard (390)</h3><ul><li>Name: <code>autocomplete="name"</code>, capitalised words. Organization: <code>organization</code>. Title: <code>organization-title</code>.</li><li>Email: <code>type="email"</code>, <code>inputmode="email"</code>, no autocorrect or capitals; the keyboard shows @ and “.”.</li><li>LinkedIn profile: <code>type="url"</code>, <code>inputmode="url"</code>, no autocorrect.</li><li>Return key reads “next” until the last field, then “done”. Cancel and Save stay pinned above the keyboard; the focused field scrolls into view.</li><li>Every target is at least 44 px.</li></ul></div>
      <div><h3>Error recovery</h3><ul><li>Entries are never cleared by an error: page checks, a 400 field error, a failed request or a refused support session.</li><li>A failed request offers Try again with the same entries. Save is disabled between press and answer, so one press is one request.</li><li>A review that cannot be read says the person is saved and nothing merged, with Try again; it never reads as “no match”.</li><li>States carry a glyph and a word: ! error, ◌ saving, ✓ saved, ◷ waiting, ? could not be read, ⊘ refused.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NRFH') html = `<div class="${CV} doc"><div><span class="eye">Network Relationships · founder Add person · #7058 · handoff</span><h2 style="font-size:22px;margin-top:4px">What was checked, what ships as frontend, and what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>services/typedContactBook.ts</code>: name required; organization, title up to 200; email up to 320 and normalised; LinkedIn must be a <code>linkedin.com/in/</code> page. One D1 batch writes the row (<code>source = 'typed'</code>), its source, and at most one review against an existing own contact with the same profile URL (first) or email. Answers <code>{ contact_id, review_uid | null, contacted: false }</code>.</li>
      <li><code>routes/contact_imports.ts</code>: <code>POST /api/contacts/book</code>, 201; 400 <code>invalid_contact</code> with <code>field</code>; 403 <code>support_session</code>. Reviews: <code>GET /import/reviews</code> and <code>POST /import/reviews/:uid/merge|keep|dismiss</code>; 409 <code>decided</code>, 404 <code>not_found</code>.</li>
      <li><code>services/linkedinCsvImport.ts</code>: merge keeps the existing record, fills its blanks, moves sources, notes and follow-ups, and deletes the added row. Reviews return the added side’s name, company, title and whether it has a URL, and the candidate’s name and company only.</li>
      <li><code>lib/api/contacts.js</code>: <code>contactsBookApi.add</code>, <code>reviews</code>, <code>decideReview</code> exist.</li>
      <li><code>FounderRelationshipBook.jsx</code> and <code>FounderNetworkDesk.jsx</code>: Add person is disabled with <code>ADD_PERSON_UNBUILT</code>; Import links to <code>/account/connectors/linkedin</code>. The book keeps <code>q</code>, source, open-only and page in component state.</li>
      <li><code>LinkedInSection.jsx</code>: Connections.csv preview, import and the review list. <code>routes/contacts.ts</code>: <code>POST /invite</code> is founder-only and sends an email.</li></ul></div>
      <div><h3>Preserved from the approved canvases</h3><ul><li>NW2 My relationships, its columns, filters and Person Sheet (NW2.1); NW1.2 first-run steps; NW2.3 duplicate review, extended for hand-added people. Shell, header, tabs and state words from #4799 and #6256.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>Enable both Add person buttons; one sheet; page-side checks matching the server; map 400 <code>field</code> to the field; lock and disable during save.</li><li>On success, read the book again with the same filters and open the Person Sheet from the answer and the typed values (the new row may sit on another page). From first-run, go to Relationships with the sheet open.</li><li>On <code>review_uid</code>, find it in <code>reviews()</code> and show NRF04; label the first side “Added by you”, not “Imported”.</li><li>Phone, tablet and dark as drawn.</li></ul>
      <h3 style="margin-top:12px">Requires engineering (◇)</h3><ul><li>An idempotency key on <code>POST /contacts/book</code>, so a retry after a lost answer cannot save twice (#7058).</li><li>The candidate’s source and date, and the added side’s source, on the review read (#7058).</li><li>The investor tie request: #6636 / #6749, open, not on main.</li></ul>
      <h3 style="margin-top:12px">Open questions</h3><ul><li>None for the owner. The sample data is fictional.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nrf-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
