      + '<div class="ws" style="grid-template-columns:220px minmax(0,1fr)"><nav aria-label="Brief sections"><ol class="vstep">' + J(['Executive summary', 'Key findings', 'Market context', 'Company comparison', 'Risks and uncertainty', 'Open questions', 'Sources', 'Methodology'].map((s, i) => '<li class="' + (i < 2 ? 'dn' : i === 2 ? 'on' : '') + '"><i>' + (i < 2 ? '✓' : i + 1) + '</i><span>' + s + '</span><span></span></li>')) + '</ol></nav>'
      + '<article class="brief"><div class="rv2">' + st('Accepted', 'Reviewed by you') + '<span>Sections 1–2</span></div><h2>European AI Infrastructure — Market Assessment</h2><h3>Executive summary</h3><p>Entry looks viable for a seed company only with a structural power-cost advantage. Independent providers exist in Norway, France and Estonia; national cloud rules apply in Germany and France <span class="cite">1</span><span class="cite">2</span>.</p>'
      + '<h3>Key findings</h3><ul style="display:flex;flex-direction:column;gap:6px;list-style:disc;padding-left:18px"><li><span class="fk src">Source</span> The EU Data Act applies from 12 September 2025 <span class="cite">1</span>.</li><li><span class="fk src">Source</span> EUCS was still a candidate scheme at the document date <span class="cite">2</span>.</li><li><span class="fk hu">Yours</span> Start in Norway.</li></ul>'
      + '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>1 finding has no source.</b> It stays in the brief, labelled as your conclusion.</div></div><h3 style="color:var(--mu)">Market context <span class="raw">· not reviewed yet</span></h3><p class="mu">Market size and growth: Not recorded in your evidence.</p></article></div>';
    const send = () => '<div role="dialog" aria-modal="true" aria-labelledby="sd" style="width:880px;background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.18);display:flex;flex-direction:column"><div class="mdh"><div><h2 id="sd">Send research to an Axal module</h2><p class="raw" style="margin-top:4px">Nothing is written anywhere until you confirm</p></div><button type="button" class="ib" aria-label="Close">✕</button></div><div class="mdb">'
      + '<div class="dest" role="radiogroup" aria-label="Destination">' + J([['Validate', 'Add as evidence to a hypothesis', 'on'], ['Build', 'Attach to a roadmap item', ''], ['Raise', 'Add to data-room notes', ''], ['Deals', 'Investor licence only', 'off'], ['Portfolio', 'Investor licence only', 'off']].map(d => '<label class="' + d[2] + '"><input type="radio" ' + (d[2] === 'on' ? 'checked ' : '') + (d[2] === 'off' ? 'disabled ' : '') + 'style="accent-color:#7c3aed"><b>' + d[0] + '</b><span class="mu">' + d[1] + '</span></label>')) + '</div>'
      + '<div class="scopebox"><b>You are about to send</b><ul><li><span>•</span>3 findings (2 source facts, 1 of yours)</li><li><span>•</span>4 evidence references — titles and passages, not the files</li><li><span>•</span>Entities: Nebula Compute, Aster Cloud</li><li><span>•</span>Your note: “Partner shortlist for the Norway pilot”</li></ul></div>'
      + '<div class="prop"><span aria-hidden="true">◇</span><div><b>Proposed integration.</b> No module accepts research today; this flow is a design concept until the destination endpoints exist.</div></div></div><div class="mdf"><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Confirm and send</button></div></div>';

    /* ---------- states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const nt = (tone, ic, h, d, act) => '<div class="nt ' + tone + '"' + (tone === 'r' ? ' role="alert"' : '') + '><span class="ic" aria-hidden="true">' + ic + '</span><div><b>' + h + '</b><div>' + d + '</div></div>' + (act ? '<span class="bt"><button type="button" class="btn bsm">' + act + '</button></span>' : '') + '</div>';
    const STATES = [
      ['No research projects', nt('', '+', 'No research yet', 'Start with a question; a project keeps your evidence and findings together.', 'New research')],
      ['No evidence', nt('', '0', 'This project has no evidence', 'Add documents from your Library or upload new ones.', 'Add evidence')],
      ['Upload in progress', '<div style="display:flex;gap:8px;align-items:center">' + st('Uploading') + '<span style="font-size:12.5px">Board deck.pdf · 62%</span></div><div class="prog" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress"><i style="width:62%"></i></div>'],
      ['Indexing queued', '<div style="display:flex;gap:8px;align-items:center">' + st('Queued') + '<span style="font-size:12.5px">Waiting to be indexed — usually a few minutes</span></div>'],
      ['Indexing failed', nt('r', '✕', 'Couldn’t index Investor memo (scan).pdf', 'No text could be extracted. Upload a text-based PDF.', 'Retry')],
      ['Partial index ' + PT, nt('a', '!', '18 of 42 pages indexed', 'Pages 19–42 are images. Ask can cite only the first 18.', 'Retry')],
      ['Source unavailable', nt('', '?', 'A cited source was removed', 'The answer is kept; citation 3 can’t be opened.', '')],
      ['Shared source not answerable ' + PT, nt('', '⦸', 'Shared with you, not answerable', 'The owner allowed viewing only; Ask can’t cite it.', '')],
      ['Ask unavailable', nt('r', '✕', 'Ask is unavailable', 'Search didn’t respond. Your question is kept.', 'Try again')],
      ['Cost quote unavailable', nt('a', '!', 'Cost quote unavailable', 'This run is not free. You’ll be charged for what it uses.', '')],
      ['Out of AI tokens', nt('a', '!', 'You’re out of AI tokens', 'Add tokens to ask; your history stays readable.', 'Add tokens')],
      ['Empty search', nt('', '⌕', 'No companies match “quantum”', 'Check spelling or search another sector.', 'Clear search')],
      ['Filters with zero results', nt('', '0', 'No funds match all 4 filters', 'Remove “Cheque range”: it’s Not recorded for most funds.', 'Clear filters')],
      ['Permission denied', nt('', '⦸', 'Only the owner can open this document', 'Ask them to share it, or use your own copy.', '')],
      ['Unreadable block', nt('r', '✕', 'Saved briefs couldn’t be read', 'Server error at 14:30. Last good read 14:12.', 'Retry')],
      ['Not recorded', '<dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Fund size</dt><dd>' + NR + '</dd><dt>Vintage</dt><dd>2024</dd></dl><p class="raw">Never shown as 0 or as a dash</p>']
    ];
    const states = () => crop('<span class="eye">Empty, loading, indexing and error states · each says what happened and what to do next</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);

    /* ---------- mobile ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Open research context">◫</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const MOB = {
      RS10: () => phone('Research', '<div><span class="eye">Research intelligence</span><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px">Research with evidence, not assumptions</h1></div><button type="button" class="btn p" style="min-height:48px">New research</button><div class="qbox" style="padding:12px"><label for="mq">What would you like to investigate?</label><div class="qin" id="mq" style="min-height:48px">e.g. Compare three SaaS companies</div></div><section class="cd" style="background:var(--lav);border-color:var(--lavE);padding:12px 14px"><span class="eye">Continue</span><b>European AI Infrastructure</b><a class="btn p" href="#" style="min-height:44px">Continue</a></section>' + J(PROJ.slice(1).map(p => '<div class="mc"><div class="r1"><b>' + p[0] + '</b></div><small>' + p[1] + ' · ' + p[4] + '</small></div>'))),
      RS10B: () => phone('Ask Eadwyn', '<div class="crumb">Research / European AI Infrastructure</div><section class="cd" style="padding:12px 14px;gap:8px">' + st('Answered') + '<p style="font-size:14px;line-height:1.6">Germany and France had national schemes in force <a href="#" class="cite">1</a> <a href="#" class="cite">2</a>. EUCS was still a candidate <a href="#" class="cite">2</a>.</p><div class="sug"><button type="button" style="min-height:40px">Save finding</button><button type="button" style="min-height:40px">Add to brief</button></div></section><div class="qbox" style="padding:12px;margin-top:auto"><label for="mq2">What do you want to know?</label><div class="qin" id="mq2" style="min-height:48px">Ask a follow-up…</div><button type="button" class="btn p" style="min-height:48px">Ask</button></div>',
        '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cs"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="cs" style="font-size:17px;font-weight:800">Source <span class="cite on">2</span></h2><b>ENISA — EUCS candidate scheme (summary).pdf</b><span class="raw">ENISA · 14 Mar 2025 · page 2</span><div class="pass">…the scheme <mark>remains a candidate and has not been adopted</mark>…</div><a class="btn" href="#" style="min-height:48px">Open in Library</a></div></div>'),
      RS10C: () => phone('Library', '<button type="button" class="btn p" style="min-height:48px">Upload document</button><div class="chips"><button type="button" aria-checked="true" style="min-height:40px">All</button><button type="button" style="min-height:40px">Filters · 0</button></div>' + J(LIB.slice(0, 4).map(l => '<div class="mc"><div class="r1"><b>' + l[0] + '</b></div><div style="display:flex;gap:6px;flex-wrap:wrap">' + st(l[3]) + st(l[4]) + '</div><small>' + l[1] + ' · uploaded ' + l[5] + '</small>' + (l[3] === 'Failed' ? '<button type="button" class="btn" style="min-height:44px">Retry</button>' : '') + '</div>'))),
      RS10D: () => phone('Research context', '<p class="raw">The rail becomes a bottom sheet on phones</p>', '<div class="dim2"></div><div class="sheet" style="max-height:700px" role="dialog" aria-modal="true" aria-label="Research context"><div class="grab" aria-hidden="true"></div>' + ctxRail().replace('<aside class="rail"', '<div class="rail" style="border:0"').replace('</aside>', '</div>') + '</div>')
    };

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RSA: () => dk('<h1>Existing vs proposed</h1><p>Checked against <code>cloudflare-worker/src/routes/research.ts</code>, <code>research_collections.ts</code> and migrations 213–230 on 7 Nov 2026. Boards mark proposed parts with ◇ Proposed.</p>' + tbl(['Capability', 'Today', 'Design'], [
          ['Library', '<code>research_documents.index_state</code>: pending · indexed · unsupported · failed, with <code>index_note</code>; reindex, download, delete', 'Shown as Queued · Indexed · Unsupported · Failed. Uploading (client-side) is frontend-only; Indexing, Partially indexed, Unavailable need new states'],
          ['Sharing', 'None: each user’s own uploads (migration 213)', '“Shared, not answerable” is proposed'],
          ['Collections', 'Named groups of own documents (D549)', 'Could seed a Research Project’s evidence set'],
          ['Research Project', 'Does not exist', 'Proposed first-class object: question, evidence, sessions, findings, comparisons, brief'],
          ['Ask', 'Sessions and answers; <code>reason</code> answered · no_source · model_unavailable; citations; cost in micro-dollars; <code>saved</code>', 'Answered / No source / Model unavailable are real; Search unavailable, Insufficient evidence, Source no longer available are proposed'],
          ['Findings', 'Saved answers and brief notes (migration 222)', 'Source / Eadwyn / Yours split and Accept-Edit-Discard are proposed'],
          ['Brief', 'Brief notes + drafts', 'Sectioned, reviewed brief is proposed'],
          ['Directories', 'Company, fund and market directories (228–230)', 'Kept; filters in the URL; Not recorded instead of zero'],
          ['Structured run', 'No authoritative quote endpoint', 'Proposed; shows “Cost quote unavailable” and never runs on load'],
          ['Send to module', 'No receiving endpoints', 'Proposed design concept only']])),
      RSB: () => dk('<h1>Navigation, components and tokens</h1><div class="cols"><div><h2>Navigation map</h2><p>Research › Overview · My Research · Markets (Geographies inside) · Companies · Funds · Library · Ask. Diligence and Benchmarking open from a company or fund, not from the nav. The active project, company, filters and comparison set persist across these routes (URL + project context).</p><h2>Interaction map</h2><p>Question → New research → Project. Ask answer → Save finding → Findings → Add to brief → Brief → Review → Export or Send. Citation → passage panel (desktop) or sheet (phone). Directory row → profile → Back keeps filters.</p></div><div><h2>Tokens</h2><p>Light: page #F4F3F7 · card #FFF · border #ECECF1 · ink #18181B · muted #6B6577 · violet #7C3AED / #6D28D9 · lavender #F4F0FE · positive #047857 · warning #92400E · destructive #B91C1C. Dark: #0B1220 / #111827 / #1F2937, text #E5E7EB, violet #A78BFA. Radii 12–16. Space Grotesk text, Roboto Mono figures.</p><h2>Responsive</h2><p>1440: nav + content + 340 rail. 1280: rail 300. 768: rail collapses to a button that opens a sheet. 390: tables become cards, filters a full-screen sheet, rail a bottom sheet, primary action stays visible.</p></div></div>'
        + tbl(['Component', 'Rule'], [['PageHeader', 'One breadcrumb, one title, one purpose line, one violet primary, optional Ask Eadwyn'], ['ProjectCard', 'Title, subject, status, updated, sources, open questions, Continue'], ['FindingCard', 'Kind tag (Source / Eadwyn / Yours) always first; Eadwyn findings dashed; citations as numbered chips'], ['CitationChip + PassagePanel', 'Chip opens the exact passage with document, date, freshness, availability'], ['NotRecorded', 'Italic grey with dashed box; never zero'], ['StateBadge', 'Word + shape; shared with Library, Ask and directories'], ['ResearchContextRail', 'Project, coverage, open questions, findings, comparison set, follow-ups; AI settings collapsed']])),
      RSC: () => dk('<h1>Accessibility and handoff</h1>' + tbl(['Area', 'Specification'], [['Labels', 'Question fields have a visible label (“What do you want to know?”); suggestions say they fill the field and don’t run'], ['Focus', 'Visible 2px violet ring; citation panel and sheets return focus to the chip that opened them'], ['Live regions', 'Answer arrival, upload and indexing progress, retries announced politely; failures as alerts tied to the operation'], ['Tables', 'Captions and th scope; comparison uses row headers so each value reads with its attribute'], ['Status', 'Never colour alone; finding kinds are words, not tints'], ['Touch', '44px targets on mobile; primary actions 48px'], ['Motion', 'Spinner only while running; no progress bars invented for unknown durations']])
        + '<h2>React handoff</h2>' + tbl(['Area', 'Today', 'Becomes'], [['Shell', '<code>workspaces/shellConfig.js</code> RESEARCH_ZONES (Ask, Markets, Geographies, Companies, Funds, Library)', 'Add Overview and My Research; Geographies moves into Markets as a filter'], ['Ask', 'Ask zone page', 'AskPage with Composer, Answer, Sources, History (All / Saved answers / Archived), EvidenceScope disclosure'], ['Library', 'Library zone', 'LibraryTable with StateBadge and per-row Retry (existing reindex route)'], ['Rail', 'Eadwyn AI rail with model catalogue and pricing', 'ResearchContextRail; model and billing behind AI settings']]))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RS01') html = page(overview(), { h: 1500, cur: 'Overview' });
    else if (B === 'RS02') html = page(projOverview(), { h: 1150, cur: 'My Research' });
    else if (B === 'RS02b') html = page(projEvidence(), { h: 900, cur: 'My Research' });
    else if (B === 'RS02c') html = page(projFindings(), { h: 1150, cur: 'My Research' });
    else if (B === 'RS02d') html = page(projCompare(), { h: 900, cur: 'My Research' });
    else if (B === 'RS03') html = page(markets(), { h: 1050, cur: 'Markets', rail: false });
    else if (B === 'RS04') html = page(companies(), { h: 900, cur: 'Companies', rail: false });
    else if (B === 'RS04B') html = page(profile('co'), { h: 1000, cur: 'Companies' });
    else if (B === 'RS05') html = page(funds(), { h: 900, cur: 'Funds', rail: false });
    else if (B === 'RS05B') html = page(profile('fund'), { h: 1000, cur: 'Funds' });
    else if (B === 'RS06') html = page(library(), { h: 1000, cur: 'Library', rail: false });
    else if (B === 'RS06L') html = page(library(), { h: 1000, cur: 'Library', rail: false, w: 1280 });
    else if (B === 'RS07') html = page(ask(), { h: 1350, cur: 'Ask' });
    else if (B === 'RS07B') html = page(askZero(), { h: 1000, cur: 'Ask' });
    else if (B === 'RS07C') html = respStates();
    else if (B === 'RS08') html = page(run(), { h: 1100, cur: 'My Research', rail: false });
    else if (B === 'RS09') html = page(brief(), { h: 1050, cur: 'My Research', rail: false });
    else if (B === 'RS09B') html = crop(send(), 920);
    else if (B === 'RS11') html = states();
    else if (B === 'RS12') html = page(projFindings(), { h: 1150, cur: 'My Research' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(overview(), { h: 1500 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
