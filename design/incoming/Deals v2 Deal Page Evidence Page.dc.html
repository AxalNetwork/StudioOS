      DPE30A: () => phone('Acme Robotics', ptabs('Evidence') + '<div class="dpe-cl m"><b class="dpe-big" style="font-size:16px">5 of 8 shared claims are backed</b><div class="dpe-clc">' + J([['b', 5], ['f', 1], ['m', 1], ['n', 1]].map(x => '<span>' + cs(x[0]) + '<b class="mo">' + x[1] + '</b></span>')) + '</div></div><div class="tools"><button type="button" class="dd" style="min-height:44px">Filters · 0</button><button type="button" class="dd" style="min-height:44px">Sort: Checked ▾</button></div><span class="eye">Investor narrative and Pitch deck · 7</span>' + evCard(AREAS[0][2][0]) + evCard(AREAS[0][2][2]) + '<span class="eye">Fundraising readiness · 10</span>' + evCard(AREAS[1][2][2])),
      DPE30B: () => phone('Acme Robotics', ptabs('Scorecard') + '<div class="dpe-psr"><b>Team</b><b class="mo">78</b><span>Strong · High</span></div>' + '<article class="mc"><div class="ch"><b>Founder A</b><span class="pl">Builder</span></div><span class="raw">Founder · CEO</span><span style="font-size:12px">Head of automation, Warehouse Co <span class="mo">2018–2024</span></span><div>' + ab('nr') + why(' Full-time since') + '</div><a class="btn" href="#" style="min-height:44px">Open profile</a></article><article class="mc"><div class="ch"><b>Founder B</b><span class="pl">The Architect</span></div><span class="raw">Founder · CTO</span></article><span class="eye">Team coverage</span><ul class="dpe-bl m">' + J(AXES.slice(0, 6).map(a => '<li><span>' + a[0] + '</span>' + band(a[1]) + '</li>')) + '</ul>'),
      DPE30C: () => phone('Acme Robotics', ptabs('Scorecard') + '<div class="dpe-psr"><b>Market</b><b class="mo">71</b><span>Strong · Medium</span></div>' + J([['TAM', '$4.2B'], ['SAM', '$610M']].map(t => '<div class="dpe-tl"><span class="eye">' + t[0] + '</span><b class="mo">' + t[1] + '</b><span class="raw">USD, typed by the founder</span>' + why('No source recorded for this figure') + '</div>')) + '<span class="eye">Competitors · 4</span><div class="inp" style="min-width:0;min-height:44px">⌕ Search competitors</div><button type="button" class="dd" style="min-height:44px;align-self:flex-start">Sort: Name A–Z ▾</button>' + J(COMP.slice(0, 2).map(c => '<article class="mc"><b>' + c[0] + '</b><span style="font-size:12px">' + c[1] + '</span><span class="raw">Price ' + c[2].toLowerCase() + ' · Depth ' + c[3].toLowerCase() + '</span></article>'))),
      DPE30D: () => phone('Acme Robotics', ptabs('Activity') + '<span class="eye">MRR, last 12 months · USD</span><ul class="dpe-pml">' + J(MONTHS.slice().reverse().slice(0, 6).map(m => '<li' + (m[1] ? '' : ' class="np"') + '><span class="mo">' + m[0] + '</span>' + (m[1] ? '<b class="mo">$' + m[1].toLocaleString('en-US') + '</b>' + chip(m[2]) : ab('np')) + '</li>')) + '</ul><span class="eye">Firm notes · Northwind Ventures only</span>' + J(NOTES.slice(0, 2).map(n => '<article class="mc"><span class="eye">' + n[3] + ' · ' + n[0].split(' · ')[0] + (n[1] ? ' · ' + n[1] : '') + '</span><p style="font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + n[2] + '</p>' + (n[5] ? '<div class="tools"><button type="button" class="btn" style="min-height:44px">Edit</button><button type="button" class="btn" style="min-height:44px">Delete</button></div>' : '<span class="raw">Read only</span>') + '</article>')), '<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--hair)"><button type="button" class="btn p" style="width:100%;min-height:48px">Add a note</button></div>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Where Evidence, Team, Market, Traction and Notes live · handoff</h1><p>Continues Deals v2 (D4815): boards DE19 to DE31 in sections DX17 to DX21. The deal header, figures strip, eight tabs, status families and absence states are DE04’s. Placement follows the brief’s picks, pending the owner: Team, Market and Traction inside Scorecard (B); Notes inside Activity (A); a Share or download menu with only Copy link working (A). The deal page’s figures are drawn in USD: the platform records traction figures and new deals in USD, where the first Deals v2 boards drew euros.</p>'
      + '<h2>Checked on main</h2>' + tbl(['Board', 'What main has', 'Status'], [
        ['DE19–DE22 Evidence', '<code>GET /api/deals/:id/evidence</code> → <code>investorEvidence</code> (raiseEvidence.ts): coverage groups before the NDA with the fixed line; items, claims and a partial flag after it; 403 for staff with the Raise › Evidence line', 'Built today (InvestorEvidence.jsx, VR8–VR10): items grouped by area. The claims line, filters, sort and item sheet are frontend work'],
        ['DE23 Team', '<code>GET /api/deals/:id/team</code> (deal_insights.ts): people as published, bands per skill area for at least two members, values band, full-time and founder–market fit always Not recorded', 'Built today as its own tab (DealInsightTabs); moves under Scorecard › Team'],
        ['DE24 Market', '<code>GET /api/deals/:id/market</code>: TAM/SAM/SOM with no source, sources, segments, company markets with four readings, competitors, geography Not recorded', 'Built today as its own tab; moves under Scorecard › Market. Search and sort are frontend'],
        ['DE25 Traction', '<code>GET /api/deals/:id/traction</code>: 12 months from shared updates, Not reported gaps; ARR, NRR Not recorded', 'Built today as its own tab; moves under Scorecard › Traction'],
        ['Score rows', '<code>GET /api/venture-scores/deal/:dealId</code>, five score states', 'DX5'],
        ['DE27 Notes', '<code>/api/deals/:id/notes</code> (deal_context.ts): firm-scoped, author-only edit and delete, 409 “Choose the firm this deal is for.”, investor only. Tags are a picker of four (Thesis, Risk, Question, Decision); the Worker allows up to 80 characters', 'Built today as a Notes tab beside Activity; moves into Activity as a filter. Edited date is read but not shown today'],
        ['Old addresses', '<code>dealPageModel.js</code>: investors draw eleven tabs including Team, Market, Traction and Notes, and no Activity tab', 'Frontend: /team, /market, /traction open Scorecard at that scope; /notes opens Activity with Firm notes on']])
      + '<h2>Backend required (◇)</h2><ul><li>Advisors’ count and roles in the team read.</li><li>Source, as-of date and method for TAM, SAM and SOM.</li><li>An audited staff read of shared evidence.</li><li>Evidence on the Market and Traction reads.</li><li>A link from an evidence item to its data-room file.</li><li>Any download of the deal summary, scorecard or evidence list.</li></ul>'
      + '<h2>Pending the owner (⚑)</h2><p>The three placements above (#6163). Drawn as the brief’s picks.</p>'
      + '<h2>Proposed for DX-R (#5918)</h2><p>Summarise what is backed (DE20) and What is the team missing? (DE23). Both draft with sources and end in Accept into Notes, Edit or Discard.</p>'
      + '<h2>Accessibility</h2><p>Claim states, strength, sharing, Stale and coverage bands each carry a glyph and a word. Month bars are a table for screen readers, and a Not reported month is announced as such. The item sheet traps and returns focus. Firm-note actions exist only on the author’s own notes. Phone targets are 44px and tabs scroll sideways.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DPE19') html = page(ev19(), { h: 1040, norail: true });
    else if (B === 'DPE20') html = page(ev20(), { h: 1740, rail: rail20() });
    else if (B === 'DPE21') html = page(ev20(), { h: 1100, overlay: sheet21() });
    else if (B === 'DPE22') html = ev22();
    else if (B === 'DPE23') html = page(team(), { h: 1740 });
    else if (B === 'DPE24') html = page(market(), { h: 2080 });
    else if (B === 'DPE25') html = page(traction(), { h: 1810 });
    else if (B === 'DPE26A') html = page(masked26(), { h: 1260 });
    else if (B === 'DPE26B') html = page(empty26(), { h: 960 });
    else if (B === 'DPE27') html = page(activity(), { h: 1160 });
    else if (B === 'DPE27B') html = notesStates();
    else if (B === 'DPE28') html = exportBoard();
    else if (B === 'DPE29') html = states29();
    else if (B === 'DPE31A') html = page(ev20(), { h: 1740, rail: rail20() });
    else if (B === 'DPE31B') html = page(market({ dark: true }), { h: 2080 });
    else if (B === 'DPE32') html = handoff();
    else if (MOB[B]) html = MOB[B]();
    else html = page(ev20(), { h: 1500, rail: rail20() });
    return { html: { __html: html } };
  }
}
