        + box('Unavailable · theme list', st('Unavailable') + note('r', 'The theme list couldn’t be read at 14:30.', 'Nothing is shown as zero.', '<button type="button" class="btn bsm" style="margin-top:6px">Try again</button>') + '<p class="raw">Unthemed quotes and Record a session still work below it.</p>')
        + box('Unavailable · Eadwyn’s suggestions', st('Unavailable') + '<p style="font-size:12.5px">Eadwyn’s suggestions couldn’t be read. This doesn’t mean there are none.</p><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
        + box('Refused · partner reading', ro + '<ul class="vap-ql"><li><div class="q"><span class="nrec">Quote withheld (no consent to quote)</span></div><div class="m"><span>[Jonas Berg] · 21 Oct</span></div></li></ul><p class="raw">No New theme, Assign, Export map or suggestions.</p>')
        + box('Saving · Assign', '<div class="vap-selb"><span><b class="mono">1</b> selected</span>' + st('Saving', 'Assigning to “Month-end close…”') + '</div><p class="raw">Buttons stay disabled until the server answers.</p>')
        + box('Save failed · Assign, Merge, Split', note('r', 'Couldn’t merge.', 'Nothing changed. Your choices are kept in the dialog.', '<button type="button" class="btn bsm" style="margin-top:6px">Try again</button>') + '<p class="raw">Assign keeps the selection; Split keeps the title and phrases.</p>')
        + box('Stale link · 404', '<b style="font-size:13px">This theme isn’t here any more.</b><p style="font-size:12.5px">It was merged or deleted. Its quotes stay on their interviews.</p><a class="btn bsm" href="#" style="align-self:flex-start">Back to Problem discovery</a>')
        + '</div>', 1440),
      VAP23B: () => crop('<span class="eye">Segment · inline step edit and Archive (Scope → Review → Result)</span><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start">'
        + '<section class="cd" style="gap:8px"><b>2 · Context</b><div class="ta" style="min-height:70px">Month-end close with 3–6 road carriers; invoices arrive as PDFs by email</div><div style="display:flex;justify-content:space-between;align-items:center"><span class="raw">Editing in place</span><div style="display:flex;gap:6px"><button type="button" class="btn bsm">Cancel</button><button type="button" class="btn bsm p">Save</button></div></div></section>'
        + dlg('Archive this segment?', 'Review ' + '· ◇ #6003', '<p style="font-size:13px;line-height:1.5"><b>Its 5 interviews keep their fit and leave the segment.</b> They appear in Interviews in no segment.</p><dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Interviews</dt><dd>5 → no segment</dd><dt>Primary ICP</dt><dd>cleared; choose another</dd><dt>Steps</dt><dd>kept, read only</dd></dl>' + OWN('Owner pick A · #6003’s PR follows it'), '<button type="button" class="btn">Keep it</button><button type="button" class="btn dg">Archive segment</button>', 400)
        + note('g', 'Result · Segment archived.', '5 interviews are in no segment now, with their fit kept. Mid-size 3PL ops is no longer primary.') + '</div>', 1300),
      VAP25: () => crop('<span class="eye">Ideal customer profile and segment record · states</span><div class="vap-sgrid">'
        + box('Loading', skel(4) + '<span class="raw">Announced: “Loading Ideal customer profile”</span>')
        + box('Not recorded · steps', '<div class="vap-step" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Context</b><div>' + NREC('Not written yet') + '</div></div>' + step('m') + '</div><div class="vap-step" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Urgency</b><div>' + NREC('Not set') + '</div></div>' + step('m') + '</div><div class="vap-step" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Value promised</b><div>Payables closed in 3 days</div></div>' + step('s') + '</div>')
        + box('Not recorded · fit', fit('u') + '<p class="raw">An interview placed with no fit. Counted in the chart as “Fit not recorded”, never as no fit.</p>')
        + box('Evidence stops at Pattern', ev('Anecdote') + ev('Pattern') + '<p class="raw">Under 3 interviews: Anecdote. 3 or more: Pattern. “Measured” is never drawn on a segment.</p>')
        + box('Unavailable · segment read', st('Unavailable') + note('r', 'Segments couldn’t be read.', 'The count is not zero; it is unknown.', '<button type="button" class="btn bsm" style="margin-top:6px">Try again</button>') + '<p class="raw">Interviews in no segment still works below.</p>')
        + box('Refused · partner reading', ro + '<p class="raw">No Assign, Edit, Archive or suggestions. Who can grant write access: the venture’s founder or an admin.</p>')
        + box('Saving · step edit', '<div class="ta" style="min-height:44px">Month-end close with 3–6 road carriers…</div>' + st('Saving'))
        + box('Save failed · step edit', '<div class="ta" style="min-height:44px">Month-end close with 3–6 road carriers…</div><div class="vap-err" role="alert">✕ Couldn’t save. Your text is kept here.</div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
        + box('Chart waiting', '<p style="font-size:12.5px"><b class="mono">1</b> interview placed in a segment so far. The chart appears at 3.</p>')
        + box('Archived segment · stale link', '<b style="font-size:13px">This segment was archived.</b><p style="font-size:12.5px">Its interviews kept their fit and are in no segment now.</p><a class="btn bsm" href="#" style="align-self:flex-start">Back to Ideal customer profile</a>')
        + '</div>', 1440),
      VAP26B: () => crop('<span class="eye">Recruiting · Add a lead, Move stage, and where the next link lands</span><div style="display:grid;grid-template-columns:380px 340px minmax(0,1fr);gap:14px;align-items:start">'
        + dlg('Add a lead', 'New interview at stage Lead · ◇ #6001', fld('Name', '[Hana Sato]') + fld('Company', '[Kobe Freight]') + fld('Role', 'Ops lead') + '<div class="vx-field"><label>Channel</label><div class="vx-seg2"><span>In person</span><span class="on">Call</span><span>Text chat</span><span>Typed notes</span></div></div><p class="raw">Whether the create route takes a stage is unconfirmed (#6001).</p>', '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Add lead</button>', 380)
        + '<section class="cd" style="gap:6px;position:relative;min-height:330px"><b>Move stage</b><span class="raw">on each row · writes <code>PUT …/interviews/:id/stage</code></span>' + moveMenu().replace('class="vap-menu"', 'class="vap-menu" style="position:static;box-shadow:none;width:auto"') + '</section>'
        + '<section class="cd" style="gap:8px"><b>Landing from the overview’s next link</b><div class="chips"><button type="button" aria-checked="true">Invited · no slot yet<span>3</span></button><button type="button" aria-checked="false">Clear</button></div>' + ivTable({ rows: IVS.slice(1, 4) }) + '</section></div>', 1440),
      VAP27: () => crop('<span class="eye">Interview guide in the recording lightbox · ⚑ owner pick A: a panel here and a sheet from Customer research, no new route</span>' + recWide(guide({ inRec: true })), 1150),
      VAP27C: () => crop('<span class="eye">Interview guide · no open hypothesis, and AI off</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start"><section class="cd">' + guide({ def: true }) + '<p class="raw">Labelled default discovery questions while no hypothesis is open.</p></section><section class="cd">' + guide({ ai: 'off' }) + '</section></div>', 1200),
      VAP28: () => crop('<span class="eye">Recruiting and interview guide · states</span><div class="vap-sgrid">'
        + box('Loading', skel(4) + '<span class="raw">Announced: “Loading Customer research”</span>')
        + box('Not recorded · stage and channel', stage('none', 'no stage · read as Done') + NREC('No channel') + '<p class="raw">An interview with no stage counts in Done, and says so.</p>')
        + box('Unavailable · funnel', st('Unavailable') + note('r', 'The funnel couldn’t be read.', 'The interview list below still works.', '<button type="button" class="btn bsm" style="margin-top:6px">Try again</button>'))
        + box('Unavailable · waitlist', note('a', 'The waitlist couldn’t be read.', 'Lead 19 and Invited 17 count interviews only until it can.', '<button type="button" class="btn bsm" style="margin-top:6px">Try again</button>'))
        + box('Refused · partner reading', ro + '<p class="raw">No Move stage, Invite, Follow up, Promote or guide edits.</p>')
        + box('Saving · stage move', stage('invited', '→ Booked') + st('Saving'))
        + box('Save failed · stage move', stage('invited', 'invited 9 Nov') + '<div class="vap-err" role="alert">✕ Couldn’t move to Booked. It stays at Invited; your date is kept.</div><button type="button" class="btn bsm" style="align-self:flex-start">Try again</button>')
        + box('Invite refused', note('r', 'Invite not sent.', '“This sign-up has no email address on file.”', '') + '<p class="raw">The Worker’s sentence, shown as it came.</p>')
        + box('Guide · Unavailable', st('Unavailable') + '<p style="font-size:12.5px">The guide couldn’t be read. Recording still works.</p>' + NEW('#6008'))
        + box('Guide · draft failed', note('r', 'Eadwyn couldn’t draft questions.', 'The held credit is released. Your questions are unchanged.', ''))
        + '</div>', 1440)
    };

    /* ================= DOCS ================= */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      VAP31: () => dk('<h1>Developer handoff · addendum (V17–V31)</h1><p>Continues the Validate v2 canvas (#4837, V0–V16). Checked against <code>main</code> 6d7712c6d1 on 14 Nov 2026: <code>cloudflare-worker/src/services/cycleValidate.ts</code>, <code>services/records/validate.ts</code>, <code>routes/cycle_validate.ts</code>, <code>routes/progress.ts</code>, <code>routes/founder_validate.ts</code>, <code>services/callOutputs.ts</code>. No new route is drawn.</p>'
        + '<h2>Requires engineering (◇)</h2>' + tbl(['Issue', 'What', 'Boards'], [
          ['#6006', 'Rank reason; problem statement (who has it, how they cope, what it costs); sources vs mentions; supporting vs contradicting counts on the list; Eadwyn grouping proposals accepted as a set; bulk assign; used on slide; pain map share link and PDF', 'V17, V19, V20, V29'],
          ['#6007', 'Primary ICP (one per venture); structured firmographics and disqualifiers on the segment; Compare segments (multi-segment read); Eadwyn’s proposed step text', 'V21, V23, V24, V29'],
          ['#6003', 'Archive a segment (in progress; <code>archived_at</code> is read, nothing writes it)', 'V23'],
          ['#6002', 'The list of interviews in no segment (only the count is read today)', 'V21'],
          ['#6001', 'Add a lead at stage Lead; Promote at stage Lead; the Stage filter listed', 'V26, V28'],
          ['#6008', 'Interview guide: store, read, Eadwyn draft with a cost hold', 'V27, V28, V29'],
          ['No issue yet', 'A source on every segment step (only Value promised has <code>value_source</code>)', 'V23']])
        + '<h2>Working on main (drawn as real)</h2><p>The problem-discovery read (<code>problemRecords</code>: title, wordings, mentions, severity, trend, ICP / need / fit-not-recorded counts, supports, <code>parts.stats</code>, <code>parts.unthemed</code> and <code>unthemed_total</code>, writer-only <code>parts.suggestions</code> of kind <code>pain_severity</code>); quotes withheld as “Quote withheld (no consent to quote)” for non-writers; the theme record (facts, quotes with Consented / No quote consent, hypotheses both directions, segments); assign one phrase (<code>POST /api/progress/pain-groups/:projectId/assign</code>); theme create, edit, delete, merge, split; the pain map CSV export. ICP: segments with source, fit split and Anecdote / Pattern; the unassigned count; suggestions of kind <code>segment</code>, <code>icp_fit</code>, <code>firmographic</code>, <code>job_to_be_done</code>; <code>PUT …/interviews/:id/segment</code>; the five steps with <code>value_source</code> and <code>score_since</code>; findings; persona export. Recruiting: <code>pipelineOf</code> (cumulative; no stage reads as Done; waitlist new in Lead, invited / followed up in Invited); <code>PUT …/interviews/:id/stage</code>; waitlist invite, follow-up, promote.</p>'
        + '<h2>Owner questions (option A drawn, ⚑)</h2>' + tbl(['Question', 'Drawn'], [['Where Compare lives', 'A · a mode on the module page (<code>?compare=ids</code>), no new route. B would be <code>/validate/ideal-customer-profile/compare</code> and changes #6007’s scope'], ['Where the guide lives', 'A · a panel in the recording lightbox and a sheet from Customer research'], ['Guide kept per', 'A · per venture, with a copy onto an interview when used'], ['Archive rule', 'A · interviews leave the segment and keep their fit (binds #6003)'], ['Promoted sign-up', 'A · becomes an interview at stage Lead']])
        + '<h2>Frontend only</h2><p>Labelled stats strip; filters and sorts; the not-grouped row; the selection bar; facts layout; consent and severity pills; the fit chart (from 3 placed interviews); evidence pill; step states; the cumulative funnel labels; stage chips once the filter exists; phone sheets, accordion and pager; dark tokens.</p>'
        + '<h2>Notes</h2><p>States use the Platform States words (D5129): Unavailable for a failed read, where V13 drew “Unreadable”. Severity, fit, step and stage each carry a word and a glyph. Evidence stops at Pattern. Accessibility follows V16: 44px targets on phone, focus returns after dialogs, Saving announced politely and failures as alerts.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'VAP17') html = page(pdMain(), { h: 1880, rail: pdRail() });
    else if (B === 'VAP18') html = page(pdHead({ empty: true }) + '<section class="vx-next" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="ey">Start here</span><b>No interview yet</b><p>Problem discovery fills from what interviewees say. Each pain you log appears in the list as a one-phrase theme marked Not grouped, and in Unthemed quotes, until you group it.</p></div><a class="btn p" href="#">Record your first session</a></section><section class="cd" style="gap:8px;max-width:760px"><span class="eye">What appears here</span><ul class="rz"><li><b>Themes, ranked</b><small>by distinct interviews that name each one</small></li><li><b>Unthemed quotes</b><small>phrases not yet grouped, with who said them</small></li><li><b>Hypotheses it feeds</b><small>Supporting or Contradicting, by code</small></li></ul></section>', { h: 900 });
    else if (B === 'VAP18B') html = page(pdHead() + pdStats({ early: true }) + thList([{ r: 1, t: 'Matching carrier invoices by hand', m: 2, sv: null, tr: -2, icp: 1, need: 0, fnr: 1, hy: [], g: false }, { r: 2, t: 'Month-end close slips by days', m: 1, sv: null, tr: -1, icp: 1, need: 0, fnr: 0, hy: [], g: false }, { r: 3, t: 'No budget line for a standalone tool', m: 1, sv: null, tr: null, icp: 1, need: 0, fnr: 0, hy: [], g: false, nodate: true }, { r: 4, t: 'Disputes with carriers over surcharges', m: 1, sv: null, tr: 1, icp: 1, need: 0, fnr: 0, hy: [], g: false }], { N: 3, lite: true, cap: '4 rows · 0 themes · every phrase not grouped yet · 3 interviews held' }) + unthemed({ total: 5, sel: 0, rows: [['Matching carrier invoices by hand', '[Maya Chen] · [Fleetwise]', '2 Oct', false], ['Matching carrier invoices by hand', '[Sam Ortiz] · [Haulbase]', '28 Sep', false], ['Month-end close slips by days', '[Maya Chen] · [Fleetwise]', '2 Oct', false], ['No budget line for a standalone tool', '[Priya Raman] · [CargoLoop]', 'No date', false], ['Disputes with carriers over surcharges', '[Priya Raman] · [CargoLoop]', '28 Oct', false]] }), { h: 1120 });
    else if (B === 'VAP19') html = page(record({ draft: true }), { h: 1420, n: 3 });
    else if (B === 'VAP21') html = page(icpMain(), { h: 1280, rail: icpRail() });
    else if (B === 'VAP22') html = page(icpHead({ empty: true }) + '<section class="vx-next" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="ey">Start here</span><b>No segment yet</b><p>A segment says who the customer is, in five steps: who they are, their context, the job to be done, how urgent it is, and the value you promise.</p></div><a class="btn p" href="#">Start the profile</a></section><section class="cd" style="gap:8px;max-width:760px"><div class="ch"><h2 style="font-size:14px">Customer fit by segment</h2></div><p style="font-size:12.5px"><b class="mono">0</b> interviews placed in a segment so far. The chart appears at 3.</p></section>' + unassigned({ countOnly: true }).replace('<span class="mono">3</span> held', '<span class="mono">12</span> held'), { h: 900 });
    else if (B === 'VAP22B') html = page(icpHead() + '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:14px">Customer fit by segment</h2><span class="raw">held interviews, all time</span></div><p style="font-size:12.5px"><b class="mono">1</b> interview placed in a segment so far. The chart appears at 3.</p></section>' + segTable({ rows: [{ n: 'Mid-size 3PL ops', src: 'From the ICP wizard', i: 1, s: 1, e: 'Anecdote', up: '2 Oct' }] }), { h: 900 });
    else if (B === 'VAP23') html = page(segRecord({ draft: true }), { h: 1300, n: 3 });
    else if (B === 'VAP24') html = page(compare(), { h: 1000 });
    else if (B === 'VAP26') html = page(crMain(), { h: 1340, n: 3 });
    else if (B === 'VAP27B') html = page(crHead() + crStrip() + funnel(), { h: 1000, overlay: '<div style="position:absolute;inset:0;background:var(--dim);z-index:7"></div><aside role="dialog" aria-modal="true" aria-label="Prepare questions" class="vap-drw"><div class="mdh"><div><span class="raw">Customer research</span><h2>Prepare questions</h2></div><button type="button" class="ib" aria-label="Close">✕</button></div><div style="padding:0 20px 20px;overflow:hidden">' + guide() + '</div></aside>' });
    else if (B === 'VAP30A') html = page(pdMain({ nomenu: true }), { h: 1880, rail: pdRail() });
    else if (B === 'VAP30B') html = page(icpMain(), { h: 1280, rail: icpRail() });
    else if (B === 'VAP30C') html = page(segRecord({}), { h: 1300, n: 3 });
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(pdMain(), { h: 1880, rail: pdRail() });
    return { html: { __html: html } };
  }
}

</script>
