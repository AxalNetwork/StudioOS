      + '<section class="cd" aria-labelledby="mg-h" style="gap:4px"><h2 id="mg-h" style="font-size:15px;font-weight:800;padding-bottom:4px">Manage Community</h2><nav class="pl2" aria-labelledby="mg-h">' + J(MG.map(m => '<a href="#"><span><b>' + m[0] + '</b><small>' + m[1] + '</small></span>' + (m[2] ? pill('', m[2]) : '<span></span>') + '<span class="chev" aria-hidden="true">›</span></a>')) + '</nav></section>'
      + aiRow('2 metrics aren’t recorded').replace('See what’s missing ▾', '▾')
      + '</main></div>';
    const phoneEvents = () => '<div class="ph" style="height:844px;position:relative">' + pTop(true) + '<main class="pbd" style="padding-bottom:90px"><div><span class="eye">Community · Last 12 weeks</span><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px">Events</h1></div>'
      + '<div class="strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div style="border-bottom:1px solid var(--hair)"><span class="eye">Upcoming</span><b>14</b></div><div style="border-bottom:1px solid var(--hair);border-right:0"><span class="eye">Registrations</span><b>423</b></div><div><span class="eye">Show-up</span><b>64%</b></div><div style="border-right:0"><span class="eye">Waitlisted</span><b>31</b></div></div>'
      + '<label class="inp" style="min-height:44px;min-width:0"><span aria-hidden="true">⌕</span><span>Search events</span></label><div style="display:flex;gap:8px"><button type="button" class="dd" style="min-height:44px;flex:1;justify-content:center">Filters · 0</button><button type="button" class="dd" style="min-height:44px;flex:1;justify-content:center">Sort: Date ▾</button></div>'
      + '<ol class="cd" style="padding:2px 14px;gap:0">' + J([['AI Founder Dinner', 'Fri 13 Nov · Dinner', ST.rev, '40 seats'], ['Demo Day Rehearsal', 'Thu 12 Nov · Demo day', ST.pub, '58 / 60 · 6 waitlisted'], ['Pricing Workshop', 'Tue 10 Nov · Workshop', ST.pub, '22 · no cap'], ['Founder Breakfast · Lisbon', 'Wed 28 Oct · Networking', ST.end, '33 of 48 attended · 69%']].map((e, i) => '<li style="' + (i ? 'border-top:1px solid var(--hair);' : '') + 'padding:12px 0"><a href="#" style="display:flex;flex-direction:column;gap:5px;color:var(--ink);min-height:44px"><b style="font-size:14px">' + e[0] + '</b><span class="ks">' + e[1] + '</span><span style="display:flex;justify-content:space-between;align-items:center;gap:8px">' + e[2] + '<span class="mo" style="font-size:12px;font-weight:600">' + e[3] + '</span></span></a></li>')) + '</ol>'
      + '<button type="button" class="btn">Show more · 4 of 41</button></main><div class="pbar"><a class="btn p" href="#">Manage events →</a></div></div>';
    const phoneTable = () => '<div class="ph" style="height:844px;position:relative">' + pTop(true) + '<main class="pbd"><div><span class="eye">Community · Last 12 weeks</span><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px">Community activity</h1></div>'
      + '<p class="ins" style="font-size:14px">Participation increased <b>18%</b> compared with the previous 12 weeks.</p>' + seg('Chart or table', ['Chart', 'Table'], 'Table')
      + '<section class="cd" style="padding:4px 12px">' + tbl('Weekly community activity', [['Week'], ['Reg.', 1], ['Apps', 1], ['Book.', 1]], WK.map((w, i) => ({ cls: i === 11 ? 'cur' : '', c: [w + (i === 11 ? '<small>so far</small>' : ''), String(REG[i]), String(JOB[i]), BKG[i] == null ? '—' : String(BKG[i])] })).reverse()).replace(/<td class="n na" title="Not applicable yet">—/g, '<td class="n na" title="Not recorded">— <small style="display:inline">n/r</small>') + '</section>'
      + '<p class="foot">Reg. event registrations · Apps job applications · Book. expert bookings. — n/r: not recorded that week, not zero.</p></main></div>';

    /* ---------- crops ---------- */
    const crop = (inner, w) => '<div class="cv" style="' + VARS + ';width:' + (w || 560) + 'px;padding:20px;display:flex;flex-direction:column;gap:14px">' + inner + '</div>';
    const QM = [['Event', 'AI Founder Dinner', 'Waiting for review · event is on 13 Nov', '4 days', true], ['Job', 'Founding Product Designer', 'Waiting for review · Northwind Labs', '3 days', true], ['Event', 'Pitch Night · Q4', 'Waiting for review', '3 days', true], ['Event', 'LP Briefing · Fund I', 'Waiting for review', '2 days', false], ['Expert', 'Sarah M. · Executive coach', 'Verification pending', '2 days', false]];

    /* ---------- route ---------- */
    let html = '';
    const page = (body, o) => { o = o || {}; return '<div class="cv" style="' + VARS + ';width:1440px' + (o.h ? ';height:' + o.h + 'px' : '') + '">' + shell(body, o.overlay, o.h || 900, o.busy) + '</div>'; };
    if (B === 'CM01' || B === 'CM11') html = page(full({ tip: dark }));
    else if (B === 'CM03') html = page(full({ jobsErr: true, aiOpen: true }));
    else if (B === 'CM04a') html = page(emptyBody());
    else if (B === 'CM04b') html = page(lowBody());
    else if (B === 'CM05') html = page(full(), { h: 900, overlay: evDlg() });
    else if (B === 'CM06') html = page(full(), { h: 900, overlay: jobDlg() });
    else if (B === 'CM07') html = page(full(), { h: 900, overlay: cirDlg() });
    else if (B === 'CM08') html = page(full(), { h: 900, overlay: actDlg() });
    else if (B === 'CM12a') html = page(loadBody(), { busy: true });
    else if (B === 'CM12b') html = page(failBody());
    else if (B === 'CM09') html = '<div class="cv" style="' + VARS + '">' + phoneDash() + '</div>';
    else if (B === 'CM10a') html = '<div class="cv" style="' + VARS + '">' + phoneEvents() + '</div>';
    else if (B === 'CM10b') html = '<div class="cv" style="' + VARS + '">' + phoneTable() + '</div>';
    else if (B === 'CM02a') html = crop(kpis([{ k: 'Waiting on you', v: '3', sub: '2 events · 1 job · nothing overdue' }], 1) + attCard(Q.slice(2, 5), 5));
    else if (B === 'CM02b') html = crop(kpis([{ k: 'Waiting on you', v: '4', sub: '2 events · 1 job · 1 expert', x: pill('a', '<span class="dot" aria-hidden="true"></span>1 overdue · over 2 days'), att: true }], 1) + attCard([Q[0], Q[2], Q[3], Q[4]], 5));
    else if (B === 'CM02c') html = crop(kpis([{ k: 'Waiting on you', v: '12', sub: '6 events · 4 jobs · 2 experts', x: pill('a', '<span class="dot" aria-hidden="true"></span>3 overdue · over 2 days'), att: true }], 1) + attCard(QM, 5, { total: 12, split: pill('', 'Events 6') + pill('', 'Jobs 4') + pill('', 'Experts 2') + pill('a', '<span class="dot" aria-hidden="true"></span>Overdue 3') }));
    else if (B === 'CM02d') html = crop(kpis([{ k: 'Waiting on you', v: '0', sub: 'Approvals are clear' }], 1) + attClear());
    else if (B === 'CM12c') html = crop(oppErr(''));
    else if (B === 'CM12d') html = crop(oppRetry(''));
    else if (B === 'CM12e') html = crop(actCard({ noJobs: true, w: 520, r: 118 }));
    else html = page(full());
    return { html: { __html: html } };
  }
}
</script>
</body>
</html>
