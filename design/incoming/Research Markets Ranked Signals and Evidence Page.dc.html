      const sectorLink = s.slug
        ? '<a class="btn ' + (o.prim === false ? '' : 'p') + '" href="#" style="align-self:flex-start">Open sector profile: ' + s.sector + ' →</a>'
        : '<p class="rms-nolink">' + chip('nr', 'No sector profile') + ' <span>“' + s.sector + '” is not a tracked sector yet, so there is no profile to open.</span></p>';
      return '<div class="rms-shd"><div><span class="eye">Signal · rank ' + s.rank + ' of 14</span><h2 id="rms-sh">' + s.title + '</h2></div><button type="button" class="ib' + (o.closeFocus ? ' fv' : '') + '" aria-label="Close evidence">✕</button></div>'
        + '<div class="rms-shb"><dl class="kv2 rms-dl"><dt>Sector · geography</dt><dd>' + s.sector + ' · ' + s.geo + '</dd><dt>Signal updated</dt><dd class="mo">' + s.upd + '</dd><dt>Newest evidence observed</dt><dd>' + (s.newest ? '<span class="mo">' + s.newest + '</span>' : chip('none', 'None') + ' <span class="rms-why">no evidence recorded</span>') + '</dd><dt>Confidence</dt><dd>' + (o.evState === 'un' ? conf('un') : conf(s.conf, { why: false })) + (s.kinds ? '<span class="rms-why"> · ' + s.kinds + ' kinds of source agree</span>' : '') + '</dd></dl>'
        + '<details class="rms-mean"' + (o.mean ? ' open' : '') + '><summary>What confidence measures</summary><p>' + MEANS + ' A signal backed by only one kind of source cannot score above 55%.</p></details>'
        + '<section><h3 class="eye" style="margin-bottom:6px">Why now</h3><p class="rms-why2">' + s.why + '</p></section>'
        + '<section><div class="ch" style="margin-bottom:8px"><h3 class="eye">Evidence' + (o.evState === 'un' ? '' : ' · ' + s.ev.length) + '</h3><span class="raw">Newest first by observation date</span></div>' + evs + '</section>'
        + sectorLink + '</div>'; };
    const sideSheet = (s, o) => '<div class="rms-dim" aria-hidden="true"></div><div class="rms-side" role="dialog" aria-modal="true" aria-labelledby="rms-sh">' + sheetBody(s, o) + '<div class="rms-sf"><span class="raw">Esc or ✕ closes and returns focus to “View evidence”. The list, search and sort stay as they were.</span></div></div>';

    /* ---------- boards ---------- */
    const notesLive = '<section class="rms-notes"><span class="eye">Design notes · not product copy</span>'
      + note(1, 'Rank and confidence are two things.', 'The order comes from the signals engine’s rank. Confidence is printed beside it and never re-sorts the list; #2 scores 100% and #3 scores 0%.')
      + note(2, '82 is shown as 82%.', 'The Worker sends 0–100. Main multiplies by 100 again and would print “8200%” — a frontend fix, no new data.')
      + note(3, 'Update date is the signal’s.', 'Each source’s own observation date is shown inside the evidence sheet, never in its place.')
      + note(4, 'View evidence reads what the list already returns.', 'GET /api/signals sends why_now and evidence_items with each signal; source names come from GET /api/signals/sources.') + '</section>';
    const notesSheet = '<section class="rms-notes rms-top"><span class="eye">Design notes · not product copy</span>'
      + note(1, 'Source link only when a URL is recorded.', 'signal_evidence.url is nullable. Without it the recorded citation is printed as text, never a dead link.')
      + note(2, 'Sector link only to a real destination.', 'signal.sector is free text. The page already reads GET /api/research/sectors; an exact name match links to /research/markets/sector/:slug. ' + ENG('sector_slug from the Worker, #7038'))
      + note(3, 'Directory state survives.', 'The sheet adds ?signal=sig-7f2a beside ?sort and ?group, so Back closes it and a link reopens it.') + '</section>';

    const statesBoard = () => crop('<span class="eye">Read states of the Top-ranked signals card · each with its own words and action</span><div class="rms-five">'
      + J([['Live read', 'live'], ['Live read · empty', 'empty'], ['Illustrative examples', 'ill'], ['Loading', 'load'], ['Read failed', 'fail']].map(x => '<div class="rms-col"><div class="rms-lab">' + x[0] + '</div>' + card(x[1]) + '</div>'))
      + '</div><div class="rms-five rms-cmp">'
      + J([['200 · data_state live · signals 1–n', 'Rows. Count “3 of 14”. No banner.', 'On main'], ['200 · data_state live · signals []', '“No ranked signals in the live store.” No Retry, no examples.', '◇ Worker'], ['200 · data_state illustrative', 'Amber Illustrative chip on the card and on every row, “View example evidence”.', 'On main · ⚑'], ['request pending', 'Skeleton rows and “Loading signals…”. Never a count.', 'On main'], ['503 · signals_unreadable', 'Unavailable chip, “Could not load signals”, Retry. Never “none”, never examples.', '◇ Worker']].map(r => '<div class="rms-cc"><code class="mo">' + r[0] + '</code><p>' + r[1] + '</p><span class="raw">' + r[2] + '</span></div>'))
      + '</div>', 1760);

    const confBoard = () => crop('<span class="eye">Confidence · how each value renders · works without colour or hover</span><div class="rms-four">'
      + J([['API 82', 82, 'Value. Meter and the number, “82% confidence”.'], ['API 100', 100, 'Value. Full meter, “100% confidence”. Still not a promise of anything.'], ['API 0', 0, 'A measured zero is a Value: “0% confidence · no evidence recorded”. Not hidden, not a dash.'], ['API null or absent', null, 'Not recorded: dotted chip, no meter, no number. Never drawn as 0%.'], ['Evidence read failed', 'un', 'Unavailable: dashed chip. Confidence can’t be computed without the evidence. ◇']].map(c => '<div class="rms-cfc"><code class="mo">' + c[0] + '</code><div class="rms-cfv">' + conf(c[1]) + '</div><p>' + c[2] + '</p></div>'))
      + '</div><div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>What the score measures, in plain words.</b> ' + MEANS + ' The Worker computes it from evidence quality (45%), agreement between kinds of source (35%) and recency (20%), and caps one-kind signals at 55%.</div></div>'
      + '<div class="rms-rules"><div><b>Format</b><p>Math.round(score) + “%”. Values outside 0–100 are treated as Not recorded and logged, never clamped into view.</p></div><div><b>Words</b><p>Always “confidence”, never “probability”, “likelihood” or “chance”. The meter has no colour scale: no green for high, no red for low.</p></div><div><b>Screen readers</b><p>“Confidence 82 percent.” The meter is hidden; the number carries the meaning.</p></div></div>', 1400);

    const evStates = () => crop('<span class="eye">Evidence inside the sheet · item and read variants</span><div class="rms-three"><div class="rms-col"><div class="rms-lab">Item with a recorded URL</div><ol class="rms-evs">' + evItem(SIG[0].ev[2]) + '</ol></div><div class="rms-col"><div class="rms-lab">Item without a URL · citation as text</div><ol class="rms-evs">' + evItem(SIG[0].ev[0]) + '</ol></div><div class="rms-col"><div class="rms-lab">Live signal with no evidence</div><div class="rms-st">' + chip('none', 'None') + '<p><b>No evidence is recorded for this live signal.</b> Its confidence is 0% for that reason. Treat the claim as unbacked.</p></div></div></div>'
      + '<div class="rms-three"><div class="rms-col"><div class="rms-lab">Evidence read failed ' + ENG('#7038') + '</div><div class="rms-st rms-fl">' + chip('un') + '<p><b>Could not load the evidence for this signal.</b> This is not a sign it has none.</p><button type="button" class="btn bsm" style="align-self:flex-start">' + G.re + 'Retry</button></div></div><div class="rms-col"><div class="rms-lab">Illustrative example item</div><ol class="rms-evs"><li class="rms-ev"><div class="rms-evh"><span class="rms-kd">Filing</span>' + chip('ill', 'Example') + '</div><b>Example filing: lending to small merchants is expanding</b><span class="rms-src">' + SRC.sec_edgar + ' · example text</span><div class="rms-cit"><span class="eye">Example citation · no URL</span><p>Observed date belongs to the example set (on or before 1 Aug 2026).</p></div></li></ol></div><div class="rms-col"><div class="rms-lab">Sector with no profile</div><p class="rms-nolink">' + chip('nr', 'No sector profile') + ' <span>“Logistics software” is not a tracked sector yet, so there is no profile to open.</span></p></div></div>', 1300);

    const PATH = [
      ['1', 'Scan the ranked list', 'Tab reaches “View evidence” on rank 1. Its name includes the signal title.', row(SIG[0], { focus: true })],
      ['2', 'Open in context', 'Enter opens the sheet. Focus moves to its heading; the list stays mounted behind it. URL gains ?signal=sig-7f2a.', '<div class="rms-mini">' + sheetBody(SIG[0], { prim: false }).split('<section><h3 class="eye" style="margin-bottom:6px">Why now')[0] + '</div></div>'],
      ['3', 'Check a source', '“Open source” opens the recorded URL in a new tab. An item without a URL shows its citation.', '<ol class="rms-evs">' + evItem(SIG[0].ev[2]) + '</ol>'],
      ['4', 'Go deeper', 'Open sector profile goes to /research/markets/sector/energy-storage. Back returns to the open sheet.', '<a class="btn p" href="#">Open sector profile: Energy storage →</a>'],
      ['5', 'Close and resume', 'Esc or ✕ closes. Focus returns to the same “View evidence”; the sort, grouping and scroll position are untouched.', row(SIG[0], { focus: true })]
    ];
    const pathBoard = () => crop('<span class="eye">Clickable path · from a ranked claim to its source and back, keyboard first</span><div class="rms-path">' + J(PATH.map(p => '<div class="rms-step"><div class="rms-sn"><span>' + p[0] + '</span><b>' + p[1] + '</b></div><p>' + p[2] + '</p><div class="rms-sv">' + p[3] + '</div></div>')) + '</div>', 1760);

    /* ---------- phone ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Open Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mHead = '<div class="crumb">Research / Markets</div><div class="seg" role="radiogroup" aria-label="Market type" style="align-self:flex-start"><button type="button" role="radio" aria-checked="true">Private</button><button type="button" role="radio" aria-checked="false">Public</button><button type="button" role="radio" aria-checked="false">Government</button></div><div class="inp" style="min-height:44px"><span aria-hidden="true">⌕</span>Search markets</div>';
    const mSheet = (s, o) => '<div class="dim2"></div><div class="sheet rms-psh" role="dialog" aria-modal="true" aria-labelledby="rms-sh" style="max-height:790px"><div class="grab" aria-hidden="true"></div>' + sheetBody(s, o) + '</div>';
    const MOB = {
      RMS06A: () => phone('Markets', mHead + card('live')),
      RMS06B: () => phone('Markets', mHead + card('live'), mSheet(SIG[0], {})),
      RMS06C: () => phone('Markets', mHead + card('fail', { tag: false }) + '<section class="cd" style="gap:6px"><h2 style="font-size:15px;font-weight:800">Private markets by sector</h2><div class="rms-grp" style="border:0;padding:0"><ul><li><a href="#">[Energy storage · Germany]</a><span class="mo">12 companies</span></li><li><a href="#">[Energy storage · Nordics]</a><span class="mo">7 companies</span></li></ul></div></section>'),
      RMS06D: () => phone('Markets', mHead + card('ill')),
      RMS06E: () => phone('Markets', mHead + card('live'), mSheet(SIG[2], {}))
    };

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RMS08: () => dk('<h1>Handoff · ranked signals, confidence and evidence</h1><p>Checked against main <code>87bf3ac4ac</code> on Mon 16 Nov 2026. Everything on the boards is either on main as working, a frontend-only change, or tagged ◇ for the Worker. Sample signals, companies, tickers, URLs and scores are fictional.</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it does today'], [
          ['<code>frontend/src/pages/research/MarketDirectoryZone.jsx</code> LatestSignals', 'Reads <code>api.signals.list({ limit: 3, mode })</code>. Prints title, sector · region, “confidence N%” and the update date; an amber Illustrative line; Unreadable with Retry; “No signals are recorded yet.” No evidence view and no sector link.'],
          ['Confidence scale', '<code>services/signals/ranking.ts</code> <code>computeConfidence</code> returns an integer 0–100 and <code>rankSignals</code> sets it on every signal. The card prints <code>Math.round(score * 100)</code>, so 82 reads <b>8200%</b>. The test <code>research_markets_pages_d533.test.mjs</code> feeds 0.62, which hides it.'],
          ['Evidence in the list', '<code>GET /api/signals</code> (<code>routes/signals.ts</code>) returns each signal with <code>why_now</code> and <code>evidence_items</code>: kind, title, detail, source_key, url (nullable, migration 136), observed_at. <code>GET /api/signals/sources</code> names each source_key. The sheet needs no new endpoint.'],
          ['Read errors', '<code>services/signals/engine.ts</code> <code>loadSignalsFromDb</code> catches every error and returns <code>[]</code>; <code>loadSignalsWithState</code> turns <code>[]</code> into the seed set with <code>data_state: illustrative</code>, and <code>getRankedSignals</code> caches it in KV for 15 minutes. A D1 failure and an empty live store both arrive as examples.'],
          ['Fallback test', '<code>cloudflare-worker/test/signals_pipeline.test.ts</code> “with no ingested rows the response is LABELED illustrative” uses an env where every <code>prepare</code> throws, so it locks in the fallback for any error.'],
          ['Sector profiles', '<code>/research/markets/sector/:slug</code> exists and the page already reads <code>GET /api/research/sectors</code>. A signal’s <code>sector</code> is free text with no slug.']])
        + '<h2>Requires engineering ◇ (Worker)</h2>' + tbl(['Change', 'Contract'], [
          ['Read failure is an error', '<code>loadSignalsFromDb</code> rethrows anything but a missing table. <code>GET /api/signals</code> answers <code>503 { error: \"signals_unreadable\" }</code>. A failure is never cached and never served as examples.'],
          ['Empty live is not illustrative', 'When an ingest run has ever written signals, an empty or fully filtered result is <code>200 { data_state: \"live\", signals: [], total: 0 }</code>. <code>illustrative</code> only when the tables are missing or no ingest run has written.'],
          ['Evidence read failure', 'If signal rows read but <code>signal_evidence</code> fails: <code>evidence_state: \"unavailable\"</code> and <code>confidence_score: null</code> on each signal, instead of an empty list that scores 0.'],
          ['Sector destination (optional)', '<code>sector_slug</code> on a signal when its sector maps to a tracked sector. Until then the frontend matches by exact name.'],
          ['Worker tests', 'Split the fallback test: missing tables → illustrative; any other D1 error → 503 and no KV write; ingested but empty → live with 0; evidence query failing → evidence_state unavailable, confidence null.']])
        + '<h2>Frontend only</h2>' + tbl(['Change', 'Detail'], [
          ['Percent', 'Print <code>Math.round(score)</code>%. 0 is a Value with “no evidence recorded”; null or out of range is Not recorded.'],
          ['Evidence sheet', 'Side sheet at 1440, bottom sheet at 390. Why now, evidence by observation date with source name, URL link (new tab, rel noopener) or recorded citation text; None when a live signal has no evidence.'],
          ['States', 'Live, live empty, illustrative, loading and failed each have their own text and action. Illustrative rows say Example and “View example evidence”.'],
          ['Place and focus', '<code>?signal=</code> beside <code>?q</code>, <code>?sort</code>, <code>?group</code>; focus returns to the invoking button; Back closes the sheet.'],
          ['Frontend tests', 'In <code>research_markets_pages_d533.test.mjs</code>: 82 → “82%”, 0 → “0%” and “no evidence recorded”, null → “Not recorded”; empty live never shows examples; unreadable never says “No signals”; a URL-less item prints its citation; closing restores focus.']])
        + '<h2>Pending the owner ⚑</h2>' + tbl(['Question', 'Options'], [
          ['Illustrative examples in production', '<b>A (drawn):</b> keep the labelled example set when no live ingest has run, as main does. <b>B:</b> show only the empty state until live data exists. Note: the seed set on main names real listed companies in its example text.']])),
      RMS08B: () => dk('<h1>Interaction and accessibility notes</h1>' + tbl(['Area', 'Specification'], [
          ['Trigger', '“View evidence” is a button with <code>aria-haspopup=dialog</code> and <code>aria-expanded</code>; its accessible name includes the signal title. Ranks are read as “Rank 1”.'],
          ['Sheet', 'Desktop: right side sheet, 560px, <code>role=dialog</code> with <code>aria-modal</code>, labelled by the signal title; the list stays mounted and scrolled behind a dim layer. Phone: bottom sheet up to 790px, dragging is never the only way to close.'],
          ['Focus', 'On open: the heading. Tab cycles within the sheet. Esc, ✕ or Back close it and return focus to the same “View evidence”. Visible 2px violet ring everywhere.'],
          ['Links', '“Open source” names the host and says “opens in a new tab” to screen readers. No link is drawn without a recorded URL.'],
          ['Without colour or hover', 'Every state has a glyph and a word: Live, None, Not recorded, Unavailable, Illustrative. Confidence is a number with a neutral meter; nothing needs hover to be read. Observation and update dates are labelled text.'],
          ['Live regions', 'Loading uses <code>role=status</code>. “Could not load signals” is announced once after a Retry fails; on first load it is a static alert in the card only.'],
          ['Failure isolation', 'A failed signals read leaves sector groups, movers, geographies and readings working. Retry re-reads only the signals.'],
          ['Motion', 'Sheet slides in 160ms, none with reduced motion. Skeletons do not shimmer.'],
          ['Investor variant', 'The same card and sheet sit in the investor shell drawn in #7036; only the shell and the ranking mode differ.']]))
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RMS01') html = page(markets(card('live'), { notes: notesLive }), { h: 1000 });
    else if (B === 'RMS02') html = page(markets(card('live', { sel: 0 }), { notes: notesSheet }), { h: 1000, overlay: sideSheet(SIG[0], {}) });
    else if (B === 'RMS02B') html = page(markets(card('live', { sel: 2 })), { h: 1000, overlay: sideSheet(SIG[2], {}) });
    else if (B === 'RMS02C') html = evStates();
    else if (B === 'RMS03') html = confBoard();
    else if (B === 'RMS04') html = statesBoard();
    else if (B === 'RMS04B') html = page(markets(card('fail')), { h: 1000 });
    else if (B === 'RMS04C') html = page(markets(card('ill')), { h: 1000 });
    else if (B === 'RMS05') html = pathBoard();
    else if (B === 'RMS07') html = page(markets(card('live', { sel: 0 })), { h: 1000, overlay: sideSheet(SIG[0], { mean: true }) });
    else if (B === 'RMS07B') html = page(markets(card('live', { focus: 0 })), { h: 1000 });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(markets(card('live')), { h: 1000 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
