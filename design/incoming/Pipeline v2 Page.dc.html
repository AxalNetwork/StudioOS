    else if (B === 'PP07') html = page('Analytics', analytics(), { h: 1100 });
    else if (B === 'PP08') html = page('Negotiations', negotiations(), { h: 860, overlay: oppSheet() });
    else if (B === 'PP09') html = states();
    else if (B === 'PP09b') html = page('Pipeline', centre(), { h: 1350 });
    else if (B === 'PP09c') html = page('Pipeline', firstRun(), { h: 900, rail: 'off' });
    else if (B === 'PP09d') html = page('Pipeline', firstRun(), { h: 900, rail: 'tokens' });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PP10') html = handoff();
    else html = page('Pipeline', firstRun(), { h: 900, rail: 'first' });
    return { html: { __html: html } };
  }
}
