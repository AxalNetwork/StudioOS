      ['Loading', '<div class="rvx-m" aria-busy="true"><span class="l">Invoiced</span><span class="sk" style="height:26px;width:60%"></span><span class="sk" style="height:10px;width:40%"></span></div>', 'Announced politely; never a blank 0.']
    ];
    const states = () => crop('<span class="eye">Financial value states · shape and words, never colour alone</span><div class="rvx-states">' + J(STATES.map(s => '<div><span class="raw" style="display:block;margin-bottom:6px">' + s[0] + '</span>' + s[1] + '<div class="cap">' + s[2] + '</div></div>')) + '</div>'
      + '<span class="eye" style="margin-top:8px">Temporal labels · every figure carries one</span><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px">' + Q4 + '<span class="mu">the selected period</span>' + LIVE + '<span class="mu">read now, ignores the period</span>' + D30 + '<span class="mu">rolling, ignores the period</span>' + PIT + '<span class="mu">point in time</span>' + MON + '<span class="mu">calendar month</span></div>'
      + '<p class="foot">Changing the Period selector changes only figures tagged with the period. Live, rolling and point-in-time figures say so, so a Q4 filter never implies disputes are Q4-scoped.</p>', 1360);

    /* ---------- pages ---------- */
    const overview = () => head({ tag: true }) + summary() + attention() + streams() + '<div class="rvx-split"><div>' + trend() + '</div><div>' + aiEcon(false) + '</div></div>' + receivables() + subsidiaries() + exceptions() + promotions();
    const partialPage = () => head() + summary('partial') + attention();

    /* ---------- responsive ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mkpi = (l, v, ctx, cls) => '<div class="rvx-m ' + (cls || '') + '" style="border:1px solid var(--hair);border-radius:12px;background:var(--card)"><span class="l">' + l + '</span><span class="v" style="font-size:21px">' + v + '</span><span class="c">' + ctx + '</span></div>';
    const MOB = {
      RV14b: () => phone('Revenue', '<div class="rvx-ctl"><button type="button" class="dd" style="min-height:44px">Q4 2026 ▾</button><button type="button" class="dd" style="min-height:44px">All subsidiaries ▾</button></div><button type="button" class="rvx-cov" style="min-height:44px">4 of 9 sources complete ›</button><span class="eye">EUR</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' + mkpi('Invoiced', '€128,400', Q4) + mkpi('Collected', '€112,900', Q4) + mkpi('Outstanding', '€15,500', PIT) + mkpi('Overdue', '€4,200', '3 receivables') + mkpi('Refunds', '€820', D30) + mkpi('Disputes', '2', LIVE) + '</div><div class="nt r"><span class="ic" aria-hidden="true">■</span><div><b>Dispute evidence due tomorrow</b><div>€1,200 at risk</div></div></div><a class="btn p" href="#" style="min-height:48px">Review dispute</a>'),
      RV14c: () => phone('Receivables', '<div class="chips" style="flex-wrap:nowrap;overflow:hidden"><button type="button" aria-checked="true" style="min-height:40px">Overdue · 3</button><button type="button" style="min-height:40px">Issued · 3</button><button type="button" style="min-height:40px">All</button></div>' + J(REC.slice(0, 3).map(r => '<div class="rvx-rc"><div class="t"><b style="font-size:14px">' + r[0] + '</b>' + RS[r[6]] + '</div><span class="raw">' + r[1] + '</span><dl><dt>Owed</dt><dd>' + r[2] + '</dd><dt>Paid</dt><dd>' + r[3] + '</dd><dt>Outstanding</dt><dd><b>' + r[4] + '</b></dd><dt>Due</dt><dd>' + r[5] + ' · ' + r[7] + ' late</dd></dl></div>'))),
      RV14d: () => phone('Refund a payment', '<p class="raw">Review · step 2 of 5</p>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mrf"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="mrf" style="font-size:17px;font-weight:800">Review the payment</h2>' + steps(RSTEPS, 2).replace('rvx-steps"', 'rvx-steps" style="font-size:8.5px"') + '<div class="rvx-rc"><dl><dt>Customer</dt><dd style="font-family:var(--sg)">Acme Ventures</dd><dt>Paid</dt><dd>€1,200.00</dd><dt>Already refunded</dt><dd>€200.00</dd><dt>Refundable</dt><dd>€1,000.00</dd><dt>Clawback</dt><dd>€50</dd></dl></div><div class="fld"><label for="mra">Amount to refund</label><div class="ta" id="mra" style="min-height:48px;font-family:var(--mo)">500.00</div></div><button type="button" class="btn p" style="min-height:48px">Continue</button><button type="button" class="btn" style="min-height:48px">Back</button></div></div>')
    };
    const tablet = () => '<div class="cv" style="' + VARS + ';width:834px;height:1112px"><div class="ph" style="width:834px;height:1112px"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">Revenue</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">'
      + head().replace('<p>Monitor Axal VC revenue, receivables, billing exceptions and subsidiary reporting.</p>', '') + '<span class="eye">EUR</span><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">' + mkpi('Invoiced', '€128,400', Q4) + mkpi('Collected', '€112,900', Q4) + mkpi('Outstanding', '€15,500', PIT) + mkpi('Overdue', '€4,200', PIT + ' 3') + mkpi('Refunds', '€820', D30) + mkpi('Open disputes', '2', LIVE) + '</div>' + attention()
      + '<span class="eye">Receivables · cards below 900px</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' + J(REC.slice(0, 4).map(r => '<div class="rvx-rc"><div class="t"><b style="font-size:13.5px">' + r[0] + '</b>' + RS[r[6]] + '</div><span class="raw">' + r[1] + '</span><dl><dt>Outstanding</dt><dd><b>' + r[4] + '</b></dd><dt>Due</dt><dd>' + r[5] + '</dd></dl></div>')) + '</div></div></div></div>';

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Backend fit and handoff</h1><p>Checked against <code>routes/admin_revenue.ts</code> (<code>GET /summary</code>), <code>routes/admin_statements.ts</code>, <code>routes/admin_billing.ts</code> and <code>frontend/src/pages/hq/RevenuePage.jsx</code> on main, 8 Nov 2026. This redesign is P2: it follows the correctness work in #5027, #5028 and #5029 and the revenue-ledger issues.</p>'
      + tbl(['Board area', 'Today', 'Status'], [
        ['Period selector', '<code>/summary</code> computes the current quarter (<code>quarterOf(new Date())</code>); statements and ceilings take a <code>YYYY-Qn</code> period', 'Backend required: <code>?period=</code> on <code>/summary</code>'],
        ['Invoiced / Collected / Outstanding / Overdue', 'Licence fee invoices exist per licence (<code>/api/admin/licences/:uid/fee-invoices</code>); statements carry owed and <code>paid_cents</code>; nothing aggregates them', 'Backend required: invoice-backed licence revenue and the reconciled revenue ledger (dependencies on the issue)'],
        ['Licence run-rate', '<code>/summary</code> licence fees: one quarter of each active annual fee', 'Frontend only, relabelled “Contracted run-rate”, never “collected”'],
        ['Subscriptions', 'Not recorded: no local charge ledger', 'Frontend: Not recorded state; backend for a value'],
        ['AI economics', 'Cost real; margin from <code>ai_budget_reservations</code> with not-recorded runs counted (D762)', 'Frontend only, margin first'],
        ['Receivables', 'Statements: draft · issued · paid · void, PATCH for paid and disputed; draw held by owner policy (D514, <code>STATEMENT_DRAW_HELD</code>)', 'Frontend: one table plus drawer; Overdue and Disputed derived from due date and disputed amount; licence invoices joined in need the aggregation above'],
        ['Disputes', '<code>GET /api/admin/billing/disputes</code>, evidence POST', 'Frontend only'],
        ['Refunds', '<code>POST /api/admin/billing/refund</code>: Super Admin write bar (TOTP + step-up), reason ≥ 12, policy, clawback', 'Backend required: a read-only lookup for the Review step (#5037)'],
        ['Promotions', '<code>/promo-ceilings</code>: ceiling, <code>issued_cents</code> (null = not reported), <code>pushed_at</code>, <code>issued_reported_at</code>; remaining only when issued is known', 'Frontend: badge columns. “Enforced” is inferred from an accepted push; read-back is backend required'],
        ['Data coverage', 'Per-zone <code>available</code> and <code>reason</code> in <code>/summary</code>', 'Frontend: one panel; reasons rewritten as operator sentences'],
        ['Licence picker', 'The page fetches the whole licence ledger', 'Backend: a scoped, lazy picker endpoint']])
      + '<h2>Accessibility</h2><p>Figures are monospaced with tabular numerals; KPI labels 10.5px uppercase only as labels, values 26px. Every value state has a word and a shape. Tables have captions and header scope; rows open with Enter; drawers trap focus and return it. Period, view and filter controls are radio groups with <code>aria-checked</code>. Charts have a Table view and an aria-label stating gaps. The refund flow announces each step and errors on the field.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RV01') html = page(overview(), { h: 3720 });
    else if (B === 'RV02') html = page(partialPage(), { h: 980 });
    else if (B === 'RV03') html = states();
    else if (B === 'RV04') html = page(head() + streams() + trend(false), { h: 1180 });
    else if (B === 'RV04b') html = crop(trend(true), 760);
    else if (B === 'RV05') html = page(head() + receivables(4), { h: 1120, overlay: recDrawer() });
    else if (B === 'RV05b') html = crop(recordPay(), 640);
    else if (B === 'RV06') html = page(head() + subsidiaries(), { h: 820 });
    else if (B === 'RV07') html = crop(aiEcon(false), 960);
    else if (B === 'RV07b') html = crop(aiEcon(true), 960);
    else if (B === 'RV08') html = page(head() + exceptions(), { h: 860 });
    else if (B === 'RV09a') html = crop(refund(1), 640);
    else if (B === 'RV09b') html = crop(refund(2), 640);
    else if (B === 'RV09c') html = crop(refund(3), 640);
    else if (B === 'RV09d') html = crop(refund(4), 640);
    else if (B === 'RV09e') html = crop(refund(5), 640);
    else if (B === 'RV10') html = page(head() + promotions(), { h: 880 });
    else if (B === 'RV11') html = page(head() + summary() + attention(), { h: 1000, overlay: coverage() });
    else if (B === 'RV12') html = page(head() + summary() + attention(), { h: 1000, rail: true });
    else if (B === 'RV14a') html = tablet();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'RV15') html = handoff();
    else html = page(overview(), { h: 3720 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
