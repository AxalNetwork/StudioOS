.cov>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--hair);align-items:center}
.cov>div:first-child{border-top:0}
.cov b{font-size:13px}
.cov small{grid-column:1;font-size:11.5px;color:var(--mu)}
.cov .v{grid-row:1/3;grid-column:2;font:700 14px var(--mo);text-align:right}
.cov .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--raised);overflow:hidden;border:1px solid var(--hair)}
.cov .bar i{display:block;height:100%;background:var(--pos)}
.cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--hair);border-radius:12px;background:var(--card);overflow:hidden}
.cg section{padding:12px 14px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.cg h3{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.cg a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;color:var(--ink)!important;font-size:13px;font-weight:600}
.cg a:hover{color:var(--vt)!important}
.disc2{font:600 12px var(--sg);color:var(--vt);background:none;border:0;padding:0;display:inline-flex;gap:5px;align-items:center}
.how{border:1px dashed var(--hair2);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;color:var(--mu);background:var(--raised)}
.how b{color:var(--ink)}
.whk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.whk>div{padding:10px 12px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:3px;min-width:0}
.whk>div:nth-child(4n){border-right:0}
.whk>div:nth-last-child(-n+4){border-bottom:0}
.whk b{font:600 13px var(--mo)}
.whk small{font-size:11px;color:var(--mu)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:70px}
.days>div{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end;height:100%}
.days i{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--pos)}
.days i.z{height:2px!important;background:var(--neg)}
.days span{font:500 9.5px var(--mo);color:var(--mu)}
.sw3{display:grid;grid-template-columns:minmax(0,1.2fr) 150px minmax(0,1.6fr) 150px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--hair);font-size:12.5px}
.sw3.hd{border-top:0;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.sw3 b{font-size:13px}
.sw3 .im{color:var(--mu);font-size:12px;line-height:1.45}
.prev{border:1px dashed var(--hair2);border-radius:12px;padding:12px 14px;background:transparent}

.st-bh{display:flex;gap:14px;align-items:flex-start}
.st-bh h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.st-bh p{font-size:13px;color:var(--mu);margin-top:4px;max-width:1060px;line-height:1.55}
.st-id{font:700 11px var(--mo);padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap;margin-top:2px}
.st-sec{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px}
.st-sh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.st-note{font-size:12px;color:var(--mu)}
.st-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st-sep{width:1px;height:20px;background:var(--hair2);margin:0 6px}
.st-gray{filter:grayscale(1)}
/* chips */
.st-c{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font:700 11px var(--sg);line-height:1.6;white-space:nowrap;border:1px solid var(--hair);background:var(--raised);color:var(--mu);vertical-align:middle}
.st-c svg{flex:none}
.st-nr{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-na{color:var(--mu);background:transparent;border-color:transparent;padding-left:2px}
.st-un{color:var(--ink);background:var(--card);border-color:var(--hair2);border-style:dashed;border-width:1.5px}
.st-un svg{color:var(--neg)}
.st-rf{color:var(--ink);background:var(--raised);border-color:var(--ink);border-width:1px}
.st-stale{color:var(--amT);background:transparent;border-color:var(--amE);border-style:dashed;border-width:1.5px}
.st-part{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-pv{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dashed;border-width:1.5px;font-style:italic}
.st-nc{color:var(--mu);background:transparent;border-color:var(--hair2);border-style:dotted;border-width:1.5px}
.st-l-ok{color:var(--pos);background:var(--posBg);border-color:var(--posE)}
.st-l-am{color:var(--amT);background:var(--amBg);border-color:var(--amE)}
.st-l-mu{color:var(--mu);background:var(--raised);border-color:var(--hair2)}
.st-l-fl{color:#fff;background:var(--neg);border-color:var(--neg)}
.st-retry{display:inline-flex;align-items:center;gap:4px;font:700 11.5px var(--sg);color:var(--vt);background:transparent;border:0;padding:2px 4px;border-radius:6px;vertical-align:middle}
.st-unin{display:inline-flex;align-items:center;gap:4px;color:var(--neg);font-weight:800}
.st-nrin{color:var(--mu);font-style:italic;font-weight:600}
.st-nain{color:var(--mu)}
.st-why{display:block;font-size:12px;color:var(--mu);line-height:1.45}
.st-route{font:700 12px var(--sg)}
.st-zero{color:var(--ink)!important;font-weight:800}
.st-cellnr{color:var(--mu)}
.st-stack{font:800 20px var(--mo);letter-spacing:-.02em}
.st-eng{display:inline-flex;font:700 11px var(--mo);color:var(--vt);background:var(--lav);border:1px dashed var(--lavE);border-radius:6px;padding:1px 6px}
.st-spec{font:500 11px var(--mo)}
/* tiles */
.st-tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.st-t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.st-tw{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-cap2{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.st-tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px;min-height:150px;align-items:flex-start}
.st-tl{font-size:12px;color:var(--mu);font-weight:600}
.st-tv{font:800 26px var(--mo);letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.st-ts{display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:12px}
.st-tna{opacity:1}
.st-big-nr{color:var(--mu);font-weight:500}
.st-big-un{display:inline-grid;place-items:center;width:30px;height:30px;border:1.5px dashed var(--hair2);border-radius:8px;font:800 18px var(--sg);color:var(--neg)}
.st-big-rf{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);border-radius:8px;font:700 18px var(--sg);color:var(--ink);background:var(--raised)}
.st-provv{color:var(--mu);font-style:italic}
.st-wh{font:700 15px var(--sg);color:var(--mu);font-style:italic}
.st-withheld{border-style:dashed}
.st-mini{min-height:120px}
.st-sk{display:inline-block;height:12px;border-radius:5px;background:var(--skel)}
/* prose */
.st-prose{font-size:14px;line-height:1.7;padding:6px 0;border-bottom:1px solid var(--hair)}
.st-prose:last-child{border-bottom:0}
/* tables */
.st-tb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}
.st-tb th{text-align:left;font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
.st-tb td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.st-tb .n{text-align:right;font-family:var(--mo)}
.st-tb code,.st-dict code,.st-sec code,.st-bh code,.st-rules code,.st-opt code,.st-foot2 code{font:500 11px var(--mo);background:var(--raised);border:1px solid var(--hair);padding:0 4px;border-radius:4px}
.st-dict{background:var(--card);border-radius:12px;overflow:hidden}
.st-dict td:first-child{font-weight:800;white-space:nowrap}
.st-dict td:first-child small{display:block;font:600 10px var(--mo);color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.st-dict td:nth-child(4){font:700 13px var(--mo);color:var(--mu);white-space:nowrap}
.st-modrow td{background:var(--raised)}
.st-in th{border-bottom:1px solid var(--hair2)}
.st-none-ex{font-size:12px;color:var(--mu)}
.st-foot2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:12px;color:var(--mu);line-height:1.5}
.st-foot2 b{color:var(--ink)}
/* lists */
.st-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.st-list li:first-child{border-top:0}
.st-list li>span:first-child{display:flex;flex-direction:column}
.st-list small{font-size:12px;color:var(--mu)}
.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-lb{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.st-lbh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-lbh b{font-size:14px}
.st-cnt{font:700 11px var(--mo);padding:1px 7px;border-radius:999px;border:1px solid var(--hair);background:var(--raised);color:var(--ink)}
.st-none{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:9px;background:var(--raised);font-size:13px}
.st-unbox,.st-rfbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5}
.st-unbox{border:1.5px dashed var(--hair2);background:var(--card)}
.st-unbox svg{color:var(--neg);margin-top:3px}
.st-unbox div,.st-rfbox div{display:flex;flex-direction:column;gap:3px;flex:1}
.st-unbox span,.st-rfbox span{color:var(--mu)}
.st-rfbox{border:1px solid var(--ink);background:var(--raised)}
.st-rfbox svg{margin-top:3px}
.st-pb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--amBg);border:1px solid var(--amE);color:var(--ink);font-size:12.5px;line-height:1.45}
.st-pb svg{color:var(--amT);flex:none}
.st-pb>span{flex:1}
.st-skl>div{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.st-skl>div:first-child{border-top:0}
/* charts */
.st-ch{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.st-chh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-chh b{font-size:14px}
.st-ch svg{font-family:var(--sg)}
.st-rule{font:700 13px var(--sg);padding:12px 14px;border-left:3px solid var(--vi);background:var(--card);border-radius:0 9px 9px 0}
/* composite */
.st-comp{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.st-ch2{display:flex;justify-content:space-between;align-items:flex-end}
.st-ch2 h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st-comp .st-tile{background:var(--raised)}
.st-rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5;list-style:disc!important;padding-left:18px!important}
.st-prov{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font:500 11.5px var(--mo);color:var(--mu)}
/* phone */
.st-pt{display:flex;justify-content:space-between;padding:12px 18px 8px;font:700 12px var(--sg);border-bottom:1px solid var(--hair);background:var(--card)}
.st-plist{background:var(--card);border:1px solid var(--hair);border-radius:12px}
.st-plist>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-top:1px solid var(--hair)}
.st-plist>div:first-child{border-top:0}
.st-plist span{font-size:12.5px}
/* do / don't */
.st-dd{display:flex;flex-direction:column;gap:8px}
.st-ddt{font:800 14px var(--sg)}
.st-ddp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-dn,.st-do{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.st-dn{border:1.5px solid var(--negE);background:var(--negBg)}
.st-do{border:1.5px solid var(--posE);background:var(--posBg)}
.st-ddl{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--mo);text-transform:uppercase;letter-spacing:.05em}
.st-dn .st-ddl{color:var(--neg)}
.st-do .st-ddl{color:var(--pos)}
/* options */
.st-opt{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.st-opt p{font-size:12.5px;line-height:1.55;color:var(--mu)}
.st-opt b{font-size:15px}
.st-on{border:2px solid var(--vi)}
.st-ol{font:700 10px var(--mo);letter-spacing:.07em;text-transform:uppercase;color:var(--vt)}
.st-code{font:500 12px/1.6 var(--mo);background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;color:var(--ink)}
.st-whyi{font-size:12px;color:var(--mu)}
.st-ch svg text{font-family:'Space Grotesk',system-ui,sans-serif}
.st-ch svg text[font-family]{font-family:'Roboto Mono',ui-monospace,monospace}
.st-plist~.st-lb{min-height:0}
.wgr-m{font-family:var(--mo);font-weight:600}
.wgr-sha,.wgr-p{font:500 11.5px var(--mo);color:var(--ink);background:var(--raised);border:1px solid var(--hair);border-radius:5px;padding:0 5px;white-space:nowrap}
.wgr-p{white-space:normal;word-break:break-all}
.wgr-n{font:700 12px var(--mo);color:var(--vt)!important;white-space:nowrap}
.wgr-ext{font-size:10px;margin-left:2px}
.wgr-slot{font:600 11.5px var(--mo);color:var(--ink)}
.wgr-sm{font-size:11.5px;color:var(--mu);line-height:1.45}
.wgr-why{display:block;font-size:11.5px;color:var(--mu);line-height:1.45;margin-top:2px}
.wgr-st{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.wgr-it{font-size:13px;line-height:1.4}
.wgr-it b{font-weight:700}
.wgr-src{font:700 10px var(--mo);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
/* annotation tags */
.wgr-eng{display:inline-flex;font:700 10.5px var(--mo);color:var(--tagV);background:var(--tagBg);border:1px dashed var(--tagE);border-radius:6px;padding:1px 6px;white-space:nowrap;vertical-align:middle}
.wgr-own{display:inline-flex;font:700 10.5px var(--mo);color:#92400e;background:#fffbeb;border:1px dashed #f59e0b;border-radius:6px;padding:1px 6px;white-space:nowrap;vertical-align:middle}
/* extra state chips beside Platform States */
.wgr-nck{color:var(--ink);background:transparent;border-color:var(--hair2);border-width:1.5px;border-style:solid}
.wgr-nms{color:var(--mu);background:var(--raised);border-color:var(--hair2);border-style:dotted;border-width:1.5px;font-style:italic}
.wgr-unk{color:var(--ink);background:var(--card);border-color:var(--mu);border-style:dashed;border-width:1px}
.wgr-nread{color:var(--mu);background:var(--raised);border-color:var(--hair2);border-style:dotted;border-width:1.5px}
/* action chips */
.wgr-a{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 7px;border-radius:6px;font:700 11.5px var(--sg);line-height:1.65;white-space:nowrap;border:1px solid}
.wgr-a b{font-family:var(--mo)}
.wgr-a-s{background:var(--neg);border-color:var(--neg);color:#fff}
.wgr-a-w{background:var(--amBg);border-color:var(--amD);color:var(--amT)}
.wgr-a-c{background:var(--card);border-color:var(--ink);color:var(--ink)}
.wgr-a-p{background:var(--posBg);border-color:var(--posE);color:var(--pos)}
/* risk classes */
.wgr-rc{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font:700 11px var(--sg);line-height:1.6;white-space:nowrap;border:1px solid var(--hair2);color:var(--ink);background:var(--card)}
.wgr-rc>span{font-family:var(--mo)}
.wgr-rc-u{border-style:dashed}
.wgr-rc-o{background:var(--amBg);border-color:var(--amE);color:var(--amT)}
.wgr-rc-y{background:var(--raised);border-color:var(--ink)}
.wgr-rc-x{background:var(--neg);border-color:var(--neg);color:#fff}
.wgr-rk{display:inline-flex;gap:4px;align-items:center;font:600 11.5px var(--sg);color:var(--ink)}
.wgr-rk>span{font-family:var(--mo);color:var(--mu)}
.wgr-rk-h>span{color:var(--neg)}
.wgr-rk-m>span{color:var(--amD)}
.wgr-tc{display:inline-flex;gap:5px;align-items:center;font:700 11.5px var(--sg);color:var(--ink)}
.wgr-tc-y{color:var(--neg)}
.wgr-v{display:inline-flex;gap:5px;align-items:center;font:700 12px var(--sg);color:var(--ink)}
.wgr-v-x{color:var(--neg)}
.wgr-v-ok{color:var(--pos)}
.wgr-v-pd{color:var(--amT)}
.wgr-q{font-size:12px;color:var(--ink)}
.wgr-tg{display:inline-flex;font:700 10px var(--mo);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--hair2);border-radius:5px;padding:0 5px;color:var(--mu);background:var(--raised)}
.wgr-stamp{display:inline-flex;gap:5px;align-items:center;font:700 11px var(--sg);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:1px 7px;white-space:nowrap}
.wgr-exp{display:inline-flex;gap:5px;align-items:center;font:700 11.5px var(--sg);color:var(--amT);background:var(--amBg);border:1px dashed var(--amD);border-radius:6px;padding:0 6px}
.wgr-note{display:inline-flex;gap:6px;align-items:baseline;font-size:11.5px;color:var(--amT);line-height:1.4}
.wgr-note>span{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:999px;border:1px solid var(--amD);font:800 9px var(--mo);flex:none}
.wgr-dep{display:inline-flex;gap:3px;align-items:center;font:600 11px var(--mo);color:var(--ink);margin-right:6px}
.wgr-dep-open>span{color:var(--amD)}
.wgr-dep-closed>span{color:var(--pos)}
.wgr-dep-unknown>span{color:var(--mu)}
.wgr-deps{font-size:11.5px;color:var(--mu)}
/* header */
.wgr-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wgr-hd h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.wgr-hd .sub{max-width:560px}
.wgr-hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wgr-hr .ver{align-items:center;justify-content:flex-end}
.wgr-tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--hair)}
.wgr-tabs a{display:inline-flex;gap:8px;align-items:center;padding:9px 12px;font:700 13px var(--sg);color:var(--mu)!important;border-bottom:2px solid transparent;margin-bottom:-1px}
.wgr-tabs a span{font:500 11px var(--mo);color:var(--mu)}
.wgr-tabs a[aria-current]{color:var(--ink)!important;border-bottom-color:var(--ink)}
.wgr-tabn{margin-left:auto;font:500 11px var(--mo);color:var(--mu)}
/* summary */
.wgr-sum{display:grid;grid-template-columns:1.1fr repeat(4,1fr) 1.1fr 1fr;border:1px solid var(--hair);border-radius:12px;background:var(--card);overflow:hidden}
.wgr-sum>div{display:flex;flex-direction:column;gap:5px;padding:11px 12px;border-right:1px solid var(--hair);min-width:0}
.wgr-sum>div:last-child{border-right:0}
.wgr-sum b{font:700 20px var(--mo);letter-spacing:-.02em}

      WGR06C: () => '<div class="cv" style="' + VARS + '"><div class="ph" style="min-height:844px">' + pTop() + '<main class="pbd" style="gap:12px">' + pHead('PR pairs') + '<p class="wgr-plain" style="font-size:12px">A class is a risk signal, not a merge verdict.</p>'
        + J(PAIRS.slice(0, 2).map((p, i) => '<article class="wgr-pc"><div class="wgr-pch"><span class="wgr-it">' + iss(p.a) + ' ↔ ' + iss(p.b) + '</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">' + rc(p.rc) + tc(p.tc) + '</div>' + (p.st.length ? stampB(p.st[0]) : '') + '<button type="button" class="wgr-pd" aria-expanded="' + (i === 0) + '">Paths · ' + p.paths.length + '<i aria-hidden="true">' + (i === 0 ? '▴' : '▾') + '</i></button>' + (i === 0 ? hunkProof(p.paths[0], p.a, p.b) + '<a class="btn p" href="#" style="width:100%">Open both PRs' + ext + '</a>' : '') + '</article>')) + '</main></div></div>',
      WGR06D: () => '<div class="cv" style="' + VARS + '"><div class="ph" style="min-height:844px">' + pTop() + '<main class="pbd" style="gap:12px">' + pHead('PR evidence')
        + J(EV.slice(1, 3).map(e => '<article class="wgr-pc"><div class="wgr-pch"><span class="wgr-it">PR ' + iss(e.n) + '</span><span class="wgr-sm">' + mo(e.p) + ' paths</span></div><dl class="wgr-pdl"><div><dt>Merge</dt><dd>' + mergeC(e.m) + '</dd></div><div><dt>Checks</dt><dd>' + checkC(e.c) + '</dd></div><div><dt>CI queue</dt><dd>' + queueC(e.q) + '</dd></div><div><dt>Base</dt><dd>' + baseC(e.b) + '</dd></div></dl><a class="btn" href="#" style="width:100%">Checks' + ext + '</a></article>')) + '</main></div></div>',
      WGR06E: () => '<div class="cv" style="' + VARS + '"><div class="ph" style="min-height:844px;position:relative">' + pTop() + '<main class="pbd" style="gap:12px;filter:none">' + pHead() + pSum() + '</main><div class="wgr-scrim" aria-hidden="true"></div><section class="wgr-sheet" role="dialog" aria-label="Eadwyn"><span class="wgr-grab" aria-hidden="true"></span><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:8px;align-items:center"><span class="wgr-elogo">E</span><b>Eadwyn</b></span><button type="button" class="pi" aria-label="Close Eadwyn">✕</button></div><span class="eye">Proposed integration batch</span><b style="font-size:14px">Land the four colliding claims in this order</b><ol class="wgr-bl">' + J(BATCH.map((r, i) => '<li><span class="wgr-bi">' + (i + 1) + '</span><div><b>#[' + r[0] + ']</b> <span class="mu">via #[' + r[1] + ']</span></div></li>')) + '</ol><p class="foot">A proposal from the ' + SCAN + ' scan. Nothing is stored.</p><button type="button" class="btn" style="width:100%">Accept · copy to clipboard</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn">Edit</button><button type="button" class="btn">Discard</button></div></section></div></div>'
    };

    /* ---------- docs: spec + handoff ---------- */
    const doc = (id, t, sub, inner) => crop('<div class="wgr-dh"><span class="wgr-id">' + id + '</span><div><h1>' + t + '</h1><p>' + sub + '</p></div></div>' + inner, 1200);
    const dsec = (t, inner) => '<section class="wgr-ds"><h2 class="eye">' + t + '</h2>' + inner + '</section>';
    const ul = (a) => '<ul class="wgr-dl">' + J(a.map(x => '<li>' + x + '</li>')) + '</ul>';
    const DOCS = {
      WGR08: () => doc('WG-08', 'Spec · the four action rules', 'Each claim gets the highest rule any of its reasons reaches. Advice only: no rule blocks, labels or merges. ' + ENG('needs ingest route') + ' ' + ENG('Super Admin read route'),
        '<div class="wgr-rules">' + J([
          ['Serialize', 'One after the other. A critical path; a shared migration that alters, drops or renames; or an exclusive resource.', 'Exclusive resources: a migration file or stamp, ' + pth('cloudflare-worker/sql/') + ' (D1 schema), ' + pth('cloudflare-worker/src/contracts/') + ' (API contract) and a release pointer.'],
          ['Wait', 'Let the other land first. Overlapping hunks; a shared hub, manifest, API, baseline or generated path; or an open dependency.', 'Example: #[5607] waits on #[5609] (overlapping hunks) and on open #[5603].'],
          ['Coordinate', 'Talk before you merge. The same path with disjoint or unknown hunks; a predicted shared path from STATUS files; the same module; or a dependency whose state was not read.', 'Example: #[5612] and #[5609] predict [DeliveryFilters.jsx].'],
          ['Proceed', 'None of the above was found in what the scan read.', 'Proceed is not a guarantee: a claim with no recorded paths can only be checked against what was read.']].map(r => '<div>' + act(r[0]) + '<p><b>' + r[1] + '</b></p><p class="wgr-sm">' + r[2] + '</p></div>')) + '</div>'
        + dsec('Risk-class ladder (pairs)', '<div class="wgr-lad wgr-lad-h">' + J(Object.keys(RC).map((k, i) => '<div><span class="wgr-lv">' + (i + 1) + '</span>' + rc(k) + '</div>')) + '</div><p class="wgr-plain">A class is a risk signal, not a merge verdict. Textual conflict (Yes / No / Not checked) is a separate reading from git.</p>')
        + dsec('Freshness', ul(['Fresh: within 90 min of the scan (the job runs hourly at :31).', 'Stale: older than 90 min, shown with its time and age.', 'Unknown: the snapshot was not read. Nothing is drawn from it.']))
        + dsec('Backend required (◇)', ul([ENG('ingest') + ' A Worker route the hourly job posts the snapshot to, and a store for it. Today the snapshot is only a GitHub Actions artifact kept 30 days.', ENG('read') + ' A Super Admin read route, for example GET /api/admin/workgraph/in-flight. Every value on WG-01 to WG-07 waits on these two.', ENG('lease') + ' Reading the #5618 lease and fence.', ENG('override') + ' An owner override with audit.', ENG('owners') + ' Integration owners per cluster.', ENG('lifespan') + ' Estimated lifespan (claims record only a TTL).', ENG('review') + ' Review delay.', ENG('#5821') + ' workInFlight (claims, refused, notes, recommendations) lands with PR #5821, still open. Main writes schema v1 with pairs and evidence only.']))),
      WGR09: () => doc('WG-09', 'Handoff', 'What was checked on main 6d7712c6d1 (14 Nov 2026), what is reused, what is frontend-only, what needs engineering, and what the owner decides.',
        '<div class="wgr-hg">'
        + dsec('Checked on main', ul(['<b>.github/workflows/pr-overlap.yml</b>: cron 31 * * * *, runs scripts/pr-overlap.mjs and uploads pr-overlap-&lt;stamp&gt;.json as an artifact, retention 30 days. Read-only apart from its PR comment.', '<b>scripts/lib/prRisk.mjs</b>: snapshot schema studioos-pr-overlap-snapshot/v1; RISK = disjoint, unknown, overlapping, dependency, critical; merge, checks, queue and base age kept separate.', '<b>scripts/lib/prOverlap.mjs</b>: path classes (hub, migration, contract, schema, api, manifest, baseline, generated); shared migration stamps; landing order: drafts last, fewer changed files first.', '<b>scripts/pr-overlap.mjs</b>: partial on read caps and on any pair not checked; scan notes for duplicates, closed, vanished and moved heads.', '<b>No Worker route, no D1 table</b> for the snapshot. work_graph_revisions and work_graph_lease_events (#5581) do not hold it.', '<b>PR #5821</b> (open, 4f0a922): schema v2 with workInFlight; the canvas draws it as specified there.']))
        + dsec('Reused', ul(['Platform v2 HQ frame: sidebar, top bar, ink primary, emerald/neutral palette, freshness line, scope chip (PL01 to PL12).', 'Platform States chips: Not recorded, Unreadable, Refused, Stale, Partial (ST-00 to ST-14, D5129).', 'Eadwyn shared rail, collapsed unless asked or carrying a Serialize/Wait insight (#5130, PL12).']))
        + dsec('Frontend only', ul(['Route /admin/workgraph/in-flight with three tabs; breadcrumb Platform › Infrastructure.', 'Sort by expiry then issue (as the scan orders it); row and pair disclosures; module grouping.', 'All GitHub links open in a new tab; copy-to-clipboard for an accepted batch.', 'Phone cards with 44px targets; Eadwyn as a bottom sheet; dark tokens.']))
        + dsec('Requires engineering ◇', ul(['Ingest route + store + Super Admin read route (blocks the whole page).', '#5618 lease and fence read; owner override with audit; integration owners; estimated lifespan; review delay.', 'PR #5821 merged, so the snapshot carries workInFlight.']))
        + dsec('Pending the owner ⚑', ul([OWN('route') + ' A: own route /admin/workgraph/in-flight from Detailed consoles (drawn). B: /admin/platform/workgraph in the Platform strip.', OWN('layout') + ' A: three tabs (drawn). B: one long page.']))
        + dsec('Accessibility', ul(['Every action, class and state has a glyph and a word; colour never carries meaning alone.', 'Tables use th scope; disclosures use aria-expanded; banners use role status or alert.', 'Figures name the scan they count (“in the 14:31 UTC scan”).', 'Phone: 44px targets, no table wider than the screen.']))
        + '</div>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'WGR01') html = page(wg01(), { h: 2250, ead: eadBatch() });
    else if (B === 'WGR02') html = page(wg02(), { h: 1330, ead: eadCluster() });
    else if (B === 'WGR03') html = page(wg03(), { h: 1160 });
    else if (B === 'WGR04') html = page(wg04(), { h: 900 });
    else if (B === 'WGR07') html = page(wg01(), { h: 2250, ead: eadBatch() });
    else if (STATES[B]) html = STATES[B]();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(wg01(), { h: 2250, ead: eadBatch() });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
