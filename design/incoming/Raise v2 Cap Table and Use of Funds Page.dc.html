      sbox('Empty', st('Empty', 'None'), '<p style="font-size:13px"><b>No archived investors.</b></p><p class="raw">The chip reads Archived · 0, a measured zero.</p>'),
      sbox('Loading', '', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:10px">' + SK('100%') + SK('100%') + SK('80%') + '</div>'),
      sbox('Unavailable', st('Unavailable'), '<div class="chips"><button type="button" aria-checked="true">Archived · <span class="unr">count Unavailable</span></button></div>' + note('r', '✕', 'Archived investors could not be read.', 'No count is shown.', bt('Try again'))),
      sbox('Refused', st('Restricted', 'Refused'), '<p style="font-size:13px"><b>This pipeline belongs to another company.</b></p><button type="button" class="btn p" style="align-self:flex-start">Switch company</button>'),
      sbox('After Archive', '', '<div class="toast" role="status" style="position:static;transform:none;white-space:normal"><span class="ok" aria-hidden="true">✓</span><span>[Fund name] archived. In pipeline: <span class="mo">17</span>.</span><a href="#">Undo</a></div><p class="raw">Diligence 2 → 1 and the pipeline 18 → 17. Undo unarchives.</p>')
    ]), 1400);

    /* ---------- RA-32 · Use of funds link ---------- */
    const planHead = (state) => '<section class="cd rat-plan"><div><span class="eye">Plan scenario</span><h2>[Base plan] <span class="otag gov">Base</span></h2><span class="raw">Raise ' + MO('[$1.5m]') + ' USD · Recorded plan · saved [3 Nov]</span></div>'
      + '<div class="rat-pay"><span class="eye">Paid for by</span>' + (state === 'none'
        ? '<div class="rat-payv">' + st('Not recorded', 'Not linked') + '</div><span class="raw">Latest: [Seed · Scenario B] · shown unlinked</span>'
        : '<div class="rat-payv"><b>[Seed · Scenario B]</b>' + MOD + '</div><span class="raw">Seed · [$1.5m] at [$8m] pre · updated [12 Nov]</span>')
      + '</div><div class="rat-pact"><button type="button" class="btn bsm">' + (state === 'none' ? 'Link a scenario' : 'Change') + '</button>' + BE('Saving the link · #6085') + '</div></section>';
    const founders = () => '<section class="cd rax-modb"><div class="ch"><h2>Founders after the round ' + MOD + '</h2><a class="btn bsm" href="#">Open in Cap table</a></div><table class="tbl"><caption class="sr">Each founder’s modelled share before and after the Seed round in [Seed · Scenario B]</caption><thead><tr><th>Founder</th><th class="n">Before the round · Founding</th><th class="n">After [Seed]</th><th class="n">Change</th></tr></thead><tbody>'
      + J(FD.map(f => '<tr><td><b>' + f[0] + '</b></td><td class="n">' + f[1] + '</td><td class="n">' + f[2] + '</td><td class="n">' + f[3] + '</td></tr>')) + '<tr class="rat-tot"><td>Founders together</td><td class="n">72.0%</td><td class="n">61.2%</td><td class="n">−10.8 pts</td></tr></tbody></table>'
      + '<p class="foot">Modelled in [Seed · Scenario B], updated [12 Nov]. These are the scenario’s founders, not recorded holders, so no Recorded figure sits in this card. Open in Cap table goes to /raise/cap-table/scenarios/[sc_b41e].</p></section>';
    const uofLinked = () => mhead('Use of funds', 'Use of funds', 'What does this round buy us?', 'Set raise &amp; allocation', '', ['Home', 'Milestones', 'Hires', 'Plan vs actual', 'Scenarios'], 'Home')
      + planHead('linked') + founders()
      + kfig([['Raise amount', '[$1.5m]', 'Recorded plan'], ['Target runway', '[24 months]', 'Modelled'], ['Current runway', '[11 months]', 'Recorded · Mercury · 1 Nov'], ['Committed', '[$650k]', 'Capital relationships · confirmed']])
      + '<section class="cd"><div class="ch"><h2>What the raise buys</h2></div>' + J(ALLOC.map(a => '<div class="rax-al"><span>' + a[0] + '</span><span class="bar"><i style="width:' + a[1] + '%"></i></span><b>' + a[1] + '%</b><span class="mo">' + a[2] + '</span></div>')) + '<p class="foot">Total [$1.5m] · 100%</p></section>';
    const uofRail = () => railX('<p style="font-size:12.5px;color:var(--mu)">' + CTX.uof[0] + '</p><span class="eye">Suggested here</span><div class="prm">' + J(['Which round pays for this plan?', 'Explain what founders give up', 'Check the plan against runway'].map(t => '<button type="button">' + t + '</button>')) + '</div>'
      + '<div style="border-top:1px solid var(--hair);padding-top:10px"><span class="eye">Related</span><ul class="rax-rel">' + rel('Cap table', '[Seed · Scenario B] · linked', TAG('Modelled', 'mod')) + rel('Pitch Ask', 'slide 12', st('Stale', 'Out of sync')) + '</ul></div>');
    const picker = () => cropX('<section class="cd rat-dlg" role="dialog" aria-modal="true" aria-labelledby="pkh" style="gap:12px"><div class="ch"><h2 id="pkh">Which round pays for [Base plan]?</h2><button type="button" class="ib" aria-label="Close">✕</button></div><p class="raw" style="margin-top:-6px">Plan raise ' + MO('[$1.5m]') + ' USD. Cap-table scenarios are Modelled.</p>'
      + '<div class="rat-sug"><span class="rat-e" aria-hidden="true">E</span><span><b>Eadwyn suggests [Seed · Scenario B].</b> Its investment, [$1.5m], matches the plan’s raise.</span><span class="rat-pa">' + bt('Pick it') + bt('Ignore') + '</span></div>'
      + '<ul class="rat-pk">' + J(SCN.map((s, i) => '<li' + (i === 1 ? ' class="on"' : '') + '><span class="rat-rd" aria-hidden="true"></span><span><b>' + s[0] + '</b><small>Seed · ' + s[1] + ' · updated ' + s[3] + '</small></span><span class="rat-pkr"><span class="mo">' + s[2] + '</span>' + MOD + (s[4] ? RD : '') + '</span></li>')) + '</ul>'
      + '<p class="foot">Raise differs: [Seed · Scenario A] invests [$2m]; the plan raises [$1.5m]. Linking changes neither scenario nor the plan.</p><div class="rat-acts"><span style="margin-right:auto">' + BE('Saving the link · #6085') + '</span><button type="button" class="btn">Cancel</button><button type="button" class="btn p">Link scenario</button></div></section>', 760);

    /* ---------- RA-33 · link states ---------- */
    const linkStates = () => cropX('<span class="eye">RA-33 · link and Founders-after-the-round states</span>' + grid(4, [
      sbox('Not linked · today’s default', st('Not recorded', 'Not linked'), '<p style="font-size:13px">No cap-table scenario is linked. The latest scenario is shown, unlinked.</p><p class="raw">Latest: [Seed · Scenario B] · updated [12 Nov]</p><button type="button" class="btn p" style="align-self:flex-start">Link a scenario</button>'),
      sbox('Empty · no scenarios', st('Empty', 'None'), '<p style="font-size:13px"><b>No cap-table scenarios yet.</b> Model a round to see what founders keep.</p><button type="button" class="btn p" style="align-self:flex-start">Model a round in Cap table</button>'),
      sbox('The linked scenario was deleted', st('Needs attention', 'Link broken'), note('a', '!', 'The linked scenario no longer exists.', 'Founders after the round is hidden until you pick another.') + '<button type="button" class="btn p" style="align-self:flex-start">Pick another</button>'),
      sbox('Founders · Not recorded', st('Not recorded'), '<p style="font-size:13px"><b>Founders after the round</b></p>' + NREC + '<p class="raw">[Seed · Scenario C] has no founders, so there is nothing to compare. Not 0%.</p>'),
      sbox('Founders · Unavailable', st('Unavailable'), note('r', '✕', 'The scenario’s result couldn’t be read.', 'The plan still works. Founders after the round is not shown.', bt('Try again'))),
      sbox('Raise differs', RD, '<dl class="kv2" style="grid-template-columns:150px minmax(0,1fr)"><dt>Plan raise ' + REC + '</dt><dd class="mo">[$1.5m]</dd><dt>Scenario A ' + MOD + '</dt><dd class="mo">[$2m]</dd></dl><p class="raw">Both amounts are named, each with its tag (UF13d).</p>'),
      sbox('Loading', '', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:10px">' + SK('45%') + SK('100%') + SK('100%') + '</div>'),
      sbox('Refused', st('Restricted', 'Refused'), '<p style="font-size:13px"><b>Use of funds is available to the venture founder or an admin.</b></p><p class="raw">Nothing renders below it.</p>')
    ]), 1400);

    /* ---------- RA-34 · phone ---------- */
    const pSheet = (title, body, foot, over) => '<div class="cv' + (dark ? ' rat-dark' : '') + '" style="' + VARS + ';width:390px;height:844px"><div class="ph rat-pp" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Close">✕</button><b style="font-size:15px">' + title + '</b><span style="width:44px"></span></div><div class="rat-pbd">' + body + '</div>' + (foot ? '<div class="rat-pft">' + foot + '</div>' : '') + (over || '') + '</div></div>';
    const pbtn = (t, p) => '<button type="button" class="btn' + (p ? ' p' : '') + '" style="min-height:44px;width:100%">' + t + '</button>';
    const MOB2 = {
      RAT34A: () => pSheet('Record a grant', SRC('Typed') + fld('Holder', sel(GR.holder), {}) + fld('From pool', sel(POOL + ' · ' + MO('[968,000]') + ' left')) + '<div class="rat-g2">' + fld('Options', inp(MO(GR.opts))) + fld('Granted on', inp(MO(GR.on))) + '</div>'
        + '<div class="rat-f">' + lab('Vesting') + '<span>' + BE('#6086') + '</span></div><div class="rat-seg ph3" role="radiogroup" aria-label="Vesting preset">' + J(['4 years, 1-year cliff', '4 years, no cliff', 'Custom'].map((t, i) => '<button type="button" role="radio" aria-checked="' + (i === 0) + '">' + t + '</button>')) + '</div>'
        + '<div class="rat-g3">' + fld('Start', inp(MO('[1 Mar 2026]'))) + fld('Months', inp(MO('48'))) + fld('Cliff', inp(MO('12'))) + '</div><div class="rat-prev">' + MOD + '<span><b class="mo">[25%]</b> on <span class="mo">[1 Mar 2027]</span>, then monthly to <span class="mo">[1 Mar 2030]</span></span></div>' + fld('Document', sel(GR.doc)),
        '<div class="rat-room"><small>Pool room after this grant</small><b class="mo">[928,000]</b></div>' + pbtn('Record grant', true)),
      RAT34B: () => pSheet('[Fund name]', '<span class="eye">Facts · editing</span>' + rrow('Investor', '[Fund name] · linked fund') + fld('Email', inp('[d.chen@fundname.example]', 'chg')) + fld('Firm ' + BE('#6087'), inp(PH('Not recorded'))) + fld('Check size ' + BE('#6087'), '<div class="rat-g2b">' + inp(MO('[250,000]'), 'chg') + sel('USD') + '</div>', { after: HELP('Your figure. Never added to Committed.') }) + rrow('Stage', 'Diligence') + rrow('Next step', 'Due ' + MO('[15 Nov]'))
        + '<div class="rat-pdz"><button type="button" class="btn" style="min-height:44px;width:100%">Archive investor</button>' + BE('#6087') + '</div>', '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + pbtn('Cancel') + pbtn('Save investor', true) + '</div>'),
      RAT34C: () => pSheet('[Fund name]', rrow('Investor', '[Fund name] · linked fund') + rrow('Stage', 'Diligence'), '', '<div class="dim2"></div><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="pah"><div class="grab" aria-hidden="true"></div><div style="padding:12px 18px 24px;display:flex;flex-direction:column;gap:12px"><h2 id="pah" style="font-size:17px;font-weight:800">Archive [Fund name]?</h2><p style="font-size:13.5px;line-height:1.5">They leave the pipeline, stages and counts. Their activity, links and commitments are kept. You can unarchive them.</p>' + pbtn('Archive') + pbtn('Cancel') + '<p class="foot">Mark passed stays in the stage menu. ' + BE('#6087') + '</p></div></div>'),
      RAT34D: () => pSheet('Use of funds', '<span class="eye">[Base plan] · Base · raise <span class="mo">[$1.5m]</span></span><button type="button" class="disc" style="min-height:58px"><b>Paid for by</b><span style="display:flex;gap:6px;align-items:center">[Seed · Scenario B] ' + MOD + '</span><i aria-hidden="true">›</i></button>'
        + '<div class="ch"><h2 style="font-size:15px">Founders after the round</h2>' + MOD + '</div>' + J(FD.map(f => '<div class="mc rat-fc"><b>' + f[0] + '</b><dl><dt>Before</dt><dd class="mo">' + f[1] + '</dd><dt>After [Seed]</dt><dd class="mo">' + f[2] + '</dd><dt>Change</dt><dd class="mo">' + f[3] + '</dd></dl></div>'))
        + '<div class="mc rat-fc"><b>Founders together</b><dl><dt>Before</dt><dd class="mo">72.0%</dd><dt>After [Seed]</dt><dd class="mo">61.2%</dd><dt>Change</dt><dd class="mo">−10.8 pts</dd></dl></div><p class="foot">Modelled in [Seed · Scenario B], updated [12 Nov].</p>' + pbtn('Open in Cap table')),
      RAT34E: () => pSheet('Use of funds', '<button type="button" class="disc"><b>Paid for by</b><span>[Seed · Scenario B]</span><i aria-hidden="true">›</i></button>', '', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pkp"><div class="grab" aria-hidden="true"></div><div style="padding:12px 16px 22px;display:flex;flex-direction:column;gap:10px"><h2 id="pkp" style="font-size:17px;font-weight:800">Which round pays for it?</h2><p class="raw">Plan raise [$1.5m]</p><div class="rat-sug"><span class="rat-e" aria-hidden="true">E</span><span>Scenario B matches the plan’s raise.</span></div><ul class="rat-pk rat-pkm">'
        + J(SCN.map((s, i) => '<li' + (i === 1 ? ' class="on"' : '') + '><span class="rat-rd" aria-hidden="true"></span><span><b>' + s[0] + '</b><small><span class="mo">' + s[2] + '</span> · updated ' + s[3] + '</small>' + (s[4] ? RD : '') + '</span></li>')) + '</ul>' + pbtn('Link scenario', true) + '<p class="foot">' + BE('#6085') + '</p></div></div>')
    };

    /* ---------- RA-36 · handoff ---------- */
    const handoff = () => dk('<h1>Handoff · RA-27 to RA-35 (#6088)</h1><p>An addendum to Raise v2. It continues RA-20 (Cap table), RA-21 (Use of funds) and RA-22 (Capital relationships) and redraws none of them: the Grants table, the “Raise differs” line (UF13d) and the “Without the raise” series stay as drawn. Checked against main 6d7712c6d1 on Sat 14 Nov 2026.</p>'
      + '<h2>Checked on main</h2>' + tbl(['File', 'What it shows'], [
        ['<code>services/capTableRecord.ts</code>', 'A grant from a non-pool class is refused (“A grant is made from an option pool.”); a missing field is <code>incomplete</code> (“This issuance is missing what the record needs.”); an admin write without a reason is <code>reason_required</code>; an over-granted pool saves and Fully diluted reads Unavailable (<code>pool_overgranted</code>).'],
        ['<code>routes/captable.ts</code>', 'Issuances, proposals, accept and dismiss under <code>/api/captable/record/:projectId</code>; a co-founder pressing Record gets “A co-founder proposes; only the venture’s owner records it.”'],
        ['<code>services/capTableDocumentRead.ts</code>', 'Holder, instrument type and date signed, each with its page; “Not found in the document”; money and share fields return the page only.'],
        ['<code>services/capTableWrites.ts</code>', '<code>cleanVesting</code> runs only when a holder is added; <code>cap_table_vesting</code> has no issuance link.'],
        ['<code>services/raiseWriters.ts</code>', '<code>updateProspect</code> takes name, email (409 “This project already tracks a prospect with that email”), stage, notes and a linked fund; no firm, no check size, no archive.'],
        ['<code>services/useOfFunds/read.ts</code>', 'The plan reads the latest cap-table scenario with <code>link_state: \'not_recorded\'</code>; no link column exists.'],
        ['<code>services/captable.ts</code>', '<code>result_json.founder_dilution[].series[]</code> gives each founder’s % per round, Founding first (Modelled).']])
      + '<h2>Requires engineering (◇)</h2>' + tbl(['Issue', 'What the boards need'], [['#6086', 'A vesting schedule saved with a grant issuance (an issuance link on <code>cap_table_vesting</code>, or vesting accepted by <code>recordIssuance</code> and the proposal); Eadwyn drafting the pool and vesting from a grant letter; the refusal at save if Q2 goes to B.'], ['#6087', 'Firm on the cycle prospect writer; a check-size field (amount and currency) on <code>raise_prospects</code>; Archive, Unarchive and the Archived filter; Eadwyn proposing an email or firm from a logged note.'], ['#6085', 'A stored link from a <code>uof_scenarios</code> row to a <code>cap_table_scenarios.uid</code>, with the deleted-link state.']])
      + '<h2>Pending the owner (⚑, option A drawn)</h2>' + tbl(['Question', 'Drawn'], [['Q1 · Where vesting lives', 'A · on the grant, one schedule per grant'], ['Q2 · A grant over its pool', 'A · warn before saving, as the record allows it today'], ['Q3 · Archive next to Mark passed', 'A · a separate, reversible filing action that keeps history'], ['Q4 · Check size', 'A · founder-typed, tagged Founder figure, never added to Committed']])
      + '<h2>Frontend only</h2><p>The Record a grant sheet and its presets and preview; the proposal review page at /raise/cap-table/proposal/:proposal; the pool-room line; the investor sheet edit mode with unchanged fields in read style; the overflow menu; “Paid for by” and Founders after the round (both read today’s data unlinked); phone sheets; dark tokens. No new routes.</p>'
      + '<h2>Handoffs</h2><p>A recorded grant returns to RA-20’s Grants table with the new row highlighted (RA-27 D). An archived investor leaves the pipeline count with a toast and Undo (RA-31 D). Open in Cap table opens /raise/cap-table/scenarios/:scenario.</p>'
      + '<h2>Accessibility</h2><p>The sheets are dialogs with labelled headings and focus kept inside; vesting presets are a radio group; errors use role=alert and sit under their field; every state carries a word and a glyph (Recorded solid ink, Modelled dashed violet hatch, Not recorded italic dash, Unavailable crossed box, Refused lock); phone targets are 44px; the founders table has a caption and stacks into cards at 390.</p>'
      + '<h2>Open questions</h2><p>Whether a dismissed proposal can be reopened by its proposer; whether Unarchive should restore the next step and its due date as they were.</p>');

    let html;
    if (B === 'RAT27' || B === 'RAT35') html = pageX(captable(), { h: 1000, cur: 'Cap table', overlay: gSheet({}) });
    else if (B === 'RAT27B') html = pageX(captable(), { h: 1040, cur: 'Cap table', overlay: gSheet({ draft: true, right: 330, w: 560 }) }, readRail());
    else if (B === 'RAT27C') html = gStates27();
    else if (B === 'RAT27D') html = grantsDone();
    else if (B === 'RAT28') html = pageX(captable(), { h: 1000, cur: 'Cap table', overlay: gSheet({ role: 'cof', blank: true }) });
    else if (B === 'RAT28B') html = pageX(proposalPage(), { h: 960, cur: 'Cap table' });
    else if (B === 'RAT28C') html = proposalStates();
    else if (B === 'RAT29') html = gStatesA();
    else if (B === 'RAT29B') html = gStatesB();
    else if (B === 'RAT30') html = pageX(caprel('full'), { h: 1000, cur: 'Capital relationships', overlay: invEdit() });
    else if (B === 'RAT30B') html = invStates();
    else if (B === 'RAT31') html = pageX(caprel('full'), { h: 900, cur: 'Capital relationships', overlay: invMenu() });
    else if (B === 'RAT31B') html = archConfirm();
    else if (B === 'RAT31C') html = pageX(archList(), { h: 760, cur: 'Capital relationships' });
    else if (B === 'RAT31D') html = archStates();
    else if (B === 'RAT32' || B === 'RAT35B') html = pageX(uofLinked(), { h: 1060, cur: 'Use of funds' }, uofRail());
    else if (B === 'RAT32B') html = picker();
    else if (B === 'RAT33') html = linkStates();
    else if (MOB2[B]) html = MOB2[B]();
    else if (B === 'RAT36') html = handoff();
    else html = pageX(captable(), { h: 1000, cur: 'Cap table', overlay: gSheet({}) });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
