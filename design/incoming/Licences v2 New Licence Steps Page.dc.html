    const pgrp = (t, sum, open, rows) => '<div class="lns-pg' + (open ? ' open' : '') + '"><button type="button" aria-expanded="' + !!open + '"><b>' + t + '</b><span>' + sum + '</span><i aria-hidden="true">' + (open ? '▴' : '▾') + '</i></button>' + (open ? '<dl class="lns-dl">' + J(rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>')) + '</dl><a href="#" class="lns-edit">Edit legal entity</a>' : '') + '</div>';
    const ph6 = () => phone(5, '<h2 class="lns-ph2">Review and issue</h2>'
      + pgrp('1 Legal entity', ENT + ' · White-label', true, [['Reference', '<span class="mo">' + REF + '</span>'], ['Address', '[Bahnhofstrasse 1, 8001 Zürich]'], ['Signatory title', NREC], ['Brand kit', SW('#0F766E') + ' ' + SW('#B45309')]])
      + pgrp('2 Territory', 'Switzerland') + pgrp('3 Commercial terms', '24 seats · EUR 120,000 / yr') + pgrp('4 Administrators', '1 · Principal') + pgrp('5 Agreement', 'v3 draft · not sent')
      + '<div class="lns-q4 lns-q4p"><section><h3>1 · What will happen</h3><p><b class="mo">' + REF + '</b> becomes Active for Switzerland; its studio can use <b class="mo">24</b> seats.</p></section><section><h3>4 · Can this be undone?</h3><p>No. It can be suspended or terminated.</p></section></div>'
      + '<div class="lns-blk ok"><p><b>✓ Nothing blocks issuing.</b></p></div>', pbtn('Issue licence'));
    const phSteps = () => phone(2, '<p class="foot">Commercial terms</p>', '', { overlay: '<div class="dim1" style="opacity:1"></div><div class="lns-psheet" role="dialog" aria-modal="true" aria-labelledby="pss"><div class="lns-grab" aria-hidden="true"></div><h2 id="pss">Steps</h2>' + vlist(2) + '<p class="foot">Saved steps show ✓. Opening another step keeps what you typed on this one.</p><button type="button" class="btn" style="min-height:44px">Close</button></div>' });
    const phVerify = () => phone(2, '', '', { overlay: '<div class="lns-pfull" role="dialog" aria-modal="true" aria-labelledby="pvf"><div class="pt"><button type="button" class="pi" aria-label="Cancel">✕</button><b id="pvf" style="font-size:15px">Confirm with your authenticator</b><span style="width:44px"></span></div><div class="pbd" style="flex:1"><p style="font-size:14px;line-height:1.5">Saving the money terms of <b class="mo">' + REF + '</b> needs a fresh code.</p><dl class="kv2" style="grid-template-columns:96px minmax(0,1fr)"><dt>Saving</dt><dd>Fee, currency, shares, term and dates</dd><dt>Reason</dt><dd>Terms recorded at issue</dd></dl><div class="lns-f"><label>6-digit code</label>' + code({ n: 3 }) + '</div><p class="foot">Cancel keeps every value on the step.</p></div><div class="lns-pin"><button type="button" class="btn">Cancel</button>' + pbtn('Verify and save', true) + '</div></div>' });

    /* ================= handoff ================= */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk lns-hd">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>New licence steps · handoff</h1><p>Checked against main <code>6d7712c6d1</code> (14 Nov 2026); the brief was checked on <code>45e7c55fa6</code> and nothing it relies on moved. Every value on L41 to L49 has a Worker route today. <b>Backend required: none.</b> The flow itself is frontend work: today <code>AdminLicences.jsx</code> creates the draft with one inline form (reference, legal name, brand name, kind) and the later steps live as editors on the licence page (<code>TerritoryEditor</code>, <code>CommercialTerms</code>, <code>AdminsEditor</code>, <code>ContractStep</code>, <code>BrandKitEditor</code>).</p>'
      + '<h2>Step by step</h2>' + tbl(['Step', 'Route on main', 'Write bar', 'Frontend work'], [
        ['1 Legal entity', '<code>POST /api/admin/licences</code> (ref ≤ 40, upper-cased; 409 “&lt;REF&gt; is already in use”; kind subsidiary | white_label) · <code>PATCH /:uid/entity</code> (no ref, no kind; “&lt;field&gt; cannot be blank”)', 'Super Admin', 'Send address and signatory on create (the inline form omits them); read-only ref and kind after create'],
        ['1 Brand kit', '<code>PUT /:uid/brand</code> (both hex; 400 invalid_colours; 503 brand_kit_unreadable)', 'TOTP + step-up', 'Block shown for white-label once the draft exists'],
        ['2 Territory', '<code>PUT /:uid/territories</code> (L21, unchanged)', 'Super Admin', '—'],
        ['3 Seats', '<code>PUT /:uid/seats</code> (“&lt;type&gt; seats cannot be negative”)', 'Super Admin, no code', 'Saved first on Save terms and continue'],
        ['3 Money terms', '<code>PATCH /:uid/terms</code> (reason, <code>expected_revision</code>; 400 <code>errors[]</code>; 409 terms_conflict with who changed them)', 'TOTP + step-up + reason', 'Percent ↔ basis points; renewal proposal accept / edit / discard'],
        ['4 Administrators', '<code>GET</code> / <code>POST /:uid/admins</code> (reason ≥ 10; 404, 409 already administers, 409 licence_cannot_administer)', 'TOTP + step-up', 'Appoint makes the account an admin; optional for issuing'],
        ['5 Agreement', '<code>GET /:uid/contract</code> (templates, contracts without body, <code>templates_reason</code>, <code>contracts_available</code>) · <code>POST /:uid/contract</code> (body_md, 409 template_restricted / template_has_no_body / contract_conflict)', 'Super Admin', 'Text preview only right after Generate (GET returns no body)'],
        ['6 Issue', '<code>GET /:uid/activation</code> (blockers, can_activate, note) · <code>POST /:uid/activate</code> (409 blocked + blockers, bad_transition, licence_changed; answers <code>pushed</code>)', 'Super Admin; no reason', 'Review groups, four questions, blockers linked to steps, outcome banner on Overview']])
      + '<h2>Preserved from Licences v2</h2><p>L21’s step frame (header, 240px step list, one card, Back and Continue at the bottom right), L17’s four questions, L18’s outcome cards, L19’s None / Not recorded / Unavailable, the HQ shell and the Eadwyn rail. The handoff after Issue is L03 (Overview) with a banner; Send for signature waits on L10; administrators not appointed are appointed on L11.</p>'
      + '<h2>Notes for the build</h2><ul class="lns-ul"><li>Step 3 is two writes. Seats (no code) save first, then the money terms (code + reason). If the second fails, say “Seats were saved. The money terms were not.” (L46).</li><li>The branch copy after Issue is read from <code>pushed</code>. A failed push is retried by the schedule (<code>retryPendingLicencePushes</code>); there is no manual retry route, so the partial card links to Operations · deployment and offers no Retry.</li><li>Not drawn, because nothing produces them: an “Administrator missing” flag on the ledger and an administrator item in Needs HQ.</li><li>Accessibility: the step list is an ordered list with <code>aria-current="step"</code>; each error is tied to its field with <code>aria-describedby</code> and focus moves to the first; the verification sheet traps focus and returns it to Save; status always has a word and a glyph; brand colours always show their hex; phone targets are 44px and the primary action is pinned.</li></ul>'
      + '<h2>Pending the owner (⚑, option A drawn)</h2>' + tbl(['Question', 'Drawn'], [['Q1 When does the draft enter the ledger?', 'A · on Create draft and continue; leaving keeps it as Draft'], ['Q2 Does Agreement send for signature?', 'A · no; issuing never waits for a signature'], ['Q3 Should Issue ask for a reason?', 'A · no; History records who and when'], ['Q4 Where are brand kit colours set?', 'A · a Brand kit block on step 1 for a white-label once the draft exists']])
      + '<h2>Open</h2><p>#5955 (invoices, also under #4819) was briefed with the same board ids, L41 to L49, and the same part file, <code>D4819-p1.md</code>. One of the two needs renumbering before either lands.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'LNS41') html = flow(0, s1New(), { fresh: true, done: [], h: 980 });
    else if (B === 'LNS41B') html = flow(0, s1Draft(), { done: [], saved: '10:14', h: 1030 });
    else if (B === 'LNS42') html = flow(2, s3(), { saved: '10:22', h: 1020, rail: eadRenew });
    else if (B === 'LNS43') html = flow(3, s4(), { saved: '10:27', h: 860 });
    else if (B === 'LNS44') html = flow(4, s5(), { saved: '10:31', h: 1140, rail: eadPlace });
    else if (B === 'LNS44B') html = crop('<span class="eye">Coming back to step 5 later · the saved contract, without its text</span>' + docCard({ noText: true }), 900);
    else if (B === 'LNS44C') html = crop('<span class="eye">Before generating</span>' + picker() + '<div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn">Generate draft</button><span class="foot">Creates the draft contract from the chosen template at its current version. Nothing is sent.</span></div>' + sigLine, 900);
    else if (B === 'LNS45') html = flow(5, s6(), { saved: '10:40', h: 1770, rail: eadSum });
    else if (B === 'LNS45B') html = crop('<span class="eye">Blocked · the platform’s own list, each linked to its step</span>' + blockers({ blocked: true }) + '<div class="lns-ft"><p class="lns-fn">Issue licence is off: 2 things block issuing.</p><div class="lns-fb"><button type="button" class="btn">Back</button><button type="button" class="btn p" aria-disabled="true">Issue licence</button></div></div>', 1000);
    else if (B === 'LNS46A') html = statesEmpty();
    else if (B === 'LNS46B') html = statesErr(false);
    else if (B === 'LNS46C') html = statesNrec();
    else if (B === 'LNS46D') html = statesUnr(false);
    else if (B === 'LNS46E') html = statesRef(false);
    else if (B === 'LNS46F') html = flow(2, s3({ renFilled: true }), { saved: '10:22', h: 1000, overlay: verifySheet() });
    else if (B === 'LNS46G') html = statesConflict();
    else if (B === 'LNS46H') html = statesGen();
    else if (B === 'LNS46I') html = statesSave();
    else if (B === 'LNS47') html = flow(5, s6({ blocked: true, refused: true, noKit: true, noRen: true, cols: 2 }), { saved: '10:40', h: 1380 });
    else if (B === 'LNS47B') html = refusals();
    else if (B === 'LNS47C') html = outcomes(false);
    else if (B === 'LNS47D') html = overview();
    else if (B === 'LNS47E') html = flow(3, s4(), { saved: '10:27', h: 860, overlay: leave() });
    else if (B === 'LNS48A') html = ph1();
    else if (B === 'LNS48B') html = ph3();
    else if (B === 'LNS48C') html = ph6();
    else if (B === 'LNS48D') html = phSteps();
    else if (B === 'LNS48E') html = phVerify();
    else if (B === 'LNS49') html = flow(5, s6({ cols: 2 }), { saved: '10:40', h: 1330, dark: true });
    else if (B === 'LNS49B') html = statesErr(true);
    else if (B === 'LNS49C') html = statesUnr(true);
    else if (B === 'LNS49D') html = statesRef(true);
    else if (B === 'LNSHO') html = handoff();
    else html = flow(0, s1New(), { fresh: true, done: [], h: 980 });
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
