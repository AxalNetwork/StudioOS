      <li>Each section reads and retries on its own: ties (<code>/partnernet/relationships</code>), requests (<code>/relationships/requests</code>), referrals (<code>/refer-earn/submissions</code>). One failure never empties another.</li>
      <li>A failed save keeps the edit in the field. A failed remove keeps the dialog open with the tie unchanged.</li>
      <li>A 409 on remove or accept refreshes the list and says what changed.</li></ul>
      <h3 style="margin-top:12px">Words, not colour</h3><ul>
      <li>● Accepted tie, ◷ Request, ↗ Referral, ? Could not be read, ⊘ Read-only, ▽ Going cold: each a glyph plus a word.</li>
      <li>Loading never shows 0; a read 0 says “read just now”. Empty and filtered empty use different words.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NRHH') html = `<div class="${CV} doc"><div><span class="eye">Network · Relationships · #7057 · handoff</span><h2 style="font-size:22px;margin-top:4px">HQ and advisor Relationships: what was checked, what ships as frontend, what needs the backend</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>App.jsx</code>: <code>networkRole</code> is <code>researchRole</code>, which maps <code>admin</code> to <code>founder</code>; <code>/network/relationships</code> renders <code>NetworkWorkspace role={networkRole}</code>. Ordinary HQ gets the founder body, with editing controls.</li>
      <li><code>lib/activeRole.js</code>: an admin’s “View as” sets the role to <code>viewMode</code>; requests still carry the admin session and HQ’s own book.</li>
      <li><code>NetworkWorkspace.jsx</code>: on Relationships every role mounts <code>RelationshipRequests</code> (Accept, Decline, Withdraw, Remove), the book and <code>SharingCard</code>; no read-only mode is passed to any of them.</li>
      <li><code>advisor/network/RelationshipsZone.jsx</code>: ties and referrals read with <code>allSettled</code>, but a failed ties read throws and blanks the referrals; a failed referrals read has no Retry. The empty text says adding a row puts it in the other book “without asking them”, which D493 changed. Strength (0–100) is editable. The comment says there is no last touch; <code>GET /partnernet/relationships</code> now returns <code>last_interaction_at</code>.</li>
      <li><code>components/RelationshipRequests.jsx</code> and <code>routes/partnernet.ts</code>: a request becomes a tie only when the named person accepts; Withdraw for the requester; Remove for either party (accepted only, 409 otherwise); a failed ties read is 503 <code>relationships_unreadable</code>. Admin non-parties pass PATCH, touches and reminders with a logged bypass.</li>
      <li><code>services/referralSubmissions.ts</code>: referral statuses and labels; <code>referred_name</code> is free text with no account id.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>The #4799 / #6256 shell, header, four links, Sheet, tables and state words; NWI11 HQ figures (54 ties, 9 going cold, 2 due, 310 contacts). New ids: NW11.1–NW11.5 for HQ, NW13–NW13.8 for the advisor, tablet, phone and dark; keys carry NRH.</li></ul></div>
      <div><h3>Backend required (◇ #7057)</h3><ul><li>Carry the viewing mode (ordinary HQ read-only, role preview, member) into every mounted component, and have the server refuse HQ writes in read-only mode.</li><li>Decide and validate what a role preview may read and write: the server sees an admin, not the previewed role.</li><li>A person picker and consent step to send a tie request (<code>POST /relationships</code> has no caller).</li><li>Confirm what <code>/reminders</code> lists after a tie is removed.</li><li>Confirm downstream refresh of ties and referrals independently after remove and type change.</li></ul>
      <h3 style="margin-top:12px">Owner picks drawn (⚑)</h3><ul><li>Q1 A: no strength score for advisors (as the approved canvas).</li><li>Q2 A: a role preview is read-only.</li><li>Q3 A: HQ does not answer tie requests in the read-only view; they wait.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul><li>HQ read-only body with “whose book”, search, Person Sheet and return to results; the three advisor sections with their own reads, retries and words; Remove review; last touch from <code>last_interaction_at</code>; corrected empty copy; phone, tablet and dark.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Where HQ answers its own requests if not here (Q3).</li><li>Whether advisors keep a type picker in the list or only in the Sheet.</li></ul></div></div></div>`;

    /* shared classes get the nwi- prefix (from nwi_extra.css); this canvas's own classes already carry nrh- */
    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => x.indexOf('nrh-') === 0 ? x : 'nwi-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}
