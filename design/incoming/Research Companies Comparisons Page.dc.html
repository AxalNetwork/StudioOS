      + '<div class="crumb">Research / My Research / <b>' + PROJ + '</b></div><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em">' + PROJ + '</h1><nav class="ptab" aria-label="Project"><a href="#">Overview</a><a href="#">Evidence</a><a href="#" aria-current="page">Comparisons<span>2</span></a><a href="#">Brief</a></nav>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:14.5px;line-height:1.3">' + TITLE6 + '</h2></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="seg" role="radiogroup" aria-label="Layout"><button type="button" role="radio" aria-checked="true">Table</button><button type="button" role="radio" aria-checked="false">By attribute</button></div><div class="rcc-colpg"><span class="raw">Companies 1–3 of 6</span><button type="button" class="btn bsm" disabled aria-label="Previous companies">‹</button><button type="button" class="btn bsm" aria-label="Next companies: Quarry AI, Orchard Data, Tidewater Systems">›</button></div></div>'
      + '<table class="rcc-cmp tab"><thead><tr><th scope="col"><span class="eye">Attribute</span></th>' + J(SIX.slice(0, 3).map(k => '<th scope="col"><a href="#">' + nm(k) + '</a></th>')) + '</tr></thead><tbody>' + J(ATTR.map((a, i) => '<tr><th scope="row">' + a + '</th>' + J(SIX.slice(0, 3).map(k => '<td>' + cellH(CELLS[k][i], true) + '</td>')) + '</tr>')) + '</tbody></table><p class="raw">The attribute column stays; three companies at a time, never a half-visible column. Arrow buttons are 44px.</p></section></div></div>';

    /* ---------- docs ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const flow = (steps) => '<ol class="rcc-flow">' + J(steps.map((s, i) => '<li><span class="mo">' + s[0] + '</span><b>' + s[1] + '</b><small>' + s[2] + '</small></li>')) + '</ol>';
    const DOCS = {
      RCC00: () => dk('<h1>RS-15 · Select, compare, save and read</h1><p style="margin-top:6px">Continues Research v2 (RS-02 D Comparisons, RS-04 A Companies with selection, RS-10 phone). Add to research and Compare stay two actions with two limits. Each frame below is a named board; the prototype links run left to right.</p>'
        + '<h2>Linked prototype</h2>' + flow([['RCC01', 'Directory · 2 selected', 'Tick → bar appears; Compare 2 enabled'], ['RCC01B', '6 selected across pages', 'Review lists page 2 and 3 picks'], ['RCC02', 'Compare sheet', 'Project, order, generated title'], ['RCC03', 'Saving → outcome', 'Saved, rolled back, refused or unknown'], ['RCC03B', 'Check save status', 'Read-only reconciliation'], ['RCC04', 'Comparison · table', 'Open the comparison → lands here']])
        + flow([['RCC01C', '7th selection', 'Compare disabled with the reason; Add to research still works'], ['RCC01E', 'Review selection', 'Remove one → back to 6'], ['RCC10A', 'Phone · selection bar', 'Review / Compare'], ['RCC10C', 'Phone · unknown outcome', 'Check save status'], ['RCC10D', 'Phone · by attribute', '‹ › steps attributes']])
        + '<h2>Selection rules</h2>' + tbl(['Selected', 'Add to research', 'Compare'], [['0', 'Row button only; no bar', 'Not offered; a hint says 2 to 6'], ['1', 'Enabled', 'Disabled: “Select 2 to 6 to compare”'], ['2–5', 'Enabled', 'Compare N'], ['6', 'Enabled', 'Compare 6 · “At the comparison limit”'], ['7–25', 'Enabled (Worker takes up to 25)', 'Disabled before any sheet opens: “Remove N to compare”'], ['26+', 'Disabled: “Add to research takes up to 25”', 'Disabled']])
        + '<h2>Copy that changes with certainty</h2>' + tbl(['Answer from the Worker', 'Words', 'Actions'], [['201 with the comparison', 'Comparison saved; names the project and the comparison', 'Open the comparison → · Done'], ['400 / 404 / 409 refusal (checked before any write)', 'Refused before saving — nothing was added', 'Review selection'], ['Confirmed rollback ' + BE('', 'all-or-nothing'), 'Not saved — nothing was added', 'Try again (same request)'], ['5xx, timeout, connection closed', 'The save may not have finished', 'Check save status · Open the project; no Retry until the status is known']])),
      RCC08: () => dk('<h1>Handoff · RS-15</h1><p style="margin-top:6px">Checked against main <code>87bf3ac4ac</code> on Mon 16 Nov 2026. ◇ = Worker contract needed; ⚑ = owner decision (option A drawn).</p>'
        + '<h2>Checked on main</h2>' + tbl(['File', 'What it does today'], [
          ['<code>routes/research_project_comparisons.ts</code>', '<code>MEMBER_LIMIT = 6</code>, <code>ADD_LIMIT = 25</code>, <code>TITLE_LIMIT = 160</code>. POST <code>/:uid/comparisons</code> refuses 7+ as <code>comparison_full</code>, then inserts subjects one by one, the comparison, then members one by one — no transaction, no request id. A failure part-way leaves subjects or a short comparison; a retry makes a second comparison. An insert that fails inside <code>ensureSubjects</code> is reported as 503 <code>directory_unreadable</code>, whose words say nothing was added.'],
          ['<code>defaultComparisonTitle</code>', 'Joins names with “ · ” and appends “ …” after a title that may already be 159–160 characters, so it can return 161–162 characters; the CHECK (1–160) then fails after the subjects were written.'],
          ['GET <code>/:uid/comparisons</code>', 'Subjects, comparisons with ordered members, cells as <code>recorded</code> (value, source name/url, as_of) or <code>not_recorded</code> (reason); member state listed / removed / withdrawn / unreadable; <code>directory</code> state per kind; <code>limits</code>.'],
          ['<code>AddToResearch.jsx</code>', 'One sheet for Add and Compare; project picker with loading / Unavailable + Retry; “Nothing was added.” is appended to every error. Too many is shown only inside the sheet, and New research project stays enabled — creating a project with 7 selected makes the project, then the comparison is refused. Add to research over 25 gets the Worker’s <code>too_many</code>, which has no words in <code>COMPARISON_ERRORS</code>.'],
          ['<code>CompanyDirectoryZone.jsx</code>', 'Checkbox per row (founder or admin shell), selection kept in page state across pages and filters, SelectionBar: N selected · Clear · Add to research · Compare N (disabled under 2, title tooltip only, no upper bound).'],
          ['<code>ProjectComparisons.jsx</code>', 'Table with row headers; Rename, Delete, Remove column; phone shows one card per company.']])
        + '<h2>Requires engineering ◇</h2>' + tbl(['Contract', 'Detail'], [
          ['All-or-nothing save', 'Subjects, comparison and members in one D1 batch; on failure nothing persists and the reply says so (<code>rolled_back: true</code>). Only then may the UI say “Nothing was added”.'],
          ['Retry deduplication', 'Client sends a request id (uuid per Compare sheet open); the Worker stores it with the comparison and returns the same comparison for a repeat.'],
          ['Save status', 'GET status by request id: saved (with uid), not found (safe to retry), or unreadable. Without it, Check save status can only list recent comparisons with the same members.'],
          ['Title within the limit', 'Generated title reserves room for “ …”; the board’s long-name example comes to ' + LONGT.length + ' characters.'],
          ['Per-cell Unreadable', 'A cell whose source record could not be read returns <code>unreadable</code> instead of being folded into Not recorded.'],
          ['New project + comparison', 'Optional: one request that creates both, so a refused comparison does not leave an empty new project.']])
        + '<h2>Pending the owner ⚑</h2><p>Comparisons already left by the old failure (one-member sets, duplicates). Option A drawn: they are flagged “Saved part-way” on the Comparisons tab and the member deletes or completes them; nothing is merged or removed automatically.</p>'
        + '<h2>Frontend only</h2><p>Limit line and disabled Compare with visible reason before any sheet; Review selection with page labels and Remove; disable New research project when the selection cannot be compared; outcome copy keyed to the answer’s certainty; keep the selection after any failure; By attribute layout on phone and table/attribute toggle on desktop; tablet column pager; dark tokens.</p>'),
      RCC09: () => dk('<h1>Accessibility, keyboard order and focus</h1>' + tbl(['Area', 'Specification'], [
          ['Keyboard order · directory', 'Search → filters → result rows (checkbox, company link, Add to research) → pager → selection bar (Review, Clear, Add to research, Compare). The bar is a region labelled “Selected companies”; its count is announced politely on change.'],
          ['Disabled Compare', 'Stays focusable with <code>aria-disabled</code>; the reason is visible text tied by <code>aria-describedby</code>, never a tooltip only.'],
          ['Compare sheet', 'Focus moves to the sheet heading; order: companies list → project radios → title → Cancel → Create comparison. Esc closes unless saving. Focus returns to the Compare button that opened it, or to the bar if the selection changed.'],
          ['Outcomes', 'Saving is a polite live region; saved is status; refused, rolled back and unknown are alerts. After “Open the comparison →” focus lands on the comparison’s h2.'],
          ['Comparison table', 'Caption, column headers per company, row headers per attribute. Each cell reads value, source, date. Source links say “opens source”. State words, never colour alone.'],
          ['Phone', 'Touch targets 44px, primary 48px. Attribute stepper buttons name the next and previous attribute. Sheets trap focus and return it to the opener.'],
          ['Removal', 'Remove in Review moves focus to the next row, or to the list heading if it was last.']]))
    };

    /* ---------- route ---------- */
    let html = '';
    const SEL2 = ['hal', 'qua'];
    const SEL6p1 = ['hal', 'nor', 'kes', 'qua'];
    if (B === 'RCC01') html = page(dirPage(SEL2, selBar(2)), { h: 900 });
    else if (B === 'RCC01B') html = page(dirPage(SEL6p1, selBar(6, { other: 2 })), { h: 900 });
    else if (B === 'RCC01C') html = page(dirPage(SEL6p1.concat(['lar']), selBar(7, { other: 2 }), { focus: 'lar' }), { h: 900 });
    else if (B === 'RCC01D') html = crop('<span class="eye">Zero and one selected · the limit is visible before any project is chosen</span><div class="rcc-two"><div class="cd"><div class="ch"><h2 style="font-size:13.5px">0 selected</h2>' + st('None', 'No selection') + '</div>' + LIMITLINE + '<div class="rcc-hint">' + SH.nd + ' Tick companies to add them to a research project, or to compare 2 to 6 of them.</div><p class="raw">No bar. Each row keeps its own Add to research.</p></div><div class="cd"><div class="ch"><h2 style="font-size:13.5px">1 selected</h2></div>' + selBar(1) + '<p class="raw">Add to research works for one. Compare stays disabled with its reason.</p></div></div><div class="rcc-two"><div class="cd"><div class="ch"><h2 style="font-size:13.5px">26 selected · bulk add limit</h2></div><div class="rcc-bar"><span><b class="mo">26</b> selected · <span class="mo">22</span> on other pages</span><button type="button" class="btn t bsm">Review</button><span class="rcc-sep"></span><button type="button" class="btn bsm" disabled aria-describedby="w26">Add to research</button><button type="button" class="btn p bsm" disabled>Compare 26</button><span id="w26" class="rcc-why over">' + SH.ar + 'Add to research takes up to 25. Remove 1.</span></div><p class="raw">The existing Worker rule (<span class="mo">ADD_LIMIT 25</span>), stated before the request instead of after a refusal.</p></div><div class="cd"><div class="ch"><h2 style="font-size:13.5px">Not allowed to write</h2>' + st('Refused') + '</div><p style="font-size:12.5px">Your role has no My Research, so the directory shows no checkboxes and no Add to research. Reading the directory is unchanged.</p><p class="raw">canAddToResearch: founder or admin shell</p></div></div>', 1240);
    else if (B === 'RCC01E') html = page(dirPage(SEL6p1.concat(['lar']), selBar(7, { other: 2 })), { h: 980, overlay: sideSheet('Your selection · 7', 'Review selection', '<p style="font-size:12.5px">Kept across pages and filters. ' + LIMITLINE + '</p><div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>7 selected — Compare holds 6.</b><div>Remove one to compare. Add to research takes all 7.</div></div></div>' + reviewList(SIX.concat(['lar']), { extra: 'lar' }), '<button type="button" class="btn">Clear all</button><button type="button" class="btn">Add 7 to research</button><button type="button" class="btn p" disabled aria-describedby="w7">Compare</button>') });
    else if (B === 'RCC02') html = page(dirPage(SEL6p1, selBar(6, { other: 2 })), { h: 980, overlay: cmpSheet() });
    else if (B === 'RCC02B') html = page(dirPage(SEL6p1, selBar(6, { other: 2 })), { h: 1040, overlay: cmpSheet({ pick: 'new', newForm: '<div class="rcc-new"><label class="rcc-lbl" for="npt">New project title</label><div class="rcc-in" id="npt">Grid and freight Series A scan</div><p class="raw">The project is created first, then the comparison. If the comparison is then refused, the new project stays, empty, and the sheet says so. ' + BE('', 'one request') + '</p></div>', foot: '<button type="button" class="btn">Cancel</button><button type="button" class="btn p">Create project and comparison</button>' }) });
    else if (B === 'RCC02C') html = crop('<span class="eye">Long names · the generated title fits the stored limit (1–160)</span><div class="rcc-two"><div class="cd">' + confirmList(SIX).replace(/<li><span class="mo">(\d)<\/span>[^<]*<\/li>/g, (m, i) => '<li><span class="mo">' + i + '</span>' + LONG[i - 1] + '</li>') + '</div><div class="cd">' + titleField(LONGT, true) + '<p style="font-size:12.5px">The title stops at the last whole name that fits and ends with “ …”: <b class="mo">' + LONGT.length + '</b> characters. The full list stays in the columns.</p>' + prop('Fix the generated title.', 'Today <code>defaultComparisonTitle</code> can return up to 162 characters; the CHECK then fails after the subjects were saved. The Worker must reserve room for “ …”.') + '</div></div><div class="cd"><div class="ch"><h2 style="font-size:13.5px">Typed title at the limit</h2>' + st('Limit', 'At the limit') + '</div>' + titleField('Halden, Northwind, Kestrel, Quarry, Orchard and Tidewater — Series A readiness comparison for the Q1 2027 partner shortlist, with the grid and freight logistics angle'.slice(0, 160), false).replace('<div class="rcc-cnt">', '<div class="rcc-cnt over">').replace('Your title', 'The field takes no more than 160 characters (maxLength), the same limit the Worker checks') + '</div>', 1240);
    else if (B === 'RCC03') html = crop('<span class="eye">Save outcomes · the words follow what the Worker confirmed</span><div class="rcc-grid3">' + outcome('saving') + outcome('ok', { note: 'Links to /research/projects/:uid/comparisons and focuses the new comparison.' }) + outcome('ref', { note: 'Today: 400, 404 and 409 refusals are checked before any write, so “nothing was added” is true.' }) + outcome('rb', { tag: BE('', 'all-or-nothing'), note: 'Drawn only under the proposed contract: the reply must confirm the rollback.' }) + outcome('unk', { note: '5xx, timeout or closed connection. No Retry and no “nothing was added”.' }) + '<section class="rcc-out was"><div class="rcc-oh">' + st('Partial', 'Today, without the contract') + '</div><b>What main does after a mid-save failure</b><p>The sheet says “Nothing was added.” although subjects, and sometimes a comparison with fewer members, may exist. Retrying creates a second comparison. This board replaces that copy.</p></section></div>', 1300);
    else if (B === 'RCC03B') html = crop('<span class="eye">Check save status · a read, never a write · selection kept throughout</span><div class="rcc-grid3">'
      + '<section class="rcc-out saving"><div class="rcc-oh">' + st('Checking', 'Checking') + '</div><b>Reading “' + PROJ + '”…</b><p>Looking for this request’s comparison.</p></section>'
      + '<section class="rcc-out ok"><div class="rcc-oh">' + st('Saved', 'Found · saved') + '</div><b>It was saved</b><p>“' + TITLE6 + '” was saved at 16:05 with 6 columns.</p><div class="rcc-oa"><a class="btn p bsm" href="#">Open the comparison →</a></div></section>'
      + '<section class="rcc-out rb"><div class="rcc-oh">' + st('None', 'Not found') + BE('', 'request id') + '</div><b>Not saved — safe to try again</b><p>The Worker has no record of this request and nothing from it in the project. Trying again sends the same request id, so it can’t make two.</p><div class="rcc-oa"><button type="button" class="btn p bsm">Try again</button></div></section>'
      + '<section class="rcc-out unk"><div class="rcc-oh">' + st('Partial', 'Saved part-way') + '</div><b>2 of the 4 new companies were added; no comparison</b><p>This save added Northwind Labs and Kestrel Robotics. Orchard Data and Tidewater Systems are not in the project. Halden Grid and Quarry AI were already there.</p><div class="rcc-oa"><button type="button" class="btn p bsm">Create the comparison from these 6</button><a class="btn bsm" href="#">Open the project</a></div><p class="raw">Today’s data can leave this; the action re-sends all 6 under the contract.</p></section>'
      + '<section class="rcc-out unk"><div class="rcc-oh">' + st('Partial', 'Saved part-way') + '</div><b>A comparison with 1 column exists</b><p>“Halden Grid · Northwind Labs” was saved at 16:05 with only Halden Grid. A retry without the contract would add a second set.</p><div class="rcc-oa"><button type="button" class="btn p bsm">Complete it</button><button type="button" class="btn bsm">Delete it</button></div>' + OW('existing part-saved sets') + '</section>'
      + '<section class="rcc-out ref"><div class="rcc-oh">' + st('Unavailable') + '</div><b>Couldn’t check the project</b><p>The status read failed at 16:06. The outcome is still unknown; don’t create the comparison again yet.</p><div class="rcc-oa"><button type="button" class="btn p bsm">Check again</button></div></section></div>'
      + prop('Reconciliation contract.', 'Found / Not found by request id and “safe to try again” need the request id and status read. Without them the sheet can only list recent comparisons in the project with the same members, labelled “may be this save”.'), 1300);
    else if (B === 'RCC04') html = page(readPage(), { h: 1200, cur: 'My Research' });
    else if (B === 'RCC04B') html = crop('<span class="eye">Comparisons tab states · Platform States words</span><div class="rcc-grid3">'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Loading</h2>' + st('Loading') + '</div><div class="rcc-sk" aria-hidden="true"><i></i><i></i><i></i></div><p class="raw" role="status">Reading the comparisons…</p></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">True empty</h2>' + st('None', 'No comparisons') + '</div><p style="font-size:12.5px">This project has no comparisons yet. Select 2 to 6 companies in the directory and choose Compare.</p><a class="btn bsm" href="#" style="align-self:flex-start">Open Companies</a></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Directory unreadable</h2>' + st('Unreadable') + '</div><p style="font-size:12.5px">The company directory could not be read just now, so no values are shown. The 6 columns and their names are kept.</p><button type="button" class="btn bsm" style="align-self:flex-start">Retry</button><p class="raw">directory.company = unreadable · never drawn as Not recorded</p></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Not recorded</h2></div><dl class="kv2" style="grid-template-columns:110px minmax(0,1fr)"><dt>Revenue</dt><dd>' + NR + '<small style="display:block;font-weight:500;color:var(--mu)">No source lists it for this company</small></dd><dt>Employees</dt><dd class="mo">64</dd></dl><p class="raw">Never 0, never a blank</p></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Archived project</h2>' + st('Refused', 'Read-only') + '</div><p style="font-size:12.5px">This project is archived, so it cannot change until you restore it. The comparison stays readable.</p><p class="raw">409 project_archived</p></section>'
      + '<section class="cd"><div class="ch"><h2 style="font-size:13.5px">Not your project</h2>' + st('Refused', 'Not found') + '</div><p style="font-size:12.5px">This project isn’t in your research. It may have been deleted, or it belongs to someone else.</p><a class="btn bsm" href="#" style="align-self:flex-start">My Research</a><p class="raw">404 — another member’s project reads as absent</p></section></div>', 1300);
    else if (B === 'RCC11') html = page(readPage(), { h: 1200, cur: 'My Research' });
    else if (B === 'RCC11B') html = phone('Comparison', byAttr(4));
    else if (B === 'RCC11C') html = page(dirPage(SEL6p1, selBar(6, { other: 2 })), { h: 900 });
    else if (B === 'RCC12') html = tablet();
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(dirPage(SEL2, selBar(2)), { h: 900 });
    return { html: { __html: html } };
  }
}
