    const BANNER = t => `<div role="status" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:#fcd34d;color:#92400e;font-size:12.5px;font-weight:700"><span style="${M};font-size:10px;letter-spacing:.11em;text-transform:uppercase">Read only</span><span style="flex:1">${t}</span></div>`;

    const PH0 = () => { const z = Z.clo; const ann = (n, t) => `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--body)"><span style="${M};width:18px;height:18px;border-radius:999px;background:#18181b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700">${n}</span>${t}</span>`;
      return crop(1440, card(HEAD(z, {}), 'padding:18px 20px') + `<div style="display:flex;gap:14px;flex-wrap:wrap">${['Crumb', 'h1', 'Badge', 'Purpose', 'Primary', 'Ask', 'Ghost actions row', 'Zone pills'].map((t, i) => ann(i + 1, t)).join('')}</div>` + LBL('Three variants') + grid(4, [['With a primary', HEAD(Z.clo, { wait: true })], ['No primary: Ask alone', HEAD(Z.scr, {})], ['Ask with AI off', HEAD(Z.scr, { askOff: true })], ['No AIRail: no primary and no Ask', HEAD(Z.ahome, { noRail: true })]].map(([l, h]) => `<div style="display:flex;flex-direction:column;gap:6px">${LBL(l)}${card(h, 'padding:14px')}</div>`).join('')) + `<p style="margin:0;font-size:12px;color:var(--body)">Accessible names: “Ask Eadwyn” · with the chip, “Ask Eadwyn, 3 waiting” · AI off, “Ask (from your sources)” · a field trigger, “Ask Eadwyn to fill [field]”.</p>` + LBL('Primary states') + `<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;padding-bottom:70px">${[['Rest', 'rest'], ['Hover', 'hover'], ['Focus', 'focus'], ['Busy', 'busy'], ['Disabled, reason on hover', 'dis']].map(([l, st]) => `<div style="display:flex;flex-direction:column;gap:6px">${LBL(l)}${prim('Record wire', 'i', st)}</div>`).join('')}</div>`); };
    const PH0M = () => `<div style="width:390px;box-sizing:border-box;padding:16px;background:var(--bg)">${card(HEAD(Z.clo, { nar: true }))}</div>`;

    const PHONE = (k, inner, sheetIn) => { const z = Z[k]; return `<div style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column"><div style="height:52px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--card);border-bottom:1px solid var(--line)"><button type="button" aria-label="Menu" style="width:44px;height:44px;border:none;background:transparent;color:var(--ink);font-size:18px">☰</button><img src="/axal-mark.png" alt="Axal VC" style="width:24px;height:24px;border-radius:6px"><span style="flex:1;font-size:15px;font-weight:800">${z.sec}</span></div><div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:14px">${HEAD(z, { nar: true, wait: !!sheetIn })}${inner}</div>${sheetIn ? `<div aria-hidden="true" style="position:absolute;inset:0;background:var(--scrim)"></div><div role="dialog" aria-label="Ask Eadwyn" style="position:absolute;left:0;right:0;bottom:0;height:92%;box-sizing:border-box;background:var(--card);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden"><span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:999px;background:var(--line2);margin:8px 0 2px"></span>${PANEL(z.sec + ' › ' + z.title, sheetIn, { w: 390 }).replace('border-left:1px solid var(--line);', '')}</div>` : ''}</div>`; };

    const STATES = () => { const c = (l, inner) => `<div style="display:flex;flex-direction:column;gap:8px">${LBL(l)}${inner}</div>`; return crop(1440, grid(2, [
      c('Empty', card(HEAD(Z.clo, {}) + EMP('No document has been raised at closing yet.'))),
      c('Loading: the header stays, rows shimmer', card(HEAD(Z.clo, {}) + `<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px">${[90, 80, 86, 70].map(w => `<div style="height:14px;width:${w}%;border-radius:6px;background:var(--skel)"></div>`).join('')}<span style="font-size:12px;color:var(--mut)">Reading…</span></div>`)),
      c('One block could not be read', card(HEAD(Z.rep, {}) + `<div role="alert" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:10px;border:1px dashed var(--line2)"><span style="display:flex;align-items:center;gap:8px;font-size:12.5px"><span style="color:var(--neg)">●</span>Overdue reports could not be read. The rest of the page is up to date.</span>${sB('Try again')}</div>` + SAMPLE.va)),
      c('Eadwyn found nothing', `<div style="display:flex;height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--line)">${PANEL('Deals › Closing', UQ('Draft reminders for unsigned envelopes.') + ANS('Eadwyn found nothing new to propose. Nothing was guessed.', '', 0, ' '), { w: 520 })}</div>`),
      c('Out of AI tokens', card(HEAD(Z.clo, { askDis: true, askSub: 'Add tokens' })) + `<div style="display:flex;height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line)">${PANEL('Deals › Closing', `<div role="alert" style="padding:11px;border-radius:12px;border:1px solid #fcd34d;background:var(--raised);display:flex;flex-direction:column;gap:8px"><span style="font-size:12.5px;font-weight:700">Your monthly AI budget is used up.</span><span style="font-size:12px;color:var(--body)">Runs start again when you add tokens.</span><div>${sB('Add tokens', 'p')}</div></div>`, { w: 520, noBox: true })}${RAIL('out')}</div>`),
      c('AI paused', card(HEAD(Z.clo, { askDis: true })) + `<p style="margin:0;font-size:12.5px;color:var(--mut)">AI is paused for your account.</p>`),
      c('AI off on this page', `<div style="display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:300px"><div style="flex:1;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px">${card(HEAD(Z.clo, { askOff: true }))}<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px"><span style="flex:1">AI is off on this page.</span>${sB('Turn on', 'v')}</div></div>${RAIL('off')}</div>`)
    ].join(''), 20)); };

    const PH16 = () => { const col = (t, items) => card(`<h2 style="margin:0;font-size:15px;font-weight:800">${t}</h2>${items.map(([g, L]) => `<div style="display:flex;flex-direction:column;gap:6px">${LBL(g)}${L.map(x => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px"><span>☐ ${x}</span>${pill('Not built')}</div>`).join('')}</div>`).join('')}`); return crop(1440, `<p style="margin:0;font-size:13px;color:var(--body)">Compared with the founder’s modules (one header per module with a chart, a records table, Add, Ask and drafts). Pending owner.</p>` + grid(3, col('Investor', [['Zones with no primary', ['Deal flow (filled)', 'Screening', 'Commit', 'Positions', 'Accounting', 'Reporting', 'Relationships', 'Introductions', 'Organizations']], ['Records that do not exist yet', ['Co-investors', 'Investor-owned deals', 'Closing checklist']], ['No Ask fill scope', ['Every zone except IC memo']]]) + col('Advisor', [['Zones with no primary', ['Opportunities', 'Engagements', 'Delivery', 'Every Cohorts zone', 'Profile', 'Proof', 'Visibility']], ['No Ask fill scope', ['Every zone except Expertise › Services']]]) + col('Operating Partner', [['Zones with no primary', ['Every Pipeline zone', 'Board', 'Deliverables', 'Capacity', 'Health', 'Visibility', 'Audience fit', 'Product testing']], ['Records that do not exist yet', ['Playbooks', 'Change orders', 'Renewal dates', 'Report cadence']], ['No Ask fill scope', ['Every zone except Delivery › Status reports']]]))); };

    const FR = {
      hero: () => SHELL({ z: 'clo', h: 900, wait: true, open: true, body: BODY.clo1, panel: PANEL('Deals › Closing', CLOP) }),
      ph0: PH0, ph0m: PH0M,
      ph1a: () => SHELL({ z: 'flow', body: BODY.flow0, noPrim: true }), ph1b: () => SHELL({ z: 'flow', body: BODY.flow1 }),
      ph2a: () => SHELL({ z: 'scr', body: BODY.scr0 }), ph2b: () => SHELL({ z: 'scr', body: BODY.scr1 }),
      ph3a: () => SHELL({ z: 'com', body: BODY.com0 }), ph3b: () => SHELL({ z: 'com', body: BODY.com1 }),
      ph4a: () => SHELL({ z: 'clo', body: BODY.clo1 }), ph4b: () => SHELL({ z: 'clo', body: BODY.clo0 }),
      ph5: () => crop(1180, ['pos', 'rep', 'va'].map(k => STRIP(k)).join('')),
      ph6: () => crop(1180, ['lps', 'calls', 'acct', 'frep'].map(k => STRIP(k)).join('')),
      ph6l: () => SHELL({ z: 'lps', lockFund: true, headless: true, body: `<div style="flex:1;display:grid;place-items:center;padding:60px 0">${card(`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:16px 8px"><span style="color:var(--mut)">${LOCK}</span><h1 style="margin:0;font-size:20px;font-weight:800">Fund is part of the Institutional plan</h1><p style="margin:0;max-width:400px;font-size:12.5px;line-height:1.55;color:var(--mut)">LPs, capital calls, accounting and reporting for your own fund.</p>${prim('See plans', 'i')}</div>`, 'width:480px')}</div>` }),
      ph7: () => crop(1180, ['rask', 'rel', 'intro', 'org'].map(k => STRIP(k)).join('')),
      ph8: () => crop(1180, grid(2, card(`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${LBL('Your thesis')}<span style="flex:1;font-size:13.5px;font-weight:700">[Seed B2B infrastructure, EU and North America]</span>${lnk('Edit in Settings ›')}</div>`) + card(`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${LBL('Your thesis')}<span style="flex:1;font-size:13.5px;color:var(--mut)">No thesis set</span>${lnk('Set your thesis')}</div>`))),
      ph9: () => crop(1180, ['opp', 'eng', 'pdel', 'ses', 'earn'].map(k => STRIP(k)).join('')),
      ph10: () => crop(1180, ['cf', 'cg', 'cw', 'cc', 'co'].map(k => STRIP(k, { badgeX: pill('From the Lab · read only', 'lav') })).join('')),
      ph11: () => crop(1180, ['thk', 'epr', 'epf', 'evi'].map(k => STRIP(k)).join('')),
      ph11s: () => SHELL({ z: 'svc', open: true, wait: true, body: card(TBL(['Service', 'Price', 'Duration'], [['[Pricing review]', '$[1,200]', '[2 weeks]'], ['[Board prep]', '$[800]', '[1 week]']], '1fr 120px 120px')) + card(`${LBL('Add a service')}<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${FLD('Title', 1)}${FLD('What it covers', 1)}${FLD('Price')}${FLD('Duration')}</div><div style="display:flex;justify-content:flex-end">${prim('Save', 'a')}</div>`), panel: PANEL('Expertise › Services', SVCP) }),
      ph12: () => crop(1180, grid(2, card(HEAD(Z.ses, {}) + `<div style="display:flex;gap:8px;align-items:center">${pill('Paid', 'pos')}<span style="font-size:12px;color:var(--mut)">Emerald primary beside a positive chip in the same emerald</span></div>`) + card(HEAD(Object.assign({}, Z.ses, { p: 'f' }), {}) + `<div style="display:flex;gap:8px;align-items:center">${pill('Paid', 'pos')}<span style="font-size:12px;color:var(--mut)">The same header with a violet primary</span></div>`))),
      ph13: () => crop(1180, ['lead', 'prop', 'neg', 'ret', 'pan'].map(k => STRIP(k)).join('')),
      ph14: () => crop(1180, ['brd', 'dlv', 'cap', 'hlt'].map(k => STRIP(k)).join('')),
      ph14s: () => SHELL({ z: 'srep', open: true, wait: true, body: card(TBL(['Engagement', 'Report due', 'Last sent'], [['[Client A] · Go-to-market sprint', 'Fri [7 Nov]', '[31 Oct]'], ['[Client B] · Pricing review', 'Fri [7 Nov]', '[24 Oct]']], 'minmax(0,1.6fr) 140px 120px')) + card(`${EY('New report · [Client B]')}<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${FLD('Done this week', 1, 0, 60)}${FLD('Next week', 1, 0, 60)}</div>${FLD('Blockers', 0, 0, 44)}<div style="display:flex;justify-content:flex-end">${prim('Save', 'p')}</div>`), panel: PANEL('Delivery › Status reports', SREPP) }),
      ph14d: () => SHELL({ z: 'brd', body: card(TBL(['Engagement', 'Stage', 'Health'], [['[Client B] · Pricing review', 'In review', pill('At risk', 'amb')], ['[Client A] · Go-to-market sprint', 'In flight', pill('On track', 'pos')]], 'minmax(0,1.6fr) 140px 120px')), sheet: ['[Client B] · Pricing review', 'Engagement', `<p style="margin:0;font-size:13px;line-height:1.55">Started [6 Oct] · [Partner name] leads · next milestone Fri [7 Nov].</p>${TBL(['Deliverable', 'Due', 'State'], [['[Pricing memo]', '[7 Nov]', pill('In review', 'sky')], ['[Packaging test]', '[21 Nov]', pill('Planned')]], '1fr 90px 100px')}`] }),
      ph15: () => crop(1180, ['cat', 'perk', 'opf', 'ovi', 'oaf', 'opt'].map(k => STRIP(k)).join('')),
      ph16: PH16,
      ph17: () => crop(1440, grid(3, [['Investor · IC memo', 'Deals › Commit › IC memo', ICP, card(FLD('Memo', 1, 0, 50))], ['Advisor · Services', 'Expertise › Services', SVCP, card(FLD('Title', 1) + FLD('What it covers', 1))], ['Operating Partner · Status reports', 'Delivery › Status reports', SREPP, card(FLD('Done this week', 1) + FLD('Next week', 1))]].map(([l, pg, inn, fm]) => `<div style="display:flex;flex-direction:column;gap:8px">${LBL(l)}${fm}<div style="display:flex;height:640px;border-radius:12px;overflow:hidden;border:1px solid var(--line)">${PANEL(pg, inn, { w: 440, q: 'What else is missing from this?' })}</div></div>`).join(''))),
      ph18: STATES,
      ph19a: () => SHELL({ z: 'pos', hq: true, ro: true, rail: 'ro', banner: BANNER('HQ access for [Quarterly portfolio review] · ends in 7 h 52 m'), body: card(TBL(['Company', 'Mark', 'As of'], [['[Acme Robotics]', '$[1.2M]', '[30 Sep]']], '1fr 120px 100px')) }),
      ph19b: () => SHELL({ z: 'pos', ro: true, rail: 'ro', banner: BANNER('Support session · read only'), body: card(TBL(['Company', 'Mark', 'As of'], [['[Acme Robotics]', '$[1.2M]', '[30 Sep]']], '1fr 120px 100px')) }),
      ph19c: () => SHELL({ z: 'acct', headless: true, body: `<div style="flex:1;display:grid;place-items:center;padding:80px 0">${card(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:12px"><h1 style="margin:0;font-size:20px;font-weight:800">You don't have access to this page</h1>${lnk('Back to Home')}</div>`, 'width:440px')}</div>` }),
      ph19d: () => SHELL({ z: 'clo', explorer: true, body: BODY.clo1 }),
      ph19e: () => SHELL({ z: 'ahome', noRail: true, body: card(`<span style="font-size:13px">[2] sessions today · [1] report to send</span>`) }),
      ph20a: () => PHONE('clo', card(`<div style="display:flex;flex-direction:column;gap:8px;font-size:13px">${[['[SAFE · Acme Robotics]', 'Signed', 'pos'], ['[Side letter · Acme Robotics]', 'Viewed', 'sky'], ['[SAFE · Bluefern Health]', 'Sent', 'neu']].map(([a, b, k]) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)"><b>${a}</b>${pill(b, k)}</div>`).join('')}</div>`)),
      ph20b: () => PHONE('srep', card(`<span style="font-size:13px">[4] reports due Friday</span>`), SREPP),
      ph20c: () => PHONE('scr', card(`<span style="font-size:13px">[3] deals scored this week</span>`)),
      ph21: () => SHELL({ z: 'ses', w: 768, narrow: true, overlay: true, open: true, wait: true, body: card(SAMPLE.ses), panel: PANEL('Practice › Sessions', CHIPS([['Find a free afternoon next week', 1], ['Open session types', 0]]) + UQ('Block next Friday afternoon.') + ANS('One block fits your calendar.', PC('Block', 'Fri [14 Nov] · 13:00–18:00', 'From your calendar', 'no charge'), 1), { w: 360, over: true }) }),
      ph22a: () => SHELL({ z: 'clo', wait: true, open: true, body: BODY.clo1, panel: PANEL('Deals › Closing', CLOP) }),
      ph22b: () => SHELL({ z: 'ses', open: true, wait: true, body: card(SAMPLE.ses), panel: PANEL('Practice › Sessions', CHIPS([['Find a free afternoon next week', 1]]) + UQ('Block next Friday afternoon.') + ANS('One block fits your calendar.', PC('Block', 'Fri [14 Nov] · 13:00–18:00', 'From your calendar', 'no charge'), 1)) }),
      ph22c: () => SHELL({ z: 'srep', open: true, wait: true, body: card(SAMPLE.srep), panel: PANEL('Delivery › Status reports', SREPP) })
    };
    const html = (FR[v] || FR.hero)();
    return { rootSt: (dark ? DARK : LIGHT) + ';' + F + ';color:var(--ink);background:var(--bg);width:max-content', body: { __html: html } };
  }
}

</script>
</body></html>
