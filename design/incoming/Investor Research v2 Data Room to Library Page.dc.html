    const libCard = (l, gone) => '<div class="mc"><div class="r1"><b' + (gone === 'anon' ? ' class="rsl-anon"' : '') + '>' + (gone === 'anon' ? 'A file behind an NDA with [Halverton]' : l[0]) + '</b></div>' + (gone ? '<div>' + GONE() + '</div><small>' + (gone === 'anon' ? 'The NDA with this founder lapsed' : 'Access to [Halverton]’s room ended 20 Nov 2026') + '</small><div style="display:flex;gap:6px">In Ask ' + inAsk('gone') + '</div>' : '<div style="display:flex;gap:6px;flex-wrap:wrap">' + st(l[3]) + inAsk(l[5]) + '</div><div style="display:flex;gap:6px;flex-wrap:wrap">' + (l[6] === 'room' ? roomChip() + ro : ours) + '</div>') + '</div>';
    const MOB = {
      RSL20A: () => phone('Diligence', mroomHead + '<div class="chips"><button type="button" aria-checked="true" style="min-height:44px">Financials · 4</button><button type="button" style="min-height:44px">All · 8</button></div>' + J(FILES.filter(f => f[1] === 'Financials').map(mfile))),
      RSL20B: () => phone('Diligence', mroomHead + J(FILES.filter(f => f[1] === 'Financials').slice(0, 2).map(mfile)), '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms1"><div class="grab" aria-hidden="true"></div><div style="padding:8px 18px 24px;display:flex;flex-direction:column;gap:8px"><h2 id="ms1" style="font-size:16px;font-weight:800">[Pricing model.pdf]</h2><span class="raw">pdf · 1.2 MB · staged 2 Oct 2026 · Open to invited</span><button type="button" class="btn" style="min-height:48px;justify-content:flex-start">Open file page</button><button type="button" class="btn" style="min-height:48px;justify-content:flex-start">Add to my Library ' + PT() + '</button><button type="button" class="btn" style="min-height:48px;justify-content:flex-start">Download</button><button type="button" class="btn t" style="min-height:48px">Cancel</button></div></div>'),
      RSL20C: () => phone('Add to Library', '', '<div class="sheet" style="top:56px;max-height:none;border-radius:16px 16px 0 0" role="dialog" aria-modal="true" aria-labelledby="ms2"><div class="grab" aria-hidden="true"></div><div style="padding:6px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:hidden"><h2 id="ms2" style="font-size:18px;font-weight:800;line-height:1.3">Add [Cohort retention Q3.xlsx] to your Library?</h2>' + confirmBody(true) + '<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button type="button" class="btn p" style="min-height:48px">Add to Library</button><button type="button" class="btn" style="min-height:48px">Cancel</button></div></div></div>'),
      RSL20D: () => phone('Library', '<div class="rsl-reach" style="font-size:12.5px"><b class="mo">18</b> answerable in Ask · <b class="mo">3</b> not answerable</div><div class="chips"><button type="button" aria-checked="true" style="min-height:44px">From data rooms · 4 ' + PT() + '</button><button type="button" style="min-height:44px">Filters · 1</button></div>' + libCard(LIB[0]) + libCard(LIB[3]) + libCard(LIB[2], 'rev') + libCard(LIB[1], 'anon') + '<p class="raw">The last two cards show the later states (access ended, NDA lapsed) for reference.</p>'),
      RSL20E: () => phone('Ask Eadwyn', '<section class="cd" style="padding:12px 14px;gap:8px">' + st('Answered') + '<p style="font-size:14px;line-height:1.6">Month-6 logo retention for the 2026 cohorts was <b class="mo">[71%]</b> <a href="#" class="cite on">1</a>, above the <b class="mo">[58%]</b> median <a href="#" class="cite">2</a>.</p><span class="raw">Cost <b class="mo">[$0.004]</b> recorded</span></section>', '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms3"><div class="grab" aria-hidden="true"></div><div style="padding:8px 18px 24px;display:flex;flex-direction:column;gap:10px"><h2 id="ms3" style="font-size:17px;font-weight:800">Source <span class="cite on">1</span></h2><b>[Cohort retention Q3.xlsx]</b>' + roomChip() + '<span class="raw">staged 2 Oct 2026 · available until 12 Jan 2027</span><div class="pass">Cohorts · row 14: <mark>Jan–Jun 2026 cohorts, month-6 logo retention [71%]</mark></div><a class="btn" href="#" style="min-height:48px">Open in room</a></div></div>')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const DOCS = {
      RSLH: () => dk('<h1>Handoff · Data room to Library (#6283)</h1><p>Continues Research v2 (RS-01 to RS-12, RS-A to RS-C) as RS-13 to RS-21, in the investor shell. Checked on main <code>6d7712c6d1</code>, 14 Nov 2026. Sample people, companies and figures are fictional.</p>'
        + '<h2>Checked on main</h2>' + tbl(['Where', 'What it showed'], [
          ['<code>routes/research.ts</code> GET /diligence, /diligence/:grantUid, /diligence/:grantUid/files/:fileUid', 'Room reads keyed by the grant uid, gated by <code>activeGrant</code>, <code>projectNdaActive</code>, <code>tierAdmits</code> and the grant’s folder scope. Room read returns file_open, file_total, withheld_behind_nda, folders and files (folder_uid). File read strips the folder and returns downloads (links issued). 404 room_not_found, 404 file_not_found, 403 nda_required with no name.'],
          ['Same, the NDA count', 'With a signed NDA every admitted file is listed and withheld_behind_nda is 0. The “3 files behind an NDA” line only appears when the NDA is not signed, so RS-13 draws both rooms.'],
          ['<code>routes/research.ts</code> GET /documents, dto()', 'source is own or client; read_only and in_ask are derived; in_ask = own and indexed or partial. Header answerable / not_answerable are counted from in_ask. KINDS: playbook, client, document, report, primary, legal.'],
          ['<code>services/dataRoomActivity.ts</code>, <code>pages/raise/dataroom/activityModel.js</code>', 'ACTIVITY_ACTIONS: open_room, download, blocked. The page words are “Opened the room”, “Link issued for …”, “Blocked: NDA needed for …”; the CSV words are “Downloaded” and “Blocked: NDA not signed”. RS-17 draws the page words.'],
          ['<code>routes/researchProjects.jsx</code>', 'My Research is routed for founder and admin only (D5157). An investor has no Research Project today.'],
          ['<code>workspaces/shellConfig.js</code>', 'Investor Research zones: Ask, Diligence, Benchmarking, Markets, Geographies, Library. Data room tabs: Home, Files, Access, Requests, Activity, Checklist, Preview.']])
        + '<h2>Backend required (◇ #6283 unless named)</h2>' + tbl(['Item', 'Note'], [
          ['Add to my Library from a room file', 'No route. POST /documents takes only an upload. Index in the investor’s own namespace, tied to the grant uid.'],
          ['Room provenance on a Library row', 'A column naming the data-room file and grant; source gains a room value; the Source filter’s From data rooms option.'],
          ['Founder switch per room', 'Off by default (Q2 A). Turning it off removes every copy’s reach at once.'],
          ['library_add / library_remove log actions', 'Written on Add and Remove; ACTIVITY_ACTIONS, the page words and the filter gain both.'],
          ['Source no longer available', 'On revoke, expiry, NDA lapse, file removed or moved out of the grant’s folders: delete index entries, keep the row, mark citations. Nameless for an NDA file.'],
          ['Cost line', 'Confirm sheet states no indexing charge (Q4 A). No quote exists for Library indexing.'],
          ['Diligence kind', '#6282.'],
          ['Investor My Research', 'Shell and route change (D5157) for RS-15 B.']])
        + '<h2>Pending the owner (⚑, drawn as A)</h2><p>Q1 live reference that follows the grant · Q2 founder sees every Add/Remove, per-room switch off by default · Q3 row stays, reads Source no longer available, index deleted at once · Q4 indexing not charged, Ask charged as today · Q5 these boards extend Research v2 and #6268 / #6273 reuse RS-13 to RS-15.</p>'
        + '<h2>Frontend only</h2><p>Room-row “In your Library” state and overflow menu; the confirm sheet; the Library Source filter control (its room option is ◇); room chip and two pills on Library rows; the Eadwyn proposal card; empty states; phone cards and sheets; dark tokens.</p>'
        + '<h2>Handoff path and accessibility</h2><p>Room file → Library row (carries the grant uid, so Open in room works) → Ask with the file in scope, or Add to research. Menus and sheets return focus to the control that opened them; switch has role switch; states are announced politely, failures as alerts; every state pairs a glyph and a word; phone targets 44px, primary 48px; no table wider than the screen.</p>')
    };

    /* ---------- route ---------- */
    let html = '';
    if (B === 'RSL13') html = page(room(true), { h: 900, cur: 'Diligence' });
    else if (B === 'RSL13N') html = page(room(false), { h: 900, cur: 'Diligence' });
    else if (B === 'RSL13B') html = page(filePage(), { h: 900, cur: 'Diligence' });
    else if (B === 'RSL13C') html = page(room(true), { h: 900, cur: 'Diligence', overlay: confirm() });
    else if (B === 'RSL14') html = page(library(), { h: 1130, cur: 'Library', rail: propRail });
    else if (B === 'RSL15') html = page(askPage(), { h: 1100, cur: 'Ask' });
    else if (B === 'RSL15B') html = page(evidence(), { h: 900, cur: "" });
    else if (B === 'RSL16') html = page(goneLib(), { h: 1080, cur: 'Library' });
    else if (B === 'RSL16B') html = page('<div class="crumb"><a href="#">Research</a>/<b>Ask</b></div>' + askAnswer({ gone: true }), { h: 760, cur: 'Ask' });
    else if (B === 'RSL16C') html = reasons();
    else if (B === 'RSL16D') html = ndaLapsed();
    else if (B === 'RSL17') html = page(founder(), { h: 1000, founder: true });
    else if (B === 'RSL17B') html = accessCrop();
    else if (B === 'RSL18') html = page(empty(), { h: 760, cur: 'Library' });
    else if (B === 'RSL18B') html = noRooms();
    else if (B === 'RSL19') html = states();
    else if (B === 'RSL21') html = page(library(), { h: 1130, cur: 'Library', rail: propRail });
    else if (B === 'RSL21B') html = page(goneLib(), { h: 1080, cur: 'Library' });
    else if (MOB[B]) html = MOB[B]();
    else if (DOCS[B]) html = DOCS[B]();
    else html = page(room(true), { h: 900, cur: 'Diligence' });
    return { html: { __html: html } };
  }
}

</script>
