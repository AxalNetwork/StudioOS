    else if (B === 'LRD04B') html = phone(`${OBAR(0, true)}${MOUT({ cur: 0, done: [], focus: 0 })}`, { bar: PBAR(0), ann: `<div class="annb" style="right:10px;top:236px">${AN(3, 'focus moves here')}</div>` });

    /* ===== LRD04C · phone end of lesson 1 ===== */
    else if (B === 'LRD04C') html = phone(`${OBAR(0, false)}<main class="pbody" style="padding-top:0"><div class="rd"><div class="prose"><section class="rsx fb" style="padding-top:18px"><p>Go back to your three lines. A line passes if a stranger could find the record from what you wrote. If it fails, add the record, or narrow the claim until it matches what you can show.</p><p>You will reuse these three lines in the claim register, two lessons from now.</p></section>${SRC1}</div></div>${COMPLETE({ i: 0, focus: true })}<p class="foot" style="text-align:center;padding-bottom:96px">Lesson 1 of ${TOTAL} · end of reading</p></main>`, { bar: PBAR(0), ann: `<div class="annb" style="right:12px;top:628px">${AN(4, 'focused control sits above the bar')}</div><div class="annb" style="left:12px;top:700px">${AN('↕', 'bottom padding = bar height + 16px')}</div>` });

    /* ===== LRD04D · phone lesson 2 after Next ===== */
    else if (B === 'LRD04D') html = phone(`${OBAR(1, false)}<main class="pbody">${phHead(1)}<div class="rd"><div class="prose">${OUT2}${TRY2}</div></div></main>`, { bar: PBAR(1), ann: `<div class="annb" style="left:16px;top:640px">${AN(5, 'lesson 1 stays Not completed')}</div>` });

    /* ===== LRD05 · states ===== */
    else if (B === 'LRD05') {
      const sk = (w, h) => `<span class="sk" style="width:${w};height:${h || 12}px"></span>`;
      const card = (t, body, tag) => `<section class="stc"><div class="sth"><h3>${t}</h3>${tag || SYN}</div>${body}</section>`;
      html = crop(1400, `<h2 class="ct">Loading, empty, error and retry · each keeps the outline and navigation it can still trust</h2><div class="stg">
        ${card('Loading', `<p class="foot" role="status">Reading the lesson…</p>${sk('60%', 22)}${sk('90%')}${sk('84%')}${sk('70%')}<div style="height:8px"></div>${sk('40%', 16)}${sk('92%')}${sk('80%')}<p class="foot">No Mark complete, no position line until the course is read. The outline shows its own skeleton.</p>`)}
        ${card('Lesson text unavailable', `<div class="nt r"><span class="ic" aria-hidden="true">!</span><div>${UNB} The text of this lesson could not be read. This is not a claim that the lesson is empty.</div></div><div class="acts">${RETRY}</div><p class="foot">The course read worked, so the outline, the position and Previous/Next stay usable. Mark complete is hidden: nothing was read.</p>`)}
        ${card('Course outline unavailable', `<div class="nt r"><span class="ic" aria-hidden="true">!</span><div>${UNB} The course could not be read, so this lesson’s place in it is unknown.</div></div><div class="acts">${RETRY}<a class="btn t" href="#">Back to Learning</a></div><p class="foot">On main the lesson needs the course read first. No “Lesson ? of ?”: the position line is left out, not guessed.</p>`)}
        ${card('Reading has no text yet', `<div class="nt"><span class="ic" aria-hidden="true">—</span><div>${NRB('No text yet')} This reading has no text published yet.</div></div>${COMPLETE({ st: 'empty' })}<p class="foot">Visible reason beside the disabled button (main: “Nothing to complete yet”).</p>`)}
        ${card('Lesson not available', `<div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>Not available</b><br>The reading this lesson opens is not published.</div></div>${NAVROW(4)}<p class="foot">Previous and Next still work: the course is readable.</p>`)}
        ${card('Saving failed', `${COMPLETE({ st: 'error' })}<p class="foot">The button returns to Mark complete; the outline does not tick. Words come from the route’s refusal when it sends one.</p>`)}
        ${card('Offline', `<div class="nt a"><span class="ic" aria-hidden="true">!</span><div>You are offline. The text already loaded stays readable.</div></div>${COMPLETE({ st: 'offline' })}<p class="foot">Frontend only: <code>useOnline</code> exists; today a reading tries and shows the save error.</p>`)}
        ${card('No such lesson', `<div class="nt"><span class="ic" aria-hidden="true">○</span><div><b>No such lesson</b><br>This lesson does not exist, or it is not published yet.</div></div><div class="acts"><a class="btn" href="#">Back to ${COURSE}</a></div>`)}
        ${card('Outline open on a long course', `<p class="sub">The desktop outline scrolls with the page, not inside its own box, so no title is clipped. A module with more than 12 lessons collapses the modules you are not in, each with its count (“Module 2 · 5 lessons”).</p>`, SYN)}
      </div>`);
    }

    /* ===== LRD06 · focus order and accessible names ===== */
    else if (B === 'LRD06') html = `<div class="${CV} doc"><div><span class="eye">Learning · Lesson reader · #8665 · keyboard, focus and names</span><h2 style="font-size:22px;margin-top:4px">Focus order, accessible names and the outline disclosure</h2></div>
      <div class="cols">
      <div><h3>Desktop focus order (LRD01)</h3><ol style="list-style:decimal;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px">
        <li>Skip link “Skip to lesson text” (first in the page, visible on focus).</li><li>Shell: company switcher, sidebar, search, notifications, Account menu.</li><li>Back link “‹ ${COURSE}”.</li><li>Add to plan.</li><li>Links inside the reading (Source: “[Axal VC · Claim register guide], opens in a new tab”).</li><li>Mark complete: “Mark “${L1.t}” complete”.</li><li>Previous lesson (disabled on lesson 1: focusable, <code>aria-disabled</code>, name says why).</li><li>Next lesson: “Next lesson: ${L2.t}”.</li><li>Course outline: each lesson link; the current one has <code>aria-current="page"</code>.</li><li>Eadwyn (collapsed rail).</li></ol>
      <h3 style="margin-top:14px">Phone focus order (LRD04)</h3><ol style="list-style:decimal;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px">
        <li>Back “‹” named “Back to ${COURSE}”; Eadwyn; Account menu.</li><li>Outline toggle: <code>button</code>, “Course outline, lesson 1 of 10”, <code>aria-expanded</code>, <code>aria-controls="m-outline"</code>.</li><li>Lesson heading, reading links, Mark complete (in the page, after Source).</li><li>Fixed bar: Previous, Next. The bar comes last in the DOM, so reading order equals visual order.</li></ol></div>
      <div><h3>Outline disclosure, by keyboard</h3><ul>
        <li><span class="kbd">Enter</span> or <span class="kbd">Space</span> on the toggle opens the list in place (not a modal). Focus moves to the current lesson’s link (LRD04B).</li>
        <li><span class="kbd">Tab</span> moves through the lesson links in order; the last link leads back into the lesson text.</li>
        <li><span class="kbd">Esc</span>, or the toggle again, closes it and returns focus to the toggle; the reading position is where it was, so the next <span class="kbd">Tab</span> resumes in the text.</li>
        <li>Choosing a lesson closes the list and moves focus to the new lesson’s <code>h1</code>; the page title changes to the lesson title.</li></ul>
      <h3 style="margin-top:14px">Headings and landmarks</h3><ul><li><code>h1</code> lesson title → <code>h2</code> Outcome, Attempt first, Worked explanation, Feedback and transfer, Source → <code>h2</code> Course outline → <code>h3</code> modules. Glyphs are <code>aria-hidden</code>; labels like “Activity” are decorative repeats.</li><li><code>article</code> for the text; <code>nav</code> “Course outline”; <code>nav</code> “Lesson navigation”.</li><li>Saving and Completed are announced in a polite live region.</li></ul>
      <h3 style="margin-top:14px">Fixed bar and visibility</h3><ul><li>Bar height 74px plus the safe area; the page’s bottom padding is that plus 16px, so the last paragraph and Mark complete scroll fully above it (LRD04C).</li><li><code>scroll-padding-bottom</code> equals the bar, so a focused link is never under it.</li><li>Targets 48px on phone, 44px minimum everywhere; text zoom to 200% wraps titles, never truncates them.</li></ul></div></div></div>`;

    /* ===== LRD07 · dark ===== */
    else if (B === 'LRD07') html = shell(reader(0, {}), { h: 1880 });
    else if (B === 'LRD07B') html = phone(`${OBAR(0, true)}${MOUT({ cur: 0, done: [], started: [] })}`, { bar: PBAR(0) });

    /* ===== LRD08 · wrapping long titles ===== */
    else if (B === 'LRD08') {
      const LONG = '[Example: a seed deck’s claim register, annotated line by line, with the sources an investor asked for]';
      const one = (w, cur) => `<ul class="ol" style="padding:0;overflow:hidden;width:${w}px">${oRow(Object.assign({}, ALL[3], { t: LONG }), 3, { cur: cur ? 3 : -1, done: [] })}${oRow(ALL[4], 4, { cur: -1, done: [] })}</ul>`;
      html = crop(1300, `<h2 class="ct">Wrapping · long titles in the outline, the header and the navigation ${SYN}</h2><div class="vgrid" style="grid-template-columns:auto auto minmax(0,1fr);align-items:start">
        <section class="stc"><h3>Desktop outline · 340px</h3>${one(306, true)}<p class="foot" style="max-width:306px">Titles wrap under the title, never beside a length column. No line clamp; three lines is fine.</p></section>
        <section class="stc"><h3>Phone outline · 390px</h3>${one(358, false)}<p class="foot" style="max-width:358px">Rows keep a 48px minimum; the meta line wraps as a second line.</p></section>
        <section class="stc"><h3>Header and navigation</h3><header class="lh" style="display:block"><span class="eye">Learning · Reading · Optional</span><h1 style="font-size:26px">${LONG}</h1></header>${NAVROW(3).replace(ALL[3].t, LONG)}<p class="foot">The <code>h1</code> wraps at 760px; Previous and Next keep their direction word on the first line and wrap the title below.</p></section></div>`);
    }

    /* ===== LRD09 · handoff ===== */
    else if (B === 'LRD09') html = `<div class="${CV} doc"><div><span class="eye">Learning · Lesson reader · #8665 · engineering handoff</span><h2 style="font-size:22px;margin-top:4px">What main has, what is frontend only, what needs data, and what the owner decides</h2></div>
      <div class="cols">
      <div><h3>Checked on main (7b0db10927)</h3><ul>
        <li><code>pages/learning/LessonPlayer.jsx</code>: <code>ReadingArea</code> renders the item’s Markdown with <code>ReactMarkdown</code> inside <code>prose prose-sm max-w-[680px]</code>.</li>
        <li><code>package.json</code> / <code>index.css</code>: Tailwind 4, no <code>@tailwindcss/typography</code> and no <code>@plugin</code> line, so <code>prose</code> styles nothing. Preflight resets heading size and margin: the observed run-in headings.</li>
        <li><code>LearningWired.jsx</code> <code>LessonPage</code>: <code>MarkCompleteButton</code> in the header <i>and</i> <code>LessonFooter</code>’s, which is <code>position: fixed</code> below 640px (<code>lessonFooter.css</code>): the two purple buttons at 390.</li>
        <li><code>LessonView</code>: <code>xl:grid-cols-[minmax(0,1fr)_18rem]</code>; the outline is <code>CourseOutline compact</code>.</li>
        <li><code>CourseOutline.jsx</code>: <code>lengthsSent</code> tests <code>'duration_seconds' in l</code>. <code>GET /api/learning/courses/:slug</code> (<code>routes/learning.ts</code>) always sends the key (null when the item has none), so every row gets “Length not recorded”.</li>
        <li><code>lessonFooterModel.js</code> <code>lessonPositionLine</code>: “Lesson {index+1} of {total} in {module}”, with <code>findLesson</code>’s course-wide index and total.</li>
        <li><code>LessonStep</code>: a <code>Link</code>; Next records nothing. <code>POST /api/learning/progress</code> takes <code>started</code> or <code>completed</code> only; exercise and exam lessons answer 409 <code>completed_by_result</code>. A lesson row carries <code>required</code>, <code>progress.status</code> and <code>completed_at</code>.</li>
        <li><code>recordLessonStarted</code> runs from a video’s first position only; a reading never records Started.</li></ul>
      <h3 style="margin-top:12px">Frontend only</h3><ul>
        <li>Reading styles for <code>.lesson-reading</code> (or add the typography plugin): measure 640px, 16px/1.7, <code>h2</code> 20px/800 with 36px above, lists, links; role treatment for the five known heading names via a ReactMarkdown <code>h2</code> component (LRD01, LRD03).</li>
        <li>Source links open in a new tab with “opens in a new tab” in their name.</li>
        <li>One completion control: drop it from the header; keep it after the text at every width; the phone bar keeps Previous and Next only (LRD01B, LRD04C).</li>
        <li>Position with both denominators, computed from the modules already read (LRD01, LRD04).</li>
        <li>Outline: 340px column, titles full width, no length cell when every length is null (test values, not keys), status glyph + word, current row <code>aria-current="page"</code> (LRD01, LRD03, LRD08).</li>
        <li>Phone outline disclosure, focus handling, bottom padding and <code>scroll-padding-bottom</code> (LRD04B, LRD04C, LRD06).</li>
        <li>Offline: disable Mark complete with its reason (LRD05).</li></ul></div>
      <div><h3>Needs data or backend (◇)</h3><ul>
        <li>Undo a completion: the progress route cannot move <code>completed</code> back ${TB('#8288')}.</li>
        <li>Reading time: every reading here has <code>duration_seconds</code> null; it shows “Not recorded” once. Authors can set it in Studio; no estimate is computed ${TB('data · #8288')}.</li>
        <li>Author-declared section roles (option B of Q2) ${TB('proposed')}.</li>
        <li>Resume reading at the last scroll position across devices: not drawn ${TB('proposed')}.</li></ul>
      <h3 style="margin-top:12px">Owner questions (⚑) · option A drawn</h3><ul>
        <li>${TO('Q1')} Where does completion live? <b>A</b>: once, after the text, at every width; the phone bar is navigation only. B: in the phone bar, removed from the text.</li>
        <li>${TO('Q2')} How are section roles known? <b>A</b>: the reader recognises the five template headings by exact text; anything else is a plain <code>h2</code>. B: authors tag roles in Studio (◇).</li>
        <li>${TO('Q3')} Should opening a reading record Started (the route exists)? <b>A</b>: no, the outline shows Started only where main records it today. B: record it on open.</li></ul>
      <h3 style="margin-top:12px">Acceptance (#8665) → boards</h3><ul>
        <li>☐ Instructions, example, feedback and source are distinct at desktop and 390; heading semantics survive → LRD01, LRD04, LRD04C, LRD03, LRD06.</li>
        <li>☐ Current lesson, real title, optional status and completion readable in the outline without narrow stacks → LRD01, LRD02, LRD04B, LRD03, LRD08.</li>
        <li>☐ Keyboard opens/closes the outline and resumes reading → LRD04B, LRD06. The fixed footer leaves the last paragraph and focused controls visible → LRD04C, LRD06. Next never implies completion → LRD02, LRD04D, LRD01B.</li></ul>
      <h3 style="margin-top:12px">Coordination</h3><ul><li>#8288 carries the release work. Sibling canvases share the catalogue: LCO (#8664) owns Start and the full syllabus, LEW (#8666) the exercise page, LEX (#8667) the exam. Bracketed lesson titles are synthetic placeholders to be reconciled with the seeded course.</li><li>Dark mode: LRD07, LRD07B. Prior umbrella #3726.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lrd-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
