      PRS17C: () => phone('Reporting settings', '<div class="prs-gh"><h4>Monthly · 4</h4></div><ol class="prs-mlist">' + J(F1.slice(0, 2).map(mcard)) + '</ol>', {
        sheet: '<div class="dim2"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms" style="max-height:700px"><div class="grab" aria-hidden="true"></div><div style="padding:8px 18px 22px;display:flex;flex-direction:column;gap:12px"><h2 id="ms" style="font-size:17px;font-weight:800;margin:0">Edit Runway</h2>'
          + '<div class="fld"><label>Name</label><div class="ta prs-in" style="min-height:44px">Runway</div></div><div class="fld"><label>Key</label><div class="ta prs-in mo ro" style="min-height:44px">' + SH.lk + ' runway_months · read-only</div></div><div class="fld"><label>Definition</label><div class="ta" style="min-height:60px">Cash balance divided by trailing three-month average net burn.</div></div>'
          + '<div class="fld"><label>Unit</label>' + segs('Unit', ['USD', '%', 'count', 'months'], 'months').replace('class="seg"', 'class="seg prs-mseg"') + '</div><div class="fld"><label>Cadence</label>' + segs('Cadence', ['Monthly', 'Quarterly'], 'Monthly').replace('class="seg"', 'class="seg prs-mseg"') + '</div>'
          + '<div class="prs-2c"><span class="prs-sw" role="switch" aria-checked="true" style="min-height:44px"><i></i>Required</span><div class="ta prs-in" style="min-height:44px">All companies ▾</div></div><button type="button" class="btn p" style="min-height:48px">Save figure</button></div></div>' })
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>PF-19 · Backend fit and handoff · Reporting settings (#6213)</h1><p>Checked on main <code>6d7712c6d1</code> (14 Nov 2026); the brief was written on <code>45e7c55fa6</code>. Each value on PF-13 to PF-18, the read that answers it, the column it is stored in, and its marker. The Worker’s <code>.catch</code> on the definitions query is what turns a failed read into an empty set. ◇ = needs backend work (#6213, implementation #6214). ⚑ = owner decision, drawn as option A.</p>'
      + tbl(['Value on screen', 'Read', 'Stored in', 'Missing / fails', 'Marker'], [
        ['KPI name', '<code>GET /api/positions/kpi-compliance</code> → <code>kpi_set[].name</code> (<code>api.positionsKpiCompliance</code>)', '<code>portfolio_kpi_definitions.name</code>', 'never blank · a failed read comes back as <code>kpi_set: []</code> (<code>.catch(() =&gt; ({ results: [] }))</code>), same defect as #5847', '◇ report the failure'],
        ['Definition', 'same · <code>kpi_set[].definition</code>', '<code>.definition</code> (nullable)', '“No definition recorded”', 'Frontend'],
        ['Unit', 'same · <code>kpi_set[].unit</code>', '<code>.unit</code> (nullable)', '“No unit”', 'Frontend'],
        ['Cadence per KPI', 'same · one cadence per call (<code>?cadence=</code>, <code>WHERE cadence = ?</code>): two reads, each can fail alone', '<code>.cadence</code>', 'Partial state (PF-16)', 'Frontend'],
        ['Required / Optional', 'same · <code>kpi_set[].required</code>', '<code>.required</code>', '—', 'Frontend'],
        ['Applies to', 'same · <code>kpi_set[].applies_to</code>', '<code>.applies_to</code>: <code>all</code> or a <code>projects.stage</code> key', '—', 'Frontend'],
        ['Order', 'same · <code>kpi_set[].sort_order</code>', '<code>.sort_order</code>', '—', 'Frontend (write ◇)'],
        ['Period measured', 'same · <code>period</code>, <code>period_until</code>, <code>period_complete</code>, <code>timezone: UTC</code>', 'derived from today', '—', 'Frontend'],
        ['Companies (names)', 'same · <code>companies[].name</code>', '<code>portfolio_positions</code> × <code>projects.name</code>', 'whole book, no fund per company', 'Frontend'],
        ['Fund / switcher', '<code>GET /api/funds</code> (<code>can_manage</code>, <code>relationship</code>)', '<code>vc_funds</code>; rule set by <code>fund_id</code>', 'NULL = HQ set', '⚑ Q1'],
        ['Last changed', 'not selected by <code>kpi-compliance</code>', '<code>.updated_at</code>', '—', '◇ add to the read'],
        ['Changed by', '—', 'not stored', '—', '◇ <code>updated_by</code> column'],
        ['Due day', '—', 'not stored', '“No due day set”', '◇ column · ⚑ Q2 (one decision with #6204)'],
        ['Applies from', '—', 'not stored; today’s set measures any period, including a past <code>?period=</code>', '—', '◇ effective-from or set history (#6214 acceptance)'],
        ['A fund’s own set', 'never read: <code>kpi-compliance</code> and <code>research.ts</code> read <code>WHERE fund_id IS NULL</code>', '<code>.fund_id</code>, <code>UNIQUE (fund_id, kpi_key)</code> (migration 168)', '—', '◇ read the fund set, fall back to HQ'],
        ['Companies in one fund, stage', 'not returned', '<code>portfolio_positions.fund_id</code>, <code>projects.stage</code>', '—', '◇'],
        ['Save rules / Save figure', 'no route writes the table (<code>investor_portfolio_ip2.test.mjs</code> checks there is none)', '—', 'conflict needs a precondition on <code>updated_at</code>', '◇ write route'],
        ['Who may edit', '<code>positionScope</code> (<code>positions.ts</code>): admin, licensed investor (<code>canViewLpData</code>) or GP of record (<code>managedFundIds</code>); anyone else 403', '—', 'Refused (PF-16)', '⚑ Q1 narrows edit to GP / admin']])
      + '<div class="cols"><div><h2>Backend required (◇)</h2><p>1. A write route for <code>portfolio_kpi_definitions</code> that refuses a duplicate key itself: <code>UNIQUE (fund_id, kpi_key)</code> does not hold for the HQ set, because SQLite treats NULLs as distinct. 2. <code>kpi-compliance</code> reads the fund’s own set and falls back to HQ. 3. <code>updated_at</code> in the read; 4. an <code>updated_by</code> column; 5. a due-day column (with #6204); 6. an effective-from period or set history; 7. stage and fund per company; 8. an <code>updated_at</code> precondition for the conflict; 9. a failed read reported as a failure; 10. <code>KPI_RULES_REQUIRED</code> in <code>services/reportFigures.ts</code> and its frontend twin in <code>pages/cycles/reporting/deskModel.js</code> read the table instead of a hard-coded copy of the seed. A fund’s own set needs no new table.</p></div>'
      + '<div><h2>Frontend only</h2><p>The sheet over <code>/portfolio/updates</code> (no new route); the toolbar row <code>Edit rules</code> in <code>investorZoneActions.js</code> (marked unbuilt today) renamed <b>Reporting settings</b>; two cadence reads with their own loading, Unreadable and Partial (today <code>InvestorPortfolioUpdates.jsx</code> calls <code>api.positionsKpiCompliance()</code> with its default, quarterly, so the monthly set is never read on Reports); Not recorded words; read-only for a licensed investor who runs no fund; the 640 edit dialog with client-side duplicate-key check; phone page with Move up / Move down; dark tokens. Handoff: Save or Close returns to Reports with the <b>Rules</b> chip selected and the period kept.</p></div></div>'
      + '<h2>Owner questions (drawn as A)</h2><p>Q1 who sets the rules: A per fund by its GP, inheriting the HQ set admins edit. Q2 due day: A with the rule set, an HQ default a fund can override (the #6204 decision). Q3 where: A a sheet over /portfolio/updates. Q4 coverage: A all companies or one stage. Q5 when a change takes effect: A from the period in progress. If Q1 is B, the fund switcher and the Inherited chips go, and the HQ set is the only editable set.</p>'
      + '<h2>Accessibility</h2><p>The sheet is a modal dialog with a labelled h2, focus moves in on open and returns to the toolbar button. Required and Optional are words with filled and hollow glyphs; Inherited has its own glyph and dashed border. Reorder is a drag handle with Alt+Arrow keys on desktop and Move up / Move down on phone. Field errors name the figure that holds the key and are tied with aria-describedby. Async results use role="status" and role="alert". Phone targets are 44px, Save is 48px.</p>');

    /* ---------- boards ---------- */
    const H = 1360;
    let html = '';
    if (B === 'PRS13') html = page(reports(), { h: H, rail: eadwyn(), overlay: sheet({ edit: true }) });
    else if (B === 'PRS13B') html = crop(dlg({ title: 'Edit ARR', name: 'ARR', key: 'arr', def: 'Annualised run-rate of committed recurring revenue at period end.', unit: 'USD', cad: 'Quarterly', req: 1, ap: 'Series A', note: 'Narrowing ARR to Series A changes who owes it from 2026-Q4; 2026-Q3 keeps the rule in force then ◇.' }), 680);
    else if (B === 'PRS13C') html = crop(dlg({ title: 'Add a figure', isNew: true, name: 'Burn', key: 'net_burn', err: 'Net burn already uses the key net_burn in this set. Choose another key, or edit Net burn.', def: 'Cash out minus cash in for the month.', unit: 'USD', cad: 'Monthly', req: 1, ap: 'All companies' }), 680);
    else if (B === 'PRS14') html = page(reports(), { h: H, ini: 'SL', overlay: sheet({ ro: true, multi: false }) });
    else if (B === 'PRS15') html = page(reports(), { h: 1000, overlay: sheet({ fund: FUND2, src: 'inh', set: HQ, inhList: true, top: '<button type="button" class="btn p" style="align-self:flex-start">Make these this fund’s rules</button><p class="foot" style="margin:0">Copies the 8 HQ figures into ' + FUND2 + ' so they can be edited. Until then HQ changes reach this fund. ' + ENG('fund set read') + '</p>', noTail: true, foot: '<div class="prs-btns"><span class="raw">' + FUND2 + ' has no rules of its own</span><button type="button" class="btn">Close</button></div>' }) });
    else if (B === 'PRS15B') html = page(reports(), { h: 900, ini: 'HQ', overlay: sheet({ hq: true, src: 'hq', body: '<div class="prs-empty"><span class="eye">HQ default · 0 figures · read OK</span><h3>No figures are required yet.</h3><p class="prs-p">Companies are not held to any report.</p><button type="button" class="btn p">Add a figure</button></div>', foot: '<div class="prs-btns"><span class="raw">Admin view</span><button type="button" class="btn">Close</button></div>' }) });
    else if (B === 'PRS16') html = page(reports(), { h: 1120, overlay: sheet({ edit: true, fail: 'Quarterly', status: st('Partial', 'Save waits for the quarterly read'), noTail: false }) });
    else if (B === 'PRS16B') html = states();
    else if (B === 'PRS16C') html = conflict();
    else if (B === 'PRS16D') html = page(rulesView(), { h: 900 });
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'PRS18') html = page(reports(), { h: H, rail: eadwyn({ short: true }), overlay: sheet({ edit: true }) });
    else if (B === 'PRS18B') html = states();
    else if (B === 'PRS19') html = handoff();
    else html = page(reports(), { h: H, rail: eadwyn(), overlay: sheet({ edit: true }) });
    return { html: { __html: html } };
  }
}

</script>
