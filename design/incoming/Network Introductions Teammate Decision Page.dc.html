<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": "1440px", "height": "1000px"}, "board": {"editor": "enum", "default": "NIT02", "options": ["NIT01", "NIT01B", "NIT02", "NIT02B", "NIT03", "NIT03B", "NIT03C", "NIT04", "NIT04B", "NIT04C", "NIT05", "NIT05B", "NIT06", "NIT06B", "NIT07", "NIT08", "NIT09A", "NIT09B", "NIT09C", "NIT09D", "NIT09E", "NIT09F", "NIT09G", "NIT09H", "NIT09I", "NIT10", "NIT10B", "NIT11", "NITH"]}}'>
class Component extends DCLogic {
  renderVals() {
    const B = this.props.board || 'NIT02';
    /* NIT10 boards draw on the dark tokens; everything else is light. */
    const dark = B.indexOf('NIT10') === 0;
    const CV = 'cv' + (dark ? ' dk' : '');
    const J = (a) => a.join('');
    const mo = (s) => `<span class="mo">${s}</span>`;

    /* ---------- annotations (not product copy) ---------- */
    const TB = (t) => `<span class="bk" title="Needs backend work">◇ ${t}</span>`;
    const TO = (t) => `<span class="ow" title="Owner decision">⚑ ${t}</span>`;
    const LBL = (t) => `<span class="lbl">${t}</span>`;
    /* frame card: role, entry point, next action, data dependency */
    const FA = (role, entry, next, data) => `<div class="fra" aria-hidden="true"><span><i>Role</i>${role}</span><span><i>Entry</i>${entry}</span><span><i>Next</i>${next}</span><span><i>Data</i>${data}</span></div>`;

    /* ---------- NW5 / D5129 state words: each has a glyph and a word ---------- */
    const NR = (t) => `<span class="s">— Not recorded${t ? ' · ' + t : ''}</span>`;
    const UR = (t) => `<span class="s ur">? Could not be read${t ? ' · ' + t : ''}</span>`;
    const NONE = (t) => `<span class="s">○ None${t ? ' · ' + t : ''}</span>`;
    const RF = (t) => `<span class="s rf">⊘ Refused${t ? ' · ' + t : ''}</span>`;
    const E = `<span class="em" aria-hidden="true">E</span>`;
    const bell = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

    /* ---------- sample data: fictional; every figure agrees on every board ----------
       Today Mon 16 Nov 2026. [Jules Avery] asks teammate [Ari Lane] to introduce him to [Morgan Vale],
       Head of Platform at [Tidepool Labs]. Requested 2026-11-12 09:14 · accepted 2026-11-13 16:40 ·
       sent from Ari's mailbox 2026-11-14 10:31 · Made 2026-11-14 10:31 · outcome Meeting held, recorded by
       Jules 2026-11-16 09:05 · Jules's follow-up due 2026-11-16 (snooze → 2026-11-23). Team request:
       0 introduction credits. Eadwyn intro draft quote: holds up to [$0.0140]. */
    const JU = '[Jules Avery]', AR = '[Ari Lane]', MV = '[Morgan Vale]', TP = '[Tidepool Labs]';
    const NOTE = '“We’re weighing a seed in a platform-tools startup. Morgan ran platform at [Tidepool Labs]; twenty minutes of her view would help.”';
    const CTX = '“Jules leads platform deals at [Harbor Lane Capital].”';
    const DNOTE = '“Happy to. I’ll write it tomorrow morning.”';
    const SUBJ = 'Intro: Morgan ([Tidepool Labs]) ↔ Jules';
    const FROM = 'ari@[harborlane].example';
    const TO_ = 'morgan@[tidepool].example';
    const QUOTE = 'Holds up to <b class="mo">[$0.0140]</b> in AI tokens. Nothing is charged until you confirm.';
    const ZERO = 'A team introduction uses <b class="mo">0</b> introduction credits.';
    const BODY = ['Hi Morgan,', '', 'I’d like to introduce you to [Jules Avery].', '', 'Jules leads platform deals at [Harbor Lane Capital].', '', 'I’ll let you two take it from here.', '', 'Ari'];

    /* ---------- shell (copied from nwi.js): company switcher top-left, sidebar = held licences, Account menu holds Portfolio, Companies, Licences ---------- */
    const NAVS = { i: ['Home', 'Deals', 'Portfolio', 'Axal VC Fund', 'Network', 'Research', '|', 'Trust', 'Firm Settings'], a: ['Home', 'Network', 'Research', '|', 'Admin console'] };
    const SW = { i: '[Harbor Lane Capital]', a: '[Axal HQ]' };
    const GRP = { i: 'Investor', a: 'HQ' };
    const side = (r) => `<aside class="sd"><div class="lg"><span class="logo" aria-hidden="true"></span>Axal VC</div><button type="button" class="sw2" aria-haspopup="listbox" aria-label="Switch company or project: ${SW[r]}">${SW[r]} <span aria-hidden="true">▾</span></button><span class="eye grp">${GRP[r]}</span><nav aria-label="${GRP[r]}">${J(NAVS[r].map((t) => t === '|' ? '<div class="sep"></div>' : `<a href="#"${t === 'Network' ? ' aria-current="page"' : ''}>${t}</a>`))}</nav></aside>`;
    const top = (ini, dot) => `<div class="tb"><div class="srch"><span aria-hidden="true">⌕</span>Search StudioOS</div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="ib bl" aria-label="Notifications${dot ? ', 1 unread' : ''}"${dot === 'open' ? ' aria-expanded="true"' : ''}>${bell}${dot ? '<span class="dot" aria-hidden="true">1</span>' : ''}</button><button type="button" class="av" style="border:0" aria-label="Account menu: Portfolio, Companies, Licences">${ini}</button></div></div>`;
    const RAILC = (t) => `<aside class="sp" aria-label="Eadwyn"><button type="button" class="e" aria-label="Expand Eadwyn" aria-expanded="false">E</button><span class="vt" aria-hidden="true">${t || 'Ask about this introduction'}</span></aside>`;
    const shell = (body, o) => {
      o = o || {};
      const h = o.h || 1000;
      return `<div class="${CV}" style="width:1440px">${o.ann || ''}<div style="position:relative;min-height:${h}px">${o.banner || ''}<div class="sh" style="min-height:${h}px">${side(o.r || 'i')}<div class="mn">${top(o.ini || 'AL', o.dot)}<main class="bd">${body}</main></div>${RAILC(o.railT)}</div>${o.overlay ? (o.nodim ? '' : '<div class="dim" aria-hidden="true"></div>') + o.overlay : ''}</div></div>`;
    };
    const TABS = (cur) => `<nav class="ptabs" aria-label="Network">${J(['Overview', 'Relationships', 'Introductions', 'Organizations'].map((t) => `<a href="#"${t === cur ? ' aria-current="page"' : ''}>${t}</a>`))}</nav>`;
    const HEAD = (o) => `<header class="hdr"><span class="eye">Network · Relationship intelligence</span><div class="hrow"><div><h1>Introductions</h1><p>Requests between teammates, matches Axal curates for you, and the asks your tier allows. Three sources, never one count.</p></div><div class="acts"><button type="button" class="btn ask">${E}Ask</button><button type="button" class="btn p">Request introduction</button></div></div></header>${TABS('Introductions')}`;

    /* ---------- the Introductions desk behind the Sheet (decision and compose no longer live on the card) ---------- */
    const DESK = (who, o) => {
      o = o || {};
      const tm = who === 'tm';
      const asked = tm ? `<section class="cd" aria-labelledby="ay"><div class="ch"><h2 id="ay">Asked of you · 1</h2><span class="sm">from your team · no credit is used</span></div>
        <div class="pr${o.hl ? ' hl' : ''}"><span class="av">JA</span><div><b>${JU} asks you to introduce him to ${MV}</b><small>${TP} · requested ${mo('2026-11-12')}</small></div><div class="acts">${o.st || '<span class="pl a">! Your decision</span>'}<a class="btn" href="#">Open record</a></div></div></section>` : '';
      const rows = [
        tm ? ['JA', `${JU} → ${MV}, via you`, 'Received', o.st || '<span class="pl a">! Your decision</span>'] : ['AL', `You → ${MV}, via ${AR}`, 'Sent', o.st || '<span class="pl">◷ Asked · waiting on Ari</span>'],
        ['TG', tm ? `[Theo Grant] → [Hugo Brandt], via you` : `You → [Priya Nair], via [Dev Varma]`, tm ? 'Received' : 'Sent', '<span class="pl g">✓✓ Made 2026-10-28</span>'],
        ['SH', tm ? `You → [Ada Okafor], via [Sara Holm]` : `You → [Hugo Brandt], via [Theo Grant]`, 'Sent', '<span class="pl">◌ Not now</span>']
      ];
      return `${HEAD()}${asked}<section class="cd" aria-labelledby="lg"><div class="ch"><h2 id="lg">From your team · log</h2><span class="sm">${tm ? '2 received · 1 sent' : '3 sent'}</span></div>
        <table class="tbl"><thead><tr><th scope="col">Request</th><th scope="col">Side</th><th scope="col">Status</th><th scope="col"></th></tr></thead><tbody>${J(rows.map((r, i) => `<tr${i === 0 && o.hl ? ' class="cur"' : ''}><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td><a class="btn t" href="#">Open record</a></td></tr>`))}</tbody></table></section>`;
    };

    /* ---------- the shared record Sheet (IntroRecordSheet.jsx), with the decision and compose moved in ---------- */
    const STEPS = ['Requested', 'Decided', 'Accepted', 'Made', 'Outcome'];
    const LIFE = (n, end) => `<section aria-label="Lifecycle" class="lcw"><h3 class="eye">Lifecycle · recorded states only</h3><ol class="lc">${J(STEPS.map((s, i) => {
      const st = i < n ? 'd' : end ? 'e' : 't';
      const lab = end === 'declined' && i === 1 ? 'Declined' : s;
      return `<li class="cp ${st}">${st === 'd' ? '✓' : st === 'e' ? '–' : '○'} ${lab}</li>`;
    }))}</ol></section>`;
    const NEXT = (actor, text, me) => `<div class="nxa${me ? ' me' : ''}" role="status"><span class="eye">Next</span><span class="who">${me ? '▶ ' : '◷ '}${actor}</span><span class="wt">${text}</span></div>`;
    const TL = (rows) => `<section aria-label="Record"><h3 class="eye" style="margin-bottom:4px">Record</h3><ul class="tl">${J(rows.map((r) => `<li><span class="mk ${r[0] ? 'ok' : 'no'}" aria-hidden="true">${r[0] ? '✓' : '○'}</span><div><b>${r[1]}</b>${r[2] ? `<div class="foot">${r[2]}</div>` : ''}</div><span class="w">${r[3] || '—'}</span></li>`))}</ul></section>`;
    const PEOPLE = (tm) => `<section aria-label="People" class="ppl"><span><i>Target</i>${MV} · Head of Platform, ${TP}</span><span><i>Introducer</i>${tm ? 'You' : AR + ' · your teammate'}</span><span><i>Requester</i>${tm ? JU : 'You'}</span></section>`;
    const CREDL = `<p class="foot crl">${ZERO} Curated matches use credits; this does not.</p>`;
    const SHEET = (o) => `<aside class="sheet-r" role="dialog" aria-modal="true" aria-labelledby="rs" style="width:${o.w || 640}px">
      <div class="dh"><div><span class="eye">${o.tm ? 'Introduction · asked of you' : 'Introduction · you asked'}</span><h2 id="rs">${o.tm ? `${JU} → ${MV}, via you` : `You → ${MV}, via ${AR}`}</h2><p class="sub">Requested ${mo('2026-11-12')} · ${MV} · ${TP}</p></div><button type="button" class="ib" aria-label="Close introduction record">✕</button></div>
      <div class="dc">${o.next}${o.top || ''}${o.life}${o.body || ''}${o.tl || ''}${o.ppl === false ? '' : PEOPLE(o.tm)}${CREDL}</div>
      ${o.foot ? `<div class="df">${o.foot}</div>` : ''}</aside>`;

    /* timeline rows: [recorded, title, note, at] */
    const R_REQ = (tm) => [1, `Requested by ${tm ? JU : 'you'}`, NOTE, '2026-11-12 09:14'];
    const R_ACC = (tm) => [1, `Accepted by ${tm ? 'you' : AR}`, DNOTE + ' · the requester reads this note', '2026-11-13 16:40'];
    const R_MADE0 = [0, 'Made', 'Not recorded yet', ''];
    const R_OUT0 = [0, 'Outcome · meeting held, replied, no reply or not a fit', 'Optional · either of you records it after the introduction is made', ''];
    const R_EMAIL_T = (line) => [0, 'Introduction email', line || 'Not sent yet. Write it from your mailbox; sending it records Made.', ''];
    const R_EMAIL_A = [0, 'Introduction email · sent from the introducer’s own mailbox', 'Made is recorded when Ari sends it or records it. Their mailbox is theirs; this record does not read it.', ''];

    /* decision block (moved in from Asked of you) */
    const DECIDE = (o) => {
      o = o || {};
      return `<section class="act" aria-labelledby="yd"><h3 id="yd">Your decision</h3><div class="f"><label for="dn">Note to ${JU} (optional)</label><span id="dn" class="in ta${o.txt ? '' : ' hint'}">${o.txt || 'Add a note…'}</span><span class="cnt">${o.txt ? '64' : '0'} / 1,000</span></div>
        <p class="rd">◉ <b>${JU} will read this note</b>, whether you accept or say Not now. Nobody else on your team sees it.</p>${o.extra || ''}</section>`;
    };
    /* compose entry (after Accept) */
    const WRITEBOX = (o) => {
      o = o || {};
      return `<section class="act" aria-labelledby="wi"><h3 id="wi">Write the introduction</h3>
        <p class="sub">It goes from your own connected mailbox, to the address you choose. Axal sends nothing itself. Sending it records Made.</p>
        <div class="mb"><span class="eye">From</span><b class="mo">${FROM}</b><span class="pl g">✓ Connected</span></div>
        <div class="draft"><div class="cost"><span>Ask Eadwyn to draft the intro</span><b>${QUOTE.replace(' Nothing is charged until you confirm.', '')}</b></div><p class="foot">Nothing is charged until you confirm. Eadwyn proposes a subject and body; you review, edit or discard it.</p><div class="acts"><button type="button" class="btn">Draft the intro · confirm quote</button><button type="button" class="btn t">Not now</button></div></div>
        <p class="foot">Or write it yourself: Write introduction opens the composer with a starting subject and body.</p></section>`;
    };

    /* ---------- composer inside the Sheet (RecordCompose, opened from the record) ---------- */
    const COMPOSER = (o) => {
      o = o || {};

        <div class="f"><label>From</label><span class="in mo">${FROM}</span></div>
        <div class="f"><label for="to">To · recipient</label><span id="to" class="in mo${o.noTo ? ' hint' : ''}">${o.noTo ? 'Type the address you want to use' : TO_}</span>${o.noTo ? '' : '<span class="foot">You chose this address. Axal does not look it up or store it on the request.</span>'}</div>
        <div class="f"><label for="sj">Subject</label><span id="sj" class="in">${SUBJ}</span></div>
        <div class="f"><label for="bo">Body · editable</label><span id="bo" class="in ta big">${J(BODY.map((l) => l ? `${l}<br>` : '<br>'))}</span></div>
        ${o.err || ''}</section>`;
    };
    const SENDCONF = `<div class="panel" role="alertdialog" aria-labelledby="sc" style="width:440px"><div class="dh"><div><span class="eye">Review and send</span><h2 id="sc">Send this introduction?</h2></div><button type="button" class="ib" aria-label="Back to the draft">✕</button></div><div class="dc">
      <dl class="rv"><dt>From</dt><dd class="mo">${FROM}</dd><dt>To</dt><dd class="mo">${TO_}</dd><dt>Subject</dt><dd>${SUBJ}</dd><dt>Record</dt><dd>Sending records the request as <b>Made</b>. Nothing else is sent, and ${JU} is told it was made.</dd><dt>Cost</dt><dd><b class="mo">0</b> introduction credits</dd></dl></div>
      <div class="df"><button type="button" class="btn t">Back to the draft</button><button type="button" class="btn p">Send from your mailbox</button></div></div>`;

    else if (B === 'NIT06') html = shell(DESK('ask', { hl: 1, st: '<span class="pl g">✓✓ Made 2026-11-14</span>' }), { h: 1000, ini: 'JA', overlay: SHEET({

      ${stc('Unavailable', 'Could not be read', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div><b>This record could not be read. Nothing is shown in its place.</b></div></div><button type="button" class="btn" style="align-self:flex-start">Try again</button>`, 'c3')}
      ${stc('Refused · support session', 'Not available here', `<p class="sub">${RF('support session')}</p><p class="sub">A support session cannot read or change a member’s shared relationships.</p><p class="foot">403 <code>support_session_refused</code>. No names, status or dates are shown.</p>`, 'c3')}
      ${stc('Not a participant', 'Not found', `<p class="sub">That introduction request is no longer on your desk.</p><p class="foot">404 for anyone but the two people on it, including HQ. It never says it exists.</p>`, 'c3')}
      ${stc('Asked of you · verified empty', 'Asked of you', `<p class="sub">${NONE()} Nobody has asked you for an introduction.</p>`, 'c3')}
      ${stc('Missing optional fields', 'Recorded without a note', `<dl class="rv"><dt>Note</dt><dd>${NONE('Jules left no note')}</dd><dt>Company</dt><dd>${NR()}</dd><dt>Decision note</dt><dd>${NONE()}</dd></dl>`, 'c3')}
      ${stc('Mailbox · could not be read', 'Your mailboxes could not be read', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">?</span><div>Write introduction is held until the read works. Your decision stands.</div></div><button type="button" class="btn" style="align-self:flex-start">Try again</button>`, 'c3')}
      ${stc('Mailbox · none connected', 'No mailbox connected', `<p class="sub">${NONE('no mailbox')}. Connect one to send from it. Axal never sends for you.</p><div class="acts"><a class="btn" href="#">Connect a mailbox</a></div><p class="foot">Shown only after a successful empty read.</p>`, 'c3')}
      ${stc('Send failed · draft kept', 'Not sent', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div>The email was not sent. Your subject and body are kept. Nothing was recorded.</div></div><div class="acts"><button type="button" class="btn">Try again</button><button type="button" class="btn t">Edit draft</button></div>`, 'c4')}
      ${stc('Decision failed · note kept', 'Not saved', `<div class="nt r" role="alert"><span class="ic" aria-hidden="true">!</span><div>That could not be saved. Nothing changed.</div></div><span class="in ta">“Happy to. I’ll write it tomorrow morning.”</span><button type="button" class="btn" style="align-self:flex-start">Try again</button>`, 'c4')}
      ${stc('Offline', 'You are offline', `<div class="nt a" role="status"><span class="ic" aria-hidden="true">!</span><div>Accept, Not now, Send and Update the record wait until you reconnect. Nothing is queued to send.</div></div><p class="foot">The record shown is the last read · ◷ Stale, read ${mo('09:12')}.</p>`, 'c4')}</div>`);

    /* ===== Tablet 768 ===== */
    else if (B === 'NIT08') html = `<div class="${CV} tab">${phTop('Introductions', false).replace('class="pt"', 'class="pt" style="padding:0 12px"')}<main class="bd" style="padding:20px 24px">${DESK('tm', { hl: 1 })}</main>
      <div class="dim" aria-hidden="true"></div>${SHEET({ tm: 1, w: 560, next: NEXT('You', 'Accept, or say Not now.', 1), life: LIFE(1), body: DECIDE(), ppl: false,
        foot: `<span></span><span class="acts"><button type="button" class="btn">Not now</button><button type="button" class="btn p">Accept</button></span>` })}</div>`;

    /* ===== Phone 390 ===== */
    else if (B === 'NIT09A') html = phone('Notifications', `<ul class="ntl">
      <li class="un"><span class="av">JA</span><div><b>${JU} asks for an introduction</b><small>${MV} · ${TP}</small><small class="mo">2026-11-12 09:14</small></div><span aria-hidden="true">›</span></li>
      <li><span class="av">TG</span><div><b>[Theo Grant] withdrew an introduction request</b><small>Nothing more is needed from you.</small><small class="mo">2026-11-09</small></div><span aria-hidden="true">›</span></li>
      <li><span class="av">SH</span><div><b>Your introduction request was declined</b><small>There is a note for you.</small><small class="mo">2026-11-03</small></div><span aria-hidden="true">›</span></li></ul><p class="foot">Each row is a 56 px target and opens its record as a full-height Sheet.</p>`, null, { menu: 1, dot: 1 });
    else if (B === 'NIT09B') html = phone('Introduction', `${PHEAD(1)}${NEXT('You', 'Accept, or say Not now.', 1)}<div class="pc"><span class="eye">${JU}’s note</span><span>${NOTE}</span></div>${PLIFE(1)}<div class="f"><label for="pn">Note to ${JU} (optional)</label><span id="pn" class="in ta hint">Add a note…</span></div><p class="rd">◉ <b>${JU} will read this note.</b></p><p class="foot">${ZERO}</p>`, '<button type="button" class="btn">Not now</button><button type="button" class="btn p">Accept</button>');
    else if (B === 'NIT09C') html = phone('Introduction', `${PHEAD(1, '<span class="pl v" style="align-self:flex-start">✓ Accepted · ○ not made</span>')}${NEXT('You', 'Write it from your mailbox. Sending records Made.', 1)}${PLIFE(3)}<div class="mb"><span class="eye">From</span><b class="mo">${FROM}</b></div><div class="draft"><div class="cost"><span>Eadwyn draft</span><b class="mo">[$0.0140]</b></div><p class="foot">Holds up to that in AI tokens; nothing is charged until you confirm.</p><button type="button" class="btn" style="min-height:44px">Draft the intro</button></div>`, '<button type="button" class="btn p">Write introduction</button>');
    else if (B === 'NIT09D') html = phone('Email', `<span class="eye">Introduction email · ${JU} → ${MV}</span><div class="f"><label>From</label><span class="in mo" style="min-height:44px">${FROM}</span></div><div class="f"><label for="pt2">To</label><span id="pt2" class="in mo" style="min-height:44px">${TO_}</span></div><div class="f"><label for="ps">Subject</label><span id="ps" class="in" style="min-height:44px">${SUBJ}</span></div><div class="f"><label for="pb">Body</label><span id="pb" class="in ta big">${J(BODY.map((l) => l ? `${l}<br>` : '<br>'))}</span></div><p class="foot">Made stays unset until you send.</p>`, '<button type="button" class="btn">Save</button><button type="button" class="btn p">Review and send</button>');
    else if (B === 'NIT09E') html = phone('Review and send', `<h1 style="font-size:19px;font-weight:800">Send this introduction?</h1><dl class="rv" style="grid-template-columns:70px minmax(0,1fr)"><dt>From</dt><dd class="mo">${FROM}</dd><dt>To</dt><dd class="mo">${TO_}</dd><dt>Subject</dt><dd>${SUBJ}</dd><dt>Record</dt><dd>Sending records Made. Nothing else is sent.</dd><dt>Cost</dt><dd><b class="mo">0</b> credits</dd></dl>`, '<button type="button" class="btn">Back</button><button type="button" class="btn p">Send</button>');
    else if (B === 'NIT09F') html = phone('Introduction', `${PHEAD(1, '<span class="pl a" style="align-self:flex-start">! Sent · record not updated</span>')}${NEXT('You', 'Update the record. It sends no email.', 1)}<div class="nt r"><span class="ic" aria-hidden="true">!</span><div><b>Sent: your mail server took this intro.</b> Its record is not updated yet. Updating it sends nothing.</div></div><p class="foot">No “Resend”: a second email would be a duplicate introduction.</p>${PLIFE(3)}<button type="button" class="btn t" style="align-self:flex-start">View delivery details</button>`, '<button type="button" class="btn p">Update the record</button>');
    else if (B === 'NIT09G') html = phone('Introduction', `${PHEAD(1, '<span class="pl a" style="align-self:flex-start">? Not confirmed</span>')}${NEXT('You', 'Check your Sent folder, then say which.', 1)}<div class="nt a"><span class="ic" aria-hidden="true">?</span><div>Your mail server may or may not have taken this intro. Sending it again before you know could deliver it twice.</div></div>${PLIFE(3)}<p class="foot">No new send is offered until you answer.</p>`, '<button type="button" class="btn">It did not arrive</button><button type="button" class="btn">It arrived</button>');
    else if (B === 'NIT09H') html = phone('Introduction', `${PHEAD(0, '<span class="pl" style="align-self:flex-start">◷ Asked · waiting on Ari</span>')}${NEXT('Ari', 'Waiting on Ari to decide. You can withdraw while it waits.')}${PLIFE(1)}<div class="pc"><span class="eye">Your note to Ari</span><span>${NOTE}</span></div><p class="foot">${ZERO}</p>`, '<button type="button" class="btn">Withdraw request</button>');
    else if (B === 'NIT09I') html = phone('Introduction', `${PHEAD(0, '<span class="pl g" style="align-self:flex-start">✓✓ Made 2026-11-14</span>')}${NEXT('You', 'Your follow-up is due today.', 1)}${PLIFE(5)}<div class="pc"><span class="eye">Outcome</span><b>✓ Meeting held</b><small>recorded by you 2026-11-16 09:05</small></div><div class="pc"><span class="eye">Your follow-up</span><span><span class="pl a">◷ Due 2026-11-16</span></span><small>Only you see it.</small></div>`, '<button type="button" class="btn">Snooze a week</button><button type="button" class="btn p">Mark done</button>');

    /* ===== Dark ===== */
    else if (B === 'NIT10') html = shell(DESK('tm', { hl: 1 }), { h: 1000, overlay: SHEET({ tm: 1,
      next: NEXT('You', 'Accept, or say Not now. Nothing is sent when you accept.', 1),
      life: LIFE(1), body: DECIDE(), tl: TL([R_REQ(1), [0, 'Your decision', 'Not recorded yet', ''], R_MADE0]),
      foot: `<span class="foot">Esc closes</span><span class="acts"><button type="button" class="btn">Not now</button><button type="button" class="btn p">Accept</button></span>` }) });
    else if (B === 'NIT10B') html = phone('Introduction', `${PHEAD(1, '<span class="pl a" style="align-self:flex-start">! Sent · record not updated</span>')}${NEXT('You', 'Update the record. It sends no email.', 1)}<div class="nt r"><span class="ic" aria-hidden="true">!</span><div><b>Sent: your mail server took this intro.</b> Updating the record sends nothing.</div></div>${PLIFE(3)}`, '<button type="button" class="btn p">Update the record</button>');

    /* ===== Keyboard, focus and announcements ===== */
    else if (B === 'NIT11') html = `<div class="${CV} doc"><div><span class="eye">NW3-intro-team · keyboard, focus and announcements</span><h2 style="font-size:22px;margin-top:4px">Every branch: where focus goes and what is said</h2></div>
      <table class="tbl"><thead><tr><th scope="col">Branch</th><th scope="col">Keyboard order inside the Sheet</th><th scope="col">Announced (polite unless noted)</th><th scope="col">Focus after</th></tr></thead><tbody>
      <tr><td><b>Open from a notification</b></td><td>Sheet heading → Next line → note field → Not now → Accept → Close</td><td>“Introduction record opened. Next: you decide.”</td><td>Heading. Esc or ✕ closes and returns focus to the request’s row, or to the page h1 when the row is filtered out.</td></tr>
      <tr><td><b>Accept</b></td><td>Accept is disabled while saving (aria-busy on the Sheet)</td><td>“Accepted. Nothing was sent. Next: write the introduction.”</td><td>Write introduction.</td></tr>
      <tr><td><b>Not now</b></td><td>Not now opens the note; Send Not now · Cancel</td><td>“Not now sent. The request has ended.”</td><td>The Next line (“Nobody”).</td></tr>
      <tr><td><b>Withdraw</b></td><td>Withdraw request → Keep it · Withdraw request</td><td>“Withdrawn. Ari is told.”</td><td>Next line. Keep it returns to the button.</td></tr>
      <tr><td><b>Compose</b></td><td>From → To → Subject → Body → Discard draft → Review and send</td><td>Draft saves: “Draft saved.” Eadwyn quote: read out with its amount before Draft the intro.</td><td>Esc returns to the record (draft kept) and focus to Write introduction.</td></tr>
      <tr><td><b>Send</b></td><td>Confirmation is an alertdialog: Back to the draft · Send from your mailbox; focus trapped</td><td>Sending: “Sending.” Then one of: “Sent and recorded as made.” · “Sent. The record is not updated yet.” · “Not confirmed. Check your Sent folder.” (assertive) · “Not sent. Your draft is kept.” (assertive)</td><td>The delivery box’s one action, or the Next line when Made.</td></tr>
      <tr><td><b>Update the record</b></td><td>Update the record · View delivery details</td><td>“Recorded as made. No email was sent.”</td><td>Next line.</td></tr>
      <tr><td><b>Unknown delivery</b></td><td>It arrived · It did not arrive</td><td>assertive on open: “Not confirmed.” After: “Marked as arrived. Update the record.” or “Marked as not sent. You can write it again.”</td><td>Update the record, or Write it again.</td></tr>
      <tr><td><b>Follow-up</b></td><td>Mark done · Snooze a week · date · Change</td><td>“Follow-up done.” · “Follow-up snoozed to 23 November.”</td><td>The follow-up row.</td></tr>
      <tr><td><b>Conflict (409)</b></td><td>The Sheet re-reads; kept text stays in its field</td><td>assertive: “Jules withdrew this request. Your answer was not saved.”</td><td>The notice; Copy note follows.</td></tr>
      <tr><td><b>Unavailable read</b></td><td>Try again only</td><td>assertive: “This record could not be read.”</td><td>Try again.</td></tr></tbody></table>
      <div class="cols"><div><h3>Phone</h3><ul><li>The Sheet is full height; the decision, compose and recovery primary sits in the sticky footer, 44 px, never behind a sideways pan and never only on Asked of you.</li><li>Back (‹) is the Sheet’s close and returns to the list position.</li></ul></div>
      <div><h3>Visible focus and shape</h3><ul><li>2 px violet focus ring on every control, light and dark.</li><li>The Next line pairs ▶ (you act) or ◷ (someone else) with a name; lifecycle chips pair ✓ ○ – with words; never colour alone.</li></ul></div></div></div>`;

    /* ===== Handoff ===== */
    else if (B === 'NITH') html = `<div class="${CV} doc"><div><span class="eye">NW3-intro-team · #7066 under #7062 · handoff</span><h2 style="font-size:22px;margin-top:4px">Teammate decision, delivery and follow-up: what exists, what moves, what needs the Worker</h2></div>
      <div class="cols">
      <div><h3>Checked on main (c59a9f2f66)</h3><ul>
      <li><code>routes/relationships.ts</code>: <code>GET /intro-requests/:uid</code> (#6776, asker or teammate only, else 404), <code>/decide</code>, <code>/withdraw</code>, <code>/outcome</code>, <code>/follow-up</code> with <code>/done</code> and <code>/snooze</code>, <code>/delivery/reconcile</code>, <code>/drafts/intro</code>. Every route refuses a support session (403 <code>support_session_refused</code>).</li>
      <li><code>services/relationships.ts</code>: decide is once (409 <code>decided</code>, also when the request was withdrawn); withdraw only while pending (409 <code>not_pending</code>); <code>deliveryState</code> = sending, unconfirmed, record_pending, not_sent, returned to the teammate only; <code>mail_sent_uid</code> null for the requester; outcome only once Made, latest wins; follow-up per person: scheduled, due, snoozed, done.</li>
      <li><code>pages/relationships/IntroRecordSheet.jsx</code> and <code>introRecordModel.js</code>: lifecycle, timeline, people, Next step, Update the record. <code>nextStep</code> tells the teammate to act “from Asked of you on Introductions”: the Sheet has no Accept, Not now or compose today.</li>
      <li><code>IntroductionsDesk.jsx</code>: <code>AskCard</code> (Accept, Not now with a note, Write the intro, Ask Eadwyn to draft), <code>Delivery</code> with <code>SendUncertain</code> (It arrived / It did not arrive), <code>FollowUpRow</code> (Mark done, Snooze a week), <code>IntroCompose</code> (mailboxes unreadable vs none). <code>?intro=</code> highlights a row; it does not open the Sheet.</li>
      <li><code>services/introDestination.ts</code>: <code>/network/introductions?intro=&lt;uid&gt;&amp;kind=request</code>.</li></ul>
      <h3 style="margin-top:12px">Preserved</h3><ul><li>NW3.2 banner and lifecycle, NW3.4 Update the record with no Resend, NW3.5 delivery words (D4604), the shared Sheet, the four links, Eadwyn quote-then-run, the D5129 state words.</li></ul></div>
      <div><h3>Frontend only</h3><ul><li>Open the Sheet from <code>?intro=…&amp;kind=request</code>, even when filtered out; focus return to the row.</li><li>Move Accept / Not now (with the readership line) and Write introduction into the Sheet; Asked of you keeps Open record.</li><li>A Next line naming the next actor on every state, from <code>nextStep</code>.</li><li>The composer inside the Sheet; Review and send; drafts kept on failure.</li><li>Unknown delivery in the Sheet with <code>mailApi.resolveSend</code>; delivery details from <code>GET /api/mail/send/operations/:uid</code>, introducer only.</li><li>Follow-up Mark done, Snooze and Change in the Sheet; outcome note field.</li><li>After any 409, re-read the record and keep typed text.</li><li>Phone sticky footer, tablet overlay, dark.</li></ul>
      <h3 style="margin-top:12px">Backend required (◇)</h3><ul><li>A distinct refusal when a decision meets a withdrawn request (today 409 <code>decided</code>, “already answered”) · #7066. The frontend works around it by re-reading.</li></ul>
      <h3 style="margin-top:12px">Owner picks</h3><ul><li>None.</li></ul>
      <h3 style="margin-top:12px">Open</h3><ul><li>Restoring desk filters and scroll after sign-in belongs to #7063.</li><li>Live updates while the Sheet is open: none today; a write that meets a change shows the 409 and re-reads.</li></ul></div></div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'nit-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
</body>
</html>
