    const GRID = (keys, w, cols) => `<div style="padding:30px;display:grid;grid-template-columns:repeat(${cols},${w}px);gap:28px 24px">${keys.map(k => CELL(esc(CF[k].t), SC(CARD(CF[k], false), w))).join('')}</div>`;
    const CROPD = () => { const card = CARD(CF.home, false); return WRAP(CELL('Platform crops over the 1200 × 630 image', `<div style="position:relative;width:1200px;height:630px;box-shadow:0 0 0 1px #e2dfe8">${card}<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none"><div style="position:absolute;left:0;top:0;bottom:0;width:285px;background:rgba(24,24,27,.12)"></div><div style="position:absolute;right:0;top:0;bottom:0;width:285px;background:rgba(24,24,27,.12)"></div><div style="position:absolute;inset:0;border:3px solid #047857"></div><div style="position:absolute;left:0;right:0;top:15px;bottom:15px;border-top:2px dashed #0369a1;border-bottom:2px dashed #0369a1"></div><div style="position:absolute;left:285px;top:0;width:630px;height:630px;border:3px dashed #18181b;box-sizing:border-box"></div>${TAG('LinkedIn · Slack · the full image', 'left:12px;top:24px', '#047857')}${TAG('X · 2 : 1 · 15px trimmed top and bottom', 'right:12px;top:24px', '#0369a1')}${TAG('WhatsApp · iMessage · centred square', 'left:293px;bottom:22px', '#18181b')}</div></div>`) + CELL('1080 × 1080 crop-safety guide · at 50%', `<div style="position:relative;width:540px;height:540px">${SQ(card, 540)}<div aria-hidden="true" style="position:absolute;inset:0;border:3px dashed #7c3aed"></div></div>`)); };
    const FALL = () => `<div style="padding:30px;display:grid;grid-template-columns:repeat(3,440px);gap:32px">${[['Missing event', LI(R.evSec, 440)], ['Private event · draft or unpublished', LI(R.evSec, 440)], ['A profile that isn’t public · the default card', LI(R.home, 440)], ['No image, or one that isn’t https · the family image', LI(R.artNo, 440)], ['Quotes and angle brackets, as plain text', LI(R.quote, 440)], [`Title cut at ${R.artLong.t.length} · description at ${R.artLong.d.length}`, LI(R.artLong, 440)]].map(([c, x]) => CELL(c, x)).join('')}</div><p style="margin:0;padding:0 30px 30px;font-size:14px;line-height:1.5;color:#3f3a47">The missing and the private event return the same section card and the same text, byte for byte, so a card never confirms that a record exists.</p>`;
    const FR = {
      today: () => ({ w: 1200, h: 630, html: TODAY() }),
      sc1v: () => ({ w: 1788, html: GRID(['pFound', 'pInv', 'pAdv', 'pPart', 'pSec'], 560, 3) }),
      sc7v: () => ({ w: 1732, html: GRID(['trSec', 'trData', 'trSub', 'trDoc', 'trDis', 'lgTos', 'lgPriv', 'lgRisk'], 400, 4) }),
      sc3li: () => ({ w: 1780, html: WRAP(CELL('Record with its own cover', LI(R.art)) + CELL('No cover · the family image', LI(R.artNo)) + CELL(`Title cut at ${R.artLong.t.length} · description at ${R.artLong.d.length}`, LI(R.artLong))) }),
      sc4sl: () => ({ w: 1332, html: WRAP(CELL('Record with an https cover', SL(R.ev)) + CELL('No cover · the family image', SL(R.evNo))) }),
      sc5x: () => ({ w: 1684, html: WRAP(CELL('Person · /u/[handle]', XP(R.person)) + CELL('Startup · /startups/[handle]', XP(R.startup)) + CELL('Partner · /partners/[slug]', XP(R.partner))) }),
      sc9li: () => ({ w: 1780, html: WRAP(CELL('Home · SC1', LI(R.home)) + CELL('Article record · SC3', LI(R.art)) + CELL('Private link · SC8', LI(R.priv))) }),
      sc9x: () => ({ w: 1684, html: WRAP(CELL('Home · SC1', XP(R.home)) + CELL('Article record · SC3', XP(R.art)) + CELL('Private link · SC8', XP(R.priv))) }),
      sc9sl: () => ({ w: 1984, html: WRAP(CELL('Home · SC1', SL(R.home)) + CELL('Article record · SC3', SL(R.art)) + CELL('Private link · SC8', SL(R.priv))) }),
      wa1: () => ({ w: 390, h: 844, html: WA(R.home) }), wa2: () => ({ w: 390, h: 844, html: WA(R.art) }), wa3: () => ({ w: 390, h: 844, html: WA(R.priv) }),
      im1: () => ({ w: 390, h: 844, html: IM(R.home) }), im2: () => ({ w: 390, h: 844, html: IM(R.art) }), im3: () => ({ w: 390, h: 844, html: IM(R.priv) }),
      sc9crop: () => ({ w: 1862, html: CROPD() }),
      sc10li: () => ({ w: 612, html: WRAP(CELL('Job record', LI(R.job))) }),
      sc11: () => ({ w: 1444, html: FALL() })
    };
    const fr = FR[key] ? FR[key]() : { w: 1200, h: 630, html: CARD(CF[key] || CF.home, ov) };
    return { rootSt: `width:${fr.w}px;${fr.h ? 'height:' + fr.h + 'px;' : ''}box-sizing:border-box;overflow:hidden;position:relative;background:#f4f3f7;${SG};-webkit-font-smoothing:antialiased`, body: { __html: fr.html } };

  }
}

</script>
