      + '<div class="g"><section class="cd" style="grid-column:span 6"><div class="ch"><h2>Your actions</h2></div><ul class="rz"><li><b>Answer Chen Wei’s question</b><small>Asked yesterday</small>' + st('Needs response') + '</li><li><b>Prepare Wed 10:00 with Dara Okafor</b><small>No notes yet</small>' + st('In progress', 'To do') + '</li><li><b>Publish week 3 guidance</b><small>Draft saved</small>' + st('Draft') + '</li></ul></section>'
      + '<section class="cd" style="grid-column:span 6"><div class="ch"><h2>Sessions this week</h2></div><ul class="hist"><li><span>Tue 16 · group</span>Week 2 check-in · 6 founders</li><li><span>Wed 17 10:00</span>Dara Okafor · 45 min</li><li><span>Fri 19 15:00</span>Ana Novak · 30 min</li></ul></section></div>';

    /* ---------- C8/C9 calendar ---------- */
    const DAYS = ['Mon 15', 'Tue 16', 'Wed 17', 'Thu 18', 'Fri 19', 'Sat 20', 'Sun 21'];
    const HRS = ['09:00', '10:00', '11:00', '14:00', '15:00', '23:59'];
    const EV = { 'Tue 16|09:00': ['gr', 'Week 2 check-in', 'Group · 6 founders'], 'Wed 17|10:00': ['', 'Dara Okafor', 'Session · 45 min'], 'Wed 17|11:00': ['', 'Femi Adeyemi', '10:30–11:00 · overlaps Dara', 1], 'Thu 18|23:59': ['dl', 'Week 1 retake', 'Bruno Silva'], 'Fri 19|15:00': ['', 'Ana Novak', 'Session · 30 min'], 'Fri 19|23:59': ['ms', 'Week 2 due', 'All founders'], 'Mon 15|09:00': ['ms', 'Week 2 unlocked', 'Milestone'] };
    const calweek = () => head('Calendar') + '<div class="tools"><div class="seg" role="radiogroup" aria-label="Calendar view"><button type="button" role="radio" aria-checked="false">Month</button><button type="button" role="radio" aria-checked="true">Week</button><button type="button" role="radio" aria-checked="false">Agenda</button></div><button type="button" class="ib" aria-label="Previous week" style="width:32px;height:32px">‹</button><b style="font-size:13.5px">Mar 15 – 21, 2027</b><button type="button" class="ib" aria-label="Next week" style="width:32px;height:32px">›</button><span class="raw">Europe/Lisbon</span><div class="chips" style="margin-left:auto">' + J(['Milestones', 'Deadlines', 'Sessions', 'Group'].map(c => '<button type="button" role="checkbox" aria-checked="true">' + c + '</button>')) + '</div></div>'
      + '<div class="calw" role="grid" aria-label="Week of March 15"><div class="dh"></div>' + J(DAYS.map(d => '<div class="dh' + (d === 'Tue 16' ? ' today' : '') + '" role="columnheader">' + d + '</div>')) + J(HRS.map(h => '<div class="tm">' + h + '</div>' + J(DAYS.map(d => { const e = EV[d + '|' + h]; return '<div role="gridcell">' + (e ? '<span class="evt ' + e[0] + (e[3] ? ' cf' : '') + '">' + (e[3] ? '▲ ' : '') + e[1] + '<small>' + e[2] + '</small></span>' : '') + '</div>'; })))) + '</div>'
      + '<div class="nt a"><span class="ic" aria-hidden="true">!</span><div><b>Conflict on Wed 17:</b> Femi Adeyemi 10:30–11:00 overlaps Dara Okafor 10:00–10:45 by 15 minutes. Open either session to move it.</div></div>';
    const AG = [['Tue Mar 16', [['09:00–10:00', 'Week 2 check-in', 'Group session', '6 founders', '']]], ['Wed Mar 17', [['10:00–10:45', 'Dara Okafor', 'Advisor session', '1 founder', ''], ['10:30–11:00', 'Femi Adeyemi', 'Advisor session', '1 founder', 'Conflict']]], ['Thu Mar 18', [['23:59', 'Week 1 retake', 'Deadline', 'Bruno Silva', '']]], ['Fri Mar 19', [['15:00–15:30', 'Ana Novak', 'Advisor session', '1 founder', ''], ['23:59', 'Week 2 deliverables', 'Deadline', 'All founders', '']]]];
    const agenda = (partial) => head('Calendar') + '<div class="tools"><div class="seg" role="radiogroup" aria-label="Calendar view"><button type="button" role="radio" aria-checked="false">Month</button><button type="button" role="radio" aria-checked="false">Week</button><button type="button" role="radio" aria-checked="true">Agenda</button></div><b style="font-size:13.5px">Next 14 days</b></div>'
      + (partial ? '<div class="nt a" role="status"><span class="ic" aria-hidden="true">!</span><div><b>Cohort dates couldn’t be loaded.</b><div>Your sessions are shown. Milestones and deadlines are missing until the Lab’s schedule loads.</div></div><span class="bt"><button type="button" class="btn bsm">Retry</button></span></div>' : '')
      + '<section class="cd"><ul class="agn">' + J(AG.map(d => '<li class="day">' + d[0] + '</li>' + J(d[1].filter(e => !partial || e[2].indexOf('session') >= 0 || e[2] === 'Group session').map(e => '<li><span class="t">' + e[0] + '</span><span class="t">Spring 2027</span><b>' + e[1] + '</b><span>' + e[2] + '</span><span class="mu">' + e[3] + '</span>' + (e[4] ? st('Conflict', 'Overlaps Dara 10:00–10:45') : '<button type="button" class="btn t bsm">Details</button>') + '</li>')))) + '</ul></section>';

    /* ---------- C10 outcomes ---------- */
    const outcomes = () => head('Outcomes') + '<div class="seg" role="radiogroup" aria-label="Outcome scope"><button type="button" role="radio" aria-checked="true">This cohort</button><button type="button" role="radio" aria-checked="false">Programme outcomes</button></div>'
      + '<div class="dl3"><div><small>Participants</small><b>6</b><small>1 paused</small></div><div><small>Week 1 completion</small><b>3 <span style="font-size:13px;color:var(--mu)">of 6</span></b><small>2 passed · 1 grace · 1 failed · 1 not assessed · 1 paused</small></div><div><small>Graduates</small><b class="nrec" style="font-size:14px">Not yet</b><small>Graduation after week 4</small></div><div><small>Mentoring sessions</small><b>4</b><small>completed this cohort</small></div></div>'
      + '<section class="cd"><div class="ch"><h2>Milestone completion by week</h2><div class="seg" role="radiogroup" aria-label="Chart or table"><button type="button" role="radio" aria-checked="false">Chart</button><button type="button" role="radio" aria-checked="true">Table</button></div></div><table class="tbl"><thead><tr><th>Week</th><th class="n">Passed</th><th class="n">Grace</th><th class="n">Failed</th><th>Not assessed</th><th>State</th></tr></thead><tbody><tr><td>1</td><td class="n">2</td><td class="n">1</td><td class="n">1</td><td>1 · 1 paused</td><td>Decided</td></tr><tr><td>2</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td>All</td><td>In progress</td></tr><tr><td>3–4</td><td colspan="4" class="mu">Not open yet</td><td>—</td></tr></tbody></table><p class="foot">Definition: a week passes when the Lab records it passed. Source: this cohort’s week status · reported 14:30.</p></section>'
      + '<div class="nt"><span class="ic" aria-hidden="true">i</span><div><b>Programme outcomes</b> are company-level and anonymous across every cohort; they live under their own tab and are never mixed into these numbers. The public graduate list is capped, so it is never used as a total.</div></div>' + NEW('Cohort-scoped outcome metrics · backend required');

    /* ---------- C11 states ---------- */
    const box = (t, inner) => '<section class="cd" style="gap:8px"><div class="ch"><h2 style="font-size:13.5px">' + t + '</h2></div>' + inner + '</section>';
    const nt = (tone, ic, h, d, act) => '<div class="nt ' + tone + '"' + (tone === 'r' ? ' role="alert"' : '') + '><span class="ic" aria-hidden="true">' + ic + '</span><div><b>' + h + '</b><div>' + d + '</div></div>' + (act ? '<span class="bt"><button type="button" class="btn bsm">' + act + '</button></span>' : '') + '</div>';
    const STATES = [
      ['No cohort assigned', nt('', '○', 'You aren’t assigned to a cohort', 'HQ assigns advisors to cohorts. Your other work is unaffected.', '')],
      ['Assigned, not started', nt('', '◷', 'Spring 2027 starts Mon Mar 8', 'Founders and weeks appear on day one.', 'Write welcome guidance')],
      ['No founders visible', nt('', '0', 'No founders are visible to you', '6 are enrolled; none have shared their progress with advisors.', '')],
      ['Guidance empty', nt('', '+', 'No guidance yet', 'Your first note reaches every founder in this cohort.', 'New guidance')],
      ['Switching cohort', '<div aria-busy="true" style="display:flex;flex-direction:column;gap:6px"><span class="raw">Loading Winter 2027…</span><span class="sk" style="height:12px;width:70%"></span><span class="sk" style="height:12px;width:50%"></span></div><p class="raw">Spring 2027 data is cleared first; late answers from it are ignored.</p>'],
      ['Slow request', '<span class="raw">Still loading founders · 8 s</span><span class="sk" style="height:12px;width:80%"></span><button type="button" class="btn t bsm" style="align-self:flex-start">Keep waiting</button>'],
      ['Request failed', nt('r', '✕', 'Founders couldn’t be loaded', 'Server error at 14:30. Nothing below is current.', 'Retry')],
      ['Partial data', nt('a', '!', 'Sessions loaded; cohort dates didn’t', 'Showing what loaded. Deadlines are missing.', 'Retry')],
      ['Missing progress', '<dl class="kv2" style="grid-template-columns:120px minmax(0,1fr)"><dt>Week 1</dt><dd><span class="nrec">— No week windows recorded</span></dd></dl><p class="raw">This cycle predates week windows. Not zero.</p>'],
      ['Not assessed', '<span style="align-self:flex-start">' + cell('U') + '</span><p class="raw">The Lab hasn’t decided week 1 for Femi yet.</p>'],
      ['Access ended', nt('', '🔒', 'Your access to Autumn 2026 ended Feb 28', 'History you wrote stays readable; founders don’t.', '')],
      ['Visibility withdrawn', nt('', '⦸', 'Eli Haddad stopped sharing progress', 'Their card is removed. You can still see guidance you sent.', '')],
      ['Draft saved', '<span class="svst">✓ Draft saved 13:40</span>'],
      ['Draft not saved', '<span class="svst" style="color:var(--neg)">✕ Not saved · Retry</span><p class="raw">Your text stays in the composer.</p>'],
      ['Publish failed', nt('r', '✕', 'Guidance wasn’t published', 'Nothing was sent. Your text is kept.', 'Try again')],
      ['Session conflict', '<span class="evt cf" style="align-self:flex-start">▲ Femi Adeyemi 10:30<small>Overlaps Dara Okafor 10:00–10:45 by 15 min</small></span>']
    ];
    const states = () => crop('<span class="eye">Empty, loading, error and partial states · zero, no access, not built, failed and not assessed each read differently</span><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + J(STATES.map(s => box(s[0], s[1]))) + '</div>', 1400);

    /* ---------- super admin preview ---------- */
    const preview = () => head('Overview').replace('Spring 2027 Cohort ▾', 'No cohort · preview ▾').replace('Cohort: Spring 2027 Cohort', 'Cohort: none').replace('Mar 8 – Apr 5 · Week 2 of 4', 'Not assigned').replace(' <span>2</span>', '') + '<div class="nt" style="background:var(--lav);border-color:var(--lavE)"><span class="ic" style="background:#7c3aed" aria-hidden="true">i</span><div><b>You’re previewing the Advisor role as Super Admin.</b><div>You aren’t assigned to a cohort, so the structure shows without founder data.</div></div><span class="bt"><button type="button" class="btn p bsm">Impersonate advisor…</button></span></div>'
      + '<section class="cd"><div class="ch"><h2>Needs your attention</h2></div><div class="nt"><span class="ic" aria-hidden="true">○</span><div>Appears here for an assigned advisor: failed and grace founders, deadlines, questions, sessions.</div></div></section><div class="g"><section class="cd" style="grid-column:span 7"><div class="ch"><h2>Cohort progress</h2></div><div class="wk4"><div class="hd">Founder</div><div class="hd">Week 1</div><div class="hd">Week 2</div><div class="hd">Week 3</div><div class="hd">Week 4</div><div class="nm"><span class="mu">No founders in preview</span></div><div>' + cell('M') + '</div><div>' + cell('M') + '</div><div>' + cell('M') + '</div><div>' + cell('M') + '</div></div></section><section class="cd" style="grid-column:span 5"><div class="ch"><h2>Next 7 days</h2></div><p class="mu" style="font-size:12.5px">No cohort selected.</p></section></div>';

    /* ---------- mobile ---------- */
    const phone = (title, body, sheet) => '<div class="cv" style="' + VARS + ';width:390px;height:844px"><div class="ph" style="height:844px;position:relative"><div class="pt"><button type="button" class="pi" aria-label="Menu">☰</button><b style="font-size:15px">' + title + '</b><button type="button" class="pi" aria-label="Ask Eadwyn">E</button></div><div class="pbd" style="overflow:hidden">' + body + '</div>' + (sheet || '') + '</div></div>';
    const mhead = '<button type="button" class="dd" style="min-height:44px;justify-content:space-between">Spring 2027 Cohort · Week 2 of 4 ▾</button>';
    const mtabs = (cur) => '<nav class="wst" aria-label="Cohort sections" style="flex:none">' + J(['Overview', 'Founders', 'Guidance', 'Calendar', 'More ▾'].map(t => '<a href="#"' + (t === cur ? ' aria-current="page"' : '') + '>' + t + '</a>')) + '</nav>';
    const MOB = {
      CH12: () => phone('Cohorts', mhead + mtabs('Overview') + '<h2 style="font-size:16px;font-weight:800">Needs your attention · 5</h2>' + J(ATT.slice(0, 3).map(a => '<div class="mc"><div class="r1"><b style="font-size:13.5px">' + a[0] + '</b></div><small>' + a[1] + '</small><div style="display:flex;justify-content:space-between;align-items:center">' + st(a[3]) + '<a class="btn" href="#" style="min-height:44px">' + a[4] + '</a></div></div>')) + '<button type="button" class="disc"><b>Cohort progress</b><span>2 passed · 1 grace · 1 failed · week 1</span><i aria-hidden="true">›</i></button>'),
      CH13: () => phone('Founders', mhead + '<div class="inp" style="min-width:0;min-height:44px">⌕ Search founders</div><div class="chips"><button type="button" aria-checked="true" style="min-height:40px">Needs attention · 3</button><button type="button" style="min-height:40px">All · 6</button></div>' + J(F.slice(0, 3).map(f => '<div class="mc"><div class="r1"><b>' + f[0] + '</b>' + st(f[2]) + '</div><small>' + f[1] + ' · ' + f[3] + '</small>' + pbar(f[4]) + '<small style="color:var(--amT)">' + f[6] + '</small><small class="raw">Next: ' + f[5] + '</small><a class="btn" href="#" style="min-height:44px">Open founder</a></div>'))),
      CH14: () => phone('New guidance', '<span class="svst" role="status" style="align-self:flex-start">✓ Draft saved 13:40</span><div class="fld"><label for="mgt">Title</label><div class="ta" id="mgt" style="min-height:44px">Pricing test checklist</div></div><div class="fld"><label>Cohort · week</label><div class="selb" style="min-height:44px">Spring 2027 · Week 3 ▾</div></div><div class="fld"><label for="mgb">Body</label><div class="ta" id="mgb" style="min-height:220px">Before you run the test, decide the one number you’ll use to judge it…</div></div><button type="button" class="btn p" style="min-height:48px">Publish to 6 founders</button><button type="button" class="btn" style="min-height:48px">Save draft</button><p class="raw">Leaving with unsaved text asks first.</p>'),
      CH15: () => phone('Calendar', mhead + '<div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="pi" aria-label="Previous days">‹</button><b>Mar 16 – 29</b><button type="button" class="pi" aria-label="Next days">›</button></div><div class="chips"><button type="button" aria-checked="true" style="min-height:40px">All</button><button type="button" style="min-height:40px">Sessions</button><button type="button" style="min-height:40px">Deadlines</button></div>' + J(AG.slice(0, 3).map(d => '<b class="mo" style="font-size:12px">' + d[0] + '</b>' + J(d[1].map(e => '<div class="mc"><div class="r1"><b>' + e[1] + '</b>' + (e[4] ? st('Conflict') : '') + '</div><small>' + e[0] + ' · ' + e[2] + ' · ' + e[3] + '</small></div>')))))
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Capability map, roadmap and handoff</h1><p>Checked against <code>cloudflare-worker/src/routes/advisors.ts</code> (<code>/me/cohort</code>, <code>/:cycleId/founders</code>, <code>/weeks</code>, <code>/guidance</code>, <code>/calendar</code>, <code>/me/cohort-access</code>), migration <code>212_cohort_guidance.sql</code>, <code>company_week_status</code> and <code>workspaces/shellConfig.js</code> on 7 Nov 2026.</p>'
      + tbl(['UI', 'Classification', 'Notes'], [
        ['Cohort selector, persisted in the URL', 'Supported today', '<code>GET /me/cohort</code> lists assignments; frontend keys every request by cycle id and drops stale responses'],
        ['Founders board / table / detail', 'Supported today', 'Founders + week status (status, deliverables_done/required, grace_until, decision_reason); visibility opt-out respected'],
        ['Deadline snapshot vs live status', 'Requires new backend capability', 'Only the current week status row is stored'],
        ['Needs your attention', 'Supported today (founders, deadlines, questions) · sessions prep needs new', 'Derived client-side from founders, weeks, guidance, calendar'],
        ['Recent activity', 'Requires new backend capability', 'No activity feed for the advisor’s cohort'],
        ['Guidance post, answer a question, retire', 'Supported today', '<code>GET/POST /:cycleId/guidance</code>, answer/retire fields'],
        ['Invalid week rejected', 'Requires existing workflow fix', 'Route stores an out-of-range week as NULL (general) today'],
        ['Title, drafts, edit history, version conflict, acknowledgements', 'Requires new backend capability', 'cohort_guidance has body, answer, week, posted_at, retired_at only'],
        ['Calendar month/week/agenda, partial state', 'Supported today', '<code>/calendar</code> returns windows (with windows_recorded) and booked sessions separately'],
        ['Conflict indicators', 'Supported for overlapping bookings · external calendars need new', 'Overlaps are computed from booked sessions; external holds are not read'],
        ['Cohort outcomes', 'Supported for week completion; graduates/sessions need new', 'Programme outcomes stay on their own tab']])
      + '<h2>Roadmap</h2><p>1. Overview + persistent cohort selector + Founders board/table (frontend only). 2. This week and Agenda with partial states. 3. Guidance week validation fix. 4. Guidance titles, drafts and versions. 5. Acknowledgements and activity feed. 6. Cohort outcomes metrics.</p>'
      + '<h2>Accessibility</h2><p>Section nav is links with aria-current; Board/Table and calendar views are radio groups. Progress grid is a table with row and column headers; each cell carries a word, not just a colour. Composer announces save/publish results in a status region; the week error is linked to its field. Founder detail and composer trap focus and return it. 44px targets on mobile; reduced motion removes the drawer slide.</p>');

    let html = '';
    if (B === 'CH01') html = page(overview(), { h: 1350, rail: true });
    else if (B === 'CH02') html = page(board(), { h: 1000, cur: 'Founders' });
    else if (B === 'CH03') html = page(table(), { h: 860, cur: 'Founders' });
    else if (B === 'CH04') html = page(table(), { h: 900, overlay: detail(), cur: 'Founders' });
    else if (B === 'CH05') html = page(guidance(), { h: 960, cur: 'Guidance' });
    else if (B === 'CH06') html = composerBoard();
    else if (B === 'CH07') html = page(thisweek(), { h: 1000, cur: 'This week' });
    else if (B === 'CH08') html = page(calweek(), { h: 860, cur: 'Calendar' });
    else if (B === 'CH09') html = page(agenda(false), { h: 820, cur: 'Calendar' });
    else if (B === 'CH09b') html = page(agenda(true), { h: 740, cur: 'Calendar' });
    else if (B === 'CH10') html = page(outcomes(), { h: 900, cur: 'Outcomes' });
    else if (B === 'CH11') html = states();
    else if (MOB[B]) html = MOB[B]();
    else if (B === 'CH16') html = page(overview(), { h: 1300 });
    else if (B === 'CH17') html = page(overview(), { h: 1500, w: 834 });
    else if (B === 'CH18') html = page(preview(), { h: 820 });
    else if (B === 'CH19') html = handoff();
    else html = page(overview(), { h: 1000, rail: true });
    return { html: { __html: html } };
  }
}
