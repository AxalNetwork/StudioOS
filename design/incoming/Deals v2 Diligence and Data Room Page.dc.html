    const sticky = (t) => '<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--hair)"><button type="button" class="btn p" style="width:100%;min-height:48px">' + t + '</button></div>';
    const coll = (t, n, open, inner) => '<div class="dpd-coll"><button type="button" aria-expanded="' + open + '"><b>' + t + '</b><span class="mo">' + n + '</span><i aria-hidden="true">' + (open ? '▴' : '▾') + '</i></button>' + (open ? inner : '') + '</div>';
    const MOB = {
      DPD29A: () => phone('[Acme Robotics]', ptabs('Scorecard') + '<span class="eye">Traction · last 12 months</span><div class="dpd-tiles" style="grid-template-columns:1fr 1fr">' + J(TILES.map(t => '<div class="dpd-tile"><small>' + t[0] + '</small><b>' + t[1] + '</b><span>' + t[2] + '</span><em>as of 30 Sep · founder’s update</em></div>')) + '<div class="dpd-tile dpd-nrt"><small>ARR · NRR</small><b>' + ab('nr') + '</b></div></div><div class="seg" role="radiogroup" aria-label="Chart"><button type="button" role="radio" aria-checked="true" style="min-height:44px">MRR</button><button type="button" role="radio" aria-checked="false" style="min-height:44px">Net burn</button><button type="button" role="radio" aria-checked="false" style="min-height:44px">Accounts</button></div><figure class="dpd-fig">' + chart(MRR, 'line', 50, '', 'MRR by month', true) + '</figure><div class="mc"><span class="eye">Sep 2026</span><div class="dv"><span>MRR</span><b class="mo">€42.0K</b></div><span class="raw">as of 30 Sep 2026 · founder’s update</span></div>', sticky('Download CSV')),
      DPD29B: () => phone('[Acme Robotics]', ptabs('Diligence') + '<div class="mc"><div class="dv"><span>' + stage('In review') + '</span><span class="dpd-risk">◆ Medium risk</span></div><div class="dv"><span>Items worked</span><b class="mo">[18] of [42]</b></div><div class="dv"><span>Open flags</span><b class="mo">[3]</b></div><span class="raw">Lead [Name A] (you) · IC target 3 Dec 2026</span></div>' + coll('Requests to the founder', '3 open', true, '<ul class="dpd-list">' + J(REQ.slice(0, 3).map(r => '<li><div><b>' + r[0] + '</b><div>' + reqState(r) + '</div></div><button type="button" class="btn" style="min-height:44px">' + (r[1] === 'a' ? 'Open' : 'Remind') + '</button></li>')) + '</ul>') + coll('Open flags', '1 High · 2 Medium', false) + coll('Sections', '2 blocking', false) + coll('Reference calls', '2', false), sticky('Record decision')),
      DPD29C: () => phone('[Acme Robotics]', ptabs('Data room') + '<p class="raw">' + LK + ' NDA until 2 Oct 2027 · ends 31 Jan 2027</p><div class="tools"><div class="inp" style="flex:1;min-height:44px">⌕ Search names</div><button type="button" class="dd" style="min-height:44px">Filters · 0</button></div>' + J(FILES.slice(0, 3).map(f => '<div class="mc"><div class="dv"><b>' + f[0] + '</b></div><span class="raw">' + f[1] + ' · ' + f[2] + ' · ' + f[3] + ' · ' + f[4] + '</span><button type="button" class="btn" style="min-height:44px">Download</button></div>')) + '<span class="eye">Deal paper</span>' + J(PAPER.slice(0, 2).map(p => '<div class="mc"><b>' + p[0] + '</b>' + p[1] + '</div>')), ''),
      DPD29D: () => phone('Data room', '<nav class="zn" aria-label="Data room" style="overflow:hidden">' + J(['Requests', 'Activity', 'Files', 'Access'].map((t, i) => '<a href="#"' + (i === 0 ? ' aria-current="page"' : '') + ' style="min-height:44px">' + t + '</a>')) + '</nav><span class="eye">Access requests · [2]</span><div class="mc"><div class="dv"><b>[Investor D]</b><span class="mo">10 Nov</span></div><span style="font-size:12.5px">Seed round, following the intro from [Name B].</span><div class="dv"><button type="button" class="btn p" style="min-height:44px;flex:1">Accept…</button><button type="button" class="btn" style="min-height:44px;flex:1">Decline…</button></div></div><div class="mc"><div class="dv"><b>[Investor E]</b><span class="mo">12 Nov</span></div><span class="raw">No message</span><div class="dv"><button type="button" class="btn" style="min-height:44px;flex:1">Accept…</button><button type="button" class="btn" style="min-height:44px;flex:1">Decline…</button></div></div><span class="eye">Diligence requests · [2] waiting</span>' + J([['Updated cap table', 'Due 20 Nov 2026'], ['Unit economics at 50 units', 'No due date']].map(r => '<div class="mc"><b>' + r[0] + '</b><span class="raw">' + r[1] + '</span><button type="button" class="btn" style="min-height:44px">Answer…</button></div>')), '')
    };

    /* ---------- handoff ---------- */
    const dk = (inner) => '<div class="cv" style="' + VARS + ';width:1200px"><div class="dk">' + inner + '</div></div>';
    const tbl = (hd, rows) => '<table class="dt"><thead><tr>' + J(hd.map(h => '<th>' + h + '</th>')) + '</tr></thead><tbody>' + J(rows.map(r => '<tr>' + J(r.map(c => '<td>' + c + '</td>')) + '</tr>')) + '</tbody></table>';
    const handoff = () => dk('<h1>Backend fit and handoff · DE19 to DE31</h1><p>Checked on main <code>6d7712c6d1</code> (14 Nov 2026). Boards draw only what these routes return; ◇ marks what needs backend work, ⚑ the owner’s picks.</p>'
      + tbl(['Board', 'Worker route (main)', 'What it gives'], [
        ['DE19–DE21 Traction', '<code>GET /api/deals/:id/traction</code> (<code>deal_insights.ts</code>)', '12 months from submitted updates shared with this investor; <code>not_reported</code> months; per-figure source and as-of; ARR <code>Not recorded</code> (“MRR is not annualised”); <code>masked: true</code> without a pairwise NDA; 503 unreadable. CSV is built client side from the 12 months.'],
        ['DE22–DE24 Diligence', '<code>dd.ts</code>: <code>GET /cases</code> (newest 200), <code>GET /cases/:uid</code>, <code>/requests</code> (+ remind, withdraw), <code>/decision</code>, <code>/ic</code>, <code>/memo</code>, <code>/report</code>', 'Summary, sections, requests, flags. Proceed refused (409) while a blocking section has an open High or Critical flag; Send to IC 409 until Proceed or Proceed with conditions, then 409 <code>already_sent</code>; archived takes no change. Lead or Admin only.'],
        ['Reference calls', '<code>GET /api/references?deal_id=</code>', 'Name, role, relationship, scheduled, consent. Recording, transcribe and summarize return 501.'],
        ['DE25 Data room', '<code>GET /api/deals/:id/room-access</code> (<code>deal_workroom.ts</code>), <code>GET /api/data-room/shared/:projectUid</code>, <code>POST …/search</code>', 'Grant end (null = No end date), NDA status, request state; folders and files with name, type, size, added; search returns <code>available: false</code> when the index is unbound. Sort and paging are client side.'],
        ['Deal paper', '<code>GET /api/legal/esign?deal_id=</code>, <code>…/:id/document</code>', 'Title, status, signed_count of recipient_count, completed_at, Download.'],
        ['DE26 Founder', '<code>data_room.ts</code>: <code>/:projectUid/requests</code> (accept, decline), <code>/activity</code> (+ <code>activity.csv</code>); <code>GET /api/dd/requests/mine</code>, <code>PATCH /api/dd/requests/:id/respond</code>', 'Requests, per-investor totals against the previous period, daily counts, paged log, CSV refusal above its row limit. The founder never reads case data.'],
        ['DE27 Admin', '<code>POST /api/data-room/:projectUid/support-read</code>, <code>GET …/support-reads</code>', 'Audited read-only open with a reason the founder sees.']])
      + '<h2>Backend required ◇ (#6176 lists them; none is drawn as working)</h2><p>ARR and NRR · previous-year comparison · last-shared date when no month is reported · link from a month to its update and its shared date · “Ask the founder for an update” (no route; waits on proposal 12) · Eadwyn’s drafted questions (<code>QUESTIONS_SLOT</code>) · reference recording, transcript and summary (501) · New since my last visit (<code>data_room_access_log</code> not served to investors) · per-file open counts for the founder · Review and sign from the deal page (signing link arrives by email) · the deck on the deal page (<code>DECK_SLOT</code>).</p>'
      + '<h2>Owner picks ⚑ (drawn as option A)</h2><p>1 · Traction is a section of Scorecard; <code>/deals/:dealId/traction</code> opens it. 2 · Data room lives at <code>/deals/:dealId/data-room</code>; <code>/documents</code> opens it. 3 · “Ask the founder for an update” drawn as an option, marked ◇, until proposal 12 is decided. The landing records these in <code>D4815-p1.md</code> (the acceptance names <code>D6176.md</code>; the landing says which it used).</p>'
      + '<h2>Handoffs</h2><p>Send to IC (after Proceed or Proceed with conditions) → Investment committee (DE07) with the case · IC’s decision → Investment (DE09) · a fully signed envelope moves Closing (DE08b) · Download CSV keeps the period shown.</p>'
      + '<h2>Frontend only</h2><p>The Scorecard section anchor and route alias; tiles, charts with gap bands and the table switch; the CSV; the case layout, doors and disabled reasons; the room toolbar, client sort and 25-a-page paging; paper and deck blocks; founder tabs; phone cards, collapsibles and sticky actions; dark tokens.</p>'
      + '<h2>Preserved</h2><p>DE04 header and tab bar; DE10 crops C (NDA “2 of 3 signed”) and D are not redrawn, D is extended by DE25 (#5907 builds them); the three status families and the five absence states; the founder’s room as drawn in Raise v2 Data Room (DR1–DR35).</p>'
      + '<h2>Accessibility</h2><p>Charts carry a text label and gaps are named “Not reported”; the table view is the accessible equivalent. Severity, verdict, risk, signature and decision always pair a word with a glyph. Disabled actions keep focus and name their reason. Sheets trap and return focus; phone targets are 44px; tables have real headers and <code>aria-sort</code>.</p>');

    /* ---------- route ---------- */
    let html = '';
    if (B === 'DPD19') html = page(traction(), { h: 1110 });
    else if (B === 'DPD20') html = page(trTable(), { h: 1290 });
    else if (B === 'DPD21') html = trStates();
    else if (B === 'DPD22') html = page(diligence(), { h: 1700 });
    else if (B === 'DPD22B') html = decSheets();
    else if (B === 'DPD23') html = page(reviewer(), { h: 1180 });
    else if (B === 'DPD23B') html = page(decided(false), { h: 1030 });
    else if (B === 'DPD23C') html = page(decided(true), { h: 1080 });
    else if (B === 'DPD24') html = ddStates();
    else if (B === 'DPD25') html = page(roomPage(), { h: 2180 });
    else if (B === 'DPD26') html = page(founderReq(), { h: 830, founder: true, av: 'FA' });
    else if (B === 'DPD26B') html = page(founderAct(), { h: 920, founder: true, av: 'FA' });
    else if (B === 'DPD26C') html = founderSheets();
    else if (B === 'DPD27') html = staff();
    else if (B === 'DPD28') html = drStates();
    else if (B === 'DPD30A') html = page(traction(), { h: 1110 });
    else if (B === 'DPD30B') html = page(diligence(), { h: 1700 });
    else if (B === 'DPD30C') html = page(roomPage(), { h: 2180 });
    else if (B === 'DPD31') html = handoff();
    else if (MOB[B]) html = MOB[B]();
    else html = page(traction(), { h: 1110 });
    return { html: { __html: html } };
  }
}

</script>
