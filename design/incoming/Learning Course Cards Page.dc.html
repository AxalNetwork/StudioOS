  <style>
body{margin:0}

.mn{min-width:0;display:flex;flex-direction:column}

        <h3 style="margin-top:12px">Accessibility</h3><ul><li>One tab stop per card; describedby carries output, effort, state and action. Chips pair glyph and word. Covers decorative. Reflow at 320 CSS px without horizontal scroll.</li></ul></div>
      </div></div>`;

    html = html.replace(/class="([^"]*)"/g, (m, c) => 'class="' + c.split(/\s+/).filter(Boolean).map((x) => 'lcc-' + x).join(' ') + '"');
    return { html: { __html: html } };
  }
}

</script>
