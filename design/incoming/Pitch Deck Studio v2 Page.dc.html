      return SHEETOVER(RAIL({ inner: D1({ short: 1 }) }), SHEET('All models · Images', 'Every suitable catalogue model for this group', body, '', 640), 1060, 860); };
    FR.aird3 = () => crop(420, card(USAGE({ held: '$[0.06] · [2] runs in progress', spent: '$[0.21]', month: 1 }) + `<div style="display:flex;justify-content:space-between;font-size:12px;padding-top:8px;border-top:1px solid var(--line)"><span>A figure that failed</span>${MUT('Could not be read')}</div>`, 'padding:16px') + NOTE('Amounts in dollars. No button here runs a model.'));
    const GR = (g, right) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:12px"><span style="font-weight:700">${g}</span><span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px">${right}</span></div>`;
    FR.aird5 = () => { const c = (l, inner) => card(LBL(l) + inner, 'padding:14px;gap:8px'); return crop(1180, grid(3, c('An admin locked a group', GR('Images', `<span style="display:inline-flex;align-items:center;gap:4px;color:var(--mut)">${LOCK}Set by Axal VC HQ</span>`) + `<span>${PEND}</span>`) + c('A model retired', GR('Text', '[Model B] ' + TAG('Alternative')) + NOTE('[Model C] is unavailable. Using [Model B].')) + c('Out of AI tokens', USAGE({ out: 1, bal: '$[0.01]' })) + c('AI paused', GR('Text', '[Model A]') + NOTE('AI is paused for your studio.')) + c('Support session · read only', GR('Text', '[Model A] ' + TAG('Default', 'lav')) + GR('Images', '[Model D] ' + TAG('Default', 'lav')) + NOTE('Read only. No pickers.')), 14) + row(PHONE(TS({ w: 358 }), `${SEG(['Settings', 'Usage'], 'Settings')}${LBL('Models')}${GR('Text', '[Model A] ' + TAG('Default', 'lav'))}${GR('Images', '[Model D] ' + TAG('Default', 'lav'))}${GR('Data', '[Model B] ' + TAG('Default', 'lav'))}`, { sh: '55%', sl: 'AIRail' }), 'align-items:flex-start')); };

    const html = (FR[v] || FR.pd0)();
    return { rootSt: (dark ? DARK : LIGHT) + ';' + F + ';color:var(--ink);background:var(--bg);width:max-content', body: { __html: html } };
