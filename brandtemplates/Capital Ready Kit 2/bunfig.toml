[install]
# 7-day supply-chain guard: skip package versions published less than a week ago.
minimumReleaseAge = 604800
# Each entry bypasses the 7-day guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate"]
