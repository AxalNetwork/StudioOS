  <script data-cfasync="false">
    // Theme init — runs before first paint so the background is always correct.
    // Reads axal_appearance_v1 from localStorage (same key + shape as
    // SettingsContext). Falls back to 'light' (the app default).
    // 'system' was a legacy tri-state value; it collapses to 'light' here too,
    // matching normalizeTheme() in SettingsContext.jsx.
    (function () {
      try {
        var raw = localStorage.getItem('axal_appearance_v1');
        var theme = 'light';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.theme === 'dark') theme = 'dark';
        }
        if (theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage blocked or JSON invalid — stay light */ }
    })();
  </script>
  <script data-cfasync="false">
    // ONE definition of "is this the dev server", because two scripts below
    // branch on it in OPPOSITE directions and must never disagree.
    //
    // It used to be copy-pasted into both, and it sniffed the host and the
    // port as well as the DOM:
    //
    //   /(localhost|replit\.dev|replit\.app|repl\.co)/.test(location.host)
    //   || location.port === '5000'
    //
    // Those two clauses are true for a Replit-HOSTED PRODUCTION BUILD. `.replit`
    // maps localPort 5000 to externalPort 80 and `run-deploy.sh` serves the
    // built SPA there, so a deployed bundle answered "yes, dev" — which armed
    // the dev-only service-worker killer below AND switched off the production
    // boot watchdog that follows it. The one unbounded reload on, the bounded
    // one off, on the same page load.
    //
    // `/@vite/client` is the signal that actually means dev: Vite injects that
    // script into the HTML it serves, and injects it above this block, so it is
    // already in the DOM when this runs. A built bundle never has it. (The
    // string appears three times in the built HTML — inside these scripts, as
    // source text — but `querySelector` matches elements, not text, so it
    // cannot match itself.)
    window.__axalIsDev = (function () {
      try { return !!document.querySelector('script[src="/@vite/client"]'); }
      catch (e) { return false; }
    })();
  </script>
  <script data-cfasync="false">
    // Dev-only: unregister any stale service worker + clear caches BEFORE any
    // module loads. The SW precaches '/' and serves stale HTML referencing old
    // Vite optimizer dep hashes, causing "Outdated Optimize Dep" 504s after
    // restarts. Runs only in dev (vite serves index.html with /@vite/client).
    //
    // ITS GUARD USED TO BE `window.__swKilled`, WHICH IS NOT A GUARD. A property
    // on `window` dies with the document, so it bounded one reload per page
    // load — and a reload starts a new page load. `lib/reloadGuard.js` exists
    // because `pwa.js` shipped exactly this shape ("its guard was a module-local
    // `let` that died with the document, so it bounded one reload PER PAGE LOAD,
    // which is not a bound on a loop at all"); this block had the same bug one
    // layer up, in HTML the module system cannot reach.
    //
    // So the bound is spelled out here rather than imported: this script is
    // un-bundled on purpose, so it cannot `import`. It is the same two-part
    // bound the watchdog below uses and for the same two reasons — a
    // sessionStorage key, plus a URL marker for the browsers that refuse the
    // storage write, which are precisely the browsers this bug is reported
    // from. `RELOAD_GUARD_KEYS` in `lib/reloadGuard.js` names the key so
    // `clearSession`'s sweep cannot drop it, and
    // `frontend/test/chunk_reload_loop.test.mjs` fails the build if a reload in
    // this file ever loses its bound again.
    (function () {
      try {
        if (!window.__axalIsDev || !('serviceWorker' in navigator)) return;
        var KILL_KEY = 'axal:sw-kill-attempts';
        var killOnce = function () {
          try {
            if (/[?&]__swkill=/.test(window.location.search)) return;
          } catch (e) { /* location unreadable — fall through to the storage guard */ }
          try {
            if (sessionStorage.getItem(KILL_KEY) === '1') return;
            sessionStorage.setItem(KILL_KEY, '1');
          } catch (e) { /* storage blocked — the ?__swkill guard above still bounds us */ }
          try {
            var u = new URL(window.location.href);
            u.searchParams.set('__swkill', '1');
            window.location.replace(u.toString());
          } catch (e) { window.location.reload(); }
        };
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadSW = regs && regs.length > 0;
          regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              var pending = keys.map(function (k) { return caches.delete(k); });
              Promise.all(pending).then(function () {
                if (hadSW) killOnce();
              });
            });
          }
        });
      } catch (e) { /* no-op */ }
    })();
  </script>
  <script data-cfasync="false">
    // Task #37 — production boot watchdog (un-bundled, so it runs even when the
    // entry module 404s). The recurring Safari blank page happens when a cached
    // or still-open shell references a build hash the Worker no longer serves
    // (until 2026-09-01 the shell came from GitHub Pages and the hashes from
    // the Worker, so the two could skew on every deploy; now both come from one
    // `wrangler deploy` and only stale clients are in play): the hashed entry
    // chunk fails to load, so main.jsx — and its in-app stale-chunk recovery —
    // never runs and the page stays blank.
    // This inline script lives in the HTML itself, so it always executes,
    // detects the failure, clears the service worker + caches ONCE, and reloads
    // with a cache-busting query so Safari re-fetches fresh HTML instead of its
    // cached stale copy. A sessionStorage guard prevents any reload loop.
    (function () {
      try {
        // Shared with the service-worker killer above — see the note there for
        // why the host and port clauses are gone. Their removal RE-ARMS this
        // watchdog on a Replit-hosted production build, which is the point:
        // that build serves hashed assets and can skew exactly like any other.
        if (window.__axalIsDev) return;
        var REBOOT_KEY = 'axal:boot-reboot';
        function rebootOnce() {
          // Storage-free loop guard: if we already rebooted (the URL carries
          // ?__reboot), never reboot again — even when sessionStorage is blocked
          // and the entry chunk is permanently missing. Prevents an infinite
          // reload loop; the page fails as a clean 404/blank instead.
          try {
            if (/[?&]__reboot=/.test(window.location.search)) return;
          } catch (e) { /* location unreadable — fall through to storage guard */ }
          try {
            if (sessionStorage.getItem(REBOOT_KEY) === '1') return;
            sessionStorage.setItem(REBOOT_KEY, '1');
          } catch (e) { /* storage blocked — the ?__reboot guard above still bounds us to one reload */ }
          var go = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set('__reboot', String(Date.now()));
              window.location.replace(u.toString());
            } catch (e) { window.location.reload(); }
          };
          var clearCaches = function () {
            if (window.caches && caches.keys) {
              caches.keys()
                .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                .catch(function () {})
                .then(go, go);
            } else { go(); }
          };
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
              .catch(function () {})
              .then(clearCaches, clearCaches);
          } else { clearCaches(); }
        }
        // Fire the instant a hashed entry/vendor module 404s. Capture phase is
        // required to see resource-load errors at the window level.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && typeof t.src === 'string' &&
              /\/assets\/[^"']+\.js(?:$|\?)/.test(t.src)) {
            rebootOnce();
          }
        }, true);
        // Belt-and-suspenders: if the app hasn't signalled boot after 15s (the
        // entry never executed for any reason), recover once.
        window.setTimeout(function () {
          if (!window.__axalBooted) rebootOnce();
        }, 15000);
      } catch (e) { /* the watchdog must never throw */ }
    })();
  </script>

  <!-- Load every webfont WITHOUT blocking first paint. `media="print"` lets
       the browser fetch at low priority; the onload swap flips it to `all`
       once ready. `display=swap` shows the system fallback until then, so the
       hero text paints immediately (helps mobile FCP/LCP).

       All three families ride one request: Inter is the body/UI face, Roboto
       Mono carries every number and label (`font-mono`), Space Grotesk is the
       display face. Inter was previously declared on `body` in index.css but
       never actually loaded, so the whole app silently rendered in system-ui;
       Roboto Mono was loaded by a render-blocking `@import` at the top of
       index.css — the exact thing this block exists to avoid — and shipped
       without weight 400. Weights here are the union the design canvases use;
       adding one means adding it here, not a second request. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
