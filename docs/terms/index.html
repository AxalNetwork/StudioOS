  <script>
    // Theme init — runs before first paint so the background is always correct.
    // Reads axal_appearance_v1 from localStorage (same key + shape as
    // SettingsContext). Falls back to 'light' (the app default).
    // 'system' was a legacy tri-state value; it collapses to 'light' here too,
    // matching normalizeTheme() in SettingsContext.jsx.
    (function () {
      try {
        var raw = localStorage.getItem('axal_appearance_v1');
        var theme = 'light';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.theme === 'dark') theme = 'dark';
        }
        if (theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage blocked or JSON invalid — stay light */ }
    })();
  </script>
  <script>
    // Dev-only: unregister any stale service worker + clear caches BEFORE any
    // module loads. The SW precaches '/' and serves stale HTML referencing old
    // Vite optimizer dep hashes, causing "Outdated Optimize Dep" 504s after
    // restarts. Runs only in dev (vite serves index.html with /@vite/client).
    (function () {
      try {
        var isDev = !!document.querySelector('script[src="/@vite/client"]') ||
                    /(localhost|replit\.dev|replit\.app|repl\.co)/.test(window.location.host) ||
                    window.location.port === '5000';
        if (!isDev || !('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadSW = regs && regs.length > 0;
          regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              var pending = keys.map(function (k) { return caches.delete(k); });
              Promise.all(pending).then(function () {
                if (hadSW && !window.__swKilled) {
                  window.__swKilled = true;
                  window.location.reload();
                }
              });
            });
          }
        });
      } catch (e) { /* no-op */ }
    })();
  </script>
  <script>
    // Task #37 — production boot watchdog (un-bundled, so it runs even when the
    // entry module 404s). The recurring Safari blank page happens when the apex
    // root HTML (served by GitHub Pages) references a build hash the Worker no
    // longer serves: the hashed entry chunk fails to load, so main.jsx — and
    // its in-app stale-chunk recovery — never runs and the page stays blank.
    // This inline script lives in the HTML itself, so it always executes,
    // detects the failure, clears the service worker + caches ONCE, and reloads
    // with a cache-busting query so Safari re-fetches fresh HTML instead of its
    // cached stale copy. A sessionStorage guard prevents any reload loop.
    (function () {
      try {
        var isDev = !!document.querySelector('script[src="/@vite/client"]') ||
                    /(localhost|replit\.dev|replit\.app|repl\.co)/.test(window.location.host) ||
                    window.location.port === '5000';
        if (isDev) return;
        var REBOOT_KEY = 'axal:boot-reboot';
        function rebootOnce() {
          // Storage-free loop guard: if we already rebooted (the URL carries
          // ?__reboot), never reboot again — even when sessionStorage is blocked
          // and the entry chunk is permanently missing. Prevents an infinite
          // reload loop; the page fails as a clean 404/blank instead.
          try {
            if (/[?&]__reboot=/.test(window.location.search)) return;
          } catch (e) { /* location unreadable — fall through to storage guard */ }
          try {
            if (sessionStorage.getItem(REBOOT_KEY) === '1') return;
            sessionStorage.setItem(REBOOT_KEY, '1');
          } catch (e) { /* storage blocked — the ?__reboot guard above still bounds us to one reload */ }
          var go = function () {
            try {
              var u = new URL(window.location.href);
              u.searchParams.set('__reboot', String(Date.now()));
              window.location.replace(u.toString());
            } catch (e) { window.location.reload(); }
          };
          var clearCaches = function () {
            if (window.caches && caches.keys) {
              caches.keys()
                .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                .catch(function () {})
                .then(go, go);
            } else { go(); }
          };
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
              .catch(function () {})
              .then(clearCaches, clearCaches);
          } else { clearCaches(); }
        }
        // Fire the instant a hashed entry/vendor module 404s. Capture phase is
        // required to see resource-load errors at the window level.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && typeof t.src === 'string' &&
              /\/assets\/[^"']+\.js(?:$|\?)/.test(t.src)) {
            rebootOnce();
          }
        }, true);
        // Belt-and-suspenders: if the app hasn't signalled boot after 15s (the
        // entry never executed for any reason), recover once.
        window.setTimeout(function () {
          if (!window.__axalBooted) rebootOnce();
        }, 15000);
      } catch (e) { /* the watchdog must never throw */ }
    })();
  </script>

  <!-- Load every webfont WITHOUT blocking first paint. `media="print"` lets
       the browser fetch at low priority; the onload swap flips it to `all`
       once ready. `display=swap` shows the system fallback until then, so the
       hero text paints immediately (helps mobile FCP/LCP).

       All three families ride one request: Inter is the body/UI face, Roboto
       Mono carries every number and label (`font-mono`), Space Grotesk is the
       display face. Inter was previously declared on `body` in index.css but
       never actually loaded, so the whole app silently rendered in system-ui;
       Roboto Mono was loaded by a render-blocking `@import` at the top of
       index.css — the exact thing this block exists to avoid — and shipped
       without weight 400. Weights here are the union the design canvases use;
       adding one means adding it here, not a second request. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
