  <script>
    // Theme init — runs before first paint so the background is always correct.
    // Reads axal_appearance_v1 from localStorage (same key + shape as
    // SettingsContext). Falls back to 'light' (the app default).
    // 'system' was a legacy tri-state value; it collapses to 'light' here too,
    // matching normalizeTheme() in SettingsContext.jsx.
    (function () {
      try {
        var raw = localStorage.getItem('axal_appearance_v1');
        var theme = 'light';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.theme === 'dark') theme = 'dark';
        }
        if (theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage blocked or JSON invalid — stay light */ }
    })();
  </script>
  <script>
    // Dev-only: unregister any stale service worker + clear caches BEFORE any
    // module loads. The SW precaches '/' and serves stale HTML referencing old
    // Vite optimizer dep hashes, causing "Outdated Optimize Dep" 504s after
    // restarts. Runs only in dev (vite serves index.html with /@vite/client).
    (function () {
      try {
        var isDev = !!document.querySelector('script[src="/@vite/client"]') ||
                    /[?&](localhost|replit\.dev|replit\.app|repl\.co)/.test(window.location.host) ||
                    window.location.port === '5000';
        if (!isDev || !('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadSW = regs && regs.length > 0;
          regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              var pending = keys.map(function (k) { return caches.delete(k); });
              Promise.all(pending).then(function () {
                if (hadSW && !window.__swKilled) {
                  window.__swKilled = true;
                  window.location.reload();
                }
              });
            });
          }
        });
      } catch (e) { /* no-op */ }
    })();
  </script>
