# Gitleaks config for AxalNetwork/StudioOS.
# Inherits the upstream default ruleset (covers AWS, GCP, Stripe, JWT,
# private keys, generic high-entropy, etc.) and layers project-specific
# allowlists on top.
#
# Only ALLOWLIST things that are demonstrably non-secret:
#   - example values in .env.example / .env.sample
#   - test fixtures with obviously synthetic IDs
#   - documentation that names a secret variable but does not contain its value
#
# NEVER allowlist:
#   - real API keys, even revoked ones
#   - production-shaped UUIDs that could be valid resource IDs
#   - JWT_SECRET / database URL contents

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for known false positives"
paths = [
  '''(?i).*\.env\.example$''',
  '''(?i).*\.env\.sample$''',
  '''(?i)attached_assets/.*''',         # Vendor PDFs / static design specs
  '''(?i)docs/.*''',                    # Built frontend bundle (already public)
  '''(?i)package-lock\.json$''',
  '''(?i).*\.lock$''',
  # Wrangler build cache — output of `wrangler dev`, contains bundled
  # third-party JS that often trips heuristic regex (e.g. `Symbol2.keyFor`).
  # This directory should ideally be gitignored entirely.
  '''(?i)cloudflare-worker/\.wrangler/.*''',
  # Test fixtures use `obligation_key`, `entity_key`, etc. as object keys
  # for the trust/scoring contract; values are non-secret enum strings
  # (e.g. 'kyc_v1', 'doc_signed_v2'). Whole file allowlisted.
  '''(?i)frontend/test/trust_score\.test\.mjs$''',
]
regexes = [
  # Tailwind / Vite generated content hashes that look like secrets but aren't.
  '''[a-f0-9]{8}\.(js|css|woff2?)''',
  # Known synthetic test JWTs (signed with the literal "test" key).
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''',
  # Bundler-emitted Symbol.keyFor reference — false positive on generic-api-key.
  '''(?i)Symbol2?\.keyFor''',
  # Application-level identifier names that gitleaks' generic-api-key
  # regex flags as `<word>_key = "..."` patterns. None of these are
  # secrets — they are DB column names, JS variable names, or contract
  # field labels:
  #   - obligation_key  → `legal_obligations.obligation_key` D1 column
  #   - REPROMPT_KEY    → localStorage key constant in MarketIntelPage
  #   - fileKey         → R2 object key local variable in admin_contracts
  #   - file_key        → contracts/documents.file_key D1 column
  #   - entity_key      → cap-table entity identifier
  '''\b(obligation_key|REPROMPT_KEY|fileKey|file_key|entity_key)\b''',
  # Snake-case versioned enum values used throughout the trust-score and
  # contract-template subsystems (`investor_nda_v1`, `mentor_disclaimer_v1`,
  # `kyc_v1`, `investor_signals_reprompt_dismissed_v1`, …). The `_vN`
  # suffix is the project-wide enum-version convention and is NOT used
  # for any real credential. NB: real secrets are random hex/base64 with
  # high entropy and never end in `_v\d+`.
  '''\b[a-z][a-z0-9_]*_v\d+\b''',
  # Literal property assignment from a row reference — `ref.row.<col>` is
  # a TypeScript object-property access, not a value. Gitleaks' generic
  # heuristic treats the right-hand side of `let foo = ref.row.bar` as a
  # candidate secret because of the `=` boundary; this regex pins it as
  # code, not a secret value.
  '''ref\.row\.\w+''',
  # Public sanctions/OFAC data-feed URL with a literal `?token=` query
  # param. The "token" is the EU's published export-version marker
  # (base64 of "token-2017"), not a credential — we pin both the literal
  # value and the URL so the rule doesn't re-trigger on URL edits.
  '''dG9rZW4tMjAxNw''',
  '''webgate\.ec\.europa\.eu/fsd/fsf/public/files/jsonFullSanctionsList[^'"\s]+''',
]
# Historical leak commits already exposed in public git history. Listed here
# so CI doesn't fail forever on findings nobody can change without rewriting
